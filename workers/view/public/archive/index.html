<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON archive</title>
<link rel="stylesheet" href="/shell/shell.css">
<!-- /archive/, 2026-10-12. Asked: "make "/arhive" page and move csound and
     tutotial slide there". Not a manifest demo: workers/view/build.mjs copies
     demo/archive/ to /archive/ with archiveFiles(), the way conceptFiles()
     copies /concepts/, and also deploys the markdown notes listed below at
     their repository paths, served as plain text. The dev server finds both by
     itself: /archive/ is not a directory at the repo root, so it falls through
     to demo/archive/, and /archive/<x>.md is the repo's own file. -->
<style>
  /* The concepts index's cards (demo/concepts/index.html), same size. */
  .ar-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 12px; }
  .ar-card {
    display: flex; flex-direction: column; gap: 6px;
    min-height: 110px;
    padding: var(--inset, 12px);
    background: var(--card);
    border: var(--edge, 1px solid var(--line));
    border-radius: var(--r, 4px);
    color: inherit; text-decoration: none;
  }
  .ar-card:hover { border-color: var(--fg); }
  .ar-t { margin: 0; font-size: 15px; }
  .ar-t .ar-n { font: 400 12px var(--mono); color: var(--dim); margin-right: 10px; }
  .ar-s { margin: 0; color: var(--dim); font-size: 13.5px; }
  .ar-u { margin-top: auto; font: 400 12px var(--mono); color: var(--dim2); }
</style>
<script type="module">
  import { mount, el } from '/shell/shell.mjs';

  const d = mount({
    name: 'archive',
    what: 'Pages that left the concepts index, and notes on the ones that are gone.',
    readout: null, index: '/concepts/', indexLabel: 'concepts',
  });

  // Still deployed, off /concepts/ and off the front page.
  const RETIRED = [
    { kind: 'demo', title: 'Csound', href: '/csound/', say: 'Csound scores as timelines you can start anywhere.' },
    // Asked 2026-10-12: *"move to archive https://positron.studio/concepts/clock/040/. add short summary what you said on it"*.
    // Asked 2026-10-12: *"arvhice http://127.0.0.1:8890/concepts/clock/060/ http://127.0.0.1:8890/concepts/clock/070/"*.
    // Asked 2026-10-12: *"arhice https://positron.studio/concepts/video/040/"*.
    { kind: 'video 040', title: 'TV', href: '/archive/tv/', say: 'ETV and ETV2 live on one crossfader, each channel beside a plain and a dithered blend.' },
    // Asked 2026-10-12: *"archive https://positron.studio/concepts/device/000/"*.
    { kind: 'device 000', title: 'Pico router', href: '/archive/pico-router/', say: 'A synth played through an emulated Raspberry Pi Pico whose screen shows each note.' },
    // Asked 2026-10-12: *"still too many clock demos, i can not distinguish"*, *"move less relevant to archive"*.
    { kind: 'clock 040', title: 'MIDI clock', href: '/archive/clock-midi/', say: 'The same beat sent as 24 ticks a beat or as one anchor, and how far each lands from the beat.' },
    { kind: 'clock 050', title: 'Clock drift', href: '/archive/clock-drift/', say: 'Two clocks a few parts per million apart drift off the beat until they agree the time again.' },
    { kind: 'draw 000', title: 'XY filter', href: '/archive/draw-xy/', say: 'Drag the pad over a held note. Left to right opens the filter, bottom to top raises its resonance.' },
    { kind: 'clock 030', title: 'Shared clock', href: '/archive/clock-shared/', say: 'Two places in this tab, one clock set wrong on purpose, agree the time once and then share one beat.' },
    { kind: 'clock 060', title: 'Play together', href: '/archive/clock-play-together/', say: 'A link carrying the shared clock lands one note in two places together, but both places are in one tab with a simulated second clock.' },
    { kind: 'clock 070', title: 'Replay', href: '/archive/clock-replay/', say: 'Keys and a picture recorded, then played back with the recording as the clock.' },
    { kind: 'clock 040', title: 'Follow', href: '/archive/clock-follow/', say: 'A cue waits for its own late picture, but the picture is modelled in the tab, so a real LL-HLS stream would have to replace it.' },
    { kind: 'misc 020', title: 'Tutorial slide', href: '/concepts/misc/020/', say: 'A tutorial step as one 16:9 slide frame holding its words, its build area and its patchbay.' },
    // Asked 2026-10-12: *"archive wire and patchbay"*. Still served, unlisted in the manifest.
    { kind: 'demo', title: 'Wire', href: '/wire/', say: 'A message as the exact bytes it becomes, and notes played into a second tab, each timed on landing.' },
    { kind: 'demo', title: 'Draw', href: '/draw/', say: 'Draw a line and play it back from a recording, to see how much of the gesture playback has to guess.' },
    { kind: 'demo', title: 'Patchbay', href: '/patchbay/', say: 'Write a link between two ports and the patchbay checks it, and says why when one cannot work.' },
    { kind: 'demo', title: 'Time', href: '/time/', say: 'The clock every page here runs on, in five tabs from scheduling to dates two thousand years long.' },
    { kind: 'demo', title: 'Sync', href: '/sync/', say: 'Four ways two places agree when something happens, from on arrival to lined up after on a recording.' },
  ];

  // Asked 2026-10-12: *"arvhice circuit pack evo twelev to their own group"*.
  // The pages for the hardware on the desk, still served and still working
  // with the real device plugged in, unlisted in the manifest.
  const DEVICES = [
    { kind: 'demo', title: 'Circuit', href: '/circuit/', say: 'A Novation Circuit on screen that follows the real one plugged in here, and sends nothing back.' },
    { kind: 'demo', title: 'Evo', href: '/evo/', say: 'An Evolution MK-425C drawn control for control, lighting up as you touch the real one plugged in.' },
    { kind: 'demo', title: 'Twelve', href: '/twelve/', say: 'A TASCAM Model 12 drawn with only its MIDI controls, moving with the real one when it is plugged in.' },
    { kind: 'demo', title: 'Shape', href: '/shape/', say: 'Edit a Novation Circuit\'s sound as it plays, plugged in here or on a Pi in another building.' },
    { kind: 'demo', title: 'Pack', href: '/pack/', say: 'Look inside a Novation Circuit pack or a zip of WAVs you drop in: its patches, sessions and samples.' },
  ];

  // Removed pages, kept as a markdown description in archive/. The files are
  // deployed at the same paths as plain text, and note.html renders one.
  const NOTES = [
    { title: 'Follow', href: '/archive/concepts/clock-040.md', what: 'Concept clock/040, a cue held until its own late picture shows, with the picture modelled.' },
    { title: 'Typist', href: '/archive/typist.md', what: 'The front page text recorder that wrote down edits instead of keys.' },
    { title: 'Sustain', href: '/archive/concepts/sampler-015.md', what: 'Concept sampler/015, a debugger for a real sustain pedal.' },
    { title: 'Announce', href: '/archive/concepts/misc-000.md', what: 'Concept misc/000, every port the studio room could hear.' },
    { title: 'Mirror', href: '/archive/concepts/misc-010.md', what: 'Concept misc/010, the mirror demo as the patchbay sees it.' },
    { title: 'Effects', href: '/archive/concepts/effects.md', what: 'Concept 093, a MIDI octaver and a low pass filter on the patchbay.' },
  ];

  const cardsOf = (rows) => {
    const cards = el('div', 'ar-cards');
    for (const r of rows) {
      const a = el('a', 'ar-card', '', { href: r.href });
      const h = el('h3', 'ar-t');
      h.append(el('span', 'ar-n', r.kind), document.createTextNode(r.title));
      a.append(h, el('p', 'ar-s', r.say), el('span', 'ar-u', r.href));
      cards.append(a);
    }
    return cards;
  };
  d.stack.titled('retired', cardsOf(RETIRED));
  d.stack.titled('devices', cardsOf(DEVICES));

  // Asked 2026-10-12: *"make notes as cards. they do render"*. Each opens
  // as a page, note.html rendering the markdown.
  const noteCards = el('div', 'ar-cards');
  for (const n of NOTES) {
    const a = el('a', 'ar-card', '', { href: `/archive/note.html?f=${n.href}` });
    const h = el('h3', 'ar-t');
    h.append(el('span', 'ar-n', 'note'), document.createTextNode(n.title));
    a.append(h, el('p', 'ar-s', n.what), el('span', 'ar-u', n.href));
    noteCards.append(a);
  }
  d.stack.titled('notes', noteCards);

  d.ready();
</script>
</html>
