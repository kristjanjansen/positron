<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .pad { width: 100%; display: block; border: 1px solid var(--line); border-radius: 4px;
         background: var(--card); touch-action: none; cursor: crosshair; }
  .gut { font: 400 11px/1.5 var(--mono); color: var(--dim2); margin: 6px 0 12px; }
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createSlider } from '/shell/slider.mjs';
  import { holdSample, lerpSample, catmullSample } from '/shell/pointer-adapter.mjs';

  const d = mount({
    name: 'draw',
    what: 'Draw a line with a finger or a mouse and this page keeps two records of it: every sample the browser gave it, and one sample every tenth of a second — which is what a recording of a gesture normally is. The white line is everything that happened; the blue one is what a player would reconstruct from the sparse record. The knob under it is how much a player is allowed to invent between two samples — at nothing the line is a staircase, at everything it is a curve through the same points — and the numbers say how far that sits from what happened, and how much of the blue line no sample attests.',
    // Every cell moves with the drawing. `invented` is the one to read: it is
    // the fraction of the drawn line that no sample attests.
    readout: { kept: '', invented: '%', 'off by': 'px', worst: 'px' },
    // 🔴 NOTHING DRAWS FOR YOU. There was a `Draw one for me` control that
    // synthesised a Lissajous, and it was there because the harness could not
    // draw — `element.click()` fires no pointer events. It is gone, button and
    // mechanism: a page about a gesture that offers you a gesture it made
    // itself is answering its own question, and the line you get is not the
    // line this page is about.
    //
    // The suite reaches it the real way now: `verify.mjs` dispatches actual
    // pointer events across any element marked `data-gesture`, so what the
    // checks below grade is a drag, the same as yours.
    controls: [
      { id: 'clear', label: 'Clear' },
    ],
  });
  guard(d);

  // ── the two records ──────────────────────────────────────────────────────
  // 🔴 TWO APPEND-ONLY LANES, NEVER ONE MUTABLE ARRAY. The 2025 ancestor of
  // this page decimated by emptying its own buffer (`realTimePoints.length =
  // 0`), so the comparison it existed to make had already eaten its own ground
  // truth. `evidence` is every sample and is never touched by the throttle.
  const STORE_MS = 100;
  let evidence = [], stored = [], lastStoreAt = -1e9;

  // ⚠️ STAMP AT SOURCE. `event.timeStamp` is the browser's own clock for when
  // the input happened; `performance.now()` read in the handler is when we got
  // round to it. The lineage re-stamped in the handler and this project has a
  // rule about it — the gap is not a constant anybody could subtract later.
  const stampMs = (ev) => ev.timeStamp;

  function push(at, x, y, pressure) {
    evidence.push({ at, x, y, pressure });
    if (at - lastStoreAt >= STORE_MS) { lastStoreAt = at; stored.push({ at, x, y, pressure }); }
  }

  // ── reconstruction ───────────────────────────────────────────────────────
  // The adapter's own interpolators, which is the whole reason this page did
  // not need writing: `holdSample`, `lerpSample` and `catmullSample` are the
  // measured article (0.036 px mean for the spline against 24.19 for a hold).
  // 🔴 ONE KNOB, NOT THREE BUTTONS. The three reconstructions used to be a
  // radio row, which makes them three unrelated things you pick between; they
  // are three points on ONE axis — how much a player is willing to invent
  // between two samples. At 0 nothing is invented and the line is a staircase;
  // at 1 the line is a spline through the same samples. Dragging it moves
  // `off by` continuously, which is the page's whole subject turned into
  // something you can feel rather than three numbers you compare.
  //
  // The ends are EXACTLY the named methods, so the checks below still grade
  // the three real algorithms rather than a blend of them.
  const HOLD = 0, LINEAR = 0.5, SMOOTH = 1;
  let smooth = SMOOTH;
  const mix = (p, q, k) => ({ ...p, x: p.x + (q.x - p.x) * k, y: p.y + (q.y - p.y) * k });

  /** Where the sparse record says the pen was at time `t`, at smoothing `s`. */
  function at(t, s = smooth) {
    const n = stored.length;
    if (!n) return null;
    if (t <= stored[0].at) return stored[0];
    if (t >= stored[n - 1].at) return stored[n - 1];
    let i = 0;
    while (i < n - 2 && stored[i + 1].at <= t) i++;
    const a = stored[i], b = stored[i + 1];
    const held = holdSample(a);
    if (s <= HOLD) return held;
    const u = (t - a.at) / Math.max(1e-6, b.at - a.at);
    const straight = lerpSample(a, b, u);
    if (s <= LINEAR) return mix(held, straight, s / LINEAR);
    // ⚠️ TIME-KNOTTED, and reflected at the ends. A wall-clock throttle never
    // produces evenly spaced samples, so uniform knots bend the curve toward
    // whichever sample happened to arrive late; and without phantom endpoints
    // the first and last segments have no curve at all.
    const p0 = stored[i - 1] || { ...a, at: a.at - (b.at - a.at) };
    const p3 = stored[i + 2] || { ...b, at: b.at + (b.at - a.at) };
    return mix(straight, catmullSample(p0, a, b, p3, u), (s - LINEAR) / (SMOOTH - LINEAR));
  }

  // ── the picture ──────────────────────────────────────────────────────────
  const W = 960, H = 520;
  // `data-gesture` is how `verify.mjs` knows to DRAG across this element
  // instead of clicking it. A page whose only input is a drag was a page the
  // suite could not exercise at all, which is why this page used to carry a
  // button that drew for you.
  const cv = el('canvas', 'pad', null, { 'data-gesture': 'draw' });
  cv.width = W * 2; cv.height = H * 2;
  cv.style.aspectRatio = `${W} / ${H}`;
  d.el.append(cv);
  const gut = el('div', 'gut', 'draw on it with a finger or a mouse');
  d.el.append(gut);
  const ctx = cv.getContext('2d');

  const css = getComputedStyle(document.documentElement);
  const tok = (n, fb) => (css.getPropertyValue(n) || '').trim() || fb;
  // 🔴 WHAT YOU DREW IS WHITE AND IT IS THE LOUDEST THING HERE. It was the
  // other way round — your line dark underneath, the reconstruction in the
  // page's yellow on top — which put the emphasis on the invented line and
  // made the page look like it was about the reconstruction. It is about the
  // DIFFERENCE, and the thing that actually happened is the one to see first.
  // The reconstruction is blue: a second reading of the same gesture, present
  // and legible without competing. Not `--hi`, which every page uses for the
  // playhead and the primary button, and which at 1.6 px over a dark field is
  // the brightest ink on screen.
  const C = { drawn: tok('--fg', '#e6e6e6'), guess: '#7aa2f7', dim: tok('--dim', '#8b93a1'),
              card: tok('--card', '#11151d') };

  let drawnPoints = 0;
  function paint() {
    ctx.save();
    ctx.scale(2, 2);
    ctx.fillStyle = C.card; ctx.fillRect(0, 0, W, H);

    // The truth, in white and underneath: every sample the browser gave us.
    if (evidence.length > 1) {
      ctx.strokeStyle = C.drawn; ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(evidence[0].x, evidence[0].y);
      for (const p of evidence) ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }

    // What a player reconstructs from the sparse record, sampled at the rate a
    // screen actually draws — which is why most of it is invented.
    drawnPoints = 0;
    if (stored.length > 1) {
      const t0 = stored[0].at, t1 = stored[stored.length - 1].at;
      const step = Math.max(2, (t1 - t0) / 900);
      ctx.strokeStyle = C.guess; ctx.lineWidth = 1.6; ctx.beginPath();
      let first = true;
      for (let t = t0; t <= t1; t += step) {
        const s = at(t); if (!s) continue;
        drawnPoints++;
        if (first) { ctx.moveTo(s.x, s.y); first = false; } else ctx.lineTo(s.x, s.y);
      }
      ctx.stroke();
      // The samples that are actually attested, so "kept" is a thing you can
      // count on screen rather than only in a cell. They belong to the sparse
      // record, so they are the record's colour — a third hue here would say
      // they were a third kind of thing.
      ctx.fillStyle = C.guess;
      for (const p of stored) { ctx.beginPath(); ctx.arc(p.x, p.y, 2.4, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.restore();
  }

  /** How far the reconstruction sits from what actually happened. Measured
   *  against EVERY evidence sample, not against a subsample of itself. */
  function error(sm = smooth) {
    if (evidence.length < 2 || stored.length < 2) return null;
    let sum = 0, worst = 0, n = 0;
    for (const e of evidence) {
      const s = at(e.at, sm); if (!s) continue;
      const dx = s.x - e.x, dy = s.y - e.y;
      const dist = Math.hypot(dx, dy);
      sum += dist; if (dist > worst) worst = dist; n++;
    }
    return n ? { mean: sum / n, worst, n } : null;
  }

  function render() {
    paint();
    const err = error();
    // no `0` before there is anything to count — an untouched canvas has not
    // measured zero samples, it has not measured
    d.set('kept', stored.length || '');
    d.set('invented', drawnPoints ? (100 * (1 - stored.length / drawnPoints)).toFixed(1) : '');
    d.set('off by', err ? err.mean.toFixed(3) : '', err && err.mean < 1 ? 'ok' : err ? 'warn' : '');
    d.set('worst', err ? err.worst.toFixed(2) : '');
    const how = smooth <= HOLD ? 'held at the last sample'
      : smooth >= SMOOTH ? 'smoothed through them'
        : smooth === LINEAR ? 'joined by straight lines'
          : smooth < LINEAR ? 'between held and straight' : 'between straight and smoothed';
    gut.textContent = stored.length
      ? `${stored.length} samples kept of ${evidence.length} · ${drawnPoints} points drawn from them, ${how}`
      : 'draw on it with a finger or a mouse';
  }

  // ── drawing with a finger ────────────────────────────────────────────────
  let drawing = false;
  const spot = (ev) => {
    const r = cv.getBoundingClientRect();
    return { x: (ev.clientX - r.left) * (W / r.width), y: (ev.clientY - r.top) * (H / r.height) };
  };
  cv.addEventListener('pointerdown', (ev) => {
    reset(); drawing = true;
    // A synthetic pointer (the harness dispatches real pointer events through
    // CDP) can refuse capture; losing capture costs nothing here, because the
    // canvas is the only thing being drawn on.
    try { cv.setPointerCapture(ev.pointerId); } catch { /* not capturable */ }
    const p = spot(ev); push(stampMs(ev), p.x, p.y, ev.pressure || 0.5); render();
  });
  cv.addEventListener('pointermove', (ev) => {
    if (!drawing) return;
    // ⚠️ COALESCED. A browser hands one `pointermove` per frame and hides the
    // samples between; `getCoalescedEvents` is the difference between a record
    // of the input and a record of the repaint.
    const evs = ev.getCoalescedEvents ? ev.getCoalescedEvents() : [ev];
    for (const e of evs) { const p = spot(e); push(stampMs(e), p.x, p.y, e.pressure || 0.5); }
    render();
  });
  for (const t of ['pointerup', 'pointercancel']) {
    cv.addEventListener(t, () => { drawing = false; render(); check(); });
  }

  function reset() { evidence = []; stored = []; lastStoreAt = -1e9; }

  // UNDER the canvas, because it changes the picture above it and a control
  // that sits below what it moves is read in the order it is used.
  const pick = createSlider({
    label: 'smoothing', min: 0, max: 100, step: 1, value: 100, unit: '%',
    onInput: (v) => { smooth = v / 100; render(); },
  });
  const row = el('div', 'pos-controls');
  row.append(pick.el);
  d.el.insertBefore(row, gut);

  d.on('clear', () => { reset(); render(); });

  // ── the page checks itself, once, on the first line you finish ───────────
  // Not on every `pointerup`: `d.assert` appends, so checking on each one would
  // grow the count without end and make "diff the per-demo assert count" —
  // this project's cheapest regression test — meaningless.
  //
  // ⚠️ AND NOT ON A THRESHOLD OF LINE QUALITY. What is graded below is a real
  // gesture, so it can be slow, fast, short or scribbled; every check here is
  // about the RELATIONSHIP between the two records, which holds for any line.
  let checked = false;
  function check() {
    if (checked || evidence.length < 40 || stored.length < 4) return;
    checked = true;

    // RELATIVE, because the gesture is now a real one and its length is
    // whoever drew it. What has to hold for ANY line is that the sparse record
    // is genuinely sparser than what happened.
    d.assert('a gesture was recorded twice, in full and sparsely',
      stored.length >= 4 && stored.length < evidence.length / 2,
      `${evidence.length} samples in, ${stored.length} kept — ${(evidence.length / stored.length).toFixed(1)}:1`);

    // 🔴 THE ONE THIS PAGE EXISTS FOR. Most of the line you see was never
    // recorded — say how much, in the same breath as how wrong it is.
    const invented = 100 * (1 - stored.length / drawnPoints);
    d.assert('most of the drawn line was never recorded', invented > 80,
      `${drawnPoints} points drawn from ${stored.length} samples — ${invented.toFixed(1)}% invented`);

    // ⚠️ ASSERT THE ORDER, NOT A THRESHOLD. The three reconstructions are the
    // subject, and a threshold on any one of them says nothing about whether
    // interpolating helped. Holding must be worse than joining, and joining
    // worse than smoothing, on the same recording.
    const errs = { hold: error(HOLD).mean, linear: error(LINEAR).mean, catmull: error(SMOOTH).mean };
    d.assert('smoothing beats straight lines, and straight lines beat holding',
      errs.catmull < errs.linear && errs.linear < errs.hold,
      `hold ${errs.hold.toFixed(2)} px · linear ${errs.linear.toFixed(3)} px · smoothed ${errs.catmull.toFixed(3)} px`);

    // ⚠️ A RATIO, NOT A DISTANCE. `< 1 px` was calibrated against a smooth
    // synthetic curve; a person scribbles, and a fast corner is several pixels
    // wrong however well you interpolate. What is true of every gesture is that
    // smoothing is worth a lot MORE than holding, and how much is the number.
    d.assert('smoothing is many times closer than holding the last sample',
      errs.hold / errs.catmull > 5,
      `${(errs.hold / errs.catmull).toFixed(0)}x closer — ${errs.catmull.toFixed(3)} px against ${errs.hold.toFixed(2)} px`);

    // ⚠️ NOTHING IN THE SUITE LOOKS AT INK, so this page has to. A right answer
    // in a cell over a blank canvas is the defect this project has hit twice.
    const lit = (() => {
      const px = ctx.getImageData(0, 0, cv.width, cv.height).data;
      let n = 0;
      for (let i = 0; i < px.length; i += 4) if (px[i] > 60 || px[i + 1] > 60) n++;
      return n;
    })();
    d.assert('there is a line on the canvas, not just numbers in cells', lit > 4000,
      `${lit} lit pixels`);
  }

  render();
  d.ready();
</script>
</html>
