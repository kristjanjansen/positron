<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* 🔴 THIS BLOCK SHRANK ON 2026-09-16 WITH THE INSTRUMENT ROW. What went with
     it: the breathing `[data-busy]` state and its keyframes (a JACK instrument
     took ten to forty seconds to come up and a button that just sat there read
     as a dead click), the `:disabled` look the lock wore, the die, and `.patch`,
     whose line was removed earlier. All of them styled controls this page no
     longer has. ⚠️ AND THE BLOCK WAS UNBALANCED: a stray closing brace after
     the `.pick` rule, and a media query that was never closed. CSS forgives
     both silently, which is why it survived. */
  /* ⚠️ THE ROW LAYS OUT GROUPS, NOT BUTTONS, and it has to WIDEN. A flex row of
     fixed-width controls on a phone leaves a column of stragglers down the left
     and empty space beside them. Let the row own the width and share it out. */
  .pick { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin: 0 0 14px;
          width: 100%; }
  /* ⚠️ 18 px, NOT 6. `reverb [off|room|hall] chorus [off|light|wide]` at a 6 px
     gap put the word CHORUS hard against the `hall` button, so the two groups
     read as one row of six options with a stray word in the middle. The gap
     between two groups has to be bigger than the gap inside one, or there are
     no groups. */
  .pick .fx, .pos-controls .fx { display: inline-flex; gap: 18px; align-items: center; margin-left: auto;
                                 flex-wrap: wrap; }
  .fxhost { display: flex; align-items: center; }
  /* ⚠️ FOCUS MUST NOT WEAR THE ARMED COLOUR. The shell's global rule is
     `:focus-visible { outline: 2px solid var(--hi) }`, the same green the
     chosen state uses, so a focused-but-OFF switch was indistinguishable from
     an armed one and read as an effect that was in the sound while the log said
     bypassed. Focus goes grey; green means chosen and nothing else. */
  .pos-controls .fx button:focus:not(:focus-visible),
  .pick button:focus:not(:focus-visible) { outline: none; }
  .pos-controls .fx button:focus-visible,
  .pick button:focus-visible { outline: 2px solid var(--dim2); outline-offset: 2px; }
  /* 🔴 NO `[aria-pressed]` RULE HERE. There was one, and it was the bug: it has
     the same specificity as the kit's `.pos-choice button[aria-pressed="true"]`
     and sits later in the cascade, so EVERY createChoice on this page — reverb
     and chorus included — silently lost the kit's chosen state and wore this
     page's instead. One meaning, one definition, in shell.css. */
  /* ⚠️ THE ROW HAS TO STACK TOO, or the kit's phone rules do nothing visible.
     `createChoice` puts its label on top and takes 100% of ITS OWN BOX at this
     width — but the boxes were still side by side in a flex row, so the groups
     got 172 px, 113 and 120 of a 390 px screen. MEASURED. A component can only
     fill what its container gives it.
     ⚠️ AND BOTH CONTAINERS: reverb and chorus are appended to `.pos-controls`,
     not to `.pick`, so a rule written for `.pick .fx` alone left them narrow
     while the row beside them went full width.
     ⚠️ AND `display` IS PART OF IT. This once set flex-direction, align-items
     and gap and not display, and the computed display came back `block`, so all
     three were inert and the two groups touched at a measured 0 px while the
     stylesheet said 22. A flex property on a non-flex box is not an error, it
     is silence.
     ⚠️ LAST IN THE FILE ON PURPOSE. These have the same specificity as the
     desktop rules above (`.pick .fx` is 0,2,0), so source order is the whole of
     the cascade here. */
  @media (max-width: 560px) {
    .pick { flex-direction: column; align-items: stretch; gap: 22px; }
    .pick .fx, .pos-controls .fx, .fxhost {
      display: flex; margin-left: 0; width: 100%; flex-direction: column;
      align-items: stretch; gap: 22px;
    }
  }
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createKeyboard } from '/shell/keyboard.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { createChoice } from '/shell/choice.mjs';
  import { createMidi } from '/shell/midi.mjs';
  import { createDiagram } from '/shell/diagram.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  /**
   * 🔴 THE SOCKET, THE SOUND AND THE BADGE COME FROM THE KIT NOW, 2026-09-16.
   * This page and `/knobs/` play the same board over the same relay and both
   * hand-rolled the same six things. `demo/shell/board.mjs` is the better of the
   * two halves rather than the average: the WebSocket in here was hand-rolled
   * and could not tell a full room from a dead relay, never checked that a frame
   * was the shape the board says it is, and never worked out which socket in the
   * room WAS the board — all three of which the other page had.
   */
  import { createBoard } from '/shell/board.mjs';

  const q = new URLSearchParams(location.search);
  // `studio-1` is the ADDRESS OF THE RASPBERRY PI, not a rendezvous this page
  // invented, which is why the manifest row says `room: 'fixed'`.
  const ROOM = q.get('room') || 'studio-1';
  const INSTRUMENT = 'yoshimi';

  const d = mount({
    /**
     * 🔴 THE SLUG IS `keys`, RENAMED FROM `box` ON 2026-09-16 ON INSTRUCTION.
     * The deployed `/keys/` is GONE, so a link anybody kept 404s and no redirect
     * has been written. The FILE did not move and that is deliberate: it lives
     * beside the board it plays, `rig/box/push.sh` ships that board, and a row
     * with `built: false` plus a `src:` is the pattern `LAYOUT.md` names for
     * exactly this page. Moving it under `demo/` would invite `built: true`,
     * which would put a shared Raspberry Pi in another building into every run
     * of the suite, dozens of times a day.
     */
    name: 'keys',
    /**
     * 🔴 ONE LINE, BECAUSE THIS PAGE HAS A DIAGRAM AT THE BOTTOM OF IT, AND IT
     * IS `manifest.mjs`'s OWN LINE VERBATIM. A paragraph and a picture of the
     * machinery are two explanations of one thing and the paragraph is the
     * weaker: it describes what a reader can point at an inch below. Verbatim,
     * so arriving from the index does not mean reading one claim twice in two
     * wordings that can drift apart.
     *
     * ⚠️ WHAT THE PARAGRAPH SAID IS REHOMED, NOT DELETED, which is the half of
     * this rule that is easy to skip. The journey and the cushion are boxes and
     * notes in the picture. The keys to press are on the keyboard's own pad,
     * whose octave buttons already read `down one octave (z)` and `up one
     * octave (x)`. Whether a MIDI keyboard was found is a log line, said once,
     * when it is known. Where the reverb is made is the `JACK` box's note.
     * ⚠️ AND THE PARAGRAPH CARRIED THREE EM DASHES, on a page a visitor reads.
     */
    what: 'Play an instrument on a Raspberry Pi in another building, and hear the sound it makes come back.',

    // ⚠️ `frames`, `rate` and `midi` ALL WENT, and two of the three deserve a
    // word. `frames` was an odometer. `midi` sat at `1` forever, which is the
    // rule about a cell that cannot change — it is a capability, said once, in
    // the log, where a sentence fits.
    //
    // 🔴 `rate` IS DIFFERENT, and its GUARD IS KEPT. It earned its place: two
    // audio sources into one socket is what "garbled" sounds like here, and
    // 50/s is one clean source while anything above it is that bug. But the
    // cell read `50.1` on every run of every day, so it taught a reader to skip
    // the row — the guard is a WARNING now, fired when the rate leaves the
    // band, which is the only moment the number was ever worth reading.
    //
    // `delay`, `buffer` and `dropouts` are new. This page carried the cushion
    // as `rack` with NO number on it at all — which is how `rack` sounded wrong
    // for an hour while six measurements said it was fine (LESSONS #52).
    // ⚠️ `delay` AND `round trip` BOTH WENT, and the reason is not that they
    // were wrong. Half a round trip plus the cushion is an honest floor, and
    // the ping does answer — but neither is a number you can DO anything with
    // while playing, and this row is read by somebody pressing keys, not
    // somebody tuning a network. `buffer` and `dropouts` stay because they are
    // the two that say whether what you are hearing is intact.
    //
    // 🔴 `lag` IS BACK, ON INSTRUCTION 2026-09-16: *"i want lag readout"*. The
    // paragraph above is left standing because the argument in it is a real one
    // and this supersedes it rather than proving it wrong: somebody playing a
    // board in another building wants to know how far behind their hands the
    // sound is, whether or not they can act on it.
    //
    // ⚠️ IT IS HALF A ROUND TRIP PLUS THE CUSHION, which is the honest floor
    // this file already named. The note leaves here, crosses the relay and
    // reaches the board (half a round trip), and the sound it makes comes back
    // through a jitter buffer that is deliberately holding `cushionMs` of audio.
    // Quoting the round trip alone would flatter it by the whole cushion, which
    // is the same mistake as quoting a candidate-pair RTT as media latency.
    //
    // 🔴 `lag` IS PRESS TO SOUND, MEASURED ON THE ACTUAL GESTURE, AND THE FIRST
    // TWO ATTEMPTS AT THIS CELL WERE BOTH WRONG. It was a ping round trip, which
    // read as an em dash on any page with no board answering: *"what is lag? its
    // empty. replace?"*. Then it was `frames/s` again. What was actually wanted
    // was said plainly: *"i just need number of my entry and sound coming back"*,
    // *"the diffeence in ms"*.
    //
    // So it is timed from the key press to the first sound that press produced,
    // plus the cushion still in front of it. That is the number a player feels,
    // and it needs no ping and no clock shared with the board: both stamps are
    // taken in this tab, from `performance.now()`, so there is no offset in it.
    //
    // 🔴 `lost` IS `dropped` AND `dropouts` IN ONE CELL, because they were two
    // names for "something went missing" and a reader had to hold both. Wire
    // losses and playout breaks are summed, exactly as `/radio/` already does
    // it, and the log still names which kind when either moves.
    // `bitrate` is what all of this replaced, and it is the one cell that could
    // not move at all: fixed-rate PCM has a fixed bitrate.
    // CLAUDE.md: every readout cell must be able to change, and a cell showing a
    // structural constant reads as a measurement and teaches the reader to skip
    // the row. The stream is fixed-rate PCM, so its bitrate is sample rate times
    // channels times 16 bits and nothing a player does alters it. It is the same
    // defect this row already fixed once, when `rate` read 50.1 every run of
    // every day.
    readout: { buffer: 'ms', lag: 'ms', 'frames/s': '', lost: '' },
    /**
     * 🔴 THE NUMBERS AND THE LOG ARE ONE SURFACE AT THE FOOT OF THIS PAGE.
     * Asked for 2026-09-16: *"plush readout+logs"*, and `/knobs/` and `/kit/`
     * already do it. Split, the four cells sat above the keys and the log sat
     * under them, so the two things that answer "what is this doing" were at
     * opposite ends of the page with the instrument between them: pressing a
     * key and reading `lag` meant looking away from your own hands, and a line
     * about the board arrived a screen below the cell it explains.
     * ⚠️ THE ROW IS UNCHANGED AND STILL EVEN. Joining moves the block, it does
     * not edit it: `buffer`, `lag`, `frames/s` and `lost` are the same four
     * cells in the same order, so no cell was dropped and nothing had to be
     * traded to keep the count even.
     */
    joined: true,
    // NO PAGE CONTROLS. Octave down, octave up and notes off used to be here,
    // which put all three at the TOP of the page, a hand's width above the keys
    // they act on. They are the keyboard's own controls and the keyboard draws
    // them now — see the pad in demo/shell/keyboard.mjs. The row below is not
    // empty: the space and chorus settings are appended into it further down.
    controls: [],
  });
  guard(d);

  // ── the patch row ────────────────────────────────────────────────────────
  // It held the instrument choice as well until 2026-09-16; see the block below
  // where that row used to be built.
  const picks = el('div', 'pick');
  const controls = document.querySelector('.pos-controls');
  if (controls) controls.parentNode.insertBefore(picks, controls);
  else d.el.append(picks);
  const fxWrap = el('span', 'fx');
  // 🔴 A STEPPER IS NOT A WAY TO CHOOSE ONE OF 878. Yoshimi's library on this
  // board is 878 reachable instruments and the
  // old control was `‹ random ›` with the name printed BESIDE it as dead text —
  // so the name had the useful half of a list (you can read where you are) and
  // none of the other half (you can go somewhere). The name is the control now:
  // press it and the platform's own list opens.
  const step = createPicker({
    // 🔴 A LABEL, ASKED FOR 2026-09-16: *"add 'patch' label to patch selector"*.
    // `what` was already 'patch' and only ever reached the button TITLES, so the
    // control named itself to a screen reader and to nobody looking at it.
    label: 'patch',
    what: 'patch',
    prev: () => { idx = (idx - 1 + span()) % span(); chosen = true; showPatch(); sendPatch(); },
    next: () => { idx = (idx + 1) % span(); chosen = true; showPatch(); sendPatch(); },
    random: () => { idx = Math.floor(Math.random() * span()); chosen = true; showPatch(); sendPatch(); },
    onPick: (i) => { idx = pickIndex(i); chosen = true; showPatch(); sendPatch(); },
  });
  fxWrap.append(step.el);
  // ⚠️ ATTACHED HERE, AND THE REASON OUTLIVED THE THING IT WAS ABOUT. The line
  // that put `fxWrap` into the row once lived inside a block that was removed,
  // so `picks.insertBefore(b, fxWrap)` threw — "the node before which the new
  // node is to be inserted is not a child of this node" — at module scope,
  // before anything was drawn. A page with a readout of dashes and one error
  // line, which is what a cut that takes a neighbour's setup line with it looks
  // like. That is exactly the cut being made again here, so it stays attached
  // at the top level where nothing else can carry it away.
  picks.append(fxWrap);
  // A press is what makes the patch line true — see showPatch().

  // 🔴 NO PATCH LINE. Removed on instruction 2026-09-16: *"rm
  // Will_Godfrey_Collection · 657 of 878"*. It printed the bank a patch came
  // from and its position in the library, under a control that already shows
  // the patch's name, so the row said the same thing twice and the half nobody
  // asked for was a filename off another machine's disk and an index into a
  // list of 878.
  // ⚠️ THE ONE THING IT SAID THAT THE CONTROL DOES NOT still gets said: with
  // nothing chosen yet, the board is playing whatever it loaded at startup
  // rather than anything this page picked. That is a state change, so it is a
  // LOG line now, which is where a thing that happened belongs.
  let saidUnchosen = false;

  let rateWarned = false;
  let avail = null, current = null, idx = 0, lastBank = -1;
  let autoStarted = false, saidMissing = false;
  /**
   * Press to sound: when a key went down, and whether we are still waiting for
   * the sound it made.
   *
   * 🔴 IT ONLY ARMS WHEN THE STREAM IS QUIET, and that is what makes it a
   * measurement rather than a guess. The board sends audio continuously, so
   * "the first loud frame after a press" is only that press's sound if nothing
   * was already sounding. Pressing a key over a held chord arms nothing, and
   * the cell keeps the last honest number instead of reporting the next frame
   * of somebody else's note as a two millisecond lag.
   * ⚠️ AND IT GIVES UP. A press that produces no sound (wrong channel, board
   * busy, instrument still loading) must not leave a stamp lying about for the
   * next unrelated note to land on.
   */
  let pressAt = 0, quietFrames = 0;
  const LAG_ARM_QUIET = 8;      // ~160 ms of silence before a press can be timed
  const LAG_GIVE_UP_MS = 2000;
  const LAG_ON = 0.02;          // peak that counts as the note having started

  // ⚠️ THE ENVELOPE IS THE KIT'S. `wire.mjs` writes `from`, `at` and `seq` AFTER
  // the message is spread and THROWS when a payload field would be overwritten
  // by one — a bug this project has paid for once, when a start offset called
  // `at` became a timestamp and the board seeked to second 1,789,103,743,118.
  // The hand-rolled line that used to sit here had no such guard.
  const send = (m) => board.send(m);

  // ── patch names ──────────────────────────────────────────────────────────
  // 🔴 THE BOARD ENUMERATES, THIS PAGE RENDERS. Yoshimi's library on this board
  // is 911 instruments in 24 banks; the banks are numbered 5, 10, 15 … 120
  // rather than 0, 1, 2, and the slots inside them are sparse — the Rhodes bank
  // holds 26 patches spread across slots 1…68. Walking 0…127 lands on an empty
  // slot most of the time, and Yoshimi's answer to an empty slot is to carry on
  // playing what it had. So the BOX enumerates, because it is the only end that
  // can see the files, and this page steps through the list it is sent:
  // `voices.list` -> `voices.listed`, and then one entry per press.
  //
  // ⚠️ THERE USED TO BE A SECOND KIND, AND IT LEFT WITH THE INSTRUMENTS THAT
  // NEEDED IT. hexter and the sampled instrument carried FIXED TABLES — 128 DX7
  // voices in one flat cartridge, 128 General MIDI programs — which are the same
  // on every board, so the names lived in this file. Both tables are in
  // `archive/box-fluidsynth-hexter/page-half.js`.
  //
  // The box's own list. Empty means it has not arrived yet, which is every
  // moment before the board answers and is not the same as "there is none".
  let patches = [], banksInList = 0, chosen = false;
  const listed = () => patches.length > 0;

  const bankOf = (i) => (i >> 7) & 63, progOf = (i) => i & 127;
  // ⚠️ 128 IS THE WAITING NUMBER, not a claim about the instrument. Before the
  // list lands there is nothing to walk but program numbers, and one bank of
  // them is the widest honest guess. The instant `voices.listed` arrives the
  // real length takes over.
  const span = () => (listed() ? patches.length : 128);
  const patchName = (i) => (listed() ? patches[i]?.name ?? '—' : `program ${progOf(i)}`);
  /** Dropdown index -> patch index. They coincide: a listed instrument is
   *  walked by list position, and before the list lands it is walked by program
   *  within bank 0, which is the same number. */
  const pickIndex = (i) => i;

  /** The list the dropdown offers: the board's own enumeration once it has
   *  arrived, and bare program numbers until then. ⚠️ The ARROWS can still walk
   *  past the end of this — `show()` leaves the select alone when the index is
   *  outside it, rather than pointing at the wrong row. */
  function refreshPicker() {
    const names = listed() ? patches.map((e) => e.name ?? '—')
                           : Array.from({ length: 128 }, (_, i) => patchName(i));
    step.options(names, Math.min(idx, names.length - 1));
    step.show(patchName(idx), idx);
  }

  function showPatch() {
    // The NAME lives in the control now, not in a line under it — it was in
    // both, which is the same word twice with nothing to say which is live.
    step.show(patchName(idx), idx);
    if (!chosen && !saidUnchosen && span() > 1) {
      saidUnchosen = true;
      d.log(`${span()} patches on the board. It is playing whatever it loaded at startup, `
        + 'not one this page chose');
    }
  }
  // ⚠️ BANK SELECT IS CC 32 HERE, NOT CC 0. Read from Yoshimi's own config:
  //     MIDI Root CC 0        MIDI Bank CC 32        MIDI Program Change on
  // Sending banks on CC 0 was moving its ROOT DIRECTORY instead, pointing it at
  // roots that do not exist — so every program change after that landed
  // nowhere and patch changing looked broken. CC 0 is left alone entirely.
  //
  // For a listed instrument the bank rides ALONG WITH the program in one
  // message, and the box puts both on the same MIDI byte stream back to back —
  // which is a stronger guarantee than the 120 ms this page used to leave
  // between two separate messages.
  function sendPatch() {
    if (listed()) {
      const e = patches[idx];
      if (!e) return;
      lastBank = e.bank;
      send({ type: 'voice.select', channel: 0, bank: e.bank, program: e.program, name: e.name });
      return;
    }
    const b = bankOf(idx), changed = b !== lastBank;
    if (changed) { send({ type: 'cc', channel: 0, ctrl: 32, value: b }); lastBank = b; }
    setTimeout(() => send({ type: 'voice.select', channel: 0, program: progOf(idx) }), changed ? 120 : 0);
  }

  // ── the board ────────────────────────────────────────────────────────────
  //
  // 🔴 EVERYTHING BETWEEN THIS PAGE AND THE RASPBERRY PI IS `board.mjs`. The
  // socket, the reconnect, the presence, the 12-byte frame header, the
  // conversion to float, the `pcm-playout` worklet, the cushion, its counters
  // and the check that a frame is the shape the board says it is. What is left
  // here is what this page is about: which verbs it sends, what it does with a
  // frame after the playout has it, and what its log calls things.
  //
  // ⚠️ THE CUSHION IS 100 ms HERE AND 160 ON `/knobs/`, AND THAT IS DELIBERATE
  // rather than drift. This page reports `lag` — press to sound — and every
  // millisecond of cushion is a millisecond of it. `/knobs/` holds one note and
  // sweeps a filter over it, where a click is the thing a listener cannot
  // ignore and 60 ms more delay is not. Two pages, two trades, one component.
  const board = createBoard({
    room: ROOM,
    relay: q.get('relay') || undefined,
    of: 'Raspberry Pi',
    cushionMs: 100,
    maxCushionMs: 250,
    log: (line, kind) => d.log(line, kind),
    onOpen: () => {
      d.log(`joined ${ROOM}`, 'hi');
      // 🔴 THIS PAGE ASKS THE BOARD FOR NOTHING IT CANNOT CONTROL, AND THAT IS
      // A CHANGE. It used to send one message about an effect it did not draw
      // and had no switch for, to clear one left behind by another page. The
      // BOARD does that for itself now. It drops an effect whose page has
      // stopped talking, so nothing here has to police somebody else's tab.
      // `rig/box/box.mjs` holds that rule and `rig/box/insert-test.mjs` grades
      // it; `rig/box/README.md` says what left this page and why.
      send({ type: 'audio.status' });
    },
    onPcm: (f32, { peak }) => {
      const st = board.stats();
      d.set('buffer', Math.round(st.bufferedMs));
      /**
       * 🔴 PRESS TO SOUND, CLOSED HERE, ON THE FRAME THAT CARRIES THE NOTE.
       * `+ bufferedMs` because this frame has ARRIVED and has not been heard:
       * the playout is deliberately holding that much audio in front of it.
       * Reporting arrival alone would flatter the number by the whole cushion,
       * which is the same mistake as quoting a candidate pair RTT as media
       * latency, and this repo has made that one before.
       */
      if (peak < LAG_ON) quietFrames++;
      else {
        if (pressAt) {
          d.set('lag', Math.round(performance.now() - pressAt + st.bufferedMs));
          pressAt = 0;
        }
        quietFrames = 0;
      }
      if (pressAt && performance.now() - pressAt > LAG_GIVE_UP_MS) pressAt = 0;
      if (st.frames % 10 !== 0) return;
      // ⚠️ ONE CELL FOR BOTH KINDS OF MISSING, and the log is where they are
      // told apart. `lost` is frames the wire never delivered; `breaks` is the
      // playout running dry or being trimmed. A reader wants to know whether
      // what they are hearing is intact, which is one question.
      const gone = st.lost + Math.max(0, st.breaks);
      d.set('lost', gone, gone ? 'bad' : 'ok');
      // 50/s is one clean source. Anything above it is TWO instruments
      // streaming into one socket, which is what a garbled stream sounds like
      // — so this cell is a fault detector, not decoration.
      const fps = st.framesPerSec;
      // The guard without the cell. Two sources interleaved into one socket
      // reads as roughly double the rate, and that is the only thing this
      // number has ever had to say.
      if (Math.abs(fps - 50) >= 6 && !rateWarned) {
        rateWarned = true;
        d.log(`${fps.toFixed(1)} frames a second arriving where one clean source is 50 — `
              + (fps > 56 ? 'that is two instruments streaming at once' : 'frames are going missing'), 'bad');
      }
      /**
       * 🔴 FRAMES A SECOND, AND THIS CELL HAS NOW BEEN REMOVED AND PUT BACK
       * TWICE. It went because it read `50.1` on every run of every day, and a
       * cell that never moves teaches a reader to skip the row. `lag` took its
       * place on 2026-09-16 and lasted about twenty minutes: *"what is lag? its
       * empty. replace?"*, then *"frames/s was ok"*. Both are here now, because
       * `lag` fills the moment somebody presses a key and `frames/s` fills the
       * moment a board is answering, and those are different questions.
       */
      d.set('frames/s', fps.toFixed(1));
    },
    onMessage: (m) => heard(m),
  });

  const pres = board.presence;
  const startAudio = () => board.startAudio();

  /**
   * 🔴 THERE IS NO INSTRUMENT ROW, SINCE 2026-09-16, AND THE ROW IS NOT HIDDEN
   * — THE INSTRUMENTS ARE GONE FROM THE BOARD.
   *
   * It offered `sampled`, `hexter` and `yoshimi`, exactly one armed at a time.
   * The board has ONE jackd, ONE capture and ONE room, so pressing one of those
   * buttons took the sound away from every other listener on every other page,
   * mid note. It happened: `/knobs/` was found refusing to start because
   * somebody had pressed `sampled` here, and that page cannot work at all
   * without yoshimi's filter.
   *
   * ⚠️ THIS IS NOT THE `caps.mjs` CASE, WHICH IS WHY THE CONTROL LEFT RATHER
   * THAN BEING DISABLED. That rule is about a control for a feature that EXISTS
   * and this browser cannot reach, where vanishing would say the feature does
   * not exist. Here the feature genuinely does not exist any more: FluidSynth
   * and hexter are out of `rig/box/jacksynth.mjs`, out of `rig/audit.mjs`, and
   * a board asked for either answers `unknown source`. A disabled button for
   * something that is not there is furniture.
   * ⚠️ AND A CHOICE OF ONE IS NOT A CHOICE. What is left is the instrument, and
   * the page says so in its own paragraph and in the picture at the bottom.
   * `archive/box-fluidsynth-hexter/page-half.js` has the row.
   * ⚠️ `INSTRUMENT` IS DECLARED AT THE TOP OF THIS MODULE, beside the room,
   * because that is where the facts about what this page is pointed at live.
   */

  // ── the keyboard, from the shell ─────────────────────────────────────────
  // ── the space the note falls into ───────────────────────────────────────
  // 🔴 AN INSERT THAT PASSES THE DRY SIGNAL, AND THE DIFFERENCE IS NOTE-OFF.
  // The one that used to sit here REPLACED the signal, so releasing a key
  // swapped one drone for another and every instrument's envelope, attack and
  // patch character were washed out before you heard them. That is why the
  // patch arrows and the die both stopped doing anything audible. A reverb adds
  // a tail, so the note still stops when you let go. `rig/box/README.md` has
  // the rest of that story.
  //
  // ⚠️ THIS IS A CSOUND INSERT ON THE JACK GRAPH, `positron-space`, and it is
  // the one stage between the instrument and the capture that this page can
  // actually reach. It is deliberately not drawn: it would be a fifth box in a
  // container drawn to hold four, and nobody asked for it.
  //
  // ⚠️ THE BOARD RENDERS, THE PAGE SENDS NUMBERS — the same split `mirror` uses
  // for its shader knobs. Nothing is processed in this page: it plays what
  // arrives and no more.
  // ⚠️ `off`, NOT `dry`. This row said `dry · room · hall` beside a chorus row
  // saying `off · light · wide` — the same idea in two words, one of which you
  // have to already know. And it IS off: `mix: 0` with the chorus off sends
  // `on: false`, so the insert comes out of the graph rather than sitting in it
  // doing nothing. One vocabulary across two adjacent controls.
  const SPACE = [
    ['off',  { mix: 0,    room: 0.2, damp: 6000 }],
    ['room', { mix: 0.26, room: 0.35, damp: 7000 }],
    ['hall', { mix: 0.4,  room: 0.8, damp: 4500 }],
  ];
  const CHORUS = [['off', 0], ['light', 0.35], ['wide', 0.7]];
  // ⚠️ BOTH OFF AT THE START, so the first thing you hear is the INSTRUMENT.
  // This opened on `room` — a little reverb by default, on the argument that
  // dry is a test rather than a sound. That argument is about mixing a record;
  // this page exists to let you hear what a Raspberry Pi three hundred metres
  // away is making, and putting an effect in front of it on arrival means the
  // first patch you press is not the patch. Nothing is in the graph until you
  // put it there.
  let spaceAt = 0, chorusAt = 0;

  // ⚠️ `createChoice`, NOT SIX LOOSE BUTTONS. This row built its own by hand and
  // it showed: no grouping, so three choices read as three unrelated controls;
  // the wrong corner on every button; and a `::after` that appended ' on' or
  // ' off' to each one, inherited from when this was a single toggle — so a
  // three-way row rendered `dry off`, `room on`, `off on`. Which one is chosen
  // is already said by colour and by aria-pressed.
  const spaceRow = el('span', 'fx');

  /** One message, the whole state. Clamped again at the far end. */
  function sendSpace() {
    const [, p] = SPACE[spaceAt];
    send({ type: 'fx.space', on: spaceAt > 0 || chorusAt > 0,
           mix: p.mix, room: p.room, damp: p.damp, chorus: CHORUS[chorusAt][1] });
  }
  const spacePick = createChoice({
    // ⚠️ `reverb`, NOT `space`. "Space" is what it does to your ear and "reverb"
    // is what it is called by everyone who has met one; a visitor who knows the
    // word gets no help from the poetic one, and a visitor who does not is no
    // better off either.
    label: 'reverb', options: SPACE.map(([n]) => [n, n]), at: spaceAt,
    onPick: (_v, name, i) => { spaceAt = i; sendSpace(); d.log(`space ${name}`); },
  });
  const chorusPick = createChoice({
    label: 'chorus', options: CHORUS.map(([n]) => [n, n]), at: chorusAt,
    onPick: (_v, name, i) => { chorusAt = i; sendSpace(); d.log(`chorus ${name}`); },
  });
  spaceRow.append(spacePick.el, chorusPick.el);
  spaceRow.hidden = true;             // shown when an instrument that can be wrapped is up
  // ⚠️ A CLASS, NOT INLINE STYLE. This set `display` and `align-items` on the
  // element, and an inline style beats every stylesheet — including the media
  // query that puts these controls full width on a phone, which is why reverb
  // and chorus stayed 113 px wide on a 390 px screen while the row above them
  // went full width. Measured twice before the cause was the style attribute.
  if (controls) { controls.classList.add('fxhost'); controls.append(spaceRow); }
  else d.el.append(spaceRow);

  /**
   * Stamp a key press, but only where the answer would mean something.
   *
   * 🔴 THE GUARD IS THE MEASUREMENT. Arming over a sounding board would time
   * the next frame of a note somebody else is already holding, and report a
   * handful of milliseconds that no press produced. `quietFrames` is how many
   * frames in a row arrived with nothing in them; below that, this press cannot
   * be told apart from the sound already coming back, so it is not timed at all
   * and the cell keeps the last number that was honest.
   */
  function armLag() {
    if (quietFrames < LAG_ARM_QUIET) return;
    pressAt = performance.now();
    quietFrames = 0;
  }

  const kb = createKeyboard(d.el, {
    base: 60,
    onDown: (note) => { armLag(); kb.lightNote(note, true); startAudio().then(() => send({ type: 'note.on', note, vel: 100, channel: 0 })); },
    onUp: (note) => { kb.lightNote(note, false); send({ type: 'note.off', note, channel: 0 }); },
    // The keyboard releases what IT is holding; the board may be holding notes
    // this page never pressed — one sent over MIDI, or by somebody else in the
    // room — so the button has to reach the board as well.
    onPanic: () => send({ type: 'note.panic' }),
    onOctave: (n) => d.log(`octave: base note ${n} (${['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][n % 12]}${Math.floor(n / 12) - 1})`),
  });

  // A real keyboard, where there is one — the shared component, so the
  // velocity-0 rule and the hot-plug listener live in one place.
  const midi = createMidi({
    onDown: (note, vel) => { armLag(); kb.lightNote(note, true); startAudio().then(() => send({ type: 'note.on', note, vel, channel: 0 })); },
    onUp: (note) => { kb.lightNote(note, false); send({ type: 'note.off', note, channel: 0 }); },
    log: (line, kind) => d.log(line, kind),
    // A capability, said once, in words. It was a cell reading `1` forever.
    onPorts: (n) => d.log(n ? `${n} MIDI input${n > 1 ? 's' : ''} — play it` : 'no MIDI keyboard attached; the drawn keys and the a-to-k row still play', n ? 'hi' : 'info'),
  });

  // ── what the board says ──────────────────────────────────────────────────
  //
  // Every JSON message from the room that is not this page's own echo. The
  // socket, the reconnect and the "which one of these is the board" question
  // are `board.mjs`'s; this is what this page does with an answer.
  function heard(m) {
    // ⚠️ `box.hello` IS STILL READ AND IT IS NOT A CHOICE ANY MORE. The board
    // reports what it can raise, and with one instrument the only thing worth
    // doing with the answer is SAYING SO when the answer is no — which is a
    // different and more useful page than one whose buttons silently do
    // nothing. `sf.list` went with the sampled instrument.
    if (m.type === 'box.hello') {
      avail = m.instruments ?? null;
      if (avail && avail[INSTRUMENT] === false && !saidMissing) {
        saidMissing = true;
        d.log(`the board answered but ${INSTRUMENT} is not installed on it, so nothing here will make a sound`, 'bad');
      }
    }
    // The box's own library. It arrives once per instrument change and is
    // ~34 KB for Yoshimi, well inside the relay's 256 KiB per message.
    if (m.type === 'voices.listed') {
      if (m.source !== current) { /* an answer about an instrument we left */ }
      else if (m.ok && m.banks?.length) {
        patches = [];
        for (const b of m.banks) for (const p of b.patches)
          patches.push({ bank: b.bank, bankName: b.name, program: p.program, name: p.name });
        banksInList = m.bankCount ?? m.banks.length;
        idx = 0; lastBank = -1;
        refreshPicker();
        showPatch();
        d.log(`${m.source}: ${patches.length} patches in ${m.bankCount} banks`, 'hi');
        // The board checked its own bank map against its own files. Saying
        // nothing here would leave a list that is quietly wrong looking
        // exactly like one that is right.
        if (m.stale) d.log('the board\'s bank list disagrees with the files on its disk', 'bad');
      }
      // `fixed` means the instrument simply has no library to read and this
      // page's own table is the right answer — not a failure worth a line.
      else if (m.reason && !m.fixed) d.log(`patches: ${m.reason}`, 'bad');
    }
    // Somebody chose a patch — this page, or another listener in the same
    // room. Following it is what keeps two people looking at one instrument.
    if (m.type === 'voice.selected' && m.ok && listed()) {
      const at = patches.findIndex((p) => p.bank === m.bank && p.program === m.program);
      if (at >= 0) { idx = at; chosen = true; showPatch(); }
    }
    if (m.type === 'audio.started') {
      // Nothing playing on arrival: start the instrument rather than present
      // a page whose keys do nothing and say nothing about why.
      // ⚠️ IT TAKES TEN TO FORTY SECONDS on a cold board, so the page says so
      // rather than looking hung. The presence badge on the transport carries
      // the same fact where somebody is already looking.
      if (!m.ok && m.reason === 'nothing playing' && !autoStarted) {
        autoStarted = true;
        pres.coming();
        d.log(`nothing was playing on the board. Starting ${INSTRUMENT}, which takes ten to forty seconds`, 'hi');
        send({ type: 'audio.start', source: INSTRUMENT });
        return;
      }
      if (m.ok) {
        current = m.source; lastBank = -1;
        pres.coming(false);

        // ⚠️ ASK THE BOX, DO NOT KEEP A LIST. This was a list of instrument
        // names, so every new source meant remembering to add it here — and
        // forgetting meant a control that silently refused to arm on a page
        // that could not say why. Whether an insert can wrap something is a
        // property of the SOURCE, and the box reports it.
        spaceRow.hidden = m.jack === false;
        if (m.jack === false) d.log(`${m.source} writes to a pipe rather than to the audio graph the reverb sits on, so there is no space to put it in`, 'warn');
        else sendSpace();
        // A new instrument means a new library. Drop the old one FIRST, or
        // the arrows keep walking the previous instrument's list until the
        // reply lands — stepping through names that belong to something else.
        patches = []; idx = 0; banksInList = 0; chosen = false;
        // The fixed table belongs to the instrument that just came up, so the
        // dropdown has to be rebuilt even when no list arrives.
        refreshPicker();
        showPatch();
        send({ type: 'voices.list', source: m.source });
        d.log(`playing ${m.source}`, 'hi');
      }
      // ⚠️ NOT `d.set('playing', ...)`. There is no `playing` cell — the shell
      // catches it and logs "readout 'playing' was not declared in mount()",
      // which is what a visitor saw instead of the reason the start failed.
      else d.log(`failed: ${m.reason}`, 'bad');
    }
  }
  // z / x shift the octave too, because a keyboard player's hands are already
  // on the keys and reaching for a 26 px button under them is a lost note. The
  // pad's own buttons and the log line are the keyboard's — see `onOctave`.
  addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
    const k = e.key.toLowerCase();
    if (k === 'z' || k === 'x') kb.shiftOctave(k === 'z' ? -1 : 1);
  });

  /**
   * 🔴 THE PING IS GONE, AND IT WENT BECAUSE NOTHING READ IT. This page sent
   * `box.ping` every four seconds and timed the `box.pong`, into a variable no
   * cell showed and no check asked for — the readout is four even cells and
   * none of them was a round trip. A counter nobody displays is not
   * instrumentation, and this one could never have filled anyway: the board
   * answers `box.pong` with an `at` field, `at` is an ENVELOPE field, so its own
   * formatter refuses the reply and the handler throws. Asked directly, the
   * board answers `box.error: "at" is an envelope field`.
   *
   * ⚠️ WHAT IT WAS FOR IS STILL ANSWERED, BY TWO BETTER THINGS. The presence
   * badge on the bar says whether the Raspberry Pi is speaking, from the
   * board's own five-second heartbeat and from the audio itself. `openWire`
   * asks `/stats` when an upgrade is refused and says whether the room was full
   * or the relay unreachable, which is a question a ping cannot answer at all.
   * `board.ping()` is still there for a page that wants the number.
   */

  /**
   * Reachable from a probe, the way `window.__knobs` is on the other page.
   * `frames` is how much stream has arrived and `peak` is whether any of it was
   * a sound: a page that can only be asked "did frames arrive" cannot tell a
   * held note from silence, and the board captures its graph continuously, so
   * frames arrive at fifty a second whether or not anything is sounding.
   */
  window.__keys = {
    get frames() { return board.stats().frames; },
    get peak() { return board.stats().peak; },
    get present() { return pres.state(); },
    get playing() { return current; },
  };

  // ── the transport ────────────────────────────────────────────────────────
  //
  // 🔴 A BAR WITH NO PLAY BUTTON. Asked for 2026-09-16: *"bring transport bar to
  // keys but no play button, just online badge"*.
  //
  // There is nothing here for a toggle to do. A note sounds while a key is held
  // and stops when it is let go: there is no position to resume from, nothing
  // to seek to, and no end to arrive at. What the bar is here for is the one
  // fact about this source that is not a number and that a visitor most needs —
  // whether the instrument in the other building is answering at all.
  //
  // ⚠️ THE CHIP AND `live` ARE THE SAME SLOT AND THE COMPONENT REFUSES BOTH.
  // A `LIVE` chip says this source has no end, which is true here and is not
  // the fact worth having: a page whose board is unplugged is still, in that
  // sense, live.
  // ⚠️ `everyMs` AND `comingMs` ARE THE BOARD'S OWN NUMBERS and are set inside
  // `board.mjs`: 5 s is what `rig/box/box.mjs` beats at, and 45 s is how long
  // yoshimi takes to come up on a cold board.
  //
  // The deck is a clock nobody reads. Every deck needs a range; nothing on this
  // page shows one, and nothing stops when it ends.
  const deck = createDeck({ items: [], adapters: {}, range: [0, 86400000] });
  const bar = createTransportBar(d.el, deck, {
    chip: pres.el,       // whether the board is answering, in the chip's place
    toggle: false,       // a held note has nothing to start or resume
    scrub: false,        // and no position inside it to seek to
    loop: false,         // there is no passage to hear twice
    endStop: false,      // nor an end to stop at
  });
  // 🔴 THE BAR GOES ABOVE THE KEYS, AND `prepend` IS WHAT DOES IT.
  // `createTransportBar` APPENDS, so without this it lands under the keyboard
  // and the picture: the badge is the first thing to read on arriving, because
  // it decides whether pressing anything will do something at all. `prepend`
  // MOVES a node already in the document rather than copying it.
  //
  // ⚠️ AND THE FIRST ATTEMPT WAS `d.el.insertBefore(bar.el, picks)`, WHICH
  // THREW AND TOOK THE WHOLE PAGE WITH IT: "the node before which the new node
  // is to be inserted is not a child of this node". `picks` is inserted into
  // `.pos-controls`'s parent, which is the BODY, while `d.el` is `.pos-body` —
  // two different parents, and `insertBefore` needs the child's real one. That
  // is the THIRD time this exact error has been thrown on this page, and the
  // comment beside `picks.append(fxWrap)` is about the previous two. The
  // symptom is total: a readout of dashes, one red line, no keyboard and no
  // picture, because the throw happens at module scope.
  d.el.prepend(bar.el);

  showPatch();
  d.ready();

  /**
   * 🔴 HOW IT WORKS, LAST ON THE PAGE. Asked for 2026-09-16: *"add diagram to
   * box demo"*. Three machines, and the one worth seeing is the middle one: a
   * key press and the sound it makes cross the same relay in opposite
   * directions, so nothing here needs a port open on either end.
   */
  const dg = createDiagram(d.el, {
    caption: 'A key press goes out through Cloudflare to a Raspberry Pi in another building, '
      + 'and the sound it makes comes back the same way. Neither end needs an address the '
      + 'other can reach.',
    nodes: [
      // 🔴 `join: false`: THE KEYBOARD DOES NOT FEED THE PLAYOUT, AND NOTHING
      // IS DRAWN BETWEEN THEM. Inner boxes get
      // an arrowhead by default since 2026-09-16, and the first thing that rule
      // did on this page was draw a head from `keyboard` down to `playout`,
      // reported as *"why keyboard controls playout? it should get data from
      // cf"*. Correct: what these two share is a browser, not a signal. One
      // sends, the other receives, and both talk to Cloudflare.
      { id: 'you', label: 'Browser', sub: 'phone or laptop', kind: 'here', tech: 'browser',
        join: false,
        children: [
          { id: 'keys', label: 'keyboard', sub: 'keys or MIDI',
            note: 'The keys on screen, and any USB controller the **Web MIDI** API offers. '
                + 'Both send the same note number, so the board cannot tell them apart.' },
          { id: 'out', label: 'playout', sub: 'AudioWorklet',
            note: 'Holds a cushion of audio before playing any of it, because packets over '
                + 'the open internet do not arrive evenly spaced. The **buffer** cell is how '
                + 'much it is holding right now.' },
        ] },
      /**
       * 🔴 ONE OBJECT, DRAWN AS TWO BOXES, AND THE SUB SAYS SO. Suggested in
       * those words after the first version was unreadable: *"perhaps split cf
       * relay into 2 for clarity"*. With a single `relay` box both directions
       * met in one node, so the outward arrow and the return arrow shared a
       * point and the return had to be drawn looping back under the row, which
       * arrived at `playout` as a stub from nowhere: *"what is this thing on
       * left of playout?"* and *"how sound gets back from pi to browser? no
       * connector on this"*.
       *
       * ⚠️ IT IS NOT TWO RELAYS AND THE PICTURE MUST NOT SAY IT IS. It is one
       * Durable Object on one socket, carrying traffic both ways, and that is
       * in the container's `sub` and in both notes. A drawing may split a thing
       * by ROLE to be read; it may not invent a second machine.
       */
      { id: 'cf', label: 'Cloudflare', sub: 'one object, 2 ways', kind: 'cloud',
        tech: 'cloudflare', join: false,
        children: [
          // 🔴 NAMES, NOT DIRECTIONS. These read `notes out` and `sound back`
          // and were reported as *"not good names"*, correctly: CLAUDE.md says a
          // box label is a NAME, and those two were captions describing which
          // way the traffic goes. What each box IS, is the room carrying one
          // kind of traffic, so the label is the traffic and the sub is the
          // thing: `Relay` is the Durable Object's own class name in
          // `workers/relay`, which is what it is CALLED rather than what it does.
          { id: 'down', label: 'notes', sub: 'Relay object',
            note: 'Copies each key press on to the board. One object per room, addressed by '
                + 'name, so both ends dial out to it and neither needs a port open.' },
          { id: 'up', label: 'audio', sub: 'Relay object',
            note: 'The same object and the same socket as the box above, drawn separately '
                + 'because one box carrying both directions could not be read.' },
        ] },
      /**
       * 🔴 ONE INSTRUMENT, AND THE BOARD IS A CHAIN AGAIN. It held three boxes
       * with `set: true` — a BRACKET, which is what says "these are parts of
       * one machine" rather than "these feed each other" — because exactly one
       * of `FluidR3 GM`, `hexter` and `yoshimi` was up at any moment and an
       * arrowhead between them would have claimed that the first fed the
       * second. Two of the three left the board on 2026-09-16, so there are no
       * alternatives left to bracket and every gap here is a real step.
       * `dg.ties` is 0 now, where it was 2.
       *
       * 🔴 AND `JACK` AND `ffmpeg` ARE TWO BOXES, WHICH IS `/knobs/`'s SHAPE.
       * This was one box called `capture` with `ffmpeg, JACK` underneath it,
       * and that is a sub doing a diagram's job: the fact that the synth is not
       * wired to a loudspeaker but to a sound server, and that something else
       * reads it out of there, was a phrase instead of a thing a reader can
       * point at. Asked for on the other page in those words, *"should it break
       * into 2 boxes (jack / ffmpeg)"*, and it is right on both.
       *
       * ⚠️ `tech: 'raspberry'`, NOT `'board'`. `raspberry` is in `TECH_HUE` and
       * `board` never was, so this box had been taking whatever the rotation
       * handed it — a different colour from the same machine drawn on `/knobs/`.
       *
       * ⚠️ THE NOTE ARROW LANDS ON `yoshimi` AND NOT ON THE MACHINE, and that
       * is what the removal bought. It used to point at the container, because
       * a note goes to whichever instrument is running and the picture could not
       * know which — pointing at one of three would have been a guess drawn as
       * a fact. There is one, so the arrow can say where the note actually goes.
       *
       * ⚠️ THE REVERB IS STILL NOT DRAWN, and now it is a decision rather than
       * a lack of room. `positron-space` is a Csound insert that lives ON the
       * JACK graph, so a box for it beside `JACK` would put a reader in doubt
       * about which side of which the sound passes. It is in the `JACK` note,
       * which is where a fact you cannot see belongs.
       */
      { id: 'pi', label: 'Raspberry Pi', sub: 'another building', kind: 'device', tech: 'raspberry',
        children: [
          { id: 'yoshimi', label: 'yoshimi', sub: 'software synth',
            note: 'The one instrument on this board, carrying 911 patches in 24 banks. The '
                + 'board enumerates them and sends the list, because it is the only end that '
                + 'can see the files.' },
          { id: 'jack', label: 'JACK', sub: 'sound server',
            note: 'Every program on this board that makes or reads sound is a client of one '
                + '**jackd**, wired together by name. The reverb and chorus are a **Csound** '
                + 'insert patched in here, which is why they cost this page nothing.' },
          { id: 'ffmpeg', label: 'ffmpeg', sub: '20ms pieces',
            note: 'Reads the graph as a JACK client and writes raw 16-bit samples at 48 kHz. '
                + 'Many ports into one input sum, so a stereo instrument arrives as one '
                + 'channel rather than as its left side.' },
        ] },
    ],
    // 🔴 ONE WAY ROUND, AND IT IS A RING. Out along the top: keys, notes,
    // yoshimi. Down the board: the sound server, then the capture. Back along
    // the bottom: audio, playout. Every arrow points the way the signal actually
    // travels, and nothing meets in the middle.
    links: [
      { from: 'keys', to: 'down', label: 'note on/off',
        note: 'A few bytes of JSON per key, over a **WebSocket**. Half the round trip of one '
            + 'of these is half of what the **lag** cell reports.' },
      { from: 'down', to: 'yoshimi', label: 'note on/off',
        note: 'The same message, copied on. The board writes it as raw MIDI bytes to a '
            + '**snd-virmidi** device, which **aconnect** has already routed to the synth.' },
      // ⚠️ NO LABELS INSIDE A CONTAINER. The gap two stacked children share is
      // sixteen pixels tall, so a name in it runs under both boxes;
      // `createDiagram` refuses one and reports it. What travels is in the note.
      { from: 'yoshimi', to: 'jack',
        note: 'Two ports, left and right, registered on the graph when the instrument came '
            + 'up. Nothing crosses a network here and nothing is encoded.' },
      { from: 'jack', to: 'ffmpeg',
        note: 'One **jack_connect** per channel into a single input. The sum is what makes '
            + 'the mono that comes back honest rather than half the instrument.' },
      // ⚠️ NO LABEL ON THE RETURN PATH. It runs back under the row rather than
      // between two boxes, and `createDiagram` reported both of these at a width
      // of -444: there is no room there for a name. What travels is in the note,
      // where there is a sentence's worth of room for it.
      // 🔴 `back: true` ON BOTH RETURN LINKS, AND WITHOUT IT THE PICTURE WAS
      // UNREADABLE. It is an AUTHOR flag, not something the layout works out: a
      // link with no `back` is placed as a forward step, so these two were laid
      // out left to right while pointing right to left, which drew a line
      // straight through `playout` and put its head on the far left of the
      // Browser. Reported as *"what is this thing on left of playout?"* and
      // *"how sound gets back from pi to browser? no connector on this"*.
      // Flagged, they run in a lane under the row and arrive at the bottom edge.
      { from: 'ffmpeg', to: 'up', back: true,
        note: 'Twenty milliseconds of samples at a time, declared with a channel count: a '
            + 'frame cannot be read without one, since the same bytes are a valid mono frame '
            + 'and a valid stereo one.' },
      { from: 'up', to: 'out', back: true,
        note: 'Straight into the cushion. The other half of the **lag** cell is how much '
            + 'audio that cushion holds back before any of it is heard.' },
    ],
  }, { how: true, atEnd: true });
  // 🔴 THE PICTURE SAYS WHAT IT COULD NOT DRAW. `/keys/` is `built: false`, so no
  // harness ever opens it and there is nothing to turn red: a label that had to
  // be shortened or a link that could not be routed would otherwise be invisible
  // to the one person who can fix it. A log line is the only channel this page
  // has, so it uses it, and only when there is something to say.
  if (dg.cuts.length) {
    d.log(`the diagram could not draw ${dg.cuts.length} thing(s): `
      + dg.cuts.map((c) => `${c.where} ${c.id}`).join(' · '), 'warn');
  }
  window.__dg = () => ({ cuts: dg.cuts, ties: dg.ties, mode: dg.mode });
</script>
</html>
