        wave: s.osc1,
        filter: s.filter,
        lfo: s.lfo === 'none' ? '' : s.lfo,
        voice: s.poly,
        hover: `${p.commandName}, ${p.slotName}, category ${p.category}`
             + `${s.categoryLabel ? ` (${s.categoryLabel})` : ''}`
             + `, osc 2 ${s.osc2Silent ? 'silent' : s.osc2}`
             + `, attack ${s.attack} release ${s.release}, ${s.mods} mod slot(s)`
             + `, ${moved} of ${PATCH_DATA} parameters off their default`,
      });
    }
    patchTable.set(rows);

    sessions = stats;
    const near = stats.length > 1 ? nearestEach(stats) : stats.map(() => null);
    stats.forEach((x, i) => { x.nearest = near[i]; });
    sessionTable.set(stats.map((s, i) => ({
      i,
      name: s.name || '(no name)',
      head: s.head,
      // ⚠️ EMPTY, NOT `absent`, WHEN NOTHING LOOKED. `magicOk === null` means the
      // file could not be partitioned at all, and a word there would read as a
      // measurement that came back negative.
      marker: s.magicOk === null ? '' : s.magicOk ? 'DC BB' : 'absent',
      synth1: s.patchNames[0] || '',
      synth2: s.patchNames[1] || '',
      notes: n(s.notes),
      used: s.used === null ? '' : n(s.used),
      notErased: n(s.notErased),
      payload: n(s.payload),
      filled: `${pct(s.nonZero)}%`,
      entropy: s.entropy.toFixed(2),
      nearest: s.nearest === null || s.nearest === Infinity ? '' : n(s.nearest),
      hover: `${s.notes} note event(s)`
           + `${s.magicOk === false ? ', and it carries no Circuit session marker' : ''}`
           + '. Press to open it',
    })));

    samples = wavs;
    /**
     * ⚠️ A SAMPLE THAT WOULD NOT PARSE KEEPS ITS ROW AND SAYS WHY, which is the
     * same rule the patch reader already follows: a reader that silently dropped
     * one leaves a pack looking smaller than it is, and that is a wrong answer
     * wearing an empty one's clothes.
     */
    sampleTable.set(wavs.map((w, i) => {
      const r = w.row;
      if (!r.ok) {
        return { i, name: w.name, len: '', frames: '', rate: '', peak: '', sound: '',
                 hover: `this one did not read: ${r.why}` };
      }
      return {
        i,
        name: w.name,
        len: `${r.seconds.toFixed(2)} s`,
        frames: r.frames.toLocaleString(),
        rate: `${(r.rate / 1000).toFixed(r.rate % 1000 ? 1 : 0)} kHz`,
        peak: r.peak.toFixed(2),
        sound: `${r.sound.toFixed(0)}%`,
        hover: `${r.rate} Hz, ${r.bits} bit, ${r.channels === 1 ? 'mono' : `${r.channels} channels`}`
             + `, ${r.frames.toLocaleString()} frames in ${kb(w.size)}`
             + `, ${r.lead} frame(s) of silence at the front and ${r.trail} at the back`
             + `${r.silent ? ', and it is silent all through' : ''}. Press to hear it`,
      };
    }));

    /* The two facts the removed line carried that no column can. See the note
       over where that line used to be built. */
    const all = summariseAll(wavs.map((w) => w.wave));
    if (all.count) {
      d.log(`${all.parsed} of ${all.count} samples read`
          + (all.refused ? `, ${all.refused} refused` : '')
          + `, ${all.seconds.toFixed(1)} s in total`);
    }

    countTabs({ patches: patches.length, sessions: sessions.length, samples: samples.length });
    sayCounts(stats);
    /**
     * 🔴 NO PICTURE UNTIL A FILE LANDS, ASKED FOR AS *"do not show diargam when
     * no file"*. This reverses the reservation asked for the day before, and
     * the two are genuinely in tension: a picture drawn at rest cannot move
     * later, and a picture drawn at rest is a picture of nothing.
     * 🔴 THE HOST IS UNHIDDEN BEFORE `showPatch` RATHER THAN AFTER, AND THAT
     * ORDER IS LOAD BEARING. `diagram.mjs`'s own header says a `display: none`
     * ancestor is exactly what makes `getComputedTextLength` answer 0, so a
     * render inside a hidden box lays every label out against a ruler reading
     * zero. `hidden` IS `display: none`.
     */
    dgHost.hidden = !patches.length;
    tabs.el.hidden = !(patches.length || stats.length || wavs.length);
    if (patches.length) showPatch(0);
    // ⚠️ AND THE FIRST SESSION OPENS TOO, so the panel under the list is filled
    // whenever anything is, and a press changes its words instead of adding a
    // block and moving everything under it.
    if (sessions.length) showSession(0);
    else {
      // ⚠️ EVERY CELL BACK TO EMPTY RATHER THAN TO 0. Nothing unmeasured prints
      // as a zero here: a `0` in a readout reads as a very confident
      // measurement of nothing, and `setCell` hides the unit with it.
      partsTable.set([]); pickedSession = -1; showRegion(-1);
    }
  }

  /**
   * 🔴 THE VERDICT BLOCK IS GONE, REMOVED 2026-09-21 AT THE OWNER'S WORD:
   * *"rm all 1 sessions differ from each other, and the emptiest is 84.7 per
   * cent filled, so this is somebody's work rather than a pack of blanks etc
   * texts"*. Every branch of it, not one sentence.
   * ✅ **THE EVIDENCE SURVIVES BECAUSE IT WAS NEVER IN THE SENTENCE.** The
   * `nearest` column carries the byte distance on every row and the readout
   * carries it again for the open one, and this page's own comment already said
   * that column is there so a reader never has to take a verdict's word for it.
   * What went is the CONCLUSION, not the measurement.
   * 🔴 **AND IT TOOK THREE ASSERTS AND TWO NEGATIVE CONTROLS WITH IT**, which
   * is a real loss and is written down rather than glossed: the blanks control,
   * the mostly copies middle ground and the `29 of real work` line all graded
   * that function. `positron-verify`'s rule is that a removed thing takes its
   * checks with it SILENTLY, so they are accounted for here.
   * ⚠️ One log line stays, and it is a count with no conclusion in it. The log
   * is where a state change belongs, and `3 sessions sit within 16 bytes of
   * another` is a measurement a reader can check against the column.
   */
  const TEMPLATE_GAP = 16;
  function sayCounts(stats) {
    if (!stats.length) return;
    const distinct = new Set(stats.map((x) => x.fingerprint)).size;
    const copies = stats.filter((x) => x.nearest !== null && x.nearest !== Infinity
      && x.nearest < TEMPLATE_GAP).length;
    d.log(`${stats.length} sessions, ${distinct} distinct`
      + (copies ? `, ${copies} within ${TEMPLATE_GAP} bytes of another` : ''));
  }

  /**
   * 🔴 ON A PRESS, AND NOTHING IS DECODED UNTIL ONE HAPPENS. Sixty four WAVs
   * through `decodeAudioData` on a visit is the load-on-a-visit defect three
   * times over.
   * ⚠️ AND SOUND NEVER GATES THE WORK. `AudioContext.resume()` waits on a
   * gesture in a real browser and does not reject, so awaiting one is a hang
   * rather than an error. It is fired and left.
   */
  /**
   * 🔴 PRESSING A ROW OPENS A SAMPLE AND PLAYS IT, AND THE TWO ARE SEPARATE
   * VERBS. `/reel/` fetched a newsreel and a day's radio on every visit for a
   * first frame nobody had asked to see, and the repair there was exactly this
   * split: `select()` moves and opens nothing, `play()` is the only half that
   * costs anything. Here nothing leaves the machine either way, but the player
   * under the table needs a sample to be OPEN without one being in the air.
   */
  function openSample(i, andPlay) {
    const w = samples[i];
    if (!w) return;
    picked2 = i;
    sampleTable.mark((r) => r.i === i);
    const r = w.row;
    /**
     * 🔴 THE SENTENCE THAT USED TO BE WRITTEN HERE IS GONE AND ITS FACTS ARE
     * COLUMNS. Asked 2026-09-21, quoting it: *"`slot 55, 0.25 s, 12,143 frames
     * at 48000 Hz, peak 0.86` - this goes to the table, rm from here"*. The
     * marked row above carries all five, and the one that could not be a column
     * is the refusal, which is the row's own hover and its blank cells.
     */
    playBtn.disabled = !r.ok;
    /* The bar's clock and slider need a length before they mean anything, and a
       slot that did not read has none. */
    deck.pause();
    deck.setRange([0, r.ok && r.seconds > 0 ? Math.round(r.seconds * 1000) : 1]);
    deck.seek(0);

    // ⚠️ THE PICTURE IS DRAWN FROM THE SAME FLOATS THE SOUND IS MADE OF, out of
    // `toMono`, so what is on screen and what comes out of the speaker cannot
    // be two readings of one file that disagree.
    const mono = r.ok ? toMono(w.wave) : { ok: false };
    if (mono.ok) {
      waveHost.hidden = false;
      wave.buffer(peaksOf(mono.samples));
      /* 🔴 `wave.source(w.name)` STOOD HERE AND CAME OFF 2026-09-22: *"rm
         sample name from corner of the canvas"*. The name is drawn INSIDE the
         canvas by `grain-scope.mjs`, and it was saying a third time what the
         marked row and the row's own `name` column already say an inch above
         it.
         ⚠️ THE COMPONENT IS UNTOUCHED, WHICH IS THE POINT. `/radio/`,
         `/tapes/` and `/grains/` all draw with the same module and all three
         pass a name that is worth having: on a live station the corner is the
         only thing that says what the picture IS. A component option would have
         been a change reaching three pages to remove one line from a fourth.
         Not calling the setter is the whole fix. */
      wave.playhead(0);
    } else { wave.clear(); waveHost.hidden = true; }

    if (andPlay && r.ok) playSample(i);
  }

  /**
   * 🔴 THE AUDIO COMES OUT OF `circuit-sample.mjs` AND NOT OUT OF
   * `decodeAudioData`, WHICH IS THE HALF OF *"make/use sample decoder"* THAT IS
   * NOT THE TABLE. The browser's decoder is a promise, it accepts what it feels
   * like accepting, and it can say nothing about a file it refuses beyond an
   * `EncodingError`. `toMono` answers in words, and because it is SYNCHRONOUS
   * the page's own check can grade a press rather than racing a decode.
   * ⚠️ AND SOUND NEVER GATES THE WORK. `AudioContext.resume()` waits on a
   * gesture in a real browser and does not reject, so awaiting one is a hang
   * rather than an error. It is fired and left.
   */
  /**
   * @param {number} i      which slot
   * @param {number} [from] seconds into the sample to start at, which is what a
   *   press on the transport's slider means. A buffer source has no seek, so
   *   the only honest answer to one is a new voice started at an offset.
   */
  function playSample(i, from = 0) {
    const w = samples[i];
    if (!w) return;
    const mono = toMono(w.wave);
    if (!mono.ok) { d.log(`${w.name} did not decode: ${mono.why}`, 'bad'); return; }
    // 🔴 AN EMPTY SLOT IS A ROW AND `createBuffer(1, 0, rate)` THROWS. Every
    // sample in a `.circuitpack` is sound, so this could not arise until a bulk
    // transfer opened: `Roland Classics.syx` is 48 filled slots and 16 empty,
    // and an empty one has to read as empty rather than as `no sound here`
    // about a DOMException.
    if (mono.frames === 0) { d.log(`${w.name} is an empty slot`); return; }
    try {
      stopSample();
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      ac.resume();
      const buf = ac.createBuffer(1, mono.frames, mono.rate);
      buf.copyToChannel(mono.samples, 0);
      const src = ac.createBufferSource();
      src.buffer = buf;
      src.loop = looping;
      src.connect(ac.destination);
      // ⚠️ THE HANDLE IS KEPT SO THE LOOP TOGGLE CAN REACH A SOUND THAT IS
      // ALREADY RUNNING. A toggle that only took effect on the NEXT press is a
      // control that looks live and does nothing for as long as you are
      // listening, which is this project's named hazard.
      src.onended = () => {
        if (voice !== src) return;
        voice = null;
        /* ⚠️ THE BAR HAS TO BE TOLD, or its toggle stays saying PAUSE over a
           page making no sound. A one-shot ending is a state change nothing
           else on this page would notice. */
        deck.pause();
      };
      src.start(0, Math.max(0, Math.min(from, buf.duration)));
      voice = src;
      played++;
      /**
       * 🔴 THE HEAD FOLLOWS THE CONTEXT CLOCK AND NOT A TIMER, and it stops
       * when the sound does. `AudioContext.currentTime` is the only clock that
       * agrees with what is being heard; a `setInterval` drifts against it and
       * a `requestAnimationFrame` loop that never stops is a phone's battery
       * spent drawing a still picture.
       */
      const began = ac.currentTime - from;
      /**
       * 🔴 ONE CLOCK FEEDS BOTH SURFACES. This used to move the waveform's head
       * alone; the transport bar's playhead now comes off the same function, by
       * pushing the position into the deck each frame the way `mediaMaster`
       * does for a media element. Two clocks started at the same instant would
       * be two readings of one sound, which is the thing this page already
       * refuses to do with its picture and its audio.
       */
      /* ⚠️ THE SCOPE HAS NO `follow`, SO THE PAGE OWNS THE LOOP. `wave-view`
         took a function and ran its own frame loop; `grain-scope` is pushed a
         fraction. The clock is unchanged and is still the one that agrees with
         what is being heard, and it still stops when the sound does. */
      const tick = () => {
        if (voice !== src) return;
        const t = ac.currentTime - began;
        const at = looping && buf.duration > 0 ? t % buf.duration : t;
        deck.seek(Math.round(at * 1000));
        wave.playhead(buf.duration > 0 ? at / buf.duration : 0);
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
      deck.play();
      lastPlayed = { name: w.name, frames: mono.frames, rate: mono.rate, seconds: buf.duration };
      d.log(`${w.name}, ${buf.duration.toFixed(2)} s, ${mono.frames.toLocaleString()} frames at `
          + `${mono.rate} Hz${looping ? ', looping' : ''}`);
    } catch (e) {
      d.log(`no sound here (${e.message})`, 'bad');
    }
  }

  function stopSample() {
    if (!voice) return;
    try { voice.stop(); } catch { /* a voice that already ended cannot be stopped twice */ }
    voice = null;
    // ⚠️ THE HEAD GOES BACK TO THE TOP RATHER THAN STANDING WHERE THE SOUND
    // STOPPED. A line left in the middle of a picture with nothing playing
    // reads as a sound that is paused, and nothing here can resume.
    wave.playhead(0);
    deck.pause();
    deck.seek(0);
  }

  /* ⚠️ NO LISTENERS HERE ANY MORE. The bar's `command` object is what calls
     `playSample` and `stopSample`, and its `loopSlot` owns the loop toggle, so
     a press and a programmatic call go down one path instead of two. */

  // ── what a visit is allowed to have done ─────────────────────────────────
  d.assert('a visit opens nothing, asks for nothing and makes no sound',
    drop.opens === 0 && patches.length === 0 && fetched === 0 && played === 0 && ac === null,
    `${drop.opens} files opened, ${patches.length} patches read, ${fetched} request(s), ${played} sample(s) played`);

  d.assert('nothing here asks for MIDI, so nothing here can write to an instrument',
    midiAsked === 0 && navigator.requestMIDIAccess !== undefined,
    `requestMIDIAccess called ${midiAsked} time(s), and the counter is still in front of it`);

  // 🔴 THE WAY IN IS ON SCREEN BEFORE ANY DRAG, which is the defect the first
  // build shipped: a component whose only visible part appeared mid-drag.
  {
    const box = drop.el.getBoundingClientRect();
    d.assert('the way in is visible at rest and says what it takes, including a zip',
      box.width > 200 && box.height > 40 && /\.zip/.test(drop.el.textContent)
      && !drop.el.dataset.over && drop.cover.isConnected === false,
      `${box.width.toFixed(0)} by ${box.height.toFixed(0)} px`);

    /**
     * 🔴 THE ORDER IS MEASURED OFF THE SCREEN AND NOT READ OFF THE SOURCE, which
     * is `positron-ui`'s rule after `/twelve/` was corrected by screenshot twelve
     * times in one evening. The ask was a title, then a button, then the
     * extensions UNDER it, and `append` order is not layout: a stylesheet can
     * reverse a column and the source still reads correctly.
     */
    /**
     * 🔴 THE FOOTER IS NOT THERE WHEN IT HAS NOTHING TO SAY, and this is the
     * assert for *"rm nothing has been opened"* plus *"should be file uplaod
     * block footer, glued"* at once. A footer with a border and no words is an
     * empty box painting a line nobody wrote.
     */
    d.assert('with nothing open there is no waveform, so no empty box paints an edge',
      waveHost.hidden === true && waveHost.getBoundingClientRect().height === 0
      && wave.showing() === 'scrolling',
      `the picture is ${waveHost.hidden ? 'away' : 'up'} at `
      + `${waveHost.getBoundingClientRect().height} px, showing ${wave.showing()}`);

    d.assert('the block has no footer until something has been opened',
      drop.note.hidden === true && drop.note.textContent === ''
      && drop.note.getBoundingClientRect().height === 0,
      `the footer is ${drop.note.hidden ? 'away' : 'up'} at `
      + `${drop.note.getBoundingClientRect().height} px`);

    const t = drop.el.querySelector('.pos-drop-title').getBoundingClientRect();
    const b = drop.button.getBoundingClientRect();
    const h = drop.el.querySelector('.pos-drop-hint').getBoundingClientRect();
    d.assert('the title is over the button and the list of what it takes is under it',
      t.bottom <= b.top + 1 && h.top >= b.bottom - 1
      && drop.el.querySelector('.pos-drop-title').textContent === 'UPLOAD FILE'
      && drop.button.textContent === 'Open file'
      && /or drag a file here/.test(drop.el.textContent),
      `title ends at ${t.bottom.toFixed(0)}, the button runs ${b.top.toFixed(0)} to `
      + `${b.bottom.toFixed(0)}, the list starts at ${h.top.toFixed(0)}`);

    /**
     * 🔴 ONE WAY IN, AND THIS ASSERT REPLACES THE ONE THAT WENT WITH THE BUTTON.
     * `open the pack here` was removed on 2026-09-21 because it was asked for,
     * and a control that disappears takes its checks with it silently:
     * `positron-verify` records that those asserts do not fail, they stop
     * running, and the suite stays green either way. So the removal itself is
     * graded.
     */
    const bar = document.querySelector('.pos-controls');
    d.assert('there is one way in and no control row at all, which is what the page promises',
      bar?.hidden === true && bar.querySelectorAll('button').length === 0,
      `${bar ? bar.querySelectorAll('button').length : 'no'} control(s), row ${bar?.hidden ? 'hidden' : 'shown'}`);
  }

  d.assert('the picture cut nothing and refused nothing',
    dg.cuts.length === 0, dg.cuts.map((c) => `${c.id}: ${c.shown}`).join(', ') || 'none');
  d.assert('every line in the picture has an arrowhead on it',
    dg.ties === 0, `${dg.ties} headless tie(s)`);

  /**
   * 🔴 THE PICTURE IS NOT THERE AT ALL BEFORE A FILE IS, AND THIS REPLACES THE
   * TWO RESERVATION ASSERTS THAT USED TO SIT HERE. They measured that the
   * picture had its full height at rest and did not move when a pack opened,
   * which was the right check for the behaviour asked for on 2026-09-20 and is
   * the wrong check for the behaviour asked for on 2026-09-21.
   * ⚠️ AND IT GRADES THE HEADING TOO. Hiding a figure and leaving `How it
   * works` standing over nothing is the failure that is easy to ship here,
   * because the heading is not the diagram's own element.
   */
  {
    const box = dgHost.getBoundingClientRect();
    d.assert('with no file open there is no picture and no heading over one',
      dgHost.hidden === true && box.height === 0
      && dgHost.querySelector('.pos-how') !== null
      && dgHost.querySelector('.pos-dg') !== null,
      `the host is ${box.height} px tall holding `
      + `${dgHost.querySelectorAll('.pos-how, .pos-dg').length} parts`);
  }

  d.assert('every tab keeps its bare word until it has something to count',
    tabs.buttons.map((b) => b.textContent).join(' ') === 'PATCHES SESSIONS SAMPLES',
    tabs.buttons.map((b) => b.textContent).join(' '));

  /**
   * 🔴 THE PHONE LAYOUT IS THE ONE THING ON THIS PAGE THE HARNESS CANNOT SEE,
   * SO WHAT IS ASSERTED IS THE ONE THING THAT CAN BE. `demo/verify.mjs` runs at
   * 756 px and never enters a `max-width: 560px` block, and a media query adds
   * NO SPECIFICITY, so a plain rule written after it wins at every width. That
   * is not a theory: `.pos-pick`'s whole phone layout sat above the plain rule
   * that beat it and had never run once.
   * ⚠️ ORDERING IS NOT BEHAVIOUR, AND THIS ASSERT CLAIMS ONLY THE ORDERING.
   * What the block DOES was measured by hand at 390 px and is written beside
   * the rules themselves.
   */
  {
    const css = document.querySelector('style')?.textContent || '';
    const at = css.lastIndexOf('@media');
    /* Walk the braces from the query to the one that closes it, then read what
       is left. Anything but whitespace after it is a plain rule that beats the
       whole block at every width. */
    let depth = 0, end = -1;
    for (let i = at; i >= 0 && i < css.length; i++) {
      if (css[i] === '{') depth++;
      else if (css[i] === '}' && --depth === 0) { end = i; break; }
    }
    const after = end >= 0 ? css.slice(end + 1) : 'unclosed';
    d.assert('the phone rules are the last thing in the stylesheet, where a media query can still win',
      at > 0 && end > at && after.trim() === '',
      `${after.trim().length} characters of plain CSS follow the last media query`);
  }

  /**
   * 🔴 THIS ASSERT PASSED EVERY RUN WHILE THE HEADINGS WERE ON SCREEN, AND A
   * SCREENSHOT IS WHAT CAUGHT IT. It read `head.hidden === true`, which is a
   * fact about an ATTRIBUTE, and `.pos-tbl-row` sets `display: grid`, which
   * beats the UA's `[hidden] { display: none }`. So `blank()` set the attribute,
   * changed nothing, and the check agreed with it.
   * ⚠️ SO IT READS THE COMPUTED STYLE NOW, WHICH IS THE ONLY THING THAT KNOWS
   * WHAT IS BEING DRAWN, and it covers all four tables rather than two.
   * `shell.css` gained `.pos-tbl-row[hidden]`, so this was a defect in every
   * empty table in the project and not only in these.
   */
  {
    const heads = [patchTable, sessionTable, partsTable, sampleTable]
      .map((t) => t.el.querySelector('.pos-tbl-head'))
      .filter(Boolean);
    const drawn = heads.filter((h) => getComputedStyle(h).display !== 'none');
    d.assert('an empty table draws no heading, because a column name over nothing labels air',
      patchTable.count() === 0 && sampleTable.count() === 0 && partsTable.count() === 0
      && heads.length === 4 && drawn.length === 0,
      `${drawn.length} of ${heads.length} headings are still being drawn over `
      + `${patchTable.count()} patch, ${sessionTable.count()} session and ${sampleTable.count()} sample rows`);

    // 🔴 AND THE WHOLE BLOCK IS AWAY, which is the request itself.
    d.assert('with no file open there are no tabs and nothing under them',
      tabs.el.hidden === true && getComputedStyle(tabs.el).display === 'none'
      && tabs.el.getBoundingClientRect().height === 0,
      `the tabs are ${getComputedStyle(tabs.el).display} at `
      + `${tabs.el.getBoundingClientRect().height} px`);
  }

  if (SELFCHECK) {
    /**
     * 🔴 THE ONE LINE THAT READS BYTE 0, GRADED WITH NO FILE AND NO CORPUS, SO
     * IT RUNS ON THE DEPLOY TOO. This page caught the zip failure and asked the
     * SysEx scanner afterwards, which worked for the one file it was built
     * against and answered `did not read as a pack` about everything else in the
     * same words. `50 4b` is a zip, `f0` is a stream, and anything else is
     * neither: two archives in the download measured on 2026-09-21 are a Windows
     * executable and a Nintendo DS ROM.
     * ⚠️ ALL THREE ARE REFUSALS AND NONE OF THEM MAY OPEN ANYTHING, which is
     * what keeps the page's own `with no file open there are no tabs` assert
     * above true while this runs under it.
     */
    {
      const zipish = new Uint8Array([0x50, 0x4b, 0x03, 0x04, 1, 2, 3, 4]);
      const streamish = new Uint8Array([0xf0, 0x00, 0x20, 0x29, 0x00, 0x77, 0xf7]);
      const neither = new Uint8Array([0x4d, 0x5a, 0x90, 0x00]);
      await openPack('a truncated zip', zipish);
      const saidZip = drop.note.textContent;
      await openPack('a stream that never ends', streamish);
      const saidStream = drop.note.textContent;
      await openPack('a Windows executable', neither);
      const saidNeither = drop.note.textContent;
      d.assert('byte 0 routes a file three ways, and a stream is refused as a stream rather than as "not a pack"',
        /did not read as a pack/.test(saidZip)
        && /is a sysex stream/.test(saidStream) && /never ends/.test(saidStream)
        && /a zip starts 50 4b/.test(saidNeither)
        && new Set([saidZip, saidStream, saidNeither]).size === 3
        && patches.length === 0 && sessions.length === 0 && samples.length === 0,
        `zip: "${saidZip}", stream: "${saidStream.slice(0, 50)}", `
        + `neither: "${saidNeither.slice(0, 50)}"`);
      d.assert('NEGATIVE CONTROL: the router reads the bytes rather than answering the same thing three times',
        containerOf(zipish).kind === CONTAINER.zip
        && containerOf(streamish).kind === CONTAINER.sysex
        && containerOf(neither).kind === CONTAINER.unknown,
        `${containerOf(zipish).kind}, ${containerOf(streamish).kind}, ${containerOf(neither).kind}`);

      /**
       * 🔴 AND THE THIRD BRANCH IS NOT TIDINESS, IT IS 134 ROWS OF NOISE THIS
       * PAGE USED TO ANNOUNCE. MEASURED 2026-09-21 on `Future_Kawaii.rar`, 56
       * MiB of compressed archive: catching the zip failure and scanning
       * anyway found **134 messages of exactly 350 bytes** in it, **43 distinct
       * six byte heads, and NOT ONE carrying the Circuit patch head
       * `f0 00 20 29 01 60`**. The page said *"134 of them Circuit patches"*
       * about compressed data, because `patchesIn()` identifies a patch by
       * LENGTH ALONE. That defect is in `circuit-syx.mjs` and is not repaired
       * here; what byte 0 does is refuse the file before the question is asked.
       */
      const rar = new Uint8Array([0x52, 0x61, 0x72, 0x21, 0x1a, 0x07, 0x00]);
      const noise = new Uint8Array(PATCH_BYTES);
      noise[0] = 0xf0;
      noise[PATCH_BYTES - 1] = 0xf7;
      for (let k = 1; k < PATCH_BYTES - 1; k++) noise[k] = (k * 37) & 0x7f;
      d.assert('NEGATIVE CONTROL: any 350 byte run counts as a patch, so a rar has to be refused by its first two bytes',
        patchesIn(noise).length === 1
        && noise[4] !== SYSEX_HEAD[4]
        && containerOf(rar).kind === CONTAINER.unknown,
        `the patch reader counts ${patchesIn(noise).length} in 350 bytes of noise whose head is `
        + `${[...noise.subarray(0, 6)].map((x) => x.toString(16).padStart(2, '0')).join(' ')}, `
        + 'and a rar never reaches it');
    }

    const r = PACK_HERE ? await realFetch(PACK).catch(() => null) : null;
    if (!r || !r.ok) {
      /**
       * ⚠️ THIS BRANCH USED TO PRESS `open the pack here` AND READ WHAT IT SAID.
       * That control is gone, so what is left to grade is the only claim that
       * ever mattered on a deploy: the page asked nobody for anything and the
       * way in is the drop area, for everybody, with no branch on where it is
       * being served from.
       */
      d.log('the pack here is not published, so the reading checks did not run', 'bad');
      d.assert('where the pack is not published nothing is asked of anybody, and the way in is unchanged',
        !PACK_HERE && fetched === 0 && drop.opens === 0 && patches.length === 0
        && drop.el.classList.contains('pos-drop-area'),
        `at ${location.hostname} after ${fetched} request(s) and ${drop.opens} file(s) opened`);
    } else {
      await openPack('New Pack.circuitpack', new Uint8Array(await r.arrayBuffer()));

      /**
       * 🔴 THE FOOTER ARRIVES WITH THE FILE AND SPANS THE BLOCK. `glued` is
       * three measurements, not a look: it is as wide as the block's inside, it
       * sits at the bottom of it, and there is no gap between the body above and
       * it. `positron-ui` records `/twelve/` being corrected by screenshot twelve
       * times in one evening because layout was reasoned about instead of
       * measured.
       */
      {
        const area = drop.el.getBoundingClientRect();
        const foot = drop.note.getBoundingClientRect();
        const body = drop.el.querySelector('.pos-drop-body').getBoundingClientRect();
        d.assert('opening a file raises a footer that spans the block and is glued to the body above it',
          drop.note.hidden === false && drop.note.textContent.includes('.circuitpack')
          && Math.abs(foot.width - (area.width - 2)) < 2
          && Math.abs(foot.bottom - (area.bottom - 1)) < 2
          && Math.abs(foot.top - body.bottom) < 2,
          `the footer is ${foot.width.toFixed(0)} px of the block's ${area.width.toFixed(0)}, `
          + `${(foot.top - body.bottom).toFixed(1)} px under the body, saying `
          + `"${drop.note.textContent}"`);
      }

      /**
       * 🔴 THE SIX PUBLISHED PATCHES, DRIVEN. They are the only thing a visitor
       * to the deploy can open, so a broken one there is a page with nothing on
       * it, and that is exactly the state this check exists to notice. It
       * presses a button by NAME rather than by position, because this page has
       * no control row for a harness to sweep.
       * ⚠️ EVERY ONE MUST LAND IN RAM. `00` at offset 6 is `Replace Current
       * Patch`; `01` is `Replace Patch`, which writes flash on an instrument
       * with no factory reset. The extractor refused to write anything else and
       * this is the second reading of the same fact, off the deployed bytes.
       */

      await openPack('New Pack.circuitpack', new Uint8Array(await (await realFetch(PACK)).arrayBuffer()));

      d.assert('the pack reads as 64 patches, 32 sessions and 64 samples',
        patches.length === 64 && sessions.length === 32 && samples.length === 64,
        `${patches.length} / ${sessions.length} / ${samples.length}`);

      // ⚠️ THE COUNT LEADS, WHICH IS THE WHOLE OF THE CHANGE AND IS THE ONLY
      // PART OF IT A CHECK CAN SEE. It read `PATCHES 64` until 2026-09-21.
      d.assert('and the counts lead the tab titles',
        tabs.buttons.map((b) => b.textContent).join(' ') === '64 PATCHES 32 SESSIONS 64 SAMPLES',
        tabs.buttons.map((b) => b.textContent).join(' '));

      d.assert('every patch in it lands in RAM rather than in flash',
        patches.every((p) => !p.writesFlash),
        `${patches.filter((p) => p.writesFlash).length} of ${patches.length} would write flash`);

      /**
       * 🔴 AND OPENING ONE BRINGS IT BACK, WITH REAL LAYOUT. The height is the
       * half that matters: `diagram.mjs` measures its own text with
       * `getComputedTextLength`, which answers 0 inside a `display: none`
       * ancestor, so a picture rendered while its host was hidden would come
       * back on screen laid out against a ruler reading zero.
       */
      d.assert('opening a pack brings the picture back, laid out rather than collapsed',
        dgHost.hidden === false && dg.el.getBoundingClientRect().height > 60
        && dg.cuts.length === 0,
        `${dg.el.getBoundingClientRect().height.toFixed(1)} px tall, ${dg.cuts.length} cut`);

      const distinct = new Set(sessions.map((s) => s.fingerprint)).size;
      d.assert('the sessions are all different from each other, so this is a backup',
        distinct === 32, `${distinct} distinct of ${sessions.length}`);

      /**
       * 🔴 THE PANEL UNDER THE LIST, AND THE FIRST HALF IS THAT IT IS ALREADY
       * FILLED. A detail panel that appears on the first press pushes everything
       * under it down, which is the same reservation the picture on the patches
       * tab was asked for. `fill()` opens session 0 for exactly that reason.
       */
      {
        /* The ten facts that used to be a readout are cells on the marked row.
           Read off the row rather than off `sessions[0]`, because the point is
           that the TABLE carries them. */
        const mark = sessionTable.scroller().querySelector('.pos-tbl-row.on');
        const by = (k) => mark?.children[sessionTable.columns.findIndex((c) => c.key === k)]
          ?.textContent.trim();
        d.assert('opening a pack opens its first session too, and the row carries what the readout did',
          pickedSession === 0 && partsTable.count() === 50 && !!mark
          && by('name') === 'User Session' && by('head') === 'USER' && by('marker') === 'DC BB'
          && by('synth1') === 'Frog Steps' && by('payload') && by('entropy') && by('notErased'),
          `the marked row reads name ${by('name')}, head ${by('head')}, marker ${by('marker')}, `
          + `synth 1 ${by('synth1')}, payload ${by('payload')}, entropy ${by('entropy')}`);

        /* And the stride, which the removed line was the only way to see. */
        /* ⚠️ NO SLICE. `scroller()` is the body and the heading is not in it,
           which this project has now got wrong in both directions. */
        const sizes = [...partsTable.scroller().querySelectorAll('.pos-tbl-row')]
          .map((r) => r.children[1].textContent.trim());
        const runs = [];
        for (const v of sizes) {
          const last = runs[runs.length - 1];
          if (last && last.v === v) last.n++; else runs.push({ v, n: 1 });
        }
        d.assert('the region sizes are a column, so the four strides can be read off the table',
          runs.length === 4
          && runs.map((r) => `${r.n} of ${r.v}`).join(', ')
             === '1 of 76, 16 of 1,508, 32 of 720, 1 of 6,004',
          runs.map((r) => `${r.n} of ${r.v}`).join(', '));
      }

      /**
       * 🔴 THE NOTE DATA, ON THE PAGE. The owner read `What they hold is not
       * known` back at me with *"where is note data?"*, which was the right
       * question the moment the research landed. `notesIn` is graded in
       * `circuit-session-test.mjs` at 5,095 events against 0 in all 64 blanks;
       * what THIS asserts is that the page shows it, and shows it per region.
       * ⚠️ AND THE COLUMN IS EMPTY ON THE OTHER 34 RATHER THAN `0`. A zero would
       * read as a region that was looked at and found empty, and nothing looks
       * for notes outside the sixteen 1,508 byte regions.
       */
      {
        const rows = [...partsTable.scroller().querySelectorAll('.pos-tbl-row')];
        /* ⚠️ BY NAME, NOT BY INDEX. This read `children[3]` and a `size` column
           was inserted in front of it on 2026-09-21, which moved `notes` to 4.
           A positional read of a table is a check that breaks when a column is
           added, silently and in the wrong direction. */
        const notesAt = partsTable.columns.findIndex((c) => c.key === 'notes');
        const cell = (r) => r.children[notesAt].textContent.trim();
        const wide = rows.slice(1, 17);
        const rest = [...rows.slice(0, 1), ...rows.slice(17)];
        const shown = wide.reduce((n, r) => n + (+cell(r) || 0), 0);
        d.assert('the sixteen 1,508 byte regions carry a note count and the other 34 carry nothing',
          rows.length === 50 && shown === sessions[0].notes && shown > 0
          && rest.every((r) => cell(r) === ''),
          `${shown} note events across 16 regions, and ${rest.filter((r) => cell(r) === '').length} `
          + 'of the other 34 are blank rather than zero');

        /**
         * 🔴 THE NOTES ARE DRAWN, ONE REGION AT A TIME, WHICH IS WHAT WAS ASKED
         * FOR ON 2026-09-22. A count in a cell says how many; these assert that
         * each event is on its own step and in its own slot, that the block
         * reserves its room whether or not anything is pressed, and that the
         * three answers a region can give are three different answers.
         * ⚠️ THE SESSIONS TAB HAS TO BE OPEN OR EVERY RECT IN IT READS ZERO.
         * An inactive tab panel has no layout at all while `getComputedStyle`
         * goes on answering real colours, which is the half-true measurement
         * this page's seam check already records paying for.
         */
        const wasTab = tabs.at();
        tabs.go('sessions');
        showSession(0);
        const lit = () => padCells.flat().filter((p) => p.dataset.on).length;
        const corner = () => gridEl.firstChild.textContent;
        const onRow = () => partsTable.scroller().querySelector('.pos-tbl-row.on')
          ?.children[0].textContent.trim();
        /* Parts 1 to 16 are the wide ones and `notesIn` numbers them 0 to 15,
           so a part index is one more than the region number in an event. */
        const withNotes = sessions[0].parts.findIndex((p) => p.notes > 0);
        const emptyWide = sessions[0].parts.findIndex((p) => p.notes === 0);
        const unread = sessions[0].parts.findIndex((p) => p.notes === null);

        /* 🔴 PRESSED, NOT CALLED. The ask is *"when clicked on region on
           regions table, make that line active"*, so the check clicks the row
           a person would click. Calling `showRegion` directly would grade the
           function and say nothing about whether the list is wired to it, which
           is exactly how a table with no `i` on its rows passed review. */
        [...partsTable.scroller().querySelectorAll('.pos-tbl-row')][withNotes].click();
        const ev = sessions[0].events.filter((e) => e.region === withNotes - 1);
        const placed = ev.every((e) => padCells[e.slot]?.[e.step]?.dataset.on === '1'
          && padCells[e.slot][e.step].textContent === (noteName(e.note) || String(e.note)));
        d.assert('pressing a region marks its row and draws that region, every note on its own step',
          pickedRegion === withNotes && onRow() === `region ${withNotes + 1}`
          && ev.length > 0 && lit() === ev.length && placed
          && stepsHost.getBoundingClientRect().height > 100,
          `region ${withNotes + 1} holds ${ev.length} events and ${lit()} pads are lit, `
          + `the marked row reads "${onRow()}", every note is on its own step: ${placed}, `
          + `in a picture ${stepsHost.getBoundingClientRect().height.toFixed(0)} px tall`);

        /**
         * 🔴 THE THREE-WAY SPLIT, AND IT IS A NEGATIVE CONTROL AS WELL AS A
         * CHECK. A region holds notes, or is one of the sixteen this decoder
         * reads and holds none, or is one of the thirty four it never reads for
         * notes. The last two draw an identical picture, so if the words did not
         * differ the page would be saying *there is nothing there* about
         * regions it never looked at, which is this project's most repeated
         * wrong answer in its most expensive form.
         */
        showRegion(withNotes); const sayA = corner(); const litA = lit();
        showRegion(emptyWide); const sayB = corner(); const litB = lit();
        showRegion(unread); const sayC = corner(); const litC = lit();
        d.assert('a region with notes, one read and empty, and one never read for notes say three different things',
          litA > 0 && litB === 0 && litC === 0
          && sayB === 'no notes' && sayC === 'not read'
          && sayA !== sayB && sayA !== sayC && sayB !== sayC,
          `region ${withNotes + 1} says "${sayA}" over ${litA} pads, region `
          + `${emptyWide + 1} says "${sayB}" over ${litB}, region ${unread + 1} `
          + `says "${sayC}" over ${litC}`);

        /**
         * 🔴 PRESENT AND EMPTY, WHICH IS THE ASK IN ITS OWN WORDS: *"when not
         * selected region, show empty trans/timeline/padgrid"*.
         * ⚠️ IT POINTS THE OPPOSITE WAY TO THIS PAGE'S OWN RULE FROM THE DAY
         * BEFORE, which is that a container with nothing in it must not paint
         * its edges. The newer instruction wins, and what makes it cost nothing
         * is that the picture is SIX FIXED ROWS: an empty one is the same height
         * as a full one, so the reserved block cannot move what is under it.
         */
        showRegion(-1);
        const sglue = stepsHost.parentElement;
        /* 🔴 THREE PARTS SINCE 2026-09-22 AND THIS READ FOUR. The sessions list
           left the glue when *"have space betwen tables"* was reported, so it
           is a SIBLING of the glue now rather than its first child. The claim
           the assert carries is unchanged and is about the three parts that
           really are one surface. ⚠️ The list's own separation is the next
           clause, because a gap nobody grades is a gap that comes back: the
           two blocks are 22 px apart by `.pos-tabs-p > * + *`, and the
           harness runs wide enough to see it. */
        const gap = sglue.getBoundingClientRect().top
          - sessionTable.el.getBoundingClientRect().bottom;
        d.assert('the regions list, the transport and the picture are one box, empty, with the sessions list a block above it',
          sglue.classList.contains('pos-glue') && sglue.children.length === 3
          && sglue.children[0] === partsTable.el
          && sglue.children[1] === stepHost && sglue.children[2] === stepsHost
          && sessionTable.el.parentElement === sglue.parentElement
          && sessionTable.el.nextElementSibling === sglue && gap > 8
          && pickedRegion === -1 && lit() === 0 && corner() === ''
          && stepsHost.getBoundingClientRect().height > 100
          && stepHost.getBoundingClientRect().height > 40,
          `${sglue.children.length} parts, ${gap.toFixed(1)} px under the sessions list, `
          + `${lit()} lit pads, the picture `
          + `${stepsHost.getBoundingClientRect().height.toFixed(0)} px tall and the `
          + `transport ${stepHost.getBoundingClientRect().height.toFixed(0)} px`);

        /**
         * 🔴 NO PLAY BUTTON AND NO TIME ANYWHERE ON THAT BAR, WHICH IS THE
         * WHOLE REASON THE PICTURE IS NOT A STRIP. Nothing this decoder reads
         * carries a tempo, a beat or a millisecond, so a play button would be
         * claiming a rate the file does not name and the clock would be printing
         * a second that came from this page.
         */
        const clockNow = stepBar.api.el.querySelector('.tbar-now')?.textContent || '';
        d.assert('the sessions transport has no play button and its clock counts steps rather than seconds',
          stepBar.api.toggles === false
          && stepBar.api.el.querySelector('.tbar-toggle') === null
          && /^step \d+ of 16$/.test(clockNow)
          && (stepBar.api.el.querySelector('.tbar-all')?.textContent ?? '') === ''
          && !/\d+[:.]\d\d/.test(stepBar.api.el.textContent),
          `the clock reads "${clockNow}" and the bar says "${stepBar.api.el.textContent.trim()}"`);

        /* ‹ and ›, pressed as a person would press them rather than by calling
           what they call. The head wraps, so the last step's neighbour is the
           first and neither button is ever dead. */
        moveHead(0);
        stepBar.extra('next').click();
        const at1 = headStep;
        stepBar.extra('prev').click();
        stepBar.extra('prev').click();
        const at2 = headStep;
        d.assert('the step head walks one step at a time, wraps round the sixteen, and is in one place at once',
          at1 === 1 && at2 === STEPS - 1
          && stepCells[at2].dataset.now === '1'
          && stepCells.filter((c) => c.dataset.now).length === 1
          && padCells.every((row) => row.filter((p) => p.dataset.now).length === 1),
          `one press of › put the head on step ${at1 + 1} and two of ‹ put it on ${at2 + 1}`);
        moveHead(0);

        /**
         * 🔴 A GATE BYTE MEANS TWO DIFFERENT THINGS AND THE RAW ONE WOULD HAVE
         * DRAWN A NOTE SIX TIMES TOO LONG. MEASURED here over the whole pack:
         * the raw field reaches 96, which is six sixteen step patterns, and the
         * length this page reports never leaves the sixteen steps a pattern
         * has. Both encodings are in this one file, so the conversion is
         * exercised rather than merely present.
         */
        {
          const raw = sessions.flatMap((x) => x.events.map((e) => e.gate));
          const steps = sessions.flatMap((x) => x.events.map((e) => gateSteps(x, e)));
          const perStep = sessions.filter((x) => x.velocityPerStep).length;
          d.assert('a gate becomes a length in steps through the encoding its own header names',
            steps.length === 5095 && perStep === 8 && sessions.length - perStep === 24
            && Math.max(...raw) === 96 && Math.max(...steps) === 16
            && Math.min(...steps) > 0,
            `${perStep} sessions count gate in steps and ${sessions.length - perStep} in `
            + `sixths of one, the raw field reaches ${Math.max(...raw)} and the length `
            + `reaches ${Math.max(...steps)} steps`);
        }
        tabs.go(wasTab);

        /* ⚠️ AND THE 105 THAT CANNOT BE NOTES ARE SAID RATHER THAN DRAWN AS
           MUSIC. MEASURED over the owner's pack: 105 of 5,095 events carry a
           note number above 127, which is impossible in MIDI. */
        const over = sessions.reduce((k, x) => k + x.events.filter((e) => e.note > 127).length, 0);
        d.assert('the events our decoder cannot read as notes are counted rather than clamped',
          over === 105 && sessions.reduce((k, x) => k + x.notes, 0) === 5095,
          `${over} of 5,095 events carry a note number above 127`);

        /**
         * 🔴 THE NEGATIVE CONTROL THE RESEARCH INSISTS ON: a decoder that found
         * notes in anything would pass every line above. The three stock
         * sessions in this very pack hold ZERO, and they are the same three that
         * distance from a template finds, which is a third independent road to
         * the same files.
         */
        const stock = sessions.filter((x) => x.nearest < 16);
        d.assert('NEGATIVE CONTROL: the three stock sessions hold no notes at all, found a third way',
          stock.length === 3 && stock.every((x) => x.notes === 0)
          && sessions.filter((x) => x.notes === 0).length === 3
          && sessions.reduce((n, x) => n + x.notes, 0) === 5095,
          `${sessions.filter((x) => x.notes === 0).length} of 32 hold none, `
          + `${sessions.reduce((n, x) => n + x.notes, 0)} events in the pack`);
      }

      /**
       * 🔴 AND NO ROW CLAIMS TO BE A SYNTH, WHICH IS THE CORRECTION ITSELF.
       * The owner asked **"five synths??"** against rows reading `synth 1` to
       * `synth 5`, and a Circuit has TWO synth parts. An assert that only
       * checked the new words would go green again the moment somebody put the
       * old ones back, so this one checks the absence.
       */
      d.assert('no region calls itself a synth or a drum, because nothing measured says it is one',
        !/synth|drum/i.test(partsTable.scroller().textContent)
        && partsTable.scroller().textContent.includes('region 1'),
        `${partsTable.count()} rows, the first reading `
        + `"${partsTable.scroller().querySelector('.pos-tbl-row')?.textContent.slice(0, 20)}"`);

      /**
       * 🔴 THE REGIONS ARE THE DECODER'S MODEL RATHER THAN A READING OF THE FILE
       * LENGTH. Fifty regions covering 53,248 bytes with no gap and no overlap is
       * the claim `circuit-session.mjs` makes, and because the page now SHOWS it
       * the page can CHECK it: every region starts where the last one ended, and
       * each one's written bytes plus its erasure come to its own size.
       */
      {
        const parts = sessions[0].parts;
        let at = 0, ok = true;
        for (const x of parts) { if (x.at !== at || x.used + x.pad !== x.size) ok = false; at += x.size; }
        d.assert('the fifty regions are contiguous, cover the whole file and each accounts for its own pad',
          ok && at === 53248 && parts.length === 50,
          `${parts.length} regions ending at ${at.toLocaleString()} of 53,248`);
      }

      /**
       * 🔴 PRESSING A SECOND SESSION OPENS THAT ONE, and the negative control is
       * the point: a panel that showed the first session whatever was pressed
       * would pass any check that only counted rows.
       */
      const otherSession = sessions.findIndex((x, k) => k > 0 && x.name !== sessions[0].name
        && x.used !== sessions[0].used);
      /* ⚠️ THE REGION TABLE IS WHAT PROVES IT NOW. The readout that used to
         answer this went on 2026-09-21 and the picture that answered it after
         that went on 2026-09-22, so the differential is the note counts down
         the lower list: two sessions that put their notes in different patterns
         cannot fill that column the same way, and a table that ignored the
         press would keep the first one's numbers. */
      const notesCol = () => [...partsTable.scroller().querySelectorAll('.pos-tbl-row')]
        .map((r) => r.children[partsTable.columns.findIndex((c) => c.key === 'notes')].textContent.trim())
        .join(' ');
      showSession(0);
      const c0 = notesCol();
      showSession(otherSession);
      const c1 = notesCol();
      d.assert('NEGATIVE CONTROL: pressing another session opens that one rather than the first',
        pickedSession === otherSession && otherSession > 0
        && c1 !== c0 && c0.trim() !== '' && c1.trim() !== ''
        && sessions[otherSession].notes !== sessions[0].notes
        /* And a press of a session puts the picture back to nothing pressed,
           because the region numbers mean something different in a new file. */
        && pickedRegion === -1,
        `session ${otherSession} is "${sessions[otherSession].name}" with `
        + `${sessions[otherSession].notes} notes against session 0's `
        + `"${sessions[0].name}" with ${sessions[0].notes}`);
      showSession(0);

      const stock = sessions.filter((x) => x.nearest < 16);
      d.assert('the three stock sessions are found by distance, which entropy cannot do',
        stock.length === 3 && stock.every((x) => x.nearest === 1)
        && stock.every((x) => x.name === 'Initial Session')
        && stock.every((x) => x.entropy > 0.8)
        && Math.min(...sessions.filter((x) => x.nearest >= 16).map((x) => x.nearest)) === 262,
        `${stock.length} sit 1 byte apart at entropy ${stock.map((x) => x.entropy.toFixed(2)).join(', ')}, `
        + `against ${Math.min(...sessions.filter((x) => x.nearest >= 16).map((x) => x.nearest))} for the nearest of the rest`);

      /**
       * ⚠️ THE PAGE NO LONGER CONCLUDES, SO THIS IS AN ASSERT ABOUT THE COLUMN
       * A READER LOOKS AT RATHER THAN ABOUT A SENTENCE. `29 of real work` was
       * the verdict's words; the same fact is 32 rows of which 3 read a
       * single-digit distance and 29 read 262 or more.
       */
      d.assert('the numbers a reader sees separate the three stock sessions from the other 29',
        sessions.filter((x) => x.nearest < 16).length === 3
        && sessions.filter((x) => x.nearest >= 16).length === 29,
        `${sessions.filter((x) => x.nearest < 16).length} within 16 bytes, `
        + `${sessions.filter((x) => x.nearest >= 16).length} beyond it`);

      /**
       * 🔴 THE LOOSE SESSION PATH, DRIVEN. It was advertised on the drop area
       * before it existed: the accept list named `.circuitsession` while the
       * handler called a function that was not there, so the page read green and
       * would have thrown the moment anybody dropped one. A capability a control
       * announces and cannot perform is this project's named hazard.
       */
      const oneSession = sessions[0].bytes.slice();
      await drop.open([new File([oneSession], 'User Session.circuitsession')]);
      d.assert('a loose session opens, and its two patches come out as payloads rather than messages',
        sessions.length === 1 && patches.length === 2
        && sessions[0].name === 'User Session'
        && patches[0].name === 'Frog Steps' && patches[1].name === 'Woo-z',
        `${sessions.length} session holding ${patches.map((x) => x.name).join(' and ')}`);

      await openPack('New Pack.circuitpack', new Uint8Array(await (await realFetch(PACK)).arrayBuffer()));

      const heads = new Set(sessions.map((s) => s.head));
      d.assert('and the first four bytes are not what decided it, because INIT is on both sides',
        heads.has('INIT') && new Set(sessions.map((x) => x.fingerprint)).size === 32,
        `the owner's own sessions say ${[...heads].join(', ')}`);

      showPatch(0);
      const matches = (p) => {
        const s = summarise(p);
        return dgBox.o1.sub === s.osc1 && dgBox.flt.sub === s.filter
          && dgBox.amp.sub === `release ${s.release}`;
      };
      d.assert('pressing a patch repaints the picture with that patch in it',
        matches(patches[0]) && picked === 0,
        `the picture says ${dgBox.o1.sub} into ${dgBox.mix.sub} into ${dgBox.flt.sub}`);

      const other = patches.findIndex((q, k) => k > 0 && summarise(q).filter !== summarise(patches[0]).filter);
      showPatch(other > 0 ? other : 1);
      d.assert('NEGATIVE CONTROL: a different patch draws a different picture',
        matches(patches[picked]) && dgBox.flt.sub !== summarise(patches[0]).filter,
        `patch ${picked} draws ${dgBox.flt.sub} against patch 0's ${summarise(patches[0]).filter}`);

      /**
       * 🔴 THE SAMPLES, READ BY THE KIT MODULE AND NOT BY THIS PAGE. Every one
       * of the 64 parses, none is refused, and every column in that table moves.
       * The rate, the depth and the channel count are the same sixty four times,
       * which is why they are in the totals line and the hover rather than in
       * columns nobody would read twice.
       */
      const all = summariseAll(samples.map((w) => w.wave));
      d.assert('all 64 samples read as 48 kHz 16 bit mono with none refused, and their lengths differ',
        all.parsed === 64 && all.refused === 0 && all.truncated === 0
        && all.rates.join() === '48000' && all.depths.join() === '16' && all.channels.join() === '1'
        && all.shortest < all.longest,
        `${all.parsed} of ${all.count} read, ${all.shortest.toFixed(2)} s to `
        + `${all.longest.toFixed(2)} s, ${all.seconds.toFixed(1)} s in total`);

      /**
       * 🔴 PRESSING ONE REALLY DECODES IT HERE, AND THIS CHECK COULD NOT BE
       * WRITTEN BEFORE TODAY. The old path handed the bytes to
       * `decodeAudioData`, which is a promise, so a check could press the row
       * and had nothing to read until a decoder somewhere else had finished.
       * `toMono` is synchronous, so what the press produced is on the page by
       * the time the next line runs.
       * ⚠️ AND IT COMPARES AGAINST THE FILE'S OWN HEADER RATHER THAN AGAINST A
       * NUMBER TYPED HERE, so a decoder that produced plausible audio of the
       * wrong length goes red.
       */
      const playedWas = played;
      playSample(0);
      d.assert('pressing a sample decodes it in this page and makes a buffer of exactly its own length',
        played === playedWas + 1 && lastPlayed?.frames === samples[0].row.frames
        && lastPlayed.rate === samples[0].row.rate
        && Math.abs(lastPlayed.seconds - samples[0].row.seconds) < 0.002,
        `${samples[0].name} played ${lastPlayed?.frames.toLocaleString()} frames at `
        + `${lastPlayed?.rate} Hz against ${samples[0].row.frames.toLocaleString()} in its header`);

      /**
       * 🔴 THE PLAYER IS UNDER THE TABLE AND THE TWO ARE ONE BOX, MEASURED OFF
       * REAL RECTS. `glued` is three numbers rather than a look: the player
       * starts where the table ends, the seam between them is 1 px, and both
       * paint a ground of their own, because a transparent child lets the
       * glue's own colour through and the seam stops being a seam.
       */
      {
        /**
         * 🔴 THE TAB IS OPENED FIRST, AND THE FIRST RUN OF THIS CHECK MEASURED A
         * HIDDEN PANEL AND REPORTED A 0.0 px SEAM ON A LAYOUT THAT WAS PERFECT.
         * An inactive tab panel has no layout at all, so every rect in it reads
         * zero while `getComputedStyle` goes on answering real colours, which is
         * the worst possible mixture: half the assert is true and half of it is
         * measuring nothing. `table.mjs`'s own `cuts()` answers `measured:
         * false` for exactly this case and says so in its header.
         * ⚠️ IT SWITCHES BACK IN THE SAME BLOCK WITH NO `await` IN IT, so no
         * frame can be drawn between and nobody watching the page sees a tab
         * move. That is the same argument `/kit/` makes about its own measuring
         * window, and an `await` here would break it.
         */
        const was = tabs.at();
        tabs.go('samples');
        // ⚠️ A SAMPLE IS OPENED FIRST, WITHOUT PLAYING ONE. The picture hides
        // itself until it has something to draw, so measuring the three parts
        // before anything is open measures two of them and a box that is not
        // there. `openSample(i, false)` is the half of the press that opens
        // rather than the half that sounds, which is the split this page made
        // for the player and is useful here for the same reason.
        openSample(0, false);
        const glue = player.parentElement;
        const t = sampleTable.el.getBoundingClientRect();
        const pl = player.getBoundingClientRect();
        const ground = (x) => getComputedStyle(x).backgroundColor;
        const wv = waveHost.getBoundingClientRect();
        /* ⚠️ AND NOTHING INSIDE DRAWS A SECOND EDGE, which is the reported
           fault rather than an extra: *"rm double bordering"*. MEASURED at the
           time on `/radio/`: a component's 1 px against the glue's 1 px in the
           same colour reads as one 2 px line. */
        const inner = (x) => parseFloat(getComputedStyle(x).borderTopWidth);
        d.assert('the list, the picture and the transport are one box, in that order, with 1 px seams',
          glue.classList.contains('pos-glue') && glue.children.length === 3
          && inner(glue) > 0 && inner(wave.canvas) === 0 && inner(bar.api.el) === 0
          && Math.abs(wv.top - t.bottom - 1) < 0.6
          && Math.abs(pl.top - wv.bottom - 1) < 0.6
          && ground(player) !== 'rgba(0, 0, 0, 0)'
          && ground(sampleTable.el) !== 'rgba(0, 0, 0, 0)'
          && ground(waveHost) !== 'rgba(0, 0, 0, 0)'
          && ground(player) !== ground(glue),
          `seams ${(wv.top - t.bottom).toFixed(1)} and ${(pl.top - wv.bottom).toFixed(1)} px `
          + `with the tab open, the parts paint ${ground(sampleTable.el)}, ${ground(waveHost)} `
          + `and ${ground(player)} against the glue's ${ground(glue)}, and inside it the `
          + `picture draws ${inner(wave.canvas)} px and the transport ${inner(bar.api.el)} px`);

        /**
         * 🔴 THE PICTURE IS ASKED FOR INK RATHER THAN FOR A COLUMN COUNT, which
         * is the check the component's own header demands: every number in
         * `facts()` would read the same if the fill colour were the field
         * colour, if the scale were zero or if `paint()` returned early.
         * `/radio/` already records that a check a wave was drawn has to ask
         * the canvas.
         */
        /**
         * ⚠️ AND AN INK SHARE ON ITS OWN IS NOT EVIDENCE, WHICH THE FIRST RUN
         * SHOWED BY ANSWERING 99.9 PER CENT. `ink()` counts pixels differing
         * from the one at the top left corner, so a canvas painted edge to edge
         * in a field colour while the corner stayed transparent would answer
         * almost 100 and mean nothing. The number that carries weight is the
         * DIFFERENCE between a picture with a sample in it and the same canvas
         * with none, which is why this clears it and puts it back.
         */
        /**
         * ⚠️ AN INK SHARE ON ITS OWN IS NOT EVIDENCE, WHICH THE FIRST RUN
         * SHOWED BY ANSWERING 99.9 PER CENT. `ink()` counts pixels differing
         * from the one at the top left corner, so a canvas painted edge to edge
         * while its corner stayed clear would answer almost 100 and mean
         * nothing.
         * 🔴 AND CLEARING IT IS NOT THE DIFFERENTIAL EITHER, WHICH THE SECOND
         * RUN SHOWED: `clear()` hides the wrapper and leaves the BITMAP where it
         * was, so the same 63,264 pixels were counted before and after. That is
         * a real gap in the component rather than in this check, and it is
         * reported rather than worked around here.
         * ✅ SO THE DIFFERENTIAL IS TWO DIFFERENT SAMPLES. The shortest in the
         * pack is 5,999 frames and the longest is 95,947, and a picture that
         * followed nothing would draw them identically.
         */
        /* ⚠️ THE FACTS MOVED OFF THE COMPONENT AND ONTO THE PIXELS. The scope
           is handed peaks and holds no opinion about frames or seconds, which
           `wave-view` did; what it can still answer is whether it is drawing
           MATERIAL or a scrolling stream, and the rest is the canvas itself. */
        /* ⚠️ A FRAME IS WAITED FOR, AND WITHOUT IT THIS READ 0 LIT PIXELS ON A
           PERFECTLY GOOD PICTURE. `wave-view` painted inside `set()`, so a
           check could read the canvas on the next line; `grain-scope` paints on
           its own `requestAnimationFrame` loop, the way a component drawing a
           live stream has to. The difference is invisible in the source and
           takes the ink assert red. */
        const frame = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
        await frame();
        const drawn = waveInk();
        const byLen = samples.map((w, k) => ({ k, n: w.row.frames })).sort((a, b) => a.n - b.n);
        const other = byLen[0].k === 0 ? byLen[byLen.length - 1].k : byLen[0].k;
        openSample(other, false);
        await frame();
        const second = waveInk();
        openSample(0, false);
        await frame();
        d.assert('the picture really follows the open sample, because two different ones draw differently',
          wave.showing() === 'material' && drawn > 0 && second > 0 && second !== drawn
          && samples[other].row.frames !== samples[0].row.frames,
          `${samples[0].name} is ${samples[0].row.frames.toLocaleString()} frames and `
          + `${drawn} lit pixels, ${samples[other].name} is `
          + `${samples[other].row.frames.toLocaleString()} and ${second}`);
        tabs.go(was);
      }

      /**
       * 🔴 THE LOOP REACHES A SOUND THAT IS ALREADY RUNNING, which is the whole
       * of *"add loop"* that can go wrong. A toggle taking effect only on the
       * NEXT press is a control that looks live and does nothing for as long as
       * anybody is listening, and that is this project's named hazard. So the
       * check presses loop WHILE a voice is playing and reads the voice.
       * ⚠️ AND IT PUTS IT BACK, because every check after this one would
       * otherwise be running against a page left looping.
       */
      openSample(0, true);
      const wasLooping = voice?.loop;
      loopBtn.click();
      const nowLooping = voice?.loop;
      /**
       * 🔴 THE TOGGLE'S STATE HAS TO BE VISIBLE, NOT ONLY ANNOUNCED. MEASURED
       * 2026-09-21: a `loopSlot` button is styled as a GLYPH box and had no
       * pressed state at all, so this control said `aria-pressed="true"` to a
       * screen reader and looked identical to a reader with eyes. Both halves
       * are asserted here, and the colour is read as a COMPUTED value because
       * that is the only thing that knows which rule won.
       */
      {
        /* ⚠️ THE SAMPLES TAB HAS TO BE THE OPEN ONE OR THE BAR IS NOT LAID OUT.
           The first build of this read 0 px wide with the picture check's tab
           still selected, which is a measurement of a hidden element rather
           than a fault in the button. */
        const wasTab = tabs.at();
        tabs.go('samples');
        const was = loopBtn.getAttribute('aria-pressed') === 'true';
        if (was) loopBtn.click();                       // start from off, whatever ran before
        const off = getComputedStyle(loopBtn).backgroundColor;
        loopBtn.click();
        const on = getComputedStyle(loopBtn).backgroundColor;
        const box = loopBtn.getBoundingClientRect();
        const barBox = bar.api.el.getBoundingClientRect();
        d.assert('the loop toggle looks pressed as well as reading pressed, and fits the bar',
          off !== on && loopBtn.getAttribute('aria-pressed') === 'true'
          && box.width > 34 && box.right <= barBox.right + 1,
          `${off} off to ${on} on, ${box.width.toFixed(0)} px wide ending `
          + `${(barBox.right - box.right).toFixed(1)} px inside the bar`);
        loopBtn.click();
        if (was) loopBtn.click();                       // and leave it as it was found
        tabs.go(wasTab);
      }

      d.assert('pressing loop changes the sound that is already playing, not only the next one',
        wasLooping === false && nowLooping === true
        && loopBtn.getAttribute('aria-pressed') === 'true' && looping === true,
        `the running voice went loop ${wasLooping} to ${nowLooping}, `
        + `the button says ${loopBtn.getAttribute('aria-pressed')}`);

      /* ⚠️ THE BAR'S OWN TOGGLE, NOT A `stopSample()` CALL. A check that calls
         the function the button calls grades the function and says nothing
         about the button, which is how a control ends up inert with a green
         suite behind it. */
      playBtn.click();
      d.assert('and the transport really lets go of it, so a looping sample can be got out of',
        voice === null && looping === true && deck.position() === 0
        && deck.transport.playing === false,
        `the voice is ${voice === null ? 'gone' : 'still held'}, the toggle is still on, `
        + `the head is parked at ${deck.position()} and the deck is `
        + `${deck.transport.playing ? 'still playing' : 'stopped'}`);
      loopBtn.click();

      /**
       * 🔴 THE ROW IS WHAT SAYS WHICH SAMPLE IS OPEN NOW, and this assert used
       * to read a sentence under the player that no longer exists. The five
       * facts it carried are cells on the marked row, which is where they were
       * asked to go.
       */
      {
        /* ⚠️ `.on` IS WHAT `table.mark()` SETS, and reading the scroller rather
           than the table keeps the hidden heading out of it, which this project
           has now paid for four times. */
        const mark = sampleTable.scroller().querySelector('.pos-tbl-row.on');
        const cells = [...(mark?.querySelectorAll('.pos-tbl-c') || [])].map((c) => c.textContent);
        d.assert('the marked row carries every fact the sentence under the player used to',
          picked2 === 0 && cells.length === 6
          && cells[0] === samples[0].name
          && cells[1] === `${samples[0].row.seconds.toFixed(2)} s`
          && cells[2] === samples[0].row.frames.toLocaleString()
          && /kHz$/.test(cells[3]) && cells[4] === samples[0].row.peak.toFixed(2)
          && playBtn.disabled === false,
          `the marked row reads ${JSON.stringify(cells)}`);
      }

      /**
       * 🔴 THE NEGATIVE CONTROL, AND IT IS THE ONE THE AGENT THAT BUILT THE
       * MODULE ASKED FOR IN WORDS: a total taken over the files that worked
       * hides the only thing worth seeing. A page that dropped a bad sample
       * would show 63 rows and a tidy total and look perfect.
       * ⚠️ IT ALSO PROVES THE PRESS REFUSES. A row that cannot decode must not
       * increment the play counter, or the page reports having played something
       * that made no sound.
       * 🔴 AND IT READS THE LOG NOW, BECAUSE THE LINE IT USED TO READ WAS
       * REMOVED ON 2026-09-22 AND THE REFUSAL COUNT MOVED THERE. A removed
       * display takes its checks with it SILENTLY unless somebody follows the
       * fact to its new home, which is this one being followed. `__demo.logs`
       * is the sanctioned surface: the harness reads that object and never the
       * page's own elements.
       */
      const badWave = readWave(new Uint8Array([0x52, 0x58, 0x46, 0x46, 0, 0, 0, 0, 0x57, 0x41, 0x56, 0x45]));
      fill([], [], [{ name: 'broken.wav', size: 12, wave: badWave, row: summariseWave(badWave, 'broken.wav') }]);
      const beforeBad = played;
      openSample(0, true);
      const said = window.__demo.logs.map((l) => l.msg).join('\n');
      d.assert('NEGATIVE CONTROL: a sample that will not read keeps its row, is counted as refused and does not play',
        sampleTable.count() === 1 && played === beforeBad && playBtn.disabled === true
        && /0 of 1 samples read, 1 refused/.test(said)
        && /did not read/.test(sampleTable.scroller().querySelector('.pos-tbl-row')?.title || '')
        && tabs.buttons[2].textContent === '1 SAMPLE'
        && tabs.enabled('samples') === true
        && tabs.enabled('patches') === false && tabs.enabled('sessions') === false,
        `${sampleTable.count()} row saying `
        + `"${sampleTable.scroller().querySelector('.pos-tbl-row')?.title}", `
        + `and the log says "${said.split('\n').filter((l) => /samples read/.test(l)).pop()}"`);
      // ⚠️ `scroller()` AND NOT `el`, AND THE FIRST TRY READ THE HEADING. The
      // heading is `.pos-tbl-row pos-tbl-head` and it is FIRST in the element,
      // so `el.querySelector('.pos-tbl-row')` returns a row with no title and
      // the assert went red on a page doing exactly what it promises. That is
      // this page's third assert measuring something next to the quantity in
      // question, and the other two are in `HANDOFF.md`.

      await openPack('New Pack.circuitpack', new Uint8Array(await (await realFetch(PACK)).arrayBuffer()));

      /**
       * 🔴 THE FLASH WARNING, DRIVEN RATHER THAN READ. A file that would
       * overwrite every patch slot on the instrument is the one thing this page
       * exists to notice, and until today it was dismissed as `did not read as a
       * pack`. The stream is built here from the pack's own 64 patches with byte
       * 6 flipped to `01`, which is exactly the file measured in the wild.
       */
      // ⚠️ SNAPSHOT FIRST, AND THE NEGATIVE CONTROL CAUGHT THAT THIS WAS
      // MISSING. `fill()` REPLACES `patches`, so building the safe stream out of
      // `patches` after loading the flash one built it out of the flash one and
      // the control went red reporting 64 of 64 writing flash. It was measuring
      // the page correctly and my check was reading a variable that had moved.
      const orig = patches.map((q) => q.bytes.slice());
      const stream = new Uint8Array(PATCH_BYTES * 64);
      for (let k = 0; k < 64; k++) {
        const one = orig[k].slice();
        one[6] = 0x01; one[7] = k;
        stream.set(one, k * PATCH_BYTES);
      }
      await openPack('a bank that writes flash', stream);
      d.assert('a file that would overwrite flash is named as one, with how many slots it reaches',
        lastScan?.flash === 64 && lastScan.slots.size === 64 && lastScan.messages === 64
        && /overwrite 64 slots, 0 to 63/.test(drop.note.textContent)
        && patches.length === 64,
        `"${drop.note.textContent.slice(0, 80)}"`);

      // ⚠️ THE NEGATIVE CONTROL. A page that shouted at every file would pass
      // the line above and be worthless. The same 64 messages with byte 6 left
      // alone are the portable single patch format and must raise nothing.
      const safe = new Uint8Array(PATCH_BYTES * 64);
      for (let k = 0; k < 64; k++) safe.set(orig[k], k * PATCH_BYTES);
      await openPack('a bank that lands in RAM', safe);
      d.assert('NEGATIVE CONTROL: the same messages that land in RAM raise nothing',
        lastScan?.flash === 0 && !/overwrite/.test(drop.note.textContent)
        && patches.length === 64,
        `${lastScan?.patches.length} patches, ${lastScan?.flash} of them writing flash`);

      /**
       * 🔴 A REAL BULK TRANSFER, END TO END, WHEN THE ARCHIVE DOWNLOAD IS ON
       * THIS MACHINE. `Roland_Classics.zip` holds one 6,753,638 byte `.syx` and
       * no pack at all, and this page answered *"is 6753638 bytes and a Circuit
       * patch is 350"* about its contents until today. It is the file with EMPTY
       * SLOTS in it, 48 filled and 16 empty, which is the case the owner's 64
       * WAVs can never produce.
       * ⚠️ IT IS UNDER `tmp/`, WHICH IS GITIGNORED, so this never runs on the
       * deploy or on a fresh clone and says so rather than going quiet.
       */
      {
        const zip = await realFetch('/tmp/packs/Roland_Classics.zip').catch(() => null);
        if (!zip || !zip.ok) {
          d.log('the archive download is not on this machine, so no real bulk transfer was opened');
        } else {
          await openZip('Roland_Classics.zip', new Uint8Array(await zip.arrayBuffer()));
          const all = summariseAll(samples.map((w) => w.wave));
          const empty = samples.filter((w) => w.wave.frames === 0).length;
          d.assert('a zip holding one bulk transfer opens to 64 sample slots, 48 filled and 16 empty, and no patches',
            samples.length === 64 && empty === 16 && all.refused === 0
            && patches.length === 0 && sessions.length === 0
            && all.rates.length === 1 && all.rates[0] === 48000
            && all.seconds.toFixed(2) === '17.31'
            && tabs.buttons.map((b) => b.textContent).join(' ').includes('64 SAMPLES'),
            `${samples.length} slots, ${empty} empty, ${all.seconds.toFixed(2)} s, `
            + `tabs "${tabs.buttons.map((b) => b.textContent).join(' ')}"`);

          // 🔴 THE CHECKSUM IS WHAT MAKES THAT AUDIO EXACT RATHER THAN
          // PLAUSIBLE, AND THE PAGE SAYS SO. One verified stream, and the
          // session count withheld because slicing this file blind gives 108
          // blocks that are zero fill and sliced PCM rather than sessions.
          const set = lastScan?.set;
          d.assert('the stream verified against its own length and its own CRC32, and the blind session count is withheld',
            set && set.streams.length === 1 && set.verified === 1
            && set.streams[0].crcOk === true && set.streams[0].lengthOk === true
            && set.streams[0].carriers === 22512 && set.streams[0].plainBytes === 5763072
            && lastScan.blindSessions === 108 && sessions.length === 0,
            `crc 0x${set?.streams[0].crc.toString(16)} over `
            + `${set?.streams[0].plainBytes.toLocaleString()} bytes from `
            + `${set?.streams[0].carriers.toLocaleString()} carriers, blind slicing would have said `
            + `${lastScan?.blindSessions} sessions`);

          // 🔴 AND AN EMPTY SLOT IS SILENT RATHER THAN AN EXCEPTION.
          // `createBuffer(1, 0, rate)` throws, and `no sound here` about a
          // DOMException reads as a broken page rather than as an empty slot.
          const emptyAt = samples.findIndex((w) => w.wave.frames === 0);
          const fullAt = samples.findIndex((w) => w.wave.frames > 0);
          const wasPlayed = played;
          openSample(emptyAt, true);
          const afterEmpty = played;
          openSample(fullAt, true);
          d.assert('an empty slot opens, shows 0.00 s and starts nothing, while a filled one plays',
            afterEmpty === wasPlayed && played === wasPlayed + 1
            && samples[emptyAt].row.seconds === 0 && samples[fullAt].row.seconds > 0
            && deck.range[1] > 1,
            `slot ${emptyAt} is empty and played ${afterEmpty - wasPlayed} time(s), `
            + `slot ${fullAt} is ${samples[fullAt].row.seconds.toFixed(2)} s and played `
            + `${played - afterEmpty} time(s)`);
          stopSample();
        }
      }

      await openPack('New Pack.circuitpack', new Uint8Array(await (await realFetch(PACK)).arrayBuffer()));

      const before = fetched;
      showPatch(3);
      d.assert('stepping through them asks nobody for anything',
        fetched === before, `${fetched - before} request(s) while moving`);

      d.assert('nothing was sent while all of that happened',
        midiAsked === 0, `requestMIDIAccess called ${midiAsked} time(s)`);
    }
  }

  d.ready();
</script>
