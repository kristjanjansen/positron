   * counting the timeslices would give a number with a plausible shape and no
   * relationship to the file. `resolveDuration` does the seek-past-the-end
   * dance, and it is imported rather than written here because this repo
   * already holds FIVE copies of it and this would have been the sixth.
   */
  let playingBack = false;
  async function openArchive(src, mime) {
    const v = el('video', 'stage-live', '', { playsinline: '', muted: '', preload: 'auto' });
    v.muted = true;
    armVideo(v);
    const fromR2 = /^https?:/.test(src);
    // ⚠️ `crossOrigin` BEFORE `src`, OR THE R2 COPY TAINTS EVERY CANVAS THE
    // CHECKS DRAW IT INTO. The archive host answers `access-control-allow-origin:
    // *`, and an element only asks for it when told to before it loads.
    if (fromR2) v.crossOrigin = 'anonymous';
    v.src = src;
    recPath.play = fromR2 ? 'r2' : 'local';
    recPath.url = fromR2 ? src : null;
    // The card goes and the real file takes its place. One swap, at the moment
    // there is something true to show.
    setPicture(archive.panel, v);
    playingBack = true;

    recordedMs = await resolveDuration(v);
    // ⚠️ A ZERO IS NOT A LENGTH. `setRange([0, 0])` throws inside the deck, so
    // a recording that resolves to nothing stops here rather than there.
    if (!(recordedMs > 0)) {
      recordedMs = null;
      d.log('the recording has no duration that could be resolved, so there is nothing to scrub', 'bad');
      return null;
    }
    archiveDeck.setRange([0, recordedMs]);
    relane();
    followPlayhead();
    /**
     * ⚠️ `mediaMaster` RATHER THAN A `timeupdate` HANDLER. It owns the drift
     * correction, the rate intersection and the stall policy, and this project
     * has the rule in writing: a recovery action is not free, and a hand-rolled
     * seek loop is how `low-latency-player.js` once aborted the very fragment
     * loads it was trying to recover.
     */
    archiveMaster = mediaMaster(archiveDeck, v, { stallPolicy: 'hold' });
    /**
     * 🔴 AND THE CONTROL ROOM'S OWN TIMELINE BECOMES THE RECORDING'S, WITH ITS
     * CURSOR AT THE START. Asked 2026-09-30, the same message as the play
     * button. The visible strip is `showDeck`'s, which sat wherever the show
     * stopped while the recording played on a deck nobody can see. So the
     * deck takes the recording's length, goes to 0, and follows the element
     * the same way `archiveDeck` does. The element is paused, so the play
     * button beside it reads paused.
     * ⚠️ `mediaMaster` ONLY READS THE ELEMENT, it never seeks or plays it, so
     * two of them on one element cannot fight.
     */
    showDeck.setRange([0, recordedMs]);
    showDeck.seek(0);
    roomMaster = mediaMaster(showDeck, v, { stallPolicy: 'hold' });
    roomStrip.strip.fit(0, recordedMs);
    archiveMedia = v;           // from here the bar and the strip drive the file
    paintPlayRec();
    d.log(`the archive holds ${(recordedMs / 1000).toFixed(1)}s, playing from `
      + `${fromR2 ? src : 'this browser\u2019s own copy'}`, 'hi');
    return { video: v, mime, ms: recordedMs };
  }

  /**
   * ⚠️ THE OPTIONS ARE FILLED IN AND THE QUESTION IS NOT, AND THE SPLIT IS THE
   * WHOLE POINT. Asked 2026-09-17: *"fill sample q sending with same stuff you
   * haev in hints"*. A form whose fields are all placeholders is a form nobody
   * can press Send on without typing first, which on a page whose whole point
   * is watching a question arrive puts a chore in front of the demonstration,
   * and that argument is still right about the answers.
   * 🔴 **IT IS WRONG ABOUT THE QUESTION, WHICH CAME BACK AS A DEFECT TWICE.**
   * `HANDOFF.md` carried *"A STALE QUESTION APPEARS ON LOAD, KAS SA OLED TEINUD
   * ÖKOPATTU?, on a page that is OFF AIR"* from a screenshot, and it was
   * reported again on 2026-09-25 as *"when I load it, I get some kind of stale
   * question"*. A question on screen on a page that is off air reads as
   * something somebody asked, whatever put it there, and a sample that has to
   * be explained away is not a sample.
   * ⚠️ **SO ONE FIELD OF FOUR GAVE UP ITS VALUE AND THE OTHER THREE KEPT
   * THEIRS.** Three words in three boxes labelled `option` are not a question
   * and nobody reads them as one, so the 2026-09-17 ask survives everywhere it
   * still holds: Send is one line of typing away rather than four.
   * ⚠️ **AND NO PLACEHOLDER, WHICH WAS THE OBVIOUS ANSWER AND IS THE WRONG
   * ONE.** `createField` takes one, and its own note says a placeholder says
   * what a good VALUE looks like. A free text question has no shape to show,
   * and the only concrete example to hand is the exact sentence that was
   * reported as appearing on load, so a hint here would be the report again in
   * a lighter ink. What the box needs said is said by the word `question` in
   * front of it.
   * ⚠️ **AND `send()` ALREADY REFUSES AN EMPTY ONE IN WORDS**, for the reason
   * written beside it: there is no silent fallback to the sample, because
   * clearing the question and pressing Send used to ask the audience something
   * nobody had typed.
   */
  /**
   * 🔴 THE PAGE'S OWN QUESTION IS ABOUT THE FILM BEHIND IT, AND IT IS THE ONE
   * THAT WAS ASKED FOR, WORD FOR WORD. Given 2026-09-19 as
   * *"q is : Kas sa oled teinud ökopattu?: Veidi | Palju | Väga palju"*, with
   * the film that replaced the Méliès print in the same session. The
   * performance behind the picture is `MIM goes Sustainable`, in a theatre the
   * audience generated the power for, so the question and the picture are about
   * the same thing.
   * ⚠️ **IT IS NOT TRANSLATED AND NOT CORRECTED.** It replaces
   * `Kas see film vajab heli`, which was about a silent 1902 print and stopped
   * being true of anything the moment the film changed.
   * ⚠️ **AND THE PAGE STAYS ENGLISH AROUND IT ON PURPOSE.** It has been an
   * Estonian question in an English page since 2026-09-18 and that is the right
   * division rather than an accident: the labels, the buttons and the log are
   * the instrument, which anybody reading this project reads, and the question
   * is CONTENT, which belongs to whoever is running the show. Translating it
   * would make the page tidier and the demonstration weaker, because a question
   * with two diacritics and a question mark in it is exactly what proves the
   * relay carries what was typed.
   * ⚠️ **AND IT IS THE CHECK'S QUESTION NOW RATHER THAN THE FIELD'S VALUE.**
   * `ASK_TITLE` is what this page's own self check sends through the relay and
   * reads back code point by code point, which is where the two diacritics and
   * the question mark are doing work, and it is why the constant stays exactly
   * as it was given.
   */
  const ASK_TITLE = 'Kas sa oled teinud ökopattu?';
  const ASK_OPTIONS = ['Veidi', 'Palju', 'Väga palju'];
  /**
   * 🔴 THE SAMPLE QUESTION IS BACK, ASKED 2026-09-25: *"restore "Oled sa teinud
   * okopattu?" q"*. It was emptied earlier the same day because a stale
   * question appeared on a page reading OFF AIR, and emptying the field was the
   * WRONG HALF of that fix: the question a stranger saw arrived off the SHARED
   * ROOM, which is fixed properly at the `ROOM` line instead.
   * ⚠️ SO A PREFILL IS SAFE NOW AND WAS NOT BEFORE. The room is a per load
   * `stage-<6 chars>` nobody else is in, so a question sitting in this box
   * reaches nobody until Send is pressed, and the 2026-09-17 ask that put it
   * there (*"fill sample q sending with same stuff you haev in hints"*) holds
   * again: Send is one press rather than four lines of typing.
   */
  const title = createField({ label: 'question', value: ASK_TITLE, grow: 'wide' });
  const opts = ASK_OPTIONS.map((v) => createField({ label: 'option', value: v }));
  /**
   * ⚠️ THE QUESTION ON ONE ROW, THE OPTIONS ON THE NEXT. Asked 2026-09-17:
   * *"options on its own row in contrrolroom"*. In one wrapping row the question
   * and two options sat together and the third fell to a line of its own, which
   * reads as three fields and a stray.
   */
  const form = el('div', 'stage-form');
  const askRow = el('div', 'stage-row');
  askRow.append(title.el);
  const optRow = el('div', 'stage-row');
  optRow.append(...opts.map((o) => o.el));
  form.append(askRow, optRow);

  const taken = () => opts.map((o) => o.value().trim()).filter(Boolean);
  const send = (delayMs) => {
    const t = title.value().trim();
    const o = taken();
    // ⚠️ NO SILENT FALLBACK TO THE SAMPLE. It used to send `Meaning of life`
    // when the field was empty, so clearing the question and pressing Send asked
    // the audience something nobody had typed.
    if (!t) { d.log('a question needs something to ask', 'warn'); return; }
    if (o.length < 2) { d.log('a question needs at least two options', 'warn'); return; }
    if (!delayMs) { ask(t, o); return; }
    /**
     * ⚠️ THE DELAY IS FOR TESTING AND IT SAYS SO ON THE BUTTON. Asked for as
     * *"make send not | send in 10s for testing"*: the two tabs are two halves
     * of one page, so posting from here and watching it arrive there needs the
     * posting to happen after you have moved. Ten seconds is long enough to
     * switch tabs and short enough to wait through.
     */
    d.log(`asking in ${delayMs / 1000} seconds, so there is time to move to the audience`);
    setTimeout(() => ask(t, o), delayMs);
  };

  const row = el('div', 'stage-row');
  /**
   * ⚠️ SECONDARY, LIKE EVERYTHING ELSE ON THE PAGE. Asked 2026-09-18 with a
   * photograph: *"All secodary buttons"*. `pos-pri` paints the yellow fill, and
   * one yellow button beside an outlined one claims that sending now is the
   * right answer and sending in ten seconds is the lesser one. They are two
   * ways of doing the same thing.
   */
  const now = el('button', '', 'Send', { type: 'button' });
  now.onclick = () => send(0);
  const later = el('button', '', 'Send in 10s', { type: 'button' });
  later.onclick = () => send(10_000);
  row.append(now, later);
  /**
   * ⚠️ THE FORM IS IN A BOX. Asked 2026-09-17: *"put it into box"*. Loose fields
   * on the page background read as part of the page rather than as one thing you
   * fill in and send. It is the project's standard surface: `--card` at 4 px
   * with a `--line` edge, the same as the log and the table.
   */
  const box = el('div', 'stage-box');
  box.append(form, row);
  room.append(box);
  stageAsk = { ask, send, form, shownOn: SHOWN_ON, get asked() { return asked; } };

  /**
   * The drawing loop. `burn` is the project's own test picture and it takes a
   * frame number, so the clock in the corner is real rather than decorative.
   * ⚠️ IT DRAWS WHILE THE TAB IS VISIBLE AND STOPS WHEN IT IS NOT.
   * `requestAnimationFrame` already pauses in a background tab, which is the
   * behaviour wanted rather than something to work around.
   */
  // The frame number is still counted, because `burn` needs one and the check
  // below waits on it. It is simply not shown: nothing about it moves.
  let frames = 0;
  function tick() {
    /**
     * 🔴 THE FILM IS THE PICTURE, AND NOTHING IS DRAWN ON TOP OF IT. Asked
     * 2026-09-18: *"make 4:3 video win and crop"*, then *"rm video overlay"*.
     * It used to be a BACKGROUND with the test pattern over it, which is the
     * arrangement `/take/` uses for a camera, and both halves of that are gone:
     * `fit: 'cover'` lets the film win the frame instead of gaining two black
     * pillars, and `burn` is not drawn over it at all, so there is no clock, no
     * counter and no frozen row on the picture.
     * 🔴 **AND SINCE THE BOX WENT 16:9 ON 2026-09-19, `cover` AND `contain`
     * AGREE TO THE PIXEL HERE.** The film is 1280x720 into a 1280x720 box, so
     * neither crops anything and the setting changes no pixel on this page
     * today. It stays `cover` for two reasons that are not taste: a film is
     * composed to fill its own frame, which is the standing rule, and `?bg=`
     * can point this page at a corpus row that is 4:3 or 480x272, where
     * `contain` would lay flat field down the sides of it.
     * ⚠️ `scrim: 0` GOES WITH IT AND IS NOT A SEPARATE TASTE DECISION. The 55%
     * scrim exists to keep a burned clock readable on top of a picture; with
     * nothing on top it is a page dimming itself by more than half for the sake
     * of furniture that is not there.
     *
     * 🔴 AND THE GENERATED PICTURE IS THE FALLBACK, WHICH IS WHY `burn` IS
     * STILL HERE. A film that 404s, stalls or fails to decode leaves `bgReady`
     * false, and that visit gets the full test picture exactly as before rather
     * than a black rectangle. The two arms are the same one line they always
     * were; what changed is that the film arm now draws the film alone.
     * ⚠️ SO THE BURNED CLOCK IS NO LONGER IN THE FEED WHEN A FILM IS UP, and
     * two things downstream read it: `readBurned` on a panel, and
     * `readBurnedFrom` on the archive's recording. The first is rehomed onto a
     * claim that holds in both arms and is checked below; the second degrades
     * to `null`, which its own assert already tolerates because it grades the
     * PLAYHEAD rather than the picture.
     */
    /**
     * ⚠️ `readyState`, AND NOT `!paused`, SINCE *"video sthould stop in control
     * room in beginning"* ON 2026-09-18. The film is STOPPED on its first frame
     * until somebody starts the show, and a `bgReady` that required playback
     * would have read a stopped film as no film at all and painted the test
     * picture over it. What the drawing loop needs to know is whether there is a
     * frame to draw, which is what `readyState >= 2` means.
     */
    const bgReady = bgVideo && bgVideo.readyState >= 2;
    /**
     * 🔴 THE CONTROL ROOM SHOWS WHAT IS GOING OUT, AND IT SHOWED NOTHING.
     * Reported twice, 2026-09-25: *"audience shows video but not control
     * room"*, then *"still no video on control room"*. Both legs append the
     * received `<video>` to the AUDIENCE panel only (`aud.panel.stage`), and
     * this loop fed every other panel from the film. So the operator, whose one
     * job is to watch what the audience is getting, had a flat field while the
     * audience had a picture.
     * ⚠️ THE MIRROR IS A CANVAS DRAW, NOT A SECOND PLAYER, AND THAT IS THE
     * WHOLE POINT. A second `<video>` on the same source is a second delivery:
     * Stream bills by the minute DELIVERED, so two elements is two meters for
     * one picture. One decode in the audience panel, copied into the master
     * canvas the control room already paints from, costs nothing extra.
     * ⚠️ LIVE BEATS THE FILM. When a show is on, the live picture IS the truth
     * about the page; the film is what plays when nothing is.
     * ⚠️ AND A CROSS-ORIGIN VIDEO CAN TAINT THE CANVAS, which is why the draw
     * is guarded. `MediaStream` from a peer connection and an MSE-backed
     * hls.js element both draw clean; a NATIVE HLS element playing a
     * cross-origin manifest, which is the Safari path, taints it and makes
     * `getImageData` throw. The readers of those pixels are checks rather than
     * visitors, and `readBurnedFrom` already tolerates a null, so the cost of
     * the Safari case is a check that cannot read the burn, not a broken page.
     */
    // ⚠️ NO LIVE MIRROR HERE ANY MORE. A canvas copy of the live element was
    // tried on 2026-09-25 and was the wrong fix: the control room has no
    // picture canvas on screen at all, so it drew into nothing. The element
    // itself moves to the showing tab instead, in `showPictureOn`.
    if (bgReady) drawCamera(mctx, bgVideo, STAGE_W, STAGE_H, { fit: 'cover', scrim: 0 });
    else {
      /**
       * 🔴 NO TEST PICTURE ON SCREEN, EVER. Asked 2026-09-18: *"i get blinkig
       * on-screen timecode etc stuff. rm it"*. It was the FALLBACK arm, and it
       * was showing for the second or so between the page opening and the film
       * decoding its first frame: a clock and a counter appearing and vanishing,
       * which reads as a fault rather than as a picture waiting.
       * ⚠️ **SO A FILM THAT NEVER ARRIVES LEAVES A FLAT FIELD, AND THE PAGE SAYS
       * SO IN THE LOG RATHER THAN IN THE PICTURE.** That is the trade and it is
       * the one asked for. The check below still goes red on a blank canvas, so
       * the failure is graded even though it is no longer drawn.
       */
      mctx.fillStyle = FIELD;
      mctx.fillRect(0, 0, STAGE_W, STAGE_H);
    }
    // ⚠️ THE ARCHIVE IS NOT FED FROM HERE. It is a recording: its picture comes
    // from wherever its transport is, which is what makes scrubbing visible.
    for (const p of panels) if (p.id !== 'archive') p.ctx.drawImage(master, 0, 0);
    /**
     * 🔴 AND THE ARCHIVE'S MASTER IS DRIVEN FROM HERE, BECAUSE `mediaMaster`
     * DOES NOT RUN ITSELF. Its own docstring says to call it from the rAF loop
     * you already run, and `/crate/` carries the same warning in a comment:
     * without this the object is BUILT and nothing happens. This page built it
     * and never ticked it, so the archive's deck was never once driven by its
     * element.
     * ⚠️ IT WAS REPORTED AS *"there is not caret in arvhice playback"* AND
     * DIAGNOSED WRONGLY TWICE, as a MediaRecorder file carrying no cues. The
     * file is fine: MEASURED, the element went to 1.00s of a 3.45s recording,
     * `ended` false, `seekable` 0.00..3.45, while the deck sat at 3.45s.
     * `master ticks 0, backstop 0, driving false` is what finally said it, and
     * printing those three counters took one run where guessing took three.
     * ⚠️ THE SEEK CHECK ABOVE PASSED THROUGHOUT, because it asks the ELEMENT
     * where it went. Every assert about this page's archive was on the one side
     * of the join that worked.
     */
    archiveMaster?.tick();
    roomMaster?.tick();
    // ⚠️ AND THE FILM'S, FOR THE REASON WRITTEN ABOVE: a `mediaMaster` that is

    A('the published transport is the control room\u2019s one bar',
      window.__demo?.transport === showBar.api && window.__demo?.transport !== bar.api,
      window.__demo?.transport === showBar.api ? 'the control room bar has the name'
        : 'nothing has it');

    const p1 = panels[1].panel;
    p1.full(true).then(() => {
      const on = p1.el.dataset.full;
      const stage = getComputedStyle(p1.el.querySelector('.pos-vp-stage'));
      const ratio = stage.aspectRatio;
      return p1.full(false).then(() => {
        A('going full sets the state and gives the picture the whole box, by either route',
          !!on && ratio !== '16 / 9' && !p1.el.dataset.full,
          `full read "${on || '(nothing)'}" with aspect-ratio ${ratio}, and came back to "${p1.el.dataset.full || '(nothing)'}"`);
      });
    }).catch((e) => {
      A('going full sets the state and gives the picture the whole box, by either route',
        false, `it threw: ${e.message}`);
    });

    /**
     * 🔴 NO BLACK RULE BETWEEN LANES, MEASURED IN PIXELS OFF THE STRIP ITSELF.
     * Reported 2026-09-18 with a photograph: *"black horiz lines on timeline
     * are pointless"*. The cause was `fillRect(0, L.y, w, L.height - 1)` in
     * `timeline/strip.mjs`, which left exactly one unpainted row per lane and
     * showed the darker canvas ground through it. Nobody drew those lines.
     *
     * ⚠️ IT SAMPLES A COLUMN, NOT A POINT. One pixel at one x could land on a
     * mark, a grid line or the loop band and read dark for a reason that is not
     * this one; a column read down the middle of the plot, with the darkest row
     * compared against the band around it, cannot. The test is that no row
     * inside the lanes is darker than the lane ground by more than a mark would
     * be, which is what a rule drawn in the background colour would be.
     * ⚠️ AND IT IS A NEGATIVE CONTROL AWAY FROM BEING DECORATION: put the `- 1`
     * back in strip.mjs and this goes red, which is how it was confirmed.
     */
    /**
     * ⚠️ THE TAB HAS TO BE THE ONE IN FRONT BEFORE THE CANVAS HAS A SIZE. The
     * first build of this check sampled while `audience` was showing, so the
     * archive panel was `hidden`, its canvas laid out at zero and the loop ran
     * over **0 rows** — which reported `undefined` rather than failing on the
     * thing it was measuring. A check that cannot see its subject has to say
     * so, and the row count in the message is what says it.
     */
    tabs.go('archive');
    /**
     * 🔴 AND THE STRIP HAS TO HAVE LANES TO HAVE A BOUNDARY BETWEEN THEM. The
     * first version of this check ran with the archive holding its ONE video
     * lane, so there was no pair of lanes anywhere in the picture and the
     * sample could not have seen a rule if one had been drawn. MEASURED by
     * sabotage: putting the `- 1` back in `timeline/strip.mjs` left this assert
     * green with the same three numbers, which is the whole lesson — a check
     * whose subject is absent reads exactly like a check that passed.
     * ⚠️ IT ASKS A REAL QUESTION, through the page's own `ask()`, rather than
     * pushing into `OPTIONS` behind it. The lanes a visitor sees are the ones
     * this grades.
     */
    /**
     * 🔴 THE QUESTION NOW TRAVELS THE RELAY, SO THE LANES ARRIVE LATER THAN THE
     * CALL. `ask()` used to render in the same tick; it sends now, and the
     * render happens when the echo comes back. The first run after that change
     * read `1 lanes` and failed, which is the check correctly noticing its own
     * subject was missing rather than a defect in the picture.
     * ⚠️ SO IT WAITS FOR THE LANES, WITH A DEADLINE, AND REPORTS THE COUNT IT
     * GOT. A bare `await` on a relay that is down is a hang, and this check has
     * already been caught once passing while its subject was absent.
     */
    /**
     * ⚠️ AND IT ASKS THE PAGE'S OWN DEFAULT QUESTION RATHER THAN AN INVENTED
     * ONE. It used to send `a question the check asked`, which graded the lanes
     * and nothing else; the default is Estonian, it has two diacritics and a
     * question mark in it, and sending it here is what makes the round trip
     * gradable at no extra cost.
     */
    ask(ASK_TITLE, ASK_OPTIONS);
    for (let i = 0; i < 60 && laneCount < 3; i++) {
      await new Promise((r) => setTimeout(r, 100));
    }
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

    /**
     * 🔴 THE QUESTION COMES BACK OFF THE RELAY WITH ITS DIACRITICS INTACT, AND
     * THIS IS A REAL ROUND TRIP RATHER THAN A STRING COMPARED WITH ITSELF. The
     * control room does not draw its own question: `ask()` sends it, the relay
     * echoes it to the sender, and `render()` runs on the message ARRIVING. So
     * what is read below is the text after `JSON.stringify`, a WebSocket frame,
     * a Durable Object and `JSON.parse`, in both panels.
     * ⚠️ IT COMPARES CODE POINTS, NOT A LOOK. `ö` is one character and can come
     * back as two, as `o`, or as a replacement character, and all three read as
     * a question in a log line. The detail prints the code points so a
     * mangling can be named rather than squinted at.
     */
    /**
     * 🔴 AND IT READS THE SLOT ONLY WHILE THE SLOT IS ON THE PICTURE. This
     * check passed for days while no question was visible anywhere, because
     * the page had emptied the stage and the slot it read was detached: the
     * text was in it and the document was not. `on` is the term that was
     * missing.
     */
    const seenAt = (id) => {
      const panel = byId.get(id).panel;
      const slot = panel.slots.caption;
      const lab = slot.querySelector('.pos-choice-l');
      const btns = [...slot.querySelectorAll('button')].map((b) => b.textContent);
      return { on: captionOn(panel), title: lab ? lab.textContent : null, options: btns };
    };
    const heard = SHOWN_ON.map((id) => [id, seenAt(id)]);
    const intact = heard.every(([, h]) => h.on && h.title === ASK_TITLE
      && h.options.length === ASK_OPTIONS.length
      && h.options.every((o, i) => o === ASK_OPTIONS[i]));
    const points = (t) => [...(t || '')].map((c) => (c.codePointAt(0) > 127
      ? `U+${c.codePointAt(0).toString(16).toUpperCase().padStart(4, '0')}` : c)).join('');
    A('the question comes back off the relay with every character it was sent with',
      intact,
      heard.map(([id, h]) => `${id}${h.on ? '' : ' (slot NOT on the picture)'}: `
        + `${points(h.title)} [${h.options.map(points).join(' | ')}]`)
        .join(', ') + `, against ${points(ASK_TITLE)} [${ASK_OPTIONS.map(points).join(' | ')}]`);
    const sc = strip.el;
    const sctx = sc.getContext('2d');
    // Down the middle of the plot, clear of the gutter and of the axis, in the
    // canvas's OWN pixels: reading a device ratio off a rect is what broke when
    // the rect was zero, and the backing store is the thing being sampled.
    const col = Math.round(sc.width * 0.72);
    const top = Math.round(sc.height * 0.25);
    /**
     * 🔴 IT STOPS WHERE THE LANES STOP, NOT WHERE THE CANVAS STOPS. Since the
     * strip took a `minHeight` there is empty ground under the last lane, which
     * is darker than a lane band and is SUPPOSED to be there. Sampling to the
     * bottom read that ground as a black rule and took this assert red on a
     * picture with nothing wrong in it.
     * ⚠️ `state.lanesH` IS IN CSS PIXELS AND THE SAMPLE IS IN THE BACKING
     * STORE, so it is scaled by the device ratio the strip itself is using.
     * Reading a ratio off anything else is what broke the first build of this
     * check when the rect was zero.
     */
    const st = strip.strip.state;
    const lanesBottom = Math.round((st.lanesH || 0) * (st.dpr || 1));
    const stop = Math.min(sc.height - 2, lanesBottom - 1);
    const lum = [];
    for (let y = top; y < stop; y++) {
      const [r, g2, b] = sctx.getImageData(col, y, 1, 1).data;
      lum.push(r + g2 + b);
    }
    // The band is the typical row; a rule would be a row far below it.
    const sorted = [...lum].sort((a, b) => a - b);
    const median = sorted[Math.floor(sorted.length / 2)];
    const darkest = sorted[0];
    A('no black rule between the lanes',
      // 🔴 THE THRESHOLD IS BETWEEN TWO MEASURED STATES, NOT A GUESS. Fixed
      // 2026-09-18 with the band painted full height and again with the `- 1`
      // put back: **a drop of 0 against a drop of 21**, over 74 rows either
      // way. 8 sits between them with room on both sides.
      // ⚠️ IT WAS 24 FIRST, WHICH IS A NUMBER THAT PASSES THE DEFECT. It was
      // picked while this check had no lanes to look at, so both states read
      // identically and any threshold looked as good as any other. A tolerance
      // chosen against a blind measurement is a tolerance chosen against
      // nothing.
      laneCount >= 3 && lum.length > 20 && median - darkest < 8,
      `${laneCount} lanes, and over ${lum.length} rows the lane ground reads ${median} and the darkest row ${darkest}, a drop of ${median - darkest}`);

    await pictureDrill();

    if (LIGHT) {
      for (const [label, pass, detail] of held) d.assert(label, pass, detail);
      d.log('left for the deep run: the publisher, the show over WebRTC, the film playing under it, '
        + 'the recording, its trip to the archive and the diagram measure (DEMO_DEEP=1)');
      return;
    }
    await showDrill();
  }

  /**
   * 🔴 THE PICTURE TAG FOLLOWS FRAMES, PROVED WITH FRAMES, IN BOTH TIERS. The
   * ordinary tier never starts a show, so a real WHEP picture is not available
   * to grade it on. A canvas in this tab, captured into a `<video>`, is: it is
   * the same element type, the same `requestVideoFrameCallback`, and the same
   * three verbs the show calls, and it costs nobody anything.
   * ⚠️ THE DRAWING IS THE SOURCE OF FRAMES, AND STOPPING IT IS THE STALL.
   * `captureStream` emits a frame when the canvas changes, so a canvas nobody
   * paints is a picture that has stopped arriving, which is what a frozen WHEP
   * leg looks like from this side.
   * ⚠️ THREE NEGATIVE CONTROLS, because a tag that says `receiving` on a timer
   * would pass a check that only looked for `receiving`: a press with no frames
   * must stay `starting`, frames that keep coming past the stall window must
   * NOT read `stalled`, and the pure rule is fed fixtures for both directions.
   */
  async function pictureDrill() {
    const now = 1e6;
    const fx = [
      ['nothing pressed, no frame', pictureOf({ now }), 'unknown'],
      ['pressed, no frame yet', pictureOf({ now, startedAt: now - 5000 }), 'coming'],
      ['pressed 80 s ago, still no frame', pictureOf({ now, startedAt: now - 80000 }), 'coming'],
      ['pressed 100 s ago, never a frame', pictureOf({ now, startedAt: now - 100000 }), 'unknown'],
      ['a frame 0.1 s ago', pictureOf({ now, lastFrameAt: now - 100 }), 'online'],
      ['a frame 1.9 s ago', pictureOf({ now, lastFrameAt: now - 1900 }), 'online'],
      ['a frame 2.1 s ago', pictureOf({ now, lastFrameAt: now - 2100 }), 'offline'],
    ];
    const bad = fx.filter(([, got, want]) => got !== want);
    A('the picture rule goes live only on a frame and stalls 2 s after the last one',
      bad.length === 0,
      bad.length ? bad.map(([n, got, want]) => `${n}: ${got}, wanted ${want}`).join(', ')
        : fx.map(([n, got]) => `${n}: ${PIC_SAYS[got]}`).join(', '));

    const tags = picTags();
    const says = () => tags.map((t) => t.state());
    const shown = () => panels.filter((p) => p.picTag)
      .map((p) => getComputedStyle(p.panel.slots.tag).display !== 'none');
    const all = (st) => tags.length > 0 && says().every((x) => x === st);
    const wait = async (ok, ms) => {
      const t0 = performance.now();
      while (!ok() && performance.now() - t0 < ms) await new Promise((r) => setTimeout(r, 50));
      return ok();
    };
    A('the picture tag is hidden while nothing is being received',
      all('unknown') && shown().every((x) => !x),
      `${tags.length} tags, saying ${says().join(', ')}, shown ${shown().join(', ')}`);

    // A source of frames that exists only while somebody paints it.
    const src = document.createElement('canvas');
    src.width = 64; src.height = 36;
    const sctx = src.getContext('2d');
    let painting = true, n = 0;
    const paint = () => {
      if (!painting) return;
      sctx.fillStyle = `hsl(${(n++ * 37) % 360} 60% 50%)`;
      sctx.fillRect(0, 0, 64, 36);
      requestAnimationFrame(paint);
    };
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true;
    // ⚠️ IN THE DOCUMENT AND NOT `opacity: 0`, because a frame is counted when it
    // is PRESENTED and an element that is never composited presents nothing.
    Object.assign(v.style, { position: 'fixed', left: '0', top: '0', width: '16px',
      height: '9px', opacity: '0.01', pointerEvents: 'none' });
    document.body.append(v);
    try {
      // The press, with an element that has nothing in it yet.
      pictureStart();
      pictureWatch(v);
      await new Promise((r) => setTimeout(r, 700));
      A('a press with no frames says starting, never receiving',
        all('coming') && pic.frames === 0 && shown().every(Boolean),
        `${pic.frames} frames, the tags say ${says().map((x) => PIC_SAYS[x]).join(', ')}`);

      paint();
      v.srcObject = src.captureStream(30);
      v.play().catch(() => {});
      const live = await wait(() => all('online'), 3000);
      const atLive = pic.frames;
      A('frames arriving turn the tag to receiving',
        live && atLive > 0,
        `${atLive} frames by ${pic.how}, the tags say ${says().map((x) => PIC_SAYS[x]).join(', ')}`);

      // Held past the stall window with frames still coming: it must not stall.
      await new Promise((r) => setTimeout(r, PIC_STALL_MS + 400));
      A('frames that keep coming past the stall window stay receiving',
        all('online') && pic.frames > atLive,
        `${pic.frames - atLive} more frames over ${(PIC_STALL_MS + 400) / 1000} s, `
        + `the tags say ${says().map((x) => PIC_SAYS[x]).join(', ')}`);

      painting = false;
      const t0 = performance.now();
      const stalled = await wait(() => all('offline'), PIC_STALL_MS + 1500);
      const tookMs = Math.round(performance.now() - t0);
      A('frames stopping turn the tag to stalled, about 2 s later',
        stalled && tookMs >= PIC_STALL_MS - 600 && shown().every(Boolean),
        `${stalled ? 'stalled' : 'NOT stalled'} after ${tookMs} ms, `
        + `the last frame ${pic.lastAt == null ? 'never' : `${Date.now() - pic.lastAt} ms ago`}, `
        + `the tags say ${says().map((x) => PIC_SAYS[x]).join(', ')}`);
    } finally {
      painting = false;
      pictureReset();
      for (const t of v.srcObject?.getTracks?.() ?? []) t.stop();
      v.srcObject = null;
      v.remove();
    }
    A('and it goes away again when there is nothing to receive',
      all('unknown') && shown().every((x) => !x),
      `the tags say ${says().join(', ')}, shown ${shown().join(', ')}`);
  }

  /**
   * 🔴 THE WHOLE PIPELINE, DRIVEN ONCE, ASSERTING AS IT GOES.
   *
   * ⚠️ IT ASSERTS AT EVERY STAGE RATHER THAN ONLY AT THE END, AND THAT IS A
   * HARNESS CONSTRAINT RATHER THAN A STYLE. `verify.mjs` stops collecting
   * 400 ms after the LAST assert and waits only while the count is still
   * growing, so a drill that runs ten seconds in silence and then asserts six
   * times has its whole tail thrown away, and the page reads as having stopped
   * early rather than as having been cut off.
   *
   * ⚠️ AND IT ASSERTS THE SAME NUMBER OF TIMES IN EVERY MODE. Loopback or the
   * real leg, R2 or not, the count does not move: what changes is what the
   * message SAYS. A check that exists in one mode only is the shape CLAUDE.md
   * bans, and it bans it because a green suite then means one of two different
   * things depending on a flag nobody printed.
   */
  async function showDrill() {
    /**
     * 🔴 PRESS THE CONTROL, DO NOT CALL THE FUNCTION. This said `await
     * startShow()`, which grades the pipeline and says nothing about the thing
     * a person touches. The two buttons became a transport bar on 2026-09-18,
     * and a bar wired to the wrong command, or built with `toggle: false`, or
     * never appended, would leave every assert below it green: they would all
     * be measuring a show that only the check knows how to start.
     * ⚠️ AND IT WAITS ON THE PAGE'S OWN STATE rather than on a timer, so a
     * press that does nothing fails here rather than three asserts later.
     */
    /**
     * ⚠️ AND THE BLOCK THAT STOOD HERE SAYING *"IT AWAITS THE FUNCTION RATHER
     * THAN CLICKING"* IS GONE, because the line under it clicks. It was left
     * behind by a reversal and contradicted the paragraph immediately below it,
     * which is a comment describing code nobody wrote. The fact it carried is
     * kept below, where it is still true: the two transport buttons ARE the
     * toggle, they live in `extras`, and `demo/verify.mjs` presses them.
     */
    /**
     * 🔴 CLICKED, NOT AWAITED, AND THE DIFFERENCE IS THE WHOLE CHECK BLOCK.
     * These asserts are HELD and flushed only when `checks()` finishes, so
     * anything awaited here delays every one of them. Awaiting the start pushed
     * the flush past the harness's patience and the page reported **2 asserts
     * instead of 37** while the suite read a confident 12/12 green.
     * ⚠️ AND THE POLL BELOW IS WHAT WAITS INSTEAD, which is what the original
     * did for exactly this reason.
     */
    const showToggle = showBar.extra('webrtc');
    /**
     * ⚠️ ONLY IF IT IS NOT ALREADY RUNNING. `demo/verify.mjs` presses
     * `.pos-controls button, .tbar-x`, and these buttons became `.tbar-x` when
     * they moved onto the bar, so the drill may have started the show already.
     * A second press of a button that is its own stop would END it, which is
     * what took twelve asserts red on the run before this line existed.
     */
    /**
     * 🔴 THE PUBLISHER IS AWAITED BEFORE THE PRESS, AND THIS IS THE ASSERT THAT
     * KEEPS THE COLD START HONEST. A press that lands on an input nothing is
     * publishing to fails for a reason that has nothing to do with this page,
     * and it used to fail as fourteen red asserts about a recorder, an archive
     * and a strip. One red row here says the real thing instead.
     * ⚠️ **THE WAIT IS PRINTED, SO WARM AND COLD ARE TOLD APART IN THE OUTPUT
     * RATHER THAN GUESSED AT.** `LESSONS.md` #119 is a page shipped on a green
     * that was a measurement of a warm container. A run whose detail reads a
     * few hundred milliseconds graded a container somebody else woke.
     */
    const whip = (await whipUp) || { ok: false };
    const wokeMs = Math.round(performance.now() - wokeAt);
    A('the publisher is publishing before a show is asked for',
      whip.ok,
      whip.ok
        ? `the WHIP leg was up ${wokeMs} ms after the hold went out, `
          + `${wokeMs < 5000 ? 'so the container was already warm' : 'so this was a cold start'}`
        : `the container never reported a WHIP leg in ${wokeMs} ms, so nothing `
          + 'is publishing to the input this page subscribes to');
    /**
     * 🔴 THE HARNESS MAY ALREADY BE STARTING IT, AND SINCE 2026-09-30 IT
     * USUALLY IS. `Start WebRTC` is control 0 now that `Start HLS` is gone, and
     * `demo/verify.mjs` presses it about a second after load. So this waits
     * for any start already in flight, and presses only if nothing got the
     * show on air; a press while one is starting is ignored by `toggleShow`.
     */
    for (let i = 0; i < 400 && switching; i++) await new Promise((r) => setTimeout(r, 50));
    if (phase !== 'live') showToggle?.click();
    // ⚠️ LONGER THAN THE FIRST-FRAME WAIT INSIDE `startShow`, DELIBERATELY.
    // Two waits for one event must be ordered, and the inner one is 12 s.
    // ⚠️ AND SHORTER THAN IT WAS, BECAUSE THE WAKE IS NO LONGER INSIDE IT. A
    // 45 s poll was sized for a cold container, and every second of it was a
    // second every held assert waited for: at 80 s the flush missed the
    // harness's patience and the page reported 2 asserts instead of 37. The
    // wake is awaited above now, so what is left to cover is the WHEP
    // handshake and the 12 s first frame wait inside `startShow`.
    for (let i = 0; i < 400 && phase !== 'live'; i++) {
      await new Promise((r) => setTimeout(r, 50));
    }
    /**
     * 🔴 STARTING A SHOW DOES NOT START THE FILM, WHICH IS THE WHOLE OF *"make
     * video transport indepencent of when show starts"*. It did until
     * 2026-09-19, and the assert here used to be the opposite one.
     * ⚠️ **IT IS ONE HALF OF A PAIR AND WORTHLESS ALONE.** A film that cannot
     * play at all passes this perfectly, which is why the next assert presses
     * the film's own control and requires it to move. Held still by a show
     * above, moving on its own press below.
     * ⚠️ AND IT READS THE ELEMENT RATHER THAN THE DECK. The deck follows the
     * element through `mediaMaster`, so the element is the side that would
     * still be honest if the join were broken.
     */
    /**
     * 🔴 IT ASKS WHETHER THE FILM IS RUNNING, NOT WHERE IT IS SITTING, AND IT
     * ASKED THE SECOND THING UNTIL 2026-09-25. The old form required
     * `at === 0`, which was true only because nothing had ever moved the film
     * before this point. The controls row changed the order the harness works
     * in, a strip drag now seeks first, and the film sat at **665.92s, exactly
     * half of its 1331.85s length**, paused, with the show live. **Every word of
     * the claim held and the assert went red**, because it was grading a
     * starting position it had been handed for free.
     * ⚠️ **NOT STARTED IS A PAIR: STILL PAUSED, AND NOT ADVANCING.** Two samples
     * apart, because `paused` alone would pass on a film that a stall had
     * stopped, and a position alone says nothing without a second reading.
     */
    const filmAt0 = bgVideo ? bgVideo.currentTime : null;
    await new Promise((r) => setTimeout(r, 300));
    const showLive = bgVideo
      ? { at: bgVideo.currentTime, was: filmAt0, paused: bgVideo.paused } : null;
    A('starting a show starts the film, because nothing else can',
      !!showLive && showLive.paused === false && showLive.at > showLive.was
        && phase === 'live',
      showLive
        ? `the show is "${phase}" and the film went ${showLive.was.toFixed(2)}s to `
          + `${showLive.at.toFixed(2)}s in 300 ms, paused ${showLive.paused}`
        : 'there was no film to start');

    /**
     * 🔴 NOW PRESS THE FILM'S OWN PLAY, WHICH IS A DIFFERENT BUTTON UNDER A
     * DIFFERENT PICTURE. Pressing it rather than calling `filmCommand.play()`
     * is the same rule the show's press already follows: a bar wired to the
     * wrong command, or never glued into the panel, would leave every assert
     * below it green.
     * 🔴 AND THE FIRST FRAME IS WAITED FOR HERE, BECAUSE THIS PRESS IS WHAT
     * STARTS THE FETCH. Nothing was loaded before it, so `currentTime` cannot
     * advance until R2 has answered and a frame has decoded. A fixed 500 ms
     * window would have graded the network rather than the page.
     * ⚠️ IT IS BOUNDED AND THE WAIT IS PRINTED, so a slow one is attributable
     * rather than mysterious, and a film that never arrives fails here rather
     * than three asserts later.
     */
    /**
     * 🔴 THE DECK IS DRIVEN DIRECTLY NOW, BECAUSE THE BUTTON THIS USED TO PRESS
     * IS GONE. Removing a control is coverage lost at a count that does not
     * move unless what it was proving is rehomed, which is what the `/fau/`
     * compile button cost on 2026-09-24. **The claim was never about a button.**
     * It is that the film has a transport of its own, that pressing play on it
     * moves the decoder, and that the room's picture follows: all three survive
     * the press moving from a DOM click to the command the button drove.
     * 🔴 **AND IT IS `filmCommand.play()`, NOT `filmDeck.play()`. MEASURED
     * 2026-09-25, FOUR ASSERTS RED ON THE FIRST TRY.** The deck ran and the
     * film did not: `currentTime` sat at 665.92s across the whole window, the
     * panel moved 0 of 255, and the detail line said `its deck is running`,
     * which is the deck reporting honestly that it was the only thing that was.
     * **The toggle never drove the deck, it drove the command**, and the
     * command is the half that reaches `bgVideo.play()`. Driving the deck
     * directly is a press on the side of the join that cannot fail.
     */
    filmCommand.play();
    const pressedAt = performance.now();
    for (let i = 0; i < 75 && !(bgVideo && bgVideo.readyState >= 2); i++) {
      await new Promise((r) => setTimeout(r, 80));
    }
    const firstFrameMs = Math.round(performance.now() - pressedAt);
    const runA = bgVideo ? bgVideo.currentTime : null;
    const panelA = lumAtOf(panels[1].ctx);
    await new Promise((r) => setTimeout(r, 500));
    const runB = bgVideo ? bgVideo.currentTime : null;
    const panelB = lumAtOf(panels[1].ctx);
    const panelMoved = Math.max(...panelA.map((v, i) => Math.abs(v - panelB[i])));
    /**
     * ⚠️ TWO SIDES OF ONE JOIN, AND THE ELEMENT'S SIDE IS THE HALF THAT LIES.
     * `currentTime` advancing proves the decoder is running; the PANEL changing

          + `then the film went ${runA.toFixed(2)}s to ${runB.toFixed(2)}s `

     * press because the film was loaded on sight. Both halves moved: it runs
     * after the press now, and the shape it grades is the one asked for on
     * 2026-09-19, *"video win to 16:9"*.

     * ARRANGEMENTS DIFFER.** A source of the wrong shape contained in this box
     * leaves a pillar of flat `FIELD` down each side and the middle of the
     * frame looks identical either way, so a check that sampled the centre
     * would pass under both and grade nothing.
     * ⚠️ **A PICTURE CAN BE FLAT AND STILL BE A PICTURE, WHICH IS WHY THERE ARE
     * TWO WAYS TO PASS.** A film frame that is dark at the edge reads as one
     * value, the same shape as a pillar; what it cannot do is read as one value
     * that is `FIELD` to within a point.

     * the column alone would go on passing if the box drifted and the picture

      edgeLum = Math.round(sum / (col.length / 4));

    // no spread at all, read straight off the constant rather than typed twice.

      ? bgVideo.videoWidth / bgVideo.videoHeight : null;

      edgeSpread != null && (edgeSpread > 2 || Math.abs(edgeLum - fieldLum) > 6)

      edgeSpread == null
        ? 'there was no film to measure'
        : `${bgVideo.videoWidth}x${bgVideo.videoHeight} into ${STAGE_W}x${STAGE_H}, `
          + `${filmAspect.toFixed(3)} against ${(STAGE_W / STAGE_H).toFixed(3)}, and the `
          + `column 6 px in spans ${edgeSpread} of 255 and averages ${edgeLum} against a `
          + `flat field at ${fieldLum}`);

    /**
     * ⚠️ IT READS THE AUDIENCE, NOT THE ARCHIVE. The archive is a recording now:
     * its frame is drawn for wherever the playhead is, so its burned clock is
     * the show's time rather than the wall's, and asserting it against `now`
     * measured the wrong thing. It went red at `nothing decoded` the moment the
     * archive stopped following the live loop, which is the check noticing a
     * change in meaning rather than a defect.
     */
    /**
     * ⚠️ AND IT READS THE CONTROL ROOM, NOT THE AUDIENCE, SINCE 2026-09-18. The
     * audience panel no longer holds a canvas at all before a show: it holds a
     * card, and then the `<video>` that carries what came back. Its canvas is
     * still blitted to and would still have answered, which is exactly the trap
     * this project keeps meeting: a check that passes by reading something the
     * page has stopped showing anybody.
     */
    /**
     * 🔴 AND IT NO LONGER READS A BURNED CLOCK, SINCE *"rm video overlay"* ON
     * 2026-09-18. This asserted `readBurned(panels[1].ctx)` against `now`, which
     * grades the blit only while the thing being blitted is the generated
     * pattern. With a film in the feed there is no clock in the picture at all,
     * so that check would have gone red on a page that is working, which is the
     * worst kind of red there is.
     * ⚠️ **IT IS ONE CLAIM ACROSS BOTH ARMS RATHER THAN A BRANCH.** Whatever is
     * being drawn, the same eight points must read the SAME in the panel as in
     * the master, and the picture must MOVE. That is the blit and the loop,
     * which is what the old check was really about: its own comment says *"the
     * blit between them is exactly the step that could be missing"*.
     * ⚠️ **BOTH HALVES OR NEITHER, AND EACH CATCHES WHAT THE OTHER CANNOT.** A
     * match alone passes when the master is blank, because a blank panel
     * matches a blank master perfectly. Movement alone passes when the panel is
     * showing an old picture of its own. Neither is worth anything on its own.
     * ⚠️ **AND IT SAMPLES LUMINANCE AT FIXED FRACTIONS, NOT A SUM.** A sum over
     * the frame is the statistic CLAUDE.md records `/mirror/` being blinded by:
     * three cosines 120 degrees apart sum to a constant. Eight points that each
     * have to agree cannot be satisfied by a coincidence in the aggregate.
     */
    /**
     * ⚠️ THE TWO READS ARE IN ONE TASK, WHICH IS WHAT MAKES THE MATCH EXACT.
     * `tick` writes the master and blits it inside one animation frame, and no
     * frame can run between two synchronous `getImageData` calls, so the panel
     * is holding precisely the master frame being read. A tolerance here would
     * be hiding a real difference rather than absorbing jitter.
     * 🔴 **AND IT MOVED HERE FROM BEFORE THE PRESS ON 2026-09-19, BECAUSE
     * THERE IS NOTHING IN THE PICTURE BEFORE ONE ANY MORE.** It used to run
     * while the film stood on its first frame, and with the film no longer
     * loaded on sight it read `spanning 0 of 255` and went red on a page that
     * was working: a flat field is what a control room correctly shows before
     * a show. MEASURED that way once rather than reasoned about.
     * ⚠️ **AND THE MOVE IS WHAT KEEPS THE CHECK WORTH ANYTHING.** Its own note
     * already said a match alone passes when the master is blank, because a
     * blank panel matches a blank master perfectly. Before the press both
     * halves were satisfiable by a page drawing nothing at all; here there is
     * a film in the frame, so the match has something to be a match OF.
     */

    const roomA = lumAtOf(roomCtx);
    const masterA = lumAtOf(mctx);

      + `the master, spanning ${roomSpread} of 255 between them `
      + `(${bgVideo && bgVideo.readyState >= 2 ? 'the film' : 'the generated picture'})`);

    /**

     * Asked 2026-09-19 as *"muted my default"*, and a default is half a claim:
     * a page that could never be unmuted would satisfy it perfectly. Both
     * halves are one press apart, so both are here.
     * ⚠️ IT PRESSES THE BUTTON RATHER THAN CALLING `setMuted()`. A control
     * wired to nothing looks identical from the outside to one wired correctly,
     * and this page has already paid for a setting that read as correct and did
     * nothing.
     * ⚠️ AND IT READS THE GLYPH, WHICH IS THE OTHER HALF OF THE SAME CONTROL.
     * The element being unmuted while the button still shows a slashed circle

     * throws away the span this module centres, so a check that only read
     * `muted` would pass over a button that had stopped saying anything.
     */

    muteBtn.click();

    const glyphLoud = glyphOf();
    muteBtn.click();

      mutedAtStart === true && mutedAfter === false && bgVideo.muted === true

      `muted ${mutedAtStart} showing ${glyphMuted}, then ${mutedAfter} showing ${glyphLoud}, `
      + `and ${bgVideo ? bgVideo.muted : 'no film'} showing ${glyphOf()} again`);

    A('one transport button starts the show, and becomes its stop',
      !!showToggle && phase === 'live' && /^stop/i.test(showToggle.textContent),
      showToggle
        ? `the page is "${phase}" and the button reads "${showToggle.textContent}"`
        : 'the control room bar has no transport button at all');

    // 2. A real peer connection was negotiated, whichever leg it is.
    A('a peer connection carried the picture, rather than the page handing itself its own stream',
      !!live && !!live.sub?.pc && live.sub.inbound !== live.pub?.stream,
      `${live?.kind ?? 'nothing'} leg, receiver ice ${live?.sub?.pc?.iceConnectionState ?? 'none'}`);

    /**
     * 🔴 THE RELAY WAS ASKED FOR ON THE PRESS AND HANDED TO THE CONNECTION, AND
     * THE ROUTE IS NAMED BESIDE THE PING. Three facts with three different
     * failures: asked on load, never asked, and asked but not passed on, which
     * is read off `getConfiguration()` because that is what the connection
     * really holds.
     */
    const conf = (live?.sub?.pc?.getConfiguration?.().iceServers || []).flatMap((s) => [].concat(s.urls));
    A('relay servers were asked for on the press and not on load',
      iceAsks >= 1 && iceLoadAsks() === 0 && !!ice,
      `${iceAsks} ask(s) after the press, ${iceLoadAsks()} before it by resource timing, `
      + (ice ? (ice.relay ? 'a relay came back' : `no relay: ${ice.why}`) : 'nothing came back'));

      !!ice && conf.length > 0 && (!ice.relay || conf.some((u) => /^turns?:/.test(u))),
      `${conf.length} url(s) in the connection, ${conf.filter((u) => /^turns?:/.test(u)).length} of them TURN`);
    const pathTexts = pathPanels().map((p) => p.panel.values.cell('path').textContent.trim());
    const pingTexts = pathPanels().map((p) => p.panel.values.cell('rtt').textContent.trim());
    A('both live footers name the path the picture took, beside the ping',
      (icePath?.path === 'direct' || icePath?.path === 'relay')
      && pathTexts.every((t) => t === icePath.path) && pingTexts.every((t) => / ms$/.test(t)),
      icePath?.path
        ? `${icePath.path}: local ${icePath.local}, remote ${icePath.remote}, ${icePath.protocol}`
          + `${icePath.relayProtocol ? `, relay over ${icePath.relayProtocol}` : ''}, `
          + `footers ${JSON.stringify(pathTexts)} beside ${JSON.stringify(pingTexts)}`

    /**
     * 3. 🔴 OBJECT IDENTITY, NEVER AN ID. A remote `MediaStream` carries the

     * comparison passes vacuously in both directions. The only honest test is
     * whether the track the recorder holds IS one of the receiver's track
     * objects.
     * ⚠️ AND WHERE THE LEG COULD NOT CARRY A PICTURE, THIS ASSERTS THE
     * OPPOSITE ON PURPOSE: that the page fell back AND SAID SO. Either way the

        ? `recorded the receiver's own track object, 1 of ${recvTracks.length}`

     * 4. 🔴 WHAT follow IS FOLLOWING, WHICH IS THE ONE THING THAT SEPARATES THE
     * TWO TARGETS. A view that moved is not evidence on its own: it is what the

     * the window keeps up with a show while THE PLAYHEAD NEVER MOVES, and both
     * halves are asserted together or neither means anything.
     *
     * ⚠️ IT ZOOMS IN FIRST, THE WAY A READER WOULD. At the window a visitor
     * gets, the write head reaches the paging edge minutes in, which is the
     * whole point of the window and no use to a check. Three seconds of view
     * pages at 2.46s, inside the wait this drill was already taking.
     * ⚠️ AND ZOOMING IS A ROUTE THE PAGE HAS: the strip zooms on a wheel and a
     * pinch, and the backlog entry this answers says follow is what makes a
     * ZOOMED view usable. The check is in the case the feature is for.
     */
    /**
     * 🔴 AND BOTH OF THESE WERE BLIND WHEN FIRST WRITTEN, WHICH IS WHY THEY ARE

     * `followPos` and a window that MOVED. SABOTAGED on purpose, making
     * `followPos` ignore the page's target and return the playhead: the page
     * read 32/32. `followsPlayhead` reports the SETTING rather than the
     * behaviour, so it was true of a strip that then ignored the setting; the
     * harness had seeked the playhead to 90s, so `followPos` was a large finite
     * number; and a window chasing a playhead 90s away moved 17,119 px, which
     * passed "it moved" with room to spare.
     * ⚠️ SO THEY MEASURE THE QUANTITY IN QUESTION NOW: how far `followPos` is
     * from the WRITE HEAD, and whether the write head is on screen at the end.
     * A statistic that is satisfied by the defect is not a weak check, it is a
     * blind one, and the only thing that told the difference was breaking it.
     */
    const st = strip.strip;

    A('while a show is recording, follow tracks the write head and not the playhead',

        && Math.abs(rd0.followPos - rd0.wall) < 250,
      `follow is at ${(rd0.followPos / 1000).toFixed(2)}s, the write head at `
      + `${(rd0.wall / 1000).toFixed(2)}s and the playhead at `
      + `${(rd0.pos / 1000).toFixed(2)}s`);

    const view0 = st.view();
    const pos0 = st.readout().pos;

    await new Promise((r) => setTimeout(r, 3500));

    const view1 = st.view();
    const rd1 = st.readout();
    const shifted = Math.round(view1.scrollX - view0.scrollX);

     * numbers: the shell's own keyboard-seek drill moves the playhead to 90s on
     * the harness's schedule, and which side of this 3.5s window it lands on is
     * not this page's business. CLAUDE.md has the general form in writing, that
     * a check depending on WHEN a press lands must confirm where it landed
     * rather than assume it.
     * ⚠️ NOTHING IS LOST BY DROPPING IT. The discriminating term is `followPos`
     * against the WRITE HEAD, and that is the one that took both sabotages red;
     * the playhead clause never caught anything the write-head comparison did
     * not already catch, and it imported a dependency on another drill's timing.

    A('the window keeps the write head on screen while nobody is playing',
      Math.abs(shifted) > 1 && headX >= 0 && headX <= plotW
        && Math.abs(rd1.followPos - rd1.wall) < 250,
      // ⚠️ EVERY TERM IS PRINTED. This read as a pass and then as a fail with
      // visibly identical numbers, because the one term not in the detail was
      // the one that moved. A failure nobody can attribute is not finished.
      `moved ${shifted} px · write head ${((rd1.wall ?? 0) / 1000).toFixed(2)}s at `
      + `${Math.round(headX)} px of ${Math.round(plotW)} · follow at `
      + `${(rd1.followPos / 1000).toFixed(2)}s, ${Math.round(Math.abs(rd1.followPos - (rd1.wall ?? 0)))} ms off it `
      + `· playhead ${(pos0 / 1000).toFixed(2)}s to ${(rd1.pos / 1000).toFixed(2)}s`);

    A('the recorder produced data while the show was running',
      chunks.length >= 1 && rec?.state === 'recording',
      `${chunks.length} pieces after 3.5s, recorder ${rec?.state ?? 'none'}`);

      onAir.map(([id, on, q, n]) => `${id}: slot ${on ? 'on the picture' : 'DETACHED'}, `

     * THIS PAGE ASKED FOR. `videoBitsPerSecond` reads back what the browser will
     * actually use, so asserting it against the constant would be the page
     * agreeing with itself. What is claimed is that a rate was CHOSEN: this
     * passed none at all until 2026-09-18 and took the browser's default, which

      Number.isFinite(askedBps) && askedBps > 0 && askedBps < 1000000,
      askedBps ? `the recorder reports ${(askedBps / 1000).toFixed(0)} kbit/s`
        : 'the recorder reported no rate at all');

    }

      + `cursor is ${rdEnd.wall === null ? 'put away' : 'still counting'}`);

      `${recordedMs == null ? 'no duration' : `${(recordedMs / 1000).toFixed(1)}s`} in the archive panel`);

     * 🔴 WHEN THE SHOW STOPS THE VISIBLE CURSOR IS HOME AND THE PLAY BUTTON IS

    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

    A('when the show stops, the control room cursor goes to the start and the play button sits paused',

      `cursor at ${(homePos / 1000).toFixed(2)}s of ${recordedMs == null ? '?' : (recordedMs / 1000).toFixed(1)}s, `
      + `the button reads ${playRecBtn.dataset.state} and is ${playRecBtn.disabled ? 'disabled' : 'enabled'}`);

    USE_R2
