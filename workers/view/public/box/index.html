<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* ⚠️ IT HAS TO WIDEN. A flex row of fixed-width buttons on a phone leaves a
     column of stragglers down the left and empty space beside them; the
     instrument names are different lengths, so nothing lines up. Same fix as
     the slider group: let the row own the width and share it out. */
  /* ⚠️ THE ROW LAYS OUT GROUPS, NOT BUTTONS. It used to be a flex row of
     individual buttons with a 6 px gap and `flex: 1 1 auto` on each, which is
     why three mutually exclusive instruments read as three unrelated controls.
     The instruments are one `createChoice` now and the row only has to space
     the GROUPS apart. */
  .pick { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin: 0 0 14px;
          width: 100%; }
  }
  /* ⚠️ 18 px, NOT 6. `reverb [dry|room|hall] chorus [off|light|wide]` at a 6 px
     gap put the word CHORUS hard against the `hall` button, so the two groups
     read as one row of six options with a stray word in the middle. The gap
     between two groups has to be bigger than the gap inside one, or there are
     no groups. */
  .pick .fx, .pos-controls .fx { display: inline-flex; gap: 18px; align-items: center; margin-left: auto;
                                 flex-wrap: wrap; }
  .fxhost { display: flex; align-items: center; }
  .pos-controls .fx .lab { color: var(--dim2); font: 500 11px/1 var(--mono); letter-spacing: .06em;
                         text-transform: uppercase; margin: 0 2px 0 0; }
  .pos-controls button.die { font-size: 15px; line-height: 1; padding: 4px 9px; }
  .pos-controls button.die:disabled, .pos-controls .fx button:disabled {
    opacity: .35; cursor: default; border-color: var(--line); }
  /* ⚠️ FOCUS MUST NOT WEAR THE ARMED COLOUR. The shell's global rule is
     `:focus-visible { outline: 2px solid var(--hi) }` — the same green the
     armed state uses — so a focused-but-OFF switch was indistinguishable from
     an armed one, and read as an effect that was in the sound while the log
     said bypassed. Focus goes grey; green means armed and nothing else. */
  .pos-controls .fx button:focus:not(:focus-visible),
  .pick button:focus:not(:focus-visible) { outline: none; }
  .pos-controls .fx button:focus-visible,
  .pick button:focus-visible { outline: 2px solid var(--dim2); outline-offset: 2px; }
  /* and the switch says which it is in words, so nobody has to read a colour */
  .pick .fx .lab { margin: 0 2px 0 0; }
  .pick button.die { font-size: 15px; line-height: 1; padding: 4px 9px; }
  .pick button.die:disabled { opacity: .35; cursor: default; border-color: var(--line); }
  .pick button:disabled { opacity: .35; cursor: default; border-color: var(--line); }
  /* ⚠️ A FOCUS RING IS NOT A SELECTION. After clicking, the effect switch kept
     a yellow outline that read as "armed" while it was in fact bypassed —
     sitting one row from a genuinely armed instrument wearing the same colour.
     Pointer clicks lose the ring; keyboard focus keeps it, which is who needs
     it. */
  .pick button:focus:not(:focus-visible) { outline: none; }
  .pick button:focus-visible { outline: 2px solid var(--dim2); outline-offset: 2px; }
  .pick .lab { flex: none; color: var(--dim2); font: 500 11px/1 var(--mono);
               letter-spacing: .06em; text-transform: uppercase; margin-right: 4px; }
  /* 🔴 NO `[aria-pressed]` RULE HERE. There was one, and it was the bug: it has
     the same specificity as the kit's `.pos-choice button[aria-pressed="true"]`
     and sits later in the cascade, so EVERY createChoice on this page — reverb
     and chorus included — silently lost the kit's chosen state and wore this
     page's instead. One meaning, one definition, in shell.css. */
  /* Starting a JACK instrument takes ten to forty seconds — jackd, the synth,
     a capture, then the port wiring. A button that just sits there reads as a
     dead click, so it breathes until the box confirms. */
  .pick button[data-busy] {
    color: var(--hi); border-color: var(--hi);
    animation: box-wait 1.1s ease-in-out infinite;
  }
  @keyframes box-wait {
    0%, 100% { background: color-mix(in oklab, var(--hi)  6%, var(--card2)); }
    50%      { background: color-mix(in oklab, var(--hi) 26%, var(--card2)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .pick button[data-busy] { animation: none; background: color-mix(in oklab, var(--hi) 16%, var(--card2)); }
  }
  .patch { font: 400 12px/1.6 var(--mono); color: var(--dim); }
  .patch b { color: var(--hi); font-weight: 400; }
  /* ⚠️ LAST IN THE FILE ON PURPOSE. These have the same specificity as the
     desktop rules above (`.pick .fx` is 0,2,0), so source order is the whole
     of the cascade here — written earlier, `align-items: stretch` lost to
     `align-items: center` and the controls stayed 113 px wide on a phone
     while the computed style said column. */
  /* ⚠️ THE ROW HAS TO STACK TOO, or the kit's phone rules do nothing visible.
     `createChoice` puts its label on top and takes 100% of ITS OWN BOX at this
     width — but the boxes were still side by side in a flex row, so instrument
     got 172 px, reverb 113 and chorus 120 of a 390 px screen. MEASURED. A
     component can only fill what its container gives it. */
  @media (max-width: 560px) {
    .pick { flex-direction: column; align-items: stretch; gap: 22px; }
    /* ⚠️ BOTH CONTAINERS. The reverb and chorus row is appended to
       `.pos-controls`, not to `.pick` — so a rule written for `.pick .fx` alone
       left them at 113 px and 120 px of a 390 px screen while the instrument
       row beside them went full width. Two homes, two selectors. */
    /* ⚠️ 22 px BETWEEN GROUPS AGAINST 4 px INSIDE ONE. At an even 10 px the
       CHORUS label sat as close to the reverb buttons ABOVE it as to its own
       buttons below, so it read as belonging to neither — a label has to be
       nearer the thing it labels than the thing it follows, or there are no
       groups, only a column of controls. */
    /* ⚠️ `display` IS PART OF IT. This set flex-direction, align-items and gap
       and not display — and the computed display came back `block`, so all
       three were inert and the two groups touched at a measured 0 px while the
       stylesheet said 22. A flex property on a non-flex box is not an error,
       it is silence. */
    .pick .fx, .pos-controls .fx, .fxhost {
      display: flex; margin-left: 0; width: 100%; flex-direction: column;
      align-items: stretch; gap: 22px;
    }
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createKeyboard } from '/shell/keyboard.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { createChoice } from '/shell/choice.mjs';
  import { createMidi } from '/shell/midi.mjs';
  import { createDiagram } from '/shell/diagram.mjs';

  const q = new URLSearchParams(location.search);
  const ROOM = q.get('room') || 'studio-1';
  const RELAY = q.get('relay') || 'wss://ws.positron.studio';
  const ID = 'web-' + Math.random().toString(36).slice(2, 8);

  const d = mount({
    name: 'box',
    what: 'The instrument is a Raspberry Pi somewhere else, and this page makes no sound of its own — it sends your key presses to the board and plays back what comes back, so the delay you hear is a real journey of about a tenth of a second. Buffer is how much sound this page is holding in hand before playing it, and a dropout is a moment that ran out or had to be cut — one click each. Play the a-to-k row, the drawn keys, or a MIDI keyboard; z and x move the octave. Reverb and chorus are made on the board — this page only sends the numbers.',

    // ⚠️ `frames`, `rate` and `midi` ALL WENT, and two of the three deserve a
    // word. `frames` was an odometer. `midi` sat at `1` forever, which is the
    // rule about a cell that cannot change — it is a capability, said once, in
    // the log, where a sentence fits.
    //
    // 🔴 `rate` IS DIFFERENT, and its GUARD IS KEPT. It earned its place: two
    // audio sources into one socket is what "garbled" sounds like here, and
    // 50/s is one clean source while anything above it is that bug. But the
    // cell read `50.1` on every run of every day, so it taught a reader to skip
    // the row — the guard is a WARNING now, fired when the rate leaves the
    // band, which is the only moment the number was ever worth reading.
    //
    // `delay`, `buffer` and `dropouts` are new. /box/ carried the same cushion
    // as `rack` with NO number on it at all — which is how `rack` sounded wrong
    // for an hour while six measurements said it was fine (LESSONS #52).
    // ⚠️ `delay` AND `round trip` BOTH WENT, and the reason is not that they
    // were wrong. Half a round trip plus the cushion is an honest floor, and
    // the ping does answer — but neither is a number you can DO anything with
    // while playing, and this row is read by somebody pressing keys, not
    // somebody tuning a network. `buffer` and `dropouts` stay because they are
    // the two that say whether what you are hearing is intact.
    //
    // 🔴 `lag` IS BACK, ON INSTRUCTION 2026-09-16: *"i want lag readout"*. The
    // paragraph above is left standing because the argument in it is a real one
    // and this supersedes it rather than proving it wrong: somebody playing a
    // board in another building wants to know how far behind their hands the
    // sound is, whether or not they can act on it.
    //
    // ⚠️ IT IS HALF A ROUND TRIP PLUS THE CUSHION, which is the honest floor
    // this file already named. The note leaves here, crosses the relay and
    // reaches the board (half a round trip), and the sound it makes comes back
    // through a jitter buffer that is deliberately holding `cushionMs` of audio.
    // Quoting the round trip alone would flatter it by the whole cushion, which
    // is the same mistake as quoting a candidate-pair RTT as media latency.
    //
    // 🔴 `lag` IS PRESS TO SOUND, MEASURED ON THE ACTUAL GESTURE, AND THE FIRST
    // TWO ATTEMPTS AT THIS CELL WERE BOTH WRONG. It was a ping round trip, which
    // read as an em dash on any page with no board answering: *"what is lag? its
    // empty. replace?"*. Then it was `frames/s` again. What was actually wanted
    // was said plainly: *"i just need number of my entry and sound coming back"*,
    // *"the diffeence in ms"*.
    //
    // So it is timed from the key press to the first sound that press produced,
    // plus the cushion still in front of it. That is the number a player feels,
    // and it needs no ping and no clock shared with the board: both stamps are
    // taken in this tab, from `performance.now()`, so there is no offset in it.
    //
    // 🔴 `lost` IS `dropped` AND `dropouts` IN ONE CELL, because they were two
    // names for "something went missing" and a reader had to hold both. Wire
    // losses and playout breaks are summed, exactly as `/radio/` already does
    // it, and the log still names which kind when either moves.
    // `bitrate` is what all of this replaced, and it is the one cell that could
    // not move at all: fixed-rate PCM has a fixed bitrate.
    // CLAUDE.md: every readout cell must be able to change, and a cell showing a
    // structural constant reads as a measurement and teaches the reader to skip
    // the row. The stream is fixed-rate PCM, so its bitrate is sample rate times
    // channels times 16 bits and nothing a player does alters it. It is the same
    // defect this row already fixed once, when `rate` read 50.1 every run of
    // every day.
    readout: { buffer: 'ms', lag: 'ms', 'frames/s': '', lost: '' },
    // NO PAGE CONTROLS. Octave down, octave up and notes off used to be here,
    // which put all three at the TOP of the page, a hand's width above the keys
    // they act on. They are the keyboard's own controls and the keyboard draws
    // them now — see the pad in demo/shell/keyboard.mjs. The row below is not
    // empty: the space and chorus settings are appended into it further down.
    controls: [],
  });
  guard(d);

  // ── instruments, chosen at runtime ───────────────────────────────────────
  // Above the patch controls: the instrument decides what a patch number even
  // MEANS, so choosing it after choosing a patch is backwards.
  const picks = el('div', 'pick');
  // ⚠️ NO LABEL HERE. `createChoice` draws its own, so the page adding one drew
  // `INSTRUMENT INSTRUMENT` — the cost of half-moving a hand-built row onto a
  // component: the markup the component replaces has to go, not just the part
  // that looked broken.
  const controls = document.querySelector('.pos-controls');
  if (controls) controls.parentNode.insertBefore(picks, controls);
  else d.el.append(picks);
  // Pinned right on the instrument row: a patch belongs to the instrument, and
  // choosing one is the next thing you do after choosing the other.
  // drawInstruments() inserts new instrument buttons before this block.
  const fxWrap = el('span', 'fx');
  // 🔴 A STEPPER IS NOT A WAY TO CHOOSE ONE OF 878. Yoshimi's library on this
  // board is 878 reachable instruments and hexter's cartridges are 128, and the
  // old control was `‹ random ›` with the name printed BESIDE it as dead text —
  // so the name had the useful half of a list (you can read where you are) and
  // none of the other half (you can go somewhere). The name is the control now:
  // press it and the platform's own list opens.
  const step = createPicker({
    // 🔴 A LABEL, ASKED FOR 2026-09-16: *"add 'patch' label to patch selector"*.
    // `what` was already 'patch' and only ever reached the button TITLES, so the
    // control named itself to a screen reader and to nobody looking at it.
    label: 'patch',
    what: 'patch',
    prev: () => { idx = (idx - 1 + span()) % span(); chosen = true; showPatch(); sendPatch(); },
    next: () => { idx = (idx + 1) % span(); chosen = true; showPatch(); sendPatch(); },
    random: () => { idx = Math.floor(Math.random() * span()); chosen = true; showPatch(); sendPatch(); },
    onPick: (i) => { idx = pickIndex(i); chosen = true; showPatch(); sendPatch(); },
  });
  fxWrap.append(step.el);
  // ⚠️ ATTACHED HERE. The line that put `fxWrap` into the row lived inside the
  // effect block that was removed, so `picks.insertBefore(b, fxWrap)` threw
  // — "the node before which the new node is to be inserted is not a child of
  // this node" — at module scope, before a single instrument button was drawn.
  // A page with a readout of dashes and one error line, which is what a cut
  // that takes a neighbour's setup line with it looks like.
  picks.append(fxWrap);
  // A press is what makes the patch line true — see showPatch().

  // 🔴 NO PATCH LINE. Removed on instruction 2026-09-16: *"rm
  // Will_Godfrey_Collection · 657 of 878"*. It printed the bank a patch came
  // from and its position in the library, under a control that already shows
  // the patch's name, so the row said the same thing twice and the half nobody
  // asked for was a filename off another machine's disk and an index into a
  // list of 878.
  // ⚠️ THE ONE THING IT SAID THAT THE CONTROL DOES NOT still gets said: with
  // nothing chosen yet, the board is playing whatever it loaded at startup
  // rather than anything this page picked. That is a state change, so it is a
  // LOG line now, which is where a thing that happened belongs.
  let saidUnchosen = false;

  let ctx = null, playout = null, ws = null, seq = 0;
  let rtt = null, cushionMs = 0, breaks = -1, rateWarned = false;
  let frames = 0, lost = 0, last = -1, avail = null, current = null, idx = 0, lastBank = -1;
  let bytes = 0, firstFrame = 0, pingAt = 0, autoStarted = false;
  /**
   * Press to sound: when a key went down, and whether we are still waiting for
   * the sound it made.
   *
   * 🔴 IT ONLY ARMS WHEN THE STREAM IS QUIET, and that is what makes it a
   * measurement rather than a guess. The board sends audio continuously, so
   * "the first loud frame after a press" is only that press's sound if nothing
   * was already sounding. Pressing a key over a held chord arms nothing, and
   * the cell keeps the last honest number instead of reporting the next frame
   * of somebody else's note as a two millisecond lag.
   * ⚠️ AND IT GIVES UP. A press that produces no sound (wrong channel, board
   * busy, instrument still loading) must not leave a stamp lying about for the
   * next unrelated note to land on.
   */
  let pressAt = 0, quietFrames = 0;
  const LAG_ARM_QUIET = 8;      // ~160 ms of silence before a press can be timed
  const LAG_GIVE_UP_MS = 2000;
  const LAG_ON = 0.02;          // peak that counts as the note having started
  let soundfonts = [];

  const send = (m) => ws?.readyState === 1 && ws.send(JSON.stringify(
    { id: Math.random().toString(36).slice(2), type: '', ...m, from: ID, at: Date.now(), seq: seq++ }));

  // ── patch names ──────────────────────────────────────────────────────────
  // Two kinds of instrument, and they need different walks.
  //
  // hexter and the sampled instruments carry a FIXED TABLE — 128 DX7 voices in
  // one flat cartridge, 128 General MIDI programs — which is the same on every
  // board, so it lives here. One continuous number is the whole story: hexter
  // has no banks at all and the GM soundfont has only bank 0 plus 128 for
  // drums, so a separate bank control would be clutter for two instruments out
  // of three.
  //
  // Yoshimi is not like that, and pretending it was is what made its patch
  // buttons do nothing. Its library on this board is 911 instruments in 24
  // banks; the banks are numbered 5, 10, 15 … 120 rather than 0, 1, 2, and the
  // slots inside them are sparse — the Rhodes bank holds 26 patches spread
  // across slots 1…68. Walking 0…127 lands on an empty slot most of the time,
  // and Yoshimi's answer to an empty slot is to carry on playing what it had.
  // So the BOX enumerates, because it is the only end that can see the files,
  // and this page steps through the list it is sent: `voices.list` ->
  // `voices.listed`, and then one entry per press.
  const GM = ('Grand Piano,Bright Piano,Electric Grand,Honky-tonk,Electric Piano 1,Electric Piano 2,Harpsichord,Clavi,'
   + 'Celesta,Glockenspiel,Music Box,Vibraphone,Marimba,Xylophone,Tubular Bells,Dulcimer,'
   + 'Drawbar Organ,Percussive Organ,Rock Organ,Church Organ,Reed Organ,Accordion,Harmonica,Tango Accordion,'
   + 'Nylon Guitar,Steel Guitar,Jazz Guitar,Clean Guitar,Muted Guitar,Overdrive Guitar,Distortion Guitar,Guitar Harmonics,'
   + 'Acoustic Bass,Finger Bass,Pick Bass,Fretless Bass,Slap Bass 1,Slap Bass 2,Synth Bass 1,Synth Bass 2,'
   + 'Violin,Viola,Cello,Contrabass,Tremolo Strings,Pizzicato,Harp,Timpani,'
   + 'String Ens 1,String Ens 2,Synth Strings 1,Synth Strings 2,Choir Aahs,Voice Oohs,Synth Voice,Orchestra Hit,'
   + 'Trumpet,Trombone,Tuba,Muted Trumpet,French Horn,Brass Section,Synth Brass 1,Synth Brass 2,'
   + 'Soprano Sax,Alto Sax,Tenor Sax,Baritone Sax,Oboe,English Horn,Bassoon,Clarinet,'
   + 'Piccolo,Flute,Recorder,Pan Flute,Blown Bottle,Shakuhachi,Whistle,Ocarina,'
   + 'Square Lead,Saw Lead,Calliope,Chiff,Charang,Voice Lead,Fifths,Bass+Lead,'
   + 'New Age Pad,Warm Pad,Polysynth Pad,Choir Pad,Bowed Pad,Metallic Pad,Halo Pad,Sweep Pad,'
   + 'Rain,Soundtrack,Crystal,Atmosphere,Brightness,Goblins,Echoes,Sci-Fi,'
   + 'Sitar,Banjo,Shamisen,Koto,Kalimba,Bagpipe,Fiddle,Shanai,'
   + 'Tinkle Bell,Agogo,Steel Drums,Woodblock,Taiko,Melodic Tom,Synth Drum,Reverse Cymbal,'
   + 'Fret Noise,Breath Noise,Seashore,Bird Tweet,Telephone,Helicopter,Applause,Gunshot').split(',');

  // hexter loads all four DX7 factory cartridges; ROM1A voice 11 is E.PIANO 1,
  // and programs are zero-indexed, so that is program 10.
  const DX7 = ('BRASS 1,BRASS 2,BRASS 3,STRINGS 1,STRINGS 2,STRINGS 3,ORCHESTRA,PIANO 1,PIANO 2,PIANO 3,'
   + 'E.PIANO 1,GUITAR 1,GUITAR 2,SYN-LEAD 1,BASS 1,BASS 2,E.ORGAN 1,PIPES 1,HARPSICH 1,CLAV 1,'
   + 'VIBE 1,MARIMBA,KOTO,FLUTE 1,ORCH-CHIME,TUB BELLS,STEEL DRUM,TIMPANI,REFS WHISL,VOICE 1,TRAIN,TAKE OFF').split(',');

  // The box's own list, when the instrument has one. Empty means "walk the
  // fixed table above".
  let patches = [], banksInList = 0, chosen = false;
  const listed = () => patches.length > 0;

  const bankOf = (i) => (i >> 7) & 63, progOf = (i) => i & 127;
  const span = () => (listed() ? patches.length : current === 'hexter' ? 128 : 48 * 128);
  const patchName = (i) => {
    if (listed()) return patches[i]?.name ?? '—';
    const p = progOf(i);
    if (current === 'hexter') return DX7[p] ?? `voice ${p + 1}`;
    if (current?.startsWith('fluid')) return GM[p] ?? `program ${p}`;
    return `program ${p}`;
  };
  /** Dropdown index -> patch index. They coincide: a listed instrument is
   *  walked by list position, and a fixed table is walked by program within
   *  bank 0, which is the same number. */
  const pickIndex = (i) => i;

  /** The list the dropdown offers. For Yoshimi that is the board's own
   *  enumeration; for a fixed table it is bank 0, which is the only bank whose
   *  programs have names. ⚠️ The ARROWS can still walk past the end of this
   *  into higher banks — `show()` leaves the select alone when the index is
   *  outside it, rather than pointing at the wrong row. */
  function refreshPicker() {
    const names = listed() ? patches.map((e) => e.name ?? '—')
                           : Array.from({ length: 128 }, (_, i) => patchName(i));
    step.options(names, Math.min(idx, names.length - 1));
    step.show(patchName(idx), idx);
  }

  function showPatch() {
    // The NAME lives in the control now, not in a line under it — it was in
    // both, which is the same word twice with nothing to say which is live.
    step.show(patchName(idx), idx);
    if (!chosen && !saidUnchosen && span() > 1) {
      saidUnchosen = true;
      d.log(`${span()} patches on the board. It is playing whatever it loaded at startup, `
        + 'not one this page chose');
    }
  }
  // ⚠️ BANK SELECT IS CC 32 HERE, NOT CC 0. Read from Yoshimi's own config:
  //     MIDI Root CC 0        MIDI Bank CC 32        MIDI Program Change on
  // Sending banks on CC 0 was moving its ROOT DIRECTORY instead, pointing it at
  // roots that do not exist — so every program change after that landed
  // nowhere and patch changing looked broken. CC 0 is left alone entirely.
  //
  // For a listed instrument the bank rides ALONG WITH the program in one
  // message, and the box puts both on the same MIDI byte stream back to back —
  // which is a stronger guarantee than the 120 ms this page used to leave
  // between two separate messages.
  function sendPatch() {
    if (listed()) {
      const e = patches[idx];
      if (!e) return;
      lastBank = e.bank;
      send({ type: 'voice.select', channel: 0, bank: e.bank, program: e.program, name: e.name });
      return;
    }
    const b = bankOf(idx), changed = b !== lastBank;
    if (changed) { send({ type: 'cc', channel: 0, ctrl: 32, value: b }); lastBank = b; }
    setTimeout(() => send({ type: 'voice.select', channel: 0, program: progOf(idx) }), changed ? 120 : 0);
  }

  // ── audio ────────────────────────────────────────────────────────────────
  async function startAudio() {
    if (ctx) return;
    // ⚠️ ASK FOR 48 kHz, BECAUSE NOTHING IN THIS CHAIN RESAMPLES.
    // The box fixes `RATE = 48000` (rig/box/synth.mjs) and the worklet writes
    // those samples straight into a ring drained at the context's own rate. On
    // an output running at 44.1 kHz the pitch is wrong by the ratio AND the
    // ring fills faster than it drains, so the latency guard trims the oldest
    // samples back to the floor several times a second — periodic clicking.
    //
    // And the readout would stay green throughout: its fault cell is frames per
    // second, which is unaffected. That is this project's oldest shape of
    // failure — a stream that looks identical to a working one from every angle
    // except the samples.
    ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000, latencyHint: 'interactive' });
    // A REQUEST, not a guarantee: a browser may hand back its device rate
    // anyway. No readout cell for it — a cell that reads `48000` forever is a
    // constant wearing a measurement's clothes, and it teaches the reader to
    // skip the row. It only speaks when it has something to say.
    if (ctx.sampleRate !== 48000) {
      d.log(`this browser runs audio at ${ctx.sampleRate} Hz and the board sends 48000 — pitch will be off by ${(48000 / ctx.sampleRate).toFixed(3)}x and you will hear clicks`, 'bad');
    }
    // ⚠️ Fire and move on. `resume()` waits on a user gesture in a real browser
    // and NEVER REJECTS, so awaiting it here is a hang rather than an error —
    // it would stop the worklet ever loading and the page would look fine.
    ctx.resume().catch(() => { /* a suspended context is allowed; sound is late, not broken */ });
    await ctx.audioWorklet.addModule('/proto/jam/playout-worklet.js');
    playout = new AudioWorkletNode(ctx, 'pcm-playout', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [1] });
    playout.connect(ctx.destination);
    // 🔴 THE COUNTERS EXISTED ALL ALONG AND NO PAGE HAD EVER READ ONE. They are
    // posted every 250 ms from inside the worklet; `rack` sounded noisy for an
    // hour while six separate measurements said its stream was perfect, because
    // the defect was downstream of every quantity being measured. A statistic
    // nobody displays is not instrumentation.
    playout.port.onmessage = (e) => {
      const st = e.data?.stats; if (!st) return;
      cushionMs = st.bufferedMs;
      d.set('buffer', Math.round(st.bufferedMs));
      const b = st.underruns + st.trimEvents;
      if (b !== breaks) {
        const first = breaks < 0;
        breaks = b;
        // ⚠️ NO CELL OF ITS OWN ANY MORE: it is summed into `lost` where the
        // frames the wire dropped are counted, because both answer one question.
        // The line below is what still tells the two apart, and it is the half
        // that matters: they want OPPOSITE fixes.
        // Two opposite faults, so the LINE says which: running dry wants a
        // bigger cushion and being trimmed wants a smaller one.
        if (!first) d.log(`${st.underruns} ran dry, ${st.trimEvents} trimmed — cushion ${Math.round(st.bufferedMs)} ms`, 'warn');
      }
    };
    // The cushion is OURS, not the browser's — which is the whole reason to
    // carry the samples ourselves rather than use WebRTC. 100 ms adaptive to
    // 250 for the reason measured on `rack`'s path: 60 ms is under the worst
    // single arrival gap this relay produces (108.6 ms), and a cushion has no
    // restoring force, so only a floor that grows when it is proved too small
    // is safe over a long session.
    playout.port.postMessage({ cmd: 'floor', ms: 100, adaptive: true, maxMs: 250 });
  }

  // Drawn IMMEDIATELY rather than on a reply: gating the selector on the box's
  // answer left the page with no buttons at all whenever the box was busy.
  // A radio row: exactly one instrument is armed, and it is armed on load
  // rather than after the first click — a page that shows no selection while
  // something IS playing is lying about its own state.
  // ⚠️ THE BOX NAMES THE SAMPLED INSTRUMENT BY ITS FILE. `audio.started` sends
  // `soundfont: …/FluidR3_GM.sf2` and this page reduced that to `FluidR3_GM` —
  // which never equalled the source name `fluidsynth`, so an equality test
  // armed NOTHING whenever the sampled instrument was the one playing. There is
  // one sampled button now, so anything that is not a known JACK source is it.
  const arm = (name) => {
    if (!instPick) return;
    const src = !name ? null : (name === 'hexter' || name === 'yoshimi') ? name : 'fluidsynth';
    const i = instOpts.findIndex(([, v]) => v.src === src);
    // `set` is QUIET here: arming is reporting what the board says is playing,
    // not choosing — firing onPick would start the instrument all over again.
    if (i >= 0) instPick.set(i, true);
    // Nothing playing has no armed button, and `createChoice` cannot say "none"
    // — so say it here rather than leave a stale one lit.
    else instPick.buttons.forEach((b) => b.setAttribute('aria-pressed', 'false'));
  };
  let instPick = null, instOpts = [];
  function drawInstruments() {
    // 🔴 ONE SEGMENTED GROUP, FROM THE KIT. These were loose flex buttons with
    // a 6 px gap, so three mutually exclusive choices read as three unrelated
    // controls — the exact complaint `choice.mjs` was written to answer, on the
    // page that complaint came from. Worse, the page's own
    // `.pick button[aria-pressed="true"]` then repainted the kit's chosen state
    // for the reverb and chorus rows too: same specificity as
    // `.pos-choice button[aria-pressed="true"]` and later in the cascade, so
    // every `createChoice` on this page silently lost its own look.
    const opts = [];
    instPick?.el.remove();
    instPick = null;
    // 🔴 ONE SAMPLED INSTRUMENT, NOT ONE PER FILE. This drew a button for every
    // soundfont on the board under its raw filename, so the row read
    // `FluidR3_GM` `sf_GMbank` `hexter` `yoshimi` — two of which are the SAME
    // instrument, General MIDI, twice, named after the files they happen to
    // live in. A visitor reading that has to know what a soundfont is before
    // they can tell that two of the four choices are one choice.
    //
    // They are picked between here instead of shown: the fullest General MIDI
    // set wins, because that is the only difference a listener could name.
    const best = soundfonts.slice().sort((a, b) =>
      (/fluidr3/i.test(b.name) ? 1 : 0) - (/fluidr3/i.test(a.name) ? 1 : 0)
      || (b.bytes || 0) - (a.bytes || 0))[0];
    opts.push(['sampled', { src: 'fluidsynth', slow: false, msg:
      best ? { type: 'audio.start', source: 'fluidsynth', soundfont: best.path }
           : { type: 'audio.start', source: 'fluidsynth' } }]);
    for (const k of ['hexter', 'yoshimi']) {
      if (avail && avail[k] === false) continue;
      opts.push([k, { src: k, slow: true, msg: { type: 'audio.start', source: k } }]);
    }
    instOpts = opts;
    instPick = createChoice({
      label: 'instrument',
      options: opts,
      onPick: async (v, label, i) => {
        await startAudio();
        arm(v.src);
        // Starting a JACK instrument takes ten to forty seconds, so the button
        // breathes until the board confirms — a control that just sits there
        // reads as a dead click.
        if (v.slow) { instPick.buttons[i].dataset.busy = '1'; d.log(`${label}: starting`, 'hi'); }
        send({ type: 'audio.stop' });
        setTimeout(() => send(v.msg), 400);
      },
    });
    picks.insertBefore(instPick.el, fxWrap);
    arm(armed);
  }
  let armed = null;
  drawInstruments();

  // ── the keyboard, from the shell ─────────────────────────────────────────
  // ── the space the note falls into ───────────────────────────────────────
  // 🔴 AN INSERT THAT PASSES THE DRY SIGNAL, AND THE DIFFERENCE IS NOTE-OFF.
  // The one that used to sit here REPLACED the signal, so releasing a key
  // swapped one drone for another and every instrument's envelope, attack and
  // patch character were washed out before you heard them. That is why the
  // patch arrows and the die both stopped doing anything audible. A reverb adds
  // a tail, so the note still stops when you let go. `rig/box/README.md` has
  // the rest of that story.
  //
  // ⚠️ THIS IS A CSOUND INSERT ON THE JACK GRAPH, `positron-space`, and it is
  // the one stage between the instrument and the capture that this page can
  // actually reach. It is deliberately not drawn: it would be a fifth box in a
  // container drawn to hold four, and nobody asked for it.
  //
  // ⚠️ THE BOARD RENDERS, THE PAGE SENDS NUMBERS — the same split `mirror` uses
  // for its shader knobs. Nothing is processed in this page: it plays what
  // arrives and no more.
  // ⚠️ `off`, NOT `dry`. This row said `dry · room · hall` beside a chorus row
  // saying `off · light · wide` — the same idea in two words, one of which you
  // have to already know. And it IS off: `mix: 0` with the chorus off sends
  // `on: false`, so the insert comes out of the graph rather than sitting in it
  // doing nothing. One vocabulary across two adjacent controls.
  const SPACE = [
    ['off',  { mix: 0,    room: 0.2, damp: 6000 }],
    ['room', { mix: 0.26, room: 0.35, damp: 7000 }],
    ['hall', { mix: 0.4,  room: 0.8, damp: 4500 }],
  ];
  const CHORUS = [['off', 0], ['light', 0.35], ['wide', 0.7]];
  // ⚠️ BOTH OFF AT THE START, so the first thing you hear is the INSTRUMENT.
  // This opened on `room` — a little reverb by default, on the argument that
  // dry is a test rather than a sound. That argument is about mixing a record;
  // this page exists to let you hear what a Raspberry Pi three hundred metres
  // away is making, and putting an effect in front of it on arrival means the
  // first patch you press is not the patch. Nothing is in the graph until you
  // put it there.
  let spaceAt = 0, chorusAt = 0;

  // ⚠️ `createChoice`, NOT SIX LOOSE BUTTONS. This row built its own by hand and
  // it showed: no grouping, so three choices read as three unrelated controls;
  // the wrong corner on every button; and a `::after` that appended ' on' or
  // ' off' to each one, inherited from when this was a single toggle — so a
  // three-way row rendered `dry off`, `room on`, `off on`. Which one is chosen
  // is already said by colour and by aria-pressed.
  const spaceRow = el('span', 'fx');

  /** One message, the whole state. Clamped again at the far end. */
  function sendSpace() {
    const [, p] = SPACE[spaceAt];
    send({ type: 'fx.space', on: spaceAt > 0 || chorusAt > 0,
           mix: p.mix, room: p.room, damp: p.damp, chorus: CHORUS[chorusAt][1] });
  }
  const spacePick = createChoice({
    // ⚠️ `reverb`, NOT `space`. "Space" is what it does to your ear and "reverb"
    // is what it is called by everyone who has met one; a visitor who knows the
    // word gets no help from the poetic one, and a visitor who does not is no
    // better off either.
    label: 'reverb', options: SPACE.map(([n]) => [n, n]), at: spaceAt,
    onPick: (_v, name, i) => { spaceAt = i; sendSpace(); d.log(`space ${name}`); },
  });
  const chorusPick = createChoice({
    label: 'chorus', options: CHORUS.map(([n]) => [n, n]), at: chorusAt,
    onPick: (_v, name, i) => { chorusAt = i; sendSpace(); d.log(`chorus ${name}`); },
  });
  spaceRow.append(spacePick.el, chorusPick.el);
  spaceRow.hidden = true;             // shown when an instrument that can be wrapped is up
  // ⚠️ A CLASS, NOT INLINE STYLE. This set `display` and `align-items` on the
  // element, and an inline style beats every stylesheet — including the media
  // query that puts these controls full width on a phone, which is why reverb
  // and chorus stayed 113 px wide on a 390 px screen while the row above them
  // went full width. Measured twice before the cause was the style attribute.
  if (controls) { controls.classList.add('fxhost'); controls.append(spaceRow); }
  else d.el.append(spaceRow);

  /**
   * Stamp a key press, but only where the answer would mean something.
   *
   * 🔴 THE GUARD IS THE MEASUREMENT. Arming over a sounding board would time
   * the next frame of a note somebody else is already holding, and report a
   * handful of milliseconds that no press produced. `quietFrames` is how many
   * frames in a row arrived with nothing in them; below that, this press cannot
   * be told apart from the sound already coming back, so it is not timed at all
   * and the cell keeps the last number that was honest.
   */
  function armLag() {
    if (quietFrames < LAG_ARM_QUIET) return;
    pressAt = performance.now();
    quietFrames = 0;
  }

  const kb = createKeyboard(d.el, {
    base: 60,
    onDown: (note) => { armLag(); kb.lightNote(note, true); startAudio().then(() => send({ type: 'note.on', note, vel: 100, channel: 0 })); },
    onUp: (note) => { kb.lightNote(note, false); send({ type: 'note.off', note, channel: 0 }); },
    // The keyboard releases what IT is holding; the board may be holding notes
    // this page never pressed — one sent over MIDI, or by somebody else in the
    // room — so the button has to reach the board as well.
    onPanic: () => send({ type: 'note.panic' }),
    onOctave: (n) => d.log(`octave: base note ${n} (${['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][n % 12]}${Math.floor(n / 12) - 1})`),
  });

  // A real keyboard, where there is one — the shared component, so the
  // velocity-0 rule and the hot-plug listener live in one place.
  const midi = createMidi({
    onDown: (note, vel) => { armLag(); kb.lightNote(note, true); startAudio().then(() => send({ type: 'note.on', note, vel, channel: 0 })); },
    onUp: (note) => { kb.lightNote(note, false); send({ type: 'note.off', note, channel: 0 }); },
    log: (line, kind) => d.log(line, kind),
    // A capability, said once, in words. It was a cell reading `1` forever.
    onPorts: (n) => d.log(n ? `${n} MIDI input${n > 1 ? 's' : ''} — play it` : 'no MIDI keyboard attached; the drawn keys and the a-to-k row still play', n ? 'hi' : 'info'),
  });

  // ── the socket ───────────────────────────────────────────────────────────
  function connect() {
    ws = new WebSocket(`${RELAY}/room/${ROOM}/ws`);
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => {
      d.log(`joined ${ROOM}`, 'hi');
      // 🔴 THIS PAGE ASKS THE BOARD FOR NOTHING IT CANNOT CONTROL, AND THAT IS
      // A CHANGE. It used to send one message about an effect it did not draw
      // and had no switch for, to clear one left behind by another page. The
      // BOARD does that for itself now. It drops an effect whose page has
      // stopped talking, so nothing here has to police somebody else's tab.
      // `rig/box/box.mjs` holds that rule and `rig/box/insert-test.mjs` grades
      // it; `rig/box/README.md` says what left this page and why.
      send({ type: 'sf.list' });
      send({ type: 'audio.status' });
    };
    // The relay's Durable Object can be restarted under us; without this the
    // page keeps its buttons and answers nobody, which looks like a dead box.
    ws.onclose = () => { d.log('socket closed — reconnecting'); setTimeout(connect, 1000); };
    ws.onerror = () => {};
    ws.onmessage = (e) => {
      if (typeof e.data !== 'string') {
        const s = new DataView(e.data).getUint32(0, true);
        if (last >= 0 && s > last + 1) lost += s - last - 1;
        last = s; frames++;
        if (!firstFrame) firstFrame = performance.now();
        const pcm = new Int16Array(e.data, 12);
        const f32 = new Float32Array(pcm.length);
        let sum = 0, peak = 0;
        for (let i = 0; i < pcm.length; i++) {
          f32[i] = pcm[i] / 32768; sum += f32[i] * f32[i];
          const a = f32[i] < 0 ? -f32[i] : f32[i];
          if (a > peak) peak = a;
        }
        bytes += e.data.byteLength;
        /**
         * 🔴 PRESS TO SOUND, CLOSED HERE, ON THE FRAME THAT CARRIES THE NOTE.
         * `+ cushionMs` because this frame has ARRIVED and has not been heard:
         * the playout is deliberately holding that much audio in front of it.
         * Reporting arrival alone would flatter the number by the whole cushion,
         * which is the same mistake as quoting a candidate pair RTT as media
         * latency, and this repo has made that one before.
         */
        if (peak < LAG_ON) quietFrames++;
        else {
          if (pressAt) {
            d.set('lag', Math.round(performance.now() - pressAt + cushionMs));
            pressAt = 0;
          }
          quietFrames = 0;
        }
        if (pressAt && performance.now() - pressAt > LAG_GIVE_UP_MS) pressAt = 0;
        if (frames % 10 === 0) {
          const secs = (performance.now() - firstFrame) / 1000;
          // ⚠️ ONE CELL FOR BOTH KINDS OF MISSING, and the log is where they are
          // told apart. `lost` is frames the wire never delivered; `breaks` is
          // the playout running dry. A reader wants to know whether what they
          // are hearing is intact, which is one question.
          const gone = lost + Math.max(0, breaks);
          d.set('lost', gone, gone ? 'bad' : 'ok');
          // 50/s is one clean source. Anything above it is TWO instruments
          // streaming into one socket, which is what a garbled stream sounds
          // like — so this cell is a fault detector, not decoration.
          const fps = frames / Math.max(0.001, secs);
          // The guard without the cell — see the readout comment. Two sources
          // interleaved into one socket reads as roughly double the rate, and
          // that is the only thing this number has ever had to say.
          if (Math.abs(fps - 50) >= 6 && !rateWarned) {
            rateWarned = true;
            d.log(`${fps.toFixed(1)} frames a second arriving where one clean source is 50 — `
                  + (fps > 56 ? 'that is two instruments streaming at once' : 'frames are going missing'), 'bad');
          }
          /**
           * 🔴 FRAMES A SECOND, AND THIS CELL HAS NOW BEEN REMOVED AND PUT BACK
           * TWICE. It went because it read `50.1` on every run of every day, and
           * a cell that never moves teaches a reader to skip the row. `lag` took
           * its place on 2026-09-16 and lasted about twenty minutes: *"what is
           * lag? its empty. replace?"*, then *"frames/s was ok"*.
           *
           * ⚠️ AND `lag` WAS RIGHT TO GO, FOR A REASON WORTH KEEPING. It is half
           * a round trip plus the cushion, and the round trip comes from a ping
           * the BOARD answers. With no board there, or before the first pong,
           * there is nothing to print, so the honest value is an em dash. A cell
           * whose normal state on a page nobody has connected is blank is worse
           * than a constant: a constant at least says the machine is running.
           * The lag is still computed and still in the log when it matters.
           */
          d.set('frames/s', fps.toFixed(1));
        }
        playout?.port.postMessage({ pcm: f32 }, [f32.buffer]);
        return;
      }
      let m; try { m = JSON.parse(e.data); } catch { return; }
      if (m.from === ID) return;
      // ONE CLOCK, both stamps: the box's performance.now() and ours share no
      // origin, so this is timed entirely here and contains no clock offset.
      // The ping still runs — it is how this page knows the board is answering
      // at all — it just has no cell of its own any more.
      if (m.type === 'box.pong' && pingAt) { rtt = Math.round(performance.now() - pingAt); pingAt = 0; }
      if (m.type === 'box.hello') { avail = m.instruments ?? null; drawInstruments(); send({ type: 'sf.list' }); }
      if (m.type === 'sf.listed') { soundfonts = m.soundfonts || []; drawInstruments(); }
      // The box's own library. It arrives once per instrument change and is
      // ~34 KB for Yoshimi, well inside the relay's 256 KiB per message.
      if (m.type === 'voices.listed') {
        if (m.source !== current) { /* an answer about an instrument we left */ }
        else if (m.ok && m.banks?.length) {
          patches = [];
          for (const b of m.banks) for (const p of b.patches)
            patches.push({ bank: b.bank, bankName: b.name, program: p.program, name: p.name });
          banksInList = m.bankCount ?? m.banks.length;
          idx = 0; lastBank = -1;
          refreshPicker();
          showPatch();
          d.log(`${m.source}: ${patches.length} patches in ${m.bankCount} banks`, 'hi');
          // The board checked its own bank map against its own files. Saying
          // nothing here would leave a list that is quietly wrong looking
          // exactly like one that is right.
          if (m.stale) d.log('the board\'s bank list disagrees with the files on its disk', 'bad');
        }
        // `fixed` means the instrument simply has no library to read and this
        // page's own table is the right answer — not a failure worth a line.
        else if (m.reason && !m.fixed) d.log(`patches: ${m.reason}`, 'bad');
      }
      // Somebody chose a patch — this page, or another listener in the same
      // room. Following it is what keeps two people looking at one instrument.
      if (m.type === 'voice.selected' && m.ok && listed()) {
        const at = patches.findIndex((p) => p.bank === m.bank && p.program === m.program);
        if (at >= 0) { idx = at; chosen = true; showPatch(); }
      }
      if (m.type === 'audio.started') {
        for (const c of picks.querySelectorAll('button')) delete c.dataset.busy;
        // Nothing playing on arrival: start the cheap instrument rather than
        // present a page where every control does nothing until you guess that
        // one of the buttons is a prerequisite.
        if (!m.ok && m.reason === 'nothing playing' && !autoStarted) {
          autoStarted = true;
          d.log('nothing was playing — starting the sampled instrument', 'hi');
          send({ type: 'audio.start', source: 'fluidsynth' });
          return;
        }
        if (m.ok) {
          current = m.source; lastBank = -1;
          // Arm by what the BOX reports, not by what was clicked — the box is
          // the authority on which instrument is sounding, and a page that
          // joins mid-session has clicked nothing.
          armed = m.soundfont ? m.soundfont.replace(/.*\//, '').replace(/\.sf[23]$/i, '') : m.source;
          arm(armed);

          // An insert can only reach a JACK instrument. FluidSynth writes to a
          // ⚠️ ASK THE BOX, DO NOT KEEP A LIST. This was a list of instrument
          // names, so every new source meant remembering to add it here — and
          // forgetting meant a control that silently refused to arm on a page
          // that could not say why. Whether an insert can wrap something is a
          // property of the SOURCE, and the box reports it.
          spaceRow.hidden = m.jack === false;
          if (m.jack === false) d.log(`${m.source} writes to a pipe rather than to the audio graph the reverb sits on, so there is no space to put it in`, 'warn');
          else sendSpace();
          // A new instrument means a new library. Drop the old one FIRST, or
          // the arrows keep walking the previous instrument's list until the
          // reply lands — stepping through names that belong to something else.
          patches = []; idx = 0; banksInList = 0; chosen = false;
          // The fixed table belongs to the instrument that just came up, so the
          // dropdown has to be rebuilt even when no list arrives.
          refreshPicker();
          showPatch();
          send({ type: 'voices.list', source: m.source });
          d.log(`playing ${m.source}`, 'hi');
        }
        // ⚠️ NOT `d.set('playing', ...)`. There is no `playing` cell — the shell
        // catches it and logs "readout 'playing' was not declared in mount()",
        // which is what a visitor saw instead of the reason the start failed.
        else d.log(`failed: ${m.reason}`, 'bad');
      }
    };
  }
  // z / x shift the octave too, because a keyboard player's hands are already
  // on the keys and reaching for a 26 px button under them is a lost note. The
  // pad's own buttons and the log line are the keyboard's — see `onOctave`.
  addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
    const k = e.key.toLowerCase();
    if (k === 'z' || k === 'x') kb.shiftOctave(k === 'z' ? -1 : 1);
  });

  // Steering round trip, every few seconds. This is the CONTROL plane, not the
  // audio: what a key press costs to reach the board, before anything is made.
  setInterval(() => { if (ws?.readyState === 1 && !pingAt) { pingAt = performance.now(); send({ type: 'box.ping' }); } }, 4000);

  showPatch();
  connect();
  d.ready();

  /**
   * 🔴 HOW IT WORKS, LAST ON THE PAGE. Asked for 2026-09-16: *"add diagram to
   * box demo"*. Three machines, and the one worth seeing is the middle one: a
   * key press and the sound it makes cross the same relay in opposite
   * directions, so nothing here needs a port open on either end.
   */
  const dg = createDiagram(d.el, {
    caption: 'A key press goes out through Cloudflare to a Raspberry Pi in another building, '
      + 'and the sound it makes comes back the same way. Neither end needs an address the '
      + 'other can reach.',
    nodes: [
      // 🔴 `join: false`: THE KEYBOARD DOES NOT FEED THE PLAYOUT, AND NOTHING
      // IS DRAWN BETWEEN THEM. Inner boxes get
      // an arrowhead by default since 2026-09-16, and the first thing that rule
      // did on this page was draw a head from `keyboard` down to `playout`,
      // reported as *"why keyboard controls playout? it should get data from
      // cf"*. Correct: what these two share is a browser, not a signal. One
      // sends, the other receives, and both talk to Cloudflare.
      { id: 'you', label: 'Browser', sub: 'phone or laptop', kind: 'here', tech: 'browser',
        join: false,
        children: [
          { id: 'keys', label: 'keyboard', sub: 'keys or MIDI',
            note: 'The keys on screen, and any USB controller the **Web MIDI** API offers. '
                + 'Both send the same note number, so the board cannot tell them apart.' },
          { id: 'out', label: 'playout', sub: 'AudioWorklet',
            note: 'Holds a cushion of audio before playing any of it, because packets over '
                + 'the open internet do not arrive evenly spaced. The **buffer** cell is how '
                + 'much it is holding right now.' },
        ] },
      /**
       * 🔴 ONE OBJECT, DRAWN AS TWO BOXES, AND THE SUB SAYS SO. Suggested in
       * those words after the first version was unreadable: *"perhaps split cf
       * relay into 2 for clarity"*. With a single `relay` box both directions
       * met in one node, so the outward arrow and the return arrow shared a
       * point and the return had to be drawn looping back under the row, which
       * arrived at `playout` as a stub from nowhere: *"what is this thing on
       * left of playout?"* and *"how sound gets back from pi to browser? no
       * connector on this"*.
       *
       * ⚠️ IT IS NOT TWO RELAYS AND THE PICTURE MUST NOT SAY IT IS. It is one
       * Durable Object on one socket, carrying traffic both ways, and that is
       * in the container's `sub` and in both notes. A drawing may split a thing
       * by ROLE to be read; it may not invent a second machine.
       */
      { id: 'cf', label: 'Cloudflare', sub: 'one object, 2 ways', kind: 'cloud',
        tech: 'cloudflare', join: false,
        children: [
          // 🔴 NAMES, NOT DIRECTIONS. These read `notes out` and `sound back`
          // and were reported as *"not good names"*, correctly: CLAUDE.md says a
          // box label is a NAME, and those two were captions describing which
          // way the traffic goes. What each box IS, is the room carrying one
          // kind of traffic, so the label is the traffic and the sub is the
          // thing: `Relay` is the Durable Object's own class name in
          // `workers/relay`, which is what it is CALLED rather than what it does.
          { id: 'down', label: 'notes', sub: 'Relay object',
            note: 'Copies each key press on to the board. One object per room, addressed by '
                + 'name, so both ends dial out to it and neither needs a port open.' },
          { id: 'up', label: 'audio', sub: 'Relay object',
            note: 'The same object and the same socket as the box above, drawn separately '
                + 'because one box carrying both directions could not be read.' },
        ] },
      /**
       * 🔴 THREE INSTRUMENTS, NOT ONE BOX CALLED `instruments`, AND `set: true`
       * BECAUSE THEY ARE ALTERNATIVES. Asked for 2026-09-16: *"can we sampled
       * (renamed to the collection name), hexter, yoshimi side by side in pi
       * box"*. Exactly one of them is up at any moment, so a default arrowhead
       * between them would claim that `FluidR3 GM` feeds `hexter`. A bracket
       * says they are parts of one machine, which is the true statement.
       *
       * ⚠️ `capture` IS THE EXCEPTION AND IT IS DECLARED. Each instrument has a
       * link to it, so the gap `yoshimi` shares with it gets an arrow rather
       * than a bracket and the other two run as lanes inside the container.
       * `dg.ties` is 2, which is what the two bracketed gaps are.
       *
       * ⚠️ AND THE NOTE ARROW LANDS ON THE MACHINE, NOT ON A BOX. A note goes
       * to whichever instrument is running, which the picture cannot know, so
       * pointing it at one of the three would be a guess drawn as a fact.
       */
      { id: 'pi', label: 'Raspberry Pi', sub: 'another building', kind: 'device', tech: 'board',
        set: true,
        children: [
          // 🔴 THE COLLECTION, BY NAME. The button on this page says `sampled`,
          // because one button beats four filenames a visitor has to know what
          // a soundfont is to read. The picture has room for the real thing:
          // 141 MB of General MIDI, and the board prefers this file over
          // anything else it finds.
          { id: 'sf', label: 'FluidR3 GM', sub: 'FluidSynth',
            note: 'The 128 General MIDI programs and a drum bank, 141 MB of samples played by '
                + '**FluidSynth** as a JACK client. It is loaded whole, because FluidSynth '
                + 'streams nothing from disk.' },
          { id: 'hexter', label: 'hexter', sub: 'DSSI, DX7',
            note: 'A Yamaha DX7 with its four factory ROM cartridges, 128 voices, run under '
                + '**jack-dssi-host**. Six-operator FM, so a patch is a set of ratios and '
                + 'envelopes rather than a recording.' },
          { id: 'yoshimi', label: 'yoshimi', sub: 'ZynAddSubFX',
            note: 'A fork of **ZynAddSubFX** carrying 911 patches in 24 banks on this board. '
                + 'The board enumerates them and sends the list, because it is the only end '
                + 'that can see the files.' },
          { id: 'cap', label: 'capture', sub: 'ffmpeg, JACK',
            note: '**ffmpeg** reads the JACK client the running instrument is wired into and '
                + 'writes raw 16-bit samples at 48 kHz. Many ports into one input sum, so a '
                + 'stereo instrument arrives here as one channel.' },
        ] },
    ],
    // 🔴 ONE WAY ROUND, AND IT IS A RING. Out along the top: keys, notes, the
    // board. Down the board: whichever instrument is up, then capture. Back
    // along the bottom: audio, playout. Every arrow points the way the signal
    // actually travels, and nothing meets in the middle.
    links: [
      { from: 'keys', to: 'down', label: 'note on/off',
        note: 'A few bytes of JSON per key, over a **WebSocket**. Half the round trip of one '
            + 'of these is half of what the **lag** cell reports.' },
      { from: 'down', to: 'pi', label: 'note on/off',
        note: 'The same message, copied on. The board writes it as raw MIDI bytes to a '
            + '**snd-virmidi** device, which **aconnect** has already routed to whichever '
            + 'instrument is up.' },
      // ⚠️ NO LABELS INSIDE A CONTAINER. The gap two stacked children share is
      // sixteen pixels tall, so a name in it runs under both boxes;
      // `createDiagram` refuses one and reports it. What travels is in the note.
      { from: 'sf', to: 'cap',
        note: 'Audio on the **JACK** graph, inside the board. Nothing crosses a network here '
            + 'and nothing is encoded.' },
      { from: 'hexter', to: 'cap',
        note: 'The same wire, made by one **jack_connect** when the instrument came up. Only '
            + 'one of the three is running, so only one of these carries anything.' },
      { from: 'yoshimi', to: 'cap',
        note: 'Both channels of a stereo instrument go into the one input, which is what '
            + 'makes the mono that comes back a sum rather than the left side.' },
      // ⚠️ NO LABEL ON THE RETURN PATH. It runs back under the row rather than
      // between two boxes, and `createDiagram` reported both of these at a width
      // of -444: there is no room there for a name. The box it arrives at is
      // called `sound back`, which is the label, in the one place it fits.
      // 🔴 `back: true` ON BOTH RETURN LINKS, AND WITHOUT IT THE PICTURE WAS
      // UNREADABLE. It is an AUTHOR flag, not something the layout works out: a
      // link with no `back` is placed as a forward step, so these two were laid
      // out left to right while pointing right to left, which drew a line
      // straight through `playout` and put its head on the far left of the
      // Browser. Reported as *"what is this thing on left of playout?"* and
      // *"how sound gets back from pi to browser? no connector on this"*.
      // Flagged, they run in a lane under the row and arrive at the bottom edge.
      { from: 'cap', to: 'up', back: true,
        note: 'Twenty milliseconds of samples at a time, declared with a channel count: a '
            + 'frame cannot be read without one, since the same bytes are a valid mono frame '
            + 'and a valid stereo one.' },
      { from: 'up', to: 'out', back: true,
        note: 'Straight into the cushion. The other half of the **lag** cell is how much '
            + 'audio that cushion holds back before any of it is heard.' },
    ],
  }, { how: true, atEnd: true });
  // 🔴 THE PICTURE SAYS WHAT IT COULD NOT DRAW. `/box/` is `built: false`, so no
  // harness ever opens it and there is nothing to turn red: a label that had to
  // be shortened or a link that could not be routed would otherwise be invisible
  // to the one person who can fix it. A log line is the only channel this page
  // has, so it uses it, and only when there is something to say.
  if (dg.cuts.length) {
    d.log(`the diagram could not draw ${dg.cuts.length} thing(s): `
      + dg.cuts.map((c) => `${c.where} ${c.id}`).join(' · '), 'warn');
  }
  window.__dg = () => ({ cuts: dg.cuts, ties: dg.ties, mode: dg.mode });
</script>
</html>
