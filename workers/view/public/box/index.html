<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>listen to the box</title>
<style>
  :root { color-scheme: dark; --bg:#0b0e14; --fg:#c9d1d9; --dim:#7d8590; --hi:#7ee787; --line:#21262d; }
  body { background:var(--bg); color:var(--fg); font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; margin:0; padding:24px; }
  h1 { font-size:15px; font-weight:600; margin:0 0 4px; }
  p  { color:var(--dim); margin:0 0 20px; max-width:46rem; }
  button { background:#161b22; color:var(--fg); border:1px solid var(--line); border-radius:6px;
           padding:7px 12px; font:inherit; cursor:pointer; margin:0 6px 6px 0; }
  button:hover { border-color:var(--hi); }
  button.on { background:var(--hi); color:#0b0e14; border-color:var(--hi); }
  .row { margin:0 0 16px; }
  .lab { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.08em; margin:0 0 6px; }
  #keys { display:flex; gap:3px; margin:14px 0 20px; flex-wrap:wrap; }
  #keys button { width:46px; height:64px; margin:0; }
  #keys button.black { background:#0d1117; color:var(--dim); }
  #keys button.lit { background:var(--hi); color:#0b0e14; }
  .pill { display:inline-block; min-width:16ch; text-align:center; color:var(--hi); }
  .pill.small { min-width:4ch; }
  table { border-collapse:collapse; font-size:13px; }
  td { padding:2px 18px 2px 0; } td.k { color:var(--dim); }
  #log { color:var(--dim); font-size:12px; white-space:pre-wrap; margin-top:18px; max-height:7em; overflow:auto; }
  input[type=range] { vertical-align:middle; }
</style>
<h1>listen to the box</h1>
<p>The instrument is a Raspberry Pi somewhere else. It makes the sound; this page just plays what
arrives and sends your keys back. Play with <b>a w s e d f t g y h u j k</b>, <b>z</b>/<b>x</b> for octaves.</p>

<div class="row">
  <div class="lab">instrument</div>
  <span id="sfs"></span>
</div>

<div class="row">
  <div class="lab">patch</div>
  <button id="pprev">◀</button>
  <span id="pname" class="pill">—</span>
  <button id="pnext">▶</button>
  <span style="margin-left:20px;color:var(--dim)">bank</span>
  <button id="bprev">◀</button><span id="bnum" class="pill small">0</span><button id="bnext">▶</button>
</div>

<div id="keys"></div>

<div class="row" id="filter" hidden>
  <div class="lab">filter — cc 74 / 71</div>
  <label>cutoff <input id="cut" type="range" min="0" max="127" value="64"></label>
  <label style="margin-left:18px">resonance <input id="res" type="range" min="0" max="127" value="64"></label>
</div>
<table>
  <tr><td class="k">playing</td><td id="src">nothing yet</td><td class="k">frames</td><td id="frames">0</td></tr>
  <tr><td class="k">dropped</td><td id="lost">0</td><td class="k">level</td><td id="rms">—</td></tr>
</table>
<div id="log"></div>

<script type="module">
const q = new URLSearchParams(location.search);
const ROOM = q.get('room') || 'studio-1';
const RELAY = q.get('relay') || 'wss://ws.positron.studio';
const ID = 'web-' + Math.random().toString(36).slice(2, 8);
const $ = (id) => document.getElementById(id);
const log = (s) => { $('log').textContent = (s + '\n' + $('log').textContent).slice(0, 900); };

let ctx = null, playout = null, ws = null, seq = 0;
let frames = 0, lost = 0, last = -1, avail = null, current = null, prog = 0, bank = 0;

const send = (m) => ws?.readyState === 1 && ws.send(JSON.stringify(
  { id: Math.random().toString(36).slice(2), type: '', ...m, from: ID, at: Date.now(), seq: seq++ }));

// ── patch names ────────────────────────────────────────────────────────────
// A program number means something different on each instrument, so the name
// has to come from whichever one is running. Yoshimi's banks are the user's
// own, so there it stays a number and says so.
const GM = ('Grand Piano,Bright Piano,Electric Grand,Honky-tonk,Electric Piano 1,Electric Piano 2,Harpsichord,Clavi,'
 + 'Celesta,Glockenspiel,Music Box,Vibraphone,Marimba,Xylophone,Tubular Bells,Dulcimer,'
 + 'Drawbar Organ,Percussive Organ,Rock Organ,Church Organ,Reed Organ,Accordion,Harmonica,Tango Accordion,'
 + 'Nylon Guitar,Steel Guitar,Jazz Guitar,Clean Guitar,Muted Guitar,Overdrive Guitar,Distortion Guitar,Guitar Harmonics,'
 + 'Acoustic Bass,Finger Bass,Pick Bass,Fretless Bass,Slap Bass 1,Slap Bass 2,Synth Bass 1,Synth Bass 2,'
 + 'Violin,Viola,Cello,Contrabass,Tremolo Strings,Pizzicato,Harp,Timpani,'
 + 'String Ens 1,String Ens 2,Synth Strings 1,Synth Strings 2,Choir Aahs,Voice Oohs,Synth Voice,Orchestra Hit,'
 + 'Trumpet,Trombone,Tuba,Muted Trumpet,French Horn,Brass Section,Synth Brass 1,Synth Brass 2,'
 + 'Soprano Sax,Alto Sax,Tenor Sax,Baritone Sax,Oboe,English Horn,Bassoon,Clarinet,'
 + 'Piccolo,Flute,Recorder,Pan Flute,Blown Bottle,Shakuhachi,Whistle,Ocarina,'
 + 'Square Lead,Saw Lead,Calliope,Chiff,Charang,Voice Lead,Fifths,Bass+Lead,'
 + 'New Age Pad,Warm Pad,Polysynth Pad,Choir Pad,Bowed Pad,Metallic Pad,Halo Pad,Sweep Pad,'
 + 'Rain,Soundtrack,Crystal,Atmosphere,Brightness,Goblins,Echoes,Sci-Fi,'
 + 'Sitar,Banjo,Shamisen,Koto,Kalimba,Bagpipe,Fiddle,Shanai,'
 + 'Tinkle Bell,Agogo,Steel Drums,Woodblock,Taiko,Melodic Tom,Synth Drum,Reverse Cymbal,'
 + 'Fret Noise,Breath Noise,Seashore,Bird Tweet,Telephone,Helicopter,Applause,Gunshot').split(',');

// The DX7's factory cartridges, in their original order. hexter loads all four
// (128 voices); ROM1A voice 11 is E.PIANO 1, and programs are zero-indexed.
const DX7 = ('BRASS 1,BRASS 2,BRASS 3,STRINGS 1,STRINGS 2,STRINGS 3,ORCHESTRA,PIANO 1,PIANO 2,PIANO 3,'
 + 'E.PIANO 1,GUITAR 1,GUITAR 2,SYN-LEAD 1,BASS 1,BASS 2,E.ORGAN 1,PIPES 1,HARPSICH 1,CLAV 1,'
 + 'VIBE 1,MARIMBA,KOTO,FLUTE 1,ORCH-CHIME,TUB BELLS,STEEL DRUM,TIMPANI,REFS WHISL,VOICE 1,TRAIN,TAKE OFF,'
 + 'ROM1B 1,ROM1B 2,ROM1B 3,ROM1B 4,ROM1B 5,ROM1B 6,ROM1B 7,ROM1B 8').split(',');

const patchName = (p) => {
  if (current === 'hexter') return DX7[p] ?? ('voice ' + (p + 1));
  if (current && current.startsWith('fluid')) return GM[p] ?? ('program ' + p);
  return 'program ' + p;                 // yoshimi: the bank is the user's own
};
const showPatch = () => { $('pname').textContent = `${prog}· ${patchName(prog)}`; };

// ── audio ──────────────────────────────────────────────────────────────────
async function startAudio() {
  if (ctx) return;
  ctx = new AudioContext({ latencyHint: 'interactive' });
  await ctx.resume();
  await ctx.audioWorklet.addModule('/proto/jam/playout-worklet.js');
  playout = new AudioWorkletNode(ctx, 'pcm-playout', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [1] });
  playout.connect(ctx.destination);
  playout.port.postMessage({ cmd: 'floor', ms: 60, adaptive: false });
}

function connect() {
  ws = new WebSocket(`${RELAY}/room/${ROOM}/ws`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { log(`joined ${ROOM}`); send({ type: 'sf.list' }); };
  ws.onclose = () => { log('socket closed — reconnecting'); setTimeout(connect, 1000); };
  ws.onerror = () => {};
  ws.onmessage = (e) => {
    if (typeof e.data !== 'string') {
      const s = new DataView(e.data).getUint32(0, true);
      if (last >= 0 && s !== last + 1 && s > last) lost += s - last - 1;
      last = s; frames++;
      const pcm = new Int16Array(e.data, 12);
      const f32 = new Float32Array(pcm.length);
      let sum = 0;
      for (let i = 0; i < pcm.length; i++) { f32[i] = pcm[i] / 32768; sum += f32[i] * f32[i]; }
      if (frames % 10 === 0) {
        $('frames').textContent = frames; $('lost').textContent = lost;
        $('rms').textContent = Math.sqrt(sum / pcm.length).toFixed(3);
      }
      playout?.port.postMessage({ pcm: f32 }, [f32.buffer]);
      return;
    }
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.from === ID) return;
    if (m.type === 'box.hello') { avail = m.instruments ?? null; drawInstruments(); send({ type: 'sf.list' }); }
    if (m.type === 'sf.listed') { soundfonts = m.soundfonts || []; drawInstruments(); }
    if (m.type === 'audio.started') {
      if (m.ok) {
        current = m.source;
        $('src').textContent = m.soundfont ? m.source + ' · ' + m.soundfont.split('/').pop() : m.source;
        $('filter').hidden = (current !== 'yoshimi');
        showPatch();
      }
      else { $('src').textContent = 'failed: ' + m.reason; }
      [...$('sfs').children].forEach((c) => { c.textContent = c.textContent.replace(' …', ''); });
      log(m.ok ? `playing ${m.source}` : `failed: ${m.reason}`);
    }
  };
}

// ── instruments ────────────────────────────────────────────────────────────
// Drawn IMMEDIATELY, not on a reply. Gating the whole selector on sf.listed
// meant a busy box left the page with no buttons at all.
let soundfonts = [];
function drawInstruments() {
  const host = $('sfs'); host.textContent = '';
  const mk = (label, msg, slow) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = async () => {
      await startAudio();
      [...host.children].forEach((c) => c.classList.remove('on'));
      b.classList.add('on');
      if (slow) { b.textContent = label + ' …'; log(`${label}: starting, ~13s`); }
      send({ type: 'audio.stop' });
      setTimeout(() => send(msg), 400);
    };
    host.append(b);
  };
  if (soundfonts.length) for (const sf of soundfonts) mk(sf.name, { type: 'audio.start', source: 'fluidsynth', soundfont: sf.path });
  else mk('sampled (general midi)', { type: 'audio.start', source: 'fluidsynth' });
  for (const [k, label] of [['hexter', 'hexter — the real DX7'], ['yoshimi', 'yoshimi']]) {
    if (avail && avail[k] === false) continue;
    mk(label, { type: 'audio.start', source: k }, true);
  }
}
drawInstruments();

// ── patch / bank ───────────────────────────────────────────────────────────
const setProg = (d) => { prog = (prog + d + 128) % 128; showPatch(); send({ type: 'voice.select', channel: 0, program: prog }); };
const setBank = (d) => {
  bank = Math.max(0, Math.min(63, bank + d));
  $('bnum').textContent = bank;
  send({ type: 'cc', channel: 0, ctrl: 0, value: bank });     // bank select MSB
  setTimeout(() => send({ type: 'voice.select', channel: 0, program: prog }), 120);
};
$('pprev').onclick = () => setProg(-1);
$('pnext').onclick = () => setProg(1);
$('bprev').onclick = () => setBank(-1);
$('bnext').onclick = () => setBank(1);
for (const [id, ctrl] of [['cut', 74], ['res', 71]])
  $(id).addEventListener('input', () => send({ type: 'cc', channel: 0, ctrl, value: +$(id).value }));

// ── keys ───────────────────────────────────────────────────────────────────
const BLACK = { 1:1, 3:1, 6:1, 8:1, 10:1 };
const NAME = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const QWERTY = { a:0, w:1, s:2, e:3, d:4, f:5, t:6, g:7, y:8, h:9, u:10, j:11, k:12 };
const LABEL = Object.fromEntries(Object.entries(QWERTY).map(([k, v]) => [v, k]));
const buttons = new Map();
let base = 60;

const light = (off, on) => buttons.get(off)?.classList.toggle('lit', on);
async function noteOn(off, vel = 100) { await startAudio(); light(off, true); send({ type: 'note.on', note: base + off, vel, channel: 0 }); }
function noteOff(off) { light(off, false); send({ type: 'note.off', note: base + off, channel: 0 }); }

const drawKey = (b, off) => { b.innerHTML = `${NAME[(base + off) % 12]}<br><span style="opacity:.5">${LABEL[off] ?? ''}</span>`; };
for (let off = 0; off <= 12; off++) {
  const b = document.createElement('button');
  if (BLACK[off % 12]) b.classList.add('black');
  drawKey(b, off);
  b.addEventListener('pointerdown', () => noteOn(off));
  b.addEventListener('pointerup', () => noteOff(off));
  b.addEventListener('pointerleave', () => noteOff(off));
  buttons.set(off, b);
  $('keys').append(b);
}
const held = new Set();
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'z' || k === 'x') { base = Math.max(24, Math.min(96, base + (k === 'z' ? -12 : 12)));
    buttons.forEach(drawKey); log('octave: base ' + base); return; }
  const off = QWERTY[k];
  if (off === undefined || e.repeat || held.has(off)) return;   // repeat = a machine gun
  held.add(off); e.preventDefault(); noteOn(off);
});
addEventListener('keyup', (e) => { const off = QWERTY[e.key.toLowerCase()]; if (off === undefined) return; held.delete(off); noteOff(off); });
addEventListener('blur', () => { for (const o of held) noteOff(o); held.clear(); });

showPatch();
connect();
</script>
