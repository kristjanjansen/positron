<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/slides/deck.css">

<script type="module">
  // The sample and the system. Every slide engine piece (rendering, the scale,
  // the faces, the marks, navigation, keys, full screen, notes, the checks)
  // lives in /slides/deck.mjs and /slides/deck.css since 2026-10-05, shared
  // with /talk/. What is left here is the talk itself.
  import { mount, guard } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createDeck, checkDeck, liveDiagram, livePicture, liveSteps, liveReadout } from '/slides/deck.mjs';

  const d = mount({
    name: 'slides',
    what: 'A talk made of slides that hold running parts of this site, stepped inside a panel that fills the screen when you present.',
    readout: null,
    controls: [],
  });
  guard(d);

  /**
   * The machines, as `diagram.mjs` draws them. Declared here rather than
   * inside the live element because the words on other slides take their hue
   * from the same boxes: `createDeck` reads its `hues` off this, so a box that
   * changes its `tech` changes the word on every slide with it. Each note
   * names other boxes in **bold**, which the diagram draws in that box's hue,
   * and that rendered word is what the self-check compares the slides against.
   * A top level box's `desc` is what the box is, set by the deck as slide text
   * under its column; the diagram itself draws names only (deck.mjs,
   * `liveDiagram`, asked 2026-10-05: *"do not use diagram native descs below
   * but use slides text and postion"*).
   */
  const MACHINES = {
    nodes: [
      { id: 'br', label: 'Browser', kind: 'here', tech: 'browser', desc: 'one page from the kit',
        children: [
          { id: 'pg', label: 'page', tech: 'browser',
            note: 'Every demo is one HTML page that mounts the shell and the kit, and grades '
                + 'itself when the harness asks.' },
        ] },
      { id: 'cf', label: 'Cloudflare', tech: 'cloudflare', set: true, desc: 'a relay and Stream',
        children: [
          // 1 to 2 ms: PROGRESS.md:3472, the DO hop MEASURED +1.0, +1.6 and
          // +0.8 ms over three runs against the runtime's own ping.
          { id: 'rl', label: 'relay', tech: 'relay',
            note: 'One **Durable Object** per room carries notes from the **page** to the '
                + '**synths** on the **Raspberry Pi**. The hop through it measured 1 to 2 ms.' },
          { id: 'st', label: 'Stream', tech: 'cloudflare',
            note: '**Cloudflare** Stream serves the same picture as **LL-HLS** and as **WHEP**, '
                + 'which is how the two were measured side by side.' },
        ] },
      { id: 'pi', label: 'Raspberry Pi', tech: 'raspberry', desc: 'Yoshimi and the Circuit',
        children: [
          { id: 'sy', label: 'synths', tech: 'sound',
            note: 'The board plays **Yoshimi** and the **Novation Circuit** and sends their '
                + 'sound back through the **relay**.' },
        ] },
    ],
    links: [
      { from: 'pg', to: 'rl', note: 'Note on and note off as small WebSocket messages.' },
      { from: 'rl', to: 'sy', note: 'The relay hands them to the board, which plays them.' },
    ],
  };

  // ── the talk ──────────────────────────────────────────────────────────────
  // `say` is the headline at step 4: one sentence, no full stop, no colon,
  // semicolon, dash or middot, two lines in every face (asserted). The widest
  // face, Atkinson at 0.632 em, holds 18 characters a line at step 4 (MEASURED,
  // logged by the check), so two lines hold 36 and every headline is written
  // to wrap greedily into two lines of 18. What proves it is ONE of: `big` (one figure
  // at step 6), `list` (up to three lines), `rows` (a table of text padded
  // into character columns), `stack` (figures whose decimal points line up)
  // or `live` (a running part). Evidence is at step 3, or step 2 when it has
  // four rows, because four rows at step 3 do not fit under a two line
  // headline. `statement: true` makes `say` the whole slide at step 5, up to
  // three lines, 12 characters a line in Atkinson.
  // `cap` is the caption at step 1, bottom left, and `link` the slug it points
  // at, written out as a full URL. A link is not a fetch.
  //
  // THE ACCENT: `*26.2*` in any string paints those characters in `--hi`, on
  // what carries the point and never on every word (the owner, 2026-10-05:
  // *"do not have be on single one"*, so a slide may have two).
  // THE HUES: `[Pi|Raspberry Pi]` paints `Pi` in the hue the diagram of the
  // machines gives its box called Raspberry Pi, so a word on any slide is
  // joined by colour to the box it means. Only the two outer boxes that paint
  // a hue, Cloudflare and Raspberry Pi: MEASURED 2026-10-05, the diagram
  // colours a bold name in a note only for a top level box (page, relay and
  // synths came back plain bold), so a word joined to an inner box would have
  // nothing on screen to match.
  // The check reports both counts per slide and their contrast.
  //
  // 🔴 EVERY NUMBER ON A SLIDE IS A MEASURED ONE, AND ITS SOURCE IS THE
  // COMMENT ABOVE IT. A number with no comment is a defect.
  //
  // `rows` is { head, body, align }: `align` is one letter a column, l or r,
  // and the widths are worked out from the longest cell, so a column is a
  // character position. Rows are written to Atkinson's 27 characters at step 3.
  const SLIDES = [
    // ── what this is ──
    // 46 rows and 44 built: CLAUDE.md's count command over the manifest, run
    // 2026-10-05, printed `46 44`. Counted, never remembered. (The command is
    // not quoted here because the build reads an import in a comment as real.)
    { name: 'lab', say: 'Positron is a lab for *live* media', statement: true,
      cap: '44 demos built, of 46 in the manifest', link: '' },
    { name: 'machines', say: '[Cloudflare|Cloudflare] carries the streams',
      live: liveDiagram(MACHINES), cap: 'notes from the page through the relay to the [Pi|Raspberry Pi]', link: 'patchbay' },

    // ── what it measured ──
    // 600 of 600: positron-ui SKILL.md, "The test picture": burn then
    // readBurned, 600/600 exact through three moves of the clock row.
    { name: 'clock', say: 'Latency is read off a burned clock',
      live: livePicture, cap: 'the test picture, live, its clock read 600 of 600', link: 'webrtc' },
    // PROGRESS.md:4712-4719, both browser to Cloudflare to browser, burned
    // pixels: MoQ p50 26.2 / p95 42.4 / p99 104.8 ms (n=2740, PROGRESS.md:6624),
    // WHEP p50 67.0 / p95 76.9 / p99 84.1 ms (n=17,501, PROGRESS.md:4712).
    // Quicker is the median, steadier is the p99 under MoQ's. No hue: both
    // ride Cloudflare, and diagram.mjs's TECH_HUE has no entry that tells the
    // two transports apart, so the two winning figures are the yellow instead.
    { name: 'transports', say: 'MoQ is quicker, WebRTC steadier',
      rows: { head: ['', 'p50', 'p95', 'p99'],
        body: [['MoQ', '*26.2*', '42.4', '104.8'], ['WHEP', '67.0', '76.9', '*84.1*']], align: 'lrrr' },
      cap: 'ms, frame drawn to frame shown, both through [Cloudflare|Cloudflare]', link: 'moq' },
    // plans/plan.md:54-57, `hls.latency` behind the live edge, two runs, same
    // stream, same configuration: stock 7.60 and 15.41 s, with the seek
    // correction 1.87 and 3.05 s.
    { name: 'llhls', say: 'Stock hls.js parks where it starts',
      stack: [['stock, run A', '7.60', 's'], ['stock, run B', '15.41', 's'],
        ['tuned, run A', '*1.87*', 's'], ['tuned, run B', '*3.05*', 's']],
      cap: 'behind live, one [Cloudflare|Cloudflare] stream, same settings', link: 'llhls' },
    // plans/plan-away-webrtc.md:212-214, laptop and Pi on one network: key
    // press to speakers ~175 ms over the relay, ~48 ms over a direct WebRTC
    // data channel. Another network is NOT measured (:216-217), which the
    // caption says.
    { name: 'pi', say: 'Direct to the [Pi|Raspberry Pi] skips the relay',
      big: '*48 ms*', cap: 'key to speakers, was 175, one network so far', link: 'away' },
    // research/circuit-archive-2026-09-21.md:253-256: 3 sessions with no note
    // events and 29 with, so 32; plans/plan-circuit-editor.md:65: 64 patches,
    // all 350 bytes.
    { name: 'circuit', say: 'The Circuit holds *29* real sessions',
      rows: { body: [['sessions', '32'], ['with notes', '29'], ['patches', '64'], ['bytes each', '350']],
        align: 'lr' },
      cap: 'read from the backup file, no device needed', link: 'circuit' },
    // Live: lateness is measured on this screen as it runs, nothing quoted.
    { name: 'frames', say: 'A step waits for the next frame',
      live: liveSteps, cap: 'ms each step lands behind its own time, here', link: 'time' },
    // HANDOFF.md:133-135, AHEAD on /sync/: a peer 137 ms fast over a 20 ms
    // hop, offset found to 0.00 ms, beats a median 1.8 ms apart (worst 6.9).
    { name: 'clocks', say: 'Two clocks agree after measuring',
      big: '1.8 ms', cap: 'median gap between beats, one peer 137 ms fast', link: 'sync' },

    // ── how it is built ──
    // 167: `ls demo/shell/*.mjs | wc -l`, 2026-10-05.
    { name: 'kit', say: 'Every demo uses one kit of parts',
      live: liveReadout, cap: 'a readout from the kit, 167 modules in it', link: 'kit' },
    // positron-verify SKILL.md:29 (radio 48/48, zero bytes from anybody's
    // radio), :70 (tapes 39/39, only the dev server and the stand-in), :90-92
    // (now and flipper together 52/52, only the dev server and the stand-in).
    { name: 'stand-ins', say: 'Stand-ins replace other servers',
      rows: { body: [['radio', '48/48'], ['tapes', '39/39'], ['flipper, now', '52/52']], align: 'lr' },
      cap: 'checks passed, nothing asked of the real server', link: 'tapes' },
    // HANDOFF.md:190 (route-core JS 115/115, C 98/98), :191 (rp2040js
    // emulator, the router, 45 PASS), :180-181 (the Pico 2 W has run nothing).
    { name: 'pico', say: 'The Pico router runs its core in C',
      rows: { body: [['core in JS', '115/115'], ['core in C', '98/98'], ['emulated Pico', '45 pass']],
        align: 'lr' },
      cap: 'the board itself has run nothing yet', link: 'kit/hardware/' },

    // ── what it learned ──
    // positron-streaming SKILL.md:228-230, a 13 point sweep of each 2 h window
    // on 2026-09-06: etv refused its newest ~45 min, etv2 its oldest ~78 min,
    // etvpluss nothing. The 2 h is plans/plan-live-timeline.md:42, 3750
    // segments of 1.92 s.
    { name: 'refusals', say: 'ERR refuses by programme, not age',
      rows: { body: [['etv', 'newest 45 min'], ['etv2', 'oldest 78 min'], ['etvpluss', 'none']], align: 'll' },
      cap: 'refused part of each 2 h window, 13 points', link: 'flipper' },
    // positron-verify SKILL.md:78-80: a stand-in serving silence still read
    // 38/38 on /tapes/, a hole found only by breaking the stand-in.
    { name: 'sabotage', say: '*Break* the check first', statement: true,
      cap: '38/38 still green with every recording silent', link: 'tapes' },
    // research/cf-models-speech-to-patch-2026-09-21.md:243-244: Workers AI,
    // llama 3.3 70B, a patch from a sentence: loose schema 1.6 s, one branch
    // per operation 10.2 to 11.6 s and looping until the tokens ran out.
    { name: 'schema', say: 'A loose schema made it faster',
      stack: [['loose', '*1.6*', 's'], ['strict', '10.2', 's']],
      cap: 'Workers AI proposing patch links from a sentence', link: 'patchbay' },

    // ── what is next ──
    // HANDOFF.md:165-167 (flashing the real Pico 2 W, the Formanta click
    // test) and plans/plan-away-webrtc.md:216-217 (another network unmeasured).
    { name: 'next', say: 'Next is untested hardware',
      list: ['flash the Pico 2 W', '[Pi|Raspberry Pi] on another network', 'a drum machine click'],
      cap: 'carried over in the handoff', link: '' },
  ];

  const deck = createDeck(d, { slides: SLIDES, hues: MACHINES });

  if (SELFCHECK) {
    try {
      const { t0 } = await checkDeck(deck, {
        range: [12, 16], kitLive: ['machines', 'clock', 'frames', 'kit'], minLive: 4, hueSlide: 'machines',
      });
      d.log(`checks took ${(performance.now() - t0).toFixed(0)} ms`);
    } catch (e) { d.assert('the checks ran to the end', false, String(e?.stack || e)); }
  }
  d.ready();
</script>
</html>
