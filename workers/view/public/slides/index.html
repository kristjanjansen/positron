<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* THE EIGHT FACES, SELF-HOSTED, AND EVERY ONE IS MONOSPACED. Latin subset,
     400 and 600 only, from the @fontsource 5.3.0 packages, each with its SIL
     OFL 1.1 licence beside it in vendor/. plans/plan-slides.md section 9 has
     why these eight and what each measured. Nothing on this page is fetched
     from another host. */
  @font-face { font-family: 'SL Atkinson Hyperlegible Mono'; font-weight: 400; font-style: normal; font-display: block;
    src: url('/slides/vendor/atkinson-hyperlegible-mono-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'SL Atkinson Hyperlegible Mono'; font-weight: 600; font-style: normal; font-display: block;
    src: url('/slides/vendor/atkinson-hyperlegible-mono-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'SL JetBrains Mono'; font-weight: 400; font-style: normal; font-display: block;
    src: url('/slides/vendor/jetbrains-mono-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'SL JetBrains Mono'; font-weight: 600; font-style: normal; font-display: block;
    src: url('/slides/vendor/jetbrains-mono-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'SL Geist Mono'; font-weight: 400; font-style: normal; font-display: block;
    src: url('/slides/vendor/geist-mono-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'SL Geist Mono'; font-weight: 600; font-style: normal; font-display: block;
    src: url('/slides/vendor/geist-mono-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'SL IBM Plex Mono'; font-weight: 400; font-style: normal; font-display: block;
    src: url('/slides/vendor/ibm-plex-mono-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'SL IBM Plex Mono'; font-weight: 600; font-style: normal; font-display: block;
    src: url('/slides/vendor/ibm-plex-mono-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'SL Intel One Mono'; font-weight: 400; font-style: normal; font-display: block;
    src: url('/slides/vendor/intel-one-mono-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'SL Intel One Mono'; font-weight: 600; font-style: normal; font-display: block;
    src: url('/slides/vendor/intel-one-mono-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'SL Fira Code'; font-weight: 400; font-style: normal; font-display: block;
    src: url('/slides/vendor/fira-code-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'SL Fira Code'; font-weight: 600; font-style: normal; font-display: block;
    src: url('/slides/vendor/fira-code-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'SL Source Code Pro'; font-weight: 400; font-style: normal; font-display: block;
    src: url('/slides/vendor/source-code-pro-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'SL Source Code Pro'; font-weight: 600; font-style: normal; font-display: block;
    src: url('/slides/vendor/source-code-pro-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'SL Martian Mono'; font-weight: 400; font-style: normal; font-display: block;
    src: url('/slides/vendor/martian-mono-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'SL Martian Mono'; font-weight: 600; font-style: normal; font-display: block;
    src: url('/slides/vendor/martian-mono-latin-600-normal.woff2') format('woff2'); }

  /* A slide lives inside a video panel's stage. The stage is the size
     container, so the slide is sized off the panel's box and never off the
     window: a panel in a page column on a desk, a panel on a phone and a panel
     filling a projector all get the same slide at a different scale.
     plans/plan-slides.md has the research behind every number here. */
  .sl-panel .pos-vp-stage { container-type: size; }

  /* 16:9 and letterboxed. In the panel the stage is already 16:9 so the slide
     fills it exactly; full screen on a screen of another shape centres a 16:9
     slide in it rather than stretching the type to the screen's shape. */
  .sl-slide {
    position: absolute; inset: 0; margin: auto;
    width: min(100cqw, calc(100cqh * 16 / 9));
    height: min(100cqh, calc(100cqw * 9 / 16));
    container-type: size;
    overflow: hidden;
    color: var(--fg);
  }
  .sl-slide[hidden] { display: none; }
  /* The inset is on a box inside the slide and never on the slide itself,
     because a container's query units measure its CONTENT box. MEASURED with
     the padding on the slide: LARGE came out at 7.7 per cent of the slide
     rather than 9, at both widths, because 14 per cent of the height was
     padding the units could not see. */
  .sl-in {
    height: 100%;
    display: flex; flex-direction: column;
    padding: 7cqh 6cqw;
  }

  /* THE TWO SIZES, AND THEY ARE FRACTIONS OF THE SLIDE'S OWN HEIGHT.
     LARGE is 9 per cent of the slide's height: the 36 pt title of a 405 pt tall
     16:9 deck, four and a half times the 1/50 floor of the 8H rule. Every face
     is monospaced, so a line holds a fixed count of characters per face: 28 in
     the six at 0.6 em, 27 in Atkinson and 24 in Martian, MEASURED, and Martian
     is what every headline is written to.
     EXTRA LARGE is twice that, 18 per cent, for one number or one short word.
     SMALL is half of LARGE, 4.5 per cent, for a label under a specimen. */
  /* The face is a custom property on the panel, so the switcher changes one
     declaration and every slide, full screen included, follows by inheritance.
     A specimen column sets its own. */
  .sl-l  { font: 600 9cqh/1.15 var(--sl-face, var(--mono)); letter-spacing: 0; margin: 0; }
  .sl-xl { font: 600 18cqh/1 var(--sl-face, var(--mono)); letter-spacing: 0; margin: 0; }
  .sl-s  { font: 400 4.5cqh/1.2 var(--sl-face, var(--mono)); letter-spacing: 0; margin: 0; }
  .sl-dim { color: var(--dim); font-weight: 400; }
  /* Two lines of a headline are kept even, so no word is left alone. */
  .sl-say { text-wrap: balance; }

  /* The headline sits top left, every slide, same place. What proves it goes
     in the evidence region under it, which takes whatever height is left, and
     it is CENTRED in that region on both axes: the headline is read first and
     left aligned, the evidence is looked at and sits in the middle. */
  .sl-ev {
    flex: 1 1 auto; min-height: 0;
    margin-top: 6cqh;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center;
  }
  .sl-list { list-style: none; padding: 0; margin: 0; text-align: left; }
  .sl-list li { margin: 0; }

  /* A canvas and a scaled component take the whole region and centre their
     own picture inside it, so they stretch rather than shrink to nothing. */
  .sl-ev canvas { display: block; width: 100%; height: 100%; object-fit: contain; align-self: stretch; }

  /* The specimen: eight faces in two rows of four, the same letters in each
     and the face's name under them. Eight columns of `Il1` at LARGE do not fit
     a slide's width (Martian needs 2.1 em a column), so it is two rows, and
     both pairs are at LARGE because EXTRA LARGE in two rows overflows the
     height. */
  .sl-spec {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    column-gap: 2cqh; row-gap: 3cqh; align-self: stretch; text-align: center;
  }
  .sl-spec > div { min-width: 0; }
  .sl-spec p { white-space: nowrap; }
  .sl-spec .sl-name { margin-top: 1cqh; }
  .sl-spec > [data-on] .sl-l { color: var(--hi); }

  /* A component sized in px (a readout, a diagram) is laid out at a fixed
     logical width and scaled to the region, the way a projector scales it.
     The scale is a custom property the page writes, never the transform. */
  .sl-fit { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; align-self: stretch; }
  .sl-fit-in {
    position: absolute; left: 0; top: 0;
    width: var(--fit-w, 640px);
    transform-origin: 0 0;
    transform: translate(var(--fit-x, 0px), var(--fit-y, 0px)) scale(var(--fit-k, 1));
  }
  .sl-fit-in > .pos-dg { margin: 0; }

  /* Blank, the way a clicker's blank button asks for: the slide goes away and
     the panel stays. */
  .sl-panel .pos-vp-stage[data-blank] .sl-slide { visibility: hidden; }

  /* Used only by the self-check, to lay the panel out at a phone's width
     (375 less the 16 px gutters) without needing a phone. */
  .sl-panel.sl-narrow { max-width: 343px; }

  .sl-count {
    font: 500 12px/1 var(--mono); color: var(--dim);
    font-variant-numeric: tabular-nums; min-width: 7ch; text-align: center;
  }
</style>

<script type="module">
  import { mount, guard, el, createReport } from '/shell/shell.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createStepper } from '/shell/stepper.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { createDiagram } from '/shell/diagram.mjs';
  import { burn, videoHue, FRAME_W, FRAME_H } from '/shell/pattern.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';

  const d = mount({
    name: 'slides',
    what: 'A talk made of slides that hold running parts of this site, stepped inside a panel that fills the screen when you present.',
    readout: null,
    controls: [],
  });
  guard(d);

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const frame = () => new Promise((r) => requestAnimationFrame(() => r()));

  // ── live elements ─────────────────────────────────────────────────────────
  // Each one is built the first time its slide is shown, because a box in a
  // hidden slide measures 0, and runs only while its slide is the one on
  // screen. None of them opens a connection: they are drawn from this page.

  /** A component laid out at `w` logical px and scaled into `host`. */
  function fitBox(host, w) {
    const outer = el('div', 'sl-fit');
    const inner = el('div', 'sl-fit-in');
    inner.style.setProperty('--fit-w', `${w}px`);
    outer.append(inner);
    host.append(outer);
    const fit = () => {
      const ow = outer.clientWidth, oh = outer.clientHeight;
      const ih = inner.offsetHeight || 1;
      if (!ow || !oh) return;
      const k = Math.min(ow / w, oh / ih);
      inner.style.setProperty('--fit-k', String(k));
      inner.style.setProperty('--fit-x', `${(ow - w * k) / 2}px`);
      inner.style.setProperty('--fit-y', `${(oh - ih * k) / 2}px`);
    };
    const ro = new ResizeObserver(fit);
    ro.observe(outer); ro.observe(inner);
    return { inner, fit };
  }

  function liveReadout(host) {
    const { inner } = fitBox(host, 360);
    const r = createReport({ readout: { fps: '', frames: '' }, showLog: false, joined: false });
    inner.append(r.readoutEl);
    // `frames` is there because `fps` alone does not move on a screen locked to
    // its refresh rate: MEASURED in headless Chrome, 60.0 for a whole second.
    let raf = 0, last = 0, times = [], shown = 0, count = 0;
    const tick = (t) => {
      count++;
      if (last) times.push(t - last);
      if (times.length > 60) times.shift();
      last = t;
      if (t - shown > 250 && times.length > 4) {
        const mean = times.reduce((a, b) => a + b, 0) / times.length;
        r.set('fps', (1000 / mean).toFixed(1));
        r.set('frames', count);
        shown = t;
      }
      raf = requestAnimationFrame(tick);
    };
    return {
      start() { last = 0; times = []; shown = 0; raf = requestAnimationFrame(tick); },
      stop() { cancelAnimationFrame(raf); raf = 0; },
      value: () => r.readoutEl.textContent,
      subject: () => r.readoutEl,
    };
  }

  function livePicture(host) {
    const c = el('canvas');
    c.width = FRAME_W; c.height = FRAME_H;
    host.append(c);
    const ctx = c.getContext('2d');
    let raf = 0, n = 0;
    const tick = () => {
      burn(ctx, FRAME_W, FRAME_H, n++, { hue: videoHue(1) });
      raf = requestAnimationFrame(tick);
    };
    return {
      start() { tick(); },
      stop() { cancelAnimationFrame(raf); raf = 0; },
      value: () => n,
      subject: () => c,
    };
  }

  function liveDiagram(host) {
    const { inner, fit } = fitBox(host, 600);
    const dg = createDiagram(inner, {
      nodes: [
        { id: 'br', label: 'Browser', sub: 'laptop or phone', kind: 'here', tech: 'browser',
          children: [
            { id: 'arr', label: 'slides', sub: 'array of objects', tech: 'browser',
              note: 'Each slide is a headline sentence and, optionally, a function that builds a '
                  + 'running element. Nothing is built for a slide nobody has reached.' },
            { id: 'vp', label: 'video panel', sub: 'createVideoPanel', tech: 'browser',
              note: 'The same panel a page plays video in. The slide is its picture, and '
                  + 'previous and next sit in its footer.' },
          ] },
        { id: 'proj', label: 'projector', sub: 'HDMI, 16:9', tech: 'device',
          note: 'Full screen hands the panel to the whole display. The slide keeps its 16:9 '
              + 'shape and its type keeps its share of the slide height.' },
      ],
      links: [
        { from: 'vp', to: 'proj', label: 'full screen',
          note: 'The **Fullscreen API** where the browser has one, and a fixed cover where it '
              + 'does not, which is every iPhone.' },
      ],
    });
    requestAnimationFrame(fit);
    let timer = 0, at = -1;
    const step = () => {
      const boxes = [...dg.svg.querySelectorAll('.pos-dg-n')]
        .filter((g) => !g.querySelector('.pos-dg-cbox'));
      boxes.forEach((g) => { delete g.dataset.on; });
      if (!boxes.length) return;
      at = (at + 1) % boxes.length;
      boxes[at].dataset.on = '1';
    };
    return {
      start() { step(); timer = setInterval(step, 900); },
      stop() { clearInterval(timer); timer = 0; },
      value: () => at,
      subject: () => dg.svg,
      dg,
    };
  }

  // ── the faces ─────────────────────────────────────────────────────────────
  // Eight self-hosted monospaced faces, in the order the switcher steps them.
  // `id` is what the address carries (`?face=plex`), `name` is what the picker
  // and the specimen show. The first is the default and plans/plan-slides.md
  // section 9 says why.
  const FACES = [
    { id: 'atkinson',  name: 'Atkinson',    family: 'SL Atkinson Hyperlegible Mono' },
    { id: 'jetbrains', name: 'JetBrains',   family: 'SL JetBrains Mono' },
    { id: 'geist',     name: 'Geist',       family: 'SL Geist Mono' },
    { id: 'plex',      name: 'Plex',        family: 'SL IBM Plex Mono' },
    { id: 'intel',     name: 'Intel One',   family: 'SL Intel One Mono' },
    { id: 'fira',      name: 'Fira Code',   family: 'SL Fira Code' },
    { id: 'source',    name: 'Source Code', family: 'SL Source Code Pro' },
    { id: 'martian',   name: 'Martian',     family: 'SL Martian Mono' },
  ];
  const stackOf = (f) => `'${f.family}', var(--mono)`;
  // What the specimen sets in every face: the pairs a back row confuses first.
  const SPEC = ['0O', 'Il1'];

  // ── the deck ──────────────────────────────────────────────────────────────
  // `say` is the headline, one sentence and no full stop. `big` is one number
  // or word at EXTRA LARGE. `list` is up to three short lines at LARGE.
  // `live` builds a running element into the evidence region and returns
  // { start, stop, value }. `name` is what the log and the hash use.
  const SLIDES = [
    { name: 'one thing',
      say: 'A slide says one thing, in one sentence',
      list: ['two lines at most', 'evidence under it', 'three seconds to read'] },
    { name: 'back row',
      say: 'Text must be big enough for the back row',
      big: '1/50', under: 'of the screen height' },
    { name: 'readout', say: 'The readout is live, measuring this screen', live: liveReadout },
    { name: 'picture', say: 'The test picture draws itself, frame by frame', live: livePicture },
    { name: 'panel', say: 'A slide sits in a panel that fills the screen', live: liveDiagram },
    { name: 'faces', say: 'Eight faces, all mono', specimen: true },
  ];

  const nodes = SLIDES.map((s, i) => {
    const node = el('section', 'sl-slide', null, { 'aria-label': `slide ${i + 1}`, 'aria-roledescription': 'slide' });
    node.hidden = true;
    const box = el('div', 'sl-in');
    node.append(box);
    box.append(el('h2', 'sl-l sl-say', s.say));
    const ev = el('div', 'sl-ev');
    if (s.list) {
      const ul = el('ul', 'sl-list sl-l sl-dim');
      for (const t of s.list) ul.append(el('li', '', t));
      ev.append(ul);
    }
    if (s.big) {
      ev.append(el('p', 'sl-xl sl-big', s.big));
      if (s.under) ev.append(el('p', 'sl-l sl-dim', s.under));
    }
    if (s.specimen) {
      const grid = el('div', 'sl-spec');
      for (const f of FACES) {
        const col = el('div', '', null, { title: f.family.replace(/^SL /, '') });
        col.dataset.face = f.id;
        col.style.setProperty('--sl-face', stackOf(f));
        col.append(...SPEC.map((t) => el('p', 'sl-l', t)), el('p', 'sl-s sl-dim sl-name', f.name));
        grid.append(col);
      }
      ev.append(grid);
    }
    box.append(ev);
    return { spec: s, node, box, ev, ctl: null };
  });

  const stepper = createStepper({ prev: () => go(at - 1), next: () => go(at + 1), what: 'slide' });
  const count = el('span', 'sl-count', '');
  const panel = createVideoPanel({
    left: stepper,
    centre: count,
    fullMode: 'hover',
    onFull: (full) => d.log(full ? 'presenting, full screen' : 'back in the page'),
  });
  panel.el.classList.add('sl-panel');
  for (const n of nodes) panel.stage.append(n.node);
  d.stack.add(panel.el);

  // The face. A page setting, so it sits under the panel and not in its
  // footer, and the address carries it so a slide can be sent in a given face.
  let face = FACES.find((f) => f.id === new URLSearchParams(location.search).get('face')) || FACES[0];
  function setFace(f, quiet = false) {
    face = f;
    panel.el.style.setProperty('--sl-face', stackOf(f));
    for (const col of panel.stage.querySelectorAll('.sl-spec > div')) {
      if (col.dataset.face === f.id) col.dataset.on = '1'; else delete col.dataset.on;
    }
    const u = new URL(location.href);
    if (f === FACES[0]) u.searchParams.delete('face'); else u.searchParams.set('face', f.id);
    history.replaceState(null, '', u);
    if (!quiet) d.log(`face: ${f.family.replace(/^SL /, '')}`);
    return document.fonts.load(`600 20px '${f.family}'`);
  }
  // ⚠️ A PICKER AND NOT A SEGMENTED CHOICE, for the reason `/kit/`'s font row
  // gives: eight names side by side do not fit a phone, and a picker is one
  // name wide at any count.
  const pickFace = (i, quiet = false) => {
    const f = FACES[((i % FACES.length) + FACES.length) % FACES.length];
    facePick.show(f.name, FACES.indexOf(f));
    return setFace(f, quiet);
  };
  const facePick = createPicker({
    label: 'face', what: 'face',
    prev: () => pickFace(FACES.indexOf(face) - 1),
    next: () => pickFace(FACES.indexOf(face) + 1),
    onPick: (i) => pickFace(i),
  });
  facePick.options(FACES.map((f) => f.name), FACES.indexOf(face));
  d.stack.add(facePick.el);
  pickFace(FACES.indexOf(face), true);

  let at = -1;
  function go(i) {
    const next = Math.max(0, Math.min(SLIDES.length - 1, i));
    if (next === at) return at;
    const was = nodes[at];
    if (was) { was.node.hidden = true; was.ctl?.stop(); }
    at = next;
    const n = nodes[at];
    n.node.hidden = false;
    if (n.spec.live && !n.ctl) n.ctl = n.spec.live(n.ev);
    n.ctl?.start();
    count.textContent = `${at + 1} / ${SLIDES.length}`;
    stepper.buttons[0].disabled = at === 0;
    stepper.buttons[stepper.buttons.length - 1].disabled = at === SLIDES.length - 1;
    history.replaceState(null, '', `#${at + 1}`);
    return at;
  }

  const blank = (on) => {
    const s = panel.stage;
    const want = on ?? !s.hasAttribute('data-blank');
    if (want) s.dataset.blank = '1'; else delete s.dataset.blank;
    return want;
  };

  // Keys. A clicker sends PageUp and PageDown (Logitech R400), F5 and Escape
  // from its play button, and a full stop from its blank button.
  const NEXT = new Set(['ArrowRight', 'ArrowDown', 'PageDown', ' ']);
  const PREV = new Set(['ArrowLeft', 'ArrowUp', 'PageUp']);
  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target;
    if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    if (t && t.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
    let did = true;
    if (NEXT.has(e.key)) go(at + 1);
    else if (PREV.has(e.key)) go(at - 1);
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(SLIDES.length - 1);
    else if (e.key === '.' || e.key === 'b' || e.key === 'B') blank();
    else if (e.key === 'f' || e.key === 'F' || e.key === 'F5') panel.full(!panel.isFull());
    else did = false;
    if (did) e.preventDefault();
  });

  const fromHash = Number((location.hash.match(/^#(\d+)$/) || [])[1]) || 1;
  go(fromHash - 1);

  window.__demo.slides = {
    count: SLIDES.length, index: () => at, go, blank, names: SLIDES.map((s) => s.name),
  };

  // ── checks ────────────────────────────────────────────────────────────────
  const lum = (c) => {
    const m = c.match(/\d+(\.\d+)?/g).slice(0, 3).map(Number).map((v) => {
      const s = v / 255;
      return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;
    });
    return 0.2126 * m[0] + 0.7152 * m[1] + 0.0722 * m[2];
  };
  const ratio = (a, b) => {
    const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p);
    return (x + 0.05) / (y + 0.05);
  };
  const px = (node, prop = 'font-size') => parseFloat(getComputedStyle(node).getPropertyValue(prop));
  const key = (k) => document.body.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));

  async function check() {
    const A = d.assert;
    // Every face in before counting requests, because the specimen slide and
    // the switcher fetch the seven that were not chosen, from this origin.
    const loaded = await Promise.all(FACES.map((f) => Promise.all([
      document.fonts.load(`600 20px '${f.family}'`), document.fonts.load(`400 20px '${f.family}'`)])));
    const missing = FACES.filter((f, i) => !loaded[i].every((l) => l.length)
      || !document.fonts.check(`600 20px '${f.family}'`));
    A('all eight faces load, at 400 and 600, from this page\'s own vendor folder',
      missing.length === 0, missing.map((f) => f.family).join(', ') || FACES.map((f) => f.id).join(' '));
    const resBefore = performance.getEntriesByType('resource')
      .filter((r) => new URL(r.name).pathname !== '/_log').length;

    A('the deck has six slides and the panel holds six',
      SLIDES.length === 6 && panel.stage.querySelectorAll('.sl-slide').length === 6,
      `${SLIDES.length} declared, ${panel.stage.querySelectorAll('.sl-slide').length} drawn`);

    go(0);
    const [prevB] = stepper.buttons, nextB = stepper.buttons[stepper.buttons.length - 1];
    nextB.click();
    const a1 = at;
    prevB.click();
    const a0 = at;
    prevB.click();
    A('next moves forward one and previous moves back one', a1 === 1 && a0 === 0, `${a1}, ${a0}`);
    A('previous on the first slide stays there and is switched off',
      at === 0 && prevB.disabled, `at ${at}, disabled ${prevB.disabled}`);
    go(SLIDES.length - 1);
    nextB.click();
    A('next on the last slide stays there and is switched off',
      at === SLIDES.length - 1 && nextB.disabled, `at ${at}, disabled ${nextB.disabled}`);
    A('the footer counts the slide it is on', count.textContent === `${SLIDES.length} / ${SLIDES.length}`, count.textContent);

    go(0);
    const seen = [];
    for (const k of ['ArrowRight', 'PageDown', ' ', 'ArrowLeft', 'PageUp', 'End', 'Home', 'ArrowDown', 'ArrowUp']) {
      key(k); seen.push(at);
    }
    A('arrows, PageUp and PageDown, space, Home and End all move the deck',
      seen.join() === '1,2,3,2,1,5,0,1,0', seen.join());
    go(2);
    A('the address carries the slide, so a reload lands on it', location.hash === '#3', location.hash);

    // The two sizes, measured against the slide's own height.
    go(0); await frame();
    const s0 = nodes[0].node, h0 = s0.getBoundingClientRect().height;
    const L = px(s0.querySelector('.sl-say'));
    A('LARGE renders at 9 per cent of the slide height',
      Math.abs(L - 0.09 * h0) < 0.5, `${L.toFixed(2)} px in a ${h0.toFixed(1)} px slide at ${innerWidth} px wide`);
    go(1); await frame();
    const s1 = nodes[1].node, h1 = s1.getBoundingClientRect().height;
    const XL = px(s1.querySelector('.sl-xl'));
    A('EXTRA LARGE renders at 18 per cent of the slide height',
      Math.abs(XL - 0.18 * h1) < 0.5, `${XL.toFixed(2)} px in a ${h1.toFixed(1)} px slide`);
    const vp = panel.stage.getBoundingClientRect();
    A('in the page the slide is the panel picture, 16:9 and edge to edge',
      Math.abs(h1 - vp.height) < 1 && Math.abs(s1.getBoundingClientRect().width - vp.width) < 1,
      `slide ${s1.getBoundingClientRect().width.toFixed(1)} x ${h1.toFixed(1)}, stage ${vp.width.toFixed(1)} x ${vp.height.toFixed(1)}`);

    // Every slide in every face: two lines of headline at most, and nothing
    // past its inset on any side. The budget is measured per face: the mean
    // advance of the deck's own headlines at LARGE, into the inset width.
    const was = face, perFace = [], spill = [], budgets = [];
    const meas = document.createElement('canvas').getContext('2d');
    for (const f of FACES) {
      await setFace(f, true); await frame();
      const lines = [];
      for (let i = 0; i < SLIDES.length; i++) {
        // One frame, not two: reading a rect forces layout, and eight faces
        // at two frames a slide pushed the page past the harness's boot wait.
        go(i); await frame();
        const n = nodes[i].node, say = n.querySelector('.sl-say');
        const lh = px(say, 'line-height');
        lines.push(Math.round(say.getBoundingClientRect().height / lh));
        const r = nodes[i].box.getBoundingClientRect(), cs = getComputedStyle(nodes[i].box);
        const inL = r.left + parseFloat(cs.paddingLeft), inR = r.right - parseFloat(cs.paddingRight);
        const inB = r.bottom - parseFloat(cs.paddingBottom);
        for (const c of n.querySelectorAll('.sl-say, .sl-ev > *, .sl-spec p')) {
          const b = c.getBoundingClientRect();
          if (b.bottom > inB + 1 || b.left < inL - 1 || b.right > inR + 1
            || c.scrollWidth > c.clientWidth + 1) spill.push(`${f.id} ${i + 1}`);
        }
        if (i === 0) {
          meas.font = `600 ${px(say)}px '${f.family}'`;
          const text = SLIDES.map((s) => s.say).join(' ');
          budgets.push(`${f.id} ${Math.floor((inR - inL) / (meas.measureText(text).width / text.length))}`);
        }
      }
      perFace.push(`${f.id} ${lines.join('')}`);
    }
    await setFace(was, true);
    d.log(`characters a LARGE line holds: ${budgets.join(', ')}`);
    A('every headline is two lines or fewer, in all eight faces',
      perFace.every((p) => /^\S+ [12]+$/.test(p)), `${perFace.join(', ')}; budget a line ${budgets.join(', ')}`);
    A('nothing on any slide runs past its inset, in any face', spill.length === 0, spill.join(', ') || 'all inside');

    // What is under a headline sits in the middle of the slide's inset, at a
    // desk width and at a phone's.
    const subjectOf = (n) => n.ctl?.subject?.() || n.ev.querySelector('.sl-list, .sl-big, .sl-spec');
    const centring = async (label) => {
      const off = [];
      for (let i = 0; i < SLIDES.length; i++) {
        go(i); await frame(); await frame(); await frame();
        const sub = subjectOf(nodes[i]);
        if (!sub) { off.push(`${i + 1} none`); continue; }
        const r = nodes[i].box.getBoundingClientRect(), cs = getComputedStyle(nodes[i].box);
        const mid = (r.left + parseFloat(cs.paddingLeft) + r.right - parseFloat(cs.paddingRight)) / 2;
        const b = sub.getBoundingClientRect();
        off.push(Math.abs((b.left + b.right) / 2 - mid));
      }
      return { label, off, ok: off.every((o) => typeof o === 'number' && o <= 2) };
    };
    const wide = await centring(`${Math.round(panel.el.getBoundingClientRect().width)} px panel`);
    panel.el.classList.add('sl-narrow'); await frame(); await frame();
    const narrow = await centring(`${Math.round(panel.el.getBoundingClientRect().width)} px panel`);
    panel.el.classList.remove('sl-narrow'); await frame();
    for (const c of [wide, narrow]) {
      A(`everything under a headline is centred in the slide within 2 px, ${c.label}`, c.ok,
        c.off.map((o, i) => `${SLIDES[i].name} ${typeof o === 'number' ? o.toFixed(1) : o}`).join(', '));
    }
    const left = nodes.every((n) => getComputedStyle(n.node.querySelector('.sl-say')).textAlign !== 'center');
    A('and the headline itself stays left aligned', left);

    // The face is in the address and every slide follows it.
    const plex = FACES.find((f) => f.id === 'plex');
    await pickFace(FACES.indexOf(plex)); await frame();
    const inUrl = new URLSearchParams(location.search).get('face');
    const fam = getComputedStyle(nodes[0].node.querySelector('.sl-say')).fontFamily;
    const specOn = panel.stage.querySelector('.sl-spec > [data-on]')?.dataset.face;
    await pickFace(FACES.indexOf(was), true); await frame();
    A('picking a face puts it in the address and every slide and the specimen follow',
      inUrl === 'plex' && fam.includes('IBM Plex Mono') && specOn === 'plex', `${inUrl}, ${fam}, ${specOn}`);

    // Every face really is monospaced: `i` and `m` take one advance each.
    const notMono = FACES.filter((f) => {
      meas.font = `600 100px '${f.family}'`;
      return Math.abs(meas.measureText('i').width - meas.measureText('m').width) > 0.01;
    });
    A('every face on the switcher is monospaced, i as wide as m',
      notMono.length === 0, notMono.map((f) => f.id).join(', ') || `${FACES.length} of ${FACES.length}`);
    const cols = [...panel.stage.querySelectorAll('.sl-spec > div')];
    const named = cols.map((c) => {
      const f = FACES.find((x) => x.id === c.dataset.face);
      const p0 = c.querySelector('p');
      return f && getComputedStyle(p0).fontFamily.includes(f.family)
        && c.querySelector('.sl-name')?.textContent === f.name;
    });
    A('the specimen shows all eight, each in its own face with its name under it',
      cols.length === FACES.length && named.every(Boolean), `${cols.length} columns, ${named.filter(Boolean).length} named`);

    go(0); await frame();
    const ink =getComputedStyle(nodes[0].node.querySelector('.sl-say')).color;
    const ground = getComputedStyle(panel.stage).backgroundColor;
    const cr = ratio(ink, ground);
    A('the headline is at least 7:1 against the slide ground', cr >= 7, `${cr.toFixed(1)}:1`);

    // Live elements run while their slide is shown and stop when it is not.
    const live = nodes.map((n, i) => (n.spec.live ? i : -1)).filter((i) => i >= 0);
    const moved = [], stopped = [];
    for (const i of live) {
      go(i); await sleep(150);
      const v0 = nodes[i].ctl.value();
      await sleep(1100);
      const v1 = nodes[i].ctl.value();
      moved.push(`${SLIDES[i].name} ${v0 !== v1 ? 'moved' : 'STILL'} (${v0} to ${v1})`);
      go(i === 0 ? 1 : 0); await sleep(80);
      const w0 = nodes[i].ctl.value();
      await sleep(400);
      if (nodes[i].ctl.value() !== w0) stopped.push(SLIDES[i].name);
    }
    A('at least three slides carry a live element', live.length >= 3, `${live.length}`);
    A('every live element changes while its slide is shown',
      moved.every((m) => !m.includes('STILL')), moved.join(', '));
    A('and stops when the slide is left', stopped.length === 0, stopped.join(', ') || 'all stopped');
    const dgc = nodes[SLIDES.findIndex((s) => s.name === 'panel')].ctl?.dg;
    A('the diagram on the panel slide drew in a row and cut nothing',
      dgc && dgc.mode === 'row' && dgc.cuts.length === 0,
      dgc ? `${dgc.mode}, ${dgc.cuts.length} cut ${JSON.stringify(dgc.cuts)}` : 'not built');

    go(0);
    key('.');
    const blanked = panel.stage.hasAttribute('data-blank')
      && getComputedStyle(nodes[0].node).visibility === 'hidden';
    key('b');
    A('a full stop blanks the slide and b brings it back',
      blanked && !panel.stage.hasAttribute('data-blank'), `${blanked}`);

    // Presenting: full screen, by whichever route this browser has.
    await panel.full(true); await frame(); await frame();
    const fs = nodes[0].node.getBoundingClientRect();
    const fsL = px(nodes[0].node.querySelector('.sl-say'));
    const fullOk = panel.isFull() && Math.abs(fs.width / fs.height - 16 / 9) < 0.01
      && fs.width <= innerWidth + 1 && fs.height <= innerHeight + 1
      && Math.abs(fsL - 0.09 * fs.height) < 0.5;
    await panel.full(false); await frame();
    A('full screen keeps the slide 16:9 inside the screen and LARGE at 9 per cent of it',
      fullOk, `${panel.support?.() ?? ''} ${fs.width.toFixed(0)} x ${fs.height.toFixed(0)} in ${innerWidth} x ${innerHeight}, LARGE ${fsL.toFixed(1)} px`);
    A('and leaving it gives the panel its own shape back',
      !panel.isFull() && Math.abs(nodes[0].node.getBoundingClientRect().height - panel.stage.getBoundingClientRect().height) < 1);

    // `/_log` is the shell's own mirror of the log to the dev server, posted
    // only on 127.0.0.1, and is the shell's request rather than this page's.
    const mine = (list) => list.filter((r) => new URL(r.name).pathname !== '/_log');
    const res = mine(performance.getEntriesByType('resource'));
    const foreign = res.filter((r) => new URL(r.name).origin !== location.origin);
    A('with the faces in, stepping every slide fetched nothing, and nothing came from another host',
      res.length === resBefore && foreign.length === 0,
      `${resBefore} before, ${res.length} after, ${foreign.length} foreign`
        + (res.length !== resBefore ? `: ${res.slice(resBefore).map((r) => new URL(r.name).pathname).join(' ')}` : ''));
    go(0);
  }

  if (SELFCHECK) {
    try { await check(); } catch (e) { d.assert('the checks ran to the end', false, String(e?.stack || e)); }
  }
  d.ready();
</script>
</html>
