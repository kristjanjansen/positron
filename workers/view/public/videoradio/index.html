    // in any body here, so a failure means the follower value is not reaching
    // the pixels at all. ⚠️ Measured on ONE channel, for the same reason the
    // flat-field check is.
    //
    // ⚠️ AND OVER A FRAME THE MARKS FILL, WHICH IS NOT THE SAME TEST DATA THE
    // POSITIONAL CHECK USES. MEASURED with the two-grain frame: the mean red
    // went 0.1 to 0.5 of 255, a real 5x that no sensible threshold can tell
    // from rounding, because two narrow columns of a 256-wide picture are 1% of
    // it. Every bucket is lit here so the mean is a measurement rather than a
    // rounding error, and the shader's own formula predicts the answer:
    // 0.25 + 0.75 * loud is a factor of four between the ends.
    const wide = new Uint8Array(data.length);
    wide[at(63, 3)] = LAYOUT_VERSION;
    wide[at(6, 3)] = 255;
    wide[at(16, 3)] = 0;
    for (let x = 0; x < DATA_W; x++) { wide[at(x, 0)] = 255; wide[at(x, 0) + 1] = 128; }
    const darkD = new Uint8Array(wide); darkD[at(0, 3)] = 0;
    const brightD = new Uint8Array(wide); brightD[at(0, 3)] = 255;
    // 🔴 THREE LEVELS AND A MONOTONE CLAIM, NOT ONE RATIO.
    //
    // This used to divide loud by quiet and compare against
    // `(LIT_FLOOR + LIT_RANGE) / LIT_FLOOR`, which was exactly right while the
    // present pass was one colour times a number: colour was LINEAR in density,
    // so a 2.5x in density was a 2.5x on the screen. The pass is a RAMP now,
    // deliberately non-linear, and it compresses at the top where the warm end
    // flattens. MEASURED the moment the ramp landed: 2.16 against the 2.25 this
    // demanded, on a body doing exactly what it was written to do.
    //
    // Dividing by 0.9 harder would have made it pass and would have made it
    // mean less every time the ramp is tuned. What loudness actually promises
    // is that MORE OF IT IS BRIGHTER, at every step, and that is a claim no
    // ramp shape can satisfy by accident: a body ignoring loudness reads flat,
    // and one reading it backwards reads inverted. Both go red here and neither
    // could be told from the other by a single ratio.
    const midD = new Uint8Array(wide); midD[at(0, 3)] = 128;
    const darkShot = pic ? pic.testRender(darkD) : null;
    const midShot = pic ? pic.testRender(midD) : null;
    const brightShot = pic ? pic.testRender(brightD) : null;
    const quiet = darkShot ? meanRed(darkShot) : 0;
    const mid = midShot ? meanRed(midShot) : 0;
    const loudMean = brightShot ? meanRed(brightShot) : 0;
    d.assert('loudness lights the field, and a quiet station leaves it dark',
      quiet > 0 && mid > quiet + 1 && loudMean > mid + 1 && loudMean > quiet * 1.8,
      `mean red ${quiet.toFixed(1)} quiet, ${mid.toFixed(1)} half, `
      + `${loudMean.toFixed(1)} loud, rising at every step, `
      + `a factor of ${quiet > 0 ? (loudMean / quiet).toFixed(2) : 'nothing'} end to end `
      + `(the ramp compresses it below the ${((LIT_FLOOR + LIT_RANGE) / LIT_FLOOR).toFixed(2)} in density)`);

    // ⚠️ THE DROP COUNTER HAS TO HAVE FIRED IN THIS RUN, or it is a claim rather
    // than a counter. One bucket is flooded past the 255 an 8-bit channel holds,
    // on purpose, and the second half of the assert is that nothing has
    // overflowed during ordinary play.
    const droppedInPlay = everDropped;
    const FLOOD = 300, bIdx = 7;
    for (let i = 0; i < FLOOD; i++) {
      bucket(((bIdx + 0.5) / DATA_W) * BUF_SECONDS / RING_SECONDS, 0.1, 0);
    }
    const refused = buckets[bIdx].drop;
    buckets[bIdx].n = 0; buckets[bIdx].drop = 0; buckets[bIdx].dsum = 0; buckets[bIdx].v.fill(0);
    everDropped = droppedInPlay;
    d.assert('a bucket that overflows counts what it refused, and none overflowed in play',
      refused === FLOOD - 255 && droppedInPlay === 0,
      `flooded ${FLOOD} into one bucket and it refused ${refused}; ${droppedInPlay} refused in ordinary play`);

    // ⚠️ THE LAYOUT IS CHECKED AGAINST THE SHADER TEXT, NOT AGAINST ITSELF.
    // Asserting that the byte this page just wrote is the constant this page
    // just read is circular. What can actually drift is the module growing a
    // destination past the width the body was written for, so the bucket count
    // is read back OUT of the compiled source.
    const shaderBuckets = Number(/floor\(uv\.x \* (\d+)\.0\)/.exec(ACC_FS)?.[1] ?? 0);
    d.assert('the picture was compiled for the layout the module exports',
      shaderBuckets === DATA_W && MOD_DESTS.length + 8 <= DATA_W
      && data[at(63, 3)] === LAYOUT_VERSION,
      `${shaderBuckets} buckets in the body, ${DATA_W} in the texture, `
      + `${MOD_DESTS.length} destinations plus 8 voices, layout ${LAYOUT_VERSION}`);

    // ── the machine ────────────────────────────────────────────────────────
    d.assert('SuperCollider is running in this tab', !!eng && eng.bootMs > 0,
      eng ? `up in ${Math.round(eng.bootMs)} ms` : (window.__granErr || 'it never booted'));
    if (!eng) {
      // ⚠️ IT STOPS HERE AND SAYS SO RATHER THAN THROWING. Everything below asks
      // the server questions, and an engine that refused has to leave a page
      // that still reports what it does know. The count is smaller on such a
      // run, which is the honest shape: this is a different run, not the same
      // one with a failure in it.
      d.log('the engine never booted, so nothing below it could be graded', 'bad');
      checking = false;
      return;
    }
    d.assert('the board’s own compiled graph loaded, and the engine reports its grains',
      !!G.def?.ok && G.running && grains > 0,
      `${G.def?.bytes ?? 0} B taken in ${G.def?.ms ?? 0} ms · ${grains} grains reported over OSC`);

    // ── silence ────────────────────────────────────────────────────────────
    //
    // 🔴 THE PAIR IS THE MEASUREMENT AND EITHER NUMBER ALONE IS BLIND. One
    // analyser sits on speakers and the other past gate, one gain apart, so
    // the only thing that can make their readings differ is the gain. Reading
    // the gain back would grade the SETTING rather than the sound, which is the
    // thing being claimed.
    //
    // 🔴 AND THE SIGNAL IS ONE THIS PAGE MAKES, NOT THE RADIO. The first two
    // versions used the station as the control and both failed on a working
    // page: 0.0000 inside the page, 0.0000 past the gate on five runs across
    // an afternoon when these mounts were answering a health probe with a 200
    // and then sending no bytes. A claim about a gain node has nothing to do
    // with whether a volunteer server in Tallinn is having a good day, and a
    // control that borrows its signal from one is a check that goes red for a
    // reason that is not its own. Four hundred milliseconds of 440 Hz into
    // speakers answers the same question with nothing outside this tab in it.
    //
    // ⚠️ IT GOES IN AT speakers, WHICH IS DOWNSTREAM OF EVERYTHING THAT MAKES
    // THE SOUND. The granulator reads srcNode and the loop records liveIn,
    // both upstream, so the tone cannot reach the instrument, the ring or the
    // picture. A diagnostic that changes the thing it measures is worse than
    // none, and this page's neighbour has the scar: a test oscillator armed
    // sixty times a second once filled a waveform with its own tone while the
    // page reported it as the radio.
    //
    // ⚠️ AND IT ONLY RUNS WITH THE GATE SHUT. With a trusted press the gate is
    // open and a 440 Hz tone would be a beep at somebody, so that case asserts
    // the other half instead: sound really is leaving.
    let pre = 0, post = 0, osc = null;
    if (!asked) {
      osc = ctx.createOscillator();
      const og = ctx.createGain();
      osc.frequency.value = 440; og.gain.value = 0.25;
      osc.connect(og); og.connect(speakers);
      osc.start();
    }
    const untilSilence = performance.now() + 400;
    while (performance.now() < untilSilence) {
      await new Promise((r) => requestAnimationFrame(r));
      preGate.getFloatTimeDomainData(preBuf);
      sink.getFloatTimeDomainData(sinkBuf);
      for (let i = 0; i < preBuf.length; i++) pre = Math.max(pre, Math.abs(preBuf[i]));
      for (let i = 0; i < sinkBuf.length; i++) post = Math.max(post, Math.abs(sinkBuf[i]));
    }
    if (osc) { try { osc.stop(); } catch { /* already stopped */ } osc.disconnect(); }
    d.assert('nothing reaches a speaker until a person presses play',
      asked ? post > 0 : (pre > 0.01 && post === 0),
      asked
        ? `a trusted press opened the gate and ${post.toFixed(4)} is leaving`
        : `a 440 Hz tone reads ${pre.toFixed(4)} inside the page and `
          + `${post.toFixed(4)} past the gate`);

    // ── the morph ──────────────────────────────────────────────────────────
    //
    // 🔴 DRIVEN AND READ BACK OFF THE SERVER, NEVER WAITED FOR. A sound lasts
    // thirty-one seconds and the harness stops collecting 400 ms after the
    // assert count last grew, so a check that waited for a morph to come round
    // would report nothing and read as a broken page. What is graded is the
    // arithmetic and the delivery: put the tour at a known point, let one tick
    // write it, and ask scsynth what it is holding.
    // 🔴 A CHECK THAT READS A CONTROL BACK CANNOT READ A MOVING ONE, AND THIS
    // ONE FAILED BY EXACTLY THAT THE FIRST TIME IT RAN. four seconds ago
    // routes an envelope follower onto grain length, and on an exponential lane
    // taper(0.50) = 0.125 is a factor of 2.6: the read-back came back 0.7057
    // against 0.2733 asked for, which is the modulator working perfectly and
    // the assert asking the wrong question. hold(true) puts every destination
    // back on its base and stops writing, so the read-back grades DELIVERY; the
    // movement checks further down grade the movement, with the hold off.
    const A = PATCHES[0], B = PATCHES[1];
    holdTour(0, 0.25);
    tourTick();
    modulator.hold(true);
    await wait(250);
    const quarter = await sGet('msize');
    modulator.hold(false);
    const wantQ = morphOf(A, B, 0.25).values.size;
    const lo = Math.min(A.size, B.size), hi = Math.max(A.size, B.size);
    d.assert('a sound on the way to another reaches the engine, between the two it is between',
      quarter != null && Math.abs(quarter - wantQ) < Math.max(0.002, wantQ * 0.08)
      && quarter >= lo - 1e-6 && quarter <= hi + 1e-6,
      `grain length ${quarter?.toFixed(4) ?? '—'} against ${wantQ.toFixed(4)} asked for, `
      + `between ${lo} and ${hi}`);

    // 🔴 AND IT TRAVELS AS A RATIO, WHICH IS NOT THE SAME PLACE AS HALFWAY. A
    // grain length halfway between these two geometrically and halfway
    // arithmetically are different numbers, and only one of them spends any
    // time in the part of the lane where a granulator stops being a delay and
    // becomes a texture. If the two are too close to tell apart on this pair,
    // the check says so rather than passing on a distinction it cannot make.
    const geo = Math.sqrt(A.size * B.size);
    const lin = (A.size + B.size) / 2;
    const half = morphOf(A, B, 0.5).values.size;
    d.assert('and it travels as a ratio rather than as a difference',
      Math.abs(half - geo) < Math.abs(half - lin),
      `halfway is ${half.toFixed(4)}: ${geo.toFixed(4)} as a ratio, ${lin.toFixed(4)} as a difference`);

    // 🔴 WHAT CANNOT BE SLID IS STEPPED, ONCE, AT THE MIDDLE, AND THE CLOCK IS
    // WHAT DOES IT. mscanmode is a Select.kr index and 2.5 is not a mode.
    // The tour is put just before the crossover and then LEFT ALONE, so the
    // second reading is a fact about the page running rather than about this
    // check driving it.
    const C = PATCHES[3], E = PATCHES[4];            // POSITION into STRETCH
    holdTour(3, 0.42);
    tourTick();
    await wait(220);
    const modeBefore = Math.round(await sGet('mscanmode'));
    // k crosses 0.5 in 0.08 x MORPH_MS = 720 ms, and nothing below touches the
    // tour: the 25 Hz tick does it.
    await wait(1600);
    const modeAfter = Math.round(await sGet('mscanmode'));
    d.assert('the read head steps mode on its own at the middle, instead of landing between two modes',
      modeBefore === C.scanmode && modeAfter === E.scanmode,
      `${modeBefore} then ${modeAfter} with nothing touching it, wanted ${C.scanmode} then ${E.scanmode}`);

    // ⚠️ AND THE MOTIONS WENT WITH IT. Two motions cannot be crossfaded:
    // a sixteen-slot step source and an envelope follower are different
    // machines, not two settings of one. So the set of walking destinations has
    // to be the arriving sound's and never a union of both.
    const wantRoutes = routesOf(E).map((r) => r.dest);
    d.assert('the settings that walk are the arriving sound’s, not both sounds’',
      routedNow.size === new Set(wantRoutes).size
      && [...routedNow].every((n) => wantRoutes.includes(n)),
      `${[...routedNow].join(', ') || 'none'} walking, and ${E.name} asks for ${wantRoutes.join(', ') || 'none'}`);

    // ── it moves on its own, with a stationary control in the same reading ──
    //
    // 🔴 EVERY MOVEMENT CHECK NEEDS A STATIONARY CONTROL IN THE SAME READING OR
    // IT IS UNFALSIFIABLE. hold(true) puts every destination back on its base
    // and stops writing, and the tour has to go on advancing underneath it.
    //
    // 🔴 AND THE DESTINATION IS CHOSEN SO THE ANSWER IS ARITHMETIC RATHER THAN
    // LUCK. two seconds of it walks winstart from a TRIANGLE at 0.013 Hz,
    // and three things follow: a triangle's slope is constant everywhere except
    // at its two vertices, so the distance moved in a window is the same
    // wherever the window lands; the route declares phase: 0 itself so
    // setRoutes does not reassign it; and the excursion is taper(0.60) = 0.216
    // of a lane the base sits at 0.417 of, so it can never reach a clamp and
    // report a working modulator as a stuck one.
    //
    // ⚠️ AN AUDIO-DRIVEN ROUTE WOULD HAVE BEEN THE WRONG CHOICE HERE. It would
    // make this check depend on somebody else's programme being loud, which is
    // a check about the station rather than about the page.
    const MOVER = 7, LANE_SPAN = 2000;
    holdTour(MOVER, 0);
    tourTick();
    await wait(150);
    const pos0 = tourPos();
    const mv0 = modNow.winstart ?? null;
    const sends0 = modulator.stats().sends;
    await wait(LANE_SPAN);
    const mv1 = modNow.winstart ?? null;
    const sends1 = modulator.stats().sends;
    // 0.013 Hz over 2 s is 0.026 of a cycle; a triangle covers 4x that in its
    // own -1..1, and the amount is cubed to 0.216, so the lane moves 0.0225 and
    // the control moves 0.0135 in engine units. The threshold is a third of it.
    d.assert('a granulator setting walks itself, with nobody touching the page',
      mv0 != null && mv1 != null && Math.abs(mv1 - mv0) > 0.004 && sends1 > sends0,
      `window start ${mv0?.toFixed(4) ?? '—'} to ${mv1?.toFixed(4) ?? '—'} `
      + `(0.0135 predicted) · ${sends1 - sends0} writes in ${(LANE_SPAN / 1000).toFixed(1)} s`);

    modulator.hold(true);
    await wait(500);
    const sendsH0 = modulator.stats().sends;
    const mvH0 = modNow.winstart ?? null;
    await wait(700);
    const sendsH1 = modulator.stats().sends;
    const mvH1 = modNow.winstart ?? null;
    const posH = tourPos();
    modulator.hold(false);
    d.assert('and everything stops when it is told to, while the tour keeps advancing',
      mvH0 != null && mvH0 === mvH1 && sendsH1 === sendsH0 && posH > pos0,
      `held at ${mvH0?.toFixed(4) ?? '—'} for 700 ms with ${sendsH1 - sendsH0} writes, `
      + `while the tour moved ${(posH - pos0).toFixed(3)} of a sound`);

    // The blend, which is the one number a listener feels and which nothing on
    // this page lets anybody set.
    tourFrom = performance.now();                    // the top of a sound
    tourTick();
    const wLow = wet;
    tourFrom = performance.now() - 0.5 * SLOT_MS;    // its middle
    tourTick();
    const wHigh = wet;
    d.assert('the blend walks itself between the station and the grains, and both gains follow it',
      Math.abs(wHigh - wLow) > 0.3
      && Math.abs(dry.gain.value - (1 - wet)) < 1e-6
      && Math.abs(eng.out.gain.value - wet) < 1e-6,
      `${(wLow * 100).toFixed(0)}% at the top of a sound, ${(wHigh * 100).toFixed(0)}% at its middle`);

    // ── the loop, and the grain clock it tunes ─────────────────────────────
    //
    // 🔴 THE LOCK IS ARITHMETIC AND IT IS READ BACK OFF THE ENGINE. A figure of
    // elen steps at rate grains a second has a bar of elen / rate
    // seconds, and lockRate is the nearest rate that fits a whole number of
    // those bars into the lap. Both periods are exact: a looped AudioBuffer
    // repeats at its own sample count, bit identical, and the grain clock is a
    // Phasor in the same context, measured at 24000.0 +/- 0.2 samples against
    // 24000 asked for.
    endLoop();
    holdTour(5, 0);                                  // `the sixteenth`, which has a figure
    tourTick();
    await wait(150);
    // ⚠️ A SHORT LAP ON PURPOSE. The tour keeps the full eight seconds; the
    // check keeps two and a half, because eight seconds of waiting inside an
    // assert burst is eight seconds the harness spends collecting nothing.
    const LAP_S = 2.5;
    armLoop(LAP_S);
    for (let i = 0; i < 80 && loopState === 'filling'; i++) {
      // ⚠️ THE TOUR IS PINNED WHILE THE RING FILLS. It travels through real
      // seconds like everything else here, so without this the lock would be
      // made against one sound's figure and graded against another's.
      holdTour(5, 0);
      if (loopRing.filled >= Math.round(LAP_S * ctx.sampleRate)) setLoop();
      else await wait(100);
    }
    // The lap at speed 1, which is the same number relock uses. See the note
    // there for why the playback rate is deliberately not in it.
    const lapS = voiceTo - voiceFrom;
    // ⚠️ THE SAME subdivide THE PAGE USES. A prediction made under different
    // rules from the write it is grading is a check on a quantity next to the
    // one in question, which is how this page's neighbour lost a lock for a day.
    const predicted = lockRate(lapS, { rate: loaded.rate, elen: loaded.elen, name: loaded.name,
      subdivide: true });
    await wait(250);
    const lockedOnEngine = await sGet('mrate');
    d.assert('a loop keeps the seconds it was told to and plays them round',
      loopState === 'on' && !!loopBuf && lapS > 0.2,
      loopBuf ? `${loopBuf.duration.toFixed(2)} s kept, a lap of ${lapS.toFixed(2)} s`
              : 'nothing was playing, so there was nothing to loop');
    d.assert('the grain clock tunes itself to the lap, and the engine is holding that rate',
      predicted.rate != null && lockedRate != null && lockedOnEngine != null
      && Math.abs(lockedOnEngine - predicted.rate) < 0.05,
      `${predicted.why} · asked ${predicted.rate?.toFixed(3) ?? '—'}, `
      + `engine holds ${lockedOnEngine?.toFixed(3) ?? '—'}`);

    // ── several loops at once ──────────────────────────────────────────────
    //
    // 🔴 THE ONE THING THE CHECKS ABOVE CANNOT SEE. They grade a loop, and a
    // loop was already graded when the page could only hold one. What is new is
    // that a second is KEPT WHILE THE FIRST IS PLAYING, and that depends on the
    // ring tapping the station upstream of the level the loops duck: tapped
    // downstream it would record the ducked signal, so the assert compares the
    // two kept peaks rather than only counting voices.
    const peakOf = (b) => {
      const c = b.getChannelData(0);
      let p = 0;
      for (let i = 0; i < c.length; i += 7) p = Math.max(p, Math.abs(c[i]));
      return p;
    };
    const firstLap = voiceTo - voiceFrom;
    const peak1 = loopBuf ? peakOf(loopBuf) : 0;
    armLoop(1.0);
    for (let i = 0; i < 40 && loopRing.on; i++) {
      holdTour(5, 0);
      if (loopRing.filled >= Math.round(1.0 * ctx.sampleRate)) setLoop();
      else await wait(100);
    }
    const peak2 = loopBuf ? peakOf(loopBuf) : 0;
    const both = `${layers.length} playing, laps ${firstLap.toFixed(2)} s and `
      + `${(voiceTo - voiceFrom).toFixed(2)} s · kept peaks ${peak1.toFixed(3)} then ${peak2.toFixed(3)}`;
    // 🔴 A SILENT MOUNT GRADES A DIFFERENT CLAIM UNDER A DIFFERENT NAME rather
    // than the same one more weakly, which is the rule the station check below
    // already follows: with nothing on air both peaks are zero and a comparison
    // between them would pass by measuring nothing.
    if (peak1 > 0.002) {
      d.assert('a second loop is kept while the first is playing, and it holds the station and not the ducked silence',
        layers.length === 2 && Math.abs((voiceTo - voiceFrom) - firstLap) > 0.2
        && peak2 > peak1 * 0.25, both);
    } else {
      d.assert('a second loop is kept while the first is playing, on a station that was sending nothing to hear',
        layers.length === 2 && Math.abs((voiceTo - voiceFrom) - firstLap) > 0.2, both);
    }

    // ⚠️ THE TOUR IS PUT BACK WHERE THE LOCK WAS MADE BEFORE THE RATE IS READ,
    // and the first run of this check is why. Filling a loop takes seconds, and
    // the tour goes on travelling through them: by the time the loop came off,
    // the page was 34% of the way from a sound at 16 grains a second to one at
    // 2, so the engine honestly held 8.636 and the assert compared it against
    // 16. That is the check measuring a quantity next to the one in question.
    endLoop();
    holdTour(5, 0);
    tourTick();
    await wait(300);
    const freeRate = await sGet('mrate');
    d.assert('and it comes back off the lock when the loop ends',
      lockedRate == null && freeRate != null && Math.abs(freeRate - loaded.rate) < 0.6,
      `${freeRate?.toFixed(3) ?? '—'} against the ${loaded.rate} written into ${loaded.name}`);

    // ── the stations ───────────────────────────────────────────────────────
    //
    // ⚠️ THROUGH THE REAL PATH, NOT BY SETTING A VARIABLE. What this is about is
    // the wiring between choosing a station and bytes arriving from it, and
    // assigning station steps straight over that.
    // 🔴 AND WHEN THERE IS NOWHERE TO GO IT GRADES A DIFFERENT CLAIM UNDER A
    // DIFFERENT NAME, RATHER THAN THE SAME ONE MORE WEAKLY. MEASURED twice in
    // one afternoon: the relay had five of six mounts refusing, then four, then
    // three, and this check had no second station to press. A downgrade that
    // keeps the label reads exactly like a check that passed, so the label says
    // which of the two runs this was. What it costs is that a red suite cannot
    // be blamed on the relay without reading the line.
    //
    // 🔴 AND IT WALKS PAST A MOUNT THAT ANSWERS AND THEN SENDS NOTHING, WHICH IS
    // WHAT THESE MOUNTS DO. MEASURED: Radio 1965 to IDA Helsinki · 0 blocks
    // decoded off the new one, on a station /health had called up thirty
    // seconds earlier. A check that presses ONE button and grades the result is
    // grading the broadcaster's afternoon; pressing until something delivers or
    // the list runs out grades the wiring, which is the thing in question.
    const was = station;
    let landedOn = null, blocks = 0;
    for (let tries = 0; tries < 3 && !landedOn; tries++) {
      const cand = pickStation();
      if (!cand) break;
      switchTo(cand, 'checking that a change really changes the source');
      for (let i = 0; i < 60 && !(stream && stream.stats().blocks > 0); i++) await wait(100);
      blocks = stream ? stream.stats().blocks : 0;
      if (blocks > 0) { landedOn = cand; break; }
      // ⚠️ MARKED DOWN HERE RATHER THAN THROUGH dropStation, which switches on
      // its own: this loop owns the walk, and two things choosing the next
      // station would skip one of them every time.
      avail.set(cand, false);
      d.log(`${nameOf(cand)} answered and then sent nothing, so it is being left out`, 'bad');
    }
    if (landedOn) {
      d.assert('changing station really changes what is being decoded',
        station === landedOn && blocks > 0,
        `${nameOf(was)} to ${nameOf(landedOn)} · ${blocks} blocks decoded off the new one`);
    } else if (stream && stream.stats().blocks > 0) {
      const up = STATIONS.filter(([, id]) => avail.get(id) !== false).map(([n]) => n);
      d.assert('with one station left answering, the page stays on it and says so',
        up.length === 1 && up[0] === nameOf(station),
        `${nameOf(station)} is the only mount answering, and it is still decoding `
        + `${stream.stats().blocks} blocks`);
    } else {
      // 🔴 THE THIRD SITUATION, AND IT IS THE ONE THAT WAS HAPPENING WHILE THIS
      // WAS BEING WRITTEN: every mount refusing, including the ones /health
      // calls up. Three of these six answer a probe with a 200 and then send no
      // bytes at all, which is what a volunteer Icecast does when it is unwell,
      // and it is not something this page can fix or should read as its own
      // failure. What it CAN be graded on is whether it said so and carried on
      // drawing rather than going blank and leaving somebody to debug a browser.
      const said = (d.api?.logs ?? []).some((l) =>
        /sent nothing|stopped answering|refusing|nothing to play|is down/i.test(l.msg));
      d.assert('with every mount refusing, the page says so and goes on drawing',
        said && frames > 0,
        `${nameOf(station)} answered a probe and delivered `
        + `${stream ? stream.stats().blocks : 0} blocks · the log names it and the picture has drawn `
        + `${frames} frames`);
    }

    // 🔴 AND THE ONE THAT MATTERS WHEN THE RELAY IS UNWELL: a station known to
    // be down is never chosen. Three of these six mounts were refusing within
    // an hour of this page being written, so this is the ordinary case and not
    // an edge one. ⚠️ It is proved by BREAKING it: one station is marked down
    // and every starting point is asked, which is the only way to know the
    // refusal fires rather than that it happens to be unnecessary.
    const pig = STATIONS.find(([, id]) => id !== station)?.[1];
    const wasKnown = avail.get(pig);
    avail.set(pig, false);
    const chose = STATIONS.map(([, id]) => pickStation(id));
    avail.set(pig, wasKnown);
    d.assert('a station that is not answering is never chosen',
      !chose.includes(pig),
      `${nameOf(pig)} marked down and skipped from all ${chose.length} starting points`);

    // ── the screen ─────────────────────────────────────────────────────────
    //
    // ⚠️ IT REPORTS WHICH MECHANISM RAN, because an iPhone has no element
    // fullscreen at all and requestFullscreen?.() optional-chains straight
    // past the missing method: no throw, no catch, no log line and no picture.
    // A page that cannot say which path it took cannot be debugged from a phone.
    const by = await FS.toggle(pane);
    const wasFull = FS.isFull(pane);
    await FS.exit(pane);
    d.assert('the full screen control says which mechanism it used',
      (by === 'element' || by === 'faux') && wasFull,
      `${by}${by === 'faux' ? ', the cover that needs no API' : ', the browser’s own API'}`);

    /**
     * 🔴 THE SEA, GRADED IN THE WINDOW, WHICH IS THE ONLY PLACE IT CAN BE.
     *
     * `preview()` builds the session's own context, draws BOTH eyes into one
     * off-screen framebuffer through the same `drawEye` a headset uses, and
     * reads every pixel back. It cannot say anything about a frame rate, about
     * the compositor, or about what a 3360x1760 framebuffer costs, and it says
     * so in its own note. What it CAN say is: the programs linked, the surface
     * was reached, there is no graphics error pending, and the ink is a RAMP
     * rather than a disc.
     *
     * ⚠️ THIS OPENS NOTHING OF ANYBODY ELSE'S. It is a shader, a plane and a
     * readback. That is the whole reason the XR half of this page is graded
     * here rather than by pointing a harness at the slug, which would connect
     * to five live mounts.
     */
    {
      // ⚠️ THE CHAIN NEEDS ONE STEP BEFORE THERE IS A TEXTURE TO DRAW WITH, and
      // `preview` calls `onFrame` itself every frame, which is what does it. So
      // this asks for enough frames to have stepped, drawn and settled.
      const pv = await xrPreview();
      const cover = pv && pv.surface;
      d.assert('the sea builds in the headset’s own context and is reached every frame',
        !!pv?.ok && !!cover?.attached && cover.draws >= 2 && pv.glError === 0,
        !pv?.ok ? `no preview: ${pv?.why || 'unknown'}`
          : `${cover?.attached ? 'attached' : `refused: ${cover?.why}`}`
            + ` · drawn ${cover?.draws ?? 0} times · ${pv.glWhere}`
            + ` · the chain stepped ${theSea.frames()} frames`);
      /**
       * 🔴 A RAMP, NOT A DISC, AND THE DIFFERENCE IS THE WHOLE FEATURE.
       * Read along the middle row of one eye: the fade is measured from the
       * VIEWER, so ink near the centre of the eye must be brighter than ink at
       * its edge. A plane drawn at one flat alpha passes every other check on
       * this page and fails only this one.
       */
      const ramp = pv?.ok ? fadeRamp(pv) : null;
      d.assert('the sea fades out in every direction rather than ending at an edge',
        !!ramp && ramp.mid > ramp.rim * 1.35 && ramp.rim < 40,
        ramp ? `the middle of the view reads ${ramp.mid.toFixed(1)} and its edge `
          + `${ramp.rim.toFixed(1)} of 255, against a ground of ${ramp.bg.toFixed(1)}`
          : 'the preview gave no pixels to read');
    }

    // The tour was moved about; put it back at the start so a visitor arrives at
    // the beginning of a sound rather than in the middle of a crossover.
    tourFrom = performance.now();
    checking = false;
  }

  // ⚠️ THE PAGE SAYS WHAT IT IS BEFORE ANYTHING IS PRESSED, so somebody who
  // never touches it still knows what would happen. ⚠️ AND NO CELL IS PRE-SET
  // TO A NUMBER: a zero in a readout reads as a very confident measurement of
  // nothing, and every cell here is pending until it has been measured.
  d.log(`${PATCHES.length} sounds, ${(SLOT_MS / 1000).toFixed(0)} s each, `
    + `${STATIONS.length} stations, one picture. Press play.`);
</script>
