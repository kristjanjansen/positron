<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<!-- 🔴 NO PAGE STYLESHEET SINCE 2026-09-29, for the reasons `/llhls/` writes
     down in the same breath. The picture is a video panel now, whose stage owns
     the element's width, height, shape and object-fit, and the `.hold` pill that
     showed the publisher was replaced by the stream toggle in the control row. -->

<script type="module">
  import { mount, guard, el, armVideo, playOrPrompt } from '/shell/shell.mjs';
  import { whep, holdPublisher, waitForWhip, watchPresentedFps, fetchIceServers, readIcePath } from '/shell/live.mjs';
  import { createPresenceButton, streamSays, STREAM_CAN } from '/shell/presence.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createDiagram } from '/shell/diagram.mjs';
  import { SELFCHECK, DEEP } from '/shell/selfcheck.mjs';

  const d = mount({
    name: 'webrtc',
    // 🔴 ONE SENTENCE, AND IT IS THE INDEX'S OWN LINE. Asked 2026-09-29:
    // *"shorten desc to 1 sentence"*. It was six, and each one of them has a
    // better home than the top of a page: what the handshake is and how the
    // stream stops are the picture at the foot of this page, what the control
    // does is the control's own label, and what the round trip means is its
    // footer label's business. This project has cut this rule from four
    // sentences to three to one and broken it every time within a few pages.
    what: 'The same live picture the HLS pages play, delivered over WHEP instead.',
    // 🔴 `rtt` WAS A KEY THAT READ AS A LATENCY CLAIM. Quoting this number
    // beside a glass-to-glass one flattered WHEP by about three times once
    // already (CLAUDE.md, candidate-pair RTT). The words now say what it is,
    // and `state` says `playing`/`paused` rather than `playing rs4`: the
    // readyState behind it is in the assert's detail, where a number that needs
    // a spec to read belongs.
    // ⚠️ `fps` AND `picture` LEFT THIS ROW ON 2026-09-29 AND WERE NOT DROPPED.
    // They are facts about the PICTURE and they now sit in the picture's own
    // footer, which is where the kit puts a number that belongs to one element.
    // A row above the panel repeating them would be the same fact twice.
    //
    // 🔴 SIX CELLS OUT OF `getStats()` SINCE 2026-09-30, asked as *"add some
    // stats to webrtc and moq demo"* against `/llhls/`'s six. NOT THE SAME SIX:
    // holes, switches and advance are facts about segments and a playlist, and a
    // WHEP receiver has neither. What it has is what the receiver itself counts,
    // so every cell below is read off one `getStats()` a second, and they
    // answer the two questions a visitor has: is it smooth, and how long does
    // a frame wait here. Sources, all on the VIDEO `inbound-rtp` unless named:
    //   buffer   delta jitterBufferDelay / delta jitterBufferEmittedCount, so
    //            how long a frame sat in the receiver's buffer over the last
    //            second. Cumulative average until there is a previous sample.
    //   jitter   `jitter`, seconds on the wire, shown as ms
    //   lost     `packetsLost` since the connection opened
    //   dropped  `framesDropped`, decoded or received and never shown
    //   freezes  `freezeCount`, the browser's own count of visible freezes
    //   codec    the `codec` report the video `inbound-rtp`'s `codecId` points
    //            at, which is what was NEGOTIATED rather than the
    //            `H.264 + Opus` that used to be typed into the footer.
    // 🔴 `round trip` LEFT THIS ROW FOR THE PICTURE'S FOOTER, LABELLED AS A
    // NETWORK ROUND TRIP. It is `candidate-pair` RTT, which is not media latency
    // (positron-streaming: beside MoQ's glass to glass it flattered WHEP about
    // three times). No cell here claims glass to glass, because nothing on this
    // page can measure it: the machine-readable clock row was taken out of the
    // encoder on 2026-09-08, and the digits still burned into the picture are
    // for a person's eye, not for this page to read.
    // ⚠️ `codec` IS THE VIDEO CODEC ALONE. `H.264 + Opus` was cut to `H.264 …`
    // at 375 px, MEASURED, and the audio side is not a choice anybody makes on
    // this leg, so the log line carries both and the cell carries the one that
    // decides the picture.
    // ⚠️ `state` WENT TO MAKE ROOM, and nothing it said is lost: the toggle
    // says whether the stream is on, and `element is playing` grades the element.
    readout: { buffer: 'ms', jitter: 'ms', lost: '', dropped: '', freezes: '', codec: '' },
    // No primary button. See the note on the control below, and `/llhls/`,
    // which was asked for the same thing in the same sitting.
    controls: [],
  });
  guard(d);

  /**
   * 🔴 THE SAME CONTROL AND THE SAME THREE WORDS AS `/llhls/`, OUT OF THE SAME
   * MAP. Asked 2026-09-29 as *"same treatment"*. `STREAM` lives in
   * `presence.mjs` beside `WIRED` precisely so these two pages cannot drift into
   * two vocabularies for one idea, and `createPresenceButton` was already the
   * control: a row button whose face is a live badge with a reserved width.
   *
   * 🔴 A PRESS DURING `starting` STOPS HERE TOO, and the middle state is if
   * anything longer on this leg. The container has to wake, ffmpeg has to reach
   * DTLS, and Cloudflare then holds a WHIP input against a stale publisher for
   * about 45 s before it will accept a new session, which has no equivalent on
   * the RTMPS side.
   */
  const stream = createPresenceButton({
    of: '', showName: false, state: 'offline', says: streamSays('WebRTC'), can: STREAM_CAN,
    aria: 'start or stop the stream',
    press: () => d.run('toggle'),
  });
  stream.because('nothing is publishing until you press');
  d.controls.hidden = false;
  d.controls.append(stream.el);

  // No native `controls`: see `/llhls/`, where the element's own bar drew a
  // scrub bar over a live stream and a second ⛶ an inch above the panel's.
  const video = el('video', '', null, { playsinline: '', muted: '', autoplay: '' });
  video.muted = true;

  /**
   * The picture, its resolution and its frame rate, in cells rather than in one
   * string with glue in it. `/llhls/` carries the argument in full; what differs
   * here is the encoder, and it must not be copied across: this leg is WHIP, so
   * the audio is libopus rather than AAC and the video is offered as baseline
   * 3.1, MEASURED in `rig/whep/WHIP-FFMPEG-NOTES.md`.
   */
  const panel = createVideoPanel({
    media: video,
    left: null,
    fullMode: 'hover',
    values: [
      { key: 'size', label: '', reserve: 9 },
      { key: 'fps', label: 'fps', reserve: 4 },
      /**
       * 🔴 THE ONE LATENCY ON THIS PAGE, AND ITS LABEL SAYS WHICH KIND. Asked
       * 2026-09-30 with the readout: a latency in the footer that cannot be
       * mistaken for glass to glass. It is `candidate-pair`
       * `currentRoundTripTime`, a network round trip between this browser and
       * Cloudflare, and says nothing about encode, the SFU, the buffer or the
       * decoder.
       * ⚠️ IT TOOK `source`'S PLACE RATHER THAN BECOMING A FOURTH CELL. At 375 px
       * a fourth cell scrolled and cut the codec in half (see the viewer count
       * below), and the codec is now MEASURED into the readout's `codec` cell
       * instead of typed here.
       */
      // ⚠️ `network ping` AND NOT `network round trip`, MEASURED: at 375 px the
      // longer label ran the value row 25 px past its box (284 against 259) and
      // cut the unit off the number. `ping` is the everyday word for exactly
      // this quantity, and `network` is what stops it reading as the picture's
      // own delay.
      // 🔴 AND `ping` ALONE SINCE 2026-09-30, MEASURED AGAIN FOR THE SAME REASON.
      // The route cell beside it made the row 303 px against 259 at 375 px, so
      // `direct` scrolled out of sight, which is the one word the cell exists to
      // show. Dropping `network` gives back 46 px and the row fits. The route
      // word now does the job `network` did: `ping 20 ms direct` cannot be read
      // as the picture's own delay.
      { key: 'rtt', label: 'ping', reserve: 6 },
      /**
       * 🔴 WHICH ROUTE THE MEDIA TOOK, BESIDE THE PING, SINCE 2026-09-30.
       * `direct` or `relay`, read off the selected candidate pair by
       * `readIcePath`. A ping through Cloudflare's TURN relay is not comparable
       * to a direct one, so the number is never shown without its route.
       * No label: the word is the value and says what it is.
       */
      { key: 'path', label: '', reserve: 6 },
    ],
  });
  /**
   * 🔴 THE SPEC IS WRITTEN WHEN THERE IS A PICTURE TO BE A SPEC OF, NOT ON
   * LOAD. Asked 2026-09-29 against a phone screenshot of this page sitting at
   * `STREAM OFF`: *"Do not show video details until we have incomng data"*.
   * It used to be set here, at build time, which kept the footer's value row
   * non-empty for ever and so kept it on screen describing a stream nobody had
   * started.
   * ⚠️ **AND THE HIDING IS THE KIT'S, NOT THIS PAGE'S.** `createPanelValues`
   * hides its row while every cell is empty, so all this page has to do is not
   * write a cell early. There is no `hide()` call here to forget.
   */
  d.el.append(panel.el);

  // A custom property, never `video.style.aspectRatio`. See `/llhls/`: an
  // inline style on the element beats the two stylesheet rules that let a panel
  // fill a screen. An SFU can change a sender's resolution mid-call and `resize`
  // is the only event that reports it, which is why this is not read once.
  const shape = () => {
    const w = video.videoWidth, h = video.videoHeight;
    if (!w || !h) return;
    panel.values.set('size', `${w}x${h}`);
    panel.stage.style.setProperty('--vp-aspect', `${w} / ${h}`);
  };
  video.addEventListener('loadedmetadata', shape);
  video.addEventListener('resize', shape);

  let pc = null, ws = null, started = 0;
  let held = false, unwatchFps = null, abort = null, playing = false;
  // A generation, because the start path awaits a cold container and then
  // retries a WHEP offer six times: every one of those is a place a press can
  // land. See `/llhls/`, which took the same shape in the same sitting.
  let gen = 0;

  /**
   * 🔴 RELAY SERVERS ARE ASKED FOR ON THE PRESS, NEVER ON LOAD. A visit opens
   * nothing. `fetchIceServers` never throws; with no relay it hands back STUN
   * alone and says why, and ICE still chooses its route either way, so a
   * network with working UDP keeps the direct path and costs no relay bytes.
   * `iceLoadAsks()` reads resource timing, so it counts every request the
   * browser made to the relay route before the first press rather than the
   * ones this page remembered to count, and must read 0.
   */
  let ice = null, iceAsks = 0, pressAt = null, icePath = null;
  const iceLoadAsks = () => performance.getEntriesByType('resource')
    .filter((e) => /\/ice(\?|$)/.test(e.name) && (pressAt == null || e.startTime < pressAt)).length;
  function askIce() {
    iceAsks++;
    return fetchIceServers({ log: (m) => d.log(m) });
  }

  // A WHEP client is small: offer recvonly, POST the SDP, take the answer.
  async function whepPlay(url) {
    pc = new RTCPeerConnection({
      bundlePolicy: 'max-bundle',
      ...(ice?.iceServers?.length ? { iceServers: ice.iceServers } : {}),
    });
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.addTransceiver('audio', { direction: 'recvonly' });
    // A WEBRTC TRACK ARRIVES MUTED and unmutes only once media actually
    // flows. Assigning srcObject before that gives iOS a stream with no
    // frames yet, and it paints black and stays there even though decoding
    // later succeeds — which is exactly what the phone showed: rtt 16 ms,
    // 26 fps inbound, and a black rectangle.
    // ONE stream that we own, and every arriving track gets added to it.
    //
    // Adopting e.streams[0] per track loses tracks: Cloudflare delivers audio
    // and video with different msids, so the second ontrack REPLACED srcObject
    // and threw the first track away. Whichever unmuted last won, which is a
    // race — the suite showed "video:live" alone on one run and "audio:live"
    // alone on the next, while getStats() reported 2125 video frames decoded at
    // 1280x720 either way. Same bug, opposite faces.
    const inbound = new MediaStream();
    pc.ontrack = (e) => {
      inbound.addTrack(e.track);
      const attach = async () => {
        if (video.srcObject !== inbound) video.srcObject = inbound;
        // play AFTER attaching a live stream, not before
        try { await video.play(); d.log(`attached on ${e.track.kind} unmute`); }
        catch (err) { await playOrPrompt(video, d); }
      };
      if (e.track.muted) e.track.addEventListener("unmute", attach, { once: true });
      else attach();
      // some builds never fire unmute; metadata is a second chance
      video.addEventListener("loadedmetadata", () => video.play().catch(() => {}), { once: true });
    };
    pc.onconnectionstatechange = () => d.log(`pc ${pc.connectionState}`);

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    // wait for ICE gathering so the offer is complete (no trickle to WHEP)
    if (pc.iceGatheringState !== 'complete') {
      await new Promise((res) => {
        const t = setTimeout(res, 3000);
        pc.addEventListener('icegatheringstatechange', () => {
          if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); }
        });
      });
    }
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'content-type': 'application/sdp' },
      body: pc.localDescription.sdp,
    });
    if (!res.ok) throw new Error(`WHEP ${res.status}`);
    const answer = await res.text();
    await pc.setRemoteDescription({ type: 'answer', sdp: answer });
    return res.headers.get('location');
  }

  /**
   * 🔴 `stream.state()`, NOT `stream.state`. It is a FUNCTION on the presence api
   * (`state: () => now`) and `createPresenceButton` hands it through a getter,
   * so the bare property is the function itself and `fn === 'offline'` is false
   * forever. MEASURED on the first run of this control: the harness pressed the
   * toggle, this line called `stop()` on a page that had never started, and the
   * suite read 16/16 GREEN with the page's own assert count down from 6 to 2.
   * `/twelve/` had already written this trap down, in these words: a comparison
   * against a function is a comparison that cannot fail.
   */
  d.on('toggle', () => (stream.state() === 'offline' ? start() : stop()));

  /**
   * Let it go. The socket is the reference count, so closing it is the whole of
   * it from this end and the publisher's own sweep stops the encoder about a
   * minute later. The peer connection is closed here as well, because unlike
   * the socket it costs Cloudflare delivered minutes for as long as it is up.
   */
  function stop() {
    gen++;
    abort?.abort(); abort = null;
    unwatchFps?.(); unwatchFps = null;
    try { ws?.close(); } catch { /* already gone */ }
    ws = null;
    held = false;
    playing = false;
    try { pc?.close(); } catch { /* already gone */ }
    pc = null;
    try { video.pause(); } catch { /* fine */ }
    video.srcObject = null;
    panel.values.set('fps', '');
    panel.values.set('size', '');
    panel.values.set('rtt', '');
    panel.values.set('path', '');
    icePath = null;
    clearStats();
    stream.set('offline').because('the publisher stops about a minute after the last viewer goes');
    d.log('let the publisher go. it stops about a minute after the last viewer goes');
  }

  /* 🔴 TWO TIERS, asked 2026-10-04: *"make checks way ligher (2 tiers?)"*,
     *"i mean these long-running ones"*. This press holds the publisher, asks
     for relay servers, waits out a cold container's WHIP leg and then a WHEP
     handshake and its first frames: a minute of Stream on a cold day. An
     ORDINARY harness run (`selfcheck=1`) starts none of it and grades the page
     at rest; `DEMO_DEEP=1 node demo/verify.mjs webrtc` runs the rest. A visitor
     is never `LIGHT`, so their press is unchanged. */
  const LIGHT = SELFCHECK && !DEEP;

  async function start() {
    if (pc) return;
    if (LIGHT) {
      d.log('left for the deep run: the publisher, the relay servers, the WHIP leg and the WHEP picture (DEMO_DEEP=1)');
      await d.run('check');
      return;
    }
    pressAt ??= performance.now();
    const mine = ++gen;
    abort = new AbortController();
    stream.set('coming').because('press again to stop it');
    armVideo(video);          // before any await, or iOS refuses later
    playing = false;
    unwatchFps = watchPresentedFps(video, (r) => panel.values.set('fps', r == null ? '' : r.toFixed(1)));
    /**
     * 🔴 THE VIEWER COUNT IS REHOMED, NOT DELETED. The badge that went carried
     * two facts: whether this page is holding the publisher, which the toggle
     * now says in words, and HOW MANY are holding it, which the toggle cannot
     * say at all. Deleting a display without rehoming what it said is how a
     * page quietly stops reporting something.
     * ⚠️ AND IT IS A LOG LINE RATHER THAN A FOURTH FOOTER CELL, MEASURED
     * RATHER THAN CHOSEN. At 375 px a four cell row could not fit beside the
     * panel's own square and scrolled, cutting `H.264 + AAC` in half, and a row
     * that has to be dragged sideways is a row nobody reads. A count that
     * changes when somebody arrives or leaves is an EVENT, which is what the
     * log is for; the other three are properties of the picture above it.
     */
    let sawViewers = null;
    ws = holdPublisher((s) => {
      held = !!s.held;
      if (s.viewers != null && s.viewers !== sawViewers) {
        sawViewers = s.viewers;
        d.log(`${s.viewers} watching`);
      }
    });
    d.log('holding the publisher open');
    // Asked now, in parallel with the container waking, and awaited before
    // the first offer, because WHEP takes no trickle and the offer has to carry
    // the relay candidates it is ever going to have.
    const iceAsk = askIce();

    // Wait for the WHIP LEG, not the HLS manifest. They are different inputs.
    const w = await waitForWhip({
      signal: abort.signal,
      onTick: ({ waitedMs, err }) => d.log(`whip leg not up at ${(waitedMs / 1000).toFixed(0)}s${err ? ` (${err})` : ''}`),
    });
    if (gen !== mine) return;   // stopped while the container was waking
    // 🔴 A PAGE THAT CANNOT REACH ITS SUBJECT SAYS SO, IN AN ASSERT, NOT IN A LOG.
    // This line used to `d.log` and return, which is how this page read 8/8
    // GREEN on a desk where it had never connected: a log is not graded, so the
    // suite saw a page that simply stopped having opinions. MEASURED 2026-09-25:
    // `node demo/verify.mjs webrtc` printed `page asserted something · 2`, and
    // both of those two are the shell's feedback-button asserts.
    // ⚠️ `aborted` IS NOT A FAILURE. The page being left is the harness tearing
    // down, and grading that red would make every clean teardown a defect.
    if (!w.ok) {
      stream.set('offline').because('the publisher did not come up');
      if (w.aborted) { d.log('page left', 'bad'); return; }
      d.assert('the whip leg came up', false,
        `no publisher after ${(w.waitedMs / 1000).toFixed(0)}s, so nothing could be played`);
      await d.run('check');
      return;
    }
    d.log(`whip leg publishing after ${(w.waitedMs / 1000).toFixed(1)}s`, 'hi');
    ice = await iceAsk;
    if (gen !== mine) return;

    // ffmpeg reaching DTLS state=10 is not the same as Cloudflare being ready
    // to answer a WHEP offer, so a 409 here is "not yet" rather than "no".
    for (let attempt = 1; attempt <= 6; attempt++) {
      try {
        started = performance.now();
        await whepPlay(whep());
        d.log(`WHEP negotiated in ${Math.round(performance.now() - started)} ms`, 'hi');
        await playOrPrompt(video, d);
        // 🔴 `break`, NOT `return`, AND THIS ONE CHARACTER IS WHY THIS PAGE HAS
        // NEVER GRADED ITSELF. A `return` here leaves `d.run('check')` below
        // unreachable on the SUCCESS path, and the failure path returns too, so
        // every route out of this handler skipped the checks. The standing
        // explanation in this repository was that the checks sat behind a
        // connection that never happened. That was wrong and it was the more
        // comforting answer: they sat behind a connection that DID happen, and
        // were skipped anyway. MEASURED 2026-09-25 with a publisher awake and
        // WHEP media confirmed reaching this machine at 389 frames and
        // 3,554,870 bytes: still `page asserted something · 2`.
        break;
      } catch (e) {
        try { pc?.close(); } catch { /* fine */ }
        pc = null;
        if (gen !== mine) return;      // stopped between the offer and the answer
        d.log(`whep attempt ${attempt}: ${e.message}`, 'bad');
        if (attempt === 6) { stream.set('offline').because('WHEP would not connect'); d.fail(e); return; }
        await new Promise((r) => setTimeout(r, 4000));
        if (gen !== mine) return;      // stopped during the wait before the next try
      }
    }
    if (gen !== mine) return;
    settle();
    /**
     * ⚠️ THE CELLS ARE READ ONCE MORE BEFORE THEY ARE GRADED, AND GIVEN UP TO
     * 4 s TO HAVE SOMETHING TO SAY. The interval below reads `getStats()` once a
     * second on its own clock, so at this line it may not have run since the
     * answer came back, and `buffer` needs the receiver to have emitted at
     * least one frame. Waiting here rather than inside the check keeps the
     * check synchronous, which is what stops the harness walking off mid-check.
     */
    for (let i = 0; i < 8 && gen === mine; i++) {
      await readStats();
      if (stat.buffer != null && stat.codec && stat.rtt != null && icePath?.path) break;
      await new Promise((r) => setTimeout(r, 500));
    }
    if (gen !== mine) return;
    // The checks read what this control just produced, so this is the first
    // moment they can be true, and a button for them would make them optional.
    await d.run('check');
  }

  /**
   * 🔴 `on` IS A MEASUREMENT AND IT IS LATCHED, THE SAME RULE AS `/llhls/`.
   * The control says whether the STREAM is on. A visitor who pauses with the
   * element's own controls is still holding the socket and still costing
   * delivered minutes, so a toggle that read `starting` again there would be
   * describing the player while claiming to describe the source.
   * ⚠️ AND ON THIS PAGE THE LATCH IS `framePresented`, WHICH ALREADY EXISTS AND
   * ALREADY CARRIES THE ARGUMENT: this is the page where `26 fps inbound` sat
   * beside a black rectangle, so `a track arrived` is not `the stream is on`.
   */
  function settle() {
    if (!ws) return;
    notePresented();
    if (framePresented) playing = true;
    stream.set(playing ? 'online' : 'coming')
      .because(playing ? 'press to stop it' : 'the container and its encoder are waking. press again to stop');
  }
  video.addEventListener('playing', settle);
  video.addEventListener('loadeddata', settle);
  video.addEventListener('resize', settle);

  /**
   * What the readout and the footer's round trip were last written with, as
   * numbers, so the check grades the reading rather than the cell's text.
   * `jb` is the previous jitter buffer pair, for the one-second delta.
   */
  const stat = { buffer: null, jitter: null, lost: null, dropped: null, freezes: null, codec: '', rtt: null, nack: null };
  let jb = null;
  function clearStats() {
    for (const k of Object.keys(stat)) stat[k] = k === 'codec' ? '' : null;
    jb = null;
    for (const k of ['buffer', 'jitter', 'lost', 'dropped', 'freezes', 'codec']) d.set(k, '');
  }
  // A mimeType is `video/H264` or `audio/opus`; the name a reader knows is
  // `H.264` and `Opus`. Anything unlisted is shown as the browser said it.
  const CODEC = { h264: 'H.264', opus: 'Opus', vp8: 'VP8', vp9: 'VP9', av1: 'AV1', pcmu: 'PCMU', pcma: 'PCMA' };
  const codecName = (mime) => {
    const n = String(mime || '').split('/').pop();
    return CODEC[n.toLowerCase()] || n;
  };

  async function readStats() {
    const p = pc;
    if (!p) return;
    const stats = await p.getStats().catch(() => null);
    // Stopped while the reading was in flight: a closed connection's numbers
    // must not land in cells that `stop()` has just emptied.
    if (!stats || p !== pc) return;
    let vin = null, ain = null;
    for (const s of stats.values()) {
      if (s.type === 'inbound-rtp' && s.kind === 'video') {
        vin = s;
        // ⚠️ `framesPerSecond` IS NOT WHAT THE FOOTER SHOWS, AND THAT IS
        // DELIBERATE SINCE 2026-09-29. This is the DECODER's rate, and this page
        // is the one that measured 26 fps of it over a black rectangle. The
        // footer counts frames the compositor actually presented, through
        // `requestVideoFrameCallback`. The decoder's own numbers stay here,
        // where the assert reads them as its detail.
        // Keep these: "videoWidth is 0" alone cannot tell apart "no video RTP
        // arrived at all" from "packets arrived and the decoder produced
        // nothing" from "frames decoded but never presented". They are three
        // different bugs and the assert used to report all three the same way.
        lastVideoRtp = {
          received: s.framesReceived, decoded: s.framesDecoded, dropped: s.framesDropped,
          packets: s.packetsReceived, bytes: s.bytesReceived, w: s.frameWidth, h: s.frameHeight,
          decoder: s.decoderImplementation, keyframes: s.keyFramesDecoded,
        };
      }
      if (s.type === 'inbound-rtp' && s.kind === 'audio') ain = s;
      if (s.type === 'candidate-pair' && s.state === 'succeeded' && s.nominated !== false
        && Number.isFinite(s.currentRoundTripTime)) {
        stat.rtt = s.currentRoundTripTime * 1000;
        panel.values.set('rtt', `${Math.round(stat.rtt)} ms`);
      }
    }
    if (!vin) return;
    // How long a frame waited in the receiver's buffer over the last second.
    // The cumulative average is the fallback only until a previous sample
    // exists, because it is mostly a report on the first second of the call.
    const delay = vin.jitterBufferDelay, emitted = vin.jitterBufferEmittedCount;
    if (Number.isFinite(delay) && emitted > 0) {
      const dn = jb ? emitted - jb.emitted : 0;
      stat.buffer = dn > 0 ? ((delay - jb.delay) / dn) * 1000 : jb ? stat.buffer : (delay / emitted) * 1000;
      jb = { delay, emitted };
    }
    stat.jitter = Number.isFinite(vin.jitter) ? vin.jitter * 1000 : null;
    stat.lost = Number.isFinite(vin.packetsLost) ? vin.packetsLost : null;
    stat.dropped = Number.isFinite(vin.framesDropped) ? vin.framesDropped : null;
    stat.freezes = Number.isFinite(vin.freezeCount) ? vin.freezeCount : null;
    stat.nack = Number.isFinite(vin.nackCount) ? vin.nackCount : null;
    const name = (s) => { const m = s && stats.get(s.codecId)?.mimeType; return m ? codecName(m) : ''; };
    const codec = name(vin);
    // One line, once the video side is known, naming both sides.
    if (codec && codec !== stat.codec) d.log(`negotiated ${[codec, name(ain)].filter(Boolean).join(' + ')}`);
    stat.codec = codec;
    d.set('buffer', stat.buffer == null ? '' : Math.round(stat.buffer));
    d.set('jitter', stat.jitter == null ? '' : Math.round(stat.jitter * 10) / 10);
    d.set('lost', stat.lost ?? '');
    d.set('dropped', stat.dropped ?? '');
    d.set('freezes', stat.freezes ?? '');
    d.set('codec', stat.codec);
    const ip = await readIcePath(p);
    if (p !== pc) return;
    if (ip.path && ip.path !== icePath?.path) {
      d.log(ip.path === 'relay'
        ? `the media goes through the relay, over ${ip.relayProtocol || ip.protocol || 'an unknown protocol'}`
        : `the media goes direct, ${ip.local} to ${ip.remote} over ${ip.protocol}`, 'hi');
    }
    icePath = ip;
    panel.values.set('path', ip.path || '');
  }

  setInterval(() => {
    if (!pc) return;
    // the element's own view, which is where the black frame actually lives
    shape();
    settle();
    readStats();
  }, 1000);

  /**
   * Did the element EVER present a frame? Latched, not sampled.
   *
   * Two wrong versions preceded this one. Sampling videoWidth at check time
   * is a race — the assert failed three runs, then passed when two unrelated
   * lines were inserted ahead of it. Awaiting the frame INSIDE the check is
   * worse: the harness stops when asserts stop growing, so a 4 s await made it
   * tear down mid-check and four asserts silently vanished from the suite
   * (07 went 13 -> 9 while still reporting all green).
   *
   * A latch is both deterministic and synchronous: `resize` is the canonical
   * signal that videoWidth became known, and the 1 s stats interval already
   * running below is a second chance if it is missed.
   */
  let framePresented = null;
  function notePresented() {
    if (!framePresented && video.videoWidth > 0) {
      framePresented = `${video.videoWidth}x${video.videoHeight}`;
    }
  }
  video.addEventListener('resize', notePresented);
  video.addEventListener('loadeddata', notePresented);
  let lastVideoRtp = null;

  d.on('check', () => {
    // The claim the publisher badge used to carry, read off the socket rather
    // than off a pill, with the detail naming the control a visitor can see.
    /**
     * ⚠️ AND IT READS THE STATE THROUGH THE CALL, AND REQUIRES A STRING, WHICH
     * IS WHAT MAKES IT ABLE TO FAIL. `stream.state` without the parentheses is
     * a function, and a function is never `'offline'`, so a check written that
     * way would pass whatever the badge said. This one goes red on exactly the
     * bug that shipped for one run of this page.
     */
    const said = (stream.badge.textContent || '').trim();
    const state = stream.state();
    if (!LIGHT) d.assert('publisher held by this page',
      held && typeof state === 'string' && state !== 'offline',
      `toggle reads ${JSON.stringify(said)}, state ${state}, socket ${held ? 'held' : 'let go'}`);
    /**
     * The ask itself, graded: one button in the row, it is the toggle, and
     * nothing in it is a primary. Same check as `/llhls/`, because it is the
     * same ask.
     */
    const btns = [...d.controls.querySelectorAll('button')];
    d.assert('one control, and it is the stream toggle',
      btns.length === 1 && btns[0] === stream.el && !d.controls.querySelector('.pos-pri'),
      `${btns.length} control(s), classes ${btns.map((b) => b.className || '(none)').join(' ')}`);
    /**
     * 🔴 *"fix w so it did not ump horztally"*, MEASURED. Every cell is written
     * at its widest and at its narrowest and the ROW is measured both times,
     * because the defect is a cell shoving the one after it rather than a cell
     * resizing. Without the `reserve` on each field this goes red. Synchronous,
     * with the real readings back before this function yields, so nothing is
     * painted in between and a person watching the page sees none of it.
     */
    {
      const row = panel.values.el;
      const was = panel.values.keys().map((k) => [k, panel.values.cell(k).textContent]);
      const write = (o) => { for (const [k, v] of Object.entries(o)) panel.values.set(k, v); };
      /**
       * 🔴 THE ROW IS HIDDEN BEFORE A PRESS SINCE 2026-09-29, AND THIS CHECK
       * HAD TO STOP RELYING ON IT BEING THERE. It used to empty `size` and
       * `fps` and leave `source`, which held the row open. `source` was written
       * when a picture arrives now, so on a run with no press every cell is
       * empty, the kit hides the row, and both measurements would have read
       * **0 px** and the comparison would have passed having measured nothing.
       * That is this project's worst shape and it would have been green.
       * ✅ So the check writes one cell ITSELF in both states (`rtt` since
       * 2026-09-30, when it took `source`'s place), and `narrow > 0`
       * is a term of the assert rather than an assumption underneath it.
       */
      write({ size: '', fps: '', rtt: '9 ms', path: 'relay' });
      const narrow = row.getBoundingClientRect().width;
      write({ size: '1280x720', fps: '59.9', rtt: '999 ms', path: 'direct' });
      const wide = row.getBoundingClientRect().width;
      for (const [k, v] of was) panel.values.set(k, v);
      d.assert('a footer number cannot shove the one beside it',
        narrow > 0 && Math.abs(wide - narrow) < 0.5,
        `${narrow.toFixed(1)} px with the other cells empty against ${wide.toFixed(1)} px at their widest`);
      /**
       * 🔴 AND NOTHING IS SAID ABOUT A STREAM WITH NOTHING COMING IN. The ask,
       * verbatim: *"Do not show video details until we have incomng data"*.
       * 🔴 **WHAT IS GRADED IS THE MECHANISM, NOT THE STATE THIS RUN HAPPENS TO
       * BE IN, AND THE FIRST DRAFT GOT THAT WRONG AND WENT RED.** It required
       * the row to be absent at check time, which is true for a visitor who has
       * not pressed and FALSE here, because `demo/verify.mjs` presses every
       * control on the page: the stream reads `online`, a picture is arriving,
       * and the footer is showing what it should. A check that fails when the
       * page is working is a check about the harness.
       * ✅ So it empties every cell and requires the row to go, then writes one
       * back and requires it to return. Both directions, because hiding a row
       * for ever is the same defect wearing the opposite sign.
       * ⚠️ **AND IT IS SYNCHRONOUS WITH THE READINGS PUT BACK**, like the
       * measurement above it: reading `hidden` forces no layout at all, and
       * nothing is painted between the two writes.
       */
      const keys = panel.values.keys();
      for (const k of keys) panel.values.set(k, '');
      const goneWhenEmpty = !panel.values.shown();
      panel.values.set('rtt', '9 ms');
      const backWhenWritten = panel.values.shown();
      for (const [k, v] of was) panel.values.set(k, v);
      d.assert('the footer says nothing until something is coming in',
        goneWhenEmpty && backWhenWritten,
        `with every cell empty the value row was ${goneWhenEmpty ? 'absent' : 'STILL ON SCREEN'}, `
        + `and one cell later it was ${backWhenWritten ? 'back' : 'STILL ABSENT'}, `
        + `with the stream reading ${stream.state()} and ${keys.length} cells on the row`);
    }
    // Everything from here is about a connection, and an ordinary run made none.
    if (!LIGHT) d.assert('peer connection created', !!pc);
    if (pc) {
      d.assert('peer connection connected', pc.connectionState === 'connected', pc.connectionState);
      const tracks = video.srcObject?.getTracks?.() || [];
      d.assert('a track arrived', tracks.length > 0,
        tracks.map((t) => `${t.kind}${t.muted ? ':muted' : ''}:${t.readyState}`).join(' ') || 'none');
      d.assert('a VIDEO track arrived', tracks.some((t) => t.kind === 'video'),
        tracks.filter((t) => t.kind === 'video').length ? 'yes' : 'audio only');
      d.assert('video is advancing', video.currentTime > 0, `${video.currentTime.toFixed(1)}s`);
      // decoding is not rendering: this is the assert the black frame failed
      notePresented();
      d.assert('frames are actually RENDERED', !!framePresented,
        framePresented
          ? framePresented
          : lastVideoRtp
            ? `nothing presented. rtp says ${JSON.stringify(lastVideoRtp)}`
            : 'nothing presented and NO inbound video rtp at all');
      d.assert('element is playing', !video.paused, video.paused ? `paused rs${video.readyState}` : 'playing');
      /**
       * 🔴 EVERY STATS CELL IS GRADED AS WRITTEN, WITH A VALUE IT COULD REALLY
       * HOLD. A cell that is declared and never written is an empty box that
       * reads as a stat, which is exactly what `/moq/`'s `p95` was found to be
       * on the day these were asked for. Each check reads BOTH the number this
       * page computed and the cell's rendered text, so a reading that never
       * reached the screen goes red as well as one that was never taken.
       * ⚠️ THE RANGES ARE PLAUSIBILITY, NOT TARGETS: a jitter buffer over 2 s
       * or a round trip over 2 s on a connected call means the arithmetic is
       * wrong (seconds read as ms, a cumulative sum read as a mean), not that
       * the network is slow.
       */
      const shown = (k) => {
        const cell = [...d.readoutEl.querySelectorAll('.pos-cell')]
          .find((c) => c.querySelector('.pos-k')?.textContent === k);
        return (cell?.querySelector('.pos-v')?.textContent || '').trim();
      };
      const count = (v) => Number.isInteger(v) && v >= 0;
      d.assert('buffer cell: ms a frame waited in the receiver',
        Number.isFinite(stat.buffer) && stat.buffer >= 0 && stat.buffer < 2000 && shown('buffer') !== '',
        `${stat.buffer == null ? 'never read' : stat.buffer.toFixed(1) + ' ms'}, cell ${JSON.stringify(shown('buffer'))}`);
      d.assert('jitter cell: packet jitter in ms',
        Number.isFinite(stat.jitter) && stat.jitter >= 0 && stat.jitter < 1000 && shown('jitter') !== '',
        `${stat.jitter == null ? 'never read' : stat.jitter.toFixed(2) + ' ms'}, cell ${JSON.stringify(shown('jitter'))}`);
      d.assert('lost, dropped and freezes cells are counts',
        count(stat.lost) && count(stat.dropped) && count(stat.freezes)
          && ['lost', 'dropped', 'freezes'].every((k) => shown(k) !== ''),
        `lost ${stat.lost} (nacks ${stat.nack}), dropped ${stat.dropped}, freezes ${stat.freezes}`);
      d.assert('codec cell names what was negotiated',
        /^(H\.264|VP8|VP9|AV1)$/.test(stat.codec) && shown('codec') === stat.codec,
        JSON.stringify(stat.codec));
      const rttText = panel.values.cell('rtt').textContent.trim();
      d.assert('the footer ping is a network round trip in ms',
        Number.isFinite(stat.rtt) && stat.rtt > 0 && stat.rtt < 2000 && / ms$/.test(rttText)
          && panel.values.cell('rtt').previousElementSibling?.textContent === 'ping',
        `${stat.rtt == null ? 'never read' : stat.rtt.toFixed(1) + ' ms'}, footer ${JSON.stringify(panel.values.el.textContent.trim())}`);
      /**
       * 🔴 THE RELAY WAS ASKED FOR ON THE PRESS AND HANDED TO THE CONNECTION.
       * Three facts, because each has a different failure: asked on load (a
       * visit opened something), never asked (the press forgot), and asked but
       * not passed on (the connection was built without it). The last is read
       * off `getConfiguration()`, which is what the connection really holds.
       */
      const conf = (pc.getConfiguration().iceServers || []).flatMap((s) => [].concat(s.urls));
      d.assert('relay servers were asked for on the press and not on load',
        iceAsks >= 1 && iceLoadAsks() === 0 && !!ice,
        `${iceAsks} ask(s) after the press, ${iceLoadAsks()} before it by resource timing, `
        + (ice ? (ice.relay ? 'a relay came back' : `no relay: ${ice.why}`) : 'nothing came back'));
      d.assert('the peer connection holds what the ask returned',
        !!ice && conf.length > 0 && (!ice.relay || conf.some((u) => /^turns?:/.test(u))),
        `${conf.length} url(s) in the connection, ${conf.filter((u) => /^turns?:/.test(u)).length} of them TURN`);
      const pathText = panel.values.cell('path').textContent.trim();
      d.assert('the footer names the path the media took, beside the ping',
        (icePath?.path === 'direct' || icePath?.path === 'relay') && pathText === icePath.path,
        icePath?.path
          ? `${icePath.path}: local ${icePath.local}, remote ${icePath.remote}, ${icePath.protocol}`
            + `${icePath.relayProtocol ? `, relay over ${icePath.relayProtocol}` : ''}, footer ${JSON.stringify(pathText)}`
          : 'the selected candidate pair could not be read');
    }
    // The picture reports its own damage: every label it had to cut and every
    // link it could not route comes back on `cuts` rather than being ellipsised
    // at a reader who can do nothing about it.
    d.assert('nothing in the picture was cut or refused', dg.cuts.length === 0,
      dg.cuts.map((c) => `${c.id}: ${c.full}`).join(' / ') || 'none');
  });

  /**
   * 🔴 HOW IT WORKS, INCLUDING HOW IT STOPS, WHICH IS THE OTHER HALF OF *"same
   * treatment"*. The mechanism that stops it is the one `/llhls/` draws, because
   * both legs live on one container behind one Durable Object. What differs is
   * the leg, and the differences are the reason this page exists: WHIP up,
   * WHEP down, Opus rather than AAC, no recording on the far side, and a stale
   * publisher held against a new session for about 45 s.
   */
  const dg = createDiagram(d.el, {
    caption: 'One POST of an offer and one answer back, and then the frames come straight '
      + 'from Cloudflare over UDP without touching a worker, or through a relay where UDP is blocked. It stops the same way the '
      + 'low latency HLS page stops, because both legs are one container counting the '
      + 'sockets that are holding it open.',
    nodes: [
      { id: 'you', label: 'Browser', sub: 'this page', kind: 'here', tech: 'browser',
        children: [
          { id: 'ctl', label: 'socket', sub: 'WebSocket', tech: 'browser',
            note: 'The control at the top of the page opens one socket to the publisher and '
                + 'holds it. Being open is the whole message, and closing it is the only way '
                + 'the far side learns that a viewer has gone.' },
          { id: 'play', label: 'player', sub: 'RTCPeerConnection', tech: 'browser',
            note: 'Offers two receive only transceivers, because Cloudflare refuses a single '
                + 'track offer with a 400 either way round. A track arrives MUTED and the '
                + 'element is only given the stream once media really flows.' },
        ] },
      { id: 'cf', label: 'Cloudflare', sub: 'worker, container, Stream', kind: 'cloud', tech: 'cloudflare',
        children: [
          { id: 'pub', label: 'Pub', sub: 'Durable Object', tech: 'cloudflare',
            note: 'The first socket in starts the publish and the last one out arms a 30 s '
                + 'alarm. The sweep needs two idle turns, so about a minute of nobody '
                + 'watching stops the encoder and a reload costs nothing.' },
          { id: 'ff', label: 'ffmpeg', sub: 'container', tech: 'cloudflare',
            note: 'The same picture the low latency HLS page gets, encoded for this leg '
                + 'instead: libopus rather than AAC, H.264 as baseline 3.1, B-frames off. A '
                + 'dead leg needs about 45 s before Cloudflare takes a new one.' },
          { id: 'stream', label: 'Stream', sub: 'WHIP in, WHEP out', tech: 'cloudflare',
            note: 'A second live input, because Cloudflare will not serve WHEP from the RTMPS '
                + 'input the other page uses. Nothing here is recorded, so a WebRTC source '
                + 'costs no storage and cannot be archived on their side.' },
        ] },
    ],
    links: [
      // Same socket, same label as `/llhls/`, both read off
      // `workers/pub/worker.mjs`. What differs here is the leg: the first
      // socket in makes the Pub object POST the container's `/start-whip` as
      // well as `/start`, because one count holds both.
      { from: 'ctl', to: 'pub', label: 'wss /watch',
        note: 'The same hibernatable WebSocket to **wss://pub.positron.studio/watch** the low '
            + 'latency HLS page holds, and nothing goes up it. The first one in starts the WHIP '
            + 'leg and the RTMPS leg together, because one **getWebSockets()** count holds both.' },
      { from: 'pub', to: 'ff',
        note: 'Start on the first viewer, stop on the sweep. A leg that dies while somebody '
            + 'is still watching is restarted by the same sweep 30 s later.' },
      // No label: an arrow between two boxes inside one container shows
      // direction only, and the component refuses one written on it anyway.
      { from: 'ff', to: 'stream',
        note: 'WHIP, and the publish URL carries the stream key in its path, so a public '
            + 'page cannot hold it and this leg runs in the container instead.' },
      { from: 'stream', to: 'play', label: 'WHEP', back: true,
        note: 'One POST of the offer over ordinary HTTPS, one answer, and the media then '
            + 'flows over ICE and DTLS and SRTP. The handshake succeeding says nothing about '
            + 'whether a single frame will arrive, which is what the checks are for.' },
    ],
  }, { how: true, atEnd: true });

  d.log('one POST of an SDP offer, one answer back');
  d.ready();
</script>
</html>
