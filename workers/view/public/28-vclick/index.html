<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  textarea { width: 100%; min-height: 132px; background: #0d1117; color: var(--fg);
             border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px;
             font: 500 11.5px/1.6 var(--mono); resize: vertical; margin: 0 0 10px; }
  canvas.map { width: 100%; height: 150px; display: block; background: #0d1117;
               border: 1px solid var(--line); border-radius: 3px; margin: 0 0 10px; }
  .legend { font: 500 10px/1.5 var(--mono); color: var(--dim2); margin: -6px 0 10px;
            display: flex; gap: 14px; flex-wrap: wrap; }
  .legend i { font-style: normal; }
  .legend i::before { content: '—'; margin-right: 5px; font-weight: 700; }
  .legend .real::before { color: var(--hi); }
  .legend .naive::before { color: #8b93a1; }
</style>

<script type="module">
  import { mount, guard, el, playOrPrompt } from '/shell/shell.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { compileCsound, repeatsAsQuotations } from '/timeline/csound.mjs';
  import { quotation, score, scoreToJSON } from '/timeline/score.mjs';

  // A WRITTEN SCORE, MADE SEEKABLE. This is demo/notes/uuu-positron.md §3 with
  // the arithmetic on screen: vClick conducts an ensemble from a Csound score,
  // and the format has two gaps that only show up when someone asks to start in
  // the middle. Compiled through timeline/csound.mjs both close.
  //
  //   · The tempo map is the INTEGRAL of 60/tempo, because Csound interpolates
  //     tempo linearly in BEAT. The canvas below draws that curve against the
  //     straight line you get from averaging the tempo — the gap between them
  //     is the error a mean-tempo compiler ships, and it is invisible in the
  //     output because every note still lands, just early.
  //   · `m`/`n` is a repeat, and a repeat is a REFERENCE. It compiles to a
  //     quotation value, printed below as the JSON that round-trips.
  //
  // The seek is the point. The score file cannot answer "what is in force at
  // bar 9" — it carries events, not state. `deck.reduceAt(kind, pos)` answers
  // it at any position, and the checks probe it either side of every note.

  const DEFAULT_SCORE = [
    '; a fragment in the shape vClick scores are written in',
    't 0 120  16 72          ; a real accelerando: 120 bpm easing to 72 by beat 16',
    '',
    'm theme',
    'i 1 0    0.5  8000 440',
    'i 1 +    .    .    550',
    'i 1 +    .    .    660',
    'i 1 +    1.0  .    880',
    'n theme                 ; and again — a reference, not four more lines',
    '',
    'i 2 8    0.25 6000 220',
    'i 2 +    .    .    .',
    'i 2 +    .    .    .',
  ].join('\n');

  const d = mount({
    n: '28',
    name: 'vclick',
    what: 'A Csound score compiled to a timeline: the tempo map is an integral, the repeat is a quotation, and the fold is exact anywhere.',
    readout: { rows: '', dur: 's', bend: 'ms', beat: '', sounded: '', fold: '' },
    controls: [
      { id: 'go', label: 'Compile and play', primary: true },
      { id: 'seek', label: 'Jump into the repeat' },
      { id: 'check', label: 'Run the checks' },
    ],
  });
  guard(d);

  const ta = el('textarea', '', DEFAULT_SCORE, { spellcheck: 'false' });
  d.el.append(ta);
  const map = el('canvas', 'map');
  d.el.append(map);
  const legend = el('div', 'legend');
  legend.append(el('i', 'real', 'beat → time, integrated'), el('i', 'naive', 'the mean-tempo straight line'));
  d.el.append(legend);
  const out = el('pre', 'd-log');
  out.style.maxHeight = '110px';
  d.el.append(out);

  let compiled = null, deck = null, bar = null, ctx = null, sounded = 0, probeWrong = null;

  /**
   * The curve, and the lie beside it. Both axes are the compiled score's own:
   * x is beats, y is seconds. The straight line is what you get by treating the
   * accelerando as its average tempo — the naive compile — so the vertical gap
   * IS the error, drawn rather than argued.
   */
  function drawMap(c) {
    const g = map.getContext('2d');
    const w = map.width = map.clientWidth * devicePixelRatio;
    const h = map.height = 150 * devicePixelRatio;
    g.clearRect(0, 0, w, h);
    const pts = c.tempo.points;
    const lastBeat = Math.max(pts.at(-1)[0], ...c.items.map((i) => i.payload.beat + Math.max(0, i.payload.durBeats)), 1);
    const meanBpm = pts.reduce((a, p) => a + p[1], 0) / pts.length;
    const naiveAt = (b) => (60 * b) / meanBpm;
    const maxT = Math.max(c.tempo.secondsAt(lastBeat), naiveAt(lastBeat)) || 1;
    const X = (b) => (b / lastBeat) * (w - 8) + 4;
    const Y = (t) => h - 6 - (t / maxT) * (h - 12);

    g.strokeStyle = '#8b93a1'; g.lineWidth = 1 * devicePixelRatio;
    g.beginPath();
    for (let i = 0; i <= 120; i++) { const b = (lastBeat * i) / 120; i ? g.lineTo(X(b), Y(naiveAt(b))) : g.moveTo(X(b), Y(naiveAt(b))); }
    g.stroke();

    g.strokeStyle = '#ffd400'; g.lineWidth = 2 * devicePixelRatio;
    g.beginPath();
    for (let i = 0; i <= 120; i++) { const b = (lastBeat * i) / 120; i ? g.lineTo(X(b), Y(c.tempo.secondsAt(b))) : g.moveTo(X(b), Y(c.tempo.secondsAt(b))); }
    g.stroke();

    // every note as a tick on the real curve
    g.fillStyle = '#2b3546';
    for (const it of c.items) {
      const b = it.payload.beat;
      g.fillRect(X(b) - devicePixelRatio, Y(c.tempo.secondsAt(b)) - 3 * devicePixelRatio, 2 * devicePixelRatio, 6 * devicePixelRatio);
    }
    return { lastBeat, bendMs: (c.tempo.secondsAt(lastBeat) - naiveAt(lastBeat)) * 1000 };
  }

  /** One short tone per row, so a seek is audible as well as assertable. */
  function voice(p) {
    if (!ctx) return;
    const freq = Number(p[4]);
    if (!Number.isFinite(freq) || freq <= 0) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'triangle';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.2, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + 0.3);
    sounded++;
    d.set('sounded', sounded, 'ok');
  }

  function compile() {
    // The textarea is editable, so a compile failure is a normal thing for a
    // human to cause and not a page fault. Keep the last good compile, say what
    // was wrong, and let them fix the line — `guard()` turning a typo into a
    // dead page would make the demo unusable for the one thing it invites.
    let next, structural;
    try {
      next = compileCsound(ta.value, { expand: true });
      structural = compileCsound(ta.value, { expand: false });
    } catch (e) {
      d.log(`score did not compile: ${String(e?.message ?? e)}`, 'bad');
      return compiled;
    }
    compiled = next;
    const { bendMs } = drawMap(compiled);
    d.set('rows', compiled.items.length, compiled.items.length ? 'ok' : 'bad');
    d.set('dur', Math.round(compiled.durationMs) / 1000);
    d.set('bend', Math.round(bendMs));
    const qs = repeatsAsQuotations(structural, { ref: 'vclick-demo', quotation });
    const s = score({ id: 'vclick-demo', quotations: qs });
    out.textContent = [
      `${compiled.items.length} rows · ${structural.items.length} written · `
      + `${compiled.repeats.length} repeat${compiled.repeats.length === 1 ? '' : 's'} · `
      + `${(compiled.durationMs / 1000).toFixed(2)} s`,
      ...compiled.warnings.map((w) => `warning: ${w}`),
      qs.length ? scoreToJSON(s, 1).replace(/\n\s*/g, ' ') : '(no repeat in this score)',
    ].join('\n');
    // A DERIVED LANE, not a pushed message: bar and beat come out of the tempo
    // map the client already holds. vClick has to send them over OSC because
    // its tempo lives in the score; here the position IS the beat.
    return compiled;
  }

  function build() {
    deck?.dispose?.();
    bar?.remove?.();
    deck = createDeck({
      items: compiled.items,
      adapters: {
        note: {
          caps: { rates: [1], continuous: false, assertOnSeek: true },
          actuate: (payload) => voice(payload.p),
          // The fold: how many notes have sounded by a position. It is what
          // makes "start at bar 9" answerable, and the checks probe it.
          reduce: (rows) => ({ count: rows.length }),
          assertState: (s) => s,
        },
      },
      range: [0, Math.max(1000, Math.ceil(compiled.durationMs))],
    });
    bar = createTransportBar(d.el, deck);
  }

  setInterval(() => {
    if (!deck || !compiled) return;
    const pos = deck.position();
    d.set('beat', Math.round(compiled.tempo.beatAtMs(pos) * 100) / 100);
    d.set('fold', deck.reduceAt('note', pos)?.count ?? '—');
  }, 200);

  d.on('go', async () => {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    // NOT awaited. A context created without a user gesture starts suspended,
    // and in a real browser resume() then neither resolves nor rejects — it
    // waits for a gesture. Awaiting it left the compile, the deck and the
    // transport bar unbuilt while the page looked fine, because the readout was
    // already filled by the compile at load. Sound is allowed to be late; the
    // timeline is not allowed to depend on it.
    ctx.resume().catch(() => {});
    compile();
    build();
    deck.play();
    d.log(`compiled ${compiled.items.length} rows over ${(compiled.durationMs / 1000).toFixed(2)} s — playing`, 'hi');
  });

  d.on('seek', () => {
    if (!deck || !compiled?.repeats.length) { d.log('compile a score with an m/n repeat first', 'bad'); return; }
    const r = compiled.repeats[0];
    const to = Math.round(r.atMs + (r.outMs - r.inMs) / 2);
    deck.seek(to);
    d.log(`jumped to ${(to / 1000).toFixed(2)} s — mid-repeat, beat `
      + `${compiled.tempo.beatAtMs(to).toFixed(2)}, fold ${deck.reduceAt('note', to)?.count}`, 'hi');
  });

  d.on('check', () => {
    d.assert('the score compiles to rows', (compiled?.items.length ?? 0) > 0, `${compiled?.items.length ?? 0} rows`);
    d.assert('no warnings from a score this simple', (compiled?.warnings.length ?? 1) === 0,
      compiled?.warnings.join(' | ') || 'none');
    // THE INTEGRAL. If the tempo map were the mean-tempo straight line, this
    // difference would be zero — and every note after the first would land
    // early by a growing amount that nothing else on the page would show.
    const bend = Number(d.api.readout.bend);
    d.assert('the tempo map bends away from the mean-tempo line', Math.abs(bend) > 20, `${bend} ms by the end`);
    d.assert('the repeat compiled to a quotation', (compiled?.repeats.length ?? 0) > 0,
      compiled?.repeats.length ? `in ${Math.round(compiled.repeats[0].inMs)} → out ${Math.round(compiled.repeats[0].outMs)} at ${Math.round(compiled.repeats[0].atMs)} ms` : 'none');
    d.assert('the deck spans the score', !!deck && Math.abs(deck.range[1] - compiled.durationMs) < 1000,
      deck ? `${deck.range[1]} vs ${Math.round(compiled.durationMs)} ms` : 'no deck');
    // THE FOLD, either side of every note — the same probe 15 seek runs against
    // a recording, run here against a written score.
    let wrong = 0, probes = 0;
    for (const it of compiled.items) {
      for (const at of [it.at - 1, it.at, it.at + 1]) {
        if (at < 0) continue;
        probes++;
        const want = compiled.items.filter((x) => x.at <= at).length;
        if ((deck.reduceAt('note', at)?.count ?? -1) !== want) wrong++;
      }
    }
    probeWrong = wrong;
    d.assert('the fold is exact either side of every note', wrong === 0, `${probes} probes, ${wrong} wrong`);
    // A seek that lands mid-repeat: the position the score cannot describe.
    const r = compiled.repeats[0];
    const to = Math.round(r.atMs + (r.outMs - r.inMs) / 2);
    deck.seek(to);
    d.assert('a seek into the repeat folds correctly',
      deck.reduceAt('note', deck.position())?.count === compiled.items.filter((x) => x.at <= deck.position()).length,
      `at ${Math.round(deck.position())} ms, fold ${deck.reduceAt('note', deck.position())?.count}`);
    d.assert('notes actually sounded', sounded > 0, `${sounded} voices`);
  });

  compile();
  d.log('edit the score and press compile — t bends the map, m/n becomes a quotation');
  d.ready();
</script>
</html>
