<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* ── SCORE ─────────────────────────────────────────────────────────────
     🔴 THE SCORE BOX IS THE KIT'S CODE BOX SINCE 2026-09-30
     (`demo/shell/code-box.mjs`, `plans/plan-code-editor.md`), coloured as a
     Csound score. Its height is the score's own line count, handed over as
     `rows`, with the compile note's reserve under it. `--well` is the box's
     ground, read by the box and the note alike. */
  .und-editor { --well: #0d1117; }
  /* 🔴 EACH LINE IN THE COLOUR OF THE LANE THAT DRAWS IT. Asked 2026-09-30,
     *"can you mathc lane colors and code colors somehow"*: an `i` line is an
     event tick, a `t` line is the tempo curve, an `m` or `n` line is a part
     bar, and `code-lang.mjs` tags every coloured token with its line's kind.
     The inks are the strip's own, set from `INK` and `DERIVED` in score.mjs. */
  .und-editor .pos-ln-event { color: color-mix(in oklab, var(--ln-on) 70%, var(--ln-off)); }
  .und-editor .pos-ln-part, .und-editor .pos-ln-tempo { color: color-mix(in oklab, var(--ln-derived) 80%, #fff); }
  .und-editor .pos-tk-carry[class*="pos-ln-"] { opacity: .7; }

  /* ── BOTH TABS: a compiled document, one record per line ──────────────
     Scrolled rather than padded, because a score has no fixed length, and a
     fixed height so a longer score moves nothing under it.
     TWO CHANNELS, TWO FACTS: the left border is which part a line belongs to,
     the text is whether it has played. Hue never means "played".
     ⚠️ NO `margin` HERE. The stack owns the rhythm between blocks. */
  .sc { max-height: calc(12 * 1.75em + 22px); overflow: auto;
        font: 400 11px/1.75 var(--mono); background: var(--card);
        border: 1px solid var(--line); border-radius: 4px; padding: 10px 0; }
  .sc-l { display: block; white-space: pre; color: var(--dim2);
          border-left: 3px solid transparent; padding: 0 12px 0 9px; }
  .sc-l[data-state="played"] { color: var(--dim); }
  .sc-l[data-state="now"]    { color: var(--fg);
                               background: color-mix(in oklab, var(--hi) 10%, transparent); }
  .sc-n { color: var(--dim2); }
  .sc-l[data-state="now"] .sc-n { color: var(--fg); }
  .warn { font: 500 10.5px/1.7 var(--mono); color: var(--warn); margin: 0; }
  .warn:empty { display: none; }

  /* ── CLICK ─────────────────────────────────────────────────────────────
     THEIRS AND OURS, SIDE BY SIDE: the score a composer typed and the
     document made out of it, lighting at the same moment. One column on a
     narrow screen, because two 11 px monospace columns at 400 px is a pair of
     ellipses rather than a comparison. */
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: start; }
  @media (max-width: 720px) { .two { grid-template-columns: 1fr; } }
  .two > div { min-width: 0; }
  .two h4 { margin: 0 0 6px; font: 600 10px/1 var(--mono); letter-spacing: .1em;
            text-transform: uppercase; color: var(--dim2); }
  /* the operator's half, a plain row, because it is not the subject */
  .op { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .op label { font: 500 11px/1 var(--mono); color: var(--dim); }
</style>

<script type="module">
  import { mount, guard } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createTabPage } from '/shell/tab-page.mjs';
  import * as score from './score.mjs';
  import * as click from './click.mjs';

  /*
   * 🔴 THE TYPED SCORE AND THE CLICK TRACK AS ONE PAGE, asked 2026-10-05:
   * *"merge click and und, no need for 'mobile screen' / theme"*. `/click/`
   * was its own page from 2026-09-14 and is gone with no redirect, the way the
   * 2026-10-04 regrouping retired pages.
   *
   *   SCORE  a Csound score you type, compiled when you stop, with sound
   *   CLICK  U:'s vClick scores, worked out once and played off the page's clock
   *
   * Both are Csound made seekable, which is why they share a page.
   * `demo/shell/tab-page.mjs` does the rest. SCORE owns the page's one
   * published transport bar; CLICK's is `publish: false` and in its `bars`.
   */
  const d = mount({
    name: 'csound',
    // No `what` under the title: each tab says what it is in the box under the
    // tab row (`tab-page.mjs` rule 6).
    readout: null,
    showLog: false,
    controls: [],
  });
  guard(d);

  const page = createTabPage(d, {
    at: 'score',
    tabs: [
      { id: 'score', label: 'SCORE', mod: score },
      { id: 'click', label: 'CLICK', mod: click },
    ],
  });

  // Before `ready` and never after it: the harness drills the published bar
  // the moment `ready` is true, and a tab switch under it would race it.
  if (SELFCHECK) {
    const t0 = performance.now();
    await page.check();
    d.log(`the check pass took ${((performance.now() - t0) / 1000).toFixed(1)} s`);
  }
  d.ready();
</script>
</html>
