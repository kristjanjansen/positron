<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON kit/layout</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/kit-page.css">
<script type="module">
  import { el } from '/shell/shell.mjs';
  import { createStack } from '/shell/stack.mjs';
  import { createTabs } from '/shell/tabs.mjs';
  import { createTabPage } from '/shell/tab-page.mjs';
  import { drillBar, DRILL } from '/shell/bar-drill.mjs';
  import { createCard, createCardGrid } from '/shell/card.mjs';
  import { DEMOS } from '/manifest.mjs';
  import { createStripView } from '/shell/strip.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { createGlue } from '/shell/glue.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { markAdapter } from '/shell/fixture.mjs';
  import { createKitPage } from '/shell/kit-page.mjs';

  /**
   * 🔴 kit/layout, ONE PART OF `/kit/` ON A PAGE OF ITS OWN, 2026-10-06
   * (plans/plan-kit-split.md). Every block, holder and check below is copied
   * VERBATIM from `demo/kit/index.html`, in that file's order, so the newest
   * block is still the first. What changed is mechanical: `section()` lost its
   * first argument, the holders sit here rather than at the top of the
   * monolith, the measuring window and the tab row are gone, and every check
   * is behind `?selfcheck=1`.
   */
  const { d, out, section, land, checkPage } = createKitPage({
    part: 'layout',
    what: "How blocks stack, sit in tabs and fall into cards from a wide screen down to a phone.",
  });

  // The layout specimens. ⚠️ DECLARED UP HERE, not beside the block that fills
  // them: this is the newest section and therefore the topmost one, and this
  // page has already been taken out once by a `const` left where a block used
  // to be and then read in its dead zone.
  let stackSpec = null, emptySpec = null, emptyBlock = null;
  const stackBlocks = [];
  let tabSpec = null;         // { page }, the TAB PAGE specimen, checked last before ready


  /**
   * 🔴 TAB PAGE, 2026-10-04. The owner regrouped twenty demos
   * into four tabbed pages that day (`/sync/`, `/time/`, `/wire/`,
   * `/capture/`, no redirects), and the pieces every one of them needs are
   * shared and were built once, before any page: `tab-page.mjs` and
   * `bar-drill.mjs`. `plans/plan-demo-structure.md` §5 step 1.
   * ⚠️ IT OPENS ON QUIET, SO BARS IS NOT BUILT UNTIL SOMEBODY OPENS IT. That is
   * the component's first claim, and a specimen that opened on BARS would
   * have nothing to show it with.
   * ⚠️ AND IT CARRIES ITS OWN NEGATIVE CONTROL: a bar whose clock never moves.
   * The drill must fail it on `play advances position` and on nothing else, or
   * a drill that passed everything would read exactly like this one.
   * ⚠️ `hash: false`, because this page owns its address and a specimen
   * writing `#bars` into it would be one component reaching outside its box.
   */
  section('TAB PAGE',
    'Several old pages as the tabs of one: a tab is built the first time it is opened, '
    + 'keeps its own readout and log, and every transport bar in it gets the harness’s '
    + 'drill as page asserts. This one opens on QUIET, so BARS has not been built yet.',
    `const page = createTabPage(d, { tabs: [
  { id: 'arrival', label: 'ARRIVAL', mod: arrival },  // arrival: the tab's own module, imported by the page
] });
// a tab: export const readout; export function build({ panel, report, assert, log, set })
//   returns { show, hide, check({ A }), bars: [{ name, bar, strip }] }
if (SELFCHECK) await page.check();                   // and then d.ready()
await assertBar(d.assert, bar, { name, strip });     // the drill verify.mjs runs on one bar`,
    (box) => {
      box.classList.add('kit-wide', 'kit-tabpage');
      const hi = getComputedStyle(document.documentElement).getPropertyValue('--hi').trim() || '#ffd400';

      /* QUIET stands in for a tab whose first press joins a relay or fetches a
         file. The counter is the whole of what it opens, which is what lets the
         check say "nothing until the first press" as a number. */
      const quiet = {
        readout: { presses: '', state: '' },
        build({ panel, set, log }) {
          let opened = 0;
          const row = el('div', 'kit-row');
          const btn = el('button', '', 'Open', { type: 'button' });
          btn.onclick = () => {
            opened++;
            set('presses', opened);
            set('state', 'open');
            log(opened === 1 ? 'opened on the first press in this tab' : 'already open');
          };
          row.append(btn);
          panel.add(row);
          return {
            opened: () => opened,
            async check({ A }) {
              A('nothing opened until the first press in this tab', opened === 0, `${opened} opening(s) before a press`);
              btn.click();
              A('the first press in the tab opens it', opened === 1, `${opened} opening(s) after one press`);
            },
          };
        },
      };

      const bars = {
        build({ panel }) {
          const { adapter } = markAdapter({ rates: [1] });
          const items = Array.from({ length: 8 }, (_, i) => ({
            id: `tp${i}`, kind: 'mark', at: (i + 0.5) * 7500, payload: { label: `${i + 1}` } }));
          const deck = createDeck({ items, adapters: { mark: adapter }, range: [0, 60_000] });
          const shelf = el('div');
          const view = createStripView(shelf, deck, { size: 'auto', lanes: [{ id: 'mark', kind: 'mark', color: hi }] });
          const live = createTransportBar(shelf, deck, { publish: false, scrub: false, loop: false });
          view.strip.fit?.();
          // The strip sits on the bar that drives it, the one pair a glue is for.
          const pair = createGlue(view.surface, live.el);

          /* 🔴 THE NEGATIVE CONTROL. A wall clock that always answers 0: the
             deck accepts play, says it is playing, and its position never
             moves. Seeking still works, because a seek sets the position
             directly, so the drill must fail exactly one row. */
          const still = createDeck({ clock: { domain: 'wall', now: () => 0 }, range: [0, 60_000] });
          const frozenHost = el('div');
          const frozen = createTransportBar(frozenHost, still, { publish: false, loop: false, verb: ['start', 'stop'] });

          panel.titled('A BAR AND THE STRIP IT DRIVES', pair);
          panel.titled('A BAR WHOSE CLOCK NEVER MOVES', frozenHost);
          return {
            live, frozen,
            bars: [{ name: 'live', bar: live, strip: view.el }],
            // A deck left running in a tab nobody can see is a sound nobody
            // chose; leaving the tab stops it.
            hide() { if (live.api.playing) live.api.el.querySelector('.tbar-toggle').click(); },
            async check({ A }) {
              const rows = await drillBar(frozen);
              const red = rows.filter((r) => !r.skipped && !r.pass).map((r) => r.label);
              A('NEGATIVE: a bar whose clock is frozen fails the drill on play, and on nothing else',
                red.length === 1 && red[0] === 'play advances position',
                `${rows.filter((r) => !r.skipped).length} rows, failing: ${red.join(', ') || 'none'}`);
            },
          };
        },
      };

      const page = createTabPage(d, {
        host: box, hash: false, at: 'quiet',
        tabs: [
          { id: 'quiet', label: 'QUIET', mod: quiet },
          { id: 'bars', label: 'BARS', mod: bars },
        ],
      });
      tabSpec = { page };
    });

  /**
   * 🔴 THE NEWEST COMPONENT GOES AT THE TOP OF THIS PAGE. Instructed
   * 2026-09-16: *"in kit move online stuff to topmost item (all new should land
   * top, make rule)"*.
   *
   * This page is read by somebody checking what the kit has, and what they do
   * not know about is what arrived since they last looked. Appending put the
   * newest thing behind every component they already knew, at the bottom of a
   * long scroll, which is the one place it cannot be found by accident. The
   * front page settled the same question the same way and for the same reason.
   *
   * ⚠️ A SECTION TITLE IS UPPERCASE, and `.kit-h` renders it so whatever is
   * typed. Type it uppercase anyway, so the source reads like the page.
   * ⚠️ AND MOVING A BLOCK MOVES EVERY BUTTON AFTER IT. `verify.mjs` presses by
   * position, so re-run `node demo/verify.mjs kit` and diff the assert count
   * after any reorder.
   */
  section('STACK',
    'The stack owns the air between blocks, so a block cannot change it.',
    `const page = createStack(d.el);          // mount() has already made this one
page.add(bar.el, picks, keyboard.el);    // the order of the page, in one line
const row = page.stack();                // a block that is itself a column`,
    (box) => {
      box.classList.add('kit-wide');
      stackSpec = createStack(undefined, 'kit-stackspec');
      // ⚠️ NO ARTICLE ON A SPECIMEN'S LABEL. Asked 2026-09-17 as `a block ->
      // block`. CLAUDE.md already carries this rule for diagram labels, where a
      // label is a NAME and names do not take articles: `a granulator` reads as
      // the start of a sentence somebody did not finish. A specimen in this
      // sandbox is the same kind of thing, and the article was doing the same
      // nothing.
      for (const [t, cls] of [['block', ''], ['another', ''],
                              ['margin: 0 0 10px', 'kit-tight']]) {
        const b = el('div', `kit-blk${cls ? ' ' + cls : ''}`, t);
        stackBlocks.push(b);
        stackSpec.add(b);
      }
      box.append(stackSpec.el);

      // ⚠️ THE EMPTY CASE IS ITS OWN SPECIMEN, because what it has to show is
      // an ABSENCE: two blocks with one gap between them and a third element
      // between those two that costs nothing. Putting it in the stack above
      // would have made the row read as four blocks with a hole in it.
      box.append(el('p', 'kit-cap', 'with a block that never got filled'));
      emptySpec = createStack(undefined, 'kit-stackspec');
      emptySpec.add(el('div', 'kit-blk', 'block'));
      emptyBlock = el('div', 'kit-blk');          // nothing in it, ever
      emptySpec.add(emptyBlock, el('div', 'kit-blk', 'next block'));
      box.append(emptySpec.el);
    });

  // ── tabs ────────────────────────────────────────────────────────────────
  section('TABS',
    'Places you go rather than options you arm, with colour and a bar on the open one.',
    `createTabs({ tabs: [{id:'air',label:'On air'}, {id:'past',label:'Archive',disabled:true}, …] })`,
    (box) => {
      const o = out('air');
      // ⚠️ `hash: false` HERE AND ONLY HERE. Every other caller wants the
      // address bar; a sandbox that writes `#air` while you scroll past six
      // other components is one component reaching outside its own box.
      const t = createTabs({
        hash: false,
        tabs: [
          { id: 'air', label: 'On air' },
          { id: 'past', label: 'Archive', disabled: true, note: 'not built yet' },
          { id: 'write', label: 'Contribute' },
          { id: 'long', label: 'A name long enough to push the row' },
        ],
        onPick: (id) => { o.textContent = id; },
      });
      for (const [id, text] of [['air', 'what is happening now'],
                                ['write', 'the form you write in'],
                                ['long', 'the row scrolls sideways rather than wrapping']]) {
        t.panel(id).append(el('div', 'kit-n', text));
      }
      box.append(t.el, o);
    });

  // ── cards ───────────────────────────────────────────────────────────────
  //
  // ⚠️ THE ROWS ARE THE REAL ONES. `DEMOS` is the same array the front page
  // renders from, so a card here cannot drift into describing pages that do not
  // exist or tags nobody uses — which is the whole reason this page exists.
  //
  // 🔴 AND THE DESCRIPTIONS ARE TRIMMED, WHICH IS A FINDING RATHER THAN A
  // CONVENIENCE. The index's `one` lines are written for a row the full width
  // of the page; a card is a third of that, so the same sentence runs to five
  // lines and the grid stretches every card in the row to match it. Cutting at
  // the first dash or comma gives the clause that names the thing and drops the
  // clause that qualifies it — which is what a card wants and, arguably, what
  // a row wants too.
  const firstClause = (t) => {
    const cut = t.split(/\s+[—–-]\s+|,\s+/)[0];
    return cut.length > 12 ? cut : t;
  };
  const pick = ['weight', 'tapes', 'kurenniemi', 'able', 'floor', 'radio', 'wire', 'strip'];
  const rows = pick.map((n) => DEMOS.find((x) => x.name === n)).filter(Boolean);
  const cardsFor = (extra = {}) => rows.map((r) => createCard({
    title: r.name,
    desc: firstClause(r.one),
    tags: (r.tags || []).slice(0, 3),
    href: `/${r.name}/`,
    ...extra,
  }));

  section('CARD',
    'A grey box, a name, one line about what is behind it, and tags along the bottom.',
    '',
    (box) => {
      box.classList.add('kit-wide');
      const g = createCardGrid({ min: 170 });
      g.addAll(cardsFor());
      box.append(g.el);
    });

  section('CARD GRID ON A PHONE',
    'Two columns at 375 px and up, one below, with the floor written min(100%, 170px).',
    '', (box) => {
      box.classList.add('kit-wide');
      for (const w of [375, 320]) {
        box.append(el('div', 'kit-cut', `${w} px`));
        const frame = el('div');
        frame.style.width = `${w}px`; frame.style.maxWidth = '100%';
        const g = createCardGrid({ min: 170 });
        g.addAll(cardsFor().slice(0, 4));
        frame.append(g.el);
        box.append(frame);
      }
    });

  section('CARD, REFUSED AND WITH BUTTONS',
    'A page this browser cannot run keeps its card, with the reason where the tags go.',
    '', (box) => {
      box.classList.add('kit-wide');
      const o = out('nothing pressed');
      const g = createCardGrid({ min: 190 });
      g.addAll([
        createCard({ title: 'mirror', desc: 'the same shader drawn twice',
          why: 'this browser draws no 3-D' }),
        createCard({ title: 'instrument', desc: 'a keyboard you can play',
          why: 'no MIDI here, but the on-screen keys still sound' }),
        // ⚠️ `/held/` UNTIL 2026-09-19, AND THE NAME NOW BELONGS TO A DIFFERENT
        // PAGE. A card is a LINK, so a stale one here does not 404, it opens
        // something else and says nothing about it. That is the one failure a
        // rename in this project has not produced before, because `/radio1965/`
        // and `/box/` both just died.
        createCard({ title: 'weight', desc: 'big words standing in a room',
          tags: ['WebGL2'], href: '/weight/',
          actions: [
            { label: 'Copy link', onPress: () => { o.textContent = 'copy link, weight'; } },
            { label: 'Open', onPress: () => { o.textContent = 'open, weight'; } },
          ] }),
      ]);
      box.append(g.el, o);
    });

  // A link to a block lands on it. See `land()` in demo/shell/kit-page.mjs.
  land();

  /* ── what a machine can say about this page ─────────────────────────────
     🔴 EVERY CHECK ON THIS PAGE IS BEHIND `?selfcheck=1`, the page level ones
     included (CLAUDE.md: a self-check never runs for a visitor). The checks
     below are copied from `demo/kit/index.html` VERBATIM and keep that
     file's indent, so a diff against it reads clean; the one line taken out
     of each is a `settle()` or `measure()`, the measuring window a page with
     no closed tab has no use for. Their comments still name it.
     ⚠️ THEY RUN AFTER A FRAME, because `getBoundingClientRect` before the
     first paint answers about a page that has not been arranged yet. */
  if (SELFCHECK) {
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  checkPage();


  // 🔴 THE GAP IS THE STACK'S, AND A BLOCK CANNOT ARGUE WITH IT. The third
  // specimen carries `margin: 0 0 10px` in this page's own stylesheet, which
  // loads AFTER shell.css — the exact shape that put a keyboard flush against a
  // transport bar on `/keys/` and measured 0.0 px. A shorthand's implied
  // `margin-top: 0` is (0,1,0) and the stack's rule is (0,2,0), so it loses on
  // weight rather than on source order, which is the whole reason the rule is
  // written the way it is.
  // ⚠️ THE NUMBER IS READ OFF THE DOCUMENT, never typed here. A check that
  // types 40 grades this page against a figure it invented; `--pos-gap` is the
  // one place the project states it, so the check has to ask for it too.
  {
    const want = Number.parseFloat(
      getComputedStyle(document.documentElement).getPropertyValue('--pos-gap'));
    const gaps = [];
    for (let i = 1; i < stackBlocks.length; i++) {
      gaps.push(+(stackBlocks[i].getBoundingClientRect().top
        - stackBlocks[i - 1].getBoundingClientRect().bottom).toFixed(1));
    }
    const asked = stackBlocks.length
      ? getComputedStyle(stackBlocks[stackBlocks.length - 1]).marginTop : '?';
    d.assert('every block in a stack is one gap from the one before it, whatever margin it carries',
      Number.isFinite(want) && want > 0 && gaps.length === 2
      && gaps.every((g) => Math.abs(g - want) <= 0.5),
      `--pos-gap is ${want} px and the gaps read ${gaps.join(' and ')} px · `
      + `the block asking for margin-top 0 computes ${asked}`);
  }

  // 🔴 AND A BLOCK WITH NOTHING IN IT TAKES NO GAP. This is the `/typist/`
  // band in a third costume: an empty container that draws nothing and still
  // spends a screenful of air, or paints its own two borders as a rule nobody
  // wrote. Two blocks with an unfilled one between them must sit ONE gap apart,
  // not two — and the unfilled one must be out of the layout entirely rather
  // than merely invisible, which is the difference the display value reports.
  {
    const want = Number.parseFloat(
      getComputedStyle(document.documentElement).getPropertyValue('--pos-gap'));
    const kids = emptySpec ? [...emptySpec.el.children] : [];
    const across = kids.length === 3
      ? +(kids[2].getBoundingClientRect().top - kids[0].getBoundingClientRect().bottom).toFixed(1) : -1;
    const gone = emptyBlock ? getComputedStyle(emptyBlock).display === 'none' : false;
    d.assert('a block that never got filled takes no room and no gap',
      gone && kids.length === 3 && Math.abs(across - want) <= 0.5,
      `the two blocks around it are ${across} px apart, which is one gap of ${want} px · `
      + `the empty one computes display ${emptyBlock ? getComputedStyle(emptyBlock).display : '?'}`);
  }

  /**
   * 🔴 EVERY FOCUS RING IN THE SHELL IS 1 px AND EVERY ONE IS ON THE KEYBOARD.
   * Asked for 2026-09-23 as *"make focus styles appear only on keyb nav not
   * mouse and make it 1px. change everywhere"*, which is fourteen rules in one
   * stylesheet and exactly the shape a later edit puts back one rule at a time.
   *
   * 🔴 IT READS THE STYLESHEET RATHER THAN THE SCREEN, AND THAT IS THE ONLY
   * HONEST WAY TO GRADE IT HERE. `:focus-visible` is decided by the browser's
   * MODALITY: it matches after a Tab and not after a press, and a page cannot
   * make a trusted key event, so `el.focus()` from a check lands in whichever
   * modality the harness happens to be in. An assert built on that would be
   * green or red for a reason that has nothing to do with the rule. The rules
   * themselves are same-origin and free to read.
   *
   * ⚠️ AND THE SECOND HALF IS THE ONE THAT MATTERS MOST: no rule may paint on
   * plain `:focus`, because that is the selector that fires for a mouse. It is
   * asserted as an ABSENCE over every rule in the sheet, so a new control
   * cannot bring one back quietly.
   *
   * 🔴 IT READS `cssText`, NOT `style.outlineWidth`, AND THE FIRST VERSION READ
   * THE LONGHAND AND FOUND **0 rings across 644 rules**. Every one of these is
   * written `outline: 1px solid var(--hi)`, and a shorthand holding a `var()`
   * is a pending substitution: the CSSOM hands back an EMPTY STRING for every
   * longhand in it. So the check would have passed an empty set forever, which
   * is this project's own rule about a statistic whose denominator nobody
   * looked at. `rings.length >= 12` is the floor that makes an empty answer red
   * rather than green.
   */
  {
    const sheet = [...document.styleSheets].find((s) => (s.href || '').includes('shell.css'));
    const rules = sheet ? [...sheet.cssRules].filter((r) => r.selectorText) : [];
    /* A ring is an outline with a WIDTH in it. `outline: none` is a suppression
       and paints nothing, and reading it as a ring is how the second version of
       this check went red on `input:focus-visible`, which exists precisely to
       take the ring OFF a field and colour its border instead.
       ⚠️ AND THE LENGTH IS FOUND ANYWHERE IN THE DECLARATION, NOT AT THE FRONT
       OF IT. A shorthand with a `var()` in it survives verbatim, so the shipped
       rules read `outline: 1px solid var(--hi)`; one WITHOUT a var is
       canonicalised by the browser to `outline: red solid 3px`, and a check
       anchored on the width coming first found the fourteen real rules and
       missed a sabotage typed by hand. */
    const widthOf = (r) => (/outline(?:-width)?:[^;]*?([\d.]+)px/.exec(r.cssText) || [])[1];
    const paints = (r) => widthOf(r) !== undefined;
    const rings = rules.filter((r) => /:focus-visible/.test(r.selectorText) && paints(r));
    const wide = rings.filter((r) => widthOf(r) !== '1');
    /* A ring on plain `:focus` is the defect. `:focus:not(:focus-visible)` is
       the suppression idiom and is not one, so it is excluded by name rather
       than by hoping no rule uses it. */
    const onPress = rules.filter((r) => /:focus(?![-a-z])/.test(r.selectorText)
      && !/:focus:not\(:focus-visible\)/.test(r.selectorText) && paints(r));

    /**
     * 🔴 THREE CLAIMS ABOUT THE CASCADE, MEASURED AGAINST RENDERED BOXES, AND
     * ALL THREE ARE HERE BECAUSE A DEAD RULE READS AS CORRECT. This page is
     * where component drift is supposed to become visible, and each of these
     * names a defect that shipped while every assert on every page stayed
     * green.
     * ⚠️ THEY BUILD THEIR OWN SPECIMENS RATHER THAN READING THE PAGE'S,
     * because two of the three are combinations no specimen on this page wears:
     * the defects were reachable only from `/wish/` and `/tom/`, and a check
     * that can only run on the page that already has the bug is a check that
     * arrives after it.
     */
    {
      const probe = el('div', 'kit-cascade-probe');
      probe.style.cssText = 'position:absolute;left:-9999px;top:0;width:600px';
      document.body.append(probe);

      /* 🔴 A GLYPH BUTTON IS A SQUARE WHEREVER IT IS, AND THE RULE SAYING SO
         WAS SCOPED TO ONE ROW UNTIL 2026-09-25. MEASURED on `/wish/` before the
         widening: 45.83 px wide against 34.00 tall, with the attribute set
         correctly, because `.pos-controls button[data-glyph="1"]` could not
         reach a button in a table row.
         🔴 AND IT IS MEASURED ON THE BOX, NEVER ON THE ATTRIBUTE, which is the
         whole reason it went unnoticed: `/wish/`'s action column is 72 px, the
         wrong size fitted inside it, and nothing collided. An assert reading
         `dataset.glyph` would have passed throughout. */
      const sq = (host) => {
        const b = el('button', '', '⇄');
        b.type = 'button'; b.dataset.glyph = '1';
        host.append(b);
        const r = b.getBoundingClientRect();
        b.remove();
        return { w: +r.width.toFixed(2), h: +r.height.toFixed(2) };
      };
      const row = el('div', 'pos-controls');
      probe.append(row);
      const inRow = sq(row);
      const loose = sq(probe);
      d.assert('a glyph button is a square outside the control row as well as inside it',
        inRow.w === 34 && inRow.h === 34 && loose.w === 34 && loose.h === 34,
        `in the row ${inRow.w} by ${inRow.h}, outside it ${loose.w} by ${loose.h}`);

      /* 🔴 A STEP GRID'S LABEL COLUMN KEEPS ITS WIDTH ON A PANEL'S FIXED
         COLUMN, AND FOR THREE DAYS IT DID NOT. `.pos-pg-labs` declared
         `border-right: 0; padding-right: 0` three thousand lines above
         `.panel-fixed-l`, both at (0,1,0), so the panel won and the label
         column's CONTENT box computed to 0.00 px against `width: 22px` under
         `box-sizing: border-box`. MEASURED on `/tom/`: 64 of 64 labels clipped,
         a lone `0` being 6.02 px of ink and `63` being 12.04, which is exactly
         why 0 to 9 looked perfect.
         🔴 THIS PAGE COULD NOT HAVE CAUGHT IT AND THAT IS WHY THE SPECIMEN IS
         BUILT HERE. `createStepGrid`'s three specimens on this page hand it a
         bare `div` as `fixed`, so none of them wears `.panel-fixed-l`, and
         `/tom/` was the only page in the repository putting the two together:
         the one page with the defect was the only page that could grade it. */
      const panel = el('div', 'panel panel-case');
      const labs = el('div', 'panel-fixed panel-fixed-l pos-pg-labs');
      labs.style.setProperty('--pg-lab', '22px');
      const lab = el('span', '', '63');
      labs.append(lab); panel.append(labs); probe.append(panel);
      const labCs = getComputedStyle(labs);
      const inner = labs.clientWidth;
      const ink = lab.getBoundingClientRect().width;
      d.assert('a step grid’s labels keep their whole width on a panel’s fixed column',
        inner >= 22 && ink <= inner + 0.01
          && labCs.borderRightWidth === '0px' && labCs.paddingRight === '0px',
        `content box ${inner.toFixed(2)} px against a 22 px width, ink ${ink.toFixed(2)} px, `
        + `border ${labCs.borderRightWidth}, padding ${labCs.paddingRight}`);
      probe.remove();
    }

    d.assert('every focus ring in the shell is 1 px, and not one of them paints on a mouse press',
      rules.length > 0 && rings.length >= 12 && wide.length === 0 && onPress.length === 0,
      `${rings.length} ring(s) across ${rules.length} rules, ${wide.length} not 1 px`
      + `${wide.length ? ` (${wide[0].selectorText} at ${widthOf(wide[0])}px)` : ''}`
      + `, ${onPress.length} painting on plain :focus`
      + `${onPress.length ? ` (${onPress[0].selectorText})` : ''}`);
  }


  /**
   * 🔴 THE TAB PAGE'S CHECK PASS, LAST BEFORE `d.ready()` AND NEVER AFTER IT.
   * The harness drills `__demo.transport` the moment `ready` is true and sends
   * its seek key at `window`, which every bar that is not in a closed tab
   * hears; a drill of this block's own bars running at the same moment would
   * have the harness's key land in the middle of its pause hold. So it runs
   * here, where nothing else is pressing anything. It costs about three
   * seconds of boot, measured in the report that came with it.
   */
  if (SELFCHECK && tabSpec) {
    const { page } = tabSpec;
    const nap = (ms) => new Promise((r) => setTimeout(r, ms));
    try {
      await page.check();
      // After the pass the specimen is back on QUIET with BARS built and closed.
      const { live, frozen } = page.built('bars');
      const was = live.api.position;
      window.dispatchEvent(new KeyboardEvent('keydown', { key: '0', bubbles: true }));
      await nap(DRILL.keyMs);
      d.assert('TAB PAGE: a key from the page does not reach a bar in a closed tab',
        page.at() === 'quiet' && Math.abs(live.api.position - was) < 1,
        `open on ${page.at()}, the BARS bar went ${was.toFixed(0)} -> ${live.api.position.toFixed(0)}`);
      page.tabs.go('bars', { push: false });
      const liveWas = live.api.position;
      frozen.api.el.dispatchEvent(new KeyboardEvent('keydown', { key: '0', bubbles: true }));
      await nap(DRILL.keyMs);
      d.assert('TAB PAGE: a key aimed at one bar moves that bar and not its neighbour',
        Math.abs(frozen.api.position) < 1 && Math.abs(live.api.position - liveWas) < 1,
        `the aimed bar is at ${frozen.api.position.toFixed(0)}, its neighbour went `
        + `${liveWas.toFixed(0)} -> ${live.api.position.toFixed(0)}`);
      page.tabs.go('quiet', { push: false });
    } catch (e) {
      d.assert('TAB PAGE: its checks ran to the end', false, e.message);
    }
  }
  } // if (SELFCHECK)

  d.ready();
</script>
