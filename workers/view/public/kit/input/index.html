<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

<title>POSITRON kit/input</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/kit-page.css">
<script type="module">
  import { el } from '/shell/shell.mjs';
  import { createStack } from '/shell/stack.mjs';
  import { createStepper } from '/shell/stepper.mjs';
  import { createSlider, createSliderGroup, GLIDE_MS } from '/shell/slider.mjs';
  import { createRangeSlider, spanPixels } from '/shell/range-slider.mjs';
  import { createCheck, createCheckGroup } from '/shell/check.mjs';
  import { createToggle } from '/shell/toggle.mjs';
  import { createRoll } from '/shell/roll.mjs';
  import { MOVE_GLYPH } from '/shell/hand.mjs';
  import { createChoice } from '/shell/choice.mjs';
  import { createKeyboard, QWERTY_CHROMATIC, SHARP_KEYS } from '/shell/keyboard.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { createField } from '/shell/field.mjs';
  import { createCodeBox } from '/shell/code-box.mjs';
  import { createHueBook } from '/shell/code-lang.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createCompileIdle, IDLE_MS, NOTE_SAYS } from '/shell/compile-idle.mjs';
  import { createParamKnobs } from '/shell/param-knobs.mjs';
  import { createFader } from '/shell/fader.mjs';
  import { createDrop } from '/shell/drop.mjs';
  import { createXrProbe, xrCaps, onXrCaps, reasonFor, canEnter, answered, XR_STATES }
    from '/shell/xr-caps.mjs';
  import { createKitPage } from '/shell/kit-page.mjs';

  /**
   * 🔴 kit/input, ONE PART OF `/kit/` ON A PAGE OF ITS OWN, 2026-10-06
   * (plans/plan-kit-split.md). Every block, holder and check below is copied
   * VERBATIM from `demo/kit/index.html`, in that file's order, so the newest
   * block is still the first. What changed is mechanical: `section()` lost its
   * first argument, the holders sit here rather than at the top of the
   * monolith, the measuring window and the tab row are gone, and every check
   * is behind `?selfcheck=1`.
   * ⚠️ AND TWO CHECKS MOVED AFTER `d.ready()`, as the plan asks: COMPILE ON A
   * PAUSE's timed half and the keyboard looper. They held about 7.5 s of the
   * monolith's 11 s to `ready`, and every gap in either is under the
   * harness's 2 s of tolerated silence, so they are graded after `ready` the
   * way HARDWARE's and SLIDES' always were.
   */
  const { d, out, section, land, checkPage } = createKitPage({
    part: 'input',
    what: "Buttons, sliders, knobs, keys and fields that a visitor presses, drags or types into.",
  });

  let padSpec = null, vertSpec = null;
  // The stepper whose middle is a value, for the check that it really is one.
  let stepperPick = null;
  // The narrow keyboard, for the check that it really overflows.
  let kbNarrow = null;

  // The pair in the invisible hand block: one slider with a hand and one
  // without, held so the checks at the bottom can compare them. ⚠️ DECLARED
  // HERE for the reason the two lines above give: a `let` left beside a block
  // that moves is read in its dead zone.
  let handSpec = null;

  // The button group specimens, held for the checks at the bottom: one row of
  // ordinary actions, and one pair driven by what this browser actually says
  // about a headset. ⚠️ DECLARED UP HERE WITH THE OTHERS, for the reason those
  // lines give: this is the newest block and therefore the topmost one, and a
  // `let` left where a block used to be is read in its dead zone.
  let bgSpec = null, bgRow = null, xrSpec = null, smallSpec = null;
  // The choice specimen, kept so the button group can be measured AGAINST it
  // rather than against a number typed into a check. The claim being graded is
  // that the two are different sizes of object, which is a comparison or it is
  // nothing.
  let choiceSpec = null;
  /**
   * 🔴 NEWEST AT THE TOP, AND THE HEADING IS UPPERCASE. A drop target, as of
   * 2026-09-21, asked for as *"do lightweight planning on patch demo (inclu
   * global dragdroppable upload)"* and built because `/pack/` needs a way in
   * for a pack that is not the one in this repository.
   *
   * 🔴 THE AREA IS THE POINT AND THE FIRST VERSION OF THIS BLOCK HAD NONE.
   * It showed a button, because that was all the component drew: its cover is
   * `position: fixed` and is inserted only while a drag is in flight, so the
   * thing inviting the gesture appeared after the gesture. Reported as *"i just
   * do not get funcionality why there is no upload aread / button"*.
   *
   * 🔴 IT IS `open`, NOT `upload`, AND THE SPECIMEN'S LABEL IS THE POINT.
   * Nothing leaves the machine and this module names no network API at all. A
   * purchased soundbank lives in `purchased/` precisely because it is not ours
   * to publish, and a control called *upload* invites somebody to build the
   * thing that gitignore exists to prevent.
   *
   * 🔴 AND THE REFUSAL HAS A BUTTON, BECAUSE A DRAG CANNOT BE SYNTHESISED AND
   * THE HALF NOBODY TESTS IS THE HALF THAT REFUSES. `/tapes/`, `/now/` and
   * `/flipper/` were all fully green against stand-ins whose refusals had been
   * switched off, four instances of one pattern, and the fix was the same every
   * time: break it on purpose and see what stays green. Dropping a JPEG here is
   * that press, and it is the same code path a real drop takes.
   *
   * ⚠️ AND NOTHING HERE IS IN A `.pos-controls` ROW, for the reason the two
   * blocks below give: both harnesses press that row by position, so a new top
   * block with a control in it moves every other block's press. These two
   * buttons are in the box, which nothing presses by position.
   */
  // The drop specimen's own state, declared out here rather than inside the
  // block, for the reason this page has written down three times: a block that
  // moves to the top leaves its `const` behind, the build reads it in its dead
  // zone, `section()` swallows the throw into `failed`, and the page dies much
  // later with a message about a different line.
  let kitDrop = null, kitDropLine = null, kitDropTall = 0;
  let rangeSpec = null;       // { wide, shut, off, single, group }
  // ⚠️ DECLARED UP HERE WITH EVERY OTHER HOLDER, NOT BESIDE ITS BLOCK. The
  // SWITCH block is the newest one on this page and so it is the topmost one,
  // and a `let` left where a block used to be is read in its dead zone: this
  // page has already been taken out that way once, and `section()` swallowed
  // the throw so the message named a different line.
  let toggleSpec = null;
  let rollSpec = null;      // { lit, dark, quietOn, quietOff, dim, presses }
  let checkSpec = null;       // { one, off, some, dim, across, down }
  let standSpec = null;       // { lying, standing, empty }


  /**
   * 🔴 THE BLOCK UNDER THE HARDWARE PAIR, 2026-09-30, ABOVE KNOBS UNDER THE CODE, AND
   * ONCE THE FIRST CALL TO `section()`. `plans/plan-code-editor.md`, asked as *"a hand-rolled
   * overlay - maybe not that bad idea"* and *"coloring slider code snippets
   * would be nice, perhaps each on its own hue"*. The box is the kit field's
   * own textarea, transparent, over a pre of coloured spans.
   * ⚠️ THE BOOK IS HANDED `cutoff` AND `res` AND NOT `freq` OR `gate`, which is
   * what a page does after a compile: only a name with a knob gets a hue, and a
   * key-driven one is drawn plain. The hslider in the comment is not a
   * parameter at all. Six rows for seven lines, so it scrolls.
   * ⚠️ `codeSpec` IS DECLARED ABOVE THE BLOCK, for the reason `cnoteSpec` is.
   */
  let codeSpec = null;
  section('CODE BOX',
    'A program box whose text is coloured by language, with each parameter that has a knob in its own hue.',
    `const hues = createHueBook()             // one per page, the knob row reads it too
const box = createCodeBox({
  language: 'faust',                      // 'faust' | 'sclang' | 'csound-sco'
  rows: 20, value, hues,
  ariaLabel: 'the Faust program this page compiles',
})
hues.assign(knobNames)                    // after a compile that succeeded
createCompileIdle({ input: box.input, host: box.el, compile })
box.set(preset); box.params(); box.mark('cutoff', true)`,
    (box) => {
      const hues = createHueBook();
      const cb = createCodeBox({
        language: 'faust', rows: 6, hues,
        ariaLabel: 'a Faust program, to show the colours',
        value: 'import("stdfaust.lib");\n'
          + '// hslider("ghost", 1, 0, 2, 0.1) in a comment is not a parameter\n'
          + 'freq = hslider("freq", 440, 40, 8000, 0.01);   // a key sets this one\n'
          + 'cutoff = hslider("cutoff[unit:Hz]", 1200, 40, 8000, 1);\n'
          + 'res = hslider("res", 0.5, 0, 0.99, 0.01);\n'
          + 'gate = button("gate");\n'
          + 'process = os.sawtooth(freq) : fi.resonlp(cutoff, 1 + res * 8, 1) * en.adsr(0.01, 0.2, 0.7, 0.3, gate) <: _, _;',
      });
      hues.assign(['cutoff', 'res']);
      codeSpec = { cb, hues };
      box.append(cb.el);
    });

  /**
   * 🔴 THE NEWEST BLOCK ON THIS PAGE, 2026-09-30, AND THE FIRST CALL TO
   * `section()`. Asked as *"variables in code ... that are under the code and
   * adjust parameters in real time"*: `/collide/` and `/fau/` hand
   * `param-knobs.mjs` the parameters their compiler read out of the program,
   * and it draws one knob each, turning 0 to 1 through the parameter's warp.
   * ⚠️ `--param-hue` IS SET ON THE MIDDLE ONE ONLY, to show the hook;
   * `/collide/` and `/fau/` set it on every knob from the hue book their code
   * box reads, since 2026-09-30. Every knob here has an invisible hand.
   * ⚠️ `pkSpec` IS DECLARED ABOVE THE BLOCK, for the reason `cnoteSpec` is.
   */
  let pkSpec = null;
  const PK_PARAMS = [
    { name: 'rel', value: 1.5, min: 0.05, max: 6, warp: 'exp' },
    { name: 'cutoff', value: 8000, min: 100, max: 8000, warp: 'exp', step: 1 },
    { name: 'pan', value: 0, min: -1, max: 1 },
  ];
  section('KNOBS UNDER THE CODE',
    'One knob for each parameter a program declares, with the program\'s own range, rebuilt after every compile and keeping a value whose name survives.',
    `const knobs = createParamKnobs({
  onChange: (name, value) => send(name, value),   // a person turned one
})
row.append(knobs.el)                              // one knob's height, even with none
knobs.set([                                       // after every compile
  { name: 'rel', value: 1.5, min: 0.05, max: 6, warp: 'exp' },
  { name: 'cutoff', value: 8000, min: 100, max: 8000, warp: 'exp', step: 1 },
])                                                // answers every value it kept
knobs.value('rel')
// every knob wears data-param="<name>", and --param-hue on it or above it colours its arc, name and number`,
    (box) => {
      const turns = [];
      const knobs = createParamKnobs({ onChange: (name, v) => turns.push([name, v]) });
      knobs.set(PK_PARAMS);
      knobs.knob('cutoff').el.style.setProperty('--param-hue', '200');
      pkSpec = { knobs, turns };
      box.append(knobs.el);
    });

  /**
   * 🔴 THE NEWEST BLOCK ON THIS PAGE UNTIL KNOBS UNDER THE CODE, 2026-09-30.
   * Asked as *"unify compilation in ui logic on this and fau ant othes.
   * trigger on inactivity? Small breating "Compiling" note (not button) on
   * right bottom i the plae complile button is in fau. a kit comopnent?"*.
   * `/fau/` and `/csound/` use it.
   * ⚠️ THE COMPILER HERE IS A STAND-IN THAT TAKES 350 ms, because what this
   * block shows is the TIMING and the note, and a real compiler on the kit
   * page would be six megabytes for a specimen. Type `error` anywhere in the
   * box and it refuses, which is how the standing error is shown.
   * ⚠️ `Hold a note` IS `notNow`: while it is down a due compile waits, and it
   * runs the moment it comes up.
   * ⚠️ `cnoteSpec` IS DECLARED BESIDE THE BLOCK AND ABOVE IT, because a block
   * that moves on this page has left its `const` behind before.
   */
  let cnoteSpec = null;
  section('COMPILE ON A PAUSE',
    'A box that compiles what was typed once the typing stops, with a breathing note in its corner while it does.',
    `const idle = createCompileIdle({
  input: field.input,          // listens for input
  host:  field.el,             // the note goes in its bottom right corner
  compile: (text) => build(text),   // sync or async, { ok: false, error } fails
  notNow: () => heldKeys > 0,  // a due compile waits while this is true
})
idle.track(loadCompile)        // show the note over a compile the page started
idle.cancel()                  // the page replaced the text, drop what was due`,
    (box) => {
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      const compiled = [];
      let holding = false;
      const f = createField({ rows: 4, code: true, grow: 'wide',
        value: 'process = os.osc(440) * 0.2;\n// type here, then stop' });
      f.input.setAttribute('aria-label', 'a program the stand-in compiler reads');
      const idle = createCompileIdle({
        input: f.input,
        host: f.el,
        notNow: () => holding,
        compile: async (text) => {
          await wait(350);
          compiled.push(text);
          return text.includes('error')
            ? { ok: false, error: 'the stand-in refuses any text with error in it' }
            : { ok: true };
        },
      });
      const hold = createToggle({ label: 'Hold a note', size: 'small',
        onChange: (on) => { holding = on; } });
      cnoteSpec = { f, idle, hold, compiled, setHolding: (on) => { holding = on; hold.set?.(on); } };
      box.append(f.el, hold.el);
    });

  /**
   * 🔴 NEWEST AT THE TOP, AND THE HEADING IS UPPERCASE. A control grid, as of
   * 2026-09-22, asked for as *"make component for know etc grid where centers
   * of 2x2 knobs make square etc"* and then *"it can be any x y count of
   * elements, right?"*.
   *
   * 🔴 **THE PROBLEM IS THAT A CONTROL IS TALLER THAN IT IS WIDE AND MUST BE.**
   * `--ctl-head` and `--ctl-foot` are the contract: a value line above the
   * dial and a label and a sub below it. So the distance between two dial
   * centres ACROSS is a dial plus a gap, and DOWN it is a dial plus three lines
   * plus a gap. On `/plai/` that was 46 against about 100, and four knobs made
   * a tall rectangle.
   * ✅ **THE FIX WIDENS THE COLUMNS AND NEVER SHRINKS THE ROWS**, because
   * shrinking a row means cutting the value or the label, which are the only
   * things naming what the control does.
   * ⚠️ **AND THE THIRD SPECIMEN IS THE DEMONSTRATION.** A grid of FADERS, which
   * are a different shape again, on the same component with the same rule.
   * A block showing only knobs would have proved the arithmetic works once.
   */
  /**
   * 🔴 NEWEST AT THE TOP, AND THE HEADING IS UPPERCASE. A switch, as of
   * 2026-09-22, asked for as *"add switch component (similar to checbox,
   * rounded yellow ot lightgray rect (primary second))"*.
   *
   * 🔴 **IT IS IN `input` TWO BLOCKS ABOVE THE CHECKBOX, AND THAT IS THE WHOLE
   * POINT**, the same argument the SLIDER block makes for a fader beside a
   * slider and the CHOICE one makes for a standing choice beside a lying one.
   * A switch and a checkbox are two state controls built a day apart, so the
   * only thing that can catch them collapsing into one control with two looks
   * is having them on one scroll where one pair of eyes sees both.
   *
   * 🔴 **THE QUESTION THEY ANSWER IS DIFFERENT AND THE LOOK FOLLOWS FROM IT.**
   * A box is a member of a set, so it is small, square and read as part of a
   * list with a heading over it. A toggle is one thing running or not, so it
   * is a button that stays down. `toggle.mjs` carries the argument in full, and
   * the half that decides it is the announcement: `aria-pressed` says PRESSED
   * where a checkbox says *in the set*.
   * ⚠️ IT SAID `switch.mjs` AND `role="switch"` UNTIL 2026-09-23, when that
   * module was deleted and its three callers swept. A path in a comment that no
   * longer resolves is this project's most repeated defect in its cheapest
   * form.
   * ⚠️ **WHAT THAT ROLE SOUNDS LIKE IS NOT MEASURED ANYWHERE.** No screen
   * reader was run on this machine. What is graded below is that the role is on
   * the element carrying the state, which is the half a browser can answer.
   *
   * 🔴 **BOTH WEIGHTS ARE HERE ON AND OFF, AND SO IS A SWITCH NOBODY MAY
   * PRESS.** A state nobody can see is a state nobody grades, and the disabled
   * one is the negative control the rest of this block leans on: it is wired to
   * the same counter as the other four, so a press that gets through shows up
   * as a number rather than as a look.
   */
  /**
   * 🔴 IT REPLACED `SWITCH` ON 2026-09-23, ASKED FOR IN ONE LINE: *"integrate
   * sustain to footer, create toggle button, big and small, use small below
   * keyboard, left from notes off. rm switch button from all uis / kit"*.
   * `switch.mjs` and its test are deleted and its three callers are swept.
   * ⚠️ WHAT THE SWITCH BLOCK GRADED AND THIS ONE STILL DOES: one counter behind
   * every specimen, so a press that got through the DISABLED one is an integer
   * here rather than something nobody would see in a screenshot.
   * ⚠️ AND `weight` DID NOT SURVIVE THE MOVE. A switch had a loud state and a
   * quiet one; a toggle button has a SIZE instead, because the thing that
   * varies between a page control and a keyboard's own footer is how much room
   * it may take, not how loudly it may speak.
   */
  section('TOGGLE',
    'A button that stays down, in the two sizes: the page\'s own 34 px and the '
    + '26 px a keyboard footer takes, with a disabled one beside them.',
    `createToggle({ label: 'Monitor', checked: true, onChange })
createToggle({ label: 'Sustain', size: 'small', onChange })
createToggle({ label: 'Board', checked: true, disabled: true })`,
    (box) => {
      const o = out('nothing pressed');
      const presses = { n: 0, last: '' };
      const say = (name) => (on) => {
        presses.n++;
        presses.last = `${name} ${on ? 'down' : 'up'}`;
        o.textContent = presses.last;
      };
      const lit = createToggle({ label: 'Monitor', checked: true, onChange: say('monitor') });
      const dark = createToggle({ label: 'Click', checked: false, onChange: say('click') });
      const small = createToggle({ label: 'Sustain', size: 'small', onChange: say('sustain') });
      const smallOn = createToggle({
        label: 'Hold', size: 'small', checked: true, onChange: say('hold'),
      });
      const dim = createToggle({
        label: 'Board', checked: true, disabled: true, onChange: say('board'),
      });
      toggleSpec = { lit, dark, small, smallOn, dim, presses };
      const row = el('div', 'kit-row');
      row.append(lit.el, dark.el, small.el, smallOn.el, dim.el);
      box.append(row, o);
    });

  /**
   * 🔴 NEWEST AT THE TOP, AND THE HEADING IS UPPERCASE. A range slider, as of
   * 2026-09-22, asked for as *"2-head slider (range)"*.
   *
   * ✅ **IT HAS A NAMED JOB RATHER THAN BEING A SHAPE SOMEBODY WANTED.** A
   * macro leg on the Circuit is `Destination, Start, End, Depth`, and 8 macro
   * knobs by 4 legs is 32 start and end pairs, every one of which is two
   * sliders today.
   *
   * 🔴 **FOUR CONTROLS IN ONE GROUP, AND THAT IS THE DEMONSTRATION.** What is
   * being shown is not that a range can be dragged; it is that a range and a
   * single slider share the group's columns, so a panel can mix them and every
   * lane still starts at the same x. A block with one range in it would have
   * proved nothing and the check at the foot of this file would have had
   * nothing to compare against.
   * ⚠️ **AND THREE OF THEM ARE AWKWARD STATES.** One is collapsed, which is a
   * real setting for a leg with no travel and is also the case where every
   * press would grab the same handle if the tie rule were wrong. One is
   * disabled. One carries a gap, so the two can never meet.
   * ⚠️ **NOTHING HERE IS IN A `.pos-controls` ROW**, for the reason the blocks
   * below give: both harnesses press that row by position, so a new top block
   * with a control in it moves every other block's press. MEASURED once on
   * `/radio/` as a single press moving from t+1 s to t+31 s.
   */
  section('RANGE SLIDER',
    'One lane with a start and an end on it, in a group beside an ordinary slider '
    + 'so the shared columns can be seen holding both.',
    `createRangeSlider({ label: 'macro 1 A', sub: 'start and end',
                    min: 0, max: 127, step: 1, from: 12, to: 96, onInput })`,
    (box) => {
      const o = out('nothing moved');
      const say = (what) => ({ from, to }) => { o.textContent = `${what} ${from} to ${to}`; };
      const wide = createRangeSlider({
        label: 'macro 1 A', sub: 'start and end', min: 0, max: 127, step: 1,
        from: 12, to: 96, onInput: say('leg A'),
      });
      // A leg with no travel. Both handles on one number, which the tie rule
      // exists for: press left of the pair and the start comes away, press
      // right and the end does.
      const shut = createRangeSlider({
        label: 'macro 1 B', sub: 'no travel', min: 0, max: 127, step: 1,
        from: 64, to: 64, onInput: say('leg B'),
      });
      const gap = createRangeSlider({
        label: 'macro 1 C', sub: 'never closer than 20', min: 0, max: 127, step: 1,
        from: 30, to: 100, gap: 20, onInput: say('leg C'),
      });
      const off = createRangeSlider({
        label: 'macro 1 D', sub: 'not assigned', min: 0, max: 127, step: 1, from: 0, to: 127,
      });
      off.disabled(true);
      const single = createSlider({
        label: 'depth', sub: 'CC 80', min: 0, max: 127, step: 1, value: 64,
        onInput: (v) => { o.textContent = `depth ${v}`; },
      });
      const g = createSliderGroup([wide, shut, gap, off, single]);
      rangeSpec = { wide, shut, gap, off, single, group: g };
      box.append(g.el, o);
    });

  /**
   * 🔴 NEWEST AT THE TOP, AND THE HEADING IS UPPERCASE. A checkbox, as of
   * 2026-09-22, asked for as *"plus checboxes and radios (horiz and vert)"*.
   *
   * 🔴 **THERE WAS NO CHECKBOX IN THIS KIT AT ALL.** Searched the whole of
   * `demo/shell/` and every page on 2026-09-22: zero. `choice.mjs` is a
   * segmented row where exactly one option is armed, which answers *which one
   * of these*, and nothing here answered *which of these*.
   * ⚠️ **IT IS A REAL `<input type="checkbox">` AND NOT A BUTTON WEARING
   * `aria-pressed`**, which is the opposite choice from the one beside it and
   * is the right one for a different question. The four reasons are in
   * `check.mjs`, and the one that decides it is the announcement: a screen
   * reader says `checkbox, checked` for one and `button, pressed` for the
   * other, and *pressed* says something happened where what is true is that
   * something IS.
   * ⚠️ **THE THIRD STATE IS HERE BECAUSE IT IS THE ONE A BUTTON CANNOT DRAW.**
   * `indeterminate` is *some of the ones under this heading*, and
   * `aria-pressed` can spell it `mixed` and nothing paints it.
   */
  section('CHECKBOX',
    'Many of a set rather than one of them, with the half lit third state that a '
    + 'button wearing a pressed attribute can spell and cannot draw.',
    `createCheck({ label: 'loop', checked: true, onChange })
createCheckGroup({ label: 'sends', options: [['reverb','rev'], …], value: ['rev'] })
createCheckGroup({ label: 'parts', options: [...], orient: 'column' })`,
    (box) => {
      const o = out('nothing changed');
      const one = createCheck({
        label: 'loop', checked: true,
        onChange: (on) => { o.textContent = `loop ${on ? 'on' : 'off'}`; },
      });
      const off = createCheck({
        label: 'mute', checked: false,
        onChange: (on) => { o.textContent = `mute ${on ? 'on' : 'off'}`; },
      });
      // 🔴 SOME OF THEM, WHICH IS A REAL ANSWER AND NOT A LOADING STATE. It is
      // what a heading over a set looks like when part of the set is on, and a
      // press clears it because a press has answered the question.
      const some = createCheck({
        label: 'all parts', mixed: true,
        onChange: (on) => { o.textContent = `all parts ${on ? 'on' : 'off'}, and no longer some`; },
      });
      const dim = createCheck({ label: 'sync', checked: true, disabled: true });
      const across = createCheckGroup({
        label: 'sends',
        options: [['reverb', 'rev'], ['delay', 'dly'], ['side chain', 'sc'],
          ['distortion', 'dist'], ['equaliser', 'eq']],
        value: ['rev', 'dly'],

  section('PIANO ROLL',
    'Pitch across, time down, one row per chord, and the columns are the keyboard\'s own. '
    + 'Glued on top of an instrument, or on its own.',
    `createRoll(kb.el, { base, keys, map, sharps, prepend: true, scroller: kb.keysEl, onPick })
createRoll(parent, { base, keys, map, sharps })   // on its own`,
    (box) => {
      box.classList.add('kit-wide');
      const stack = createStack(undefined, 'kit-col');
      const o = out('nothing picked');

        { label: 'Cmaj I', notes: [60, 64, 67] },
        { label: 'F/C IV', notes: [60, 65, 69] },
        { label: 'G7 V', notes: [59, 62, 65, 67] },

  /* ⚠️ HOISTED SO THE CHECK AT THE FOOT CAN REACH THEM. Every specimen is built

createKeyboard(parent, { letters: false })   // a second one on the same page`,

       * overflows at 320 overflows on all of them, with room to spare.

  // ── picker ──────────────────────────────────────────────────────────────
  section('PICKER',
    '',
    `createPicker({ label: 'sound', what: 'patch', prev, next, random, onPick })`,
    (box) => {

        onPick: (i) => show(i),

  /* ── what a machine can say about this page ─────────────────────────────

     included (CLAUDE.md: a self-check never runs for a visitor). The checks
     below are copied from `demo/kit/index.html` VERBATIM and keep that
     file's indent, so a diff against it reads clean; the one line taken out
     of each is a `settle()` or `measure()`, the measuring window a page with

  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  checkPage();


  /* ── the code box, the newest block ────────────────────────────────────────
     🔴 THE WHOLE DESIGN RESTS ON ONE INVARIANT: THE DRAWN LAYER HOLDS EXACTLY
     THE TEXTAREA'S TEXT, AT EXACTLY THE TEXTAREA'S METRICS, IN EXACTLY ITS
     RECTANGLE. Read off the rendered elements, never off the source.
     ⚠️ `refit()` FIRST, BECAUSE A MEASURING WINDOW HOLDS NO FRAME. The box was
     built inside a closed panel, where it measures nothing on purpose, and its
     ResizeObserver answers a frame after this line; the same reason the
     INSTRUMENT PANEL block calls the filter view's `redraw()`. */
  {
    const { cb, hues } = codeSpec;
    cb.refit();
    const ta = cb.input, ink = cb.ink, sc = cb.scroller;
    const cs = (e) => getComputedStyle(e);
    const same = () => ink.textContent === ta.value;
    const PROPS = ['font-family', 'font-size', 'line-height', 'letter-spacing', 'tab-size', 'white-space',
      'overflow-wrap', 'padding-top', 'padding-right', 'padding-bottom', 'padding-left'];
    const differ = PROPS.filter((p) => cs(ink).getPropertyValue(p) !== cs(ta).getPropertyValue(p));
    const ri = ink.getBoundingClientRect(), rt = ta.getBoundingClientRect();
    const off = Math.max(Math.abs(ri.left - rt.left), Math.abs(ri.top - rt.top),
      Math.abs(ri.width - rt.width), Math.abs(ri.height - rt.height));
    d.assert('the coloured layer holds the textarea’s text exactly, at its metrics and in its rectangle',
      same() && differ.length === 0 && off <= 0.5 && rt.height > 0,
      `${ta.value.length} characters, ${differ.length ? `differs in ${differ.join(' ')}` : `${PROPS.length} metrics equal`}, `
      + `rectangles ${off.toFixed(2)} px apart, ${rt.width.toFixed(1)} by ${rt.height.toFixed(1)}`);

    const edge = (e) => parseFloat(cs(e).borderTopWidth) + parseFloat(cs(e).borderBottomWidth);
    const lh = parseFloat(cs(ta).lineHeight);
    d.assert('the border is on the scroller and not on the textarea, and six rows of seven lines scroll inside it',
      edge(sc) === 2 && edge(ta) === 0 && cs(ta).color === 'rgba(0, 0, 0, 0)'
        && sc.scrollHeight > sc.clientHeight + lh / 2 && cs(sc).overflowY === 'auto'
        && Math.abs(sc.clientHeight - (6 * lh + parseFloat(cs(ta).paddingTop) + parseFloat(cs(ta).paddingBottom))) <= 1,
      `scroller ${edge(sc)} px of border, textarea ${edge(ta)}, ink ${cs(ta).color}, `
      + `${sc.clientHeight} of ${sc.scrollHeight} px shown, ${(sc.clientHeight / lh).toFixed(1)} line heights`);

    // What each parameter span says, and the ink its name is drawn in.
    const spans = () => [...ink.querySelectorAll('.pos-tk-p')];
    const nameInk = (s) => cs(s.querySelector('.pos-tk-pname') || s).color;
    const plainStr = cs(ink.querySelector(':scope > .pos-tk-string')).color;
    const read = () => spans().map((s) => `${s.dataset.param}${s.dataset.hue ? `:${s.dataset.hue}` : ''}`).join(' ');

      ? nameInk(s) !== plainStr && cs(s).backgroundColor !== 'rgba(0, 0, 0, 0)'
      : nameInk(s) === plainStr && cs(s).backgroundColor === 'rgba(0, 0, 0, 0)'));
    d.assert('a hue lands only on a parameter with a knob: the key-driven freq and gate are drawn plain, the commented slider is not a parameter',
      read() === `freq cutoff:${hues.hueOf('cutoff')} res:${hues.hueOf('res')} gate` && hueOk(),
      `${read()}, a hued name ${nameInk(spans()[1])} against a plain string ${plainStr}`);

    const after = read();
    hues.clear().assign(['cutoff', 'res']);
    d.assert('a name that loses its knob loses its hue on the spot, and the box repaints without a keystroke',
      after === `freq cutoff res:${hues.hueOf('res')} gate` && read().includes('cutoff:') && hueOk(), after);

    const was = ta.value;
    ta.value = `${was}\n// typed`;
    ta.dispatchEvent(new Event('input', { bubbles: true }));
    const typed = same() && Math.abs(ink.getBoundingClientRect().height - ta.getBoundingClientRect().height) <= 0.5

      `${ink.querySelectorAll('.pos-tk-comment').length} comments after set()`);
  }

  /* ── the knobs under the code, the newest block ────────────────────────────
     🔴 THE ROW IS DRIVEN THROUGH A KNOB'S OWN KEYS, AND THE HUE IS READ OFF THE
     PAINTED STROKE. A hook nobody has measured is a hook that may never have
     worked, and `var()` fallbacks are exactly the kind of CSS that reads as
     correct and computes to something else. */
  {
    const { knobs, turns } = pkSpec;
    const onRow = () => [...knobs.el.querySelectorAll('.pos-knob[data-param]')];
    const num = (n) => knobs.knob(n)?.el.querySelector('.pos-knob-v').textContent;
    d.assert('a knob for each parameter, named by data-param, each printing the value the program wrote',
      onRow().map((k) => k.dataset.param).join(' ') === 'rel cutoff pan'
        && num('rel') === '1.50' && num('cutoff') === '8000' && num('pan') === '0.00'
        && getComputedStyle(knobs.el).display !== 'none',
      onRow().map((k) => `${k.dataset.param} ${k.querySelector('.pos-knob-v').textContent}`).join(', '));
    const arc = (n) => getComputedStyle(knobs.knob(n).el.querySelector('.pos-knob-arc')).stroke;
    const probe = el('span');
    probe.style.color = 'var(--hi)';

    const hi = getComputedStyle(probe).color;
    probe.remove();
    d.assert('with no --param-hue a knob draws in the ordinary accent, and with one it draws in that hue',
      arc('rel') === hi && arc('pan') === hi && arc('cutoff') !== hi && /^rgb/.test(arc('cutoff')),
      `rel ${arc('rel')}, cutoff ${arc('cutoff')}, --hi ${hi}`);
    const dial = knobs.knob('rel').el.querySelector('.pos-knob-dial');
    dial.dispatchEvent(new KeyboardEvent('keydown', { key: 'Home', bubbles: true }));
    d.assert('a key on the dial turns it through the warp to the bottom of the range, and says so to the page',
      knobs.value('rel') === 0.05 && num('rel') === '0.05' && turns.at(-1)?.join(' ') === 'rel 0.05'
        && dial.getAttribute('aria-valuetext') === '0.05',
      `${knobs.value('rel')}, "${num('rel')}", last turn ${turns.at(-1)?.join(' ')}`);
    const kept = knobs.set([PK_PARAMS[0], { name: 'drive', value: 2, min: 1, max: 8, step: 1 }]);
    d.assert('a rebuild keeps a value whose name survives, drops the rest and starts a new one where it is written',
      kept.map((k) => `${k.name} ${k.value}`).join(', ') === 'rel 0.05, drive 2'
        && onRow().map((k) => k.dataset.param).join(' ') === 'rel drive' && num('rel') === '0.05',
      kept.map((k) => `${k.name} ${k.value}`).join(', '));
    /* 🔴 SINCE 2026-09-30 AN EMPTY ROW KEEPS A KNOB'S HEIGHT AND SAYS SO
       (*"make the area h for thise buttons fixed so no junmp"*), so the keys
       under it on `/collide/` and `/fau/` never move. Measured against the
       row with two knobs in it, and nothing in the reserve is focusable. */
    const full = knobs.el.getBoundingClientRect().height;
    knobs.set([]);
    const empty = knobs.el.getBoundingClientRect().height;
    const focusable = knobs.el.querySelectorAll('[tabindex="0"], button:not([disabled])');
    d.assert('and a program with nothing to turn keeps the row a knob tall, empty, with nothing to focus',
      empty > 0 && Math.abs(empty - full) < 0.5 && (!!knobs.el.querySelector('.pos-pknobs-ghost') && !knobs.el.querySelector('.pos-pknobs-say'))
        && [...focusable].every((e) => e.closest('[inert]')),
      `${empty.toFixed(1)} px empty against ${full.toFixed(1)} px with knobs, "${knobs.el.textContent.trim()}"`);
    /* The name and the number wear the hue as well as the arc, and only where one is set. */
    knobs.set(PK_PARAMS);
    knobs.knob('cutoff').el.style.setProperty('--param-hue', '200');
    const ink = (n, c) => getComputedStyle(knobs.knob(n).el.querySelector(c)).color;
    d.assert('a hued knob draws its name and number in the arc\'s ink, and an unhued one keeps its own',
      ink('cutoff', '.pos-knob-lab') === arc('cutoff') && ink('cutoff', '.pos-knob-v') === arc('cutoff')
        && ink('rel', '.pos-knob-lab') !== arc('rel') && ink('rel', '.pos-knob-v') !== arc('rel'),
      `cutoff name ${ink('cutoff', '.pos-knob-lab')} arc ${arc('cutoff')}, rel name ${ink('rel', '.pos-knob-lab')}`);

  /* ── the compile note ──────────────────────────────────────────────────────

     the loop block near the foot), and the timed half is four compiles of a
     350 ms stand-in, so it is NOT awaited: its asserts land after `ready`,
     never more than about 1.5 s apart, which is inside the harness's patience.
     ⚠️ EACH HALF IS A NEGATIVE CONTROL FOR THE OTHER. A note that was always
     drawn passes "it breathes while compiling" and fails "the corner is
     empty"; a module that ignored `notNow` fails the held wait; one that
     dropped the compile under the hold fails the release. */
  {

      idle.shown() === '' && getComputedStyle(idle.el).display === 'none'

      `"${idle.shown()}", display ${getComputedStyle(idle.el).display}, a ${idle.el.tagName.toLowerCase()} `

  }

  /**
   * 🔴 THE BAND BETWEEN TWO HANDLES IS THE ONE THING `range-slider-test.mjs`
   * CANNOT SEE. That file grades the arithmetic and says so at the top: the
   * component positions the band with a `calc()` in percentages, because a
   * percentage follows the lane with no resize observation, and a percentage
   * cannot be run in node. `spanPixels` is the same arithmetic written in
   * pixels, so this compares what the browser resolved against what the
   * arithmetic says, and the two can disagree.

  if (rangeSpec) {
    const lane = rangeSpec.wide.lane.getBoundingClientRect();
    const [ka, kb] = rangeSpec.wide.knobs.map((k) => k.getBoundingClientRect());
    const bandEl = rangeSpec.wide.lane.querySelector('.sld-span');
    const band = bandEl.getBoundingClientRect();
    const { from, to } = rangeSpec.wide.get();
    const want = spanPixels(from / 127, to / 127, lane.width, ka.width);
    const gotLeft = band.left - lane.left;
    d.assert('the band runs between the two handles’ centres, and the arithmetic agrees',
      Math.abs(gotLeft - (ka.left + ka.width / 2 - lane.left)) <= 1
      && Math.abs(band.right - (kb.left + kb.width / 2)) <= 1
      && Math.abs(gotLeft - want.left) <= 1 && Math.abs(band.width - want.width) <= 1,
      `band ${gotLeft.toFixed(1)} to ${(gotLeft + band.width).toFixed(1)} in a `
      + `${lane.width.toFixed(1)} px lane, against ${want.left.toFixed(1)} and `
      + `${(want.left + want.width).toFixed(1)} from the arithmetic`);

    /**
     * 🔴 THE WHOLE ARGUMENT FOR THIS BEING A NEW MODULE RATHER THAN A COPY IS
     * THAT IT SHARES THE SLIDER'S COLUMNS, and a group holding four ranges and
     * one plain slider is the only way to measure it. `grains` once appended
     * four sliders to a class with no CSS anywhere and every lane started at a
     * different x, because a wider label pushes its own lane right.

    const lanes = [...rangeSpec.group.el.querySelectorAll('.sld-lane')]
      .map((l) => +l.getBoundingClientRect().left.toFixed(2));
    const spread = Math.max(...lanes) - Math.min(...lanes);
    d.assert('four ranges and one plain slider in one group start every lane at the same x',
      lanes.length === 5 && spread <= 0.5,
      `${lanes.length} lanes, ${spread.toFixed(2)} px apart at the left edge`);

    /**
     * 🔴 TWO VALUES ARE TWO TAB STOPS, AND THE LANE IS NOT ONE OF THEM. On a
     * single slider the LANE carries `tabindex` and is the slider; a range that
     * copied that would have one of its two values unreachable from a keyboard
     * entirely, which is invisible in a screenshot and free to read off the DOM.
     */
    const stops = [...rangeSpec.wide.el.querySelectorAll('[tabindex]')];
    d.assert('a range is two tab stops, one per handle, and the lane is not one',
      stops.length === 2 && stops.every((s) => s.classList.contains('sld-knob'))

    const [aa, ab] = rangeSpec.wide.knobs;

      + `${ab.getAttribute('aria-valuemin')}, with the pair at ${from} and ${to}`);

    const shutBand = rangeSpec.shut.lane.querySelector('.sld-span').getBoundingClientRect();
    const [sa, sb] = rangeSpec.shut.knobs.map((k) => k.getBoundingClientRect());
    d.assert('a collapsed pair draws no band and stacks its two handles exactly',
      shutBand.width <= 0.5 && Math.abs(sa.left - sb.left) <= 0.5,
      `band ${shutBand.width.toFixed(2)} px, handles ${Math.abs(sa.left - sb.left).toFixed(2)} px apart`);

    d.assert('a disabled range takes both its handles out of the tab order',
      rangeSpec.off.knobs.every((k) => !k.hasAttribute('tabindex'))
      && rangeSpec.off.lane.getAttribute('aria-disabled') === 'true',
      'neither handle is reachable and the lane says it is off');

    /**
     * 🔴 THE KEYBOARD, DRIVEN RATHER THAN READ. `verify.mjs` cannot drag a lane
     * and `slider.mjs` says so in its own header, so the arrow keys are the one
     * route a harness has into a control like this. The gap slider is used
     * because it is the one where the invariant has something to do: `End` on
     * its start handle lands 20 below the end rather than at 127.
     * ⚠️ AND IT PUTS THE VALUES BACK. A check does not get to leave a reader's
     * page in a state they did not ask for, and this block holds no `await`, so
     * no frame is rendered in the middle of it.
     */
    /*
     * 🔴 AND IT RUNS UNDER `?selfcheck=1` ONLY, FOUND 2026-10-04. This block sits
     * at the top level of the module with no gate, so the keys went out on every
     * visit, and with `bubbles: true` each one reached `transport-bar.mjs`'s
     * `window` listener, which moves every bar a key from outside a bar reaches.
     * `ArrowRight` is a 2 per cent seek, so a plain load showed every visible bar
     * at 0:01.200 rather than 0:00. The handle's listener is on the knob itself,
     * so the key does not need to bubble to be graded, and it no longer does.
     */
    if (SELFCHECK) {
      const was = rangeSpec.gap.get();
      const key = (node, k) => node.dispatchEvent(
        new KeyboardEvent('keydown', { key: k, bubbles: false, cancelable: true }));
      key(rangeSpec.gap.knobs[0], 'ArrowRight');
      const stepped = rangeSpec.gap.get().from;
      key(rangeSpec.gap.knobs[0], 'End');
      const ended = rangeSpec.gap.get();
      rangeSpec.gap.set(was.from, was.to, true);
      d.assert('an arrow moves one handle by a step and End takes it to its own limit, not the scale’s',
        stepped === was.from + 1 && ended.from === ended.to - 20 && ended.to === was.to
        && rangeSpec.gap.get().from === was.from,
        `${was.from} stepped to ${stepped}, End landed on ${ended.from} against an end at `
        + `${ended.to} with a gap of 20, and the pair is back at ${was.from} and ${was.to}`);
    }
  }

  /**
   * 🔴 THE TOGGLE ACTS OR IT IS NOT A CONTROL, SO NOTHING BELOW ASSERTS AN
   * OPTION THAT WAS PASSED IN. A real click goes down the same path a finger
   * takes, the counter behind all the specimens says whether the page was
   * told, and the disabled one is clicked on purpose to prove the counter can
   * refuse to move. That is what the SWITCH block asserted until 2026-09-23 and
   * it is what this one inherits; what left with the switch is the knob travel
   * and the two weights, because a button has neither.
   */
  if (toggleSpec) {
    const b = toggleSpec.lit.button;
    /* 🔴 `aria-pressed` IS THE STATE AND `get()` READS THE SAME ATTRIBUTE,
       which is the claim rather than a detail: a control whose picture and
       whose announcement come from two copies of one boolean will eventually
       disagree, and only one of the two is visible in a screenshot. */
    d.assert('a toggle is a real button that says whether it is pressed',
      b.tagName === 'BUTTON' && b.type === 'button'
      && b.getAttribute('aria-pressed') === 'true' && toggleSpec.lit.get() === true
      && toggleSpec.dark.getAttribute?.('aria-pressed') !== 'true'
      && toggleSpec.dark.button.getAttribute('aria-pressed') === 'false'
      && b.tabIndex >= 0,
      `${b.tagName} at tab index ${b.tabIndex}, pressed ${b.getAttribute('aria-pressed')} `
      + `against ${toggleSpec.dark.button.getAttribute('aria-pressed')} on the one that is up`);

    /* A press, down the path a finger takes, and the page put back afterwards. */
    const was = toggleSpec.dark.get();
    const saidWas = toggleSpec.presses.n;
    toggleSpec.dark.button.click();
    const now = toggleSpec.dark.get();
    const told = toggleSpec.presses.last, said = toggleSpec.presses.n;
    const marked = toggleSpec.dark.button.getAttribute('aria-pressed');
    toggleSpec.dark.set(was, true);
    d.assert('a press puts it down, tells the page, and says so to a reader who cannot see it',
      was === false && now === true && said === saidWas + 1 && told === 'click down'
      && marked === 'true' && toggleSpec.dark.get() === was
      && toggleSpec.dark.button.getAttribute('aria-pressed') === 'false',
      `it said "${told}" on press ${said}, marked itself ${marked}, and the check put it back`);

    /**
     * 🔴 THE TWO SIZES ARE A REAL DIFFERENCE AND THE SMALL ONE IS THE PAD'S
     * OWN HEIGHT. 34 px is every control on a page and 26 px is what
     * `shell.css` argues for under a keyboard, which is 34 minus one gap. A
     * check that only asked *is there a data-size attribute* would pass a
     * stylesheet that had stopped reading it.
     */
    const bigH = toggleSpec.lit.button.getBoundingClientRect().height;
    const smallH = toggleSpec.small.button.getBoundingClientRect().height;
    d.assert('the small toggle is the keyboard footer\'s own height and the big one is a control\'s',
      Math.abs(bigH - 34) < 0.6 && Math.abs(smallH - 26) < 0.6
      && toggleSpec.small.button.dataset.size === 'small'
      && !toggleSpec.lit.button.hasAttribute('data-size'),
      `${bigH.toFixed(1)} px big against ${smallH.toFixed(1)} px small`);

    /**
     * 🔴 THE SMALL BUTTON IS THE SMALL TOGGLE'S HEIGHT, READ OFF `--ctl-sm`
     * RATHER THAN TYPED HERE, AND ITS GLYPH FORM IS A SQUARE OF THE SAME.
     * `pos-sm`, 2026-09-26. Three rendered boxes and one token, compared, so
     * a toggle and a button that stopped agreeing would fail here rather than
     * drift. The negative half is the plain button beside them staying a
     * control's 34: a stylesheet that shrank every button would pass a check
     * that only measured the small ones. The primary keeps its ring, which is
     * a shadow and not a size, so it is read as present rather than measured.
     */
    {
      const ctlSm = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ctl-sm'));
      const hOf = (b) => b.getBoundingClientRect().height;
      const wOf = (b) => b.getBoundingClientRect().width;
      const ring = getComputedStyle(smallSpec.smallPri).boxShadow !== 'none';
      d.assert('a small button is the small toggle\'s own height, its glyph form is a square of it, and a plain button beside it stays a control\'s',
        ctlSm > 0 && Math.abs(hOf(smallSpec.small) - ctlSm) < 0.6 && Math.abs(hOf(smallSpec.smallPri) - ctlSm) < 0.6
          && Math.abs(hOf(smallSpec.smallGlyph) - ctlSm) < 0.6 && Math.abs(wOf(smallSpec.smallGlyph) - ctlSm) < 0.6
          && Math.abs(hOf(smallSpec.plain) - 34) < 0.6 && Math.abs(smallH - ctlSm) < 0.6 && ring,
        `${hOf(smallSpec.small).toFixed(1)} px small, ${wOf(smallSpec.smallGlyph).toFixed(1)} by `
        + `${hOf(smallSpec.smallGlyph).toFixed(1)} glyph, ${hOf(smallSpec.plain).toFixed(1)} plain, against --ctl-sm ${ctlSm} `
        + `and the small toggle's ${smallH.toFixed(1)}; the primary ${ring ? 'keeps' : 'lost'} its ring`);
    }

    /**
     * 🔴 ONE YELLOW, READ OFF THE STYLESHEET RATHER THAN TYPED HERE. `--hi`
     * means *the thing this control is about* on every page in this project, so
     * a pressed toggle is compared against the token itself: a colour typed
     * into a check is a second source that can disagree with the first.
     * ⚠️ AND THE NEGATIVE HALF IS THE ONE WORTH HAVING. A check that only asked
     * *is a pressed one tinted* would pass a stylesheet on which every toggle
     * is, which is the drift this grades.
     */
    {
      const asColour = (v) => {
        const probe = el('span');
        probe.style.color = v;
        document.body.append(probe);
        const c = getComputedStyle(probe).color;
        probe.remove();
        return c;
      };
      const hi = asColour(getComputedStyle(document.documentElement)
        .getPropertyValue('--hi').trim());
      const downEdge = getComputedStyle(toggleSpec.lit.button).borderColor;
      const upEdge = getComputedStyle(toggleSpec.dark.button).borderColor;
      const downBack = getComputedStyle(toggleSpec.lit.button).backgroundColor;
      const upBack = getComputedStyle(toggleSpec.dark.button).backgroundColor;
      d.assert('a pressed toggle takes the page’s own --hi and NEGATIVE CONTROL: an unpressed one does not',
        downEdge === hi && upEdge !== hi && downBack !== upBack,
        `pressed edge ${downEdge} against --hi ${hi}, unpressed edge ${upEdge}, `
        + `and two different grounds`);
    }

    /**
     * 🔴 A CONTROL THAT SAYS IT CANNOT BE PRESSED AND THEN ACTS IS THE LIE THIS
     * PROJECT HAS A NAME FOR, and the press is real rather than assumed. It is
     * wired to the same counter as the other four, so a press that got through
     * is an integer rather than something somebody has to notice in a
     * screenshot.
     */
    {
      const wasN = toggleSpec.presses.n, wasOn = toggleSpec.dim.get();
      toggleSpec.dim.button.click();
      const faded = getComputedStyle(toggleSpec.dim.button).opacity;
      d.assert('NEGATIVE CONTROL: a toggle nobody may press does not move and does not speak',
        toggleSpec.dim.button.disabled === true
        && toggleSpec.dim.get() === wasOn && toggleSpec.presses.n === wasN
        && Number(faded) < 1,
        `a real click left it ${toggleSpec.dim.get() ? 'down' : 'up'} with the counter still at `
        + `${toggleSpec.presses.n}, at opacity ${faded}`);
    }
  }

  /**
   * 🔴 THE CHECKBOX IS A REAL ONE, AND THE HALF THAT MATTERS IS THE HALF THAT
   * IS INVISIBLE. `check.mjs` clips the input to a pixel and draws the box
   * beside it, and the whole reason that is better than `display: none` is that
   * the input stays focusable. That claim cannot be seen and is free to read.
   */
  if (checkSpec) {
    const i = checkSpec.one.input;
    const box = i.nextElementSibling;
    const r = i.getBoundingClientRect();
    const cs = getComputedStyle(i);
    d.assert('the input is a real checkbox, clipped to a pixel and still focusable',
      i.tagName === 'INPUT' && i.type === 'checkbox'
      && cs.display !== 'none' && cs.visibility !== 'hidden'
      && r.width <= 2 && r.height <= 2
      && box.classList.contains('pos-check-b')
      && !i.hasAttribute('aria-pressed'),
      `${r.width.toFixed(0)} by ${r.height.toFixed(0)} px, display ${cs.display}, `
      + `and the drawn box is its next sibling`);

    /**
     * 🔴 THE THIRD STATE IS THE ONE A BUTTON WEARING `aria-pressed` CANNOT
     * DRAW, so it is the one worth grading. It is a property rather than an
     * attribute, which means nothing in the HTML says it is there and only a
     * check like this can see it.
     * ⚠️ AND A PRESS CLEARS IT, because a press has answered the question. The
     * click is put back on the next line and nothing is awaited in between.
     */
    const s = checkSpec.some;
    const mixedBefore = s.input.indeterminate;
    s.input.click();
    const afterClick = { mixed: s.input.indeterminate, on: s.input.checked };
    s.input.checked = false; s.mixed(true);
    d.assert('the half lit third state is real, and a press answers the question and clears it',
      mixedBefore === true && afterClick.mixed === false && afterClick.on === true
      && s.input.indeterminate === true,
      `it opened half lit, a press left it ${afterClick.on ? 'on' : 'off'} and no longer `
      + `half lit, and the check put it back`);

    /**
     * A set of boxes is a GROUP with its own name attached. Without that, five
     * boxes beside a word are five loose controls and a stray label.
     */
    const set = checkSpec.across.el.querySelector('[role="group"]');
    const named = document.getElementById(set.getAttribute('aria-labelledby'));
    d.assert('a set of boxes is announced by its own name rather than by a word beside it',
      !!set && !!named && named.textContent === 'sends',
      `role ${set.getAttribute('role')}, named "${named?.textContent}"`);

    /* Across and down, measured rather than read off a class name. */
    const rowTops = [...checkSpec.across.el.querySelectorAll('.pos-check')]
      .map((n) => +n.getBoundingClientRect().top.toFixed(1));
    const colTops = [...checkSpec.down.el.querySelectorAll('.pos-check')]
      .map((n) => +n.getBoundingClientRect().top.toFixed(1));
    d.assert('a row of boxes sits on one line and a column puts each on its own',
      new Set(rowTops).size === 1 && new Set(colTops).size === colTops.length
      && colTops.length === 4,
      `${rowTops.length} across on ${new Set(rowTops).size} line, `
      + `${colTops.length} down on ${new Set(colTops).size} lines`);
  }

  /**
   * 🔴 A STANDING CHOICE IS THE LYING ONE WITH THE JOIN AND THE CORNERS TURNED,
   * AND TURNING ONLY THE DIRECTION IS THE HALF FIX THAT LOOKS FINISHED.
   * `.pos-seg` overlaps its children on the LEFT and rounds the first child's
   * left corners, both of which are the wrong axis once the options are
   * stacked: a doubled border on every join, and two stray curves in the middle
   * of the column. Neither shows in a count of buttons.
   */
  if (standSpec) {
    const lay = [...standSpec.lying.el.querySelectorAll('button')];
    const std = [...standSpec.standing.el.querySelectorAll('button')];
    const layTops = new Set(lay.map((b) => +b.getBoundingClientRect().top.toFixed(1)));
    const stdTops = new Set(std.map((b) => +b.getBoundingClientRect().top.toFixed(1)));
    d.assert('the same four options lie on one line and stand on four',
      lay.length === 4 && std.length === 4 && layTops.size === 1 && stdTops.size === 4,
      `lying on ${layTops.size} line, standing on ${stdTops.size}`);

    const first = getComputedStyle(std[0]);
    const second = getComputedStyle(std[1]);
    const lastOne = getComputedStyle(std[3]);
    d.assert('the join and the corners turn with it, not just the direction',
      first.borderTopLeftRadius === '4px' && first.borderBottomLeftRadius === '0px'
      && lastOne.borderBottomLeftRadius === '4px' && lastOne.borderTopLeftRadius === '0px'
      && second.marginTop === '-1px' && second.marginLeft === '0px',
      `first corner ${first.borderTopLeftRadius} over ${first.borderBottomLeftRadius}, `
      + `last ${lastOne.borderTopLeftRadius} over ${lastOne.borderBottomLeftRadius}, `
      + `join ${second.marginTop} up and ${second.marginLeft} across`);

    d.assert('a question nobody has answered has nothing pressed',
      standSpec.empty.get() === -1
      && [...standSpec.empty.el.querySelectorAll('button')]
        .every((b) => b.getAttribute('aria-pressed') === 'false'),
      `at ${standSpec.empty.get()}, and no option is armed`);
  }

  /**
   * 🔴 A FADER IS THE SLIDER TURNED 90 DEGREES, AND THAT IS A MEASUREMENT.
   * Both read their look from `.sld-lane` and `.sld-knob` with the axes
   * swapped, so the two can only drift if nobody compares them. **Putting them
   * side by side on this page is half of it; this is the other half.**
   */
  if (vertSpec) {
    const hLane = document.querySelector('.sld-lane');
    const vLane = vertSpec[0].el.querySelector('.pos-fdr-lane');
    const vHand = vertSpec[0].el.querySelector('.pos-fdr-hand');
    if (hLane && vLane) {
      const hr = hLane.getBoundingClientRect(), vr = vLane.getBoundingClientRect();
      const hcs = getComputedStyle(hLane), vcs = getComputedStyle(vLane);
      d.assert('a fader is the slider turned 90 degrees: the same track, across instead of along',
        Math.abs(hr.height - vr.width) <= 1
        && hcs.backgroundColor === vcs.backgroundColor
        && hcs.borderTopWidth === '0px' && vcs.borderTopWidth === '0px',
        `slider ${hr.height.toFixed(1)} px tall, fader ${vr.width.toFixed(1)} px wide, `
        + `both ${vcs.backgroundColor} with no border`);
    }
    if (vHand) {
      const hcs = getComputedStyle(vHand);
      d.assert('and its hand button is a segment of the lane, rounded only on the outside',
        hcs.borderTopLeftRadius === '0px' && hcs.borderBottomLeftRadius === '4px',
        `corners ${hcs.borderTopLeftRadius} top, ${hcs.borderBottomLeftRadius} bottom`);
    }
  }

  // every block built. A component that throws takes the page with it when
  // the error escapes, which turns one broken control into a blank page.
  /**
   * 🔴 THE DROP TARGET, AND THE FIRST TWO OF THESE ARE ABOUT A COVER NOBODY
   * SHOULD EVER BE TRAPPED UNDER. `/weight/` and `/floor/` both shipped a
   * `position: fixed; inset: 0` cover that sat over the row holding the button
   * that got you out, so this one has two independent guards and both are
   * measured: it is in the document only while a drag is in flight, and it is
   * `pointer-events: none` for its whole life. Either one alone would be enough
   * and neither one alone is checked.
   *
   * ⚠️ THE MEASUREMENT APPENDS THE COVER AND TAKES IT AWAY WITHOUT AWAITING,
   * which is the same argument the panel block's window makes: JavaScript here
   * is single threaded, no frame can be rendered between these statements, and
   * so a person reading this page never sees it. An `await` anywhere in this
   * block would break that and would be a check that mutates the page in front
   * of a reader, which is what `/tapes/`'s zoom check was doing.
   */
  {
    const tallWas = document.documentElement.scrollHeight;
    document.body.append(kitDrop.cover);
    const pe = getComputedStyle(kitDrop.cover).pointerEvents;
    const box = kitDrop.cover.getBoundingClientRect();
    kitDropTall = document.documentElement.scrollHeight;
    kitDrop.cover.remove();
    // 🔴 THE AREA IS ON SCREEN BEFORE ANYBODY DRAGS ANYTHING, which is the whole
    // repair and is exactly what the first version could not have passed.
    const areaBox = kitDrop.el.getBoundingClientRect();
    d.assert('the way in is on screen before any drag, with words saying what it takes',
      areaBox.width > 100 && areaBox.height > 40
      && kitDrop.el.classList.contains('pos-drop-area')
      && /\.circuitpack/.test(kitDrop.el.textContent) && !kitDrop.el.dataset.over,
      `${areaBox.width.toFixed(0)} by ${areaBox.height.toFixed(0)} px, saying `
      + `"${kitDrop.el.querySelector('.pos-drop-hint')?.textContent}"`);
    d.assert('a visit opens nothing, and the cover is not in the page until something is dragged over it',
      kitDrop.opens === 0 && !kitDrop.cover.isConnected,
      `${kitDrop.opens} files opened and the cover is ${kitDrop.cover.isConnected ? 'in' : 'out of'} the document`);
    d.assert('the cover cannot be pressed and cannot move anything, even while it is up',
      pe === 'none' && kitDropTall === tallWas && box.width > 0 && box.height > 0,
      `pointer-events ${pe} · the page is ${kitDropTall} px tall with it up and ${tallWas} px without `
      + `· the cover itself is ${box.width.toFixed(0)} by ${box.height.toFixed(0)}`);
  }

  /**
   * 🔴 THE REFUSAL, AND IT IS BEHIND THE GATE BECAUSE IT PRESSES A CONTROL.
   * A drop target that took everything would pass every check that counts what
   * it opened, which is the shape this project measured four times: `/tapes/`,
   * `/now/` and `/flipper/` were all fully green against stand-ins whose
   * refusals had been switched off. So the JPEG is dropped on purpose, down the
   * same code path a real drag takes, and the words it produces are asserted
   * rather than the counter alone: a refusal that increments a number and says
   * nothing to the reader is the failure this is guarding against.
   */
  if (SELFCHECK) {
    // 🔴 THE WINDOW IS SHUT ACROSS THE WAIT AND OPENED AGAIN AFTER, WHICH IS
    // THE RULE THIS PAGE ALREADY WROTE DOWN AND WHICH I BROKE ON THE FIRST RUN.
    // Reading a file is a promise, so an `await` here sits inside the measuring
    // window, a `requestAnimationFrame` callback finds it open, and a frame is
    // drawn with all parts laid out at once. It went red immediately and
    // named the count, which is what that counter is for: no reading of the
    // source can see an await, and three other places on this page do exactly
    // this dance for the same reason.
    const openedWas = kitDrop.opens, refusedWas = kitDrop.refused;
    await kitDrop.open([new File([new Uint8Array([0xff, 0xd8, 0xff, 0xe0])], 'photo.jpg')]);
    const said = kitDropLine.textContent;
    d.assert('a file it does not take is refused in words that name it, and it opens nothing',
      kitDrop.refused === refusedWas + 1 && kitDrop.opens === openedWas
      && said.includes('photo.jpg') && /not \.circuitpack/.test(said),
      `refused ${refusedWas} then ${kitDrop.refused}, opened ${openedWas} then ${kitDrop.opens} · it said "${said}"`);

    // ⚠️ THE NEGATIVE CONTROL. A target that refused EVERYTHING would pass the
    // assert above perfectly, so one file it does take goes down the same path.
    const before = kitDrop.opens;
    await kitDrop.open([new File([new Uint8Array([0xf0, 0x00, 0x20, 0x29])], 'one.syx')]);
    d.assert('NEGATIVE CONTROL: a file it does take is opened rather than refused, down the same path',
      kitDrop.opens === before + 1 && kitDrop.refused === refusedWas + 1
      && kitDropLine.textContent.includes('one.syx'),
      `opened ${before} then ${kitDrop.opens} · "${kitDropLine.textContent}"`);
  }

  // 🔴 THE GROUP'S BUTTONS ARE WHERE THE HARNESSES LOOK, AND THAT IS THE ONE
  // THING A ROW COMPONENT CAN QUIETLY BREAK. `verify.mjs` and `verify-gl.mjs`
  // both press `.pos-controls button`, so a group that wraps its buttons in a
  // row of its own is one refactor away from taking them out of that selector
  // and out of the suite. `/mirror/` has already paid for this once: a stepper
  // moved into the knob row and the press count went 9 to 7 while the page read
  // green. Graded with the harnesses' OWN selector string, against a specimen
  // mounted the way a page mounts one.
  // ⚠️ PROVED BY BREAKING IT, 2026-09-19: the same specimen in a `.kit-row`
  // instead reads `0 of 3` and takes this red. The pressable count beside it is
  // 4 as of 2026-09-20, down from 6 when the headset pair went off screen, and
  // it is a fact about how many blocks currently mount a control row rather
  // than a number this check is graded against.
  const PRESSED = '.pos-controls button';
  const inRow = [...document.querySelectorAll(PRESSED)];
  const groupBtns = bgSpec ? bgSpec.buttons : [];
  d.assert('every button in a group is found by the selector both harnesses press',
    groupBtns.length === 3 && groupBtns.every((b) => inRow.includes(b)),
    `${groupBtns.filter((b) => inRow.includes(b)).length} of ${groupBtns.length} under ${PRESSED}, `
    + `${inRow.length} pressable on this page`);

  // 🔴 THE GROUP IS ONE OBJECT, AND IT SHIPPED AS THREE. Reported 2026-09-19
  // with a screenshot of `/mirror/`: *"i do not see buttongroup vr xr"*. The
  // row had `gap: 8px`, which is what two unrelated controls look like. The
  // join is `.pos-seg`'s `margin-left: -1px`, so what a reader sees is one
  // line where two buttons meet rather than two edges with a gap: measured as
  // the distance between the first button's right edge and the second's left,
  // which is -1 when they are joined and +8 when they are not.
  // ⚠️ AND THE CORNERS, because a join that overlaps borders while both
  // buttons keep four round corners reads as a mistake rather than as a seam.
  // Only the outer two are round.
  if (bgSpec) {
    const bs = bgSpec.buttons.map((b) => b.getBoundingClientRect());
    const joins = bs.slice(1).map((r, i) => +(r.left - bs[i].right).toFixed(2));
    const cs = bgSpec.buttons.map((b) => getComputedStyle(b));
    const inner = cs[1].borderTopLeftRadius;
    d.assert('a group is one object: its buttons share a border and only the outer corners are round',
      joins.every((j) => Math.abs(j + 1) < 0.02)
      && cs[0].borderTopLeftRadius !== '0px' && cs[cs.length - 1].borderTopRightRadius !== '0px'
      && inner === '0px' && cs[1].borderTopRightRadius === '0px',
      `${joins.length} join(s) at ${joins.join(', ')} px, ends rounded ${cs[0].borderTopLeftRadius}`
      + ` and ${cs[cs.length - 1].borderTopRightRadius}, the middle one ${inner}`);
  }

  // 🔴 AND IT IS STILL NOT A CHOICE, WHICH IS THE HALF THE JOIN CANNOT CARRY.
  // A segmented row with nothing armed is a legal choice state: `/stage/` ships
  // one, with `at: -1`, because a question that arrives already answered is a
  // question nobody was asked. So the difference has to live somewhere else and
  // it lives in two places a reader can see. `aria-pressed` is the channel a
  // choice arms, for a screen reader and for the `--hi` tint keyed on it, and a
  // group never writes it. And a group's buttons are FULL SIZE, because they
  // are things you press, where a choice's options are small because they are
  // values being compared.
  // ⚠️ MEASURED AS INK, NOT READ OFF THE STYLESHEET. A rule that is present and
  // inert reads exactly like one that works, which is this page's own lesson.
  if (bgSpec && choiceSpec) {
    const armed = bgSpec.buttons.filter((b) => b.hasAttribute('aria-pressed'));
    const gSize = parseFloat(getComputedStyle(bgSpec.buttons[0]).fontSize);
    const cSize = parseFloat(getComputedStyle(choiceSpec.buttons[0]).fontSize);
    d.assert('a joined group still cannot read as a choice: nothing is armed and the buttons are full size',
      armed.length === 0 && gSize > cSize,
      `${armed.length} of ${bgSpec.buttons.length} carry aria-pressed, and a group button is`
      + ` ${gSize} px against a choice option's ${cSize} px`);
  }

  // 🔴 SWITCHING A BUTTON OFF MOVES NOTHING. The answer that switches these off
  // arrives late by construction, because asking a browser about a headset is a
  // promise, so a disabled look that changed the box would reflow the control
  // row under a pointer already on its way to it. `button[disabled]` is opacity
  // and a cursor, and this measures that it stayed that way.
  if (bgSpec) {
    const b = bgSpec.button('clear');
    const on = b.getBoundingClientRect();
    bgSpec.enable('clear', false, 'The log on this page is already empty.');
    const off = b.getBoundingClientRect();
    const said = b.title;
    bgSpec.enable('clear', true);
    d.assert('a button switched off is the same size as it was on, and it says why',
      Math.abs(on.width - off.width) < 0.01 && Math.abs(on.height - off.height) < 0.01
      && said.length > 0 && b.title === '',
      `${on.width.toFixed(1)} by ${on.height.toFixed(1)} on, ${off.width.toFixed(1)} by ${off.height.toFixed(1)} off · `
      + `"${said}" · nothing left over when it came back`);
  }

  // NEGATIVE CONTROL: the reason is not optional. A grey control with no
  // explanation reads as a broken page rather than as a browser that cannot do
  // the thing, so the group refuses it the way `mount()` refuses an odd readout.
  if (bgSpec) {
    let refused = '';
    try { bgSpec.enable('save', false); }
    catch (e) { refused = e.message; }
    d.assert('NEGATIVE CONTROL: a button disabled with no reason is refused rather than drawn',
      refused.length > 0 && bgSpec.enabled('save'),
      refused || 'it was accepted, and the button is off with nothing to show for it');
  }

  // 🔴 THE IPHONE CASE, WHICH IS THE ONE THAT WAS BROKEN. Every XR page wrote
  // `navigator.xr?.isSessionSupported(...).then(...)`, and on a browser with no
  // `navigator.xr` the optional chain returns undefined, so neither handler runs
  // and the variable stays null for ever. `/held/` then reported that to a
  // visitor holding a phone as a check that had FAILED. `createXrProbe` takes
  // the system object rather than reading `navigator`, so the case that cannot
  // be reproduced in this browser can be built in one line.
  // ⚠️ THREE PROBES, NOT ONE. A module that answered `absent` about everything
  // would pass the first of these on its own, which is the whole reason the
  // other two are here.
  {
    // ⚠️ THE SECOND OF THE TWO WAITS, AND THIS ONE MEASURES NO GEOMETRY AT ALL,
    // so the window simply shuts across it. Three promises resolving is three
    // frames a browser could render with every part open. See `measure()`.
    const nothing = createXrProbe(undefined).caps();
    const says = await createXrProbe({ isSessionSupported: async () => true }).when(1000);
    const refuses = await createXrProbe({ isSessionSupported: () => Promise.reject(new Error('no')) }).when(1000);
    d.assert('a browser with nothing to ask is answered at once, and three browsers get three answers',
      nothing.vr === 'absent' && nothing.ar === 'absent' && answered(nothing.vr)
      && says.vr === 'yes' && says.ar === 'yes'
      && refuses.vr === 'no' && refuses.ar === 'no',
      `no headset support: ${nothing.vr} · a browser that says yes: ${says.vr} · `
      + `one that refuses to answer: ${refuses.vr}`);
  }

  // Every answer that switches a control off has a sentence a visitor can read,
  // and the answer that switches nothing off has nothing to say. A disabled
  // button with no reason is worse than an enabled one; a tooltip on a working
  // control restating its own label is furniture.
  {
    const wrong = [];
    let sentences = 0;
    for (const mode of ['vr', 'ar']) {
      for (const st of XR_STATES) {
        const says = reasonFor(st, mode);
        if (says) sentences++;
        if (!canEnter(st) && !says) wrong.push(`${mode} ${st} says nothing`);
        if (st === 'yes' && says) wrong.push(`${mode} yes carries a tooltip it does not need`);
        // The rules every visitor-facing sentence here obeys: no file path, no
        // warning sign, and no dash bolting a second clause on.
        if (says && (says.includes('/') || /[—⚠\u{1f534}]/u.test(says))) {
          wrong.push(`${mode} ${st} is not plain words`);
        }
      }
    }
    d.assert('every answer that switches a headset button off says why, in plain words',
      wrong.length === 0,
      wrong.length ? wrong.join(' · ')
        : `${XR_STATES.length} answers over 2 modes, ${sentences} sentences, and nothing said when it works`);
  }

  // The pair this page builds is wired the way the four pages wire theirs, so
  // the wiring is graded once here rather than four times over there. Whatever
  // this browser answers, the control agrees with it.
  // ⚠️ THE GROUP IS OFF SCREEN SINCE 2026-09-20, when the specimen was asked
  // for removal. It is the same object wired the same way; what went is the row
  // a visitor could see, and this check is why the group itself did not go with
  // it.
  // ⚠️ PROVED BY BREAKING IT, 2026-09-19: with the two `enable` calls taken out
  // of the subscription this reads `vr no, pressable` and goes red, which is
  // the `/held/` defect exactly. A page that forgets to wire it is the failure
  // this catches, because nothing else can see a call that is not there.
  if (xrSpec) {
    const c = xrCaps();
    d.assert('a headset button is pressable exactly when this browser says it can be',
      xrSpec.enabled('vr') === canEnter(c.vr) && xrSpec.enabled('ar') === canEnter(c.ar),
      `vr ${c.vr}, ${xrSpec.enabled('vr') ? 'pressable' : 'off'} · `
      + `ar ${c.ar}, ${xrSpec.enabled('ar') ? 'pressable' : 'off'}`);
  }

  // 🔴 THE LEFT EDGES. Reported THREE TIMES on a real page and the third
  // report was a different bug wearing the first one's clothes: a component
  // swap moved the class a rule was keyed on, the sharing call went on setting
  // a custom property nothing consumed, and the row snapped back to the width
  // of one word while the code and the comment beside it both read as correct.
  // Measured ink, not arithmetic about ink.
  //
  // ⚠️ A PAIRED GROUP IS TWO COLUMNS ON PURPOSE, so "one left edge" is the
  // wrong claim about it and grading it that way reported 355 px apart about a
  // layout doing exactly what it was asked. It gets the claim that IS true of
  // it: two columns, and every label in a column on one edge. First written the
  // other way, which is how the difference got noticed.
  const leftsIn = (g) => [...g.querySelectorAll('.sld-l')]
    .map((n) => Math.round(n.getBoundingClientRect().left));
  const spreadOf = (xs) => (xs.length > 1 ? Math.max(...xs) - Math.min(...xs) : 0);

  const stackedGroups = [...document.querySelectorAll('.kit-box .sld-group:not(.pos-pair)')];
  let stackedWorst = 0, stackedLabels = 0;
  for (const g of stackedGroups) {
    const xs = leftsIn(g);
    stackedLabels += xs.length;
    stackedWorst = Math.max(stackedWorst, spreadOf(xs));
  }
  d.assert('sliders stacked in one group start their labels at the same left edge',
    stackedLabels > 1 && stackedWorst <= 1,
    stackedLabels > 1
      ? `${stackedLabels} labels in ${stackedGroups.length} group(s), worst ${stackedWorst} px apart`
      : 'no stacked slider labels were found, so nothing was compared');

  const pairGroups = [...document.querySelectorAll('.kit-box .sld-group.pos-pair')];
  let pairCols = 0, pairWorst = 0;
  for (const g of pairGroups) {
    const xs = leftsIn(g);
    const cols = new Map();
    for (const x of xs) {
      const key = [...cols.keys()].find((k) => Math.abs(k - x) <= 1);
      (cols.get(key ?? x) ?? cols.set(x, []).get(x)).push(x);
    }
    pairCols = Math.max(pairCols, cols.size);
    for (const col of cols.values()) pairWorst = Math.max(pairWorst, spreadOf(col));
  }
  d.assert('and a two-across group keeps exactly two of them, one per column',
    pairGroups.length > 0 && pairCols === 2 && pairWorst <= 1,
    pairGroups.length
      ? `${pairGroups.length} paired group(s), ${pairCols} column(s), worst ${pairWorst} px within one`
      : 'no paired group was found, so nothing was compared');

  // 2b. 🔴 THE INVISIBLE HAND'S BUTTON, MEASURED RATHER THAN LOOKED AT, AND
  // NOTHING HERE PRESSES IT. A visit to this page must assert a strict subset:
  // everything gradable from what is already on the screen runs, and anything
  // that would start a movement does not. The plumbing claims are graded on
  // `/knobs/` behind `?selfcheck=1`, which is the page that has two sliders and
  // a real send gate to compare them with.
  {
    const row = handSpec?.withHand.el.querySelector('.sld-hand-row');
    const btn = row?.querySelector('.sld-hand');
    const laneR = row?.querySelector('.sld-lane')?.getBoundingClientRect();
    const btnR = btn?.getBoundingClientRect();
    const seam = laneR && btnR ? Math.round(btnR.x - (laneR.x + laneR.width)) : NaN;
    const cs = btn ? getComputedStyle(btn) : null;
    const laneCs = row ? getComputedStyle(row.querySelector('.sld-lane')) : null;
    d.assert('a hand button is joined to its lane, one pixel over, with the corners rounded only outside',
      !!row && row.classList.contains('pos-seg') && seam === -1
      && cs.borderTopRightRadius === '4px' && cs.borderTopLeftRadius === '0px'
      && laneCs.borderTopRightRadius === '0px' && laneCs.borderTopLeftRadius === '4px'
      && Math.round(btnR.height) === Math.round(laneR.height),
      row ? `seam ${seam} px, lane corners ${laneCs.borderTopLeftRadius}/${laneCs.borderTopRightRadius}, `
        + `button ${cs.borderTopLeftRadius}/${cs.borderTopRightRadius}, both ${Math.round(btnR.height)} px high`
        : 'no hand row was built');
    // 🔴 AND THE WRAPPER IS CONDITIONAL, WHICH IS A REAL CASUALTY AND NOT A
    // PREFERENCE. `/grains/` selects `.fade > .sld > .sld-lane` with a CHILD
    // combinator, so an unconditional row would stop that matching in silence
    // and take the lane back to its standalone 96 px.
    // ⚠️ AND NO HAND BUTTON MAY SIT IN A CONTROL ROW: `verify.mjs` presses
    // `.pos-controls button` on every demo on every run.
    d.assert('a slider with no hand has no wrapper, and no hand button sits in a control row',
      !!handSpec && !handSpec.without.el.querySelector('.sld-hand-row')
      && handSpec.without.el.firstElementChild?.nextElementSibling?.classList.contains('sld-lane')
      && !document.querySelector('.pos-controls .sld-hand')
      && handSpec.without.hand === null && handSpec.withHand.hand !== null,
      handSpec
        ? `the plain slider's second child is its own ${handSpec.without.el.children[1]?.className}, `
          + `and ${document.querySelectorAll('.pos-controls .sld-hand').length} hand buttons are in a control row`
        : 'the block did not build');
  }
  {
    /**
     * 🔴 THE STEPPER'S MIDDLE IS REALLY A LIST, not a label that looks like one.
     * A cell that draws the right name with an empty or disabled select behind
     * it is the exact failure `picker.mjs` records on `/mirror/`: the control
     * looked correct and could not be used. So this asserts the working half.
     */
    const sel = stepperPick?.select;
    d.assert('the stepper\u2019s middle really opens a list, and the arrows still step it',
      !!sel && sel.options.length === 4 && !sel.disabled
      && stepperPick.el.querySelectorAll('button').length === 2,
      sel ? `${sel.options.length} options, ${sel.disabled ? 'disabled' : 'usable'}, `
        + `${stepperPick.el.querySelectorAll('button').length} arrows, showing "${stepperPick.el.querySelector('.pos-pick-n').textContent}"`
        : 'the stepper has no select at all');
  }


  // 🔴 THE KEYBOARD UNDER A FINGER, WHICH IS THE ONE THING ABOUT IT THIS
  // MACHINE CANNOT SIT DOWN AT.
  //
  // ⚠️ EVERY CHECK BELOW IS BEHIND `?selfcheck=1`, because every one of them
  // builds a keyboard over the page and presses its keys. A visitor gets none
  // of it, which is the standing rule and not a judgement about how cheap this
  // particular block is.
  //
  // ⚠️ AND THEY BUILD THEIR OWN KEYBOARDS RATHER THAN DRIVING THE SPECIMEN.
  // The specimen sits in a box that is ~656 px wide on a laptop and 328 px on a
  // phone, and the phone layout is the thing to grade. A throwaway one in a
  // holder of a stated width asks the question directly.
  // ⚠️ THE FLAG IS `shell/selfcheck.mjs`'s NOW, read the same way on every page
  // rather than re-derived here. Same value, same moment, one place to grep.
  if (SELFCHECK) {
    // ⚠️ THE MEASURING WINDOW STAYS OPEN ACROSS THIS BLOCK AND THE WATCHDOG
    // STANDS DOWN FOR IT. Everything in here waits — for a fade, for a
    // keyboard's verdict, for a cover to come up — so frames WILL be rendered
    // with every part laid out, and none of them is rendered for a visitor,
    // because a visitor never enters this block at all. The counter comes back
    // on at the end so it still covers the run to `ready()`.
    const { createKeyboard, KEY_MIN_PX, BLACK_RATIO, SWIPE_PX } = await import('/shell/keyboard.mjs');
    const frames = (n) => new Promise((r) => {
      const step = () => (--n <= 0 ? r() : requestAnimationFrame(step));
      requestAnimationFrame(step);
    });
    const probes = [];
    // On top of the page and out of the flow: it must be hit-testable, since
    // `document.elementFromPoint` is what decides which key a finger is on, and
    // a holder below the fold has no points to test.
    // 🔴 AND THEY MUST NOT OVERLAP EACH OTHER. The first version stacked them
    // all at `top: 0`, so the LAST one built was the one under every point and
    // three checks measured "no note was produced at all" about keyboards that
    // were working, with the width asserts passing either way because those
    // read geometry rather than hit-test it. `top` is an argument.
    const build = (width, top, opts = {}) => {
      const holder = el('div', '', null);
      holder.style.cssText = `position:fixed;top:${top}px;left:0;z-index:9999;width:${width}px;background:var(--bg)`;
      document.body.append(holder);
      const log = [];
      const kb = createKeyboard(holder, {
        base: 60, ...opts,
        onDown: (n) => { kb.lightNote(n, true); log.push(`on${n}`); },
        onUp: (n) => { kb.lightNote(n, false); log.push(`off${n}`); },
      });
      probes.push({ kb, holder, log });
      return { kb, holder, log };
    };
    const keyEls = (kb) => [...kb.keysEl.querySelectorAll('.k')];
    const whitesOf = (kb) => keyEls(kb).filter((k) => !k.classList.contains('sharp'));
    const blacksOf = (kb) => keyEls(kb).filter((k) => k.classList.contains('sharp'));
    // ⚠️ LOW ON THE KEY, CLEAR OF THE BLACKS. A point at a white key's centre is
    // inside a raised black one near the top; every gesture below aims at the
    // bottom third, which is white and nothing else.
    const lowOn = (e) => { const r = e.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.bottom - 12 }; };
    const touch = (kb, type, p, id = 3, kind = 'touch') => kb.keysEl.dispatchEvent(new PointerEvent(type, {
      bubbles: true, pointerId: id, pointerType: kind, clientX: p.x, clientY: p.y, isPrimary: true }));

    const phone = build(390, 0);
    const desk = build(1100, 130);

    // ── the width, and the negative control that proves it is a FLOOR ───────
    // MEASURED before any of this: 24.77 px a key at 390 CSS px, then 74, now
