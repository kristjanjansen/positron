<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON kit/frontpage</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/kit-page.css">
<style>
  /* 🔴 EVERY FACE HERE IS SELF HOSTED, AND A VISIT ASKS NOBODY ELSE FOR ONE.
     The six candidates are under /shell/vendor/ (workers/view/build.mjs lists
     them, with source and licence); the archive's monospaced faces and
     Gabarito are read from where their own pages already serve them, so what
     is shown is the file those pages ship rather than a copy of it. The
     brand mono and the accidentals are declared in shell.css already. */

  /* the six candidates: @fontsource 5.3.x, Latin subset, SIL OFL 1.1 */
  @font-face { font-family: 'FP Geist'; font-weight: 400; font-display: swap; src: url('/shell/vendor/geist-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'FP Geist'; font-weight: 600; font-display: swap; src: url('/shell/vendor/geist-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'FP Manrope'; font-weight: 400; font-display: swap; src: url('/shell/vendor/manrope-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'FP Manrope'; font-weight: 600; font-display: swap; src: url('/shell/vendor/manrope-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'FP IBM Plex Sans'; font-weight: 400; font-display: swap; src: url('/shell/vendor/ibm-plex-sans-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'FP IBM Plex Sans'; font-weight: 600; font-display: swap; src: url('/shell/vendor/ibm-plex-sans-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'FP Schibsted Grotesk'; font-weight: 400; font-display: swap; src: url('/shell/vendor/schibsted-grotesk-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'FP Schibsted Grotesk'; font-weight: 600; font-display: swap; src: url('/shell/vendor/schibsted-grotesk-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'FP Onest'; font-weight: 400; font-display: swap; src: url('/shell/vendor/onest-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'FP Onest'; font-weight: 600; font-display: swap; src: url('/shell/vendor/onest-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'FP Space Grotesk'; font-weight: 400; font-display: swap; src: url('/shell/vendor/space-grotesk-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'FP Space Grotesk'; font-weight: 600; font-display: swap; src: url('/shell/vendor/space-grotesk-latin-600-normal.woff2') format('woff2'); }

  /* the faces in use elsewhere, read from their own pages' folders */
  @font-face { font-family: 'FP Gabarito'; font-weight: 200 800; font-display: swap; src: url('/weight/vendor/gabarito-latin.woff2') format('woff2'); }
  @font-face { font-family: 'FP Atkinson Hyperlegible Mono'; font-weight: 400; font-display: swap; src: url('/slides/vendor/atkinson-hyperlegible-mono-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'FP Atkinson Hyperlegible Mono'; font-weight: 600; font-display: swap; src: url('/slides/vendor/atkinson-hyperlegible-mono-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'FP Fira Code'; font-weight: 400; font-display: swap; src: url('/slides/vendor/fira-code-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'FP Fira Code'; font-weight: 600; font-display: swap; src: url('/slides/vendor/fira-code-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'FP Geist Mono'; font-weight: 400; font-display: swap; src: url('/slides/vendor/geist-mono-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'FP Geist Mono'; font-weight: 600; font-display: swap; src: url('/slides/vendor/geist-mono-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'FP IBM Plex Mono'; font-weight: 400; font-display: swap; src: url('/slides/vendor/ibm-plex-mono-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'FP IBM Plex Mono'; font-weight: 600; font-display: swap; src: url('/slides/vendor/ibm-plex-mono-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'FP Intel One Mono'; font-weight: 400; font-display: swap; src: url('/slides/vendor/intel-one-mono-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'FP Intel One Mono'; font-weight: 600; font-display: swap; src: url('/slides/vendor/intel-one-mono-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'FP Source Code Pro'; font-weight: 400; font-display: swap; src: url('/slides/vendor/source-code-pro-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'FP Source Code Pro'; font-weight: 600; font-display: swap; src: url('/slides/vendor/source-code-pro-latin-600-normal.woff2') format('woff2'); }

  /* A list of faces: the gap between two faces is two steps above the gap
     inside one, so a face's name, its facts and its specimens read as one
     group (positron-compose, section 1). */
  .fp-faces { display: flex; flex-direction: column; gap: var(--pos-gap); }
  .fp-face { display: flex; flex-direction: column; gap: calc(2 * var(--ctl-gap)); min-width: 0; }
  .fp-name { font: 600 15px/1.2 var(--brand); color: var(--fg); margin: 0; }
  .fp-where { font: 400 13.5px/1.5 var(--brand); color: var(--dim); margin: 0; max-width: 66ch; }

  /* the facts about a face are cells, not one string with glue in it */
  .fp-facts { display: flex; flex-wrap: wrap; gap: var(--ctl-gap) 24px; margin: 0; }
  .fp-fact { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .fp-k { font: 500 9.5px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim2); }
  .fp-v { font: 500 13px/1.3 var(--mono); color: var(--fg); font-variant-numeric: tabular-nums; }
  .fp-v[data-state="bad"] { color: var(--bad); }

  /* SAMPLER: one line per size, the size in a column of its own so every
     line starts on one x. The line wraps rather than scrolling or cutting:
     a 64 px line on a phone is two lines, which is what it would be anywhere. */
  .fp-rows { display: flex; flex-direction: column; gap: var(--ctl-gap); }
  .fp-row { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 12px; align-items: baseline; }
  .fp-sz { font: 400 11px/1.4 var(--mono); color: var(--dim2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fp-txt { color: var(--fg); overflow-wrap: anywhere; margin: 0; }

  /* MATCHING SANS: two columns on a desk, one on a phone, asking the block's
     own width through the grid floor rather than the window's. */
  .fp-pair { display: grid; gap: calc(2 * var(--ctl-gap)); grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
  .fp-spec { display: flex; flex-direction: column; gap: var(--ctl-gap); min-width: 0; }
  .fp-cap { font: 500 9.5px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim2); margin: 0; }
  .fp-para { font-size: 15px; line-height: 1.55; color: var(--fg); margin: 0; }
  .fp-para.fp-m { font-family: var(--brand); }
  .fp-para.fp-s { font-family: var(--sans); }
  .fp-title { font: 600 17px/1.2 var(--brand); color: var(--fg); margin: 0; }
  .fp-body { font: 400 15px/1.55 var(--sans); color: var(--dim); margin: 0; }
  .fp-rec { font: 400 15px/1.6 var(--brand); color: var(--fg); margin: 0; max-width: 66ch; }
  .fp-rec b { color: var(--hi); font-weight: 600; }
</style>
<script type="module">
  import { el, createReport } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createKitPage } from '/shell/kit-page.mjs';
  import { createCard } from '/shell/card.mjs';
  import { createTable } from '/shell/table.mjs';
  import { SCALE, stepOf } from '/shell/slide.mjs';

  /**
   * kit/frontpage, THE TYPE THE FRONT PAGE WILL BE SET IN, 2026-10-12. Asked:
   * *"add new kit card / page. name it fronpage. lets work on it. first do
   * typograpy sampler: all fonts we use at the momet in diffeetn sizes. we need
   * sans serif to match our brand mono. bring in something matchin it, not just
   * Inter"*, and the name confirmed as *"frontpage"*.
   * ⚠️ A SAMPLER, NOT A CHANGE. `--sans` in shell.css is untouched; the
   * candidates reach only this page, each scoped by setting `--sans` on its own
   * specimen, which is how a card here is drawn in the face without the card
   * knowing.
   * ⚠️ THE NUMBERS ARE MEASURED IN THIS BROWSER, on a canvas, after each face
   * has loaded: the top of an `x` and of an `H` at 100 px, and the width of
   * one sentence divided by its length. The OS/2 table values the face files
   * declare are written below as `TABLE` and the self-check requires the two to
   * agree, so a face that silently fell back cannot report a fallback's numbers.
   * ⚠️ A VISIT OPENS NOTHING ELSEWHERE. Every check is behind `?selfcheck=1`.
   */
  const { d, section, out, land, checkPage } = createKitPage({
    part: 'frontpage',
    what: 'The faces this site is set in today, and six sans faces measured against the brand mono for the front page.',
  });

  const SENTENCE = 'A Raspberry Pi in another building plays the same bar as this page, and the readout says how late it was: 1374 ms on a bad day, 38 on a good one.';
  const HEADING = 'Two rooms, one clock';
  const CHARS = '0123456789 il1I O0o {}[] AaGgQqRy';

  /* ── the brand, the reference every candidate is measured against ── */
  const BRAND = "'Brand JetBrains Mono'";

  /* 🔴 THE SIX CANDIDATES, AND WHY EACH IS HERE. Chosen against JetBrains Mono's
     three traits: a tall x-height (0.55 em, x over cap 0.75), rounds that lean
     rectangular, and open apertures. Measured and NOT shipped: Hanken Grotesk
     (x/cap 0.707), Instrument Sans (0.708), Albert Sans (0.714), all a step
     shorter in the lower case. JetBrains Sans is not here because it is not
     openly licensed: JetBrains serves it from its own domains only
     (youtrack.jetbrains.com WRS-2431). Inter is not here by request.
     `table` is the face file's own OS/2 numbers, read with a WOFF parser on
     2026-10-12; `bytes` is 400 plus 600 off `ls -l`. */
  const CANDIDATES = [
    { id: 'geist', name: 'Geist', family: "'FP Geist'", pkg: '@fontsource/geist 5.3.0',
      src: 'github.com/vercel/geist-font', table: { x: 0.530, cap: 0.710 }, bytes: [12956, 13372],
      why: 'Drawn as the sans to Geist Mono, so its proportions were set beside a mono from the start, and its rounds are slightly squared.' },
    { id: 'manrope', name: 'Manrope', family: "'FP Manrope'", pkg: '@fontsource/manrope 5.3.0',
      src: 'github.com/sharanda/manrope', table: { x: 0.540, cap: 0.720 }, bytes: [14108, 14172],
      why: 'The tallest lower case here, semi condensed with flattened rounds, the closest of the six to the mono’s rectangular o.' },
    { id: 'ibm-plex-sans', name: 'IBM Plex Sans', family: "'FP IBM Plex Sans'", pkg: '@fontsource/ibm-plex-sans 5.3.0',
      src: 'github.com/IBM/plex', table: { x: 0.516, cap: 0.698 }, bytes: [22588, 24252],
      why: 'An engineered grotesk with squared curves and open apertures, made as one family with Plex Mono.' },
    { id: 'schibsted-grotesk', name: 'Schibsted Grotesk', family: "'FP Schibsted Grotesk'", pkg: '@fontsource/schibsted-grotesk 5.3.0',
      src: 'github.com/schibsted/schibsted-grotesk', table: { x: 0.527, cap: 0.703 }, bytes: [24344, 25180],
      why: 'A newspaper grotesk with the mono’s x over cap ratio to the third decimal and plain, wide open terminals.' },
    { id: 'onest', name: 'Onest', family: "'FP Onest'", pkg: '@fontsource/onest 5.3.1',
      src: 'github.com/simpals/onest', table: { x: 0.527, cap: 0.707 }, bytes: [14748, 15412],
      why: 'A geometric grotesk with a tall x-height and generous spacing, the softest of the six.' },
    { id: 'space-grotesk', name: 'Space Grotesk', family: "'FP Space Grotesk'", pkg: '@fontsource/space-grotesk 5.3.0',
      src: 'github.com/floriankarsten/space-grotesk', table: { x: 0.486, cap: 0.700 }, bytes: [13388, 13284],
      why: 'Cut from Space Mono, so it carries a mono’s quirks into a sans, and it is here as the one whose lower case is measurably short.' },
  ];
  const JBM_TABLE = { x: 0.550, cap: 0.730 };

  /* ── what the site is set in today ── */
  const SYS_MONO = 'ui-monospace, SFMono-Regular, Menlo, monospace';
  const SYS_SANS = '-apple-system, BlinkMacSystemFont, "SF Pro Text", Segoe UI, Roboto, sans-serif';
  const IN_USE = [
    { id: 'brand', name: 'Brand JetBrains Mono', family: BRAND, weights: [400, 600],
      files: [['/shell/vendor/jetbrains-mono-latin-400-normal.woff2', 21168], ['/shell/vendor/jetbrains-mono-latin-600-normal.woff2', 21860]],
      where: 'Page titles at 600 and 17 px and the sentence under them at 13.5 px, as --brand. The same two files are Slide JetBrains Mono on every slide, with a 4,308 byte Greek file at 600 for the β.',
      slides: true },
    { id: 'mono', name: '--mono, the device’s mono', family: 'var(--mono)', weights: [400, 600], files: [],
      where: `Buttons, readout cells, logs, keys and tables, 87 font rules in shell.css. It is ${SYS_MONO}, so SF Mono on a Mac and iPhone and Menlo or the platform mono elsewhere.` },
    { id: 'sans', name: '--sans, the device’s sans', family: 'var(--sans)', weights: [400, 600], files: [],
      where: 'Body text at 15 px, every card on the front page and on /kit/, and the card tags. SF Pro on Apple, Segoe UI on Windows, Roboto on Android.' },
    { id: 'kit-prose', name: 'ui-sans-serif, the kit’s notes', family: 'ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif', weights: [400], files: [],
      where: 'The note under every heading on a kit page, kit-page.css .kit-n at 13.5 px. A second spelling of the device sans, and on Apple the same face.' },
    { id: 'accidentals', name: 'positron-accidentals', family: "'positron-accidentals', var(--mono)", weights: [400],
      files: [['/shell/vendor/bravura-text-accidentals.woff2', 4508]], sample: 'C♯ D♭ E♮ F♯ G♭ A♮ B♭',
      where: 'Three glyphs from Bravura Text, ♭ ♮ ♯ and nothing else, on every keyboard; the letters beside them stay in --mono. SIL OFL 1.1.' },
    { id: 'gabarito', name: 'Gabarito', family: "'FP Gabarito'", weights: [400, 600],
      files: [['/weight/vendor/gabarito-latin.woff2', 34320]],
      where: 'The words drawn on the /weight/ canvas, as weight-display and weight-text, one variable file from 200 to 800 plus a 12,220 byte latin-ext file for Š and Ž. SIL OFL 1.1.' },
    ...[['atkinson-hyperlegible-mono', 'Atkinson Hyperlegible Mono', [10056, 10040]],
      ['fira-code', 'Fira Code', [23312, 23316]],
      ['geist-mono', 'Geist Mono', [9864, 10144]],
      ['ibm-plex-mono', 'IBM Plex Mono', [14708, 15620]],
      ['intel-one-mono', 'Intel One Mono', [15764, 17908]],
      ['source-code-pro', 'Source Code Pro', [11656, 11628]]].map(([slug, name, b]) => ({
      id: slug, name, family: `'FP ${name}'`, weights: [400, 600],
      files: [[`/slides/vendor/${slug}-latin-400-normal.woff2`, b[0]], [`/slides/vendor/${slug}-latin-600-normal.woff2`, b[1]]],
      where: 'One of the faces the archived deck at /slides/ can be switched to, and nowhere else. SIL OFL 1.1.' })),
  ];

  const SIZES = [
    { px: 11, w: 400, t: 'sentence' }, { px: 13.5, w: 400, t: 'sentence' }, { px: 17, w: 400, t: 'sentence' },
    { px: 17, w: 400, t: 'chars' }, { px: 24, w: 600, t: 'heading' }, { px: 40, w: 600, t: 'readout' },
    { px: 64, w: 600, t: 'big' },
  ];
  const textFor = (t, face) => face.sample || { sentence: SENTENCE, chars: CHARS, heading: HEADING, readout: '1374 ms', big: 'Aa 1374' }[t];
  // 🔴 THE SLIDE STEPS AS A SHARE OF A SLIDE'S HEIGHT, drawn here for a slide
  // 405 px tall (720 px wide), the half width player's size on a desk. Read off
  // SCALE in slide.mjs, never typed, so a change to the scale changes this.
  const SLIDE_H = 405;

  /* ── measuring, on a canvas, in this browser ── */
  const cv = document.createElement('canvas').getContext('2d');
  function measure(family, weight = 400) {
    cv.font = `${weight} 100px ${family}`;
    const x = cv.measureText('x').actualBoundingBoxAscent / 100;
    const cap = cv.measureText('H').actualBoundingBoxAscent / 100;
    const w = cv.measureText(SENTENCE).width / 100 / SENTENCE.length;
    return { x, cap, w };
  }
  async function loaded(family) {
    try { return (await document.fonts.load(`400 100px ${family}`, 'xH')).length > 0; } catch { return false; }
  }
  const fmt = (v, n = 3) => v.toFixed(n);
  const kb = (b) => `${(b / 1000).toFixed(1)} kB`;
  const fact = (k, v, state) => {
    const f = el('div', 'fp-fact');
    const vv = el('span', 'fp-v', v);
    if (state) vv.dataset.state = state;
    f.append(el('span', 'fp-k', k), vv);
    return f;
  };

  /* the blocks, newest first */
  const measured = new Map();         // id -> { ok, x, cap, w }
  let jbm = null;

  // RECOMMENDATION, the last thing decided, so the first thing on the page.
  let recBox = null;
  section('RECOMMENDATION',
    'One face to set the front page’s prose in beside the brand mono, and the measurement it rests on.',
    null, (box) => {
      box.classList.add('kit-wide');
      recBox = el('p', 'fp-rec', 'measuring');
      box.append(recBox);
    });

  // MEASURED, the six against the brand, as a table.
  let table = null;
  section('MEASURED AGAINST THE BRAND MONO',
    'Lower case height, the lower case over the capitals, and the width of one character, each measured in this browser at 100 px.',
    null, (box) => {
      box.classList.add('kit-wide');
      table = createTable({ columns: [
        { key: 'face', label: 'face', grow: true },
        { key: 'x', label: 'x-ht', width: 64, align: 'right' },
        { key: 'xr', label: 'vs mono', width: 72, align: 'right' },
        { key: 'xc', label: 'x/cap', width: 64, align: 'right' },
        { key: 'w', label: 'width', width: 64, align: 'right' },
        { key: 'kb', label: 'size', width: 72, align: 'right' },
      ], empty: 'measuring' });
      box.append(table.el);
      box.append(out('x-ht and width in em; size is the 400 and 600 Latin files together'));
    });

  // MATCHING SANS, every candidate set beside the brand mono.
  const specs = [];
  section('MATCHING SANS',
    'Six openly licensed sans faces, each set beside the brand mono in a paragraph, under a mono title, over a readout and on a card.',
    null, (box) => {
      box.classList.add('kit-wide');
      const list = el('div', 'fp-faces');
      for (const c of CANDIDATES) {
        const face = el('div', 'fp-face');
        face.id = `sans-${c.id}`;
        // the candidate reaches this specimen and nothing else: `--sans` is
        // the face, and `--mono` is the brand, which is the proposal
        face.style.setProperty('--sans', `${c.family}, ${SYS_SANS}`);
        face.style.setProperty('--mono', `${BRAND}, ${SYS_MONO}`);
        const facts = el('div', 'fp-facts');
        face.append(el('h3', 'fp-name', c.name), el('p', 'fp-where', c.why), facts);

        const pair = el('div', 'fp-pair');
        const m = el('div', 'fp-spec');
        m.append(el('p', 'fp-cap', 'brand mono'), el('p', 'fp-para fp-m', SENTENCE));
        const s = el('div', 'fp-spec');
        s.append(el('p', 'fp-cap', c.name), el('p', 'fp-para fp-s', SENTENCE));
        const page = el('div', 'fp-spec');
        const rep = createReport({ readout: { late: 'ms', bars: '' }, showLog: false, joined: false });
        rep.set('late', 1374); rep.set('bars', 48);
        page.append(el('p', 'fp-cap', 'mono title, sans body, readout'),
          el('h4', 'fp-title', HEADING),
          el('p', 'fp-body', 'The board in the other building plays the same bar, and the cells under this line say how late it landed.'),
          rep.top);
        const cardSpec = el('div', 'fp-spec');
        cardSpec.append(el('p', 'fp-cap', 'card'), createCard({ title: HEADING,
          desc: 'A Raspberry Pi in another building plays in time with this page.', tags: ['WebAudio', 'no network'], minH: 0 }).el);
        pair.append(m, s, page, cardSpec);
        face.append(pair);
        list.append(face);
        specs.push({ c, face, facts, sans: s.querySelector('.fp-para'), body: page.querySelector('.fp-body'),
          title: page.querySelector('.fp-title'), cell: rep.top });
      }
      box.append(list);
    });

  // TYPOGRAPHY SAMPLER, the first block asked for, so the last on the page.
  const samples = [];
  section('TYPOGRAPHY SAMPLER',
    'Every face this site is set in today, at 11, 13.5, 17, 24, 40 and 64 px, with where it is used and what it weighs.',
    null, (box) => {
      box.classList.add('kit-wide');
      const list = el('div', 'fp-faces');
      for (const f of IN_USE) {
        const face = el('div', 'fp-face');
        face.id = `face-${f.id}`;
        const facts = el('div', 'fp-facts');
        const bytes = f.files.reduce((a, [, b]) => a + b, 0);
        facts.append(fact('weights', f.weights.join(' ')),
          fact('file', f.files.length ? kb(bytes) : 'none, the device’s own'));
        face.append(el('h3', 'fp-name', f.name), el('p', 'fp-where', f.where), facts);
        const rows = el('div', 'fp-rows');
        for (const sz of SIZES) {
          if (f.sample && sz.t === 'chars') continue;   // one sample line, so no second 17 px row
          const w = f.weights.includes(sz.w) ? sz.w : f.weights[0];
          const r = el('div', 'fp-row');
          const t = el('p', 'fp-txt', textFor(sz.t, f));
          t.style.font = `${w} ${sz.px}px/1.3 ${f.family}`;
          r.append(el('span', 'fp-sz', `${sz.px} px ${w}`), t);
          rows.append(r);
        }
        if (f.slides) {
          for (const st of SCALE.steps) {
            const s = stepOf(st.n);
            const px = s.size / 100 * SLIDE_H;
            const r = el('div', 'fp-row');
            const t = el('p', 'fp-txt', st.n >= 5 ? '1374 ms' : HEADING);
            t.style.font = `${st.n >= 3 ? 600 : 400} ${px.toFixed(2)}px/${s.lh} ${f.family}`;
            t.style.letterSpacing = `${s.ls}em`;
            r.append(el('span', 'fp-sz', `step ${st.n} ${+px.toFixed(1)}`), t);
            rows.append(r);
          }
          rows.append(el('p', 'kit-cut', `slide steps at ${SLIDE_H} px of slide height, ${SCALE.base} per cent times ${SCALE.ratio} per step`));
        }
        face.append(rows);
        list.append(face);
        samples.push({ f, face });
      }
      box.append(list);
    });

  land();

  /* ── fill in what was measured ── */
  const ready = (async () => {
    await loaded(BRAND);
    jbm = measure(BRAND);
    const rows = [];
    for (const sp of specs) {
      const { c } = sp;
      const ok = await loaded(c.family);
      const m = ok ? measure(c.family) : null;
      measured.set(c.id, { ok, ...(m || {}) });
      const bytes = c.bytes[0] + c.bytes[1];
      if (!ok) {
        sp.facts.append(fact('licence', 'SIL OFL 1.1'), fact('file', 'did not load', 'bad'));
        continue;
      }
      // the size at which this face's lower case is as tall as the mono's at 15
      const match = 15 * jbm.x / m.x;
      sp.facts.append(
        fact('licence', 'SIL OFL 1.1'),
        fact('source', c.src),
        fact('x-height', `${fmt(m.x)} em, ${Math.round(m.x / jbm.x * 100)}%`),
        fact('x/cap', `${fmt(m.x / m.cap)} to ${fmt(jbm.x / jbm.cap)}`),
        fact('width', `${fmt(m.w)} em, ${Math.round(m.w / jbm.w * 100)}%`),
        fact('15 px mono x', `at ${match.toFixed(1)} px`),
        fact('400 + 600', kb(bytes)));
      rows.push({ face: c.name, x: fmt(m.x), xr: `${Math.round(m.x / jbm.x * 100)}%`, xc: fmt(m.x / m.cap), w: fmt(m.w), kb: kb(bytes), _x: m.x, _xc: m.x / m.cap });
    }
    rows.sort((a, b) => b._x - a._x);
    table.set([{ face: 'JetBrains Mono, the brand', x: fmt(jbm.x), xr: '100%', xc: fmt(jbm.x / jbm.cap), w: fmt(jbm.w), kb: kb(21168 + 21860) }, ...rows]);

    // 🔴 THE RECOMMENDATION IS WRITTEN FROM THE NUMBERS ON THIS PAGE, and
    // the face it names is a decision taken by looking (REC below), so a
    // change of mind is one line and the numbers beside it stay measured.
    const REC = 'manrope';
    const r = measured.get(REC);
    const rc = CANDIDATES.find((c) => c.id === REC);
    recBox.textContent = '';
    if (r?.ok) {
      recBox.append(el('b', '', rc.name), ` sits closest to JetBrains Mono: its lower case is ${Math.round(r.x / jbm.x * 100)} per cent of the mono’s at the same size, `
        + `its x over cap is ${fmt(r.x / r.cap)} against the mono’s ${fmt(jbm.x / jbm.cap)}, and its flattened rounds and open apertures read as the same hand, `
        + `so a mono title and a sans paragraph under it look like one voice at ${kb(rc.bytes[0] + rc.bytes[1])} for both weights.`);
    } else recBox.textContent = `${rc.name} did not load, so there is nothing measured to recommend it on.`;
  })();

  if (SELFCHECK) {
    await ready;
    const frames = (n) => new Promise((r) => { const f = () => (--n <= 0 ? r() : requestAnimationFrame(f)); requestAnimationFrame(f); });
    await frames(3);
    checkPage();

    // 1. every candidate loaded, and what the canvas measured is what the
    // face file declares, so no number on this page is a fallback's
    {
      const bad = [];
      for (const c of CANDIDATES) {
        const m = measured.get(c.id);
        if (!m?.ok || Math.abs(m.x - c.table.x) > 0.01 || Math.abs(m.cap - c.table.cap) > 0.01) {
          bad.push(`${c.name} ${m?.ok ? `x ${fmt(m.x)} cap ${fmt(m.cap)} against ${c.table.x} ${c.table.cap}` : 'did not load'}`);
        }
      }
      const jOk = Math.abs(jbm.x - JBM_TABLE.x) <= 0.01 && Math.abs(jbm.cap - JBM_TABLE.cap) <= 0.01;
      d.assert('every candidate loaded, and the x-height and cap height measured here are the ones its own file declares',
        bad.length === 0 && jOk,
        bad.length || !jOk ? `${bad.join(', ')}${jOk ? '' : `; brand x ${fmt(jbm.x)} cap ${fmt(jbm.cap)}`}`
          : `${CANDIDATES.length} faces and the brand, each within 0.01 em of its OS/2 table`);
    }

    // 2. NEGATIVE CONTROL: a face that is not there does not load, and the
    // canvas then measures the fallback, which is what check 1 would catch
    {
      const none = await loaded("'FP No Such Face'");
      const fb = measure("'FP No Such Face', serif");
      d.assert('NEGATIVE CONTROL: a face that does not exist reports not loaded, and its fallback measures unlike the brand',
        none === false && Math.abs(fb.x - JBM_TABLE.x) > 0.01,
        `loaded ${none}, fallback x ${fmt(fb.x)} against the brand's ${JBM_TABLE.x}`);
    }

    // 3. each specimen is set in its own candidate, read off the rendered
    // style rather than off the source
    {
      const off = specs.filter(({ c, sans, body, title }) => {
        const fs = getComputedStyle(sans).fontFamily, fb = getComputedStyle(body).fontFamily, ft = getComputedStyle(title).fontFamily;
        const want = c.family.replace(/'/g, '');
        return !fs.replace(/["']/g, '').startsWith(want) || !fb.replace(/["']/g, '').startsWith(want) || !ft.includes('Brand JetBrains Mono');
      });
      const site = getComputedStyle(document.body).fontFamily;
      d.assert('each specimen sets its paragraph and body in its own candidate and its title in the brand mono, and the page itself keeps the site’s --sans',
        off.length === 0 && !/FP /.test(site),
        off.length ? off.map((s) => s.c.name).join(', ') : `${specs.length} specimens, body still ${site.split(',')[0]}`);
    }

    // 4. every file size written on this page is the size the browser fetched
    {
      const want = [...CANDIDATES.flatMap((c) => [[`/shell/vendor/${c.id}-latin-400-normal.woff2`, c.bytes[0]], [`/shell/vendor/${c.id}-latin-600-normal.woff2`, c.bytes[1]]]),
        ...IN_USE.flatMap((f) => f.files)];
      await Promise.all(IN_USE.flatMap((f) => f.weights.map((w) => document.fonts.load(`${w} 20px ${f.family}`, f.sample || 'xH').catch(() => []))));
      await Promise.all(CANDIDATES.map((c) => document.fonts.load(`600 20px ${c.family}`, 'xH')));
      const bad = [];
      for (const [path, bytes] of want) {
        const e = performance.getEntriesByName(new URL(path, location.origin).href)[0];
        if (!e || e.decodedBodySize !== bytes) bad.push(`${path} ${e ? e.decodedBodySize : 'not fetched'} against ${bytes}`);
      }
      d.assert('every file size on this page is the size of the file the browser fetched',
        bad.length === 0, bad.length ? bad.join(', ') : `${want.length} files, each to the byte`);
    }

    // 5. nothing left this origin: no font from Google or anybody else
    {
      const off = performance.getEntriesByType('resource').map((e) => e.name).filter((u) => new URL(u).origin !== location.origin);
      d.assert('the page fetched nothing from another origin',
        off.length === 0, off.length ? off.slice(0, 3).join(', ') : `${performance.getEntriesByType('resource').length} requests, all to this origin`);
    }
  }

  d.ready();
</script>
</html>
