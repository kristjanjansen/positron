<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON · kit</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .kit-h { font: 600 10.5px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase;
           color: var(--hi); margin: 30px 0 4px; }
  /* ⚠️ PROSE IS SANS HERE, EVERYTHING ELSE STAYS MONO. This page is read rather
     than operated: a paragraph explaining why a control looks the way it does
     is not a value, a key or a line of code, and setting it in the same
     monospace as the things it describes makes the description compete with
     the sample. The controls, the snippets and every readout keep the mono
     face, because there the fixed width is carrying meaning. */
  .kit-n { font: 400 13.5px/1.65 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
           color: var(--dim); margin: 0 0 12px; max-width: 66ch; }
  .kit-n code { font-family: var(--mono); font-size: .92em; }
  .kit-n code { color: var(--fg); }
  .kit-box { border: 1px solid var(--line); border-radius: 4px; background: var(--card);
             padding: 14px; margin: 0 0 8px; display: flex; flex-wrap: wrap;
             gap: 10px; align-items: center; }
  .kit-src { font: 400 11px/1.6 var(--mono); color: var(--dim2); white-space: pre-wrap;
             margin: 0 0 6px; padding-left: 2px; }
  /* ⚠️ GREY, NOT `--hi`. This is what the control beside it last reported, and
     it was yellow — the colour this project uses for the one thing on a page
     that matters. Beside eight sample controls that all report, yellow is
     eight highlights, which is none: the sandbox lit up like a page where
     everything is urgent. It is a value, and values are `--dim`.
     ⚠️ AND `align-self: center`, because `align-items: center` on the box
     centres each FLEX LINE's items and the button rows beside these carry
     their own height — so the readout sat low against the row it describes. */
  /* ⚠️ ITS OWN LINE, ALWAYS. Beside a control it reads as part of the control —
     `LOOK ‹ random › KALEIDOSCOPE` looks like a picker with a fourth segment,
     which is exactly what it is not: it is what the picker REPORTED. A readout
     sharing a row with the thing it reports on has to be told apart by colour
     alone, and colour is already carrying whether a control is armed.
     `flex: 1 1 100%` in a wrapping row is the whole mechanism. */
  .kit-out { font: 500 12px/1.6 var(--mono); color: var(--dim); min-height: 1.6em;
             flex: 1 1 100%; }
  /* A block holding a diagram is not a row of controls: the picture wants the
     whole width and the report under it wants the line below, so these two
     turn the flex row off rather than fighting it with `flex: 1 1 100%` on
     each child. Setting `display` matters — a flex property on a non-flex box
     is silence, and a flex CHILD of a `flex-wrap` row is sized by its content
     no matter what width it asks for. */
  .kit-wide { display: block; }
  /* the phone case. A fixed width so the one-column layout can be seen on a
     desktop, `max-width` so it is never wider than a real phone. */
  .kit-phone { width: 320px; max-width: 100%; }
  .kit-cut { font: 400 11px/1.6 var(--mono); color: var(--dim); margin-top: 8px;
             white-space: pre-wrap; }
  .kit-cut b { color: var(--warn); font-weight: 500; }
  /* The stand-in for everything between a split readout and a split log, which
     on a real page is the whole demo. 🔴 IT IS A REAL `.pos-body` AND THIS
     RULE DECLARES NO MARGIN. The gap under a split readout and the gap over a
     split log are both the shell's, and one of them is `.pos-body`'s own
     `margin-bottom` rather than anything the log asks for — so a stand-in with
     a margin typed here would be this page inventing the number it then grades
     itself against. */
  .kit-mid { border: 1px dashed var(--line2); border-radius: 4px; color: var(--dim2);
             font: 400 11px/1 var(--mono); text-align: center; padding: 26px 0; }
  /* ⚠️ AND NO RULE HERE RESETTING WHAT FOLLOWS A CAPTION. The split specimen
     below is measured, and its gaps are the shell's own 22 px: a `margin-top:
     0` typed here would make this page move the thing it is grading, which is
     the same mistake as a check that mutates. */
  .kit-cap { font: 600 9.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase;
             color: var(--dim2); margin: 0; }
  /* A caption belongs to the specimen UNDER it, so the air goes above the
     caption rather than below it. Nothing measured passes through this gap:
     the two numbers graded in the split block are readout-to-page and
     page-to-log, and no caption stands in either.
     🔴 AND THE 44 px THE SHELL PUTS ABOVE A JOINED SURFACE IS MOVED HERE, NOT
     SHRUNK. That gap is the distance from the PAGE to the surface at the foot
     of it, and there is no page inside a sandbox box: what sits directly above
     each specimen is its own caption, so leaving the margin on the box put
     44 px between a label and the thing it labels. Photographed: the word
     JOINED floating in the middle of the gap, reading as a heading for
     nothing. The caption takes the air and its specimen sits under it, so the
     pair is still one group with the shell's own 44 px above it. */
  .kit-box > * + .kit-cap { margin-top: 44px; }
  .kit-cap + .pos-report { margin-top: 0; }
</style>

<script type="module">
  import { mount, el, createReport } from '/shell/shell.mjs';
  import { createStepper } from '/shell/stepper.mjs';
  import { createSlider, createSliderGroup, GLIDE_MS } from '/shell/slider.mjs';
  import { createChoice } from '/shell/choice.mjs';
  import { createTabs } from '/shell/tabs.mjs';
  import { createCard, createCardGrid } from '/shell/card.mjs';
  import { DEMOS } from '/manifest.mjs';
  import { createKeyboard } from '/shell/keyboard.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { createField } from '/shell/field.mjs';
  import { createStripView } from '/shell/strip.mjs';
  import { createDiagram } from '/shell/diagram.mjs';
  import { createTable } from '/shell/table.mjs';
  import { createPresence, PRESENCE_STATES } from '/shell/presence.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { markAdapter } from '/shell/fixture.mjs';

  /**
   * 🔴 IT MOUNTS THE SHELL NOW, AND THAT IS WHAT MAKES IT GRADEABLE. It used to
   * hand-write its own head, which meant `node demo/verify.mjs kit` answered
   * "nothing for this harness to verify": no `mount()`, no `window.__demo`, no
   * asserts. So the one page whose entire job is to make component drift
   * visible was the one page the suite could not look at, and everything
   * demonstrated here had to be measured some other way.
   *
   * ⚠️ AND IT MOUNTS THE SAME SHELL EVERY OTHER PAGE DOES, which is the second
   * half of the point. A sandbox for components that opts out of the frame
   * those components live in is a sandbox that can drift from the thing it
   * exists to police. The head, the back link and the log are the real ones.
   *
   * `readout: null` because the subject here is the controls themselves. Every
   * readout on this page is a SPECIMEN rather than this page's own instrument,
   * including the two in the block at the top: that block is about where the
   * numbers and the log SIT, and a sandbox that joined its own pair could only
   * ever show one of the two arrangements.
   */
  const d = mount({
    name: 'kit',
    what: 'Every reusable control in the shell, on one page, wired to nothing. '
      + 'It is here so a control can be looked at and pushed around without starting '
      + 'a board, a relay or a stream, and so that two pages using the same component '
      + 'cannot quietly drift into looking like two different ones. Each block shows '
      + 'how it is made.',
    readout: null,
  });

  const body = d.el;
  const out = (t) => { const o = el('div', 'kit-out', t); return o; };
  // What every section reports about itself, for the checks at the bottom.
  const built = [];
  const failed = [];
  /**
   * 🔴 A SECTION THAT THROWS IS THE DEFECT THIS PAGE EXISTS TO FIND, so it is
   * caught and RECORDED rather than allowed to stop the page. A component that
   * will not build takes every block below it with it when the error escapes,
   * which turns one broken control into a blank page and hides which one it
   * was. Both lists are asserted at the bottom.
   */
  function section(title, note, src, build) {
    body.append(el('h2', 'kit-h', title));
    if (note) body.append(el('p', 'kit-n', note));
    if (src) body.append(el('pre', 'kit-src', src));
    const box = el('div', 'kit-box');
    body.append(box);
    try { build(box); built.push(title); }
    catch (e) {
      failed.push(`${title}: ${e.message}`);
      box.append(el('div', 'kit-cut', `this block did not build: ${e.message}`));
      d.log(`${title} did not build: ${e.message}`, 'bad');
    }
  }

  // The four specimen badges, by state, so the geometry asserts at the bottom
  // can measure them. ⚠️ DECLARED HERE RATHER THAN BESIDE THE BLOCK: this
  // section moved to the top of the page and its `const` stayed behind, so the
  // build read it in its dead zone, `section()` swallowed the throw into
  // `failed`, and the page died much later on an empty map. A block that moves
  // takes what it needs with it.
  const presSpec = new Map();
  let presLive = null;        // one badge that can change, measured over time

  // The three arrangements of the readout and the log, for the geometry checks
  // at the bottom. ⚠️ SAME REASON AS THE LINE ABOVE: the block that fills these
  // is the newest one and so it is the topmost one, and a `const` left where
  // the block used to be is read in its dead zone.
  let joinedSpec = null;      // a readout on top of a log, one surface
  let logOnlySpec = null;     // joined, with no readout declared
  let neitherSpec = null;     // joined, with neither — there is nothing to draw
  let splitSpec = null;       // the default: two surfaces, the page between them
  // the two `.pos-body` stand-ins, held rather than queried: the gaps this
  // block grades are measured FROM them, and `querySelector` would find
  // whichever came first and grade the wrong arrangement
  let joinedPage = null, splitPage = null;

  /**
   * 🔴 THE NEWEST COMPONENT GOES AT THE TOP OF THIS PAGE. Instructed
   * 2026-09-16: *"in kit move online stuff to topmost item (all new should land
   * top, make rule)"*.
   *
   * This page is read by somebody checking what the kit has, and what they do
   * not know about is what arrived since they last looked. Appending put the
   * newest thing behind every component they already knew, at the bottom of a
   * long scroll, which is the one place it cannot be found by accident. The
   * front page settled the same question the same way and for the same reason.
   *
   * ⚠️ A SECTION TITLE IS UPPERCASE, and `.kit-h` renders it so whatever is
   * typed. Type it uppercase anyway, so the source reads like the page.
   * ⚠️ AND MOVING A BLOCK MOVES EVERY BUTTON AFTER IT. `verify.mjs` presses by
   * position, so re-run `node demo/verify.mjs kit` and diff the assert count
   * after any reorder.
   */
  section('READOUT AND LOG, JOINED OR SPLIT',
    'The numbers a page is showing now and the record of what it did are one component '
    + 'with two arrangements. Split is the default and is what every page here already '
    + 'does: the readout above the controls, the log under the page. Joined makes them a '
    + 'single surface at the foot, the readout sitting on top of the log, with one border '
    + 'round both and the same one pixel of line colour between them that already runs '
    + 'between two readout cells. A joined surface missing one half draws one border and '
    + 'no seam, and one missing both is never put on the page at all.',
    `mount({ readout: { sent: '/s', lost: '' }, joined: true })   // one surface, at the foot
mount({ readout: { sent: '/s', lost: '' } })                 // two surfaces, the default
createReport({ readout, showLog: false, joined: true })      // the same pair, standalone`,
    (box) => {
      box.classList.add('kit-wide');

      // ── joined ──────────────────────────────────────────────────────────
      joinedSpec = createReport({ readout: { sent: '/s', lost: '' }, joined: true });
      joinedSpec.set('sent', 48);
      joinedSpec.set('lost', 0, 'ok');
      // A fixed time on every line, so this block draws the same picture on
      // every visit. `performance.now()` here would put the age of the page
      // into a specimen, which is a number that says nothing about the
      // component and changes every time anybody looks at it.
      joinedSpec.line('the board answered', 'hi', 1240);
      joinedSpec.line('holding a note', null, 2480);
      // ⚠️ THE PAGE IS PART OF THE SPECIMEN, because "at the foot" is half of
      // what joined MEANS and because the gap under it is the thing the shell
      // declares: 44 px, the diagram's number, rather than the 22 px between
      // two ordinary rows. Without a `.pos-body` here there is nothing for that
      // distance to be measured from.
      joinedPage = el('div', 'pos-body kit-mid', 'the page goes here');
      box.append(el('p', 'kit-cap', 'joined'), joinedPage, joinedSpec.foot);

      // ── joined, with only one of the two ────────────────────────────────
      // `readout: null` on a real page, which is the `/typist/` case: the
      // document IS the readout and cells repeating it would be the same facts
      // twice. The surface is still one box, and there is no seam in it.
      logOnlySpec = createReport({ joined: true });
      logOnlySpec.line('nothing to count on this page', null, 1240);
      box.append(el('p', 'kit-cap', 'joined, with no readout declared'), logOnlySpec.foot);

      // ⚠️ AND WITH NEITHER THERE IS NOTHING TO APPEND, which is the point:
      // `foot` comes back null rather than an empty box drawing its own two
      // borders as a 2 px band. Nothing goes in the page for this one.
      neitherSpec = createReport({ showLog: false, joined: true });

      // ── split ───────────────────────────────────────────────────────────
      splitSpec = createReport({ readout: { sent: '/s', lost: '' } });
      splitSpec.set('sent', 48);
      splitSpec.set('lost', 0, 'ok');
      splitSpec.line('the board answered', 'hi', 1240);
      splitSpec.line('holding a note', null, 2480);
      // a real `.pos-body` again, because the gap under a split log belongs to
      // the body rather than to the log; a plain div here would measure nothing
      splitPage = el('div', 'pos-body kit-mid', 'the page goes here');
      box.append(el('p', 'kit-cap', 'split, which is the default'),
        splitSpec.top, splitPage, splitSpec.foot);
    });

  section('ONLINE, OFFLINE, COMING ONLINE',
    'Four states, not three: a thing nobody has asked yet is not offline, which is '
    + 'the same rule caps.mjs follows when it answers "unknown" about a browser it '
    + 'could not probe. Green means it spoke inside the time it promised to speak in, '
    + 'and the two greys are told apart by ink rather than hue: a solid dot is a '
    + 'measurement, a hollow ring is nobody having looked.',
    `createPresence({ of: 'the board' }).set('online')
presenceOf({ now, lastSeenAt, everyMs: 5000 })   // -> one of the four`,
    (box) => {
      // ⚠️ `can: [s]` IS WHAT MAKES THIS ROW EVENLY SPACED. Each of these will
      // only ever say its own word, so holding room for `coming online` put a
      // different amount of empty space after each one and the gaps read as
      // arbitrary. A badge that can really change says nothing here and keeps
      // the full reserve, which is what the width check below drives.
      for (const s of PRESENCE_STATES) {
        const p = createPresence({ state: s, can: [s] });
        presSpec.set(s, p.el);
        box.append(p.el);
      }
      // One badge that CAN change, for the check at the bottom: the claim is
      // that a badge does not twitch as ITS OWN state moves, which is about one
      // badge over time and not about four badges side by side.
      presLive = createPresence({ state: 'online' });
      presLive.el.style.position = 'absolute';
      presLive.el.style.visibility = 'hidden';
      box.append(presLive.el);
    });

  section('a presence dot inside something else',
    'The same component with mode "dot": the ring alone, and the words CLIPPED '
    + 'rather than removed, so the accessible name is still the whole sentence and a '
    + 'change is still announced. It is an inline box with no margins, so it drops '
    + 'into a button, a readout key or a row of machines without any of them knowing '
    + 'what it is.',
    `createPresence({ of: 'the board', mode: 'dot', state: 'online' })`,
    (box) => {
      const b = el('button', '', null, { type: 'button' });
      b.append(createPresence({ of: 'the board', mode: 'dot', state: 'online' }).el,
        document.createTextNode(' switch it on'));
      b.style.cssText = 'display:inline-flex;align-items:center;gap:7px';
      box.append(b);

      // In a readout key, where a page already prints what a machine is doing.
      const r = el('div', 'pos-readout');
      for (const [k, v, u, s] of [['relay', '1', '/16', 'online'], ['board', '', 'ms', 'unknown']]) {
        const c = el('div', 'pos-cell');
        const key = el('div', 'pos-k');
        key.style.cssText = 'display:flex;align-items:center;gap:5px';
        key.append(createPresence({ of: k, mode: 'dot', state: s }).el, document.createTextNode(k));
        const val = el('span', 'pos-v', v || null);
        if (s === 'unknown') val.dataset.state = 'pending';
        if (u) val.append(el('span', 'pos-u', u));
        c.append(key, val); r.append(c);
      }
      r.style.flex = '1 1 100%';
      box.append(r);

      // A row of machines, which is the shape /knobs/, /box/, /grains/ and
      // /rack/ all want and all draw differently today.
      const list = el('div', '');
      list.style.cssText = 'flex:1 1 100%;display:grid;gap:6px;font:400 12px/1 var(--mono);color:var(--dim)';
      for (const [name, s] of [['studio-1', 'online'], ['the board', 'coming'],
        ['the Mac', 'offline'], ['the headset', 'unknown']]) {
        const row = el('div', '');
        row.style.cssText = 'display:flex;align-items:center;gap:8px';
        row.append(createPresence({ of: name, mode: 'dot', state: s }).el, document.createTextNode(name));
        list.append(row);
      }
      box.append(list);
    });

  section('buttons', '',
    `el('button', '', 'ordinary', { type: 'button' })
el('button', 'pos-pri', 'the primary one', { type: 'button' })`,
    (box) => {
      box.append(el('button', '', 'ordinary', { type: 'button' }));
      const p = el('button', 'pos-pri', 'the primary one', { type: 'button' }); box.append(p);
      const dis = el('button', '', 'disabled', { type: 'button' }); dis.disabled = true; box.append(dis);
      const busy = el('button', '', 'working', { type: 'button' }); busy.dataset.busy = '1'; box.append(busy);
    });

  // ── stepper ─────────────────────────────────────────────────────────────
  section('stepper',
    '',
    `createStepper({ what: 'patch', prev, next, random })`,
    (box) => {
      const o = out('nothing pressed yet');
      let at = 0;
      const names = ['kaleidoscope', 'rings', 'weave', 'drift'];
      const show = () => { o.textContent = `${at} · ${names[at]}`; };
      const s = createStepper({
        what: 'look',
        prev: () => { at = (at + names.length - 1) % names.length; show(); },
        next: () => { at = (at + 1) % names.length; show(); },
        random: () => { at = Math.floor(Math.random() * names.length); show(); },
      });
      box.append(s.el, o);
    });

  // ── slider ──────────────────────────────────────────────────────────────
  section('slider',
    '',
    `createSlider({ label: 'mix', min: 0, max: 1, step: 0.01, value: 0.26 })
createSlider({ label: 'damp', min: 1000, max: 12000, step: 100, unit: 'Hz' })`,
    (box) => {
      const o = out('');
      const a = createSlider({ label: 'mix', min: 0, max: 1, step: 0.01, value: 0.26,
        onInput: (v) => { o.textContent = `mix ${v.toFixed(2)}`; } });
      const b = createSlider({ label: 'damp', min: 1000, max: 12000, step: 100, value: 6000, unit: 'Hz',
        onInput: (v) => { o.textContent = `damp ${v} Hz`; } });
      const c = createSlider({ label: 'off', min: 0, max: 1, step: 0.1, value: 0.5 });
      c.disabled(true);
      box.append(el('button', '', 'a button, for height', { type: 'button' }), a.el, b.el, c.el, o);
    });

  // ── several sliders ─────────────────────────────────────────────────────
  section('sliders stacked',
    '',
    `createSliderGroup([rate, size, spray, swarm])`,
    (box) => {
      const o = out('');
      const g = createSliderGroup([
        createSlider({ label: 'rate', min: 0.5, max: 24, step: 0.1, value: 8.2, unit: '/s',
          onInput: (v) => { o.textContent = `rate ${v} /s`; } }),
        createSlider({ label: 'size', min: 0.02, max: 0.4, step: 0.01, value: 0.14, unit: 's',
          onInput: (v) => { o.textContent = `size ${v} s`; } }),
        createSlider({ label: 'spray', min: 0, max: 0.5, step: 0.01, value: 0.17,
          onInput: (v) => { o.textContent = `spray ${v}`; } }),
        createSlider({ label: 'swarm', min: 0, max: 0.9, step: 0.01, value: 0.3,
          onInput: (v) => { o.textContent = `swarm ${v}`; } }),
      ]);
      box.append(g.el, o);
    });

  // ── two across, and a glide ─────────────────────────────────────────────
  section('two across, and a patch that glides',
    'Above 720 px the pair shares six columns instead of stacking; below it, it '
    + 'falls back to the stacked three, because side by side there is nothing to '
    + 'line up. Press a sound and the handles travel rather than teleport. The '
    + 'value itself lands at once, so nothing downstream waits for the picture.',
    `createSliderGroup([...], { pair: true })
s.set(v, { quiet: true, glideMs: GLIDE_MS })`,
    (box) => {
      const o = out('press a sound');
      const mk = (label, min, max, step, value, unit) =>
        createSlider({ label, min, max, step, value, unit,
          onInput: (v) => { o.textContent = `${label} ${v}${unit ? ' ' + unit : ''}`; } });
      const knobs = [
        mk('rate', 0.5, 24, 0.1, 2.2, '/s'),
        mk('size', 0.02, 0.4, 0.01, 0.3, 's'),
        mk('where', 0, 1, 0.01, 0.35, ''),
        mk('spray', 0, 0.5, 0.01, 0.12, ''),
      ];
      const g = createSliderGroup(knobs, { pair: true });
      const sounds = [
        ['slow drift', [2.2, 0.30, 0.35, 0.12]],
        ['glass rain', [14, 0.05, 0.50, 0.40]],
        ['deep hum', [0.9, 0.38, 0.50, 0.08]],
      ];
      const row = el('div', 'pos-controls');
      for (const [name, vals] of sounds) {
        const b = el('button', '', name, { type: 'button' });
        b.addEventListener('click', () => {
          // ⚠️ QUIET AND GLIDING AT THE SAME TIME, which is the pair a patch
          // wants: no callback storm back into whatever loaded the patch, and
          // a handle you can watch move. They are separate options for exactly
          // that reason.
          knobs.forEach((k, i) => k.set(vals[i], { quiet: true, glideMs: GLIDE_MS }));
          o.textContent = `${name} · four settings over ${GLIDE_MS} ms`;
        });
        row.append(b);
      }
      box.append(g.el, row, o);
    });

  // ── radio row ───────────────────────────────────────────────────────────
  section('a choice of three',
    '',
    `createChoice({ label: 'space', options: [['dry',0],['room',1],['hall',2]], at: 1, onPick })`,
    (box) => {
      const o = out('room');
      const c = createChoice({
        label: 'space',
        options: [['dry', 0], ['room', 1], ['hall', 2]],
        at: 1,
        onPick: (_v, name) => { o.textContent = name; },
      });
      box.append(c.el, o);
    });

  // ── tabs ────────────────────────────────────────────────────────────────
  section('the parts of one page',
    'Not a choice. That one is a segmented box for options you arm; these are places you go, and '
    + 'drawing two different acts the same way is what this page exists to catch. The open one is '
    + 'marked by colour and a bar under the word: no box, no borders. A part that exists and is not '
    + 'built stays in the row, named and unpressable, because hiding it would say it does not exist. '
    + 'The row scrolls sideways rather than wrapping, and each tab is a #link, so switching keeps the '
    + 'page, and whatever it is playing, alive.',
    `createTabs({ tabs: [{id:'air',label:'On air'}, {id:'past',label:'Archive',disabled:true}, …] })`,
    (box) => {
      const o = out('air');

  //
  // 🔴 AND THE DESCRIPTIONS ARE TRIMMED, WHICH IS A FINDING RATHER THAN A
  // CONVENIENCE. The index's `one` lines are written for a row the full width

  // lines and the grid stretches every card in the row to match it. Cutting at

  // clause that qualifies it — which is what a card wants and, arguably, what
  // a row wants too.

      const t0 = 0, SPAN = 8000;

      const { strip } = createStripView(box, deck, {
        // 'auto' takes exactly the height its lanes need — 'default' left a

  // ── the flow diagram ────────────────────────────────────────────────────
  // 🔴 THE ONLY WAY TO KNOW THE WRAPPING IS RIGHT IS TO SEE FOUR AWKWARD ONES
  // SIDE BY SIDE. Every other component on this page can be judged from one
  // example; this one cannot, because what it does well or badly is decided by
  // strings nobody has typed yet. So the four cases below are the deliberately
  // difficult ones — a clean round trip, a label too long for its box, two
  // return paths that would sit on top of each other, and the whole thing at
  // the width of a phone.
  //
  // ⚠️ AND EACH ONE REPORTS WHAT IT HAD TO CUT. A drawer that quietly shortens
  // a label leaves the author believing the label fits: the picture looks
  // fine, and the missing half is only found by somebody reading the page on a
  // narrower screen. The line under each picture names every label that was
  // shortened and the width it had to fit — because a cut label is a label
  // that is too long, which is a thing to go and fix, not a feature.
  //
  // 🔴 AND THIS REPORT IS NOW THE ONLY PLACE A CUT SHOWS. The full string used
  // to sit in an svg `<title>`, i.e. in the browser's own tooltip, which is
  // gone: a tooltip drew the box's name ON TOP of the box while the line under
  // the picture was saying the same words, three channels for one fact. The
  // whole string is still in `aria-label` for a screen reader; nothing draws
  // it. So a cut that nobody reads here is a cut nobody reads at all.
  //
  // It also says whether the type was MEASURED or estimated. `getComputedText-
  // Length()` answers 0 inside a hidden ancestor, and every string then
  // "fits" — one line per box, no wrapping, no cuts. That failure reads as a
  // wrapping bug and is an attachment bug, so it gets its own word here rather
  // than being inferred from a picture that looks a bit too tidy.
  // Every diagram's own report, kept so the checks at the bottom can grade the
  // ones meant to fit against the one deliberately built not to.
  const drawn = new Map();
  const drew = new Map();
  function diagramCase(box, spec, { phone = false, id = null } = {}) {
    box.classList.add('kit-wide');
    const holder = el('div', phone ? 'kit-phone' : null);
    const report = el('div', 'kit-cut');
    box.append(holder, report);
    const made = createDiagram(holder, spec, {
      onRender: (i) => {
        const tag = id || spec.__id;
        if (tag) drawn.set(tag, i);
        report.textContent =
          `${i.mode === 'row' ? 'left to right' : 'one column'} · ${i.width} px wide` +
          ` · boxes ${i.boxW} by ${i.boxH} px · ` +
          (i.measured ? 'type measured in the page' : 'TYPE ESTIMATED (nothing was measured)');
        if (!i.cuts.length) { report.append(' · nothing cut'); return; }
        report.append(el('b', '', ` · ${i.cuts.length} shortened to fit:`));
        for (const c of i.cuts) {
          report.append(`\n    ${c.id} · its ${c.where} at ${Math.round(c.width)} px` +
                        `\n      ${c.full}\n      became  ${c.shown}`);
        }
      },
    });
    // 🔴 KEPT, BECAUSE `onRender` CANNOT ANSWER "WAS THIS ARROW DRAWN". It
    // reports sizes and cuts; whether a link reached the picture at all is a
    // question about the svg, and the one defect this page exists to catch here
    // is a link that is quietly not there.
    if (id) drew.set(id, made);
    return made;
  }

          { from: 'in', to: 'rec',
            note: 'The same sound again, on its way past the synthesiser to be kept. '
                + 'It runs in a lane because down the middle it would cross a box '
                + 'it never visits.' },
        ],
      };
      diagramCase(box, sibs, { id: 'siblings' });

  section('two return paths that must not overlap',
    'A return path runs UNDER the row, never back between the boxes. Two ' +
    'lines between the same pair of boxes and the eye cannot tell the way out ' +

    '',
    (box) => diagramCase(box, {

               'step, so they would cross. They are drawn at two depths instead.',
      nodes: [

        { id: 'pi', label: 'Raspberry Pi', sub: 'packs the sound', kind: 'device' },
        { id: 'cf', label: 'Cloudflare', sub: 'passes it on', kind: 'cloud' },

  // ── the fork, which is the case that was not drawable at all ────────────
  // 🔴 THE SAME SPEC TWICE, AT BOTH WIDTHS, BECAUSE ONE OF THEM USED TO LIE.
  // Every other block on this page draws its case once; this one cannot, since
  // a branch was correct left to right and FALSE in one column — a forward
  // link was a straight vertical at its source's centre and routed around
  // nothing, so the second branch ran behind the box between its two ends and
  // came out underneath it with an arrowhead in the next one. A phone read a

  section('a branch, and the box it must not be drawn through',
    'The same four settings go to a copy of the machine in this page and out ' +

    'outside rather than drawn through it: over the row when the picture runs ' +

    (box) => {

        // ⚠️ SHORT SUBS, MEASURED RATHER THAN PREFERRED. These were 17 to 19
        // characters and at 258 px the drawer reported ALL FOUR of them cut —
        // a picture shortening the names of the things it is about. The
        // shortening is the signal, not a width to tune around, so the words

        nodes: [
          { id: 'you', label: 'this page', sub: 'one copy here', kind: 'here' },
          { id: 'near', label: 'copy here', sub: 'same settings' },
          { id: 'cf', label: 'Cloudflare', sub: 'passes it on', kind: 'cloud' },
          { id: 'pi', label: 'Raspberry Pi', sub: 'a copy there', kind: 'device' },
        ],
        links: [
          { from: 'you', to: 'near', label: 'settings' },
          { from: 'you', to: 'cf', label: 'and out' },
          // ⚠️ `the same` RATHER THAN `the same sound`, MEASURED. A gutter is
          // sized by the widest name in it, so a longer one here would take
          // the width straight out of the boxes — and this block's subs were
          // already cut down once for exactly that. Eight characters is under

          { from: 'cf', to: 'pi', label: 'four settings' },
          { from: 'pi', to: 'cf', label: 'sound', back: true },
          { from: 'cf', to: 'you', label: 'sound back', back: true },

  section('the same picture at the width of a phone',
    'Below about 560 px the whole thing becomes one column, top to bottom, in ' +
    'the order the signal takes, and the return paths move to the left-hand ' +
    'gutter. A left-to-right diagram on a phone is a diagram nobody reads. ' +
    'Nothing in the description changes; only the drawing does.',
    '',
    (box) => diagramCase(box, {
      title: 'a key press, and what it costs',
      caption: 'The same four links as the first block, at 320 px.',
      nodes: [
        { id: 'you', label: 'your browser', sub: 'a key press', kind: 'here',
          note: 'The browser you are reading this in. It sends **one number** and '
              + 'waits.' },
        { id: 'relay', label: 'Cloudflare', sub: 'passes messages on', kind: 'cloud',
          note: 'A computer rented by the hour. It **changes nothing** on the way '
              + 'through.' },
        { id: 'box', label: 'Raspberry Pi', sub: 'plays the note', kind: 'device',
          note: 'A small board in the studio, reached **only through the rented '
              + 'computer**.' },
      ],
      links: [
        { from: 'you', to: 'relay', label: 'note number' },
        { from: 'relay', to: 'box', label: 'note number' },
        { from: 'box', to: 'relay', label: 'sound', back: true },
        { from: 'relay', to: 'you', label: 'sound back', back: true },
      ],
    }, { phone: true }));

  // ── table ───────────────────────────────────────────────────────────────
  // 🔴 IT WAS NOT IN HERE, AND IT IS USED ON FOUR PAGES. REPORTED in those
  // words. A component the sandbox does not show is a component nobody can
  // check against another page's copy of it, which is the one thing this page
  // exists to make possible.
  section('rows in columns you declare',
    'Every column is named by the caller: a width or a share of what is left, an '
    + 'alignment, a link, and whether the text may be cut. It THROWS unless exactly '
    + 'one column grows, because two growing columns is a layout nobody asked for '
    + 'and none is a table that does not fill its box.',
    `createTable({ columns: [
  { key: 'dir',  width: 52, hi: true },
  { key: 'text', grow: true },
  { key: 'sent', width: 42, align: 'right' }] })`,
    (box) => {
      box.classList.add('kit-wide');
      const t = createTable({
        columns: [
          { key: 'dir', width: 52, label: 'state', hi: true },
          { key: 'text', grow: true, label: 'what happened' },
          { key: 'sent', width: 42, label: 'sent', align: 'right' },
        ],
        empty: 'nothing yet',
      });
      t.set([
        { dir: 'live', text: '14:42:24 \u00b7 Rehearsal moved to Thursday', sent: 'sent' },
        { dir: 'away', text: '13:29:16 \u00b7 Doors at seven, not half past', sent: '' },
        { dir: 'wait', text: '13:02:09 \u00b7 A title long enough to show what a growing column does with it', sent: '' },
      ]);
      box.append(t.el);
      // 🔴 THE NEGATIVE CONTROL, ON THE PAGE. The throw is this component's one
      // real rule, and a sandbox that only ever shows it working cannot tell you
      // it still refuses.
      let refused = 'IT WAS ACCEPTED';
      try { createTable({ columns: [{ key: 'a', grow: true }, { key: 'b', grow: true }] }); }
      catch (e) { refused = e.message; }
      box.append(el('div', 'kit-cut', `two growing columns: ${refused}`));
    });

  // ── readout ─────────────────────────────────────────────────────────────
  // 🔴 AN EVEN NUMBER OF CELLS, AND A PENDING ONE SHOWS AN EM DASH AND NOTHING
  // ELSE. The row is `auto-fit minmax(96px, 1fr)`, so a phone gets two columns
  // and an odd count leaves a hole of a different colour in the last row. The
  // repair is to CUT the weakest cell, never to pad with a blank: every odd
  // readout has one, usually a constant or something a neighbour implies.
  // `mount()` throws on an odd count so the suite catches it. And nothing
  // unmeasured prints as `0` or as a lone unit — `''`, `null` and `NaN` all
  // become one em dash with the unit hidden, because a zero reads as a very
  // confident measurement and a bare `%` reads as a number that went missing.
  section('readout cells',
    '',
    `d.set('latency', 26.2);  d.set('holes', 3, 'warn')
an even number of cells · nothing measured yet is an em dash, never 0`,
    (box) => {
      const r = el('div', 'pos-readout');
      for (const [k, v, u, state] of [['latency', '26.2', 'ms', 'ok'], ['holes', '3', '', 'warn'], ['lost', '0', '', ''], ['worst', '', 'ms', 'pending']]) {
        const c = el('div', 'pos-cell');
        c.append(el('div', 'pos-k', k));
        // ⚠️ THE UNIT GOES INSIDE THE VALUE, which is what shell.mjs does —
        // `.pos-v` is display:block, so a unit next to it as a SIBLING drops to a
        // line of its own with the value's whole line-height between them. The
        // sandbox existing to catch drift and then drifting itself is the joke
        // that writes itself; it is nested now, like the real one.
        const val = el('span', 'pos-v', v);
        if (state) val.dataset.state = state;
        if (u) val.append(el('span', 'pos-u', u));
        c.append(val); r.append(c);
      }
      box.style.display = 'block'; box.append(r);
    });

  // ── presence ────────────────────────────────────────────────────────────
  // 🔴 FOUR STATES, AND THE FOURTH IS THE HONEST ONE. A badge that opens on
  // `offline` is a page asserting a measurement of hardware in another building
  // that it has not taken, and it is wrong exactly in the two seconds somebody
  // is watching. The specimens below are FOUR SEPARATE BADGES rather than one
  // pressed through four states, because the checks at the bottom measure them
  // and a check that drives a control is a check a visitor watches happen.
  section('what the colours mean',
    '',
    `grey = not played · slate = played, unmeasurable
green = inside what it promised · amber/red = later`,
    (box) => {
      for (const [name, css, why] of [
        ['grey', 'var(--dim2)', 'not played'],
        ['slate', 'var(--dim)', 'played, unmeasurable'],
        ['green', 'var(--ok)', 'inside what it promised'],
        ['amber', 'var(--warn)', 'later than promised'],
        ['red', 'var(--bad)', 'later still, or wrong'],
        ['yellow', 'var(--hi)', 'the one thing this page is about'],
      ]) {
        const chip = el('span', '', null);
        chip.style.cssText = `display:inline-block;width:14px;height:14px;border-radius:3px;background:${css};vertical-align:-2px;margin-right:7px`;
        const w = el('span', '', null);
        w.style.cssText = 'font:400 12px/1.6 var(--mono);color:var(--dim);margin-right:18px';
        w.append(chip, `${name} · ${why}`);
        box.append(w);
      }
    });

  // ── what a machine can say about this page ──────────────────────────────
  //
  // 🔴 THIS PAGE WAS THE ONE THE SUITE COULD NOT SEE. Its whole job is to make
  // component drift visible, and `node demo/verify.mjs kit` answered "nothing
  // for this harness to verify" — so the drift it exists to catch had to be
  // caught by somebody looking. Every check below grades a defect that has
  // ACTUALLY happened here, which is the only reason any of them is worth the
  // run time.
  //
  // ⚠️ THEY RUN AFTER A FRAME. Two of them measure laid-out geometry, and
  // `getBoundingClientRect` before the first paint answers about a page that
  // has not been arranged yet.
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

  // 1 — every block built. A component that throws takes the page with it when
  // the error escapes, which turns one broken control into a blank page.
  d.assert('every block on this page built',
    built.length > 0 && failed.length === 0,
    failed.length ? `${failed.length} did not: ${failed.join(' · ')}`
                  : `${built.length} blocks, none threw`);

  // 2 — 🔴 THE LEFT EDGES. Reported THREE TIMES on a real page and the third
  // report was a different bug wearing the first one's clothes: a component
  // swap moved the class a rule was keyed on, the sharing call went on setting
  // a custom property nothing consumed, and the row snapped back to the width
  // of one word while the code and the comment beside it both read as correct.
  // Measured ink, not arithmetic about ink.
  //
  // ⚠️ A PAIRED GROUP IS TWO COLUMNS ON PURPOSE, so "one left edge" is the
  // wrong claim about it and grading it that way reported 355 px apart about a
  // layout doing exactly what it was asked. It gets the claim that IS true of
  // it: two columns, and every label in a column on one edge. First written the
  // other way, which is how the difference got noticed.
  const leftsIn = (g) => [...g.querySelectorAll('.sld-l')]
    .map((n) => Math.round(n.getBoundingClientRect().left));
  const spreadOf = (xs) => (xs.length > 1 ? Math.max(...xs) - Math.min(...xs) : 0);

  const stackedGroups = [...document.querySelectorAll('.kit-box .sld-group:not(.pos-pair)')];
  let stackedWorst = 0, stackedLabels = 0;
  for (const g of stackedGroups) {
    const xs = leftsIn(g);
    stackedLabels += xs.length;
    stackedWorst = Math.max(stackedWorst, spreadOf(xs));
  }
  d.assert('sliders stacked in one group start their labels at the same left edge',
    stackedLabels > 1 && stackedWorst <= 1,
    stackedLabels > 1
      ? `${stackedLabels} labels in ${stackedGroups.length} group(s), worst ${stackedWorst} px apart`
      : 'no stacked slider labels were found, so nothing was compared');

  const pairGroups = [...document.querySelectorAll('.kit-box .sld-group.pos-pair')];
  let pairCols = 0, pairWorst = 0;
  for (const g of pairGroups) {
    const xs = leftsIn(g);
    const cols = new Map();
    for (const x of xs) {
      const key = [...cols.keys()].find((k) => Math.abs(k - x) <= 1);
      (cols.get(key ?? x) ?? cols.set(x, []).get(x)).push(x);
    }
    pairCols = Math.max(pairCols, cols.size);
    for (const col of cols.values()) pairWorst = Math.max(pairWorst, spreadOf(col));
  }
  d.assert('and a two-across group keeps exactly two of them, one per column',
    pairGroups.length > 0 && pairCols === 2 && pairWorst <= 1,
    pairGroups.length
      ? `${pairGroups.length} paired group(s), ${pairCols} column(s), worst ${pairWorst} px within one`
      : 'no paired group was found, so nothing was compared');

  // 3 — the readout specimen. An odd count leaves the last row short, and a
  // cell with nothing in it must show one em dash with its unit HIDDEN: an
  // empty value beside a standing `%` reads as a number that went missing, and
  // a pre-set 0 reads as a very confident measurement of nothing.
  const cells = [...document.querySelectorAll('.kit-box .pos-readout .pos-cell')];
  const pending = cells.map((c) => c.querySelector('.pos-v[data-state="pending"]')).filter(Boolean);
  const unitShown = pending.some((v) => {
    const u = v.querySelector('.pos-u');
    return u && getComputedStyle(u).display !== 'none';
  });
  d.assert('the readout specimen has an even number of cells and hides the unit of an unmeasured one',
    cells.length > 0 && cells.length % 2 === 0 && pending.length > 0 && !unitShown,
    `${cells.length} cells, ${pending.length} unmeasured, unit ${unitShown ? 'STILL SHOWING' : 'hidden'}`);

  // 4 — 🔴 THE NEGATIVE CONTROL FOR IT, and it is the reason the rule holds at
  // all: `mount()` REFUSES an odd count rather than trusting every page to
  // remember. A rule enforced by nothing is a rule that is already broken
  // somewhere. Called in a try, because passing is the throw.
  let odd = null;
  try {
    mount({ name: 'kit-probe', readout: { a: '', b: '', c: '' } });
    odd = 'it was accepted';
  } catch (e) { odd = e.message; }
  d.assert('NEGATIVE CONTROL: a readout with an odd number of cells is refused',
    odd !== 'it was accepted', odd);

  // 5 — the diagram grades both directions. A cuts report that can only ever
  // say "nothing cut" is not a measurement of anything: the picture built out
  // of deliberately unwritable labels has to come back with cuts, and the one
  // written properly has to come back with none.
  const fits = drawn.get('fits');
  const tooLong = drawn.get('too-long');
  d.assert('a diagram whose labels fit reports nothing shortened',
    !!fits && fits.measured && fits.cuts.length === 0,
    fits ? `${fits.width} px, type ${fits.measured ? 'measured' : 'ESTIMATED'}, ${fits.cuts.length} cut`
         : 'that picture never rendered');
  d.assert('NEGATIVE CONTROL: and one written too long reports every label it shortened',
    !!tooLong && tooLong.cuts.length > 0,
    tooLong ? `${tooLong.cuts.length} shortened: ${tooLong.cuts.map((c) => c.id).join(', ')}`
            : 'that picture never rendered');

  // 6 — 🔴 A LINK ASKED FOR AND NOT DRAWN, WHICH IS THE ONE DEFECT A PICTURE
  // CANNOT SHOW YOU. An arrow between two boxes in one container used to be
  // thrown away: the diagram still looked complete, because the plain tie
  // between those boxes stood exactly where the arrow should have been, and
  // /station/ lost three real arrows that way without anybody noticing. So this
  // counts the lines rather than looking at them — three links declared must be
  // three arrows on the picture, and the ONE gap nothing was declared across
  // must still have its tie. Both numbers matter: three arrows and two ties
  // would mean the arrow had been drawn on top of the bracket it replaces.
  const arrowsAndTies = (a) => a && {
    arrows: a.svg.querySelectorAll('.pos-dg-link').length,
    ties: a.svg.querySelectorAll('.pos-dg-tie').length,
  };
  const wide = arrowsAndTies(drew.get('siblings'));
  const narrow = arrowsAndTies(drew.get('siblings-phone'));
  const tally = (x) => (x ? `${x.arrows} arrows, ${x.ties} ties` : 'never rendered');
  d.assert('an arrow between two boxes in one machine is drawn, and it replaces their tie',
    !!wide && !!narrow && wide.arrows === 3 && wide.ties === 1
    && narrow.arrows === 3 && narrow.ties === 1,
    `left to right: ${tally(wide)} · one column: ${tally(narrow)}`);

  // 7 — 🔴 THE PRESENCE BADGE IS THE SAME WIDTH IN ALL FOUR STATES, which is
  // this project's standing rule about anything that redraws: a live sentence
  // under a picture reflowed between three and four lines and was reported as
  // "a horrible jump of content each time it updates". A badge whose word goes
  // from `online` to `coming online` would shove whatever sits to its right
  // every time a board answered.
  //
  // ⚠️ FOUR BADGES, NOT ONE PRESSED THROUGH FOUR STATES. The claim is identical
  // and this way nothing a visitor is looking at moves while it is graded,
  // which is the other rule: a check that mutates is the test.
  {
    // 🔴 ONE BADGE, WALKED. This compared four badges side by side, which is a
    // different claim and a weaker one: what must never happen is a badge
    // changing width UNDER A READER as the thing it watches comes and goes.
    // Four fixed specimens now sit at their own widths on purpose, so comparing
    // them would measure the reserve rather than the guarantee.
    const w = [];
    for (const s of PRESENCE_STATES) {
      presLive.set(s);
      w.push([s, presLive.el.getBoundingClientRect().width]);
    }
    presLive.set('online');
    const spread = Math.max(...w.map(([, x]) => x)) - Math.min(...w.map(([, x]) => x));
    d.assert('one badge is the same width in every state it can be in',
      w.length === PRESENCE_STATES.length && spread <= 0.5,
      w.length === PRESENCE_STATES.length
        ? `${w.map(([s, x]) => `${s} ${x.toFixed(1)}`).join(' · ')} px, spread ${spread.toFixed(2)}`
        : `${w.length} states were measured of ${PRESENCE_STATES.length}, so nothing was compared`);
  }

  // 8 — 🔴 AND THE ANIMATION CANNOT MOVE ANYTHING EITHER, which is a separate
  // claim from the one above: the reserve fixes the four states against each
  // other, this fixes every frame of the breathing dot against itself. Read off
  // the KEYFRAMES rather than off two measurements a moment apart, because a
  // property that moves the layout for one frame in eighty is a defect two
  // rects would only catch by luck.
  {
    const after = (s) => getComputedStyle(presSpec.get(s).querySelector('.pos-pres-dot'), '::after');
    const moving = PRESENCE_STATES.filter((s) => (after(s).animationName || 'none') !== 'none');
    // Both moving states are meant to share ONE keyframe, so take the name only
    // when they agree: two different animations here would be two ways of
    // saying "something is happening", which is the drift this page exists for.
    const names = new Set(moving.map((x) => after(x).animationName));
    const name = names.size === 1 ? [...names][0] : null;
    // Every declaration in every keyframe of it, out of the one stylesheet.
    const props = new Set();
    for (const sheet of document.styleSheets) {
      let rules = [];
      try { rules = [...sheet.cssRules]; } catch { continue; }   // never cross-origin here
      for (const r of rules) {
        if (r.type !== CSSRule.KEYFRAMES_RULE || r.name !== name) continue;
        for (const k of r.cssRules) for (const p of k.style) props.add(p);
      }
    }
    const only = props.size > 0 && [...props].every((p) => p === 'opacity');
    /**
     * 🔴 THE TWO AXES, AS A CHECK. Colour says what is KNOWN and motion says
     * something is HAPPENING, so exactly two states move: `checking`, which is
     * this page asking, and `coming`, which is the instrument starting. The
     * three settled ones are still. Both moving states share one keyframe, and
     * that keyframe may touch nothing but opacity, or a breathing dot could
     * shove its neighbour once every eighty frames.
     */
    d.assert('exactly the two unsettled states move, and they move nothing but opacity',
      moving.join(',') === 'checking,coming' && only,
      `${moving.length ? moving.join(', ') : 'nothing'} moves · ${name || 'no keyframes'} touches `
      + `${props.size ? [...props].join(', ') : 'nothing this page can read'}`);
  }

  // 9 — the four states are told apart by the DOT, not by the word beside it.
  // Two states that differ only in their label are two states nobody reads,
  // which undoes the whole reason there are four. Measured ink: the ring's
  // colour, the fill's colour, the fill's opacity and whether it moves.
  {
    const ink = (s) => {
      const dot = presSpec.get(s).querySelector('.pos-pres-dot');
      const a = getComputedStyle(dot, '::after');
      return [getComputedStyle(dot).borderTopColor, a.backgroundColor,
        Math.round(Number(a.opacity)), a.animationName || 'none'].join(' ');
    };
    const inks = PRESENCE_STATES.map(ink);
    d.assert('and the five are told apart by the dot alone, with the word covered up',
      new Set(inks).size === PRESENCE_STATES.length,
      PRESENCE_STATES.map((s, i) => `${s}: ${inks[i]}`).join(' · '));
  }

  // 10 — 🔴 A DOT WHOSE MEANING IS ONLY A COLOUR IS A DOT A SCREEN READER
  // CANNOT READ. `display: none` on the word is how that happens by accident,
  // so the embedded mode CLIPS it instead: still in the accessibility tree,
  // still in the live region, and out of the flow so it costs the host nothing.
  {
    const dotMode = document.querySelector('.kit-box .pos-pres[data-mode="dot"]');
    const wordEl = dotMode?.querySelector('.pos-pres-w');
    const readable = !!wordEl && getComputedStyle(wordEl).display !== 'none'
      && wordEl.textContent.trim().length > 0;
    const wide = dotMode ? dotMode.getBoundingClientRect().width : -1;
    d.assert('an embedded dot still says its state in words, and still takes only a dot of room',
      readable && wide > 0 && wide <= 10,
      dotMode ? `says "${wordEl.textContent}", lays out ${wide.toFixed(1)} px wide`
              : 'no embedded dot was found, so nothing was compared');
  }

  // 11 — 🔴 NOTHING DRAGS THE PAGE SIDEWAYS. `min-width: 0` missing from a
  // scrolling row makes it push the whole document instead of scrolling inside
  // itself: MEASURED at 390 px, a tabs row produced 141 px of page overflow.
  // The document, not the element, is the thing to measure, because the element
  // looks fine in exactly the case that is broken.
  const over = document.documentElement.scrollWidth - document.documentElement.clientWidth;
  d.assert('no block drags the page sideways',
    over <= 0,
    over <= 0 ? `${document.documentElement.clientWidth} px wide, nothing overflowing`
              : `${over} px of horizontal overflow`);

  // 12 — 🔴 JOINED IS ONE SURFACE, AND IT TAKES TWO MEASUREMENTS TO SAY SO.
  // A border is the easiest thing in this arrangement to draw twice: the
  // readout and the log both carry `border: 1px solid var(--line)` of their
  // own on every other page, and the joined box has to take those off or the
  // log sits inside a double rule with a stray line under the readout.
  // ⚠️ THE SEAM CANNOT SEE THAT, WHICH IS WHY THE WIDTHS ARE READ TOO.
  // MEASURED by putting the defect back on purpose: with the inner borders
  // restored the seam still read **1.0 px** and only the widths moved, 0 and 0
  // to 1 and 1 — because a border is drawn INSIDE the box's own rectangle, so
  // two halves 1 px apart stay 1 px apart however thick their edges are. The
  // seam proves the gap is the mosaic's, the widths prove there is one edge.
  const px = (e, side) => Number.parseFloat(getComputedStyle(e)[`border${side}Width`]);
  // ⚠️ AND THE SECOND HALF OF WHAT JOINED MEANS IS WHERE IT SITS: at the FOOT,
  // 44 px under the page rather than the 22 px between two ordinary rows. That
  // number is the diagram's, for the diagram's reason — a surface the page
  // hands over to is a new part of the page, not another row in it — and it is
  // declared once, on `.pos-report` in shell.css. It is measured here from a
  // real `.pos-body`, and the split block below measures the 22 it is NOT.
  {
    const rep = joinedSpec?.foot;
    const ro = joinedSpec?.readoutEl.getBoundingClientRect();
    const lo = joinedSpec?.logEl.getBoundingClientRect();
    const seam = ro && lo ? lo.top - ro.bottom : -1;
    const foot = rep && joinedPage
      ? rep.getBoundingClientRect().top - joinedPage.getBoundingClientRect().bottom : -1;
    const outer = rep ? px(rep, 'Top') : -1;
    const inner = joinedSpec ? [px(joinedSpec.readoutEl, 'Bottom'), px(joinedSpec.logEl, 'Top')] : [-1, -1];
    d.assert('joined is one box at the foot of the page, with the two halves one pixel apart',
      !!rep && rep.classList.contains('pos-report')
      && rep.contains(joinedSpec.readoutEl) && rep.contains(joinedSpec.logEl)
      && Math.abs(seam - 1) <= 0.5 && Math.abs(foot - 44) <= 0.5
      && outer === 1 && inner[0] === 0 && inner[1] === 0,
      `${foot.toFixed(1)} px under the page · seam ${seam.toFixed(1)} px · `
      + `one edge of ${outer} px round both, ${inner.join(' and ')} inside`);
  }

  // 13 — and the default is still two surfaces with the page between them, at
  // the shell's own 22 px. Both halves of the claim matter: 22 px is the
  // rhythm every other element on every page gets, and it is what would read
  // wrong inside a joined box.
  // ⚠️ THE TWO GAPS COME FROM DIFFERENT RULES AND ONLY ONE OF THEM IS THE
  // READOUT'S. Above the page it is `.pos-readout`'s own bottom margin; below
  // the page it is `.pos-body`'s, which is why the stand-in in that block IS a
  // `.pos-body`. The log asks for nothing — a `.pos-log { margin-top: 22px }`
  // stood in shell.css and was inert, beaten by a `margin` shorthand later in
  // the same file, and this measurement is what found it.
  {
    const mid = splitPage?.getBoundingClientRect();
    const ro = splitSpec?.readoutEl.getBoundingClientRect();
    const lo = splitSpec?.logEl.getBoundingClientRect();
    const above = mid && ro ? mid.top - ro.bottom : -1;
    const below = mid && lo ? lo.top - mid.bottom : -1;
    const own = splitSpec ? px(splitSpec.readoutEl, 'Top') === 1 && px(splitSpec.logEl, 'Top') === 1 : false;
    d.assert('split leaves two surfaces, each with its own edge and the page rhythm between them',
      own && splitSpec.report === null
      && !splitSpec.readoutEl.closest('.pos-report') && !splitSpec.logEl.closest('.pos-report')
      && Math.abs(above - 22) <= 0.5 && Math.abs(below - 22) <= 0.5,
      `${above.toFixed(1)} px above the page and ${below.toFixed(1)} px below it, ${own ? 'two edges' : 'NOT two edges'}`);
  }

  // 14 — 🔴 HALF A SURFACE IS NOT HALF A BOX. A page that declares no readout
  // and joins anyway must get one bordered box holding a log, with no seam and
  // no empty strip where the cells would have been. A `display: none` child
  // takes no `gap` in a flex column, so the log starts exactly one border
  // inside the box; anything else means the hidden row is still taking room.
  {
    const rep = logOnlySpec?.foot;
    const drop = rep ? logOnlySpec.logEl.getBoundingClientRect().top - rep.getBoundingClientRect().top : -1;
    const gone = logOnlySpec ? getComputedStyle(logOnlySpec.readoutEl).display === 'none' : false;
    d.assert('a joined surface with no readout is one box with no seam in it',
      !!rep && gone && Math.abs(drop - 1) <= 0.5,
      `the log starts ${drop.toFixed(1)} px inside the box, which is its edge and nothing else`);
  }

  // 15 — 🔴 AND WITH NEITHER HALF, NO BOX. This is the `/typist/` defect in the
  // joined arrangement: an empty container painting its own two borders as a
  // full-width band nobody wrote. `createReport` returns no surface at all, so
  // there is nothing for a page to append and nothing to paint.
  d.assert('and with neither half to draw, nothing is put on the page at all',
    !!neitherSpec && neitherSpec.foot === null && neitherSpec.report === null
    && !document.body.contains(neitherSpec.readoutEl) && !document.body.contains(neitherSpec.logEl),
    neitherSpec && neitherSpec.foot === null
      ? 'no surface was returned, so there is no box to paint'
      : 'an empty surface was returned and would draw its own two edges');

  d.ready();

</script>
</html>
