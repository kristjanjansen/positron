<!doctype html>

<title>Mirror shader</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* The picture at half the content width (asked 2026-10-12, *"1/2
     videpanel"*), the whole width on a phone. The program sits under the
     knob, not beside the picture (*"shader code box is below parameters"*). */
  .cc-half { width: calc(50% - 8px); }
  @media (max-width: 560px) { .cc-half { width: 100%; } }
  .cc-half canvas { display: block; width: 100%; height: 100%; }
  .cc-say { font-size: 12px; color: var(--dim); }
  .pos-vp-foot .cc-say { white-space: nowrap; overflow: hidden; }
</style>
<script type="module">
  import { conceptNav, CODE_ROWS } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createKnob } from '/shell/knob.mjs';
  import { createKnobGrid } from '/shell/knob-grid.mjs';
  import { createCodeBox } from '/shell/code-box.mjs';
  import { PARAM_HUES } from '/shell/code-lang.mjs';
  import { createCompileIdle } from '/shell/compile-idle.mjs';

  // /mirror/'s kaleidoscope, running in this tab, with one parameter left.
  // Asked 2026-10-12: *"use same shader you have in mirror demo, just less
  // parameters"*. The knob is a node of its own, `web:knob-segments`, cabled
  // into `web:shader:value-in`, and the shader reads `uSegments` only off that
  // link, so a turn is a value crossing a wire. The shader makes its own
  // picture, so nothing feeds its video side and there is no source node.
  //
  // THE TEXT IS /mirror/'s `FS_BODY`, TOKEN FOR TOKEN, with three changes:
  // - `uSeg` is `uSegments` (asked 2026-10-12, *"uSeg -> uSegments, Mirros
  //   param -> Segments"*); v3dpipe sets both names from its `seg`;
  // - /mirror/'s own lines, with one long line broken in two and the uniform
  //   line split (whitespace only);
  // - `uFb`, `uScale`, `uWarp` and `uHue` are `const` at /mirror/'s own
  //   values (0.78 and 0.08 are what its `paint()` hard-codes, 4 and 1 are
  //   the `mid` and `full` its GRAIN and HUE controls open on).
  // `uT` is a frame counter over 30, as /mirror/ and the C drive it, and the
  // feedback tap reads the previous frame through the same two-target
  // ping-pong. /mirror/'s look crossfade and headset copy are not here.
  //
  // ⚠️ `uSegments` IS THE NUMBER OF WEDGES THE ANGLE IS FOLDED INTO, which
  // /mirror/'s control calls `mirrors` and offers as 2, 8 and 24 (8 is its
  // default). The knob gives it 1 to 32 directly. At 1 the fold is a single
  // mirror down the horizontal; every N is N-fold symmetric.
  //
  // NOTHING OPENS ON A VISIT: no camera, no fetch, no room.
  const S = 'web';
  const SH_OUT = `${S}:shader:video-out`, SH_VAL = `${S}:shader:value-in`;
  const SCREEN = `${S}:screen:video-in`;
  const KNOB_OUT = `${S}:knob-segments:value-out`;
  const W = 640, H = 360;          // /mirror/'s own render size

  const d = mount({ name: 'Mirror shader', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('shader/mirror');

  // ── the program, the one string both the GL and the box are given ────────
  const VS = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;
  const FS = `#version 300 es
precision highp float;
uniform float uT; uniform vec2 uRes; uniform sampler2D uPrev;
uniform float uSegments;  // value-in
// /mirror/'s defaults, fixed here:
const float uFb = 0.78;    // feedback
const float uScale = 4.0;  // grain, mid
const float uWarp = 0.08;
const float uHue = 1.0;    // hue, full
out vec4 o;
float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h(i), h(i + vec2(1,0)), f.x),
    mix(h(i + vec2(0,1)), h(i + vec2(1,1)), f.x), f.y); }
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  float a = atan(uv.y, uv.x), r = length(uv), seg = 6.2831853 / uSegments;
  a = abs(mod(a + 0.5 * seg, seg) - 0.5 * seg);
  vec2 k = vec2(cos(a), sin(a)) * r;
  float w = n(k * uScale + uT * 0.3) + 0.5 * n(k * uScale * 2.0 - uT * 0.2)
    + 0.25 * n(k * uScale * 4.0 + uT * 0.5);
  vec2 dd = k + uWarp * vec2(cos(w * 6.2831), sin(w * 6.2831));
  vec3 c = 0.5 + 0.5 * cos(6.2831 * (w + vec3(0.0, 0.33, 0.67) * uHue) + uT);
  vec3 fb = texture(uPrev, dd * 0.9 + 0.5).rgb;
  o = vec4(mix(c, fb, uFb), 1.0); }`;

  // GLSL for the code box, page local (a kit candidate). `params` marks the
  // knob's uniform, so its declaration and every use wear the knob's hue.
  const GLSL = {
    name: 'glsl',
    rules: [
      [/\/\/[^\n]*/, 'comment'],
      [/\/\*[\s\S]*?(?:\*\/|$)/, 'comment'],
      [/#[a-z]+[^\n]*/, 'keyword'],
      [/\b(?:uniform|in|out|precision|highp|mediump|lowp|const|return|if|else|for|void)\b/, 'keyword'],
      [/\b(?:float|int|bool|vec[234]|ivec[234]|mat[234]|sampler2D)\b/, 'class'],
      [/\b(?:atan|abs|mod|cos|sin|length|texture|mix|floor|fract|dot|step|smoothstep|min|max|clamp)\b/, 'builtin'],
      [/\b\d+(?:\.\d*)?|\.\d+/, 'number'],
      [/[A-Za-z_]\w*/, ''],
    ],
    params(src) {
      const m = /uniform\s+float\s+(uSegments)\b/.exec(src);
      if (!m) return [];
      const from = m.index + m[0].length - m[1].length;
      return [{ name: 'uSegments', from, to: from + m[1].length, nameFrom: from, nameTo: from + m[1].length, kind: 'arg' }];
    },
  };
  const HUE = PARAM_HUES[0];

  // ── the shader node's one parameter, set only through value-in ──────────
  const P = { segments: null };
  let delivered = 0;
  function setParam(e) {
    if (e?.of !== 'param' || e.name !== 'segments') { d.log('the shader takes one parameter, segments, and this was not it', 'warn'); return; }
    P.segments = Math.min(32, Math.max(1, Math.round(e.v)));
    delivered++;
  }

  // ── the bay: knob, shader, screen ───────────────────────────────────────
  const bay = createBay();
  bay.addNode({ id: `${S}:knob-segments`, kind: 'person', label: 'knob', place: 'browser' });
  bay.addNode({ id: `${S}:shader`, kind: 'engine', label: 'mirror shader', place: 'browser' });
  bay.addNode({ id: `${S}:screen`, kind: 'screen', label: 'screen', place: 'browser' });
  bay.addPort({ id: KNOB_OUT, label: 'knob-segments:value-out', dir: 'out', medium: 'value', shape: { of: 'param', names: ['segments'] } });
  bay.addPort({ id: SH_VAL, label: 'shader:value-in', dir: 'in', medium: 'value',
    shape: { of: 'param', names: ['segments'] }, deliver: setParam });
  bay.addPort({ id: SH_OUT, label: 'shader:video-out', dir: 'out', medium: 'video', transports: ['page'] });
  bay.addPort({ id: SCREEN, label: 'screen', dir: 'in', medium: 'video' });

  const held = new Set();
  function hold(a, b) {
    bay.seen(a); bay.seen(b);
    const r = bay.link(a, b, [], { site: S });
    if (r.ok) held.add(`${a} ${b}`);
    else d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
  }
  const holds = (a, b) => held.has(`${a} ${b}`);
  hold(KNOB_OUT, SH_VAL);
  hold(SH_OUT, SCREEN);

  // ── the screen ──────────────────────────────────────────────────────────
  const canvas = el('canvas');
  canvas.width = W; canvas.height = H;
  const gl = canvas.getContext('webgl2', { alpha: false, antialias: false });
  // The footer says what draws the picture and how fast, as /mirror/'s does.
  // Asked 2026-10-12: *"mirror shader - repalce with what renders it and fps"*.
  // The knob already shows the mirror count.
  const name = el('span', 'cc-say', '');
  const count = el('span', 'cc-say', '');
  const panel = createVideoPanel({ media: canvas, left: name });
  panel.el.querySelector('.pos-vp-r').prepend(count);

  // `prog` and `fsShader` are the program running NOW. An edit that does not
  // compile or link leaves them alone, so the picture keeps the last good one.
  let prog = null, fsShader = null, vsShader = null, A = null, B = null, last = null;
  let U = {};
  /**
   * Build a program from fragment text. A good one is swapped in (new uniform
   * locations, the same feedback targets, the old program deleted); a bad one
   * changes nothing and answers `{ ok: false, error }` with the GL's own log.
   */
  function build(text) {
    if (!gl) return { ok: false, error: 'no WebGL2 here' };
    const fs = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fs, text); gl.compileShader(fs);
    if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) {
      const error = (gl.getShaderInfoLog(fs) || 'the shader did not compile').trim();
      gl.deleteShader(fs);
      return { ok: false, error };
    }
    const p2 = gl.createProgram();
    gl.attachShader(p2, vsShader); gl.attachShader(p2, fs);
    gl.linkProgram(p2);
    if (!gl.getProgramParameter(p2, gl.LINK_STATUS)) {
      const error = (gl.getProgramInfoLog(p2) || 'the shader did not link').trim();
      gl.deleteProgram(p2); gl.deleteShader(fs);
      return { ok: false, error };
    }
    if (prog) { gl.deleteProgram(prog); gl.deleteShader(fsShader); }
    prog = p2; fsShader = fs;
    gl.useProgram(prog);
    U = {};
    for (const u of ['uT', 'uRes', 'uPrev', 'uSegments']) U[u] = gl.getUniformLocation(prog, u);
    if (U.uRes) gl.uniform2f(U.uRes, W, H);
    if (U.uPrev) gl.uniform1i(U.uPrev, 0);
    compiles++;
    return { ok: true, knob: !!U.uSegments };
  }
  let compiles = 0;
  if (gl) {
    vsShader = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vsShader, VS); gl.compileShader(vsShader);
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    const r = String(dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER));
    name.textContent = (r.match(/Renderer:\s*([^,)]+)/)?.[1] ?? r.replace(/^ANGLE \(|\)$/g, '')).trim().slice(0, 24);
    gl.bindVertexArray(gl.createVertexArray());
    // The feedback tap, as /mirror/ does it: two targets, swapped every
    // frame, the previous one bound as `uPrev`. They outlive every program.
    const target = () => {
      const t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      for (const q of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER]) gl.texParameteri(gl.TEXTURE_2D, q, gl.LINEAR);
      for (const q of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T]) gl.texParameteri(gl.TEXTURE_2D, q, gl.CLAMP_TO_EDGE);
      const f = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, f);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
      return { t, f };
    };
    A = target(); B = target();
    const first = build(FS);
    if (!first.ok) d.log(`the shader did not compile: ${first.error}`, 'bad');
  } else d.log('this browser has no WebGL2, so there is no shader and the screen stays dark', 'bad');

  // The routing follows the links: no shader -> screen, the screen is the
  // page's ground; no value yet, the shader has no N and draws nothing.
  let i = 0;
  function render() {
    if (!gl) return;
    const ready = prog && holds(SH_OUT, SCREEN) && P.segments != null;
    if (!ready) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, W, H);
      gl.clearColor(11 / 255, 14 / 255, 20 / 255, 1); gl.clear(gl.COLOR_BUFFER_BIT);
      return;
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, B.f);
    gl.viewport(0, 0, W, H);
    if (U.uT) gl.uniform1f(U.uT, i / 30);
    i++;
    if (U.uSegments) gl.uniform1f(U.uSegments, P.segments);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, A.t);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, B.f);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
    gl.blitFramebuffer(0, 0, W, H, 0, 0, W, H, gl.COLOR_BUFFER_BIT, gl.NEAREST);
    last = B;
    [A, B] = [B, A];
  }
  let raf = 0, drawing = false;
  // Frames counted over the last second, written once a second.
  let n = 0, since = 0;
  function frame(t) {
    render();
    n++;
    if (!since) since = t;
    else if (t - since >= 1000) { count.textContent = `${(n * 1000 / (t - since)).toFixed(1)} fps`; n = 0; since = t; }
    raf = requestAnimationFrame(frame);
  }

  // ── the code box: the program itself, compiled once the typing stops ────
  // Asked 2026-10-12: *"can we make shader be in compiling codebox and be
  // editable?"*. The kit's idle compile, as /fau/ and /code/faust/
  // use it: `IDLE_MS` after the last keystroke, never two at once, `Compiling`
  // breathing in the box's corner and `Did not compile` left standing with
  // the GL's log in its `title` (and in the log below) while the last good
  // program keeps drawing.
  const code = createCodeBox({ language: GLSL, value: FS, rows: CODE_ROWS, label: '',
    hues: { hueOf: (n) => (n === 'uSegments' ? HUE : null) },
    ariaLabel: 'the fragment shader this page runs, edit it and it recompiles' });
  // ⚠️ A PROGRAM WITH NO `uSegments` COMPILES AND RUNS, AND THE KNOB THEN DRIVES
  // NOTHING. The kit's note has no state for "compiled, with a caveat", so the
  // page writes that one line into it once the compile has settled, and the
  // next compile paints over it as usual (a kit candidate, see the report).
  const NO_KNOB = 'No uSegments, the knob drives nothing';
  const idle = createCompileIdle({
    input: code.input,
    host: code.el,
    compile: (text) => {
      const out = build(text);
      if (!out.ok) d.log(`the edit did not compile, the last good shader keeps running: ${out.error}`, 'warn');
      else {
        d.log(out.knob ? 'the edit compiled and is running' : 'the edit compiled and is running, and has no uSegments, so the knob drives nothing',
          out.knob ? '' : 'warn');
        if (!out.knob) idle.settled().then(() => {
          if (U.uSegments || idle.state() !== 'idle') return;
          const note = idle.el;
          note.dataset.state = 'error';
          note.textContent = NO_KNOB;
          note.title = 'the program has no uniform float uSegments, so the segments knob has nothing to set';
          note.hidden = false;
        });
      }
      return out;
    },
  });

  panel.el.classList.add('cc-half');

  // ── the knob: its own node, a turn is one event on its value-out ────────
  // It opens on 8, /mirror/'s own default.
  const knob = createKnob({ label: 'segments', min: 1, max: 32, step: 1, value: 8, hand: true,
    format: (v) => `${Math.round(v)}`,
    onInput: (v) => bay.send(KNOB_OUT, { of: 'param', name: 'segments', v }) });
  // The knob wears the uniform's hue, so the box and the knob read as one name.
  knob.el.dataset.param = 'segments';
  knob.el.style.setProperty('--param-hue', HUE);
  const grid = createKnobGrid(new Map([['segments', knob]]), { row: true });

  const lit = (l) => drawing && l.from === SH_OUT;
  const pb = createPatchbay(bay, { flowing: lit });

  d.stack.add(panel.el, grid.el, code.el, pb.el);

  // The knob's starting value goes over the wire too, so the first N the
  // shader ever sees came along the link and not out of a default.
  bay.send(KNOB_OUT, { of: 'param', name: 'segments', v: knob.value() });
  if (prog) { drawing = true; raf = requestAnimationFrame(frame); pb.refresh(); }

  window.__demo.knobs = grid;
  window.__demo.shader = {
    knob,
    size: [W, H],
    source: () => (fsShader ? gl.getShaderSource(fsShader) : null),
    shown: () => code.value(),
    segments: () => P.segments,
    delivered: () => delivered,
    uniform: () => (prog && U.uSegments ? gl.getUniform(prog, U.uSegments) : null),
    compiles: () => compiles,
    idle,
    code,
    /** The last frame drawn, read off its target, so reading moves nothing. */
    pixels() {
      if (!last) return null;
      const px = new Uint8Array(W * H * 4);
      gl.bindFramebuffer(gl.READ_FRAMEBUFFER, last.f);
      gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
      return px;
    },
  };
  d.ready();
</script>
