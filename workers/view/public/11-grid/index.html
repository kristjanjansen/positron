<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .tier { font: 600 10px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase;
          color: var(--hi); margin: 12px 0 5px; }
  /* one grid, one size — there is no second row to differ from */
  .row { display: grid; gap: 5px; margin: 0 0 4px;
         grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); }
  .t { position: relative; aspect-ratio: 16/9; background: #000; border: 1px solid var(--line);
       border-radius: 3px; overflow: hidden; }
  .t canvas { width: 100%; height: 100%; display: block; }
  .t .n { position: absolute; left: 3px; bottom: 2px; font: 600 9px/1.3 var(--mono);
          color: var(--fg); background: #0b0e14aa; padding: 0 3px; border-radius: 2px; }
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';

  // ONE TIER. The featured/live/wall tiering is gone — no featured tile, no
  // capped live row, no cheap wall drawn at a lower rate. Every participant
  // gets the same box, the same backing store, and the same paint on every
  // tick, so there is no per-tile quality to argue about.
  //
  // What that costs is NOT visible here. These tiles are synthetic canvases,
  // so paint ms is a FLOOR: at 54 tiles it reads a fraction of a millisecond,
  // which says nothing about an SFU delivering and a device decoding 54
  // streams at full rate. The tiering existed because that part does not
  // scale (plan-m2m: N=54 = 106 tracks on one PeerConnection, SFU p50 flat
  // 122-137 ms — the SFU held, the client tier was the lever). Removing it
  // here removes it from the RENDER only. Do not read this page as evidence
  // that uniform quality is free end to end.

  const d = mount({
    n: '11',
    name: 'grid',
    what: 'N participants in one grid — every tile the same size, the same rate, the same quality.',
    readout: { n: '', tile: 'px', paint: 'ms' },
    controls: [
      { id: 'add', label: 'Add four', primary: true },
      { id: 'many', label: 'Go to 54' },
      { id: 'check', label: 'Run the checks' },
    ],
  });
  guard(d);

  d.el.append(el('div', 'tier', 'all participants, same quality'));
  const row = el('div', 'row');
  d.el.append(row);

  const parts = [];

  function addParticipant(i) {
    const c = el('canvas');
    c.width = 160; c.height = 90;          // same backing store for everyone
    const box = el('div', 't');
    box.append(c, el('span', 'n', `p${i}`));
    parts.push({ i, canvas: c, box, ctx: c.getContext('2d') });
  }

  function layout() {
    row.replaceChildren();
    for (const p of parts) row.append(p.box);
    d.set('n', parts.length);
    const w = row.firstChild ? Math.round(row.firstChild.getBoundingClientRect().width) : null;
    d.set('tile', w);
  }

  // Every tile, every tick. `painted` is what the checks assert on: the old
  // wall skipped frames on purpose, and the only proof that is gone is a count
  // of what the last tick actually drew.
  let paintEma = null, painted = 0;
  function paint() {
    const t0 = performance.now();
    const now = Date.now();
    let n = 0;
    for (const p of parts) {
      const g = p.ctx;
      g.fillStyle = '#151b26';
      g.fillRect(0, 0, 160, 90);
      g.fillStyle = '#ffd400';
      g.font = 'bold 15px ui-monospace, monospace';
      g.fillText(`p${p.i}`, 8, 26);
      g.fillStyle = '#2b3546';
      g.fillRect(8, 40, 144, 4);
      g.fillStyle = '#ffd400';
      g.fillRect(8, 40, ((now / 20 + p.i * 17) % 144), 4);
      n++;
    }
    painted = n;
    const ms = performance.now() - t0;
    paintEma = paintEma == null ? ms : paintEma * 0.9 + ms * 0.1;
    // 40 ms is the tick; past that the grid cannot hold its rate
    d.set('paint', Math.round(paintEma * 100) / 100,
      paintEma < 8 ? 'ok' : paintEma < 20 ? '' : 'bad');
  }

  d.on('add', () => { for (let k = 0; k < 4; k++) addParticipant(parts.length + 1); layout(); });
  d.on('many', () => {
    while (parts.length < 54) addParticipant(parts.length + 1);
    layout();
    d.log('54 participants, all at the same quality — paint ms is canvas only, not N decoded streams');
  });

  d.on('check', () => {
    d.assert('participants present', parts.length > 0, String(parts.length));
    d.assert('every participant has a tile', row.children.length === parts.length,
      `${row.children.length}/${parts.length}`);
    const boxes = [...row.children].map((b) => b.getBoundingClientRect());
    const w = boxes.map((r) => Math.round(r.width));
    const h = boxes.map((r) => Math.round(r.height));
    d.assert('every tile the same width', new Set(w).size <= 1, w.slice(0, 8).join(','));
    d.assert('every tile the same height', new Set(h).size <= 1, h.slice(0, 8).join(','));
    // one backing store size for all — a smaller canvas would be a quality tier
    // by another name, which is exactly what this demo no longer has
    const res = parts.map((p) => `${p.canvas.width}x${p.canvas.height}`);
    d.assert('every tile the same resolution', new Set(res).size <= 1, res[0] ?? '—');
    d.assert('the last tick painted every tile', painted === parts.length,
      `${painted}/${parts.length}`);
    d.assert('paint cost reported', paintEma != null, `${Math.round(paintEma * 100) / 100} ms`);
    d.assert('paint fits the 40 ms tick', paintEma != null && paintEma < 40,
      `${Math.round(paintEma * 100) / 100} < 40 ms`);
  });

  for (let k = 0; k < 4; k++) addParticipant(k + 1);
  layout();
  setInterval(paint, 40);
  d.log('one grid: every participant the same size, the same rate, the same quality');
  d.ready();
</script>
</html>
