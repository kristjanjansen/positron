<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">

<script type="module">
  import { mount, guard } from '/shell/shell.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { openWire } from '/shell/wire.mjs';

  /*
   * 🔴 A PROJECTION WALL ANY SCREEN CAN BECOME, asked 2026-10-04 after *"how
   * universl patchbay and timeline relate"*: the smallest step is a timeline
   * lane with a destination, and a destination has to exist first. Open this on
   * a projector, a television's browser or a phone and it joins the studio's
   * room as a patchbay node with one `light` input (a `value` of three
   * channels). `/partitur/` links its light lane to it; `/patchbay/` draws it.
   * ⚠️ IT ONLY LISTENS AND PAINTS. It asks nobody for anything, and a colour
   * arrives only because somebody linked a lane to this wall.
   */
  const ROOM = 'studio-1';
  const SITE = `wall-${Math.random().toString(36).slice(2, 6)}`;
  const PORT = `${SITE}:wall:light`;
  const WHAT = 'A screen that joins the studio’s patchbay as a projection wall and shows whatever light a timeline sends it.';

  const d = mount({
    name: 'wall',
    what: WHAT,
    readout: { colour: '', from: '' },
    controls: [],
  });
  guard(d);

  const canvas = document.createElement('canvas');
  const g = canvas.getContext('2d');
  const panel = createVideoPanel({ media: canvas, left: false });
  d.el.append(panel.el);
  let W = 0, H = 0, now = { hex: '#000000', parts: [] };
  function paint() {
    const r = panel.stage.getBoundingClientRect();
    W = canvas.width = Math.max(160, Math.round(r.width));
    H = canvas.height = Math.max(90, Math.round(r.height));
    g.fillStyle = now.hex;
    g.fillRect(0, 0, W, H);
    for (const p of now.parts || []) {
      const [a, b] = p.across || [0, 0.1];
      g.fillStyle = p.hex;
      g.fillRect(Math.round(a * W), 0, Math.max(2, Math.round((b - a) * W)), H);
    }
  }
  new ResizeObserver(paint).observe(panel.stage);

  const GRAPH = {
    v: 1, site: SITE, place: 'browser',
    nodes: [{ id: `${SITE}:wall`, kind: 'screen', label: `wall ${SITE.slice(5)}`, place: 'browser' }],
    ports: [{ id: PORT, label: `wall ${SITE.slice(5)}`, dir: 'in', medium: 'value', shape: { channels: 3 } }],
  };
  let me = null;
  const wire = openWire(ROOM, {
    onOpen: (from) => { me = from; wire.send({ type: 'graph.announce', graph: GRAPH }); d.log(`on the patchbay as ${PORT}`, 'ok'); },
    onMessage: (got) => {
      if (got.kind !== 'json' || got.msg.from === me) return;
      const m = got.msg;
      if (m.type === 'graph.ask') { wire.send({ type: 'graph.announce', graph: GRAPH }); return; }
      if (m.type === 'light.set' && m.to === PORT && /^#[0-9a-f]{6}$/i.test(m.hex || '')) {
        now = { hex: m.hex, parts: Array.isArray(m.parts) ? m.parts.filter((p) => /^#[0-9a-f]{6}$/i.test(p.hex || '')) : [] };
        paint();
        d.set('colour', m.name || m.hex);
        d.set('from', m.sender || '');
      }
    },
  });
  // Announce again now and then, so a patchbay that joins late hears this wall
  // without having to ask.
  setInterval(() => wire.send({ type: 'graph.announce', graph: GRAPH }), 10_000);

  d.assert('the wall describes itself as one light input on its own site', GRAPH.ports.length === 1 && PORT.startsWith(`${SITE}:`));
  d.assert('the description is one sentence', !/[;:]/.test(WHAT), WHAT);
  d.ready();
</script>
