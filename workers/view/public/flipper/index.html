<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* ONE grid, EQUAL cells. TV and radio are the same size on purpose: a radio
     station is a channel, not a smaller kind of channel. */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; margin: 0 0 10px; }
  .cell {
    position: relative; aspect-ratio: 16 / 9; background: #000;
    border: 1px solid var(--line); border-radius: 4px; overflow: hidden;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .cell.on { border-color: var(--hi); }
  .cell video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cell .lbl {
    position: absolute; left: 5px; bottom: 4px; z-index: 2;
    font: 600 10px/1.4 var(--mono); letter-spacing: .06em;
    color: var(--fg); background: #0b0e14aa; border-radius: 3px; padding: 1px 5px;
  }
  .cell.on .lbl { color: #0b0e14; background: var(--hi); }
  /* a radio cell draws its level instead of a picture */
  .cell .bars { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 2px; padding: 10px 8px 20px; }
  .cell .bars i { flex: 1; background: var(--line2); border-radius: 1px; height: 4%; }
  .cell.on .bars i { background: var(--hi); }
</style>
<script src="/proto/remixer/hls.min.js"></script>

<script type="module">
  import { mount, guard, el, armVideo, playOrPrompt } from '/shell/shell.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createStripView } from '/shell/strip.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { mediaMaster } from '/timeline/media-master.mjs';

  const DVR_MS = 2 * 60 * 60 * 1000;          // ERR keeps ~2 h

  const TV = [
    { id: 'etv', name: 'ETV', url: 'https://live.err.ee/live/etv.m3u8' },
    { id: 'etv2', name: 'ETV2', url: 'https://live.err.ee/live/etv2.m3u8' },
    { id: 'etvpluss', name: 'ETV+', url: 'https://live.err.ee/live/etvpluss.m3u8' },
  ];
  const RADIO = [
    { id: 'vikerraadio', name: 'Vikerraadio' },
    { id: 'raadio2', name: 'Raadio 2' },
    { id: 'klassikaraadio', name: 'Klassikaraadio' },
    { id: 'raadio4', name: 'Raadio 4' },
    { id: 'raadiotallinn', name: 'Raadio Tallinn' },
  ];

  const d = mount({
    name: 'flipper',
    what: 'Eight live ERR channels in equal cells. One plays at a time; the bar scrubs its 2 h DVR.',
    readout: { channel: '', behind: 's', blocked: 'min', state: '' },
    controls: [
      { id: 'start', label: 'Start channels', primary: true },
      { id: 'live', label: 'Jump to live edge' },
      { id: 'check', label: 'Run the checks' },
    ],
  });
  guard(d);

  // ── the grid ────────────────────────────────────────────────────────────
  const grid = el('div', 'grid');
  d.el.append(grid);

  const chans = [];
  for (const ch of TV) {
    const cell = el('div', 'cell');
    const v = el('video', '', null, { playsinline: '', muted: '', preload: 'none' });
    v.muted = true;
    cell.append(v, el('span', 'lbl', ch.name));
    grid.append(cell);
    chans.push({ ...ch, kind: 'tv', cell, media: v, hls: null });
  }
  for (const ch of RADIO) {
    const cell = el('div', 'cell');
    const bars = el('div', 'bars');
    for (let i = 0; i < 12; i++) bars.append(el('i'));
    // MUTED AT BIRTH, like the videos. An unmuted audio element cannot autoplay,
    // so play() rejected into a silent catch and every radio cell stayed dead.
    // select() unmutes the chosen one, which is allowed because Start is a gesture.
    const a = el('audio', '', null, { preload: 'none' });
    a.muted = true;
    cell.append(bars, a, el('span', 'lbl', ch.name));
    grid.append(cell);
    chans.push({ ...ch, kind: 'radio', cell, media: a, bars, hls: null });
  }

  // ── the deck rides the SELECTED channel's DVR window ────────────────────
  // Live has no fixed duration, so the range moves: setRange() in place, and
  // the transport bar re-derives off rangeGen() rather than caching it.
  const deck = createDeck({ items: [], adapters: {}, range: [0, DVR_MS] });
  createTransportBar(d.el, deck);
  createStripView(d.el, deck, { size: 'mini', lanes: [] });

  let sel = 0, master = null, started = false;

  async function select(i) {
    if (i === sel && started) return;
    const prev = chans[sel];
    sel = i;
    chans.forEach((c, j) => c.cell.classList.toggle('on', j === i));
    d.set('channel', chans[i].name);
    if (!started) return;
    if (prev && prev !== chans[i]) teardown(prev);
    await open(chans[i]);
    attachMaster();
  }
  chans.forEach((c, i) => c.cell.addEventListener('click', () => select(i)));

  function attachMaster() {
    master?.detach?.();
    master = null;
    const c = chans[sel];
    if (c.kind !== 'tv' || !c.hls) return;
    master = mediaMaster(deck, c.media, { anchorMs: 0 });
  }

  function teardown(c) {
    try { c.hls?.destroy(); } catch { /* already gone */ }
    c.hls = null;
    c.media.pause();
    c.media.removeAttribute('src');
    c.media.load();
  }

  // PREFER NATIVE HLS ON WEBKIT ONLY, and gate it on ManagedMediaSource.
  // `canPlayType('application/vnd.apple.mpegurl')` answers "maybe" in Chrome as
  // well as Safari, so gating on its truthiness put Chrome on the native path,
  // where `video.src = <m3u8>` sits at readyState 0 forever. The suite never
  // saw it: headless Chrome answers "" and took the hls.js branch, so the page
  // read green while being dead in the browser a human uses. MMS is
  // WebKit-only, which makes this a capability test rather than a brand check —
  // same trap and same fix as src/low-latency-player.js.
  const NATIVE_HLS = 'ManagedMediaSource' in window
    && !!document.createElement('video').canPlayType('application/vnd.apple.mpegurl');

  // ── ERR BLOCKS SEGMENTS BY PROGRAMME, NOT BY AGE ─────────────────────────
  // Measured 2026-09-06 by sweeping each 2 h window at 13 points
  // (`.` = 200, `#` = 403, oldest on the left, live edge on the right):
  //
  //     etv       ........#####     the newest ~45 min refused
  //     etv2      #########....     the OLDEST ~78 min refused, the edge fine
  //     etvpluss  .............     everything served
  //
  // So it is per-programme rights, it moves with the schedule, and it is NOT
  // always at the edge — there is no constant offset to hard-code. A refused
  // segment answers 403 with no `access-control-allow-origin`, so in a browser
  // it arrives as a CORS failure; hls.js then holds an empty buffer and shows
  // a black cell with no error a viewer can read.
  //
  // A served segment answers 200 with ACAO and honours Range, so TWO BYTES are
  // enough to ask "will you serve this one?". Sweep back from the edge, start
  // where ERR will actually serve, and put what it refused in the readout.
  const PROBE_STEPS = 8;
  // How far BEFORE the boundary to start. Three segments left six seconds of
  // material and then the playhead walked into the wall, where hls.js retried
  // blocked fragments 1794 times in one run. The blackout is contiguous from
  // its boundary to the live edge, so there is always a wall — this just buys
  // enough picture to be a demo, and the wall handler below stops the storm.
  const WALL_BACKOFF_S = 90;

  async function servedStart(c) {
    try {
      const master = await (await fetch(c.url, { cache: 'no-store' })).text();
      const variant = master.split(/\r?\n/).find((l) => l && !l.startsWith('#'));
      if (!variant) return null;
      const plUrl = new URL(variant, c.url).href;
      const pl = await (await fetch(plUrl, { cache: 'no-store' })).text();
      const segs = pl.split(/\r?\n/).filter((l) => l && !l.startsWith('#'));
      if (!segs.length) return null;
      const dur = Number(pl.match(/#EXTINF:([\d.]+)/)?.[1]) || 2;
      const last = segs.length - 1;
      for (let k = 0; k < PROBE_STEPS; k++) {
        const i = Math.max(0, last - Math.round((k * last) / (PROBE_STEPS - 1)));
        const url = new URL(segs[i], plUrl).href;
        // .ok is false for a 403 that DOES carry ACAO; .catch() is the 403 that
        // does not, which is what ERR actually sends. Both mean "refused".
        const served = await fetch(url, { headers: { range: 'bytes=0-1' }, cache: 'no-store' })
          .then((r) => r.ok).catch(() => false);
        if (!served) continue;
        // The edge itself is served: leave the live-edge policy to hls.js
        // rather than pinning a position on top of it.
        if (k === 0) return { blockedMin: 0 };
        const at = Math.max(0, i - Math.round(WALL_BACKOFF_S / dur));
        // The SN, not the index: positions slide as the window rolls, and a
        // later probe's index means nothing in the timeline hls.js is holding.
        // The sequence number is the one coordinate both agree on.
        const sn = Number(segs[at].match(/-(\d+)\.[a-z0-9]+$/)?.[1]);
        return { position: at * dur, sn, blockedMin: ((last - at) * dur) / 60 };
      }
      return { blockedMin: ((last + 1) * dur) / 60, none: true };
    } catch { return null; }
  }

  async function open(c) {
    c.atWall = false;
    if (c.kind === 'tv') {
      if (NATIVE_HLS) c.media.src = c.url;
      else if (window.Hls?.isSupported()) {
        const served = await servedStart(c);
        c.served = served;
        d.set('blocked', served ? Math.round(served.blockedMin) : null,
          !served || served.none ? 'bad' : served.blockedMin ? '' : 'ok');
        if (served?.none) {
          d.log(`${c.id}: ERR refuses every segment in the window (rights) — nothing to play`, 'bad');
        } else if (served?.position != null) {
          d.log(`${c.id}: ERR refuses the newest ${Math.round(served.blockedMin)} min (rights) — starting behind it`, 'bad');
        } else if (served) {
          d.log(`${c.id}: ERR serves to the live edge`);
        }
        c.hls = new window.Hls({
          maxBufferLength: 12, backBufferLength: 4, liveSyncDurationCount: 3,
          ...(served?.position != null ? { startPosition: served.position } : {}),
        });
        c.hls.loadSource(c.url);
        c.hls.attachMedia(c.media);
        // THE WALL. Play forward from inside a served region and the playhead
        // reaches the blackout; every fragment after it is 403 and hls.js
        // retries — 1794 refused requests in one run before this existed. Three
        // failures is enough to tell a wall from a blip, and stopLoad() is what
        // turns "the demo is hammering ERR" into "the demo says why it stopped".
        // CONSECUTIVE failures, not three failures ever: a counter that never
        // resets turns three unlucky blips across an hour into a false wall.
        let wall = 0;
        c.hls.on(window.Hls.Events.FRAG_LOADED, () => { wall = 0; });
        c.hls.on(window.Hls.Events.ERROR, (_e, x) => {
          if (x.details === 'fragLoadError' || x.details === 'fragLoadTimeOut') {
            if (++wall !== 3) return;
            // stopLoad, NOT pause: the buffer already holds real material and
            // pausing threw away ~113 s of picture that was there to watch.
            // Stop asking for what ERR refuses, play out what it gave.
            c.hls?.stopLoad();
            c.atWall = true;                 // the readout tick below reads this
            const left = c.media.buffered.length
              ? c.media.buffered.end(c.media.buffered.length - 1) - c.media.currentTime : 0;
            d.log(`${c.id}: reached what ERR refuses (rights) — stopped asking, ${left.toFixed(0)}s left to play`, 'bad');
            return;
          }
          if (x.fatal) d.log(`${c.id}: ${x.details}`, 'bad');
        });
      } else {
        d.log(`${c.id}: no HLS engine — neither native nor MSE`, 'bad');
      }
    } else {
      c.media.src = `https://icecast.err.ee/${c.id}.mp3`;
    }
    c.media.muted = false;
    await c.media.play().catch((e) => d.log(`${c.id} play refused: ${e.name}`, 'bad'));
  }

  d.on('start', async () => {
    started = true;
    // ONLY the selected one. Arming all three called play() on all three,
    // which loaded all three — defeating the single-channel design the whole
    // demo is built on, and breaking its own assert.
    armVideo(chans[sel].media);
    await open(chans[sel]);
    attachMaster();
    d.log(`playing ${chans[sel].name}`);
  });

  // "Live edge" means the newest frame ERR will actually SERVE. Jumping to
  // liveSyncPosition when the newest 52 minutes are rights-blocked lands the
  // playhead in the blackout and kills a picture that was playing — so re-probe
  // (the boundary moves with the schedule) and say where it actually landed.
  d.on('live', async () => {
    const c = chans[sel];
    // radio is a live icecast pipe: no DVR, no window, nothing to jump to
    if (c.kind !== 'tv') { d.log(`${c.id} is a live stream with no DVR`); return; }
    if (!c.hls) { d.log('nothing playing', 'bad'); return; }
    const served = await servedStart(c);
    c.served = served ?? c.served;
    d.set('blocked', served ? Math.round(served.blockedMin) : null,
      !served || served.none ? 'bad' : served.blockedMin ? '' : 'ok');
    if (served && served.sn != null) {
      const frags = c.hls.levels?.[c.hls.currentLevel >= 0 ? c.hls.currentLevel : c.hls.loadLevel]?.details?.fragments;
      const frag = frags?.find((f) => f.sn === served.sn);
      if (frag) {
        c.media.currentTime = frag.start;
        d.log(`jumped to the newest served frame — ERR refuses the ${Math.round(served.blockedMin)} min after it`);
        return;
      }
    }
    const edge = c.hls.liveSyncPosition;
    if (Number.isFinite(edge)) { c.media.currentTime = edge; d.log('jumped to the live edge'); }
  });

  setInterval(() => {
    const c = chans[sel];
    // 'blocked' outranks 'paused': the picture stopped because ERR refuses what
    // comes next, and a readout that only said "paused" would hide the reason.
    const moving = !c.media.paused && c.media.readyState >= 3;
    d.set('state', moving ? 'playing'
      : c.atWall ? 'blocked' : (c.media.paused ? 'paused' : 'buffering'),
      moving ? 'ok' : 'bad');
    if (c.kind === 'tv' && c.hls) {
      const edge = c.hls.liveSyncPosition;
      if (Number.isFinite(edge)) {
        const start = Math.max(0, edge - DVR_MS / 1000);
        // the window MOVES; range identity is stable so the scrubber follows
        deck.setRange([start * 1000, edge * 1000]);
        d.set('behind', Math.max(0, edge - c.media.currentTime));
      }
    } else {
      d.set('behind', 0);
    }
    // radio cells show a cheap level so a playing station is not a dead box
    for (const r of chans) {
      if (r.kind !== 'radio' || !r.bars) continue;
      const live = !r.media.paused && r.media.readyState >= 2;
      [...r.bars.children].forEach((b, k) => {
        b.style.height = live ? `${8 + Math.abs(Math.sin(performance.now() / 320 + k)) * 70}%` : '4%';
      });
    }
  }, 250);

  d.on('check', () => {
    d.assert('eight equal cells', grid.children.length === 8, `${grid.children.length}`);
    const sizes = [...grid.children].map((c) => Math.round(c.getBoundingClientRect().width));
    d.assert('every cell the same width', new Set(sizes).size === 1, sizes.join(','));
    d.assert('a channel is selected', chans.some((c) => c.cell.classList.contains('on')), chans[sel].name);
    d.assert('exactly one channel audible',
      chans.filter((c) => !c.media.muted).length <= 1,
      String(chans.filter((c) => !c.media.muted).length));
    if (started) {
      // "open" is the wrong bar: a channel that is still fetching its first
      // segment is legitimately paused with readyState 0, so demanding it be
      // playing made a working page flake on a slow fetch. What must hold is
      // that NO OTHER channel is consuming bandwidth.
      const others = chans.filter((c, i) => i !== sel && (!c.media.paused || c.media.readyState > 0));
      d.assert('no channel but the selected one is loaded', others.length === 0,
        others.map((c) => c.id).join(',') || 'none');
      const c = chans[sel];
      d.assert('the selected channel is open or loading',
        !c.media.paused || c.media.readyState > 0 || !!c.hls,
        `${c.id} paused=${c.media.paused} readyState=${c.media.readyState}`);
    }
    d.log(`sel ${chans[sel].name} · dvr window ${d.api.readout.window} min`);
  });

  select(0);
  d.log('tap a cell to switch; only the open channel loads');
  d.ready();
</script>
</html>
