<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .pulse { display: flex; gap: 4px; margin: 0 0 10px; }
  .pulse i { flex: 1; height: 46px; border-radius: 3px; background: var(--card2); border: 1px solid var(--line); }
  .pulse i.on { background: var(--hi); border-color: var(--hi); }
  .who { font: 400 11.5px/1.7 var(--mono); color: var(--dim); margin: 0 0 10px; }
  .who b { color: var(--fg); font-weight: 500; }
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createPeer, wsTransport } from '/proto/looper/peer.mjs';

  const ROOM = new URLSearchParams(location.search).get('room') || 'jam-demo';
  const ID = Math.random().toString(36).slice(2, 8);
  const RELAY = `wss://ws.positron.studio/room/${ROOM}/ws`;
  const BEATS = 8, LOOP = 2000;

  const d = mount({
    name: 'jam',
    what: 'Two browsers on one pulse. The clock is peer-corrected, because two documents cannot compare their own.',
    readout: { offset: 'ms', rtt: 'ms', peers: '', beat: '' },
    controls: [
      { id: 'start', label: 'Start audio and join', primary: true },
      { id: 'check', label: 'Run the checks' },
    ],
  });
  guard(d);

  const bar = el('div', 'pulse');
  const cells = [];
  for (let i = 0; i < BEATS; i++) { const c = el('i'); cells.push(c); bar.append(c); }
  d.el.append(bar);
  const who = el('p', 'who', 'not joined');
  d.el.append(who);

  let ctx = null, peer = null, timer = null, lastBeat = -1, fired = 0;

  function click(at) {
    if (!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 880; o.type = 'square';
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(0.25, at + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.05);
    o.connect(g); g.connect(ctx.destination);
    o.start(at); o.stop(at + 0.06);
    fired++;
  }

  d.on('start', async () => {
    if (peer) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    await ctx.resume();

    // THE CLOCK IS THE WHOLE DIFFERENCE. performance.now() is private to a
    // document — two of them cannot be compared at all — and a relay's own idea
    // of the time measured +/-50 ms of bias, which at a 2 s loop is 2.5 % of the
    // circle and an audible flam. So peer.mjs runs an NTP-style exchange, keeps
    // only the fastest sample, and elects the lowest peer id as reference.
    peer = createPeer({ id: ID, transport: wsTransport(RELAY) });
    d.log(`joined ${ROOM} as ${ID}`, 'hi');

    // Everyone derives the same grid from the shared clock, so nobody leads.
    timer = setInterval(() => {
      const now = peer.now();
      const beat = Math.floor((now % LOOP) / (LOOP / BEATS));
      if (beat === lastBeat) return;
      lastBeat = beat;
      cells.forEach((c, i) => c.classList.toggle('on', i === beat));
      click(ctx.currentTime + 0.02);
      d.set('beat', `${beat + 1}/${BEATS}`);
    }, 12);

    setInterval(() => {
      const ps = peer.peers();
      d.set('offset', peer.offsetMs());
      d.set('peers', ps.length);
      const best = ps.filter((p) => Number.isFinite(p.rttMs) && p.rttMs < Infinity);
      if (best.length) d.set('rtt', Math.min(...best.map((p) => p.rttMs)));
      who.innerHTML = ps.length
        ? ps.map((p) => `<b>${p.id}</b> rtt ${Number.isFinite(p.rttMs) ? p.rttMs.toFixed(1) : '?'}ms offset ${p.offsetMs.toFixed(1)}ms`).join('<br>')
        : 'alone in the room — open this page again to hear two in sync';
    }, 500);
  });

  d.on('check', () => {
    d.assert('audio running', !!ctx && ctx.state === 'running', ctx?.state ?? 'none');
    d.assert('peer joined', !!peer, peer ? ID : 'no');
    d.assert('shared clock is not the local one', !!peer && peer.clock.domain === 'shared-epoch',
      peer?.clock.domain ?? 'none');
    d.assert('the pulse is running', fired > 0, `${fired} click(s)`);
    if (peer) {
      const ps = peer.peers();
      // alone, offset must be exactly 0: with no peer there is nothing to
      // correct to, and inventing a correction would be the bug
      if (ps.length === 0) d.assert('alone means zero offset', peer.offsetMs() === 0, String(peer.offsetMs()));
      else d.assert('offset estimated for every peer', ps.every((p) => Number.isFinite(p.offsetMs)), `${ps.length} peer(s)`);
    }
    d.log(`open again with ?room=${ROOM} for a second player`);
  });

  d.ready();
</script>
</html>
