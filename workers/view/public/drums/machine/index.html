<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount } from '/shell/shell.mjs';
  import { createDrumMachine } from '/drums/drum-machine.mjs';
  import { VOICES } from '/drums/voices.mjs';

  // A drum machine as a patchbay: a 16 step by 4 row grid, a sequencer that
  // sends each hit as a MIDI note, and four SuperCollider voices, each a node of
  // its own on the bay. Asked 2026-10-12 (BACKLOG, "A rhythm concept group").
  // Everything but the frame is `../drum-machine.mjs`, shared with
  // /drums/knobs/, which is this page plus a knob per drum.
  const d = mount({ name: 'Drum machine', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('drums/machine');
  const m = createDrumMachine(d, { voices: VOICES });
  d.stack.add(m.surface, m.patchbay);
  window.__rhythm = m.api;
  d.ready();
</script>
