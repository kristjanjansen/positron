<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON concept 6</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .cc-stack { display: flex; flex-direction: column; gap: 12px; }
  .cc-h { margin: 0; font-size: 14px; color: var(--dim); font-weight: 500; }
  .cc-row { display: flex; flex-wrap: wrap; align-items: end; gap: var(--ctl-gap, 8px); }
  .cc-row > .pos-field { flex: 1 1 260px; min-width: 0; }
  .cc-row[hidden] { display: none; }
  .cc-ends { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: var(--ctl-gap, 8px); }
  /* The same medium colours and live dot as /concepts/1/. */
  :root {
    --md-midi: #6fb8e8; --md-audio: #ee9a4d; --md-clock: #c9ced6; --md-value: #9ad16b;
    --md-video: #e07a5f; --md-program: #c39af0; --md-file: #a89a8a; --md-state: #8a9fc4;
  }
  .md-midi { color: var(--md-midi); } .md-audio { color: var(--md-audio); }
  .md-clock { color: var(--md-clock); } .md-value { color: var(--md-value); }
  .md-video { color: var(--md-video); } .md-program { color: var(--md-program); }
  .md-file { color: var(--md-file); } .md-state { color: var(--md-state); }
  .pos-tbl-c .pos-pres-dot { display: inline-block; vertical-align: middle; }
  .cc-ring::after { content: none; }
  /* The picture is only on screen while a broadcast is. The wrapper carries
     [hidden], because .pos-vp sets display and would beat it. */
  .cc-air[hidden] { display: none; }
  .cc-say { margin: 0; color: var(--dim); font-size: 13.5px; }
</style>
<script type="module">
  import { conceptNav } from '/concepts/nav.mjs';
  import { mount, el, armVideo } from '/shell/shell.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { fetchIceServers, camWhipPublish, camWhep, whepPlay } from '/shell/live.mjs';
  import { createTable } from '/shell/table.mjs';
  import { createField } from '/shell/field.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createBay, TRANSPORT_NAMES } from '/shell/bay.mjs';
  import { createTabs } from '/shell/tabs.mjs';
  import { createBayNode, randomSite, ROOM_RE } from '/shell/bay-node.mjs';

  // The smallest multi-user chat built from patchbay blocks. Every tab is a SITE
  // with one NODE and two PORTS of medium `value`. A line is shown only when the
  // bay, filled from the REGISTRY, accepts a LINK from the sender's out to our in.
  // Its own room, never studio-1, so nothing lands on the studio's desk.
  const asked = new URLSearchParams(location.search).get('room');
  const ROOM = asked && ROOM_RE.test(asked) ? asked : 'chat-4';
  // History: positron-store, a recorder that joins the room as an ordinary socket
  // and keeps every message sent with `store: true` (workers/store/src/index.js).
  const STORE_URL = 'https://store.positron.studio';
  const SITE = randomSite('web');
  const OUT = `${SITE}:chat:out`, IN = `${SITE}:chat:in`;
  // ADMIN: toward /stage/. One more node on every tab, `notice`, with an in-port
  // that takes admin lines and shows the last one above the chat. Only a tab
  // on the admin tab announces `admin:out` and can send to it.
  // ⚠️ NOTHING PROVES THE ADMIN. Any tab can pick the admin tab; the bay checks that the
  // ports fit, not who holds them. That is the question this page exists to ask.
  // The tab in the address wins, as tabs.mjs decides; ?admin=1 picks admin when there is none.
  let admin = location.hash ? location.hash === '#admin' : new URLSearchParams(location.search).get('admin') === '1';
  const AOUT = `${SITE}:admin:out`, NOTICE = `${SITE}:notice:in`;
  const CAM = `${SITE}:camera:video-out`, BOUT = `${SITE}:broadcast:value-out`;
  const SCREEN = `${SITE}:screen:video-in`, ONAIR = `${SITE}:screen:value-in`;
  const selfGraph = () => ({
    v: 1, site: SITE, place: 'browser', kind: 'browser', label: 'browser',
    nodes: [
      { id: `${SITE}:chat`, kind: 'person', label: 'chat', place: 'browser' },
      { id: `${SITE}:notice`, kind: 'screen', label: 'notice', place: 'browser' },
      ...(admin ? [{ id: `${SITE}:admin`, kind: 'person', label: 'admin', place: 'browser' }] : []),
      { id: `${SITE}:screen`, kind: 'screen', label: 'screen', place: 'browser' },
      ...(admin ? [
        { id: `${SITE}:camera`, kind: 'device', label: 'camera', place: 'browser' },
        { id: `${SITE}:broadcast`, kind: 'endpoint', label: 'broadcast', place: 'browser' },
      ] : []),
    ],
    ports: [
      { id: OUT, label: 'chat', dir: 'out', medium: 'value', transports: ['relay'] },
      { id: IN, label: 'chat', dir: 'in', medium: 'value', transports: ['relay'] },
      { id: NOTICE, label: 'notice', dir: 'in', medium: 'value', transports: ['relay'] },
      ...(admin ? [{ id: AOUT, label: 'admin', dir: 'out', medium: 'value', transports: ['relay'] }] : []),
      { id: SCREEN, label: 'screen', dir: 'in', medium: 'video', transports: ['whep'] },
      { id: ONAIR, label: 'on air', dir: 'in', medium: 'value', transports: ['relay'] },
      ...(admin ? [
        { id: CAM, label: 'camera', dir: 'out', medium: 'video', transports: ['whip'] },
        { id: BOUT, label: 'broadcast', dir: 'out', medium: 'value', transports: ['relay'] },
      ] : []),
    ],
  });
  // BROADCAST: the admin's camera goes out by WHIP to Cloudflare Stream and every
  // other tab plays it back by WHEP. It rides /cam/'s own WebRTC input
  // (CAM_WHIP_UID in live.mjs), published through pub.positron.studio/cam/whip so
  // the key never reaches this page, and that worker allows one camera at a time:
  // while /cam/ holds it this page is told 409 in words, and the other way round.
  // Whether it is on is a light state, a `bay.event` out of `<admin>:broadcast:value-out`
  // to `*:screen:value-in`, which a tab hears only along the listener link it holds.
  const STREAM = {
    v: 1, site: 'cf-stream', place: 'cloudflare', net: 'cloudflare', kind: 'service', label: 'CF Stream',
    nodes: [{ id: 'cf-stream:live', kind: 'endpoint', label: 'live input', place: 'cloudflare', net: 'cloudflare' }],
    ports: [
      { id: 'cf-stream:live:video-in', label: 'video', dir: 'in', medium: 'video', transports: ['whip'] },
      { id: 'cf-stream:live:video-out', label: 'video', dir: 'out', medium: 'video', transports: ['whep'] },
    ],
  };
  // The store as a site, announced on its behalf into this page's own registry
  // only, as /patchbay/ does for R2: every tab would describe the same store.
  const STORE = {
    v: 1, site: 'cf-store', place: 'cloudflare', net: 'cloudflare', kind: 'service', label: 'CF Store',
    nodes: [{ id: 'cf-store:history', kind: 'store', label: 'history', place: 'cloudflare', net: 'cloudflare' }],
    ports: [
      { id: 'cf-store:history:in', label: 'history', dir: 'in', medium: 'value', transports: ['relay'] },
      { id: 'cf-store:history:out', label: 'history', dir: 'out', medium: 'value', transports: ['https'] },
    ],
  };

  const d = mount({ name: 'concept 6', what: '', readout: null, index: '/concepts/', indexLabel: 'concepts' });
  conceptNav(6);

  const lines = createTable({
    columns: [
      { key: 'who', label: 'who', width: 96 },
      { key: 'text', label: 'line', grow: true, hi: true },
      { key: 'ago', label: 'when', width: 72 },
      { key: 'link', label: 'link', width: 220, clip: true, hover: 'why' },
    ],
    minRows: 4,
    stick: true,
  });
  const said = [];
  // How long ago, from the send stamp the relay envelope carries (`sent`).
  const ago = (at) => {
    const s = Math.max(0, Math.round((Date.now() - at) / 1000));
    if (s < 10) return 'now';
    if (s < 60) return `${s} s ago`;
    if (s < 3600) return `${Math.floor(s / 60)} min ago`;
    if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
    return `${Math.floor(s / 86400)} d ago`;
  };
  // Admin lines have a table of their own, with the same columns.
  const notices = createTable({
    columns: [
      { key: 'who', label: 'who', width: 96 },
      { key: 'text', label: 'notice', grow: true, hi: true },
      { key: 'ago', label: 'when', width: 72 },
      { key: 'link', label: 'link', width: 220, clip: true, hover: 'why' },
    ],
    minRows: 2,
    stick: true,
  });
  const told = [];
  const draw = () => {
    lines.set(said.map((r) => ({ ...r, ago: ago(r.at) })));
    notices.set(told.map((r) => ({ ...r, ago: ago(r.at) })));
  };
  setInterval(() => { if (said.length || told.length) draw(); }, 30000);
  const short = (site) => site === SITE ? 'you' : site === 'cf-store' ? 'CF Store' : site === 'cf-stream' ? 'CF Stream'
    : `browser ${site.replace(/^web-/, '')}`;

  // A bay from everything heard. ⚠️ NOT `registry.fill`: bay.mjs knows `whep` and
  // not `whip` (TRANSPORT_NAMES), and `addPort` throws on a transport it does not
  // know, so a port that says `whip` keeps it in the room table and leaves it out
  // of the bay. Only the ports' transports lists are touched.
  const KNOWN = new Set(TRANSPORT_NAMES);
  function filled() {
    const b = createBay();
    const { nodes, ports } = node.registry.merged();
    for (const n of nodes) b.addNode({ id: n.id, kind: n.kind, label: n.label, place: n.place, net: n.net });
    for (const p of ports) {
      const q = { ...p };
      if (Array.isArray(q.transports)) {
        q.transports = q.transports.filter((t) => KNOWN.has(t));
        if (!q.transports.length) delete q.transports;
      }
      b.addPort(q);
    }
    return b;
  }
  // The bay the node delivers through: this tab hears the on-air state along
  // `*:broadcast:value-out -> <me>:screen:value-in`, and an admin speaks it along
  // `<me>:broadcast:value-out -> *:screen:value-in`.
  function bay() {
    const b = filled();
    if (b.port(ONAIR)) b.addPort({ ...b.port(ONAIR), deliver: onAir });
    b.link('*:broadcast:value-out', ONAIR);
    if (admin && b.port(BOUT)) b.link(BOUT, '*:screen:value-in');
    return b;
  }

  const node = createBayNode({
    room: ROOM, graphs: [selfGraph()], local: [STORE, STREAM], bay,
    log: (line, kind) => d.log(line, kind),
    onJoin: () => { join.button('join').disabled = true; clear.button('clear').disabled = false; loadHistory(); text.disabled(false); send.button('send').disabled = false; tell.button('tell').disabled = false; noticeText.disabled(false); air.enable('start', !pub, 'already on air'); drawSites(); },
    onGraph: () => { drawSites(); if (pub) tellAir(true, false); },
    onEvent: (m, n) => { if (n < 0) d.log(`refused a broadcast state said as ${m.source} by a socket that never announced it`, 'warn'); },
    onMessage: (m) => { if (m.type === 'chat.line') heard(m); else if (m.type === 'chat.admin') heardAdmin(m); else if (m.type === 'chat.clear') wipe(); },
  });

  function heard(m, old = false) {
    const source = old ? 'cf-store:history:out' : String(m.source || '');
    const from = String(m.source || '');
    const b = filled();
    const l = b.link(source, IN, [], { site: SITE });
    said.push({ at: Number(m.sent) || Date.now(), who: short(from.split(':')[0]), text: String(m.text || ''),
      link: l.ok ? `${source} -> ${IN}` : 'refused', why: l.ok ? (l.session?.transport || 'no transport needed') : l.why });
    draw();
  }

  // An admin line: shown in the chat AND as the notice, if the bay accepts a link
  // from its admin:out to this tab's notice:in.
  function heardAdmin(m, old = false) {
    const from = String(m.source || '');
    const source = old ? 'cf-store:history:out' : from;
    const b = filled();
    const l = b.link(source, NOTICE, [], { site: SITE });
    const site = from.split(':')[0];
    told.push({ at: Number(m.sent) || Date.now(), who: site === SITE ? 'you' : `browser ${site.replace(/^web-/, '')}`,
      text: String(m.text || ''), link: l.ok ? `${source} -> ${NOTICE}` : 'refused', why: l.ok ? 'in the notices' : l.why });
    draw();
  }

  // Wake the recorder into this room, then read what it kept. Our own worker,
  // asked only on a press of Join.
  async function loadHistory() {
    try {
      const r = await fetch(`${STORE_URL}/room/${ROOM}/record`, { method: 'POST' });
      d.log(`store recording ${ROOM}: ${r.status}`);
      const h = await fetch(`${STORE_URL}/room/${ROOM}/history?last=50`);
      const rows = (await h.text()).split('\n').filter(Boolean);
      let n = 0;
      for (const line of rows) {
        let m; try { m = JSON.parse(line); } catch { continue; }
        if (m.type === 'chat.line') { heard(m, true); n++; }
        else if (m.type === 'chat.admin') { heardAdmin(m, true); n++; }
      }
      d.log(`${n} earlier line${n === 1 ? '' : 's'} from the store`);
    } catch (e) { d.log(`the store did not answer: ${e.message || e}`, 'warn'); }
  }

  const text = createField({ label: 'line', placeholder: 'say something', grow: 'wide' });
  text.disabled(true);
  function say() {
    const t = text.value().trim();
    if (!t) return;
    node.send({ type: 'chat.line', source: OUT, text: t, store: true });
    // No link reaches many listeners yet (plans/plan-site-names.md, chat gaps), so
    // the line goes to the room and this shows the one-to-one links it stands for.
    const b = filled();
    const to = node.registry.merged().ports.filter((p) => p.dir === 'in' && (p.id.endsWith(':chat:in') || p.id === 'cf-store:history:in') && p.id !== IN)
      .map((p) => ({ p, l: b.link(OUT, p.id, [], { site: SITE }) }));
    const ok = to.filter((x) => x.l.ok).map((x) => `${OUT} -> ${x.p.id}`);
    said.push({ at: Date.now(), who: 'you', text: t, link: `${OUT} -> *:chat:in`,
      why: ok.length ? ok.join('\n') : 'nobody else in the room' });
    draw();
    text.set('');
  }
  // The admin writes notices in a field of its own, and still chats like anyone.
  const noticeText = createField({ label: 'notice', placeholder: 'tell everyone', grow: 'wide' });
  noticeText.disabled(true);
  function sayAdmin() {
    const t = noticeText.value().trim();
    if (!t) return;
    node.send({ type: 'chat.admin', source: AOUT, text: t, store: true });
    heardAdmin({ source: AOUT, text: t, sent: Date.now() });
    told[told.length - 1].link = `${AOUT} -> *:notice:in`;
    draw();
    noticeText.set('');
  }
  noticeText.input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); sayAdmin(); } });
  text.input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); say(); } });
  const send = createButtonGroup({ buttons: [{ id: 'send', label: 'Send', primary: true, onPress: say }] });
  const tell = createButtonGroup({ buttons: [{ id: 'tell', label: 'Send notice', primary: true, onPress: sayAdmin }] });
  tell.button('tell').disabled = true;
  const noticeRow = el('div', 'cc-row');
  noticeRow.append(noticeText.el, tell.el);
  noticeRow.hidden = !admin;

  // ── the broadcast ──────────────────────────────────────────────────────────
  // One picture, under the tabs. The admin sees its own camera here (nothing
  // leaves for that), every other tab sees the broadcast once it is on air.
  // Nothing is opened on a visit: the camera waits for Start broadcast, and a
  // tab only plays after Join, because only a joined tab can hear the on-air state.
  const video = el('video');
  video.muted = true; video.playsInline = true;
  const panel = createVideoPanel({ media: video, of: 'the broadcast', fullMode: 'hover',
    values: [{ key: 'frames', label: 'frames', reserve: 6 }, { key: 'state', label: '' }] });
  const airBox = el('div', 'cc-air');
  airBox.append(panel.el);
  airBox.hidden = true;
  const airSay = el('p', 'cc-say', 'off air');
  const frames = () => video.getVideoPlaybackQuality?.().totalVideoFrames ?? 0;
  setInterval(() => { if (!airBox.hidden) panel.values.set('frames', String(frames())); }, 1000);
  const showAir = (on, state, words) => {
    airBox.hidden = !on;
    panel.presence?.set(state);
    panel.values.set('state', words);
    airSay.textContent = words;
  };

  let pub = null, cam = null, beat = null, ice = null;
  // What the bay says about a video link, for the log. It is asked, not obeyed:
  // the page opens the leg itself, and the bay has no `whip` yet, so it names
  // the publish leg by the WebRTC cell it does have.
  const verdict = (from, to) => {
    const l = filled().link(from, to, [], { site: SITE });
    return l.ok ? `the bay accepts ${from} -> ${to} (${l.session?.transport || 'light'})` : `the bay refuses ${from} -> ${to}: ${l.why}`;
  };
  const iceOnce = async () => ice || (ice = await fetchIceServers({ log: (m) => d.log(`webrtc ${m}`) }));
  // The on-air state, out of this tab's broadcast port. A late tab hears the
  // next beat, so it is said again every 10 s while on air and whenever the
  // room changes. `notice` also puts a line in the notices, which the store keeps.
  function tellAir(on, notice = true) {
    const r = node.emit(BOUT, { on, at: Date.now() });
    if (notice) {
      const t = on ? 'broadcast started' : 'broadcast stopped';
      node.send({ type: 'chat.admin', source: AOUT, text: t, store: true });
      heardAdmin({ source: AOUT, text: t, sent: Date.now() });
      told[told.length - 1].link = `${BOUT} -> *:screen:value-in`;
      draw();
    }
    return r;
  }
  async function startBroadcast() {
    armVideo(video);   // before any await, or iOS refuses later
    try {
      cam = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } }, audio: false });
    } catch (e) {
      const why = e?.name === 'NotAllowedError' ? 'the camera was refused'
        : e?.name === 'NotFoundError' ? 'this machine has no camera' : `the camera did not start (${e?.name || e})`;
      d.log(`${why}, so nothing was sent anywhere`, 'bad');
      showAir(false, 'offline', why);
      return;
    }
    video.srcObject = cam;
    video.play().catch(() => {});
    showAir(true, 'coming', 'camera on, going on air');
    try {
      const { iceServers } = await iceOnce();
      pub = await camWhipPublish(cam, { iceServers, log: (m, k) => d.log(`webrtc ${m}`, k) });
    } catch (e) {
      const busy = /409/.test(e.message);
      d.log(busy ? 'another camera is on the camera input (/cam/ or another admin), so this one stays off air'
        : `the broadcast did not start: ${e.message}`, 'bad');
      dropCamera();
      showAir(false, 'offline', busy ? 'another camera is on air' : 'did not go on air');
      return;
    }
    pub.pc.addEventListener('connectionstatechange', () => {
      const st = pub?.pc.connectionState;
      if (st === 'connected') showAir(true, 'online', 'on air');
      if (st === 'failed') stopBroadcast('the camera could not reach Cloudflare (UDP blocked, or a VPN)');
    });
    air.enable('start', false, 'already on air');
    air.enable('stop', true);
    tellAir(true);
    beat = setInterval(() => tellAir(true, false), 10_000);
    d.log(`on air: ${CAM} -> cf-stream:live:video-in`, 'hi');
    d.log(verdict(CAM, 'cf-stream:live:video-in'));
  }
  function dropCamera() {
    cam?.getTracks().forEach((t) => t.stop());
    cam = null;
    video.srcObject = null;
  }
  async function stopBroadcast(why = '') {
    clearInterval(beat); beat = null;
    const p = pub; pub = null;
    if (p) tellAir(false);
    dropCamera();
    air.enable('stop', false, 'not on air');
    air.enable('start', join.button('join').disabled, 'join the room first');   // Join is off once joined
    showAir(false, 'offline', 'off air');
    if (why) d.log(`off air: ${why}`);
    await p?.stop();
  }
  const air = createButtonGroup({ buttons: [
    { id: 'start', label: 'Start broadcast', primary: true, onPress: startBroadcast },
    { id: 'stop', label: 'Stop broadcast', onPress: () => stopBroadcast('stopped by the admin') },
  ] });
  air.enable('start', false, 'join the room first');
  air.enable('stop', false, 'not on air');
  const airRow = el('div', 'cc-row');
  airRow.append(air.el);
  airRow.hidden = !admin;
  addEventListener('pagehide', () => { if (pub) { tellAir(false, false); pub.stop(); } if (sub) sub.pc.close(); });

  // The audience half: called by the bay, only along the listener link this tab holds.
  let sub = null, lastOn = 0, opening = false;
  function onAir(e, l, m) {
    if (admin) return;   // an admin tab shows its own camera, never somebody else's
    if (e?.on) {
      lastOn = Date.now();
      if (!sub && !opening) watch(m.from);
    } else if (sub || opening) stopWatching('the admin stopped the broadcast');
  }
  async function watch(from) {
    opening = true;
    showAir(true, 'coming', 'on air, connecting');
    d.log(`on air, said by ${from}: playing cf-stream:live:video-out -> ${SCREEN}`, 'hi');
    d.log(verdict('cf-stream:live:video-out', SCREEN));
    try {
      const { iceServers } = await iceOnce();
      const s = await whepPlay(camWhep(), video, { iceServers, log: (x, k) => d.log(`webrtc ${x}`, k) });
      if (!opening) { s.pc.close(); return; }
      sub = s;
      sub.pc.addEventListener('connectionstatechange', () => {
        const st = sub?.pc.connectionState;
        if (st === 'connected') showAir(true, 'online', 'playing');
        if (st === 'failed') stopWatching('the picture could not get here (UDP blocked, or a VPN)');
      });
    } catch (e) {
      d.log(`the broadcast did not play: ${e.message}`, 'bad');
      showAir(false, 'offline', 'did not play');
    } finally { opening = false; }
  }
  function stopWatching(why) {
    opening = false;
    try { sub?.pc.close(); } catch { /* already */ }
    sub = null;
    video.srcObject = null;
    showAir(false, 'offline', 'off air');
    d.log(`stopped playing: ${why}`);
  }
  // An admin that left without saying so: three missed beats and the picture goes.
  setInterval(() => { if (sub && Date.now() - lastOn > 35_000) stopWatching('no word from the admin for 35 s'); }, 5000);

  // The two roles. Switching re-announces this tab: the admin tab adds the
  // `admin` node and its `admin:out`, the audience tab takes them away.
  const roles = createTabs({
    tabs: [{ id: 'admin', label: 'Admin' }, { id: 'audience', label: 'Audience' }],
    at: admin ? 'admin' : 'audience',
    onPick: (id) => {
      admin = id === 'admin';
      noticeRow.hidden = !admin;
      airRow.hidden = !admin;
      if (!admin && pub) stopBroadcast('left the admin tab');
      if (admin && sub) stopWatching('this tab is the admin now');
      node.setGraphs([selfGraph()], [STORE, STREAM]);
      drawSites();
    },
  });
  send.button('send').disabled = true;
  // Clear: the store forgets this room, and every tab in it empties its tables.
  function wipe() { said.length = 0; told.length = 0; draw(); }
  async function clearAll() {
    try {
      const r = await fetch(`${STORE_URL}/room/${ROOM}/clear`, { method: 'POST' });
      d.log(`store cleared ${ROOM}: ${r.status}`);
    } catch (e) { d.log(`the store did not clear: ${e.message || e}`, 'warn'); }
    node.send({ type: 'chat.clear' });
    wipe();
  }
  const join = createButtonGroup({ buttons: [{ id: 'join', label: `Join ${ROOM}`, onPress: () => { armVideo(video); node.join(); } }] });
  const clear = createButtonGroup({ buttons: [{ id: 'clear', label: 'Clear history', onPress: clearAll }] });
  clear.button('clear').disabled = true;
  // Join on the left, Clear history on its own at the right of the same line.
  const joinRow = el('div', 'cc-ends');
  joinRow.append(join.el, clear.el);

  // Who is in the room: the registry, as /concepts/1/ draws it. Port names are
  // shown as <medium>-<dir> (plans/plan-site-names.md §4c); the real id is on hover.
  const DIR = { in: '\u2192\u25CB', out: '\u25CB\u2192' };
  const sites = createTable({
    columns: [
      { key: 'state', label: '', width: 16 },
      { key: 'id', label: 'port', grow: true, hi: true, clip: true, hover: 'real' },
      { key: 'who', label: 'who', width: 120 },
      { key: 'dir', label: 'dir', width: 48 },
      { key: 'medium', label: 'medium', width: 72 },
      { key: 'by', label: 'transport', width: 120 },
    ],
    minRows: 12,
  });
  function drawSites() {
    const rows = node.registry.merged().ports.map((p) => {
      const [site, n] = p.id.split(':');
      return { state: p.stale ? 'stale' : 'live', id: `${site}:${n}:${p.medium}-${p.dir}`, real: p.id,
        who: short(site), dir: DIR[p.dir] || p.dir, medium: p.medium, by: (p.transports || []).join(', ') };
    }).sort((a, b) => (a.who === 'you' ? 0 : 1) - (b.who === 'you' ? 0 : 1) || a.id.localeCompare(b.id));
    sites.set(rows);
    for (const cell of sites.el.querySelectorAll('.pos-tbl-body .pos-tbl-c')) {
      const t = cell.textContent;
      if (t === 'live' || t === 'stale') {
        const dot = document.createElement('span');
        dot.className = 'pos-pres-dot' + (t === 'live' ? '' : ' cc-ring');
        dot.style.color = t === 'live' ? 'var(--ok)' : 'var(--dim2)';
        cell.textContent = '';
        cell.append(dot);
        cell.title = t;
      } else if (/^(midi|audio|clock|value|video|program|file|state)$/.test(t)) cell.classList.add(`md-${t}`);
    }
  }

  const row = el('div', 'cc-row');
  row.append(text.el, send.el);
  const out = el('div', 'cc-stack');
  out.append(roles.el, joinRow, el('h3', 'cc-h', 'broadcast'), airRow, airSay, airBox, el('h3', 'cc-h', 'notices'), noticeRow, notices.el, el('h3', 'cc-h', 'chat'), row, lines.el, el('h3', 'cc-h', 'in the room'), sites.el);
  d.el.append(out);
  d.ready();
</script>
