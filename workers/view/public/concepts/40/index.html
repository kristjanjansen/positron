<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON concept 40</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .cc-stack { display: flex; flex-direction: column; gap: 12px; }
  .cc-h { margin: 0; font-size: 14px; color: var(--dim); font-weight: 500; }
  /* Every part of this page follows the links, so a part the patch does not use
     is hidden, and the kit's components set `display` of their own. (0,2,0). */
  .cc-stack [hidden] { display: none; }
  /* The step picker and the sound button on one row; on a phone they wrap. */
  .cc-top { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .cc-top > .pos-bgroup { flex: none; width: auto; }
  /* A knob or the keyboard the step does not use keeps its place and is not
     drawn, so the panel is the same size at every step (asked 2026-10-10,
     *"reserve space for kbow block and keyboard even when not present"*). */
  .cc-off { visibility: hidden; }
  /* A knob the step does not offer leaves the row, so the ones it does sit
     together (*"mess layout"*, 2026-10-10); the row keeps its height. */
  .cc-stack .cc-gone { display: none; }
</style>
<script type="module">
  import { conceptNav } from '/concepts/nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createChoice } from '/shell/choice.mjs';
  import { createKnob, createKnobBank } from '/shell/knob.mjs';
  import { createKeyboard, keyRange } from '/shell/keyboard.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { setSymbol } from '/shell/symbol.mjs';
  import { createWaveShape } from '/shell/synth-view.mjs';
  import { createSynth, STEPS, KNOBS, knobRaw } from './modules.mjs';

  // A WebAudio synth built in the patchbay, in six steps (plans/plan-synth-patch.md).
  // Every module is a bay node and every part of this page follows the links the
  // bay holds: the sound is wired by the router in modules.mjs, and a picture, a
  // knob or the keyboard shows only while its module is in the patch.
  //
  // NOTHING OPENS ON A VISIT. The AudioContext is made on the first key or play
  // press.
  const d = mount({ name: 'concept 40', what: '', readout: null, index: '/concepts/', indexLabel: 'concepts' });
  conceptNav(40);

  const synth = createSynth({ log: (m, lv) => d.log(m, lv) });
  const { bay, P } = synth;
  const ID = synth.id;

  // ── one waveform, the output, drawn as the synths slide draws it ──────────
  // `createWaveShape` fed one window from the first rising zero crossing, so a
  // steady tone stands still, at one fixed scale, so a level change shows.
  const WINDOW = 512, FULL = 0.5;
  const wave = createWaveShape({ reason: null, colour: '--hi', height: 120, name: '' });

  // ── the knobs: one `web:knobs` node, each turn one event out of value-out ─
  const knobs = new Map();
  for (const k of KNOBS) {
    knobs.set(k.name, createKnob({
      label: k.name === 'q' ? 'Q' : k.name, min: k.min, max: k.max, step: k.step, value: k.raw, format: k.format,
      onInput: (r) => bay.send(ID(`knob-${k.name}`, 'value-out'), { of: 'param', name: k.name, v: k.value(r) }),
    }));
  }
  const bank = createKnobBank([...knobs.values()]);

  // ── the keyboard: a key is one note event out of keys:midi-out ───────────
  const keysHost = el('div');
  const inPatch = (node) => bay.links().some((l) => l.from.split(':')[1] === node || l.to.split(':')[1] === node);
  const kb = createKeyboard(keysHost, {
    ...keyRange(21), base: 48,   // 13 white keys, the content width at the kit's 49 px minimum, as on /concepts/10/
    onDown: (note, how) => {
      if (how === 'midi' || !inPatch('keys')) return;
      wake(); sound(true);
      bay.send(ID('keys', 'midi-out'), { cls: 'note', ch: 1, d1: note, d2: 100 });
    },
    onUp: (note, how) => {
      if (how === 'midi' || !inPatch('keys')) return;
      bay.send(ID('keys', 'midi-out'), { cls: 'note', ch: 1, d1: note, d2: 0 });
    },
  });

  // ── sound on and off ────────────────────────────────────────────────────
  let ctx = null;
  function wake() {
    if (!ctx) { ctx = new AudioContext(); synth.start(ctx); requestAnimationFrame(frame); }
    ctx.resume();
  }
  const GLYPH = { play: '►', stop: '■' };
  const transport = createButtonGroup({ buttons: [
    { id: 'play', label: GLYPH.play, aria: 'play', onPress: () => { if (!synth.on()) wake(); sound(!synth.on()); } },
  ] });
  function sound(v) {
    synth.sound(v);
    const b = transport.button('play');
    setSymbol(b, v ? GLYPH.stop : GLYPH.play);
    b.title = v ? 'stop' : 'play';
    b.setAttribute('aria-label', b.title);
  }

  function frame() {
    const buf = synth.on() ? synth.read('scope') : null;
    if (buf) {
      let i0 = 0;
      for (let i = 1; i < buf.length - WINDOW; i++) if (buf[i - 1] < 0 && buf[i] >= 0) { i0 = i; break; }
      const win = buf.subarray(i0, i0 + WINDOW);
      wave.set({ points: Array.from(win, (v) => Math.max(-1, Math.min(1, v / FULL))), reason: '', name: '' });
    } else wave.set({ points: null, reason: null, name: '' });
    requestAnimationFrame(frame);
  }

  // ── the patch: a step is a text, and the text is the links ───────────────
  let step = STEPS[0];
  function apply(text) {
    let bad;
    try { bad = synth.load(text); } catch (e) { bad = [{ line: '', why: e.message.replace(/^bay: /, '') }]; }
    for (const b of bad) d.log(b.line ? `${b.line} refused: ${b.why}` : b.why, 'warn');
    follow();
  }
  // Show what the links use, and nothing else.
  function follow() {
    // A knob shows while its own cable reaches its module.
    const reach = (k) => bay.links().some((l) => l.from === ID(`knob-${k.name}`, 'value-out') && l.to === ID(k.owner, 'value-in'));
    const on = new Set(KNOBS.filter(reach).map((k) => k.name));
    // With none to offer, every knob stays in and the row is not drawn, so it
    // keeps its height; otherwise the unused ones leave the row.
    for (const k of KNOBS) knobs.get(k.name).el.classList.toggle('cc-gone', on.size > 0 && !on.has(k.name));
    bank.el.classList.toggle('cc-off', on.size === 0);
    keysHost.classList.toggle('cc-off', !inPatch('keys'));
    pb.refresh();
  }

  // Choosing a step sets its starting sound and replaces the whole patch.
  const picker = createChoice({ label: 'step', at: 0,
    options: STEPS.map((s, i) => [`${i + 1} ${s.name}`, i]),
    onPick: (i) => {
      step = STEPS[i];
      for (const [name, v] of Object.entries(step.preset)) {
        const k = KNOBS.find((x) => x.name === name);
        synth.setParam(k.owner, name, v);
        knobs.get(name).set(knobRaw(name, v), { quiet: true });
      }
      apply(step.patch);
    } });

  // ── the patchbay, drawing only the nodes the links use ───────────────────
  const view = {
    nodes: () => bay.nodes().filter((n) => inPatch(n.id.split(':')[1])),
    ports: () => bay.ports().filter((p) => inPatch(p.id.split(':')[1])),
    links: () => bay.links(),
  };
  const pb = createPatchbay(view, {
    flowing: (l) => (l.from === ID('lfo', 'audio-out') ? synth.on() : synth.sounding()),
  });

  const top = el('div', 'cc-top');
  top.append(transport.el, picker.el);
  const out = el('div', 'cc-stack');
  // The waveform, the knob group and the keys are three blocks of the page,
  // not glued (asked 2026-10-10, *"scope knobs keys are different blocks not
  // glued. just hide them when not there"*).
  out.append(top, wave.el, bank.el, keysHost, pb.el);
  d.el.append(out);
  for (const [name, v] of Object.entries(step.preset)) {
    synth.setParam(KNOBS.find((x) => x.name === name).owner, name, v);
    knobs.get(name).set(knobRaw(name, v), { quiet: true });
  }
  apply(step.patch);
  window.__demo.synth = synth;
  d.ready();
</script>
