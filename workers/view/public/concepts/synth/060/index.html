<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>POSITRON concept synth 060</title>
<link rel="stylesheet" href="/shell/shell.css">
<script type="module">
  import { conceptNav } from '/concepts/nav.mjs';
  import { mount } from '/shell/shell.mjs';
  import { modulePage } from '/concepts/synth/module-page.mjs';

  // One module, an amp with an envelope. The keys go to the oscillator for
  // the pitch and to the amp for when the note opens and closes, so attack and
  // release are the only knobs. Split out of synth/040 on 2026-10-13, where it
  // was step 5 on a test tone; the voice is ../patch-synth.mjs and the page is
  // ../module-page.mjs.
  const d = mount({ name: 'concept synth 060', what: '', readout: null, index: '/concepts/', indexLabel: 'concepts' });
  conceptNav('synth/060');
  modulePage(d, {
    patch: `web:keys:midi-out -> web:osc:midi-in
web:keys:midi-out -> web:amp:midi-in
web:osc:audio-out -> web:amp:audio-in
web:amp:audio-out -> web:speaker:audio-in
web:amp:audio-out -> web:scope:audio-in`,
    knobs: ['attack', 'release'],
    preset: { wave: 'triangle', attack: 0.15, release: 0.8 },
  });
  d.ready();
</script>
