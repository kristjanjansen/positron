<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON concept 650</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* Start and stop on their own row at the left, the camera picker after them
     once there is more than one camera. A flex row blockifies the group, so it
     sits on no text line; on a phone the picker wraps under it. */
  .cc-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .cc-top > .pos-bgroup { flex: none; width: auto; }
  .cc-top > .pos-pick[hidden] { display: none; }
  /* The camera as it is on the left, the same camera after it has been to
     Cloudflare and back on the right, each half the content width, as
     /concepts/610/. On a phone they stack, the original first. */
  .cc-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 560px) { .cc-pair { grid-template-columns: minmax(0, 1fr); } }
  .cc-pair canvas { display: block; width: 100%; height: 100%; }
  .cc-say { font-size: 12px; color: var(--dim); }
  /* A footer line never wraps: one line, cut at the slot's edge. */
  .pos-vp-foot .cc-say { white-space: nowrap; overflow: hidden; }
</style>
<script type="module">
  import { conceptNav } from '/concepts/nav.mjs';
  import { mount, el, armVideo } from '/shell/shell.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { drawCamera, FRAME_W, FRAME_H } from '/shell/pattern.mjs';
  import { fetchIceServers, camWhipPublish, camWhep, whepPlay, CAM_WHIP_PROXY } from '/shell/live.mjs';

  // /concepts/600/ with a round trip through Cloudflare beside it. The camera
  // feeds two pictures: the original, camera -> screen, and a loopback, camera
  // -> Stream live input by WHIP -> back by WHEP -> loopback. The publish goes
  // through pub.positron.studio/cam/whip, so the input's key never reaches this
  // page, onto /cam/'s own WebRTC input (CAM_WHIP_UID in live.mjs), exactly as
  // /concepts/060/'s broadcast does. What the right panel shows has been
  // encoded here, sent to Cloudflare, forwarded back, decoded and drawn.
  //
  // 🔴 EACH PRESS IS REAL CLOUDFLARE STREAM MINUTES, AND AT MOST 10 SECONDS OF
  // THEM. One WHIP publish and one WHEP play, billed by the minute delivered
  // whatever the protocol (positron-streaming). Twenty seconds after the
  // publish is accepted the right picture has faded to the ground over
  // its last three, both pictures together, and the page stops itself exactly as a stop press does, so
  // one press is bounded at about twenty seconds on each leg. Asked for:
  // "limit to 10 sec. just fade out", then "limit to 20sec. fade out sloowly".
  //
  // 🔴 IT SHARES /cam/'s ONE WHIP INPUT. The worker allows one camera on it at a
  // time, so a publish answered 409 means somebody else is on air there, /cam/
  // or /concepts/060/'s broadcast. That is said in words in the log and the
  // footer, and nothing is retried.
  //
  // ⚠️ A VPN PASSES THE HANDSHAKE AND DROPS THE MEDIA. With the Check Point
  // tunnel up, WHIP and WHEP both answer 201 and no frame ever arrives (CLAUDE.md,
  // measured 2026-09-25). So when the play side has signalled and no frame has
  // been decoded after a while, the log names that as one possibility, never as
  // the cause.
  //
  // NOTHING OPENS ON A VISIT. The camera, the relay servers, the publish and the
  // play are all made on the start press.
  const S = 'web';
  const CAM = `${S}:camera:video-out`, SCREEN = `${S}:screen:video-in`;
  const LIVE_IN = 'cf-stream:live:video-in', LIVE_OUT = 'cf-stream:live:video-out';
  const LOOP = `${S}:loopback:video-in`;
  // 20 s a press, the last 5 of them a slow fade (asked 2026-10-10, *"limit to
  // 20sec. fade out sloowly"*, then *"fade out bit faster, both videopanels"*).
  const NO_MEDIA_MS = 7000, CAP_MS = 20000, FADE_MS = 3000;

  const d = mount({ name: 'concept 650', what: '', readout: null, index: '/concepts/', indexLabel: 'concepts' });
  conceptNav('650');

  // ── the bay ─────────────────────────────────────────────────────────────
  // The same model as /concepts/060/: the camera's video goes to Stream's live
  // input by WHIP, and comes back out of it by WHEP. Both transports are named
  // on the ports, so the links carry them.
  const bay = createBay();
  const camNode = (label) => bay.addNode({ id: `${S}:camera`, kind: 'device', label, place: 'browser' });
  camNode('camera');
  bay.addNode({ id: `${S}:screen`, kind: 'screen', label: 'original', place: 'browser' });
  bay.addNode({ id: 'cf-stream:live', kind: 'endpoint', label: 'Stream live input', place: 'cloudflare', net: 'cloudflare' });
  bay.addNode({ id: `${S}:loopback`, kind: 'screen', label: 'loopback', place: 'browser' });
  bay.addPort({ id: CAM, label: 'camera', dir: 'out', medium: 'video', transports: ['page', 'whip'] });
  bay.addPort({ id: SCREEN, label: 'original', dir: 'in', medium: 'video' });
  bay.addPort({ id: LIVE_IN, label: 'video', dir: 'in', medium: 'video', transports: ['whip'] });
  bay.addPort({ id: LIVE_OUT, label: 'video', dir: 'out', medium: 'video', transports: ['whep'] });
  bay.addPort({ id: LOOP, label: 'loopback', dir: 'in', medium: 'video', transports: ['whep'] });

  const held = new Map();          // "from to" -> link id
  function hold(a, b, via) {
    const k = `${a} ${b}`;
    if (held.has(k)) return true;
    bay.seen(a); bay.seen(b);
    const r = bay.link(a, b, [], { site: S, ...(via ? { via } : {}) });
    if (r.ok) { held.set(k, r.id); return true; }
    d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
    return false;
  }
  const holds = (a, b) => held.has(`${a} ${b}`);
  // Held from load, so the picture of the patch is the same running or not.
  // Holding a link opens nothing; the camera and both legs wait for the press.
  hold(CAM, SCREEN);
  hold(CAM, LIVE_IN, 'whip');
  hold(LIVE_OUT, LOOP, 'whep');

  // ── the camera, and the picture that comes back ─────────────────────────
  const video = el('video');
  video.muted = true; video.playsInline = true; video.autoplay = true;
  const back = el('video');
  back.muted = true; back.playsInline = true; back.autoplay = true;
  let cam = null, gen = 0, raf = 0;
  let devices = [], deviceId = null;
  let pub = null, sub = null, statsTimer = 0, ice = null, noMedia = 0, capTimer = 0, endAt = 0;
  // When the last frame was presented, per video element: what lights a video wire.
  const last = new Map([[video, 0], [back, 0]]);
  function watchFrames(v) {
    if (typeof v.requestVideoFrameCallback !== 'function') return;
    const tick = () => { if (!cam) return; last.set(v, performance.now()); v.requestVideoFrameCallback(tick); };
    v.requestVideoFrameCallback(tick);
  }
  const fresh = (v) => !!cam && performance.now() - last.get(v) < 500;

  // ── the two pictures ────────────────────────────────────────────────────
  // Both drawn by the test picture's own `drawCamera`, contained, no scrim,
  // so the only difference between them is the round trip.
  const GROUND = '#0b0e14';
  function canvasPanel() {
    const c = el('canvas');
    c.width = FRAME_W; c.height = FRAME_H;
    const ctx = c.getContext('2d', { alpha: false });
    return { c, ctx };
  }
  const L = canvasPanel(), R = canvasPanel();
  // Footers as on /concepts/600/: one line, empty until on, the name at the
  // left and the value at the right beside the full-screen button.
  const name = el('span', 'cc-say', '');
  const size = el('span', 'cc-say', '');
  const panel = createVideoPanel({ media: L.c, left: name });
  panel.el.querySelector('.pos-vp-r').prepend(size);
  // The loopback's footer is what getStats() of the WHEP connection measured,
  // each cell empty until it has been read. The word at the left is where the
  // round trip has got to, and the words for a refusal.
  // ⚠️ FOUR CELLS, BECAUSE FOUR IS WHAT FITS ONE LINE OF A HALF PANEL AT 1280.
  // The codec and the decoded and dropped counts are the row's hover.
  const state = el('span', 'cc-say', '');
  const loopPanel = createVideoPanel({ media: R.c, left: state, values: [
    { key: 'size', label: '', reserve: 7 },
    { key: 'fps', label: 'fps', reserve: 2 },
    { key: 'rate', label: 'kbit/s', reserve: 4 },
    { key: 'rtt', label: 'rtt', reserve: 4 },
  ] });
  const V = loopPanel.values;
  const pair = el('div', 'cc-pair');
  pair.append(panel.el, loopPanel.el);

  // The routing follows the links: without camera -> original the left panel
  // is the ground; without the WHEP link the right one is.
  // `alpha` below 1 lays the picture over the ground at that strength, which
  // is how the right one fades out over the last second of the cap.
  function paint(p, v, on, alpha = 1) {
    p.ctx.globalAlpha = 1;
    if (on && alpha < 1) { p.ctx.fillStyle = GROUND; p.ctx.fillRect(0, 0, FRAME_W, FRAME_H); }
    if (on && alpha > 0 && v.readyState >= 2 && v.videoWidth > 0) {
      p.ctx.globalAlpha = alpha;
      drawCamera(p.ctx, v, FRAME_W, FRAME_H, { scrim: 0 });
      p.ctx.globalAlpha = 1;
    } else if (!on || alpha <= 0) { p.ctx.fillStyle = GROUND; p.ctx.fillRect(0, 0, FRAME_W, FRAME_H); }
  }
  const fade = () => (endAt ? Math.max(0, Math.min(1, (endAt - performance.now()) / FADE_MS)) : 1);
  function render() {
    // Both pictures fade together as the press runs out.
    paint(L, video, !!cam && holds(CAM, SCREEN), fade());
    paint(R, back, !!cam && !!sub && holds(LIVE_OUT, LOOP), fade());
  }
  function frame() { render(); if (cam) raf = requestAnimationFrame(frame); }
  render();

  // ── what getStats() says, about once a second ───────────────────────────
  // Two connections: the publish (bytes sent, which lights the WHIP wire) and
  // the play (everything in the footer, and frames decoded for the WHEP wire).
  const stat = { pub: 'new', play: 'new', sent: 0, sending: false, bytes: 0, at: 0, decoded: 0, arriving: false };
  async function readPub() {
    const p = pub?.pc;
    if (!p) return;
    const stats = await p.getStats().catch(() => null);
    if (!stats || p !== pub?.pc) return;
    let sent = 0;
    for (const s of stats.values()) if (s.type === 'outbound-rtp' && s.kind === 'video') sent += s.bytesSent || 0;
    stat.sending = sent > stat.sent;
    stat.sent = sent;
  }
  async function readPlay() {
    const p = sub?.pc;
    if (!p) return;
    const stats = await p.getStats().catch(() => null);
    // Stopped while the reading was in flight: nothing lands in emptied cells.
    if (!stats || p !== sub?.pc) return;
    let vin = null, rtt = null;
    for (const s of stats.values()) {
      if (s.type === 'inbound-rtp' && s.kind === 'video') vin = s;
      if (s.type === 'candidate-pair' && s.state === 'succeeded' && s.nominated !== false
        && Number.isFinite(s.currentRoundTripTime)) rtt = s.currentRoundTripTime * 1000;
    }
    if (rtt != null) V.set('rtt', `${rtt < 1 ? rtt.toFixed(1) : Math.round(rtt)} ms`);
    if (!vin) { stat.arriving = false; return; }
    const now = performance.now();
    const bytes = vin.bytesReceived || 0;
    if (stat.at) {
      const kbps = ((bytes - stat.bytes) * 8) / (now - stat.at);
      if (bytes > 0) V.set('rate', Math.round(kbps));
    }
    stat.bytes = bytes; stat.at = now;
    const decoded = vin.framesDecoded || 0;
    stat.arriving = decoded > stat.decoded;
    stat.decoded = decoded;
    if (vin.frameWidth && vin.frameHeight) V.set('size', `${vin.frameWidth}x${vin.frameHeight}`);
    if (Number.isFinite(vin.framesPerSecond)) V.set('fps', Math.round(vin.framesPerSecond));
    const codec = vin.codecId && stats.get(vin.codecId);
    const cname = codec?.mimeType ? codec.mimeType.replace(/^video\//i, '') : '';
    if (cname && cname !== stat.cname) d.log(`the WHEP leg decodes ${cname}`);
    stat.cname = cname;
    V.el.title = `${cname}\n${decoded} frames decoded\n${vin.framesDropped ?? 0} dropped`.trim();
    if (stat.arriving && state.textContent !== 'playing') state.textContent = 'playing';
    Object.assign(stat, {
      w: vin.frameWidth, h: vin.frameHeight, fps: vin.framesPerSecond, rtt,
      codec: codec?.mimeType || null, dropped: vin.framesDropped,
    });
  }
  async function readStats() { await Promise.all([readPub(), readPlay()]); pb.refresh(); }
  const clearStats = () => {
    for (const k of V.keys()) V.set(k, '');
    V.el.title = '';
    Object.assign(stat, { sent: 0, sending: false, bytes: 0, at: 0, decoded: 0, arriving: false, cname: '' });
  };

  // The HTTP status of the last request to a URL, from resource timing, so the
  // log can say 201 rather than "ok". Empty where the browser does not say.
  const statusOf = (prefix) => {
    const e = performance.getEntriesByType('resource').filter((x) => x.name.startsWith(prefix)).pop();
    return e?.responseStatus || '';
  };

  // ── the round trip ──────────────────────────────────────────────────────
  async function roundTrip(mine) {
    if (!holds(CAM, LIVE_IN)) { d.log(`${CAM} -> ${LIVE_IN} is not held, so nothing is sent`); return; }
    d.log('this costs Cloudflare Stream minutes, one WHIP publish and one WHEP play, until stop', 'warn');
    state.textContent = 'publishing';
    ice = ice || await fetchIceServers({ log: (m) => d.log(`webrtc ${m}`) });
    if (gen !== mine) return;
    let p;
    try {
      p = await camWhipPublish(cam, { iceServers: ice.iceServers, log: (m, k) => d.log(`webrtc ${m}`, k) });
    } catch (e) {
      if (gen !== mine) return;
      const busy = /\b409\b/.test(e.message);
      d.log(busy ? 'publish 409: another camera is on /cam/\'s input (/cam/ or concept 060 is on air), so nothing was sent'
        : `the publish did not start: ${e.message}`, 'bad');
      state.textContent = busy ? 'another camera is on air' : 'did not publish';
      stat.pub = 'refused';
      return;
    }
    if (gen !== mine) { p.stop(); return; }
    pub = p;
    stat.pub = pub.pc.connectionState;
    d.log(`WHIP publish answered ${statusOf(CAM_WHIP_PROXY) || 'ok'}: ${CAM} -> ${LIVE_IN}`, 'hi');
    // The cap starts when Cloudflare starts counting, and ends as a stop press.
    endAt = performance.now() + CAP_MS;
    capTimer = setTimeout(() => {
      if (gen !== mine) return;
      d.log(`${CAP_MS / 1000} s is the most one press runs through Cloudflare`);
      stop();
    }, CAP_MS);
    pub.pc.addEventListener('connectionstatechange', () => {
      stat.pub = pub?.pc.connectionState || 'closed';
      if (stat.pub === 'failed') d.log('the publish could not reach Cloudflare: UDP blocked, or a VPN, are both possible', 'bad');
      pb.refresh();
    });
    statsTimer = setInterval(readStats, 1000);
    if (!holds(LIVE_OUT, LOOP)) { d.log(`${LIVE_OUT} -> ${LOOP} is not held, so nothing is played back`); state.textContent = 'on air'; return; }
    state.textContent = 'connecting';
    let s;
    try {
      s = await whepPlay(camWhep(), back, { iceServers: ice.iceServers, log: (m, k) => d.log(`webrtc ${m}`, k) });
    } catch (e) {
      if (gen !== mine) return;
      d.log(`the play back did not start: ${e.message}`, 'bad');
      state.textContent = 'did not play';
      return;
    }
    if (gen !== mine) { try { s.pc.close(); } catch { /* fine */ } return; }
    sub = s;
    stat.play = sub.pc.connectionState;
    d.log(`WHEP play answered ${statusOf(camWhep()) || 'ok'}: ${LIVE_OUT} -> ${LOOP}`, 'hi');
    watchFrames(back);
    sub.pc.addEventListener('connectionstatechange', () => {
      stat.play = sub?.pc.connectionState || 'closed';
      d.log(`WHEP leg ${stat.play}`, stat.play === 'connected' ? 'hi' : stat.play === 'failed' ? 'bad' : '');
      pb.refresh();
    });
    // The handshake succeeded; if no frame is decoded within a while, say what
    // that shape usually is, as a possibility and with the state it was read from.
    noMedia = setTimeout(() => {
      if (gen !== mine || !sub || stat.decoded > 0) return;
      d.log(`no frame back after ${NO_MEDIA_MS / 1000} s with WHEP ${stat.play} and the publish ${stat.pub}. `
        + 'A VPN passes the handshake and drops WebRTC media, so that is one possibility to check first', 'warn');
      state.textContent = 'no media yet, a VPN?';
    }, NO_MEDIA_MS);
  }

  const lit = (l) => {
    if (l.from === CAM && l.to === SCREEN) return fresh(video);
    if (l.from === CAM && l.to === LIVE_IN) return stat.pub === 'connected' && stat.sending;
    if (l.from === LIVE_OUT) return stat.play === 'connected' && stat.arriving;
    return false;
  };
  const pb = createPatchbay(bay, { flowing: lit });

  // ── start and stop ──────────────────────────────────────────────────────
  async function start() {
    const mine = ++gen;
    armVideo(video); armVideo(back);   // before any await, or iOS refuses later
    let s;
    try {
      s = await navigator.mediaDevices.getUserMedia({
        video: { ...(deviceId ? { deviceId: { exact: deviceId } } : {}),
          width: { ideal: FRAME_W }, height: { ideal: FRAME_H }, frameRate: { ideal: 30 } },
        audio: false,
      });
    } catch (e) {
      const why = e?.name === 'NotAllowedError' ? 'the camera was refused'
        : e?.name === 'NotFoundError' ? 'this machine has no camera'
        : `the camera did not start (${e?.name || e})`;
      d.log(`${why}, so nothing was sent anywhere`, 'bad');
      face(false);
      return;
    }
    if (gen !== mine) { s.getTracks().forEach((t) => t.stop()); return; }
    cam = s;
    const track = cam.getVideoTracks()[0];
    const set = track.getSettings();
    deviceId = set.deviceId || deviceId;
    video.srcObject = cam;
    video.play().catch(() => {});
    // A camera's label ends in its USB ids, `(2C0E:82E3)`, which name nothing a reader needs.
    const label = (track.label || '').replace(/\s*\([0-9a-f]{4}:[0-9a-f]{4}\)\s*$/i, '');
    name.textContent = label;
    size.textContent = set.width && set.height ? `${set.width}x${set.height}` : '';
    camNode(label || 'camera');
    d.log(`camera on: ${track.label || 'default'} at ${set.width}x${set.height}`, 'hi');
    watchFrames(video);
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(frame);
    face(true);
    pb.refresh();
    try { await roundTrip(mine); } catch (e) { d.log(`the round trip did not start: ${e?.message || e}`, 'bad'); }
    pb.refresh();
    await listCameras();
  }

  function stop() {
    gen++;
    clearInterval(statsTimer); clearTimeout(noMedia); clearTimeout(capTimer);
    endAt = 0;
    const p = pub, s = sub;
    pub = sub = null;
    try { s?.pc.close(); } catch { /* fine */ }
    p?.stop();
    stat.pub = 'closed'; stat.play = 'closed';
    for (const v of [video, back]) {
      v.srcObject?.getTracks?.().forEach((t) => t.stop());
      try { v.pause(); } catch { /* fine */ }
      v.srcObject = null;
    }
    cam?.getTracks().forEach((t) => t.stop());
    cam = null;
    cancelAnimationFrame(raf);
    name.textContent = ''; size.textContent = ''; state.textContent = '';
    clearStats();
    render();
    pb.refresh();
    face(false);
    d.log(p || s ? 'off air: the publish ended, the play closed, every track stopped' : 'camera off, every track stopped');
  }
  addEventListener('pagehide', () => { if (cam) stop(); });

  // ── which camera, once there is more than one ───────────────────────────
  // Device labels are empty until the camera has been allowed, so the list is
  // read after the first start and never on a visit.
  const picker = createPicker({ what: 'camera',
    prev: () => pick((at() - 1 + devices.length) % devices.length),
    next: () => pick((at() + 1) % devices.length),
    onPick: (i) => pick(i) });
  picker.el.hidden = true;
  const at = () => Math.max(0, devices.findIndex((x) => x.deviceId === deviceId));
  async function listCameras() {
    try {
      devices = (await navigator.mediaDevices.enumerateDevices()).filter((x) => x.kind === 'videoinput');
    } catch { devices = []; }
    picker.options(devices.map((x, i) => x.label || `camera ${i + 1}`));
    picker.show(at());
    picker.el.hidden = devices.length < 2;
  }
  async function pick(i) {
    const dev = devices[i];
    if (!dev || dev.deviceId === deviceId) return;
    deviceId = dev.deviceId;
    picker.show(i);
    if (cam) { stop(); await start(); }
  }

  const transport = createButtonGroup({ buttons: [
    { id: 'cam', icon: 'video', label: 'start the camera', onPress: () => (cam ? stop() : start()) },
  ] });
  // The group itself disables the button while a press's promise runs, so a
  // second press cannot start a second camera while the prompt is up.
  function face(on) {
    transport.setIcon('cam', on ? 'stop' : 'video', on ? 'stop the camera' : 'start the camera');
  }

  const top = el('div', 'cc-top');
  top.append(transport.el, picker.el);
  d.stack.add(top, pair, pb.el);
  window.__demo.loopback = { stat, values: () => Object.fromEntries(V.keys().map((k) => [k, V.cell(k).textContent])), state: () => state.textContent };
  d.ready();
</script>
