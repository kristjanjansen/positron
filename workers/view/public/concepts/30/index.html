<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON concept 30</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .cc-stack { display: flex; flex-direction: column; gap: 12px; }
  /* Two pictures side by side, each half the content width; one under the other on a phone. As /concepts/14/. */
  .cc-pair { display: flex; gap: 12px; align-items: flex-start; }
  .cc-pair > * { flex: 1 1 0; min-width: 0; }
  /* In a column a 0 basis is a 0 height, so on a phone each panel takes its own height. */
  @media (max-width: 560px) { .cc-pair { flex-direction: column; align-items: stretch; } .cc-pair > * { flex: none; } }
  .cc-say { font-size: 12px; color: var(--dim); }
  /* The kit's live wave (grain-scope) as a panel's picture: the panel's stage is the
     edge and the ground, so the scope gives up its own margin, border and corner
     through the kit's tokens, and its always-empty caption takes no room. The stage
     is as tall as the scope rather than 16:9 (`aspect: 'auto'`). */
  .cc-wave .pos-scope { margin: 0; --edge: 0px; --r: 0px; }
  .cc-wave .pos-scope-gut { display: none; }
  /* Play and the crossfader, centred under the two panels. The slider takes the
     row between its two named ends, as /grains/ draws its blend. */
  .cc-fade { display: flex; align-items: center; gap: 14px; width: min(100%, 520px); margin-inline: auto; }
  .cc-fade .cc-end { font: 400 12px/1 var(--mono); color: var(--dim); white-space: nowrap; }
  /* The kit stretches a button group across a phone; this one is one glyph square beside the fader. */
  .cc-fade > .pos-bgroup { flex: none; width: auto; }
  .cc-fade > .sld { flex: 1 1 auto; min-width: 0; }
  .cc-fade > .sld > .sld-lane { width: auto; flex: 1 1 auto; }
  .cc-fade > .sld > .sld-head:not(:has(.sld-l:not(:empty))) { display: none; }
</style>
<script type="module">
  import { conceptNav } from '/concepts/nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createGrainScope } from '/shell/grain-scope.mjs';
  import { createSlider } from '/shell/slider.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { setSymbol } from '/shell/symbol.mjs';
  import { createMp3Stream } from '/shell/mp3-stream.mjs';

  // A simple radio as a patchbay: one ERR station and one Ida station, each an
  // external site, into a crossfader in this tab, into the speakers. The streams
  // come through positron's own relay (`shout`), which holds ONE upstream
  // connection per mount, exactly as /radio/ reaches them. `?base=` points the
  // page at demo/fake-station.mjs instead.
  //
  // NOTHING OPENS ON A VISIT. No AudioContext, no fetch and no link to either
  // station until somebody presses play. The bay enforces the same thing: an
  // `external` node refuses a link out of it unless the link carries
  // `consent: true`, which only the press passes.
  const BASE = new URLSearchParams(location.search).get('base') || 'https://shout.positron.studio';
  const S = 'web';
  const STATIONS = [
    { key: 'err', site: 'err', node: 'vikerraadio', mount: 'vikerraadio', name: 'ERR Vikerraadio', label: 'Vikerraadio', kbps: 128 },
    { key: 'ida', site: 'ida', node: 'tallinn', mount: 'ida-tallinn', name: 'Ida Tallinn', label: 'Ida Radio Tallinn', kbps: 320 },
  ];
  const outOf = (st) => `${st.site}:${st.node}:audio-out`;
  const FADER_IN = `${S}:fader:audio-in`, FADER_OUT = `${S}:fader:audio-out`, SPEAKER_IN = `${S}:speaker:audio-in`;

  // ── the bay ─────────────────────────────────────────────────────────────
  const bay = createBay();
  for (const st of STATIONS) {
    bay.addNode({ id: `${st.site}:${st.node}`, kind: 'external', label: st.label, place: st.site, net: st.site });
    bay.addPort({ id: outOf(st), label: st.label, dir: 'out', medium: 'audio', transports: ['https'],
      address: `${BASE}/${st.mount}` });
  }
  bay.addNode({ id: `${S}:fader`, kind: 'engine', label: 'crossfader', place: 'browser' });
  bay.addNode({ id: `${S}:speaker`, kind: 'screen', label: 'speakers', place: 'browser' });
  bay.addPort({ id: FADER_IN, label: 'crossfader', dir: 'in', medium: 'audio' });
  bay.addPort({ id: FADER_OUT, label: 'crossfader', dir: 'out', medium: 'audio' });
  bay.addPort({ id: SPEAKER_IN, label: 'speakers', dir: 'in', medium: 'audio' });

  const d = mount({ name: 'concept 30', what: '', readout: null, index: '/concepts/', indexLabel: 'concepts' });
  conceptNav(30);

  // ── the sound: two streams, two gains, one AudioContext ──────────────────
  let ctx = null, sum = null;
  const legs = new Map();          // key -> { stream, gain, tap, buf, live }
  let x = 0.5;                     // 0 is all ERR, 1 is all Ida
  const gains = () => [Math.cos(x * Math.PI / 2), Math.sin(x * Math.PI / 2)];   // equal power
  function applyFade() {
    if (!ctx) return;
    const t = ctx.currentTime, g = gains();
    STATIONS.forEach((st, i) => legs.get(st.key)?.gain.gain.setTargetAtTime(g[i], t, 0.02));
  }

  // ── the links ───────────────────────────────────────────────────────────
  const held = new Map();          // "from to" -> link id
  function hold(a, b, opts) {
    const k = `${a} ${b}`;
    if (held.has(k)) return true;
    bay.seen(a); bay.seen(b);
    const r = bay.link(a, b, [], { site: S, ...opts });
    if (r.ok) { held.set(k, r.id); return true; }
    d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
    return false;
  }
  function drop(a, b) {
    const k = `${a} ${b}`;
    if (held.has(k)) { bay.unlink(held.get(k)); held.delete(k); }
  }

  hold(FADER_OUT, SPEAKER_IN);
  // Asked once on load WITHOUT consent, so the refusal is on the page in the bay's own words.
  hold(outOf(STATIONS[0]), FADER_IN);

  const pb = createPatchbay(bay, {
    flowing: (l) => {
      if (l.from === FADER_OUT) return [...legs.values()].some((g) => g.live);
      const st = STATIONS.find((s) => outOf(s) === l.from);
      return !!(st && legs.get(st.key)?.live);
    },
  });

  // ── the pictures: the kit's live wave in a video panel per station ───────
  const scopes = new Map();
  const panels = STATIONS.map((st) => {
    const host = el('div', 'cc-wave');
    const scope = createGrainScope(host, { seconds: 4, height: 150, fullScale: 1 });
    scopes.set(st.key, scope);
    return createVideoPanel({ media: host, aspect: 'auto', left: el('span', 'cc-say', st.name),
      centre: el('span', 'cc-say', `${st.kbps} kbit/s`) });
  });
  const pair = el('div', 'cc-pair');
  pair.append(...panels.map((p) => p.el));

  function frame() {
    if (!legs.size) return;
    for (const [key, g] of legs) {
      if (!g.live) continue;
      g.tap.getFloatTimeDomainData(g.buf);
      scopes.get(key).feed(g.buf, ctx.sampleRate);
    }
    requestAnimationFrame(frame);
  }

  // ── play and stop ───────────────────────────────────────────────────────
  let playing = false;
  function play() {
    ctx ??= new AudioContext();
    ctx.resume();
    if (!sum) { sum = ctx.createGain(); sum.connect(ctx.destination); }
    playing = true;
    for (const st of STATIONS) {
      // The press is the person asking to listen, so the link carries consent.
      if (!hold(outOf(st), FADER_IN, { consent: true, via: 'https' })) continue;
      const gain = ctx.createGain(), tap = ctx.createAnalyser();
      tap.fftSize = 2048;
      const stream = createMp3Stream(ctx, { url: `${BASE}/${st.mount}`, log: (m) => d.log(`${st.label}: ${m}`) });
      // Through the tap, not beside it: an analyser nothing pulls from reads
      // silence, so the sound passes it on its way to the fader, as on /radio/.
      stream.node.connect(tap).connect(gain).connect(sum);
      const leg = { stream, gain, tap, buf: new Float32Array(tap.fftSize), live: false };
      legs.set(st.key, leg);
      stream.started.then((path) => {
        if (legs.get(st.key) !== leg) return;
        leg.live = true;
        d.log(`${st.label} playing, ${path}`);
      }).catch((e) => d.log(`${st.label} did not start: ${e?.message || e}`, 'warn'));
    }
    applyFade();
    pb.refresh();
    face();
    requestAnimationFrame(frame);
  }
  function stop() {
    playing = false;
    for (const st of STATIONS) {
      const g = legs.get(st.key);
      if (g) { try { g.stream.stop(); } catch { /* already stopped */ } try { g.gain.disconnect(); } catch { /* gone */ } }
      drop(outOf(st), FADER_IN);
    }
    legs.clear();
    pb.refresh();
    face();
  }

  const GLYPH = { play: '►', stop: '■' };
  const transport = createButtonGroup({ buttons: [
    { id: 'play', label: GLYPH.play, aria: 'play', onPress: () => (playing ? stop() : play()) },
  ] });
  function face() {
    const b = transport.button('play');
    setSymbol(b, playing ? GLYPH.stop : GLYPH.play);
    b.title = playing ? 'stop' : 'play';
    b.setAttribute('aria-label', b.title);
  }
  face();

  const fader = createSlider({ label: '', aria: 'crossfade', min: 0, max: 1, step: 0.01, value: x,
    onInput: (v) => { x = v; applyFade(); } });
  const fade = el('div', 'cc-fade');
  fade.append(transport.el, el('span', 'cc-end', 'ERR'), fader.el, el('span', 'cc-end', 'Ida'));

  const out = el('div', 'cc-stack');
  out.append(pair, fade, pb.el);
  d.el.append(out);
  d.ready();
</script>
