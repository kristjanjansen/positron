<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON concepts 14</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .cc-stack { display: flex; flex-direction: column; gap: 12px; }
  .cc-h { margin: 0; font-size: 14px; color: var(--dim); font-weight: 500; }
  /* The picture is half the content width. */
  .cc-half { width: 50%; }
  @media (max-width: 560px) { .cc-half { width: 100%; } }
  .cc-vis { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  /* record is red, the one control that starts writing (shell.css --rec) */
  .cc-rec { color: var(--rec, #e5484d); }
  /* The same medium colours as /concepts/1/. */
  :root {
    --md-midi: #6fb8e8; --md-audio: #ee9a4d; --md-clock: #c9ced6; --md-value: #9ad16b;
    --md-video: #e07a5f; --md-program: #c39af0; --md-file: #a89a8a; --md-state: #8a9fc4;
  }
  .md-midi { color: var(--md-midi); } .md-audio { color: var(--md-audio); }
  .md-clock { color: var(--md-clock); } .md-value { color: var(--md-value); }
  .md-video { color: var(--md-video); } .md-program { color: var(--md-program); }
  .md-file { color: var(--md-file); } .md-state { color: var(--md-state); }
</style>
<script type="module">
  import { mount, el } from '/shell/shell.mjs';
  import { createTable } from '/shell/table.mjs';
  import { createKeyboard, keyRange } from '/shell/keyboard.mjs';
  import { createBay, printLink } from '/shell/bay.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createStripView } from '/shell/strip.mjs';
  import { createGlue } from '/shell/glue.mjs';
  import { setSymbol } from '/shell/symbol.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';

  // /concepts/12/ with the kit's own transport bar and timeline glued together in
  // place of the hand-made record buttons and notes table. A take is items on a
  // DECK; the deck plays them back through an adapter that sends each note out of
  // rec:midi-out. /concepts/10/ plus a RECORDER, a node of its own: `rec:midi-in` takes the
  // keyboard's notes along a link while armed, `rec:midi-out` plays them back
  // into the synth along another.
  const S = 'web';
  const bay = createBay();
  const DIR = { in: '→○', out: '○→' };
  for (const [n, kind, label] of [['keys', 'person', 'keyboard'], ['synth', 'engine', 'saw'], ['rec', 'store', 'recorder'], ['speaker', 'screen', 'speakers'], ['dots', 'engine', 'dots'], ['screen', 'screen', 'picture']]) {
    bay.addNode({ id: `${S}:${n}`, kind, label, place: 'browser' });
  }

  // ── the synth: one sine per held note, a short fade in and out ──────────
  let ctx = null, bus = null;
  const voices = new Map();
  // The audio graph follows the links: the synth's bus reaches the speakers only
  // while synth:audio-out -> speaker:audio-in is held.
  function audio() {
    if (!ctx) return;
    bus ??= ctx.createGain();
    bus.disconnect();
    if (bay.links().some((l) => l.from === `${S}:synth:audio-out` && l.to === `${S}:speaker:audio-in`)) bus.connect(ctx.destination);
  }

  const hz = (n) => 440 * 2 ** ((n - 69) / 12);
  function noteOn(n, vel) {
    if (!ctx) { ctx = new AudioContext(); audio(); }
    if (voices.has(n)) return;
    const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
    o.type = 'sawtooth';
    o.frequency.value = hz(n);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.08 * (vel / 127), t + 0.01);
    o.connect(g).connect(bus);
    o.start();
    voices.set(n, { o, g });
  }
  function noteOff(n) {
    const v = voices.get(n);
    if (!v) return;
    const t = ctx.currentTime;
    v.g.gain.cancelScheduledValues(t);
    v.g.gain.setValueAtTime(v.g.gain.value, t);
    v.g.gain.linearRampToValueAtTime(0, t + 0.05);
    v.o.stop(t + 0.06);
    voices.delete(n);
  }

  // ── the shader: dots that wheel away from where a note was played ─────
  // In the manner of dotpiano.com. A held note keeps dropping dots; each dot is
  // born on an arc at its pitch, in its pitch class's colour, sized by velocity,
  // then turns around the centre, drifts outward and fades. The dots live here
  // in JavaScript and reach the shader as numbers, one vec4 each, every frame:
  // a shader cannot hear an event, it only reads the state it is handed.
  const MAXD = 96, DOT_EVERY = 45, LIFE = 3200, LO = 48, HI = 69;
  const held = new Map();          // note -> { vel, last }
  const dots = [];                 // { a0, r0, born, size, hue }
  function drop(n, vel, now) {
    const u = (n - LO) / (HI - LO);
    dots.push({ a0: 3.6 - u * 2.4, r0: 0.18, born: now, size: 0.012 + 0.022 * vel / 127, hue: (n % 12) / 12 });
    if (dots.length > MAXD) dots.shift();
  }
  function visOn(n, vel) { const now = performance.now(); held.set(n, { vel, last: now }); drop(n, vel, now); }
  function visOff(n) { held.delete(n); }
  const canvas = el('canvas', 'cc-vis');
  canvas.width = 1280; canvas.height = 720;
  const gl = canvas.getContext('webgl2');
  let prog = null, uN = null, uDots = null, uHue = null;
  if (gl) {
    const vs = `#version 300 es
      in vec2 p; out vec2 uv;
      void main() { uv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;
    const fs = `#version 300 es
      precision highp float;
      in vec2 uv; out vec4 o;
      uniform int uN; uniform vec4 uDots[${MAXD}]; uniform float uHue[${MAXD}];
      void main() {
        vec2 q = (uv - 0.5) * vec2(16.0 / 9.0, 1.0);
        vec3 c = vec3(0.0);
        for (int i = 0; i < ${MAXD}; i++) {
          if (i >= uN) break;
          vec4 d = uDots[i];                          // x, y, size, alpha
          float k = smoothstep(d.z, d.z * 0.4, length(q - d.xy)) * d.w;
          vec3 hue = 0.55 + 0.45 * cos(6.283 * (uHue[i] + vec3(0.0, 0.33, 0.67)));
          c = max(c, hue * k);
        }
        o = vec4(c, 1.0);
      }`;
    const sh = (t, src) => { const x = gl.createShader(t); gl.shaderSource(x, src); gl.compileShader(x); return x; };
    prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    // Said in the log once the page is mounted, so a shader that did not compile is visible.
    var shaderSays = gl.getProgramParameter(prog, gl.LINK_STATUS) ? 'the shader compiled'
      : `the shader did not compile: ${gl.getProgramInfoLog(prog)}`;
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    uN = gl.getUniformLocation(prog, 'uN'); uDots = gl.getUniformLocation(prog, 'uDots'); uHue = gl.getUniformLocation(prog, 'uHue');
  }
  function frame(now) {
    for (const [n, h] of held) if (now - h.last >= DOT_EVERY) { h.last = now; drop(n, h.vel, now); }
    while (dots.length && now - dots[0].born > LIFE) dots.shift();
    if (gl && prog) {
      const data = new Float32Array(MAXD * 4), hues = new Float32Array(MAXD);
      dots.forEach((d, i) => {
        const age = (now - d.born) / 1000;
        const a = d.a0 + age * 0.9, r = d.r0 + age * 0.09;
        data.set([Math.cos(a) * r, Math.sin(a) * r, d.size, 1 - age * 1000 / LIFE], i * 4);
        hues[i] = d.hue;
      });
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.useProgram(prog);
      gl.uniform1i(uN, dots.length); gl.uniform4fv(uDots, data); gl.uniform1fv(uHue, hues);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  let kb = null;
  const PORTS = [
    { id: `${S}:keys:midi-out`, dir: 'out', medium: 'midi', emits: ['note'], what: 'notes you play' },
    { id: `${S}:keys:midi-in`, dir: 'in', medium: 'midi', accepts: ['note'], what: 'notes that light the keys',
      deliver: (e) => (e.d2 ? kb?.press(e.d1, 'midi') : kb?.release(e.d1, 'midi')) },
    { id: `${S}:synth:midi-in`, dir: 'in', medium: 'midi', accepts: ['note'], what: 'notes the saw plays',
      deliver: (e) => (e.d2 ? noteOn(e.d1, e.d2) : noteOff(e.d1)) },
    { id: `${S}:synth:audio-out`, dir: 'out', medium: 'audio', what: 'the saw' },
    { id: `${S}:speaker:audio-in`, dir: 'in', medium: 'audio', what: 'what you hear' },
    { id: `${S}:rec:midi-in`, dir: 'in', medium: 'midi', accepts: ['note'], what: 'notes being recorded',
      deliver: (e) => take(e) },
    { id: `${S}:rec:midi-out`, dir: 'out', medium: 'midi', emits: ['note'], what: 'notes played back' },
    { id: `${S}:dots:midi-in`, dir: 'in', medium: 'midi', accepts: ['note'], what: 'notes the shader draws',
      deliver: (e) => (e.d2 ? visOn(e.d1, e.d2) : visOff(e.d1)) },
    { id: `${S}:dots:video-out`, dir: 'out', medium: 'video', what: 'the picture' },
    { id: `${S}:screen:video-in`, dir: 'in', medium: 'video', what: 'what you see' },
  ];
  for (const p of PORTS) bay.addPort(p);

  const d = mount({ name: 'concepts 14', what: '', readout: null, index: '/concepts/', indexLabel: 'concepts' });

  // ── the links, rebuilt whenever an effect changes ─────────────────────
  function patch() {
    for (const l of bay.links()) bay.unlink(l.id);
    const want = [[`${S}:keys:midi-out`, `${S}:synth:midi-in`, []]];
    // The recorder hears the keys; it plays back into the synth on a link of its own.
    want.push([`${S}:keys:midi-out`, `${S}:rec:midi-in`, []], [`${S}:rec:midi-out`, `${S}:synth:midi-in`, []]);
    want.push([`${S}:synth:audio-out`, `${S}:speaker:audio-in`, []]);
    // The shader hears the same notes as the synth, from the keys and from the
    // recorder, and its picture goes to the screen on this page.
    want.push([`${S}:keys:midi-out`, `${S}:dots:midi-in`, []], [`${S}:rec:midi-out`, `${S}:dots:midi-in`, []],
      [`${S}:dots:video-out`, `${S}:screen:video-in`, []]);
    for (const [a, b, tr] of want) {
      const r = bay.link(a, b, tr, { site: S });
      if (!r.ok) d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
    }
    for (const n of [...voices.keys()]) noteOff(n);
    audio();
    draw();
  }

  const portsT = createTable({ columns: [
    { key: 'id', label: 'port', grow: true, hi: true, clip: true },
    { key: 'dir', label: 'dir', width: 48 },
    { key: 'medium', label: 'medium', width: 72 },
    { key: 'heard', label: 'heard', width: 64, align: 'right' },
  ] });
  // ── the recorder: a deck, its bar and its strip ─────────────────────────
  const NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const nameOf = (n) => `${NAMES[n % 12]}${Math.floor(n / 12) - 1}`;
  const TAKE_MS = 20000;
  let armed = false, nid = 0;
  const notes = [];                // { n, vel, at, len } for the strip
  const open = new Map();          // note -> its row, until the key comes up

  // Playback: the deck fires each item at its position; the adapter sends it out
  // of rec:midi-out, where the bay's link takes it to the synth.
  const adapter = {
    caps: { rates: [1], continuous: false },
    actuate(payload) {
      if (armed) return;           // a note scheduled while recording already sounded from the keys
      bay.send(`${S}:rec:midi-out`, { cls: 'note', ch: 1, d1: payload.n, d2: payload.vel });
      draw();
    },
    reduce() { return {}; },
    assertState() { for (const n of [...voices.keys()]) noteOff(n); return {}; },
  };
  const deck = createDeck({ items: [], adapters: { note: adapter }, range: [0, TAKE_MS] });
  const pos = () => deck.transport.position();

  function take(e) {
    if (!armed) return;
    const at = pos();
    deck.sched.schedule({ at, kind: 'note', id: `n${nid++}`, payload: { n: e.d1, vel: e.d2 } });
    if (e.d2) { const r = { n: e.d1, vel: e.d2, at, len: null }; notes.push(r); open.set(e.d1, r); }
    else { const r = open.get(e.d1); if (r) { r.len = at - r.at; open.delete(e.d1); } }
  }
  function record() {
    deck.pause();
    deck.sched.clear();
    notes.length = 0; open.clear();
    deck.seek(0);
    armed = true;
    deck.play();
    face();
  }
  function stopRecording() {
    armed = false;
    deck.pause();
    face();
  }
  function face() {
    const b = bar.extra?.('rec');
    if (!b) return;
    setSymbol(b, armed ? '■' : '●');
    b.title = armed ? 'stop recording' : 'record';
    b.classList.toggle('cc-rec', !armed);
  }

  const glue = el('div');
  const bar = createTransportBar(glue, deck, {
    scrub: false, loop: false, live: false,
    extras: [{ id: 'rec', label: '●', aria: 'record', title: 'record', onPress: () => (armed ? stopRecording() : record()) }],
  });
  const strip = createStripView(glue, deck, {
    size: 'auto', follow: true, gutter: 120,
    lanes: [
      { id: 'take', kind: 'note', label: 'take', height: 72, width: 2, as: 'ticks', terse: true,
        rows: () => notes.map((r, i) => ({ at: r.at, id: `t${i}`, kind: 'note', payload: r })),
        describeRow: (r) => [nameOf(r.payload.n), `vel ${r.payload.vel}`] },
    ],
  });
  const surface = createGlue(bar.el, strip.surface);
  face();

  const linksT = createTable({ columns: [
    { key: 'line', label: 'link', grow: true, hi: true, clip: true },
    { key: 'sent', label: 'sent', width: 64, align: 'right' },
  ], minRows: 8 });
  const sentOut = { n: 0 };
  function draw() {
    const all = bay.ports ? bay.ports() : [];
    const heard = new Map(all.map((p) => [p.id, p.heard]));
    portsT.set(PORTS.map((p) => ({ id: p.id, dir: DIR[p.dir], medium: p.medium, what: p.what,
      heard: p.dir === 'out' ? (p.id.endsWith('keys:midi-out') ? sentOut.n : '') : heard.get(p.id) ?? 0 })));
    const ls = bay.links ? bay.links() : [];
    linksT.set(ls.map((l) => ({ line: printLink(l), by: l.session?.transport || 'the bay, one event at a time', sent: l.sent })));
    for (const t of [portsT, linksT]) {
      for (const cell of t.el.querySelectorAll('.pos-tbl-body .pos-tbl-c')) {
        if (/^(midi|audio|video)$/.test(cell.textContent)) cell.classList.add(`md-${cell.textContent}`);
      }
    }
  }

  // A key press is one event leaving keys:midi-out, sent through the bay.
  const host = el('div');
  // C to A, 13 white keys: as many as the content width holds at the kit's 49 px minimum.
  kb = createKeyboard(host, {
    ...keyRange(21), base: 48,
    onDown: (note, how) => { if (how === 'midi') return; sentOut.n++; bay.send(`${S}:keys:midi-out`, { cls: 'note', ch: 1, d1: note, d2: 100 }); draw(); },
    onUp: (note, how) => { if (how === 'midi') return; bay.send(`${S}:keys:midi-out`, { cls: 'note', ch: 1, d1: note, d2: 0 }); },
  });

  patch();
  const out = el('div', 'cc-stack');
  d.log(gl ? (typeof shaderSays === 'string' ? shaderSays : 'no shader') : 'this browser has no WebGL2, so the picture stays dark', gl && /did not/.test(shaderSays || '') ? 'warn' : undefined);
  const panel = createVideoPanel({ media: canvas, left: false });
  panel.el.classList.add('cc-half');
  out.append(panel.el, surface, host, el('h3', 'cc-h', 'links'), linksT.el, el('h3', 'cc-h', 'ports'), portsT.el);
  d.el.append(out);
  d.ready();
</script>
