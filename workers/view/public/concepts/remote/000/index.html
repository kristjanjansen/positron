<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON concept remote 000</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* The play button alone at the top left. What the board says goes to the log
     only (asked 2026-10-11, *"rm AddSynth Morph on the Raspberry Pi, play the
     keys etc labelling from 060"*). */
  .cc-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .cc-top > .pos-bgroup { flex: none; width: auto; }
</style>
<script type="module">
  import { conceptNav } from '/concepts/nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createKnob } from '/shell/knob.mjs';
  import { createKnobGrid } from '/shell/knob-grid.mjs';
  import { createKeyboard, keyRange } from '/shell/keyboard.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createWaveShape } from '/shell/synth-view.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createBoard } from '/shell/board.mjs';
  import { makeCcSend } from '/shell/cc-adapter.mjs';
  import { BOARD_SITE, boardPort } from '/shell/graph-registry.mjs';

  // The keyboard and two knobs playing Yoshimi on the Raspberry Pi in studio-1,
  // the way /knobs/ does: notes and CCs go to the board over the relay through
  // board.mjs, and Yoshimi's sound comes back down the same socket.
  //
  // NOTHING OPENS ON A VISIT. The board (and so the relay socket) is made on the
  // Start press, never at load. A check run sends nothing to the shared board
  // unless ?board=1 is added, the same gate /knobs/ uses.
  const d = mount({ name: 'concept remote 000', what: '', joined: false,
    readout: { 'key to sound': 'ms', median: 'ms', 'round trip': 'ms', cushion: 'ms' }, index: '/concepts/', indexLabel: 'concepts' });
  conceptNav('remote/000');

  const q = new URLSearchParams(location.search);
  const ROOM = q.get('room') || 'studio-1';
  const MAY_PLAY = !SELFCHECK || q.get('board') === '1';
  // From /knobs/: AddSynth Morph is a bank and a program, never a name.
  const BANK = 115, PROGRAM = 32, PATCH = 'AddSynth Morph';
  const PATCH_SETTLE_MS = 900;
  // From /knobs/: 74 reaches the part's filter cutoff and 71 its resonance.
  // Both measured on this board as controls you can hear; 7, 11, 75, 76, 77,
  // 78 and 1 were measured and left out there, so they are left out here.
  const CUTOFF = 74, RESO = 71, CUTOFF_HOME = 127, NEUTRAL = 64;

  // ── the bay: this page's nodes and the ports the Pi announces ───────────
  // The Pi's ids are boardGraph's (demo/shell/graph-registry.mjs): the site is
  // `pi-1` and its room is `studio-1`, `yoshimi:midi-in` takes notes and CCs,
  // `yoshimi:audio-out` is its sound.
  const S = 'web';
  const id = (n, p) => `${S}:${n}:${p}`;
  const SYNTH_IN = boardPort('yoshimi', 'midi-in'), SYNTH_AUDIO = boardPort('yoshimi', 'audio-out');
  const bay = createBay();
  const KNOBS = [
    { name: 'cutoff', label: 'cutoff', cc: CUTOFF, home: CUTOFF_HOME },
    { name: 'resonance', label: 'reso', cc: RESO, home: NEUTRAL },
  ];
  bay.addNode({ id: `${S}:keys`, kind: 'person', label: 'keyboard', place: 'browser' });
  for (const k of KNOBS) bay.addNode({ id: `${S}:knob-${k.name}`, kind: 'person', label: `knob CC ${k.cc}`, place: 'browser' });
  bay.addNode({ id: `${BOARD_SITE}:yoshimi`, kind: 'engine', label: 'Yoshimi on the Pi', place: ROOM });
  bay.addNode({ id: `${S}:scope`, kind: 'screen', label: 'waveform', place: 'browser' });
  bay.addNode({ id: `${S}:speaker`, kind: 'screen', label: 'speakers', place: 'browser' });

  let board = null, armed = false;
  const gate = makeCcSend();
  function pump() {
    const out = gate.tick(performance.now());
    if (out && armed && board) board.send({ type: 'ctl.set', channel: 0, set: out.set });
  }
  // What reaches yoshimi:midi-in leaves for the board, and only once it is armed.
  function toSynth(ev) {
    if (ev.cls === 'note') {
      if (ev.d2 > 0 && armed) pressed(ev.d1);
      if (!armed || !board) return;
      board.send(ev.d2 > 0
        ? { type: 'note.on', note: ev.d1, vel: ev.d2, channel: 0 }
        : { type: 'note.off', note: ev.d1, channel: 0 });
    } else if (ev.cls === 'cc') {
      gate.put(ev.d1, ev.d2, { end: !!ev.end });
      pump();
    }
  }
  const PORTS = [
    { id: id('keys', 'midi-out'), dir: 'out', medium: 'midi', emits: ['note'] },
    ...KNOBS.map((k) => ({ id: id(`knob-${k.name}`, 'midi-out'), dir: 'out', medium: 'midi', emits: ['cc'] })),
    { id: SYNTH_IN, dir: 'in', medium: 'midi', accepts: ['note', 'cc'], deliver: toSynth },
    { id: SYNTH_AUDIO, dir: 'out', medium: 'audio' },
    { id: id('scope', 'audio-in'), dir: 'in', medium: 'audio' },
    { id: id('speaker', 'audio-in'), dir: 'in', medium: 'audio' },
  ];
  for (const p of PORTS) bay.addPort({ label: p.id.split(':').slice(1).join(':'), ...p });
  const LINKS = [
    [id('keys', 'midi-out'), SYNTH_IN],
    ...KNOBS.map((k) => [id(`knob-${k.name}`, 'midi-out'), SYNTH_IN]),
    [SYNTH_AUDIO, id('scope', 'audio-in')],
    [SYNTH_AUDIO, id('speaker', 'audio-in')],
  ];
  for (const [from, to] of LINKS) {
    const r = bay.link(from, to);
    if (!r.ok) d.log(`${from} -> ${to} refused: ${r.why}`, 'warn');
  }

  // ── the scope: an analyser on the board's playout, drawn full width ──────
  const WINDOW = 512, FULL = 0.25;
  const wave = createWaveShape({ reason: null, colour: '--hi', height: 120, name: '' });
  let analyser = null, buf = null, level = 0;
  function frame() {
    if (analyser) {
      analyser.getFloatTimeDomainData(buf);
      let i0 = 0, hi = 0;
      for (let i = 1; i < buf.length - WINDOW; i++) if (buf[i - 1] < 0 && buf[i] >= 0) { i0 = i; break; }
      for (const v of buf) { const a = v < 0 ? -v : v; if (a > hi) hi = a; }
      level = hi;
      const win = buf.subarray(i0, i0 + WINDOW);
      wave.set({ points: Array.from(win, (v) => Math.max(-1, Math.min(1, v / FULL))), reason: '', name: '' });
    }
    requestAnimationFrame(frame);
  }

  // ── the knobs, each its own node ─────────────────────────────────────────
  const knobs = new Map();
  for (const k of KNOBS) {
    const out = id(`knob-${k.name}`, 'midi-out');
    knobs.set(k.name, createKnob({
      label: k.label, min: 0, max: 127, step: 1, value: k.home, home: k.home, hand: true,
      onInput: (v) => bay.send(out, { cls: 'cc', ch: 1, d1: k.cc, d2: Math.round(v) }),
      onChange: (v) => bay.send(out, { cls: 'cc', ch: 1, d1: k.cc, d2: Math.round(v), end: true }),
    }));
  }
  const grid = createKnobGrid(knobs, { row: true });

  // ── the lags: what came back, against when the key went down ────────────
  // The four cells /concepts/sampler/030/ carries, measured the same way,
  // asked 2026-10-11: *"add readouts to all pi-driven synths. 4"*. Key to sound is measured
  // per press: the first 1 ms block after the press that is over ONSET and
  // three times what the 30 ms before it held, on the speaker's clock
  // (`getOutputTimestamp`, so the browser's own output latency is inside it).
  // The other cells are the parts this page can name: the Pi's round trip, the
  // playout cushion, the browser's output latency, and the path. What is left
  // over is the Pi's capture block and frame (JACK 512 x 3 at 48 kHz, 20 ms
  // frames), which the page cannot see on its own.
  const KEEP_MS = 200, ONSET = 0.02, WAIT_MS = 1500;
  const env = [];          // { at, peak } per 1 ms block, performance time
  const pending = [];      // presses still waiting for their sound
  const lags = [];         // the last 20 measured lags
  let lastLag = null, readUpTo = 0;
  function pressed(note) {
    const at = performance.now();
    pending.push({ note, at });
    while (pending.length > 8) pending.shift();
  }
  function listen() {
    if (!analyser || !buf) return;
    const ctx = board.ctx();
    const ts = ctx.getOutputTimestamp?.();
    if (!ts || !ts.performanceTime) return;
    analyser.getFloatTimeDomainData(buf);
    const sr = ctx.sampleRate, N = buf.length, blk = Math.round(sr / 1000);
    // the buffer's last sample is the context's current time
    const tEnd = ts.performanceTime + (ctx.currentTime - ts.contextTime) * 1000;
    const t0 = tEnd - (N / sr) * 1000;
    for (let i = 0; i + blk <= N; i += blk) {
      const at = t0 + (i / sr) * 1000;
      if (at <= readUpTo) continue;
      let pk = 0;
      for (let j = i; j < i + blk; j++) { const a = buf[j] < 0 ? -buf[j] : buf[j]; if (a > pk) pk = a; }
      env.push({ at, peak: pk });
      readUpTo = at;
      // an onset: over ONSET and three times the 30 ms before it
      let before = 0;
      for (let k = env.length - 31; k < env.length - 1; k++) if (k >= 0 && env[k].peak > before) before = env[k].peak;
      if (pk > ONSET && pk > before * 3) {
        const p = pending.find((x) => x.at < at);
        if (p) {
          pending.splice(pending.indexOf(p), 1);
          lastLag = at - p.at;
          lags.push(lastLag); if (lags.length > 20) lags.shift();
        }
      }
    }
    const now = performance.now();
    while (env.length && env[0].at < now - KEEP_MS) env.shift();
    for (let k = pending.length - 1; k >= 0; k--) if (now - pending[k].at > WAIT_MS) pending.splice(k, 1);
  }
  const cell = (k, v) => d.set(k, v);
  function lagCells() {
    const st = board?.stats();
    const med = lags.length ? [...lags].sort((x, y) => x - y)[lags.length >> 1] : null;
    cell('key to sound', lastLag == null ? '' : Math.round(lastLag));
    cell('median', med == null ? '' : Math.round(med));
    cell('round trip', st?.rttMs == null ? '' : Math.round(st.rttMs));
    cell('cushion', st?.bufferedMs == null ? '' : Math.round(st.bufferedMs));
  }
  function lagFrame() {
    listen();
    requestAnimationFrame(lagFrame);
  }
  setInterval(() => { if (board) lagCells(); }, 250);

  // ── the keyboard ────────────────────────────────────────────────────────
  const host = el('div');
  const kb = createKeyboard(host, {
    ...keyRange(21), base: 48,
    onDown: (note, how) => { if (how === 'midi') return; bay.send(id('keys', 'midi-out'), { cls: 'note', ch: 1, d1: note, d2: 100 }); },
    onUp: (note, how) => { if (how === 'midi') return; bay.send(id('keys', 'midi-out'), { cls: 'note', ch: 1, d1: note, d2: 0 }); },
  });

  // ── Start: join the board as /knobs/ does, and load the patch once ───────
  let saidLast = '';
  const say = (text, kind) => { saidLast = text; d.log(text, kind); };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  let opened = null, starting = false;

  function makeBoard() {
    let open;
    opened = new Promise((r) => { open = r; });
    board = createBoard({
      room: ROOM, of: 'Raspberry Pi', showName: false, cushionMs: 160, maxCushionMs: 400,
      log: (line, kind) => d.log(line, kind),
      onOpen: () => open(true),
    });
  }

  async function status() {
    const r = await board.ask({ type: 'audio.status' }, 'audio.started', 6000);
    return r;
  }

  async function start() {
    if (starting) return;
    starting = true;
    try {
      if (!board) makeBoard();
      say(`Reaching ${ROOM}`);
      const up = await Promise.race([opened, wait(8000).then(() => false)]);
      if (!up) { say(`The relay did not open ${ROOM} within eight seconds, so nothing is playing`, 'warn'); return; }
      await board.startAudio();
      const pl = board.playout();
      if (pl && !analyser) {
        analyser = board.ctx().createAnalyser();
        analyser.fftSize = 2048;
        buf = new Float32Array(analyser.fftSize);
        pl.connect(analyser);
        requestAnimationFrame(frame);
        requestAnimationFrame(lagFrame);
      }
      if (!MAY_PLAY) { say('A check is running, so nothing was sent to the shared board. Add ?board=1 to let it through', 'warn'); return; }
      let st = await status();
      if (!st) { say(`The Raspberry Pi is not answering in ${ROOM}, so the keys and knobs go nowhere`, 'warn'); return; }
      if (st.ok && st.source !== 'yoshimi') { say(`${st.source} is playing on the Pi and this page will not stop it`, 'warn'); return; }
      if (!st.ok) {
        say('Starting Yoshimi on the Pi, which takes ten to forty seconds');
        st = await board.ask({ type: 'audio.start', source: 'yoshimi' }, 'audio.started', 60000);
        if (!st?.ok) { say(`The Pi could not start Yoshimi${st?.reason ? `, it said ${st.reason}` : ''}`, 'bad'); return; }
      }
      board.send({ type: 'voice.select', channel: 0, bank: BANK, program: PROGRAM, name: PATCH });
      await wait(PATCH_SETTLE_MS);
      armed = true;
      say(`${PATCH} on the Raspberry Pi, play the keys`);
      for (const k of KNOBS) gate.put(k.cc, Math.round(knobs.get(k.name).value?.() ?? k.home), { end: true });
      pump();
      transport.setIcon('play', 'stop', 'stop');
    } finally { starting = false; }
  }
  function stop() {
    if (armed && board) board.send({ type: 'note.panic' });
    armed = false;
    kb.panic?.();
    transport.setIcon('play', 'play', 'play');
    say('Stopped, every note on the Pi was released');
  }
  setInterval(() => { if (armed) pump(); }, 50);

  const transport = createButtonGroup({ buttons: [
    { id: 'play', icon: 'play', label: 'play', onPress: () => (armed ? stop() : start()) },
  ] });

  // ── the patchbay ────────────────────────────────────────────────────────
  const sounding = () => armed && level > 0.002;
  const pb = createPatchbay(bay, { room: ROOM, 
    flowing: (l) => (l.from === SYNTH_AUDIO ? sounding() : armed),
  });
  setInterval(() => pb.refresh?.(), 500);

  const top = el('div', 'cc-top');
  top.append(transport.el);
  d.stack.add(top, wave.el, grid.el, host, pb.el);
  window.__demo.bay = bay;
  // What this page hears from the Pi, for a driver: the scope's level and the
  // board's own counters (frames, lost, peak, via). Reads only.
  // `bright` is mean |first difference| over mean |sample|, which rises with
  // high partials, so a closed filter reads lower than an open one.
  window.__demo.probe = () => {
    let bright = null;
    if (analyser) {
      const b = new Float32Array(analyser.fftSize);
      analyser.getFloatTimeDomainData(b);
      let dsum = 0, asum = 0;
      for (let i = 1; i < b.length; i++) { dsum += Math.abs(b[i] - b[i - 1]); asum += Math.abs(b[i]); }
      bright = asum > 1e-3 ? dsum / asum : null;
    }
    return { armed, level, bright, said: saidLast, stats: board ? board.stats() : null };
  };
  d.ready();
</script>
