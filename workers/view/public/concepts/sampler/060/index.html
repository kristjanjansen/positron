<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON concept sampler 060</title>
<link rel="stylesheet" href="/shell/shell.css">
<script type="module">
  import { conceptNav, CODE_ROWS } from '/concepts/nav.mjs';
  import { mount } from '/shell/shell.mjs';
  import { bootScsynth } from '/shell/scsynth.mjs';
  import { compile } from '/shell/sclang-lite.mjs';
  import { createCodeBox } from '/shell/code-box.mjs';
  import { createHueBook } from '/shell/code-lang.mjs';
  import { createCompileIdle } from '/shell/compile-idle.mjs';
  import { createGrainRig } from '/concepts/sampler/grain-rig.mjs';
  import { PROGRAM, PATCHES, RING_SECONDS, valuesOf } from '/concepts/sampler/grain-ring.mjs';

  // concepts sampler/060, GRAIN RING, 2026-10-13. Asked (BACKLOG): *"the plain
  // GrainBuf ring is the real lighter twin of Pappus - do"*, then *"Add the
  // UGens to sclang-lite's table - do it"* and *"i want that granulator code in
  // ui"*.
  //
  // /concepts/sampler/050/ with a different engine: one small SynthDef instead
  // of Pappus. BufWr writes the source round an eight second mono buffer,
  // GrainBuf reads grains out of it, and SendReply reports every grain. Its
  // text is `../grain-ring.mjs`'s PROGRAM, shown in the kit's code box,
  // compiled in this tab by `/shell/sclang-lite.mjs` and run on the tab's
  // scsynth. An edit recompiles `IDLE_MS` after the last key (the kit's idle
  // compile, as on /concepts/synth/090/) and a good compile takes over at
  // once on the same buffer with the same control values, so the ring keeps
  // what it held. A failed one leaves `Did not compile` in the box's corner,
  // the compiler's line and column in the log, and the last good program
  // playing.
  //
  // The five patches are sets of control values on the one program (`/n_set`),
  // so a patch never swaps the graph; only an edit does. Every one of those
  // values is a knob (freeze a toggle) bound to its `\name` in the program,
  // fed from the patch node over a wire and gliding there, and `\mix` is the
  // wet/dry knob, blended in the engine. Each is coloured in the code as its
  // knob is.
  //
  // Everything that is not the engine is `../grain-rig.mjs`, shared with 050.
  const d = mount({ name: 'concept sampler 060', what: '', readout: null, index: '/concepts/', indexLabel: 'concepts' });
  conceptNav('sampler/060');

  const NODE = 4000, BUF = 0, DEF = 'gring';
  // Every control a patch sets, each a knob bound to its `\name` in the
  // program (asked 2026-10-13, *"expose them. route patch to knobs"*). Freeze
  // is on or off, so it is the kit's toggle and not a knob: a knob with two
  // positions is a switch wearing a dial. The wet/dry is the rig's own.
  const pct = (v) => `${Math.round(v * 100)}%`, secs = (v) => (v < 1 ? `${Math.round(v * 1000)} ms` : `${v.toFixed(2)} s`);
  const times = (v) => `${v.toFixed(2)}x`;
  const CONTROLS = [
    { name: 'size', label: 'size', kind: 'knob', min: 0.02, max: 4, warp: 'exp', fmt: secs },
    { name: 'density', label: 'density', kind: 'knob', min: 0.5, max: 64, warp: 'exp', fmt: (v) => `${v < 10 ? v.toFixed(1) : Math.round(v)}/s` },
    { name: 'speed', label: 'speed', kind: 'knob', min: 0, max: 2, warp: 'lin', fmt: times },
    { name: 'back', label: 'back', kind: 'knob', min: 0, max: 4, warp: 'lin', fmt: secs },
    { name: 'scatter', label: 'scatter', kind: 'knob', min: 0, max: 1, warp: 'lin', fmt: pct },
    { name: 'jitter', label: 'jitter', kind: 'knob', min: 0, max: 2, warp: 'lin', fmt: secs },
    { name: 'pitch', label: 'pitch', kind: 'knob', min: 0.25, max: 4, warp: 'exp', fmt: times },
    { name: 'detune', label: 'detune', kind: 'knob', min: 0, max: 0.1, warp: 'lin', fmt: (v) => `${(v * 100).toFixed(1)}%` },
    { name: 'pan', label: 'pan', kind: 'knob', min: 0, max: 1, warp: 'lin', fmt: pct },
    { name: 'freeze', label: 'freeze', kind: 'toggle' },
  ];
  const NAMES = CONTROLS.map((c) => c.name);
  const setOf = (p) => Object.fromEntries(NAMES.map((n) => [n, valuesOf(p)[n]]));

  // ── the program: compiled as the page opens (no fetch), and on every edit ──
  let good = compile(PROGRAM, { name: DEF });
  if (!good.ok) d.log(`the page's own program did not compile: ${good.message}`, 'bad');

  // ── the engine, behind the rig's contract ────────────────────────────────
  let eng = null, ctx = null, values = valuesOf(PATCHES[0]), mixNow = 1, swaps = 0;
  const T = { bufferBytes: RING_SECONDS * 48000 * 4 };
  /** The current program into the engine, in place of whatever runs. */
  async function start(bytes) {
    const t = performance.now();
    const done = await eng.sendAndWait((m) => m[0] === '/done' && m[1] === '/d_recv', 5000, '/d_recv', bytes);
    if (!done) throw new Error('the engine never said it had the definition');
    T.defMs = Math.round(performance.now() - t); T.defBytes = bytes.length;
    if (swaps) eng.send('/n_free', NODE);
    const go = await eng.sendAndWait((m) => m[0] === '/n_go' || (m[0] === '/fail' && m[1] === '/s_new'), 5000,
      '/s_new', DEF, NODE, 1, 0, 'buf', BUF, 'inbus', 2, 'mix', mixNow, ...Object.entries(values).flat());
    if (!go || go[0] !== '/n_go') throw new Error('the grain ring did not start');
    // An edit made while stopped is ready for Play and does not run meanwhile.
    if (swaps && !window.__demo.grains?.playing()) eng.send('/n_run', NODE, 0);
    swaps++;
  }
  const engine = {
    label: 'grain ring',
    // The wet/dry is `\mix` in the program's last line, so the blend happens
    // in the engine and the dry source never leaves it.
    mixes: true,
    async boot({ ctx: ac, input, grain, log }) {
      ctx = ac;
      const t0 = performance.now();
      eng = await bootScsynth({
        audioContext: ctx, input, log,
        // `SendReply.ar(trig, '/grain', [pos, size, write / frames, rate])`
        // arrives as ['/grain', nodeID, replyID, pos, size, write head, rate]:
        // SendReply puts two of its own in front. Both positions are fractions
        // of the same eight seconds, so how long ago the grain's audio came in
        // is their difference round the ring.
        onReply: (m) => {
          if (m[0] !== '/grain') return false;
          const pos = m[3], head = m[5];
          grain({ pos, ago: ((((head - pos) % 1) + 1) % 1) * RING_SECONDS, dur: m[4], voice: 0, rate: m[6] });
          return true;
        },
      });
      eng.out.gain.value = 0;
      T.moduleMs = Math.round(eng.moduleMs); T.bootMs = Math.round(eng.bootMs);
      const ta = performance.now();
      const alloc = await eng.sendAndWait((m) => (m[0] === '/done' || m[0] === '/fail') && (m[1] === '/b_alloc' || m[1] === '/b_allocPtr'),
        5000, '/b_alloc', BUF, RING_SECONDS * ctx.sampleRate, 1);
      if (!alloc || alloc[0] !== '/done') throw new Error('the ring buffer was not allocated');
      T.allocMs = Math.round(performance.now() - ta);
      if (!good.ok) throw new Error('there is no program that compiles');
      await start(good.bytes);
      T.startMs = Math.round(performance.now() - t0);
      log(`the grain ring up ${T.startMs} ms after Play: one ${RING_SECONDS} s buffer of ${(T.bufferBytes / 1e6).toFixed(1)} MB, `
        + `the ${good.bytes.length} B definition taken in ${T.defMs} ms`);
      return { meter: eng.meter, out: eng.out, timing: T, scsynth: eng };
    },
    // What a patch sets that is not a knob: only the read head's restart.
    // Every value it sets is a knob's, and arrives by gliding.
    land() {
      // The read head starts again at the write head, so a lag behind it
      // (`back`) means what it says after a stretch has left it anywhere.
      eng.send('/n_set', NODE, 'sync', 1);
      setTimeout(() => eng.send('/n_set', NODE, 'sync', 0), 40);
    },
    knob(name, v) { if (name === 'mix') mixNow = v; else values[name] = v; eng.send('/n_set', NODE, name, v); },
    run(on) { eng.send('/n_run', NODE, on ? 1 : 0); },
    async read(name) {
      const c = name;
      const r = await eng.sendAndWait((m) => m[0] === '/n_set' && m[2] === c, 3000, '/s_get', NODE, c);
      return r ? Number(r[3]) : null;
    },
    glitches: () => { try { return eng?.sonic.getMetrics?.()?.glitchCount ?? null; } catch { return null; } },
  };

  // ── the code box ─────────────────────────────────────────────────────────
  // Eleven controls and the kit's book holds six hues, so this page brings
  // eleven, spread round the wheel and kept off the yellow and the green the
  // site spends on what is chosen and what is live.
  const book = createHueBook({ hues: [205, 330, 168, 278, 28, 250, 305, 186, 352, 228, 8] }).assign([...NAMES, 'mix']);
  const code = createCodeBox({ language: 'sclang', rows: CODE_ROWS, label: '', value: PROGRAM, hues: book,
    ariaLabel: 'the SuperCollider program of this granulator, edit it and it recompiles' });
  let compiles = 0, refused = 0;
  const idle = createCompileIdle({
    input: code.input,
    host: code.el,
    compile: async (text) => {
      const t = performance.now();
      const out = compile(text, { name: DEF });
      const ms = performance.now() - t;
      if (!out.ok) {
        refused++;
        d.log(`the edit did not compile, the last good program keeps playing: ${out.message}`, 'warn');
        return out;
      }
      const gone = [...NAMES, 'mix'].filter((n) => !out.controls.some((c) => c.name === n));
      good = out;
      compiles++;
      if (eng) {
        try { await start(out.bytes); }
        catch (e) { d.log(`the edit compiled and the engine refused it: ${e.message}`, 'bad'); return { ok: false, error: e.message }; }
      }
      d.log(`the edit compiled in ${ms.toFixed(1)} ms into ${out.bytes.length} B and ${eng ? 'plays now' : 'plays from Play'}`
        + (gone.length ? `, and has no \\${gone.join(' or \\')}, so ${gone.length > 1 ? 'those knobs drive' : 'that knob drives'} nothing` : ''), gone.length ? 'warn' : '');
      return out;
    },
  });

  const rig = createGrainRig({
    d, engine,
    patches: PATCHES.map((p) => ({ name: p.name, says: p.says, set: setOf(p) })),
    controls: CONTROLS, roles: { size: 'size', density: 'density' },
    hue: (knob) => book.hueOf(knob),
    under: [code.el],
    // The page's own checks: an edit is heard, a broken edit is not.
    check: async ({ wait, gps, level, choosePatch }) => {
      const until = async (fn, ms = 6000) => { for (let i = 0; i < ms / 100 && !fn(); i++) await wait(100); return fn(); };
      const type = (text) => { code.set(text); code.input.dispatchEvent(new Event('input', { bubbles: true })); };
      choosePatch(PATCHES.findIndex((p) => p.name === 'Stutter'));
      await wait(2600);
      const before = gps();
      const edited = PROGRAM.replace('Impulse.ar(density * (1 - scatter))', 'Impulse.ar(density * 2 * (1 - scatter))');
      const c0 = compiles, s0 = swaps;
      type(edited);
      const took = await until(() => compiles > c0 && swaps > s0);
      await wait(1600);
      const after = gps();
      d.assert('an edit to the code recompiles in the tab and takes over', took, `${compiles - c0} compile, ${swaps - s0} swap`);
      d.assert('and it is heard: doubling the Impulse doubles the grains the engine reports', after > before * 1.6,
        `${before} a second before, ${after} after`);
      const r0 = refused;
      type(edited.replace('var pan', 'var pan = Blip.ar(3); var pan2'));
      const failed = await until(() => refused > r0);
      await idle.settled();
      await wait(1200);
      const still = gps(), lv = await level(1000);
      d.assert('a broken edit is refused and the box says so', failed && idle.shown() === 'Did not compile',
        `${idle.shown()}: ${idle.error()}`);
      d.assert('and the last good program keeps playing', still > before * 1.6 && lv > 0.001,
        `${still} grains a second, rms ${lv.toFixed(4)}`);
      type(PROGRAM);
      await until(() => compiles > c0 + 1);
    },
  });
  window.__demo.ring = { code, idle, compiles: () => compiles, refused: () => refused, swaps: () => swaps, good: () => good };
  await rig.ready();
</script>
