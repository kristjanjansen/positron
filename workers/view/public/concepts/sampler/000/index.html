<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON concept sampler 000</title>
<link rel="stylesheet" href="/shell/shell.css">
<script type="module">
  // concepts sampler/000, PIANO, 2026-10-11. The on-screen keyboard playing a
  // sampler, the Salamander grand's recordings (thirty notes, four velocity
  // bands, since 2026-10-11; /nola/'s FluidR3 piano before), which come from
  // our R2 bucket as a node of the patchbay (`cf-r2:piano:file-out ->
  // web:sampler:file-in`). Asked: *"Piano souns in samler, r2 in patchbay"*.
  // NOTHING OPENS ON A VISIT: the AudioContext and the one file a press plays
  // come with the first key press, and that press sounds once it arrives.
  import { conceptNav } from '/concepts/nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createKeyboard, keyRange } from '/shell/keyboard.mjs';
  import { createMidi } from '/shell/midi.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createSampler, PIANO } from '/concepts/sampler/sampler.mjs';

  const d = mount({ name: 'concept sampler 000', what: '', readout: null, index: '/concepts/', indexLabel: 'concepts' });
  conceptNav('sampler/000');

  // ── the sampler ─────────────────────────────────────────────────────────
  let fetchedAt = 0;
  const sampler = createSampler({
    instruments: [PIANO],
    log: (line, kind) => d.log(line, kind),
    onFetch: (on) => { if (!on) fetchedAt = performance.now(); pb?.refresh?.(); },
  });

  // ── the bay ─────────────────────────────────────────────────────────────
  const S = 'web', CF = 'cf-r2';
  const bay = createBay();
  bay.addNode({ id: `${S}:keys`, kind: 'person', label: 'keyboard', place: 'browser' });
  bay.addNode({ id: `${S}:sampler`, kind: 'engine', label: 'sampler', place: 'browser' });
  bay.addNode({ id: `${S}:speaker`, kind: 'screen', label: 'speakers', place: 'browser' });
  bay.addNode({ id: `${CF}:piano`, kind: 'store', label: 'piano samples', place: 'cloudflare', net: 'cloudflare' });
  bay.addPort({ id: `${S}:keys:midi-out`, dir: 'out', medium: 'midi', emits: ['note', 'cc'] });
  bay.addPort({ id: `${S}:sampler:midi-in`, dir: 'in', medium: 'midi', accepts: ['note', 'cc'], deliver: (e) => sampler.midi(e) });
  bay.addPort({ id: `${S}:sampler:file-in`, dir: 'in', medium: 'file' });
  bay.addPort({ id: `${S}:sampler:audio-out`, dir: 'out', medium: 'audio' });
  bay.addPort({ id: `${S}:speaker:audio-in`, dir: 'in', medium: 'audio' });
  bay.addPort({ id: `${CF}:piano:file-out`, dir: 'out', medium: 'file', transports: ['https'] });
  for (const [a, b] of [
    [`${S}:keys:midi-out`, `${S}:sampler:midi-in`],
    [`${CF}:piano:file-out`, `${S}:sampler:file-in`],
    [`${S}:sampler:audio-out`, `${S}:speaker:audio-in`],
  ]) {
    const r = bay.link(a, b, [], { site: S });
    if (!r.ok) d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
  }

  // The file wire is lit while recordings come down and for 600 ms after; the
  // audio wire while a voice sounds. MIDI pulses once per note by itself.
  const flowing = (l, medium) => {
    if (medium === 'file') return sampler.loading() || (fetchedAt && performance.now() - fetchedAt < 600);
    if (medium === 'audio') return sampler.sounding() > 0;
    return false;
  };
  const pb = createPatchbay(bay, { detail: (n) => [{ text: n.label, sans: true }], flowing });

  // ── the keys ────────────────────────────────────────────────────────────
  const host = el('div');
  const send = (note, vel) => bay.send(`${S}:keys:midi-out`, { cls: 'note', ch: 1, d1: note, d2: vel });
  const kb = createKeyboard(host, {
    ...keyRange(21), base: 48,
    onDown: (note, how) => { if (how !== 'midi') send(note, 100); },
    onUp: (note, how) => { if (how !== 'midi') send(note, 0); },
    onPanic: () => sampler.panic(),
  });

  // A plugged in keyboard plays through the same keys node, so it follows the
  // patch and its pedal is the sampler's sustain (found 2026-10-11, *"sampler
  // 010 keeps playing piano when i switch patch woth mouse and keep playing
  // midi"*: this page never opened one, so a 020 tab was the one playing).
  createMidi({
    log: (line, kind) => d.log(line, kind),
    onDown: (n, vel) => { kb.lightNote?.(n, true); bay.send(`${S}:keys:midi-out`, { cls: 'note', ch: 1, d1: n, d2: vel }); },
    onUp: (n) => { kb.lightNote?.(n, false); bay.send(`${S}:keys:midi-out`, { cls: 'note', ch: 1, d1: n, d2: 0 }); },
    onControl: (c, v) => { if (c === 64) bay.send(`${S}:keys:midi-out`, { cls: 'cc', ch: 1, d1: c, d2: v }); },
  });

  d.stack.add(host, pb.el);
  window.__demo.bay = bay;
  // Read only, for a check over CDP.
  window.__demo.sampler = { stat: () => sampler.stat() };
  d.ready();
</script>
