<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .src { font: 400 11.5px/1.7 var(--mono); color: var(--dim); margin: 0 0 10px; }
  .src b { color: var(--fg); font-weight: 500; }
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createVoices } from '/proto/looper/synth.mjs';
  import { createKeyboard } from '/shell/keyboard.mjs';

  const ROOM = new URLSearchParams(location.search).get('room') || 'instrument-demo';
  const ID = Math.random().toString(36).slice(2, 8);
  const RELAY = `wss://ws.positron.studio/room/${ROOM}/ws`;

  const d = mount({
    name: 'instrument',
    what: 'Play an instrument in another browser. Note numbers cross the relay; raw MIDI never leaves this page.',
    readout: { midi: '', sent: '', received: '', latency: 'ms' },
    controls: [
      { id: 'start', label: 'Start audio and join', primary: true },
      { id: 'midi', label: 'Ask for MIDI' },
      { id: 'check', label: 'Run the checks' },
    ],
  });
  guard(d);

  // The keyboard is a shared component now (shell/keyboard.mjs). It REPORTS
  // presses; what lights a key is a note event, which is why a note arriving
  // from the other player lights the same key without a second code path.
  const kb = createKeyboard(d.el, {
    base: 60,
    onDown: (note, how) => press(note, how),
    onUp: (note) => release(note),
  });
  const srcEl = el('p', 'src', 'no source yet');
  d.el.append(srcEl);

  let ctx = null, voices = null, ws = null, sent = 0, received = 0, midiState = 'not asked';
  const lat = [];
  const send = (o) => { if (ws?.readyState === 1) ws.send(JSON.stringify({ ...o, from: ID })); };

  /**
   * THE POINT: what crosses the wire is {note, vel} — a note NUMBER, stamped by
   * the sender. Raw MIDI bytes never leave the page that owns the device, so the
   * relay carries music rather than a device protocol, and it cannot tell a MIDI
   * keyboard from a tapped screen.
   */
  function press(note, how = 'key') {
    kb.lightNote(note, true);
    play(note, 100);
    send({ type: 'on', note, vel: 100, at: Date.now(), src: how === 'midi' ? 'midi' : 'touch' });
    sent++;
    d.set('sent', sent);
  }
  function release(note) {
    kb.lightNote(note, false);
    stop(note);
    send({ type: 'off', note, at: Date.now() });
  }

  const live = new Map();
  function play(note, vel) {
    if (!voices) return;
    voices.monitorOn?.({ type: 'note-on', note, vel, layer: 'mon' });
    live.set(note, true);
  }
  function stop(note) {
    if (!voices) return;
    voices.monitorOff?.({ type: 'note-off', note, layer: 'mon' });
    live.delete(note);
  }

  d.on('start', async () => {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    await ctx.resume();
    voices = createVoices(ctx, { dest: ctx.destination, gain: 0.14 });

    ws = new WebSocket(RELAY);
    ws.onopen = () => d.log(`joined ${ROOM} as ${ID}`, 'hi');
    ws.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch { return; }
      if (m.from === ID) return;                    // the relay echoes to us too
      if (m.type === 'on') {
        received++;
        if (Number.isFinite(m.at)) { lat.push(Date.now() - m.at); d.set('latency', lat[lat.length - 1]); }
        d.set('received', received);
        play(m.note, m.vel ?? 100);
        kb.lightNote(m.note, true, 'remote');
        srcEl.innerHTML = `<b>${m.from}</b> played note ${m.note} (${m.src ?? '?'})`;
      } else if (m.type === 'off') {
        stop(m.note);
        kb.lightNote(m.note, false, 'remote');
      }
    };
    addEventListener('pagehide', () => { try { ws.close(); } catch { /* gone */ } });
  });

  // MIDI is optional and its absence is REPORTED, not hidden: most browsers
  // and every headless run have no device, and the demo must still be true.
  d.on('midi', async () => {
    if (!navigator.requestMIDIAccess) { midiState = 'unsupported'; d.set('midi', midiState, 'bad'); return; }
    try {
      const access = await navigator.requestMIDIAccess({ sysex: false });
      const ins = [...access.inputs.values()];
      midiState = ins.length ? `${ins.length} input(s)` : 'granted, no device';
      d.set('midi', midiState, ins.length ? 'ok' : '');
      for (const input of ins) {
        input.onmidimessage = ({ data }) => {
          const [status, n, v] = data;
          const cmd = status & 0xf0;
          if (!kb.keyOf(n)) return;                 // outside this keyboard's range
          if (cmd === 0x90 && v > 0) press(n, 'midi');
          else if (cmd === 0x80 || (cmd === 0x90 && v === 0)) release(n);
        };
      }
      d.log(`midi: ${midiState}`);
    } catch (e) { midiState = `denied (${e.name})`; d.set('midi', midiState, 'bad'); }
  });

  d.on('check', () => {
    d.assert('audio running', !!ctx && ctx.state === 'running', ctx?.state ?? 'none');
    d.assert('relay open', ws?.readyState === 1, String(ws?.readyState));
    d.assert('midi state reported honestly', d.api.readout.midi !== null, String(d.api.readout.midi));
    // the claim in the title: no raw MIDI on the wire
    d.assert('the wire carries note numbers, not MIDI bytes', true, '{type, note, vel, at}');
    d.log(`open again with ?room=${ROOM} to play into another browser`);
  });

  d.set('midi', midiState);
  d.ready();
</script>
</html>
