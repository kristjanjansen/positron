    return ctx;

    meter.getFloatTimeDomainData(buf);

    for (const v of buf) sum += v * v;

   * below. So the forwarding function is installed immediately before it and
   * taken off immediately after, and the compiler is the only thing on the page

    const t0 = performance.now();
    d.log(`fetching the Faust compiler, ${mb(COMPILER_BYTES)} MB, once`);
    const { instantiateFaustModuleFromFile, LibFaust, FaustCompiler, FaustPolyDspGenerator }

    d.log(`${name} compiled in ${ms.toFixed(0)} ms into ${kb(bytes)} kB of machine code, `
        + `${kb(meta.size)} kB a voice, ${VOICES} voices`, 'hi');
    if (!meta.ui || !JSON.stringify(meta.ui).includes('gate')) {
      d.log('this one declares no gate, so the keys cannot start it. A polyphonic voice '
          + 'needs freq, gain and gate');
    }
    return { ok: true, ms, bytes, size: meta.size, meta };
  }

  // ── the text ───────────────────────────────────────────────────────────────
  //
  // 🔴 TYPING AND SETTING ARE TWO DIFFERENT EVENTS. `onType` is a person at
  // the keyboard: it re-counts the bytes and moves the patch selector to
  // `custom` if the text has left its preset. `showSource()` is the page
  // writing into its own box, which happens every time a patch is loaded.
  // Neither compiles anything: since 2026-09-26 only the Compile button does.
  const source = createField({
    /* 🔴 NO CAPTION. `label: ''` builds no span (`field.mjs`, `if (label)`),
       where this page used to build a FAUST label and hide it by rule: a caption
       over a box holding Faust names what a reader is already reading, and the
       title and the patch picker say it again. The accessible name is set below. */
    label: '',
    /* 🔴 TWENTY SINCE 2026-09-25, AND IT HAS NOW MOVED TWICE FOR THE SAME
       REASON. It was 12 until the patches grew comments (*"can you have comments
       in fau file what lines do?"*), where the longest preset was cut through
       the middle of `process`, which is the one line a reader most needs to see.
       It was 16 until the blank lines went in (*"add nl after comments"*) and
       two more presets arrived, which between them added four to six lines to
       every listing that has a comment in it.
       🔴 A BOX SIZED TO THE CONTENT IT USED TO HOLD HIDES THE CONTENT IT HOLDS
       NOW, and that is the whole rule: this number is READ OFF the presets and
       never guessed. MEASURED 2026-09-25 by counting the `code` strings in this
       file: 18, 20, 7, 14, 7 and 17 lines, so 20 is the longest of them.
       ⚠️ AND IT IS THE LONGEST RATHER THAN A COMFORTABLE AVERAGE, because a
       listing that does not fit is one a visitor has to scroll inside a box
       whose own scrollbar is the least visible thing on the page. */
    rows: 20,
    code: true,
    value: PRESETS[0].code,
    onInput: onType,
  });
  /* 🔴 THE NAME THE MISSING CAPTION WOULD HAVE CARRIED. `field.mjs` wires no
     `aria-label`, `for` or `labelledby`, checked rather than assumed, so without
     this the editor is an unnamed text box. */
  source.input.setAttribute('aria-label', 'the Faust program this page compiles');

  function showSource() {
    setCell('source', kb(new TextEncoder().encode(source.value()).length));
  }
  function onType() {
    showSource();
    matchPatch();
  }

  // ── the keys ───────────────────────────────────────────────────────────────
  /* The keyboard is built in a throwaway host and its own box goes into the
     panel's keys row, the way /kit/'s sketch specimen hands over `kb.el`. */

  /**
   * 🔴 THE LETTERS ARE ON THE BOTTOM OCTAVE, WHICH IS C3 HERE. Asked
   * 2026-09-23: *"default asd keyboard to c3"*. They sat on the middle octave,
   * so `a` played C4 while the keyboard started at C3 and the two octaves below
   * your fingers were reachable only with a mouse.
   * ⚠️ AND THERE ARE STILL ONLY THIRTEEN OF THEM, which is the component's own
   * rule rather than a choice: `QWERTY_CHROMATIC` is one octave plus its top C,
   * `z` and `x` are already the octave pair, and a key labelled with a letter
   * that does nothing is worse than a key with no letter on it. What moved is
   * WHICH octave has them, not how many.
   */
  const KEY_LO = 12;            // the lettered octave is the first thirteen keys
  const { KEY_MAP, KEY_ORDER, KEY_SHARPS, KEY_LETTERS } = (() => {
    const map = {}, order = [], sharps = new Set(), lettered = new Set();
    const BLACK = new Set([1, 3, 6, 8, 10]);
    /* 🔴 READ OFF THE CONSTANT'S VALUES, NOT ITS ORDER, AND THAT MATTERS
       SINCE `l` LANDED. This took `Object.keys()` and handed the nth letter to
       the nth semitone, which was right only while the map had no gaps in it.
       `l` is a D and sits at 14, with the C sharp at 13 belonging to a letter
       nobody has asked for, so a positional read would have put `l` on the
       black key and moved every shape a hand knows one key out. */
    const letterAt = Object.fromEntries(
      Object.entries(QWERTY_CHROMATIC).map(([k, v]) => [v, k]));
    for (let i = 0; i <= 24; i++) {
      const id = letterAt[i] ?? `hi${i}`;
      map[id] = i;
      order.push(id);
      if (BLACK.has(i % 12)) sharps.add(id);
      if (letterAt[i]) lettered.add(id);
    }
    return { KEY_MAP: map, KEY_ORDER: order, KEY_SHARPS: sharps, KEY_LETTERS: lettered };
  })();

  const keys = createKeyboard(el('div'), {
    base: 48,
    map: KEY_MAP, keys: KEY_ORDER, sharps: KEY_SHARPS, letters: KEY_LETTERS,
    minBase: 24, maxBase: 84,
    onDown: (note) => press(note, 100),
    onUp: (note) => lift(note),
    onOctave: (b) => d.log(`the keys on screen now start at ${b}`),
    onPanic: () => {
      allOff();
      keys.sustain.set(false, true);
    },
    /* 🔴 THE DAMPER IS THE KEYBOARD'S OWN CONTROL NOW, in its footer, where
       every control about the keys belongs. This page drew its own switch in a
       row underneath until 2026-09-23, and so did `/nola/`, which is one
       problem solved twice. What the page still owns is what a foot MEANS:
       `demo/shell/pedal.mjs` holds the note off and the component knows none of
       that. */
    sustain: true,
    onSustain: (on) => pedal.set(on),
  });
  /* 44 px a key rather than the component's 49, for the same reason `/nola/`
     lowers it: two octaves is what an instrument wants and fifteen white keys
     at 49 px do not fit the page. The component reads the property off its
     own box, which is the element that goes into the panel. */
  keys.el.style.setProperty('--k-min', '44px');

  // ── the foot ───────────────────────────────────────────────────────────────
  //
  // `?pedal=<n>` for a footswitch sending something other than 64, and `?flip=1`
  // for one whose polarity was sensed upside down at power up. Both are
  // `demo/shell/pedal.mjs`'s arguments and neither is this page's invention.
  const pedal = createPedal({
    cc: Number(q.get('pedal')) || SUSTAIN_CC,
    flip: q.get('flip') === '1',
    release: (note) => {
      /* The DSP owns how fast a note dies, so the damper time `pedal.mjs` hands
         over is deliberately dropped here. See the header. */
      node?.keyOff(0, note, 0);
    },
    onPedal: (down, value, freed) => {
      d.log(down ? PEDAL_SAYS.down : (freed ? PEDAL_SAYS.freed(freed) : PEDAL_SAYS.up));
      d.log(PEDAL_SAYS.raw(pedal.cc, value, down));
    },
  });

  /** How many notes this page believes are being held, by hand or by foot. */
  const holding = () => pedal.fingers() + pedal.held();

  /**
   * 🔴 THE NOTES A HAND PUT DOWN WHILE THE FIRST NODE WAS STILL BEING BUILT.
   * The first key press is the gesture that opens the audio, and building a
   * worklet out of a compile that is already done is an await: short, measured
   * in the log, and not zero. A note pressed inside that window is remembered
   * here and sent the moment the node exists, and a note LET GO inside it is
   * taken out again, so a press and release faster than the window cannot leave
   * a note sounding that nothing is holding.
   */
  const waiting = new Map();
  /** The one arming in flight, so eight fingers landing at once build one node. */
  let arming = null;
  function arm() {
    if (node || !ready) return null;
    if (!arming) {
      arming = serial(attach)
        .catch((e) => { d.log(`it could not reach the audio thread: ${e?.message || e}`, 'bad'); return false; })
        .finally(() => { arming = null; });
    }
    return arming;
  }

  /** @returns {Promise<unknown>|undefined} the arming, where this press started one. */
  function press(note, vel = 100) {
    keys.lightNote?.(note, true);
    pedal.keyDown(note);
    if (node) { node.keyOn(0, note, vel); return undefined; }
    const job = arm();
    if (!job) {
      d.log('nothing is compiled yet, so press Compile in the corner of the text');
      return undefined;
    }
    waiting.set(note, vel);
    return job.then(() => {
      for (const [k, v] of waiting) node?.keyOn(0, k, v);
      waiting.clear();
    });
  }
  function lift(note) {
    waiting.delete(note);
    pedal.keyUp(note);                 // it decides whether that is a release
    keys.lightNote?.(note, false);
  }
  function allOff() {
    try { node?.allNotesOff?.(true); } catch { /* nothing sounding */ }
    pedal.panic();
  }

  // ── a MIDI keyboard, if there is one ───────────────────────────────────────
  //
  // 🔴 BUILT BY THE SWITCH, NOT BY THE PAGE. `createMidi` asks the browser for
  // access the moment it is constructed, and it was constructed at load until
  // 2026-09-23, so a visit to this page asked a question about a MIDI keyboard
  // that nobody here had pressed anything to deserve. It is the same rule as
  // the 6 MB download beside it, in a thing that costs no bytes: a visit opens
  // nothing.
  let midi = null;
  function startMidi() {
    if (midi) return midi;
    midi = createMidi({
      /* Both roads call the same two functions, which is what keeps the key
         that lights and the note that sounds the same key. */
      onDown: (note, vel) => press(note, vel || 100),
      onUp: (note) => lift(note),
      onControl: (cc, value) => {
        if (!pedal.control(cc, value)) return;
        keys.sustain.set(pedal.down(), true);
      },
      log: d.log,
    });
    return midi;
  }

  // ── the patch selector, and the fourth state ───────────────────────────────
  //
  // See the header for why `custom` exists and why it is not in the list.
  const CUSTOM = 'custom';
  /* 🔴 NO `label`. The picker is the plate row's far end and the panel strips a
     caption off anything handed in there anyway, so this page does not build
     one to be thrown away. `what` stays: it is the arrows' titles and the
     select's own `aria-label`, which is the name a screen reader hears. */
  const patch = createPicker({
    what: 'patch',
    prev: () => stepPatch(-1),
    next: () => stepPatch(+1),
    onPick: (i) => loadPatch(i),
  });
  patch.options(PRESETS.map((p) => p.label), 0);

  /** Which preset is in the box, or -1 for text that is nobody's preset. */
  let picked = 0;
  /** The last real preset, so the arrows have somewhere to step FROM in custom. */
  let lastPatch = 0;

  function showPatch(i) {
    picked = i;
    if (i >= 0) { lastPatch = i; patch.show(PRESETS[i].label, i); return; }
    patch.show(CUSTOM);
    /* 🔴 NOTHING SELECTED IN THE PLATFORM'S LIST WHILE THE TEXT IS THE
       VISITOR'S, AND IT IS NOT DECORATION. A `<select>` fires `change` only
       when the selection MOVES, so leaving `Organ` selected under the word
       `custom` would make choosing Organ again do nothing at all. That is the
       one gesture somebody in custom is most likely to make. */
    patch.select.selectedIndex = -1;
  }
  /** Does the text still say exactly what a preset says? */
  function matchPatch() {
    const now = source.value();
    const i = PRESETS.findIndex((p) => p.code === now);
    if (i !== picked) showPatch(i);
  }
  function stepPatch(n) {
    const from = picked >= 0 ? picked : lastPatch;
    loadPatch((from + n + PRESETS.length) % PRESETS.length);
  }

  /**
   * Put a preset in the box, and compile it if the instrument is already live.
   *
   * 🔴 TWO FUNCTIONS FOR ONE ACTION, AND THE SPLIT IS THE QUEUE. `loadPatch` is
   * what a control calls and it takes a turn on the compile queue; `applyPatch`
   * is the work, and it is what the check block calls, because a task that
   * waits on another task in the same queue is a deadlock and the symptom is a
   * page that never becomes ready. `build()` is split the same way and for the
   * same reason.
   */
  async function applyPatch(i) {
    const p = PRESETS[i];
    source.set(p.code);
    showSource();
    showPatch(i);
    d.log(`${p.label}: ${p.what}`);
    /* 🔴 A PICK ALWAYS COMPILES SINCE 2026-09-28, AND THAT IS THE PICKER
       STAYING HONEST RATHER THAN EXTRA WORK. It used to refuse unless the
       instrument was already live, which was right while a compile meant
       pulling six megabytes. Now a patch is compiled and waiting before anybody
       touches the page, so refusing here would leave the Organ waiting under a
       selector reading `Djembe`, and the first key would sound the wrong
       instrument. The compiler is in the tab by then, so this costs the tens of
       milliseconds in the `compile` cell and nothing else. */
    return build(p.code, p.label.toLowerCase());
  }
  const loadPatch = (i) => serial(() => applyPatch(i));

  // ── the Compile button ─────────────────────────────────────────────────────
  //
  // 🔴 IT IS THE ONE ROAD TO COMPILING WHAT YOU TYPED, AND SINCE 2026-09-28 IT
  // IS NO LONGER THE ONE ROAD TO A COMPILE. Asked as *"rm fau off button"* and
  // *"replace it with compile (shimmer). no autocompile"*, and then as *"fau:
  // compile on loading so i can play"*. The visit compiles the preset the box
  // opens with; this button compiles whatever is in the box now, which is the
  // only way anything a visitor WROTE reaches the audio thread. There is no
  // switch and no idle timer: typing changes the bytes under the box and
  // nothing else, a preset pick recompiles (because a picker naming a Djembe
  // over an Organ still sounding would be the lying control this project has a
  // rule about), and the thread runs what was last compiled until the next
  // press.
  // ⚠️ THE SHIMMER IS THE KIT'S. `createButtonGroup` sets `data-busy` while a
  // handler's promise is open, which is the one sweep every working button in
  // this project wears (`shell.css`, `button[data-busy="1"]`), so a compile
  // behind a six megabyte fetch is visible for as long as it takes and the
  // button cannot be pressed twice.
  // ⚠️ A PRESS UNDER A HELD NOTE TAKES THE NOTE AWAY, and that is the trade the
  // ask made: the autocompile waited for the key to come up because nobody had
  // asked for it; a press is somebody asking.
  // ⚠️ AND IT IS AWAITABLE FROM OUTSIDE through `compileJob`, so a check that
  // pressed the button and then read the page is not reading it 6 MB early.
  let compileJob = Promise.resolve();
  function pressCompile() {
    compileJob = serial(async () => {
      const out = await build(source.value(), picked >= 0 ? PRESETS[picked].label.toLowerCase() : 'typing');
      /* A press is a gesture, so this is the one place a BUTTON is allowed to
         open the audio. Where it is already open, `build()` has swapped the
         node already and this returns without doing anything. */
      if (out.ok) await attach();
      return out;
    });
    return compileJob;
  }
  const compile = createButtonGroup({
    buttons: [{ id: 'compile', label: 'Compile', primary: true, onPress: () => pressCompile() }],
  });
  /* 🔴 THE BUTTON, LIFTED OUT OF THE GROUP'S ROW, AND THE ROW IS NEVER
     APPENDED. `createButtonGroup` is the kit's one factory for a button that
     wears the busy sweep while its promise is open (`data-busy`, `disabled`,
     `aria-busy`, all set on the button itself), and that contract is why it is
     built here. What it wraps the button in is a segment join for several
     buttons sharing edges, and one button in the corner of a well is not a
     row: inside `.step` it would carry the segment's padding and the row's
     34 px, where what was asked for is *"small button variant"*. `pos-sm` is
     that variant (`shell.css`), a modifier on the element the way `pos-pri`
     is; `fau-compile` is what the two page rules above position. */
  const compileBtn = compile.button('compile');
  compileBtn.classList.add('pos-sm', 'fau-compile');
  // secondary: the group built it primary and the owner asked for secondary
  // (2026-09-26); the busy sweep does not depend on the primary look
  compileBtn.classList.remove('pos-pri');

  // ── the page ───────────────────────────────────────────────────────────────
  //
  // 🔴 THE INSTRUMENT IS THE KIT'S GLUED PANEL, SINCE 2026-09-26. The text is
  // its picture row, edge to edge by construction, the keys are its keys row,
  // and the foot is its plate: the name at the start and the patch picker at
  // the far end, which is where the component puts a `patch` control and the
  // rule it carries since the same day. Compile is in the corner of the text,
  // not on the foot (*"rm compile from footer"*). The name is in the foot
  // because the sketch of 2026-09-26 puts it there
  // (plans/plan-instrument-audit.md). The two rules at the top of this file
  // are the only page rules, and both are about the corner.
  const panel = createInstrumentPanel({
    viz: source.el,
    keys: keys.el,
    plate: { name: 'FAU', patch },
  });
  source.el.classList.add('fau-src');
  source.el.append(compileBtn);
  d.el.append(panel.el);

  /* 🔴 THE FIRST TOUCH ANYWHERE ON THE INSTRUMENT OPENS THE AUDIO, NOT THE
     FIRST KEY, AND THE NUMBER IS WHY. MEASURED 2026-09-28 in headless Chrome on
     this desk: a key pressed as the very first gesture on the page takes
     134 ms to reach the audio thread, which is an AudioContext and an
     `audioWorklet.addModule` and cannot be made faster from inside a page. It
     is paid once, and it is paid on the one note a visitor is listening hardest
     to.
     ✅ SO ANY GESTURE ON THE PANEL PAYS IT INSTEAD: clicking into the code,
     stepping the patch selector, moving the octave, pressing Compile. A browser
     grants user activation to the whole document on the first pointer press, so
     by the time a finger reaches a key the node is already there and the note is
     immediate.
     ⚠️ IT IS THE PANEL AND NOT THE DOCUMENT, so a scroll or a tap somewhere
     else on the page opens no sound device. Touching the instrument is the
     gesture; reading the page is not.
     ⚠️ AND IT IS THE CAPTURE PHASE, so it runs before the keyboard's own
     handler rather than after it. That does not make the note that arms it
     instant, because the node still has to be built and that is an await; what
     it makes instant is every gesture after a visitor has touched anything at
     all.
     ⚠️ THE LISTENERS STAY UNTIL THEY ACTUALLY ARM. `arm()` answers null while
     nothing is compiled yet, which is the first fraction of a second of a
     visit, and a listener that removed itself on that touch would leave the
     page back where it started. */
  const armOnTouch = () => {
    if (!arm()) return;
    panel.el.removeEventListener('pointerdown', armOnTouch, true);
    panel.el.removeEventListener('keydown', armOnTouch, true);
  };
  panel.el.addEventListener('pointerdown', armOnTouch, true);
  panel.el.addEventListener('keydown', armOnTouch, true);

  showSource();
  d.log(`the Faust compiler is ${mb(COMPILER_BYTES)} MB off this site, it is on its way now, `
      + `and the Organ in the box is compiled the moment it lands`);
  d.log('no sound device is opened until you press a key, which is the gesture a browser '
      + 'wants for a sound anyway');

  /* ── the compile a visit gets ─────────────────────────────────────────────
     🔴 ASKED 2026-09-28: *"fau: compile on loading so i can play"*. This is
     that, and it is the whole of it: one compile of the preset the box opens
     with, started here and never again.
     ⚠️ IT IS NOT AWAITED AND NOTHING WAITS FOR IT. The download is network and
     the page paints through it; what blocks is the wasm instantiation and
     libfaust itself, and both of those land after the page is on screen and
     readable. A visitor who starts typing before it finishes loses nothing,
     because their first press compiles what they typed.
     ⚠️ AND IT GOES THROUGH `serial` LIKE EVERYTHING ELSE, so a preset picked
     while it is still in flight queues behind it rather than booting a second
     compiler.
     ⚠️ THE CATCH IS THE HALF THAT MATTERS ON A BAD NETWORK. Six megabytes can
     fail, and a page whose only report of that is an unhandled rejection is a
     page that looks like it is still coming. */
  const warm = serial(() => build(PRESETS[0].code, PRESETS[0].label.toLowerCase()))
    .catch((e) => {
      d.log(`the compiler did not arrive, so press Compile to try again: ${e?.message || e}`, 'bad');
      return { ok: false };
    });

  // ── the picture ────────────────────────────────────────────────────────────
  const dg = createDiagram(d.el, {
    caption: 'The text in the box is the program the audio thread runs. Nothing here '
      + 'interprets it: the compiler in the tab turns it into a second WebAssembly module '
      + 'that is only this instrument, and the worklet runs that.',
    nodes: [
      /* 🔴 THE PERSON TYPING IS NOT A BOX, AND THE FIRST DRAWING GAVE THEM ONE.
         `plan-fau.md` §10.3 asks for a `you` outside the browser holding the ten
         lines of Faust, which is right about the story and wrong about the
         picture: `diagram.mjs` gives every top level box the height of the
         tallest, so a childless box beside a machine with five parts is drawn
         as a 300 px empty slab, and on a phone it was a whole screen of
         nothing. PHOTOGRAPHED at 1100 px and at 390 px before it was changed.
         ⚠️ AND THE HONEST BOX WAS ALREADY THERE: the text is a textarea IN THE
         BROWSER, so it belongs inside that machine like everything else the tab
         runs. What a visitor does is type into it, which is what the arrow out
         of it says. */
      /* ⚠️ `set: true`, BECAUSE KEYS AND A FOOTSWITCH DO NOT FEED EACH OTHER.
         Between two neighbours with no declared link the component draws an
         arrow, which would be a mechanism that does not exist. */
      { id: 'kbd', label: 'MIDI keyboard', sub: 'USB MIDI', kind: 'device', tech: 'device',
        set: true,
        children: [
          { id: 'kkeys', label: 'keys', sub: 'notes, velocity', tech: 'device',
            note: 'A tap on the keys drawn on this page calls the same two functions, so there '
                + 'is no second route into the instrument and nothing downstream can tell them '
                + 'apart.' },
          { id: 'foot', label: 'footswitch', sub: 'CC64 by default', tech: 'device',
            note: 'Which controller a footswitch sends is a setting held inside the keyboard, '
                + 'so 64 is a default rather than a measurement. Open the page with '
                + '**?pedal=67** for one that sends something else.' },
        ] },
      { id: 'br', label: 'Browser', sub: 'phone or laptop', kind: 'here', tech: 'browser',
        children: [
          { id: 'box', label: 'text box', sub: '7 to 20 lines', tech: 'browser',
            note: 'What a visitor types, and the only input this page has. Everything below it '
                + 'is made from under a kilobyte of text and nothing else.' },
          { id: 'lf', label: 'libfaust', sub: '2.89.2, wasm', tech: 'browser',
            note: 'The Faust compiler itself, 3.60 MB of **WebAssembly**, with 2.41 MB of plain '
                + 'Faust library source beside it that it reads out of its own filesystem. '
                + 'Fetched once, as the page opens.' },
          /* ⚠️ THE RANGE IS ROUNDED TO WHOLE kB AND IT IS A LABEL RATHER THAN A
             READING, which is why it does not carry the readout's two decimals.
             It read `4 to 13KB` until 2026-09-25 and was wrong at both ends:
             MEASURED across the six presets that day, 6.95 to 19.27 kB. The
             live figure is the `machine code` cell, and this says roughly how
             big the thing in the box gets. */
          { id: 'dsp', label: 'dsp module', sub: '7 to 19 kB', tech: 'sound',
            note: 'A second WebAssembly module, made in this tab a moment ago, holding this '
                + 'instrument and nothing else. It is what a visitor changes by typing.' },
          { id: 'awn', label: 'AudioWorklet', sub: '8 voices, 128 frames', tech: 'sound',
            note: 'One voice compiled once and replicated. The processor reaches the worklet '
                + 'as a **Blob** of stringified classes, because an **AudioWorkletGlobalScope** '
                + 'has no module loader at all.' },
          { id: 'spk', label: 'speakers', sub: 'or a phone', tech: 'device',
            note: 'The end of it. Everything above it is built before you touch anything, so a '
                + 'key press is the whole distance between a finger and this.' },
        ] },
    ],
    links: [
      { from: 'box', to: 'lf',
        note: 'Under a kilobyte for something small. The compression is a dictionary rather '
            + 'than magic: a one line drum is one line because somebody else wrote the model '
            + 'into the library beside the compiler.' },
      /* A link between two children of one container takes NO label: the gap
         they share is sixteen pixels tall, and what travels goes in the note. */
      { from: 'lf', to: 'dsp',
        note: 'About **10 ms** for anything small, and it blocks the thread it runs on, because '
            + 'libfaust is synchronous inside its own wasm. The STK piano is 1,690 ms, which is '
            + 'why it is not a preset here.' },
      { from: 'dsp', to: 'awn',
        note: 'The module is instantiated once per voice. Recompiling builds a whole new node '
            + 'and throws the old one away rather than swapping code under a sounding note.' },
      { from: 'awn', to: 'spk',
        note: 'Faust computes a block at a time and the block size is not part of the graph, so '
            + 'the worklet\'s 128 frames and a Raspberry Pi\'s ALSA period run identical code.' },
      { from: 'kkeys', to: 'awn', label: 'notes',
        note: '**keyOn** and **keyOff** with a note number, which the runtime turns into the '
            + '**freq**, **gain** and **gate** the source declares.' },
      { from: 'foot', to: 'awn',
        note: 'The pedal is held OUTSIDE the DSP, in the page. Faust\'s own voice allocator '
            + 'writes a released note off and steals it first, so a pedal inside the source '
            + 'would keep a note audible and stealable at the same time.' },
    ],
  }, { how: true, atEnd: true });

  // ── what this page can say about itself ────────────────────────────────────
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  async function checks() {
    /* 🔴 THE CHEAP ONES FIRST, AND THAT IS A HARNESS FACT RATHER THAN A STYLE.
       `demo/verify.mjs` gives up about two seconds after the last new assert,
       and this page's first compile is behind a 6 MB fetch. A check block whose
       first assert lands three seconds in reads as a page that asserted
       nothing, which is what `/nola/` measured on 2026-09-23. */
    /* 🔴 THE RULE THE LOAD COMPILE RUNS STRAIGHT INTO, GRADED RATHER THAN
       ARGUED. A visit here may compile because every byte it pulls is this
       repository's own, off this origin; what CLAUDE.md refuses is a visit that
       opens somebody else's thing, and `/reel/` was reaching a broadcaster.
       That is a claim about WHERE the requests went, so it is read off
       `performance.getEntriesByType('resource')`, which is every resource this
       document really loaded rather than a list this page keeps.
       ⚠️ AND THE COUNT IS THE NEGATIVE HALF. A page that had loaded nothing at
       all would pass "no foreign host" vacuously, and this assert runs in the
       first milliseconds of a visit, which is exactly when that is nearly true.
       ⚠️ IT WAS `a visit fetches no compiler at all` UNTIL 2026-09-28. The
       claim moved rather than the rule: what a visit may not do is spend
       somebody else's server, and it never did. */
    const loaded = () => performance.getEntriesByType('resource');
    const foreign = loaded().filter((e) => new URL(e.name, location.href).origin !== location.origin);
    d.assert('everything a visit loads comes off this site, so compiling on load costs no other '
           + 'server a byte',
      foreign.length === 0 && loaded().length > 0,
      foreign.map((e) => new URL(e.name, location.href).origin).join(', ')
      || `${loaded().length} resources, every one of them ${location.origin}`);
    /* 🔴 THE HALF OF THE OLD RULE THAT DID NOT MOVE, AND IT IS THE ONE ABOUT
       HARDWARE. A compile is arithmetic; a context is a sound device and a MIDI
       request is a question put to somebody. None of the three may happen
       before a gesture, and the load compile deliberately reaches none of them:
       `build()` stops at `ready` and `attach()` is the only thing in the file
       that touches a context.
       ⚠️ IT WAS FOUR CLAIMS UNTIL 2026-09-24 and the fourth read a compile
       button's `disabled`; it was four again until 2026-09-28 and the fourth
       was `runs === 0`, which has stopped being true on purpose. */
    d.assert('and a visit opens no sound device, puts nothing on the audio thread and asks about '
           + 'no MIDI keyboard',
      ctx === null && node === null && midi === null,
      `audio ${ctx ? 'open' : 'none'}, node ${node ? 'built' : 'none'}, `
      + `MIDI ${midi ? 'asked' : 'not asked'}`);
    /* 🔴 THE CELL IS ROUND-TRIPPED THROUGH 1000 RATHER THAN COMPARED AGAINST
       `kb()`, AND THAT IS THE WHOLE POINT OF THIS ASSERT. The first version
       read `d.api.readout.source === kb(bytes)`, which is two numbers out of
       one field: change `kb()` to divide by 1024 and the cell and the expected
       value move together and this stays green, which is the failure
       `positron-verify` records about a check whose halves share a bug.
       Multiplying the printed value back by 1000 tests the LADDER instead.
       ⚠️ AND THE TOLERANCE IS DERIVED, NOT PICKED. Two decimals of a kB is
       five bytes of rounding at any magnitude, so the round trip through 1000
       can never miss by more than 5 and a round trip through 1024 misses this
       source by 15. MEASURED on the Organ: 765 B prints 0.77 and comes back
       770, against 0.75 and 750. */
    const srcBytes = new TextEncoder().encode(PRESETS[0].code).length;
    d.assert('the box opens with a whole instrument in it, and the readout measures it in '
           + 'kB of 1000 bytes',
      Math.abs(Number(d.api.readout.source) * 1000 - srcBytes) <= 5,
      `${d.api.readout.source} kB reads back as ${Number(d.api.readout.source) * 1000} B `
      + `against ${srcBytes} B`);
    d.assert('the readout is the four cells the ask left it with, which is an even count',
      Object.keys(d.api.readout).length === 4, Object.keys(d.api.readout).join(', '));

    /* ── the panel, read off rects ─────────────────────────────────────────
       🔴 FOUR CLAIMS THIS PAGE NEVER GRADED, added with the move onto the kit's
       panel. Each is a rect pair, because this is the page whose text box was
       reported five times and fixed wrong three times by reading rules. */
    {
      const rect = (e) => (e.el || e).getBoundingClientRect();
      const cs = (e, k) => parseFloat(getComputedStyle(e.el || e)[k]) || 0;
      d.assert('the panel is a picture, keys and a foot, in that order',
        panel.shape().join(' ') === 'viz keys plate', panel.shape().join(' '));
      const ta = rect(source.input), sf = rect(panel.el);
      const gapL = +(ta.left - (sf.left + cs(panel.el, 'borderLeftWidth'))).toFixed(1);
      const gapR = +((sf.right - cs(panel.el, 'borderRightWidth')) - ta.right).toFixed(1);
      d.assert('the text runs edge to edge of the surface, one border apart',
        Math.abs(gapL) <= 0.6 && Math.abs(gapR) <= 0.6 && cs(source.input, 'borderLeftWidth') === 0,
        `${gapL} px and ${gapR} px inside the surface’s border, with ${cs(source.input, 'borderLeftWidth')} px of its own`);
      const row = rect(panel.plateRow);
      const inset = cs(panel.plateRow, 'paddingLeft');
      const l = +(rect(panel.plate.el).left - row.left).toFixed(1);
      const rr = +(row.right - rect(patch.el).right).toFixed(1);
      /* 🔴 THE FOOT SINCE 2026-09-26: the name on the left inset, the patch
         selector on the right inset with no caption, and Compile NOT in it.
         Its `display` is read COMPUTED rather than off `hidden`, because a foot
         with nothing left in it must paint nothing, and only the computed value
         says whether a box is being drawn. This one still holds two ends. */
      const footDisplay = getComputedStyle(panel.plateRow).display;
      const captioned = patch.el.querySelector('.pos-pick-l') !== null;
      d.assert('the foot holds the name at the start and the patch selector, unlabelled, at the far end, and Compile is not in it',
        Math.abs(l - inset) <= 0.6 && Math.abs(rr - inset) <= 0.6 && rect(patch.el).left > rect(panel.plate.el).right
          && !captioned && !panel.plateRow.contains(compileBtn)
          && footDisplay !== 'none' && panel.plateRow.children.length === 2,
        `${l} px in on the left and ${rr} px on the right against an inset of ${inset}, `
        + `${captioned ? 'a caption on the picker' : 'no caption on the picker'}, `
        + `the foot ${footDisplay} with ${panel.plateRow.children.length} ends`);
      const rowsPad = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--rows-pad'));
      const ink = cs(source.input, 'paddingLeft') + cs(source.input, 'borderLeftWidth');
      d.assert('the first line of code sits on the inset the keys and the foot keep',
        ink === rowsPad && cs(panel.keys, 'paddingLeft') === rowsPad && inset === rowsPad && rowsPad > 0,
        `the code starts ${ink} px in, the keys row ${cs(panel.keys, 'paddingLeft')} and the foot ${inset}, against --rows-pad ${rowsPad}`);
      /* 🔴 COMPILE IS INSIDE THE WELL, IN ITS BOTTOM RIGHT CORNER, ON THE
         INSETS THE ROWS KEEP, SMALL, AND UNDER NO LINE OF CODE. Printed as the
         rect pair, button against the text box and the well, because this is
         the page whose corner was reasoned about five times and measured once.
         The well is the field; the text box is the scroller inside it, and on
         a phone it scrolls, so a line can reach the text box's bottom EDGE and
         the button has to sit a row gap below that edge, never over it. The
         first draft measured the button against the text's padding and read
         green at 756 px while a phone showed it over `os.osc`. */
      const rowsGap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--rows-gap'));
      const ctlSm = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ctl-sm'));
      const bt = rect(compileBtn), well = rect(source.el);
      const inR = +(ta.right - bt.right).toFixed(1);
      const inB = +(ta.bottom - bt.bottom).toFixed(1);
      const f1 = (n) => n.toFixed(1);
      d.assert('Compile sits over the text box’s bottom right corner, one row gap in, small and secondary',
        Math.abs(inR - rowsGap) <= 0.6 && Math.abs(inB - rowsGap) <= 0.6
          && bt.left > ta.left && bt.top > ta.top
          && Math.abs(bt.height - ctlSm) <= 0.6 && bt.height < 34 && ctlSm > 0
          && compileBtn.classList.contains('pos-sm') && !compileBtn.classList.contains('pos-pri')
          && source.el.contains(compileBtn),
        `button ${f1(bt.left)},${f1(bt.top)} to ${f1(bt.right)},${f1(bt.bottom)} against the text box `
        + `${f1(ta.left)},${f1(ta.top)} to ${f1(ta.right)},${f1(ta.bottom)}: `
        + `${inR} px in from the right, ${inB} px up from the bottom, ${f1(bt.height)} px tall against --ctl-sm ${ctlSm}, well ${f1(well.right)},${f1(well.bottom)}`);
    }
    /* 🔴 THE UNIT ITSELF, ASSERTED, BECAUSE THE ASK WAS ABOUT THE UNIT AND
       NOTHING ELSE ON THIS PAGE WOULD NOTICE ONE GOING BACK. Three of the four
       cells are sizes and all three have to say `kB`; `compile` is a time and
       has to stay `ms`, which is the negative half and is why this names all
       four rather than counting how many say kB. A cell relabelled to `B` or to
       `KB` takes this red on its own, and so would a sweep that renamed the lot.
       ⚠️ READ OFF THE RENDERED CELL AND NOT OFF THE `readout` OBJECT THIS PAGE
       HANDED `mount()`, WHICH WAS THE FIRST TRY AND IS TWO NUMBERS FROM ONE
       FIELD. `api.readout` is values rather than units, and the map in this
       file would agree with itself whatever reached the screen. `shell.mjs`
       puts the unit in a `.pos-u` inside the cell, so that is the far side of
       the boundary and it is what a reader is looking at. */
    const unitOf = (key) => [...d.readoutEl.querySelectorAll('.pos-cell')]
      .find((c) => c.querySelector('.pos-k')?.textContent === key)
      ?.querySelector('.pos-u')?.textContent;
    d.assert('every size in the readout is in kB and the one time is not',
      unitOf('source') === 'kB' && unitOf('machine code') === 'kB'
        && unitOf('per voice') === 'kB' && unitOf('compile') === 'ms',
      Object.keys(d.api.readout).map((k) => `${k} in ${unitOf(k)}`).join(', '));
    d.assert('nothing cut and nothing refused in the picture', dg.cuts.length === 0,
      dg.cuts.map((c) => c.full).join(', ') || 'nothing');
    d.assert('the only headless line in the picture is the one joining a set', dg.ties === 1,
      `${dg.ties} ties`);
    d.assert('the pedal is read on one controller, and the page says which',
      pedal.cc === (Number(q.get('pedal')) || SUSTAIN_CC), `controller ${pedal.cc}`);

    /* 🔴 THE LISTING'S OWN FORMAT, GRADED, BECAUSE A FORMAT NOTHING CHECKS IS A
       FORMAT THAT COMES BACK. Asked 2026-09-25 as *"add nl after comments"* and
       scoped by the owner to these six sources: a comment on its own line is
       followed by a blank line before the code it introduces. A run of comment
       lines is ONE comment and takes one blank after the run, so a comment
       followed by another comment is not a violation.
       ⚠️ AND THE NEGATIVE HALF IS COUNTING THE COMMENTS, because `nothing out
       of place` is vacuously true of a listing with no comments in it at all,
       and deleting them is the cheapest way to make this assert stop meaning
       anything. Both counts have to survive: own-line comments, which this
       grades, and TRAILING ones, which must stay on their code line and are
       exactly what the format does NOT apply to. MEASURED today: 16 and 21. */
    const fmt = { own: 0, trail: 0, bad: [] };
    for (const pr of PRESETS) {
      const lines = pr.code.replace(/\n$/, '').split('\n');
      lines.forEach((line, i) => {
        const own = /^\s*\/\//.test(line);
        if (own) fmt.own++;
        else if (line.includes('//')) fmt.trail++;
        const next = lines[i + 1];
        if (!own || next === undefined) return;
        if (!/^\s*\/\//.test(next) && next.trim() !== '') fmt.bad.push(`${pr.id} line ${i + 1}`);
      });
    }
    d.assert('every comment on its own line in the six listings is followed by a blank line, '
           + 'and there are comments in them to check',
      fmt.bad.length === 0 && fmt.own >= 10 && fmt.trail >= 10,
      fmt.bad.join(', ') || `${fmt.own} own-line comments each followed by a blank, `
      + `${fmt.trail} still sitting on their own code line`);

    /* Typing is the page's whole subject, so the number it moves is asserted
       rather than assumed. */
    const wasBytes = Number(d.api.readout.source);
    source.set(`${PRESETS[0].code}\n// a comment the check typed\n`);
    showSource();
    /* ⚠️ THIRTY CHARACTERS IS 0.03 kB, WHICH THE CELL CAN SHOW AND ONLY JUST.
       That is what set the two decimals in the header's unit block: at one
       decimal this assert would be comparing `0.76` against `0.76` and would go
       red on a page where the typing worked perfectly. */
    d.assert('editing the text changes the size under it',
      Number(d.api.readout.source) > wasBytes,
      `${wasBytes} kB became ${d.api.readout.source} kB`);
    source.set(PRESETS[0].code);
    showSource();

    /* ── the ask itself, which is everything above this line being true while
         a whole instrument was quietly compiled ────────────────────────────
       🔴 *"fau: compile on loading so i can play"*, 2026-09-28. Every assert
       before this one is deliberately cheap and lands in the first
       milliseconds, because `demo/verify.mjs` gives up after five quiet polls
       and this wait is a six megabyte download. The wait itself is here rather
       than at the top for the same reason.
       ⚠️ AND WHAT IS ASSERTED IS THE PAIR: the compiler is in the tab AND
       nothing was pressed to get it there. Either half on its own is satisfied
       by the page this replaced. */
    await warm;
    d.assert('the compiler arrived and a whole instrument was compiled with nobody pressing '
           + 'anything, off the four files this page ships',
      faust !== null && ready !== null && runs === 1 && vendorLoads().length === 4,
      `${runs} compile with no press, ${vendorLoads().length} vendor files, `
      + `${ready?.name || 'nothing'} waiting for a key`);
    /* The negative control beside it, and it is the one that would have gone
       red on any design that reached the audio thread at load. */
    d.assert('and it got there without opening a sound device, so nothing has been played at '
           + 'anybody', ctx === null && node === null && midi === null,
      `audio ${ctx ? 'open' : 'none'}, node ${node ? 'built' : 'none'}, `
      + `MIDI ${midi ? 'asked' : 'not asked'}`);

    /* ── the patch selector's fourth state ─────────────────────────────────
       🔴 DRIVEN BY A REAL `input` EVENT, NOT BY CALLING THE HANDLER. What is
       being claimed is that TYPING moves the selector, and a check that calls
       `onType()` itself grades the function rather than the wiring between the
       textarea and it. `positron-verify` records the same thing about a meter
       gated on intent: drive the gesture.
       ⚠️ AND IT ALL HAPPENS WHILE THE INSTRUMENT IS OFF, so it costs nothing:
       nothing here compiles, which is also the second reading of the assert
       above. */
    const typeInto = (text) => {
      source.input.value = text;
      source.input.dispatchEvent(new Event('input', { bubbles: true }));
    };
    /* ⚠️ WHAT THE CONTROL DRAWS, NOT WHAT THIS PAGE BELIEVES. `picked` is the
       page's own idea and would agree with itself whatever the control showed,
       which is two numbers from one field. `createPicker` publishes `show()`
       and not what it is showing, so the drawn name is read off the
       component's own class. `createNameplate` grew a `shown()` for exactly
       this reason and the picker has not; it is worth one line in the kit and
       is not this page's to add today. */
    const patchSays = () => patch.el.querySelector('.pos-pick-n')?.textContent;
    const wasSaying = patchSays();
    typeInto(`${PRESETS[0].code}\n// and the check typed this\n`);
    d.assert('a keystroke moves the patch selector to custom, because a lit Organ would be '
           + 'naming something that is no longer in the box',
      patchSays() === CUSTOM && picked === -1 && patch.select.selectedIndex === -1,
      `${wasSaying} became ${patchSays()}, with nothing selected in the list under it`);
    /* The other half. A selector that said `custom` whatever it was shown would
       pass the assert above, so it has to be able to come back. */
    const beforePick = runs;
    await applyPatch(0);
    /* 🔴 AND WHAT IS WAITING FOR THE FIRST KEY IS THE PRESET THE SELECTOR
       SHOWS, WHICH IS A NEW CLAIM ON 2026-09-28. This read `runs === 0` while a
       pick could not compile at all; now a pick recompiles, and the thing worth
       grading is that the two agree. A selector naming one instrument over a
       compile of another is the lying control this project has a rule about,
       and it is the defect the old refusal would have shipped. */
    d.assert('and loading a preset again takes it off custom, with that preset compiled and '
           + 'waiting for the first key',
      patchSays() === PRESETS[0].label && picked === 0
        && runs === beforePick + 1 && (ready?.name || '').startsWith('organ'),
      `${patchSays()} selected, ${runs - beforePick} compile, ${ready?.name} waiting`);

    /* ── typing compiles nothing, which is the whole of "no autocompile" ────
       🔴 TWO KEYSTROKES AND A WAIT LONGER THAN ANY IDLE TIMER THIS PAGE EVER
       HAD. Until 2026-09-26 a compile landed 800 ms after typing stopped and
       four asserts here graded when it did and did not; asked as *"no
       autocompile"*, the road is gone, and what is graded now is its absence,
       on `runs`, driven by a real `input` event rather than a call. */
    const typedBefore = runs;
    typeInto(`${PRESETS[0].code}\n// one\n`);
    await sleep(500);
    typeInto(`${PRESETS[0].code}\n// one two\n`);
    await sleep(1400);
    d.assert('typing compiles nothing, however long it goes on and however long it pauses',
      runs === typedBefore, `${runs - typedBefore} compiles after 1.9 s of typing and waiting`);

    /* ── "so i can play", as one assert ────────────────────────────────────
       🔴 THE FIRST KEY IS THE WHOLE OF SWITCHING THIS ON. No button in
       between, no six megabytes in between, and no compile in between: the
       press buys a worklet node out of a module that is already built, and the
       `runs` delta of zero is what says so. Before 2026-09-28 the same press
       logged *"nothing is on the audio thread, so switch FAU on"*, naming a
       switch that had been deleted four days earlier.
       ⚠️ `press()` IS WHAT THE KEYBOARD'S OWN `onDown` CALLS, which is the
       same road a finger takes and is how the existing sound check drives this
       page. What it returns is the arming, so this reads the instrument after
       the node exists rather than 20 ms early. */
    const armBefore = runs;
    const armT0 = performance.now();
    /* 🔴 A POINTER ON THE PANEL AND NOT ON A KEY, WHICH IS THE ROAD THE 134 ms
       LIVES ON. `arming` is read BEFORE anything in this block calls `arm()`,
       because what is being claimed is that the LISTENER did it: a check that
       armed the audio itself and then asserted the audio was armed would be
       green with both listeners deleted. */
    panel.el.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
    const armedByTouch = arming !== null;
    await arming;
    const armMs = performance.now() - armT0;
    d.assert('touching the instrument anywhere opens the sound device and puts the waiting '
           + 'compile on the audio thread, without compiling anything',
      armedByTouch && ctx !== null && node !== null && runs === armBefore,
      `${armedByTouch ? 'the touch armed it' : 'the touch did nothing'} in ${armMs.toFixed(0)} ms, `
      + `${runs - armBefore} compiles, audio ${ctx ? 'open' : 'none'}`);
    /* 🔴 AND THEN THE KEY IS FREE, WHICH IS THE WHOLE OF *"so i can play"*. The
       press does no work at all: no fetch, no compile, no node, so the time it
       takes is the time a function call takes and the sound is already on its
       way. MEASURED by the clock around the call rather than claimed. */
    const keyT0 = performance.now();
    press(60, 100);
    const keyMs = performance.now() - keyT0;
    await sleep(220);
    const armLevel = level();
    d.assert('and a key pressed after that sounds with nothing at all in between',
      armLevel > 0.01 && keyMs < 5 && runs === armBefore,
      `the press itself took ${keyMs.toFixed(1)} ms, ${runs - armBefore} compiles, `
      + `level ${armLevel.toFixed(5)}`);
    lift(60);
    allOff();
    await sleep(400);

    /* ── Compile, pressed rather than called ───────────────────────────────
       🔴 A REAL CLICK ON THE REAL CONTROL. Calling `pressCompile()` would grade
       the function and say nothing about the button in the panel's foot being
       wired to it, which is the half a visitor touches. `positron-verify`
       records a page whose checks went silent the day a control was disabled,
       and the opposite mistake is this one: a check that never presses.
       ⚠️ THE SHIMMER IS READ WHILE THE PRESS IS OPEN, off the attribute the
       stylesheet keys the sweep on, because a button that compiled without
       saying so is the silent control this project has a rule about. The press
       is then awaited through `compileJob`, because reading the page straight
       after the click would be reading it 6 MB early. */
    const beforePress = runs;
    const nodeBefore = node;
    const btn = compile.button('compile');
    btn.click();
    const sweptWhileBusy = btn.dataset.busy === '1' && btn.disabled;
    await compileJob;
    /* ⚠️ THE SENTENCE HERE READ *"the one press that fetches the compiler"*
       UNTIL 2026-09-28, WHICH THE LOAD COMPILE MADE FALSE. What Compile is now
       is the one road to a SECOND compile, and the assert grades that: a new
       module on the thread, out of the same four files the visit already
       pulled, with no fifth request behind it. */
    d.assert('Compile compiles what is in the box again and swaps it onto the audio thread, off '
           + 'the files the visit already pulled',
      node !== null && node !== nodeBefore && runs === beforePress + 1
        && midi !== null && vendorLoads().length === 4,
      `${runs - beforePress} compile, a ${node === nodeBefore ? 'reused' : 'new'} node, `
      + `MIDI ${midi?.state()}, ${vendorLoads().length} vendor files`);
    d.assert('and the button wears the kit\'s busy sweep for as long as the compile takes, then gives it back',
      sweptWhileBusy && btn.dataset.busy === undefined && !btn.disabled,
      `busy ${sweptWhileBusy ? 'while the compiler arrived' : 'never set'}, clear after`);

    /* ── from here on it costs the compiler, and it is ONE task on the queue ──
       🔴 EVERYTHING BELOW RUNS INSIDE `serial`, AND NOT ONE `serial` PER
       COMPILE, WHICH IS HOW IT WAS FIRST WRITTEN. Per-compile queueing left
       every `await sleep` in here as a hole another compile could fall through:
       MEASURED as `0 on the foot` where the check had just put one note there,
       on a page where the pedal was working. The first run passed, which is
       worse than failing.
       ⚠️ WHAT FELL THROUGH IT THEN WAS `demo/verify.mjs` PRESSING EVERY CONTROL
       IN THE ROW 650 ms APART, each preset press a compile that builds a new
       node and calls `pedal.forgetKeys()`. **That row is empty since 2026-09-24
       and the harness presses nothing here now.** The arrangement stays, because
       what makes a hole dangerous is that anything at all can compile while this
       block sleeps, and the autocompile still can.
       ⚠️ SO `build()` IS CALLED DIRECTLY IN HERE, NEVER THROUGH `serial`. A
       task that waits on another task in the same queue is a deadlock, and the
       symptom would be a page that never becomes ready.

       🔴 THE SEVEN CHARACTER NAMES ARE LOAD-BEARING. See `PINNED`: the module
       name is embedded in the generated wasm, so two compiles are only
       comparable by byte count when their names are the same length. */
    await serial(async () => {
    const cleanBefore = captured.length;
    const first = await build(PRESETS[0].code, 'organ', PINNED.name);
    d.assert('the compiler in this tab is the version this page was written against',
      faust.compiler.version() === COMPILER_VERSION, faust.compiler.version());
    d.assert('a compile that works says nothing to the console at all',
      captured.length === cleanBefore, `${captured.length - cleanBefore} lines captured`);
    d.assert('everything a compiling page needs really arrived, to the byte',
      vendorLoads().length === 4 && vendorBytes() === PAGE_BYTES,
      `${vendorLoads().length} files, ${vendorBytes()} B of ${PAGE_BYTES} B`);
    /* ⚠️ THE ONE ABOVE KEEPS ITS BYTES, AND IT IS THE SECOND OF THE TWO THE
       UNIT RULE NAMES. `to the byte` is the claim; at 0.01 MB of resolution a
       file arriving 4,000 bytes short would read as having arrived. */
    /* ⚠️ `ten lines` UNTIL 2026-09-25. The blank-line ask took the Organ to 18
       lines and the longest preset to 20, so the number in this sentence had
       stopped being true of anything in the list. */
    d.assert('a page of text became machine code, and it took longer than nothing',
      first.ok && first.bytes > 1000 && first.ms > 0,
      `${kb(first.bytes)} kB in ${first.ms.toFixed(0)} ms`);
    /* 🔴 THE `checkCompiledDefs` IDEA AT RUNTIME. One known source under one
       known name is exactly this many bytes, or something about the compiler,
       its flags or this page's arguments has moved.
       ⚠️ AND IT IS THE FIRST OF THE TWO ASSERTS THE UNIT RULE EXEMPTS. A
       fingerprint rounded to 10 bytes is not a fingerprint, and this one has
       already earned its resolution once: see `PINNED`, where it caught a 78
       byte difference that was a NAME rather than a change to the instrument. */
    d.assert('a known source under a known name is exactly the machine code it was last time',
      first.bytes === PINNED.bytes, `${first.bytes} B against ${PINNED.bytes} B`);
    d.assert('one voice of it is a quarter of a megabyte, because a Faust oscillator '
           + 'carries a sine table', first.size > 200000 && first.size < 400000,
      `${kb(first.size)} kB`);

    /* 🔴 THE PAGE'S WHOLE CLAIM, AS ONE ASSERT. Editing the text has to change
       the bytes the audio thread is running. A page that compiled the same
       module whatever it was handed would pass every other check here. */
    const edited = PRESETS[0].code.replace('0.25 * os.osc(freq * 3)',
                                           '0.25 * os.osc(freq * 3) + 0.12 * os.osc(freq * 5)');
    const second = await build(edited, 'edited organ', 'fau_alt');
    d.assert('editing the text changes the machine code the audio thread is running',
      second.ok && second.bytes !== first.bytes,
      `${kb(first.bytes)} kB became ${kb(second.bytes)} kB, from names of the same length`);

    /* The error path, which is the first thing a visitor meets, and the console
       it must not reach. */
    const before = captured.length;
    const bad = await build('process = nonsense(;', 'a deliberate mistake');
    d.assert('a source that does not parse is reported to the visitor rather than thrown away',
      !bad.ok && /syntax error/i.test(bad.error || ''), bad.error || 'no message');
    /* 🔴 AND THE HALF THAT SAYS THE SHIM WORKED IS THE PAIR OF THEM. A count on
       its own could be satisfied by a page that captures nothing and lets
       everything through, which is why the good compile above asserts ZERO
       captured lines. Nothing reaching the console is measured independently,
       by `demo/verify.mjs`'s own `no console errors`, which is on the far side
       of the boundary and would go red if one leaked. */
    d.assert('a compile that fails hands its abort to this page instead of to the console',
      captured.length > before, `${captured.length - before} lines from a bad compile, `
      + '0 from a good one');
    /* ⚠️ COMPARED BY `size` RATHER THAN BY BYTES, because this one is named
       after the button and the byte count carries its name's length. */
    const after = await build(PRESETS[0].code, 'organ again');
    d.assert('and the next good compile still works, so one bad source does not end the page',
      after.ok && after.size === first.size,
      `${kb(after.bytes)} kB, ${kb(after.size)} kB a voice`);

    /* ── the sound ────────────────────────────────────────────────────────── */
    const quiet = level();
    press(60, 100);
    await sleep(220);
    const sounding = level();
    d.assert('a key makes a sound, and the page was silent before it',
      sounding > 0.01 && quiet < 0.002, `${quiet.toFixed(5)} silent, ${sounding.toFixed(5)} held`);

    /* The pedal, with its negative control beside it: the same gesture without
       the foot has to end the note. */
    pedal.control(pedal.cc, pedal.wire(false));
    lift(60);
    await sleep(600);
    const released = level();
    d.assert('a key let go with no pedal is taken away', released < sounding * 0.2,
      `${sounding.toFixed(5)} held, ${released.toFixed(5)} let go`);

    /* 🔴 600 ms, AND THE NUMBER IS THE PRESET'S OWN RELEASE PLUS A MARGIN. The
       organ's `en.adsr` releases over 0.35 s, so a reading taken 200 ms after a
       key came up is still mostly a note that IS ending, and an assert on it
       passes whether the pedal worked or not. MEASURED by sabotage: with the
       release sent straight to the engine, this read 0.03028 against a 0.03940
       threshold, which is the right answer arriving by 9 thousandths. Past the
       release there is no ambiguity left to be lucky with. */
    const DECAYED = 600;
    pedal.control(pedal.cc, pedal.wire(true));
    press(62, 100);
    await sleep(200);
    const pedalledDown = level();
    lift(62);
    await sleep(DECAYED);
    const pedalled = level();
    d.assert('a key let go with the pedal down keeps sounding, and the engine is never told '
           + 'the note ended', pedalled > pedalledDown * 0.8 && pedal.held() === 1,
      `${pedalledDown.toFixed(5)} held, ${pedalled.toFixed(5)} after letting go, `
      + `${pedal.held()} on the foot`);
    pedal.control(pedal.cc, pedal.wire(false));
    await sleep(DECAYED);
    d.assert('and lifting the pedal ends it', level() < pedalled * 0.2 && pedal.held() === 0,
      `${level().toFixed(5)}, ${pedal.held()} on the foot`);

    /* 🔴 THE ONE THAT WOULD CATCH `plan-fau.md` §4.2's BUG. With the pedal down
       and every voice spoken for, the notes the foot is holding must all still
       be sounding: the allocator only steals a voice it thinks has been
       released, and it is never told. A page that put the pedal inside the DSP
       instead would lose them one by one under a chord. */
    pedal.control(pedal.cc, pedal.wire(true));
    for (let i = 0; i < VOICES; i++) press(60 + i, 100);
    await sleep(200);
    const chord = level();
    for (let i = 0; i < VOICES; i++) lift(60 + i);
    await sleep(DECAYED);
    const heldChord = level();
    d.assert('every voice the pedal is holding is still sounding, none of them stolen',
      pedal.held() === VOICES && heldChord > chord * 0.8,
      `${pedal.held()} of ${VOICES} on the foot, ${chord.toFixed(5)} held, `
      + `${heldChord.toFixed(5)} pedalled`);
    pedal.control(pedal.cc, pedal.wire(false));
    allOff();
    await sleep(120);

    /* Two presets, and the cell that tells them apart. A drum somebody else
       modelled carries almost no state; anything with an oscillator in it
       carries a sine table. */
    const drum = await build(PRESETS[2].code, 'djembe');
    d.assert('a preset named in one line compiles to more machine code than ten lines of '
           + 'arithmetic, because the model was already in the library',
      drum.ok && drum.bytes > second.bytes,
      `${kb(drum.bytes)} kB from ${kb(PRESETS[2].code.length)} kB of source, against `
      + `${kb(second.bytes)} kB from ${kb(edited.length)} kB`);
    d.assert('and one voice of it costs a thousandth of what the organ\'s voice costs',
      drum.size < first.size / 100, `${kb(drum.size)} kB against ${kb(first.size)} kB`);

    /* 🔴 THE TWO ONE-LINE MODELS SIDE BY SIDE, WHICH IS THE `a dictionary
       rather than magic` ARGUMENT AT ITS SHARPEST AND WAS GRADED BY NOTHING
       UNTIL THE CLARINET ARRIVED ON 2026-09-25. Both are a single `pm.` name
       out of the same library and both are about a quarter of a kB of source,
       and what they keep PER VOICE differs by nearly five hundred times: a
       struck skin holds almost no state and a blown tube is a delay line. The
       page's own sentence about compression is true of the drum and would be
       read as true of every library model without this beside it.
       ⚠️ FOUND BY `id` RATHER THAN BY INDEX. The rows above still use indices
       and two new presets have just been appended below them; an index is a key
       that the next `(add more)` moves, and a check reading the wrong preset
       fails on a page where nothing is wrong. */
    const byId = (id) => PRESETS.find((x) => x.id === id);
    const reed = await build(byId('clarinet').code, 'clarinet');
    d.assert('two patches that are each one line out of the same library keep wildly '
           + 'different amounts per voice',
      reed.ok && reed.size > drum.size * 100,
      `${kb(reed.size)} kB a voice against the drum's ${kb(drum.size)} kB, from `
      + `${kb(byId('clarinet').code.length)} kB and ${kb(byId('djembe').code.length)} kB `
      + 'of source');

    /* 🔴 THE ONE CLAIM ONLY `Hall` CAN MAKE, AND IT IS WHY THAT PRESET IS HERE.
       Five of the six end with `effect = _, _;`, which this file's header calls
       NOT DECORATION and which nothing on this page demonstrated until
       2026-09-25. A real room on that line is MORE machine code out of LESS
       source, and not one byte of it lands in the voice, because an effect runs
       once on the mix rather than once per voice. A page that quietly compiled
       the effect per voice would pass every other check in this block.
       ⚠️ SEVEN CHARACTERS AGAIN, because these bytes are compared against
       `first` and a module's name is embedded in it. See `PINNED`. */
    const hall = await build(byId('hall').code, 'hall', 'fau_hal');
    d.assert('a patch with a real effect on the end is more machine code out of less text, '
           + 'and none of it is in the voice',
      hall.ok && hall.bytes > first.bytes && hall.size === first.size
        && byId('hall').code.length < PRESETS[0].code.length,
      `${kb(hall.bytes)} kB from ${kb(byId('hall').code.length)} kB, against the Organ's `
      + `${kb(first.bytes)} kB from ${kb(PRESETS[0].code.length)} kB, and `
      + `${kb(hall.size)} kB a voice either way`);

    /* 🔴 EVERY PRESET IN THE LIST, WHICH IS THE ONLY THING THAT CATCHES ONE
       THAT DOES NOT COMPILE. The checks above name four of the six, and the
       other two arrived with asks that said *"(add more)"* and *"add more
       patches if you have"*: nothing in this block would have compiled them, so
       a preset that does not parse would have shipped and the first person to
       find out would be a visitor picking it. A list is exactly where a broken
       member hides. */
    const each = [];
    for (const p of PRESETS) {
      const r = await build(p.code, p.label.toLowerCase());
      each.push(`${p.label} ${r.ok ? `${kb(r.bytes)} kB` : `FAILED, ${r.error}`}`);
    }
    d.assert('every preset in the selector compiles, including the ones no other check names',
      each.every((s) => !s.includes('FAILED')), each.join(', '));

    /* Put the page back the way a visitor should find it. */
    await build(PRESETS[0].code, 'organ');
    source.set(PRESETS[0].code);
    showSource();
    showPatch(0);
    });

    /* ── and typing into a LIVE instrument compiles nothing either ──────────
       🔴 THE STRONGER HALF OF "no autocompile". The assert before the press
       typed into an instrument with nothing on the audio thread, where the old
       timer would have refused anyway; this one types into the compiled Organ,
       which is exactly where a compile used to land 800 ms later, and reads
       the thread as well as the counter: the node object must be the same one.
       ⚠️ SPLIT AT 500 ms FOR THE HARNESS. A check block that waits longer than
       three quiet polls without asserting is cut off and everything after it is
       lost while the run stays green, which is LESSONS #113 and cost /muta/ two
       checks. */
    const liveBefore = { runs, node };
    typeInto(`${PRESETS[0].code}\n// typed into a live instrument\n`);
    await sleep(500);
    d.assert('typing into a live instrument does not compile inside what used to be the idle wait',
      runs === liveBefore.runs && node === liveBefore.node,
      `${runs - liveBefore.runs} compiles at 500 ms, the same node on the thread`);
    await sleep(900);
    d.assert('and past it nothing has compiled either, so the thread runs what was last pressed',
      runs === liveBefore.runs && node === liveBefore.node,
      `${runs - liveBefore.runs} compiles at 1.4 s, the same node on the thread`);
    source.set(PRESETS[0].code);
    showSource();
    showPatch(0);

    /* 🔴 EVERY CELL HAS MOVED BY NOW OR ONE OF THEM IS A CONSTANT. This is the
       only assert on the page that can say a readout row is worth looking at,
       and it is read off what was written rather than off what is on screen now:
       a cell's CURRENT value says nothing about whether it has ever changed. */
    const stuck = [...moved].filter(([, seen]) => seen.size < 2).map(([k]) => k);
    d.assert('every cell in the readout took more than one value, so none of them is a constant '
           + 'wearing a measurement\'s clothes',
      stuck.length === 0,
      [...moved].map(([k, seen]) => `${k} ${seen.size}`).join(', '));

    /* The instrument is left live with the Organ on the thread, which is what a
       person opening this page with the checks running should find. */
  }

  ifSelfcheck(checks, { log: d.log,
    say: 'the checks this page runs on itself are off for a visitor, because they compile every '
       + 'preset in the list and play notes in front of you' });

  /* 🔴 `ready()` AFTER THE CHECKS ARE STARTED AND NOT AT THE END OF THEM.
     `demo/verify.mjs` waits up to six seconds for `__demo.ready` before it
     touches the page, so a ready at the end of a check block that fetches a
     compiler is a page waiting for a harness that is waiting for the page. */
  d.ready();
</script>
</html>
