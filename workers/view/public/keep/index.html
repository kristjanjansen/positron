<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* side by side, stacked when there is no room: the two pictures are the
     comparison, and a column puts one off the screen while you look at the other */
  .stage { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
           gap: 10px; margin: 0 0 10px; align-items: start; }
  .stage figure { margin: 0; width: 100%; }
  .stage canvas { display: block; width: 100%; background: var(--card);
                  border: 1px solid var(--line); border-radius: 4px; }
  .seq { position: relative; width: 100%; aspect-ratio: 16 / 9; }
  .seq video { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>

<script type="module">
  import { mount, guard, el, armVideo, recorderMime } from '/shell/shell.mjs';
  import { openSession, putWhole, fetchBack } from '/shell/ingest.mjs';
  import { whipPublish, whepPlay, whep } from '/shell/live.mjs';
  import { burn, readBurnedFrom, drawCamera, videoHue, FRAME_H } from '/shell/pattern.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createStripView } from '/shell/strip.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { mediaMaster } from '/timeline/media-master.mjs';

  const W = 1280, H = FRAME_H;
  const CAP_MS = 10_000;   // a backstop, not the mechanism — stop is manual
  const SLICE_MS = 500;
  const FPS = 25, FRAME_MS = 1000 / FPS;

  // R2 IS OPT-IN, by `?r2=1`. The caps are real — five sessions per address per
  // hour — and the harness presses every control on every run, so three runs in
  // an hour would hit a 429 and a working page would read red. Off by default,
  // exactly as `capture` does it.
  const useR2 = new URLSearchParams(location.search).get('r2') === '1';

  // WHAT SURVIVES A RELOAD. The recordings are in R2 for six hours; the line
  // that arranges them is not — it lives in this tab and dies with it. So a
  // page called `keep` was losing everything on reload while the files sat
  // there, which is the page contradicting its own name.
  //
  // localStorage holds only what is needed to find them again: the url, the
  // format, the length and when it expires. Not the video — that is R2's job —
  // and anything past its six hours is dropped on the way in rather than
  // fetched and found missing.
  const REMEMBER = 'keep.takes.v1';
  const remembered = () => {
    try {
      const all = JSON.parse(localStorage.getItem(REMEMBER) || '[]');
      return all.filter((t) => t.expiresAt && new Date(t.expiresAt) > new Date());
    } catch { return []; }
  };
  const remember = (t) => {
    try { localStorage.setItem(REMEMBER, JSON.stringify([...remembered(), t])); } catch { /* full or off */ }
  };
  const forget = () => { try { localStorage.removeItem(REMEMBER); } catch { /* off */ } };

  const d = mount({
    name: 'keep',
    what: 'The picture you send goes out to a server and comes back, and what you '
      + 'record is the copy that came back. Every frame carries a clock written '
      + 'into the pixels before it left, so dragging the line and watching that '
      + 'clock move by the same amount proves the seek landed.',
    readout: { leg: 'ms', takes: '', line: 's', clean: '', drift: 'ms' },
    showReadout: false,
    controls: [
      { id: 'go', label: 'Send and receive', primary: true },
      { id: 'camera', label: 'Use the camera' },
      { id: 'clear', label: 'Delete takes', end: true },
    ],
  });
  guard(d);

  const ink = (h, s, l, a = 1) => `hsl(${h} ${s}% ${l}% / ${a})`;

  // ── the source: our own picture, published out ────────────────────────────
  const stage = el('div', 'stage');
  const srcFig = el('figure');
  const canvas = el('canvas');
  canvas.width = W; canvas.height = H;
  const g = canvas.getContext('2d');
  srcFig.append(canvas, el('figcaption', 'pos-cap', 'sent'));

  const seqFig = el('figure');
  const seq = el('div', 'seq');
  const live = el('video', '', null, { playsinline: '', muted: '' });
  live.muted = true;
  seq.append(live);
  // THE NUMBER SITS ON THE PICTURE IT DESCRIBES. How far the copy travelled is
  // a property of THIS pane, so it goes in its caption rather than in a row of
  // figures somewhere else that the reader has to join up.
  const seqCap = el('figcaption', 'pos-cap', 'received');
  const legText = () => (legs.length ? `received  +${Math.round(median(legs))} ms` : 'received');
  seqFig.append(seq, seqCap);
  stage.append(srcFig, seqFig);
  d.el.append(stage);

  const cam = el('video', '', null, { playsinline: '', muted: '' });
  cam.hidden = true;
  let camStream = null, frame = 0;
  setInterval(() => {
    const on = camStream && cam.readyState >= 2 && drawCamera(g, cam, W, H);
    burn(g, W, H, frame++, { hue: videoHue(parts.length), field: !on });
  }, 40);

  d.on('camera', async () => {
    if (camStream) { d.log('camera already on'); return; }
    try {
      camStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      cam.srcObject = camStream;
      await cam.play().catch(() => {});
      d.log(`camera on: ${camStream.getVideoTracks()[0].label || 'default'}`, 'hi');
    } catch (e) {
      camStream = null;
      d.log(`camera: ${e.name} — staying on the generated picture`, 'bad');
    }
  });

  d.on('clear', () => {
    if (recording) { d.log('stop recording first'); return; }
    for (const p of parts) { try { p.video.remove(); URL.revokeObjectURL(p.url); } catch { /* gone */ } }
    parts.length = 0; totalMs = 0; active = null; handovers = [];
    deck.setRange([0, CAP_MS]);
    deck.seek(0);
    live.hidden = false;
    seqCap.textContent = legText();
    asserted = false; didClock = false;
    paint();
    forget();
    d.log('takes deleted, and forgotten — the R2 files stay until their six hours '
      + 'are up, but this page will not pick them up again');
  });

  // ── the line ──────────────────────────────────────────────────────────────
  const parts = [];      // { n, hue, mime, blobs[], bytes, lenMs, startMs, video, e0 }
  let totalMs = 0, recording = null, landing = null, active = null;
  const deck = createDeck({ items: [], adapters: {}, range: [0, CAP_MS] });

  const inFlight = () => {
    const r = recording;
    if (!r) return null;
    return { ...r.part, lenMs: Math.min(CAP_MS, performance.now() - r.t0) };
  };
  const shown = () => { const l = inFlight() || landing; return l ? parts.concat([l]) : parts; };
  const partAt = (pos) => parts.find((p) => pos >= p.startMs && pos < p.startMs + p.lenMs);
  const localOf = (p, ms) => Math.max(0, Math.min((p.lenMs ?? 0) - 40, ms - p.startMs)) / 1000;

  // ── the round trip ────────────────────────────────────────────────────────
  let pub = null, sub = null, legs = [], scratch = document.createElement('canvas');

  d.on('go', async () => {
    if (pub) { d.log('already sending'); return; }
    try {
      pub = await whipPublish(canvas.captureStream(FPS), { log: (m, k) => d.log(m, k) });
    } catch (e) { d.log(`send failed: ${e.message}`, 'bad'); return; }
    try {
      sub = await whepPlay(whep(), live, { log: (m, k) => d.log(m, k) });
    } catch (e) { d.log(`receive failed: ${e.message}`, 'bad'); return; }
    armVideo(live);
    // Wait for a frame to actually arrive rather than for a promise to settle:
    // a WHEP track exists before it carries anything.
    for (let i = 0; i < 120 && !live.videoWidth; i++) await new Promise((r) => setTimeout(r, 250));
    d.log(live.videoWidth ? `receiving ${live.videoWidth}x${live.videoHeight}` : 'no picture arrived', live.videoWidth ? 'hi' : 'bad');
    legSampler();
  });

  /**
   * HOW FAR THE PICTURE TRAVELLED, on one clock.
   *
   * The number in the received frame was written by THIS machine before the
   * picture left, so `now - burned` is the whole round trip — out to Cloudflare
   * and back — with no cross-machine offset to guess at. That is the one thing
   * a browser publisher buys that an ffmpeg one cannot: the same clock at both
   * ends.
   */
  function legSampler() {
    setInterval(() => {
      if (!live.videoWidth) return;
      const e = readBurnedFrom(live, scratch);
      if (e === null) { unreadable++; return; }
      readable++;
      const ms = Date.now() - e;
      if (ms > 0 && ms < 10000) legs.push(ms);
      if (legs.length > 200) legs = legs.slice(-200);
      d.set('leg', Math.round(median(legs)));
      if (!active) seqCap.textContent = legText();
      d.set('clean', `${readable}/${readable + unreadable}`);
    }, 200);
  }
  let readable = 0, unreadable = 0;
  const median = (a) => { if (!a.length) return 0; const s = a.slice().sort((x, y) => x - y); return s[s.length >> 1]; };

  // ── recording the RECEIVED picture ────────────────────────────────────────
  function startRecording() {
    if (recording || !sub) { if (!sub) d.log('nothing to record yet — press Send and receive', 'bad'); return; }
    const mime = recorderMime(d);
    if (!mime) return;
    // THE RECEIVER'S TRACK, not the source. `sub.inbound` is the stream this
    // page assembled out of `pc.ontrack`; recording `canvas.captureStream()`
    // here would archive a picture that never crossed the wire.
    // VIDEO ONLY, and this is not a preference.
    //
    // Cloudflare REFUSES a single-track WHEP offer, so the subscription asks for
    // audio as well and gets an audio track. Our publisher is a canvas, which
    // has no audio, so that track is live and forever silent — and a
    // MediaRecorder handed a track that never produces a sample sits waiting for
    // it and writes NOTHING. First run of this page recorded 0 bytes in 4 s for
    // exactly that reason, with no error to show for it.
    const vTracks = sub.inbound.getVideoTracks();
    if (!vTracks.length) { d.log('no video track to record', 'bad'); return; }
    const rec = new MediaRecorder(new MediaStream(vTracks),
      { mimeType: mime, videoBitsPerSecond: 900_000 });
    rec.onerror = (ev) => d.log(`recorder: ${ev.error?.name ?? 'error'}`, 'bad');
    const part = { n: parts.length + 1, hue: videoHue(parts.length), mime,
                   blobs: [], chunks: [], bytes: 0, startMs: totalMs, lenMs: null, video: null };
    const t0 = performance.now();
    let lastAt = 0;
    rec.ondataavailable = (e) => {
      if (!e.data || !e.data.size) return;
      const at = performance.now() - t0;
      part.chunks.push({ at, size: e.data.size, gapMs: part.chunks.length ? at - lastAt : at });
      lastAt = at;
      part.blobs.push(e.data);
      part.bytes += e.data.size;
      paint();
    };
    rec.onstop = async () => {
      landing = { ...part, lenMs: Math.round(performance.now() - t0) };
      recording = null;
      setRecUI(false);
      view.strip.state.wallAnchor = null;
      deck.setRange([0, Math.round(totalMs + landing.lenMs)]);
      await new Promise((r) => setTimeout(r, 250));
      await landPart(part);
      landing = null;
      runChecks();
    };
    recording = { rec, part, t0 };
    rec.start(SLICE_MS);
    setRecUI(true);
    view.strip.armWall(part.startMs);
    d.log(`take ${part.n}: recording what came back · ${CAP_MS / 1000}s cap`, 'hi');
    recording.capTimer = setTimeout(() => {
      if (recording?.rec === rec) { d.log(`take ${part.n}: hit the cap`); stopRecording(); }
    }, CAP_MS);
  }
  function stopRecording() {
    if (!recording) return;
    clearTimeout(recording.capTimer);
    try { recording.rec.stop(); } catch { /* already */ }
  }
  function setRecUI(on) {
    const b = bar.extra('rec');
    if (!b) return;
    b.dataset.on = on ? '1' : '';
    b.textContent = on ? '\u25A0' : '\u25CF';
    b.setAttribute('aria-label', on ? 'Stop recording' : 'Record');
  }

  async function resolveDuration(video) {
    await new Promise((res) => {
      video.addEventListener('loadedmetadata', res, { once: true });
      setTimeout(res, 4000);
    });
    if (!Number.isFinite(video.duration)) {
      video.currentTime = 1e6;
      await new Promise((res) => {
        const on = () => { if (Number.isFinite(video.duration)) { video.removeEventListener('timeupdate', on); res(); } };
        video.addEventListener('timeupdate', on);
        setTimeout(res, 3000);
      });
      video.currentTime = 0;
    }
    return Number.isFinite(video.duration) ? video.duration * 1000 : null;
  }

  async function landPart(part) {
    if (!part.blobs.length) { d.log(`take ${part.n}: nothing recorded`, 'bad'); return; }

    // WHERE THE PICTURE COMES BACK FROM decides what this page is claiming. In
    // R2 mode the local copies are DROPPED and playback is fetched back from
    // archive.positron.studio — otherwise the page would say "kept" while
    // replaying memory, which is the same page reading green over nothing.
    // ONE FILE PER TAKE, not one per slice.
    //
    // The ingest API is segment-shaped because `record` proved the disk
    // economics of ship-then-delete: for a SHOW you never hold the whole thing,
    // and the high-water stays at two segments however long it runs. None of
    // that applies to an eight-second take — at 900 kbps it is about 900 KB,
    // well under the 2 MiB an object may be — and slicing it buys nothing while
    // costing real fragility: the worker requires a DENSE sequence, so one
    // refused piece poisons every later one, and a WebM assembled from
    // timeslice chunks is only playable if its header chunk arrives first.
    //
    // So: record locally, PUT the finished take as a single object, and the
    // stored file is a complete, directly playable WebM.
    let blob = null;
    if (useR2) {
      const whole = new Blob(part.blobs, { type: part.mime });
      const put = await putWhole(whole, { log: (m, k) => d.log(m, k) });
      if (put) {
        part.manifest = put.url;
        part.expiresAt = put.expiresAt;
        d.log(`take ${part.n}: ${Math.round(whole.size / 1024)} KiB stored as one file`, 'hi');
        blob = await fetchBack(put.url, part.mime, { log: (m, k) => d.log(m, k) });
        if (blob) {
          part.blobs.length = 0;                       // the local copy is gone
          remember({ url: put.url, mime: part.mime, expiresAt: put.expiresAt });
        }
        else d.log(`take ${part.n}: could not fetch it back — keeping the local copy`, 'bad');
      }
    }
    part.from = blob ? 'r2' : 'local';
    part.url = URL.createObjectURL(blob || new Blob(part.blobs, { type: part.mime }));
    const v = el('video', '', null, { playsinline: '', muted: '' });
    v.muted = true; v.hidden = true;
    // armed BEFORE the source: with no src, play() rejects and the activation is
    // consumed without starting anything. Arming after would start it, and a
    // rolling element drags the paused deck along behind it (media-master L1).
    armVideo(v);
    v.autoplay = false;
    v.src = part.url;
    seq.append(v);
    part.video = v;
    v.addEventListener('seeked', () => {
      if (queuedSeek && queuedSeek.p === part) {
        const q = queuedSeek; queuedSeek = null;
        part.video.currentTime = q.want;
      }
    });

    part.lenMs = Math.round((await resolveDuration(v)) ?? (performance.now()));
    if (part.startMs !== totalMs) part.startMs = totalMs;
    totalMs += part.lenMs;
    parts.push(part);
    deck.setRange([0, Math.round(totalMs)]);
    if (!active) handOver(part, 0);
    if (!rafOn) { rafOn = true; (function loop() { requestAnimationFrame(loop); tick(); })(); }
    paint();
    d.log(`take ${part.n} landed: ${(part.lenMs / 1000).toFixed(2)}s at `
      + `${(part.startMs / 1000).toFixed(2)}s, playing from ${part.from === 'r2' ? 'R2' : 'memory'}`, 'hi');
    if (part.expiresAt) {
      const mins = Math.round((new Date(part.expiresAt) - Date.now()) / 60000);
      d.log(`this recording is deleted in ${Math.floor(mins / 60)}h ${mins % 60}m — six hours is the cap, `
        + `and a cron enforces it`, 'hi');
    }
  }

  // ── one picture under the playhead at a time ──────────────────────────────
  // The master is a FUNCTION that says which element is the clock right now.
  // `autoPlayPause: false` because a take ending here is a handover, not a stop.
  const mm = mediaMaster(deck, () => {
    const p = active;
    if (!p || !p.video) return null;
    return { el: p.video, pos: p.startMs + p.video.currentTime * 1000, key: `take${p.n}` };
  }, {
    autoPlayPause: false,
    onEvent: (e) => d.log(`clock: ${e.reason}${e.key ? ` \u00b7 ${e.key}` : ''}`),
  });
  let rafOn = false, handovers = [];
  function handOver(p, pos) {
    const from = active;
    if (from && from.video) { from.video.pause(); from.video.hidden = true; }
    active = p;
    p.video.hidden = false;
    live.hidden = true;
    const want = localOf(p, pos);
    if (Math.abs(p.video.currentTime - want) > 0.08) p.video.currentTime = want;
    mm.release('handover');          // a clean re-acquire on the new key
    handovers.push(`${from ? from.n : '\u00b7'}\u2192${p.n}@${Math.round(pos)}`);
  }
  // EVERY SEEK IS A COMMAND TO THE ELEMENT. `deck.seek()` alone does nothing
  // visible with a media master attached: L1 means mediaMaster reads the
  // picture, sees the vector has wandered and pulls it straight back. Without
  // this mirror the clock check read the SAME frame twice and reported
  // "playhead +2161 ms, picture +0 ms" — a page seeking itself and watching
  // nothing happen. `inServo` keeps L2's own corrective seek from chasing its
  // tail.
  let inServo = false, queuedSeek = null;
  deck.transport.onState((st) => {
    if (st.reason !== 'seek' || inServo || !parts.length) return;
    const pos = st.p0;
    const p = partAt(pos);
    if (!p) return;
    if (p !== active) handOver(p, pos);
    const want = localOf(p, pos);
    // one seek in flight, latest wins — a drag fires one per pointermove, and
    // queuing them walks the picture through every position the finger passed
    if (p.video.seeking) { queuedSeek = { p, want }; return; }
    queuedSeek = null;
    p.video.currentTime = want;
  });

  function tick() {
    if (!parts.length) return;
    const playing = deck.playing();
    let pos = deck.position();
    if (active && active.video.ended) {
      const next = parts[parts.indexOf(active) + 1];
      if (next) pos = next.startMs;
      else if (playing) { deck.pause(); d.log('the line ran out'); }
    }
    const want = partAt(pos);
    if (want && want !== active) handOver(want, pos);
    if (active && active.video) {
      if (playing && active.video.paused && !active.video.ended) active.video.play().catch(() => {});
      if (!playing && !active.video.paused) active.video.pause();
    }
    inServo = true;
    try { mm.tick(); } finally { inServo = false; }
  }

  // ── the picture of the line ───────────────────────────────────────────────
  const takeLane = {
    id: 'parts', kind: 'part', label: 'takes', height: 52, barPad: 8,
    as: 'spans', stack: false, barGap: 3, terse: true, alpha: 0.9, spanLine: false,
    colorOf: (sp) => ink(sp.row?.payload?.hue ?? 210, 62, 68),
    labelOf: (sp, { bw }) => {
      const p = sp.row?.payload || {};
      return bw > 110 ? `take ${p.n} \u00b7 ${(p.lenMs / 1000).toFixed(2)}s` : `${p.n}`;
    },
    rows: () => shown().map((p) => ({
      at: p.startMs, id: `take${p.n}`, kind: 'part',
      payload: { durMs: p.lenMs, n: p.n, hue: p.hue, lenMs: p.lenMs, kib: Math.round(p.bytes / 1024) },
    })),
    describeRow: (r) => [`${r.payload.kib} KiB`, `${(r.payload.lenMs / 1000).toFixed(2)}s of the line`],
  };
  // NO SLICES LANE. `take` has one because MediaRecorder's timeslice behaviour
  // is part of its subject; here a take is stored as ONE file, so the chunks
  // have no destination of their own and the lane would be drawing an
  // implementation detail beside the two things this page is about — where the
  // picture came from, and whether a seek landed.

  const bar = createTransportBar(d.el, deck, {
    scrub: false,
    extras: [{ id: 'rec', label: '\u25CF', aria: 'Record', primary: true,
               title: `stop when you like \u2014 ${CAP_MS / 1000}s cap`,
               onClick: () => (recording ? stopRecording() : startRecording()) }],
  });
  const view = createStripView(d.el, deck, {
    size: 'auto', follow: false, armWall: false, gutter: 150, wallStyle: 'head',
    lanes: [takeLane],
  });

  function paint() {
    d.set('takes', shown().length || null);
    d.set('line', totalMs ? (totalMs / 1000).toFixed(2) : null);
    view.strip.invalidate();
  }
  setInterval(() => { if (recording) { paint(); view.strip.invalidate(); } }, 40);

  // ── the checks ────────────────────────────────────────────────────────────
  let asserted = false, didClock = false;
  async function runChecks() {
    if (!asserted) {
      asserted = true;
      d.assert('the picture went out and came back', !!pub && !!sub && live.videoWidth > 0,
        live.videoWidth ? `${live.videoWidth}x${live.videoHeight}` : 'no frame');
      d.assert('what was recorded is the RECEIVED track, not the source',
        !!recording || parts.length > 0
          ? sub.pc.getReceivers().some((r) => r.track && sub.inbound.getTracks().includes(r.track))
          : false,
        'by object identity against getReceivers()');
      d.assert('the round trip is a real number, not a guess', legs.length > 0 && median(legs) > 0,
        legs.length ? `${Math.round(median(legs))} ms, n=${legs.length}` : 'nothing read');
      // THE ROW NEEDS FULL RESOLUTION. Cloudflare delivers WHEP at a size it
      // chooses and RAMPS it up — measured here 640x360, then 960x540, then
      // 1280x720 over the first half-minute. The row is drawn on a 1280 grid,
      // so while the picture is smaller its blocks are scaled and unreadable:
      // 0 clean frames at 640, 66 of 163 once it had climbed. That is a real
      // property of this path, not a fault, and the count says which state the
      // page was in rather than hiding it.
      d.assert('the clock survived the round trip', readable > 0,
        `${readable} clean of ${readable + unreadable} read, now ${live.videoWidth}x${live.videoHeight}`);
      d.assert('the format was negotiated, not assumed', !!parts[0]?.mime, parts[0]?.mime || '\u2014');
      d.assert('the take is seekable \u2014 a finite range, not Infinity',
        Number.isFinite(deck.durationMs) && deck.durationMs > 0, `${deck.durationMs} ms`);
      // TWO SLOTS, ALWAYS. `capture` puts its R2 asserts inside `if (useR2)`, so
      // its count changes with the mode — the shape CLAUDE.md bans, and stable
      // only because the suite never sets the flag. These run either way and
      // say which mode they are reporting on.
      const p0 = parts[0];
      d.assert('the upload leg did what the mode asked',
        useR2 ? !!p0?.manifest : !p0?.manifest,
        useR2 ? `R2: ${p0?.manifest ? 'stored' : 'NOT stored'}` : 'off (add ?r2=1)');
      d.assert('playback comes from where the mode says',
        useR2 ? (p0?.from === 'r2' && p0.blobs.length === 0) : p0?.from === 'local',
        `${p0?.from ?? '\u2014'}${useR2 ? `, ${p0?.blobs.length ?? '?'} local copies kept` : ''}`);
    }
    if (parts.length >= 2 && !didClock) { didClock = true; await clockChecks(); }
    else if (parts.length < 2) {
      d.log(`${parts.length} take on the line \u2014 the clock check needs a second one. Press record again.`);
    }
  }

  /**
   * THE CHECK THIS PAGE EXISTS FOR.
   *
   * `take` proves a seek landed by burning the position into a picture it draws
   * itself, which is a page checking its own arithmetic. Here the number was
   * written BEFORE the picture crossed a real network and two encoders, and the
   * receiving side cannot fake it. So: seek to two positions, read the clock out
   * of the pixels at each, and assert it advanced by as much as the playhead did.
   */
  async function clockChecks() {
    d.assert('takes are laid end to end \u2014 no gap, no overlap',
      parts.every((p, i) => (i === 0 ? p.startMs === 0 : p.startMs === parts[i - 1].startMs + parts[i - 1].lenMs)),
      parts.map((p) => `${p.n}@${p.startMs}+${p.lenMs}`).join(' '));
    d.assert('exactly one take is under the playhead',
      parts.filter((p) => deck.position() >= p.startMs && deck.position() < p.startMs + p.lenMs).length === 1,
      `at ${Math.round(deck.position())} ms`);

    const readAt = async (pos) => {
      deck.seek(pos);
      await new Promise((r) => setTimeout(r, 700));
      const p = partAt(pos);
      return p ? readBurnedFrom(p.video, scratch) : null;
    };
    // BOTH PROBES INSIDE ONE TAKE. Across two takes this measures something
    // else entirely and I had it wrong first: the burned clock is wall time, and
    // the line BUTTS TAKES TOGETHER — the seconds between pressing stop and
    // pressing record again are discarded by the line but not by the pixels. The
    // first run read "playhead +3936 ms, picture +11118 ms": a 7.2 s gap
    // faithfully recorded and correctly thrown away. Within one take there is no
    // gap to confuse it with, so the comparison is clean.
    const long = parts.reduce((a, b) => (b.lenMs > a.lenMs ? b : a));
    const p1 = Math.round(long.startMs + long.lenMs * 0.2);
    const p2 = Math.round(long.startMs + long.lenMs * 0.75);
    const e1 = await readAt(p1), e2 = await readAt(p2);
    if (e1 === null || e2 === null) {
      d.assert('the clock in the picture moved with the playhead', false,
        `could not read the row back at ${e1 === null ? p1 : p2} ms`);
      return;
    }
    const err = (e2 - e1) - (p2 - p1);
    d.set('drift', Math.round(err));
    d.assert('the clock in the picture moved with the playhead',
      Math.abs(err) <= FRAME_MS * 3,
      `playhead +${p2 - p1} ms, picture +${e2 - e1} ms, ${err >= 0 ? '+' : ''}${Math.round(err)} ms apart`);

    // AND THE GAP THE LINE THREW AWAY IS STILL IN THE PIXELS. Reading the last
    // frame of one take against the first of the next recovers the wall-clock
    // pause between them — the thing an end-to-end line cannot show. Reported,
    // not asserted: it depends on how long a person waited.
    if (parts.length >= 2) {
      const endOf1 = await readAt(Math.round(parts[0].startMs + parts[0].lenMs - 200));
      const startOf2 = await readAt(Math.round(parts[1].startMs + 120));
      if (endOf1 !== null && startOf2 !== null) {
        d.log(`the pause between take 1 and take 2 was ${((startOf2 - endOf1) / 1000).toFixed(2)}s `
          + `— the line does not show it, the pixels still do`, 'hi');
      }
    }
  }

  // ── pick up where the last tab left off ───────────────────────────────────
  async function restore() {
    const saved = remembered();
    if (!saved.length) return;
    // WHAT THIS LIST IS, said plainly: a note this browser made to itself. It is
    // not an index — another device sees nothing, and Safari clears it after a
    // week without a visit, so the note can die while the file it points at is
    // still there. The six-hour TTL is what keeps that from mattering here.
    d.log(`${saved.length} recording${saved.length > 1 ? 's' : ''} still in R2 — fetching them back. `
      + `This list is a note THIS BROWSER made; another device would see none of them`, 'hi');
    for (const t of saved) {
      const blob = await fetchBack(t.url, t.mime, { log: (m, k) => d.log(m, k) });
      if (!blob) continue;
      const part = { n: parts.length + 1, hue: videoHue(parts.length), mime: t.mime,
                     blobs: [], chunks: [], bytes: blob.size, startMs: totalMs,
                     lenMs: null, video: null, manifest: t.url, expiresAt: t.expiresAt, from: 'r2' };
      part.url = URL.createObjectURL(blob);
      const v = el('video', '', null, { playsinline: '', muted: '' });
      v.muted = true; v.hidden = true;
      armVideo(v); v.autoplay = false; v.src = part.url;
      seq.append(v); part.video = v;
      part.lenMs = Math.round((await resolveDuration(v)) ?? 0);
      if (!part.lenMs) continue;
      part.startMs = totalMs; totalMs += part.lenMs;
      parts.push(part);
      deck.setRange([0, Math.round(totalMs)]);
      if (!active) handOver(part, 0);
      if (!rafOn) { rafOn = true; (function loop() { requestAnimationFrame(loop); tick(); })(); }
      const mins = Math.round((new Date(t.expiresAt) - Date.now()) / 60000);
      d.log(`take ${part.n} back from R2, ${(part.lenMs / 1000).toFixed(2)}s \u00b7 `
        + `${Math.floor(mins / 60)}h ${mins % 60}m left`, 'hi');
    }
    paint();
  }
  if (useR2) restore();

  d.ready();
</script>
</html>
