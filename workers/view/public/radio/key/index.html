<style>
  .cc-say { font-size: 12px; color: var(--dim); }
  /* A footer line never wraps: one line, cut at the slot's edge. */
  .pos-vp-foot .cc-say { white-space: nowrap; overflow: hidden; }
  /* The kit's live wave (grain-scope) as a panel's picture, as /radio/blend/
     draws it: the panel's stage is the edge and the ground, so the scope gives up
     its own margin, border and corner, and its always-empty caption takes no room. */
  .cc-wave .pos-scope { margin: 0; --edge: 0px; --r: 0px; }
  .cc-wave .pos-scope-gut { display: none; }
  /* The keyboard sits in the panel's stage, so the panel is its box: the
     keyboard's own border, ground and margins come off, and so does the gap
     its pad row would have needed (this keyboard has no pad row). */
  .cc-kb-host .kbd { border: 0; background: transparent; margin: 0; }
  .cc-kb-host .kbd .keys { margin-bottom: 0; }
  /* The key's notes are rings, the kit's `ai` lamp, in the accent rather than
     the proposal lilac (asked: *"suggested cricles are yellow"*): a ring is a
     note you could play, and playing it fills it. */
  /* asked *"nonyellow circle borders: even grayer"* */
  .cc-kb-host .k.ai .kd::after { box-shadow: inset 0 0 0 1px #4a5568; }
  /* Asked: *"only circles that autoplay plays are yellow-bordered. when on
     autoplay keep thay hellow. others grayer"*. The rest of the key's notes
     stay grey rings; the notes of the chord autoplay is holding are yellow
     rings for as long as the chord lasts. Since 2026-10-13 the chord is
     voiced to move least, so the rings are the exact notes the pad plays, not
     the chord's letters in every octave. */
  .cc-kb-host .k.ai.cc-auto .kd::after { box-shadow: inset 0 0 0 1px var(--hi); }
  /* The footer's labels in the kit's form label style, `.pos-field-l`'s
     declarations (asked: *"use std form label styling"*). */
  .cc-keyfoot .pos-vp-k {
    font: 500 9.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase;
    color: var(--dim2); white-space: nowrap;
  }
  /* Play on its own row: the button's own size, at the left. */
  .cc-top { display: flex; }
  .cc-top > .pos-bgroup { flex: none; width: auto; }
</style>
<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createGrainScope } from '/shell/grain-scope.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { createMp3Stream } from '/shell/mp3-stream.mjs';
  import { createKeyboard, keyRange } from '/shell/keyboard.mjs';
  import { createCheck } from '/shell/check.mjs';
  import { createKnob } from '/shell/knob.mjs';
  import { createKnobGrid } from '/shell/knob-grid.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { chooseChord, voiceLead, chromaEase } from './autoplay.mjs';

  // concepts radio/040, KEY, 2026-10-11. /radio/live/ with the tempo
  // detector swapped for a key detector. Asked: *"010 key dertect, live
  // stations"*. The live source, the level, the wave, the speakers and the
  // patchbay are radio/030's, line for line. One idea per page, so what was
  // about tempo went: the tempo detector, the beat lines over the wave, the
  // tempo scope, and the fx box with its mix knob and click (that box was
  // driven by the tempo, so with no tempo it had nothing to do).
  //
  // The station plays LIVE through our own relay (`cf-shout`, the
  // positron-shout worker, which holds ONE upstream connection per mount
  // however many tabs listen), read with the kit's createMp3Stream exactly as
  // /radio/blend/ reads it. `?base=` points the page at
  // demo/fake-station.mjs instead.
  //
  // 🔴 NOTHING OPENS ON A VISIT, AND ONE STATION AT A TIME. Every connection to
  // an ERR mount is counted in a public broadcaster's listener statistics
  // (CLAUDE.md, "What costs real money and somebody else's server"), so a
  // stream is opened only on Play, closed on Stop, and closed BEFORE the next
  // one opens when the station is switched while playing. Under ?selfcheck=1 the
  // page never opens a stream at all: Play logs that a check is running and
  // plays nothing.
  //
  // Ida is ADTS AAC, the two ERR mounts MP3. createMp3Stream reads both.
  const BASE = new URLSearchParams(location.search).get('base') || 'https://shout.positron.studio';
  const STATIONS = [
    { id: 'raadio2', label: 'Raadio 2', site: 'err', node: 'raadio2', mount: 'raadio2', name: 'ERR Raadio 2' },
    { id: 'raadio4', label: 'Raadio 4', site: 'err', node: 'raadio4', mount: 'raadio4', name: 'ERR Raadio 4' },
    { id: 'ida', label: 'Ida', site: 'ida', node: 'tallinn', mount: 'ida-tallinn', name: 'Ida Radio Tallinn' },
  ];
  const srcOf = (st) => `${BASE}/${st.mount}`;
  let at = 0;
  const S = 'web';
  const STATION_OUT = (st) => `${st.site}:${st.node}:audio-out`;
  const RELAY_IN = (st) => `cf-shout:${st.mount}:audio-in`, RELAY_OUT = (st) => `cf-shout:${st.mount}:audio-out`;
  const PLAYER_IN = `${S}:level:audio-in`, PLAYER_OUT = `${S}:level:audio-out`;
  const WAVE_IN = `${S}:wave:audio-in`, SPEAKER_IN = `${S}:speaker:audio-in`;
  const KEY_IN = `${S}:key:audio-in`, KEY_EV = `${S}:key:value-out`;
  // The on-screen keyboard is ONE node: what you play leaves on its midi-out,
  // and everything it shows arrives on its ins (the key on value-in, the chord
  // autoplay holds or would play on value-in-2, the notes sounding on midi-in).
  const DISPLAY_IN = `${S}:keys:value-in`, KEYS_CHORD = `${S}:keys:value-in-2`, KEYS_LIGHTS = `${S}:keys:midi-in`;
  const AUTO_CHORD = `${S}:autoplay:value-out`, PAD_NOTES = `${S}:pad:midi-out`;
  const AUTO_BASS = `${S}:autoplay:midi-out-2`, BASS_IN = `${S}:bass:midi-in`, BASS_OUT = `${S}:bass:audio-out`;
  const KEYS_OUT = `${S}:keys:midi-out`, AUTO_OUT = `${S}:autoplay:midi-out`, AUTO_KEY = `${S}:autoplay:value-in`;
  const PAD_IN = `${S}:pad:midi-in`, PAD_OUT = `${S}:pad:audio-out`, PAD_LEVEL = `${S}:pad:value-in`;
  const ENERGY_OUT = `${S}:level:value-out`;
  const MIXER_DRY = `${S}:mixer:audio-in`, MIXER_WET = `${S}:mixer:audio-in-2`, MIXER_MIX = `${S}:mixer:value-in`, MIXER_OUT = `${S}:mixer:audio-out`;
  const KNOB_MIX = `${S}:knob-mix:value-out`;

  // ── the bay ─────────────────────────────────────────────────────────────
  // A live station is AUDIO all the way: the station's site into the relay,
  // the relay into the level node in this tab, and the level node's
  // `audio-out` feeds the wave, the speakers and the key detector. The key
  // detector's readings leave on a value port for the keyboard.
  const bay = createBay();
  for (const st of STATIONS) {
    bay.addNode({ id: `${st.site}:${st.node}`, kind: 'external', label: st.name, place: st.site, net: st.site });
    bay.addPort({ id: STATION_OUT(st), label: st.label, dir: 'out', medium: 'audio', transports: ['https'] });
    bay.addNode({ id: `cf-shout:${st.mount}`, kind: 'endpoint', label: 'relay', place: 'cf-shout' });
    bay.addPort({ id: RELAY_IN(st), label: 'relay', dir: 'in', medium: 'audio', transports: ['https'] });
    bay.addPort({ id: RELAY_OUT(st), label: 'relay', dir: 'out', medium: 'audio', transports: ['https'], address: srcOf(st) });
  }
  bay.addNode({ id: `${S}:level`, kind: 'engine', label: 'level', place: 'browser' });
  bay.addPort({ id: PLAYER_IN, label: 'level', dir: 'in', medium: 'audio' });
  bay.addPort({ id: PLAYER_OUT, label: 'level', dir: 'out', medium: 'audio' });
  // The station's rough energy, its loudness after levelling, eased, as a value.
  bay.addPort({ id: ENERGY_OUT, label: 'energy', dir: 'out', medium: 'value' });
  bay.addNode({ id: `${S}:wave`, kind: 'screen', label: 'wave', place: 'browser' });
  bay.addPort({ id: WAVE_IN, label: 'wave', dir: 'in', medium: 'audio' });
  bay.addNode({ id: `${S}:key`, kind: 'engine', label: 'key detector', place: 'browser' });
  bay.addPort({ id: KEY_IN, label: 'key detector', dir: 'in', medium: 'audio' });
  bay.addPort({ id: KEY_EV, label: 'key', dir: 'out', medium: 'value' });
  // The keyboard. Nothing paints it but what is delivered on its ins: the
  // detector never touches it, nor does the pad or autoplay.
  bay.addNode({ id: `${S}:keys`, kind: 'person', label: 'keyboard', place: 'browser' });
  bay.addPort({ id: KEYS_OUT, label: 'keys', dir: 'out', medium: 'midi', emits: ['note'] });
  bay.addPort({ id: DISPLAY_IN, label: 'key', dir: 'in', medium: 'value', deliver: (ev) => shown(ev) });
  bay.addPort({ id: KEYS_CHORD, label: 'chord', dir: 'in', medium: 'value', deliver: (ev) => { if (ev?.of === 'param' && ev.name === 'chord') autoMark(ev.notes || []); } });
  bay.addPort({ id: KEYS_LIGHTS, label: 'lights', dir: 'in', medium: 'midi', accepts: ['note'], deliver: (ev) => { if (ev?.cls === 'note') kb.lightNote(ev.d1, ev.d2 > 0); } });
  bay.addNode({ id: `${S}:autoplay`, kind: 'engine', label: 'autoplay', place: 'browser' });
  // Autoplay knows the key only from what arrives on its value-in, the key
  // detector's readings on a link of their own.
  bay.addPort({ id: AUTO_KEY, label: 'key', dir: 'in', medium: 'value', deliver: (ev) => autoKey(ev) });
  bay.addPort({ id: AUTO_OUT, label: 'autoplay', dir: 'out', medium: 'midi', emits: ['note', 'cc'] });
  bay.addPort({ id: AUTO_CHORD, label: 'chord', dir: 'out', medium: 'value' });
  // The chord's root, on a port of its own, for the bass.
  bay.addPort({ id: AUTO_BASS, label: 'bass', dir: 'out', medium: 'midi', emits: ['note', 'cc'] });
  bay.addNode({ id: `${S}:bass`, kind: 'engine', label: 'bass', place: 'browser' });
  bay.addPort({ id: BASS_IN, label: 'bass', dir: 'in', medium: 'midi', accepts: ['note', 'cc'], deliver: (ev) => bassEvent(ev) });
  bay.addPort({ id: BASS_OUT, label: 'bass', dir: 'out', medium: 'audio' });
  bay.addNode({ id: `${S}:pad`, kind: 'engine', label: 'pad synth', place: 'browser' });
  bay.addPort({ id: PAD_IN, label: 'pad synth', dir: 'in', medium: 'midi', accepts: ['note', 'cc'], deliver: (ev) => padEvent(ev) });
  // What the pad is sounding, every note on and off, for whoever shows it.
  bay.addPort({ id: PAD_NOTES, label: 'sounding', dir: 'out', medium: 'midi', emits: ['note'] });
  bay.addPort({ id: PAD_OUT, label: 'pad synth', dir: 'out', medium: 'audio' });
  bay.addPort({ id: PAD_LEVEL, label: 'level', dir: 'in', medium: 'value', deliver: (ev) => padLevel(ev) });
  // Wet and dry: the station is dry, the pad is wet, one knob between them.
  bay.addNode({ id: `${S}:mixer`, kind: 'engine', label: 'wet / dry', place: 'browser' });
  bay.addPort({ id: MIXER_DRY, label: 'dry', dir: 'in', medium: 'audio' });
  bay.addPort({ id: MIXER_WET, label: 'wet', dir: 'in', medium: 'audio' });
  bay.addPort({ id: MIXER_MIX, label: 'mix', dir: 'in', medium: 'value', deliver: (ev) => mixSet(ev) });
  bay.addPort({ id: MIXER_OUT, label: 'wet / dry', dir: 'out', medium: 'audio' });
  bay.addNode({ id: `${S}:knob-mix`, kind: 'engine', label: 'mix knob', place: 'browser' });
  bay.addPort({ id: KNOB_MIX, label: 'mix', dir: 'out', medium: 'value' });
  bay.addNode({ id: `${S}:speaker`, kind: 'screen', label: 'speakers', place: 'browser' });
  bay.addPort({ id: SPEAKER_IN, label: 'speakers', dir: 'in', medium: 'audio' });

  const d = mount({ name: 'Live key', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('radio/key');

  // ── the links, held from load so the picture does not change with play ────
  // Holding a link opens nothing. A link out of an `external` node is refused
  // without `consent: true`, and the consent is the Play press, the moment a
  // person asks to listen, so it is named here where the link is made, as on
  // /radio/blend/.
  const held = new Map();
  function hold(a, b, opts, transforms = []) {
    const k = `${a} ${b} ${JSON.stringify(transforms)}`;
    if (held.has(k)) return;
    bay.seen(a); bay.seen(b);
    const r = bay.link(a, b, transforms, { site: S, ...opts });
    if (r.ok) held.set(k, r.id); else d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
  }
  // The sound follows the links the bay holds, read off `bay.links()`.
  const holds = (a, b) => bay.links().some((l) => l.from === a && l.to === b);
  for (const st of STATIONS) {
    hold(STATION_OUT(st), RELAY_IN(st), { consent: true, via: 'https' });
    hold(RELAY_OUT(st), PLAYER_IN, { via: 'https' });
  }
  hold(PLAYER_OUT, WAVE_IN);
  hold(PLAYER_OUT, KEY_IN);
  hold(PLAYER_OUT, MIXER_DRY);
  hold(KEY_EV, DISPLAY_IN);
  hold(AUTO_CHORD, KEYS_CHORD);
  hold(PAD_NOTES, KEYS_LIGHTS);
  hold(KEY_EV, AUTO_KEY);
  hold(KEYS_OUT, PAD_IN);
  // Autoplay's chord to the pad, its root to the bass. The octave up and
  // octave down links that were here went 2026-10-11 (*"radio 040 sound is
  // still orgaby and lame"*): a chord stacked in three octaves on bright saws
  // is an organ registration, and it filled every band the radio needs.
  hold(AUTO_OUT, PAD_IN);
  hold(AUTO_BASS, BASS_IN);
  hold(BASS_OUT, MIXER_WET);
  hold(ENERGY_OUT, PAD_LEVEL);
  hold(PAD_OUT, MIXER_WET);
  hold(KNOB_MIX, MIXER_MIX);
  hold(MIXER_OUT, SPEAKER_IN);

  // ── the sound ───────────────────────────────────────────────────────────
  let ctx = null, pull = null, out = null, tap = null, tapBuf = null;
  // The one open stream, or null: { st, stream, live }. Never two.
  let leg = null, playing = false;

  const pb = createPatchbay(bay, {
    flowing: (l, medium) => {
      if (medium !== 'audio') return false;
      const live = playing && !!leg?.live;
      const st = STATIONS.find((s) => l.from === STATION_OUT(s) || l.from === RELAY_OUT(s));
      if (st) return live && leg.st === st;
      return live;
    },
  });

  // ── the pictures ────────────────────────────────────────────────────────
  const waveHost = el('div', 'cc-wave');
  const scope = createGrainScope(waveHost, { seconds: 4, height: 150, fullScale: 1 });
  // The station, the kit picker in the wave panel's footer. Choosing one while
  // playing CLOSES the old station's stream first and only then opens the new
  // one, and starts a fresh key reading. Choosing while stopped opens nothing.
  const pick = createPicker({ what: 'station', prev: () => choose(at - 1), next: () => choose(at + 1), onPick: (i) => choose(i) });
  pick.options(STATIONS.map((st) => st.label), 0);
  function choose(i) {
    const n = (i + STATIONS.length) % STATIONS.length;
    if (n === at) return;
    at = n;
    pick.show(STATIONS[at].label, at);
    pb.refresh();
    if (playing) { stop(); play(); }
  }
  const wavePanel = createVideoPanel({ media: waveHost, aspect: 'auto', right: false, left: pick.el });

  // The key on the kit keyboard, two octaves from C3, which fill the panel
  // without stretching a key. The seven notes of the detected key are grey
  // rings, the chord autoplay plays (or would play) yellow ones; a note that
  // sounds, from a finger or from autoplay, fills its ring in the accent.
  const KB_BASE = 48, KB_SPAN = 23;
  const kbHost = el('div', 'cc-kb-host');
  const kb = createKeyboard(kbHost, { ...keyRange(KB_SPAN), base: KB_BASE, letters: false, pad: false, chord: false, full: true,
    onDown: (note) => bay.send(KEYS_OUT, { cls: 'note', ch: 1, d1: note, d2: 90 }),
    onUp: (note) => bay.send(KEYS_OUT, { cls: 'note', ch: 1, d1: note, d2: 0 }) });
  let lit = [];                    // [note, who] currently painted
  function paintKey(r) {
    for (const [n, who] of lit) kb.lightNote(n, false, who);
    lit = [];
    if (!r || r.tonic == null || !KEY_SCALE[r.mode]) return;
    for (let n = KB_BASE; n <= KB_BASE + KB_SPAN; n++) {
      const deg = (n - r.tonic + 120) % 12;
      if (!KEY_SCALE[r.mode].includes(deg)) continue;
      // Rings only: a filled dot means a note is sounding, from a finger or
      // from autoplay, and nothing else (asked: *"inner circles only appear
      // when auto or manual play"*), so the home note carries no dot of its own.
      kb.lightNote(n, true, 'ai'); lit.push([n, 'ai']);
    }
  }
  const auto = createCheck({ label: 'Autoplay', title: 'chords in the detected key on the pad synth', onChange: (on) => autoSet(on) });
  const keyPanel = createVideoPanel({ media: kbHost, aspect: 'auto', left: false, right: auto.el,
    values: [{ key: 'key', label: 'key', reserve: 8 }, { key: 'conf', label: 'confidence', reserve: 4 }, { key: 'also', label: 'also', reserve: 18 }] });
  keyPanel.el.classList.add('cc-keyfoot');

  // ── the pad synth and the bass ──────────────────────────────────────────
  // Asked: *"pad is very churchlike and eats so many fequencyies and sounds
  // lame. perhaps bassy + paddy"*, then *"still orgaby and lame"*. So two
  // voices. The PAD is five saws spread across the stereo field a few cents
  // apart, through a low lowpass that drifts slowly (one shared LFO), with a
  // slow swell and a long release; the whole pad is high passed so it leaves
  // the bottom to the bass, and a generated room reverb sits behind it. The
  // BASS is the chord's root an octave under the pad: a sine with a triangle
  // an octave above it for small speakers, short attack, darker filter.
  // Then *"its also slow to react, old chords stay"*: a 3 s release and a full
  // reverb let each chord bleed under the next, so 0.5 s in, 1 s out, less room.
  const PAD = { attack: 0.5, release: 1, cutoff: 900, sweep: 450, lfoHz: 0.12, hp: 180, level: 0.12, reverb: 0.3 };
  const BASS = { attack: 0.06, release: 0.8, cutoff: 420, level: 0.35 };
  let padBus = null, padOut = null, padLfo = null, bassBus = null, dryG = null, wetG = null, mixOut = null, mix = 0.5, energy = null;
  const voices = new Map();
  function sound() {
    ctx ??= new AudioContext();
    ctx.resume();
    if (!mixOut) {
      mixOut = ctx.createGain(); dryG = ctx.createGain(); wetG = ctx.createGain();
      dryG.connect(mixOut); wetG.connect(mixOut);
      if (holds(MIXER_OUT, SPEAKER_IN)) mixOut.connect(ctx.destination);
      mixApply();
    }
    if (!padBus) {
      padBus = ctx.createGain(); padBus.gain.value = PAD.level;
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = PAD.hp; hp.Q.value = 0.5;
      const conv = ctx.createConvolver(); conv.buffer = roomImpulse(1.6);
      const rev = ctx.createGain(); rev.gain.value = PAD.reverb;
      padOut = ctx.createGain();
      padBus.connect(hp); hp.connect(padOut); hp.connect(conv); conv.connect(rev); rev.connect(padOut);
      // one slow LFO for every pad voice's filter, so the pad breathes together
      const lfo = ctx.createOscillator(); lfo.frequency.value = PAD.lfoHz;
      padLfo = ctx.createGain(); padLfo.gain.value = PAD.sweep;
      lfo.connect(padLfo); lfo.start();
      bassBus = ctx.createGain(); bassBus.gain.value = BASS.level;
      padRoute();
    }
    return ctx;
  }
  function padRoute() {
    if (!padOut) return;
    try { padOut.disconnect(); } catch { /* not connected */ }
    try { bassBus.disconnect(); } catch { /* not connected */ }
    if (holds(PAD_OUT, MIXER_WET)) padOut.connect(wetG);
    if (holds(BASS_OUT, MIXER_WET)) bassBus.connect(wetG);
  }
  /** A room: two channels of noise falling away exponentially over `sec`. */
  function roomImpulse(sec) {
    const n = Math.round(ctx.sampleRate * sec), buf = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const x = buf.getChannelData(c);
      for (let i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    }
    return buf;
  }
  // Equal power: the dry side is cos, the wet side sin, of the knob's quarter
  // turn, so the middle is neither louder nor quieter than the ends. The wet
  // side is lifted by WET_TRIM because the pad is a quiet voice beside a
  // levelled station.
  const WET_TRIM = 2.5;
  function mixApply() {
    if (!dryG) return;
    const t = ctx.currentTime, a = mix * Math.PI / 2;
    dryG.gain.setTargetAtTime(Math.cos(a), t, 0.02);
    wetG.gain.setTargetAtTime(Math.sin(a) * WET_TRIM, t, 0.02);
  }
  function mixSet(ev) {
    if (ev?.of !== 'param' || !Number.isFinite(ev.v)) return;
    mix = Math.max(0, Math.min(1, ev.v));
    mixApply();
  }
  // The pad's level follows the station's energy as it arrives on its
  // value-in: about the pad's own level at the station's ordinary loudness,
  // down to a fifth in the quiet and up to one and a half times on the loud.
  // With no station playing, nothing arrives and the pad sits at its own level.
  function padLevel(ev) {
    if (ev?.of !== 'param') return;
    energy = Number.isFinite(ev.v) ? ev.v : null;
    if (!padBus) return;
    const k = energy == null ? 1 : Math.max(0.2, Math.min(1.5, 0.2 + 0.8 * energy ** 1.5));
    padBus.gain.setTargetAtTime(PAD.level * k, ctx.currentTime, 0.05);
  }
  // Each MIDI channel has its own level, set by CC 11 (expression) on that
  // channel: the keys play on channel 1 and are never turned down, autoplay

  // ── autoplay ────────────────────────────────────────────────────────────
  // While ticked, the pad plays a chord of the key the footer names every
  // AUTO_S seconds, and at once when the key changes; it waits silently while
  // there is no key yet. Until 2026-10-13 that was a fixed I vi IV V loop in
  // root position, restarting on I at every key change, and the owner's word
  // for it was *"it feels repeating same chords all the time"*. Now (both
  // halves are pure functions in ./autoplay.mjs, graded by autoplay-test.mjs):
  // 1. The chord follows the radio: of the key's seven triads, the one whose
  //    notes hold most of what the station sounded over the last CHORD_TAU_S
  //    seconds, with a small lean to I, IV, V and vi and a small cost for
  //    repeating the chord sounding. That chroma is the detector's half second
  //    picture, arriving on autoplay's value-in with the key, eased here; the
  //    detector's 30 s sum is for the key and is not used for the chord. When
  //    the key's confidence is low or the chroma is flat, it walks I IV V vi.
  // 2. Each chord is voiced as the inversion inside PAD_LO..PAD_HI that moves
  //    the three voices least from the chord before, so shared notes hold.
  //    The bass keeps the chord's root, as before.
  // Bar lines from a tempo detector are a later step; AUTO_S stays.
  const AUTO_S = 4, AUTO_CH = 2, CHORD_TAU_S = 3;

  const PAD_LO = 52, PAD_HI = 71, PAD_HOME = 60;
  const PAD_RANGE = { lo: PAD_LO, hi: PAD_HI, home: PAD_HOME };

  // ineria not to be annoying"*. Autoplay's loudness is CC 11 on its own
  // channel, a level and not a velocity, so a chord already sounding swells
  // and fades with it. The target is silent at AUTO_CONF_LO and below and full
  // at AUTO_CONF_HI, and the level eases toward it with a time constant of
  // AUTO_TAU_S, so a confidence that flickers moves it hardly at all and a

  const AUTO_CONF_LO = 0.05, AUTO_CONF_HI = 0.35, AUTO_TAU_S = 3, AUTO_EXPR_MS = 100;

  }

  // seconds of pitch classes.
  let autoStep = null, autoVoiced = null, autoHow = null, autoChroma = new Array(12).fill(0), autoChromaAt = null;

  const PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const keyEls = new Map();
  for (const k of kbHost.querySelectorAll('.k')) {
    const m = /^([A-G])(♯|#)?(-?\d+)$/.exec(k.querySelector('.kn')?.textContent.trim() || '');

  // ── the key detector ────────────────────────────────────────────────────
  // An AnalyserNode on the levelled sound, read every KEY_HOP_S on the main
  // thread. Its spectrum is folded into twelve pitch classes (a chromagram),
  // those are summed with a decay of KEY_TAU_S, and the sum is matched against
  // the 24 major and minor key profiles. Everything between the markers below
  // is plain arithmetic on the analyser's dB spectrum, no WebAudio, so the
  // offline check reads this very block out of this file and runs it on our
  // R2 recordings and on synthetic music of known key (plans/plan-key-
  // detection.md has the method, the sources and every candidate measured).
  //
  // 1. Peaks only. Every local maximum of the spectrum between 55 Hz and 2 kHz

  //    weight is its height above that floor in dB, which is the compression

  //    semitones counts for nothing.
  // 3. Harmonics. A peak 19 semitones (a twelfth, the third harmonic) or 28
  //    (the fifth harmonic) over a louder one counts for 30%.
  // 4. Each frame is normalised to sum 1, so a loud moment and a quiet one
  //    count alike, then summed into `acc` with a decay of 30 s (and into
  //    `now`, the picture, over half a second).
  // 5. The 24 keys are the Temperley (Kostka-Payne) profiles rotated to each
  //    tonic, scored by correlation with `acc`. The best is the key; a key

  //
  // 🔴 WHY TEMPERLEY AND WHY THE HARMONICS STEP, MEASURED 2026-10-11 OFFLINE on
  // our three R2 recordings of the day (about three minutes each). There is NO
  // ground truth: nobody has said what key any of it is in. With Krumhansl-
  // Kessler profiles and no harmonics step the detector read every recording a
  // FIFTH ABOVE what Temperley read (Raadio 2 Bb minor against Eb minor, Raadio
  // 4 Ab minor against E major), on 89% and 80% of readings. A fifth up is
  // where a note's third harmonic lands, so the harmonics step went in, and
  // with it the two profile sets mostly AGREE: same key on 72% (Raadio 2), 76%
  // (Raadio 4) and 77% (Ida) of readings. Temperley was the steadier of the two
  // (switches after the first 15 s: 2, 1 and 0 against 9, 1 and 6), so it is
  // the one used. A 32768 point analyser (0.7 s, 1.4 Hz bins) was steadier than
  // 16384 on Raadio 4, and 20 s of decay steadier than 10 on Raadio 4 and Ida.
  //
  // 🔴 WHY THE FADE AT THE BAND EDGES, MEASURED 2026-10-11 OFFLINE, LATER THE
  // SAME DAY, against two things that need no listener. (a) 72 synthetic
  // pieces of 40 s in all 24 keys (piano and saw chords, bass, melody, drums,
  // tuned up to 30 cents off), scored MIREX style (right 1, fifth 0.5,
  // relative 0.3, parallel 0.2). (b) Each R2 recording pitch shifted by -5 to
  // +6 semitones: the answer should move by exactly the shift, and how often
  // it does is a number with no ground truth in it. Before, with a hard edge
  // at 55 Hz and 2 kHz, a 50 dB floor, 20 s of decay and a 0.02 stickiness:
  // synthetic 0.73 (48 pieces) and 0.56 (24 held out), the shifted recordings
  // agreed 35% (Raadio 2), 63% (Raadio 4) and 72% (Ida) of the time, mostly
  // by jumping a FIFTH as bass notes and their harmonics crossed an edge.

  // 0.65, shifted 82%, 99% and 98%, switches after 15 s 2, 0 and 0 against 2,

  // 15 of 48 pieces, all minor read as their relative major. Twelve are
  // progressions that never raise the seventh (i VI III VII, i iv VII III),

  // KEY CORE BEGIN
  const KEY_NAMES = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
  const KEY_PROFILES = {
    kk: { major: [6.35, 2.23, 3.48, 2.33, 4.38, 4.09, 2.52, 5.19, 2.39, 3.66, 2.29, 2.88],

    for (let k = k0 + 1; k < k1; k++) {

    for (const mode of ['major', 'minor']) for (let t = 0; t < 12; t++) all.push({ tonic: t, mode, r: keyCorr(s.acc, s.profiles[mode], t) });
    all.sort((a, b) => b.r - a.r);
    // The key shown last stays until another beats it by `stick`.
    if (s.last && s.stick) {
      const i = all.findIndex((k) => k.tonic === s.last.tonic && k.mode === s.last.mode);
      if (i > 0 && all[0].r - all[i].r < s.stick) all.unshift(...all.splice(i, 1));
    }
    const best = all[0], next = all[1];
    s.last = best;
    const conf = Math.max(0, Math.min(1, best.r)) * Math.max(0, Math.min(1, (best.r - next.r) / 0.1));
    const name = (k) => `${KEY_NAMES[k.tonic]} ${k.mode}`;
    return { key: name(best), tonic: best.tonic, mode: best.mode, r: best.r, confidence: conf,
      also: all.slice(1, 4).map((k) => ({ key: name(k), r: k.r })), tuning: s.tuning };
  }
  // KEY CORE END

  const KEY_FFT = 32768, KEY_HOP_S = 0.1, KEY_READ_S = 0.5;
  let key = null;                  // { an, db, s, clock, nextRead, last, timer }
  function keyBuild() {
    const an = ctx.createAnalyser();
    an.fftSize = KEY_FFT; an.smoothingTimeConstant = 0;
    an.connect(pull);              // pulled, or it is never run
    return { an, db: new Float32Array(KEY_FFT / 2) };
  }
  // A fresh reading every play: a new sum, so the key is this listen's.
  function keyStart() {
    clearInterval(key.timer);
    key.s = keyCreate(ctx.sampleRate, KEY_FFT);
    key.clock = null; key.nextRead = KEY_READ_S; key.last = null; key.sound = 0;
    // Timed on the audio clock, so a throttled tab changes how often a frame
    // is read and never how fast the sum decays.
    key.timer = setInterval(() => {
      if (!playing || !leg?.live) { key.clock = null; return; }
      const now = ctx.currentTime;
      if (key.clock == null) { key.clock = now; return; }
      const dt = Math.min(1, now - key.clock);
      key.clock = now;
      if (dt <= 0) return;
      key.an.getFloatFrequencyData(key.db);
      keyFrame(key.s, key.db, dt);
      key.sound += dt;
      if (key.sound >= key.nextRead) { key.nextRead += KEY_READ_S; key.last = keyRead(key.s); }
      const r = key.last;
      bay.send(KEY_EV, { of: 'param', name: 'key', v: r?.key ?? null, tonic: r?.tonic ?? null, mode: r?.mode ?? null,
        confidence: r ? Math.round(r.confidence * 100) / 100 : null,
        also: r ? r.also.map((k) => ({ key: k.key, r: Math.round(k.r * 100) / 100 })) : [],
        tuning: Math.round(key.s.tuning * 100), chroma: [...key.s.now].map((v) => Math.round(v * 1000) / 1000) });
    }, KEY_HOP_S * 1000);
  }


  function frame() {
    if (!playing) return;
    if (holds(PLAYER_OUT, WAVE_IN)) { tap.getFloatTimeDomainData(tapBuf); scope.feed(tapBuf, ctx.sampleRate); }
    requestAnimationFrame(frame);
  }

  // ── the level: one gain per station, from a running RMS ──────────────────
  // radio/030's, unchanged. The stream's RMS BEFORE the gain, read every
  // LEVEL_READ_MS, followed slowly (LEVEL_SLOW_S) and fast (LEVEL_FAST_S); the
  // louder sets the target LEVEL_RMS / rms, raise only, at most LEVEL_MAX (36
  // dB). Down fast, up slow, held under LEVEL_FLOOR, a limiter after the gain.
  // MEASURED on the captures: Ida is music at about -44 dB RMS for most of its
  // length with one 25 s stretch at -14 dB, so the gain has to reach about 28
  // to 30 dB and come down within a fraction of a second. The key detector
  // hears the levelled sound, though with every frame normalised it cares
  // about the spectrum's shape over the floor, not its loudness.
  const LEVEL_RMS = 10 ** (-16 / 20), LEVEL_MAX = 10 ** (36 / 20), LEVEL_FLOOR = 10 ** (-60 / 20);
  const LEVEL_READ_MS = 100, LEVEL_SLOW_S = 3, LEVEL_FAST_S = 0.3, LEVEL_DOWN_S = 0.08, LEVEL_UP_S = 1.5;
  const levels = new Map();        // station id -> its gain, kept across plays
  let lv = null;                   // { meter, buf, gain, limit, slow, fast, g, timer }
  function levelBuild() {
    lv = { meter: ctx.createAnalyser(), gain: ctx.createGain(), limit: ctx.createDynamicsCompressor(), slow: 0, fast: 0, g: 1, timer: 0 };
    lv.meter.fftSize = 4096; lv.meter.smoothingTimeConstant = 0;
    lv.buf = new Float32Array(lv.meter.fftSize);
    lv.meter.connect(pull);          // pulled, or it is never run
    const c = lv.limit;
    c.threshold.value = -3; c.knee.value = 3; c.ratio.value = 20; c.attack.value = 0.002; c.release.value = 0.15;
    lv.gain.connect(c).connect(out);
  }
  function levelStart(st, node) {
    lv.g = levels.get(st.id) ?? 1;
    lv.slow = 0; lv.fast = 0;
    lv.gain.gain.cancelScheduledValues(ctx.currentTime);
    lv.gain.gain.setValueAtTime(lv.g, ctx.currentTime);
    node.connect(lv.meter);
    node.connect(lv.gain);
    clearInterval(lv.timer);
    const kSlow = 1 - Math.exp(-LEVEL_READ_MS / 1000 / LEVEL_SLOW_S), kFast = 1 - Math.exp(-LEVEL_READ_MS / 1000 / LEVEL_FAST_S);
    let said = 0;
    lv.timer = setInterval(() => {
      if (!playing || !leg?.live || leg.st !== st) return;
      lv.meter.getFloatTimeDomainData(lv.buf);
      let s = 0; for (const v of lv.buf) s += v * v;
      const ms = s / lv.buf.length;
      lv.slow = lv.slow ? lv.slow + (ms - lv.slow) * kSlow : ms;
      lv.fast = lv.fast ? lv.fast + (ms - lv.fast) * kFast : ms;
      const rms = Math.sqrt(Math.max(lv.slow, lv.fast));
      if (rms < LEVEL_FLOOR) return;
      const g = Math.max(1, Math.min(LEVEL_MAX, LEVEL_RMS / rms));
      const tau = g < lv.g ? LEVEL_DOWN_S : LEVEL_UP_S / 3;
      lv.g = g;
      levels.set(st.id, g);
      lv.gain.gain.setTargetAtTime(g, ctx.currentTime, tau);
      const now = performance.now();
      if (now - said > 10000) { said = now; d.log(`${st.label} at ${(20 * Math.log10(rms)).toFixed(1)} dB RMS, raised ${(20 * Math.log10(g)).toFixed(1)} dB`); }
    }, LEVEL_READ_MS);
  }

  // ── the stream: opened on Play, closed on Stop and on a switch ───────────
  function open(st) {
    // One connection at a time, whatever called this.
    close();
    const url = srcOf(st);
    d.log(`opening ${url}`);
    const stream = createMp3Stream(ctx, { url, log: (m) => d.log(`${st.label}: ${m}`) });
    const me = { st, stream, live: false };
    leg = me;
    levelStart(st, stream.node);
    stream.started.then((path) => {
      if (leg !== me) return;
      me.live = true;
      d.log(`${st.label} playing, ${path}`);
      pb.refresh();
    }).catch((e) => { if (leg === me) d.log(`${st.label} did not start: ${e?.message || e}`, 'warn'); });
  }
  function close() {
    if (!leg) return;
    const { st, stream } = leg;
    leg = null;
    try { stream.stop(); } catch { /* already stopped */ }
    try { stream.node.disconnect(); } catch { /* gone */ }
    if (lv) clearInterval(lv.timer);
    d.log(`${st.label} closed`);
  }

  // The sound follows the links the bay holds: the level node reaches the
  // speakers, the wave and the key detector each only along its own link.
  function route() {
    try { out.disconnect(); } catch { /* not connected */ }
    out.connect(tap);
    tap.connect(pull);
    if (holds(PLAYER_OUT, KEY_IN)) out.connect(key.an);
    if (holds(PLAYER_OUT, MIXER_DRY)) out.connect(dryG);
  }

  // ── the energy signal ───────────────────────────────────────────────────
  // The levelled station's RMS every 50 ms, eased up in about 80 ms and down
  // in about 400, divided by ENERGY_REF (the RMS the levelling aims at,
  // -16 dBFS), so 1 is the station at its ordinary loudness.
  const ENERGY_REF = 0.16, ENERGY_MS = 50;
  let energyTimer = null, energyEased = 0;
  function energyStart() {
    clearInterval(energyTimer);
    energyEased = 0;
    energyTimer = setInterval(() => {
      if (!tap) return;
      tap.getFloatTimeDomainData(tapBuf);
      let ss = 0;
      for (const v of tapBuf) ss += v * v;
      const r = Math.sqrt(ss / tapBuf.length) / ENERGY_REF;
      const k = 1 - Math.exp(-ENERGY_MS / (r > energyEased ? 80 : 400));
      energyEased += (r - energyEased) * k;
      bay.send(ENERGY_OUT, { of: 'param', name: 'energy', v: +energyEased.toFixed(3) });
    }, ENERGY_MS);
  }
  function energyStop() {
    clearInterval(energyTimer); energyTimer = null;
    bay.send(ENERGY_OUT, { of: 'param', name: 'energy', v: null });
  }

  function play() {
    // 🔴 A HARNESS NEVER OPENS A LIVE STREAM. Every connection to an ERR mount
    // lands in a public broadcaster's audience statistics, and Ida's server is
    // somebody else's too, so under ?selfcheck=1 Play opens nothing, makes no
    // AudioContext and plays nothing.
    if (SELFCHECK) { d.log('a self check is running, so no live stream is opened and nothing plays'); return; }
    sound();
    if (!out) {
      pull = ctx.createGain(); pull.gain.value = 0; pull.connect(ctx.destination);
      out = ctx.createGain();
      tap = ctx.createAnalyser(); tap.fftSize = 2048; tapBuf = new Float32Array(tap.fftSize);
      key = keyBuild();
      levelBuild();
    }
    playing = true;
    face();
    keyStart();
    energyStart();
    reading = null; paintKey(null);
    autoReading = null; autoPreview();
    for (const k of ['key', 'conf', 'also']) keyPanel.values.set(k, '');
    route();
    // The press is the person asking to listen: only now does a stream open,
    // and only the one station picked.
    open(STATIONS[at]);
    pb.refresh();
    requestAnimationFrame(frame);
  }
  function stop() {
    playing = false;
    if (key) clearInterval(key.timer);
    energyStop();
    close();
    pb.refresh();
    face();
  }

  const transport = createButtonGroup({ buttons: [
    { id: 'play', icon: 'play', label: 'play', onPress: () => (playing ? stop() : play()) },
  ] });
  function face() { transport.setIcon('play', playing ? 'stop' : 'play', playing ? 'stop' : 'play'); }
  face();

  const top = el('div', 'cc-top');
  top.append(transport.el);
  // The mix knob, its own node: a turn is one event on its value-out.
  const MIX0 = 0.5;
  const knobs = new Map([['mix', createKnob({
    label: 'mix', min: 0, max: 1, step: 0.01, value: MIX0, hand: true,
    format: (v) => `${Math.round(v * 100)}%`,
    onInput: (v) => bay.send(KNOB_MIX, { of: 'param', name: 'mix', v }),
  })]]);
  const knobRow = createKnobGrid(knobs, { row: true });
  bay.send(KNOB_MIX, { of: 'param', name: 'mix', v: MIX0 });
  d.stack.add(top, wavePanel.el, keyPanel.el, knobRow.el, pb.el);
  // Read only, for a check over CDP.
  window.__demo.key = { src: () => srcOf(STATIONS[at]), station: () => STATIONS[at].id, open: () => (leg ? leg.st.id : null),
    live: () => !!leg?.live, stream: () => leg?.stream.stats() ?? null, gain: () => (lv ? +lv.g.toFixed(3) : null),
    levels: () => Object.fromEntries(levels), reading: () => reading, playing: () => playing,
    links: () => bay.links().map((l) => `${l.from} -> ${l.to}${l.transforms?.length ? ' ' + JSON.stringify(l.transforms) : ''}`),
    voices: () => [...voices.keys()].map((k) => +k.split('/')[1]), expr: () => autoExprSent, autoStep: () => autoStep, autoHow: () => autoHow, marked: () => [...keyEls].filter(([, k]) => k.classList.contains('cc-auto')).map(([n]) => n), keyEls: () => keyEls.size, mix: () => mix, energy: () => energy, auto: () => !!autoTimer, autoHeld: () => [...autoHeld] };
  d.ready();
</script>
