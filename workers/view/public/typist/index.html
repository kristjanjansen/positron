<style>
  /* ── the carriage ────────────────────────────────────────────────────────
     ONE BOX, TWO LAYERS PINNED TOGETHER. The <textarea> on top is invisible
     and takes every keystroke; the <pre> underneath draws the text, the block
     cursor and the highlight AT THE OFFSETS THE BROWSER REPORTS. So the cursor
     you see is the caret the editor really has, not a picture of one — which
     matters on this page more than anywhere, because where the caret is IS the
     thing five earlier versions of this got wrong.

     ⚠️ THE TWO LAYERS MUST SHARE EVERY METRIC or they drift apart by a
     character and the cursor lands in the wrong place. They are set once, on
     `.type`, and both layers carry that class — never set a font or a padding
     on one of them alone. */
  .carriage { position: relative; background: var(--card); border: 1px solid var(--line);
              border-radius: 4px; overflow: hidden; }
  .type {
    font: 600 clamp(15px, 3.7vw, 20px)/1.75 var(--mono);
    letter-spacing: .02em; font-variant-ligatures: none; tab-size: 4;
    padding: 18px 16px; margin: 0; border: 0;
    white-space: pre-wrap; overflow-wrap: break-word; word-break: break-word;
  }
  .paper { color: var(--fg); height: 9.4em; overflow: hidden; }
  .keys {
    position: absolute; inset: 0; width: 100%; height: 100%; resize: none; outline: 0;
    background: transparent; color: transparent; overflow: hidden;
    caret-color: transparent;          /* the drawn one is the one to look at */
    -webkit-touch-callout: none;
  }
  .keys::selection { background: transparent; }
  .keys::-moz-selection { background: transparent; }
  .hint { color: var(--dim2); font-weight: 500; }

  /* THE CARET IS A CARET, NOT A BLOCK. It was a `.62em` slab of `--hi` with the
     next character printed inside it in inverse video — one whole character of
     solid colour, sitting -.31em INTO the character before it. Two things were
     wrong with that and only one of them was the look: the slab swallowed a
     character's width out of the flow, so every letter after the caret sat one
     character to the left of where the <textarea> underneath had it.

     ⚠️ STILL ZERO NET WIDTH — 2px with -2px of right margin — because the two
     layers must share every metric or they drift apart by a character. The
     margin-LEFT is the gap the caret keeps from the letter before it; the same
     amount comes back off the right, so the character after it does not move.
     .1em lands the bar in the next glyph's own left side bearing, which is
     where a real editor puts one. */
  .cur { display: inline-block; width: 2px; height: 1.1em; vertical-align: -.22em;
         margin-left: .1em; margin-right: calc(-2px - .1em);
         background: var(--hi); border-radius: 1px;
         animation: typ-blink 1.06s steps(1) infinite; }
  @keyframes typ-blink { 0%, 54% { opacity: 1 } 55%, 100% { opacity: .12 } }
  /* `--hi` at 22%: a highlight, not a second piece of ink */
  .sel { background: rgba(255, 212, 0, .22); border-radius: 2px; }

  /* the same document, rebuilt — quieter, because it is the check rather than
     the performance */
  .rebuilt { margin-top: 10px; background: var(--card); border: 1px solid var(--line);
             border-radius: 4px; padding: 9px 12px 11px; }
  .rb-k { font: 500 9.5px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase;
          color: var(--dim2); display: block; }
  .rb-t { font: 500 12.5px/1.6 var(--mono); color: var(--dim); margin: 6px 0 0;
          white-space: pre-wrap; word-break: break-word; max-height: 5.5em; overflow: auto; }
  .rb-t .cur { animation: none; opacity: .8; }
  .rb-v { font: 500 11px/1.4 var(--mono); color: var(--dim2); margin-top: 7px; }
  .rb-v[data-apart="1"] { color: var(--bad); }
</style>

      + 'it be put back or run backwards.',

    // can see the letters, the cursor and the highlight, and a row of cells

    // `checked` and `apart` are about the page's argument rather than about

    // ⚠️ `showReadout: false` IS THE SECOND HALF AND IT IS NOT DECORATION.

  const carriage = el('div', 'carriage');
  const paper = el('pre', 'type paper');
  // `data-typing` is how `verify.mjs` knows to TYPE into this element rather
  // than click it. A page whose subject is typing was a page the suite could
  // not reach at all — it presses buttons and drags `[data-gesture]`, and

  // gesture the browser made, the same as yours.
  const keys = el('textarea', 'type keys', null, {
    spellcheck: 'false', autocomplete: 'off', autocorrect: 'off', autocapitalize: 'off',

  const rbText = el('pre', 'rb-t');
  const rbVerdict = el('div', 'rb-v');
  rebuilt.append(rbText, rbVerdict);

  const stripHost = el('div', '');
  d.el.append(carriage, barHost, stripHost);

  const css = getComputedStyle(document.documentElement);
  const tok = (n, fb) => (css.getPropertyValue(n) || '').trim() || fb;
  // COLOUR NAMES WHAT THE EDIT DID, and it is allowed to here: nothing on this
  // page is measured for lateness, so the green/amber/red scale the timing
  // pages use is not in play and cannot be confused with it. Each of the three
  // also has its own row, its own label and its own count in the gutter.
  const INK = {
    [OP_INSERT]: tok('--hi', '#ffd400'),
    [OP_DELETE]: tok('--bad', '#e0908a'),
    [OP_SELECT]: tok('--dim', '#8b93a1'),
  };

  // ── state ────────────────────────────────────────────────────────────────
  const blank = () => ({ text: '', selection: [0, 0], dir: 'none' });
  const freshProv = () => ({ seen: 0, withRange: 0, ignored: 0 });

  let log = [];            // the rows, append-only, stamped from the EVENT
  let live = blank();      // built one edit at a time — the actuate side
  let folded = blank();    // rebuilt from the whole prefix — the reduce side
  let prov = freshProv();
  let deck = null, bar = null, view = null, adapter = null;
  let capturing = false;   // true while the box is yours to type into — everything except the shipped fixture
  let opPos = [];          // each edit's position on the line, for the skip window
  let lastAssertWall = 0;
  let pre = null;          // the beforeinput snapshot
  const cmp = { compares: 0, divergences: 0, lags: 0, skips: 0, last: null };

  // What a key would look like if one were ever stored. Used by the count in
  // the cursor row's gutter AND by the check below, so the two cannot drift.
  const KEYISH = /(^|[^a-z])key|shift|ctrl|alt|meta|modifier|keycode/i;
  const keysStored = (rows) => rows.filter((r) => Object.keys(r.op).some((k) => KEYISH.test(k))).length;

  const nowUs = () => Math.round((performance.timeOrigin + performance.now()) * 1000);
  // ⚠️ STAMP FROM THE EVENT. `ev.timeStamp` is the browser's own clock for when
  // the key happened; reading a clock in the handler measures when we got round
  // to it, and the gap is not a constant anybody can subtract later.
  const evUs = (ev) => Math.round((performance.timeOrigin + ev.timeStamp) * 1000);

  /**
   * Apply ONE edit to a document. This is a SECOND, INDEPENDENT implementation
   * of the same semantics as the module's `foldOps()`, and it is deliberate:
   * this one runs one edit at a time as the recording plays, that one runs over
   * the whole prefix on a seek, and the two documents on screen agreeing is
   * what says the second is right. One shared function would make the check a
   * tautology.
   */
  function applyOne(st, op) {
    const n = st.text.length;
    const a = Math.max(0, Math.min(n, op.range[0]));
    const b = Math.max(a, Math.min(n, op.range[1]));
    if (op.type === OP_SELECT) return { text: st.text, selection: [a, b], dir: op.dir || 'none' };
    if (op.type === OP_INSERT) {
      const t = op.text || '';
      return { text: st.text.slice(0, a) + t + st.text.slice(b),
               selection: [a + t.length, a + t.length], dir: 'none' };
    }
    return { text: st.text.slice(0, a) + st.text.slice(b), selection: [a, a], dir: 'none' };
  }

  // ── drawing a document ───────────────────────────────────────────────────
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  /** text + the block cursor (or the highlight) exactly where the offsets say. */
  function drawDoc(into, st, { blink = true } = {}) {
    const n = st.text.length;
    const a = Math.max(0, Math.min(n, st.selection[0]));
    const b = Math.max(a, Math.min(n, st.selection[1]));
    const head = esc(st.text.slice(0, a));
    const tail = esc(st.text.slice(b));
    // THE CARET STANDS BETWEEN TWO CHARACTERS AND TAKES NEITHER. It used to
    // hold the next character inside itself, in inverse video, and print the
    // rest from a+1 — which drew every character exactly once but gave the one
    // under the caret no width in the flow, so the line was a character shorter
    // than the same line in the <textarea> pinned over it.
    const mid = a === b ? '<span class="cur"></span>'
      : `<span class="sel">${esc(st.text.slice(a, b))}</span>`;
    into.innerHTML = head + mid + tail + '​';
  }

  function drawPaper() {
    if (!live.text && !capturing) {
      paper.innerHTML = '<span class="hint">start typing</span>';
      return;
    }
    drawDoc(paper, live);
    // THE CARRIAGE ADVANCES. A page taller than the box would otherwise type
    // itself out of sight; rolling the paper so the cursor's line stays in
    // view is what a carriage does, and it keeps the two layers aligned
    // because both are scrolled to the same offset.
    const cur = paper.querySelector('.cur, .sel');
    if (cur) {
      const want = Math.max(0, cur.offsetTop - paper.clientHeight + cur.offsetHeight + 22);
      if (Math.abs(paper.scrollTop - want) > 1) paper.scrollTop = want;
      keys.scrollTop = paper.scrollTop;
    }
  }

  /** The live document into the box the browser types into. Never called while
   *  capturing: there the browser owns the element and we only read it. */
  function writeThrough() {
    if (keys.value !== live.text) keys.value = live.text;
    try { keys.setSelectionRange(live.selection[0], live.selection[1], live.dir || 'none'); }
    catch { /* a selection the element will not take is not worth a page error */ }
    drawPaper();
  }

  // ── capture: beforeinput / input / selectionchange, and no keydown ───────
  // There is no `keydown` listener in this file. Grep for it — that is the
  // point of the page. An arrow key produces no `beforeinput`, so it cannot
  // enter the recording even by accident; what it does is move the cursor, and
  // the cursor's new place rides as its own edit.
  keys.addEventListener('beforeinput', (ev) => {
    if (!capturing) return;
    let ranges = 0;
    try { ranges = ev.getTargetRanges ? ev.getTargetRanges().length : 0; } catch { ranges = 0; }
    prov.seen++;
    if (ranges > 0) prov.withRange++;
    pre = { value: keys.value, s: keys.selectionStart, e: keys.selectionEnd,
            inputType: ev.inputType, ranges, atUs: evUs(ev) };
  });

  keys.addEventListener('input', (ev) => {
    if (!capturing) return;
    const p = pre || { value: live.text, s: keys.selectionStart, e: keys.selectionEnd,
                       inputType: ev.inputType || '', ranges: -1, atUs: evUs(ev) };
    pre = null;
    const it = p.inputType || ev.inputType || '';
    // THE RANGE COMES FROM THE DOCUMENT, not from the key and not from the
    // selection before the edit. For a backspace the selection before the edit
    // is a collapsed cursor and says nothing about what went; the text before
    // and after says exactly what went.
    const op = deriveOp(p.value, keys.value, keys.selectionStart, it);
    if (!op) { prov.ignored++; return; }        // an edit with no plain-text diff
    push({ at: p.atUs, kind: KIND, source: 'live', op,
           meta: { targetRanges: p.ranges, preSel: [p.s, p.e] } });
  });

  document.addEventListener('selectionchange', () => {
    if (!capturing || document.activeElement !== keys) return;
    const s = keys.selectionStart, e = keys.selectionEnd;
    const dir = keys.selectionDirection || 'none';
    if (live.selection[0] === Math.min(s, e) && live.selection[1] === Math.max(s, e)) return;
    const prev = log[log.length - 1];
    const at = nowUs();
    if (prev && prev.op.type === OP_SELECT && at - prev.at < COALESCE_MS * 1000) {
      prev.op.range = [Math.min(s, e), Math.max(s, e)];
      prev.op.dir = dir;
      live = applyOne(live, prev.op);
      paintAll();
      return;
    }
    push({ at, kind: KIND, source: 'live', op: selectOp(s, e, dir) });
  });

  /** One recorded edit: onto the log, onto the document, onto the line. */
  function push(row) {
    const prev = log[log.length - 1];
    if (prev && row.at <= prev.at) row.at = prev.at + 1;   // strictly ordered
    log.push(row);
    live = applyOne(live, row.op);
    if (!deck) rebuild();                    // the first edit sets the origin
    else {
      const at = deck.toPos(row.at);
      opPos.push(at);
      // ⚠️ AHEAD OF THE PLAYHEAD, ALWAYS. The library fires anything scheduled
      // behind the playhead at once — right for a note, wrong for a document,
      // where it would apply an edit a second time. It cannot happen here: the
      // playhead is parked while you type and every stamp is later than the
      // last, and `apply()` below refuses to touch the document while
      // capturing, which is the belt to that brace.
      deck.schedule({ at, kind: KIND, id: `op-${log.length - 1}`,
                      payload: { kind: KIND, source: row.source, op: row.op,
                                 meta: row.meta, atUs: row.at, i: log.length - 1, at } });
      deck.setRange('auto');
      // ⚠️ AND THE PICTURE HAS TO BE TOLD. The line fits itself to the range
      // once, when it is built — so a recording that GROWS left the window
      // sitting on its first half-second, showing six of seventy-one edits
      // with two of the three rows empty while the clock above read 7.7 s.
      view?.strip.fit();
    }
    paintAll();
  }

  // ── the line ─────────────────────────────────────────────────────────────
  function laneOf(type, label, height) {
    return {
      id: type, kind: KIND, label, height, width: 2, as: 'ticks', terse: true,
      color: INK[type],
      // 🔴 THE LETTER IS THE MARK. Not a tick with a letter stuck on it — that
      // was two marks per edit saying one thing, and it read as busy. `marks:
      // 'char'` tells the strip to draw no line at all: where there is room the
      // character stands on its own, and where there is not, a middot stands in
      // for it. So zooming is still the control — out is a rhythm of dots, in
      // is a word — and nothing is hidden, because every edit always has a mark.
      marks: 'char',
      // ⚠️ ONLY A LETTER OR A DIGIT IS DRAWN AS ITSELF. A space, a line break,
      // a tab, a backspace and a cursor move have no shape, and the printer's
      // symbols this used to draw for them (`␣ ⏎ ⇥ ⌫`) were four more things to
      // learn in a row that is already three rows deep. An empty answer here is
      // how the strip is told "this edit has no character", and it draws the
      // middot — at full strength, because that is a property of the edit and
      // no amount of zooming will turn it into a letter.
      glyphOf: (r) => {
        const op = r.payload?.op;
        if (!op || op.type === OP_SELECT) return '';
        const t = op.type === OP_DELETE ? (op.removed ?? '') : (op.text ?? '');
        const c = t ? [...t][0] : '';
        return /[\p{L}\p{N}]/u.test(c) ? c : '';
      },
      filter: (r) => r.payload?.op?.type === type,
      describeRow: (r) => {
        const op = r.payload.op;
        if (op.type === OP_SELECT) {
          return [op.range[0] === op.range[1] ? `cursor to ${op.range[0]}`
                                              : `${op.range[0]} to ${op.range[1]} held`,
                  'no key was recorded'];
        }
        if (op.type === OP_DELETE) {
          return [`${op.range[1] - op.range[0]} gone at ${op.range[0]}`,
                  r.payload.meta && r.payload.meta.preSel[0] === r.payload.meta.preSel[1]
                    ? 'range from the text' : 'range from the selection'];
        }
        const t = op.text || '';
        return [`${JSON.stringify(t.length > 12 ? t.slice(0, 12) + '…' : t)} at ${op.range[0]}`,
                op.inputType === 'insertFromPaste' ? 'pasted'
                  : op.inputType === 'insertCompositionText' ? 'a composition step'
                  : op.inputType === 'insertLineBreak' ? 'a new line' : 'typed'];
      },
    };
  }

  /** Build (or rebuild) the whole timeline around the rows we hold now. */
  function rebuild() {
    bar?.destroy(); view?.destroy();
    try { deck?.dispose(); } catch { /* already gone */ }
    bar = view = deck = null;
    cmp.compares = cmp.divergences = cmp.lags = cmp.skips = 0;
    cmp.last = null;
    if (!log.length) { opPos = []; return; }   // nothing to put on a line yet

    adapter = makeTextOpAdapter({
      apply(payload) {
        // the recording drives the document — unless you are typing, in which
        // case the browser does and nothing else may touch it
        if (capturing) return;
        live = applyOne(live, payload.op);
        writeThrough();
      },
      assert(state) {
        // A SEEK RESTORES, IT DOES NOT REPLAY. The whole prefix is folded to
        // one document and written in one go; the alternative — replaying
        // every keystroke up to there — is the shape this kind exists to
        // avoid, and it gets slower the further in you drag.
        //
        // 🔴 AND IT IS REFUSED WHILE YOU ARE TYPING, for the same reason
        // `apply` is. MEASURED: without this, the first letter of your own
        // recording vanished. Building the line around that first edit ends in
        // a `seek(0)`, position 0 is a quarter of a second BEFORE it, so the
        // fold there is an empty document — and writing it through emptied the
        // box the letter had just gone into. The letter stayed in the
        // recording, which is why the two readings then disagreed by one
        // character for the rest of the session and said so.
        if (capturing) return;
        live = { text: state.text, selection: state.selection.slice(), dir: state.dir };
        folded = { text: state.text, selection: state.selection.slice(), dir: state.dir };
        lastAssertWall = performance.now();
        writeThrough();
      },
    });
    // The kind declares `rate: true` but carries no list of speeds, and the one
    // transport bar renders its speeds from that list. Handed over here rather
    // than added to the module, which is promoted unchanged.
    adapter.caps.rates = RATES;

    deck = makeLogDeck({
      lanes: [{ kind: KIND, rows: log, adapter }],
      leadInMs: 250, tailMs: 400,
    });
    opPos = log.map((r) => deck.toPos(r.at)).sort((a, b) => a - b);
    if (!capturing) deck.seek(0);       // a seek is an actuation; see `assert`

    /**
     * ── the loop modes ─────────────────────────────────────────────────────
     *
     * 🔴 THREE DIRECTIONS, NOT FIVE, AND THE DECISION IS `/loops/`'s BECAUSE IT
     * WAS TAKEN THE SAME DAY. Asked for as *"add loop modes to typist"*.
     * `looper.mjs` holds five ways and its own `LOOP_TURN = [0, 1, 4]` cycles
     * three of them: `round`, `back`, `pingpong`. The two it leaves out do not
     * belong on a bar that already has their controls. `half` is a RATE and the
     * rate picker four controls to the left already reads 0.25 to 4; `chop` is a
     * LENGTH and the two presses of Loop already choose one. And `WAY_GLYPH`
     * gives `round`, `half` and `chop` the same arrow, so a five-way control
     * could not say which of its states it was in, which is the failure this
     * project calls a control that lies.
     *
     * 🔴 AND IT IS THE BAR'S OWN `loopWays`, NOT A BUTTON OF THIS PAGE'S.
     * `/loops/` put its direction in `.pos-controls` because what it turns
     * round is a NEST of quotations rather than a loop on a deck. Here the deck
     * IS the thing being played, which is the case `transport-bar.mjs` wrote
     * `loopWays` for in as many words: *"for a deck that IS the thing being
     * played, which on this site means a drawn record rather than a
     * recording"*. A record of edits is exactly that, so this page uses the
     * control that exists instead of a fourth copy of it.
     *
     * 🔴 WHAT `back` MEANS HERE, AND NOTHING ABOUT IT FOLLOWS FROM THE AUDIO
     * MEANING OF THE WORD. The subject is an edit history. Playing it `round`
     * is RETYPING. Playing it `back` is UNTYPING, and `pingpong` is typing and
     * untyping in turn.
     * **Untyping is not each edit being undone. It is FEWER EDITS being read.**
     * Every row is a range and what went into it, and the document at any
     * moment is the fold of the rows before that moment, so a playhead moving
     * left is a shorter prefix and nothing has to know how to reverse an edit.
     * Three things fall out of that, and they are the three the harness's own
     * key sequence is made of:
     *   · **A BACKSPACE PLAYED BACKWARDS IS A CHARACTER APPEARING.** The fold
     *     at the moment before a deletion still contains what it removed, so
     *     the letters come back exactly where they were. No inverse of a
     *     deletion is stored anywhere and none is needed, which matters because
     *     a backspace *"never says what it removed"* in the first place.
     *   · **AN ARROW KEY PLAYED BACKWARDS PUTS THE CURSOR BACK**, with not one
     *     letter moving. A cursor move is a row like any other and the fold
     *     carries the selection, so the one gesture that produces no `input`
     *     event at all runs backwards for free.
     *   · **AND THE FIRST LETTER SURVIVES.** The fold at position 0 is an empty
     *     document, which is the bug this page shipped once: a lap that reaches
     *     the start of the recording empties the box, and that is CORRECT here
     *     because the box at that moment held nothing. What it must never do is
     *     empty the box you are still typing into, which is what `assert`
     *     refuses and what `onLoop` below is for.
     *
     * 🔴 AND A REVERSED LAP RUNS WITH THE DECK PAUSED, WHICH IS THE ONE THING
     * THIS PAGE HAD TO BE TOLD. `transport.setRate` refuses a negative rate, so
     * the bar drives a backward lap from its own clock, seeking the deck frame
     * by frame while `deck.playing()` stays FALSE. `frame()` below hands the
     * box over when the deck starts playing, and that test cannot see a lap at
     * all: without this the playhead would sweep while the document sat
     * frozen, because `apply` and `assert` both refuse to touch a box somebody
     * is typing into. Arming a loop is a decision to play, so it is the moment
     * the take ends.
     * ⚠️ AND IT DOES NOT REWIND. `stopCapture` seeks to 0 because that is what
     * pressing play means; a loop has just chosen a place to be, and throwing
     * it away would move the playhead out of the loop on the frame it started.
     */
    bar = createTransportBar(barHost, deck, {
      scrub: false,
      loopWays: true,
      onLoop: (what) => { if (what === 'set') stopCapture({ rewind: false }); },
    });
    view = createStripView(stripHost, deck, {
      size: 'auto', follow: false, gutter: 132,
      // 36 EACH, AND THE NUMBER IS ARITHMETIC, NOT TASTE. The gutter draws a
      // lane's name at y+11 and its numbers at y+22 and y+32, and refuses any
      // line that would fall past `height - 2` — so two numbers need 34 px of
      // lane and this asks for 36. ⚠️ A LANE THAT IS ONE PIXEL SHORT DROPS ITS
      // LAST LINE IN SILENCE, and the last line is where the count lives: the
      // strip is doing the right thing (never spill into the next lane) and the
      // page still loses a number with nothing to say it happened. That is why
      // these three are equal and why the arithmetic is written down. It was
      // 42/38/38 against a looser spacing, and 33 px before the name was given
      // its own step away from the numbers. `strip.gutterFit()` answers this by
      // measurement now, so nobody has to do the sum again to find out.
      lanes: [laneOf(OP_INSERT, 'typed', 36),
              laneOf(OP_DELETE, 'taken back', 36),
              laneOf(OP_SELECT, 'cursor', 36)],
    });
    gutters();
  }

  /** Per-row numbers beside their own ink, never in a table somewhere else. */
  function gutters() {
    if (!view) return;
    const n = (t) => log.filter((r) => r.op.type === t).length;
    const chars = log.filter((r) => r.op.type === OP_INSERT)
      .reduce((a, r) => a + (r.op.text || '').length, 0);
    const gone = log.filter((r) => r.op.type === OP_DELETE)
      .reduce((a, r) => a + (r.op.range[1] - r.op.range[0]), 0);
    const by = { [OP_INSERT]: [`${n(OP_INSERT)} edits`, `${chars} letters in`],
                 [OP_DELETE]: [`${n(OP_DELETE)} edits`, `${gone} letters out`],
                 [OP_SELECT]: [`${n(OP_SELECT)} moves`, `${keysStored(log)} keys stored`] };
    for (const L of view.strip.lanes()) if (by[L.id]) L.subLabel = by[L.id];
    view.strip.invalidate();
  }

  // ── the two readings, compared ───────────────────────────────────────────
  const same = (a, b) => !!a && !!b && a.text === b.text
    && a.selection[0] === b.selection[0] && a.selection[1] === b.selection[1];

  function nearEdit(pos, win) {
    for (const p of opPos) { if (p > pos + win) break; if (Math.abs(p - pos) <= win) return true; }
    return false;
  }

  function compareAt(pos) {
    const st = deck.reduceAt(KIND, pos);
    if (!st) return;
    folded = { text: st.text, selection: st.selection.slice(), dir: st.dir };
    // ⚠️ THE SKIP WINDOW IS A WALL-CLOCK QUANTITY. What it excludes is the
    // moment around an edit where one reading has it and the other has not yet
    // — scheduler jitter, a few milliseconds of real time. Written as a
    // constant in positions it is three times too narrow at 3x, which is how
    // this check once reported three mismatches that were not there.
    const win = SETTLE_MS * Math.max(1, deck.rate() || deck.targetRate());
    if (nearEdit(pos, win) || performance.now() - lastAssertWall < 60) { cmp.skips++; return; }
    cmp.compares++;
    if (same(folded, live)) return;
    // one dispatch either side and it is a fire that has not landed yet; any
    // other difference is the rebuild disagreeing, which is the only number
    // here that would mean something is wrong
    const lag = same(deck.reduceAt(KIND, pos - win), live) || same(deck.reduceAt(KIND, pos + win), live);
    if (lag) cmp.lags++;
    else { cmp.divergences++; cmp.last = { pos: +pos.toFixed(1), a: live.text, b: folded.text }; }
  }

  function paintAll() {
    if (capturing) {
      folded = foldOps(log.map((r) => ({ op: r.op })));
      cmp.compares++;
      if (!same(folded, live)) { cmp.divergences++; cmp.last = { pos: null, a: live.text, b: folded.text }; }
      gutters();
      checkLive();
    }
    drawPaper();
    drawDoc(rbText, folded, { blink: false });
    const apart = cmp.divergences > 0;
    rbVerdict.dataset.apart = apart ? '1' : '0';
    rbVerdict.textContent = !cmp.compares ? 'nothing compared yet'
      : apart ? `apart at ${cmp.last && cmp.last.pos} · the rebuild disagrees`
      : `the same, ${cmp.compares} times over`
        + (cmp.lags ? ` · ${cmp.lags} caught mid-edit` : '');
    readout();
  }

  // ⚠️ THE CELLS ARE GONE AND THE COUNTERS ARE NOT. `cmp.compares` and
  // `cmp.divergences` are what the live check reads, and `hadToBeWorkedOut`
  // still feeds an assert — deleting the arithmetic along with the row it used
  // to print into would have taken two checks with it, silently, which is this
  // page's own lesson about an assert count that drops while reading green.
  // The numbers now go to the LANE GUTTERS, beside the ink they describe,
  // which is where this project puts a per-lane figure anyway.
  function readout() { gutters(); }

  /** A deletion whose range no event reported: the selection before it was a
   *  collapsed cursor, so the only place the removed range could come from is
   *  the text before and after. */
  const hadToBeWorkedOut = (r) => !!r.meta && r.meta.preSel[0] === r.meta.preSel[1]
    && (r.op.range[0] !== r.meta.preSel[0] || r.op.range[1] !== r.meta.preSel[1]);

  // ── the frame loop ───────────────────────────────────────────────────────
  let lastPos = null;
  function frame() {
    if (deck && !capturing) {
      // ⚠️ ONLY WHERE THE PLAYHEAD MOVED. Comparing the same two documents
      // sixty times a second while nothing is happening climbs `checked` into
      // the thousands without having looked at anything, which teaches a
      // reader to ignore the cell.
      const pos = deck.position();
      if (deck.playing() || pos !== lastPos) { lastPos = pos; compareAt(pos); paintAll(); }
    }
    if (capturing && deck && deck.playing()) stopCapture();
    requestAnimationFrame(frame);
  }

  // ── what you do to it ────────────────────────────────────────────────────
  /**
   * The take ends and the recording becomes something to play.
   *
   * ⚠️ `rewind` IS FALSE FOR A LOOP AND TRUE FOR EVERYTHING ELSE. Pressing play
   * means from the top, so a take that ends that way goes back to 0. A loop has
   * already chosen the two places it lives between and seeked to the first of
   * them, so rewinding here would move the playhead out of the loop on the
   * frame the loop started.
   */
  function stopCapture({ rewind = true } = {}) {
    if (!capturing) return;
    capturing = false;
    keys.readOnly = true;
    d.log(`your recording: ${log.length} edits, ${live.text.length} letters`, 'hi');
    if (rewind && deck) deck.seek(0);
  }

  function startOwn() {
    bar?.destroy(); view?.destroy();
    try { deck?.dispose(); } catch { /* already gone */ }
    bar = view = deck = null;
    log = []; opPos = []; live = blank(); folded = blank(); prov = freshProv();
    cmp.compares = cmp.divergences = cmp.lags = cmp.skips = 0;
    capturing = true;
    keys.readOnly = false;
    keys.value = '';
    keys.focus();
    paintAll();
    d.log('typing now · arrow keys, backspace, selection and paste are all welcome');
  }

  function loadRecording() {
    const src = document.getElementById('take').textContent.trim();
    const { header, rows } = fromJsonl(src);
    capturing = false;
    keys.readOnly = true;
    log = rows;
    live = blank(); folded = blank();
    rebuild();
    paintAll();
    return { header, rows, src };
  }

  // 🔴 A LIVE TAKE GRADES ITSELF, ONCE. The eight checks below are about the
  // SHIPPED recording — real key events, captured from a real browser — and
  // they are the page's argument. But they say nothing about the capture
  // running right now, which is the half a reader is actually using and the
  // half that was broken twice while this page was being built (a fold at
  // position 0 emptied the box the first letter had gone into, and the strip
  // fitted itself once and drew six of seventy-one edits). Neither could have
  // been caught by a button.
  //
  // ⚠️ ONCE, on the first take that is long enough. `d.assert` appends, so
  // checking on every keystroke would grow the count without end and make
  // "diff the per-demo assert count" — this project's cheapest regression test
  // — meaningless. And the threshold is on EDITS rather than on time, because
  // a take is finished when there is something in it, not when a clock says so.
  let liveChecked = false;
  function checkLive() {
    // EIGHT, and the number is the smallest take with something to say rather
    // than a round one: a few characters, a correction and a cursor move is
    // what makes this kind different from an append-only log, and that is
    // eight edits. It was twelve, which is more than the harness types, so the
    // check silently never ran — a threshold above what can reach it is a
    // check that does not exist.
    if (liveChecked || !capturing || log.length < 8) return;
    liveChecked = true;
    // The two readings of what is being typed RIGHT NOW: the box the browser
    // holds, and the document rebuilt from the edits alone. They have to agree
    // at every moment compared, not merely at the end — a rebuild that is right
    // only at the last character is a rebuild that cannot be scrubbed.
    d.assert('what is being typed right now rebuilds from its own edits, at every moment',
      cmp.compares > 0 && cmp.divergences === 0,
      `${cmp.compares} moments compared, ${cmp.divergences} apart, ${log.length} edits so far`);
  }

  // ── the checks ───────────────────────────────────────────────────────────
  //
  // 🔴 NOTHING TYPES FOR YOU. There is no control that fabricates a session:
  // what is graded below is either the recording — real key events, captured
  // through the browser's own editing pipeline, with the browser's own text
  // kept beside it as ground truth — or two scripted comparisons that exist to
  // give the page's method something to be better than.

  /**
   * 🔴 THE ANCESTORS' METHOD, KEPT AS CODE, because a check needs something to
   * be better than and this one loses every time (the checks below say by how
   * much).
   *
   * Five earlier text recorders in this lineage stored `{key, shift}` on
   * `keydown` and replayed with `value += shift ? key.toUpperCase() : key`,
   * dropping anything whose key name was longer than one character —
   * time/public/demo2.html:27/:64, demo12.html:74/:134,
   * demo-timeline-component.html:97/:111, demo/pages/keyboard.vue:142,
   * keyboard2.vue:177. So every arrow key vanishes, and the cursor advances by
   * one however many characters actually went in.
   */
  function asAnAncestorWould(strokes) {
    let text = '', caret = 0;
    for (const k of strokes) {
      if (k.key.length !== 1) continue;                       // arrows: dropped
      const ch = k.shift ? k.key.toUpperCase() : k.key;       // resolved a SECOND time
      text = text.slice(0, caret) + ch + text.slice(caret);
      caret++;                                                // one, whatever went in
    }
    return { text, caret };
  }

  /** What a plain text box does with those keystrokes — the browser's part,
   *  written out so both methods can be fed the same session. The recording
   *  above is the evidence that this is what a browser really reports. */
  function asABoxWould(strokes) {
    let text = '', caret = 0;
    const steps = [];
    for (const k of strokes) {
      const before = text, was = caret;
      if (k.key === 'ArrowLeft') caret = Math.max(0, caret - 1);
      else if (k.key === 'ArrowRight') caret = Math.min(text.length, caret + 1);
      else if (k.key === 'Backspace') {
        if (caret > 0) { text = text.slice(0, caret - 1) + text.slice(caret); caret--; }
      } else {
        const ch = k.shift ? k.key.toUpperCase() : k.key;
        text = text.slice(0, caret) + ch + text.slice(caret);
        caret += ch.length;
      }
      // `range` is where the edit REALLY happened, which is what a record has
      // to get right and what neither method is told.
      const range = before === text ? null
        : k.key === 'Backspace' ? [was - 1, was] : [was, was];
      steps.push({ before, after: text, caret, was, range,
                   moved: before === text && was !== caret });
    }
    return { text, caret, steps };
  }

  /** The naive half of the derivation, on its own: the shortest range that
   *  explains the change, with nothing to settle it when the same letter
   *  repeats. This is what the page would have if it ignored the cursor. */
  function shortestRange(oldText, newText) {
    let p = 0;
    const maxP = Math.min(oldText.length, newText.length);
    while (p < maxP && oldText.charCodeAt(p) === newText.charCodeAt(p)) p++;
    let s = 0;
    const maxS = Math.min(oldText.length - p, newText.length - p);
    while (s < maxS && oldText.charCodeAt(oldText.length - 1 - s) === newText.charCodeAt(newText.length - 1 - s)) s++;
    const removed = oldText.length - p - s, inserted = newText.length - p - s;
    return inserted === 0
      ? { type: OP_DELETE, range: [p, p + removed] }
      : { type: OP_INSERT, range: [p, p + removed], text: newText.slice(p, p + inserted) };
  }

  /** Both derivations over one scripted session, as this page records it. */
  function recordSession(strokes, derive) {
    const ops = [];
    for (const st of asABoxWould(strokes).steps) {
      if (st.moved) { ops.push(selectOp(st.caret, st.caret)); continue; }
      if (st.before === st.after) continue;
      ops.push(derive(st.before, st.after, st.caret));
    }
    return foldOps(ops.map((op) => ({ op })));
  }

  const quietProbes = (n = 3) => {
    const gaps = [];
    for (let i = 1; i < opPos.length; i++) gaps.push({ mid: (opPos[i - 1] + opPos[i]) / 2, w: opPos[i] - opPos[i - 1] });
    gaps.sort((a, b) => b.w - a.w);
    return gaps.slice(0, n).map((g) => +g.mid.toFixed(2)).sort((a, b) => a - b);
  };

  const nextFrame = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

  async function check({ header, rows, src }) {
    // ── what is in the recording ──────────────────────────────────────────
    const fields = new Set();
    for (const r of rows) for (const k of Object.keys(r.op)) fields.add(k);
    const moves = rows.filter((r) => r.op.type === OP_SELECT).length;
    d.assert('not one key was written down: only what changed, and to what',
      rows.length > 0 && keysStored(rows) === 0,
      `${rows.length} edits, ${moves} of them cursor moves; every edit carries `
      + `${[...fields].sort().join(', ')}`);

    // 🔴 THE LETTERS ARE THE MARKS, ASSERTED AT TWO ZOOMS — because "it drew
    // nothing" and "there was no room" are the same picture, and a feature that
    // had silently stopped working would read as a crowded view. So the check
    // is a RELATIONSHIP, not a count: zoom in far enough and more letters
    // appear; zoom out and they go back to dots. Neither end alone can say
    // that, and a fixed threshold would just be tuned until it passed.
    //
    // ⚠️ AND EVERY EDIT KEEPS A MARK AT BOTH ENDS. `drawn + dotted === had` is
    // the half of the claim the old version could not make: a letter that lost
    // its room used to leave a bare tick, and now it leaves a faded dot, so a
    // mark that went missing altogether would show up here as a shortfall
    // rather than as a tidier picture.
    if (SELFCHECK) {
      const st = view.strip;
      const saved = st.view();
      const at = (pxPerSecond) => {
        st.setView({ ...st.view(), pxPerSecond });
        st.draw();
        const L = st.lanes().find((l) => l.id === OP_INSERT);
        return L && L.glyphState ? L.glyphState : { had: 0, drawn: 0, dotted: 0 };
      };
      const wide = at(20), close = at(400);
      st.setView(saved); st.draw();
      const allMarked = (g) => g.drawn + g.dotted === g.had;
      d.assert('zoom in far enough and a mark becomes the letter that was typed',
        close.drawn > wide.drawn && close.drawn > 0 && wide.had > 0
          && allMarked(wide) && allMarked(close),
        `${wide.drawn} letters legible of ${wide.had} marks at 20 px a second, `
        + `${close.drawn} of ${close.had} at 400 · the rest are middots, `
        + `${wide.dotted} and ${close.dotted} of them, so every edit has a mark `
        + `at both zooms and only the zoom decides which ones can be read`);
    }

    const dels = rows.filter((r) => r.op.type === OP_DELETE);
    const workedOut = dels.filter(hadToBeWorkedOut);
    d.assert('a backspace never says what it removed, so the text before and after is compared',
      dels.length > 0 && workedOut.length === dels.length,
      `${workedOut.length} of ${dels.length} deletions · the cursor was sitting at one place `
      + `and the range that went was somewhere else`);

    // ── the two scripted comparisons ──────────────────────────────────────
    // Type "the recorder", walk the cursor back eight places, type "own " —
    // an insert in the middle, which is the case every ancestor refused.
    const middle = [...'the recorder'].map((c) => ({ key: c })).concat(
      Array.from({ length: 8 }, () => ({ key: 'ArrowLeft' })),
      [...'own '].map((c) => ({ key: c })));
    const truthMiddle = asABoxWould(middle);
    const ours = recordSession(middle, deriveOp);
    const theirs = asAnAncestorWould(middle);
    d.assert('replaying the keys instead of the edits puts the letters in the wrong place',
      ours.text === truthMiddle.text && theirs.text !== truthMiddle.text,
      `the box holds ${JSON.stringify(truthMiddle.text)}; edits replay to `
      + `${JSON.stringify(ours.text)}; keys replay to ${JSON.stringify(theirs.text)}`);

    // ⚠️ THE SAME LETTER, FOUR TIMES. Walk the cursor to the front of "aaa" and
    // type another "a": the text before and after cannot say WHICH of the four
    // was typed, because every answer produces "aaaa". The cursor after the
    // edit is the only thing that can, and this is the reason the derivation
    // is not a plain diff.
    //
    // 🔴 AND THE LETTERS COME OUT RIGHT EITHER WAY, which is what makes it
    // dangerous rather than merely wrong: each edit carries its own absolute
    // range, so a misplaced one does not corrupt the next. What it corrupts is
    // the CURSOR at that moment — invisible until somebody drags back to it,
    // which is the one thing this kind exists to make possible.
    const repeat = [...'aaa'].map((c) => ({ key: c })).concat(
      [{ key: 'ArrowLeft' }, { key: 'ArrowLeft' }, { key: 'ArrowLeft' }], [{ key: 'a' }]);
    const edits = asABoxWould(repeat).steps.filter((s) => s.range);
    const shows = (r) => `[${r[0]},${r[1]}]`;
    const ranges = (derive) => edits.map((s) => derive(s.before, s.after, s.caret).range);
    const withCursor = ranges(deriveOp);
    const onText = ranges((a, b) => shortestRange(a, b));
    const truthRanges = edits.map((s) => s.range);
    const wrong = (got) => got.filter((r, i) => r[0] !== truthRanges[i][0] || r[1] !== truthRanges[i][1]).length;
    const last = edits.length - 1;
    d.assert('where a letter repeats, the cursor settles which one was typed',
      wrong(withCursor) === 0 && wrong(onText) > 0,
      `typing a fourth "a" at the front of "aaa" is written down as `
      + `${shows(withCursor[last])} with the cursor and ${shows(onText[last])} without it, `
      + `truly ${shows(truthRanges[last])} · same letters either way, `
      + `${wrong(onText)} of ${truthRanges.length} ranges wrong, so the cursor comes back `
      + `at ${onText[last][0] + 1} instead of ${truthRanges[last][0] + 1}`);

    // ── the recording, played and rebuilt ─────────────────────────────────
    // Every edit applied one at a time against the whole prefix rebuilt from
    // nothing — two implementations, compared at every one of the edits.
    let step = blank(), agreed = 0, firstOff = null;
    for (let i = 0; i < rows.length; i++) {
      step = applyOne(step, rows[i].op);
      const whole = foldOps(rows.slice(0, i + 1).map((r) => ({ op: r.op })));
      if (same(step, whole)) agreed++;
      else if (firstOff === null) firstOff = i;
    }
    d.assert('every edit applied one at a time agrees with the document rebuilt from the start',
      rows.length > 0 && agreed === rows.length,
      `${agreed} of ${rows.length} moments, text and cursor both`
      + (firstOff === null ? '' : ` · first apart at edit ${firstOff}`));

    // Drag to three quiet places and read the BOX back — the browser's own
    // value and selection, not ours.
    // 🔴 THIS ONE DRAGS FOR YOU, WHICH IS THE THING A VISITOR CAME TO DO. It
    // seeks three times and waits two frames after each, so the playhead walks
    // and the text box rewrites itself three times in front of somebody who has
    // pressed nothing, on a page whose whole subject is that dragging works.
    if (SELFCHECK) {
      const probes = quietProbes(3);
      let restored = 0;
      const seen = [];
      for (const pos of probes) {
        deck.seek(pos);
        await nextFrame();
        const want = deck.reduceAt(KIND, pos);
        const got = { text: keys.value, selection: [keys.selectionStart, keys.selectionEnd] };
        seen.push(`${(pos / 1000).toFixed(2)}s ${got.text.length}ch [${got.selection}]`);
        if (same(want, got)) restored++;
      }
      d.assert('drag to any moment and the box holds that moment, cursor included',
        probes.length === 3 && restored === 3,
        `${restored} of ${probes.length} · ${seen.join(' · ')}`);
      deck.seek(0);
      await nextFrame();
    }

    // ── backwards ─────────────────────────────────────────────────────────
    /**
     * 🔴 NONE OF THIS PLAYS ANYTHING, AND THAT IS THE POINT. `/loops/` put it
     * in one line the same day: *"a check that waits for the playhead to reach
     * 6 s is a check that gets written to pass when it has not got there yet"*.
     * A backward lap is the bar seeking this deck frame by frame, so what these
     * grade is the thing the lap is made of — the fold at a position — read at
     * positions chosen here rather than reached by a clock.
     */
    const posAt = (i) => deck.toPos(rows[i].at);
    const mid = (i, j) => (posAt(i) + posAt(j)) / 2;
    const iDel = rows.findIndex((r) => r.op.type === OP_DELETE);
    const iSel = rows.findIndex((r) => r.op.type === OP_SELECT);

    // 🔴 THE CASE THAT DEFINES THE MODE. A deletion stores WHERE and HOW MUCH
    // and never what it took, so there is no inverse of it anywhere in this
    // file. Backwards works anyway, because the fold one moment earlier still
    // holds the letters: untyping is a shorter prefix, not an undo.
    const delOp = rows[iDel]?.op;
    const dBefore = iDel > 0 ? deck.reduceAt(KIND, mid(iDel - 1, iDel)) : null;
    const dAfter = iDel > 0 ? deck.reduceAt(KIND, mid(iDel, iDel + 1)) : null;
    const cameBack = dBefore ? dBefore.text.slice(delOp.range[0], delOp.range[1]) : '';
    d.assert('a backspace played backwards is the character it removed coming back',
      !!dBefore && !!dAfter && cameBack.length === delOp.range[1] - delOp.range[0]
        && cameBack.length > 0
        && dAfter.text === dBefore.text.slice(0, delOp.range[0]) + dBefore.text.slice(delOp.range[1]),
      `edit ${iDel} took ${JSON.stringify(cameBack)} out at ${delOp?.range[0]} · the document is `
      + `${dAfter?.text.length} characters on the forward side of it and ${dBefore?.text.length} `
      + `on the backward side, and nothing here stores an inverse of a deletion`);

    // ⚠️ THE OTHER HALF OF THE SAME CLAIM, on the one gesture that produces no
    // `input` event at all. A cursor move is a row like any other and the fold
    // carries the selection, so running backwards past one moves the caret and
    // leaves every letter where it is.
    const selOp = rows[iSel]?.op;
    const sBefore = iSel > 0 ? deck.reduceAt(KIND, mid(iSel - 1, iSel)) : null;
    const sAfter = iSel > 0 ? deck.reduceAt(KIND, mid(iSel, iSel + 1)) : null;
    d.assert('an arrow key played backwards puts the cursor back with not one letter moving',
      !!sBefore && !!sAfter && sBefore.text === sAfter.text
        && sBefore.selection[0] !== sAfter.selection[0]
        && sAfter.selection[0] === selOp.range[0],
      `edit ${iSel} moved the cursor from ${sBefore?.selection[0]} to ${sAfter?.selection[0]} `
      + `over the same ${sAfter?.text.length} characters`);

    /**
     * 🔴 TWO PASSES, A STRICT DIRECTION INSIDE EACH, AND EIGHT EVENTS IN BOTH.
     * The standard is `/loops/`'s from the same day. What is counted is how
     * many EDITS ARE IN FORCE at a position, which is the quantity untyping is
     * about: a lap running backwards may make the document longer wherever it
     * crosses a deletion, so text length cannot say which way it is going and
     * counting it would be measuring the wrong thing.
     */
    const inForce = (pos) => rows.filter((_, i) => posAt(i) <= pos).length;
    const lo = posAt(0), hi = posAt(rows.length - 1);
    const ramp = (a, b, n) => Array.from({ length: n }, (_, k) => a + (b - a) * (k / (n - 1)));
    const walk = (xs, sign) => {
      let strict = true, moved = 0;
      for (let i = 1; i < xs.length; i++) {
        const dx = (xs[i] - xs[i - 1]) * sign;
        if (dx < 0) strict = false;
        if (dx > 0) moved++;
      }
      return { strict, moved };
    };
    const downs = ramp(hi, lo, 24), ups = ramp(lo, hi, 24);
    const D = walk(downs.map(inForce), -1), U = walk(ups.map(inForce), 1);
    d.assert('a lap running backwards takes the edits off one at a time, and a forward one puts them on',
      D.strict && U.strict && D.moved >= 8 && U.moved >= 8,
      `24 places down the recording: ${D.moved} of them took edits off and none put any back · `
      + `the same 24 back up: ${U.moved} put edits on and none took any off`);

    // ⚠️ AND THE PICTURE AT EVERY ONE OF THOSE PLACES, not just the direction.
    // This is the deck's own seek, which binary-searches its cursor on a jump,
    // against the whole prefix folded from nothing — so a backward jump landing
    // on the wrong side of an edit shows up here and nowhere else.
    let tied = 0, firstLoose = null;
    for (const pos of downs) {
      const want = foldOps(rows.slice(0, inForce(pos)).map((r) => ({ op: r.op })));
      const got = deck.reduceAt(KIND, pos);
      if (got && same(want, got)) tied++;
      else if (firstLoose === null) firstLoose = +pos.toFixed(1);
    }
    d.assert('and at every one of them the document is the fold of exactly the edits in force',
      tied === downs.length,
      `${tied} of ${downs.length} places, walking backwards`
      + (firstLoose === null ? '' : ` · first apart at ${firstLoose} ms`));

    // 🔴 THE FIXTURE'S OWN NEGATIVE CONTROL, AND `/loops/` NEEDED ITS FIXTURE
    // CHANGED FOR WANT OF IT: its marks were their own mirror, so a backward
    // pass drew the forward picture and the control had no readout at all. This
    // recording is 24 characters typed, ten backspaced, then a paste and a
    // selection typed over, so the two directions cannot be confused.
    const lens = rows.map((_, i) => foldOps(rows.slice(0, i + 1).map((r) => ({ op: r.op }))).text.length);
    const apartAt = lens.findIndex((x, i) => x !== lens[lens.length - 1 - i]);
    d.assert('the recording is not its own mirror, so backwards is a different picture from forwards',
      apartAt >= 0,
      `${lens.length} moments · ${lens[0]} characters at the first and ${lens[lens.length - 1]} at the last, `
      + `first apart from its mirror at edit ${apartAt}`);

    if (SELFCHECK) {
      // The real control, pressed the way a finger does, read back off the bar
      // rather than off the glyph on its face.
      const wayBtn = bar.api.loopExtra('way');
      const turn = [bar.api.way];
      for (let i = 0; i < 3; i++) { wayBtn?.click(); turn.push(bar.api.way); }
      d.assert('one button turns through the three directions and comes back to the first',
        !!wayBtn && turn.join(' ') === 'round back pingpong round', turn.join(' '));

      /**
       * 🔴 THE ONE THING A BACKWARD LAP NEEDS THAT A FORWARD ONE DOES NOT, AND
       * IT IS DRIVEN RATHER THAN READ. `deck.playing()` is FALSE for the whole
       * of a reversed lap, so the test that hands the box over when the
       * transport takes it cannot see one, and a page that only looked there
       * would sweep the playhead across a frozen document. Set the box back to
       * being yours, arm a real loop with two real presses of Loop, and require
       * that the page let go of it WHILE THE DECK IS STOPPED — which is the
       * half that makes this different from pressing play.
       */
      while (bar.api.way !== 'back') wayBtn.click();
      capturing = true;
      deck.seek(posAt(5));
      bar.api.pressLoop();
      deck.seek(posAt(40));
      bar.api.pressLoop();
      const armed = { loop: bar.api.loop, playing: deck.playing(), yours: capturing };
      d.assert('a loop running backwards takes the box back, and the deck is stopped when it does',
        !armed.yours && !!armed.loop && armed.playing === false,
        `way ${bar.api.way}, loop ${armed.loop ? armed.loop.map((x) => x.toFixed(0)).join(' to ') : 'none'} ms, `
        + `deck playing ${armed.playing}, still yours to type into ${armed.yours}`);
      bar.api.pressLoop();                       // the third press takes it off
      while (bar.api.way !== 'round') wayBtn.click();
      deck.seek(0);
      await nextFrame();
    }

    // ── against the browser's own text ────────────────────────────────────
    const truth = header && header.truth;
    const whole = foldOps(rows.map((r) => ({ op: r.op })));
    d.assert('the whole recording rebuilds the text the browser itself had, character for character',
      !!truth && whole.text === truth.value
        && whole.selection[0] === truth.selStart && whole.selection[1] === truth.selEnd,
      truth ? `${whole.text.length} of ${truth.value.length} characters, cursor `
              + `[${whole.selection}] against the box's [${truth.selStart},${truth.selEnd}]`
            : 'the recording carries no text to be checked against');

    const again = toJsonl(rows, header);
    const back = fromJsonl(again);
    d.assert('the recording survives a round trip through a plain text file',
      again === src && back.rows.length === rows.length
        && foldOps(back.rows.map((r) => ({ op: r.op }))).text === whole.text,
      `${src.length} bytes, ${src.split('\n').length} lines, ${back.rows.length} edits back`);
  }

  // ── go ───────────────────────────────────────────────────────────────────
  // 🔴 IT OPENS ON YOUR OWN TYPING, NOT ON THE SHIPPED RECORDING. Asked for.
  // The page's first act was to play somebody else's document at you, so the
  // thing it is actually about — that YOUR typing is being written down as
  // edits — was two clicks away and most visitors never got there. Now the box
  // has the cursor in it and the line below is empty, and it fills as you type.
  // ⚠️ The recording is still SHIPPED and still the subject of eight checks:
  // it is a fixture, and a fixture does not have to be the opening screen.
  // `loadRecording()` still runs first, because the log lines and the checks
  // below are all about it — `startOwn()` then clears the page back to empty.
  const loaded = loadRecording();
  const ins = loaded.rows.filter((r) => r.op.type === OP_INSERT);
  const kinds = {};
  for (const r of ins) kinds[r.op.inputType || 'insertText'] = (kinds[r.op.inputType || 'insertText'] || 0) + 1;
  d.log(`the recording: ${loaded.rows.length} edits over `
    + `${(deck.durationMs / 1000).toFixed(1)}s, typed on ${(loaded.header.recorded || '').slice(0, 10)}`);
  d.log(`how it was typed: ${Object.entries(kinds).map(([k, v]) => `${v} ${k}`).join(', ')}`);
  // NOTES §3, carried onto the page: the browser has a way to tell an editor
  // exactly which part of the document an edit is about, and on a plain text
  // box it never does — the ranges live somewhere the page cannot reach.
  const offered = loaded.rows.filter((r) => r.meta).length;
  const withRange = loaded.rows.filter((r) => r.meta && r.meta.targetRanges > 0).length;
  d.log(`the browser named the part of the document being edited ${withRange} times in `
    + `${offered} chances, so the range comes from the text itself`);

  requestAnimationFrame(frame);
  d.ready();
  // 🔴 GRADE THE FIXTURE FIRST, THEN HAND THE PAGE OVER EMPTY — and the order
  // is load-bearing, not tidiness. `startOwn()` disposes the deck, destroys the
  // strip and empties the log, and `check()` reads all three; calling it first
  // took the page from **22 asserts to 7** while every remaining one stayed
  // green. That is this page's own lesson arriving from the other direction:
  // the count is the regression test, and nothing else would have said a word.
  // ⚠️ `check` is async — it awaits frames — so this cannot be two statements
  // in a row, it has to be chained.
  check(loaded).then(startOwn).catch((e) => d.fail(e));
</script>
</html>
