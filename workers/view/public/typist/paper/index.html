<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Paper</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta property="og:site_name" content="positron.studio">
<meta property="og:type" content="website">
<meta property="og:title" content="Paper">
<meta property="og:description" content="A sheet of white paper to type on, with a blocky cursor and a page that opens full screen.">
<meta property="og:url" content="https://positron.studio/typist/paper/">
<meta property="og:image" content="https://positron.studio/og/site-81ff476d.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/png">
<meta property="og:image:alt" content="positron.studio: Connect anything to everything. Create playful, interactive worlds, from the web up to the cloud and down to microcontrollers. Powered by Cloudflare services.">
<meta name="twitter:card" content="summary_large_image">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* concepts typist/000, PAPER, 2026-10-11. Asked: *"something which you
     similar to video panel, and there you have footer with full screen, and
     the top area is just white paper, white, and black or very dark type in
     our brand font, and there is also a cursor, a bit more blocky, and the
     first demo is just something you can type in, maybe a example message"*.
     Nothing here opens anything and nothing makes a sound (that is 010). */

  /* A phone gets a taller sheet, set through the panel's own custom property
     so the panel's full screen rule still wins. */
  @media (max-width: 560px) { .tp-panel .pos-vp-stage { --vp-aspect: 4 / 5; } }

  /* ── the sheet ──────────────────────────────────────────────────────────
     White paper filling the stage and scrolling inside itself, so a long page
     rolls up the way paper leaves a carriage. It is a size container, so the
     type and the margins follow the sheet rather than the window, and a sheet
     in full screen gets the same proportions as one on the page. */
  .tp { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain;
        container-type: inline-size; background: #fff; cursor: text;
        /* the margins of a typed page: more air above than at the sides */
        padding: clamp(24px, 8cqi, 72px) clamp(20px, 7cqi, 64px); }

  /* ── the line ───────────────────────────────────────────────────────────
     ONE BOX, TWO LAYERS PINNED TOGETHER, the way /typist/ does it. The
     <textarea> on top is invisible and takes every keystroke and every tap
     (so a phone opens its keyboard); the <pre> underneath draws the text and
     the cursor at the offsets the browser reports. Both carry `.tp-type` and
     NOTHING else sets a metric on either, or they drift apart by a character.
     The column is about 64 characters, a typewriter's line on a letter sheet
     at ten to the inch, and never wider than the sheet. */
  .tp-col { position: relative; max-inline-size: 64ch; margin-inline: auto; min-block-size: 100%;
            font: 400 clamp(16px, 2.6cqi, 22px)/1.75 var(--brand); }
  .tp-type { font: inherit; letter-spacing: 0; font-variant-ligatures: none; tab-size: 4;
             margin: 0; padding: 0; border: 0;
             white-space: pre-wrap; overflow-wrap: break-word; word-break: break-word; }
  .tp-paper { color: #16161a; min-block-size: 100%; }
  .tp-keys { position: absolute; inset: 0; width: 100%; height: 100%; display: block;
             resize: none; outline: 0; overflow: hidden; background: transparent;
             color: transparent; caret-color: transparent; -webkit-touch-callout: none; }
  .tp-keys::selection { background: transparent; }

  /* ── the cursor ─────────────────────────────────────────────────────────
     A FILLED BAR 0.4 CHARACTER WIDE, filled whether or not the paper has
     focus (asked: *"typist: always filled cursor"*, *"but thinner"*). It
     takes no width in the flow (a zero width span with the bar drawn by its
     ::after), so the line in the <pre> stays exactly the line in the
     <textarea>. Drawn white over the sheet with `difference`, it reads black
     and turns what it covers white. Without focus it stays and does not
     blink. */
  .tp-cur { position: relative; }
  .tp-cur::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 0.4ch;
                   background: #fff; mix-blend-mode: difference;
                   animation: tp-blink 1.06s steps(1) infinite; }
  .tp:not(.on) .tp-cur::after { animation: none; }
  @keyframes tp-blink { 0%, 54% { opacity: 1 } 55%, 100% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { .tp-cur::after { animation: none; } }
  .tp-sel { background: rgba(22, 22, 26, .16); }
</style>
<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';

  const d = mount({ name: 'Paper', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('typist/paper');

  const EXAMPLE = 'This is a sheet of paper.\nTap it and keep typing.';

  // ── the sheet ────────────────────────────────────────────────────────────
  const sheet = el('div', 'tp');
  const col = el('div', 'tp-col');
  const paper = el('pre', 'tp-type tp-paper', null, { 'aria-hidden': 'true' });
  // `data-typing` tells verify.mjs to type into this element rather than click it.
  const keys = el('textarea', 'tp-type tp-keys', null, {
    spellcheck: 'false', autocomplete: 'off', autocorrect: 'off', autocapitalize: 'sentences',
    'aria-label': 'the paper', 'data-typing': 'paper',
  });
  col.append(paper, keys);
  sheet.append(col);

  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  /** The text, and the cursor or the highlight exactly where the textarea's offsets say. */
  function draw() {
    const t = keys.value;
    const a = keys.selectionStart, b = keys.selectionEnd;
    const mid = a === b ? '<span class="tp-cur"></span>' : `<span class="tp-sel">${esc(t.slice(a, b))}</span>`;
    // the zero width space gives a trailing newline a line of its own, as the textarea has
    paper.innerHTML = esc(t.slice(0, a)) + mid + esc(t.slice(b)) + '​';
    follow();
  }

  /** The carriage: keep the cursor's line in view, one line of air under it. */
  function follow() {
    const cur = paper.querySelector('.tp-cur, .tp-sel');
    if (!cur) return;
    const s = sheet.getBoundingClientRect(), c = cur.getBoundingClientRect();
    const line = parseFloat(getComputedStyle(col).lineHeight) || 28;
    if (c.bottom + line > s.bottom) sheet.scrollTop += c.bottom + line - s.bottom;
    else if (c.top - line < s.top) sheet.scrollTop -= s.top - (c.top - line);
  }

  // ── the patchbay (asked 2026-10-11, *"can we patchbay 000?"*) ───────────
  // The keyboard is a node whose typing leaves on `keys:value-out`, shaped
  // text; the paper takes it on `paper:value-in`. One link, inside this tab.
  // Every keystroke is one event along it, so the wire pulses as you type;
  // the paper draws from the textarea as before.
  const S = 'web';
  const bay = createBay();
  bay.addNode({ id: `${S}:keys`, kind: 'person', label: 'keyboard', place: 'browser' });
  bay.addNode({ id: `${S}:paper`, kind: 'screen', label: 'paper', place: 'browser' });
  bay.addPort({ id: `${S}:keys:value-out`, dir: 'out', medium: 'value', shape: { of: 'text' } });
  bay.addPort({ id: `${S}:paper:value-in`, dir: 'in', medium: 'value', shape: { of: 'text' }, deliver: () => {} });
  bay.link(`${S}:keys:value-out`, `${S}:paper:value-in`);
  keys.addEventListener('input', (e) => bay.send(`${S}:keys:value-out`, { text: e.data || '', kind: e.inputType }));

  for (const ev of ['input', 'select', 'keyup', 'pointerup']) keys.addEventListener(ev, draw);
  document.addEventListener('selectionchange', () => { if (document.activeElement === keys) draw(); });
  keys.addEventListener('focus', () => { sheet.classList.add('on'); draw(); });
  keys.addEventListener('blur', () => sheet.classList.remove('on'));
  // A tap in the margins lands on the sheet, not the textarea: focus it, cursor at the end.
  sheet.addEventListener('click', (e) => {
    if (e.target === keys) return;
    keys.focus({ preventScroll: true });
    keys.setSelectionRange(keys.value.length, keys.value.length);
    draw();
  });

  keys.value = EXAMPLE;
  keys.setSelectionRange(EXAMPLE.length, EXAMPLE.length);

  // ── the frame ────────────────────────────────────────────────────────────
  const panel = createVideoPanel({ left: false, fullMode: 'footer' });
  panel.el.classList.add('tp-panel');
  panel.stage.append(sheet);
  const pb = createPatchbay(bay, { detail: (n) => [{ text: n.label, sans: true }] });
  d.stack.add(panel.el, pb.el);
  draw();
  keys.focus({ preventScroll: true });

  d.ready();
</script>
