<!doctype html>
<html lang="en">

<title>Typewriter</title>

<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* concepts typist/010, TYPEWRITER, 2026-10-11. 000's paper plus a
     typewriter sounding every key. Asked: *"Second one is type with sound. So
     there is a sample which comes from our storage, similar where the NOLA
     samples are coming, but the sample is has to be public domain typewriter
     sound"*, *"more like a sampler"*. The sounds are nine CC0 cuts of a Hermes
     Precisa 305 in our R2 bucket, provenance in `SOURCES.md` beside this page.
     Nothing is fetched until the first key press. */

  /* A phone gets a taller sheet, set through the panel's own custom property
     so the panel's full screen rule still wins. */
  @media (max-width: 560px) { .tp-panel .pos-vp-stage { --vp-aspect: 4 / 5; } }

  /* ── the sheet ──────────────────────────────────────────────────────────
     White paper filling the stage and scrolling inside itself, so a long page
     rolls up the way paper leaves a carriage. It is a size container, so the
     type and the margins follow the sheet rather than the window, and a sheet
     in full screen gets the same proportions as one on the page. */
  .tp { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain;
        container-type: inline-size; background: #fff; cursor: text;
        /* the margins of a typed page: more air above than at the sides */
        padding: clamp(24px, 8cqi, 72px) clamp(20px, 7cqi, 64px); }

  /* ── the line ───────────────────────────────────────────────────────────
     ONE BOX, TWO LAYERS PINNED TOGETHER, the way /typist/ does it. The
     <textarea> on top is invisible and takes every keystroke and every tap
     (so a phone opens its keyboard); the <pre> underneath draws the text and
     the cursor at the offsets the browser reports. Both carry `.tp-type` and
     NOTHING else sets a metric on either, or they drift apart by a character.
     The column is about 64 characters, a typewriter's line on a letter sheet
     at ten to the inch, and never wider than the sheet. */
  .tp-col { position: relative; max-inline-size: 64ch; margin-inline: auto; min-block-size: 100%;
            font: 400 clamp(16px, 2.6cqi, 22px)/1.75 var(--brand); }
  .tp-type { font: inherit; letter-spacing: 0; font-variant-ligatures: none; tab-size: 4;
             margin: 0; padding: 0; border: 0;
             white-space: pre-wrap; overflow-wrap: break-word; word-break: break-word; }
  .tp-paper { color: #16161a; min-block-size: 100%; }
  .tp-keys { position: absolute; inset: 0; width: 100%; height: 100%; display: block;
             resize: none; outline: 0; overflow: hidden; background: transparent;
             color: transparent; caret-color: transparent; -webkit-touch-callout: none; }
  .tp-keys::selection { background: transparent; }

  /* ── the cursor ─────────────────────────────────────────────────────────
     A FILLED BAR 0.4 CHARACTER WIDE, filled whether or not the paper has
     focus (asked: *"typist: always filled cursor"*, *"but thinner"*). It
     takes no width in the flow (a zero width span with the bar drawn by its
     ::after), so the line in the <pre> stays exactly the line in the
     <textarea>. Drawn white over the sheet with `difference`, it reads black
     and turns what it covers white. Without focus it stays and does not
     blink. */
  .tp-cur { position: relative; }
  .tp-cur::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 0.4ch;
                   background: #fff; mix-blend-mode: difference;
                   animation: tp-blink 1.06s steps(1) infinite; }
  .tp:not(.on) .tp-cur::after { animation: none; }
  @keyframes tp-blink { 0%, 54% { opacity: 1 } 55%, 100% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { .tp-cur::after { animation: none; } }
  .tp-sel { background: rgba(22, 22, 26, .16); }
</style>
<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createIconButton } from '/shell/icon-button.mjs';

  const d = mount({ name: 'Typewriter', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('typist/typewriter');

  const EXAMPLE = 'This is a sheet of paper in a typewriter.\nEvery key you press strikes it.';

  // ── the sheet ────────────────────────────────────────────────────────────
  const sheet = el('div', 'tp');
  const col = el('div', 'tp-col');
  const paper = el('pre', 'tp-type tp-paper', null, { 'aria-hidden': 'true' });
  // `data-typing` tells verify.mjs to type into this element rather than click it.
  const keys = el('textarea', 'tp-type tp-keys', null, {
    spellcheck: 'false', autocomplete: 'off', autocorrect: 'off', autocapitalize: 'sentences',
    'aria-label': 'the paper', 'data-typing': 'paper',
  });
  col.append(paper, keys);
  sheet.append(col);

  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  /** The text, and the cursor or the highlight exactly where the textarea's offsets say. */
  function draw() {
    const t = keys.value;
    const a = keys.selectionStart, b = keys.selectionEnd;
    const mid = a === b ? '<span class="tp-cur"></span>' : `<span class="tp-sel">${esc(t.slice(a, b))}</span>`;
    // the zero width space gives a trailing newline a line of its own, as the textarea has
    paper.innerHTML = esc(t.slice(0, a)) + mid + esc(t.slice(b)) + '​';
    follow();
  }

  /** The carriage: keep the cursor's line in view, one line of air under it. */
  function follow() {
    const cur = paper.querySelector('.tp-cur, .tp-sel');
    if (!cur) return;
    const s = sheet.getBoundingClientRect(), c = cur.getBoundingClientRect();
    const line = parseFloat(getComputedStyle(col).lineHeight) || 28;
    if (c.bottom + line > s.bottom) sheet.scrollTop += c.bottom + line - s.bottom;
    else if (c.top - line < s.top) sheet.scrollTop -= s.top - (c.top - line);
  }

  // ── the typewriter: a sampler of one Hermes Precisa 305 ─────────────────
  // Nine short files from our R2 bucket, decoded once into AudioBuffers and
  // played with one AudioBufferSourceNode per key, so a press costs no fetch
  // and no decode. NOTHING OPENS ON A VISIT: the AudioContext is made and the
  // files are fetched on the first key press, which is also the gesture a
  // browser needs before it lets a page make sound.
  // R2, through the station worker's /media/ door, which answers CORS for any origin.
  const BASE = 'https://positron-station.kristjan-jansen.workers.dev/media/typewriter/hermes-precisa-305/';
  const FILES = ['key-1', 'key-2', 'key-3', 'key-4', 'key-5', 'space', 'bell-1', 'bell-2', 'return'];
  const STRIKES = ['key-1', 'key-2', 'key-3', 'key-4', 'key-5'];
  // The space bar was recorded about 14 dB under a strike; lifted to sit with them.
  const LEVEL = { space: 2.4, 'bell-1': 0.55, 'bell-2': 0.55, return: 0.8 };
  const BELL_AT = 64 - 8;   // a typewriter rings eight characters before the margin
  const LATE = 150;         // ms: a press that waited longer than this for the files is dropped, not played late

  let ctx = null, out = null, loading = null, muted = false, lastStrike = -1, until = 0, fetchedAt = 0;
  const buf = new Map();
  const stat = { decoded: 0, started: 0, dropped: 0, ms: 0, bytes: 0 };

  function wake() {
    if (ctx) return loading;
    ctx = new AudioContext({ latencyHint: 'interactive' });
    out = ctx.createGain();
    out.connect(ctx.destination);
    const t0 = performance.now();
    loading = Promise.all(FILES.map(async (f) => {
      const r = await fetch(BASE + f + '.mp3');
      if (!r.ok) throw new Error(`${f}.mp3 answered ${r.status}`);
      const ab = await r.arrayBuffer();
      stat.bytes += ab.byteLength;
      buf.set(f, await ctx.decodeAudioData(ab));
      stat.decoded++;
    })).then(() => { stat.ms = Math.round(performance.now() - t0); fetchedAt = performance.now(); })
      .catch((e) => d.log(`the typewriter did not load: ${e.message}`, 'warn'));
    return loading;
  }

  function play(name, { rate = 1, gain = 1 } = {}) {
    const b = buf.get(name);
    if (!b || muted) return;
    const src = ctx.createBufferSource();
    const g = ctx.createGain();
    src.buffer = b;
    src.playbackRate.value = rate;
    g.gain.value = gain * (LEVEL[name] ?? 1);
    src.connect(g).connect(out);
    src.start();
    stat.started++;
    until = Math.max(until, ctx.currentTime + b.duration / rate);
  }

  const jitter = (w) => 1 + (Math.random() * 2 - 1) * w;
  /** A letter: one of five strikes, never the same twice running, a little off in pitch and weight. */
  function strike(o = {}) {
    let i = Math.floor(Math.random() * STRIKES.length);
    if (i === lastStrike) i = (i + 1) % STRIKES.length;
    lastStrike = i;
    play(STRIKES[i], { rate: jitter(0.035) * (o.rate || 1), gain: jitter(0.12) * (o.gain || 1) });
  }

  /** The column the cursor is in on its line, as a typewriter's carriage counts it. */
  const column = () => { const a = keys.selectionStart; return a - (keys.value.lastIndexOf('\n', a - 1) + 1); };

  /** What one input sounds like. */
  function sound(e) {
    const t = e.inputType || '';
    if (t === 'insertLineBreak' || t === 'insertParagraph') return play('return');
    if (t.startsWith('delete')) return strike({ rate: 0.78, gain: 0.6 });   // no backspace was recorded: a strike, lower and softer
    if (t.startsWith('insert')) {
      if (e.data === ' ') play('space');
      else strike();
      if (column() % 64 === BELL_AT) play(Math.random() < 0.5 ? 'bell-1' : 'bell-2');
    }
  }

  function typed(e) {
    if (muted) return;
    const at = performance.now();
    // The press that wakes the typewriter always sounds, however long the
    // samples took (asked 2026-10-11, *"first typing is not hear"*).
    const first = !ctx;
    const go = () => { if (first || performance.now() - at < LATE) sound(e); else stat.dropped++; };
    if (stat.decoded === FILES.length) go();
    else wake().then(go);
  }

  // ── the patchbay ─────────────────────────────────────────────────────────
  // 000's keyboard to paper, plus the keyboard to the typewriter, the
  // typewriter to the speaker, and the files the typewriter plays coming from
  // our R2 bucket. The bucket is a node of this page's own bay and announces
  // nothing (asked: *"web:typewriter has lins to cf storate"*).
  const S = 'web', CF = 'cf-r2';
  const bay = createBay();
  bay.addNode({ id: `${S}:keys`, kind: 'person', label: 'keyboard', place: 'browser' });
  bay.addNode({ id: `${S}:paper`, kind: 'screen', label: 'paper', place: 'browser' });
  bay.addNode({ id: `${S}:typewriter`, kind: 'engine', label: 'typewriter', place: 'browser' });
  bay.addNode({ id: `${S}:speaker`, kind: 'screen', label: 'speakers', place: 'browser' });
  bay.addNode({ id: `${CF}:typewriter`, kind: 'store', label: 'samples', place: 'cloudflare', net: 'cloudflare' });
  bay.addPort({ id: `${S}:keys:value-out`, dir: 'out', medium: 'value', shape: { of: 'text' } });
  bay.addPort({ id: `${S}:paper:value-in`, dir: 'in', medium: 'value', shape: { of: 'text' }, deliver: () => {} });
  bay.addPort({ id: `${S}:typewriter:value-in`, dir: 'in', medium: 'value', shape: { of: 'text' }, deliver: () => {} });
  bay.addPort({ id: `${S}:typewriter:file-in`, dir: 'in', medium: 'file' });
  bay.addPort({ id: `${S}:typewriter:audio-out`, dir: 'out', medium: 'audio' });
  bay.addPort({ id: `${S}:speaker:audio-in`, dir: 'in', medium: 'audio' });
  bay.addPort({ id: `${CF}:typewriter:file-out`, dir: 'out', medium: 'file', transports: ['https'] });
  for (const [a, b] of [
    [`${S}:keys:value-out`, `${S}:paper:value-in`],
    [`${S}:keys:value-out`, `${S}:typewriter:value-in`],
    [`${CF}:typewriter:file-out`, `${S}:typewriter:file-in`],
    [`${S}:typewriter:audio-out`, `${S}:speaker:audio-in`],
  ]) {
    const r = bay.link(a, b, [], { site: S });
    if (!r.ok) d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
  }
  keys.addEventListener('input', (e) => {
    bay.send(`${S}:keys:value-out`, { text: e.data || '', kind: e.inputType });
    typed(e);
  });

  // `file` and `audio` are stream media on the wire, lit rather than pulsed.
  // The file wire is lit while the samples come down and for 600 ms after, so
  // a fetch from the local server is still seen; the audio wire while a
  // sample sounds.
  const flowing = (l, medium) => {
    if (medium === 'file') return !!loading && (stat.decoded < FILES.length || performance.now() - fetchedAt < 600);
    if (medium === 'audio') return !!ctx && !muted && ctx.currentTime < until;
    return false;
  };

  for (const ev of ['input', 'select', 'keyup', 'pointerup']) keys.addEventListener(ev, draw);
  document.addEventListener('selectionchange', () => { if (document.activeElement === keys) draw(); });
  keys.addEventListener('focus', () => { sheet.classList.add('on'); draw(); });
  keys.addEventListener('blur', () => sheet.classList.remove('on'));
  // A tap in the margins lands on the sheet, not the textarea: focus it, cursor at the end.
  sheet.addEventListener('click', (e) => {
    if (e.target === keys) return;
    keys.focus({ preventScroll: true });
    keys.setSelectionRange(keys.value.length, keys.value.length);
    draw();
  });

  keys.value = EXAMPLE;
  keys.setSelectionRange(EXAMPLE.length, EXAMPLE.length);

  // ── the frame ────────────────────────────────────────────────────────────
  // Sound on by default, and a mute in the footer's left slot. Muting before
  // the first key press means nothing is ever fetched.
  const mute = createIconButton({ icon: 'volume', label: 'mute the typewriter', pressed: false, onPress: () => {
    muted = !muted;
    mute.pressed(muted);
    mute.set(muted ? 'mute' : 'volume', muted ? 'unmute the typewriter' : 'mute the typewriter');
    if (out) out.gain.value = muted ? 0 : 1;
    keys.focus({ preventScroll: true });
  } });
  const panel = createVideoPanel({ left: mute.el, fullMode: 'footer' });
  panel.el.classList.add('tp-panel');
  panel.stage.append(sheet);
  const pb = createPatchbay(bay, { detail: (n) => [{ text: n.label, sans: true }], flowing });
  d.stack.add(panel.el, pb.el);
  draw();
  keys.focus({ preventScroll: true });

  // Read only, for a check over CDP: what was decoded, how many sounds started.
  window.__demo.typewriter = {
    get stat() { return { ...stat, muted, state: ctx?.state || 'none' }; },
    get buffers() { return [...buf].map(([k, b]) => ({ name: k, s: +b.duration.toFixed(3), rate: b.sampleRate })); },
  };

  d.ready();
</script>
