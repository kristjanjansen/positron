<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* Layout only. The border, radius and background come from `shell.css`'s one
     `video` rule now, so this page looks like the cards around it instead of
     carrying its own frame; the canvas matches it by hand because a shell-wide
     `canvas` rule would hit the strip. */
  /* STACKED, and wide. The shared pattern is drawn on a 1280 grid, so at the
     300 px these panes used to be its clock rendered ~18 px and its smaller
     lines ~5 px — a picture whose whole job is to be READ, too small to read.
     Side by side cost more than it bought. */
  /* SIDE BY SIDE, and stacked when there is no room. The source and the line
     are the two things you compare — reading a seek means looking at both — and
     a column puts one off the screen while you look at the other.
     `auto-fit` with a 300 px floor is what makes that safe: two columns on a
     normal card, ONE FULL-WIDTH COLUMN on a phone, rather than two panes
     squeezed to 160 px where the pattern stops being readable at all. */
  .stage { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
           gap: 10px; margin: 0 0 10px; align-items: start; }
  .stage figure { margin: 0; width: 100%; }
  .stage canvas { display: block; width: 100%; background: var(--card);
                  border: 1px solid var(--line); border-radius: 4px; }
  /* ONE VIEWPORT for the whole sequence: every part's element is stacked in the
     same box and only the one under the playhead is shown. Parts laid end to
     end mean exactly one is live at a time, so a gallery of N pictures would
     draw a claim the timeline does not make. */
  .seq { position: relative; width: 100%; aspect-ratio: 16 / 9; }
  .seq video { position: absolute; inset: 0; width: 100%; height: 100%; }
  .seq video[hidden] { display: none; }
</style>


<script type="module">
  import { mount, guard, recorderMime, el, armVideo } from '/shell/shell.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createStripView } from '/shell/strip.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { mediaMaster } from '/timeline/media-master.mjs';
  import { burn, videoHue, drawCamera } from '/shell/pattern.mjs';

  const CAP_MS   = 10_000;   // a backstop, not the mechanism — stop is manual
  const SLICE_MS = 500;      // the timeslice we ask MediaRecorder for
  const FPS      = 25;       // what we capture at, so one frame is 1000/FPS ms
  const FRAME_MS = 1000 / FPS;

  const d = mount({
    name: 'take',
    what: 'Record, then record again. Each take is laid on the line after the one before it, and the whole thing plays and scrubs as one.',
    readout: { takes: '', line: 's', mime: '', kib: 'KiB', handovers: '' },
    controls: [{ id: 'camera', label: 'Use the camera' }],
  });
  guard(d);

  d.how(
    `The big number is the position on the line — the same one the bar shows. ` +
    `Drag the line and the picture says whether it went where you asked. The ` +
    `blocks underneath are that same time in a form a program can read back out ` +
    `of the pixels, and the square crosses once every ten seconds. Each take ` +
    `gets its own colour.`,
  );

  // ── the generated source ─────────────────────────────────────────────────
  //
  // A CANVAS, not a camera, so the page has a picture with no permission and
  // the suite can reach the thing this demo is about. The camera is an option
  // that draws UNDERNEATH: the burned clock survives either way, because the
  // clock is the whole reason a scrub is checkable by eye rather than trusted.
  //
  // The burn is this project's own technique — the MoQ and WHEP glass-to-glass
  // numbers were read off burned pixels — and the spelling is `record`'s and
  // `capture`'s, not a third one.
  // 1280x720 because the shared pattern's machine-readable row is frozen on a
  // 1280 grid (40 px in, 56 blocks of 20). The 640x360 variant in proto/m2m is
  // a DIFFERENT spec with an extra id byte, not this one scaled down.
  const W = 1280, H = 720;
  const canvas = el('canvas');
  canvas.width = W; canvas.height = H;
  const g = canvas.getContext('2d');

  const stage = el('div', 'stage');
  const srcFig = el('figure');
  srcFig.append(canvas, el('figcaption', 'd-cap', 'source'));
  const seqFig = el('figure');
  const seq = el('div', 'seq');
  const seqCap = el('figcaption', 'd-cap', 'playback');
  seqFig.append(seq, seqCap);
  stage.append(srcFig, seqFig);
  d.el.append(stage);

  // A COLOUR PER TAKE, from the take's INDEX — not from anything random. Two
  // random hues can land five degrees apart, and then two parts on the line are
  // indistinguishable, which is the whole failure the colour exists to prevent.
  // An index picks one guaranteed far from its neighbours'. `videoHue` keeps it
  // inside the shared video band, so a take is recognisably the same family as
  // everything else this project generates, and the strip paints its lane from
  // the same number the frames are burned with.
  const hueOf = (i) => videoHue(i);

  // Declared HERE, above `drawFrame`, because the first frame is painted
  // during module evaluation and a `let` further down is in its temporal dead
  // zone at that moment — which surfaces as `__demo.ready false`, not as a
  // drawing bug. That exact mistake cost six pages once already.
  const parts = [];   // { n, hue, mime, chunks[], blobs[], bytes, recordedMs,
                      //   fileMs, startMs, lenMs, video }
  let recording = null;
  let totalMs = 0;    // where the line currently ends — the next take's start
  let camStream = null;
  const ink = (h, s, l, a = 1) => `hsla(${h}, ${s}%, ${l}%, ${a})`;

  // WHAT IS BURNED IS THE POSITION, not the time of day. `record` and `capture`
  // burn `toISOString()` because their question is glass-to-glass — "how long
  // did this frame take to arrive" — and wall time is exactly right for that.
  // The question HERE is "did the seek land", and the only number that answers
  // it without arithmetic is where the frame sits on the line. A reader drags
  // to 6.5 s, reads 6.5 off the picture, and the claim checks itself.
  //
  // The offset is known at record time: parts are appended, so a take starting
  // now starts at `totalMs`, and only one recording runs at a time.
  let previewT0 = performance.now();
  let frame = 0;

  function drawFrame() {
    const rec = recording;
    const hue = rec ? rec.part.hue : hueOf(parts.length);
    const start = rec ? rec.part.startMs : totalMs;
    // How far into THIS take. While recording that is real elapsed time; in
    // preview it is a REHEARSAL of the same number, wrapped at the cap — an
    // unwrapped preview counter reads `35.42s ON THE LINE` on a 13 s line,
    // which is the page contradicting its own transport bar.
    const raw = performance.now() - (rec ? rec.t0 : previewT0);
    const into = rec ? raw : raw % CAP_MS;
    const line = start + into;                // where that sits on the line
    frame++;

    // The camera goes UNDER the pattern, scrimmed, so the burned clock stays
    // readable over whatever is in front of the lens.
    const cam = camStream && live.readyState >= 2 && drawCamera(g, live, W, H);

    // ONE test pattern across this project. Same module the MoQ path burns and
    // the same one `publish.sh` generates its ffmpeg filter from, so a frame
    // recorded here and a frame off the wire are the same picture — which is
    // the point: they get compared. `position` swaps the second clock from wall
    // time to POSITION ON THE LINE, the quantity the transport bar shows, so a
    // scrub can be checked against the picture with no arithmetic.
    // POSITION ONLY WHILE RECORDING. Before that this picture is not on the
    // line at all, and a free-running rehearsal counter said otherwise — it
    // read `00:08.619` beside a transport bar reading `0:05.099` total, which
    // is the page contradicting itself in two places a reader is meant to
    // compare. Not recording, the frame shows the wall clock, which is the
    // honest answer to "where is this?": nowhere yet.
    burn(g, W, H, frame, { hue, field: !cam, ...(rec ? { position: line / 1000 } : {}) });
  }
  setInterval(() => {
    drawFrame();
    // While recording, the strip is animating — repaint it with the picture.
    // `paint()` otherwise runs once per blob (every 500 ms), which draws the
    // take in visible steps rather than growing.
    if (recording) { paint(); view.strip.invalidate(); }
  }, 40);
  drawFrame();

  // the camera preview never reaches the timeline; it is a texture for the burn
  const live = el('video', '', null, { playsinline: '', muted: '' });
  live.muted = true; live.hidden = true;
  d.el.append(live);
  d.on('camera', async () => {
    if (camStream) return;
    try {
      camStream = await navigator.mediaDevices.getUserMedia({
        video: { width: 640, height: 360, frameRate: 25 }, audio: false,
      });
      live.srcObject = camStream;
      live.play().catch(() => {});
      d.button('camera').disabled = true;
      d.button('camera').textContent = 'Camera on';
      d.log(`camera on: ${camStream.getVideoTracks()[0].label || 'default'}`, 'hi');
    } catch (e) {
      // report the CAPABILITY, not an error string — the lesson @moq/net taught.
      // The page keeps working: the generated picture is the source either way.
      camStream = null;
      d.log(`camera: ${e.name} — staying on the generated picture`, 'bad');
    }
  });

  // ── the line ─────────────────────────────────────────────────────────────
  //
  // ONE DECK for the page's life — the bar and the strip bind theirs at
  // construction, so a deck built later leaves both pointing at something
  // nobody is playing. `setRange` grows as takes are appended.
  const deck = createDeck({ items: [], adapters: {}, range: [0, CAP_MS] });
  let active = null;                 // the part under the playhead
  const handovers = [];              // every change of that

  const partAt = (ms) => {
    for (let i = parts.length - 1; i >= 0; i--) if (ms >= parts[i].startMs) return parts[i];
    return parts[0] || null;
  };
  const localOf = (p, ms) =>
    Math.max(0, Math.min((p.lenMs ?? 0) - 40, ms - p.startMs)) / 1000;

  // WHICH ELEMENT MASTERS THE CLOCK — and this layout is the reason it has an
  // answer at all. `media-master` L1 says the picture is ground truth and the
  // vector is what bends; two pictures playing at once give that law two
  // ground truths and it has no answer. Laid end to end, EXACTLY ONE part is
  // under the playhead, so the part being played is the master, the law holds
  // unchanged, and the handover below is the only new thing to get right.
  const mm = mediaMaster(deck, () => {
    const p = active;
    if (!p || !p.video) return null;
    return { el: p.video, pos: p.startMs + p.video.currentTime * 1000, key: `take${p.n}` };
  }, {
    autoPlayPause: false,            // a part ENDING is a handover here, not a stop
    onEvent: (e) => d.log(`clock: ${e.reason}${e.key ? ` · ${e.key}` : ''}`),
  });

  function handOver(p, pos, why) {
    const from = active;
    if (from && from.video) { from.video.pause(); from.video.hidden = true; }
    active = p;
    if (!p) { seqCap.textContent = 'playback'; return; }
    p.video.hidden = false;
    const want = localOf(p, pos);
    if (Math.abs(p.video.currentTime - want) > 0.08) p.video.currentTime = want;
    seqCap.textContent = `playback · take ${p.n}`;
    if (from !== p) handovers.push({ at: pos, from: from ? from.n : null, to: p.n, why });
    mm.release('handover');          // a clean re-acquire on the new key
  }

  // EVERY SEEK IS A COMMAND TO THE ELEMENT. The strip, the bar's restart and
  // the checks all call `deck.seek()`, and with a media master attached that
  // alone does nothing visible — L1 means mediaMaster reads the picture, sees
  // the vector has wandered, and pulls it straight back. So one mirror, here,
  // for every seek that did not come from the servo itself (L2's own
  // `deck.seek` on a jump would otherwise chase its tail).
  const seeks = [];
  let pendingSeek = null, inServo = false;
  deck.transport.onState((st) => {
    if (st.reason !== 'seek' || inServo || !parts.length) return;
    const pos = st.p0;
    const p = partAt(pos);
    if (!p) return;
    if (p !== active) handOver(p, pos, 'seek');
    pendingSeek = pos;
    p.video.currentTime = localOf(p, pos);
  });

  function onSeeked(p) {
    if (pendingSeek === null || p !== active) return;
    const got = p.startMs + p.video.currentTime * 1000;
    seeks.push({ asked: pendingSeek, got, offMs: got - pendingSeek, part: p.n });
    pendingSeek = null;
    paint();
  }

  let rafOn = false;
  function tick() {
    if (!parts.length) return;
    const playing = deck.playing();
    let pos = deck.position();

    // A PART RUNNING OUT IS A HANDOVER, not a stop — and it has to be resolved
    // BEFORE the servo reads an ended element as the clock, or the playhead
    // pins itself to the boundary and the rest of the line never plays.
    if (active && active.video.ended) {
      const next = parts[parts.indexOf(active) + 1];
      if (next) pos = next.startMs;
      else if (playing) { deck.pause(); d.log('the line ran out'); }
    }
    const want = partAt(pos);
    if (want && want !== active) handOver(want, pos, 'boundary');

    if (active && active.video) {
      if (playing && active.video.paused && !active.video.ended) active.video.play().catch(() => {});
      if (!playing && !active.video.paused) active.video.pause();
    }
    inServo = true;
    try { mm.tick(); } finally { inServo = false; }
  }

  // ── recording ────────────────────────────────────────────────────────────
  // Every chunk is stamped when it ARRIVES, the only instant this API offers.
  // It is NOT when the frames inside it were captured: MediaRecorder publishes
  // no per-chunk capture timestamp, so "how old is this blob's oldest frame" is
  // not observable here and this page does not pretend to know it.
  function startRecording(capMs = CAP_MS) {
    if (recording) { d.log('already recording'); return; }
    const mime = recorderMime(d);
    if (!mime) return;
    const stream = canvas.captureStream(FPS);
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 900_000 });
    const part = {
      n: parts.length + 1, hue: hueOf(parts.length), mime,
      chunks: [], blobs: [], bytes: 0, recordedMs: null, fileMs: null,
      // KNOWN NOW, not when it lands: a take is appended, so it starts where
      // the line currently ends — and only one recording runs at a time, so
      // nothing can move it underneath. This is what lets the frames carry
      // their own position on the line rather than their offset into the take.
      startMs: totalMs, lenMs: null, video: null, capMs,
    };
    const t0 = performance.now();
    let lastAt = 0;
    rec.ondataavailable = (e) => {
      if (!e.data || !e.data.size) return;
      const at = performance.now() - t0;
      part.chunks.push({ at, size: e.data.size, gapMs: part.chunks.length ? at - lastAt : at });
      lastAt = at;
      part.blobs.push(e.data);
      part.bytes += e.data.size;
      paint();
    };
    rec.onerror = (ev) => d.log(`recorder: ${ev.error?.name ?? 'error'}`, 'bad');
    rec.onstop = async () => {
      part.recordedMs = performance.now() - t0;
      recording = null;
      previewT0 = performance.now();
      setRecUI(false);
      for (const t of stream.getTracks()) t.stop();
      await new Promise((r) => setTimeout(r, 250));      // let the last chunk land
      await landPart(part);
      await runChecks();
    };

    recording = { rec, part, t0 };
    rec.start(SLICE_MS);
    // GIVE THE TAKE A RUNWAY. The strip has to show a bar getting longer, and a
    // range that grows WITH the bar cannot: the right edge stays pinned to the
    // end of the axis and the bar looks stationary while the numbers change.
    // So the axis opens to the full cap at the start and the take grows into
    // it; `finishRecording` snaps it back to the real total. What you see is
    // also the honest thing — that space is how much take is still allowed.
    deck.setRange([0, Math.round(totalMs + capMs)]);
    // A HEAD THAT MOVES WITH THE RECORDING. The bar grows to the right and the
    // playhead used to sit still, which reads as the page disagreeing with
    // itself about where "now" is.
    //
    // It is NOT the playhead, deliberately. The deck is not at the recording
    // head — nothing is playing — and seeking it there every frame would drive
    // the previous take's element and land in the seeks lane, corrupting the
    // one measurement this page makes about seeking. The strip's wall cursor is
    // exactly the right instrument: anchored at the take's start, advancing in
    // real time, which is what a recording head IS.
    view.strip.armWall(part.startMs);
    setRecUI(true);
    d.log(`take ${part.n}: recording ${mime}, ${SLICE_MS} ms slices, stop when you like — ${capMs / 1000}s cap`, 'hi');
    // The cap is a BACKSTOP and it is said before it bites, not after. It exists
    // so a forgotten take cannot grow without bound, which is the moment these
    // blobs go anywhere but memory.
    recording.capTimer = setTimeout(() => {
      if (recording?.rec === rec) { d.log(`take ${part.n}: hit the ${capMs / 1000}s cap`); stopRecording(); }
    }, capMs);
  }

  function stopRecording() {
    if (!recording) return;
    // the head belongs to a recording; without one there is nothing for it to
    // mean, and a line still creeping rightward would be inventing one
    view.strip.state.wallAnchor = null;
    view.strip.invalidate();
    clearTimeout(recording.capTimer);
    try { recording.rec.stop(); } catch { /* already stopped */ }
  }

  function setRecUI(on) {
    const b = bar.extra('rec');
    // ● to start, ■ to stop — the two glyphs every recorder has used for fifty
    // years, on the same square as the play button beside them.
    if (b) {
      b.dataset.on = on ? '1' : '';
      b.textContent = on ? '\u25A0' : '\u25CF';
      b.setAttribute('aria-label', on ? 'Stop recording' : 'Record');
    }
  }

  async function resolveDuration(video) {
    await new Promise((res) => {
      video.addEventListener('loadedmetadata', res, { once: true });
      setTimeout(res, 4000);
    });
    if (!Number.isFinite(video.duration)) {
      // the documented dance: a MediaRecorder file reports duration Infinity
      // until it is asked from past the end, which leaves the transport bar
      // with no range at all — its test is exactly
      // `Number.isFinite(deck.durationMs) && deck.durationMs > 0`
      video.currentTime = 1e6;
      await new Promise((res) => {
        const on = () => {
          if (Number.isFinite(video.duration)) { video.removeEventListener('timeupdate', on); res(); }
        };
        video.addEventListener('timeupdate', on);
        setTimeout(res, 3000);
      });
      video.currentTime = 0;
    }
    return Number.isFinite(video.duration) ? video.duration * 1000 : null;
  }

  /** a landed take becomes a PART, appended where the last one finished */
  async function landPart(part) {
    if (!part.blobs.length) { d.log(`take ${part.n}: nothing recorded`, 'bad'); return; }
    part.url = URL.createObjectURL(new Blob(part.blobs, { type: part.mime }));

    const v = el('video', '', null, { playsinline: '', muted: '' });
    v.muted = true; v.hidden = true; v.src = part.url;
    seq.append(v);
    part.video = v;
    armVideo(v);
    v.addEventListener('seeked', () => onSeeked(part));

    part.fileMs = await resolveDuration(v);
    part.lenMs = Math.round(part.fileMs ?? part.recordedMs);
    // END TO END. `startMs` was fixed when recording began; if the line moved
    // under it, the burned numbers in the frames are lying and everything that
    // reads them is lying with them — so it is checked, not assumed.
    if (part.startMs !== totalMs) {
      d.log(`take ${part.n}: the line moved under it (${part.startMs} vs ${totalMs}) — burned positions are stale`, 'bad');
      part.startMs = totalMs;
    }
    totalMs += part.lenMs;
    parts.push(part);
    deck.setRange([0, Math.round(totalMs)]);

    if (!active) handOver(part, 0, 'first');
    if (!rafOn) { rafOn = true; (function loop() { requestAnimationFrame(loop); tick(); })(); }
    paint();
    d.log(`take ${part.n} landed: ${(part.lenMs / 1000).toFixed(2)}s at `
      + `${(part.startMs / 1000).toFixed(2)}s, ${Math.round(part.bytes / 1024)} KiB`
      + (part.fileMs === null ? ' — the file would not say its length' : ''), 'hi');
  }

  // ── the strip ────────────────────────────────────────────────────────────
  const NOT_YET = '#3b424e';
  const BANDS = [[1, '#8fd6a8'], [2, '#ffd400'], [Infinity, '#e0908a']];
  const bandFor = (ms) => BANDS.find(([lim]) => Math.abs(ms) / SLICE_MS < lim)[1];
  const median = (xs) => {
    if (!xs.length) return null;
    const a = [...xs].sort((p, q) => p - q);
    return a[a.length >> 1];
  };

  // THE TAKE IN FLIGHT IS ALREADY ON THE LINE — it just has not stopped growing.
  // `parts` holds landed takes and nothing else, because every assert on this
  // page reads it and a half-recorded take would make them lie. This is a VIEW
  // for the strip only: the same part, with the length it has reached so far.
  //
  // Its chunks need no such treatment; `part.chunks` is appended as each blob
  // arrives, so the event lane draws them the moment they land.
  const inFlight = () => {
    const r = recording;
    if (!r) return null;
    return { ...r.part, lenMs: Math.min(r.part.capMs, performance.now() - r.t0), live: true };
  };
  const shown = () => { const l = inFlight(); return l ? parts.concat([l]) : parts; };

  // ONE LANE OF PARTS, in recording order. Cubase's vocabulary, the same as
  // `loops`: a PART is a container placed on the timeline. Each part's COLOUR is
  // what lets two of them tell each other apart at a glance, and it is the same
  // colour burned into the frames inside them.
  //
  // There used to be a random `seed` here as well, printed in the caption, the
  // label and the tooltip. It stopped doing anything the moment the page moved
  // to the shared pattern — `burn()` never saw it — so three places advertised a
  // number with no effect, and this comment claimed the colour came from it.
  // Removed. The hue comes from the take's INDEX, which is the property that
  // actually guarantees neighbours differ.
  const partLane = {
    id: 'parts', kind: 'part', label: 'takes', height: 52, barPad: 8,
    as: 'spans', stack: false, barGap: 3, terse: true, alpha: 0.9,
    colorOf: (s) => ink(s.row?.payload?.hue ?? 210, 62, 68),
    labelOf: (s, { bw }) => {
      const p = s.row?.payload || {};
      return bw > 128 ? `take ${p.n} · ${(p.lenMs / 1000).toFixed(2)}s`
        : bw > 66 ? `take ${p.n} · ${(p.lenMs / 1000).toFixed(1)}s` : `${p.n}`;
    },
    rows: () => shown().map((p) => ({
      at: p.startMs, id: `take${p.n}`, kind: 'part',
      payload: { durMs: p.lenMs, n: p.n, hue: p.hue, lenMs: p.lenMs,
                 kib: Math.round(p.bytes / 1024) },
    })),
    describeRow: (r) => {
      const p = r.payload;
      return [`${p.kib} KiB`,
              `${(p.lenMs / 1000).toFixed(2)}s of the line`];
    },
  };

  const chunkLane = {
    id: 'chunks', kind: 'chunk', label: 'slices', height: 40, width: 2,
    as: 'ticks', color: NOT_YET, terse: true,
    // colour means HOW IT LANDED against the timeslice we asked for, never
    // which take it came from — that is the part lane's job and its colour.
    rows: () => shown().flatMap((p) => p.chunks.map((c, i) => ({
      at: p.startMs + c.at, id: `p${p.n}c${i}`, kind: 'chunk', payload: { n: p.n, ...c },
    }))),
    colorOfRow: (r) => bandFor(r.payload.gapMs - SLICE_MS),
    describeRow: (r) => {
      const p = r.payload, off = p.gapMs - SLICE_MS;
      return [`take ${p.n} · ${Math.round(p.size / 1024)} KiB`,
              `${off >= 0 ? '+' : ''}${off.toFixed(0)} ms off the ${SLICE_MS} ms slice`];
    },
  };

  const seekLane = {
    id: 'seeks', kind: 'seek', label: 'seeks', height: 38, width: 2,
    as: 'ticks', color: NOT_YET, terse: true,
    rows: () => seeks.map((s, i) => ({ at: s.asked, id: `s${i}`, kind: 'seek', payload: { i, ...s } })),
    // CALIBRATED AGAINST WHAT A SEEK CAN DO, not against zero. A video lands on
    // a FRAME, so at 25 fps the best possible answer is already up to 40 ms out
    // — and the old threshold was `< 40`, which put a perfect result exactly on
    // the boundary and painted half of them amber. A scale whose normal reading
    // is a warning has no warning left. Green now means "within a frame, which
    // is as good as this can be"; amber means it missed by more than that.
    colorOfRow: (r) => (Math.abs(r.payload.offMs) <= FRAME_MS * 1.5 ? '#8fd6a8'
      : Math.abs(r.payload.offMs) < 250 ? '#ffd400' : '#e0908a'),
    describeRow: (r) => {
      const p = r.payload;
      const within = Math.abs(p.offMs) <= FRAME_MS * 1.5;
      return [`asked ${(p.asked / 1000).toFixed(2)}s, got ${(p.got / 1000).toFixed(2)}s`,
              `${p.offMs >= 0 ? '+' : ''}${p.offMs.toFixed(0)} ms · ${within ? 'within a frame' : 'more than a frame'}`];
    },
  };

  const bar = createTransportBar(d.el, deck, {
    scrub: false,          // the strip is the only position surface on this page
    // recording is a TRANSPORT verb here, not a side action beside the page
    extras: [{ id: 'rec', label: '\u25CF', aria: 'Record', primary: true,
               title: `stop when you like — ${CAP_MS / 1000}s cap`,
               onClick: () => (recording ? stopRecording() : startRecording(CAP_MS)) }],
  });

  const view = createStripView(d.el, deck, {
    size: 'auto', follow: false, armWall: false, gutter: 150,
    lanes: [partLane, chunkLane, seekLane],
  });

  const shortMime = (m) => {
    const container = (m.split(';')[0] || '').replace('video/', '');
    const codec = (m.match(/codecs=([^;,"']+)/)?.[1] || '').split('.')[0];
    return codec ? `${container} ${codec}` : container;
  };

  function paint() {
    d.set('takes', parts.length || null);
    d.set('line', totalMs ? (totalMs / 1000).toFixed(2) : null);
    // CONTAINER AND CODEC, not the raw type string. `video/webm;codecs=vp9`
    // rendered as `webm;cod…` — an ellipsis, which says the content is wrong
    // for the slot rather than the slot being too small. Safari's
    // `video/mp4;codecs=avc1.42E01E` loses its profile suffix the same way.
    d.set('mime', parts[0] ? shortMime(parts[0].mime) : null);
    const kib = parts.reduce((a, p) => a + p.bytes, 0);
    d.set('kib', kib ? Math.round(kib / 1024) : null);
    // no `?? 0` anywhere: a number this page has not observed is an em dash
    d.set('handovers', handovers.length || null);
    lanes();
  }

  function lanes() {
    // A GUTTER CARRIES WHAT ITS LANE MEASURED. Not "press Record", not "drag
    // the line" — that is help text, it repeats the how() paragraph, it crowds
    // out the figures the slot exists for, and it TRUNCATED, which is the tell.
    // The budget is real: ~21 characters at this gutter width, and three lines
    // on a 52 px lane, two on a 40 px one. Written to fit, not trimmed to fit.
    //
    // And with nothing measured yet it carries NOTHING. "no parts / nothing
    // recorded yet" is the lane narrating its own emptiness beside an empty
    // strip that already shows it — two channels saying one thing, and the one
    // that costs three lines of gutter is the one that goes.
    const L = view.strip.lanes();
    // The gutter counts what the lane DRAWS, in-flight take included — showing
    // "1 part" beside two bars would be the readout arguing with the picture.
    const sh = shown();
    const P = L.find((l) => l.id === 'parts');
    if (P) P.subLabel = sh.length
      ? [`${sh.length} take${sh.length > 1 ? 's' : ''} · ${(sh.reduce((a, p) => a + p.lenMs, 0) / 1000).toFixed(2)}s`,
         `shortest ${(Math.min(...sh.map((p) => p.lenMs)) / 1000).toFixed(2)}s`,
         recording ? 'recording now' : `longest ${(Math.max(...sh.map((p) => p.lenMs)) / 1000).toFixed(2)}s`]
      : null;

    const C = L.find((l) => l.id === 'chunks');
    const offs = sh.flatMap((p) => p.chunks.slice(1).map((x) => Math.abs(x.gapMs - SLICE_MS)));
    if (C) C.subLabel = offs.length
      ? [`${offs.length + sh.length} slices, ${median(offs).toFixed(0)} ms typ`,
         `worst ${Math.max(...offs).toFixed(0)} ms off ${SLICE_MS}`]
      : null;

    const S = L.find((l) => l.id === 'seeks');
    const so = seeks.map((x) => Math.abs(x.offMs));
    if (S) S.subLabel = so.length
      ? [`${seeks.length} asked, ${median(so).toFixed(0)} ms typ`,
         `worst ${Math.max(...so).toFixed(0)} ms off`]
      : null;
    view.strip.invalidate();
  }
  setInterval(paint, 250);

  // ── the checks ───────────────────────────────────────────────────────────
  // They run when a take lands rather than behind a button, and they assert the
  // MECHANISM. An assert that has to wait gets written tolerantly, and a
  // tolerant assert is how `loops` spent its whole life not looping.
  let didRecording = false, didSequence = false;

  function seekAndWait(ms) {
    return new Promise((res) => {
      const before = seeks.length;
      deck.seek(ms);
      let i = 0;
      const iv = setInterval(() => {
        if (seeks.length > before || ++i > 40) { clearInterval(iv); res(seeks[seeks.length - 1] || null); }
      }, 100);
    });
  }

  async function runChecks() {
    if (!parts.length) return;
    const p1 = parts[0];

    if (!didRecording) {
      didRecording = true;
      d.assert('the mime was negotiated, not assumed',
        typeof p1.mime === 'string' && /^video\//.test(p1.mime), String(p1.mime));
      d.assert('chunks arrived with sizes',
        p1.chunks.length > 0 && p1.chunks.every((c) => c.size > 0),
        `${p1.chunks.length} chunks, ${Math.round(p1.bytes / 1024)} KiB`);
      d.assert('every chunk is stamped on arrival',
        p1.chunks.every((c) => Number.isFinite(c.at) && Number.isFinite(c.gapMs)),
        `first at ${p1.chunks[0] ? Math.round(p1.chunks[0].at) : '—'} ms`);
      d.assert('the take is seekable — a finite range, not Infinity',
        Number.isFinite(deck.durationMs) && deck.durationMs > 0, `${deck.durationMs} ms`);
      d.assert('the recorded length and the file length are both known',
        Number.isFinite(p1.recordedMs) && (p1.fileMs === null || Number.isFinite(p1.fileMs)),
        p1.fileMs === null
          ? `recorded ${Math.round(p1.recordedMs)} ms, the file would not say`
          : `recorded ${Math.round(p1.recordedMs)} ms, file ${Math.round(p1.fileMs)} ms, `
            + `${Math.round(p1.fileMs - p1.recordedMs)} ms apart`);
      d.assert('the cap is a backstop, not the mechanism',
        Number.isFinite(p1.recordedMs) && p1.recordedMs <= p1.capMs + 1500,
        `${Math.round(p1.recordedMs)} ms against a ${p1.capMs} ms cap`);
    }

    // THE SEQUENCE ASSERTS NEED TWO PARTS to mean anything, and a vacuous pass
    // on one is exactly how a subject goes missing. They stay un-run and the
    // page says so out loud, so "6 asserts" reads as "half the page" rather
    // than as "the page".
    if (parts.length < 2) {
      d.log(`${parts.length} take on the line — the eight sequence checks (end to end, `
        + 'boundary handover, one clock) need a second one. Press Record again.', 'hi');
    }
    if (parts.length < 2 || didSequence) { paint(); return; }
    didSequence = true;

    d.assert('parts are laid end to end — no gap, no overlap',
      parts.every((p, i) => (i === 0 ? p.startMs === 0 : p.startMs === parts[i - 1].startMs + parts[i - 1].lenMs)),
      parts.map((p) => `${p.n}@${p.startMs}+${p.lenMs}`).join(' '));
    d.assert('the line is as long as the takes put together',
      deck.durationMs === parts.reduce((a, p) => a + p.lenMs, 0),
      `${deck.durationMs} ms`);

    const b = parts[1].startMs;
    const before = await seekAndWait(Math.max(0, b - 400));
    const inFirst = active;
    const after = await seekAndWait(b + 400);
    const inSecond = active;

    d.assert('crossing a boundary hands the picture over',
      inFirst === parts[0] && inSecond === parts[1],
      `${b - 400} ms → take ${inFirst ? inFirst.n : '—'}, ${b + 400} ms → take ${inSecond ? inSecond.n : '—'}`);
    d.assert('exactly one part is under the playhead',
      parts.filter((p) => deck.position() >= p.startMs && deck.position() < p.startMs + p.lenMs).length === 1,
      `at ${Math.round(deck.position())} ms`);
    d.assert('the part under the playhead is the one driving the clock',
      mm.key() === `take${inSecond ? inSecond.n : '?'}` && mm.driving(),
      `${mm.key()}, driving ${mm.driving()}`);
    d.assert('the new part plays its OWN time, not the line\'s',
      Math.abs(parts[1].video.currentTime * 1000 - 400) < 300,
      `${Math.round(parts[1].video.currentTime * 1000)} ms into take 2, `
        + `which sits at ${Math.round(b)} ms on the line`);
    d.assert('a seek reports what it actually got, not what it asked for',
      !!after && Number.isFinite(after.got),
      after ? `asked ${Math.round(after.asked)} ms, got ${Math.round(after.got)} ms, `
              + `${Math.round(after.offMs)} ms apart` : 'no seeked event');
    d.assert('the handover was recorded, not inferred',
      handovers.some((h) => h.from === 1 && h.to === 2),
      handovers.map((h) => `${h.from ?? '·'}→${h.to}@${Math.round(h.at)}`).join(' '));
    paint();
  }

  // WHAT THIS PAGE CANNOT ANSWER, said rather than quietly missing:
  //   · capture-to-available latency — MediaRecorder publishes no capture
  //     timestamp per chunk, so how old the oldest frame in a blob is cannot be
  //     observed from this API. The burned clock says when the frame was DRAWN,
  //     which is not the same instant and is not offered as one.
  //   · any content anchor — "the wall-clock instant this frame was captured,
  //     against timeline zero". plan-glass P0 blocks it: every anchor number
  //     this project has printed carries about one frame of rVFC bias.
  //   · takes playing AT THE SAME TIME. They are laid end to end on purpose:
  //     one picture under the playhead is what gives `media-master` L1 a single
  //     ground truth. A multitrack surface is a different demo.
  d.log(`ready · ${CAP_MS / 1000}s cap per take`, 'hi');
  d.ready();
</script>
</html>
