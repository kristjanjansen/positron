<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<script src="/proto/remixer/hls.min.js"></script>
<style>
  .film { width: 100%; aspect-ratio: 16 / 9; background: #000;
          border: 1px solid var(--line); border-radius: 4px; display: block; margin: 0 0 6px; }
  /* EMPTY LOOKS EMPTY. A <video controls> with no source still draws a player —
     a dead play button and 0:00 — which reads as broken rather than as waiting.
     The box keeps its size so the line below never moves; only the furniture
     goes. */
  .film[data-empty="1"] { background: #000; }
  .wireless { width: 100%; max-width: 440px; display: block; margin: 0 0 6px; }
  /* `display: block` beats the UA sheet's `[hidden] { display: none }`, so
     without this the audio player sits under every film showing 0:00 / 0:00.
     The same trap cost the `video` rule an extra line in shell.css. */
  /* the empty slot keeps its height so the line never moves under you */
  .wireless { min-height: 40px; }
  /* THE DESCRIPTION IS BOUNDED. ERR's leads run from one line to a dozen, and a
     block that grows with its contents pushes the line down the page by a
     different amount for every film. Five lines here, more where there is room,
     and the rest scrolls inside its own box — so the strip below never moves. */
  /* ONE COLUMN PER MEDIUM: the newsreel on the left, the radio on the right. No
     colour here — the line below carries the colour, and repeating it on a
     block of prose competes with the marks for the same meaning. This block is
     reference text, so it is quiet: dim, and set off from the picture above and
     the line below by its own margin. A day that has only one of the two still
     gets both columns, and the empty one says in words which half did not
     survive. */
  /* 🔴 THE GAP ABOVE IT IS THE SHELL'S, NOT A NUMBER TYPED HERE. Asked for
     2026-09-16 with a screenshot: *"add space on top of newsreel | radio"*. It
     carried `margin: 14px 0 4px`, so the two column headings sat tight under
     the line and the strip and the day below it read as one block.
     ⚠️ `margin-bottom`, NEVER the `margin` shorthand. The shorthand's implied
     `margin-top: 0` used to BEAT the rhythm on source order at the same
     specificity, which is exactly how this page lost the rhythm in the first
     place and how the transport bar lost it on every page in the project.
     `.pos-stack` closed that as a class in 2026-09-16 by outweighing a single
     class rather than out-sitting it, and the habit is still the right one. */
  .picked { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px;
            font: 500 12px/1.6 var(--mono); color: var(--dim); margin-bottom: 4px; }
  /* TWO COLUMNS ON A PHONE TOO. Stacked, the second archive reads as a
     footnote to the first; side by side, the day is one thing with two halves,
     which is what the page is about. Estonian compounds are long and a narrow
     column cannot fit them, so words break rather than widening the column
     past its share — `anywhere` and not `break-word`, which leaves an
     over-long word to overflow when it is the only thing on the line.

     NOT `hyphens: auto`. The page declares lang="en" and the text is Estonian,
     so the browser hyphenated it with the wrong dictionary — `Gon-siori`,
     `he-lidefekt`, `arhitektuur-Tallinnas`. A hyphen is a claim about where a
     word divides; breaking without one claims nothing. The columns carry
     lang="et" so a reader's own software knows what language it is looking
     at, which is also the honest answer for a screen reader. */
  .pcol { min-width: 0; overflow-wrap: anywhere; word-break: break-word; }
  .pcol[data-empty="1"] { display: none; }
  /* the key carries the lane's colour — set from the INK table in the script,
     never typed here, so the label and the marks can never disagree */
  .pkey { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  .ptitle { color: var(--dim); font-weight: 600; margin-top: 2px;
            height: calc(2 * 1.6em); overflow: hidden;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  /* TWO FACTS, TWO BOXES. The date and the link used to be one string with a
     middot between them, and the separator was only ever there because they had
     been glued together first. A row with a gap in it says the same thing with
     nothing to read. */
  .pmeta { color: var(--dim2); display: flex; flex-wrap: wrap; gap: 0 12px; }
  .pmeta a { color: var(--dim2); text-decoration: underline; text-underline-offset: 2px; }
  /* ONE HEIGHT, not a maximum. A box that shrinks to its contents moves the
     line below it by a different amount for every clip; fixed, nothing under
     it ever moves and a long lead scrolls inside its own box. */
  .plead { color: var(--dim2); margin-top: 6px; height: calc(6 * 1.6em); overflow-y: auto; overscroll-behavior: contain; }
  @media (min-width: 760px) { .plead { height: calc(9 * 1.6em); } }
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createStripView, STRIP_FOOTER_EMPTY } from '/shell/strip.mjs';
  import { createGlue } from '/shell/glue.mjs';
  import { ifSelfcheck } from '/shell/selfcheck.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { formatTime } from '/timeline/strip.mjs';
  import { mediaMaster } from '/timeline/media-master.mjs';

  const YEAR_FROM = Date.UTC(1965, 0, 1);
  const YEAR_TO   = Date.UTC(1966, 0, 1);
  const ARHIIV = 'https://arhiiv.err.ee';

  /**
   * 🔴 EVERY REACH FOR ERR GOES THROUGH HERE, AND IT IS COUNTED.
   *
   * Not for a readout: for a CHECK. This page's rule is that nothing is asked
   * of a public broadcaster until somebody asks to hear something, and the
   * honest way to grade a rule like that is to count the reaches rather than to
   * reason about which branch was taken. A pass-through cannot be forgotten the
   * way a counter written beside a call can, because a URL does not get to a
   * fetch or to a media element without coming through it.
   *
   * ⚠️ IT COUNTS THE MEDIA AS WELL AS THE API. A content GET is one reach;
   * handing the m3u8 to an element or to hls.js is another, and the second is
   * the one that holds a connection open and is counted as a listener.
   */
  let errOpens = 0;
  const reachERR = (url) => { errOpens += 1; return url; };

  // NATIVE HLS ONLY ON WEBKIT, gated on ManagedMediaSource.
  //
  // This page shipped without the gate and the newsreels were SILENT — reported
  // three times, and the first two "fixes" were aimed at muting, which was
  // never the cause. `canPlayType('application/vnd.apple.mpegurl')` answers
  // "maybe" in Chrome as well as Safari, so Chrome was handed the m3u8 and
  // half-played it: video decoded fine, and the SEPARATE AUDIO GROUP never
  // joined. Measured — 5,405 bytes of audio decoded against 1,127,532 of video
  // in the same 8.5 seconds, with the element unmuted at volume 1.
  //
  // CLAUDE.md says in as many words: grep for `canPlayType` before trusting any
  // HLS page. This page was the counterexample.
  const NATIVE_HLS = 'ManagedMediaSource' in window
    && !!document.createElement('video').canPlayType('application/vnd.apple.mpegurl');

  const d = mount({
    name: 'reel',
    // ONE SENTENCE. It was three, and the two that went said what the page
    // shows you anyway: that the year is a picture (it is on screen) and that
    // nothing is stored here (the log says it every time a film opens, and an
    // assert at the foot of this file grades it).
    // ⚠️ AND IT NAMES THE DIFFERENCE BETWEEN PICKING AND PLAYING, because that
    // is now the difference between a page that asks a public broadcaster for
    // something and one that does not. A sentence that said "press a mark to
    // play it" while ‹ and › quietly did something else would be the drift
    // CLAUDE.md's rule about a description and a control is written about.
    what: "Every 1965 newsreel in ERR's archive is a mark on one line at the day "
      + 'it was broadcast, and stepping or dragging picks a day while a press on '
      + "a mark plays it with the same day's radio where any survived.",
    // PUBLISHED, NOT DRAWN. Every cell was already on the page: the count in
    // the lane's gutter, the date under the film's own title and again on the
    // axis the playhead stands on, the length in the line under the strip. A
    // second table saying the same things is a second place to keep in step and
    // one more thing between the reader and the year.
    readout: { picked: '', length: 'min' },
    showReadout: false,
    // NO CONTROLS BESIDE THE PAGE. The line IS the control, and a button that
    // plays "the first film" is a second way to do the one thing the strip
    // already does.
    // ⚠️ ‹ AND › ARE NOT AN EXCEPTION TO THIS. They move the playhead and
    // change what is showing, which is a transport verb, so they are declared
    // on the bar rather than here. See `extras` below.
    controls: [],
  });
  guard(d);

  // ── the year ──────────────────────────────────────────────────────────────
  // ABSOLUTE POSITIONS, AND NEGATIVE ONES. 1965 is before the epoch, so every
  // position here is a negative number of milliseconds. That is the first deck
  // in this project ever placed outside 1970 — and it found a real bug on the
  // way: `createDeck` opened its playhead at 0, which for any range not
  // containing zero is OUTSIDE the range. Fixed in the library, not worked
  // around here.
  const deck = createDeck({ items: [], adapters: {}, range: [YEAR_FROM, YEAR_TO] });

  // BOTH SLOTS EXIST FROM THE START, empty. A picture that appears out of
  // nowhere pushes the line down the page the moment you press a film — so the
  // thing you just aimed at moves while you are looking at it. The box is the
  // same size before and after; only its contents change.
  const film = el('video', 'film', null, { playsinline: '' });
  film.dataset.empty = '1';
  // ONE PLAYER, TWO SOURCES.
  //
  // 1965 handed picture and sound out separately — the newsreels were shot mute
  // and the radio is sound-only — and they have been apart ever since, in two
  // archives with two interfaces. On a line positioned by the day they went
  // out, putting them back together is one line of arithmetic: same date, play
  // both.
  //
  // So the audio element is HIDDEN and driven, never presented. The picture is
  // the player; it carries the controls, and the sound follows it. When a
  // broadcast has no film to go with it the picture stays black rather than
  // disappearing, because the transport is the picture and a page whose
  // controls vanish is a page that has broken.
  const wireless = el('audio', 'wireless');
  wireless.hidden = true;
  const hasSound = () => !!(wireless.getAttribute('src') || aHls);
  const picked = el('div', 'picked');
  // One column per medium. Each carries its own name, then the date and the
  // link to ERR on their OWN line — a title that runs into its metadata reads
  // as one long string and the title is the part being looked for.
  // ONE TABLE FOR THE TWO ARCHIVES' INK, read by the lane that draws the marks
  // AND by the key above the column, so the two cannot drift apart. Typing the
  // same yellow twice is how a legend starts being needed.
  const INK = {
    video: { on: '#ffd400', off: 'hsl(50 62% 40%)' },
    audio: { on: 'hsl(185 80% 62%)', off: 'hsl(185 45% 34%)' },
  };

  const column = (key, medium) => {
    const box = el('div', 'pcol');
    box.lang = 'et';                  // the archive's own language, not the page's
    const parts = { key: el('div', 'pkey', key), title: el('div', 'ptitle', ''),
                    meta: el('div', 'pmeta', ''), lead: el('div', 'plead') };
    parts.key.style.color = INK[medium].on;   // the same ink as this lane's marks
    box.append(parts.key, parts.title, parts.meta, parts.lead);
    box.dataset.empty = '1';          // nothing is picked yet
    return Object.assign(parts, { box });
  };
  const colFilm = column('newsreel', 'video');
  const colRadio = column('radio', 'audio');
  picked.append(colFilm.box, colRadio.box);

  // A column with nothing in it is REMOVED, not filled with a sentence saying
  // it is empty. Half of 1965 reaches us as picture only or sound only, so on
  // those days the surviving half simply gets the width.
  const fill = (col, item, kind) => {
    col.box.dataset.empty = item ? '0' : '1';
    col.title.textContent = item ? sentenceCase(item.title) : '';
    col.meta.replaceChildren();
    col.lead.textContent = item?.lead || '';
    col.lead.scrollTop = 0;
    if (!item) return;
    const a = el('a', '', 'at ERRarhiiv');
    a.href = `${ARHIIV}/${kind}/vaata/${item.slug}`;
    a.target = '_blank'; a.rel = 'noreferrer';
    col.meta.append(el('span', '', item.date), a);
  };
  d.el.append(film, wireless);
  // `picked` is appended after the bar and the line — see below. It reads as
  // the caption to what the line is pointing at, which is where a caption goes.

  const DAY = 86400000;
  const iso = (ms) => new Date(ms).toISOString().slice(0, 10);

  // THE VIEW STAYS INSIDE THE YEAR. Centring on a clip near either end pushed
  // the window past it, so the axis read 1964-12-24 on a page whose whole
  // subject is 1965 — empty months either side of the material, labelled with
  // a year that has nothing on this line. The window keeps its width and
  // slides inward instead of being cropped, so the zoom the reader chose
  // survives being near an edge.
  const fitInYear = (from, to) => {
    const w = Math.min(to - from, YEAR_TO - YEAR_FROM);
    let a = from, b = a + w;
    if (a < YEAR_FROM) { a = YEAR_FROM; b = a + w; }
    if (b > YEAR_TO) { b = YEAR_TO; a = b - w; }
    view.strip.fit(a, b);
  };

  // ERR'S NEWSREEL TITLES ARE GENUINELY ALL-CAPS — 288 of 298, against 11 of
  // 494 on the radio side. That is the film archive's own record, typed on a
  // card, not a rendering accident, and it is why the two columns look unlike
  // each other. Shouting is hard to read next to a lowercase lead, so this
  // page sentence-cases them FOR DISPLAY ONLY: the fixture, the link and the
  // slug keep exactly what ERR holds.
  //
  // The limit, stated rather than hidden: with no name list there is no way to
  // tell a proper noun from a common one inside a shouted line, so a personal
  // or place name that is not the first word comes back lowercase. A title
  // that is already mixed-case is left untouched, which is what keeps the
  // radio side — where capitals mean something — exact.
  const sentenceCase = (t) => {
    if (!t || t !== t.toUpperCase()) return t || '';
    // NOT after a full stop. In Estonian a period is also the ordinal marker —
    // `1965. aasta` is "the year 1965" and the next word is lowercase — and in
    // a catalogue of short titles ordinals outnumber sentence ends, so
    // capitalising after every `.` gets "1965. Aasta esimesed abiellujad".
    return t.toLowerCase().replace(/(^|[!?]\s+)(\p{Ll})/gu, (_m, lead, ch) => lead + ch.toUpperCase());
  };

  // ONE LANE. The other 16 films — 16 mm rushes and a few the catalogue files
  // under no series — are a different kind of thing recorded for a different
  // reason, and a lane holding "everything that is not the other lane" is a
  // leftovers bin rather than a lane. `AK filmikroonika` alone is a series: one
  // newsreel, weekly, for a year.
  const SERIES = 'AK filmikroonika 1958-1991';
  let items = [], radio = [], current = null, hls = null, aHls = null;
  // THE DAY THAT IS PICKED, IN ITS TWO HALVES. `current` is the one that was
  // chosen; a day usually brings a newsreel AND a radio programme, and a scrub
  // that stops over either of them has landed on the day already picked rather
  // than on a new one.
  let halves = { picture: null, sound: null };
  // 🔴 AND THE DAY WHOSE MEDIA IS ACTUALLY OPEN, WHICH IS A DIFFERENT FACT.
  // Picking is free and opening is not, so most of the time a day is picked
  // and nothing is open. `null` here means this page is holding no connection
  // to ERR, and every branch below asks it rather than guessing from
  // `film.paused`, which reads the same for "nothing loaded" and "stopped".
  let opened = null;

  // A CLIP IS AS WIDE AS IT IS LONG.
  //
  // It was a day wide until the catalogue could say otherwise, and it could not:
  // there is no duration field in ERR's item API. What there IS is a SHOT LIST
  // with real millisecond begin/end times, so the last shot's end is a real
  // figure — collected for 296 of the 298 films, median 2.2 min, longest 67.
  //
  // That works only because clips sit at MIDDAY. A bar drawn from midnight at
  // its true length would claim the film went out at 00:00, which nobody knows;
  // from midday it says "somewhere in this day, and this long", with room either
  // side. The two changes are one decision.
  //
  // Two films have no shot list. They draw at the median rather than at zero —
  // and the line under the strip says the length is unknown when you point at
  // one, because a bar you can see is not a number you can trust.
  let MEDIAN_MS = 132000, sharedDays = 0;   // replaced once the fixture is in
  const laneFor = (id, label) => ({
    id, kind: 'part', label, height: 44, barPad: 6,
    as: 'spans', stack: false, barGap: 1, terse: true, alpha: 0.85, spanLine: false,
    // YELLOW, because these are ours to show and the site's colour is `--hi`.
    // The one playing is the full brand yellow; the rest are the same hue held
    // back, so the lane reads as one family and still says which film is up.
    // Nothing here is a quality signal — the archive does not tell us how a
    // 1965 broadcast went — so colour carries identity only, and says so.
    // TWO HUES, because they are two archives. Yellow is the site's own and the
    // films are ours to show; radio gets teal, far enough round the circle to be
    // told apart at a two-pixel mark. Neither is a quality signal — nothing here
    // is measured — so colour carries identity only, and the playing one is the
    // same hue at full brightness rather than a different colour.
    colorOf: (sp) => {
      const on = sp.row?.payload?.slug === current?.slug;
      const ink = INK[id === 'radio' ? 'audio' : 'video'];
      return on ? ink.on : ink.off;
    },
    labelOf: (sp, { bw }) => (bw > 90 ? sentenceCase(sp.row?.payload?.title).slice(0, 40) : ''),
    rows: () => (id === 'radio' ? radio : items).map((it) => ({
      at: it.at, id: it.slug, kind: 'part',
      payload: { durMs: it.playedMs ?? it.catalogueMs ?? MEDIAN_MS, ...it },
    })),
    // THREE SHORT LINES, AND IT WAS FOUR FACTS IN THREE. The date and the
    // length were one string with a middot holding them apart, and the fourth
    // line said which medium this is, which is what the lane it is drawn in is
    // called: the gutter beside the mark says `newsreels` or `radio` an inch
    // away. These are the lines the FOOTER under the strip shows, one per row,
    // each clipped to its own row, so a long title ellipsises rather than
    // wrapping and pushing the last line out of a fixed box.
    describeRow: (r) => {
      const p = r.payload;
      const len = p.playedMs ? `${(p.playedMs / 60000).toFixed(1)} min, measured`
        : p.catalogueMs ? `${(p.catalogueMs / 60000).toFixed(1)} min, per the shot list`
        : 'length unknown until played';
      return [sentenceCase(p.title).slice(0, 46), p.date, len];
    },
  });

  // STEP THROUGH THE YEAR. 282 films at a week to a screen means the next one is
  // often off the edge, and hunting for it by dragging is not navigation. These
  // are transport verbs — they move the playhead and change what is showing —
  // so they belong on the bar rather than beside the page, which is what
  // `extras` exists for.
  // EVERY BROADCAST, BY DAY. Stepping through one lane skips whole weeks the
  // other lane is the only witness to, and stepping through both as a flat
  // list hands you the same afternoon twice — once for its film and once for
  // its radio — on the 283 days where both survive. So the unit is the DAY:
  // one press, one broadcast day, and the day brings whichever halves of it
  // reached us. The film represents a day when there is one, because the film
  // is what carries the picture.
  let days = [];
  const rebuildDays = () => {
    const byDate = new Map();
    for (const it of items) byDate.set(it.date, it);
    for (const r of radio) if (!byDate.has(r.date)) byDate.set(r.date, r);
    days = [...byDate.values()].sort((a, b) => a.at - b.at);
  };
  // IS SOMETHING ACTUALLY SOUNDING? Not `film.paused`, which reads the same for
  // a stopped film and for an element that was never given one. `opened` is the
  // day whose media this page holds, and it is null far more often than not.
  const going = () => !!opened && (!film.paused || (hasSound() && !wireless.paused));
  /**
   * 🔴 STEPPING WHILE NOTHING IS PLAYING PICKS A DAY. IT DOES NOT FETCH.
   * Changed 2026-09-19, and see the header over `select` for why.
   *
   * The two readings of ‹ and › are both real and they belong to two different
   * people. Somebody watching a newsreel who presses › means the next one, and
   * gets it, playing. Somebody walking the year with nothing running means
   * "show me that day": the caption fills, the mark lights, the playhead moves,
   * and the play button starts it when they want it. The second reading costs a
   * public broadcaster nothing, and it is the one a check walking the controls
   * takes without knowing it.
   */
  const step = (by) => {
    if (!days.length) return;
    const at = current ? current.at : deck.position();
    const next = by > 0
      ? days.find((x) => x.at > at)
      : [...days].reverse().find((x) => x.at < at);
    if (!next || next === current) return;
    if (going()) play(next); else select(next);
  };
  /**
   * 🔴 THE LOOP PLAYS THE FILM, BECAUSE THE PAGE OWNS WHAT IS BEING PLAYED.
   * Asked for 2026-09-16: *"make loop work"*.
   *
   * What it did before: LOOP marked two positions on a deck of 1965 and wrapped
   * the PLAYHEAD between them while the newsreel ran straight on to its end.
   * The bar wraps by SEEKING, and with no `command` a seek goes to the deck,
   * which on this page is a year rather than the thing making the picture. So
   * the control lit, the marks were real, and nothing a visitor could see ever
   * came back. `/replay/` had the identical fault the same week, reported as
   * *"transport loops but video does not, time keeps increasing"*, and this is
   * the same repair: every verb drives the element and the deck follows.
   *
   * ⚠️ A POSITION HERE IS A MOMENT IN 1965, WHICH IS WHAT MAKES THE MAPPING
   * HONEST RATHER THAN CLEVER. A clip is drawn from the day it went out and is
   * as wide as it is long, so `position - current.at` IS how far into the film
   * the playhead has got. Press LOOP twenty seconds in and again thirty-five
   * seconds in and the loop is that passage of that newsreel, with the same
   * day's radio following it through the picture's own `seeked`.
   */
  // ⚠️ THE ARITHMETIC IS PURE AND THE STATE IS THE THIN WRAPPER ROUND IT, so
  // the check at the foot of this file can grade the mapping with nothing open
  // and nothing picked, which is how this page now opens.
  const intoOf = (item, pos) => (pos - item.at) / 1000;
  const intoFilm = (pos) => (current ? intoOf(current, pos) : null);
  const filmSecs = () => (Number.isFinite(film.duration) && film.duration > 0 ? film.duration : null);
  const command = {
    play: () => {
      /**
       * 🔴 THE PLAY BUTTON OPENS THE DAY THAT IS PICKED, AND NOTHING IS PICKED
       * WHEN THE PAGE OPENS. The line said, for a year: *"Pressing play with
       * nothing chosen starts the first film, which is what this page has
       * always done"*, and that was written when the page had already fetched
       * that film on load anyway. It is the same claim in a different place:
       * the page reaching a broadcaster's server on behalf of somebody who has
       * not asked for anything in particular.
       *
       * ⚠️ SO THE YEAR RUNS AND THE LOG SAYS HOW TO PICK. The playhead really
       * does advance at one second of 1965 a second, which is about a pixel an
       * hour at a month to a screen, and a control that moves something nobody
       * can see needs words. This is the only honest thing left: there is
       * nothing to start.
       */
      if (!current) {
        d.log('nothing is picked yet. Press a mark on the line, or step to a day with the arrows');
        deck.play();
        return;
      }
      // Picked but not open: THIS is the press that asks ERR for it, and it is
      // a person pressing play on a day they chose.
      if (opened !== current) { play(current); return; }
      // FIRED, NEVER AWAITED. play() waits on a gesture in a real browser and
      // does not reject when it is refused, so awaiting it is a hang.
      film.play().catch(() => {});
      if (hasSound() && wireless.paused) wireless.play().catch(() => {});
      deck.play();
    },
    pause: () => { film.pause(); if (hasSound()) wireless.pause(); deck.pause(); },
    seek: (pos) => {
      const into = intoFilm(pos), dur = filmSecs();
      // 🔴 ONLY INSIDE THE FILM THAT IS PLAYING. A loop marked across days has
      // both ends on the line and neither of them in this newsreel, and writing
      // an eleven-day currentTime onto a two-minute element clamps to the end,
      // which is a loop that plays nothing at all. Out there the picture is left
      // alone and the playhead moves by itself, which is what it did before.
      if (into != null && dur != null && into >= -0.25 && into <= dur + 0.25) {
        try { film.currentTime = Math.min(Math.max(0, into), Math.max(0, dur - 0.05)); }
        catch { /* no data yet */ }
      }
      return deck.seek(pos);
    },
  };

  // THE PICTURE IS THE MASTER AND THE YEAR FOLLOWS IT. The playhead used to
  // free-run at one second of 1965 per second of now from wherever the film was
  // opened, which agrees with the film until somebody uses the picture's own
  // controls: then the line says one thing, the film says another, and a mark
  // made off the line is made in the wrong place. `anchorMs` is a function
  // because the anchor is whichever clip is up. No rAF here: the L4 timeupdate
  // backstop drives it, exactly as on `/replay/`.
  const master = mediaMaster(deck, film, {
    anchorMs: () => (current ? current.at : YEAR_FROM),
  });

  const bar = createTransportBar(d.el, deck, {
    scrub: false,
    // 🔴 NO CLOCK. A position on this deck is a DATE, so the bar read
    // `-2611440:00.000` over `525600:00.000`, which is correct arithmetic: zero
    // is 1970, 1965 is before it, and a year is 525600 minutes long. A clock is
    // simply the wrong instrument for an axis measured in days, and the axis
    // under the bar prints the date it is standing on.
    time: false,
    command,
    // ‹ AND ›, THE SAME PAIR `/tapes/` CARRIES. They move the playhead and
    // change what is showing, which is a transport verb rather than something
    // you do to the page, so they sit on the bar.
    // ⚠️ ONE PRESS IS ONE BROADCAST DAY, NOT ONE MARK. `step` walks `days`,
    // which folds both lanes onto the day they share: stepping through one lane
    // alone skips the weeks the other is the only witness to, and stepping
    // through both as a flat list hands you the same afternoon twice.
    extras: [
      { id: 'prev', label: '‹', aria: 'the broadcast day before this one', onClick: () => step(-1) },
      { id: 'next', label: '›', aria: 'the broadcast day after this one', onClick: () => step(+1) },
    ],
    // 🔴 NOTHING IS LOGGED ABOUT THE LOOP, ON INSTRUCTION 2026-09-16: *"rm all
    // loop messages."*. It said which seconds of which newsreel were being
    // looped, and said so in words when both marks were not inside the film
    // that is playing. The first is what the picture does in front of you; the
    // second is now unreachable by hand, because a press starts the transport
    // and both marks land inside the clip that is running.
  });
  const view = createStripView(d.el, deck, {
    size: 'auto', follow: false, gutter: 150,
    // DECLARED, not guessed. The strip's fallback asks `range[0] > 1e12`, which
    // is 2001-09-09 — every date before that, and every negative one, fails it,
    // so 1965 would print as a duration instead of a date.
    absolute: true,
    // TWO LANES, ONE DAY. Both are positioned by the date they went out, so a
    // newsreel and a radio programme from the same day sit at the same place —
    // which is the thing neither archive's own interface can show you, and the
    // reason to put them on a line at all.
    lanes: [laneFor('ak', 'newsreels'), laneFor('radio', 'radio')],
    // Named rather than inline, so a check can drive the same entry a finger
    // does. What IS checked at the foot of this file is `nearestOf`, which is
    // the half of the decision that needs nothing from ERR: driving `stripSeek`
    // itself opens a stream.
    onSeek: (at) => stripSeek(at),
    /**
     * 🔴 WHAT YOU ARE POINTING AT GOES UNDER THE LINE, NOT OVER IT. Asked
     * 2026-09-19 with a photograph of this page on an iPhone: *"add feature to
     * timeline: footer section, looks like glued that shows hovered info below
     * timeline"*. The photograph is of this strip: the sticky tap tooltip over
     * the right half of it, four lines deep, one of them cut mid word, covering
     * the marks it was describing. A finger has no hover, so on a phone that
     * box has to stay up while the finger is down, which is precisely when it
     * is in the way.
     *
     * 🔴 THREE LINES, WHICH IS WHAT THE TOOLTIP CARRIED AND NOT MORE. The
     * footer covers nothing, so it could afford a fourth, and the line it would
     * get back is the one this page cut a session ago: `silent newsreel` or
     * `radio, with sound`. That stays cut, and for the reason that never had
     * anything to do with room. The lane it is drawn in is CALLED `newsreels`
     * or `radio`, in the gutter an inch to the left of the mark. What the
     * fourth line would cost is real: this box is a fixed height whether or not
     * anything is under the pointer, so a line nobody needs is a line of empty
     * box under the timeline for the whole visit.
     *
     * ⚠️ AND THE TOOLTIP IS GONE RATHER THAN KEPT ALONGSIDE. `createStripView`
     * turns it off for any strip with a footer unless a page asks for both, and
     * two surfaces saying the same three lines is the thing to avoid: one of
     * them would be the one covering the marks.
     */
    footer: { lines: 3 },
  });

  /**
   * 🔴 THE BAR, THE LINE AND WHAT YOU ARE POINTING AT ARE ONE SURFACE. Asked
   * 2026-09-19: *"glue reel transport to timeline"*, and then for the footer
   * *"looks like glued"*. The bar already passes `scrub: false` BECAUSE the
   * line below it is this page's position surface, so the two have been one
   * instrument all along with the page's 22 px rhythm drawn through the middle
   * of it.
   *
   * 🔴 IT IS `view.surface`, NEVER `view.el`. The canvas and the footer are
   * glued into one box by `createStripView` itself, and `surface` is that box;
   * gluing the canvas would tear it out of its own pair and leave the footer in
   * a box with nothing else in it. ⚠️ THE NESTING DOES NOT DOUBLE THE EDGE:
   * `.pos-glue.pos-glue > *` weighs (0,2,0) against `.pos-glue`'s own (0,1,0),
   * so the inner box gives up its border and radius to the outer one exactly as
   * the canvas and the bar do, and what is left of it is the 1 px seam between
   * the line and the footer. Read from `shell.css` rather than assumed.
   * ⚠️ AND IT IS THE RIGHT LINE WITH NO FOOTER TOO: `surface` is the bare
   * canvas when a strip has none, so this call does not have to know.
   *
   * ⚠️ THE ANCHOR IS READ BEFORE THE GLUE. `createGlue` re-parents its blocks,
   * so a node captured after the call can be detached and `insertBefore` throws
   * on it. `null` is append, which is what a pair at the end of the page wants.
   */
  const afterStrip = view.surface.nextSibling;
  d.el.insertBefore(createGlue(bar.el, view.surface), afterStrip);
  d.el.append(picked);        // under the line, as its caption

  function gutters() {
    const lane = view.strip.lanes().find((l) => l.id === 'ak');
    const list = items;
    if (lane) {
      // WHAT THIS LANE HAS, and nothing it has not measured. No durations here:
      // only films that have been PLAYED have a measured length, and a range
      // derived from two of them would be a fabricated figure.
      lane.subLabel = list.length
        ? [`${list.length} newsreels`,
           `${list[0].date.slice(5)} to ${list[list.length - 1].date.slice(5)}`,
           'one a week, all year']
        : null;
    }
    view.strip.invalidate();
  }

  // ── picking a day, and opening one ────────────────────────────────────────
  /**
   * 🔴 PICKING A DAY COSTS NOTHING. OPENING ONE COSTS ERR, SO ONLY SOMEBODY
   * ASKING TO HEAR IT OPENS ONE. Split 2026-09-19.
   *
   * What this page did before: it opened a newsreel AND that day's radio on
   * LOAD, before anybody pressed anything, and every step and every landing did
   * the same whether or not anything was playing. So a visit was two content
   * GETs and a stream held open, and a run of the suite was that again for
   * every button it pressed, on a page whose own sentence is that it streams
   * from ERR.
   *
   * CLAUDE.md is exact about the damage, and it is not load: a few dozen
   * headless browsers holding a broadcaster's mounts are counted as listeners
   * who never leave, and those figures are what it reports to its board and its
   * funders. It cannot be undone by stopping, only by not adding to it.
   *
   * So the two halves are separated. `select` moves the playhead, frames the
   * view, fills the caption and colours the mark, and opens NOTHING. `play` is
   * the half that reaches for ERR, and the only things that call it are a press
   * on a mark, a press of the play button on a day already picked, and a step
   * or a scrub landing while something is already playing, which is somebody
   * watching who has asked for the next one.
   *
   * ⚠️ IT IS THE SAME RULE FOR EVERYBODY, and there is no harness branch in
   * here. A page that behaves one way for a check and another way for a visitor
   * is a page nothing grades.
   */
  function select(it, { empty = true } = {}) {
    close(empty);
    current = it || null;
    d.set('picked', it ? it.date : '');
    d.set('length', null);
    if (it) {
      // The playhead goes to the day it was broadcast, and the view follows if
      // the day is off the edge — stepping to something you cannot see is not
      // stepping to it.
      deck.seek(it.at);
      // KEEP THE READER'S ZOOM. Stepping re-centres on the new day at whatever
      // span is currently shown — it does not snap back to the opening view,
      // because someone who zoomed out to see the month meant it.
      const v = view.strip.view();
      const span = (view.strip.canvas.width / (window.devicePixelRatio || 1)) * 1000 / v.pxPerSecond;
      const left = v.originTime + (v.scrollX / v.pxPerSecond) * 1000;
      // `span > 0` because a canvas that has not been measured yet reports a
      // width of 0, and re-centring on a view with no width asks `fit` for an
      // empty window.
      if (span > 0 && (it.at < left || it.at > left + span)) fitInYear(it.at - span / 2, it.at + span / 2);
    }
    // BOTH HALVES OF THE DAY, whichever one was picked. Picking a newsreel
    // finds that date's radio and picking a radio programme finds that date's
    // newsreel, so the two columns and what actually plays always agree.
    const picture = !it ? null : it.kind === 'video' ? it : items.find((v) => v.date === it.date) || null;
    const sound   = !it ? null : it.kind === 'audio' ? it : radio.find((r) => r.date === it.date) || null;
    fill(colFilm, picture, 'video');
    fill(colRadio, sound, 'audio');
    halves = { picture, sound };
    view.strip.invalidate();
    return { picture, sound };
  }

  /**
   * SHUT WHAT IS OPEN. A picture left standing under another day's caption is
   * the page disagreeing with itself.
   *
   * ⚠️ `empty` IS FALSE WHEN A NEW SOURCE IS ABOUT TO GO INTO THE SAME ELEMENT,
   * AND THAT IS NOT TIDINESS. `film.load()` re-runs the media load algorithm,
   * where WebKit re-applies the behaviour restrictions a user gesture lifted.
   * This page has already paid for a spent gesture once: every newsreel came
   * out SILENT, reported three times, with nothing wrong in the player.
   */
  function close(empty = true) {
    opened = null;
    film.pause(); wireless.pause();
    if (hls) { hls.destroy(); hls = null; }
    if (aHls) { aHls.destroy(); aHls = null; }
    // AND EMPTY IT. Destroying the hls instance leaves the element un-paused
    // with a source that no longer exists — inaudible today, and exactly the
    // state that becomes a phantom second sound the next time something calls
    // play() on everything.
    wireless.removeAttribute('src'); wireless.load();
    if (!empty) return;
    film.removeAttribute('src'); film.load();
    film.dataset.empty = '1';
    film.controls = false;
  }

  // STREAMS, STORES NOTHING. One content GET to arhiiv.err.ee for the film's
  // media url, then the element is given that URL. The page never holds the
  // bytes: no fetch of segments, no blob URL over them, nothing to R2 or to
  // localStorage. A copy is the one thing this must not make.
  async function play(it) {
    // BLESS THE ELEMENT NOW, before anything is awaited.
    //
    // A user gesture does NOT survive an `await`. This function fetches the
    // media url first and calls `play()` after, by which time the gesture is
    // spent — so the unmuted play was refused and the fallback muted it. Every
    // newsreel came out silent, twice reported, and my headless check missed it
    // because `--autoplay-policy=no-user-gesture-required` is exactly the flag
    // that hides this.
    //
    // Calling `play()` synchronously inside the gesture marks the element as
    // user-activated even though it rejects for having no source yet. That
    // rejection IS the mechanism, not a failure.
    (it.kind === 'audio' ? wireless : film).play().catch(() => {});
    // The same picking every other path does, with the film element left
    // holding its old source because a new one is about to replace it.
    const { picture, sound } = select(it, { empty: false });

    // ERR hands back a PROTOCOL-RELATIVE url (`//vod.err.ee/…`). On the deployed
    // https page that resolves to https on its own, but on a local http server
    // it resolves to http — so the same code plays over a different protocol
    // depending on where it runs, which is the kind of difference that is
    // invisible until it is a mixed-content block. Pin it.
    const streamOf = async (item, kind) => {
      try {
        const r = await fetch(reachERR(`${ARHIIV}/api/v1/content/${kind}/${encodeURIComponent(item.slug)}`));
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const j = await r.json();
        const raw = (j?.data?.media || j?.media)?.src?.hls;
        if (!raw) { d.log(`${item.slug}: no stream offered`, 'bad'); return null; }
        return raw.startsWith('//') ? `https:${raw}` : raw;
      } catch (e) {
        d.log(`could not ask ERR for ${item.slug}: ${e.message}`, 'bad');
        return null;
      }
    };
    const src = picture ? await streamOf(picture, 'video') : null;
    // ERR would not say where the film is, so there is nothing to show. The box
    // goes black rather than keeping the LAST day's picture under this day's
    // caption, which is the page disagreeing with itself about what is up.
    if (picture && !src) { close(); return; }
    // ── the sound ────────────────────────────────────────────────────────
    // WHERE IT GOES DEPENDS ON WHETHER THERE IS A PICTURE. With a newsreel to
    // pair against, the radio loads into the hidden element and the picture
    // drives it. With no newsreel, the radio goes into the VIDEO element
    // itself — a <video> plays an audio-only HLS stream perfectly well, shows
    // a black frame, and its controls are then real controls driving real
    // media. That is how a sound-only day gets the same transport as every
    // other day without a second set of buttons appearing under the picture.
    const su = sound ? await streamOf(sound, 'audio') : null;
    if (su && picture) {
      if (NATIVE_HLS || !window.Hls || !window.Hls.isSupported()) wireless.src = reachERR(su);
      else { aHls = new window.Hls({ enableWorker: true }); aHls.loadSource(reachERR(su)); aHls.attachMedia(wireless); }
      wireless.muted = false;
      wireless.play().catch(() => {});
      d.log(`paired with the same day's radio: ${sentenceCase(sound.title).slice(0, 40)}`, 'hi');
    } else if (picture) {
      d.log('no radio survives from this day. The newsreel plays silent');
    }

    if (!picture) {
      // Sound only: black picture, real controls, nothing in the hidden
      // element — there is no second stream to keep alongside.
      if (!su) { close(); return; }
      film.dataset.empty = '1';
      film.controls = true;
      film.muted = false;
      if (NATIVE_HLS || !window.Hls || !window.Hls.isSupported()) film.src = reachERR(su);
      else { hls = window.__hls = new window.Hls({ enableWorker: true }); hls.loadSource(reachERR(su)); hls.attachMedia(film); }
      opened = it;                         // a connection to ERR is open from here
      await film.play().catch(() => {});
      d.log(`playing radio ${sound.slug}. It streams from ERR and nothing is stored here`, 'hi');
      return;
    }

    delete film.dataset.empty;
    film.controls = true;
    if (hls) { hls.destroy(); hls = null; }
    if (NATIVE_HLS) {
      film.src = reachERR(src);              // WebKit plays HLS, audio group and all
    } else if (window.Hls && window.Hls.isSupported()) {
      hls = window.__hls = new window.Hls({ enableWorker: true });
      hls.loadSource(reachERR(src));
      hls.attachMedia(film);
      hls.on(window.Hls.Events.ERROR, (_e, data) => {
        if (data.fatal) d.log(`hls fatal ${data.type}/${data.details}`, 'bad');
      });
    } else {
      // No picture is possible here, so the radio that was just attached is
      // shut with it. Holding a stream open for a day the page cannot show is
      // a connection nothing is listening to.
      d.log('this browser cannot play HLS', 'bad');
      close();
      return;
    }
    opened = it;                           // a connection to ERR is open from here

    // WITH SOUND. `armVideo` mutes — that is its whole job, buying autoplay on a
    // page that never got a gesture — and using it here made every newsreel
    // silent. This play came FROM a gesture (a press on the line), so sound is
    // allowed and these films have it: AAC in its own group, alongside
    // renditions up to 1920x1080.
    //
    // The fallback is still there and is still needed: a browser may refuse
    // anyway, and a muted picture beats no picture. But it is the fallback now,
    // not the default.
    film.muted = false;
    try {
      await film.play();
    } catch {
      // Kept, because a browser may still refuse and a muted picture beats no
      // picture — but it should now be rare rather than every single time.
      film.muted = true;
      await film.play().catch(() => {});
      d.log('the browser refused sound. Press play on the picture to hear it', 'bad');
    }
    d.log(`playing ${picture.slug}. It streams from ERR and nothing is stored here`, 'hi');
    // THE PICTURE DRIVES THE SOUND. Not a servo and not a sync loop — the two
    // are different recordings of different lengths that merely share a day, so
    // pretending to hold them in lockstep would be inventing a relationship the
    // archive does not have. They start together, stop together, and a scrub of
    // the picture takes the sound to the same offset. Where the radio is longer
    // than the film, which is usual, it simply keeps its own place.
    const follow = () => {
      if (!hasSound()) return;
      if (film.paused) wireless.pause();
      else wireless.play().catch(() => {});
    };
    film.addEventListener('play', () => { if (!deck.playing()) deck.play(); follow(); });
    film.addEventListener('pause', () => { if (deck.playing()) deck.pause(); follow(); });
    film.addEventListener('seeked', () => {
      if (!wireless.src && !aHls) return;
      const t = film.currentTime;
      if (Number.isFinite(wireless.duration) && t <= wireless.duration
          && Math.abs(wireless.currentTime - t) > 0.25) wireless.currentTime = t;
    });
    // THE FILMS ARE SILENT, and it took four reports of "no sound" to establish
    // that nothing was broken.
    //
    // Measured: every `AK filmikroonika` audio fragment is exactly 6,766 bytes
    // per 10 seconds — 5.4 kbps, which is what AAC costs to encode silence. A
    // 1965 item from outside the series measured 123.8 kbps on the same path,
    // so the player, the CORS, the audio group and the decoder are all fine.
    // `filmikroonika` was shot MUTE; sound was added at screening or not at all.
    //
    // This still reports, because "silent" and "broken" look identical from the
    // outside and the difference is the whole point. It just no longer accuses
    // the player of a fault that belongs to 1965.
    setTimeout(() => {
      const a = film.webkitAudioDecodedByteCount;
      if (a === undefined) return;
      const kbps = (a * 8) / 6 / 1000;
      d.log(kbps > 24
        ? `sound is arriving at ${Math.round(kbps)} kbps`
        : `this newsreel is SILENT. Its audio track carries ${kbps.toFixed(1)} kbps, which is `
          + `what silence costs. The newsreels were shot mute.`, 'hi');
    }, 6000);

    film.addEventListener('loadedmetadata', () => {
      if (!Number.isFinite(film.duration)) return;
      it.playedMs = Math.round(film.duration * 1000);
      d.set('length', (it.playedMs / 60000).toFixed(1));
      gutters();
    }, { once: true });
  }

  // THE DECK AND THE PICTURE MOVE TOGETHER, WHEN THERE IS A PICTURE. Anything
  // that starts the deck (the play button, the keyboard, a release after a
  // scrub) starts whatever is open, and anything that stops it stops that.
  //
  // ⚠️ WITH NOTHING OPEN THE YEAR SIMPLY RUNS, and this branch used to open the
  // first film instead. The playhead advances at one second of 1965 per second
  // of now, which at a month to a screen is about a pixel an hour: invisible,
  // and truthful. `command.play` says so in the log, which is where the words
  // belong.
  deck.transport.onState((st) => {
    if (st.reason === 'play') {
      if (!opened) return;
      if (film.paused) film.play().catch(() => {});
      // ONLY IF IT HOLDS SOMETHING. play() on a source-less element does not
      // throw and does not make a sound; it just leaves the element reading as
      // playing, which is a lie the next reader has to chase down.
      if (hasSound() && wireless.paused) wireless.play().catch(() => {});
    } else if (st.reason === 'pause') {
      if (opened && !film.paused) film.pause();
      if (hasSound() && !wireless.paused) wireless.pause();
    }
  });

  // ── scrubbing the year ────────────────────────────────────────────────────
  /**
   * 🔴 THE PLAYHEAD FOLLOWS THE FINGER. THE BROADCAST NEAREST WHERE IT STOPS IS
   * WHAT PLAYS. Asked 2026-09-19: *"maek scrub work"*, and until now the strip
   * had no `onSeek` at all, so it fell back to `deck.seek`: a drag moved the
   * line and nothing else happened. No film was picked, nothing loaded, nothing
   * played. From a finger that is a scrub that does nothing.
   *
   * ⚠️ THIS AXIS IS NOT `/tapes/`'S, WHICH IS WHY IT IS NOT A COPY OF IT. A
   * tape runs end to end, so every position on that line is inside some
   * recording. A year of weekly broadcasts is mostly GAP: the median newsreel
   * is 2.2 minutes and the next one is a week away, so almost every position a
   * finger can stop on has nothing under it at all. Landing on the nearest is
   * therefore the only reading of a scrub that can always be honoured.
   *
   * ⚠️ AND THE EXPENSIVE HALF WAITS FOR THE HAND TO STOP AND LET GO. `onSeek`
   * fires continuously through a drag; loading on every call would tear the
   * media element down and build it again once per broadcast crossed, which is
   * the lane flashing that `/tapes/` reported, and here it would also ask ERR
   * for a stream URL per film crossed. So the landing wants two things: 140 ms
   * of stillness, which is a hand that has stopped rather than one that is
   * still going, and a finger that is off the glass.
   */
  // WHICH LANE THE FINGER IS IN. `onSeek` is handed a position and nothing
  // else, and the two lanes are two archives, so a drag along the radio lane
  // has to land on radio. The strip resolves the lane for its own hover and
  // does not publish it, so the y is read here off the same geometry its
  // `laneAt` uses: lane boxes are in canvas units, and a client y scales into
  // them through the canvas's rect.
  let pointerLane = null, pressAt = null;
  const laneAtClientY = (clientY) => {
    const r = view.strip.canvas.getBoundingClientRect();
    if (!r.height) return null;
    const y = (clientY - r.top) * (view.strip.state.height / r.height);
    return view.strip.lanes().find((L) => L.show && y >= L.y && y < L.y + L.height) || null;
  };
  // HOW NEAR A BROADCAST IS TO A MOMENT: the distance to its SPAN, not to its
  // start. A mark is minutes wide against days of gap, so the two answers
  // differ only when somebody has zoomed right in, which is exactly when a
  // finger resting inside a clip means that clip.
  const nearestOf = (at, pool) => {
    let best = null, gap = Infinity;
    for (const it of pool) {
      const from = it.at, to = it.at + (it.playedMs ?? it.catalogueMs ?? MEDIAN_MS);
      const g = at < from ? from - at : at > to ? at - to : 0;
      if (g < gap) { gap = g; best = it; }
    }
    return best;
  };
  let scrubTo = null, scrubTimer = 0;
  const cancelScrub = () => { clearTimeout(scrubTimer); scrubTimer = 0; scrubTo = null; };
  function stripSeek(at) {
    // The line moves NOW, whatever is loaded underneath it. Deferring this as
    // well would be a scrub with no feedback, which is worse than a flash.
    deck.seek(at);
    scrubTo = { at, lane: pointerLane?.id || null };
    clearTimeout(scrubTimer);
    scrubTimer = setTimeout(landScrub, 140);
  }
  function landScrub() {
    scrubTimer = 0;
    // 🔴 NOTHING PLAYS UNDER A FINGER THAT IS STILL DOWN. A hand can stop for
    // 140 ms halfway through a drag and go on, and opening a stream at that
    // moment is a broadcast chosen by a pause in somebody's movement rather
    // than by where they let go. The landing is KEPT rather than dropped: the
    // release below runs it.
    if (pressAt) return;
    const s = scrubTo; scrubTo = null;
    if (!s) return;
    // The lane the drag was in, when it was in one. A finger on the axis or in
    // the gutter has not said which archive it means, so it gets the nearest
    // broadcast of either kind.
    const pool = s.lane === 'radio' ? radio : s.lane === 'ak' ? items : days;
    const it = nearestOf(s.at, pool.length ? pool : days);
    // Already picked. A day brings both of its halves, so a drag that stops
    // over a newsreel's own radio programme has landed on the day it is on.
    if (!it || it === halves.picture || it === halves.sound) return;
    // KEEP GOING IF IT WAS GOING, and otherwise just pick it. A scrub across a
    // stopped year is somebody reading the line, and opening a stream under
    // every finger that comes to rest is the cost this page exists not to
    // impose. See the header over `select`.
    if (going()) play(it); else select(it);
  }

  view.strip.canvas.addEventListener('pointerdown', (e) => {
    pointerLane = laneAtClientY(e.clientY);
    pressAt = { x: e.clientX, y: e.clientY };
  });
  view.strip.canvas.addEventListener('pointermove', (e) => { pointerLane = laneAtClientY(e.clientY); });
  // A gesture somebody else claimed is not a choice of broadcast.
  view.strip.canvas.addEventListener('pointercancel', () => { pressAt = null; cancelScrub(); });
  /**
   * PRESS A MARK TO PLAY IT.
   *
   * ⚠️ A PRESS, NOT A DRAG, and that became load-bearing the moment the drag
   * above started meaning something. A plain drag on this strip SEEKS, and the
   * strip stops updating its hover for the duration of one, so the hit sitting
   * in `hover` at the end of a drag is the mark the drag STARTED on. Without
   * the six pixels, every scrub would finish by playing whatever it set off
   * from.
   */
  view.strip.canvas.addEventListener('pointerup', (e) => {
    const p = pressAt; pressAt = null;
    if (!p || Math.abs(e.clientX - p.x) > 6 || Math.abs(e.clientY - p.y) > 6) {
      // A DRAG, so this release IS the answer. The timer may already have run
      // and stood off because the hand was still down; either way the landing
      // happens now rather than never.
      if (scrubTo) landScrub();
      return;
    }
    const h = view.strip.state?.hover;
    const slug = h?.row?.payload?.slug;
    const it = slug && (items.find((x) => x.slug === slug) || radio.find((x) => x.slug === slug));
    // A press on nothing is still a position: it lands on the broadcast
    // nearest it, exactly as a drag does. ⚠️ AND IT LANDS HERE RATHER THAN
    // WAITING FOR THE TIMER, because a press held longer than 140 ms has
    // already spent the timer while the finger was down and there is no second
    // one coming.
    if (!it) { if (scrubTo) landScrub(); return; }
    // A press on a mark is an ANSWER, so the drag's deferred landing has
    // nothing left to decide. Without this the timer fires 140 ms later and
    // lands on whatever was nearest that pixel, which is usually the mark just
    // pressed and is not always it.
    cancelScrub();
    play(it);
  });

  // ── load the year ─────────────────────────────────────────────────────────
  (async () => {
    const fx = await (await fetch('/reel/1965.json')).json();
    items = fx.items.filter((i) => i.kind === 'video' && i.series === SERIES);
    radio = fx.items.filter((i) => i.kind === 'audio');
    const filmDays = new Set(items.map((i) => i.date));
    sharedDays = radio.filter((r) => filmDays.has(r.date)).length;
    rebuildDays();
    const known = items.map((i) => i.catalogueMs).filter(Boolean).sort((a, b) => a - b);
    if (known.length) MEDIAN_MS = known[known.length >> 1];
    gutters();

    // SIX HOURS, not a week and certainly not a year. The deck still holds all
    // of 1965 and pans and zooms across it — but the opening view has to be one
    // where a CLIP IS A BAR rather than a tick.
    //
    // The arithmetic decides it, and it is a trade rather than a right answer.
    // Clips are minutes long and a day apart, so width-in-proportion and
    // several-clips-at-once cannot both be had:
    //
    // A MONTH. That is a view about the YEAR rather than about one film: roughly
    // twenty-four newsreels on screen at once, which is what makes the shape of
    // the series visible — weekly, all year, with the gaps where a week was
    // missed.
    //
    // Each clip is a 2 px mark at this span, and that is the floor doing its
    // job rather than a failure. A 2.2-minute film in a month is 0.005 % of the
    // view; nothing shows that honestly AND legibly at once. So the width is
    // proportional wherever there is room for it to be, the floor keeps a clip
    // from vanishing, and the strip prints its own span so the trade is visible
    // instead of mysterious. Zoom in and the bars become bars.
    const SPAN = 30 * DAY;
    // Open on a day where BOTH survive, so the thing this page does is visible
    // before anyone presses anything. Most days pair — 283 of them — but the
    // first newsreel of the year is not one of them, and opening on a silent
    // day makes the page look like it only has half the material.
    //
    // 🔴 THE VIEW OPENS THERE. NOTHING IS PICKED AND NOTHING IS FETCHED.
    // This used to end `play(openOn, true)`, which opened a newsreel and that
    // day's radio on every single visit, before anybody pressed anything, for a
    // first frame nobody had asked to see. Framing the month and standing the
    // playhead on the day costs no bytes and says the same thing: here is where
    // the material starts.
    const radioDays = new Set(radio.map((r) => r.date));
    const openOn = items.find((i) => radioDays.has(i.date)) || items[0];
    fitInYear(openOn.at - SPAN / 2, openOn.at + SPAN / 2);
    deck.seek(openOn.at);
    d.log(`${items.length} newsreels and ${radio.length} radio programmes, `
      + `${sharedDays} days with both. Nothing is asked of ERR until you play one`);
    // Reachable from the harness, the way `window.__hls` is: a press on the
    // line is the page's only way in, so a check that cannot find the line
    // cannot test anything the page actually does.
    window.__strip = view.strip;

    d.assert('the line is positioned in 1965, not 1970',
      deck.position() >= YEAR_FROM && deck.position() < YEAR_TO, iso(deck.position()));
    d.assert('the whole year is on it', items.length > 250, `${items.length} newsreels`);
    d.assert('every newsreel has a day', items.every((i) => Number.isFinite(i.at)),
      `${items[0].date} to ${items[items.length - 1].date}`);
    d.assert('positions are negative: 1965 is before the epoch',
      items.every((i) => i.at < 0), `${items[0].at}`);
    // WHY THIS IS ASSERTED AT ALL: the strip auto-detects an absolute domain by
    // magnitude (`range[0] > 1e12`), and 1965 is NEGATIVE — so the detection
    // says "relative" and the axis would read `-1822d` instead of `1965-01-04`.
    // The page's `absolute: true` is what fixes that, and dropping it fails here.
    d.assert('the axis reads as dates, not as a count of days from 1970',
      view.strip.state.absolute === true
        && /^\d{4}-\d{2}-\d{2}$/.test(formatTime(deck.position(), 86400000, view.strip.state.absolute)),
      formatTime(deck.position(), 86400000, view.strip.state.absolute));
    // 🔴 THE LOOP'S ARITHMETIC, GRADED WITHOUT OPENING ANYTHING. A mark on this
    // line is a moment in 1965, and the loop plays it as an offset into the film
    // that is up, so this mapping is what the loop stands on. It is also the
    // ONLY part of the loop this page can check: the rest needs a real stream
    // from ERR, and a check is not a reason to open one.
    d.assert('a mark on the line is an offset into the day it sits on',
      Math.abs(intoOf(items[0], items[0].at + 12345) - 12.345) < 1e-9,
      `${intoOf(items[0], items[0].at + 12345).toFixed(3)} s into ${items[0].slug}`);
    d.assert('the picture is the transport master, so the line follows it', !!master);
    // 🔴 WHERE A SCRUB LANDS, GRADED WITHOUT OPENING ANYTHING. A finger stops
    // between broadcasts far more often than on one, so the arithmetic that
    // picks the nearest IS the behaviour. The rest of a scrub needs a stream
    // from ERR, and a check is not a reason to open one.
    // ⚠️ BOTH DIRECTIONS, because one of them alone passes for a function that
    // always answers with the same end of the year.
    const after = nearestOf(items[0].at + 3600000, items);
    const before = nearestOf(items[1].at - 3600000, items);
    d.assert('a scrub lands on the broadcast nearest where it stopped',
      after === items[0] && before === items[1], `${after?.date} then ${before?.date}`);
    /**
     * 🔴 THE RULE THIS PAGE LIVES UNDER, GRADED AS A CONNECTION COUNT RATHER
     * THAN AS AN INTENTION. Every URL that leaves for ERR goes through
     * `reachERR`, so both of these ask the only question worth asking: how many
     * times did this page reach for somebody else's server?
     *
     * The first is data already in hand and runs for everybody, which is what
     * makes it worth having: a visitor's own page is the honest witness to
     * whether opening it costs a broadcaster anything.
     */
    d.assert('a visit opens nothing at ERR', errOpens === 0,
      `${errOpens} reaches since the page loaded`);
    /**
     * ⚠️ THE SECOND PRESSES A CONTROL, SO IT IS BEHIND THE GATE. `step` is what
     * ‹ and › call, and a check that went round it would be grading a copy of
     * the rule rather than the rule — but `selfcheck.mjs` is exact about what
     * moves behind the gate, and "presses a control" is on its list.
     * 🔴 THE RULE ITSELF IS NOT GATED AND MUST NEVER BE. Stepping while nothing
     * plays picks a day for everybody; what is gated is only this page driving
     * its own buttons to prove it.
     * ⚠️ AND IT PUTS THE PAGE BACK. Two steps forward and back leave the day
     * the view opened on picked; `select(null)` returns it to the state a
     * visitor arrives in, which is nothing picked and no connection held.
     */
    ifSelfcheck(() => {
      const reachesBefore = errOpens;
      step(+1); step(-1);
      const reaches = errOpens - reachesBefore;
      select(null);
      d.assert('stepping while nothing plays opens nothing at ERR',
        reaches === 0, `${reaches} reaches for ERR across two steps`);
    });

    /**
     * 🔴 THE LINE UNDER THE STRIP SAYS WHAT THE POINTER IS ON, AND SAYS SO WHEN
     * IT IS ON NOTHING. Both halves are the check: a box that reports only when
     * there is something to report is a box that collapses and takes the page
     * down with it every time a finger moves off a mark.
     *
     * ⚠️ IT DRIVES THE STRIP'S OWN POINTER PATH rather than calling
     * `footer.set` with a hit of its own making. Everything worth grading is
     * between those two points: the hit test, `describeRow`, and the wiring
     * `createStripView` does between the strip's `onHover` and the footer. A
     * check that handed the footer a hit would be grading the footer's
     * `textContent`, which nobody doubts.
     *
     * ⚠️ AND IT AIMS AT THE DAY THE VIEW OPENED ON, so no zoom and no pan is
     * needed to reach it: it is at the centre of the opening month by
     * construction, and the nearest other newsreel is days away against a hit
     * tolerance of six pixels. Behind the gate, because moving a pointer over a
     * page is something a person would see.
     */
    ifSelfcheck(() => {
      // Lay the lanes out NOW rather than on the next frame: `y` is written
      // during a draw, and a check that read it before the first one would be
      // aiming at a lane with no position yet.
      view.strip.draw();
      const S = view.strip.state;
      const r = view.strip.canvas.getBoundingClientRect();
      const lane = view.strip.lanes().find((l) => l.id === 'ak');
      const dur = openOn.playedMs ?? openOn.catalogueMs ?? MEDIAN_MS;
      const ready = !!lane && Number.isFinite(lane.y) && r.width > 0 && S.width > 0;
      // the same arithmetic `localX`/`localY` do, run backwards
      const cx = ready ? r.left + (view.strip.timeToX(openOn.at + dur / 2) + S.gutterPx) * (r.width / S.width) : 0;
      const cy = ready ? r.top + (lane.y + lane.height / 2) * (r.height / S.height) : 0;
      view.strip.canvas.dispatchEvent(new PointerEvent('pointermove',
        { clientX: cx, clientY: cy, bubbles: true }));
      const on = view.footer.says();
      const tall = view.footer.el.offsetHeight;
      d.assert('pointing at a mark says what it is, under the line rather than over it',
        ready && on[0] === sentenceCase(openOn.title).slice(0, 46) && on[1] === openOn.date,
        ready ? on.filter(Boolean).join(', ') : 'the strip has not been measured yet');
      view.strip.canvas.dispatchEvent(new PointerEvent('pointerleave',
        { clientX: r.left - 10, clientY: r.top - 10, bubbles: true }));
      const off = view.footer.says();
      d.assert('and with nothing under it, it says so and keeps its height',
        off[0] === STRIP_FOOTER_EMPTY && !off[1] && view.footer.el.offsetHeight === tall,
        `${off[0]}, ${view.footer.el.offsetHeight} px of ${tall}`);
    });
    d.assert('nothing is stored: no media in the fixture',
      !JSON.stringify(items[0]).match(/https?:|\.m3u8|\.mp4/), 'catalogue metadata only');
    d.ready();
  })().catch((e) => d.fail(e));
</script>
</html>
