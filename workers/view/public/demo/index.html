<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON</title>
<link rel="stylesheet" href="/demo/shell/shell.css">
<link rel="icon" href="/favicon.ico">

<div class="d-head">
  <div class="d-title"><h1 class="d-name">positron</h1></div>
</div>

<ol class="d-acts" id="rows"></ol>

<script type="module">
  import { DEMOS } from '/demo/manifest.mjs';
  const root = document.getElementById('rows');
  for (const d of DEMOS) {
    const href = d.built ? `/demo/${d.n}-${d.name}/` : (d.page || null);
    const li = document.createElement('li');
    li.className = href ? 'd-row' : 'd-row todo';
    li.innerHTML = `<a${href ? ` href="${href}"` : ''}><span class="n">${d.n}</span><span class="nm">${d.name}</span></a>`;
    root.append(li);
  }
</script>
</html>
