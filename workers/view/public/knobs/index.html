<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

<script type="module">
  // demo/knobs/index.html, plans/plan-controller.md step 3.
  //
  // Two sliders, one filter, one Raspberry Pi. The subject is CONTINUOUS
  // CONTROL, not notes: every message is a complete statement of where a knob
  // is, the last one is the only one that stays true, and losing one is
  // harmless the instant the next arrives. That is why this page has a send
  // gate and a restatement rather than an ack, and why it counts what it did
  // NOT send as carefully as what it did.
  //
  // 🔴 NO GRANULATOR ANYWHERE IN HERE. It came out of the board's signal path
  // on 2026-09-16 (archive/box-pappus/), and this page has never had one.
  import { mount, guard, el } from '/shell/shell.mjs';
  // 🔴 REAL ROTARIES SINCE 2026-09-25, AND THE PAGE CALLED `knobs` HAD NONE.
  // Asked as *"left to rotaries cutoff reseonance"*. It built both with
  // `createSlider` and paired them with `createSliderGroup`, so the one page in
  // this project named after a control was the one page not using it.
  // ⚠️ THE INVISIBLE HAND SURVIVES THE SWAP BECAUSE IT WAS NEVER THE SLIDER'S.
  // `knob.mjs` and `slider.mjs` both import `createHandDrive` from
  // `hand-drive.mjs`, so `hand: true` and `onHand:` mean the same thing on
  // both, and this page's subject comes across untouched.
  import { createKnob } from '/shell/knob.mjs';
  import { createControlGrid } from '/shell/control-grid.mjs';
  import { createKeyboard, keyRange } from '/shell/keyboard.mjs';
  import { createInstrumentPanel } from '/shell/instrument-panel.mjs';
  import { createMidi, offerLoopFor, checkEvolutionLoop } from '/shell/midi.mjs';
  // The hand's yield, from the module that owns it rather than from a
  // re-export: this page no longer builds a slider.
  import { HAND_YIELD_MS } from '/shell/hand-drive.mjs';
  // The sweep's own lap, so a check waiting for it cannot fall out of step with
  // it the next time somebody changes how fast a hand moves.
  import { MOVES } from '/shell/hand.mjs';
  import { createDiagram } from '/shell/diagram.mjs';
  import { makeCcSend, SEND_GATE_MS, RESTATE_MS } from '/shell/cc-adapter.mjs';
  import { createBoard } from '/shell/board.mjs';

  /**
   * 🔴 HOW MANY TIMES THIS PAGE HAS ASKED THE BROWSER FOR MIDI, COUNTED AT THE
   * TOP OF THE MODULE SO A VISIT CAN BE GRADED RATHER THAN DESCRIBED. Same
   * wrapper `/tom/`, `/wish/` and `/muta/` all carry: `requestMIDIAccess` is a
   * permission prompt, so *a visit opens nothing* has to be an assert over a
   * counter and not a claim about a file.
   * ⚠️ IT WRAPS BEFORE ANYTHING ELSE RUNS, because a counter installed after
   * the first call is a counter that reads zero about a call that happened.
   */
  let midiAsked = 0, midiAskedOnLoad = -1;
  if (navigator.requestMIDIAccess) {
    const real = navigator.requestMIDIAccess.bind(navigator);
    navigator.requestMIDIAccess = (...a) => { midiAsked++; return real(...a); };
  }

  const q = new URLSearchParams(location.search);
  // `studio-1` is the ADDRESS OF THE RASPBERRY PI, not a rendezvous this page
  // invented, which is why the manifest row says `room: 'fixed'`.
  const ROOM = q.get('room') || 'studio-1';
  /**
   * 🔴 A HARNESS PRESS MUST NOT TAKE A SHARED INSTRUMENT AWAY FROM A PERSON.
   *
   * `demo/verify.mjs` presses every control in `.pos-controls` on every run,
   * dozens of times a day, and control 0 here starts Yoshimi on a board in
   * another building. There is ONE JACK graph and ONE instrument on it, so a
   * suite run would silently stop whatever `/keys/` or `/grains/` was doing.
   * plan-controller §6.6 says never start audio on load for exactly that
   * reason; a scripted press is not a load, it is worse, because it happens
   * far more often.
   *
   * So under `?selfcheck=1` this page does everything except put a note, a
   * patch or a controller value on the board, and it SAYS SO in the log and in
   * an assert. `?board=1` alongside it is the deliberate opt-in for somebody
   * who has been told the board is free.
   *
   * ⚠️ A visitor is unaffected: neither flag is set, so pressing Play does the
   * whole thing.
   */
  const SELFCHECK = q.get('selfcheck') === '1';
  const MAY_PLAY = !SELFCHECK || q.get('board') === '1';

  // The four controllers this page is about. 74 is Brightness and 71 is
  // Harmonic Intensity in the MIDI specification, and in the ZynAddSubFX family
  // Yoshimi belongs to they reach a part's filter cutoff and its resonance.
  // 64 is neutral: the value is an offset around whatever the patch's own
  // filter is set to, so the middle of the lane leaves the patch alone.
  const CUTOFF = 74, RESO = 71, NEUTRAL = 64;
  /**
   * 🔴 THREE SLIDERS, BECAUSE THIS INSTRUMENT HAS THREE CONTINUOUS CONTROLS YOU
   * CAN HEAR ON A HELD NOTE. It had four for an hour on 2026-09-17: bandwidth
   * (CC 75) and FM amplitude (CC 76) went in after a measurement said both moved
   * the sound by four to nine times their own floor, and came straight back out
   * on *"they do nada and added some noisy wobble"*. Both halves of that are
   * right, and it is worth being clear about why the measurement was not:
   * bandwidth's effect IS a wobble, 225 cents of beating between partials, and
   * a tracker that asks whether the sound MOVES cannot tell a control anybody
   * wants from a noise generator.
   *
   * What is left is what survived being measured against its own floor with the
   * takes interleaved, which is the only honest design on a patch that drifts
   * on its own (`node rig/board/wobble-test.mjs --ctrl 7,11,77,78 --reps 3`):
   *   CC 7 volume        level 0.0000 -> 0.0375, spread inside one arm 0.0000
   *   CC 11 expression   level 0.0000 -> 0.0466, spread 0.0005 — the same thing
   *   CC 77, CC 78       resonance: nothing, 2 Hz of brightness against 4 of spread
   *   CC 1 mod wheel     nothing, 82 Hz against 150 of spread
   * Yoshimi does not implement the General MIDI vibrato controllers at all, so
   * there was never a vibrato here to offer.
   */
  /**
   * 🔴 VOLUME CAME OUT ON 2026-09-17: *"knobs work but volume is pointless.
   * remove and bring 2 interestin cc's"*. It went in the same day because it was
   * the only third controller that measured as a clean mover — level 0.0000 to
   * 0.0375 against a spread of 0.0000 inside one arm — and measuring as a mover
   * is not the same as being worth a slider. That is twice on this page, after
   * bandwidth and FM amplitude, and the two failures have one cause: every
   * controller measurement taken here HELD ONE NOTE for the whole run, which is
   * blind by construction to everything that acts when a note STARTS. With a
   * keyboard on the page that family is exactly where the interesting ones live,
   * so `rig/board/note-test.mjs` plays short notes and measures the envelope
   * instead. The two replacements are chosen from that and are not in yet: the
   * board went off the relay before the run.
   */
  /**
   * 🔴 THE CUTOFF OPENS AT 100, NOT AT THE MIDDLE. Asked 2026-09-16: *"cutoff
   * 100 by default"*, after *"cutoff below 38 is nada"*.
   *
   * 64 is where the patch's own maker left it, which is the honest place to
   * start a control that changes somebody else's instrument, and it is not the
   * useful one: MEASURED on this board, the centroid at 64 is about 1.6 kHz and
   * at 0 it is 183 Hz, so the bottom third of the travel lives under what a
   * phone or a laptop speaker reproduces at all. Somebody who opens this page
   * and drags down hears nothing happen and concludes the page is broken.
   * ⚠️ IT IS A STARTING POSITION, NOT A LIMIT. The whole range is still there
   * and the dark end is still reachable; what changed is where a hand lands
   * before it has learned anything.
   */
  // 🔴 127, THE TOP OF THE TRAVEL. Asked 2026-09-20 as *"Knobs cutoff 128 by
  // default"*, and 128 does not exist: a MIDI controller is seven bits, 0 to
  // 127, which is why the slider declares `max: 127` and why `ctl.set` on the
  // board clamps with `Math.min(127, …)`. Saying so here rather than silently
  // substituting, because somebody reading 128 later would hunt for an
  // off-by-one that is not there.
  // ⚠️ IT WAS 100, AND THE ARGUMENT FOR 100 SURVIVES RATHER THAN BEING
  // OVERTURNED. The note below says the bottom third of the travel is under
  // what a phone or a laptop speaker reproduces at all. 127 is further from
  // that end, not nearer.
  const CUTOFF_HOME = 127;
  // Bank 95 program 6 is `Analog Filter 1`, read off the live board's own
  // `voices.list` on 2026-09-16 (878 patches, 24 banks, bank map not stale).
  // Bank select is CC 32 and the board reads that number out of Yoshimi's own
  // config, so nothing here has to know it.
  /**
   * 🔴 `AddSynth Morph`, NOT `Analog Filter 1`. Asked 2026-09-17 once the sound
   * finally arrived: *"the patch is dull, ged prev one back"*. This page had
   * always opened on 95/6, so the one being asked for is the one from `/keys/`,
   * chosen there on 2026-09-16 and archived with that page: bank 115, program
   * 32. The keyboard came across from `/keys/` and the patch it was played on
   * should have come with it.
   * ⚠️ IT IS A BANK AND A PROGRAM, never a name or a position in a list. The
   * board's banks are numbered 5, 10, 15 and up with sparse slots, so an index
   * into a flattened list of 911 moves the moment a file is added anywhere
   * before it, and a name match breaks on a rename.
   * ⚠️ AND IT MOVES ON ITS OWN, which is a feature here and a trap for a
   * measurement: two takes at one value four seconds apart differ by 0.58
   * octaves of brightness. That is why it sounds alive and why
   * `rig/board/wobble-test.mjs` has to interleave its takes on it.
   */
  const BANK = 115, PROGRAM = 32, PATCH = 'AddSynth Morph';
  // One note, held. A repeating note would retrigger the patch's own filter
  // envelope and fight the slider, which would make the page about the wrong
  // thing.
  const NOTE = 40, VEL = 96;
  // The board fixes 48000 Hz and 960-sample frames (rig/board/synth.mjs), and
  // NOTHING in this chain resamples.
  const RATE = 48000;
  // What the board publishes about its own stream. Checked against the frames
  // that actually arrive; see `checkShape`.
  const BOARD_FRAME_MS = 20, BOARD_CHANNELS = 1;

  const d = mount({
    name: 'knobs',
    // 🔴 ONE SENTENCE AGAIN, ASKED FOR 2026-09-30: the three sentence version
    // quoted back with *"shorten in both index and in page"*. It had been three
    // since 2026-09-29 on *"- make longer explaingi Pi"*, because the old one
    // line said *"another building"* and never said what was in it. So the Pi
    // stays and everything else goes: Yoshimi, the relay, MIDI and the 20 ms
    // frames are all boxes and notes in the picture at the foot of this page.
    // ⚠️ IT IS STILL `manifest.mjs`'s OWN LINE VERBATIM, differing only in the
    // first letter's case and the closing full stop.
    what: 'Play and turn the knobs of a synthesizer on a Raspberry Pi in another building.',
    /**
     * Six cells, and every one of them moves.
     *
     * `sent` is your hand, counted in this page. `played` is the
     * board, counted on the far side of the wire, which is the only side that
     * can answer for it. `round trip` and `buffer` are the two biggest terms in
     * how late the sound is, and `lost` is whether anything vanished on the way.
     *
     * ⚠️ NO `lag` CELL YET. plan-controller §6.3 wants one and §5.3 says how to
     * take it: a spectral centroid crossing, because `/keys/`'s silence-to-onset
     * trick cannot work on a sweep that happens on top of a note already
     * sounding. That is step 5 of the build order, and a cell that can never
     * fill teaches a reader to skip the row.
     * ⚠️ AND NOT THE BOARD'S `folded` EITHER, though §4.2 asks for a counter on
     * every stage that discards. The board drains every 5 ms and this page
     * sends at most one value per 20 ms, so `folded` reads 0 forever, which is
     * a constant wearing a measurement's clothes. The page's OWN discard is the
     * one that moves, because a pointer really does outrun the gate, and that
     * is `skipped`.
     */
    /**
     * 🔴 FOUR, DOWN FROM SIX. Asked 2026-09-16 with a photograph of the row:
     * *"can we keep 4?"*. CLAUDE.md says a readout with a cell too many always
     * has a weakest one, and here it had two.
     *
     * `lost` counts frames the relay dropped, and a healthy run leaves it at 0
     * for as long as anybody watches: a counter that only moves when something
     * is broken teaches a reader to stop looking at the row. It is still
     * COUNTED and still said in the log when it moves, which is where a fault
     * belongs.
     * `skipped` was the page's own discard, and it is the pair to `sent` rather
     * than a fact of its own: what your hand made that did not go is the
     * difference between the two, and the sentence under the picture says so.
     * What is left is the whole claim in four numbers: what went out, what the
     * board wrote, how far away it is, and how much sound is in hand.
     */
    /**
     * 🔴 THE TWO COUNTERS NAME THE SAME UNIT NOW, AND RENAMING THEM IS WHAT
     * SHOWED THEY DID NOT. Asked 2026-09-16: *"sent? 'cc out'?"*. `sent`
     * counted MESSAGES and `played` counted VALUES, and one message carries
     * both sliders, so a two handed sweep read 50 against 100 and the gap was
     * the packing rather than anything lost. Two numbers a reader is invited to
     * compare have to be in the same unit or the comparison is a trap.
     * ⚠️ `played` IS NOT `slices in`, which was the other half of the question.
     * It is what the BOARD wrote to the synth, read off its own counter, so it
     * is the far end of the control path and not the near end of the audio one.
     * Sound arriving is a different measurement and `buffer` is the one that
     * says whether it is healthy.
     */
    /**
     * 🔴 `sound out` REPLACES `cc played`, AND IT IS THE CELL THIS PAGE HAS
     * NEEDED ALL DAY. Every other number here is about bytes ARRIVING — frames,
     * the cushion, the round trip — and 2026-09-17 was spent inside the gap that
     * leaves: three separate causes of silence were found, and every one of them
     * presented as a page whose counters all read correct. This is the loudest
     * sample LEAVING the audio graph, which is the only number on the page that
     * can be checked against a pair of ears.
     * ⚠️ `cc played` WAS THE ONE TO GO. It reads the board's own coalescer and
     * is blank until somebody moves a controller, so it was empty exactly when a
     * visitor most wanted the page to say something, and what it reports is
     * already implied by `cc out` beside it.
     * ⚠️ AND THE COUNT STAYS EVEN, which `mount()` throws over.
     */
    readout: { 'cc out': '/s', 'sound out': '', 'round trip': 'ms', buffer: 'ms' },
    /* 🔴 NO `joined: true` SINCE 2026-09-28, AND THE FLAG IS GONE RATHER THAN
       THE ARRANGEMENT. The numbers and the log are still one surface at the
       foot of this page; every page gets that now, from `shell.mjs`, so passing
       the flag here says nothing. The argument this page made for it in
       2026-09-16 became the default's argument: split, the cells sat above the
       rotaries and the log below them, so the two things that answer *what is
       this doing* were at opposite ends of the page with the instrument in
       between. It is recorded in `shell.mjs` beside the default, where it now
       belongs, and `joined: false` is the opt-out no page passes. */
    /**
     * 🔴 THE ORDER IS LOAD-BEARING. `settleMs` lands on control 0 and nowhere
     * else, so the slow one goes first: Play opens the audio graph, asks the
     * board what it is doing, brings Yoshimi up (ten to forty seconds on a cold
     * board) and holds a note. Adding a control in front of this one would move
     * every other control's harness press, which CLAUDE.md records taking a
     * check red for a reason that had nothing to do with the control added.
     *
     * 🔴 NO KEYBOARD. The ask says the keyboard is not the point, and one held
     * note is all a filter needs.
     */
    // 🔴 NO CONTROL ROW. Transport UI is `transport-bar.mjs` and nothing else,
    // and what this page needs from a transport is exactly what that component
    // is: a play, a stop, and no invented buttons beside them.
    controls: [],
  });
  guard(d);

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  // ── the send gate ─────────────────────────────────────────────────────────
  //
  // From `demo/shell/cc-adapter.mjs`, which already owns this subject and is
  // graded without a browser by `node demo/shell/cc-send-test.mjs`. Three rules
  // come with it: the endpoint of a gesture is never held back, the gate is per
  // controller, and switches are never gated. This page has no switch; the rule
  // still applies to the first one anybody adds.
  const gate = makeCcSend();
  /**
   * ⚠️ WHICH GATE, rather than THE gate. The checks below point this at a
   * scratch one for a few lines so they can ask what a slider actually sends
   * without a board, a socket or a message. Everything else in the page reads
   * it once and never changes it.
   */
  let sendTo = gate;
  // `onInput` is a move and `onChange` is the endpoint, which is exactly the
  // gate's `end` flag. That is the whole reason the flag exists.
  const move = (c, v) => { sendTo.put(c, v); if (sendTo === gate) pump(); };
  const land = (c, v) => { sendTo.put(c, v, { end: true }); if (sendTo === gate) pump(); };

  let armed = false;              // an instrument is running, so values mean something
  let wireMsgs = 0;               // messages that actually went on the wire
  let heldBack = 0;               // messages the gate made that this page chose not to send
  let saidHold = false;

  function pump() {
    const out = gate.tick(performance.now());
    if (!out) return;
    if (!armed || !MAY_PLAY) {
      heldBack++;
      if (!saidHold && !armed) {
        saidHold = true;
        d.log('these values are remembered, not sent: nothing is playing on the board yet. Press Play, and the whole console goes out within half a second of the synth coming up');
      }
      return;
    }
    // ⚠️ EVERY DUE CONTROLLER IN ONE MESSAGE. Two sliders moving together are
    // one `ctl.set`, not two: the relay's budget is counted in messages, and a
    // message carrying two pairs costs the same as one carrying one.
    const r = wire.send({ type: 'ctl.set', channel: 0, set: out.set });
    if (r?.sent) wireMsgs++;
  }

  // ── the rotaries ──────────────────────────────────────────────────────────
  //
  // They are the FIRST row of the panel and they sit at its left edge, which is
  // the ask (*"left to rotaries cutoff reseonance"*). They were a fixed COLUMN
  // beside the keyboard until 2026-09-25 and the case's first flow child until
  // 2026-09-28: see the block beside `createInstrumentPanel` for both moves.
  /**
   * 🔴 A HAND ON EACH, AND THE PAGE SAYS SO IN THREE PLACES WHENEVER ONE IS ON.
   * This page HAD something that moved its own sliders and it was taken out on
   * 2026-09-16, on this report: *"I'm not sure where sliders did anything... Is
   * there some param CC parameters which are already moving, which I don't
   * see?"*. What makes this a different feature rather than that one coming
   * back is that it is asked for by a press, it is unmistakable while it runs,
   * and a hand takes it back in one frame. Nothing here starts by itself.
   *
   * ⚠️ AND THE BUTTON IS NOT IN THE CONTROL ROW. `verify.mjs` presses
   * `.pos-controls button` on every demo on every run, dozens of times a day,
   * and this page's control row is empty on purpose. A hand button in it would
   * start fifty messages a second to a shared Raspberry Pi on every one of
   * those runs. There is an assert on it below.
   */
  let handStarts = 0;                  // how many times a hand has been asked for
  const handSaid = (what) => (s) => {
    if (s.why === 'coarse') { d.log(`${what}: ${s.says}`, 'warn'); return; }
    if (s.on) {
      handStarts++;
      /**
       * 🔴 SHORT, AND NOT IN THIS PROJECT'S OWN WORDS. Reported 2026-09-16 with
       * the old line quoted back: *"= slooop. sjrorter. no invisb hand refs on
       * uis"*. It was three clauses explaining a ceiling nobody had hit yet and
       * an interruption anybody would discover by touching the slider, and it
       * opened with `an invisible hand`, which is the PLAN's name for this and
       * means nothing to a visitor. A log line says what just happened.
       */
      d.log(`${what} is moving by itself`);
    } else {
      const why = s.why === 'ceiling' ? ', which is the ten minute ceiling'
        : s.why === 'hidden' ? ', because this tab went to the background'
        : s.why === 'pause' ? ', because everything stopped' : '';
      d.log(`the ${what} slider is yours again${why}`);
    }
  };
  /**
   * ⚠️ `hand: { onHand }` RATHER THAN A SEPARATE `onHand:` OPTION, WHICH IS THE
   * ONE PLACE THE TWO COMPONENTS SPELL THIS DIFFERENTLY. `slider.mjs` takes
   * `hand: true` beside `onHand:`; `knob.mjs` reads the callbacks off the
   * `hand` object itself. The hand underneath is the same `createHandDrive`,
   * and this is a call-site difference rather than two behaviours.
   * ⚠️ AND `step: 1`, BECAUSE A CONTROLLER IS SEVEN BITS. Without it a rotary's
   * travel is `span / 180` per pixel and it would send 74.4 to a board that can
   * only carry integers. It also makes `knobPlaces` print no decimals.
   * 🔴 `home:` IS WHERE A DOUBLE PRESS GOES, and it is each rotary's own
   * opening position rather than the middle of the travel: the cutoff opens
   * where the filter can be heard and the resonance opens where the patch's
   * maker left it, which is the same pair `panic()` brings them back to.
   */
  const cutoff = createKnob({
    label: 'cutoff', min: 0, max: 127, step: 1, value: CUTOFF_HOME, home: CUTOFF_HOME,
    hand: { onHand: handSaid('cutoff') },
    onInput: (v) => move(CUTOFF, v),
    onChange: (v) => land(CUTOFF, v),
  });
  const reso = createKnob({
    label: 'resonance', min: 0, max: 127, step: 1, value: NEUTRAL, home: NEUTRAL,
    hand: { onHand: handSaid('resonance') },
    onInput: (v) => move(RESO, v),
    onChange: (v) => land(RESO, v),
  });
  /**
   * 🔴 THE LATTICE, SINCE 2026-09-28, ASKED FOR AS *"knobs: use rotaty sliders
   * grid"*. It was `createKnobBank` until this line, which is a flex ROW at
   * `--ctl-gap`: the two rotaries sat 8 px apart and their centres were as far
   * apart as a dial is wide. `createControlGrid` is the kit's lattice and
   * `/muta/` already wears it, so the two pages that carry rotaries now carry
   * them at one pitch.
   * ⚠️ **AND A LATTICE OF ONE ROW IS STILL A LATTICE, WHICH IS WHAT MAKES THIS
   * VISIBLE AT ALL.** `pitchFor` is `max(width, height)`, and a knob cell is far
   * taller than it is wide, so the column track opens out to the ROW pitch: the
   * two dials move apart by the difference between a dial's width and a cell's
   * height, and the dial sits centred in its own square cell. The centres are on
   * the same square grid a second row would land on, which is the whole claim
   * the component makes.
   * 🔴 **THE GAP IS PASSED, NEVER SET AS A CUSTOM PROPERTY, AND `/muta/`'s OWN
   * STYLESHEET RECORDS WHY.** `createControlGrid` writes its gap as an INLINE
   * style, which no `--ctl-gap` on a page can reach: a `.muta-panel { --ctl-gap:
   * 16px }` there claimed to set the rotary pitch, did not, and the lattice
   * measured 94.0 px across at a pitch of 84 plus 10 while the rule read as
   * correct. 10 is the component's own figure and is what `/muta/` passes, so
   * the two lattices are one measurement rather than two that happen to agree.
   * ⚠️ AND IT SCROLLS SIDEWAYS RATHER THAN SQUEEZING, which is the pair
   * `.pos-knob-row` had and `.pos-cg` has: `overflow-x` with `min-width: 0`
   * beside it, or a narrow surface drags the document instead of the row.
   */
  const KNOB_GAP = 10;
  const knobs = createControlGrid({ cols: 2, gap: KNOB_GAP, items: [cutoff, reso] });

  // ── audio ─────────────────────────────────────────────────────────────────
  /**
   * 🔴 EVERYTHING BETWEEN THIS PAGE AND THE RASPBERRY PI IS `board.mjs`, AND IT
   * WAS NOT UNTIL 2026-09-17. Asked that day: *"Ahould board.mjs used by both?
   * Make inra close as possible on keys and knobs"*. The component was written
   * the day before to be shared and a report said both pages were on it; only
   * `/keys/` was. This page still carried its own socket, its own
   * AudioContext, its own worklet, its own cushion, its own frame counters and
   * its own shape check, which is the same six things twice.
   *
   * ⚠️ WHAT IS LEFT HERE IS WHAT IS ACTUALLY THIS PAGE'S: which verbs it sends,
   * what it does with a frame after the playout has it, and what its log calls
   * things. The cushion stays a per-page number and that is not drift: 160 ms
   * here, where one note is held under a filter sweep and a click is the thing a
   * listener cannot ignore, against 100 on `/keys/`, which reports press to
   * sound and pays for every millisecond of it.
   */
  let rtt = null;
  let boardAnswered = false, playing = null, boardSaid = '';
  let meter = null, meterAt = 0, playedPerSec = 0;
  let lastBreaks = -1;

  const board = createBoard({
    room: ROOM,
    relay: q.get('relay') || undefined,
    of: 'Raspberry Pi',
    /**
     * 🔴 THE BADGE SAYS THE WORD AND NOT THE NAME, ASKED FOR 2026-09-29 AS
     * *"Rasp Pi online -> ONLINE"*. It printed `Raspberry Pi online` in the
     * plate's foot, an inch to the right of a nameplate reading `KNOBS`, on the
     * one page in this project whose whole subject is that one board. The name
     * was the longest thing in the foot and the only word in it nobody needed.
     * ⚠️ AND IT IS THE COMPONENT'S OPTION RATHER THAN A RULE IN THIS PAGE'S
     * STYLESHEET, BECAUSE THE NAME IS PART OF A RESERVED WIDTH. `presence.mjs`
     * measures `--pres-ch` over every phrase the badge can EVER say, so hiding
     * the words with CSS would leave the whole reserve standing and the badge
     * holding air, and that reserve is the only reason nothing in it moves while
     * it redraws. MEASURED on this page, 2026-09-29, before and after: `--pres-ch`
     * 26 and `min-width: 172.187px` against 13 and `86.0933px`, and the badge
     * round it 190.17 px against 104.08.
     * ⚠️ THE NAME IS NOT LOST, IT MOVES TO THE HOVER. `presence.mjs`'s `title()`
     * is `${of} ${word}` whatever the badge prints, so the tooltip and the
     * accessible name both still read `Raspberry Pi online`. MEASURED after.
     */
    showName: false,
    /**
     * 🔴 160 ms, RAISED FROM 100 ON A MEASUREMENT AND A REPORT. Reported
     * 2026-09-16 while listening: *"some vobbly sound, cutoffs, not nice"*, with
     * a log full of `ran dry` and `trimmed`. MEASURED off this relay the same
     * minute, 992 frames in 20 s with a node client and no browser in the way:
     * nothing was lost and the mean gap was exactly 20.0 ms, but p90 was 29.5,
     * p99 was 43.5 and the worst single gap was 83.6 ms. A 100 ms cushion has
     * 16 ms left after a lump like that.
     * ⚠️ NOTHING IS BEING LOST ON THE WIRE, which is what makes this a cushion
     * decision rather than a network one: the frames all arrive, some of them in
     * lumps. A cushion has no restoring force, so the floor still ratchets when
     * it is proved too small.
     * ⚠️ AND IT COSTS WHAT IT COSTS: 60 ms more between a hand and the sound, on
     * a path whose round trip is about 45 ms. The trade is a filter that answers
     * a little later against one that clicks.
     */
    cushionMs: 160,
    maxCushionMs: 400,
    log: (line, kind) => d.log(line, kind),
    onOpen: () => { d.log(`joined ${ROOM}`, 'hi'); askStatus(); },
    onPcm: () => {
      const st = board.stats();
      d.set('buffer', Math.round(st.bufferedMs));
      /**
       * ⚠️ EVERY TENTH FRAME, WHICH IS FIVE TIMES A SECOND. A readout cell is a
       * fixed box so it cannot reflow, but reading an analyser fifty times a
       * second to paint a number nobody can follow at that rate is work for
       * nothing. Five is fast enough to look live and slow enough to read.
       */
      if (st.frames % 10 === 0) {
        const out = board.outLevel();
        // Nothing measured prints as an em dash, never as a confident 0.
        d.set('sound out', out === null ? '' : out.toFixed(3), out > 0.002 ? 'ok' : 'warn');
      }
      // One cell for both kinds of missing, because a reader wants to know
      // whether what they are hearing is intact, which is one question. The LINE
      // says which, because the two want opposite fixes: running dry wants a
      // bigger cushion and being trimmed wants a smaller one.
      if (st.breaks !== lastBreaks) {
        const first = lastBreaks < 0;
        lastBreaks = st.breaks;
        if (!first) d.log(`${st.starved} ran dry, ${st.trimmed} trimmed · cushion ${Math.round(st.bufferedMs)} ms`, 'warn');
      }
    },
    onMessage: (m) => heard(m),
  });

  /**
   * 🔴 THIS PAGE'S ONE ASSERT USED TO LIVE HERE, AT LOAD, AND IT MOVED INTO
   * `checkAll` ON 2026-09-25. The note that stood here said an assert at t+0 is
   * normally a hazard and *"this page has no late ones to lose"*, which was
   * true while `startNote()` was the only route to every other check and
   * `startNote()` was unreachable.
   * 🔴 **IT IS REACHABLE AGAIN, WHICH IS WHAT FLIPS THE ARGUMENT.** `verify.mjs`
   * waits `settleMs` for a page's FIRST assert and only 2.0 s between later
   * ones, and the test for *this page has not asserted yet* is
   * `n <= shellAsserts`. An assert at load fails that test on the first poll,
   * hands the run to the 2.0 s loop, and this page is silent for about 3.8 s
   * while the sweep and the hand run. So an assert here would take the whole
   * check block with it, silently and green, which is exactly the shape
   * `positron-verify` calls the worst one.
   * ⚠️ WHAT IT GRADES IS UNCHANGED and is repeated where it now stands: the
   * KIT, not this page.
   */
  const pres = board.presence;
  const sendId = (m) => board.send(m);
  const ask = (m, type, ms) => board.ask(m, type, ms);
  const wire = board.wire;

  // ── what this page does with what it hears ───────────────────────────────
  //
  // `board.mjs` has already done the parts that are true of any page talking to
  // this board: it drops this page's own echo, resolves whatever `ask()` is
  // waiting for, learns which socket in the room IS the board and marks it seen,
  // and takes the board's announced framing over the published default. What is
  // below is only what this page does with an answer.
  function heard(m) {
    if (m.type === 'audio.started') {
      boardAnswered = true;
      playing = m.ok ? m.source : null;
      // The board's own words for the not-playing case. A recovery action is
      // not free and a wedged jackd cannot be restarted from a page, so the
      // reason is reported verbatim rather than translated into a guess.
      boardSaid = m.ok ? `${m.source} is playing on the board` : `the board answered: ${m.reason}`;
    }
    // The coalescer's own counters, pushed once a second while anything is
    // moving. A REQUEST of the same type carries no counts, which is how the
    // two are told apart without an id.
    if (m.type === 'ctl.meter' && typeof m.out === 'number') {
      const now = performance.now();
      if (meter && now > meterAt) playedPerSec = (m.out - meter.out) / ((now - meterAt) / 1000);
      meter = m; meterAt = now;
      void playedPerSec;   // still measured, and reported through the log rather than a cell
    }
  }

  async function askStatus() {
    const r = await ask({ type: 'audio.status' }, 'audio.started', 6000);
    if (!r) {
      // plan-controller §7.7: say it in these words, within a named timeout,
      // rather than showing a live-looking slider that does nothing.
      d.log(`no board answered in ${ROOM} within six seconds. The sliders still work and nothing is going anywhere`, 'warn');
      return null;
    }
    d.log(boardSaid, r.ok ? 'hi' : 'warn');
    return r;
  }

  // ── what the numbers are counted over ─────────────────────────────────────
  let t0 = performance.now(), m0 = 0, k0 = 0, lastGone = 0;
  setInterval(() => {
    const now = performance.now(), dt = (now - t0) / 1000;
    if (dt < 1) return;
    // VALUES, not messages: one message carries both sliders, so counting
    // messages here put this cell in a different unit from the one beside it.
    d.set('cc out', Math.round((gate.stats.sent - m0) / dt));
    // ⚠️ STILL COUNTED WITH NO CELL TO SHOW IT. `skipped` and `lost` came off
    // the row and neither stopped being measured: what your hand made that did
    // not go is still the difference between what the gate was offered and what
    // it sent, and a frame the relay dropped is still noticed. Both reach a
    // reader through the log, which is where something that only moves when
    // there is a fault belongs.
    const skipped = Math.round((gate.stats.thinned - k0) / dt);
    t0 = now; m0 = gate.stats.sent; k0 = gate.stats.thinned;
    const st = board.stats();
    if (!st.frames) return;
    const gone = st.lost + Math.max(0, st.breaks);
    if (gone > lastGone) {
      d.log(`${gone - lastGone} slice${gone - lastGone === 1 ? '' : 's'} of sound went missing on the way`, 'bad');
      lastGone = gone;
    }
    void skipped;
  }, 1000);

  // The network alone, with the relay's Durable Object never woken: the runtime
  // answers `ping` with `pong` for free out of its hibernation autoresponse.
  // ⚠️ NOT `board.ping`, AND STILL NOT AFTER IT WAS REPAIRED. That verb replied
  // with an `at` field, `at` is an envelope field, so the board's own formatter
  // refused it and the handler answered `board.error` instead, for two sessions
  // and to every caller. `rig/board/board.mjs` sends `pongAt` since 2026-09-18, which
  // is in the repo and NOT yet on the board. Either way this line stays: the
  // relay's runtime answers `ping` with `pong` out of its hibernation
  // autoresponse, so this measures the network with the Durable Object never
  // woken and with no board in the room at all.
  async function measureRtt() {
    const ms = await wire.ping(2500);
    if (ms === null) return;
    rtt = ms;
    d.set('round trip', Math.round(ms));
  }
  setInterval(measureRtt, 4000);

  // ── the instrument ────────────────────────────────────────────────────────
  //
  // The panel itself is built below the keyboard, because the component takes
  // the keys as an argument and `createKeyboard` appends into a host rather
  // than handing one back. Everything between here and there is what goes ON
  // it: the MIDI button that is its foot's right hand end, and the keys.

  /**
   * 🔴 THE FOOTER'S RIGHT HAND CONTROL, AND IT POINTS THE OPPOSITE WAY TO
   * `/muta/`, WHICH LANDED THE SAME DAY. Asked here as *"on right add enable
   * midi button + add midi support"*; asked there as *"its should be
   * listening"*, which DELETED that page's MIDI button and moved
   * `requestMIDIAccess` onto the press that turns an instrument on.
   *
   * 🔴 BOTH ARE RIGHT AND THEY ARE NOT THE SAME CASE, AND THAT IS WRITTEN HERE
   * SO THE TWO PAGES DO NOT READ AS DISAGREEING BY ACCIDENT. `/muta/` is an
   * instrument INSIDE this browser: turning it on is already a gesture, the
   * permission can ride on it, and a second switch is one more thing to press
   * before anything happens. This page reaches a Raspberry Pi in another
   * building over a socket somebody else may be using, so *listen to whatever
   * is plugged in and send it there* is a bigger promise than *make a sound
   * here*, and a promise that size gets its own press.
   * ⚠️ WHAT IS IDENTICAL ON BOTH PAGES IS THE LINE THAT MATTERS: a VISIT ASKS
   * FOR NOTHING. `requestMIDIAccess` is behind a press on both, the counter at
   * the top of this module is how that is graded rather than described, and
   * `midiAskedOnLoad` is read at the last line of the module, which is the
   * whole of the visit.
   * ⚠️ AND IT IS ASKED ONCE, SO THE BUTTON LEAVES THE FOOT ONCE IT HAS DONE ITS
   * JOB. Asked 2026-09-28: *"rm “midi is listening”"*. It used to go disabled
   * and read `midi is listening`, which is a control label narrating a state,
   * and this project's own rules say a button says what a press does and a
   * state change goes in the log when it changes. `openMidi` is idempotent, so
   * after the first press there is nothing left to press: a disabled control
   * here is not a picture of hardware the way `/circuit/`'s master volume is,
   * it is a spent control, and `positron-ui` records that a control bound to
   * nothing is what a disabled control in this kit means.
   * ⚠️ AND WHAT IT SAID IS REHOMED RATHER THAN DELETED. `onPorts` logs how many
   * inputs there are to listen to, or that nothing is plugged in yet, at the
   * same moment the button goes; the granted-on-load branch logs that this
   * browser is listening without a press. Taking a display away without
   * rehoming what it reported is how a page quietly stops saying something.
   * ⚠️ AND IT IS DISABLED AS WELL AS REMOVED, ON PURPOSE. The removal is what a
   * reader sees; `disabled` is what stops a reference held anywhere else from
   * firing a detached button, which a removed element still does.
   */
  let midi = null;
  /** The foot's two ends and its height, read either side of the button going. */
  let footRun = null;
  const midiBtn = el('button', '', 'enable midi', { type: 'button' });
  function openMidi() {
    if (midi) return midi;
    midi = createMidi({
      // 🔴 ONE PATH, NOT A SECOND ONE. A note from a real keyboard lights the
      // same key and calls the same two functions the on-screen keys call, so
      // there is nothing here that has to be kept in step with them.
      onDown: (note, vel) => { kb.lightNote(note, true); ready().then(() => sendId({ type: 'note.on', note, vel, channel: 0 })); },
      onUp: (note) => { kb.lightNote(note, false); sendId({ type: 'note.off', note, channel: 0 }); },
      /**
       * 🔴 A REAL CONTROLLER GOES THROUGH THE SAME GATE AS A FINGER, AND IT
       * MOVES THE ROTARY IT BELONGS TO. `knob.set(v, { from: 'hardware' })` is
       * what that option exists for and it counts separately, so *is this
       * binding live* stays answerable after the fact. `quiet: false` is
       * deliberate: the value has to reach `move`/`land` or a knob on a real
       * desk would turn a dial on screen and send nothing.
       * ⚠️ ONLY THE TWO CONTROLLERS THIS PAGE IS ABOUT. Anything else arriving
       * is dropped rather than forwarded, because a page that relayed every CC
       * to a shared instrument would be sending values nobody on this page
       * chose.
       */
      onControl: (cc, value) => {
        const k = cc === CUTOFF ? cutoff : cc === RESO ? reso : null;
        if (!k) return;
        k.set(value, { from: 'hardware' });
      },
      log: (line, kind) => d.log(line, kind),
      /* The ports go in the log and nowhere else. The button that carried this
         a second time is already gone by the time this runs, and these two
         lines are what it was saying, in the place a state change belongs. */
      onPorts: (n) => {
        d.log(n ? `${n} MIDI input${n === 1 ? '' : 's'} to listen to`
                : 'no MIDI keyboard is plugged in yet, so nothing will arrive');
      },
      loop: kb,
    });
    /* 🔴 THE FOOT LOSES ITS RIGHT HAND CONTROL HERE, WHICH IS THE WHOLE OF
       *"rm “midi is listening”"*. The row is measured on both sides of the one
       line that removes it, because the foot is the last row of the panel and
       anything it gives up lifts the report and the picture under it. A number
       is the only thing that can say how much, and `checkAll` prints it. */
    const foot = midiBtn.closest('.pos-ipanel-plate');
    footRun = {
      foot: foot ? foot.getBoundingClientRect() : null,
      midi: midiBtn.getBoundingClientRect(),
      name: foot ? foot.firstElementChild.getBoundingClientRect() : null,
    };
    midiBtn.disabled = true;
    midiBtn.remove();
    footRun.after = foot ? foot.getBoundingClientRect() : null;
    footRun.gone = !midiBtn.isConnected;
    return midi;
  }
  midiBtn.addEventListener('click', () => openMidi());

  /**
   * 🔴 A BROWSER THAT HAS ALREADY SAID YES IS LISTENING BEFORE ANYBODY PRESSES
   * ANYTHING. Asked 2026-09-25 as *"always enable midi"*, and the naive reading
   * of that is a permission dialog in front of every visitor who came to read:
   * `requestMIDIAccess` is a PROMPT, and CLAUDE.md's standing rule is that a
   * visit opens nothing and asks nothing.
   * ✅ `navigator.permissions.query({ name: 'midi' })` ASKS THE BROWSER WHAT IT
   * HAS ALREADY DECIDED AND RAISES NOTHING. On the desk this page is used at
   * the answer is `granted` and the press is gone; on a first visit it is
   * `prompt` and nothing happens, which is the same visit as yesterday's.
   * ⚠️ IT MATCHES WHAT `createMidi` WILL ASK FOR. That is
   * `requestMIDIAccess({ sysex: false })`, and a bare `{ name: 'midi' }`
   * descriptor is the same request, so a `granted` here cannot be a grant for
   * a different permission than the one about to be used.
   * ⚠️ AND THE QUERY IS NOT EVERYWHERE. Safari has no Web MIDI at all and
   * Firefox answers this descriptor with a throw, so it is wrapped and the
   * answer is `unavailable`, which opens nothing. A probe that could not answer
   * must never read as a yes.
   *
   * 🔴 THE DECISION IS A NAMED FUNCTION AND NOT AN `if`, BECAUSE THE BRANCH
   * THIS DESK TAKES IS NOT THE BRANCH THAT MATTERS. `demo/verify.mjs`'s Chrome
   * answers `prompt` (MEASURED 2026-09-25), so a check written only against
   * what happens here would grade the *nothing happened* side and say nothing
   * at all about the side the ask is about. `checkAll` reads this function
   * directly against all five answers, which is the half that cannot go vacuous
   * on a machine where the condition never holds.
   */
  const OPENS_ON_LOAD = (state) => state === 'granted';
  /** What the browser answered, and whether the page opened MIDI by itself. */
  let midiPermission = 'not asked', midiOpenedByPermission = false, midiAskedOnVisit = -1;
  /**
   * 🔴 AWAITED BY THE CHECKS BEFORE THEY PRESS ANYTHING, because this settles a
   * tick after the module's last line and `midiAskedOnLoad` is read on that
   * line. Without the wait, *a visit asked 0 times* would stay green on a
   * browser where the page HAD opened MIDI on the visit, one tick later: the
   * assert would be measuring the module body rather than the visit, which is
   * this project's vacuous pass in its cheapest form.
   */
  const midiSettled = (async () => {
    try {
      const st = await navigator.permissions?.query({ name: 'midi' });
      midiPermission = st ? st.state : 'unavailable';
    } catch {
      midiPermission = 'unavailable';
    }
    if (OPENS_ON_LOAD(midiPermission)) {
      openMidi();
      midiOpenedByPermission = true;
      d.log('this browser has already allowed MIDI here, so it is listening without a press');
    }
    /* The whole cost of a visit, read after the decision and before any press.
       ⚠️ AND IT IS A SECOND NUMBER RATHER THAN A REPLACEMENT FOR
       `midiAskedOnLoad`: that one says the module body asks nothing, this one
       says the visit asks nothing more than the browser has already agreed to,
       and only both together cover a page that opens asynchronously. */
    midiAskedOnVisit = midiAsked;
    return midiPermission;
  })();

  /**
   * 🔴 A KEY PRESSED WHILE THE PAGE HOLDS ITS OWN NOTE IS A SECOND VOICE, NOT A
   * REPLACEMENT. This page holds one note so the sliders have something to act
   * on, and that note stays held while you play: Yoshimi is polyphonic and the
   * board sums whatever is sounding. Pressing stop releases everything, the
   * page's note included.
   * ⚠️ IT STARTS THE AUDIO, because a key is a gesture and this page's other
   * gesture is Play. Somebody who presses a key first should hear it rather
   * than discover a second control they were supposed to press.
   * ⚠️ AND IT GOES OUT UNGATED. `makeCcSend` thins CONTROLLER values, where only
   * the newest matters; a note is an event, and a note held back is a key that
   * did nothing.
   */
  /**
   * 🔴 A KEY IS THE ONLY WAY IN NOW, so the first one has to do everything Play
   * used to: start the audio, wake the instrument if nothing is running, load
   * the patch, and only then sound the note. `ready` is that work, done once.
   * ⚠️ IT IS AWAITED BEFORE THE NOTE RATHER THAN RACED WITH IT. MEASURED
   * 2026-09-16 over the relay with no page in the way: `voice.select` and
   * `note.on` back to back give peak 0.0000, and the same pair 900 ms apart give
   * 0.0213 on the same patch and the same note. An .xiz comes off an SD card.
   * ⚠️ AND A SECOND KEY PRESSED WHILE THE FIRST IS STILL WAKING JOINS THE SAME
   * promise rather than starting a second instrument.
   */
  let readying = null;
  const ready = () => (readying ||= firstKey());

  /**
   * 🔴 TWENTY-FIVE KEYS, FULL WIDTH, ASKED FOR AS *"make keyboard 25 full w."*.
   * `keyRange()` is the kit's own answer and it was built for this ask:
   * `/nola/` already laid twenty-five keys out inline and this page was about
   * to write it a second time.
   * ⚠️ 25 KEYS IS `span: 24`, WHICH IS THE DEFAULT, so nothing here does that
   * subtraction: two octaves C to C is 24 semitones inclusive of both ends.
   * ⚠️ AND THE LETTERS COME BACK AS A SET rather than as `true`. The computer
   * keyboard has one octave's worth of letters and this layout has two, so a
   * boolean could only say all or none. The Set decides which keys the letters
   * are bound to and the bindings stay all or nothing, which is the component's
   * own note beside `letters`.
   * 🔴 `base: 48` IS C3, WHICH PUTS THE PAGE'S OWN HELD NOTE INSIDE THE
   * PICTURE. The keyboard opened at 60 and held `NOTE 40` under the filter, so
   * the one note this page sounds by itself was two octaves below the leftmost
   * key and nothing on screen lit for it. At 48 the range is 48 to 72 and a
   * player reaching for the sound the sliders are acting on can find it.
   * 🔴 `full: true` REACHES SOMETHING SINCE 2026-09-28, AND IT REACHED NOTHING
   * FOR THREE DAYS. `.kbd.kbd-full` is `width: 100%`, and its host was
   * `.panel-flow`, which is `width: max-content`: a box asking for all of a box
   * that its own width sets. MEASURED at 1280 px on 2026-09-25: **the keyboard
   * 992.0 px, the flow 992.0 px and the case 686.0 px**, so `full` resolved to
   * the keyboard's own width and the box hung 306 px out of a 455.8 px
   * scroller. A glued row is `width: fit-content; max-width: 100%`, which caps
   * at the room there is, so the keyboard takes the row and `.keys` scrolls
   * inside it on its own `overflow-x: auto`. That is the arrangement the
   * refusal of 2026-09-25 called *"what the option was asked for"*, and it
   * arrives with the component rather than with a band this page invents.
   * ✅ MEASURED 2026-09-28 at 1280 px, on the page: **the keyboard's box
   * 646.0 px on a 688.0 px surface, with 777.0 px of keys scrolling inside
   * 646.0 px of box**. The same 777 px the banded measurement of 2026-09-25
   * recorded, in a box that now belongs to the keyboard rather than hanging out
   * of a scroller.
   * ⚠️ `--k-max` pins a white key at 62 px and `--k-min` floors it at 49, both
   * on `.keys`' own grid track, so nothing here stretches a key. MEASURED at
   * 1280 px the widest white key is **49.0 px**, which is the FLOOR rather than
   * a squash: the track is `minmax(--k-min, --k-max)` and a box narrower than
   * fifteen white keys at 62 lands on the floor and scrolls the rest. *"do not
   * stretch it ever"* stands, and nothing here shrinks one below the
   * component's own minimum either.
   */
  /* 🔴 A DETACHED HOST, AND `kb.el` IS WHAT THE PANEL IS HANDED, NOT THIS DIV.
     `createKeyboard` appends to its host unconditionally, so there is no
     detached form of it to hand over afterwards; the panel's `keys` row then
     moves the keyboard out of this throwaway parent. `/kit/`'s own specimens do
     exactly this, and their comment says why the HOST must not be handed over:
     a keyboard three levels under the surface is out of reach of
     `.pos-glue > * > .kbd`, which left 4 px of border on the keys and 10 px of
     their own margin under them. */
  const kb = createKeyboard(el('div'), {
    ...keyRange(),
    base: 48,
    full: true,
    /* 🔴 `Loop` WHILE THE EVOLUTION IS PLUGGED IN, asked 2026-09-30 for every
       keyboard page. A looped note comes back through `onDown` marked `loop` and
       goes to Yoshimi on the board by the route a finger takes, with the
       velocity a MIDI key was played at when the take heard one. */
    loop: 'evolution',
    log: (line, kind) => d.log(line, kind),
    onDown: (note, how, vel) => {
      kb.lightNote(note, true);
      ready().then(() => sendId({ type: 'note.on', note, vel: vel ?? VEL, channel: 0 }));
    },
    onUp: (note) => {
      kb.lightNote(note, false);
      sendId({ type: 'note.off', note, channel: 0 });
    },
    /* 🔴 `notes off` IS THIS PAGE'S PANIC NOW, AND IT WAS NOT REACHABLE AT ALL
       BEFORE. `panic()` releases every note the board is holding, brings both
       rotaries home and stops every invisible hand; it hung off a transport
       command with no button in front of it. The keyboard's own `notes off` is
       what a player presses when they want everything to stop, so that is where
       it belongs.
       🔴 AND `panic()` IS RE-ENTRY GUARDED, BECAUSE THIS PAIR IS A LOOP.
       `kb.panic()` calls `onPanic` and `panic()` calls `kb.panic()`, so wiring
       them together without the guard is unbounded recursion on the one control
       whose whole job is to stop everything. Written down rather than solved by
       taking one of the two calls out: `panic()` has to release the keys when a
       check drives it directly, and the keyboard has to tell the page when its
       own button is pressed. */
    onPanic: () => { panic(); },
  });

  /**
   * 🔴 THE INSTRUMENT PANEL, SINCE 2026-09-28, ASKED FOR AS *"knobs: appluy
   * instruiment panel"*. This page wore `createInstrument` over
   * `createPanelLayout` until this line: a bordered case with a scrolling
   * strip, the nameplate in its top right corner, and the footer glued
   * underneath as an instrument header at the foot. `createInstrumentPanel` is
   * the same instrument with no fixed column and no scroller, built out of
   * `createGlueRows`, and the sketch it was written to is this page's shape:
   * rows of controls, a keyboard, a plate across the foot.
   *
   * 🔴 **AND `instrument-panel.mjs`'s OWN HEADER NAMED THIS PAGE AS ONE THE
   * COMPONENT WOULD BREAK, SO THAT IS WHERE THIS STARTS.** It reads *"/knobs/
   * scrolls its whole strip as one"*, and *"for an instrument that FITS;
   * /knobs/ measured 992 px inside a 686 px case and keeps panel-layout"*. That
   * was a fact about `.panel-flow` being `width: max-content`, which is the
   * same fact that made `full: true` on the keyboard reach nothing. A glued
   * surface is `width: fit-content; max-width: 100%`: it stops at the room
   * there is, the keys scroll inside their own row, and the reason to keep the
   * case goes with it. **The component's header is now wrong about this page
   * and is a shared file, so it is reported rather than edited.**
   *
   * 🔴 THE FOOT IS THE PLATE ROW, AND THE COMPONENT PLACES ALL THREE THINGS ON
   * IT. Asked originally as *"add footer with rasperry pi online padge. on
   * right add enable midi button"*. `plate: { name, status, patch }` is the
   * panel's own slot list: the name at the start, the status control beside it,
   * and the far end for the control that changes. So the badge and the button
   * land where they landed before, and the nameplate joins them rather than
   * sitting in the corner of a case there is no longer a case for.
   * ⚠️ AND THE 2026-09-25 INSTRUCTION IS NOT BEING UNDONE. *"knobs: rm right
   * panel. use regular nameplate"* removed a vertical rail down the case's
   * right edge and asked for the ordinary plate; the rail is still gone and the
   * plate is still the kit's. What moved is WHERE the component puts it, and on
   * this component the plate is the foot.
   * ⚠️ AND THE BADGE IS THE BOARD'S OWN, MOVED RATHER THAN COPIED. `board.mjs`
   * owns a five state presence fed by the board's heartbeat and knows which
   * socket in the room IS the board; `buildHeader` used to build a two state
   * one of its own, which is why `online: false` and a hand `prepend` stood
   * here. `status:` takes a built control, so nothing reaches into a component
   * to place it any more.
   * 🔴 THE PLATE READS `KNOBS`, AND THIS COMMENT ARGUED THE OTHER WAY UNTIL
   * 2026-09-28. Asked, verbatim: *"all nameplates are uppercase"*. The
   * exception this page and `/shape/` both carried was that the uppercase rule
   * is about a shelf of REPLICAS reading as one shelf and neither page is a
   * replica of anything. That was a good argument and the ask overrules it:
   * every plate on the site is one treatment now, which is a plainer rule than
   * one with two defensible exceptions in it. `caps` defaults to true in
   * `instrument-panel.mjs`, so the option is simply not passed.
   *
   * 🔴 THE ROTARIES ARE ONE ROW AND IT IS `start`, WHICH IS *"left to rotaries
   * cutoff reseonance"* SURVIVING THE MOVE. A glue row centres by default, and
   * two rotaries centred over twenty-five keys is a band of empty surface with
   * something in the middle of it. `/kit/`'s drum box specimen already wrote
   * that reading down against the same shape.
   * ⚠️ AND IT IS THE LATTICE, NOT TWO KNOBS THIS PAGE LAYS OUT.
   * `createControlGrid` owns the pitch, the gap and the sideways scroll a
   * narrow surface needs, and a panel row holding it adds an inset and a seam
   * and nothing else. The block beside the rotaries has the swap.
   * ⚠️ **AND `start` IS THE HALF A RECT CATCHES AND THE LATTICE MOVED THE INK
   * INSIDE IT.** The grid's own box still sits on the row's inset, which is
   * what the assert below reads, and the first DIAL now sits half a spare cell
   * further in, because a cell is the square pitch and a dial is `--knob-w`.
   * That offset is the lattice and is printed in the detail rather than
   * corrected, which is the same reading `/muta/` wrote down at 17 px.
   *
   * ⚠️ WHAT LEFT WITH THE CASE, SO NOBODY GOES LOOKING FOR IT: the case's
   * border and its 20 px inset, the scrolling strip, `panel.band()` and the
   * seam it could not space, and the glued footer that was a header. What
   * replaces every one of them is a row on one surface with 1 px of `--line`
   * between rows.
   * ✅ AND THE SEAM THIS PAGE ASKED FOR AND COULD NOT HAVE IS HERE BY
   * CONSTRUCTION. *"on each button group have horizontal panel separator edge
   * to edge"* was built here in a case and taken back out the same day, because
   * a case has no vertical rhythm between bands: MEASURED then, the strip's
   * bottom to the seam 0.0 px, the seam to the keyboard 0.0 px, and the
   * keyboard to the case's inner bottom 0.0 px, so the keys sat on the rule.
   * A glued surface is seams and insets and nothing for a page to type.
   */
  const panel = createInstrumentPanel({
    rows: [[[knobs], { align: 'start' }]],
    keys: kb.el,
    plate: { name: 'knobs', status: pres, patch: midiBtn },
  });
  d.stack.add(panel.el);

  /**
   * One note, and the moment it started, because the audio check below cannot
   * ask "was there a sound" without knowing whether anything was meant to be
   * sounding. `peak` is reset here so the answer is about THIS note rather than
   * about whatever was in the stream before it.
   */
  let noteAt = 0, releasedAt = 0;

  /**
   * 🔴 A PATCH COMES OFF AN SD CARD, AND A NOTE SENT BEFORE IT LANDS IS LOST.
   * REPORTED TWICE AS *"No sound in knobs"*, and MEASURED over the relay with
   * no page in the way: select then note back to back gives peak 0.0000, and
   * select, wait 900 ms, then note gives 0.0213 on the same patch and the same
   * note. `yoshimi-test.mjs` and `cc-test.mjs` both wait, each with a comment
   * saying an .xiz is read off an SD card and parsed. This page sent them in
   * one breath and was silent for it.
   *
   * ⚠️ THE FIRST FIX FOR THIS REPORT WAS REAL AND WAS NOT THIS. A page that
   * found yoshimi already running never sent a note at all. Fixing that made
   * the note arrive, and it arrived too early, which looks identical from a
   * chair: no sound, no error, every counter correct.
   */
  const PATCH_SETTLE_MS = 900;
  /** The patch, and the wait an .xiz off an SD card needs. No note. */
  async function selectPatch() {
    sendId({ type: 'voice.select', channel: 0, bank: BANK, program: PROGRAM, name: PATCH });
    await wait(PATCH_SETTLE_MS);
  }

  async function selectAndHold() {
    sendId({ type: 'voice.select', channel: 0, bank: BANK, program: PROGRAM, name: PATCH });
    await wait(PATCH_SETTLE_MS);
    holdNote();
  }

  function holdNote() {
    sendId({ type: 'note.on', note: NOTE, vel: VEL, channel: 0 });
    noteAt = performance.now();
    board.resetPeak();
    /**
     * 🔴 AND IF IT MAKES NO SOUND, THE PAGE SAYS SO. Every counter on this page
     * reads correct while the board streams silence, which is how the fault
     * above survived two reports: the stream arrives at fifty frames a second
     * whether or not anything is sounding. A held note that produces nothing is
     * a fault and belongs in the log, which is where this page's real faults
     * are reported.
     */
    const asked = noteAt;
    setTimeout(() => {
      if (asked !== noteAt || releasedAt > noteAt) return;   // a newer note, or it was released
      /**
       * 🔴 THE THRESHOLD WAS 0.002 AND THAT IS INSIDE THE BROKEN RANGE.
       * MEASURED 2026-09-17 over the relay with no browser in the way: a note
       * that is working reads about 0.045 of full scale, and a board in the
       * state reported that day reads 0.0010 to 0.0035 for every patch, every
       * velocity, and through an instrument restart. So 0.002 sat in the middle
       * of the fault it exists to catch, and whether it fired depended on which
       * take you got. 0.01 has better than 3x of margin on both sides.
       * ⚠️ AND IT IS NOT SILENCE. A gain stage between the synth and the capture
       * had collapsed, which is audible as nothing but measures as a small
       * number rather than a zero, so the line says too quiet rather than
       * silent. A page that says the wrong thing about a real fault sends
       * somebody looking in the wrong place.
       */
      if (board.stats().peak > 0.01) return;
      d.log(`the note is sounding far too quietly to hear: the loudest sample coming back is ${board.stats().peak.toFixed(4)} of full scale, where a working note is about 0.045. Nothing in this page can fix that — it is the board's own level`, 'bad');
    }, 1800);
  }

  /**
   * 🔴 THE PLAYOUT'S OWN LAST WORD ABOUT ITSELF, BECAUSE A COUNT OF WHAT THIS
   * PAGE POSTED IS A COUNT ON THE NEAR SIDE OF THE BOUNDARY. `panic()` below
   * drops the sound already in this page by posting to the worklet, and
   * *postMessage was called* is satisfied by a command the worklet does not
   * handle: a misspelled `cmd` is inert, throws nothing and logs nothing.
   * `proto/jam/playout-worklet.js` posts its own counters every 250 ms and
   * `played` only ever GROWS except through a reset, so a fall in it is the far
   * side agreeing that the ring really was emptied.
   * ⚠️ `addEventListener` AND NOT `onmessage`. `board.mjs` owns `onmessage` on
   * that port and reads the cushion, the underruns and the trims off it, so
   * assigning over it would take the buffer cell and the breaks line out. A
   * second listener replaces nothing and the port is already started, because
   * setting `onmessage` started it.
   * ⚠️ AND IT ANSWERS NOTHING WITH NO BOARD, WHICH IS SAID RATHER THAN HIDDEN.
   * With no frames arriving, `played` reads 0 before a reset and 0 after one,
   * so the far side cannot tell a reset from no reset at all. The check at the
   * foot of this page says so in words instead of reading it as a pass.
   * ⚠️ AND IT IS DECLARED ABOVE ITS TWO CALLERS ON PURPOSE. A `let` is in its
   * dead zone until the module reaches it, and both callers are async and run
   * long after that, so this is safe either way today and would stop being safe
   * the moment somebody called one of them earlier. `/twelve/` lost seven
   * asserts to exactly that, silently and green, and only the COUNT said so.
   */
  let plSeen = null, plPort = null;
  function watchPlayout() {
    const pl = board.playout();
    if (!pl || pl.port === plPort) return;
    plPort = pl.port;
    plPort.addEventListener('message', (e) => { if (e.data?.stats) plSeen = e.data.stats; });
  }

  /**
   * Everything the first key press has to do before a note can sound. It
   * replaces what the Play button did, minus the held test tone: the note you
   * hear is the key you pressed.
   */
  async function firstKey() {
    await board.startAudio();
    // The node exists from here on, so the far side of the panic below has
    // somebody listening to it. `startAudio` has already set its own
    // `onmessage` by the time this resolves, which is what makes a second
    // listener safe rather than a replacement.
    watchPlayout();
    await measureRtt();
    const status = boardAnswered ? { ok: playing !== null, source: playing } : await askStatus();
    if (!MAY_PLAY) {
      d.log('a check is running, so nothing has been sent to the board: it is shared hardware and somebody may be using it. Add ?board=1 to let this press through', 'warn');
      return;
    }
    if (status && status.ok && status.source === 'yoshimi') {
      armed = true;
      await selectPatch();
      d.log(`yoshimi was already up. ${PATCH} is loaded, so play the keys and drag the sliders`, 'hi');
      return;
    }
    if (status && status.ok) {
      // 🔴 DO NOT AUTOSTART OVER SOMEBODY. There is one JACK graph and one
      // instrument, so starting here stops whatever `/grains/` is doing. Say
      // what is running and let a person decide.
      d.log(`${status.source} is playing on the board and this page will not stop it. Nothing here is going anywhere until it is free`, 'warn');
      return;
    }
    if (!status) return;
    d.log(`starting yoshimi on the board and loading ${PATCH}. This takes ten to forty seconds`);
    const r = await ask({ type: 'audio.start', source: 'yoshimi' }, 'audio.started', 60000);
    if (r?.ok) {
      armed = true;
      await selectPatch();
      d.log(`${PATCH} is loaded, so play the keys and drag the sliders`, 'hi');
    } else {
      // A recovery action is not free, and a wedged jackd cannot be restarted
      // from a page. Report the reason verbatim and stop.
      d.log(`the board could not start yoshimi${r?.reason ? ` · ${r.reason}` : ' and did not say why'}`, 'bad');
    }
  }

  async function startNote() {
    await board.startAudio();
    watchPlayout();     // see `firstKey`: the same reason, the same one line
    await measureRtt();
    const status = boardAnswered ? { ok: playing !== null, source: playing } : await askStatus();

    if (MAY_PLAY) {
      if (status && status.ok && status.source === 'yoshimi') {
        /**
         * 🔴 AND IT STILL HAS TO PLAY A NOTE. REPORTED 2026-09-16: *"No sound
         * in the knobs. There used to be sound when you moved your own knobs,
         * but now there ain't."*
         *
         * This branch armed the page and sent nothing, so the only press that
         * ever made a sound was one that STARTED yoshimi. Once the board was
         * left running, which is what every measurement of it does, every press
         * landed here and the page went quiet while reporting that all was
         * well. Not restarting an instrument is not the same as not playing a
         * note, and this branch had confused the two.
         */
        armed = true;
        await selectAndHold();
        d.log(`yoshimi was already up, so nothing was restarted. ${PATCH} is loaded and one note is held. Drag the sliders`, 'hi');
      } else if (status && status.ok) {
        // 🔴 DO NOT AUTOSTART OVER SOMEBODY. There is one JACK graph and one
        // instrument, so starting here stops whatever `/keys/` or `/grains/` is
        // doing. Say what is running and let a person decide.
        d.log(`${status.source} is playing on the board and this page will not stop it. Nothing here is going anywhere until it is free`, 'warn');
      } else if (status) {
        d.log(`starting yoshimi on the board and loading ${PATCH}. This takes ten to forty seconds`);
        const r = await ask({ type: 'audio.start', source: 'yoshimi' }, 'audio.started', 60000);
        if (r?.ok) {
          armed = true;
          await selectAndHold();
          d.log(`${PATCH} is loaded and one note is held. Drag the sliders`, 'hi');
        } else {
          // A recovery action is not free, and a wedged jackd cannot be
          // restarted from a page. Report the reason verbatim and stop.
          d.log(`the board could not start yoshimi${r?.reason ? ` · ${r.reason}` : ' and did not say why'}`, 'bad');
        }
      }
    } else {
      d.log('a check is running, so nothing has been sent to the board: it is shared hardware and somebody may be using it. Add ?board=1 to let this press through', 'warn');
    }

    // ⚠️ THE SILENT WORK GOES FIRST. The sweep takes 600 ms and asserts nothing
    // while it runs, so with it in the middle the harness saw the free checks,
    // waited 400 ms, and stopped before anything else arrived. Every assert on
    // this page now lands in one uninterrupted run.
    if (SELFCHECK) { await sweepChecks(); await handChecks(); freeChecks(); }
    checkAll();
  }

  /** See the keyboard's `onPanic`: these two call each other and this is why. */
  let panicking = false;
  /** What the last panic managed, for the check at the foot of this page. */
  let lastPanic = null;
  function panic() {
    if (panicking) return;
    panicking = true;
    try {
      // 🔴 AND EVERY INVISIBLE HAND GOES OFF FIRST. A hand still running would
      // fight the homing below within one frame, which is a page arguing with
      // itself in front of somebody, and stop here means stop. It goes before
      // the `set` calls so the homing is the last thing that touches a dial.
      for (const k of [cutoff, reso]) k.hand?.stop('pause');
      /**
       * 🔴 STOPPING THE SOURCE AND DROPPING THE SOUND ALREADY HERE ARE TWO
       * HALVES AND STOP MEANS BOTH. `note.panic` reaches an instrument in
       * another building and is the only thing that makes it quiet and KEEPS it
       * quiet. It does nothing whatever about the cushion this page is already
       * holding, which is 160 ms of sound the board made BEFORE the button was
       * pressed and which went on playing after it. Until 2026-09-29 only the
       * first half was sent, so stop here meant stop in a sixth of a second.
       * The board may also be holding notes this page never pressed, which is
       * why the message goes out as well as the dials coming home.
       * 🔴 AND THE MESSAGE GOES FIRST, WHICH IS A DECISION RATHER THAN THE
       * ORDER IT WAS TYPED IN. Emptying the ring buys exactly one cushion of
       * silence and re-arms the prebuffer, so the page is quiet for 160 ms and
       * then plays whatever landed in the meantime. That silence is only worth
       * having if the board is stopping during it, so the message that stops
       * the board leaves before the ring is dropped.
       * ⚠️ THE TWO STATEMENTS ARE MICROSECONDS APART AND NO RACE IS BEING
       * FIXED. `board.send` is one synchronous socket write and it returns null
       * rather than throwing on a closed socket, so neither half can be held up
       * by the other. What the order states is the intent, and the intent is
       * what the next reader acts on.
       * 🔴 AND `reset` IS NOT *STOP AUDIO*. It empties what has arrived and
       * stops nothing that is still coming: the board captures its JACK graph
       * continuously, so frames keep landing at fifty a second whatever this
       * page does, the prebuffer re-arms and the sound is back a cushion later
       * IF THE BOARD IS STILL SOUNDING. The pair is what makes it quiet and
       * keeps it quiet, and the log line below says only the half this page can
       * know about.
       */
      const toldBoard = MAY_PLAY && armed;
      if (toldBoard) sendId({ type: 'note.panic' });
      const pl = board.playout();
      const droppedHere = !!pl;
      if (pl) pl.port.postMessage({ cmd: 'reset' });
      releasedAt = performance.now();
      lastPanic = { at: releasedAt, toldBoard, droppedHere };
      // Home is where each rotary opened, which is not the same number for the
      // two of them: the cutoff opens where the filter can be heard and the
      // resonance opens where its maker left it.
      // 🔴 NO GLIDE, AND THAT IS A REAL DIFFERENCE BETWEEN THE TWO COMPONENTS
      // RATHER THAN SOMETHING DROPPED HERE. `slider.set` takes `glideMs` and
      // animates the handle while the value lands at once; `knob.set` takes
      // `{ from, quiet }` and nothing else, so a rotary jumps. It is in the
      // report as a gap in `knob.mjs`, not patched around on this page.
      cutoff.set(CUTOFF_HOME);
      reso.set(NEUTRAL);
      kb.panic();
      /**
       * 🔴 THE LINE SAYS WHAT HAPPENED, AND ON AN UNARMED PAGE THAT IS NOT WHAT
       * THE BUTTON PROMISES. `note.panic` goes only when this page is driving
       * the board, so a page listening while somebody else plays it drops its
       * own cushion, goes quiet for 160 ms and hears the sound come straight
       * back, because it is not allowed to write to the instrument. Saying
       * *stopped* there would be a page claiming an outcome it cannot know, so
       * that case gets its own words and its own weight.
       */
      if (toldBoard) {
        d.log(droppedHere
          ? 'stopped: the board was told to release every note, the sound already in this page was dropped, and both rotaries are back where they opened'
          : 'stopped: the board was told to release every note and both rotaries are back where they opened, and this page was holding no sound to drop');
      } else {
        d.log(droppedHere
          ? 'stopped here only: the sound already in this page was dropped and both rotaries are back where they opened, and this page is not driving the board, so whatever is still playing over there will be back in a moment'
          : 'stopped here only: both rotaries are back where they opened, and this page is neither driving the board nor holding any sound of its own',
        'warn');
      }
    } finally { panicking = false; }
  }

  // Reachable from a probe, the way `window.__hls` and `window.__strip` are on
  // other pages: `frames` is how much stream has arrived and `peak` is whether
  // any of it was a sound. A page that can only be asked "did frames arrive"
  // cannot tell a held note from silence, which is the fault this pair exists
  // to make visible from outside.
  window.__knobs = { get frames() { return board.stats().frames; },
                     get peak() { return board.stats().peak; },
                     get armed() { return armed; } };

  // ── the checks ────────────────────────────────────────────────────────────
  //
  // 🔴 NOTHING HERE OPENS A SOCKET, MAKES A SOUND, MOVES A CONTROL OR MOVES THE
  // PICTURE FOR A VISITOR. The three rules the page's wiring depends on are
  // arithmetic and are graded on a scratch gate with a clock supplied by the
  // caller, so they cost a visit nothing and still run when the board is down.
  // The page's own sliders are only driven under `?selfcheck=1`, because a
  // scripted sweep would fight a hand that is already on one.
  function freeChecks() {
    // 🔴 GATED TOO, for the reason in `checkAll`. These cost a visitor nothing
    // and move nothing, and they still put lines in the box where this page's
    // real faults are reported. The rule is not "cheap checks may run".
    if (!SELFCHECK) return;
    // Rule 1, and it is the only failure that matters for a level control: if
    // the LAST value of a gesture is held back, the filter stays wrong forever.
    const g1 = makeCcSend();
    g1.put(CUTOFF, 10); const first = g1.tick(0);
    g1.put(CUTOFF, 20); const mid = g1.tick(1);
    g1.put(CUTOFF, 30, { end: true }); const last = g1.tick(2);
    d.assert('the last value of a drag is never held back, whatever the clock says',
      !!first && mid === null && last?.set?.[0]?.[1] === 30,
      `a move ${mid === null ? 'inside the gate was held' : 'was not held'} and the release went out at ${last?.set?.[0]?.[1]}`);

    // Rule 4, the whole repair a level plane needs. No ack, no sequence number,
    // no retransmit queue: state the console again and a lost last value fixes
    // itself within half a second.
    const g2 = makeCcSend();
    g2.put(CUTOFF, 100); g2.tick(0);
    const quiet = g2.tick(RESTATE_MS - 1);
    const again = g2.tick(RESTATE_MS);
    d.assert(`with nothing moving, the whole console is stated again every ${RESTATE_MS} ms`,
      quiet === null && again?.restate === true && again.set.length === 1,
      again ? `nothing to say at ${RESTATE_MS - 1} ms, and ${again.set.length} controller restated at ${RESTATE_MS}` : 'nothing was restated');

    // The relay's budget is counted in MESSAGES, so two sliders moving together
    // have to cost one message rather than two.
    const g3 = makeCcSend();
    g3.put(CUTOFF, 91); g3.put(RESO, 40);
    const both = g3.tick(0);
    d.assert('two sliders moving together travel in one message',
      both?.set?.length === 2 && g3.stats.messages === 1,
      both ? `${g3.stats.messages} message carrying ${both.set.length} values` : 'nothing went out');

    /**
     * ⚠️ THE OPENING POSITIONS ARE READ BEFORE ANYTHING IS DRIVEN, WHICH IS A
     * REORDERING THE SWAP FORCED. On sliders this assert came SECOND, because
     * the check above it pressed each lane where the handle already was and so
     * moved nothing. A rotary has no such gesture: a press starts a RELATIVE
     * drag and changes nothing by itself, so the only way to reach `onInput`
     * from outside is to change the value. Reading the homes first is what
     * keeps this an assert about the page rather than about the check under it.
     */
    d.assert('each rotary opens at its own home, and the cutoff’s is where it can be heard',
      cutoff.value() === CUTOFF_HOME && reso.value() === NEUTRAL,
      `cutoff ${cutoff.value()} where the filter can be heard, resonance ${reso.value()} where its maker left it`);

    /**
     * 🔴 EACH ROTARY DRIVES ITS OWN CONTROLLER, AND THIS IS THE CHECK THAT A
     * COPIED CONTROL NEEDS. Two dials wired to one controller look completely
     * normal: both move, both send, the counters rise, and the second one
     * simply overwrites the first with no error anywhere. It costs nothing to
     * ask, because the gate is the thing that knows, and a scratch gate needs
     * no board.
     * ⚠️ IT DRIVES THE REAL `onInput`, not `move()` with a number typed here.
     * Calling the constants back would assert this check against itself.
     *
     * 🔴 AN ARROW KEY ON THE DIAL, AND NOT A SYNTHETIC POINTER, FOR A REASON
     * THAT IS A FINDING RATHER THAN A PREFERENCE. `knob.mjs`'s `pointerdown`
     * calls `svg.setPointerCapture(e.pointerId)` UNGUARDED, and that raises
     * `NotFoundError` for every pointer id a page dispatches at itself. The
     * listener aborts, the throw reaches `guard(d)`, and the page is marked
     * failed by its own check. `slider.mjs`, `range-slider.mjs`, `xy-pad.mjs`,
     * `transport-bar.mjs` and `keyboard.mjs` all wrap that call in a `try`,
     * each with the reason written out beside it; this one does not. It is in
     * the report, and nothing here pretends the pointer path was driven.
     * ⚠️ THE KEY PATH IS STILL THE REAL ONE. `keydown` on the dial runs
     * `handApi.yield()` and then `set(v + one, { from: 'hand' })`, which is the
     * same funnel a drag ends in.
     */
    /* 🔴 THE ARROW POINTS AWAY FROM WHERE THE DIAL ALREADY IS, AND A FIXED
       `ArrowUp` HAD THIS CHECK RED FOR AS LONG AS THE CUTOFF OPENED AT 127.
       MEASURED 2026-09-25 before it was changed: the assert read `CC 71`, one
       controller of two, because an up arrow on a rotary already AT ITS CEILING
       clamps to the same number, sends nothing, and looks exactly like a dial
       wired to nothing. The knob was right and the check was pressing a key
       that could not move it.
       ⚠️ AND THE CEILING IS READ OFF THE DIAL RATHER THAN TYPED. `knob.mjs`
       publishes it as `aria-valuemax`, so a rotary whose range changes cannot
       leave this check describing the old one, and a 127 typed here would be
       the shared measurement in two files this project keeps repairing. */
    const g4 = makeCcSend();
    const homes = [cutoff.value(), reso.value()];
    sendTo = g4;
    for (const k of [cutoff, reso]) {
      const dial = k.el.querySelector('.pos-knob-dial');
      const ceiling = parseFloat(dial.getAttribute('aria-valuemax'));
      const key = k.value() >= ceiling ? 'ArrowDown' : 'ArrowUp';
      dial.dispatchEvent(
        new KeyboardEvent('keydown', { key, bubbles: true, cancelable: true }));
    }
    sendTo = gate;
    const drove = g4.tick(0)?.set ?? [];
    const ctrls = [...new Set(drove.map(([c]) => c))];
    // Back where the page opened them, quietly, so nothing downstream reads
    // this check's leftovers.
    cutoff.set(homes[0], { quiet: true });
    reso.set(homes[1], { quiet: true });
    d.assert('each rotary drives its own controller',
      ctrls.length === 2 && [CUTOFF, RESO].every((c) => ctrls.includes(c)),
      `CC ${ctrls.sort((a, b) => a - b).join(', ') || 'nothing'}`);
  }

  /**
   * A drag, driven the way a finger drives one: the dial is painted and the
   * page's own `onInput` handler runs for every position, then one `onChange`
   * for the release. Behind `?selfcheck=1`, because it moves the picture.
   *
   * ⚠️ IT SURVIVED THE SWAP TO ROTARIES UNCHANGED, which is worth saying: the
   * sweep never touched a lane, it drove `set(v, { quiet: true })` beside the
   * page's own `move()`, and `knob.set` takes the same `quiet` flag. What it
   * grades is the SEND GATE, and the gate never knew what kind of control was
   * in front of it.
   *
   * ⚠️ THE CEILING IS COMPUTED FROM THE TIME THE SWEEP ACTUALLY TOOK, not from
   * the time it was asked to take. A check that depends on when something
   * landed has to confirm where it landed.
   */
  let sweep = null;
  async function sweepChecks() {
