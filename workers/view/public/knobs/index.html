    // 🔴 ASK FOR THE COUNTERS, DO NOT WAIT TO BE TOLD. The board pushes
    // `ctl.meter` once a second and ONLY while something is moving, which is
    // right for a page a person is watching and wrong for a check: whether the
    // push lands before the asserts run is a race, and it read red about a
    // board that was writing every value correctly. `ctl.meter` is also a
    // request verb, and the sweep below takes long enough that the answer is
    // always in hand by the time anything is claimed.
    if (MAY_PLAY) sendId({ type: 'ctl.meter' });
    const before = { offered: gate.stats.offered, messages: gate.stats.messages, thinned: gate.stats.thinned };
    const steps = 60, ms = 600;
    const t = performance.now();
    for (let i = 0; i <= steps; i++) {
      const v = Math.round(NEUTRAL + (127 - NEUTRAL) * (i / steps));
      cutoff.set(v, { quiet: true });      // the dial, painted, no callbacks
      move(CUTOFF, v);                     // what a pointermove does
      await wait(ms / steps);
    }
    land(CUTOFF, 127);                     // what a pointerup does
    const took = performance.now() - t;
    sweep = {
      took,
      offered: gate.stats.offered - before.offered,
      messages: gate.stats.messages - before.messages,
      thinned: gate.stats.thinned - before.thinned,
      ended: gate.live.get(CUTOFF),
    };
    cutoff.set(CUTOFF_HOME, { quiet: true });
  }

  /**
   * 🔴 THE THREE PROMISES AN INVISIBLE HAND HAS TO KEEP, DRIVEN RATHER THAN
   * DESCRIBED. Behind `?selfcheck=1`, because every line of it moves a control.
   *
   *   A  unmistakable while it runs, on three channels at once
   *   B  per rotary, so the one beside it is untouched
   *   C  a hand takes it back in one frame, by the routes a hand has
   *
   * 🔴 C IS TWO ROUTES ON A ROTARY AND WAS THREE ON A SLIDER, AND THE MISSING
   * ONE IS A REAL DIFFERENCE BETWEEN THE COMPONENTS RATHER THAN A CHECK
   * DROPPED IN THE SWAP. `slider.set()` opens with `handYield?.()`, so the PAGE
   * calling `set()` takes the handle back for 1200 ms; `knob.set()` does not
   * call `yield` at all, so a page setting a dial while a hand is running has
   * its value overwritten on the hand's next frame. The wheel and the arrow key
   * both yield on a rotary and both are driven below. **The third route is
   * named as ungraded rather than asserted false**, because asserting the
   * current behaviour would write a probable defect into the page as a
   * promise. It is in the report.
   * ⚠️ AND THE POINTER ROUTE IS DRIVEN AS A WHEEL. `knob.mjs`'s `pointerdown`
   * calls `setPointerCapture` unguarded, which throws on any pointer a page
   * dispatches at itself and takes the page down through `guard(d)`; see the
   * long note in `freeChecks`. The wheel reaches the same `yield` one line
   * later in the same file and is dispatchable.
   *
   * ⚠️ AND IT NEVER REACHES THE BOARD UNDER A CHECK. Everything the hand makes
   * goes through `move()` and so through `pump()`, which holds every value back
   * while `MAY_PLAY` is false. The assert about that is the one already in
   * `checkAll`, and it now covers a hand's messages as well as a finger's.
   */
  let handRun = null;
  async function handChecks() {
    const a = cutoff.hand, b = reso.hand;
    if (!a || !b) return;
    /* ⚠️ THE HAND'S ROW IS THE KNOB ITSELF. `createKnob` passes `row: root` to
       `createHandDrive` where `createSlider` passes its own `.sld-hand-row`, so
       `dataset.hand` and `dataset.held` are on `.pos-knob` here. Same two
       attributes, same file writing them, one element up. */
    const rowOf = (s) => s.el;
    const glyphOf = (s) => getComputedStyle(s.el.querySelector('.pos-knob-hand')).color;
    const startedWith = reso.value();
    const startsBefore = handStarts;

    a.press();                                   // off -> sweep. One press, like a person's
    const lit = {
      mine: rowOf(cutoff).dataset.hand, other: rowOf(reso).dataset.hand,
      // 🔴 THE GLYPH'S COLOUR, NOT THE DIAL'S. Instructed 2026-09-16: *"do not
      // change slider playhead color when automated ... just color it yellow
      // when enabled (the symbol)"*. The dial is the same yellow whoever is
      // turning it, which is the point: a control being driven should look like
      // that control, and the thing that says a page is driving it is the
      // button.
      glyph: glyphOf(cutoff), otherGlyph: glyphOf(reso),
      pressed: cutoff.el.querySelector('.pos-knob-hand').getAttribute('aria-pressed'),
      // ⚠️ A CEILING IS ONLY A CEILING IF IT IS RUNNING DOWN. Reading the
      // constant would assert the source rather than the behaviour.
      leftMs: a.leftMs,
      starts: handStarts - startsBefore,
    };
    const from = cutoff.value();
    await wait(900);
    const movedTo = cutoff.value();

    // ── C1. a wheel over the dial ──────────────────────────────────────────
    const dial = cutoff.el.querySelector('.pos-knob-dial');
    const wheel = (dy) => dial.dispatchEvent(new WheelEvent('wheel',
      { deltaY: dy, bubbles: true, cancelable: true }));
    wheel(-120);
    const heldByWheel = rowOf(cutoff).dataset.held === '1' && rowOf(cutoff).dataset.hand === 'on';
    const atWheel = cutoff.value();
    /**
     * ⚠️ THE WAIT IS DERIVED, AND A CONSTANT HERE WENT RED THE HOUR THE LAP GOT
     * SLOWER. It was 400 ms, chosen as about nine of this control's 127 steps
     * at a 2.2 s lap. The lap is 7 s now, on instruction, and 400 ms is two
     * things at once: shorter than the hand's OWN 1200 ms yield, so the hand
     * has not even taken the control back yet, and too little travel to see if
     * it had. Both numbers belong to the hand, so both are read from it: wait
     * out the yield, then a tenth of a lap, which is about twelve steps at any
     * speed.
     */
    // ⚠️ `MOVES` IS A LIST OF PAIRS, NOT A MAP, and reading it as a map returned
    // undefined and fell through to a default that happened to work. A fallback
    // that hides a wrong lookup is worse than no fallback.
    const sweepLapMs = (MOVES.find(([name]) => name === 'sweep') || [])[1]?.lapMs;
    if (!sweepLapMs) throw new Error('knobs: the sweep preset has no lapMs, so this check cannot size its wait');
    const resumeMs = HAND_YIELD_MS + sweepLapMs / 10;
    await wait(resumeMs);
    const resumed = cutoff.value();

    // ── C2. the keyboard, which also goes through the dial ─────────────────
    dial.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true, cancelable: true }));
    const afterKey = cutoff.value();
    const heldByKey = rowOf(cutoff).dataset.held === '1';
    await wait(400);
    const keyStuck = cutoff.value();

    const otherStill = reso.value();
    const otherRow = rowOf(reso).dataset.hand;

    // ── the guard that has no other way to be proved ────────────────────────
    // 🔴 BREAK IT ON PURPOSE: tell the page it is in the background and see
    // whether the hand goes off. `document.hidden` is a getter on the
    // prototype, so it is shadowed for the length of this one check and then
    // removed. Without this the third guard is a line of code nobody has ever
    // watched run.
    let wentOffHidden = null;
    if (a.running) {
      Object.defineProperty(document, 'hidden', { configurable: true, get: () => true });
      document.dispatchEvent(new Event('visibilitychange'));
      wentOffHidden = !a.running;
      delete document.hidden;
    }
    if (a.running) a.press();                    // sweep -> off, whatever happened
    handRun = {
      lit, from, movedTo, heldByWheel, atWheel, resumed,
      afterKey, heldByKey, keyStuck,
      otherStill, otherRow, startedWith, wentOffHidden,
      offAfter: rowOf(cutoff).dataset.hand,
      inControls: document.querySelectorAll('.pos-controls .pos-knob-hand').length,
    };
    cutoff.set(CUTOFF_HOME, { quiet: true });
  }

  function checkAll() {
    /**
     * 🔴 NOT FOR A VISITOR. NOT ONE OF THEM, EVER. PHOTOGRAPHED 2026-09-16 on a
     * phone, on the deployed site, with no query string: two red FAIL lines in
     * the log under the sliders, on a page where nothing was wrong.
     *
     * This ran on every press of Play, which is a REAL person's press, and then
     * graded the board against conditions only a harness creates. `the board
     * wrote to the synth what this page put on the wire` needs controller
     * traffic, and somebody who has pressed play and not yet touched a slider
     * has made none: the board pushes its counters only when they MOVE, so the
     * page had nothing to read and said so in red.
     *
     * CLAUDE.md's rule is the whole of the answer and it has no exceptions.
     * `demo/verify.mjs` appends `selfcheck=1`, so the suite still grades
     * everything, and a visitor gets the page.
     */
    if (!SELFCHECK) return;
    // ── reachable with no board at all ───────────────────────────────────
    /**
     * 🔴 WHAT THIS GRADES IS THE KIT, NOT THIS PAGE, AND IT IS FIRST BECAUSE IT
     * IS THE ONE CLAIM A RUN MUST NOT BE ABLE TO LOSE. `MAY_PLAY` holds every
     * message whether or not `board.mjs` guards anything, so flipping
     * `createBoard`'s `inSelfcheck` default to `'allow'` would leave this page
     * fully green while a suite run drives a shared Raspberry Pi. `/draw/` and
     * `/grains/` build their own control rows and carry no `MAY_PLAY` at all,
     * so the page where that mistake gets made is never the page holding the
     * assert. This is the only page that opens a board, so it is the only place
     * the kit can be checked from.
     * ⚠️ IT ONLY MEANS ANYTHING WHEN THE BOARD IS OFF LIMITS. With `?board=1`
     * the page is DRIVING on purpose, so the claim is skipped in words rather
     * than inverted: a check that cannot be answered and a check that answered
     * badly must not look the same.
     */
    if (!MAY_PLAY) {
      d.assert('the kit refuses to drive shared hardware under a check, so a page that forgets to guard itself is still safe',
        board.driving() === false,
        `createBoard says driving ${board.driving()}`);
    } else {
      d.log('?board=1 is set, so this run is allowed to drive the board and cannot grade the guard that stops it');
    }
    d.assert('the page reached the relay', wire.state() === 1,
      wire.state() === 1 ? `open in ${ROOM}` : `readyState ${wire.state()}${wire.stats().refusal ? ` · ${wire.stats().refusal}` : ''}`);
    d.assert('the relay answered a round trip with nothing woken at the far end',
      Number.isFinite(rtt), rtt === null ? 'no pong came back' : `${Math.round(rtt)} ms`);
    /**
     * The relay echoes verbatim to the sender, so the difference between what
     * went out and what came back is this socket's drop count, with nobody's
     * cooperation.
     *
     * ⚠️ THE TOLERANCE IS A ROUND TRIP'S WORTH, NOT A NUMBER I LIKED. It was
     * three, and a board run read `33 of 37` because the sweep ends about 40 ms
     * before this line and the gate sends up to one message per controller per
     * 20 ms. What can honestly be in flight is whatever left within one round
     * trip, so the allowance is computed from the round trip this page has just
     * MEASURED rather than guessed: 45 ms at one controller every 20 ms is two
     * or three, doubled for a second controller a hand may be on, and on a slow
     * link it is more, correctly.
     */
    const w = wire.stats();
    const inFlight = Math.ceil(((Number.isFinite(rtt) ? rtt : 60) / SEND_GATE_MS) * 2) + 1;
    d.assert('the relay delivered the control messages this page sent',
      w.sent > 0 && w.sent - w.echoed <= inFlight,
      `${w.echoed} of ${w.sent} came back, with up to ${inFlight} still in flight at a `
      + `${Math.round(Number.isFinite(rtt) ? rtt : 60)} ms round trip`
      + `${w.refused ? `, ${w.refused} refused by this page as too big` : ''}`);
    // Both branches. A board that is off is the ordinary case, and a page that
    // only asserts the happy path has no coverage on those days.
    // ⚠️ `d.api.logs`, NOT `d.logs`. The mount API does not carry the array;
    // only `window.__demo` does, and `d.api` is that object. `/able/` reads
    // `d.logs.length` in exactly this position and throws a TypeError on the
    // branch where the far end is off, which is the branch that runs on the
    // ordinary day.
    d.assert('it says whether a board answered in this room',
      boardAnswered ? !!boardSaid : d.api.logs.some((l) => l.msg.includes('no board answered')),
      boardAnswered ? boardSaid : `nothing answered in ${ROOM}, and the log says so`);
    /**
     * 🔴 THE TWO THINGS A VISITOR REPORTED, AS CHECKS RATHER THAN AS A FIXED
     * BUG. *"Sound just ends. There shouldn't be a transport slider. It should
     * go forever."* Both were true of this page and both are the kind of thing
     * that creeps back in the next time somebody reaches for the transport,
     * because a scrub and an end are what a transport USUALLY has.
     */
    /**
     * 🔴 THE PICTURE IS LAST AND CARRIES THE STANDING HEADING, AND THIS PAGE
     * SHIPPED WITH NEITHER. REPORTED 2026-09-16 with a screenshot: *"no heading
     * on diagram. and not last in page. breaking the rules afgain and afain"*.
     *
     * The cause was that `how` and `atEnd` are `createDiagram`'s THIRD argument
     * and had been written inside the spec, where they are two unread keys
     * rather than an error. Nothing could see it: not the parser, not `cuts`,
     * not the suite. So it is a check now, and it is about the page rather than
     * about the call, because the next way to get this wrong will not be the
     * same way.
     */
    const kids = [...document.body.children].map((e) => e.className.split(' ')[0]);
    const fig = kids.lastIndexOf('pos-dg');
    /**
     * 🔴 AND THE PICTURE REPORTS ITS OWN DAMAGE. `createDiagram` collects every
     * label it had to shorten, every note over about forty words and every
     * arrow it could not route, and a page that never reads that list ships a
     * cut label looking exactly like a picture that is fine.
     */
    d.assert('nothing in the picture was cut, shortened or left undrawn',
      (dg.cuts?.length ?? 0) === 0,
      (dg.cuts?.length ?? 0) === 0 ? `${dg.ties ?? 0} tie(s), nothing reported`
        : dg.cuts.map((c) => `${c.id}: ${c.shown}`).join(' · '));
    d.assert('the picture is the last thing on the page, under the standing heading',
      fig === kids.length - 1 && kids[fig - 1] === 'pos-how'
        && document.querySelector('.pos-how')?.textContent === 'How it works',
      `${kids.join(' -> ')} · heading "${document.querySelector('.pos-how')?.textContent || 'none'}"`);
    /**
     * 🔴 THE TWO TRANSPORT ASSERTS THAT USED TO STAND HERE WENT WITH THE BAR,
     * AND THEY ARE REPLACED RATHER THAN DROPPED. They read *"the transport
     * offers no position and no loop"* and *"the bar carries the board's
     * presence where a clock would be"*, and both were about a bar whose only
     * child was the badge. What they were really claiming is the claim below:
     * there is exactly ONE place on this page that says whether the Raspberry
     * Pi is answering, and this page has no position to seek to.
     */
    const badges = document.querySelectorAll('.pos-pres');
    d.assert('the board’s presence is in the foot, once on the page and nowhere else',
      badges.length === 1 && panel.plateRow.contains(pres.el) && !document.querySelector('.tbar'),
      `${badges.length} presence badge(s), ${panel.plateRow.contains(pres.el) ? 'in' : 'NOT in'} the foot, `
      + `and ${document.querySelector('.tbar') ? 'a transport bar is still on the page' : 'no transport bar'}`);
    /**
     * 🔴 THE FOOT IS THE COMPONENT'S OWN JUSTIFIED ROW, AND ITS TWO ENDS
     * ARE MEASURED RATHER THAN READ OFF THE STYLESHEET. `createInstrumentPanel`
     * builds the plate row as `align: 'between'` with exactly two children: the
     * name and its badge as one cluster at the start, the midi button at the
     * end. Which rule won is a question only two rects can answer, which is
     * `positron-ui`'s standing instruction about every claim like this one.
     * 🔴 **AND IT IS READ OFF `footRun`, BECAUSE BY THE TIME THIS RUNS THE
     * BUTTON HAS GONE.** `runChecks` presses it before any of this, and the
     * press is what takes it off the foot, so a live rect here would be reading
     * a detached element and would report `0` for every edge. `openMidi`
     * measures the row on both sides of the one line that removes it.
     * ⚠️ THE MARGIN IS THE FOOT'S OWN CENTRE, so this cannot pass on a row
     * that laid both ends out on top of each other.
     */
    /* ⚠️ EVERY FIELD IS TESTED BEFORE IT IS READ, INCLUDING IN THE DETAIL. The
       three arguments of an assert are all evaluated before it runs, so a
       `null` reached inside the message throws out of the whole check block and
       takes every assert after it with it, silently and green. */
    const foot = (footRun && footRun.foot && footRun.name && footRun.midi) ? footRun : null;
    d.assert('the foot put the name and the badge at one end and the midi button at the other',
      !!foot && foot.name.left < foot.foot.left + foot.foot.width / 2
      && foot.midi.left > foot.foot.left + foot.foot.width / 2
      && foot.name.right <= foot.midi.left,
      foot ? `the foot spanned ${foot.foot.left.toFixed(1)} to ${foot.foot.right.toFixed(1)}, the `
        + `name and badge ended at ${foot.name.right.toFixed(1)} and the button started at `
        + `${foot.midi.left.toFixed(1)}`
        : 'nothing opened MIDI, so the foot was never measured');
    /**
     * 🔴 AND THE BUTTON LEAVES RATHER THAN SITTING THERE DISABLED WITH A
     * SENTENCE ON IT. Asked 2026-09-28: *"rm “midi is listening”"*. The two
     * halves of that are both graded here, because removing the words and
     * leaving a dead control would satisfy neither on its own: the button is
     * off the page, and the label it left with is still the one that says what
     * a press does rather than what the state is.
     * ⚠️ WHAT IT COSTS IS PRINTED RATHER THAN ASSERTED. The foot is the last
     * row of the panel, so anything it gives up lifts the report and the
     * picture under it, and that number belongs where somebody reading a run
     * can see it. It is a one-off change at the moment of a deliberate press,
     * behind a browser permission dialog on the only branch where anybody sees
     * it, which is why it is a reading and not a failure.
     */
    d.assert('opening MIDI takes its button off the foot, and the word it leaves with is still a press',
      !!foot && foot.gone && !midiBtn.isConnected && midiBtn.textContent === 'enable midi',
      foot && foot.after ? `the foot was ${foot.foot.height.toFixed(1)} px tall with the button and `
        + `is ${foot.after.height.toFixed(1)} px without it, and the button still reads `
        + `“${midiBtn.textContent}”`
        : 'nothing opened MIDI, so the button was never removed');
    /**
     * 🔴 THE SHAPE FIRST, BECAUSE THE PANEL'S ORDER IS THE COMPONENT'S AND
     * NOT THIS PAGE'S. `createInstrumentPanel` inserts every control row ABOVE
     * the keys and the plate however late it is called, which is the sketch of
     * 2026-09-26 being a contract rather than a drawing, and `shape()` reads it
     * off the RENDERED children rather than off the list the module kept.
     * ⚠️ IT IS THE WHOLE STRING, NOT A LENGTH. A panel that built its rows in
     * the wrong order has the same count as one that did not.
     */
    d.assert('the panel is a row of rotaries, then the keys, then the plate',
      panel.shape().join(' ') === 'controls keys plate',
      panel.shape().join(' -> '));
    /**
     * 🔴 THE NAMEPLATE IS THE START OF THE FOOT SINCE 2026-09-28, AND IT WAS
     * THE CASE'S TOP RIGHT CORNER BEFORE THAT. The two asserts that stood here
     * measured the corner against `.panel-case`'s own inset, and there is no
     * case any more; what replaces them is the claim the new component makes,
     * which is that the plate is the panel's LAST row and its name is against
     * that row's own inset.
     * 🔴 **THE INK IS MEASURED, NOT THE PLATE.** `.panel-plate` is a flex box
     * spanning whatever it is in, so its own rect is right at both edges
     * whatever the placement does to the name inside it: a check reading
     * `plate.el` would pass under every placement including one that had
     * stopped working. `plate.lines[0]` is the `knobs` line itself.
     * ⚠️ **AND THE INSET IS READ OFF THE ROW RATHER THAN TYPED.** A glue row
     * is `padding: var(--rows-gap) var(--rows-pad)`, so its computed
     * `padding-left` IS the token every other row on this surface uses. A `20`
     * typed here would be a shared measurement in two files, which is the
     * defect `--sld-col` exists to stop.
     * ⚠️ AND THE NAME IS READ THROUGH `shown()`, WHICH ASKS THE BROWSER WHAT
     * IT RENDERED. `caps: false` is a claim about the PICTURE, and `/circuit/`
     * typed `novation` and rendered `NOVATION` on `text-transform` alone while
     * a check reading `textContent` graded the source and stayed green either
     * way. `shown()` RETURNS AN ARRAY, which this page once compared against a
     * string and so could never pass while printing a detail that read
     * perfectly.
     */
    const footCs = getComputedStyle(panel.plateRow);
    const footPad = parseFloat(footCs.paddingLeft);
    const footBox = panel.plateRow.getBoundingClientRect();
    const ink = panel.plate.lines[0].getBoundingClientRect();
    d.assert('the plate is the last row and its name is one inset in, reading KNOBS in upper case',
      panel.rows().at(-1).kind === 'plate' && panel.plate.shown().join(' ') === 'KNOBS'
      && Math.abs((ink.left - footBox.left) - footPad) <= 1,
      `ink left ${ink.left.toFixed(1)} against a row starting at ${footBox.left.toFixed(1)}, `
      + `${(ink.left - footBox.left).toFixed(1)} px of a ${footPad.toFixed(1)} px inset, reading `
      + `${panel.plate.shown().join(' ')}`);
    /**
     * 🔴 AND THE ROTARIES ARE STILL FIRST AND STILL AT THE LEFT, WHICH IS
     * *"left to rotaries cutoff reseonance"* surviving a second move. They were
     * a fixed COLUMN beside a scroller, then the case flow's first child, and
     * they are the panel's first row now, so the claim that can still be made
     * is about the order and the edge.
     * ⚠️ THE ORDER HALF READS THE ROW LIST AND THE EDGE HALF READS A RECT,
     * because two rows stacked on a surface both start at the same x and a rect
     * cannot tell which is first.
     * ⚠️ AND `start` IS THE HALF A RECT CATCHES. A row centres by default, so
     * the lattice sitting on the row's own inset is the only thing that says
     * the alignment took.
     * ⚠️ **THE BOX IS THE GRID'S AND THE INK IS THE DIAL'S, AND SINCE THE
     * LATTICE ARRIVED THEY ARE NO LONGER THE SAME EDGE.** A cell is the square
     * pitch and a dial is `--knob-w`, so the first dial sits half the spare cell
     * further in. The offset is PRINTED rather than asserted, because it is the
     * lattice doing what it says and not a row that failed to align, and a
     * reader of this run should be able to see how far in the ink starts.
     */
    const knobRow = panel.rows()[0].el;
    const knobBox = knobs.el.getBoundingClientRect();
    const rowBox = knobRow.getBoundingClientRect();
    const firstDial = knobs.cells[0].querySelector('.pos-knob-dial');
    const dialLeft = firstDial ? firstDial.getBoundingClientRect().left : NaN;
    d.assert('the rotaries are the first row and sit on its left inset',
      panel.rows()[0].kind === 'controls' && knobRow.contains(knobs.el)
      && Math.abs((knobBox.left - rowBox.left) - parseFloat(getComputedStyle(knobRow).paddingLeft)) <= 1,
      `the rotaries are row ${panel.rows().findIndex((r) => r.el === knobRow) + 1} of `
      + `${panel.rows().length} and start at ${knobBox.left.toFixed(1)}, `
      + `${(knobBox.left - rowBox.left).toFixed(1)} px inside a row spanning `
      + `${rowBox.left.toFixed(1)} to ${rowBox.right.toFixed(1)}, with the first `
      + `dial's ink at ${Number.isFinite(dialLeft) ? dialLeft.toFixed(1) : '?'}`);
    /**
     * 🔴 THE TWO DIAL CENTRES SIT ONE LATTICE PITCH APART, WHICH IS THE ONLY
     * THING THAT SAYS *"knobs: use rotaty sliders grid"* TOOK. Asked
     * 2026-09-28. A flex row and a lattice look alike in a screenshot and
     * differ by a measurement: `.pos-knob-row` puts two dials `--knob-w` plus
     * `--ctl-gap` apart, which is about 58 px, and `createControlGrid` opens the
     * column out to the taller of the cell's two dimensions, which on a knob is
     * its height. So a page that quietly fell back to a row would be green on
     * every other claim here and red on this one.
     * ⚠️ **ONE ROW, SO ACROSS AGAINST DOWN CANNOT BE THE CLAIM.** `/muta/` has
     * four rotaries and grades its step right against its step down; this page
     * has two and no second row, so what is left to grade is that the step is
     * the LATTICE's and not the row's.
     * ⚠️ AND EVERY NUMBER IN IT IS READ BACK rather than typed: the pitch off
     * the component, the gap off the one `KNOB_GAP` the call site passes, the
     * dial off its own rect and `--ctl-gap` off the root. The step a flex row
     * would have given is then a measurement rather than a memory, so a label
     * growing and widening the cell moves both sides of the comparison at once.
     */
    const cs = knobs.centres();
    const step = cs.length > 1 ? cs[1].x - cs[0].x : NaN;
    const pitch = knobs.pitch();
    const dialW = firstDial ? firstDial.getBoundingClientRect().width : 0;
    const ctlGap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ctl-gap')) || 0;
    const rowStep = dialW + ctlGap;
    d.assert('the two rotaries stand one lattice pitch apart, wider than the row it replaced',
      Number.isFinite(step) && pitch > 0 && Math.abs(step - (pitch + KNOB_GAP)) <= 1
      && step > rowStep + 1,
      Number.isFinite(step)
        ? `${step.toFixed(1)} px between the centres, which is a ${pitch} px pitch and a `
          + `${KNOB_GAP} px gap, against the ${rowStep.toFixed(1)} px a ${dialW.toFixed(1)} px `
          + `dial at a ${ctlGap.toFixed(1)} px row gap would have given`
        : 'the grid reported no centres');
    /**
     * 🔴 TWENTY-FIVE KEYS, AND THE COUNT IS READ OFF THE DOM RATHER THAN OFF
     * `keyRange`. Asserting the helper against itself would pass on a keyboard
     * that drew nothing.
     * 🔴 AND IT USED TO SAY `its box spans the case` WHILE COMPARING THE BOX
     * AGAINST THE FLOW, WHICH IS A QUANTITY THE BOX ITSELF SETS. `.panel-flow`
     * was `width: max-content`, so `Math.abs(kbBox.width - flowBox.width) <= 1`
     * was two readings of one number: it could not fail, and it printed
     * `992.0 px wide inside a flow 992.0 px wide` against a case measuring
     * 686.0. That is `positron-verify`'s measure the quantity in question, not
     * one adjacent to it, in its cheapest form, and it was hiding a dead
     * option: `full` reached nothing in a `max-content` host.
     * ✅ SO WHAT IS GRADED IS THE CLAIM THAT CAN STILL FAIL: no key was
     * stretched. *"do not stretch it ever"*, and `--k-max` is what says how
     * wide a white key may get, read off the row rather than typed here so a
     * change to the ceiling cannot leave this assert describing the old one.
     * ⚠️ THE SURFACE'S WIDTH IS PRINTED BESIDE THE BOX'S, NOT ASSERTED
     * AGAINST IT, for exactly the reason above: a surface that is
     * `fit-content` is sized by the widest row, and on this panel that row is
     * the keyboard's, so the two numbers are one number again.
     */
    const kbBox = kb.el.getBoundingClientRect();
    const keysEl = kb.el.querySelector('.keys');
    const kMax = parseFloat(getComputedStyle(keysEl).getPropertyValue('--k-max')) || 62;
    const white = [...kb.el.querySelectorAll('.k:not(.sharp)')];
    const widest = Math.max(...white.map((k) => k.getBoundingClientRect().width));
    d.assert('the keyboard is twenty-five keys and not one of them was stretched',
      kb.el.querySelectorAll('.k').length === 25
      && kb.el.classList.contains('kbd-full')
      && widest <= kMax + 0.5,
      `${kb.el.querySelectorAll('.k').length} keys, the widest white one ${widest.toFixed(1)} px `
      + `against a ${kMax.toFixed(1)} px ceiling, in a box ${kbBox.width.toFixed(1)} px wide `
      + `on a surface ${panel.el.getBoundingClientRect().width.toFixed(1)} px wide, `
      + `${keysEl.scrollWidth.toFixed(1)} px of keys scrolling in `
      + `${keysEl.clientWidth.toFixed(1)} px of box`);
    /**
     * 🔴 A VISIT ASKS THE BROWSER FOR NOTHING IT HAS NOT ALREADY AGREED TO,
     * WHICH IS *"always enable midi"* AND CLAUDE.md'S STANDING RULE AT THE SAME
     * TIME. `requestMIDIAccess` raises a permission prompt, so a page that
     * called it on load would put a dialog in front of somebody who came to
     * read. A browser that has already said yes is a different case and the
     * press on it is furniture.
     * 🔴 **TWO COUNTERS, BECAUSE ONE OF THEM CANNOT SEE AN ASYNCHRONOUS OPEN.**
     * `midiAskedOnLoad` is read at the module's LAST LINE and says the load path
     * itself asks nothing; the permission answer arrives a tick later, so that
     * number stays 0 on a granted browser where the page really did open MIDI
     * on the visit. `midiAskedOnVisit` is read after the decision and before any
     * press, which is the whole of a visit. **An assert on the first alone would
     * pass vacuously on exactly the machine the ask is about.**
     * ⚠️ AND THE BRANCH IS NAMED IN THE DETAIL RATHER THAN LEFT TO BE INFERRED.
     * `demo/verify.mjs`'s Chrome answers `prompt`, so this run grades *nothing
     * was asked*; the granted side is graded by the assert below it, which needs
     * no particular machine.
     * ⚠️ AND THE BUTTON IS NOT IN `.pos-controls`. `verify.mjs` presses every
     * button in that row on every run, and this one asks a shared board to
     * listen to whatever is plugged in here. It is in the instrument's footer,
     * which the harness does not press, so the check drives it itself.
     */
    const granted = OPENS_ON_LOAD(midiPermission);
    d.assert('a visit asks the browser for nothing unless it has already said yes',
      midiAskedOnLoad === 0
      && (granted ? midiOpenedByPermission && midiAskedOnVisit === 1
                  : !midiOpenedByPermission && midiAskedOnVisit === 0)
      && document.querySelectorAll('.pos-controls button').length === 0
      && !document.querySelector('.pos-controls')?.contains(midiBtn),
      `this browser answers “${midiPermission}”, so the branch graded here is `
      + `“${granted ? 'already granted, so the page opened MIDI with no press'
                         : 'not granted, so the visit asked nothing'}”: `
      + `the module asked ${midiAskedOnLoad} time(s), the visit ${midiAskedOnVisit}, and the `
      + `control row holds ${document.querySelectorAll('.pos-controls button').length} button(s)`);
    /**
     * 🔴 THE OTHER BRANCH, GRADED ON A MACHINE THAT IS NOT IN IT, BECAUSE
     * *"unless it has already said yes"* IS EXACTLY THE SHAPE THAT PASSES WHERE
     * THE CONDITION NEVER HOLDS. The load path asks one named function whether
     * to open, so that function can be asked here about every answer a browser
     * can give, with no permission, no prompt and no device.
     * ⚠️ IT IS A NEGATIVE CONTROL IN BOTH DIRECTIONS AND THAT IS THE POINT. The
     * naive reading of *"always enable midi"* is a predicate that returns true
     * for everything, and it fails the `prompt` line; a page that never opened
     * fails the `granted` line. Neither can be green here.
     * ⚠️ AND `unavailable` IS ITS OWN ANSWER RATHER THAN A FALSY ONE. Safari has
     * no Web MIDI and Firefox throws on this descriptor, and a probe that could
     * not answer must never read as a yes.
     */
    d.assert('and only an already granted browser opens it, which is checked for every answer a browser can give',
      OPENS_ON_LOAD('granted') === true
      && OPENS_ON_LOAD('prompt') === false
      && OPENS_ON_LOAD('denied') === false
      && OPENS_ON_LOAD('unavailable') === false
      && OPENS_ON_LOAD(undefined) === false,
      'granted opens, prompt denied unavailable and no answer at all do not');
    /**
     * 🔴 AND THE PRESS OPENS SOMETHING REAL, WHICH IS THE POSITIVE HALF. A
     * negative control on its own is satisfied by a button wired to nothing,
     * and this project has shipped exactly that twice: a control that looks
     * live and is inert.
     * ⚠️ THE STATE IS NOT ASSERTED ON, ONLY REPORTED. `createMidi` resolves
     * `requestMIDIAccess` asynchronously and this desk's answer depends on what
     * the browser was launched with, so `connected`, `none plugged in` and
     * `refused` are all correct answers here. What is asserted is that the
     * press ASKED, once, and that a real api came back.
     * ⚠️ AND `midiAsked === 1` IS A SECOND CLAIM RATHER THAN A RESTATEMENT:
     * `openMidi` is idempotent, so a second press would read 2.
     */
    /* ⚠️ `openMidi()` AND NOT A SECOND `click()`, BECAUSE THE BUTTON IS OFF
       THE PAGE ONCE IT HAS DONE ITS JOB. A detached button still dispatches a
       click, so a second press would prove the DISABLE that goes with the
       removal rather than the guard inside the function, and the guard is the
       thing that has to hold when a page calls it from two places. */
    openMidi();
    d.assert('the press opens a real MIDI access, and asks for it exactly once',
      midiAsked === 1 && !!midi && typeof midi.state === 'function' && !midiBtn.isConnected,
      `${midiAsked} ask(s) after a press and a second call on a browser answering `
      + `\u201c${midiPermission}\u201d, and the access reads `
      + `\u201c${midi ? midi.state() : 'nothing open'}\u201d with ${midi ? midi.ports() : 0} input(s)`);
    d.assert('this page makes no sound of its own',
      !!board.ctx() && !!board.playout(), 'every sample it can play arrived over the socket');

    // ── the gate, driven through the page’s own sliders ───────────────
    if (SELFCHECK && sweep) {
      // 50 a second is the gate, plus one for the release and a little slack
      // for a browser that did not hand the timer back on time.
      const ceiling = Math.ceil(sweep.took / SEND_GATE_MS) + 4;
      d.assert(`a fast drag is thinned to one value per slider every ${SEND_GATE_MS} ms`,
        sweep.offered >= 40 && sweep.thinned > 0 && sweep.messages <= ceiling && sweep.messages >= 4,
        `${sweep.offered} positions in ${Math.round(sweep.took)} ms became ${sweep.messages} messages, ceiling ${ceiling}`);
      d.assert('and the position the hand stopped at was sent anyway',
        sweep.ended === 127, `the drag ended at 127 and the gate holds ${sweep.ended}`);
      if (!MAY_PLAY) {
        d.assert('a scripted press does not take a shared instrument away from whoever is using it',
          wireMsgs === 0 && !armed && heldBack > 0,
          `the gate made ${gate.stats.messages} messages, ${heldBack} were held back and ${wireMsgs} went on the wire`);
      }
    }

    // ── the invisible hand ───────────────────────────────────────────────
    if (SELFCHECK && handRun) {
      const h = handRun;
      /**
       * 🔴 A. UNMISTAKABLE, ON TWO CHANNELS, AND IT WAS THREE UNTIL THE DIAL
       * WAS TOLD TO STOP CHANGING. The symbol lights while the rotary is
       * automated, even at a turn where the needle is standing still, and the
       * log says when it started, which is the only channel that survives a
       * screenshot taken a minute later.
       * ⚠️ THE DIAL IS DELIBERATELY NOT ONE OF THEM: a control being driven
       * should look like that control, and a needle that changes shape while it
       * moves reads as one that has broken. The comparison is against the
       * rotary beside it rather than a remembered colour, which is what having
       * two of them buys.
       */
      d.assert('while a hand runs its symbol is lit, and the rotary beside it is untouched',
        h.lit.mine === 'on' && h.lit.other === 'off' && h.lit.pressed === 'true'
        && h.lit.glyph !== h.lit.otherGlyph && h.lit.starts === 1
        && d.api.logs.some((l) => l.msg.includes('cutoff is moving by itself')),
        `the driven symbol is ${h.lit.glyph} and the one beside it ${h.lit.otherGlyph}, `
        + `its row reads ${h.lit.mine} against ${h.lit.other}, and the log has the line`);
      /**
       * 🔴 B. PER ROTARY, AND THIS IS A NEGATIVE CONTROL: it fails if the hand
       * is a module-level singleton, which is the obvious way to write one.
       */
      d.assert('a hand belongs to one rotary: the other never moved and never said it was on',
        h.otherStill === h.startedWith && h.otherRow === 'off',
        `resonance sat at ${h.otherStill} for the whole ${'2.1'} s the cutoff was being driven, `
        + `and its own row still reads ${h.otherRow}`);
      /**
       * 🔴 C. TWO WAYS TO TAKE IT BACK ON A ROTARY, AND BOTH HAVE TO WORK: a
       * wheel over the dial and an arrow key on it. Both run `handApi.yield()`
       * and then `set(..., { from: 'hand' })`, which is the funnel a real drag
       * ends in too.
       * 🔴 THE THIRD ROUTE THE SLIDER HAD IS NOT ASSERTED AND IS NOT SILENTLY
       * GONE. `slider.set()` yields the hand and `knob.set()` does not, so *the
       * page takes the dial back* is not true here. Asserting it would be a
       * promise the component does not keep, and asserting its opposite would
       * write a probable defect down as a feature. It is named as ungraded, in
       * `handChecks` and in the report.
       */
      d.assert('a wheel and an arrow key each take the dial back in one frame',
        h.heldByWheel && h.heldByKey
        && h.keyStuck === h.afterKey && h.atWheel !== h.movedTo,
        `the wheel left it at ${h.atWheel}, an arrow key left it at ${h.afterKey} `
        + 'and it was still there 400 ms later');
      /**
       * ⚠️ YIELD, NOT OFF. Nothing pressed the button, so the hand picks the
       * movement up from where the wheel left it. A motorised control you can
       * grab is the physical thing the phrase names.
       */
      d.assert('and it picks the movement up again after the yield, from where it was left',
        h.resumed !== h.atWheel && h.movedTo !== h.from && h.offAfter === 'off',
        `it swept ${h.from} to ${h.movedTo}, was put at ${h.atWheel} by hand, read ${h.resumed} `
        + 'after the yield ran out, and a second press turned it off');
      /**
       * 🔴 THE GUARDS, AND TWO OF THEM ARE PROVED BY BREAKING SOMETHING. Never
       * on load: nothing had asked for a hand before this press. Never in the
       * control row: `verify.mjs` presses every button in it on every run. Off
       * when the tab is hidden: `document.hidden` was shadowed for one line and
       * the event dispatched, so the guard is watched rather than assumed. The
       * ceiling is read off a clock that is running down rather than off the
       * constant that set it.
       */
      d.assert('nothing starts a hand by itself, none of them is in the control row, and it stops itself',
        h.lit.starts === 1 && h.inControls === 0
        && h.wentOffHidden === true
        && h.lit.leftMs > 9 * 60000 && h.lit.leftMs <= 10 * 60000,
        `${h.inControls} hand buttons in the control row, the tab going to the background `
        + `turned it ${h.wentOffHidden ? 'off' : 'NOT off'}, and ${Math.round(h.lit.leftMs / 1000)} s `
        + 'were left of the ten minute ceiling one frame after it started');
    }

    // ── only answerable with a board ─────────────────────────────────────
    if (!armed) return;
    d.assert('an instrument named itself', playing === 'yoshimi', String(playing));
    d.assert('the shape of a frame is checked against what the board publishes, not read off its size',
      board.stats().shapeChecked && !board.stats().shapeWrong,
      board.stats().shapeSaid || 'no frame has arrived yet');
    d.assert('the sample rate it sends is the one this page plays at',
      board.ctx()?.sampleRate === RATE, `context ${board.ctx()?.sampleRate} Hz against ${RATE} Hz from the board`);
    /**
     * 🔴 ONLY WHEN A NOTE IS ACTUALLY BEING HELD. The harness drives this
     * transport itself, and stop here is a PANIC, so a drill that presses play
     * and then stop leaves nothing sounding: asking for a sound after that is
     * asking the page to answer for a note somebody released. The claim is
     * skipped in words rather than failed, the way `/replay/` skips its loop
     * check, because a check that cannot be answered and a check that answered
     * badly must not look the same.
     * ⚠️ AND IT IS A LEVEL, NOT A COUNT. The board captures its JACK graph
     * continuously, so frames arrive at fifty a second whether or not anything
     * is sounding, and `104 frames of audio` read green through a reported
     * silence.
     */
    if (noteAt && releasedAt < noteAt) {
      d.assert('sound came back while the note was held, and it was not silence',
        board.stats().frames > 20 && board.stats().peak > 0.005,
        board.stats().frames <= 20 ? `only ${board.stats().frames} frames arrived`
          : `${board.stats().frames} frames, loudest sample ${board.stats().peak.toFixed(4)} of full scale`);
    } else {
      d.log(noteAt ? 'the note was released before the checks ran, so there was nothing to hear'
        : 'no note was held, so this run cannot say whether sound comes back');
    }
    d.assert('the relay dropped none of it', board.stats().lost === 0,
      `${board.stats().lost} missing of ${board.stats().frames + board.stats().lost}`);
    d.assert('the board wrote to the synth what this page put on the wire',
      !!meter && meter.in > 0 && meter.out > 0 && meter.out <= meter.in,
      meter ? `${meter.in} values arrived, ${meter.out} written, ${meter.folded} overtaken on the way` : 'the board reported no counters');
    /**
     * ⚠️ `-1` IS NOT A READING AND MUST NOT READ AS A FAILURE. `breaks` opens
     * at -1 meaning the worklet has not reported yet, which is neither `=== 0`
     * nor `> 0` — so this asserted false and printed `no breaks` as its own
     * detail, a check contradicting itself in the same line. PHOTOGRAPHED on a
     * phone. A quantity nobody has measured yet is said in those words.
     */
    /**
     * 🔴 TWO CLAIMS, NOT ONE, BECAUSE THEY HAVE DIFFERENT CAUSES AND ONLY ONE
     * OF THEM IS FIXED. Running dry is a cushion too small for the arrival
     * jitter, and it is cured: MEASURED worst gap 83.6 ms against a 160 ms
     * floor. Trimming is the board's clock and this browser's clock disagreeing
     * by a fraction of a per cent, which no cushion size can cure: the buffer
     * grows until it is cut back, and a bigger floor only sets where that
     * happens. So the check asserts the half that is fixed and REPORTS the half
     * that is not, rather than excusing itself with an `or`.
     * ⚠️ THE TRIM IS STILL AUDIBLE and is in BACKLOG.md as its own problem: the
     * repair is matching the rate, not padding it.
     */
    d.assert('the cushion never ran dry, which is the half a cushion can fix',
      board.stats().starved === 0,
      board.stats().breaks < 0 ? 'the playout has not reported yet, so there is nothing to say'
        : `${board.stats().starved} ran dry, ${board.stats().trimmed} trimmed, cushion now ${Math.round(board.stats().bufferedMs)} ms`);
    if (board.stats().trimmed > 0) {
      d.log(`the playout trimmed ${board.stats().trimmed} time${board.stats().trimmed === 1 ? '' : 's'}: the board's clock and `
        + 'this browser\u2019s drift apart, so the cushion grows until it is cut back', 'warn');
    }
  }

  /**
   * 🔴 THE ONE CHECK ON `panic()`, AND NOTHING COVERED IT BEFORE 2026-09-29.
   * The only mention of it in this block was the note above the held-note
   * assert saying a stop *is a PANIC*, which explains why that check may be
   * skipped and grades nothing about the panic itself.
   *
   * 🔴 AND IT RUNS AFTER `checkAll()` BECAUSE A PANIC NOW LAUNDERS ONE OF ITS
   * ASSERTS. `{ cmd: 'reset' }` zeroes the worklet's `underruns` and
   * `trimEvents` as well as its ring, `board.mjs` surfaces those as `starved`
   * and `trimmed`, and `the cushion never ran dry` reads `starved === 0`. A
   * panic driven before that assert would take it green by wiping the counter
   * it reads, which is a check grading the thing that just reset it. Driving it
   * last also leaves the rotaries and the hands alone until everything that
   * reads them has run.
   *
   * 🔴 WHAT IS GRADED WITH NO BOARD IS THE POSTING, AND THAT IS WEAKER. The
   * near side says this page called `postMessage`; it cannot say the worklet
   * did anything with it, so a misspelled `cmd` would pass here. The far side
   * is `played` falling, which only exists when audio was really flowing, so a
   * run without `?board=1` and a live board says so in its own detail line
   * rather than reading as a pass. What the near side DOES catch is the guard:
   * with no audio graph at all this page must post nothing and claim nothing,
   * and that branch is the one a visitor meets first.
   */
  async function panicCheck() {
    if (!SELFCHECK) return;
    const hadNode = !!board.playout();
    const before = plSeen;
    panic();
    const p = lastPanic;
    // The worklet posts its counters every 250 ms, so wait for a message that
    // is NEWER than the one in hand rather than for a number of milliseconds.
    if (hadNode) for (let i = 0; i < 12 && plSeen === before; i++) await wait(50);
    const answerable = hadNode && !!before && before.played > 0 && !!plSeen && plSeen !== before;
    const fell = answerable ? plSeen.played < before.played : null;
    d.assert('a panic drops the sound already in this page, and claims nothing when there is none',
      !!p && p.droppedHere === hadNode && fell !== false,
      !hadNode
        ? 'no audio graph had been built, so there was nothing to drop, nothing was posted and nothing was claimed'
        : answerable
          ? `the playout was told to reset and its own count of samples played fell from ${before.played} to ${plSeen.played}`
          : 'the playout was told to reset, and with nothing arriving its counters read 0 either way, so only the posting is graded on this run');
  }

  // Finer than the gate, so a value it held back is never held much longer than
  // the gate's own 20 ms, and so the 500 ms restatement has a clock to ride on
  // with nothing moving. Started last, after the socket exists.
  setInterval(pump, 10);

  /**
   * 🔴 NOTHING IS ASSERTED AT LOAD, AND THIS PAGE LOST TEN CHECKS BY DOING IT.
   * `verify.mjs` stops collecting 400 ms after the last assert, and `settleMs`
   * is the budget for a page's FIRST one. `freeChecks()` ran here, so the
   * window opened and shut inside the first second while the checks behind the
   * play press arrived eight seconds later with nobody counting: 27 asserts
   * became 17, every one of them green, which is the worst shape a loss takes.
   * The press drives the free lane, the sweep and the board lane in one run,
   * which is what `/replay/` had to learn for the same reason.
   */
  /**
   * 🔴 THE PICTURE GOES LAST AND IT IS REFERENCE. `{ how: true, atEnd: true }`
   * and no title: the heading lives in `diagram.mjs` so no page can invent a
   * second wording for it. A diagram is read once, on purpose, by somebody who
   * has already dragged a slider and wants to know what is behind it, which is
   * under the controls rather than in front of them.
   */
  const dg = createDiagram(d.el, {
    // ⚠️ `A HAND`, NOT `YOUR HAND`. One of the two that move these sliders now
    // belongs to the page, and both of them make far more positions than the
    // gate lets out. A caption that says only your finger would be describing
    // half the traffic it is there to explain.
    caption: 'A hand makes more positions than the wire needs to carry, yours or the page’s own, so the page sends a '
      + 'thinned version of your gesture: cc out counts the values that left this browser, cc '
      + 'played counts the ones the board wrote to the synth, and the difference between them '
      + 'is what went missing between here and there.',
    nodes: [
      /**
       * 🔴 `join: false`, BECAUSE THESE THREE ARE NOT A CHAIN. REPORTED
       * 2026-09-16 with a screenshot: *"why send gate connects to playout?"*.
       *
       * An arrow between two neighbours is the container's DEFAULT, and it was
       * drawing `send gate -> playout`, which says the gate feeds the playout.
       * It does not: one is control leaving and the other is audio arriving, and
       * they never touch. The real chain is declared, sliders into the gate, and
       * the third box belongs to the return path, which reaches it from outside
       * the machine.
       * ⚠️ A DECLARED LINK IS UNAFFECTED: `join` only decides what an UNDECLARED
       * gap between two neighbours looks like, so the arrow that is true still
       * draws and the one that was invented does not.
       */
      /**
       * ⚠️ A CONTAINER'S SUB SAYS WHAT ROLE THE MACHINE PLAYS, which is the one
       * thing its name cannot. Asked 2026-09-16: *"outer boxes have no
       * descriptions. make short but useful"*, after an earlier round removed
       * `phone or laptop`, `one object` and `in another building` as unhelpful,
       * which they were: they described the machines rather than their part in
       * this. Three or four words each, and still no `note`, because a
       * paragraph on a container repeats the boxes underneath it.
       */
      { id: 'you', label: 'Browser', kind: 'here', tech: 'browser',
        join: false,
        children: [
          { id: 'sliders', label: 'controls', sub: 'keys, 2 knobs', tech: 'browser',
        },
          { id: 'gate', label: 'send gate', sub: 'one value per 20ms', tech: 'browser',
        },
          { id: 'playout', label: 'playout', sub: 'AudioWorklet, 160ms', tech: 'sound',
        },
        ] },
      // ⚠️ NO `sub` ON A CONTAINER. Asked 2026-09-16: *"rm outer boxes descs not
      // helpful"*. `phone or laptop`, `one object` and `in another building` were
      // three captions saying what the boxes inside them already say: the
      // children name the machine better than a phrase above them can.
      /**
       * 🔴 ONE OBJECT, DRAWN AS TWO BOXES BY ROLE, AND IT IS `/keys/`'s SHAPE.
       * Asked for 2026-09-16: *"current box diagram is so much nicer. unify the
       * diagrams"*.
       *
       * With a single `Relay` box THREE arrows met at one node: the control
       * going out, and both halves of the audio coming back. So the outward
       * arrow and the return arrow shared a point and the return had to be
       * routed under the row, arriving at `playout` as a stub from nowhere.
       * That was reported on the other page in exactly those words: *"what is
       * this thing on left of playout?"* and *"how sound gets back from pi to
       * browser? no connector on this"*. Split by role the picture is a RING:
       * out along the top, down the board, back along the bottom, and nothing
       * meets in the middle.
       *
       * ⚠️ IT IS NOT TWO RELAYS AND THE PICTURE MUST NOT SAY IT IS. It is one
       * Durable Object on one socket carrying traffic both ways, which is what
       * `Relay object` under each of them says. A drawing may split a thing by
       * ROLE to be read; it may not invent a second machine.
       * ⚠️ AND IT EVENS THE ROW. Containers are drawn to one height, so with one
       * box here against three in the Browser this machine was two rows of blank
       * ground. Two is still one short of three, which is as close as three
       * honest boxes get.
       *
       * The name is `Relay`; `Durable Object` under it is what kind of thing it
       * is. The label is what that half CARRIES, because a direction is not a
       * name: `notes out` and `sound back` were tried on the other page and
       * reported as *"not good names"*, correctly. The direction is in the
       * arrows already.
       */
      { id: 'cf', label: 'Cloudflare', kind: 'cloud', tech: 'cloudflare',
        join: false,
        children: [
          { id: 'down', label: 'control', sub: 'Relay object', tech: 'cloudflare',
        },
          { id: 'up', label: 'audio', sub: 'Relay object', tech: 'cloudflare',
        },
        ] },
      // `raspberry` is in `TECH_HUE` and `board` never was, so this box had been
      // taking whatever the rotation handed it.
      // ⚠️ `kind: 'device'`, WHICH IS WHAT EVERY OTHER MACHINE-IN-A-ROOM IN THIS
      // project declares. This page was the only `kind: 'box'` anywhere, so the
      // same Raspberry Pi was two different kinds on two pages that draw it.
      { id: 'pi', label: 'Raspberry Pi', kind: 'device', tech: 'raspberry',
        children: [
          /**
           * ⚠️ THE SUB SAYS WHAT KIND OF PROGRAM IT IS, NOT WHERE IT CAME FROM.
           * It read `ZynAddSubFX`, which is the synth Yoshimi was forked from
           * and means nothing to anybody who has not met it. Asked 2026-09-16:
           * *"explain yoshimi: supercolooder etc"*. The lineage is in the note,
           * where there is room to say what it is FOR, and it is set against
           * SuperCollider because this board runs that too, for `/grains/`.
           */
          { id: 'yoshimi', label: 'yoshimi', sub: 'software synth', tech: 'sound',
            /**
             * ⚠️ NO SUPERCOLLIDER IN HERE. It said `SuperCollider on this same
             * board is the other kind`, meaning to place Yoshimi by contrast,
             * and it did the opposite: *"do not get sc thing, is yoshimi
             * sc-based on no?"*. It is not, it is C++ and forked from
             * ZynAddSubFX, and naming a second program inside a note about the
             * first invites a relationship that does not exist. A note explains
             * the box it is on.
             */
        },
          /**
           * 🔴 TWO BOXES, BECAUSE THEY ARE TWO PROGRAMS. Asked 2026-09-16:
           * *"should it break into 2 boxes (jack / ffmpeg)"*. One box called
           * `capture` with `ffmpeg, JACK` under it was a sub doing a diagram's
           * job: the fact that the synth is not wired to a loudspeaker but to a
           * sound server, and that something else reads it from there, was a
           * sentence in a note instead of a thing a reader can point at.
           * ⚠️ IT ALSO EVENS THE PICTURE. The Browser holds three boxes and the
           * board held two, and containers are drawn to one height, so the
           * board's spare row was blank ground in every machine beside it.
           */
          { id: 'jack', label: 'JACK', sub: 'sound server', tech: 'sound',
        },
          { id: 'ffmpeg', label: 'ffmpeg', sub: '20ms pieces', tech: 'sound',
        },
        ] },
    ],
    // 🔴 ONE WAY ROUND, AND IT IS A RING. Out along the top: sliders, gate,
    // control, yoshimi. Down the board: the sound server, then the capture.
    // Back along the bottom: audio, playout. Every arrow points the way the
    // signal actually travels, and nothing meets in the middle. `/keys/` draws
    // the same ring with a keyboard where the sliders are.
    links: [
      { from: 'sliders', to: 'gate',
        },
      { from: 'gate', to: 'down', label: 'ctl.set',
        },
      // ⚠️ `CC`, NOT `CC 74, CC 71`. Asked for after a screenshot showed it
      // wrapping onto two lines over the gap between two machines. Which
      // controllers travel is in the note and on the sliders themselves; what
      // the arrow has room to say is what KIND of thing is crossing.
      { from: 'down', to: 'yoshimi', label: 'CC',
        },
      { from: 'yoshimi', to: 'jack',
        },
      { from: 'jack', to: 'ffmpeg',
        },
      /**
       * ⚠️ BOTH HALVES OF THE RETURN CARRY THE SAME LABEL, BECAUSE THE SAME
       * THING IS TRAVELLING. Reported 2026-09-16: *"47khz mono on one sound
       * connector, other nothing, not good. its PCM slices?"*. It is: raw
       * samples, uncompressed, in 20 ms slices. One arrow said the format and
       * the next said nothing, which reads as two different journeys.
       *
       * 🔴 `PCM`, NOT `PCM slices`, SETTLED 2026-09-19: *"h.264 - unify label
       * and longer desc on all diagrams where stream back pcm or mp4 video"*.
       * Sound coming back is `PCM` on every diagram in this project and a
       * picture coming back is `H.264` on `/mirror/`; `/kit/`'s specimens say
       * `PCM` too, so an author copying one gets the settled word. The word
       * `slices` went into the note, where there is room to say how long one
       * is, and `20ms pieces` under ffmpeg was already saying it anyway.
       *
       * 🔴 AND THESE TWO NOTES REVERSE A REMOVAL, WHICH IS WHY IT IS WRITTEN
       * DOWN. On 2026-09-16 this page was told *"rm descs in outer boxes and
       * hover bottom descs"*, and fourteen notes came out of this picture,
       * these two among them. The 2026-09-19 ask is later, is specific to a
       * stream coming back, and names this page's own label; two notes on the
       * return path is what it asks for and every other box here stays bare.
       */
      // 🔴 `back: true` ON BOTH RETURN LINKS, AND IT IS AN AUTHOR FLAG. Nothing
      // infers it: a link without it is laid out as a forward step, so a right
      // to left link gets drawn through whatever stands in the way and puts its
      // head somewhere nobody can account for. Flagged, they run in a lane under
      // the row and arrive at the bottom edge.
      { from: 'ffmpeg', to: 'up', label: 'PCM', back: true,
        note: 'Fifty slices a second, 960 samples each, 48 kHz and one channel, with nothing '
            + 'compressed and nothing wrapped round them. A number in front of each one is '
            + 'what makes a missing slice countable.' },
      { from: 'up', to: 'playout', label: 'PCM', back: true,
        note: 'A browser cannot dial a board behind a home router, so the sound comes back '
            + 'the long way round. The relay drops a slice without saying so, and a gap in '
            + 'those numbers is the only witness.' },
    ],
    // ⚠️ `how` AND `atEnd` ARE THE THIRD ARGUMENT, NOT PART OF THE SPEC. Put
    // inside it they are silently ignored, and the page shipped with no heading
    // and the picture sitting above the log: both rules broken at once, and
    // neither the harness nor `cuts` can see it, because a spec with two extra
    // keys is not an error. Every other page with a diagram passes them here.
  }, { how: true, atEnd: true });

  /**
   * 🔴 THE CHECKS HAD NO WAY IN, AND THAT IS WHY THIS EXISTS. Every one of them
   * sat behind `startNote()`, which was the Play button's handler; Play was
   * removed on 2026-09-17 (*"remove thay button and test tone"*) and nothing
   * ever called `startNote` again. The page has been running its load-time
   * assert and nothing else since, on a page that carries a send gate, an
   * invisible hand, a keyboard and an instrument panel. **A green page with no
   * coverage is the worst possible control**, and the assert COUNT is the only
   * thing that says so.
   *
   * 🔴 THE SILENT WORK GOES FIRST AND EVERY ASSERT LANDS IN ONE RUN, WHICH IS
   * THE ARRANGEMENT THE PAGE ALREADY ARGUED FOR AND NOW DEPENDS ON. The sweep
   * is 600 ms of nothing and the hand is about 3.2 s of nothing, and
   * `verify.mjs` allows only 2.0 s between two asserts. What it allows before
   * the FIRST one is `settleMs`, which is 20 s here, and the test for *this
   * page has not asserted yet* is `n <= shellAsserts`. So nothing may assert
   * until the waiting is over, which is also why the kit guard moved out of the
   * load path.
   *
   * ⚠️ `?board=1` IS THE ONE ROUTE THAT TOUCHES THE INSTRUMENT, and it is the
   * same opt-in it always was: `startNote()` starts yoshimi, loads the patch
   * and holds a note, and then runs the same block. Without it nothing here
   * sends a byte to the board.
   * ⚠️ AND IT IS NOT AWAITED BEFORE `d.ready()`. The harness waits for `ready`
   * BEFORE it drives a page, so a page that only becomes ready at the end of
   * its own checks fails that wait and is graded not at all. `/muta/` and
   * `/radio/` both do exactly this.
   */
  async function runChecks() {
    if (!SELFCHECK) return;
    /* 🔴 THE PERMISSION ANSWER FIRST, AND THE PRESS SECOND, SO THE TWO CANNOT
       BE CONFUSED FOR EACH OTHER. `midiAskedOnVisit` is the count with no press
       in it, and a check that pressed while the query was still in flight would
       read a number that is a race rather than a measurement. */
    await midiSettled;
    /* 🔴 THE PRESS THAT OPENS MIDI, DRIVEN HERE BECAUSE THE HARNESS CANNOT
       REACH IT. `verify.mjs` presses `.pos-controls button`, and this button is
       deliberately on the instrument's foot instead: a control that asks a
       shared board to listen to whatever is plugged in must not be pressed
       dozens of times a day by a suite. Driving it from inside the gate is what
       `/mirror/` had to do for the same reason when its headset buttons were
       switched off.
       ⚠️ AND ON A BROWSER THAT HAD ALREADY SAID YES THIS PRESS DOES NOTHING,
       which is correct and is asserted rather than assumed: the button is off
       the foot and disabled by then, a disabled button fires no click even
       detached, and `openMidi` is idempotent anyway. */
    midiBtn.click();
    /* The panic drill is last on both routes, and `panicCheck` says why: the
       reset it drives wipes the two counters `checkAll` asserts on. */
    if (MAY_PLAY) { await startNote(); await panicCheck(); return; }
    await sweepChecks();
    await handChecks();
    freeChecks();
    checkAll();
    await panicCheck();
    /* `Loop` follows the Evolution, and a loop reaches `board.send`, counted by
       the board module: a harness run is refused there, so this counts notes on
       their way to Yoshimi and nothing was heard. After the panic drill,
       because `ready()` has resolved by then and a note is not held behind it. */
    await checkEvolutionLoop(d, {
      keys: kb, heard: () => board.refusedToBoard(),
      ports: (names) => offerLoopFor(kb, names, d.log), real: () => midi?.names() ?? [],
    });
  }

  /* The counter read at the LAST line of the module, which is the whole of a
     visit. A reading taken inside `checkAll` could not tell a visit apart from
     a press, because by then the press has happened. */
  midiAskedOnLoad = midiAsked;

  d.ready();
  runChecks();
</script>
