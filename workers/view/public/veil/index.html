<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* ── the picture ──────────────────────────────────────────────────────────
     ONE CANVAS HOLDING TWO PANES, never two canvases. The whole claim of this
     page is that the same instant comes out differently under two arithmetics,
     and two elements could disagree about which instant they were drawn at.
     One canvas, one draw call, one clock.

     ⚠️ A CANVAS IS A PICTURE AND NOBODY HAS EVER WANTED TO SELECT ONE. The
     long press on it raises the iOS loupe otherwise, and `user-select` alone
     does not stop that. `touch-action` is deliberately NOT set: this canvas is
     not dragged, and a page you scroll must not have its scroll eaten. */
  .veil { background: var(--card); border: 1px solid var(--line); border-radius: 4px;
          overflow: hidden; line-height: 0; }
  .veil canvas { display: block; width: 100%; height: auto;
                 user-select: none; -webkit-user-select: none;
                 -webkit-touch-callout: none; }
</style>
<script type="module">
  import { mount, guard } from '/shell/shell.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { createDiagram } from '/shell/diagram.mjs';
  import { ifSelfcheck } from '/shell/selfcheck.mjs';
  import { createDeck } from '/timeline/transport.mjs';

  /**
   * The score of Held in Human, already read. The same file `/held/` draws,
   * generated by `demo/resources/build-held-in-human.mjs` out of the score
   * Kristjan supplied. `/held/` draws the score's STRUCTURE on a line. This
   * page draws what one visit LOOKS like, which is a different question with a
   * different answer, and it decides nothing the file leaves open.
   *
   * 🔴 IT IS OURS AND IT IS LOCAL, SO READING IT COSTS NOBODY ANYTHING. That
   * is why the picture is built on a visit while everything that MOVES it sits
   * behind the self-check gate.
   */
  const SRC = '/resources/held-in-human.json';

  /** Every reach this page makes, counted, so the claim that it opens nothing
   *  outside this site is a number rather than a reading of the source. */
  let offSite = 0;
  const fetched = [];
  async function read(url) {
    const u = new URL(url, location.href);
    fetched.push(u.pathname);
    if (u.origin !== location.origin) offSite += 1;
    const r = await fetch(u);
    if (!r.ok) throw new Error(`${u.pathname} answered ${r.status}`);
    return r.json();
  }

  const d = mount({
    name: 'veil',
    // ONE SENTENCE, AND IT IS THE INDEX CARD'S OWN LINE. This page carries a
    // diagram, so a paragraph and a picture of the machinery would be two
    // explanations of one thing with the paragraph the weaker of them.
    what: 'Held in Human drawn flat, with the room dimmed and coloured on the '
      + 'score\'s own clock while the intro types itself.',
    /**
     * SIX CELLS, EVEN, AND EVERY ONE OF THEM MOVES.
     *
     * `contrast` and `lift` are the two the page exists for and they are the
     * only two that need saying: one is how far apart the lightest and the
     * darkest of the room are in the left picture, the other is how much
     * higher the darkest part of the room sits in the right one. Both are
     * written into the log at load, where a reader who wants them will look.
     * ⚠️ `lift` READS 0 IN EVERY NEUTRAL SCENE and that is the honest answer
     * rather than a cell that failed: where the score asks for no colour the
     * two pictures agree exactly, which is the negative control for the whole
     * comparison sitting in the readout itself.
     *
     * 🔴 THERE IS NO `scene` CELL AND THERE WAS ONE. The picker an inch below
     * carries the scene's name, and it is the control that CHANGES it, so a
     * cell repeating it was the same fact in two places with the weaker one on
     * top. `spoken` took its slot: the score's voice is the one thing this
     * picture genuinely cannot show, because the recordings are not in the
     * file, so the page counts the lines it cannot play.
     */
    readout: { room: '%', table: '', typed: '', spoken: '', contrast: '', lift: '' },
    // NO CONTROL ROW. What this page has to be worked with is a transport and
    // a way of getting to a scene, and both are components under the picture.
    controls: [],
  });
  guard(d);

  /* ── the two arithmetics, which are the whole page ───────────────────────
     🔴 A COLOUR LOOKUP TABLE IS THREE INDEPENDENT GAINS AND A WEB PAGE IN A
     HEADSET HAS ONE ALPHA.

     ⚠️ THE LIMIT IS THE WEB PAGE AND NOT THE HEADSET, AND GETTING THAT WRONG
     WOULD LIBEL THE PIECE. Held in Human is a Unity application and it really
     does put a colour table on the camera image, which is the whole point of
     its colour channel. What cannot do it is a page in a browser, in the same
     headset, because a passthrough session composites the page over the room
     with source over blending and the visitor sees

         out = c * a + room * (1 - a)

     so the real room only ever reaches the eye multiplied by `(1 - a)`, ONE
     SCALAR shared by red, green and blue. A page can dim the room and it can
     lay a colour over it. It cannot give the room's three channels three
     different gains, which is the smallest thing a lookup table does.

     ⚠️ ON A FLAT SCREEN BOTH ARE FREE, AND THAT IS WHY THE SECOND PICTURE IS
     HERE. A canvas grades as easily as it dims, so a page drawing this piece
     once would show the colour channel working perfectly and would say nothing
     at all about the one limit in the material. So the same instant is drawn
     twice, by the two arithmetics, and the difference is a thing a reader can
     look at rather than a claim they have to take.

     `screen`  out = clamp(room * gain) * opacity
     `headset` out = room * opacity + wash * (1 - opacity)

     The arithmetic is in `paint()` below and the checks read the PIXELS it
     draws rather than the table they came from. */
  const SCREEN = 'screen';
  const HEADSET = 'headset';

  /**
   * 🔴 THE FOUR TABLES ARE OUR READING OF FOUR WORDS. The score names
   * `neutral`, `green`, `blue` and `red` and carries no table, no curve, no
   * coefficient and no image, so every number below is this page's invention
   * and none of it is the piece's. There is an assert further down that reads
   * that absence off the file rather than leaving it as a sentence.
   *
   * `gain` is three multipliers on the room, which is a lookup table at its
   * very simplest. `wash` is the colour a page would lay over the room to try
   * to reach the same look with the one alpha a web page in a headset has.
   *
   * ⚠️ `neutral` IS THE IDENTITY, AND THAT IS A READING TOO. In colour work a
   * neutral table is usually the one that changes nothing, which is why it is
   * taken that way here, so a neutral scene is the room's own tones with only
   * the dimming on them. Its wash is black, because a scene that asks for no
   * colour asks a page to draw nothing over the room.
   */
  const TABLES = {
    neutral: { gain: [1.00, 1.00, 1.00], wash: [0.00, 0.00, 0.00] },
    green:   { gain: [0.55, 1.05, 0.62], wash: [0.08, 1.00, 0.28] },
    blue:    { gain: [0.58, 0.82, 1.15], wash: [0.10, 0.42, 1.00] },
    red:     { gain: [1.15, 0.64, 0.58], wash: [1.00, 0.22, 0.14] },
  };

  /* ── the room, which is a wedge and not a gallery ────────────────────────
     🔴 ELEVEN GREY STEPS, AND THE WEDGE IS REQUIRED BY THE ARGUMENT RATHER
     THAN CHOSEN FOR LOOKS. A gain and a lift are indistinguishable on a flat
     field: multiply one grey by 0.6, or multiply it by 0.15 and add 0.27, and
     both land on the same pixel. It takes a RANGE of tones to tell them apart,
     because a gain holds black at black while a lift pushes black up. The
     difference this page exists to show lives in the darkest two steps.

     ⚠️ AND THERE IS NO HONEST PICTURE OF THE GALLERY. The room is Mari
     Möldre's, the maze geometry is not in the score, and a drawn stand-in that
     looked like a room would be inventing a room design the file credits to
     somebody else. A wedge cannot be mistaken for one. */
  const STEPS = 11;
  /** The flat part of the room, which is where the type stands. White on a
   *  step wedge is unreadable at the bright end. */
  const WALL = 0.42;

  const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
  /** What a pixel of the room comes out as, under one arithmetic. */
  const through = (v, mode, opacity, tint) => [0, 1, 2].map((i) => (mode === SCREEN
    ? clamp01(v[i] * tint.gain[i]) * opacity
    : clamp01(v[i] * opacity + tint.wash[i] * (1 - opacity))));
  const css = (rgb) => `rgb(${rgb.map((c) => Math.round(clamp01(c) * 255)).join(',')})`;
  /** Rec. 709, which is what a display weights its three channels by. */
  const lum = (rgb) => 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];

  const clock = (ms) => {
    const s = Math.max(0, ms) / 1000;
    const m = Math.floor(s / 60);
    const r = s - m * 60;
    return `${m}:${r < 10 ? '0' : ''}${r.toFixed(1)}`;
  };
  const secs = (ms) => `${(ms / 1000).toFixed(1)} s`;

  // ── state the renderer reads ──────────────────────────────────────────────
  let MAZE_AT = 0;       // where the intro ends and the maze the score does not
  let KNOWN = 0;         // measure begins. The axis is the order with it taken out
  let data = null, deck = null, wrap = null, canvas = null, g2 = null;
  let placedScenes = [], roomSteps = [], tintSteps = [];
  let introText = '', outroText = '', outroAt = 0, introSpan = 0;
  /** What the last draw laid out, so a check can grade the picture a visitor
   *  is looking at rather than one of its own making. */
  let drawn = null;

  (async () => {
    data = await read(SRC);
    const sceneById = new Map(data.scenes.map((s) => [s.id, s]));
    MAZE_AT = sceneById.get('intro').durationMs;
    KNOWN = data.piece.knownMs;

    /**
     * Where a thing sits on this axis, or null when the axis cannot hold it.
     * Two origins, because one clock cannot hold both: the intro and the maze
     * are placed from the intro's first keystroke, everything after the maze
     * from the END of the maze. A `fromIntroMs` past the intro's own length is
     * inside the maze and has no place here at all.
     */
    const placedAt = (at) => {
      if (!at) return null;
      if (at.fromMazeEndMs != null) return MAZE_AT + at.fromMazeEndMs;
      if (at.fromIntroMs != null) return at.fromIntroMs > MAZE_AT ? null : at.fromIntroMs;
      return null;
    };

    placedScenes = data.scenes
      .map((s) => ({ s, at: placedAt(s.at) }))
      .filter((r) => r.at != null && r.s.durationMs != null)
      .map(({ s, at }) => ({ ...s, at, to: at + s.durationMs }));
    const sceneAtTime = (t) => placedScenes.find((s) => t >= s.at && t < s.to)
      || placedScenes[placedScenes.length - 1];

    // ── how much of the real room is left, as a step with a ramp into it ────
    const stepsOf = (points) => points
      .map((p) => ({ p, at: placedAt(sceneById.get(p.sceneId)?.at) }))
      .filter((r) => r.at != null && sceneById.get(r.p.sceneId).durationMs != null)
      .map(({ p, at }) => ({ at, from: p.from, value: p.value, fadeMs: p.fadeMs, p }))
      .sort((a, b) => a.at - b.at);
    roomSteps = stepsOf(data.channels.opacity.points);
    tintSteps = stepsOf(data.channels.lut.points);

    /** The curve the renderer draws, as a function, so a check grades the drawn
     *  thing rather than the table it came from. */
    const roomAt = (t) => {
      if (t <= roomSteps[0].at) return roomSteps[0].from;
      let i = 0;
      while (i + 1 < roomSteps.length && roomSteps[i + 1].at <= t) i++;
      const st = roomSteps[i], gone = t - st.at;
      if (st.fadeMs > 0 && gone < st.fadeMs) return st.from + (st.value - st.from) * (gone / st.fadeMs);
      return st.value;
    };

    /**
     * Which table is on the room, and what it is mixed with while it arrives.
     *
     * ⚠️ THE FADE IS DRAWN AS A CROSSFADE BETWEEN TWO TABLES, WHICH IS A
     * READING. The score gives each scene a transition time from the previous
     * table to this one and does not say what happens in between. A straight
     * blend of the two is the ordinary answer and it is the one taken here.
     *
     * 🔴 AND `name` IS THE TABLE THAT IS DOMINANT, NEVER THE ONE BEING FADED
     * TO. It was the destination, and the readout cell read `blue` at the first
     * instant of the river while both pictures were still plainly GREEN, which
     * is a cell contradicting the thing it sits above. The river's fade is ten
     * seconds long and the scene picker lands you exactly on its first frame,
     * so the one moment the cell was wrong was the moment it was most often
     * read. A single name cannot say that two tables are mixed, so it says
     * which one a reader is mostly looking at.
     */
    const tintAt = (t) => {
      let i = 0;
      if (t < tintSteps[0].at) i = 0;
      else while (i + 1 < tintSteps.length && tintSteps[i + 1].at <= t) i++;
      const st = tintSteps[i], gone = t - st.at;
      const to = TABLES[st.value], from = TABLES[st.from] || to;
      if (!(st.fadeMs > 0) || gone >= st.fadeMs) return { name: st.value, ...to };
      const k = gone / st.fadeMs;
      const mix = (a, b) => [0, 1, 2].map((j) => a[j] + (b[j] - a[j]) * k);
      return { name: k < 0.5 ? st.from : st.value,
               gain: mix(from.gain, to.gain), wash: mix(from.wash, to.wash) };
    };

    // ── the intro, which is a recording of somebody typing ──────────────────
    //
    // 🔴 THE KEY, NOT THE CHANGE, AND THAT IS WHY THE CORRECTION SURVIVES. Six
    // backspaces delete `houses` so `buildings` can be typed instead, after a
    // hesitation longer than the deletion itself. A score holding the finished
    // string could not carry it and this page would have nothing to replay.
    const keys = data.keystrokes.events;
    introSpan = data.keystrokes.stats.spanMs;
    const correction = data.keystrokes.correction;
    /** How many events have landed by `t`. The text is rebuilt only when this
     *  number changes, so a frame that types nothing costs nothing. */
    const typedBy = (t) => {
      let n = 0;
      while (n < keys.length && keys[n].at <= t) n++;
      return n;
    };
    let textCacheN = -1, textCache = '';
    const introAt = (t) => {
      const n = typedBy(t);
      if (n === textCacheN) return textCache;
      let s = '';
      for (let i = 0; i < n; i++) {
        const k = keys[i];
        if (k.kind === 'backspace') s = s.slice(0, -1);
        else if (k.kind === 'return') s += '\n';
        else s += k.char;
      }
      textCacheN = n; textCache = s;
      return s;
    };
    introText = introAt(introSpan);

    // ── the outro, which is one paragraph with the author's own line breaks ──
    outroText = String(data.texts.outro.text).replace(/<br\s*\/?>/gi, '\n')
      .replace(/<\/?size=?\d*>/gi, '');
    const outroEv = data.events.find((e) => e.id === 'outro:outro-text');
    outroAt = placedAt(outroEv.at);

    /* ── the voice, which is a count here and can never be more than one ─────
       🔴 THE SCORE CARRIES 24 LINES AS DURATIONS AND NOT ONE RECORDING. Eight
       of them are silence with a stated length, which is what makes the block
       work at all, and the rest are a voice that is simply not in the file. So
       the only honest thing this page can do with them is say how many have
       been reached, which is what the `spoken` cell does.
       ⚠️ THE SILENCES ARE NOT COUNTED. A silence is a line of the block and it
       is not a line anybody speaks, so counting it would make the cell read
       higher than the number of voices a visitor would have heard. */
    const voiceLines = data.qanda.lines
      .map((l) => ({ l, at: placedAt(l.at) }))
      .filter((r) => r.at != null && r.l.durationMs != null && !r.l.silence)
      .map(({ l, at }) => ({ ...l, at }));
    const spokenBy = (t) => voiceLines.filter((l) => l.at <= t).length;

    /**
     * WHAT IS ON SCREEN AT `t`, AND IT IS TWO SURFACES BECAUSE THE SCORE NAMES
     * TWO. The intro types itself and the outro paragraph appears 30 s into the
     * outro. Everything else the voice says is a VOICE, and captioning it would
     * invent a text surface the score does not have.
     * 🔴 THE RIVER IS DRAWN AS NOTHING, ON PURPOSE. Fifteen fragments of one to
     * seventy-nine words in a 120 s scene with no timing in the block at all.
     * Pacing them to fill the scene would be this page deciding the one thing
     * the score refuses to.
     */
    const textAt = (t) => {
      if (t <= introSpan) return { text: introAt(t), caret: true };
      if (t >= outroAt) return { text: outroText, caret: false };
      return { text: '', caret: false };
    };

    // ── the deck ────────────────────────────────────────────────────────────
    //
    // ⚠️ THE RANGE IS `piece.knownMs` AND NOT A SUM THIS PAGE INVENTS. The maze
    // has no length in the score, so the axis is the running order with it
    // taken out and nothing here may quietly give it a width.
    deck = createDeck({ items: [], adapters: {}, range: [0, KNOWN] });

    // ── the surface ─────────────────────────────────────────────────────────
    wrap = document.createElement('div');
    wrap.className = 'veil';
    canvas = document.createElement('canvas');
    wrap.append(canvas);
    g2 = canvas.getContext('2d');

    /* ── one pane, drawn ─────────────────────────────────────────────────────
       🔴 IT TAKES A CONTEXT RATHER THAN READING THE PAGE'S, SO THE CHECKS CAN
       GRADE THE DRAWING WITHOUT MOVING THE PICTURE. Everything below is
       gradable from data already in hand, and the way it stays that way is
       that a check paints the same function into an offscreen canvas at any
       instant it likes. A visitor's picture stands exactly where they left it.

       ⚠️ THE TYPE IS NOT GRADED AND NOT DIMMED, IN EITHER PANE. The score sets
       one white for the whole piece and the colour table is on the camera
       image, not on the page's own drawing. So both channels act on the room
       and the type stays white on top of it, which is what a page in a headset
       would also do and is the one place the two panes must agree. */
    const LABEL_H = 17;
    function paint(g, x, y, w, h, mode, opacity, tint, text, caret) {
      const top = y + LABEL_H;
      const inner = h - LABEL_H;
      const wallH = Math.round(inner * 0.66);
      const wedgeH = inner - wallH;

      g.fillStyle = css(through([WALL, WALL, WALL], mode, opacity, tint));
      g.fillRect(x, top, w, wallH);
      for (let i = 0; i < STEPS; i++) {
        const v = i / (STEPS - 1);
        const sx = x + Math.round((w * i) / STEPS);
        const sw = Math.round((w * (i + 1)) / STEPS) - Math.round((w * i) / STEPS);
        g.fillStyle = css(through([v, v, v], mode, opacity, tint));
        g.fillRect(sx, top + wallH, sw, wedgeH);
      }

      // the pane's own name, which never changes and so cannot reflow
      g.fillStyle = '#6a7280';
      g.font = '10px ui-monospace, Menlo, monospace';
      // ⚠️ `a web page in a headset`, NOT `a headset`. The piece itself is a
      // Unity application and really does grade the room; a page in a browser
      // in the same headset cannot, and the shorter label would put the limit
      // on the wrong thing.
      g.fillText(mode === SCREEN ? 'three gains, this page'
        : 'one alpha, a web page in a headset', x + 2, y + 11);

      if (!text) return { wallH, wedgeH, top, lines: 0 };

      // ⚠️ THE TYPE SHRINKS UNTIL THE WHOLE OF IT FITS. The outro is ten lines
      // set by the author and cutting the top of it would be a misquote, so the
      // face gives way instead and only stops at a floor.
      const pad = Math.max(8, Math.round(w * 0.035));
      const availW = w - pad * 2, availH = wallH - pad * 2;
      let size = Math.max(9, Math.min(17, Math.round(w / 40)));
      let lines = [];
      for (; size >= 8; size--) {
        g.font = `${size}px ui-monospace, Menlo, monospace`;
        lines = [];
        for (const para of text.split('\n')) {
          if (!para) { lines.push(''); continue; }
          let line = '';
          for (const word of para.split(' ')) {
            const next = line ? `${line} ${word}` : word;
            if (line && g.measureText(next).width > availW) { lines.push(line); line = word; }
            else line = next;
          }
          lines.push(line);
        }
        if (lines.length * Math.round(size * 1.5) <= availH) break;
      }
      const lh = Math.round(size * 1.5);
      const shown = lines.slice(Math.max(0, lines.length - Math.floor(availH / lh)));
      g.fillStyle = '#ffffff';
      let ty = top + pad + size;
      for (const line of shown) { g.fillText(line, x + pad, ty); ty += lh; }
      if (caret && shown.length) {
        const last = shown[shown.length - 1];
        g.fillRect(x + pad + g.measureText(last).width + 2, ty - lh - size + 2, 2, size);
      }
      return { wallH, wedgeH, top, lines: shown.length, size };
    }

    /** Where the two panes stand, at a width. One place, so a check asking
     *  where a pane is cannot disagree with the renderer. */
    const GAP = 10;
    function layout(w) {
      if (w >= 560) {
        const pw = Math.floor((w - GAP) / 2);
        const ph = Math.round(Math.min(330, Math.max(190, pw * 0.62))) + LABEL_H;
        return { h: ph, panes: [{ x: 0, y: 0, w: pw, h: ph }, { x: pw + GAP, y: 0, w: w - pw - GAP, h: ph }] };
      }
      const ph = Math.round(Math.min(260, Math.max(150, w * 0.46))) + LABEL_H;
      return { h: ph * 2 + GAP, panes: [{ x: 0, y: 0, w, h: ph }, { x: 0, y: ph + GAP, w, h: ph }] };
    }

    let W = 0, dpr = 1, lastKey = '';
    function size() {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      W = Math.max(240, Math.round(wrap.getBoundingClientRect().width));
      const L = layout(W);
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(L.h * dpr);
      canvas.style.width = `${W}px`;
      canvas.style.height = `${L.h}px`;
      lastKey = '';
      return L;
    }

    function draw() {
      const L = layout(W);
      const t = deck.position();
      const opacity = roomAt(t);
      const tint = tintAt(t);
      const { text, caret } = textAt(t);
      g2.setTransform(dpr, 0, 0, dpr, 0, 0);
      g2.clearRect(0, 0, W, L.h);
      g2.textBaseline = 'alphabetic';
      const a = paint(g2, L.panes[0].x, L.panes[0].y, L.panes[0].w, L.panes[0].h,
        SCREEN, opacity, tint, text, caret);
      const b = paint(g2, L.panes[1].x, L.panes[1].y, L.panes[1].w, L.panes[1].h,
        HEADSET, opacity, tint, text, caret);
      drawn = { t, opacity, tint, text, panes: L.panes, geom: [a, b], h: L.h };
      return drawn;
    }

    /* ── what the readout says, written only when it changes ─────────────────
       ⚠️ A CELL WRITTEN SIXTY TIMES A SECOND IS A CELL NOBODY CAN READ, and a
       page that redrew its whole readout on a standing playhead would be
       repainting a picture nobody had moved. Everything below is derived from
       the same two functions the renderer uses, so the cells and the picture
       cannot come apart. */
    let saidScene = null, saidCells = '';
    function report(t, opacity, tint) {
      const sc = sceneAtTime(t);
      const dark = [0, 0, 0], bright = [1, 1, 1];
      const contrast = lum(through(bright, SCREEN, opacity, tint))
        - lum(through(dark, SCREEN, opacity, tint));
      const lift = lum(through(dark, HEADSET, opacity, tint))
        - lum(through(dark, SCREEN, opacity, tint));
      const typed = t <= introSpan ? textAt(t).text.length : introText.length;
      const spoken = spokenBy(t);
      const key = [sc.id, Math.round(opacity * 100), tint.name, typed, spoken,
        contrast.toFixed(2), lift.toFixed(2)].join('|');
      if (key === saidCells) return { contrast, lift };
      saidCells = key;
      d.set('room', Math.round(opacity * 100));
      d.set('table', tint.name);
      d.set('typed', typed);
      d.set('spoken', spoken);
      d.set('contrast', contrast.toFixed(2));
      d.set('lift', lift.toFixed(2));
      if (sc.id !== saidScene) { saidScene = sc.id; pick.show(sc.name, placedScenes.indexOf(sc)); }
      return { contrast, lift };
    }

    // ── the controls, both of them from the kit ─────────────────────────────
    //
    // 🔴 `loop: false`. The piece's own loop, the outro returning to the
    // transition, is one of the nine things the score does not settle and is
    // carried as `loopsHow: inferred`. A LOOP button on this bar would assert
    // it, which is the one thing this page may not do.
    const bar = createTransportBar(d.el, deck, { loop: false });

    /* 🔴 SIX SCENES AND NOT SEVEN. The maze is not among them because it has no
       place on this clock, which is the same refusal the axis itself makes.
       A picker rather than a row of buttons: seven names is a list, and the
       kit's picker is what this project already uses for a list. */
    const pick = createPicker({
      label: 'SCENE', what: 'scene',
      prev: () => goScene(-1), next: () => goScene(1),
      onPick: (i) => { deck.seek(placedScenes[i].at); lastKey = ''; },
    });
    function goScene(step) {
      const now = sceneAtTime(deck.position());
      const i = placedScenes.indexOf(now);
      const to = placedScenes[Math.max(0, Math.min(placedScenes.length - 1, i + step))];
      deck.seek(to.at);
      lastKey = '';
    }
    pick.options(placedScenes.map((s) => s.name), 0);

    d.stack.add(pick.el, wrap, bar.el);
    size();
    new ResizeObserver(() => { size(); draw(); }).observe(wrap);

    /* THE PICTURE REDRAWS WHEN SOMETHING MOVED, AND NEVER OTHERWISE. A raf
       loop that repainted a standing playhead would burn a phone's battery to
       draw the same two rectangles. The key is the instant and the width. */
    (function follow() {
      const t = deck.position();
      const key = `${Math.round(t)}|${W}`;
      if (key !== lastKey) {
        lastKey = key;
        const shot = draw();
        report(shot.t, shot.opacity, shot.tint);
      }
      requestAnimationFrame(follow);
    })();
    draw();
    report(deck.position(), roomAt(deck.position()), tintAt(deck.position()));

    // ── whose words these are, and what this picture is not ─────────────────
    //
    // 🔴 SAYING WHO WROTE SOMETHING A PAGE IS RENDERING IS NOT A CREDIT, IT IS
    // THE CAPTION. This page types Ene Mihkelson's text out keystroke by
    // keystroke and sets her outro paragraph, so it names her and her
    // translator before it says anything else. The rest of the credits are in
    // the score file, which is where somebody asking who made this goes.
    const cr = data.texts.credits.groups;
    const roleOf = (h) => (cr.find((gp) => gp.heading === h)?.entries || [])
      .map((e) => e.replace(/,\s*$/, '')).join(', ');
    d.log(`the text that types itself here is ${roleOf('Intro and Outro texts')}, `
      + `translated from Estonian by ${roleOf('Translation from Estonian')}`);
    d.log('the room behind the type is eleven grey steps rather than a picture of the gallery. '
      + 'A gain and a lift look identical on one flat tone, so it takes a range of tones to '
      + 'tell them apart, and that difference is what the two pictures are for.');
    d.log(`the score names ${data.channels.lut.values.length} colour tables and defines none of `
      + 'them, so the three numbers each one is given here are ours and not the piece\'s. '
      + 'Neutral is taken to be the table that changes nothing, which is a reading as well.');
    d.log('the left picture gives the room three separate gains, which is what a colour table is, '
      + 'and a flat screen can do that as easily as it dims. The right one is held to the single '
      + 'alpha a web page in a headset has, so it can only dim the room and lay a colour over it, '
      + 'and that colour is spent out of the same alpha the dimming already needs.');
    d.log('the piece itself is a Unity application and really does put a colour table on the room, '
      + 'so the right picture is a limit of the web rather than a limit of the work.');
    d.log(`the maze has no length in the score, so this clock is the running order with it taken `
      + `out, ${data.piece.knownClock} from the first keystroke to the end of the outro. Nothing `
      + 'here gives it a width and it is not one of the scenes the picker offers.');
    d.log(`the river is ${data.counts.riverFragments} fragments of one to seventy-nine words in `
      + `${secs(sceneById.get('river').durationMs)} with no timing in the block at all, so its two `
      + 'minutes are drawn as the room alone.');
    d.log(`one voice reads ${data.counts.qandaLines} lines over this, ${data.counts.qandaSilences} of `
      + 'them silence with a stated length, and the recordings are not in the score. So the spoken '
      + 'cell counts the lines this page cannot play.');
    d.log('contrast is how far apart the lightest and the darkest of the room are in the left '
      + 'picture. Lift is how much higher the darkest part of the room sits in the right one, and '
      + 'it reads zero wherever the score asks for no colour.');

    /* ── the picture of the machinery ────────────────────────────────────────
       FIVE BOXES AND SIX ARROWS, IN THREE COLUMNS: the file, the three things
       read out of it, and the canvas they arrive on. No containers, because
       nothing here is a machine holding other machines: one file, one page,
       and the two arithmetics in between it.
       ⚠️ THE ARROWS CARRY WHAT TRAVELS rather than naming a step. What leaves
       the score is a stream of delays, a pair of channel values and the same
       pair a second time; what arrives at the canvas is letters and pixels.
       🔴 AND THE ONE ALPHA BOX SAYS WHOSE LIMIT IT IS. Held in Human is a Unity
       application and really does put a colour table on the room, so a picture
       implying otherwise would move a limit of the web onto the work. */
    const dg = createDiagram(d.el, {
      caption: 'Two pictures of one instant, and the only thing that differs between them is the '
        + 'arithmetic between the file and the canvas.',
      nodes: [
        { id: 'score', label: 'score', sub: '667 lines', tech: 'file',
          note: 'Name and value pairs in a flat text file, carrying every scene length, both '
            + 'channel values and both fade times. Five smaller formats sit inside it and one of '
            + 'them is the intro.' },
        { id: 'keys', label: 'keystrokes', sub: '318 events', tech: 'file',
          note: 'A delay in milliseconds and a character code on every line, replayed by adding '
            + 'the delays up. Code 13 is Return and 127 is Backspace, so the six presses that '
            + 'take a wrong word away are in the recording.' },
        { id: 'gains', label: 'three gains', sub: 'left picture', tech: 'graphics',
          note: 'A colour lookup table is three independent transfer functions at minimum, so this '
            + 'picture multiplies the room\'s red, green and blue separately. A canvas does that as '
            + 'easily as it dims.' },
        { id: 'alpha', label: 'one alpha', sub: 'right picture', tech: 'meta',
          note: 'A passthrough session composites a page over the room with one alpha shared by all '
            + 'three colours. Held in Human is Unity and really grades the room, which a web page '
            + 'in the same headset cannot.' },
        { id: 'browser', label: 'Browser', sub: 'one canvas', tech: 'browser',
          note: 'One canvas holding both pictures, redrawn only when the playhead or the width has '
            + 'moved. The type stays white in both, because a table acts on the room and not on '
            + 'what a page draws.' },
      ],
      links: [
        { from: 'score', to: 'keys', label: 'delays',
          note: 'Read once at start up, 318 of them. Adding them up gives the absolute time of '
            + 'every press, and the track comes to exactly the length of the intro scene.' },
        { from: 'score', to: 'gains', label: 'values',
          note: 'A named table and a fade time per scene, with a room level and a fade time beside '
            + 'them. The four table names are all the score gives, so the three numbers behind each '
            + 'one are this page\'s reading.' },
        { from: 'score', to: 'alpha', label: 'values',
          note: 'The same eight tables and the same eight room levels, read a second time. Nothing '
            + 'changes but the arithmetic they are put through, which is what makes the two '
            + 'pictures comparable.' },
        { from: 'keys', to: 'browser', label: 'letters',
          note: 'The text as it stood at the playhead, wrapped against the pane and set in white. '
            + 'Six backspaces take a word away again, after a pause longer than the deletion.' },
        { from: 'gains', to: 'browser', label: 'pixels',
          note: 'Eleven grey steps and a flat band, each multiplied per colour and then dimmed. '
            + 'Black stays black, which is what tells a grade from a wash.' },
        { from: 'alpha', to: 'browser', label: 'pixels',
          note: 'The same steps dimmed and then lifted by a colour laid over them. In the cylinder '
            + 'the room is at fifteen per cent, so green arrives above 0.85 everywhere including '
            + 'the black step.' },
      ],
    }, { how: true, atEnd: true });

    // ── checks ──────────────────────────────────────────────────────────────
    //
    // Everything here is gradable from data already in hand and from geometry
    // this page has drawn, so it runs for everybody and costs a visitor
    // nothing. The two that MOVE something are behind the gate at the foot.
    const A = (label, pass, detail) => d.assert(label, pass, detail);

    /* 🔴 THE PIXELS ARE PAINTED OFF SCREEN, WHICH IS WHAT KEEPS THESE CHECKS
       OUT OF THE GATE. `paint()` takes a context, so a check can draw any
       instant it likes into a canvas nobody is looking at and read it back.
       A check that seeked the playhead to do the same thing would be moving
       the picture in front of a visitor, and it would be grading the same
       function through a longer path. */
    const shot = (mode, t, text = '') => {
      const c = document.createElement('canvas');
      c.width = 240; c.height = 160;
      const g = c.getContext('2d', { willReadFrequently: true });
      const geom = paint(g, 0, 0, 240, 160, mode, roomAt(t), tintAt(t), text, false);
      const px = (x, y) => { const p = g.getImageData(x, y, 1, 1).data; return [p[0] / 255, p[1] / 255, p[2] / 255]; };
      const stepY = geom.top + geom.wallH + Math.floor(geom.wedgeH / 2);
      return {
        wall: px(120, geom.top + Math.floor(geom.wallH / 2)),
        step: (i) => px(Math.round((240 * (i + 0.5)) / STEPS), stepY),
        /** the whole flat band in one read, for a check that has to find the
         *  brightest thing in it rather than sample a known point */
        band: () => g.getImageData(0, geom.top + 2, 240, Math.max(1, geom.wallH - 4)).data,
        px, geom,
      };
    };

    const introMid = 60000;
    const cyl = placedScenes.find((s) => s.id === 'cylinder');
    const cylAt = cyl.at + 95000;     // where the room is at 15% and the table is green

    // 1. the maze, which is the reason this clock is the length it is
    const absent = data.scenes.filter((s) => s.durationHow === 'absent');
    A('the maze is the one scene the score gives no length',
      absent.length === 1 && absent[0].id === 'maze' && absent[0].durationMs === null,
      absent.map((s) => `${s.id} ${s.durationHow}`).join(', ') || 'none');
    A('so the axis is the running order with it taken out, and nothing inserts a width at the seam',
      deck.range[1] - deck.range[0] === KNOWN
      && KNOWN === placedScenes.reduce((acc, s) => acc + s.durationMs, 0)
      && placedScenes.every((s, i) => (i === 0 ? s.at === 0 : s.at === placedScenes[i - 1].to))
      && placedScenes[placedScenes.length - 1].to === KNOWN,
      `${placedScenes.length} scenes running without a gap to ${clock(KNOWN)}`);
    A('and the picker offers the six with a place and not the maze',
      pick.select.options.length === 6
      && ![...pick.select.options].some((o) => o.textContent === 'maze'),
      [...pick.select.options].map((o) => o.textContent).join(', '));

    // 2. the four tables are ours, and the score has nothing to disagree with
    const lutPoints = data.channels.lut.points;
    A('the score names four colour tables and carries no definition of any of them',
      data.channels.lut.values.length === 4
      && lutPoints.every((p) => typeof p.value === 'string' && TABLES[p.value])
      && !('table' in data.channels.lut) && !('luts' in data.channels.lut)
      && lutPoints.every((p) => !('rgb' in p) && !('curve' in p)),
      `${data.channels.lut.values.join(', ')}, and nothing but names`);
    A('neutral is read as the table that changes nothing, so a neutral scene is the room dimmed',
      TABLES.neutral.gain.every((x) => x === 1) && TABLES.neutral.wash.every((x) => x === 0),
      `gain ${TABLES.neutral.gain.join(', ')}, wash ${TABLES.neutral.wash.join(', ')}`);
    {
      // Read off the picture rather than off the table above: at 60 s the intro
      // holds neutral at 0.60, so every step should be its own value dimmed and
      // the three channels should still be equal.
      const s = shot(SCREEN, introMid);
      const grey = [0, 3, 6, 10].map((i) => s.step(i));
      const off = Math.max(...grey.map((c) => Math.max(Math.abs(c[0] - c[1]), Math.abs(c[1] - c[2]))));
      const top = s.step(STEPS - 1);
      A('under neutral the room keeps its own greys, dimmed to what the score asks for',
        off < 0.02 && Math.abs(lum(top) - roomAt(introMid)) < 0.03,
        `channels within ${off.toFixed(3)} of each other, brightest step at `
        + `${lum(top).toFixed(2)} against ${roomAt(introMid).toFixed(2)}`);
    }

    // 3. THE HEADLINE. One alpha cannot do what three gains do.
    {
      const scr = shot(SCREEN, cylAt), hs = shot(HEADSET, cylAt);
      const sDark = scr.step(0), hDark = hs.step(0);
      const tint = tintAt(cylAt), op = roomAt(cylAt);
      A('a colour table is three gains, so under green the room\'s three channels come apart',
        tint.name === 'green' && Math.round(op * 100) === 15
        && (() => { const m = scr.step(STEPS - 1); return m[1] - m[0] > 0.03 && m[1] - m[2] > 0.02; })(),
        `the brightest step reads ${scr.step(STEPS - 1).map((c) => c.toFixed(2)).join(', ')} at `
        + `${Math.round(op * 100)}% of the room`);
      A('and one alpha cannot, so the one alpha picture pins green above 0.85 even where the room is black',
        hDark[1] > 0.85 && sDark[1] < 0.05,
        `darkest step: screen ${sDark.map((c) => c.toFixed(2)).join(', ')}, `
        + `headset ${hDark.map((c) => c.toFixed(2)).join(', ')}`);
      /* 🔴 THE NEGATIVE CONTROL, AND WITHOUT IT THE CHECK ABOVE PASSES ON ANY
         DIFFERENCE AT ALL. Under a neutral table the score asks for no colour,
         the page lays nothing over the room, and the two arithmetics agree to
         the pixel. A comparison that found the panes different everywhere would
         be reporting its own two code paths rather than the limit. */
      const nScr = shot(SCREEN, introMid), nHs = shot(HEADSET, introMid);
      let worst = 0;
      for (let i = 0; i < STEPS; i++) {
        const a2 = nScr.step(i), b2 = nHs.step(i);
        worst = Math.max(worst, ...[0, 1, 2].map((j) => Math.abs(a2[j] - b2[j])));
      }
      A('and where the score asks for no colour the two pictures agree to the pixel',
        worst < 0.01, `worst channel apart by ${worst.toFixed(4)} across ${STEPS} steps`);
    }

    // 4. the type is the page's own white in both, because the table is on the
    //    room and not on what the page draws
    {
      const line = 'When the piles for the';
      const a2 = shot(SCREEN, cylAt, line), b2 = shot(HEADSET, cylAt, line);
      // ONE READ OF THE WHOLE WALL, not a read per pixel. `getImageData` called
      // three thousand times is three thousand round trips into the compositor,
      // and this check would take longer than the page it is grading.
      const find = (s) => {
        const band = s.band();
        let best = [0, 0, 0];
        for (let i = 0; i < band.length; i += 4) {
          const p = [band[i] / 255, band[i + 1] / 255, band[i + 2] / 255];
          if (lum(p) > lum(best)) best = p;
        }
        return best;
      };
      const wa = find(a2), wb = find(b2);
      A('the type is the same white in both pictures, because a colour table is on the room and not on the page',
        wa.every((c) => c > 0.92) && wb.every((c) => c > 0.92),
        `screen ${wa.map((c) => c.toFixed(2)).join(', ')}, headset ${wb.map((c) => c.toFixed(2)).join(', ')}`);
    }

    // 5. the intro, which is a recording rather than a string
    A('the keystroke track is exactly as long as the intro, and every mark is inside it',
      introSpan === sceneById.get('intro').durationMs && keys.every((k) => k.at >= 0 && k.at <= MAZE_AT),
      `${keys.length} keys over ${clock(introSpan)}`);
    A('the change of mind is in the picture: houses at 39.8 s, buildings at 46.4 s',
      introAt(correction.lastWrongLetterAtMs).endsWith('houses')
      && introAt(correction.lastRightLetterAtMs).endsWith('buildings'),
      `${JSON.stringify(introAt(correction.lastWrongLetterAtMs).slice(-28))} then `
      + `${JSON.stringify(introAt(correction.lastRightLetterAtMs).slice(-28))}`);
    A('and the hesitation before it is longer than the deletion it leads to',
      correction.hesitationMs > correction.lastBackspaceAtMs - correction.firstBackspaceAtMs
      && correction.backspaces === 6,
      `${correction.hesitationMs} ms of nothing, then ${correction.backspaces} backspaces in `
      + `${correction.lastBackspaceAtMs - correction.firstBackspaceAtMs} ms`);
    A('the whole track leaves the characters on screen that the score says it does',
      introText.length === data.keystrokes.stats.charactersOnScreen
      && introText === data.keystrokes.text,
      `${introText.length} characters, ${data.keystrokes.stats.returns} line breaks`);

    // 6. the two text surfaces the score names, and nothing else
    A('the outro paragraph appears 30 s into the outro and not before, with the author\'s own breaks',
      textAt(outroAt - 1).text === '' && textAt(outroAt).text === outroText
      && outroText.split('\n').length === data.texts.outro.breaks + 1,
      `at ${clock(outroAt)}, ${data.texts.outro.breaks + 1} lines`);
    A('the voice is counted and never played, because the score carries its lines as durations only',
      voiceLines.length === 15 && spokenBy(0) === 0 && spokenBy(KNOWN) === voiceLines.length
      && data.counts.qandaSilences === 8
      && !data.qanda.lines.some((l) => 'audio' in l || 'file' in l),
      `${voiceLines.length} spoken lines placed, ${data.counts.qandaSilences} silences not counted `
      + 'among them, and no recording anywhere in the file');
    A('and the river is drawn as the room alone, because the score gives its fragments no timing',
      data.texts.river.fragments.every((f) => f.durationMs === null)
      && textAt(placedScenes.find((s) => s.id === 'river').at + 60000).text === '',
      `${data.counts.riverFragments} fragments, none of them timed`);

    // 7. the channels, graded against the curve this page actually draws
    {
      let worstRate = 0, worstAt = '';
      for (const st of roomSteps) {
        const rate = (roomAt(st.at + st.fadeMs) - roomAt(st.at)) / (st.fadeMs / 1000);
        const off = Math.abs(Number(rate.toFixed(4)) - st.p.ratePerSecond);
        if (off > worstRate) { worstRate = off; worstAt = st.p.sceneName; }
      }
      A('every ramp in the room is drawn at the rate the score works out to',
        roomSteps.length === 6 && worstRate < 1e-4,
        worstRate ? `worst ${worstRate.toFixed(5)} a second, on the ${worstAt}` : 'all six exact');
      const breaks = lutPoints.filter((p) => p.followsRecommendation === false);
      A('two colour fades break the score\'s own recommendation and this page draws them as written',
        breaks.length === 2 && breaks[0].sceneId === 'dialogue' && breaks[1].sceneId === 'cylinder'
        && tintAt(placedScenes.find((s) => s.id === 'dialogue').at).name === 'green',
        breaks.map((p) => `${p.sceneName} ${p.fadeMs} ms`).join(', '));
      /* 🔴 THE CHECK THE READOUT NEEDED AND DID NOT HAVE. The cell read `blue`
         at the river's first frame while both pictures were still green, and
         nothing on the page could tell: every other check here reads pixels,
         and pixels were right. This one compares the NAME against the picture,
         which are two different sources, so they are able to disagree. */
      const river = placedScenes.find((s) => s.id === 'river');
      const riverFade = tintSteps.find((s) => s.p.sceneId === 'river').fadeMs;
      const first = shot(SCREEN, river.at).step(STEPS - 1);
      A('a table still fading is named by what is on the room and not by where it is going',
        riverFade === 10000 && tintAt(river.at).name === 'green'
        && tintAt(river.at + riverFade).name === 'blue' && first[1] > first[2],
        `at the river's first frame the cell reads ${tintAt(river.at).name} and the brightest step `
        + `reads ${first.map((c) => c.toFixed(2)).join(', ')}, which is ${secs(riverFade)} from blue`);
    }

    // 8. the picture a visitor is actually looking at
    A('both pictures were laid out and neither of them is empty',
      !!drawn && drawn.panes.length === 2 && drawn.panes.every((p) => p.w > 80 && p.h > 100)
      && drawn.geom.every((gm) => gm.wedgeH > 10),
      drawn ? `${drawn.panes.map((p) => `${p.w}x${p.h}`).join(' and ')}, `
        + `wedge ${drawn.geom[0].wedgeH} px` : 'nothing was drawn');
    A('nine of the score\'s questions are left open and this page settles none of them',
      data.ambiguities.length === 9 && data.ambiguities.every((x) => x.settled === false)
      && data.order.loopsHow === 'inferred' && !bar.el.querySelector('.tbar-loop'),
      `${data.ambiguities.length} open, and no loop control on a bar whose loop is inferred`);

    // 9. the picture of the machinery, which grades itself
    A('the diagram drew every name, every number and every arrow whole', dg.cuts.length === 0,
      dg.cuts.map((c) => `${c.where} ${c.id}`).join(', ') || 'nothing cut, nothing refused');
    A('and no line in it is missing its arrowhead', dg.ties === 0,
      `${dg.ties} line${dg.ties === 1 ? '' : 's'} with no head`);

    // 10. nothing here reaches outside this site
    A('a visit reads one file, and it is ours',
      offSite === 0 && fetched.length === 1 && fetched[0] === SRC,
      `${fetched.join(', ')}, ${offSite} off this site`);

    /**
     * ⚠️ BEHIND THE GATE, BECAUSE BOTH OF THESE MOVE SOMETHING A PERSON WOULD
     * SEE: one presses the scene picker, one seeks the playhead. A visitor gets
     * the picture standing still where they left it and the log says what was
     * not run.
     */
    ifSelfcheck(() => {
      const before = deck.position();
      pick.buttons[1].click();
      const after = deck.position();
      A('pressing the scene picker lands the playhead on the next scene\'s first moment',
        after === placedScenes[1].at && before === 0,
        `${clock(before)} to ${clock(after)}, which is the ${placedScenes[1].name}`);

      /* 🔴 THE VISIBLE PICTURE IS THE ONE THE CHECKS GRADED, AND THIS IS THE
         ONLY CHECK THAT CAN SAY SO. Everything above paints into a canvas
         nobody is looking at, which is what keeps it out of this gate; if the
         page on screen were drawn by some other path, all of it would be green
         about the wrong thing. */
      deck.seek(cylAt);
      lastKey = '';
      const live = draw();
      const p = drawn.panes[1];
      const gm = drawn.geom[1];
      const y = Math.round((p.y + gm.top + gm.wallH + gm.wedgeH / 2) * dpr);
      const x = Math.round((p.x + p.w * 0.04) * dpr);
      const px = g2.getImageData(x, y, 1, 1).data;
      A('and the picture on the page is the one those checks were painting',
        live.tint.name === 'green' && px[1] / 255 > 0.85 && px[0] / 255 < 0.6,
        `the headset pane's darkest step reads ${[...px].slice(0, 3).map((c) => (c / 255).toFixed(2)).join(', ')}`);
      deck.seek(0);
      lastKey = '';
      draw();
      report(0, roomAt(0), tintAt(0));
    }, { log: d.log,
         say: 'two checks are not run for a visitor, because each of them moves the picture: '
            + 'the scene picker and the playhead' });

    d.ready();
  })().catch((e) => d.fail(e));
</script>
</html>
