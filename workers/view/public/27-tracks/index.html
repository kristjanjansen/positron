<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  video { width: 100%; max-width: 420px; display: block; background: #000;
          border: 1px solid var(--line); border-radius: 3px; margin: 0 0 10px; }
  table { width: 100%; border-collapse: collapse; font: 500 11px/1.5 var(--mono); margin: 0 0 10px; }
  th, td { text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--line); color: var(--fg); }
  th { color: var(--dim2); font-weight: 600; text-transform: uppercase; letter-spacing: .1em; font-size: 9.5px; }
  td:first-child, th:first-child { text-align: left; color: var(--hi); }
  td.dim { color: var(--dim2); }
  .note { font: 400 11.5px/1.6 var(--mono); color: var(--dim); margin: 0 0 10px; }
</style>
<script src="/proto/remixer/hls.min.js"></script>

<script type="module">
  import { mount, guard, el, armVideo, playOrPrompt } from '/shell/shell.mjs';
  import { llhls, whep, holdPublisher, waitForManifest, waitForWhip } from '/shell/live.mjs';

  // THE QUESTION: is audio-only actually lower LATENCY, or is it only smaller?
  //
  // The two transports answer differently, and the reason is in the packaging.
  //
  // LL-HLS on Cloudflare Stream: the audio rendition and every video rendition
  // carry IDENTICAL low-latency parameters — PART-TARGET 0.5, PART-HOLD-BACK
  // 1.5, TARGETDURATION 3 — and, the giveaway, only `part_0` of each segment is
  // INDEPENDENT on the AUDIO rendition too. Every AAC frame is independently
  // decodable by nature; the packager applies the video keyframe cadence to
  // audio anyway. So the client's "where may I start, how far back must I hold"
  // constraint does not change when you drop the picture. That part of this page
  // is asserted from the playlists themselves, not from a stopwatch: it is a
  // property of the packaging and does not need a network to be true.
  //
  // WHEP has no manifest, no parts and no hold-back, so nothing structural
  // forces the two to agree — an audio jitter buffer is NetEq's adaptive target,
  // a video one waits for whole frames. That difference is measured here per
  // track from `jitterBufferDelay / jitterBufferEmittedCount`.
  //
  // Bandwidth is reported beside latency on purpose. "More performant" splits
  // into two columns the moment you measure them separately, and for LL-HLS the
  // honest answer is that only one of the columns moves.

  const MODES = [
    { id: 'va', label: 'Video + audio', video: true, audio: true },
    { id: 'a', label: 'Audio only', video: false, audio: true },
    { id: 'v', label: 'Video only', video: true, audio: false },
  ];
  const WINDOW_MS = 10000;       // per mode, per transport — both run together

  const d = mount({
    n: '27',
    name: 'tracks',
    what: 'The same live input as video, audio, or both — on LL-HLS and WHEP. What drops: the bytes or the latency?',
    readout: { mode: '', hls: 's', whep: 'ms', abuf: 'ms', vbuf: 'ms', ratio: '×' },
    controls: [
      { id: 'all', label: 'Run all three', primary: true },
      { id: 'va', label: 'Video + audio' },
      { id: 'a', label: 'Audio only' },
      { id: 'v', label: 'Video only' },
      { id: 'check', label: 'Run the checks' },
    ],
  });
  guard(d);

  const video = el('video', '', null, { playsinline: '', muted: '', autoplay: '' });
  video.muted = true;
  d.el.append(video);

  const table = el('table');
  d.el.append(table);
  d.el.append(el('p', 'note',
    'part-target and part-hold-back are read from the playlists themselves — no network timing involved'));

  /** mode id -> what both transports reported for it */
  const runs = new Map();
  let parts = null;              // the packaging comparison, read once
  let busy = false, held = false;

  function paint() {
    table.replaceChildren();
    const head = el('tr');
    for (const h of ['mode', 'hls lat', 'hls kbps', 'whep rtt', 'audio buf', 'video buf', 'whep kbps']) {
      head.append(el('th', '', h));
    }
    table.append(head);
    for (const m of MODES) {
      const r = runs.get(m.id);
      const tr = el('tr');
      tr.append(el('td', '', m.label));
      const cells = r ? [
        r.hls.latency == null ? '—' : r.hls.latency.toFixed(2),
        r.hls.kbps == null ? '—' : String(Math.round(r.hls.kbps)),
        r.whep.rtt == null ? '—' : String(Math.round(r.whep.rtt)),
        r.whep.audioBufMs == null ? '—' : String(Math.round(r.whep.audioBufMs)),
        r.whep.videoBufMs == null ? '—' : String(Math.round(r.whep.videoBufMs)),
        r.whep.kbps == null ? '—' : String(Math.round(r.whep.kbps)),
      ] : ['—', '—', '—', '—', '—', '—'];
      for (const c of cells) tr.append(el('td', c === '—' ? 'dim' : '', c));
      table.append(tr);
    }
  }
  paint();

  // ── which URL is which mode ──────────────────────────────────────────────
  // Cloudflare advertises NO audio-only VARIANT, but the audio rendition's own
  // media playlist is right there in the master under EXT-X-MEDIA. Loading a
  // media playlist directly is how each mode gets exactly the tracks it asked
  // for: the master for both, the audio rendition for audio, one video variant
  // for video (a variant playlist carries no audio — the audio only ever comes
  // from the group the MASTER attaches).
  async function sources() {
    const master = await (await fetch(llhls(), { cache: 'no-store' })).text();
    const audio = master.match(/#EXT-X-MEDIA:TYPE=AUDIO[^\n]*URI="([^"]+)"/)?.[1];
    const lines = master.split(/\r?\n/);
    const vi = lines.findIndex((l) => l.startsWith('#EXT-X-STREAM-INF'));
    const videoUri = vi >= 0 ? lines[vi + 1]?.trim() : null;
    return {
      va: llhls(),
      a: audio ? new URL(audio, llhls()).href : null,
      v: videoUri ? new URL(videoUri, llhls()).href : null,
    };
  }

  /** PART-TARGET / PART-HOLD-BACK / INDEPENDENT cadence, per rendition. */
  async function packaging(src) {
    const pl = await (await fetch(src, { cache: 'no-store' })).text();
    const partTarget = Number(pl.match(/#EXT-X-PART-INF:PART-TARGET=([\d.]+)/)?.[1] ?? NaN);
    const holdBack = Number(pl.match(/PART-HOLD-BACK=([\d.]+)/)?.[1] ?? NaN);
    const partLines = pl.split(/\r?\n/).filter((l) => l.startsWith('#EXT-X-PART:'));
    const independent = partLines.filter((l) => /INDEPENDENT=YES/.test(l)).length;
    return { partTarget, holdBack, parts: partLines.length, independent };
  }

  // ── one mode, both transports, at the same time ──────────────────────────
  async function runMode(mode) {
    if (busy) { d.log(`busy — ${mode.label} skipped`, 'bad'); return null; }
    busy = true;
    d.set('mode', mode.label);
    const src = (await sources())[mode.id];
    const rec = { hls: { latency: null, kbps: null, src }, whep: { rtt: null, kbps: null, audioBufMs: null, videoBufMs: null } };
    let hls = null, pc = null;
    try {
      // ── LL-HLS leg ──
      if (src && window.Hls?.isSupported()) {
        hls = new window.Hls({ lowLatencyMode: true, liveSyncDuration: 3, enableWorker: true });
        let bytes = 0;
        hls.on(window.Hls.Events.FRAG_LOADED, (_e, x) => { bytes += x.frag?.stats?.loaded ?? 0; });
        hls.loadSource(src);
        hls.attachMedia(video);
        video.play().catch(() => {});
        // ── WHEP leg, negotiated with EXACTLY the tracks this mode asks for ──
        pc = new RTCPeerConnection({ bundlePolicy: 'max-bundle' });
        if (mode.video) pc.addTransceiver('video', { direction: 'recvonly' });
        if (mode.audio) pc.addTransceiver('audio', { direction: 'recvonly' });
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        if (pc.iceGatheringState !== 'complete') {
          await new Promise((res) => {
            const t = setTimeout(res, 3000);
            pc.addEventListener('icegatheringstatechange', () => {
              if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); }
            });
          });
        }
        const r = await fetch(whep(), {
          method: 'POST', headers: { 'content-type': 'application/sdp' }, body: pc.localDescription.sdp,
        });
        if (!r.ok) {
          // A refusal is a RESULT: it says this transport will not serve the
          // shape you asked for, which is exactly what the page is asking.
          d.log(`whep refused ${mode.label}: HTTP ${r.status}`, 'bad');
          rec.whep.refused = r.status;
          try { pc.close(); } catch { /* fine */ }
          pc = null;
        } else {
          await pc.setRemoteDescription({ type: 'answer', sdp: await r.text() });
        }

        // The FIRST inbound-rtp report does not exist the instant an answer is
        // set, so a `before` sample taken there has no audio/video slot and
        // every buffer delta came out null. Let the stats appear, THEN start
        // the window — the ramp is not what a mode comparison is asking about.
        await new Promise((res) => setTimeout(res, 1500));
        const t0 = performance.now();
        const before = pc ? await sample(pc) : null;
        // hls.latency read once at the end is a single sample of a number that
        // moves; and read too early it is the STARTUP position, not the
        // latency. Sample across the window and take the median of the second
        // half, which is the closest thing to "once playing" this window has.
        const lat = [];
        const latTimer = setInterval(() => {
          if (Number.isFinite(hls?.latency) && hls.latency > 0) lat.push(hls.latency);
        }, 500);
        await new Promise((res) => setTimeout(res, WINDOW_MS));
        clearInterval(latTimer);
        const secs = (performance.now() - t0) / 1000;

        const tail = lat.slice(Math.floor(lat.length / 2)).sort((x, y) => x - y);
        rec.hls.latency = tail.length ? tail[Math.floor(tail.length / 2)] : null;
        rec.hls.samples = lat.length;
        rec.hls.kbps = (bytes * 8) / 1000 / secs;
        if (pc) {
          const after = await sample(pc);
          rec.whep.rtt = after.rtt;
          rec.whep.kbps = ((after.bytes - before.bytes) * 8) / 1000 / secs;
          // jitterBufferDelay is CUMULATIVE seconds and jitterBufferEmittedCount
          // is the number of samples/frames it covers, so the mean wait is the
          // ratio of the DELTAS — the instantaneous value would be an average
          // over the whole session, which is not what a mode comparison wants.
          rec.whep.audioBufMs = bufMs(before.audio, after.audio);
          rec.whep.videoBufMs = bufMs(before.video, after.video);
        }
      }
    } catch (e) {
      d.log(`${mode.label}: ${String(e?.message ?? e).slice(0, 90)}`, 'bad');
    } finally {
      try { hls?.destroy(); } catch { /* fine */ }
      try { pc?.close(); } catch { /* fine */ }
      busy = false;
    }
    runs.set(mode.id, rec);
    paint();
    d.set('hls', rec.hls.latency == null ? null : Math.round(rec.hls.latency * 100) / 100);
    d.set('whep', rec.whep.rtt == null ? null : Math.round(rec.whep.rtt));
    d.set('abuf', rec.whep.audioBufMs == null ? null : Math.round(rec.whep.audioBufMs));
    d.set('vbuf', rec.whep.videoBufMs == null ? null : Math.round(rec.whep.videoBufMs));
    const va = runs.get('va');
    if (va?.whep.kbps && rec.whep.kbps) {
      d.set('ratio', Math.round((va.whep.kbps / rec.whep.kbps) * 10) / 10);
    }
    // `?? 0` would print a MISSING buffer as a zero-millisecond one, which is
    // the most flattering number on the page and the least true: a headless
    // run with --mute-audio never drains NetEq, so jitterBufferEmittedCount
    // does not advance and there is no mean to report. Absent prints as absent.
    const ms = (x) => (x == null ? '—' : `${Math.round(x)} ms`);
    d.log(`${mode.label}: hls ${rec.hls.latency?.toFixed(2) ?? '—'} s / ${Math.round(rec.hls.kbps ?? 0)} kbps · `
      + `whep ${rec.whep.refused ? `refused ${rec.whep.refused}` : `rtt ${ms(rec.whep.rtt)}, `
        + `audio buf ${ms(rec.whep.audioBufMs)}, video buf ${ms(rec.whep.videoBufMs)}, `
        + `${Math.round(rec.whep.kbps ?? 0)} kbps`}`, 'hi');
    return rec;
  }

  async function sample(pc) {
    const stats = await pc.getStats();
    const out = { bytes: 0, rtt: null, audio: null, video: null };
    for (const s of stats.values()) {
      if (s.type === 'inbound-rtp') {
        out.bytes += s.bytesReceived ?? 0;
        const slot = { delay: s.jitterBufferDelay ?? 0, count: s.jitterBufferEmittedCount ?? 0 };
        if (s.kind === 'audio') out.audio = slot;
        if (s.kind === 'video') out.video = slot;
      }
      if (s.type === 'candidate-pair' && s.state === 'succeeded' && Number.isFinite(s.currentRoundTripTime)) {
        out.rtt = s.currentRoundTripTime * 1000;
      }
    }
    return out;
  }

  const bufMs = (a, b) => {
    if (!a || !b) return null;
    const dc = b.count - a.count;
    return dc > 0 ? ((b.delay - a.delay) / dc) * 1000 : null;
  };

  async function bringUp() {
    if (held) return;
    held = true;
    armVideo(video);
    holdPublisher((s) => d.set('mode', s.held ? 'publisher held' : 'idle', s.held ? 'ok' : 'bad'));
    const [m, w] = await Promise.all([
      waitForManifest({ onTick: ({ waitedMs }) => d.log(`hls not up at ${(waitedMs / 1000).toFixed(0)}s`) }),
      waitForWhip({ onTick: ({ waitedMs }) => d.log(`whip not up at ${(waitedMs / 1000).toFixed(0)}s`) }),
    ]);
    d.log(`hls ${m.ok ? 'up' : 'DOWN'} · whip ${w.ok ? 'up' : 'DOWN'}`, m.ok && w.ok ? 'hi' : 'bad');
    const s = await sources();
    if (s.a && s.v) {
      const [audio, vid] = await Promise.all([packaging(s.a), packaging(s.v)]);
      parts = { audio, video: vid };
      d.log(`packaging — audio part-target ${audio.partTarget}s hold-back ${audio.holdBack}s, `
        + `${audio.independent}/${audio.parts} parts INDEPENDENT · `
        + `video part-target ${vid.partTarget}s hold-back ${vid.holdBack}s, `
        + `${vid.independent}/${vid.parts} INDEPENDENT`, 'hi');
    }
  }

  d.on('all', async () => {
    await bringUp();
    for (const m of MODES) await runMode(m);
    d.log('all three modes measured — the table is the answer', 'hi');
  });
  for (const m of MODES) d.on(m.id, async () => { await bringUp(); await runMode(m); });

  d.on('check', () => {
    d.assert('all three modes ran', runs.size === MODES.length, `${runs.size}/${MODES.length}`);
    d.assert('the audio rendition exists at all', !!parts?.audio, parts ? 'read from the master' : 'not read');
    // THE STRUCTURAL ANSWER, and it needs no stopwatch: if the audio rendition
    // carried a shorter part target or a smaller hold-back, audio-only LL-HLS
    // would be lower latency by construction. It does not.
    d.assert('LL-HLS audio and video share one part target',
      parts && parts.audio.partTarget === parts.video.partTarget,
      parts ? `${parts.audio.partTarget}s vs ${parts.video.partTarget}s` : '—');
    d.assert('LL-HLS audio and video share one hold-back',
      parts && parts.audio.holdBack === parts.video.holdBack,
      parts ? `${parts.audio.holdBack}s vs ${parts.video.holdBack}s` : '—');
    // Every AAC frame is independently decodable, so an audio rendition COULD
    // mark every part INDEPENDENT and let a client join anywhere. Cloudflare
    // marks one per segment, exactly as it does for video.
    d.assert('audio parts are no more joinable than video parts',
      parts && parts.audio.parts > 0 && parts.audio.independent <= parts.video.independent + 1,
      parts ? `${parts.audio.independent}/${parts.audio.parts} audio vs ${parts.video.independent}/${parts.video.parts} video` : '—');
    // THE BANDWIDTH ANSWER: this is the column that moves.
    const va = runs.get('va'), a = runs.get('a');
    d.assert('audio-only is a fraction of the bytes',
      va?.hls.kbps > 0 && a?.hls.kbps > 0 && a.hls.kbps < va.hls.kbps * 0.5,
      va && a ? `${Math.round(a.hls.kbps)} vs ${Math.round(va.hls.kbps)} kbps` : '—');
    // CLOUDFLARE WHEP REFUSES A PARTIAL-TRACK OFFER. Measured: an offer with one
    // recvonly transceiver — audio alone or video alone — comes back HTTP 400,
    // both times, while video+audio negotiates in the same second. So on this
    // provider the "is audio-only WHEP lower latency" question does not have an
    // answer to measure: you cannot subscribe to it. Asserted rather than noted,
    // because the day that stops being true is a day worth being told about.
    d.assert('whep serves only video+audio, and refuses either alone',
      runs.get('a')?.whep.refused === 400 && runs.get('v')?.whep.refused === 400,
      `audio ${runs.get('a')?.whep.refused ?? 'served'}, video ${runs.get('v')?.whep.refused ?? 'served'}`);
    // Reported, never asserted: WHEP's per-track buffers are what they are on
    // the day, and an assert on their ORDER would be a claim about NetEq's
    // adaptation rather than about this stack.
    if (a?.whep.audioBufMs != null && va?.whep.videoBufMs != null) {
      d.log(`whep buffers — audio-only ${Math.round(a.whep.audioBufMs)} ms, `
        + `video (in v+a) ${Math.round(va.whep.videoBufMs)} ms`);
    }
  });

  d.log('LL-HLS: master = both, the EXT-X-MEDIA audio rendition = audio, one variant = video. WHEP: transceivers.');
  d.ready();
</script>
</html>
