<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* ARRIVAL. Two copies side by side, each a FIXED height, because this is
     the part that changes: a burst puts ten cues through here in a second,
     and a box that sized itself to the name would move everything under it. */
  .sync-zones { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--ctl-gap); }
  .sync-zone {
    border: var(--edge); border-radius: var(--r); background: var(--card);
    height: 96px; display: grid; grid-template-rows: auto 1fr; overflow: hidden;
    padding: 8px 12px;
  }
  .sync-zone-cap { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .sync-cue {
    align-self: center; justify-self: center;
    font: 700 28px/1.1 var(--mono); color: var(--hi); white-space: nowrap;
  }
  .sync-cue.idle { color: var(--dim2); font-size: 14px; font-weight: 500; }

  /* AHEAD. A row of squares per clock, one per beat, the same height
     whatever is happening. */
  .sync-pulse-wrap { display: grid; gap: 6px; }
  .sync-pulse-cap { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .sync-pulse { display: flex; gap: 4px; }
  .sync-pulse i { flex: 1; height: 40px; border-radius: 3px; background: var(--card2); border: var(--edge); }
  .sync-pulse i.on { background: var(--hi); border-color: var(--hi); }

  /* AFTER. */
  .sync-video { width: 100%; display: block; background: #000; border-radius: var(--r); }
</style>
<script src="/proto/remixer/hls.min.js"></script>

<script type="module">
  import { mount, guard } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createTabPage } from '/shell/tab-page.mjs';
  import * as arrival from './arrival.mjs';
  import * as ahead from './ahead.mjs';
  import * as follow from './follow.mjs';
  import * as after from './after.mjs';

  /*
   * 🔴 FOUR OLD PAGES AS THE TABS OF ONE, DECIDED BY THE OWNER 2026-10-04:
   * *"names ok, looper retires, no redrect, capture is fine"*
   * (plans/plan-demo-structure.md §3.1). The four tabs are the four regimes
   * plans/plan-routing-time.md settled on for how two places agree on when:
   *
   *   ARRIVAL  as it happens: a cue fires on every copy the moment it lands   (was /cues/)
   *   AHEAD    scheduled ahead on a peer clock both ends agree on            (was /jam/)
   *   FOLLOW   following a picture that arrives late, by its measured lag    (was /sync/)
   *   AFTER    aligned after, on one recording whose picture is the clock    (was /replay/)
   *
   * Each tab is a module beside this file and `demo/shell/tab-page.mjs` does
   * the rest: a tab is built when it is first opened, has its own readout and
   * log, opens nothing until a press inside it, and is checked only from the
   * one SELFCHECK pass below. AFTER owns the page's one published transport
   * bar; AHEAD's is `publish: false` and gets the harness's drill as page
   * asserts.
   */
  const d = mount({
    name: 'sync',
    what: 'Four ways two places agree on when something happens, from firing on arrival to lining up on a recording.',
    readout: null,
    showLog: false,
    controls: [],
  });
  guard(d);

  const page = createTabPage(d, {
    at: 'arrival',
    tabs: [
      { id: 'arrival', label: 'ARRIVAL', mod: arrival },
      { id: 'ahead', label: 'AHEAD', mod: ahead },
      { id: 'follow', label: 'FOLLOW', mod: follow },
      { id: 'after', label: 'AFTER', mod: after },
    ],
  });

  // Before `ready` and never after it: the harness drills the published bar
  // the moment `ready` is true, and a tab switch under it would race it.
  if (SELFCHECK) {
    const t0 = performance.now();
    await page.check();
    // The manifest's `bootMs` for this page is sized from this line.
    d.log(`the check pass took ${((performance.now() - t0) / 1000).toFixed(1)} s`);
  }
  d.ready();
</script>
</html>
