<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">

<script type="module">
  import { mount, guard } from '/shell/shell.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createStripView } from '/shell/strip.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { zoomCeilingPps, ulpMs, DATE_WALL_MS, tickLOD, formatTime, aoristic } from '/timeline/strip.mjs';
  import { markAdapter } from '/shell/fixture.mjs';

  const YEAR = 365.2425 * 24 * 3600 * 1000;
  const SPAN = 2000 * YEAR;                 // two millennia, so the ladder has work to do

  const d = mount({
    name: 'strip',
    what: 'Deep time, and dates that are not certain. Zoom until the float runs out.',
    readout: { pps: '', ceiling: '', ulp: 'ms', major: '' },
    controls: [
      { id: 'zin', label: 'Zoom in' },
      { id: 'zout', label: 'Zoom out' },
      { id: 'fit', label: 'Fit' },
      { id: 'check', label: 'Check limits', primary: true },
    ],
  });
  guard(d);

  // spans with declared uncertainty — `when.kind` is the whole point of Act 0's end
  const t0 = Date.UTC(100, 0, 1);
  const items = [
    { at: t0 + 300 * YEAR, kind: 'era', id: 'e1', payload: { label: 'attested' } },
    { at: t0 + 900 * YEAR, kind: 'era', id: 'e2',
      payload: { label: 'ignorance' }, when: { kind: 'ignorance', earliest: t0 + 800 * YEAR, latest: t0 + 1000 * YEAR,
              rule: 'positron-demo-bracket@1' } },
    { at: t0 + 1500 * YEAR, kind: 'era', id: 'e3',
      payload: { label: 'vagueness' }, when: { kind: 'vagueness', earliest: t0 + 1400 * YEAR, latest: t0 + 1600 * YEAR,
              rule: 'positron-demo-bracket@1' } },
    { at: t0 + 1900 * YEAR, kind: 'era', id: 'e4', payload: { label: 'attested' } },
  ];

  const { adapter } = markAdapter({ rates: [0.25, 0.5, 1, 2] });
  const deck = createDeck({
    items,
    adapters: { era: adapter },
    range: [t0, t0 + SPAN],
  });

  createTransportBar(d.el, deck, {});
  const { strip } = createStripView(d.el, deck, {
    size: 'deep',
    lanes: [{ id: 'era', kind: 'era', height: 60, as: 'spans' }],
  });
  strip.fit?.();

  function refresh() {
    const v = strip.view();
    d.set('pps', v.pxPerSecond);
    const t = deck.position();
    d.set('ceiling', Math.round(zoomCeilingPps(t)));
    d.set('ulp', ulpMs(t));
    const lod = tickLOD(v.pxPerSecond);
    d.set('major', formatTime(lod.major ?? 1000, lod.major ?? 1000).trim() || String(lod.major));
  }
  d.on('zin', () => { strip.zoomIn(); refresh(); });
  d.on('zout', () => { strip.zoomOut(); refresh(); });
  d.on('fit', () => { strip.fit?.(); refresh(); });
  setInterval(refresh, 250);

  d.on('check', () => {
    const t = deck.position();
    d.assert('zoom ceiling is finite', Number.isFinite(zoomCeilingPps(t)), String(zoomCeilingPps(t)));
    d.assert('ulp grows with magnitude', ulpMs(DATE_WALL_MS) > ulpMs(t),
      `${ulpMs(t)} -> ${ulpMs(DATE_WALL_MS)}`);
    d.assert('date wall is 8.64e15', DATE_WALL_MS === 8.64e15, String(DATE_WALL_MS));

    // aoristic: uncertain spans spread weight instead of pretending to a date
    // aoristic reads {from, to} (a point is to:null, mass 1 in its own column)
    const spans = items.filter((i) => i.when).map((i) => ({
      from: i.when.earliest, to: i.when.latest, weight: 1,
    }));
    const st = aoristic(spans, t0, t0 + SPAN, 24);
    const lit = [...st.mass].filter((x) => x > 0).length;
    const total = [...st.mass].reduce((a, b) => a + b, 0);
    d.assert('aoristic spreads, not spikes', lit > 1, `${lit}/24 bins`);
    d.assert('aoristic conserves weight', total > 0, total.toFixed(3));
    // the ledger is the point: a statistic that does not say what it dropped
    // implies a density nobody has
    d.assert('ledger accounts for every span', st.items === spans.length,
      `items ${st.items} counted ${st.counted} clipped ${st.clipped} open ${st.open}`);
    d.assert('names its method', typeof st.method === 'string' && st.method.length > 0, st.method);

    const lod = tickLOD(strip.view().pxPerSecond);
    d.assert('tick ladder picks a major', lod && Number.isFinite(lod.major), JSON.stringify(lod));
    d.log(`mass ${[...st.mass].map((x) => x.toFixed(1)).join(' ')}`);
    d.log(`method ${st.method} · peakCol ${st.peakCol} · colMs ${Math.round(st.colMs)}`);
  });

  refresh();
  d.log(`${(SPAN / YEAR).toFixed(0)} years, 2 of 4 spans carry when.kind`);
  d.ready();
</script>
</html>
