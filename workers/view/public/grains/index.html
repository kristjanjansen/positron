<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  @keyframes g-wait {
    0%, 100% { background: color-mix(in oklab, var(--hi)  6%, var(--card2)); }
    50%      { background: color-mix(in oklab, var(--hi) 26%, var(--card2)); }
  }
  .now  { font: 400 12px/1.6 var(--mono); color: var(--dim); margin: 0 0 6px; }
  .now b { color: var(--fg); font-weight: 500; }
  /* The open question, in the place where it is actually being asked. */
  .open { font: 400 12px/1.7 var(--mono); color: var(--dim2); margin: 0 0 14px; max-width: 74ch;
          border-left: 2px solid var(--line2); padding-left: 10px; }

  /* ── the roll, one block per granulator ────────────────────────────────
     Per-half numbers sit under the half they describe, never in a table of
     their own: joining a figure to the thing it is about across two elements
     is what makes a legend necessary. */
  .roll { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
          gap: 1px; background: var(--line); border: 1px solid var(--line);
          border-radius: 4px; overflow: hidden; margin: 0 0 10px; }
  .side { background: var(--card); padding: 10px 12px; min-width: 0; }
  /* ⚠️ NOT `.k`. That is the shell's PIANO KEY — 74 px tall, bordered, its own
     background — so a label wearing that class drew an empty key inside each
     block, back when this page drew a keyboard. A page that borrows a shared
     stylesheet borrows its whole namespace whether it draws keys or not. */
  .side .hd { display: block; font: 500 11px/1.4 var(--mono); color: var(--dim2);
              letter-spacing: .06em; text-transform: uppercase; }
  .side .ch { display: block; font: 600 17px/1.5 var(--mono); color: var(--hi); }
  .side .nums { display: block; font: 400 11.5px/1.6 var(--mono); color: var(--dim); }
  /* ⚠️ THE NAME TAKES THE REST OF THE ROW. A selector that keeps its label at
     its own text width leaves a phone with a stepper and an acre of nothing
     beside it — the same complaint as the sliders, one row up. `1fr` here is
     the same fix as `minmax(0,1fr)` there. */
  /* The name is inside the control now, so this row only has to place one
     thing — the two-column grid and `.pick-n` existed to put a label beside a
     stepper, which is what `createPicker` does for itself. */
  .pick { display: flex; align-items: center; margin: 0 0 12px; }
  .drift { font: 400 12px/1.7 var(--mono); color: var(--dim); margin: 0 0 12px; }
  /* ⚠️ NEVER AN EMPTY PAGE. A board that is switched off and a board that is
     playing must not look the same, which is the whole reason this block
     exists — same rule as the chain on /rack/. */
  .none { padding: 22px 14px; text-align: center; font: 500 13px/1.7 var(--mono); color: var(--dim2);
          background: var(--card); border: 1px solid var(--line); border-radius: 4px; margin: 0 0 12px; }
  .none b { display: block; color: var(--fg); font-size: 15px; margin-bottom: 6px; font-weight: 600; }
  .none span { display: block; max-width: 62ch; margin: 0 auto; }
  /* Two engines, two pictures, side by side — the `mirror` shape, because the
     difference between the two panes IS the subject. One column on a phone:
     side by side at 390 px is two pictures nobody can read. */
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0 4px; }
  @media (max-width: 720px) { .panes { grid-template-columns: 1fr; } }
  .pane { background: var(--card2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px 12px; min-width: 0; }
  .pane .hd { display: block; margin: 0 0 8px; }
  .pane .hd b { font: 600 12px/1.5 var(--mono); color: var(--fg); font-weight: 600; }
  .pane .hd span { display: block; font: 400 10.5px/1.5 var(--mono); color: var(--dim2); }
  /* the crossfade reads as a line between the two panes, so its ends are
     labelled where they point rather than in the paragraph above */
  /* 🔴 THE SLIDER TAKES THE ROW. A `.sld` is `inline-flex`, so between two
     `max-content` end labels it sat at its standalone 96 px with the whole
     content width empty either side — photographed, and it reads as a control
     that failed to lay out rather than one that is small. `1fr` on the middle
     item and the lane stretching inside it is what makes the track the width of
     the thing it is blending. */
  .fade { display: flex; gap: 14px; align-items: center; }
  .fade .end { font: 500 9.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dim2); white-space: nowrap; }
  .fade > .sld { flex: 1 1 auto; min-width: 0; }
  .fade > .sld > .sld-lane { width: auto; flex: 1 1 auto; }
  /* with no label there is no head to show, and an empty one would still take
     its gap */
  .fade > .sld > .sld-head:empty, .fade > .sld > .sld-head:not(:has(.sld-l:not(:empty))) { display: none; }
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createSlider, createSliderGroup, glide, GLIDE_MS } from '/shell/slider.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { createGrainScope } from '/shell/grain-scope.mjs';
  import { SHAPES, sourceMessage } from '/shell/source.mjs';
  // 🔴 REAL SUPERCOLLIDER, IN THIS TAB. The left pane used to be
  // `demo/shell/granular-worklet.js`, 251 hand-written lines, under a page
  // claiming "the same granulator in this page and on a Raspberry Pi" — which
  // was false: a reimplementation that sounds similar is not the same
  // instrument. Both ends now load the SAME compiled `pappus.scsyndef`. The
  // 1.7 MB engine is fetched inside `startPappus()`, so a visit costs the page.
  import { startPappus, levelOver } from './engine.mjs';
  import { createChoice } from '/shell/choice.mjs';
  import { createDiagram } from '/shell/diagram.mjs';
  import { openWire } from '/shell/wire.mjs';
  import { SELFCHECK, ifSelfcheck } from '/shell/selfcheck.mjs';

  const q = new URLSearchParams(location.search);
  const ROOM = q.get('room') || 'studio-1';

  const d = mount({
    name: 'grains',
    // 🔴 NO `what` PARAGRAPH: IT IS THE PICTURE AND ITS CAPTION NOW. The three
    // sentences that were here were describing a SHAPE — four numbers leave
    // this browser, cross a rented computer, reach a board in another building
    // and come back as sound — which is the one job prose is worst at
    // (plan-diagram §1). The diagram is built under `guard(d)` below, and the
    // half of the paragraph a picture cannot draw is its caption.
    // ⚠️ FIVE CELLS, MEASURED RATHER THAN GUESSED. It was eight, and five of
    // those ellipsised — `answe…`, `fluid…`, `shatt…`. A readout cell here is
    // 90 px of text whatever the window does (the page's own measure caps it,
    // not the viewport), which is EIGHT characters at five cells and seven at
    // six, so every value below is nine characters or fewer and the cells were
    // counted backwards from that. The things that would not fit are names
    // rather than numbers — which sound it is, what it is chewing — and they
    // are on the two lines under this row, where they have room and context.
    readout: {
      // 🔴 TWO CELLS EACH, AND THE WORD SAYS WHICH LANE. This page has two
      // engines side by side, so a shared row of numbers has to say which one
      // each belongs to or it is a legend. The per-lane detail lives in each
      // card's own gutter, beside the ink it describes.
      // 🔴 THE PAGE'S OWN GRAINS ARE NOT IN HERE, and they used to be. `grains
      // a second` and `at once` are already printed in granulator one's own
      // card, beside the picture they describe — which is where this project
      // puts a per-lane figure — so the row was saying them a second time, and
      // saying them BLANK until you press Switch it on. Two empty cells above
      // two full ones reads as a readout that failed to load.
      board: '', sound: '',
      // ⚠️ THESE TWO EXIST BECAUSE TWO PARAGRAPHS WERE DELETED, and they are
      // the same facts in the form this project uses for a moving figure. The
      // prose said "53 nudges in the 8 s this page has been watching, none of
      // them asked for" and "reading at 0.416 of the way through the sixty
      // seconds"; a cell says it in a fixed box that does not reflow.
      // 🔴 Deleting a display without rehoming what it said is how a page
      // quietly stops reporting something, which is worse than saying it badly.
      nudges: '', 'reading at': '',
    },
    controls: [
      // 🔴 THE ONE CONTROL THAT MAKES IT SOUND LIKE A GRANULATOR. MEASURED on
      // real scsynth 2026-09-13: with the instrument still playing IN, the
      // grains read at the write head and come out as a copy of what is going
      // in — `mrate` 0.5 against 24 measured rms 0.0575 against 0.0580, which
      // is the same. Take the input away and freeze the buffer and the same
      // sweep reads flutter 0.377 against 0.692 and 0.0 against 4.6 gaps a
      // second. It was never a broken engine; a granulator reading the present
      // sounds like the present, however you set it.
      // ⚠️ `on` IS FIRST BECAUSE `settleMs` LANDS ON CONTROL 0 ONLY, and this
      // page's slow control is this one: raising the insert compiles a
      // 2,030-line engine, about forty seconds. verify.mjs says so in its own
      // words — "a demo whose slow control is not the first gets nothing from
      // it here" — and putting `hold` first briefly took that budget away and
      // left the compile on a ~35 s ceiling, where a cold board would have read
      // `page asserted something — 0`, i.e. totally broken.
      //
      // Order and PRIMARY are independent: `hold` is still the one that looks
      // like the main path, and `on` is hidden from a visitor anyway.
      // 🔴 VISIBLE, AND FIRST IN BOTH SENSES. This was hidden behind ?checks=1
      // on the reasoning that pressing a key starts the granulator. It does
      // not: `fx.pappus {on:true}` is sent from THIS HANDLER and nowhere else,
      // so hiding it left a visitor with no way to switch the instrument on and
      // a page that does nothing. Asserted without checking, which is the whole
      // of the mistake.
      { id: 'on', label: 'Switch it on', primary: true },
      { id: 'hold', label: 'Hold what it has' },
    ],
  });
  guard(d);

  // ── where the signal goes ────────────────────────────────────────────────
  // The first demo to take the drawer (plan-diagram §7). It goes where the
  // paragraph was, above the numbers, because it is the thing to read first.
  //
  // 🔴 EACH GRANULATOR IS A BOX INSIDE THE MACHINE THAT RUNS IT. It was a
  // `sub` on the machine — `this page` / `a granulator in it` — which draws
  // the two as ONE thing doing one job, and they are not one thing: the
  // granulator is IN the page, the way the other one is in the board. That is
  // the shape, so the drawer draws it.
  //
  // ⚠️ AND IT IS STILL NOT A FORK, WHICH IS WHAT IT LOOKED LIKE FIRST. Drawn
  // as one — `this page` branching to `a granulator here` and to `Cloudflare`,
  // right and legible at 688 px — it was FALSE at 358 px: below 560 px every
  // box stacks in one column, so the branch to Cloudflare ran behind the
  // granulator box and a phone read `this page → a granulator here →
  // Cloudflare`, a path this page does not have and has never measured. A box
  // inside a box says the same true thing at both widths and has no second
  // branch to route.
  //
  // ⚠️ EVERY ARROW IS A THING THIS PAGE ASSERTS. `four settings` is the
  // `params.set` pair `setKnob` sends, under "the page reached the relay";
  // `sound and grains` is the PCM that `probeSound` measures with a key down
  // AND the board's own `grain.marks`, under "the board's grains are reported
  // by the engine that fired them". Nothing is drawn that no check covers —
  // the notes and the material spec also go out, and they are left off rather
  // than crowding the one arrow that carries the page's subject.
  // 🔴 AT THE END, UNDER THE STANDING HEADING, LIKE EVERY OTHER DIAGRAM.
  // Instructed 2026-09-16: *"use same title on all diagrams"*. This page was
  // the last outlier and it was an outlier twice: it drew into `d.head`, so the
  // picture came FIRST, and it carried no heading at all.
  //
  // ⚠️ THE OLD REASONING WAS SOUND AND ONLY ABOUT THE OLD POSITION. It said a
  // title here would sit directly under the page's own name, two headings
  // stacked with the second explaining the first, and that a caption above a
  // picture about to explain itself is a label on a label. All true of a
  // diagram at the top. Moving it to the bottom is what makes the heading
  // right rather than redundant, and it is what CLAUDE.md asks for anyway: a
  // diagram is REFERENCE, read once, on purpose, by somebody who has already
  // pressed the thing.
  createDiagram(d.el, {
    // The paragraph that was in `what`, cut to the part the drawing cannot
    // say. Hovering a box replaces this line with what that box does, which is
    // why there is no tooltip anywhere on this page.
    caption: 'The blend decides how much of each you hear, so one can become the other while both '
      + 'keep running. Press Hold and the board stops listening: its grains then come only from the '
      + 'minute it already has, which is when the settings start to do something you can hear.',
    // ⚠️ A BOX'S SENTENCE SAYS WHAT IT DOES HERE, NEVER ITS NAME AGAIN.
    // Hovering `Raspberry Pi` used to put `Raspberry Pi — another granulator`
    // under the picture, beside a browser tooltip saying the same, over a box
    // already saying it: three channels, one fact. These are the fourth
    // sentence of the paragraph that is not in `what` any more.
    // 🔴 AND THEY ARE STATIC. A sentence that recomputed itself from a live
    // number is the slop prose this page had two paragraphs of; these describe
    // a fixed picture and never change while anybody is looking at them.
    nodes: [
      { id: 'you', label: 'this page', kind: 'here',
        note: 'Everything you press is in this browser, and so is **one of the two granulators**.',
        children: [{ id: 'here', label: 'Pappus', sub: 'a granulator',
          note: 'The **same program** as the board’s, compiled to run in a browser, '
              + 'chewing the same description of a sound.' }] },
      { id: 'cf', label: 'Cloudflare', sub: 'passes it all on', kind: 'cloud',
        note: 'A computer rented by the hour, so the two ends never have to find each '
            + 'other. It **changes nothing** on the way through.' },
      // ⚠️ `called Pappus` IS A NAME, NOT JARGON — CLAUDE.md, decided
      // 2026-09-13. It is what the program on the board is called, and hiding
      // it behind a friendly word would hide the one fact this box carries.
      { id: 'pi', label: 'Raspberry Pi', kind: 'device',
        note: 'A small board in the studio, on a network of its own, which this page '
            + 'reaches **only through Cloudflare**.',
        children: [{ id: 'there', label: 'Pappus', sub: 'a granulator',
          note: 'The **same program** again, on the board’s own sound server, '
              + 'with the same four settings.' }] },
    ],
    links: [
      // ⚠️ `four settings`, NOT `the four settings` — MEASURED. In one column
      // an arrow's name gets the room beside it in the row it sits in, and the
      // article costs four characters the drawer does not have on a narrow
      // phone: it reported `the four…` at 343 px, a 17-character label in a
      // 93 px slot. Dropping one word is clean down to 258 px.
      //
      // 🔴 EVERY ARROW IS NAMED, AND THE TWO MIDDLE ONES SAY `the same`
      // BECAUSE THAT IS WHAT CROSSES THEM. A bare arrow says only "these two
      // are connected", which the line already said. The relay hands on
      // exactly what it was given, so the second hop of each direction carries
      // the same thing as the first — which is the fact, and inventing a
      // different word for it would be a small lie. MEASURED at 258 / 288 /
      // 320 / 343 / 375 / 390 / 560 / 688 px: nothing shortened at any of
      // them, with four names in the picture instead of two.
      { from: 'you', to: 'cf', label: 'four settings' },
      { from: 'cf', to: 'pi', label: 'four settings' },
      { from: 'pi', to: 'cf', label: 'sound and grains', back: true },
      { from: 'cf', to: 'you', label: 'sound back', back: true },
    ],
  }, { how: true, atEnd: true });

  // ── state ────────────────────────────────────────────────────────────────
  let me = null;                       // this connection's id, to drop our own echo
  let answered = false, lastHeard = 0, rtt = null, stateAt = 0, stateId = null;
  let wantSource = null;               // a source this page asked the board to start
  let playing = null, onJack = false;  // what the board is sounding, and whether the granulator can reach it
  let fxOn = false, fxWhy = null, fed = null, switching = false;
  /**
   * 🔴 WHO ELSE IS DRIVING THIS BOARD. Two pages share one Raspberry Pi:
   * `/keys/` takes the granulator OUT on load — rightly, because an insert left
   * in by a tab that CLOSED wraps whatever it plays and feeds its own delay —
   * and this page puts it IN, because the granulator is its whole subject. So
   * whichever was opened last used to win SILENTLY, and the loser went on
   * drawing a picture that was no longer true, which is the worst shape of
   * failure there is.
   *
   * The board reports its own insert now — in `fx.pappus`, in `audio.started`
   * and in the five-second `box.alive` — so a change made in another window
   * arrives here without this page asking for anything. ⚠️ This page does NOT
   * fight back: switching it on again automatically would be two tabs taking
   * turns for ever. It says what happened and leaves the button where it is.
   */
  let fxBy = null, fxTakenAt = 0;
  /**
   * How many of the board's eight granulator voices are open, from the board's
   * own `params.state`.
   *
   * 🔴 THE NUMBER THAT WOULD HAVE SAVED A SESSION. With every gate shut the
   * granulator fires no grain at all while PASSTHROUGH STILL WORKS — so the
   * board streams audio, answers every question, reports the right material,
   * and makes nothing. The page read that as "the board is silent" and could
   * not say why. It was on the wire the whole time and nothing looked at it.
   */
  let boardVoices = null;
  let roll = null;                     // the board's current roll: character, seed, every parameter
  let drift = null, rolledAt = 0;
  const driftLog = [];                 // {t, nudges} — every reading, so the window is real
  let probe = null;                    // { quiet, held } — peak with nothing pressed, then with a key down
  let frames = 0, gaps = 0, gapWarned = false, lastSeq = -1, firstFrame = 0, level = 0, levelAt = 0;
  let boardGrains = 0;                 // how many the board has reported to this page
  /**
   * Every batch the board has sent, with the time it landed — so a RATE can be
   * taken over a window this page actually watched.
   *
   * ⚠️ A RUNNING TOTAL OVER A START TIME IS THE WRONG COLLECTOR HERE, and it
   * read 0.6 a second about a board firing 2.2. `grain.report` EXPIRES after
   * 30 s and this page only re-asks once the granulator is on, so on a cold
   * board — forty seconds of compiling — the counting window opens long before
   * the reports are continuous, and the dead time goes into the denominator.
   * A sliding window over the arrivals cannot have that bug.
   */
  const grainLog = [];                 // {t, seen}
  // What the BOARD says it is chewing — the engine's own answer, not this
  // page's request. plan-twins §4a: the two panes are only comparable if the
  // material is the same, and this is the end that can be asked.
  let made = null;                     // { partials, topHz, engine } | { reason }
  let collect = null;                  // set while a measurement is open

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  // What a seed is supposed to reproduce: the two characters and every
  // continuous parameter of both halves. The same claim pappus-live.mjs makes
  // against the board, made here against the board's own report of itself.
  const settings = (r) => JSON.stringify({ c: r?.character, m: r?.m, n: r?.n });
  /**
   * Every reading of the board's own nudge counter, with the time it was taken.
   *
   * ⚠️ A SINGLE BASELINE VARIABLE WAS NOT ENOUGH, TWICE. Re-taken on every roll,
   * it made the check compare a counter against a baseline set half a second
   * earlier and report a drift that had stopped. Taken once and never again, it
   * was silently thrown away whenever the board answered with no granulator
   * (which happens between switching the insert on and the first roll, and
   * after a restart of the service) and the next reading became a brand new
   * "first" — one run reported 6 nudges in 1 s where 340 in 45 s was the truth.
   * A list cannot have either bug: the window is whatever the page actually
   * watched, and it is reported beside the count.
   */
  function markDrift() {
    if (Number.isFinite(drift?.nudges)) {
      driftLog.push({ t: Date.now(), nudges: drift.nudges });
      if (driftLog.length > 400) driftLog.shift();
    }
  }
  /** How much the board moved on its own, over how long. Null until two readings. */
  function driftMoved() {
    if (driftLog.length < 2) return null;
    const a = driftLog[0], b = driftLog[driftLog.length - 1];
    return { nudges: b.nudges - a.nudges, ms: b.t - a.t };
  }
  /**
   * 🔴 FIXED 2026-09-13, AND IT WAS BOARD-SIDE. The movement used to circle the
   * last DICE ROLL and nothing else, and this page does not roll — it sets each
   * parameter directly, six finished sounds. So the timer turned over with
   * nothing to circle, `nudges` stayed 0 and `scan` came back null for as long
   * as anybody cared to wait: a readout cell that could not change. MEASURED on
   * the live board that morning: `params.state` -> `{ok:true, roll:null,
   * drift:{on:true, nudges:0, sinceMs:null, scan:null}}`. `params.set` now
   * moves the centre too, so the last thing anybody SET is what the movement
   * circles, whether a die chose it or a person did.
   *
   * The states are still four, because they are still all reachable — the
   * board can be silent, the movement can be switched off at the board, and
   * there is a moment after switching on before the first patch has landed.
   * They are answered in ONE place because the readout cell, the sentence under
   * the panel and the check all have to say the same thing about it — a
   * description that can disagree with the thing it describes is worse than
   * none.
   *
   *   null       the board has not said
   *   'off'      it is not moving anything at all
   *   'nothing'  the timer is running and has not been given a value yet
   *   'moving'   it has a centre, so the count should be climbing
   */
  function driftState() {
    if (!drift) return null;
    if (drift.on !== true) return 'off';
    return Number.isFinite(drift.scan) ? 'moving' : 'nothing';
  }
  /** The same three states in words, for the line under the panel. */
  // ⚠️ `driftLine()` IS GONE WITH THE PARAGRAPH IT FED. Its own comment
  // recorded that it had once printed `moving on its own · 0 nudges … reading
  // at —` about a board that was moving nothing — a headline claim with its own
  // contradiction beside it — and the repair was to make the sentence smarter.
  // The sentence was the problem. The drift count is a readout cell now and the
  // board's state changes are logged when they CHANGE.

  // ── the page ─────────────────────────────────────────────────────────────
  // 🔴 NO SOURCE PICKER, AND NO ARCHIVE. This page makes no request to ERR at
  // all: it is somebody else's public archive, it blocked this board's address
  // once after a day of testing, and the relay's broadcast shape meant a reply
  // to ANOTHER listener's search made this page fire its own load — twelve went
  // out for one press. What the grains should be made of is still an open
  // question; it will be answered without a page that can hammer a stranger.
  //
  // Until then the board plays Yoshimi into the granulator and the sliders are
  // the point. Yoshimi because it is a JACK client the insert can actually wrap,
  // and because it holds a note: a granulator with nothing arriving has nothing
  // to granulate.
  // ⚠️ IT IS ALSO THE ONLY INSTRUMENT ON THE BOARD SINCE 2026-09-16. The
  // sampled one and the DX7 left (`archive/box-fluidsynth-hexter/`), so this
  // constant is now a fact rather than a choice.
  const SOURCE = 'yoshimi';

  const panel = el('div', '');
  d.el.append(panel);

  // ── where it runs ────────────────────────────────────────────────────────
  //
  // 🔴 ONE SUBJECT, TWO PLACES, AND THE DIFFERENCE IS WHAT CAN BE DRAWN. This
  // page and `dust` were two pages about one thing, and splitting them cost the
  // better half of each: `dust` had the picture — a granulator in the page
  // reports every grain it fires, so the waveform, the lit band it is reading
  // from and each grain flickering at the exact point it read are all MEASURED
  // — and `grains` had the claim, which is that the same thing is happening on
  // a Raspberry Pi in another building.
  //
  // ⚠️ The board can only ever send AUDIO. A grain inferred from audio might be
  // a note, a delay tap or a reverb swell, so in that lane the picture is the
  // sound that arrived and the gutter says so. The two lanes are not the same
  // instrument drawn twice; they are the same instrument seen through two
  // different amounts of evidence, which is the honest reason to put them side
  // by side rather than to pick one.
  // 🔴 A CROSSFADE, NOT A SWITCH, AND BOTH PICTURES ARE ALWAYS UP. A switch
  // makes the two lanes alternatives and hides the only interesting thing —
  // that the same four settings, sent to two different engines in two different
  // buildings, are the same instrument. Blended, you hear one become the other
  // while both pictures keep drawing, which is the `mirror` shape: two panes of
  // the same subject, and the difference between them is the subject.
  //
  // EQUAL POWER, not a linear pair. Two uncorrelated sources at 0.5 each are
  // 6 dB down in the middle of a linear fade — an audible dip exactly where a
  // listener stops to compare.
  let blend = 0;                       // 0 = all this page, 1 = all the board
  const here = () => blend < 0.5;      // which lane the page is mostly listening to
  const fadeGains = () => {
    const a = Math.cos(blend * Math.PI / 2), b = Math.sin(blend * Math.PI / 2);
    if (pap?.out) pap.out.gain.value = 0.9 * a;
    if (boardGain) boardGain.gain.value = b;
  };

  /**
   * The engine's own knobs. `params.set {cmd, args}` takes a command NAME and
   * numbers; the roll table in pappus.mjs is where these ranges come from, so a
   * slider cannot ask for something a roll would never produce.
   *
   * 🔴 ONE SLIDER, TWO HALVES, AND THE RELATION BETWEEN THEM SURVIVES. The
   * comment here used to claim that sending one value to both "keeps the
   * relation while changing the scale". It does not — it OVERWRITES the
   * relation: `slow drift` loads granulator one at 2.2 grains a second and two
   * at 1.4, and the first drag of the rate slider made both of them the same
   * number. So the patches were built to have two unlike halves, the page said
   * they were unlike, and one touch of any control made them identical. That is
   * why both granulators sounded the same.
   *
   * The slider now moves half one and carries half two with it at the PATCH's
   * own ratio, which is what "changing the scale" was supposed to mean. A ratio
   * needs a non-zero base, so a patch whose half one is 0 keeps the DIFFERENCE
   * instead — `spray` and `strum` are legitimately zero in several patches.
   */
  // 🔴 FOUR KNOBS THAT EXIST IN BOTH ENGINES, which is what makes the switch
  // above a switch rather than two pages sharing a URL. `swarm` was here and is
  // not, because the in-page engine has nothing that means it — a control that
  // goes dead in half the page is worse than one fewer control. `where` is new
  // and is the one the board could not take until today: `params.set mscan`
  // now moves the centre the slow drift circles, so setting it sticks instead
  // of being overwritten by the next nudge.
  const KNOBS = [
    ['rate',  0.5, 24,  0.1, '/s',  'how often a grain starts'],
    ['size',  0.02, 0.4, 0.01, 's', 'how long each one lasts'],
    ['where', 0,   1,   0.01, '',   'how far into the held sound they read from'],
    ['spray', 0,   0.5, 0.01, '',   'how far they scatter from that point'],
  ];
  /** the knob's name on the engine — `where` is `scan` on both of them */
  const cmdOf = (key) => (key === 'where' ? 'scan' : key);
  const sliders = new Map();
  // TWO ACROSS on a desktop, four stacked on a phone — the same `pair` modifier
  // /draw/ uses, not a second spelling of it. Four knobs a metre long was a
  // column of lanes with an empty half-screen beside it.
  const knobRow = createSliderGroup([], { pair: true });
  for (const [key, min, max, step, unit, why] of KNOBS) {
    const s = createSlider({
      label: key, min, max, step, unit, value: (min + max) / 3,
      // ⚠️ ON RELEASE, NOT ON EVERY MOVE. A drag is ~60 events a second into a
      // relay whose measured ceiling is 60 msg/s for everything on it — and it
      // drops silently past that, so the last value you let go on would be the
      // one lost. `onChange` sends one message when the hand stops.
      // ⚠️ ON EVERY MOVE IN THE PAGE, ON RELEASE FOR THE BOARD, and the split
      // is the relay. A drag is ~60 events a second into a relay whose measured
      // ceiling is 60 msg/s for everything on it, and it drops past that
      // silently — so the last value you let go on would be the one lost. In
      // the page there is no wire and a change is audible in one render
      // quantum, and waiting for the hand to stop would throw that away.
      // BOTH ENGINES GET THE SAME NUMBER, which is the whole point of running
      // them side by side. The page engine gets it on every move — no wire, and
      // a change is audible in one render quantum. The board gets it once, on
      // release: a drag is ~60 events a second into a relay whose measured
      // ceiling is 60 msg/s for everything on it, and it drops past that
      // silently, so the value you let go on would be the one lost.
      onInput: (v) => setKnob(key, v, why, unit, false),
      onChange: (v) => setKnob(key, v, why, unit, true),
    });
    sliders.set(key, s);
    knobRow.add(s);
  }
  d.el.append(knobRow.el);

  /**
   * 🔴 SIX FINISHED SOUNDS, NOT SIX DICE. The page used to hand you a random
   * number and nine sliders and call that a choice — every roll landed in the
   * middle of nine ranges, so they all sounded like one wash wearing different
   * digits, and the number on screen meant nothing to anybody.
   *
   * A patch here is the WHOLE sound: which instrument, which chord it holds,
   * and every engine setting for both halves of the granulator. The randomiser
   * picks between these, never between slider positions — a random position is
   * how you get the mid-range wash back.
   *
   * ⚠️ The two halves are deliberately unlike each other. Giving both the same
   * numbers is what made the old roll sound like one thing played twice.
   */
  /**
   * 🔴 GRAINS ONLY, AND IT IS A NUMBER OUT OF THE ENGINE'S SOURCE. `sos` is not
   * a flavour control — at the value the patches below used to carry it, this
   * board was not granulating at all.
   *
   *     Engine_Pappus.sc:945
   *       sxf  = (msos.max(mlock) / 0.6).clip(0, 1)
   *       gsum = gsum * sin(sxf * pi/2)  +  [capl, capr] * cos(sxf * pi/2)
   *
   * `capl`/`capr` is the LIVE INPUT. So `sos 0` is `cos(0) = 1` on the input and
   * `sin(0) = 0` on the grains: the granulator's output is its own input,
   * verbatim, and `sos 0.6` is the first value that is all grains. MEASURED over
   * the relay on a held note, sweeping `mrate` 0.5 against 24 at each `sos`:
   *
   *     sos 0     0.030519 against 0.030519   — the same to six digits
   *     sos 0.3   0.021687 against 0.028364
   *     sos 0.6   0.004981 against 0.041123   — 8.3x
   *     sos 1     0.007658 against 0.043263
   *
   * and the gaps appear with it: the fifth-percentile envelope against the
   * median reads 0.981 at `sos 0` (a continuous drone) and 0.000 at `sos 0.6`
   * with a slow rate (real silence between grains).
   *
   * ⚠️ THIS IS THE 2026-09-12 PUZZLE, CLOSED. "No granulator parameter on this
   * board could be shown to change the returned audio — mrate 0.5 against 24,
   * pwet 0 against 1, melen 1 against 8, all identical", and "the envelope NEVER
   * dropped below a quarter of its own median at any setting". Every one of
   * those sweeps was taken at `sos 0`, which is the engine passing its input
   * through. Nothing was broken.
   *
   * ⚠️ AND 0.6 RATHER THAN 1, because `sos` also sets how much of the old buffer
   * is kept: the blend reaches grains-only at 0.6 while the RECORD keeps going
   * to 1.0, so 1 is a frozen buffer. The engine's own comment says so. Two
   * patches here were at 0.10 and 0.15 — a quarter grains, three quarters live
   * instrument — on a page whose other pane is grains and nothing else.
   */
  const SOS = 0.6;
  const PATCHES = [
    { name: 'slow drift', voice: 'pad', notes: [43, 50, 55, 62],
      m: { rate: 2.2, size: 0.30, scan: 0.35, spray: 0.12, swarm: 0.35, tilt: -0.2, delay: 0.35, sos: 0.45, strum: 0.05 },
      n: { rate: 1.4, size: 0.36, scan: 0.60, spray: 0.20, swarm: 0.55, tilt: -0.35, delay: 0.50, sos: 0.55, strum: 0 } },
    { name: 'far choir', voice: 'choir', notes: [48, 55, 60, 64, 67],
      m: { rate: 3.0, size: 0.28, scan: 0.40, spray: 0.25, swarm: 0.30, tilt: -0.1, delay: 0.40, sos: 0.50, strum: 0.1 },
      n: { rate: 1.8, size: 0.38, scan: 0.70, spray: 0.35, swarm: 0.50, tilt: -0.3, delay: 0.55, sos: 0.60, strum: 0 } },
    { name: 'glass rain', voice: 'bells', notes: [72, 76, 79, 84],
      m: { rate: 14, size: 0.050, scan: 0.50, spray: 0.40, swarm: 0.55, tilt: 0.30, delay: 0.30, sos: 0.15, strum: 0.30 },
      n: { rate: 18, size: 0.035, scan: 0.30, spray: 0.50, swarm: 0.70, tilt: 0.45, delay: 0.20, sos: 0.10, strum: 0.40 } },
    { name: 'deep hum', voice: 'pad', notes: [31, 36, 43],
      m: { rate: 0.9, size: 0.38, scan: 0.50, spray: 0.08, swarm: 0.60, tilt: -0.6, delay: 0.50, sos: 0.62, strum: 0 },
      n: { rate: 0.6, size: 0.40, scan: 0.25, spray: 0.15, swarm: 0.80, tilt: -0.7, delay: 0.60, sos: 0.68, strum: 0 } },
    { name: 'wide strings', voice: 'strings', notes: [45, 52, 57, 61, 64],
      m: { rate: 8, size: 0.16, scan: 0.45, spray: 0.30, swarm: 0.45, tilt: 0, delay: 0.35, sos: 0.30, strum: 0.15 },
      n: { rate: 11, size: 0.12, scan: 0.65, spray: 0.42, swarm: 0.60, tilt: 0.1, delay: 0.25, sos: 0.25, strum: 0.25 } },
    { name: 'thin ice', voice: 'kalimba', notes: [67, 72, 74, 79],
      m: { rate: 20, size: 0.030, scan: 0.50, spray: 0.50, swarm: 0.70, tilt: 0.5, delay: 0.20, sos: 0.10, strum: 0.35 },
      n: { rate: 16, size: 0.040, scan: 0.20, spray: 0.55, swarm: 0.85, tilt: 0.4, delay: 0.30, sos: 0.20, strum: 0.45 } },
  ];

  let patch = 0, holding = [];
  // 🔴 WHAT WAS ACTUALLY SENT, not what the patch table says. `render()` drew
  // `PATCHES[patch].m/n` — the values a patch loads — so every slider move left
  // the panel describing settings that had already left the sound. Same shape
  // as the `params.state` bug this page was fixed for once already: a readout
  // answering with something that used to be true.
  // ⚠️ SEEDED FROM THE PATCH, NOT EMPTY. `render()` runs on the first frame that
  // arrives, long before anything is applied, and an empty object put
  // `undefined.toFixed()` on the page's own error line — a readout that starts
  // blank is a readout that throws.
  let live = { m: { ...PATCHES[0].m }, n: { ...PATCHES[0].n } };
  const round = (x) => Math.round(x * 1000) / 1000;
  const clampTo = (key, v) => {
    const k = KNOBS.find(([n]) => n === key);
    return k ? Math.min(k[2], Math.max(k[1], v)) : v;
  };
  /** Half two's value for a slider on half one, at the patch's own relation. */
  function partner(key, v) {
    const p = PATCHES[patch];
    const base = p.m[key], mate = p.n[key];
    if (base > 0 && mate > 0) return round(clampTo(key, v * (mate / base)));
    return round(clampTo(key, v + (mate - base)));
  }
  function setLive(key, mv, nv) { live.m[key] = mv; live.n[key] = nv; }

  /** Release the old chord, load the new instrument, hold the new chord, set both halves. */
  async function applyPatch(i) {
    patch = ((i % PATCHES.length) + PATCHES.length) % PATCHES.length;
    const p = PATCHES[patch];
    step.render();
    for (const n of holding) send({ type: 'note.off', note: n, channel: 0 });
    holding = [];
    send({ type: 'voice.select', voice: p.voice });
    // ⚠️ A BEAT BEFORE THE CHORD. A program change and a note in the same
    // millisecond can land in either order, and a note that arrives first is
    // played by the OUTGOING instrument — which reads as the patch not working.
    await wait(140);
    for (const n of p.notes) { send({ type: 'note.on', note: n, vel: 80, channel: 0 }); holding.push(n); }
    // 🔴 THROUGH `forBoth`, WHICH IS THE ONLY PATH. Both engines run the same
    // definition, so they take the same command names — and a second path for
    // the browser would be a second place for the two panes to disagree,
    // invisibly, because both would still work.
    writePatch(p);
    // 🔴 SET, NEVER INHERITED — plan-twins §5. `mscanmode` decides what `mscan`
    // MEANS and the engine's default is 1 STRETCH, where it is a playhead speed
    // mapped -1..+2 rather than a position; `msrc` 1 is OFF and OFF ERASES
    // (LESSONS #46); `msos` 0 hands the input back with no grains in it; the
    // nine `BYPASS` stages are heard in whichever pane the last visitor left
    // them on. Every one of them is in `setFixed()`, which sends to BOTH ends.
    //
    // ⚠️ AND THE BROWSER NEEDS IT MORE, NOT LESS. The board is an OBJECT that
    // keeps what it was left with; the engine in this tab is FRESH, so its
    // defaults are the ENGINE's — `report` off, `run` 0, `msos` 0, `mscanmode`
    // 1. Neither end can be assumed and they cannot be assumed for the same
    // reason, which is why one function answers for both. (`writePatch` above
    // sends the fixed settings too.)
    // ⚠️ ASKED FOR, NOT ASSUMED. Setting a parameter gives the board's slow
    // movement a centre; it does not switch the movement on, because
    // `params.set` is also the surface a harness sweeps one parameter through
    // and a sweep that started the drift under itself would be grading a
    // moving target. So the page asks, here, where there is finally something
    // to move. The board answers `changed: false` when it was already running.
    send({ type: 'params.drift', on: true });
    // ⚠️ ASKED FOR, AND RE-ASKED. Reporting costs the board sixteen live
    // SendReply UGens and the room four messages a second, so the request
    // EXPIRES — a page that is closed cannot tell anybody to stop. The box
    // keeps shipping for 30 s after the last ask; this re-asks well inside
    // that, and stops the moment the page goes away.
    send({ type: 'grain.report', on: true });
    // A patch is the new truth about both halves, so the panel's source of
    // truth is reset with it. ⚠️ WITH THE SAME CLAMP THE WIRE GOT — a `live`
    // holding the table's `sos` while the board holds `SOS` is a readout
    // describing a setting nobody sent.
    live = { m: { ...p.m, sos: Math.max(SOS, p.m.sos) }, n: { ...p.n, sos: Math.max(SOS, p.n.sos) } };
    // ⚠️ NOTHING DRAWN FROM THE PATCH. The scope used to take an `expect()` of
    // what the settings imply; it does not any more, and the reason is this
    // page. Drawing the requested grain rate here would put a confident row of
    // ticks under an audio stream that has never been shown to contain a single
    // grain — a page illustrating its own settings and calling it a reading.
    // ⚠️ THE PATCH MOVES BOTH ENGINES. It writes the board's two halves above;
    // these four are the shared knobs, so the page engine and the sliders end
    // up on the same numbers — otherwise choosing a sound would change one
    // pane and leave the other on whatever was there before, which is two
    // instruments wearing one control surface.
    // 🔴 A QUARTER SECOND, NOT ONE BLOCK — and MEASURED against the board
    // before it was built. `Engine_Pappus.sc` puts `Lag.kr(…, lagt)` on every
    // one of these with `lagt = 0.02`, which is 20 ms: enough that a step in a
    // control signal does not click, nowhere near enough to be a change of
    // sound. So the board jumps too, and the page is not gliding for
    // decoration — it is gliding because a grain rate going 2.2 to 20 in one
    // render quantum is a click rather than a new setting.
    // ⚠️ ONE SHAPE AND ONE DURATION for the handle and the sound: `glide()`
    // draws both from `GLIDE_MS`, so the knob is a picture of what the engines
    // are doing rather than a second animation that happens to look similar.
    // ⚠️ STOP THE LAST GLIDE WHERE IT IS AND CARRY ON FROM THERE — do not finish
    // it first. Two patches inside a quarter second would otherwise jump the
    // sound to the first patch's settings and then drag it back, an audible
    // lurch caused entirely by the smoothing. `from` is read after the stop, so
    // it is wherever the interrupted move had reached — the same rule the
    // handles follow, which is why they stay a picture of it.
    endLocalGlide?.(false); endLocalGlide = null;
    const from = { ...K };
    const to = {};
    for (const key of KNOBS.map(([k]) => k)) {
      const v = p.m[cmdOf(key)];
      if (v === undefined) continue;
      to[key] = v;
      sliders.get(key)?.set(v, { quiet: true, glideMs: GLIDE_MS });
    }
    // The engine in this tab is on this side of the wire, so a ramp costs
    // nothing but a postMessage a frame — about fifteen of them, none of which
    // leave the tab. The board got ONE `params.set` per parameter above, for
    // the reason in `setKnob`'s own comment.
    endLocalGlide = glide((k) => {
      for (const key of Object.keys(to)) {
        K[key] = from[key] + (to[key] - from[key]) * k;
        pap?.set(`m${cmdOf(key)}`, K[key]);
      }
      showRange();
    }, { ms: GLIDE_MS });
    d.log(`${p.name} · ${p.voice}, ${p.notes.length} notes held`, 'hi');
    render();
  }

  // The name IS the control — press it and the six sounds are a list. It used
  // to be a stepper with the name printed beside it as dead text, so the one
  // thing you read had none of the behaviour you wanted from it.
  const step = createPicker({
    label: 'sound',
    // 🔴 ONE LINE, BECAUSE THIS PAGE HAS A DIAGRAM. A `what` paragraph and a
    // picture of the machinery are two explanations of one thing, and the
    // paragraph is the weaker of them: it describes what a reader can point at
    // an inch below. It is the same sentence the index card carries, so a
    // visitor arriving from there is not told the same thing twice in two
    // different wordings that can drift apart.
    what: 'One granulator, running in this page and on a Raspberry Pi at once, with a blend between them.',
    prev: () => applyPatch(patch - 1),
    next: () => applyPatch(patch + 1),
    // ⚠️ BETWEEN THE PATCHES, NEVER BETWEEN SLIDER POSITIONS. A random point in
    // nine ranges is the middle of all nine almost every time — one wash, every
    // time, which is the thing this page was before.
    random: () => applyPatch(Math.floor(Math.random() * (PATCHES.length - 1)) + patch + 1),
    onPick: (i) => applyPatch(i),
  });
  step.options(PATCHES.map((p) => p.name), 0);
  step.render = () => step.show(PATCHES[patch].name, patch);
  // ⚠️ ABOVE THE SLIDERS, and inserted rather than appended. Choosing the sound
  // comes before moving it, and the sliders are what you reach for second — but
  // the picker cannot be BUILT until `applyPatch` exists, so its position on
  // screen and its position in the file are different things.
  const patchRow = el('div', 'pick');
  patchRow.append(step.el);
  d.el.insertBefore(patchRow, knobRow.el);
  step.render();

  // Two cards, one engine each, side by side — and each one carries its own
  // heading, because a picture that has to be told apart from its neighbour by
  // position is a picture with a legend.
  const panes = el('div', 'panes');
  d.el.append(panes);
  const card = (title, sub) => {
    const box = el('div', 'pane');
    box.append(el('div', 'hd', null));
    box.lastChild.append(el('b', '', title), el('span', '', sub));
    panes.append(box);
    return box;
  };
  // ⚠️ NOT `an AudioWorklet` ANY MORE, AND THE HEADING IS THE CLAIM. This pane
  // runs SuperCollider's own sound server, compiled to WebAssembly, loading the
  // Raspberry Pi's own compiled graph — so the two headings differ in WHERE and
  // in nothing else, which is the whole point of the page.
  const hereCard = card('in this page', 'SuperCollider in a tab · every grain reported');
  // ⚠️ NOT `sound only` — THAT WENT STALE THE DAY THE BOARD LEARNED TO REPORT
  // ITS GRAINS, and the diagram at the top of the page is what caught it. The
  // picture says `sound and grains` come back and the check below asserts
  // exactly that, so a heading two screens down saying the opposite is the
  // page disagreeing with itself about its own subject.
  const boardCard = card('on the Raspberry Pi', 'over the relay · every grain reported');
  const scope = createGrainScope(hereCard, { seconds: 4, height: 150 });
  scope.source('every tick is a grain the engine reported firing');
  const boardScope = createGrainScope(boardCard, { seconds: 4, height: 150 });
  boardScope.source('every tick is a grain the board reported firing');

  // ── the granulator in this page ──────────────────────────────────────────
  //
  // 🔴 IT IS THE BOARD'S GRANULATOR, NOT A COPY OF IT. SuperCollider's own
  // sound server runs here as WebAssembly and loads `pappus-tiny.scsyndef` —
  // the file sclang compiled ON THE PI out of the engine the service runs. Both
  // panes are the same 1,467 building blocks with the same 103 settings; the
  // only difference left is which machine they are on, which is what a page
  // drawing two panes side by side is claiming.
  //
  // 📄 `research/supercollider-browser-2026-09.md` §10 measured all of it
  // first: the graph loads in 11–12 ms, starts, sounds against a silence
  // control that reads exactly 0.000000, and its per-grain reports reach the
  // page at 8.00 / 4.00 / 15.99 a second against the board's 8.0 / 4.0 / 16.0.
  //
  // 🔴 AND PAPPUS IS NOT SELF-CONTAINED — it granulates whatever is on a BUS,
  // filled from outside the definition. On the board that is JACK; in a browser
  // there is no JACK, so a Pappus loaded alone granulates silence. The second
  // definition, `PosSource`, is what fills it, and it is the SAME definition
  // the board runs, fed the same description through the same expander.
  //
  // ⚠️ THE MATERIAL STAYS A TABLE OF SINE PARTIALS, AND THAT IS NOT AN
  // OVERSIGHT. `PosSource.sc`'s own header argues the additive constraint was
  // needed only while the two ends were different engines — which stopped being
  // true today. Relaxing it is a separate decision with its own test: changing
  // the material in the same change that changes the engine means neither can
  // be attributed. The table is what every measurement in `plan-twins.md` was
  // taken with, so it stays until somebody replaces it on purpose.
  //
  // C3 G3 C4 E4 G4 C5.
  const SPEC = { shape: 'saw', count: 12, hz: 130.81, chord: [0, 7, 12, 16, 19, 24], level: 0.16, spread: 0 };

  /**
   * 🔴 THE ACTIVE WINDOW, SET AT BOTH ENDS, AND IT IS TWO CLAIMS AT ONCE.
   *
   * Pappus records into a SIXTY SECOND ring and reads grains out of a window
   * `buflen` seconds long — and `/pgrain`'s `pos` is a fraction of the WHOLE
   * ring, so at `buflen` 8 every mark lands in the left 13% of a picture whose
   * axis is the ring. `winPos` rescales to the window, which is the part
   * anything is reading from, and both panes are drawn through it.
   *
   * ⚠️ AND IT HAS TO BE SET RATHER THAN INHERITED, for the reason everything
   * else here is: the browser engine is FRESH every load and starts with an
   * EMPTY ring, while the board has been recording for hours. A window it can
   * fill in four seconds is what makes the two comparable inside one visit —
   * §10.5's own trap, where the first grain arm read 0.000000 because the
   * grains were reading a part of the buffer nothing had ever written into.
   */
  const RING_SECONDS = 60, WINDOW_SECONDS = 4;
  const winPos = (p) => Math.min(1, Math.max(0, (p ?? 0) * RING_SECONDS / WINDOW_SECONDS));

  let pap = null;                      // the engine, once somebody presses something
  let papStarting = null;              // the in-flight start, so two presses are one boot
  let papGrains = 0;                   // `/pgrain` this page has received from it
  let papSource = null;                // what ITS scsynth answered about the material
  let papPlan = null;                  // the partial table this end was given
  let papDeaf = null;                  // { loud, silent } — the deafness control
  /** stops the patch glide below; `true` sends it to the end rather than freezing it */
  let endLocalGlide = null;
  /**
   * When each `/pgrain` landed, so a RATE can be taken over a window this page
   * actually watched — the same collector shape the board's marks use, and for
   * the same reason: a running total over a start time puts the seconds before
   * the engine existed into the denominator.
   */
  const papLog = [];

  /**
   * The lit band: where in the window the grains are reading from.
   *
   * 🔴 AN ABSOLUTE PLACE IN THE RECORDING, NOT A DISTANCE BEHIND THE WRITE
   * HEAD. `where` used to mean two different things — the old worklet ran a
   * fixed distance behind the write head while the same number went to the
   * board as `mscan` with `mscanmode` never set at all, and Pappus's default
   * mode is 1 STRETCH, where `mscan` is a playhead SPEED mapped −1..+2. One
   * slider, one number, three meanings. 2 POSITION is the only mode under which
   * the slider's label, both engines and the grain reports are the same claim,
   * and it is now set on both.
   */
  function showRange() {
    const centre = ((K.where % 1) + 1) % 1;
    const half = K.spray;
    const band = [((centre - half) % 1 + 1) % 1, ((centre + half) % 1 + 1) % 1, centre];
    scope.range(...band);
    boardScope.range(...band);
  }

  /**
   * Boot the engine in this tab, once, and put everything the sound depends on
   * into it.
   *
   * ⚠️ IT IS SLOW ON PURPOSE AND IT IS BEHIND CONTROL 0. A wasm boot, thirty-one
   * buffer allocations and a 64 KB `/d_recv` is exactly the work `verify.mjs`
   * only gives a settle budget to the FIRST control — so `Switch it on` owns it,
   * and nothing here runs on a visit where nobody pressed anything.
   */
  function startLocal() {
    if (pap) return Promise.resolve(pap);
    if (papStarting) return papStarting;
    papStarting = (async () => {
      // The board's playout context first, so both engines share one clock and
      // the blend is a blend rather than two independent outputs.
      await startAudio();
      const e = await startPappus({
        audioContext: ctx || undefined,
        log: (m) => d.log(m),
        // EVERY GRAIN, FROM THE THING THAT FIRED IT. `SendReply` on the grain
        // trigger inside the graph — the same UGen the board's reports come
        // out of, with no relay in the path.
        onGrain: (g) => {
          papGrains++;
          papLog.push(performance.now());
          while (papLog.length > 2 && papLog[0] < performance.now() - 12000) papLog.shift();
          scope.mark({ pos: winPos(g.pos), half: g.half, level: 1 });
        },
      });
      pap = e;
      // ⚠️ THE ENGINE OWNS ITS CONNECTION TO THE SPEAKERS, not this page — a
      // dangling output is a worklet nothing pulls, and this engine services
      // `/b_alloc` inside that worklet. All the page gets is the gain.
      fadeGains();
      if (!e.started) { d.log('the graph would not start in this browser', 'bad'); return e; }
      // ⚠️ IF NOTHING HAS WRITTEN THE RECORD YET, WRITE IT NOW. `applyPatch`
      // normally does, but it only runs once the BOARD has answered — and this
      // engine needs no board at all. A visitor who drags the blend with the Pi
      // switched off must not get a granulator sitting at the engine's own
      // defaults.
      if (!SENT.size) writePatch(PATCHES[patch]);
      // 🔴 EVERY SETTING, REPLAYED. A fresh engine's defaults are the ENGINE's,
      // not the last visitor's — which is the one way this end differs from the
      // board — so the page's own record of what it has sent is flushed into
      // it. That record is the SAME one the board is driven from.
      flushSettings();
      const src = await e.setSource(SPEC);
      if (!src?.ok) d.log(`the engine would not build the material: ${src?.reason}`, 'bad');
      papPlan = src?.plan ?? null;
      papSource = await e.askSource();
      // ⚠️ ASKED FOR — `report` is OFF by default, and the picture is the whole
      // reason this pane exists.
      e.report(true);
      showRange();
      d.log(`SuperCollider in this page is chewing the same description`
        + `${papSource ? ` · its own engine answers ${papSource.voices} notes at ${Math.round(papSource.hz)} Hz` : ''}`, 'hi');
      render();
      return e;
    })().catch((err) => { d.log(`no SuperCollider in this page: ${err.message}`, 'bad'); return null; });
    return papStarting;
  }

  // ── one set of knob values, and ONE PATH TO BOTH ENGINES ─────────────────
  const K = { rate: 2.2, size: 0.3, where: 0.5, spray: 0.12 };

  /**
   * Every stage BETWEEN the granulator and the master, held at zero.
   * ⚠️ These names are the engine's, and the numbers are "no contribution" for
   * each: a wet mix, a feedback, a drive.
   */
  const BYPASS = {
    pwet: 0,        // RESONATOR — the modal bank, which TINY compiles out anyway
    swet: 0, sfb: 0,   // DELAY
    drive: 0, crush: 0, loss: 0, noise: 0,   // COLOUR
    rverb: 0, rshimmer: 0,                   // REVERB
  };

  /**
   * 🔴 ONE PATH FOR EVERY SETTING THE SOUND DEPENDS ON, AND IT IS THIS.
   *
   * The two ends run the same definition, so they take the same command names —
   * `mrate`, `msize`, `mscan`, `mspray`, `mscanmode`, `msrc`, `mlock`, every
   * `BYPASS` stage. A second control path for the browser would be a second
   * place for the two to disagree, which is the confound this whole page exists
   * to remove, and it would be invisible because both panes would still work.
   *
   * ⚠️ AND `SENT` IS THE PAGE'S OWN RECORD, WHICH IS WHAT MAKES IT SAFE FOR TWO
   * ENDS THAT COME UP AT DIFFERENT TIMES. The board answers in about forty
   * seconds on a cold visit; the engine in this tab takes a second or two. A
   * value sent while one of them was not listening would simply be missing
   * there — so each end replays the whole record when it arrives, and the
   * record is complete because everything goes through here.
   *
   * 🔴 THE BOARD IS AN OBJECT THAT KEEPS WHAT IT WAS LEFT WITH, AND THE TAB IS
   * NOT. `msrc 1` does not pause the write, it ERASES (LESSONS #46), so a
   * visitor who pressed Hold and closed the tab used to hand the next one an
   * empty buffer. A page driving this board sets every control its sound
   * depends on, every time, or it works exactly once.
   */
  const SENT = new Map();
  /**
   * A whole patch into the record, and from there into whichever ends exist.
   *
   * 🔴 IT IS SEPARATE FROM `applyPatch` BECAUSE THE BOARD MIGHT NEVER ANSWER.
   * `applyPatch` also releases a chord, changes the instrument and asks the
   * board for its drift — all of which need a board. The SETTINGS do not, and
   * the engine in this tab is a whole granulator on its own. Without this split
   * a visitor who dragged the blend with the Pi switched off got an engine
   * running at the ENGINE's defaults: `run` 0, `msos` 0, `report` off — a left
   * pane that is silent and draws nothing, on a page that looks fine.
   */
  function writePatch(p) {
    for (const [k, v] of Object.entries(p.m)) forBoth(`m${k}`, k === 'sos' ? Math.max(SOS, v) : v);
    for (const [k, v] of Object.entries(p.n)) forBoth(`n${k}`, k === 'sos' ? Math.max(SOS, v) : v);
    setFixed();
  }
  function forBoth(cmd, value) {
    SENT.set(cmd, value);
    // ⚠️ AN ARRAY IS STILL ONE SETTING. `gates` and `probs` are eight-element
    // control arrays; the box takes 1..48 numbers in `args`, and the engine in
    // this tab needs `/n_setn` rather than `/n_set` — see `engine.mjs`.
    if (fxOn) send({ type: 'params.set', cmd, args: Array.isArray(value) ? value : [value] });
    pap?.set(cmd, value);
  }
  /** Board only — the other end has no such command. See `setFixed()`. */
  function forBoard(cmd, value) {
    if (fxOn) send({ type: 'params.set', cmd, args: Array.isArray(value) ? value : [value] });
  }
  /** Replay the record into the engine in this tab, when it finally exists. */
  function flushSettings() { for (const [cmd, v] of SENT) pap?.set(cmd, v); }

  /**
   * Everything that is not a slider and not a patch: the settings that decide
   * what the four knobs MEAN, sent to both ends every time.
   *
   * ⚠️ `mscanmode 2` POSITION, because the engine's default is 1 STRETCH where
   * `mscan` is a speed and not a place. ⚠️ `msrc 2` STEREO, because 1 is OFF and
   * OFF erases. ⚠️ `msos` 0.6, the first value that is all grains — at 0 the
   * stage hands its input straight back and there is not one grain in it.
   * ⚠️ `mbuflen`, so the tab's empty ring fills inside a visit. ⚠️ `amp`,
   * `ingain` and `run`, which the board's own startup sets and a fresh engine
   * does not.
   */
  function setFixed() {
    for (const h of ['m', 'n']) {
      forBoth(`${h}scanmode`, 2);
      forBoth(`${h}src`, held ? 1 : 2);
      forBoth(`${h}lock`, held ? 1 : 0);
      forBoth(`${h}sos`, SOS);
      forBoth(`${h}buflen`, WINDOW_SECONDS);
    }
    forBoth('amp', 1);
    forBoth('ingain', 1);
    forBoth('run', 1);
    // 🔴 THE EIGHT VOICE GATES, AND THIS IS THE ONE THAT COST A RED SUITE.
    //
    // `gates` decides whether ANY grain fires: the engine's trigger is
    // `trig * (gates[i] > 0.001) * coin * egate`, so all-zeros is a granulator
    // that never fires one — and PASSTHROUGH STILL WORKS, so the board goes on
    // streaming audio and answering every question while making no grains.
    // MEASURED 2026-09-14: the page's exact configuration read `rms 0.000000,
    // 0 grains/s` over 299 frames; writing these eight numbers took it to
    // `0.016037` and 1.5 grains/s in the same sitting, with nothing else
    // changed.
    //
    // ⚠️ AND NOTHING HERE WAS EVER GOING TO REOPEN THEM. The board's eight
    // granulator voices are played like a keyboard (`makeVoices` in
    // `pappus.mjs`), it starts with every gate SHUT, and `note.off` and
    // `note.panic` shut them again — while this page's notes go to the
    // INSTRUMENT, never to the granulator. So one `note.panic` from anybody, at
    // any time, silenced this page for ever after, and the page could not say
    // why. That is the `msrc 1` lesson exactly, on the one control that decides
    // whether the instrument exists at all.
    //
    // ⚠️ The board WAS saying so the whole time — `params.state` returns
    // `notes.gate`, and it read `[0,0,0,0,0,0,0,0]`. The evidence was on the
    // wire and no page read it; the grain assert below now prints it.
    forBoth('gates', [1, 0, 0, 0, 0, 0, 0, 0]);
    forBoth('gates2', [1, 0, 0, 0, 0, 0, 0, 0]);
    forBoth('probs', [1, 1, 1, 1, 1, 1, 1, 1]);
    forBoth('probs2', [1, 1, 1, 1, 1, 1, 1, 1]);
    // 🔴 AND THE SIXTEEN-STEP EUCLIDEAN GATE, WHICH A DIE CAN LEAVE SPARSE.
    // `rollPappus` writes `epattern` (pappus.mjs: "AND THE PATTERN MUST FIRE"),
    // so a page that adopts a board somebody rolled can inherit a granulator
    // firing one grain in sixteen. Measured harmless here — the board's was
    // already all ones — and set anyway, because "it happened to be right" is
    // not a reason to depend on it.
    // ⚠️ BOARD ONLY, AND THE ASYMMETRY IS REAL RATHER THAN AN OVERSIGHT: on the
    // board this is a COMMAND that writes a buffer (`patbuf.setn`), not a
    // SynthDef control, so there is nothing for `/n_setn` to name at the other
    // end. The browser's equivalent is `engine.mjs` filling the same two gate
    // buffers with ones at boot, which it does.
    forBoard('epattern', new Array(16).fill(1));
    forBoard('epattern2', new Array(16).fill(1));
    // 🔴 EVERY STAGE DOWNSTREAM OF THE GRANULATOR PINNED TO OFF. This page's
    // subject is one granulator against another, and a stage left on by the
    // last visitor is heard in one pane and reported as if the granulators had
    // made the difference. ⚠️ Both ends now, because both ends have the chain.
    for (const [cmd, v] of Object.entries(BYPASS)) forBoth(cmd, v);
  }

  /**
   * One knob, both engines, one path.
   *
   * ⚠️ `live` IS WHETHER THE HAND HAS STOPPED, AND IT ONLY GATES THE RELAY. A
   * drag is ~60 events a second into a relay whose measured ceiling is 60 msg/s
   * for everything on it, and it drops past that SILENTLY — so the value you
   * let go on would be the one lost. The engine in this tab has no wire in
   * front of it and a change is audible in one render quantum, so it takes
   * every move. Both end up on the same number; only the cadence differs.
   */
  function setKnob(key, v, why, unit, settled) {
    // ⚠️ FINISH IT, DO NOT FREEZE IT. A hand on one knob during a patch glide
    // has to win — but abandoning the glide where it stands would leave the
    // other three parameters half way between two patches while their handles
    // already show the new numbers, which is the page lying about its own
    // sound. Jump the rest to the patch, then take the drag.
    endLocalGlide?.(true); endLocalGlide = null;
    K[key] = v;
    const other = partner(key, v);
    setLive(key, v, other);
    const cmd = cmdOf(key);
    if (settled) {
      forBoth(`m${cmd}`, v);
      forBoth(`n${cmd}`, other);
      d.log(`${key} ${v} and ${round(other)} for the second granulator${unit ? ' ' + unit : ''} · ${why}`
        + (fxOn ? '' : ' · the board’s granulator is not on yet'), fxOn ? undefined : 'warn');
    } else {
      // Mid-drag: the record still moves, so a hand that never settles cannot
      // leave the two ends holding different numbers — the relay is simply not
      // told until it stops.
      SENT.set(`m${cmd}`, v); SENT.set(`n${cmd}`, other);
      pap?.set(`m${cmd}`, v); pap?.set(`n${cmd}`, other);
    }
    showRange();
  }

  // Both engines are always running; the blend only moves what you HEAR. The
  // pictures never swap, so nothing has to be cleared and neither lane's
  // history is thrown away when you compare them.
  const fade = createSlider({
    // 🔴 NO LABEL. Its ENDS are labelled — `this page` on one side, `the board`
    // on the other — so a third word between them said nothing the row was not
    // already saying, and printed `THIS PAGE  BLEND 0 %  THE BOARD`: three
    // labels for one control, the middle one stacked over its own number and
    // squeezing the track down to a stub. A slider between two named ends does
    // not need a name; it needs room.
    // ⚠️ `aria` still gets one, because a screen reader has no ends to read.
    label: '', aria: 'blend', min: 0, max: 100, step: 1, value: 0, unit: '%',
    // The slider IS the gesture, so it is also what starts the engine in this
    // tab — an AudioContext needs one and this is the first thing a hand
    // touches. ⚠️ It is also 1.7 MB of WebAssembly, which is why nothing here
    // is fetched until somebody moves this or presses `Switch it on`.
    onInput: (v) => { blend = v / 100; startLocal().then(fadeGains); fadeGains(); render(); },
  });
  // ── what they are chewing ────────────────────────────────────────────────
  // Two controls, and they are the two that are EXACT in any engine: which
  // table of partials, and how many of it survive. Everything else about a
  // shape — the rolloff near Nyquist, the phase — is an implementation, which
  // is why `source.mjs` does not offer it.
  const shapeRow = createChoice({
    label: 'material',
    options: Object.keys(SHAPES).map((k) => [k, k]),
    at: Object.keys(SHAPES).indexOf(SPEC.shape),
    onPick: (v) => setSource({ shape: v }),
  });
  const brightness = createSlider({
    label: 'partials', min: 1, max: 24, step: 1, value: SPEC.count, unit: '',
    onInput: (v) => setSource({ count: v }),
  });
  /**
   * The material, to both ends, from one description.
   *
   * 🔴 ONE SPEC, ONE EXPANDER, TWO ENGINES. `demo/shell/source-args.mjs` turns
   * the spec into the amplitude table, the semitone array and the three
   * scalars `PosSource` wants, and BOTH ends call it — the box on its way to
   * sclang, this page on its way to its own scsynth. A second copy of that
   * arithmetic would be two authorities on one number, which is what the
   * shared `partialsOf` already exists to prevent one level down.
   */
  async function setSource(next) {
    Object.assign(SPEC, next);
    // The board builds the same spec from the same numbers — one message, on a
    // change rather than on every move, for the relay's sake.
    send(sourceMessage(SPEC));
    const re = await pap?.setSource(SPEC);
    if (re && !re.ok) { d.log(`the engine in this page refused the material: ${re.reason}`, 'bad'); return; }
    if (re?.ok) { papSource = await pap.askSource(); papPlan = re.plan; }
    d.log(`material: ${SPEC.shape}, ${re?.plan ? re.plan.partials.length : '—'} sine partials`
          + `${re?.plan?.dropped ? `, ${re.plan.dropped} dropped above Nyquist` : ''}`);
  }
  const srcBar = el('div', 'pos-controls');
  srcBar.append(shapeRow.el, brightness.el);
  panes.before(srcBar);

  // UNDER the two cards, not above them: it is the line BETWEEN the panes, so
  // it belongs where the eye already is after reading both of them.
  const fadeBar = el('div', 'pos-controls fade');
  fadeBar.append(el('span', 'end', 'this page'), fade.el, el('span', 'end', 'the board'));
  panes.after(fadeBar);

  // ── drawing ──────────────────────────────────────────────────────────────
  const secs = (ms) => `${Math.round(ms / 1000)} s`;
  // The board rounds to three decimals; a tenth of a grain a second is already
  // finer than anyone can hear, and 8.908 in a readout cell reads as precision
  // somebody is claiming rather than as a rate.
  const rate = (side) => (side.rate >= 10 ? side.rate.toFixed(0) : side.rate.toFixed(1));
  function materialShort() {
    if (!answered) return null;
    if (playing) return playing;          // whatever the board says is up
    return 'nothing';
  }
  function materialLong() {
    if (!answered) return null;
    if (playing) return [el('b', '', playing), ' · playing into the granulator, and the patch holds its own chord'];
    return [el('b', '', 'nothing'), ' · the board has no sound running, so the granulator has an empty recording to read'];
  }

  function render() {
    // ── the readout ──
    // `answers` rather than `answering`, and `1.1+2.1` rather than `1.1 + 2.1`:
    // two characters each, and the difference between a cell that reads and a
    // cell that ends in an ellipsis on a phone. Measured at 390 px.
    // the board moving ON ITS OWN — nobody asked for these, which is the point
    const mv = driftMoved();
    d.set('nudges', mv ? mv.nudges : '');
    d.set('reading at', Number.isFinite(drift?.scan) ? drift.scan.toFixed(2) : '');
    d.set('board', answered ? 'answers' : 'silent', answered ? 'ok' : 'bad');
    if (!frames) d.set('sound', 'nothing', answered ? 'bad' : undefined);
    else if (level < 0.002) d.set('sound', 'silent');
    else d.set('sound', `${Math.round(20 * Math.log10(level))} dB`, 'ok');
    // ⚠️ NOT A BARE `drift.nudges`. With nothing for the board to circle that
    // cell is 0 on every frame of every run — a structural constant wearing a
    // measurement's clothes, which is the `missed: 1` bug in 01 (CLAUDE.md:
    // every readout cell must be able to change). The word says which of the
    // three states it is in, and only the state with a real count prints one.

    // ── the material row ──

    // ── the panel: the roll, or the silence ──
    // ⚠️ FOUR NAMED STATES, NOT TWO, AND THE THIRD ONE COST A RED SUITE. The
    // board can be answering with its granulator NOT RUNNING — which is what a
    // cold board looks like for the forty seconds it spends compiling a
    // two-thousand line engine — and a page that only knows "playing" and
    // "nobody home" describes that as the first one and reads as broken. Each
    // of the four says what it is and what would change it.
    panel.replaceChildren();
    const st = !answered ? 'silent' : switching ? 'warming' : !fxOn ? 'off'
      : !playing ? 'empty' : 'live';
    panel.dataset.state = st;
    if (st !== 'live') {
      const b = el('div', 'none');
      const say = {
        silent: ['Nobody is answering',
          `nothing has replied in “${ROOM}”. The board is a Raspberry Pi that dials out to this room on its own; it has to be `
          + 'switched on and running, and it cannot be woken from here. Everything below would be a number about a sound that '
          + 'is not being made, so there are no numbers.'],
        warming: ['Switching the granulator on',
          'the board is answering. The first time it is asked, it compiles a two-thousand line engine before anything can be '
          + 'heard, which takes about forty seconds; after that a switch is instant.'],
        off: fxWhy
          ? ['The board would not switch it on', `the board refused: ${fxWhy}`]
          : fxBy && fxBy !== me && fxTakenAt
            // ⚠️ SAY THAT SOMEBODY ELSE DID IT. "It is off" and "another window
            // turned it off nine seconds ago" are the same sentence about two
            // very different situations, and only one of them has an answer.
            ? ['Another page took the granulator out',
               `the board is shared, and another window asked for the granulator to come out of the sound `
               + `${Math.max(1, Math.round((Date.now() - fxTakenAt) / 1000))} seconds ago. Press “Switch it on” to put it back. `
               + 'It will stay while this page is open.']
            : ['The granulator is not in the sound', 'press “Switch it on”. The board compiles the engine the first time, which takes about forty seconds'],
        // It records its input, so with no input it is reading sixty seconds of
        // silence. That is not a fault and it is not a sound either, and it
        // happens whenever somebody else stops the board's instrument.
        empty: ['Nothing is going into it',
          'the granulator is running and the board has no instrument playing, so all it has to read is the last sixty seconds '
          + 'of silence. Press one of the material buttons above'],
        idle: ['Nothing is rolled yet',
          'the granulator is running and has been given no settings, so there is nothing to describe. Press “Roll the dice”'],
      }[st];
      b.append(el('b', '', say[0]), el('span', '', say[1]));
      panel.append(b);
      return;
    }
    // ⚠️ THE PATCH, NOT THE BOARD'S LAST ROLL. `params.state` answers with the
    // last DICE ROLL, and this page no longer rolls — it sets each parameter
    // directly. Drawing the roll's names beside a patch that overwrote them is
    // a readout describing settings that left the sound minutes ago.
    const p = PATCHES[patch];
    const box = el('div', 'roll');
    for (const [k, side] of [['one', live.m], ['two', live.n]]) {
      const s = el('div', 'side');
      // ⚠️ NO PATCH NAME IN HERE. It was printed in BOTH halves and is now in
      // the picker as well — the same two words three times, and the one thing
      // in the block that is identical between the two halves, in a block whose
      // entire job is showing how they differ.
      // ⚠️ THREE FIGURES, NOT A SENTENCE ABOUT THEM. This ran the three
      // together with joining words and wrapped to three lines that reflowed as
      // the numbers changed width. Same facts, one per line, each line a fixed
      // shape — so a digit changing changes a digit and nothing moves.
      s.append(el('span', 'hd', `granulator ${k}`),
               el('span', 'nums', `${side.rate} grains a second`),
               el('span', 'nums', `${Math.round(side.size * 1000)} ms long`),
               el('span', 'nums', `reading at ${side.scan.toFixed(2)}`));
      box.append(s);
    }
    panel.append(box);
    // 🔴 TWO GENERATED PARAGRAPHS REMOVED, AND THEY WERE THE WORST KIND. One
    // said "both are chewing the same saw — 72 sine partials over 6 notes, made
    // separately at each end from one description"; the other, "moving on its
    // own · 53 nudges in the 8 s this page has been watching, none of them asked
    // for · the slow one is reading at 0.416 of the way through the sixty
    // seconds". Every number in them is real and both rewrote themselves
    // continuously, reflowing between two and three lines and shoving the whole
    // page down each time. Called what it was: slop prose.
    //
    // The failure is not the wording, it is the FORM. A page narrating its own
    // state in sentences has to re-say the unchanging part ("of the way through
    // the sixty seconds") beside the one number that moved, so the reader
    // re-reads a paragraph to find a digit — and the line rewraps while they
    // do it. These are all readout cells and lane gutters, which is where this
    // project puts a moving figure and why those are fixed-width boxes.
    //
    // What they said that is worth keeping is kept: the shared-material claim
    // is an ASSERT ("both granulators are chewing the same description, and the
    // board's engine says so"), which is where a claim belongs, and the drift
    // is logged when it CHANGES rather than narrated every frame.
  }

  // ── audio out of this page ───────────────────────────────────────────────
  let ctx = null, playout = null, boardGain = null;
  async function startAudio() {
    if (ctx) return;
    try { await openAudio(); }
    // ⚠️ NEVER LET THE SPEAKERS TAKE THE PAGE DOWN. Everything measured here is
    // read off the socket, so a browser that will not give this page an audio
    // output still answers every question the page asks — but an unhandled
    // rejection would reach guard() and mark the whole demo failed.
    catch (e) { ctx = null; d.log(`no sound out of this page: ${e.message}`, 'bad'); }
  }
  async function openAudio() {
    // ⚠️ ASK FOR 48 kHz. The board fixes 48000 and the worklet writes those
    // samples into a ring drained at this context's own rate, so on a 44.1 kHz
    // output the pitch is wrong by the ratio AND the ring overruns several
    // times a second — periodic clicking, with every counter on this page
    // reading green throughout.
    ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000, latencyHint: 'interactive' });
    if (ctx.sampleRate !== 48000) {
      d.log(`this browser runs audio at ${ctx.sampleRate} Hz and the board sends 48000. Pitch will be off by `
            + `${(48000 / ctx.sampleRate).toFixed(3)}x and you will hear clicks`, 'bad');
    }
    // ⚠️ Fire and move on. resume() waits on a user gesture in a real browser
    // and never rejects, so awaiting it is a hang rather than an error — and
    // the measurements below do not need it, because they read the frames off
    // the socket rather than out of the speakers.
    ctx.resume().catch(() => {});
    await ctx.audioWorklet.addModule('/proto/jam/playout-worklet.js');
    playout = new AudioWorkletNode(ctx, 'pcm-playout', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [1] });
    // ⚠️ A GAIN, NOT A STOPPED WORKLET. The board keeps sending while this page
    // is listening to its own engine, and a playout that was torn down and
    // rebuilt on every switch would re-run its whole cushion-filling start-up —
    // the part that trims audio when occupancy passes floor + slack (LESSONS
    // #52). Turning it down leaves the cushion where it was.
    boardGain = ctx.createGain();
    playout.connect(boardGain).connect(ctx.destination);
    fadeGains();
    playout.port.postMessage({ cmd: 'floor', ms: 60, adaptive: false });
  }

  function onPcm(buf) {
    const s = new DataView(buf).getUint32(0, true);
    if (lastSeq >= 0 && s > lastSeq + 1) gaps += s - lastSeq - 1;
    lastSeq = s; frames++;
    // Audio is the board too, and the loudest possible proof of it: a room with
    // nothing in it cannot produce a PCM frame.
    lastHeard = Date.now();
    if (!firstFrame) { firstFrame = performance.now(); answered = true; render(); }
    const pcm = new Int16Array(buf, 12);
    const f32 = new Float32Array(pcm.length);
    let peak = 0;
    for (let i = 0; i < pcm.length; i++) { const v = pcm[i] / 32768; f32[i] = v; const a = v < 0 ? -v : v; if (a > peak) peak = a; }
    // 🔴 THE SAME SCOPE `cloud` USES, AND IT DRAWS THIS DIFFERENTLY ON PURPOSE.
    // The board sends audio and no grain events, so nothing here can say that a
    // bump in the envelope WAS a grain — it might be a note, a delay tap or a
    // reverb swell. So these are hollow slate marks labelled "inferred from the
    // sound", against `cloud`'s filled green ones, and the gutter says which.
    //
    // ⚠️ THIS IS ALSO THE INSTRUMENT THAT WAS MISSING. On 2026-09-12 no
    // granulator parameter on this board could be shown to change the returned
    // audio — `mrate` 0.5 against 24, `pwet` 0 against 1, `melen` 1 against 8,
    // all identical — and the sharpest number in that whole investigation was
    // that the envelope NEVER dropped below a quarter of its own median at any
    // setting, i.e. the sound is continuous and therefore not a grain cloud. A
    // picture of the envelope says that in one look, in the page, without an
    // ssh session.
    boardScope.feed(f32, 48000);
    // ⚠️ THE LEVEL IS THE ONLY THING THAT CAN TELL A WORKING STREAM FROM A
    // STREAM OF DIGITAL SILENCE, and this project has read three numbers wrong
    // for exactly that reason. It decays rather than resetting, so a cloud
    // between grains does not read as a dead board.
    const t = performance.now();
    level = Math.max(peak, level * Math.pow(0.5, (t - levelAt) / 400));
    levelAt = t;
    collect?.(peak);
    playout?.port.postMessage({ pcm: f32 }, [f32.buffer]);
    // Fifty frames a second is ONE source. Anything missing is the relay's own
