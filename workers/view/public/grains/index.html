    // bucket dropping them — which is what two instruments streaming into one
    // socket sounds like — and the sender is told nothing at all when that
    // bites, so a counter here is the only place it can be seen.
    if (!gapWarned && frames > 250 && gaps > frames * 0.02) {
      gapWarned = true;
      const fps = frames / Math.max(0.001, (performance.now() - firstFrame) / 1000);
      d.log(`${gaps} frames never arrived out of ${frames + gaps}, and ${fps.toFixed(0)} a second are getting through`
            + '. The relay is dropping them, and it sounds like clicks', 'bad');
    }
    if (frames % 25 === 0) render();
  }

  /**
   * Loudest thing that arrives in a window, and HOW MANY FRAMES ARRIVED.
   *
   * 🔴 THE FRAME COUNT IS NOT DECORATION. A peak of 0 means "silence" and it
   * also means "nothing reached this page", and those are opposite findings: one
   * is a board making no sound and the other is a relay, a socket or a second
   * browser of mine getting in the way. Measured the hard way — a run of this
   * page read `0.0000 with it up, 0.0000 with it down` with a stray headless
   * Chrome of mine still holding the room, which is CLAUDE.md's own warning
   * arriving as a red assert about the board.
   */
  async function listen(ms) {
    let p = 0, n = 0;
    collect = (v) => { n++; if (v > p) p = v; };
    await wait(ms);
    collect = null;
    return { peak: p, frames: n };
  }

  // ── the socket ───────────────────────────────────────────────────────────
  // openWire rather than a hand-rolled socket: it reconnects, it mints a new
  // `from` per connection, and it refuses to send a payload field that the
  // envelope would overwrite — which is the bug that made `source.load`'s only
  // control silently do nothing for a day.
  const waiters = [];
  const wire = openWire(ROOM, {
    onOpen: (from) => { me = from; d.log(`joined ${ROOM}`, 'hi'); hello(); send({ type: 'audio.status' }); },
    onClose: () => { d.log('socket closed · reconnecting'); },
    onMessage: (got) => {
      if (got.kind === 'binary') { onPcm(got.data); return; }
      if (got.kind !== 'json' || got.msg.from === me) return;
      heard(got.msg);
    },
  });
  const send = (m) => !!wire.send(m);
  /**
   * Send, and keep the id that went out.
   *
   * ⚠️ FOLLOWING THE BOARD'S ANSWERS IS RIGHT; ACTING ON SOMEBODY ELSE'S IS NOT,
   * and the difference cost twelve requests to a stranger's archive. The relay
   * broadcasts, so a reply to another listener's `source.search` arrives here
   * too — and this page's handler turned every one of them into a `source.load`
   * of its own. Twelve loads went out for one press, each one a minute of ERR's
   * bandwidth, which is precisely how this board got itself blocked once
   * already. State may be read from any of the board's answers; an ACTION may
   * only follow an answer to a question this page asked, which is what `re` is
   * for. `wire.send` hands back the exact line, so the id is readable from it.
   */
  const sendId = (m) => { const out = wire.send(m); return out?.sent ? JSON.parse(out.line).id : null; };

  /**
   * The heartbeat, and the round trip, on one message.
   *
   * ⚠️ NOT `box.ping`, AND STILL NOT AFTER IT WAS REPAIRED. The board's pong
   * was `reply('box.pong', { at: … })`, `at` is an envelope field, so the
   * envelope refused to format it and the handler answered `box.error`. The
   * obvious round trip verb answered NOTHING for two sessions and a page timing
   * it read an empty cell forever. `rig/box/box.mjs` sends `pongAt` since
   * 2026-09-18, which is in the repo and NOT yet on the board. This page still
   * does not use it: `params.state` is the cheapest verb that always answers,
   * answers with no work behind it, and is worth asking anyway, so the round
   * trip is timed on a question this page was going to ask regardless. That
   * costs the board one fewer message either way.
   */
  function hello() {
    stateAt = performance.now();
    stateId = sendId({ type: 'params.state' });
  }

  /**
   * Wait for the next reply of a type. Resolves null on a timeout rather than
   * hanging: a page that waits forever looks like a page that is still loading,
   * and "nobody answered" is the answer this page most often has to give.
   */
  function waitFor(type, ms, re = null) {
    return new Promise((resolve) => {
      const w = { type, re, resolve };
      w.timer = setTimeout(() => { waiters.splice(waiters.indexOf(w), 1); resolve(null); }, ms);
      waiters.push(w);
    });
  }
  async function ask(msg, type, ms = 8000) {
    // The id first, so the wait is for THIS answer rather than for the next
    // message of the same shape — which on a shared board can be the reply to
    // somebody else's question, or their question itself.
    const id = sendId(msg);
    if (!id) return null;
    return waitFor(type, ms, id);
  }

  /**
   * ⚠️ A QUESTION AND ITS ANSWER CARRY THE SAME `type` ON THIS RELAY, AND THAT
   * IS NOT A DETAIL — it is the bug that made this page report "10 nudges in
   * 1 s" about a board that had moved 2,800 times. The relay is a broadcast:
   * every client sees every other client's traffic, and the box answers
   * `{type:'params.state', ok, roll, drift}` to a request that is itself
   * `{type:'params.state'}`. So another listener merely ASKING looked exactly
   * like the board answering with no granulator, and this page dutifully wiped
   * everything it knew. Measured on the live room: nine `params.state` messages
   * in four seconds, four of them other people's questions.
   *
   * The box stamps every answer with `re`, the id of the message it answers —
   * which is how `pappus-live.mjs` has always matched replies — and its four
   * unprompted announcements are named here. Nothing else is the board talking.
   */
  // ⚠️ `grain.marks` IS THE FIFTH, and leaving it out cost a green page with an
  // empty card. It is BROADCAST — the board ships four a second to whoever is
  // in the room, so it carries no `re` and this filter dropped every one of
  // them before the handler below ever saw it. The relay was measured carrying
  // 13 of them in the same minute the page reported `0 reported by the board`.
  // A filter whose job is to ignore other people's chatter will ignore an
  // announcement nobody told it about, silently and for ever.
  const ANNOUNCED = new Set(['box.hello', 'box.alive', 'audio.stopped', 'video.stopped', 'grain.marks']);
  const fromBox = (m) => typeof m.re === 'string' || ANNOUNCED.has(m.type);

  function heard(m) {
    if (!fromBox(m)) return;           // somebody else asking the board something
    answered = true; lastHeard = Date.now();
    // 🔴 THE BOARD'S OWN ACCOUNT OF ITS INSERT, WHEREVER IT ARRIVES. `fx` rides
    // on `fx.pappus`, on `audio.started` and on the heartbeat, so the only
    // thing this needs to know is that the field turned up and what it says.
    // ⚠️ ONLY ON A CHANGE, and only when it was somebody else. A line every
    // five seconds saying the same thing buries the log, and a page narrating
    // its own unchanged state in sentences is the thing this page deleted two
    // paragraphs of.
    if (m.fx !== undefined) {
      const nowIn = m.fx === 'pappus';
      const mine = m.fxBy === me;
      if (fxOn !== nowIn && !mine) {
        fxTakenAt = Date.now();
        d.log(nowIn
          ? 'another page put the granulator back in the sound'
          : 'another page took the granulator out of the sound. Press “Switch it on” to put it back',
          nowIn ? 'hi' : 'warn');
      }
      fxOn = nowIn;
      fxBy = m.fxBy ?? null;
    }
    // The board has spoken, so there is something to switch on. Once.
    if (!enabledOnce) { enabledOnce = true; enable(); }
    // The board says this every five seconds with nobody asking, which makes it
    // the cheapest liveness there is — and it names what is sounding, so an
    // instrument somebody else starts shows up here without this page polling
    // for it. Only a CHANGE costs a question.
    if (m.type === 'box.alive') {
      if ((m.audio ?? null) !== playing) send({ type: 'audio.status' });
      if (!m.audio) playing = null;
    }
    if (m.type === 'audio.stopped') { playing = null; send({ type: 'audio.status' }); }
    if (m.type === 'box.hello') { d.log(`${m.name || 'the board'} is here`, 'hi'); hello(); send({ type: 'audio.status' }); }
    if (m.type === 'audio.started') {
      const was = playing;
      if (m.ok) {
        playing = m.source;
        // An insert can only reach what is on the board's audio graph. The
        // board reports that about the source rather than the page keeping a
        // list of names, which is a list somebody always forgets to extend.
        onJack = m.jack === true;
        fxOn = m.fx === 'pappus';
        if (m.source !== was) d.log(`the board is playing ${m.source}${onJack ? '' : ', which the granulator cannot reach'}`, 'hi');
      } else {
        playing = null;
        if (m.reason !== 'nothing playing') d.log(`the board could not start it: ${m.reason}`, 'bad');
      }
      // ⚠️ ONLY A REPLY ABOUT THE THING THAT WAS ASKED FOR STOPS THE WAITING
      // MARK. This used to clear it on any `audio.started`, and the four-second
      // heartbeat is an `audio.status` — so a press of an instrument button went
      // back to looking idle a moment later while the board was still raising
      // the chain, which reads as a dead button.
      if (wantSource && (m.source === wantSource || !m.ok)) {
        wantSource = null;
      }
    }
    if (m.type === 'fx.pappus') {
      fxOn = !!m.on; fxWhy = m.ok ? null : m.reason; fed = m.fed ?? null;
      d.log(m.ok ? (fxOn ? 'the granulator is in the sound' : 'the granulator is out of the sound') : `the granulator refused: ${m.reason}`,
            m.ok ? 'hi' : 'bad');
    }
    if (m.type === 'params.rolled' && m.ok) {
      roll = m; drift = m.drift ?? drift; rolledAt = Date.now();
      markDrift();
      d.log(`${m.character.m}/${m.character.n} · ${rate(m.m)} and ${rate(m.n)} grains a second · number ${m.seed}`, 'hi');
    }
    if (m.type === 'params.state') {
      // Timed only when it answers THIS page's own question; the state below is
      // absorbed from anybody's, because that is the board describing itself.
      if (stateAt && m.re === stateId) { rtt = Math.round(performance.now() - stateAt); stateAt = 0; stateId = null; }
      fxOn = !!m.ok;
      // ⚠️ FOLLOW THE BOARD DOWN AS WELL AS UP, AND THIS WAS FOUND THE REAL
      // WAY: the box service restarted underneath a run, and the page went on
      // printing a character, a grain rate and a nudge count for an engine that
      // was no longer running — a readout about a sound nobody could hear. The
      // board reporting no roll IS the answer, so it is taken as one.
      //
      // The 1.5 s is for the other order: a heartbeat asked a moment before a
      // roll landed answers with the PREVIOUS settings, and letting that
      // overwrite a fresh roll would blank the page for four seconds after
      // every press.
      if (Array.isArray(m.notes?.gate)) boardVoices = m.notes.gate.filter((g) => g > 0.001).length;
      if (Date.now() - rolledAt > 1500) {
        roll = m.roll ?? null;
        drift = m.drift ?? null;
        // A granulator that went away takes its history with it; anything else
        // would be counting across two different engines.
        if (!drift && !fxOn) driftLog.length = 0;
        else markDrift();
      }
    }
    // 🔴 THE BOARD'S OWN GRAINS, WHICH IS WHAT MAKES THE TWO CARDS
    // COMPARABLE. Until today this pane could only draw the sound that arrived
    // — a bump in an envelope might be a note, a delay tap or a reverb swell,
    // so nothing here could say a grain had fired. The engine reports each one
    // as it is triggered now (`SendReply` on the grain trigger), and `seen`
    // comes with the list so a short list reads as few grains rather than as a
    // dropped message.
    if (m.type === 'grain.marks' && Array.isArray(m.marks)) {
      const seen = m.seen || m.marks.length;
      boardGrains += seen;
      grainLog.push({ t: performance.now(), seen });
      while (grainLog.length > 2 && grainLog[0].t < performance.now() - 12000) grainLog.shift();
      for (const g of m.marks) boardScope.mark({ pos: g.pos, half: g.half, level: 1 });
      // the read band, from the board's own report of where it is reading
      if (Number.isFinite(drift?.scan)) {
        const half = Math.max(0.004, (live.m.spray ?? 0) / 2);
        const lo = ((drift.scan - half) % 1 + 1) % 1, hi = ((drift.scan + half) % 1 + 1) % 1;
        boardScope.range(lo, hi, drift.scan);
      }
    }
    if (m.type === 'params.drifted') drift = m;
    // 🔴 THE BOARD'S ANSWER ABOUT THE MATERIAL, WHICH IS THE WHOLE OF §4a. The
    // page and the board expand the same spec with the same `partialsOf`, and
    // the board builds it with `PosSource.sc` on its own scsynth — so the two
    // granulators finally chew the same thing. `engine` is what scsynth ANSWERED
    // when asked for a control value, not what the box sent: a node id proves
    // nothing, because sclang allocates one before the server has read the
    // message and it answered `node 1002` about a def that had failed to load.
    if (m.type === 'source.applied') {
      made = m.ok ? { partials: m.partials, topHz: m.topHz, engine: m.engine } : { reason: m.reason };
      d.log(m.ok
        ? `the board is chewing the same material · ${m.partials} sine partials, top ${m.topHz} Hz`
          + `, and its own engine says ${m.engine?.voices} notes at ${Math.round(m.engine?.hz)} Hz`
        : `the board would not build the material: ${m.reason}`, m.ok ? 'hi' : 'bad');
    }
    // ⚠️ A COMMENT ABOUT ERR'S ARCHIVE SEARCH STOOD HERE AND WAS ORPHANED ON
    // 2026-09-16, when the board's `source.search` and `source.load` left with
    // the rest of that path. This page never sent either of them. `source.set`
    // above is the only material verb there is now, and it is generated on the
    // board rather than fetched from anybody.

    for (const w of [...waiters]) {
      if (w.type !== m.type || (w.re && m.re !== w.re)) continue;
      clearTimeout(w.timer);
      waiters.splice(waiters.indexOf(w), 1);
      w.resolve(m);
    }
    render();
  }

  // The board is an object, not a session: it can be switched off, restarted or
  // taken to another room while this page is open, and a page that goes on
  // showing the last numbers it saw is a page lying about the present.
  setInterval(() => {
    if (wire.state() === 1) hello();
    // Re-ask for the grains well inside the box's 30 s expiry, so the picture
    // survives as long as the page is open and stops on its own when it is not.
    if (fxOn && wire.state() === 1) send({ type: 'grain.report', on: true });
    // The board is an object, not a session: it can be restarted with this page
    // open, and it comes back with the instrument in the granulator's input and
    // no generated material at all. `made === null` is "it has never answered",
    // which is the only state worth re-asking from — a refusal has a reason and
    // asking again every four seconds would just repeat it.
    if (fxOn && made === null && wire.state() === 1) send(sourceMessage(SPEC));
    if (answered && Date.now() - lastHeard > 12000) {
      answered = false; rtt = null;
      d.log('the board stopped answering', 'bad');
      render();
    }
  }, 4000);

  // ── the material row's actions ───────────────────────────────────────────

  // ── the controls ─────────────────────────────────────────────────────────
  // HOLD is two commands and both are needed: `lock` keeps the material (it
  // makes the retain gain 1, so the write becomes a rewrite of what is already
  // there) and `src 1` stops the live input being mixed into it. ⚠️ `src 1`
  // ALONE ERASES — retain zero and record zero writes `0*new + 0*old` over the
  // window at real time, which is LESSONS #46 and cost a day once.
  let held = false;
  d.on('hold', async () => {
    held = !held;
    // ⚠️ BOTH ENGINES, THROUGH THE ONE PATH. Holding one end and not the other
    // is the page telling you two granulators disagree when what disagrees is
    // which of them is still recording.
    for (const h of ['m', 'n']) {
      forBoth(`${h}lock`, held ? 1 : 0);
      forBoth(`${h}src`, held ? 1 : 2);
    }
    d.button('hold').textContent = held ? 'Listen again' : 'Hold what it has';
    d.log(held
      ? `holding the last ${WINDOW_SECONDS} seconds. The grains are now the only thing you hear`
      : 'listening again. The grains follow the material, so they sound like it', 'hi');
  });

  // 🔴 IT SWITCHES ITSELF ON. This page's entire subject is the granulator, so
  // arriving with it off is a page that does nothing until you find a button —
  // and the state it arrives in is "the board is answering but nothing is
  // granulating", which is a normal moment being reported as a problem.
  //
  // ⚠️ ONCE, AND NOT WHILE IT IS ALREADY HAPPENING. The board is shared and
  // raising the insert takes ~40 s, so a second request mid-compile is a second
  // engine. `enabling` guards the window the reply has not closed yet.
  let enabling = false, enabledOnce = false;
  async function enable() {
    if (enabling || fxOn) return;
    enabling = true;
    try { await enableNow(); } finally { enabling = false; }
  }

  async function enableNow() {
    startAudio();
    // ⚠️ A WINDOW, NOT A RACE. Nobody answering is a real answer here, so this
    // waits a bounded time and then reports silence rather than waiting forever
    // and looking like it is still loading.
    for (let i = 0; i < 20 && !answered; i++) await wait(250);
    if (!answered) {
      d.log(`nothing answered in “${ROOM}”: the board is not in this room`, 'warn');
      render();
      return;
    }
    // Something has to be going into it, or it granulates an empty recording
    // and the page is honestly, uselessly silent.
    const st = await ask({ type: 'audio.status' }, 'audio.started', 6000);
    /**
     * 🔴 IT STARTS `SOURCE`, AND FOR TWO SESSIONS IT DID NOT. This asked the
     * board for `fluidsynth` while setting `wantSource` to `yoshimi` four
     * hundred lines below a comment explaining, correctly, why it has to be
     * Yoshimi: an insert can only wrap what is on the JACK graph, and a note
     * has to be HELD or there is nothing to granulate. So the page started one
     * instrument and then waited for a reply naming another, which never
     * matched, so `wantSource` was never cleared and the four-second mark it
     * gates stayed armed for the rest of the visit.
     *
     * ⚠️ IT IS ALSO A NAME THE BOARD NO LONGER KNOWS. FluidSynth left
     * `rig/box/jacksynth.mjs` on 2026-09-16 (`archive/box-fluidsynth-hexter/`),
     * and an unrecognised source is refused by name rather than fallen through
     * to a microphone, so this line would now answer `unknown source
     * "fluidsynth"` and the page would granulate silence. One constant, used
     * once, is what stops a page asking for something it has already explained
     * it does not want.
     */
    if (st && !st.ok) {
      d.log(`nothing was playing. Starting ${SOURCE} so there is something to chew`, 'hi');
      wantSource = SOURCE;
      await ask({ type: 'audio.start', source: SOURCE }, 'audio.started', 60000);
    }
    // First time this is asked of a cold board it compiles a two-thousand line
    // engine, about forty seconds; after that it is a re-patch. `switching` is
    // what lets the page say THAT rather than "it is off", which is the same
    // sentence about two different situations.
    switching = true; render();
    const fx = await ask({ type: 'fx.pappus', on: true }, 'fx.pappus', 90000);
    switching = false;
    if (!fx) { d.log('the granulator did not answer in ninety seconds', 'warn'); render(); return; }
    if (!fx.ok) { render(); return; }
    // ⚠️ ADOPT BEFORE ROLLING. The board is shared and it keeps playing with
    // nobody connected: if it already has settings, taking them over would
    // change the sound under whoever is listening for no reason the page could
    // name. A roll happens when there is nothing to adopt, or when asked for.
    const state = await ask({ type: 'params.state' }, 'params.state', 6000);
    void state;
    await applyPatch(patch);
    // 🔴 THE MATERIAL, AND IT IS AWAITED — plan-twins §4a. One description, and
    // since 2026-09-13 ONE DEFINITION as well: `PosSource.scsyndef` runs in
    // this tab and on the board, both fed by `sourceArgs` on the same spec.
    // What used to be "two builders agreed" is now one builder in two places.
    //
    // ⚠️ AWAITED BECAUSE THE CHECK BELOW BRANCHES ON IT. Sent and forgotten, the
    // reply landed several seconds later — after `probeSound()` had already
    // chosen the key branch and measured an instrument that was about to be
    // unplugged. Read 0.1434 against 0.0870 and passed, which is a check
    // grading a transition.
    const src = await ask({ type: 'source.set', spec: SPEC }, 'source.applied', 20000);
    if (!src) d.log('the board did not answer about the material', 'warn');
    render();
  }

  /**
   * ⚠️ MEASURE THE SOUND, NOT THE FRAME COUNT — and measure it where the CHECK
   * is, not where the switching-on is. A stream of digital silence arrives at
   * exactly the rate a working one does, so this holds a key and compares what
   * comes back against what was coming back before it: the only thing on this
   * page that crosses the whole chain.
   *
   * It lived inside `enable()` until the page started switching itself on, at
   * which point the control's own `enable()` returned early — already on — and
   * skipped the measurement, so the assert read "no key has been held yet"
   * about a working board. Enabling is a side effect; measuring is the check.
   */
  async function probeSound() {
    // 🔴 TWO WAYS TO MAKE THE BOARD LOUDER, AND THE FIRST ONE IS BETTER — and it
    // had to change, because the generated material MADE THE KEY PROBE VACUOUS.
    // With `PosSource` feeding the granulator the instrument is unplugged from
    // it (it has to be: scsynth sums its input bus, so an instrument still
    // patched in is a second material nobody declared), so a held key changes
    // nothing — and the old assert would still have passed, on the drone that
    // was there before the key and after it. A check that cannot fail is not a
    // check.
    //
    // Turning the MATERIAL down and up crosses strictly more of the chain than
    // a key does: this page's own description, the relay, the box, the shared
    // `partialsOf`, sclang, the wavetable, the granulator, the capture, and the
    // relay again. A key only ever reached the instrument.
    //
    // ⚠️ 0.001 RATHER THAN 0. An all-zero amplitude table is a `/b_gen sine1`
    // edge nobody here has tested; a peak of 0.001 is -60 dB, which is silence
    // by any threshold on this page and is an ordinary value all the way down.
    if (made?.partials) {
      // 🔴 LOUD FIRST, QUIET SECOND, AND THAT ORDER IS A MEASUREMENT. A
      // granulator answers a change of material only when its write head next
      // passes the point the grains are reading, so the two directions cost
      // very different amounts of time: `bufclear` empties the ring and the
      // QUIET arm lands inside a second, while the LOUD arm has to wait for the
      // head to come round — measured at about six seconds at this page's own
      // settings, and variable, because where the head is when `bufclear` lands
      // is not something anybody chose.
      //
      // Three shapes of this check were wrong before this one. A flat 1.6 s
      // read 0.0880 against 0.0821 (the old material still in the ring). A
      // shortened `mbuflen` read 0.0000 twice over. A fixed 1.8 s on the loud
      // arm read the QUIET level twice, three runs out of three. So the slow
      // direction is waited on in one-second slices until there is something to
      // report, and the fast one follows it.
      const hi = { peak: 0, frames: 0 };
      for (let i = 0; i < 12 && hi.peak < 0.01; i++) {
        const slice = await listen(1000);
        hi.frames += slice.frames;
        if (slice.peak > hi.peak) hi.peak = slice.peak;
      }
      // ⚠️ AWAITED, AND `bufclear` ONLY AFTER IT. Sent together, the two race:
      // `params.set` is one hop to the box and straight out as OSC, while
      // `source.set` has to reach sclang, fill the wavetable that is not playing
      // and crossfade to it. Emptying the ring BEFORE the material goes quiet
      // just refills it with the loud one — measured, a down arm that read
      // 0.0331 against a 0.0555 up arm on one run in three while the other two
      // read 0.0000.
      await ask({ type: 'source.set', spec: { ...SPEC, level: 0.001 } }, 'source.applied', 15000);
      send({ type: 'params.set', cmd: 'bufclear', args: [1] });
      await wait(1200);
      const lo = await listen(1200);
      // ⚠️ PUT IT BACK. The check ends on the quiet arm, and a page that left
      // the material turned down would hand the next visitor a granulator
      // chewing something 60 dB below what the screen says it is chewing —
      // which is the same class of mistake as leaving `msrc 1` behind.
      send(sourceMessage(SPEC));
      probe = { quiet: lo.peak, held: hi.peak, frames: lo.frames + hi.frames, how: 'material' };
      d.log(`the material turned down and up: ${hi.peak.toFixed(4)} against ${lo.peak.toFixed(4)} over `
            + `${probe.frames} frames. The board is making the sound this page described`,
            hi.peak > 0.002 ? 'hi' : 'bad');
      render();
      return;
    }
    const lo = await listen(900);
    send({ type: 'note.on', note: 60, vel: 100, channel: 0 });
    const hi = await listen(1800);
    send({ type: 'note.off', note: 60, channel: 0 });
    const quiet = lo.peak, held = hi.peak;
    probe = { quiet, held, frames: lo.frames + hi.frames, how: 'key' };
    // ⚠️ SAY WHICH OF THE TWO THE NUMBERS MEAN. A cloud that was already
    // droning is often LOUDER before the key than during it, and printing the
    // pair without saying so reads as a failure on a working board.
    d.log(`holding a key: ${held.toFixed(4)} against ${quiet.toFixed(4)} with nothing pressed · `
          + (quiet <= 0.002 ? 'the key is what started it' : 'it was already droning, which is what a cloud does'),
          held > 0.002 ? 'hi' : 'bad');
    render();
  }

  // The control is still here, still pressed by the harness, and now it is the
  // one that CHECKS as well — a page that checks itself only when asked is a
  // page nobody checks.
  d.on('on', async () => {
    // BOTH ENGINES, AND BOTH ARE SLOW, SO THEY START TOGETHER. The board
    // compiles a 2,030-line graph — about forty seconds the first time — and
    // the tab boots WebAssembly, allocates thirty-one buffers and takes a
    // 64 KB definition. Started one after the other that is a minute; started
    // side by side it is the board's forty seconds and nothing else. This
    // control owns the page's whole settle budget for exactly that reason.
    const local = startLocal();
    await enable();
    // Wait out an enable that is already in flight — the page starts one the
    // moment the board answers, and the harness can press this before it ends.
    for (let i = 0; i < 160 && enabling; i++) await wait(500);
    await local;
    // 🔴 BOTH PROBES TAKE THE SOUND AWAY AND PUT IT BACK, so they wait for a
    // harness. `probeSound` turns the material down to -60 dB on a Raspberry Pi
    // in another building, empties the ring and waits for the head to come
    // round: a hole of several seconds in a granulator somebody standing next
    // to it is listening to, and in `/knobs/` too, because there is one board
    // and one room on it. `probeLocal` does the same to this tab, dropping its
    // master to zero for 700 ms. That is exactly the shape `/radio/` was
    // reported for: a page proving a control works by working it while a person
    // is listening.
    //
    // ⚠️ THEIR TWO ASSERTS GO WITH THEM rather than reading red on a working
    // board. Everything else `checkAll` says is read off replies already in
    // hand, so a visit still grades the engine, the material, the node order,
    // the movement, the grain rate and the picture.
    await ifSelfcheck(async () => {
      if (fxOn) await probeSound();
      await probeLocal();
    }, { log: d.log, say: 'the two deafness checks turn the sound down and back up, on this page '
      + 'and on the board, so they are left to the harness rather than made a hole in what '
      + 'anybody is listening to' });
    checkAll();
  });

  /**
   * THE DEAFNESS CONTROL FOR THE ENGINE IN THIS TAB, and it is the same shape
   * as the board's: turn the thing off and watch the number go to zero.
   *
   * 🔴 A LEVEL ON ITS OWN PROVES NOTHING. "It is loud" is satisfied by a stuck
   * meter, a feedback path, or another tab; "it is loud AND it is exactly
   * 0.000000 when the master is down, and loud again afterwards" is a claim
   * about this graph. §10.5 measured exactly 0.000000 at `amp 0` with
   * everything else still running, which is the number to reproduce.
   *
   * ⚠️ `amp` GOES TO THE TAB ONLY, NEVER THROUGH `forBoth`. `amp` is Pappus's
   * master, and putting the board's to 0 would silence the studio for whoever
   * is standing next to it. The board's own deafness control is `probeSound`,
   * which turns the MATERIAL down and up and crosses the whole chain.
   *
   * ⚠️ AND THE QUIET ARM IS MEASURED AFTER THE CHANGE HAS LANDED. An analyser
   * window still holds 42 ms of the old signal, so a reading taken immediately
   * reports that turning it down did nothing.
   */
  async function probeLocal() {
    if (!pap?.started) return;
    const loud = await levelOver(() => pap.level(), 900, 400);
    pap.set('amp', 0);
    const silent = await levelOver(() => pap.level(), 700, 500);
    pap.set('amp', SENT.get('amp') ?? 1);
    papDeaf = { loud, silent };
    d.log(`the engine in this page: ${loud.toFixed(6)} playing, ${silent.toFixed(6)} with its master down`,
      loud > 0.0005 && silent === 0 ? 'hi' : 'warn');
  }

  function checkAll() {
    // ── the lane that is always reachable ─────────────────────────────────
    // 🔴 THESE RUN ON EVERY RUN, WITH NO BOARD AND NO NETWORK. That is the
    // whole reason this lane exists: `grains` used to assert nothing at all
    // about a granulator when the Pi was down, so a page about granulation
    // could go green having granulated nothing. And it is the only lane where
    // the picture can be checked, because it is the only one whose engine
    // reports the grains it fired.
    // 🔴 IT IS REAL SUPERCOLLIDER, AND THE EVIDENCE IS THE ENGINE'S OWN VOICE.
    // Not `loadSynthDef()`'s return value, which research §8 measured returning
    // `{name, size}` for a definition the server never received, and not a
    // count this page keeps: `/done /d_recv` and `/n_go`, said by the server.
    d.assert('the granulator in this page is SuperCollider running the board’s own graph',
      !!pap?.graph?.ok && !!pap?.started,
      pap ? `${pap.graph.bytes} B of compiled SynthDef taken in ${pap.graph.ms} ms, `
        + `${pap.running?.ugens} building blocks running at ${pap.sampleRate} Hz`
        : 'no engine · nothing has been pressed');
    // 🔴 AND THE MATERIAL IS A SECOND DEFINITION, BECAUSE PAPPUS IS NOT
    // SELF-CONTAINED: it granulates whatever is on a bus, and in a browser
    // nothing fills that bus. Without this the pane would look perfect and be
    // granulating silence.
    d.assert('something is feeding it, and its own engine says so',
      !!pap?.source?.ok && !!papSource && papSource.voices === SPEC.chord.length,
      papSource ? `${pap.source.bytes} B of material definition, and scsynth answers `
        + `${papSource.voices} notes at ${Math.round(papSource.hz)} Hz`
        : 'the engine has not answered about the material');
    // 🔴 THE WRITER RUNS BEFORE THE READER, ASKED OF THE SERVER. `Out.ar` SUMS
    // into a bus and scsynth runs nodes in tree order, so a reader placed ahead
    // of its writer hears the PREVIOUS block — one block late, for ever, which
    // reads as "it nearly works" rather than as a wiring mistake. `/g_queryTree`
    // is the only thing that can answer; this page cannot know it.
    d.assert('the material is built before the granulator reads it, not one block after',
      pap?.order?.sourceFirst === true,
      pap?.order ? `the tree answers ${pap.order.reply.slice(0, 12).join(' ')}` : 'the engine did not answer about its node tree');
    // ⚠️ MEASURED, NOT DRAWN FROM THE SETTINGS. A scope fed parameters would
    // look identical and mean nothing — which is the picture this page deleted
    // once already.
    const sc = scope.stats();
    d.assert('every tick in this page’s picture is a grain the engine reported firing',
      sc.measured > 0 && sc.measured === papGrains && sc.inferred === 0,
      `${papGrains} reported by the engine, ${sc.measured} drawn, ${sc.inferred} guessed from audio`);
    // 🔴 THE DEAFNESS CONTROL FOR THIS END. A level on its own is satisfied by
    // a stuck meter; a level that is EXACTLY zero when the master goes down and
    // loud again afterwards is a claim about this graph. research §10.5
    // measured 0.000000 at `amp 0` with everything else still running.
    // Behind the gate with the probe that fills it in: with no measurement this
    // would read red about a page that is working.
    if (SELFCHECK) d.assert('the sound is this engine’s, and it stops exactly when its master does',
      !!papDeaf && papDeaf.loud > 0.0005 && papDeaf.silent === 0,
      papDeaf ? `${papDeaf.loud.toFixed(6)} playing against ${papDeaf.silent.toFixed(6)} with the master down`
        : 'nothing has been measured yet. Press “Switch it on”');

    d.assert('the page reached the relay', wire.state() === 1, `readyState ${wire.state()}`);
    // ⚠️ ONE BRANCH PER NAMED STATE, AND THE COUNT MOVES WITH IT. This board is
    // shared and it keeps running with nobody connected, so "answering" is not
    // one condition: it can be compiling its engine, refusing the insert, or
    // playing nothing at all into it — and asserting a running instrument's
    // numbers in those states reported four failures about a board that was
    // fine. Each state asserts what it can answer for and says which it was.
    // Diff the count against the BRANCH: silent 9, answering-but-not-sounding 10,
    // sounding 17. MEASURED 2026-09-14, 17/17 with the board live.
    // ⚠️ THOSE ARE THE HARNESS'S NUMBERS. A visit is two short in every branch,
    // because the two deafness checks take the sound away to make their
    // measurement and so are held back with the probes that fill them in.
    // ⚠️ IT WAS 16 BEFORE THE LEFT PANE BECAME REAL SUPERCOLLIDER, and the four
    // asserts it had about a hand-written worklet became five about an engine:
    // that it IS SuperCollider running the board's graph, that a second
    // definition is feeding it (Pappus granulates a BUS, and in a browser
    // nothing else fills one), that the writer runs before the reader, that
    // every tick came from a `/pgrain`, and that the sound stops EXACTLY when
    // its master goes down. The grain-rate assert now grades both ends against
    // the slider rather than one end against the other.
    const st = panel.dataset.state;
    const why = {
      silent: 'the board is silent, and the page says so',
      warming: 'the granulator is still compiling on the board · about forty seconds the first time',
      off: fxWhy ? `the board refused to switch the granulator on: ${fxWhy}` : 'switching the granulator on',
      empty: 'the granulator is running with no instrument playing into it',
      idle: 'the granulator is running with nothing rolled',
      live: 'the board is answering and set up',
    }[st];
    d.assert('it says which of the two it is in', answered ? st !== 'silent' : st === 'silent', why);
    if (!answered) {
      d.assert('silence is reported as silence, not as an instrument that makes none',
        panel.textContent.includes('Nobody is answering'), 'the panel names the silence');
      d.assert('no sound is claimed that never arrived',
        frames === 0 && d.api.readout.sound === 'nothing' && roll === null && level === 0,
        `${frames} frames, sound cell “${d.api.readout.sound}”, nothing rolled`);
      return;
    }
    d.assert('the board answered in this room', Number.isFinite(rtt), `${rtt} ms out to the board and back`);
    d.assert('the page says what the grains are made of', !!materialShort(), String(materialShort()));
    if (st !== 'live') {
      // Not a pass dressed as one. The claim is that the page NAMES the state
      // it is in — the same claim the silent branch makes — rather than drawing
      // an instrument's numbers for a sound nobody is making.
      d.assert('it says why there is nothing to hear yet, rather than printing numbers for a sound nobody is making',
        panel.textContent.length > 40, why);
      return;
    }
    d.assert('the granulator is switched on, with something playing into it',
      fxOn && !!playing, `wrapping ${playing}${fed === false ? ' · nothing feeding it' : ''}`);
    d.assert('the two halves are set differently, which is what stops one flat wash',
      PATCHES[patch].m.rate !== PATCHES[patch].n.rate && PATCHES[patch].m.size !== PATCHES[patch].n.size,
      `${PATCHES[patch].m.rate} against ${PATCHES[patch].n.rate} grains a second`);
    // The claim the whole page rests on: this is sound that was made on a
    // machine somewhere else and came back, not a page making a noise.
    // ⚠️ AND IT HAS TO SEPARATE THE TWO, NOT JUST BE LOUD. Both branches now
    // require the quiet arm to be QUIET — with the material driven from this
    // page there is something to turn down, so "it was already droning" stops
    // being an excuse the check has to accept.
    // Same again: the material probe is what fills `probe` in, so the claim goes
    // where the measurement goes.
    if (SELFCHECK) d.assert(probe?.how === 'material'
      ? 'the board is making the sound this page described, and stops when it is turned down'
      : 'sound comes back from the board while a key is held',
      !!probe && probe.held > 0.002 && (probe.how === 'material' ? probe.quiet < probe.held * 0.5 : true),
      probe ? (probe.frames === 0
        ? 'not one audio frame arrived in either window, which is a socket rather than a silence'
        : `${probe.held.toFixed(4)} with it up, ${probe.quiet.toFixed(4)} with it down, over ${probe.frames} frames`
          + (probe.how === 'material' ? ' · the material is this page’s own description' : ''))
        : 'nothing has been measured yet. Press “Switch it on”');
    // 🔴 THE MECHANISM AND WHETHER IT HAS ANYTHING TO ACT ON — NOT THE COUNT ON
    // ITS OWN. This asserted `nudges > 0` and read red for a reason that was
    // true and was not a timing fault: the movement circled the last dice roll
    // and this page does not roll, so the count was never going to climb
    // however long anyone waited. Waiting longer was the wrong fix twice over —
    // the effect was absent by construction, and an assert that has to wait is
    // an assert that gets written tolerantly, which is how a page's whole
    // subject goes missing (LESSONS #27). The board takes a set value as a
    // centre now, so the count does climb here; the shape of the check is
    // unchanged, because the reason it is shaped this way has not gone away —
    // the board can still be silent, or have its movement switched off.
    //
    // WHAT THIS COVERS: the board's movement timer is running, this page
    // watched it for a real window, and the board's own nudge counter agrees
    // with the board's own report of whether it has anything to move —
    // climbing when it has, still when it has not. Every term is read off the
    // wire and none of them has to be waited for.
    //
    // WHAT IT DOES NOT COVER: that any sound changed. Nothing here listens. The
    // assert two above, which holds a key and measures what comes back, is the
    // one that crosses the whole chain.
    const moved = driftMoved();
    const dstate = driftState();
    // Nudges go out at 8 Hz, so a centre that landed in the last half second
    // has not had a tick yet. Without this the check would be a coin toss for
    // 125 ms after somebody else in the room rolls (LESSONS #35).
    const fresh = dstate === 'moving' && (drift.sinceMs ?? Infinity) < 500;
    const climbing = !!moved && moved.nudges > 0;
    d.assert('the board’s own movement is running, and its count matches what it has to move',
      dstate !== null && dstate !== 'off' && moved !== null && (dstate === 'moving' ? climbing || fresh : !climbing),
      dstate === 'moving'
        ? `${moved ? `${moved.nudges} nudges in ${secs(moved.ms)}` : 'only one reading so far'}, reading at ${drift.scan}`
        : dstate === 'nothing'
          ? `switched on and circling nothing · ${moved ? `${moved.nudges} nudges in ${secs(moved.ms)}` : 'no window yet'}, `
            + 'which is the right count for a board with no roll to circle, not a stalled timer'
          : dstate === 'off' ? 'the movement is switched off on the board' : 'the board said nothing about movement');
    // 🔴 THE CLAIM THIS WHOLE DAY'S BOARD WORK EXISTS FOR. Until today the
    // right-hand card could draw the sound that arrived and nothing else,
    // because a bump in an envelope might be a note, a delay tap or a reverb
    // swell. Now the engine reports each grain as `GrainBuf` is triggered, so
    // both cards mark real grains and the two are finally comparable.
    //
    // ⚠️ IT ASSERTS THE SCOPE'S OWN COUNTERS, not the page's. `measured`
    // against `inferred` is the scope saying where its ink came from, which is
    // the only way to tell a picture of grains from a picture of settings —
    // and this page has drawn the wrong one before.
    // ⚠️ AND THE DETAIL NAMES THE ONE THING THAT MAKES THIS ZERO WITHOUT
    // ANYTHING ELSE LOOKING WRONG. The board plays its granulator's eight
    // voices like a keyboard and starts with every gate SHUT; with none open
    // the trigger never fires, so there are no grains and no sound — while the
    // audio stream, the material and every reply stay perfectly healthy. The
    // page SETS the gates now, so this cannot happen; printing the board's own
    // count is what stops the next zero being a mystery.
    const bs = boardScope.stats();
    d.assert('the board’s grains are reported by the engine that fired them, not guessed from its audio',
      boardGrains > 0 && bs.measured > 0,
      `${boardGrains} reported by the board, ${bs.measured} drawn, ${bs.inferred} guessed from audio`
      + (boardVoices === null ? '' : ` · ${boardVoices} of the board’s 8 voices open`));

    // 🔴 THE CLAIM plan-twins §4a EXISTS FOR. Two panes side by side are a claim
    // that they are comparable, and until today that claim was false for a
    // reason nothing on the page could see: this end granulated a table of sines
    // and the board granulated whatever instrument was running. Both ends now
    // expand ONE spec with ONE function (`partialsOf`), and the board builds it
    // on its own scsynth.
    //
    // ⚠️ IT ASSERTS THE ENGINE'S OWN ANSWER, not the box's. `engine.voices` and
    // `engine.hz` come back from an `/s_get` to scsynth, which replies only for a
    // node that really exists holding the value it really holds — and the first
    // version of this path reported `node 1002, engineOn true` about a SynthDef
    // that had failed to load, because `Synth.new` allocates an id on the client
    // before the server has read the message.
    // ⚠️ AND THE TWO ENGINES ARE NOW THE SAME DEFINITION, so this is no longer
    // "two builders agreed": it is one `PosSource.scsyndef` running in two
    // places, each asked what it is holding.
    const lp = papPlan?.partials?.length ?? 0;
    d.assert('both granulators are chewing the same description, and both engines say so',
      !!made?.partials && lp > 0 && made.partials === lp
        && made.engine?.voices === SPEC.chord.length && papSource?.voices === SPEC.chord.length,
      made?.partials
        ? `${lp} sine partials here, ${made.partials} on the board · this page’s scsynth answers `
          + `${papSource?.voices} notes at ${Math.round(papSource?.hz ?? 0)} Hz and the board’s `
          + `${made.engine?.voices} at ${Math.round(made.engine?.hz)} Hz`
        : made?.reason ? `the board refused: ${made.reason}` : 'the board has not answered about the material');
    // 🔴 `rate` HAS TO MEAN ONE THING — plan-twins §5, and it is measured here
    // rather than assumed. The board's granulator has eight voices and each can
    // bring up swarm duplicates, so "grains a second" could have meant anything
    // from 1x to 50x the number on the slider. MEASURED over the relay: at
    // `mrate` 8 the engine reported 8.0 grains a second, at 4 it reported 4.0, at
    // 16 it reported 16.0 — one voice is gated by default, so the slider's number
    // IS grains a second on both engines and no division is needed.
    //
    // ⚠️ COUNTED ON THE FAR SIDE. These are the board's own `SendReply` per
    // trigger, not anything this page asked for. Tolerant by a factor of two
    // because a patch can open more voices and because the window starts
    // whenever the first report happens to land.
    // 🔴 AND THE SLIDER IS A VALID ORACLE HERE ONLY BECAUSE `rate` IS OUTSIDE
    // THE DRIFT. The board's slow movement is ON while this page drives — the
    // page asks for it and asserts it above — and it walks `scan`, `spray`,
    // `swarm`, `tilt`, `size` and `sos` around whatever was last SET
    // (`DRIFT` in `pappus.mjs`). So `where` is a CENTRE and not a position,
    // and no assert here may be written against it. `rate` is deliberately
    // excluded from that list — "an integer-ish grain rate is not drifted" —
    // which is what makes this one comparison immune to a moving target.
    // ⚠️ THE FIRST BATCH'S GRAINS FIRED BEFORE THE WINDOW OPENED, so its count
    // is the one dropped rather than an arbitrary one — the span is measured
    // from its arrival, and everything after it happened inside that span.
    const gspan = grainLog.length > 1 ? (grainLog[grainLog.length - 1].t - grainLog[0].t) / 1000 : 0;
    const gsec = gspan > 0.5 ? grainLog.slice(1).reduce((t, g) => t + g.seen, 0) / gspan : 0;
    // 🔴 AND THE SAME QUESTION ASKED OF THE ENGINE IN THIS TAB, WHICH IS THE
    // WHOLE POINT OF THE REWIRE. `mrate` is an ORACLE — research §10.6 graded
    // this end at 8.00 / 4.00 / 15.99 a second against the board's documented
    // 8.0 / 4.0 / 16.0 — so both panes are graded against the slider rather
    // than against each other. Two ends compared only to each other agree when
    // they share a fault; compared to the number asked for, they cannot.
    const pspan = papLog.length > 1 ? (papLog[papLog.length - 1] - papLog[0]) / 1000 : 0;
    const psec = pspan > 0.5 ? (papLog.length - 1) / pspan : 0;
    d.assert('a grain a second means the same thing on both engines',
      gsec > 0 && gsec >= K.rate * 0.4 && gsec <= K.rate * 2.5
      && psec > 0 && psec >= K.rate * 0.4 && psec <= K.rate * 2.5,
      gspan > 0.5 && pspan > 0.5
        ? `${psec.toFixed(1)} a second in this page and ${gsec.toFixed(1)} on the board, `
          + `against ${K.rate.toFixed(1)} asked for`
        : `${pspan > 0.5 ? `${psec.toFixed(1)} a second here` : 'this page’s engine has not reported two grains yet'}`
          + ` · ${gspan > 0.5 ? `${gsec.toFixed(1)} on the board` : 'the board has not reported two batches yet'}`);

    d.assert('a named patch is on screen, chosen rather than rolled',
      !!PATCHES[patch] && step.select.options[step.select.selectedIndex]?.text === PATCHES[patch].name,
      `${PATCHES[patch].name} · ${PATCHES[patch].voice} · ${PATCHES[patch].notes.length} notes`);
  }

  render();
  d.log('press a sound, or ‹ random › for another');
  d.ready();
</script>
</html>
