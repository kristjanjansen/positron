<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* No margin: the gap between the picture, the transport bar and the strip is
     `.pos-body > * + *` in shell.css, one rhythm for every page. */
  video { width: 100%; display: block; background: #000; border-radius: 4px; }
</style>
<script src="/proto/remixer/hls.min.js"></script>

<script type="module">
  import { mount, guard, el, armVideo, playOrPrompt } from '/shell/shell.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createStripView } from '/shell/strip.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { mediaMaster } from '/timeline/media-master.mjs';
  import { ARCHIVE, CUES, cueItems } from '/shell/archive.mjs';

  const d = mount({
    name: 'replay',
    what: 'A 190-second show stored in Cloudflare R2, played with the eight cues it '
      + 'was recorded with. Press Load + play: each cue\'s mark on the strip turns '
      + 'green as the picture reaches it. late by and worst are how far the cues '
      + 'landed from the moment the recording says they belong at, and apart is how '
      + 'far the timeline and the picture have drifted from each other.',
    // `media` left this row — the picture's own clock, which the transport bar
    // already prints beside the duration. `worst` took the slot, because a
    // median on its own hides the one bad fire that is the reason to look.
    readout: { fired: '', 'late by': 'ms', worst: 'ms', apart: 'ms' },
    controls: [
      { id: 'load', label: 'Load + play', primary: true },
    ],
  });
  guard(d);

  const video = el('video', '', null, { playsinline: '', muted: '', preload: 'auto' });
  video.muted = true;
  d.el.append(video);

  // ── the cue lane: the media is the master, the deck is the score ─────────
  const fires = [];
  const cueAdapter = {
    caps: { rates: [1], continuous: false, assertOnSeek: true },
    actuate(payload) {
      // error is measured in MEDIA time, which is the only clock that means
      // anything for a recording
      const mediaMs = video.currentTime * 1000;
      fires.push({ id: payload.id, mediaMs, wantMs: payload.offsetMs, errMs: mediaMs - payload.offsetMs });
      render();
    },
      // reduceAt() hands us the PREFIX already (rows <= pos) and each row is the
      // PAYLOAD, not the event — so there is nothing to filter and no r.at to
      // filter on. Getting this wrong reads as "no cues at all".
    reduce(rows) {
      return { count: rows.length, last: rows.length ? rows[rows.length - 1].id : null };
    },
    assertState(state) { return state; },
  };

  const deck = createDeck({
    items: cueItems(),
    adapters: { cue: cueAdapter },
    range: [0, ARCHIVE.durationMs],
  });

  // ONE POSITION SURFACE. The strip below is a time axis that seeks on press
  // and on drag; the bar's slider is a second one at a different scale, and two
  // stacked is a contradiction rather than a redundancy. Play, pause, the clock
  // and the keyboard table stay.
  createTransportBar(d.el, deck, { scrub: false });
  createStripView(d.el, deck, { size: 'default', lanes: [{
      id: 'cue', kind: 'cue', height: 44, as: 'ticks',
      // idToColor('cue') came out near-black on the dark ground, so the ticks
      // were there but invisible. latch + firedColor is built into the ticks
      // renderer: a cue turns green once the playhead has passed it.
      color: '#ffd400', width: 2.5, latch: true, firedColor: '#8fd6a8',
    }] });

  /**
   * 🔴 THIS USED TO BE A LINE OF PROSE UNDER THE PICTURE, and it rewrote itself
   * on every fire: eight entries of `CUE-03 +12ms` wrapping onto a second and a
   * third line as the show ran, so the strip, the log and everything under them
   * moved while somebody was reading them. Three cells instead — a count, a
   * median and the worst one, each in a box of its own that cannot change size.
   *
   * ⚠️ AND NOT IN THE CUE LANE'S GUTTER, which is where a per-lane number
   * belongs and where these will not fit. MEASURED: at the default 92 px
   * gutter a sub-line is clipped past TEN characters — `usual 12 ms` came out
   * `usual 12 …` — because the sizer asks for `11 + text + 10` and the drawer
   * then clips against `gutter - 18 - 8`, five pixels less than it was given.
   * An ellipsis means the content is in the wrong place, and widening is the
   * repair the rule forbids; with one lane on the page there is no doubt about
   * which ink these belong to anyway.
   */
  function render() {
    d.set('fired', fires.length);
    if (!fires.length) return;
    const errs = fires.map((f) => Math.abs(f.errMs)).sort((a, b) => a - b);
    d.set('late by', errs[errs.length >> 1]);
    d.set('worst', errs[errs.length - 1]);
  }

  let master = null, hls = null;

  // NATIVE HLS ONLY ON WEBKIT, gated on ManagedMediaSource. `canPlayType(
  // 'application/vnd.apple.mpegurl')` answers "maybe" in Chrome as well as
  // Safari, so the old `if (canPlayType(...))` put Chrome on the native path,
  // where `video.src = <m3u8>` sits at readyState 0 forever. Headless Chrome
  // answers "" and takes the hls.js branch, which is why the suite stayed green
  // over a page that was dead in the browser a human uses. Same rule as
  // src/low-latency-player.js.
  const NATIVE_HLS = 'ManagedMediaSource' in window
    && !!document.createElement('video').canPlayType('application/vnd.apple.mpegurl');

  d.on('load', async () => {
    armVideo(video);
    if (master) { playOrPrompt(video, d); return; }
    const url = ARCHIVE.hls;
    if (NATIVE_HLS) {
      video.src = url;                       // WebKit plays HLS natively
    } else if (window.Hls && window.Hls.isSupported()) {
      hls = new window.Hls({ enableWorker: true });
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(window.Hls.Events.ERROR, (_e, data) => {
        if (data.fatal) d.log(`hls fatal ${data.type}/${data.details}`, 'bad');
      });
    } else {
      d.fail(new Error('no HLS support'));
      return;
    }
    // MEDIA IS THE MASTER: the deck follows currentTime, it does not drive it
    master = mediaMaster(deck, video, {
      anchorMs: 0,
      onCorrection: (c) => d.log(`correction ${JSON.stringify(c).slice(0, 90)}`),
    });
    // bounded wait for real metadata — readyState 0 at press time is a race,
    // not a broken manifest
    await new Promise((res) => {
      if (video.readyState > 0) return res();
      const t = setTimeout(res, 8000);
      video.addEventListener('loadedmetadata', () => { clearTimeout(t); res(); }, { once: true });
    });
    // start the deck FROM the picture. mediaMaster reads currentTime and never
    // writes it, so if the two start apart the cues fire against the wrong
    // frame — which is exactly what a 12.4 s desync looked like.
    deck.seek(video.currentTime * 1000);
    await playOrPrompt(video, d);
    d.log(`playing ${url.split('/').slice(-2).join('/')} · readyState ${video.readyState} · dur ${video.duration?.toFixed?.(1)}s · ${CUES.length} cues`);
    // The checks read what this control just produced, so this is the first
    // moment they can be true — and a button for them would make them optional.
    await d.run('check');
  });

  // WATCHDOG. media-master's own rule L2: inside jumpMs an error is frame
  // quantisation and syncs; past it the element has MOVED and it must seek.
  // Enforced here too, and shown, so a drift is never hidden inside the cue
  // lane's numbers.
  //
  // ⚠️ NOTHING IS SET BEFORE THERE IS A PICTURE. This used to print the
  // element's currentTime every 400 ms from load, so the row read `0.00 s`
  // before anything had been fetched — a zero reads as a very confident
  // measurement, and the thing it was confident about had not happened yet.
  setInterval(() => {
    if (!master || video.readyState < 2) return;
    const mediaMs = video.currentTime * 1000;
    const off = mediaMs - deck.position();
    d.set('apart', off, Math.abs(off) > 250 ? 'bad' : 'ok');
    if (Math.abs(off) > 250) { deck.seek(mediaMs); d.log(`pulled the timeline back ${off.toFixed(0)} ms onto the picture`, 'bad'); }
  }, 400);

  d.on('check', async () => {
    // assert the MANIFEST, not the video's readiness: readyState depends on how
    // fast R2 answered, which is not what this demo is about
    let mOk = false, mStatus = 0;
    try { const r = await fetch(ARCHIVE.hls, { cache: 'no-store' }); mStatus = r.status; mOk = r.ok; } catch (e) { d.log(String(e), 'bad'); }
    d.assert('archive manifest reachable', mOk, `HTTP ${mStatus} · readyState ${video.readyState}`);
    d.assert('media is the transport master', !!master);
    d.assert('deck range is the show length', deck.durationMs === ARCHIVE.durationMs, `${deck.durationMs} ms`);
    // ⚠️ THIS WAS `deck.eventsOf ? true : true`, which is an assert that cannot
    // fail — decoration in the shape of evidence. The fold past the end is the
    // real question and the deck can answer it.
    d.assert('all eight cues are in the score',
      (deck.reduceAt?.('cue', ARCHIVE.durationMs)?.count ?? 0) === CUES.length,
      `${deck.reduceAt?.('cue', ARCHIVE.durationMs)?.count} of ${CUES.length}`);
    if (fires.length) {
      const errs = fires.map((f) => Math.abs(f.errMs)).sort((a, b) => a - b);
      const p50 = errs[Math.floor(errs.length * 0.5)];
      d.assert('cues land within 250 ms of the picture', p50 < 250,
        `p50 ${p50.toFixed(0)} ms over ${fires.length} fires`);
    } else {
      d.log(`no cues fired yet · the first is at ${(CUES[0].offsetMs / 1000).toFixed(1)} s`
        + ` (the picture is at ${video.currentTime.toFixed(1)} s)`);
    }
  });

  d.log(`${ARCHIVE.durationMs / 1000}s show · cues at ${CUES.map((c) => (c.offsetMs / 1000).toFixed(1)).join(', ')}s`);
  d.ready();
</script>
</html>
