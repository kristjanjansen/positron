<!doctype html>
<meta charset="utf-8">
<title>Resilience test v6 — gate-split validation</title>
<style>
  :root{color-scheme:dark}
  body{background:#0d1317;color:#e4ecef;font:14px/1.6 ui-monospace,Menlo,monospace;margin:0;padding:20px;
       display:flex;flex-direction:column;gap:14px;align-items:flex-start}
  video{width:560px;background:#000;border-radius:6px}
  .row{display:flex;gap:24px;flex-wrap:wrap}
  .stat{display:flex;flex-direction:column;gap:2px}
  .k{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:#7b8d96}
  .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .ok{color:#4fb588} .warn{color:#c79b4c} .bad{color:#d9705c}
  #log{font-size:11.5px;color:#8fa3ad;max-height:220px;overflow:auto;width:min(900px,100%);
       border-top:1px solid #26343b;padding-top:8px;white-space:pre-wrap}
</style>

<video id="v" muted playsinline></video>
<div class="row">
  <div class="stat"><span class="k">state</span><span class="v" id="st">—</span></div>
  <div class="stat"><span class="k">latency</span><span class="v" id="lat">—</span></div>
  <div class="stat"><span class="k">stalls</span><span class="v" id="stalls">0</span></div>
  <div class="stat"><span class="k">resyncs</span><span class="v" id="rs">0</span></div>
  <div class="stat"><span class="k">rebuilds</span><span class="v" id="rb">0</span></div>
  <div class="stat"><span class="k">fatal</span><span class="v" id="fat">0</span></div>
</div>
<div id="log"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script type="module">
// v6 validation page. Differences from resilience.html:
//  - ?player=v5|v6 dynamically imports the backup or the current player, so
//    both versions run through the IDENTICAL harness in one session.
//  - payload adds rebuilds, hls.targetLatency (Q6: does it bump after stalls?),
//    pdtWallLatency (honest signal during ingest pauses), lsp / lspMinusCt,
//    seekableEnd, and structured player events (stall kinds, rebuild reasons).
const q   = new URLSearchParams(location.search);
const uid = q.get('uid');
const ver = q.get('player') === 'v5' ? 'v5' : 'v6';
const mod = await import(ver === 'v5' ? '../src/low-latency-player.v5.js'
                                      : '../src/low-latency-player.js');
const src = `https://customer-mwuu1cmlyif6eluy.cloudflarestream.com/${uid}/manifest/video.m3u8?protocol=llhls`;

const $ = id => document.getElementById(id);
const logEl = $('log');
const log = m => { logEl.textContent = `${new Date().toISOString().slice(11,23)} ${m}\n` + logEl.textContent.slice(0,6000); };

let stalls = 0, resyncs = 0, fatals = 0, rebuilds = 0;
let lastTime = -1, lastAdvance = performance.now();
const errors = [];
const events = [];
let lastLatencyEvt = null;

const num = (k, d) => (q.has(k) ? Number(q.get(k)) : d);
const CFG = {
  seekThreshold:  num('seek',   2.0),
  nudgeThreshold: num('nudge',  0.3),
  catchUpRate:    num('rate',   1.05),
  resyncOnVisible: q.get('vis') !== '0',
};
if (q.get('pdt') === '1') CFG.pdtDriftTrigger = true;
const RUN = q.get('run') || `chaos-${ver}`;

const player = mod.createLowLatencyPlayer($('v'), src, CFG);
window.player = player;
log(`player=${ver} cfg seek=${CFG.seekThreshold} nudge=${CFG.nudgeThreshold} rate=${CFG.catchUpRate} pdt=${!!CFG.pdtDriftTrigger}`);

player.on('resync', (p) => { resyncs++; $('rs').textContent = resyncs; events.push({e:'resync', ...p}); log(`resync(${p.reason}) -> ${p.to.toFixed(2)}`); });
player.on('stall',  (p) => { stalls++; $('stalls').textContent = stalls; events.push({e:'stall', ...p}); log(`stall kind=${p.kind} attempt=${p.attempt ?? ''}`); });
player.on('rebuild',(p) => { rebuilds++; $('rb').textContent = rebuilds; events.push({e:'rebuild', ...p}); log(`rebuild #${p.attempt} (${p.why})`); });
player.on('latency',(p) => { lastLatencyEvt = p; });
player.on('error',  (e) => {
  const d = e?.details || e?.message || String(e);
  if (e?.fatal) { fatals++; $('fat').textContent = fatals; }
  const u = e?.frag?.url || e?.url || e?.context?.url || '';
  const tail = u ? u.split('/').slice(-4).join('/').split('?')[0] : undefined;
  errors.push({ t: Date.now(), fatal: !!e?.fatal, details: d,
                url: tail, code: e?.response?.code });
  log(`${e?.fatal ? 'FATAL' : 'warn '} ${d} ${e?.response?.code ?? ''} ${tail ?? ''}`);
});

// "advancing" is the ground truth for recovery: currentTime must actually move.
function sample() {
  const v = $('v');
  const now = performance.now();
  const t = v.currentTime;
  // A rebuild attaches a NEW broadcast whose timeline restarts near zero.
  if (t < lastTime - 1) lastTime = t - 0.02;
  const advancing = t > lastTime + 0.01;
  if (advancing) { lastTime = t; lastAdvance = now; }
  const stalledMs = now - lastAdvance;

  const wasStalled = sample.stalled || false;
  const isStalled = stalledMs > 1500 && !v.paused;
  if (isStalled && !wasStalled) { stalls; log(`STALL begins`); }
  if (!isStalled && wasStalled) log(`recovered after ${(stalledMs/1000).toFixed(1)}s stall`);
  sample.stalled = isStalled;

  const lat = player.latency;
  const hls = player.hls;
  const pd = hls?.playingDate;
  const lsp = hls?.liveSyncPosition;
  $('st').textContent = v.paused ? 'paused' : isStalled ? 'STALLED' : 'playing';
  $('st').className = 'v ' + (isStalled ? 'bad' : v.paused ? 'warn' : 'ok');
  $('lat').textContent = lat == null ? '—' : lat.toFixed(2) + 's';
  $('lat').className = 'v ' + (lat == null ? '' : lat <= player.target + 1 ? 'ok' : lat <= player.target + 4 ? 'warn' : 'bad');

  const payload = {
    run: RUN, ver, cfg: CFG,
    currentTime: +t.toFixed(3),
    advancing, stalledMs: Math.round(stalledMs),
    readyState: v.readyState, paused: v.paused,
    latency: lat, target: player.target,
    hlsTargetLatency: hls?.targetLatency ?? null,       // Q6 raw signal
    pdtWallLatency: pd ? +((Date.now() - pd.getTime())/1000).toFixed(3) : null,
    evtPdtLatency: lastLatencyEvt?.pdtLatency ?? null,  // v6 telemetry passthrough
    lsp: lsp == null ? null : +lsp.toFixed(3),
    lspMinusCt: lsp == null ? null : +(lsp - t).toFixed(3),
    seekableEnd: v.seekable.length ? +v.seekable.end(v.seekable.length-1).toFixed(3) : null,
    buffered: v.buffered.length ? +(v.buffered.end(v.buffered.length-1) - t).toFixed(3) : null,
    playbackRate: +v.playbackRate.toFixed(3),
    stalls, resyncs, rebuilds, fatals,
    visibility: document.visibilityState,
    newEvents: events.splice(0, events.length),
    newErrors: errors.splice(0, errors.length),
  };
  fetch('/collect', {method:'POST', headers:{'content-type':'application/json'},
                     body: JSON.stringify(payload)}).catch(()=>{});
}
setInterval(sample, 500);
log(`watching ${uid} with player ${ver}`);
</script>
