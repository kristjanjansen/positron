<!DOCTYPE html>
<meta charset="utf-8">
<title>pro-instrument — the synth end</title>
<style>body{font:14px ui-monospace,monospace;background:#0d1017;color:#c9d1d9;padding:2rem}b{color:#ffd400}</style>
<h3>synth end — runs ON the Pro</h3>
<pre id="log"></pre>
<script type="module">
// THE INSTRUMENT. Answers one RTCPeerConnection, receives notes on a
// DataChannel, and sends its own audio back on the same connection.
//
// The relay carries ONLY signalling. Notes ride the DataChannel because the jam
// rig measured that leg at 0.56-0.77 ms, where a round trip to Cloudflare's edge
// and back is 26-38 ms. Signalling is not in the timing path; notes are.
//
// Chrome must be launched with --autoplay-policy=no-user-gesture-required, or
// the AudioContext stays suspended and NEVER REJECTS -- it just silently never
// makes a sound, which is the trap CLAUDE.md calls "never let sound gate the
// work".
const Q = new URLSearchParams(location.search);
const ROOM = Q.get('room') || 'proinst';
// FRESH NAMESPACE EVERY START. On draft-14 a same-name rejoin before the relay
// has GC'd the old one BRICKS the name -- the publisher looks healthy and every
// subscriber gets "SUBSCRIBE code=4 Track not found" forever. Restarting this
// page five times under one fixed name is exactly how that was re-earned.
// The name is therefore minted here and TOLD to players over the relay.
const MOQ_NS = Q.get('ns') || `proinst-${Date.now().toString(36)}`;
// A relay on the LAN, if one was named at launch. The synth PUBLISHES to it over
// loopback (no Local Network permission involved) and ANNOUNCES the address a
// player should use, along with the certificate fingerprint to pin -- a player
// cannot derive either, and guessing a fingerprint is not a thing.
const MOQ_RELAY_PUB = Q.get('moqRelay') || null;          // e.g. https://127.0.0.1:4443
const MOQ_RELAY_SUB = Q.get('moqRelayFor') || MOQ_RELAY_PUB;   // what players dial
const MOQ_CERT = Q.get('moqCert') || null;                // sha-256 hex of the DER
// ?instrument=ableton makes this page a BRIDGE rather than a synth: notes go out
// of a MIDI port into Live, and Live's audio comes back in through a loopback
// device. The internal oscillator stays the default so the rig works with no
// Live, no MIDI port and no audio device configured.
const INSTRUMENT = Q.get('instrument') || 'internal';
const MIDI_PORT = Q.get('midiPort') || 'IAC Driver Bus 1';
const AUDIO_IN = Q.get('audioIn') || 'BlackHole';
const log = (m) => { document.getElementById('log').textContent += m + '\n'; console.log('[synth]', m); };

const ac = new AudioContext({ latencyHint: 'interactive' });
await ac.resume().catch(() => {});
const dest = ac.createMediaStreamDestination();
// One bus everything plays into, so the WebRTC track and the MoQ publisher are
// fed by the SAME sound rather than two graphs that could differ.
const bus = ac.createGain();
bus.connect(dest);
// A tiny gain floor keeps the track from being latched silent: Chrome hands an
// AudioWorklet an EMPTY input array when it decides a bus is silent, and a
// WebRTC sender can likewise treat a dead track as nothing to send.
const keepAlive = ac.createConstantSource();
const kg = ac.createGain(); kg.gain.value = 0.0001;
keepAlive.connect(kg).connect(bus); keepAlive.start();
log(`audio ${ac.state} @ ${ac.sampleRate} Hz, baseLatency ${(ac.baseLatency*1000).toFixed(1)} ms`);

let midiOut = null;
function playMidi(note, vel) {
  // Note-off is SCHEDULED, not hoped for: a dropped note-off is a stuck note,
  // and the reducer lesson from the looper says the release must not depend on
  // a later message arriving.
  midiOut.send([0x90, note, Math.max(1, Math.min(127, vel))]);
  midiOut.send([0x80, note, 0], performance.now() + 450);
}

function play(note, vel = 100) {
  if (INSTRUMENT === 'ableton') {
    if (!midiOut) { log('no MIDI port yet — note dropped'); return; }
    playMidi(note, vel);
    return;
  }
  const f = 440 * Math.pow(2, (note - 69) / 12);
  const t = ac.currentTime;
  const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
  const g = ac.createGain();
  // A short envelope, not a click: an instantaneous edge is broadband and Opus
  // spends its bitrate on it.
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(Math.max(vel, 1) / 127 * 0.3, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
  o.connect(g).connect(bus);
  o.start(t); o.stop(t + 0.5);
}

// A FRESH CONNECTION PER OFFER. Holding one for the page's life meant that once
// a player went away the connection stayed bound to a dead peer, and the next
// player could never establish -- which looks exactly like "the synth is down"
// while the synth is fine and still in the room. Only the FIRST client of a
// given synth process ever worked.
let pc = null;
function accept() {
  if (pc) { try { pc.close(); } catch { /* already */ } }
  pc = new RTCPeerConnection({ iceServers: [] });        // LAN: host candidates only
  for (const track of dest.stream.getAudioTracks()) pc.addTrack(track, dest.stream);
  pc.oniceconnectionstatechange = () => log(`ice ${pc.iceConnectionState}`);
  pc.ondatachannel = (e) => {
    const dc = e.channel;
    dc.onopen = () => log(`datachannel "${dc.label}" open`);
    dc.onmessage = (m) => {
      const msg = JSON.parse(m.data);
      if (msg.type === 'note') { play(msg.note, msg.vel); dc.send(JSON.stringify({ type: 'ack', seq: msg.seq, at: msg.at })); }
    };
  };
  return pc;
}

if (INSTRUMENT === 'ableton') {
  // OUT: notes to Live over a MIDI port.
  navigator.requestMIDIAccess({ sysex: false }).then((a) => {
    const ports = [...a.outputs.values()];
    midiOut = ports.find((o) => o.name.includes(MIDI_PORT)) || null;
    log(midiOut ? `midi out: ${midiOut.name}` : `midi out: NO PORT matching "${MIDI_PORT}" (ports: ${ports.map((o) => o.name).join(', ') || 'none'})`);
  }).catch((e) => log('midi denied: ' + e.message));

  // IN: Live's audio, through a loopback device, onto the SAME bus the internal
  // synth would have used -- so the WebRTC track and the MoQ publisher are fed
  // by one source either way and nothing downstream has to know which.
  navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
  }).then(async (probe) => {
    probe.getTracks().forEach((t) => t.stop());            // permission first, then labels
    const devs = await navigator.mediaDevices.enumerateDevices();
    const dev = devs.find((d) => d.kind === 'audioinput' && d.label.includes(AUDIO_IN));
    if (!dev) { log(`audio in: NO DEVICE matching "${AUDIO_IN}" (${devs.filter((d) => d.kind === 'audioinput').map((d) => d.label).join(', ') || 'none'})`); return; }
    const st = await navigator.mediaDevices.getUserMedia({
      audio: { deviceId: { exact: dev.deviceId }, echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    });
    ac.createMediaStreamSource(st).connect(bus);
    log(`audio in: ${dev.label}`);
    // A LEVEL METER ON THE BUS. Without it, "the capture is connected" and "Live
    // is making a sound" are indistinguishable -- both look like silence at the
    // far end, and only one of them is our problem.
    const an = ac.createAnalyser(); an.fftSize = 2048;
    bus.connect(an);
    const buf = new Float32Array(an.fftSize);
    window.__synth.level = (ms = 1000) => new Promise((res) => {
      let peak = 0;
      const t0 = performance.now();
      const tick = () => {
        an.getFloatTimeDomainData(buf);
        for (const v of buf) { const a = v < 0 ? -v : v; if (a > peak) peak = a; }
        if (performance.now() - t0 < ms) requestAnimationFrame(tick); else res(peak);
      };
      tick();
    });
  }).catch((e) => log('audio in denied: ' + e.message));
}

// The MoQ arm, published continuously beside the WebRTC one so a listener can
// switch between them and hear the SAME instrument two ways.
import('./moq-audio.mjs').then(async ({ publishSynth }) => {
  try {
    const { pinned } = await import('./moq-audio.mjs');
    const pub = await publishSynth({
      ac, bus, msDest: dest, ns: MOQ_NS, log,
      ...(MOQ_RELAY_PUB ? { relay: MOQ_RELAY_PUB } : {}),
      ...(MOQ_CERT ? { connect: pinned(MOQ_CERT) } : {}),
    });
    setInterval(() => { const st = pub.stats(); log(`moq: ${st.published} frames, ${(st.bytes/1024).toFixed(0)} KiB`); }, 15000);
    window.__synth.moq = pub;
  } catch (e) { log('moq publish FAILED: ' + e.message); }
});

const ws = new WebSocket(`wss://ws.positron.studio/room/${ROOM}/ws`);
const send = (o) => ws.send(JSON.stringify({ from: 'synth', at: Date.now(), ...o }));
ws.onopen = () => { log(`relay open (${ROOM})`); send({ type: 'here', ns: MOQ_NS, moqRelay: MOQ_RELAY_SUB, moqCert: MOQ_CERT }); };
ws.onmessage = async (e) => {
  const m = JSON.parse(typeof e.data === 'string' ? e.data : '{}');
  if (m.from === 'synth') return;                       // the relay echoes to sender
  if (m.type === 'note') {                              // the RELAY arm of the A/B
    play(m.note, m.vel);
    send({ type: 'ack', seq: m.seq, via: 'ws' });
    return;
  }
  if (m.type === 'hello') { send({ type: 'here', ns: MOQ_NS, moqRelay: MOQ_RELAY_SUB, moqCert: MOQ_CERT }); return; }
  if (m.type === 'offer') {
    const c = accept();
    await c.setRemoteDescription({ type: 'offer', sdp: m.sdp });
    const a = await c.createAnswer(); await c.setLocalDescription(a);
    await new Promise((r) => c.iceGatheringState === 'complete' ? r()
      : c.addEventListener('icegatheringstatechange', () => c.iceGatheringState === 'complete' && r()));
    send({ type: 'answer', sdp: c.localDescription.sdp, ns: MOQ_NS, moqRelay: MOQ_RELAY_SUB, moqCert: MOQ_CERT });
    log('answered');
  }
};
window.__synth = { ready: true, played: 0, play: (n = 60, v = 100) => play(n, v) };
</script>
