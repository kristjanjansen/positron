[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x720x24 -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/var/log/xvfb.log
redirect_stderr=true

[program:obs]
command=/usr/local/bin/start-obs.sh
priority=20
user=obs
environment=DISPLAY=":99",HOME="/home/obs",XDG_CONFIG_HOME="/home/obs/.config",XDG_CACHE_HOME="/home/obs/.cache",XDG_RUNTIME_DIR="/tmp/xdg-obs"
autorestart=true
startsecs=5
stopwaitsecs=15
stdout_logfile=/var/log/obs.log
redirect_stderr=true

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -nopw -shared -rfbport 5900
priority=30
autorestart=true
stdout_logfile=/var/log/x11vnc.log
redirect_stderr=true
