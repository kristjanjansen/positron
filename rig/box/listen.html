<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .pick { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 0 0 14px; }
  .pick .fx, .d-controls .fx { display: inline-flex; gap: 6px; align-items: center; margin-left: auto; }
  .d-controls .fx .lab { color: var(--dim2); font: 500 11px/1 var(--mono); letter-spacing: .06em;
                         text-transform: uppercase; margin: 0 2px 0 0; }
  .d-controls button.die { font-size: 15px; line-height: 1; padding: 4px 9px; }
  .d-controls button.die:disabled, .d-controls .fx button:disabled {
    opacity: .35; cursor: default; border-color: var(--line); }
  .d-controls .fx button[aria-pressed="true"] {
    color: var(--hi); border-color: var(--hi);
    background: color-mix(in oklab, var(--hi) 16%, var(--card2)); }
  /* ⚠️ FOCUS MUST NOT WEAR THE ARMED COLOUR. The shell's global rule is
     `:focus-visible { outline: 2px solid var(--hi) }` — the same green the
     armed state uses — so a focused-but-OFF switch was indistinguishable from
     an armed one, and read as "pappus is on" while the log said bypassed.
     Focus goes grey; green means armed and nothing else. */
  .d-controls .fx button:focus:not(:focus-visible),
  .pick button:focus:not(:focus-visible) { outline: none; }
  .d-controls .fx button:focus-visible,
  .pick button:focus-visible { outline: 2px solid var(--dim2); outline-offset: 2px; }
  /* and the switch says which it is in words, so nobody has to read a colour */
  .d-controls .fx button[aria-pressed="false"]::after { content: ' off'; opacity: .5; }
  .d-controls .fx button[aria-pressed="true"]::after { content: ' on'; opacity: .7; }
  .pick .fx .lab { margin: 0 2px 0 0; }
  .pick button.die { font-size: 15px; line-height: 1; padding: 4px 9px; }
  .pick button.die:disabled { opacity: .35; cursor: default; border-color: var(--line); }
  .pick button:disabled { opacity: .35; cursor: default; border-color: var(--line); }
  /* ⚠️ A FOCUS RING IS NOT A SELECTION. After clicking, the effect switch kept
     a yellow outline that read as "armed" while it was in fact bypassed —
     sitting one row from a genuinely armed instrument wearing the same colour.
     Pointer clicks lose the ring; keyboard focus keeps it, which is who needs
     it. */
  .pick button:focus:not(:focus-visible) { outline: none; }
  .pick button:focus-visible { outline: 2px solid var(--dim2); outline-offset: 2px; }
  .pick .lab { flex: none; color: var(--dim2); font: 500 11px/1 var(--mono);
               letter-spacing: .06em; text-transform: uppercase; margin-right: 4px; }
  /* the armed instrument gets the same treatment the transport bar gives its
     armed rate, and demo/score gives its selected line: a fill as well as an
     edge, because colour alone in a row of buttons reads as noise */
  .pick button[aria-pressed="true"] {
    color: var(--hi); border-color: var(--hi);
    background: color-mix(in oklab, var(--hi) 16%, var(--card2));
  }
  /* Starting a JACK instrument takes ten to forty seconds — jackd, the synth,
     a capture, then the port wiring. A button that just sits there reads as a
     dead click, so it breathes until the box confirms. */
  .pick button[data-busy] {
    color: var(--hi); border-color: var(--hi);
    animation: box-wait 1.1s ease-in-out infinite;
  }
  @keyframes box-wait {
    0%, 100% { background: color-mix(in oklab, var(--hi)  6%, var(--card2)); }
    50%      { background: color-mix(in oklab, var(--hi) 26%, var(--card2)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .pick button[data-busy] { animation: none; background: color-mix(in oklab, var(--hi) 16%, var(--card2)); }
  }
  .patch { font: 400 12px/1.6 var(--mono); color: var(--dim); }
  .patch b { color: var(--hi); font-weight: 400; }
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createKeyboard } from '/shell/keyboard.mjs';

  const q = new URLSearchParams(location.search);
  const ROOM = q.get('room') || 'studio-1';
  const RELAY = q.get('relay') || 'wss://ws.positron.studio';
  const ID = 'web-' + Math.random().toString(36).slice(2, 8);

  const d = mount({
    name: 'box',
    what: 'The instrument is a Raspberry Pi somewhere else, and this page makes no sound of its own — it sends your key presses to the board and plays back the samples that come back. So the delay you hear is a real journey rather than a setting: out to a server, down to the board, and all the way back, about a tenth of a second. Play with the a-to-k row or the keys below; z and x shift the octave.',
    readout: { frames: '', dropped: '', rate: '/s', 'round trip': 'ms', bitrate: 'kbit/s' },
    controls: [
      { id: 'oct-', label: '−' },
      { id: 'oct+', label: '+' },
      { id: 'panic', label: 'notes off' },
    ],
  });
  guard(d);

  // ── instruments, chosen at runtime ───────────────────────────────────────
  // Above the patch controls: the instrument decides what a patch number even
  // MEANS, so choosing it after choosing a patch is backwards.
  const picks = el('div', 'pick');
  picks.append(el('span', 'lab', 'instrument'));
  const controls = document.querySelector('.d-controls');
  if (controls) controls.parentNode.insertBefore(picks, controls);
  else d.el.append(picks);
  // Pinned right on the instrument row: a patch belongs to the instrument, and
  // choosing one is the next thing you do after choosing the other.
  // drawInstruments() inserts new instrument buttons before this block.
  const fxWrap = el('span', 'fx');
  const patchPrev = el('button', '', '◀', { type: 'button', title: 'previous patch' });
  const patchDie  = el('button', 'die', '🎲', { type: 'button', title: 'random patch' });
  const patchNext = el('button', '', '▶', { type: 'button', title: 'next patch' });
  // ◀ ▶ then the die: stepping and rolling are different gestures, and the two
  // arrows read as a pair when nothing sits between them.
  fxWrap.append(patchPrev, patchNext, patchDie);
  patchPrev.onclick = () => { idx = (idx - 1 + span()) % span(); showPatch(); sendPatch(); };
  patchNext.onclick = () => { idx = (idx + 1) % span(); showPatch(); sendPatch(); };
  patchDie.onclick  = () => { idx = Math.floor(Math.random() * span()); showPatch(); sendPatch(); };

  const patchLine = el('p', 'patch', '—');
  d.el.append(patchLine);

  // Pappus is an effect, so it is a switch beside the instruments rather than
  // one of them: it wraps whatever is playing, and can go on and off underneath.
  // The effect lives on the SAME line as the instruments, pushed right: it is
  // not a fourth instrument, it wraps whichever one is chosen, and the gap says
  // so better than a second row would.
  const fxRow = el('span', 'fx');
  fxRow.append(el('span', 'lab', 'effect'));
  const fxBtn = el('button', '', 'pappus', { type: 'button', 'aria-pressed': 'false' });
  // Its own die, because a granular parameter roll and a patch change are
  // different actions on different things — one surface has 106 knobs and no
  // patches, the other has patches and no knobs.
  const fxDie = el('button', 'die', '🎲', { type: 'button', title: 'roll the granular parameters' });
  fxDie.disabled = true;
  let fxOn = false;
  fxBtn.onclick = () => {
    fxOn = !fxOn;
    fxBtn.setAttribute('aria-pressed', String(fxOn));
    // The engine compiles a 2,030-line class library on first switch-on, about
    // forty seconds; after that a toggle is just a re-patch.
    if (fxOn) fxBtn.dataset.busy = '1';
    send({ type: 'fx.pappus', on: fxOn });
  };
  fxDie.onclick = () => { send({ type: 'params.random' }); d.log('rolled the granular parameters', 'hi'); };
  fxRow.append(fxBtn, fxDie);
  picks.append(fxWrap);
  // On the same row as the octave and panic buttons, pinned right: it is a
  // per-performance switch like they are, not a per-instrument choice.
  if (controls) { controls.style.display = 'flex'; controls.style.alignItems = 'center'; controls.append(fxRow); }
  else d.el.append(fxRow);

  let ctx = null, playout = null, ws = null, seq = 0;
  let frames = 0, lost = 0, last = -1, avail = null, current = null, idx = 0, lastBank = -1;
  let bytes = 0, firstFrame = 0, pingAt = 0, autoStarted = false;
  let soundfonts = [];

  const send = (m) => ws?.readyState === 1 && ws.send(JSON.stringify(
    { id: Math.random().toString(36).slice(2), type: '', ...m, from: ID, at: Date.now(), seq: seq++ }));

  // ── patch names ──────────────────────────────────────────────────────────
  // One continuous number rather than a bank control and a program control:
  // hexter is flat (128 voices, no banks) and FluidR3 has only bank 0 plus 128
  // for drums, so separate banks were clutter for two instruments out of three.
  // Walking past 127 rolls into the next bank, which is how Yoshimi's 393
  // instruments are reached with the same two buttons.
  const GM = ('Grand Piano,Bright Piano,Electric Grand,Honky-tonk,Electric Piano 1,Electric Piano 2,Harpsichord,Clavi,'
   + 'Celesta,Glockenspiel,Music Box,Vibraphone,Marimba,Xylophone,Tubular Bells,Dulcimer,'
   + 'Drawbar Organ,Percussive Organ,Rock Organ,Church Organ,Reed Organ,Accordion,Harmonica,Tango Accordion,'
   + 'Nylon Guitar,Steel Guitar,Jazz Guitar,Clean Guitar,Muted Guitar,Overdrive Guitar,Distortion Guitar,Guitar Harmonics,'
   + 'Acoustic Bass,Finger Bass,Pick Bass,Fretless Bass,Slap Bass 1,Slap Bass 2,Synth Bass 1,Synth Bass 2,'
   + 'Violin,Viola,Cello,Contrabass,Tremolo Strings,Pizzicato,Harp,Timpani,'
   + 'String Ens 1,String Ens 2,Synth Strings 1,Synth Strings 2,Choir Aahs,Voice Oohs,Synth Voice,Orchestra Hit,'
   + 'Trumpet,Trombone,Tuba,Muted Trumpet,French Horn,Brass Section,Synth Brass 1,Synth Brass 2,'
   + 'Soprano Sax,Alto Sax,Tenor Sax,Baritone Sax,Oboe,English Horn,Bassoon,Clarinet,'
   + 'Piccolo,Flute,Recorder,Pan Flute,Blown Bottle,Shakuhachi,Whistle,Ocarina,'
   + 'Square Lead,Saw Lead,Calliope,Chiff,Charang,Voice Lead,Fifths,Bass+Lead,'
   + 'New Age Pad,Warm Pad,Polysynth Pad,Choir Pad,Bowed Pad,Metallic Pad,Halo Pad,Sweep Pad,'
   + 'Rain,Soundtrack,Crystal,Atmosphere,Brightness,Goblins,Echoes,Sci-Fi,'
   + 'Sitar,Banjo,Shamisen,Koto,Kalimba,Bagpipe,Fiddle,Shanai,'
   + 'Tinkle Bell,Agogo,Steel Drums,Woodblock,Taiko,Melodic Tom,Synth Drum,Reverse Cymbal,'
   + 'Fret Noise,Breath Noise,Seashore,Bird Tweet,Telephone,Helicopter,Applause,Gunshot').split(',');

  // hexter loads all four DX7 factory cartridges; ROM1A voice 11 is E.PIANO 1,
  // and programs are zero-indexed, so that is program 10.
  const DX7 = ('BRASS 1,BRASS 2,BRASS 3,STRINGS 1,STRINGS 2,STRINGS 3,ORCHESTRA,PIANO 1,PIANO 2,PIANO 3,'
   + 'E.PIANO 1,GUITAR 1,GUITAR 2,SYN-LEAD 1,BASS 1,BASS 2,E.ORGAN 1,PIPES 1,HARPSICH 1,CLAV 1,'
   + 'VIBE 1,MARIMBA,KOTO,FLUTE 1,ORCH-CHIME,TUB BELLS,STEEL DRUM,TIMPANI,REFS WHISL,VOICE 1,TRAIN,TAKE OFF').split(',');

  const bankOf = (i) => (i >> 7) & 63, progOf = (i) => i & 127;
  // hexter is flat (128 DX7 voices). Yoshimi reports 1822 instruments in 48
  // banks, so the walk covers all of them.
  const span = () => (current === 'hexter' ? 128 : 48 * 128);
  const patchName = (i) => {
    const p = progOf(i);
    if (current === 'hexter') return DX7[p] ?? `voice ${p + 1}`;
    if (current?.startsWith('fluid')) return GM[p] ?? `program ${p}`;
    return `program ${p}`;               // yoshimi: the banks are the user's own
  };
  function showPatch() {
    patchLine.innerHTML = `<b>${patchName(idx)}</b>${bankOf(idx) ? ` · bank ${bankOf(idx)}` : ''}`;
  }
  // ⚠️ BANK SELECT IS CC 32 HERE, NOT CC 0. Read from Yoshimi's own config:
  //     MIDI Root CC 0        MIDI Bank CC 32        MIDI Program Change on
  // Sending banks on CC 0 was moving its ROOT DIRECTORY instead, pointing it at
  // roots that do not exist — so every program change after that landed
  // nowhere and patch changing looked broken. CC 0 is left alone entirely.
  function sendPatch() {
    const b = bankOf(idx), changed = b !== lastBank;
    if (changed) { send({ type: 'cc', channel: 0, ctrl: 32, value: b }); lastBank = b; }
    setTimeout(() => send({ type: 'voice.select', channel: 0, program: progOf(idx) }), changed ? 120 : 0);
  }

  // ── audio ────────────────────────────────────────────────────────────────
  async function startAudio() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    await ctx.resume();
    await ctx.audioWorklet.addModule('/proto/jam/playout-worklet.js');
    playout = new AudioWorkletNode(ctx, 'pcm-playout', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [1] });
    playout.connect(ctx.destination);
    // The cushion is OURS, not the browser's — which is the whole reason to
    // carry the samples ourselves rather than use WebRTC.
    playout.port.postMessage({ cmd: 'floor', ms: 60, adaptive: false });
  }

  // Drawn IMMEDIATELY rather than on a reply: gating the selector on the box's
  // answer left the page with no buttons at all whenever the box was busy.
  // A radio row: exactly one instrument is armed, and it is armed on load
  // rather than after the first click — a page that shows no selection while
  // something IS playing is lying about its own state.
  const arm = (name) => {
    for (const b of picks.querySelectorAll('button'))
      b.setAttribute('aria-pressed', String(b.dataset.src === name));
  };
  function drawInstruments() {
    // ⚠️ Only the INSTRUMENT buttons. Clearing every button in this row also
    // removed the effect switch and its die, and appending the new ones then
    // put them after the effect block — which is the layout falling apart in
    // two ways from one line. Instrument buttons are the ones with data-src.
    for (const b of [...picks.querySelectorAll('button[data-src]')]) b.remove();
    const mk = (label, src, msg, slow) => {
      const b = el('button', '', label, { type: 'button', 'aria-pressed': 'false' });
      b.dataset.src = src;
      b.onclick = async () => {
        await startAudio();
        arm(src);
        if (slow) { b.dataset.busy = '1'; d.log(`${label}: starting`, 'hi'); }
        send({ type: 'audio.stop' });
        setTimeout(() => send(msg), 400);
      };
      // before the effect block, which is pinned right with margin-left:auto
      picks.insertBefore(b, fxWrap);
    };
    if (soundfonts.length) for (const sf of soundfonts) mk(sf.name, sf.name, { type: 'audio.start', source: 'fluidsynth', soundfont: sf.path });
    else mk('sampled', 'fluidsynth', { type: 'audio.start', source: 'fluidsynth' });
    for (const k of ['hexter', 'yoshimi']) {
      if (avail && avail[k] === false) continue;
      mk(k, k, { type: 'audio.start', source: k }, true);
    }
    arm(armed);
  }
  let armed = null;
  drawInstruments();

  // ── the keyboard, from the shell ─────────────────────────────────────────
  const kb = createKeyboard(d.el, {
    base: 60,
    onDown: (note) => { kb.lightNote(note, true); startAudio().then(() => send({ type: 'note.on', note, vel: 100, channel: 0 })); },
    onUp: (note) => { kb.lightNote(note, false); send({ type: 'note.off', note, channel: 0 }); },
  });

  // ── the socket ───────────────────────────────────────────────────────────
  function connect() {
    ws = new WebSocket(`${RELAY}/room/${ROOM}/ws`);
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => { d.log(`joined ${ROOM}`, 'hi'); send({ type: 'sf.list' }); send({ type: 'audio.status' }); };
    // The relay's Durable Object can be restarted under us; without this the
    // page keeps its buttons and answers nobody, which looks like a dead box.
    ws.onclose = () => { d.log('socket closed — reconnecting'); setTimeout(connect, 1000); };
    ws.onerror = () => {};
    ws.onmessage = (e) => {
      if (typeof e.data !== 'string') {
        const s = new DataView(e.data).getUint32(0, true);
        if (last >= 0 && s > last + 1) lost += s - last - 1;
        last = s; frames++;
        if (!firstFrame) firstFrame = performance.now();
        const pcm = new Int16Array(e.data, 12);
        const f32 = new Float32Array(pcm.length);
        let sum = 0;
        for (let i = 0; i < pcm.length; i++) { f32[i] = pcm[i] / 32768; sum += f32[i] * f32[i]; }
        bytes += e.data.byteLength;
        if (frames % 10 === 0) {
          const secs = (performance.now() - firstFrame) / 1000;
          d.set('frames', frames);
          d.set('dropped', lost, lost ? 'bad' : 'ok');
          // 50/s is one clean source. Anything above it is TWO instruments
          // streaming into one socket, which is what a garbled stream sounds
          // like — so this cell is a fault detector, not decoration.
          const fps = frames / Math.max(0.001, secs);
          d.set('rate', fps.toFixed(1), Math.abs(fps - 50) < 6 ? 'ok' : 'bad');
          d.set('bitrate', Math.round(bytes * 8 / 1000 / Math.max(0.001, secs)));
        }
        playout?.port.postMessage({ pcm: f32 }, [f32.buffer]);
        return;
      }
      let m; try { m = JSON.parse(e.data); } catch { return; }
      if (m.from === ID) return;
      // ONE CLOCK, both stamps: the box's performance.now() and ours share no
      // origin, so this is timed entirely here and contains no clock offset.
      if (m.type === 'box.pong' && pingAt) { d.set('round trip', Math.round(performance.now() - pingAt)); pingAt = 0; }
      if (m.type === 'box.hello') { avail = m.instruments ?? null; drawInstruments(); send({ type: 'sf.list' }); }
      if (m.type === 'sf.listed') { soundfonts = m.soundfonts || []; drawInstruments(); }
      if (m.type === 'fx.pappus') {
        fxOn = !!m.on;
        delete fxBtn.dataset.busy;
        fxBtn.setAttribute('aria-pressed', String(fxOn));
        fxDie.disabled = !fxOn;
        d.log(m.ok ? (fxOn ? 'pappus inserted' : 'pappus bypassed') : `pappus: ${m.reason}`, m.ok ? 'hi' : 'bad');
      }
      if (m.type === 'params.rolled' && m.ok) {
        const p = m.params;
        patchLine.innerHTML = `<b>granular</b> · rate ${p.mrate} · size ${p.msize} · swarm ${p.mswarm} · spray ${p.mspray}`;
      }
      if (m.type === 'audio.started') {
        for (const c of picks.querySelectorAll('button')) delete c.dataset.busy;
        // Nothing playing on arrival: start the cheap instrument rather than
        // present a page where every control does nothing until you guess that
        // one of the buttons is a prerequisite.
        if (!m.ok && m.reason === 'nothing playing' && !autoStarted) {
          autoStarted = true;
          d.log('nothing was playing — starting the sampled instrument', 'hi');
          send({ type: 'audio.start', source: 'fluidsynth' });
          return;
        }
        if (m.ok) {
          current = m.source; lastBank = -1;
          // Arm by what the BOX reports, not by what was clicked — the box is
          // the authority on which instrument is sounding, and a page that
          // joins mid-session has clicked nothing.
          armed = m.soundfont ? m.soundfont.replace(/.*\//, '').replace(/\.sf[23]$/i, '') : m.source;
          arm(armed);

          // An insert can only reach a JACK instrument. FluidSynth writes to a
          // pipe, so the switch is disabled rather than offered and refused.
          const wrappable = m.source === 'hexter' || m.source === 'yoshimi';
          fxBtn.disabled = !wrappable;
          fxBtn.title = wrappable ? 'granular insert' : 'fluidsynth writes to a pipe, not to JACK';
          if (!wrappable && fxOn) { fxOn = false; fxBtn.setAttribute('aria-pressed', 'false'); fxDie.disabled = true; }
          showPatch();
          if (m.fx) { fxOn = true; fxBtn.setAttribute('aria-pressed', 'true'); fxDie.disabled = false; }
          d.log(`playing ${m.source}`, 'hi');
        }
        else { d.set('playing', 'failed'); d.log(`failed: ${m.reason}`, 'bad'); }
      }
    };
  }
  // "random" means a different thing per instrument. Pappus has no patches at
  // all — it has 106 parameters — so rolling a program number there does
  // nothing audible, which is exactly how it sounded.
  const octave = () => d.log(`octave: base note ${kb.base} (${['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][kb.base % 12]}${Math.floor(kb.base / 12) - 1})`);
  d.on('oct-', () => { kb.shiftOctave(-1); octave(); });
  d.on('oct+', () => { kb.shiftOctave(1); octave(); });
  // z / x as well, because a keyboard player's hands are already on the keys.
  addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
    const k = e.key.toLowerCase();
    if (k === 'z' || k === 'x') { kb.shiftOctave(k === 'z' ? -1 : 1); octave(); }
  });
  d.on('panic', () => send({ type: 'note.panic' }));

  // Steering round trip, every few seconds. This is the CONTROL plane, not the
  // audio: what a key press costs to reach the board, before anything is made.
  setInterval(() => { if (ws?.readyState === 1 && !pingAt) { pingAt = performance.now(); send({ type: 'box.ping' }); } }, 4000);

  showPatch();
  connect();
  d.ready();
</script>
</html>
