<text x="40" y="40" font-size="20" font-weight="700" fill="#222">0.96" OLED + 4 keys on the Raspberry Pi 4</text>
<text x="40" y="64" font-size="13" fill="#555">8 female to female jumpers, Pi pin straight to module pin. Power comes from the Pi's 3.3 V.</text>
