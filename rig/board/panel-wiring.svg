<text x="40" y="404" font-size="14" font-weight="700" fill="#222">module pin   Pi pin   signal</text>
<rect x="40" y="418" width="14" height="14" fill="#222"/>
<text x="64" y="430" font-size="14" fill="#222" xml:space="preserve">GND         6     GND</text>
<rect x="40" y="442" width="14" height="14" fill="#d63b3b"/>
<text x="64" y="454" font-size="14" fill="#222" xml:space="preserve">VCC         1     3V3</text>
<rect x="40" y="466" width="14" height="14" fill="#f08a24"/>
<text x="64" y="478" font-size="14" fill="#222" xml:space="preserve">SCL         5     GPIO3 SCL</text>
<rect x="40" y="490" width="14" height="14" fill="#2f7bd6"/>
<text x="64" y="502" font-size="14" fill="#222" xml:space="preserve">SDA         3     GPIO2 SDA</text>
<rect x="40" y="514" width="14" height="14" fill="#8a4fd1"/>
<text x="64" y="526" font-size="14" fill="#222" xml:space="preserve">K4         37     GPIO26</text>
<rect x="40" y="538" width="14" height="14" fill="#8a4fd1"/>
<text x="64" y="550" font-size="14" fill="#222" xml:space="preserve">K3         33     GPIO13</text>
<rect x="40" y="562" width="14" height="14" fill="#8a4fd1"/>
<text x="64" y="574" font-size="14" fill="#222" xml:space="preserve">K2         31     GPIO6</text>
<rect x="40" y="586" width="14" height="14" fill="#8a4fd1"/>
<text x="64" y="598" font-size="14" fill="#222" xml:space="preserve">K1         29     GPIO5</text>
<text x="40" y="638" font-size="12" fill="#e0457b">Never pins 2 or 4 (5 V). At 5 V the module's pull-ups put 5 V on GPIO2/3.</text>
<text x="40" y="658" font-size="12" fill="#444">Keys pull to GND inside the module; the Pi's internal pull-ups do the rest.</text>
<text x="40" y="678" font-size="12" fill="#444">Check the order printed on YOUR module and wire by name;</text>
<text x="40" y="698" font-size="12" fill="#444">this order is read off the shop's photo.</text>
