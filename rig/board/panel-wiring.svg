<text x="234" y="868" font-size="15" fill="#222" font-weight="400" text-anchor="start">bottom</text>
<text x="324" y="868" font-size="15" fill="#222" font-weight="400" text-anchor="start">3rd from the left</text>
<text x="494" y="868" font-size="15" fill="#222" font-weight="400" text-anchor="start">I2C clock (GPIO3), the Pi sets the pace</text>
<rect x="40" y="881" width="14" height="14" fill="#2f7bd6"/>
<text x="64" y="894" font-size="15" fill="#222" font-weight="400" text-anchor="start">SDA</text>
<text x="154" y="894" font-size="15" fill="#222" font-weight="400" text-anchor="start">3</text>
<text x="234" y="894" font-size="15" fill="#222" font-weight="400" text-anchor="start">bottom</text>
<text x="324" y="894" font-size="15" fill="#222" font-weight="400" text-anchor="start">2nd from the left</text>
<text x="494" y="894" font-size="15" fill="#222" font-weight="400" text-anchor="start">I2C data (GPIO2), pictures to the screen</text>
<rect x="40" y="907" width="14" height="14" fill="#8a4fd1"/>
<text x="64" y="920" font-size="15" fill="#222" font-weight="400" text-anchor="start">K4</text>
<text x="154" y="920" font-size="15" fill="#222" font-weight="400" text-anchor="start">37</text>
<text x="234" y="920" font-size="15" fill="#222" font-weight="400" text-anchor="start">bottom</text>
<text x="324" y="920" font-size="15" fill="#222" font-weight="400" text-anchor="start">2nd from the right</text>
<text x="494" y="920" font-size="15" fill="#222" font-weight="400" text-anchor="start">button 4 (GPIO26)</text>
<rect x="40" y="933" width="14" height="14" fill="#8a4fd1"/>
<text x="64" y="946" font-size="15" fill="#222" font-weight="400" text-anchor="start">K3</text>
<text x="154" y="946" font-size="15" fill="#222" font-weight="400" text-anchor="start">33</text>
<text x="234" y="946" font-size="15" fill="#222" font-weight="400" text-anchor="start">bottom</text>
<text x="324" y="946" font-size="15" fill="#222" font-weight="400" text-anchor="start">4th from the right</text>
<text x="494" y="946" font-size="15" fill="#222" font-weight="400" text-anchor="start">button 3 (GPIO13)</text>
<rect x="40" y="959" width="14" height="14" fill="#8a4fd1"/>
<text x="64" y="972" font-size="15" fill="#222" font-weight="400" text-anchor="start">K2</text>
<text x="154" y="972" font-size="15" fill="#222" font-weight="400" text-anchor="start">31</text>
<text x="234" y="972" font-size="15" fill="#222" font-weight="400" text-anchor="start">bottom</text>
<text x="324" y="972" font-size="15" fill="#222" font-weight="400" text-anchor="start">5th from the right</text>
<text x="494" y="972" font-size="15" fill="#222" font-weight="400" text-anchor="start">button 2 (GPIO6)</text>
<rect x="40" y="985" width="14" height="14" fill="#8a4fd1"/>
<text x="64" y="998" font-size="15" fill="#222" font-weight="400" text-anchor="start">K1</text>
<text x="154" y="998" font-size="15" fill="#222" font-weight="400" text-anchor="start">29</text>
<text x="234" y="998" font-size="15" fill="#222" font-weight="400" text-anchor="start">bottom</text>
<text x="324" y="998" font-size="15" fill="#222" font-weight="400" text-anchor="start">6th from the right</text>
<text x="494" y="998" font-size="15" fill="#222" font-weight="400" text-anchor="start">button 1 (GPIO5)</text>
<text x="40" y="1034" font-size="13" fill="#555" font-weight="400" text-anchor="start">Nothing on the top row but GND. Pin 35, 3rd from the right on the bottom row, stays empty.</text>
<text x="40" y="1054" font-size="13" fill="#555" font-weight="400" text-anchor="start">Which K is which of the ^ v # * buttons is not printed on the module: pressing each one and reading the pins tells. A press should read low; not measured yet.</text>
<text x="40" y="1074" font-size="13" fill="#ff1a1a" font-weight="400" text-anchor="start">The two top-left pins are 5 V and would put 5 V on the screen and the Pi's I2C pins.</text>
</svg>