<text x="324" y="842" font-size="15" fill="#222" font-weight="400" text-anchor="start">1st from the left</text>
<text x="494" y="842" font-size="15" fill="#222" font-weight="400" text-anchor="start">power in, 3.3 V from the Pi</text>
<rect x="40" y="855" width="14" height="14" fill="#f08a24"/>
<text x="64" y="868" font-size="15" fill="#222" font-weight="400" text-anchor="start">SCL</text>
