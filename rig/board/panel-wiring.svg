<rect width="100%" height="100%" fill="#f4f1ea"/>
<text x="40" y="40" font-size="20" font-weight="700" fill="#222">0.96" OLED + 4 keys on the Raspberry Pi 4</text>
<text x="40" y="64" font-size="13" fill="#555">8 jumpers, female on the Pi, male in the breadboard. Power comes from the Pi's 3.3 V. The breadboard's own supply stays OFF.</text>
<rect x="40" y="120" width="540" height="84" rx="6" fill="#2e7d4f"/>
<text x="46" y="106" font-size="12" fill="#555">Pi header, seen from above. Outer row is even pins. Pin 1 is the end AWAY from the USB ports</text>
