# rig/pico/oled/wiring.yml - WireViz description of the OLED on a Pico 2 W.
# Render: bash rig/pico/oled/render.sh  (WireViz in Docker, nothing on the Mac)
# The module's pin order is READ OFF ITS PRINTED LABELS in the shop's photo
# (oomipood.ee, 2026-10-04): GND VCC SCL SDA K4 K3 K2 K1, buttons in REVERSE.
# Wire each button by its printed name; the Pico side does not change.

connectors:
  Pico:
    type: Raspberry Pi Pico 2 W
    subtype: physical pins, pin 1 top left with USB up
    pins: [36, 38, 6, 7, 14, 15, 16, 17]
    pinlabels: [3V3(OUT), GND, GP4 I2C0 SDA, GP5 I2C0 SCL, GP10, GP11, GP12, GP13]
  OLED:
    type: 0.96 in OLED, 4 buttons
    subtype: SSD1306 128x64 I2C 0x3C
    pinlabels: [GND, VCC, SCL, SDA, K4, K3, K2, K1]
    notes: "buttons marked ^ v # * top to bottom, which K is which symbol is not visible, press each and read the count"

cables:
  W1:
    wirecount: 4
    colors: [RD, BK, BU, OG]
    category: bundle
    notes: display, 3.3 V only
  W2:
    wirecount: 4
    colors: [VT, VT, VT, VT]
    category: bundle
    notes: buttons, pressed pulls the pin to ground

connections:
  -
    - Pico: [36, 38, 6, 7]
    - W1: [1-4]
    - OLED: [2, 1, 4, 3]
  -
    - Pico: [14, 15, 16, 17]
    - W2: [1-4]
    - OLED: [8, 7, 6, 5]
