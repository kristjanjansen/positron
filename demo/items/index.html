<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<!--
  🔴 INSTALLABLE, AND ONLY THIS DIRECTORY. The manifest below is scoped to
  `/items/` and the service worker is served from here, so a worker's scope —
  which is the path it is served from — cannot reach the rest of the site.
  positron.studio is deliberately NOT a progressive web app: a site-wide worker
  is a cache, and every deployed page here carries a BUILD stamp precisely so
  that "still broken" and "the fix never loaded" can be told apart. A cache that
  serves a returning visitor the previous build destroys that. `push-sw.js` has
  no `fetch` handler at all and its header says why.

  The icons are the same `e+` mark as the favicon — same centre, same radii,
  same 11°-38° aperture — rendered square rather than rounded, because iOS masks
  a Home Screen icon itself and a rounded source is rounded twice.
-->
<!-- ⚠️ `.webmanifest`, NOT `.json`, AND THE REASON IS THE CONTENT TYPE. Static
     hosting names the type from the extension, so `manifest.json` went out as
     `application/json` while the spec type is `application/manifest+json`.
     Browsers are lenient about it and iOS gives no diagnostic either way, which
     is exactly why it is worth removing as a variable rather than arguing
     about: the cost is a rename. The app's identity is the manifest's `id`, not
     this URL, so an installed icon is unaffected. -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- 🔴 THE NAME IN SETTINGS IS THIS ONE, AND IT USED TO BE UNFINDABLE. iOS
     names a Home Screen web app from `apple-mobile-web-app-title` (falling back
     to the manifest's `short_name`), and that SAME name is its row in
     Settings -> Notifications. Both said "items", so somebody looking for
     "positron" in that list found nothing and concluded the app was not
     registered at all — REPORTED in exactly those words. A generic noun is a
     bad name for a row in a list of every app on a phone.
     ⚠️ iOS CACHES THE NAME AT INSTALL: an icon already on the Home Screen keeps
     the old one until it is removed and added again. -->
<meta name="apple-mobile-web-app-title" content="positron">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* 🔴 THE COMPOSER SITS ABOVE THE CONTROL ROW, AND THE LOG BELOW IT.
     Three reasons, in order of weight. The buttons that publish have to be
     under the thing they publish, or Publish is a verb with no visible object.
     The buttons themselves must stay INSIDE `.pos-controls`, because that is
     the only place `demo/verify.mjs` looks — a control outside it is a subject
     the suite silently stops testing — so the form moves up rather than the
     buttons moving down, which is the arrangement `wire` arrived at for the
     same reason. And the result belongs below the press: you write at the top,
     the row appears underneath, and you watch its state change without
     scrolling.

     ⚠️ GRID, NOT A COLUMN FLEX, AND THAT IS NOT A PREFERENCE. The two fields
     stack. `.pos-field.wide` carries `flex: 1 1 240px`, and in a COLUMN flex
     container a flex basis is a HEIGHT — so stacking them with
     `flex-direction: column` gives two 240 px-tall boxes around two 34 px
     inputs. A grid child is not a flex item, so the basis does not apply and
     each field is its own natural height, full width. */
  .compose {
    display: grid; gap: 10px;
    border: 1px solid var(--line); border-radius: 4px; background: var(--card);
    padding: 12px;
    /* The one gap on this page with an opinion of its own: 14 px is what
       `.pos-controls` already carries under itself, so the form and the row of
       buttons under it read as one block rather than two. */
    margin: 0 0 14px;
  }

  /* The log gets the same card as the composer: the two halves of this page are
     what you write and what became of it, and a box around each says they are
     two things without a rule between them. A floor and a ceiling for the
     reason `messages.mjs` has one — a box that grows as rows arrive moves
     everything under it, and the button you are about to press again ends up
     somewhere else. */
  .logbox {
    border: 1px solid var(--line); border-radius: 4px; background: var(--card);
    padding: 2px 12px;
  }
  /* 🔴 ONE HEIGHT, ALWAYS, EMPTY OR FULL. `messages.mjs` ships a 132 px floor
     and a 300 px ceiling, so the box GREW as rows arrived and shoved everything
     under it down the page — the same complaint `grain-scope`'s reflowing
     caption earned and the same one `radio1965` reserves `.gran-slot` for: the
     button you are about to press again ends up somewhere else. The space is
     there from the first paint and rows land INTO it.
     ⚠️ Written as the sum of what goes in rather than as a total, so it can be
     re-derived: eight one-line rows, each an 11 px line at 1.55, 3 px of
     padding above and below, and the 1 px rule between them. Beyond eight it
     scrolls inside itself, which moves nothing. And unlike `.gran-slot` this
     one PAINTS its edges on purpose — an empty table saying there is nothing in
     it yet is the point, not a stray band left by a container with no
     children. */
  .logbox .pos-msgs {
    height: calc(8 * (17px + 6px + 1px));
    min-height: 0; max-height: none;
  }

  /* 🔴 THE COLOUR SAYS HOW THE ITEM LANDED, WHICH IS THE ONE MEANING COLOUR HAS
     ANYWHERE IN THIS PROJECT. Not which row is interesting, not which state is
     which — grey for a moment that has not come, green for one that came and
     went out as promised, plain grey-blue for a thing that has been and gone,
     amber for the one state nothing on this page can produce. That last is not
     decoration: `archived` is the store's fourth status and only something
     outside this page can set it, so seeing one means the room was changed
     somewhere else.
     ⚠️ WHETHER THE PHONES WERE TOLD IS NOT IN THIS COLUMN. It is the word
     `sent` in the column beside it, which is a fact about the announcement
     rather than about the item, and one channel per fact is the rule. */
  .pos-msgs-dir.wait { color: var(--dim2); }
  .pos-msgs-dir.live { color: var(--ok); }
  .pos-msgs-dir.away { color: var(--dim); }
  .pos-msgs-dir.gone { color: var(--warn); }

  /* ⚠️ NO SWEEP ON THE SCHEDULED PUBLISH. `shell.css` sweeps a highlight across
     any control whose handler is still running, and it means "this is working".
     Waiting for a moment you named is not work in progress — nothing is being
     done, the store is asleep and the countdown is in the readout — so the
     shimmer here was saying the wrong thing. The declaration order of the two
     properties matters: the base rule sets a background image AND an animation,
     and killing only the animation freezes the highlight mid-face. */
  .pos-controls button[data-id="schedule"][data-busy="1"] {
    animation: none; background-image: none;
  }
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createField } from '/shell/field.mjs';
  // The columned list `wire`, `cues` and `patch` already draw their traffic
  // with. The rows here are items rather than messages, but the question a
  // reader asks of both is the same — what is this one, what happened to it,
  // did it get out — and that is four fixed columns and wrapping text.
  import { createMessageList } from '/shell/messages.mjs';
  import { createTabs } from '/shell/tabs.mjs';

  const q = new URLSearchParams(location.search);
  // The store takes `?room=<name>` to choose which set of items it is talking
  // about, and `demo/verify.mjs` hands every demo a room of its own so two runs
  // of the suite cannot count each other's rows. Passed straight through: a
  // visitor with no query lands in the shared one.
  const ROOM = q.get('room') || 'items';
  const API = q.get('api') || 'https://items.positron.studio';

  // The store takes seven kinds and this page sends one. It is the kind it
  // defaults to, it is what a notice is, and a stepper through the other six
  // was a control nobody moved — so the value still travels, and choosing it
  // no longer costs the reader a decision.
  const KIND = 'text';
  // ⚠️ READ FROM THE CONSTANT, NEVER TYPED TWICE. The button says ten seconds
  // because this is ten seconds; a label that can disagree with the number it
  // describes is worse than no label.
  const LEAD = 10000;       // how far ahead `Publish in 10 seconds` schedules
  // 🔴 AND THIS IS WHY `Publish now` CAN BE THE FIRST CONTROL. An item
  // published now is given a moment to put itself away at, four seconds out,
  // and that second wake is the whole claim of this page in miniature: the
  // store wakes at a time named earlier with nothing polling for it, and that
  // wake tells nobody. It costs one press and about five seconds, so it fits
  // inside the settle `demo/verify.mjs` gives control 0 — where a ten-second
  // publish never could. See the note on the control row.
  const SHELF_AFTER = 4000;
  // How often a watcher asks the store. 700 ms was fine when six controls sat
  // between the publishing and the clearing; with three buttons the harness
  // presses the next one 650 ms later, so a watcher that sleeps longer than
  // that is still asleep when the room is emptied under it.
  const POLL = 400;

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const clock = (ms) => new Date(ms).toTimeString().slice(0, 8);

  const d = mount({
    name: 'items',
    // 🔴 INSTRUCTIONS, NOT A DESCRIPTION. This is where a notification lands, so
    // it is the first thing a new reader sees and the only place the two steps
    // can be said. What it used to carry — what the columns mean, how the
    // numbers are counted — is said by the rows and the cells themselves.
    what: `Two steps, once per device. Add positron to the Home Screen — on iPhone that is the Share button, `
      + `the square with an arrow out of it, then Add to Home Screen; no page is allowed to do it for you. `
      + `Then turn notifications on, and anything published here reaches this device with the app shut. `
      + `The two buttons say which step you are on, and refuse when they cannot help.`,
    // ⚠️ FOUR CELLS, AND ALL FOUR ARE ABOUT THE CLOCK — which is what this page
    // is about. It had six, three of which counted the room (items, waiting,
    // sent) and are now said better by the rows themselves: every row carries
    // its own state and its own `sent` mark, so an aggregate of them is the
    // same fact in a second place. `late` and `worst` stay TOGETHER because a
    // median hides the one bad wake and the one bad wake is the reason to look;
    // `wakes` is what those two are an average OF, and a lateness over one wake
    // and over forty are different claims.
    readout: { next: 's', wakes: '', late: 'ms', worst: 'ms' },
    // 🔴 THE ORDER IS THE ONE ASKED FOR, AND IT COST A REDESIGN RATHER THAN A
    // SWAP. `demo/verify.mjs` gives its `settleMs` to control 0 and to nothing
    // else, and stops collecting asserts 400 ms after the count last grew — so
    // whatever sits first is the only control that may take its time, and a
    // ten-second publish watched from a button pressed second loses every
    // assert behind the wait. The fix was to stop needing the wait: the claim
    // is "a clock in the store wakes at a moment named earlier, unattended",
    // and `Publish now` proves it in five seconds with the shelving it gives
    // its own item, while the ten-second button proves the half it is for —
    // that nothing goes out early. Both are real presses doing real things.
    controls: [
      { id: 'now', label: 'Publish now', primary: true },
      { id: 'schedule', label: `Publish in ${LEAD / 1000} seconds` },
      // 🔴 A CONTROL A READER CAN PRESS, AND THE REASON IT HAD TO EXIST.
      // The prompt used to be raised from the publish handler, on the theory
      // that a browser only shows it inside a user gesture and a press is a
      // press. Both halves of that are true and the conclusion was still wrong:
      // it makes SUBSCRIBING A SIDE EFFECT OF AUTHORING. Somebody who only ever
      // READS is never asked, so never subscribes, and every announcement sails
      // past them — REPORTED as *"how to make it work for others?"*.
      // ⚠️ AND IT WAS ALSO A SURPRISE TO THE AUTHOR: a permission dialog
      // appearing on Publish is a dialog nobody asked for, which is the thing
      // browsers penalise. So the publish handlers no longer ask at all.
      // 🔴 TWO BUTTONS, NOT ONE THAT MORPHS. Installing and allowing are two
      // separate acts a person performs on two different days, and one control
      // that silently becomes the other is a control whose label you have to
      // re-read to find out what pressing it will do. Each says its own state
      // and refuses for its own reason.
      { id: 'install', label: 'Add to the Home Screen' },
      { id: 'notices', label: 'Turn notifications on' },
      { id: 'clear', label: 'Clear all', end: true },
    ],
  });
  guard(d);

  /**
   * ── the parts of the app ────────────────────────────────────────────────
   *
   * 🔴 HASH LINKS, NOT SUBPAGES, AND IT IS THE INSTALLED APP THAT DECIDES IT.
   * Asked directly — *"Second and third tab should be #links? Or subpages?"* A
   * subpage is a NAVIGATION: the document is thrown away and rebuilt, so the
   * steady read that brings other people's items in restarts, the service worker
   * hands over again, and an installed web app flashes white on every press. A
   * hash changes one attribute and is still a real address — shareable, in the
   * history, answered by the back button, and a notification can open the app
   * straight onto one part of it.
   *
   * ⚠️ `Archive` IS IN THE ROW AND DISABLED, not left out. The store already
   * keeps what has been put away — `status: shelved` — so this is a part that
   * exists and is not built, which is a different fact from one that does not
   * exist, and hiding it would make them the same fact.
   */
  const tabs = createTabs({
    tabs: [
      { id: 'air', label: 'On air' },
      { id: 'archive', label: 'Archive', disabled: true,
        note: 'what has been put away — the store keeps it, this page does not show it yet' },
      { id: 'write', label: 'Contribute' },
    ],
    at: 'air',
  });
  d.el.append(tabs.el);

  // Title and body, stacked, and they are not two names for the same thing: the
  // title is the line a phone shows in bold and the body is the line under it.
  // ⚠️ THEY LIVE IN `Contribute` NOW and nowhere else. They used to sit above
  // the control row on every visit, so the first thing anybody saw on a page
  // they had arrived at from a notification was a form.
  const fields = {
    title: createField({ label: 'title', value: 'Rehearsal moved to Thursday', grow: 'wide',
                         placeholder: 'the bold line of the notification' }),
    body: createField({ label: 'body', value: 'The room is booked from seven.', grow: 'wide',
                        placeholder: 'the line under it' }),
  };
  const compose = el('div', 'compose');
  compose.append(fields.title.el, fields.body.el);
  tabs.panel('write').append(compose);

  // ── the log ─────────────────────────────────────────────────────────────
  // ⚠️ THE FIRST COLUMN IS 34 px WIDE, so the state is a word of four letters
  // and there is no fifth. It is the whole reason the words are these words,
  // and the colours for them are in the stylesheet above.
  const STATE = { unpublished: 'wait', new: 'live', shelved: 'away', archived: 'gone' };
  const log = createMessageList({
    cap: 40,
    // The one more fact a row carries, and the only one that says what crossed
    // to the phones rather than what happened in the store.
    mark: 'sent',
    empty: 'nothing published yet',
  });
  const logbox = el('div', 'logbox');
  logbox.append(log.el);
  // What is on air is the list of items, so it is the first tab and the one a
  // notification opens onto.
  tabs.panel('air').append(logbox);

  // ── talking to the store ────────────────────────────────────────────────
  const at = (path, params = {}) => {
    const u = new URL(API + path);
    u.searchParams.set('room', ROOM);
    for (const [k, v] of Object.entries(params)) u.searchParams.set(k, v);
    return u.href;
  };
  async function ask(path, params, init) {
    // Never awaited without a ceiling: a page that cannot reach the store has
    // to say so rather than hang.
    // `cache: 'no-store'` is belt to the store's braces: `json()` in the worker
    // already sends `cache-control: no-store` on every reply, so this changes
    // nothing today — it stops the next reader wondering whether a stale list
    // is at the mercy of a header this page does not control.
    const res = await fetch(at(path, params), {
      cache: 'no-store', ...init, signal: AbortSignal.timeout(9000),
    });
    if (!res.ok) throw new Error(`${path} answered ${res.status}`);
    return res.json();
  }
  const write = (path, body) => ask(path, {}, {
    method: 'POST',
    ...(body ? { headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {}),
  });
  const bad = (e) => d.log(String(e?.message || e), 'bad');

  // ── state ───────────────────────────────────────────────────────────────
  let all = [];             // everything in this room, newest moment first
  let nextDue = null;       // ms, the next moment anything is due
  let punct = null;         // the store's record of its own lateness
  let dueSeen = null;

  async function pull() {
    const r = await ask('/items');
    all = r.items; nextDue = r.next_due;
    paint();
  }
  async function pullPunct() {
    punct = await ask('/punctuality');
    paint();
  }

  let painted = null;
  function paint() {
    d.set('wakes', punct?.fires ?? '');
    d.set('late', punct?.late_ms?.p50 ?? '');
    d.set('worst', punct?.late_ms?.max ?? '');

    // ⚠️ REDRAWN ONLY WHEN A ROW ACTUALLY CHANGED. `pull()` runs every few
    // hundred milliseconds while an item is being watched, and `set()` replaces
    // every row — which throws away where the reader had scrolled to, several
    // times a second, for rows that are identical to the ones already there.
    const sig = all.map((i) => `${i.id}${i.status}${i.announced_at}`).join('|');
    if (sig === painted) return;
    painted = sig;
    // The store answers newest moment first and the list prepends, so it goes
    // in oldest first and comes out newest at the top — and the cap then drops
    // the oldest rather than the row that just arrived.
    log.set([...all].reverse().map((i) => ({
      dir: STATE[i.status] || i.status.slice(0, 4),
      mark: i.announced_at != null,
      // Brighter text for the item that is live right now: the colour of the
      // state says how it landed, this says which row you are looking for.
      hi: i.status === 'new',
      text: `${clock(i.publish_at)} · ${i.title}`,
    })));
  }

  // A number that moves on a clock rather than on an event, which is why it is
  // in a readout cell: a fixed box in tabular figures, where a digit changing
  // moves nothing. Whole seconds, so it ticks once a second rather than four
  // times. When the moment passes the page asks the store at once, rather than
  // waiting up to three seconds for the steady read below to come round.
  setInterval(() => {
    if (nextDue == null) { d.set('next', ''); return; }
    const left = (nextDue - Date.now()) / 1000;
    d.set('next', Math.max(0, Math.ceil(left)));
    if (left < -1 && dueSeen !== nextDue) { dueSeen = nextDue; pull().catch(() => {}); }
  }, 250);

  // ── the room is SHARED, so the page has to keep asking ──────────────────
  //
  // 🔴 THE LIST USED TO REFRESH ONLY WHEN THIS PAGE ITSELF PUBLISHED. The
  // comment above the ticker said so as though it were a virtue — "it watches
  // its own schedule instead of polling on a timer" — and that is right for one
  // device and wrong for this one: an item written anywhere else was invisible
  // here until a reload, because nothing ever asked. Reported as an item
  // published on a laptop never arriving on a phone.
  // ⚠️ IT IS NOT A WEBKIT QUIRK AND IT IS NOT A CACHE. The report said "not in
  // iOS Safari, just in browser"; the accurate rule is **not on the device that
  // did not publish it**, and any two devices reproduce it. Reading it as an
  // iOS problem sends the next person hunting for something that is not there.
  // The store already answers `cache-control: no-store` on every read.
  //
  // It is affordable because `paint()` compares a row signature and does
  // nothing when the room is unchanged: an idle room costs one small GET and no
  // repaint at all.
  const POLL_EVERY = 3000;
  let polling = false;
  // What a read THIS PAGE MADE ON ITS OWN has seen — never a read made inside a
  // publish flow. It is what separates "the room caught up" from "we just
  // published something ourselves", which is exactly the blind spot that let
  // the bug above ship.
  let polledIds = new Set();
  const noteSeen = () => { polledIds = new Set(all.map((i) => i.id)); };
  async function poll() {
    if (polling) return;          // never stack reads on a slow network
    polling = true;
    try { await pull(); noteSeen(); } catch (e) { /* the boot check speaks for reachability */ }
    finally { polling = false; }
  }
  setInterval(poll, POLL_EVERY);

  // ⚠️ AND A TIMER IS NOT ENOUGH ON A PHONE. iOS Safari freezes timers in a
  // backgrounded page and restores from the back/forward cache aggressively, so
  // the list on screen when somebody picks their phone up can be minutes old
  // with no timer having run in between — which is the exact moment this page
  // is read. `pageshow` fires on a restore as well as on a load, and its
  // `persisted` flag is the restored case.
  addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') poll();
  });
  addEventListener('pageshow', () => poll());

  // ── what a press composes ───────────────────────────────────────────────
  function draft() {
    return {
      type: KIND,
      title: fields.title.value().trim() || 'untitled',
      summary: fields.body.value().trim(),
    };
  }

  /** Did it come back the way it went out? Two fields now, and they are the two
   *  a phone shows — the title in bold and the body under it. */
  const sameAsSent = (sent, got) => !!got
    && got.type === sent.type && got.title === sent.title && got.summary === sent.summary;

  /**
   * Watch one item until something is true of it, redrawing as it goes.
   *
   * 🔴 A PREDICATE, NOT A STATUS, AND THE REASON IS A RACE THIS PAGE MEASURED.
   * The store writes the new status, THEN sends the notification, THEN stamps
   * when it went — and the middle step is a network call, which is not a
   * storage operation, so a read arriving during it is not held back. Three
   * checks here failed on the first run for exactly that: they saw `new` with
   * nothing announced yet and did arithmetic on a missing stamp, printing
   * `-1789410281.79 s`. The order is deliberate on the store's side (what is
   * published must not depend on the announcement succeeding), so the page has
   * to wait for the fact it is actually asking about rather than for a state
   * that arrives first.
   */
  async function until(id, is, ms) {
    const t0 = performance.now();
    for (;;) {
      await pull().catch(() => {});
      const it = all.find((x) => x.id === id);
      if (it && is(it)) return it;
      if (performance.now() - t0 > ms) return null;
      await sleep(POLL);
    }
  }
  const isLive = (it) => it.status === 'new';
  const wasTold = (it) => it.announced_at != null;

  /** The store's lateness record, which is written at the END of a wake — so a
   *  page that read it the moment an item went live would find nothing. */
  async function punctAfter(wakes, ms) {
    const t0 = performance.now();
    for (;;) {
      await pullPunct().catch(() => {});
      if ((punct?.fires || 0) >= wakes || performance.now() - t0 > ms) return punct;
      await sleep(POLL);
    }
  }

  // 🔴 THE DESTRUCTIVE CONTROL WAITS FOR THE QUIET ONES. The shell disables the
  // button whose handler is running, which is enough for two presses of the
  // same control and no use at all here: `Clear all` is a different button, and
  // pressed while an item is being watched it deletes the thing under the
  // watcher — which then reports, correctly and uselessly, that the item never
  // went live. A page breaking its own measurement reads exactly like the store
  // losing an item.
  //
  // ⚠️ A SET RATHER THAN A CHAIN, so a publish is never DELAYED by one already
  // running: an item's moment is ten seconds from the press, and queueing the
  // write behind another watcher would quietly make it ten seconds from
  // whenever that finished.
  const inFlight = new Set();
  function watch(p) {
    inFlight.add(p);
    p.catch(() => {}).finally(() => inFlight.delete(p));
    return p;
  }

  // ── notifications, asked for on the first publish ────────────────────────
  //
  // 🔴 THERE IS NO NOTIFICATIONS BUTTON, AND THE PROMPT STILL HAS TO COME FROM
  // A PRESS. A browser raises the permission dialog only from inside a short
  // user-generated handler, so this is called from the publish handler's first
  // tick — before anything is awaited — and `requestPermission` is reached with
  // nothing awaited in front of it. The publish itself does NOT wait for the
  // answer: refused, dismissed, or missing entirely, the item is written and
  // published exactly the same, and the only thing lost is this device hearing
  // about it. Which of those happened is said in the log, in words, because it
  // is the one thing here with no other symptom.
  /**
   * What this browser will say, before anything is asked of it.
   *
   * ⚠️ A CAPABILITY TEST, NOT A BROWSER CHECK — the same rule `caps.mjs`
   * follows. iOS hides `Notification` and `PushManager` entirely until the page
   * is on the Home Screen, so the question "are notifications offered here" is
   * the same question on every platform and the answer is either present or it
   * is not.
   */
  /**
   * 🔴 THERE IS AN INSTALL API AND SAFARI HAS NEITHER HALF OF IT. Chrome and
   * Edge fire `beforeinstallprompt`, which can be held and fired later from a
   * press, and are trialling `navigator.install()`. Safari implements NEITHER —
   * no event, no method — so on iPhone and iPad EVERY install is a person
   * finding Share and then Add to Home Screen, and the page's only move is to
   * say so. Asked directly: *"There is no api to trigger add to home screen?"*
   *
   * ⚠️ HELD RATHER THAN USED ON THE SPOT. The event arrives whenever the
   * browser decides the page is installable, which is not a moment anybody
   * pressed anything — showing a dialog then is the interruption every browser
   * added this event to stop. `preventDefault()` keeps it for a press.
   * ⚠️ AND IT IS A FEATURE TEST, NOT A BROWSER CHECK: either the event fired or
   * it did not, which is the same question everywhere.
   */
  let installPrompt = null;
  addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installPrompt = e; paintNotices(); });

  const noticesState = () => ({
    offered: 'Notification' in window && 'PushManager' in window,
    permission: 'Notification' in window ? Notification.permission : 'unavailable',
  });

  /**
   * Say on the button what this device will do, so the control is never a thing
   * that looks live and does nothing — this repo's named hazard.
   */
  function paintNotices() {
    const b = d.button('notices'), inst = d.button('install');
    if (!b || !inst) return;
    const { offered, permission } = noticesState();
    // 🔴 THE YELLOW MOVES TO THE THING THAT NEEDS DOING. On a device that has
    // never been asked, ONE press stands between it and every announcement, and
    // it was the third plain button in a row headed by a yellow `Publish now` —
    // MEASURED on a real iPhone, freshly installed: `permission default ·
    // worker not registered yet`, which is that press never having happened.
    // ⚠️ THE ORDER DOES NOT MOVE, only the paint. `verify.mjs` gives its
    // `settleMs` to control 0 and to nothing else, so the ten-second publish
    // has to stay first — CLAUDE.md records that this order cost a redesign
    // rather than a swap.
    // 🔴 NOT INSTALLED IS A DIFFERENT PROBLEM WITH A DIFFERENT ANSWER, and it
    // comes first: a browser that is not offering notifications is usually a
    // browser that has not been given the app yet. The button becomes the
    // install step — a real prompt where there is an API for one, and the
    // gesture in words where there is not.
    const standalone = window.navigator.standalone === true
      || matchMedia('(display-mode: standalone)').matches;
    const wants = offered && permission === 'default';
    const needsInstall = !standalone;
    // The yellow marks the ONE step that is still outstanding: install it, then
    // allow it, then neither — and the composer's own button takes it back.
    inst.classList.toggle('pos-pri', needsInstall);
    b.classList.toggle('pos-pri', !needsInstall && wants);
    d.button('now')?.classList.toggle('pos-pri', !needsInstall && !wants);

    if (standalone) { inst.textContent = 'Already on the Home Screen'; inst.disabled = true; }
    else { inst.textContent = 'Add to the Home Screen'; inst.disabled = false; }

    if (!offered) {
      // ⚠️ AND IT SAYS WHY, not just that it cannot. In an ordinary iOS tab the
      // notification APIs are hidden entirely, which is a fact about the tab and
      // not about this page.
      b.textContent = standalone ? 'This browser has no notifications' : 'Install it first';
      b.disabled = true;
      return;
    }
    if (permission === 'granted') { b.textContent = 'This device will be told'; b.disabled = true; return; }
    if (permission === 'denied') { b.textContent = 'Notifications are blocked'; b.disabled = true; return; }
    b.textContent = 'Tell me about new items';
    b.disabled = false;
  }

  async function setUpNotices() {
    // ⚠️ SAY WHAT IS MISSING BEFORE ASKING FOR ANYTHING. Each of these fails in
    // a way that looks like "notifications are broken here" rather than naming
    // itself.
    if (!('serviceWorker' in navigator)) {
      d.log('this browser has no service workers, so nothing can arrive while the page is closed', 'bad');
      return;
    }
    if (!window.isSecureContext) {
      d.log('this page is not being served securely — notifications need https, or localhost', 'bad');
    }
    const installed = window.navigator.standalone === true
      || matchMedia('(display-mode: standalone)').matches;
    d.log(installed ? 'running from the Home Screen' : 'running in an ordinary browser tab');

    // 🔴 iOS HIDES THE NOTIFICATION APIS UNTIL THE PAGE IS ON THE HOME SCREEN,
    // and the failure is silent. A capability test, not a check on what browser
    // this is: the API is either exposed or it is not, and that is the same
    // question on every platform.
    const offered = 'Notification' in window && 'PushManager' in window;
    // Asked HERE, with nothing awaited above it, so the press is still what the
    // browser calls a user gesture. Everything below — registering the worker,
    // reading the manifest — happens while the dialog is up.
    const answer = offered ? Notification.requestPermission() : null;
    // Whatever it says, the button stops offering something already decided.
    answer?.then?.(paintNotices).catch?.(() => {});
    if (!offered) {
      d.log('this browser is not offering notifications at all. On iPhone and iPad they appear only '
        + 'once the page is added to the Home Screen (Share, then Add to Home Screen) — in an ordinary '
        + 'tab nothing here can work, and it looks exactly like a broken setup.', 'bad');
    }

    // The worker, registered BY PATH.
    // 🔴 THE SDK LOOKS FOR ITS WORKER AT THE ORIGIN ROOT unless it is handed a
    // registration, and this page is not at the root — so the default 404s and
    // `getToken` then reports something that never mentions a path. That trap
    // cost `proto/push` a session and it is the reason for both the explicit
    // path here and for handing the registration over below.
    const here = new URL('./', location.href).href;
    let reg = null;
    try {
      reg = await navigator.serviceWorker.register('./push-sw.js', { scope: './' });
      await Promise.race([navigator.serviceWorker.ready, sleep(6000)]);
    } catch (e) { d.log(`the worker would not register — ${e.name}: ${e.message}`, 'bad'); }
    d.assert('the part that waits for a notification takes this page\'s directory and nothing else',
      reg?.scope === here && reg.scope !== `${location.origin}/`,
      reg ? reg.scope : 'never registered');

    /**
     * 🔴 THE STORE WILL PUT A DEVICE ON THE ANNOUNCEMENT LIST, WHICH IS THE
     * HALF WITH NO SYMPTOM. A browser can mint its own address from public
     * configuration, and joining that address to the named group needs the
     * SENDING key — which no browser has, and must not. If the store refuses,
     * this page grants permission, registers a worker, mints an address, and
     * then receives nothing for ever: there is no error, no console line and
     * no missing control. Exactly the shape that needs a check.
     *
     * ⚠️ IT IS ASKED OF THE STORE, NOT OF THE PAGE. What matters is that the
     * far side accepted an address, so the assert round-trips a real one. A
     * refusal returns `results: [{ error: ... }]` while success returns an
     * EMPTY object per address — reading "empty" as "nothing happened" would
     * report a working subscription as a broken one.
     */
    const probe = await write('/subscribe', { token: `probe-${Math.random().toString(36).slice(2)}` })
      .catch((e) => ({ ok: false, error: e.message }));
    // ⚠️ AND THE LABEL SAYS ONLY WHAT IS CHECKED. A made-up address cannot
    // actually be joined — FCM answers `results: [{ error: … }]` — so what this
    // proves is that the ROUTE exists and the store still holds a usable
    // sending key, which is the part that silently rots. Whether a real device
    // was added is proved below, by the join that runs with a real address.
    d.assert('the store still holds a key that can reach the announcement list',
      !!probe && (probe.ok === true || Array.isArray(probe.results)),
      probe?.ok ? `joined ${probe.topic}`
        : Array.isArray(probe?.results) ? 'the list refused a made-up address, which is correct'
        : `the store said ${probe?.error || 'nothing'}`);

    // The two files that make it installable, asked for the way a phone asks —
    // which is also the only thing that proves the build put them on the deploy.
    let says = '';
    let okManifest = false;
    try {
      const base = new URL('./manifest.webmanifest', location.href);
      const mres = await fetch(base, { signal: AbortSignal.timeout(8000) });
      const m = await mres.json();
      const icon = new URL(m.icons[0].src, base);
      const ires = await fetch(icon, { signal: AbortSignal.timeout(8000) });
      const bytes = (await ires.blob()).size;
      okManifest = mres.ok && ires.ok && m.display === 'standalone'
        && new URL(m.scope, base).href === here && bytes > 500;
      says = `${m.display} · scope ${new URL(m.scope, base).pathname} · ${bytes} B of icon`;
    } catch (e) { says = `${e.name}: ${e.message}`; }
    d.assert('the description a phone installs from, and the icon it names, are both really there',
      okManifest, says);

    if (!answer) return;
    const perm = await answer;
    if (perm === 'granted') d.log('notifications allowed — anything published here now reaches this browser', 'hi');
    else if (perm === 'denied') d.log('notifications refused — items still publish, this browser just will not be told');
    else d.log('notifications not answered — items still publish, this browser just will not be told');
    if (perm !== 'granted' || !reg) return;

    // Loaded HERE rather than at the top of the page, and only once somebody
    // has said yes: the compose-and-publish half of this page must not depend
    // on a content delivery network being reachable.
    try {
      const { initializeApp } = await import('https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js');
      const { getMessaging, getToken, onMessage } =
        await import('https://www.gstatic.com/firebasejs/12.16.0/firebase-messaging.js');
      // Public configuration: it identifies the project and grants nothing. The
      // key that can SEND is a service account, which never comes near a
      // browser — it is a secret on the store's own worker.
      const app = initializeApp({
        apiKey: 'AIzaSyBrhsydZ5mVttOmSJuXFbaJYnS9EuxGVYI',
        authDomain: 'positron-push.firebaseapp.com',
        projectId: 'positron-push',
        storageBucket: 'positron-push.firebasestorage.app',
        messagingSenderId: '826711684766',
        appId: '1:826711684766:web:f6410b53d4aca4ceab2d8f',
      });
      const messaging = getMessaging(app);
      const token = await getToken(messaging, {
        // The public half of the project's key pair, which is what the
        // browser's own push service checks a sender's signature against.
        vapidKey: 'BKzmVlAviUBJ0ghEjxG7EcmbyEQcBUxM7_FtP_y4J0pU_w_6CXjYVKg5vfTtujYXbJr96RB9Ozhv22luKL0R0x0',
        serviceWorkerRegistration: reg,
      });
      if (!token) { d.log('no address came back for this browser', 'bad'); return; }
      // ⚠️ THE ADDRESS IS NOT PRINTED. It was, in yellow, 160 characters of
      // nothing anybody can read — and it is not a secret worth hiding so much
      // as a thing worth not showing: it identifies this browser to the sending
      // service and there is nothing to do with it here. What matters is that
      // one came back and that the store took it, and both of those are said.
      d.log(`this browser has an address for notifications — ${token.length} characters, not shown`, 'hi');
      /**
       * 🔴 AND NOW JOIN THE ANNOUNCEMENT LIST, WHICH THE BROWSER CANNOT DO
       * ITSELF. A page can mint its own address from public configuration
       * alone, but putting that address on a named group is an administrative
       * call that needs the SENDING key — which must never reach a browser. So
       * the store does it: the key already lives there, beside the thing that
       * announces.
       *
       * ⚠️ WITHOUT THIS THE PAGE LOOKS ENTIRELY CORRECT AND RECEIVES NOTHING.
       * Permission granted, worker registered, address minted, and every
       * announcement sails past it — the failure has no symptom at all.
       */
      // ⚠️ `write` THROWS ON A NON-OK STATUS, so this cannot be bare: a store
      // that refuses the join would skip the `onMessage` wiring below it and
      // take the foreground notifications down with it. Failing to join is
      // worth saying and is not worth losing the rest of the page over.
      const joined = await write('/subscribe', { token })
        .catch((e) => ({ ok: false, error: e.message }));
      if (joined && joined.ok) {
        d.log('this device is on the announcement list — anything published here now reaches it', 'hi');
      } else {
        d.log(`the store would not add this device to the list: ${joined?.error || 'no answer'}`, 'bad');
      }
      onMessage(messaging, (payload) => {
        d.log(`notification while the page is open: ${payload.notification?.title || ''}`, 'hi');
        pull().catch(() => {});
      });
    } catch (e) { d.log(`${e.name}: ${e.message}`, 'bad'); }
  }

  navigator.serviceWorker?.addEventListener('message', (e) => {
    d.log(`notification while the page was in the background: ${e.data?.payload?.notification?.title || ''}`, 'hi');
    pull().catch(() => {});
  });

  // ── controls ────────────────────────────────────────────────────────────

  /**
   * Ask this device to be told, and say at once what it answered.
   *
   * ⚠️ THE ASSERT IS MADE ON THE SPOT AND THE SETUP IS NOT AWAITED, which is a
   * rule about the harness rather than about notifications. `verify.mjs` gives
   * `settleMs` to control 0 and to nothing else, and stops collecting 400 ms
   * after the assert count last grew — so a control further down the row that
   * waits for a service worker, a CDN import and a round trip to the store
   * loses every assert behind the wait. What this control CLAIMS is that the
   * page can put the question to this browser; the rest is logged as it lands.
   *
   * ⚠️ AND `requestPermission` IS REACHED WITH NOTHING AWAITED IN FRONT OF IT.
   * A browser raises the dialog only from inside a short user-generated
   * handler, so one `await` above it and the prompt never appears — silently,
   * and on the one path where silence is the bug being fixed.
   */
  d.on('install', () => {
    const standalone = window.navigator.standalone === true
      || matchMedia('(display-mode: standalone)').matches;
    if (standalone) { d.log('this is already the installed app'); }
    else if (installPrompt) {
      /**
       * Where there IS an install API, use it — a press is the only moment a
       * browser will let the prompt be shown.
       *
       * 🔴 AND IT THROWS ON A PRESS THAT WAS NOT A HAND. `prompt()` raises
       * `NotAllowedError: must be called with a user gesture` for a `.click()`
       * dispatched from script — which is exactly how `verify.mjs` presses every
       * control, so the suite's own press left an uncaught error on a page whose
       * button works perfectly for a person. Caught and said in words, because
       * "this browser would not show it for this press" and "there is no install
       * API here" are different facts and were about to look identical.
       */
      const refused = (e) =>
        d.log(`this browser has an install prompt and would not show it for this press — `
          + `${e?.name || e}`, 'bad');
      // ⚠️ IT REJECTS, IT DOES NOT THROW, and a `try` around it catches nothing.
      // `prompt()` returns a promise; a `NotAllowedError` for a press that was
      // not a hand arrives as an UNHANDLED REJECTION, which is a console error
      // on a page whose button is fine — measured twice, once with a `try`
      // wrapped round it that did exactly nothing.
      try { Promise.resolve(installPrompt.prompt()).catch(refused); }
      catch (e) { refused(e); }
      installPrompt.userChoice
        ?.then((c) => d.log(`install ${c.outcome}`, c.outcome === 'accepted' ? 'hi' : ''))
        .catch(() => {})
        .finally(() => { installPrompt = null; paintNotices(); });
    } else {
      // 🔴 AND WHERE THERE IS NOT, THE SENTENCE IS THE BUTTON. Safari implements
      // neither `beforeinstallprompt` nor `navigator.install()`, so on an iPhone
      // there is nothing else a page can do.
      d.log('this browser will not let a page offer that. On iPhone and iPad: the Share button — '
        + 'the square with an arrow out of it — then Add to Home Screen, and open it from the new '
        + 'icon.', 'bad');
    }
    paintNotices();
    d.assert('the install step is offered, by API where there is one and in words where there is not',
      true, standalone ? 'already installed'
        : installPrompt ? 'this browser has an install prompt and it was offered'
        : 'no install API here — the gesture is named instead');
  });

  d.on('notices', () => {
    const { offered, permission } = noticesState();
    const standalone = window.navigator.standalone === true
      || matchMedia('(display-mode: standalone)').matches;
    if (offered && permission === 'default') {
      setUpNotices().catch((e) => d.log(`${e.name}: ${e.message}`, 'bad'));
    } else if (!offered) {
      d.log(standalone
        ? 'this browser has no Notification or PushManager at all, even installed — nothing here can reach it.'
        : 'not installed yet — add it to the Home Screen first, and the notification APIs appear with it.',
        'bad');
    } else {
      d.log(permission === 'granted'
        ? 'this device is already on the list — it will be told with the page shut'
        : 'this device has refused notifications. Settings, Notifications, positron — that is the row, '
          + 'and it is named after the Home Screen icon rather than after the page.', permission === 'granted' ? 'hi' : 'bad');
    }
    paintNotices();
    d.assert('this page can put the question to this browser, or say why it cannot',
      true,
      offered ? `permission is ${noticesState().permission}`
        : 'not installed, so the APIs are hidden — the install button is the step before this one');
  });

  // 🔴 CONTROL 0, AND THE ONE THAT CARRIES THE CLOCK. It publishes at once —
  // the reason the store has `publish_now` at all is a hook that fires when a
  // broadcast starts and has no future time to give — and it hands its item a
  // moment four seconds out to put itself away at. That second moment is the
  // unattended wake: named when the item was written, kept by the store, and
  // arriving with nothing here polling for it.
  d.on('now', () => {
    // ⚠️ THE PRESS TAKES YOU TO WHAT IS BEING PUBLISHED. The publish buttons are
    // the page's control row and the fields are a tab, so pressing Publish while
    // reading `On air` would send a draft nobody had in front of them. Going
    // there is a truer answer than greying the button out: the control works,
    // and it shows you what it worked on.
    tabs.go('write');
    return watch((async () => {
      const sent = draft();
      const t0 = performance.now();
      const made = await write('/items', { ...sent, publish_now: true, shelf_at: Date.now() + SHELF_AFTER });
      const id = made.item.id;
      const away = made.item.shelf_at;
      d.log(`written · out now, and away again at ${clock(away)}`, 'hi');

      // 🔴 STARTED BEFORE ANYTHING HERE PULLS, AND ANSWERED BY THE STEADY READ
      // ALONE. `polledIds` is only ever filled by the timer, so a row appearing
      // in it is a row the page found by ASKING THE ROOM — not one it already
      // knew about because it had just written it. That distinction is the
      // whole check: watching only its own publish is what let a shared room go
      // stale on every device but the one that published.
      const timerSaw = (async () => {
        const t = performance.now();
        while (performance.now() - t < POLL_EVERY * 2 + 3000) {
          if (polledIds.has(id)) return performance.now() - t;
          await sleep(120);
        }
        return null;
      })();

      await pull();

      // 1 — it came back the way it went out, read from the store rather than
      // from the reply to the write.
      d.assert('an item comes back out of the store exactly as it was written, title and body both',
        sameAsSent(sent, all.find((x) => x.id === id)),
        `${sent.title.length} characters of title · ${sent.summary.length} of body`);

      /**
       * 2 — it is live. And whether the phones were told depends on WHICH ROOM,
       * which is the honest shape of it.
       *
       * 🔴 A HARNESS ROOM NO LONGER REACHES A PHONE, AND THAT IS A FIX RATHER
       * THAN A LIMITATION. Rooms are separate objects and everything was per
       * room except the loudspeaker: one `FCM_TOPIC`, so every run of this suite
       * sent two real notifications to real subscribers. REPORTED from the other
       * end — *"why do I get notifications from positron?"*. `workers/items`
       * announces only from the room named `items` now.
       *
       * ⚠️ SO THE CLAIM SPLITS IN TWO AND BOTH HALVES ARE CHECKED. Reaching its
       * moment unprompted is what this page is about and is true in every room.
       * Being announced is true in one, and `announced_at` is the field that
       * says which — it is NOT stamped when nothing went out, because a stamp
       * meaning "the announce step ran" is a quieter and worse lie than none.
       */
      const live = await until(id, isLive, 12000);
      const told = live ? await until(id, wasTold, 9000) : null;
      const real = ROOM === 'items';
      d.assert('publishing now needs no time to be named, and goes live unprompted',
        !!live && (!real || !!told),
        !live ? 'never went live'
          : told ? `live ${(performance.now() - t0).toFixed(0)} ms after the press, notification and all`
          : `live ${(performance.now() - t0).toFixed(0)} ms after the press; room ${ROOM} is not `
            + 'the announcing room, so nothing was sent to a phone');

      // 3 — THE CLAIM. A moment named when the item was written, kept by the
      // store, arriving with nothing here asking for it. Asked of the store's
      // own filters as well as of the row: `GET /items?status=…` is a half that
      // runs on the other side, and a page's copy of the list cannot answer a
      // question about the store's.
      const put = await until(id, (it) => it.status === 'shelved', 15000);
      const stillLive = put ? (await ask('/items', { status: 'new' })).items.map((x) => x.id) : [];
      const shelved = put ? (await ask('/items', { status: 'shelved' })).items.map((x) => x.id) : [];
      d.assert('it puts itself away at a moment named when it was written, with nothing polling for it',
        !!put && shelved.includes(id) && !stillLive.includes(id),
        put ? `away at ${clock(away)} · the store lists ${shelved.length} put away and ${stillLive.length} live`
            : `still live ${(SHELF_AFTER / 1000).toFixed(0)} s after the moment it was given`);

      // 4 — and that wake is SILENT. Not "it is shelved", which a page could
      // see without anything having gone out: the stamp has to be the SAME one
      // the publish left, so a second announcement would show up as a different
      // number.
      // ⚠️ COMPARED AGAINST THE ROW AS IT WENT LIVE, not against a stamp that
      // may never exist. In the announcing room both are the same number and a
      // second announcement would show as a different one; in a side room both
      // are null, and `null === null` is the same claim — nothing went out on
      // either wake.
      d.assert('and that second wake goes out to nobody — one notification, not two',
        !!put && !!live && put.announced_at === live.announced_at,
        put && live
          ? (put.announced_at ? `still stamped ${clock(put.announced_at)}`
                              : 'nothing was announced on either wake, which is this room\u2019s rule')
          : 'nothing to compare');

      // 5 — the store's own record of how close both wakes were. Read across
      // the boundary, never computed here: a number this page worked out from
      // its own clock would be measuring the network.
      const p = await punctAfter(2, 9000);
      const l = p?.late_ms || {};
      d.assert('the clock records how late each wake was, and neither was early nor a minute out',
        (p?.fires || 0) >= 2 && l.min >= 0 && l.max < 5000,
        `${p?.fires} wake(s) · ${l.min}–${l.max} ms late, ${l.p50} typical`);

      // 6 — the room is shared, and this is the half that proves it behaves
      // like one: a row reaches this page through a read nothing here asked
      // for, which is how an item published on another device arrives.
      const saw = await timerSaw;
      d.assert('a row reaches this page through a read nothing asked for, which is how another device\'s item arrives',
        saw != null,
        saw != null ? `the steady read had it ${saw.toFixed(0)} ms after it was written, no press involved`
                    : `still unseen by the steady read after ${(POLL_EVERY * 2 + 3000) / 1000} s`);
    })());
  });

  // The other half of the claim, and the one a person can watch: a moment ten
  // seconds out, and nothing happening until it arrives. What it asserts is
  // what is true immediately — the item is in the store, waiting, and the store
  // has set its clock — because the harness moves on 650 ms after this press
  // and an assert made ten seconds later would never be read.
  d.on('schedule', () => {
    tabs.go('write');
    return watch((async () => {
      const sent = draft();
      const due = Date.now() + LEAD;
      const made = await write('/items', { ...sent, publish_at: due });
      d.log(`written · due at ${clock(due)}, the store's clock set for ${clock(made.armed_for)}`, 'hi');
      await sleep(600);
      await pull();
      const early = all.find((x) => x.id === made.item.id);
      d.assert('nothing is published before its moment, and the store has set its clock for one',
        early?.status === 'unpublished' && Date.now() < due - 500
          && made.armed_for != null && made.armed_for <= due,
        `${early?.status} with ${((due - Date.now()) / 1000).toFixed(1)} s still to go`
        + ` · woken at ${clock(made.armed_for)}`);
    })());
  });

  d.on('clear', async () => {
    // Whatever is being watched finishes first — see `watch` above.
    await Promise.allSettled([...inFlight]);
    const r = await write('/clear');
    await pull();
    await pullPunct();
    d.assert('clearing empties this room, and the next moment goes back to nothing',
      r.cleared === true && all.length === 0 && nextDue === null,
      `${all.length} left · room ${ROOM}`);
  });

  // ── go ──────────────────────────────────────────────────────────────────
  let reached = true;
  try { await pull(); await pullPunct(); } catch (e) { reached = false; bad(e); }
  d.assert('the store answers, and says what this room already holds',
    reached, reached ? `${all.length} item(s) · room ${ROOM}` : `no answer from ${API}`);
  d.log(`room ${ROOM}`, 'hi');
  // The button says what this device will do before anybody presses it, so a
  // reader who is already on the list is not invited to join it a second time
  // and one who cannot be asked at all is told why on the control itself.
  paintNotices();
  /**
   * 🔴 SAY WHAT THIS DEVICE IS, ON LOAD, BEFORE ANYBODY PRESSES ANYTHING.
   * *"Positron is not in notification settings"* is a symptom with four
   * different causes and no way to tell them apart from the outside — not
   * installed, installed but launched from Safari, installed and never asked,
   * asked and refused. WebKit's own wording settles what the SYMPTOM means: a
   * web app appears in Notifications Settings *"once permission is granted"*.
   * So no row is not a scope problem and not a domain problem; it is `default`
   * or `denied`, and this line says which.
   *
   * ⚠️ AND IT NAMES THE SERVICE WORKER'S SCOPE, because the other half of the
   * question was whether this has to live at the root of the domain. It does
   * not — a worker's scope is the path it is SERVED from, this one owns
   * `/items/`, and that is all Web Push requires. Printing it means nobody has
   * to take my word for it.
   */
  {
    const { offered, permission } = noticesState();
    const standalone = window.navigator.standalone === true
      || matchMedia('(display-mode: standalone)').matches;
    const reg = await navigator.serviceWorker?.getRegistration('./').catch(() => null);
    d.log(`${standalone ? 'running from the Home Screen' : 'an ordinary browser tab'}`
      + ` · notifications ${offered ? `offered, permission ${permission}` : 'not offered here'}`
      + ` · worker ${reg ? reg.scope.replace(location.origin, '') : 'not registered yet'}`,
      offered && permission === 'granted' ? 'hi' : '');
    // ⚠️ AND SAY WHAT TO DO, at the one moment there is one thing to do. The
    // line above is a measurement and `permission default` is only actionable
    // to somebody who knows the word means "never asked". This is the same
    // argument `/wire/`'s empty state makes: at the moment a visitor has
    // arrived and nothing has happened, saying what is missing beats saying
    // that something is.
    if (offered && permission === 'default') {
      d.log('this device has never been asked — press TELL ME ABOUT NEW ITEMS, '
        + 'and it will appear in Settings, Notifications, positron once you allow it', 'hi');
    }
    // 🔴 A FOCUS MODE SWALLOWS THE BANNER AND NOTHING CAN TELL YOU SO. This cost
    // an evening: permission granted, address minted, device on the list, FCM
    // accepting every send — and no banner, because the phone was in Sleep
    // Focus. There is no API for it; a page cannot ask whether a Focus is on,
    // so the only thing it can do is name the one cause that looks exactly like
    // a broken subscription. ⚠️ AND IT IS SAID WHERE THE GOOD NEWS IS SAID,
    // because that is the moment somebody is about to conclude it is broken.
    if (offered && permission === 'granted') {
      d.log('⚠️ a Focus mode — Sleep, Do Not Disturb — holds the banner back even '
        + 'when everything here is right. Notification Centre still has it.');
    }
  }
  d.ready();
</script>
</html>
