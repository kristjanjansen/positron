<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* THE SEVEN FACES, SELF-HOSTED, AND EVERY ONE IS MONOSPACED. Latin subset,
     400 and 600 only, from the @fontsource 5.3.0 packages, each with its SIL
     OFL 1.1 licence beside it in vendor/. plans/plan-slides.md section 9 has
     why these seven and what each measured (Martian Mono was an eighth and
     was removed on the owner's word, *"rm martian mono"*, 2026-10-05).
     Nothing on this page is fetched
     from another host. */
  @font-face { font-family: 'SL Atkinson Hyperlegible Mono'; font-weight: 400; font-style: normal; font-display: block;
    src: url('/slides/vendor/atkinson-hyperlegible-mono-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'SL Atkinson Hyperlegible Mono'; font-weight: 600; font-style: normal; font-display: block;
    src: url('/slides/vendor/atkinson-hyperlegible-mono-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'SL JetBrains Mono'; font-weight: 400; font-style: normal; font-display: block;
    src: url('/slides/vendor/jetbrains-mono-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'SL JetBrains Mono'; font-weight: 600; font-style: normal; font-display: block;
    src: url('/slides/vendor/jetbrains-mono-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'SL Geist Mono'; font-weight: 400; font-style: normal; font-display: block;
    src: url('/slides/vendor/geist-mono-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'SL Geist Mono'; font-weight: 600; font-style: normal; font-display: block;
    src: url('/slides/vendor/geist-mono-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'SL IBM Plex Mono'; font-weight: 400; font-style: normal; font-display: block;
    src: url('/slides/vendor/ibm-plex-mono-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'SL IBM Plex Mono'; font-weight: 600; font-style: normal; font-display: block;
    src: url('/slides/vendor/ibm-plex-mono-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'SL Intel One Mono'; font-weight: 400; font-style: normal; font-display: block;
    src: url('/slides/vendor/intel-one-mono-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'SL Intel One Mono'; font-weight: 600; font-style: normal; font-display: block;
    src: url('/slides/vendor/intel-one-mono-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'SL Fira Code'; font-weight: 400; font-style: normal; font-display: block;
    src: url('/slides/vendor/fira-code-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'SL Fira Code'; font-weight: 600; font-style: normal; font-display: block;
    src: url('/slides/vendor/fira-code-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'SL Source Code Pro'; font-weight: 400; font-style: normal; font-display: block;
    src: url('/slides/vendor/source-code-pro-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'SL Source Code Pro'; font-weight: 600; font-style: normal; font-display: block;
    src: url('/slides/vendor/source-code-pro-latin-600-normal.woff2') format('woff2'); }

  /* A slide lives inside a video panel's stage. The stage is the size
     container, so the slide is sized off the panel's box and never off the
     window: a panel in a page column on a desk, a panel on a phone and a panel
     filling a projector all get the same slide at a different scale.
     plans/plan-slides.md has the research behind every number here. */
  .sl-panel .pos-vp-stage { container-type: size; }

  /* 16:9 and letterboxed. In the panel the stage is already 16:9 so the slide
     fills it exactly; full screen on a screen of another shape centres a 16:9
     slide in it rather than stretching the type to the screen's shape. */
  .sl-slide {
    position: absolute; inset: 0; margin: auto;
    width: min(100cqw, calc(100cqh * 16 / 9));
    height: min(100cqh, calc(100cqw * 9 / 16));
    container-type: size;
    overflow: hidden;
    color: var(--fg);
  }
  .sl-slide[hidden] { display: none; }
  /* Used only by the self-check: every slide is laid out at once, unseen, so
     seven faces at two widths are one synchronous layout each rather than a
     frame per slide. Same weight as the rule above and after it. */
  .sl-measure .sl-slide[hidden] { display: block; visibility: hidden; }
  /* The inset is on a box inside the slide and never on the slide itself,
     because a container's query units measure its CONTENT box. MEASURED with
     the padding on the slide: LARGE came out at 7.7 per cent of the slide
     rather than 9, at both widths, because 14 per cent of the height was
     padding the units could not see. */
  .sl-in {
    height: 100%;
    display: flex; flex-direction: column;
    padding: 7cqh 6cqw;
  }

  /* THE TYPE SCALE: ONE BASE, ONE RATIO, SIX STEPS, AND NO SIZE TYPED TWICE.
     Asked 2026-10-05: *"big type headers / sentences words. figure out type
     scale"*. Every step is the base times the ratio to a power, so each one is
     1.5 times the one under it, well clear of the 25 per cent floor below which
     two neighbouring sizes read as almost the same. The base is 4 per cent of
     the slide's height, twice the 8H rule's 1/50 floor, and the ratio puts the
     old LARGE, 9, exactly on step 3, so evidence keeps the size it had.
     plans/plan-slides.md section 3 has each step's measured px.
       step   size   line   use
       --sl-1  4.00  1.45   caption, bottom left
       --sl-2  6.00  1.30   evidence with four rows, which does not fit at step 3
       --sl-3  9.00  1.20   evidence: tables, stacks, a list
       --sl-4 13.50  1.10   the headline
       --sl-5 20.25  1.05   a statement slide, the words are the slide
       --sl-6 30.38  1.00   one number
     The two numbers are read back by the self-check, which derives every step
     from them and requires every size on a slide to be one of them.
     THE LINE HEIGHT IS PART OF THE STEP, and it opens as the size drops. Asked
     2026-10-05: *"bit more line height on smaller font"*. A big line is read
     as a shape and its leading is mostly empty ascender room, so it closes up;
     a small line is read as words across a wide measure, and the eye needs
     the extra room to find the start of the next one. */
  .sl-panel {
    --sl-base: 4; --sl-ratio: 1.5;
    --sl-1: calc(var(--sl-base) * 1cqh);
    --sl-2: calc(var(--sl-1) * var(--sl-ratio));
    --sl-3: calc(var(--sl-2) * var(--sl-ratio));
    --sl-4: calc(var(--sl-3) * var(--sl-ratio));
    --sl-5: calc(var(--sl-4) * var(--sl-ratio));
    --sl-6: calc(var(--sl-5) * var(--sl-ratio));
    --sl-1-lh: 1.45; --sl-2-lh: 1.3; --sl-3-lh: 1.2;
    --sl-4-lh: 1.1; --sl-5-lh: 1.05; --sl-6-lh: 1;
  }
  /* The face is a custom property on the panel, so the switcher changes one
     declaration and every slide, full screen included, follows by inheritance.
     A step is a custom property and `cqh` in it resolves where it is used, so
     every step is a share of the slide it sits on. */
  .sl-t { font-family: var(--sl-face, var(--mono)); letter-spacing: 0; margin: 0; }
  .sl-t1 { font-size: var(--sl-1); font-weight: 400; line-height: var(--sl-1-lh); }
  .sl-t2 { font-size: var(--sl-2); font-weight: 600; line-height: var(--sl-2-lh); }
  .sl-t3 { font-size: var(--sl-3); font-weight: 600; line-height: var(--sl-3-lh); }
  .sl-t4 { font-size: var(--sl-4); font-weight: 600; line-height: var(--sl-4-lh); }
  .sl-t5 { font-size: var(--sl-5); font-weight: 600; line-height: var(--sl-5-lh); }
  .sl-t6 { font-size: var(--sl-6); font-weight: 600; line-height: var(--sl-6-lh); }
  .sl-dim { color: var(--dim); font-weight: 400; }
  /* THE ACCENT IS A BUDGET: one word or number on a slide, the one that carries
     its point, and not on every slide. Same face, same size, same advance, so a
     character column through it still lines up. MEASURED 12.8:1 on the slide
     ground and asserted at 7:1. */
  .sl-hi { color: var(--hi); }
  /* A HUE JOINS A WORD TO A BOX IN THE DIAGRAM OF THE MACHINES. Same hue,
     same strength as the diagram's own bold run naming a box (diagram.mjs,
     `tint(hue, TEXT_TINT, 'var(--fg)')`, 62 per cent into the ink), so
     `Cloudflare` in a headline is the colour of the Cloudflare box and of the
     word Cloudflare under it. The hue is a custom property per span; the
     formula is copied from diagram.mjs, which does not export it, and the
     self-check compares every span against the diagram's rendered word, so a
     change there goes red here rather than drifting. */
  .sl-hue { color: color-mix(in oklab, hsl(var(--sl-hue) 72% 62%) 62%, var(--fg)); }
  /* Two lines of a headline are kept even, so no word is left alone. */
  .sl-say { text-wrap: balance; }

  /* The headline sits top left, every slide, same place. What proves it goes
     in the evidence region under it, which takes whatever height is left, and
     it is CENTRED in that region on both axes: the headline is read first and
     left aligned, the evidence is looked at and sits in the middle. */
  .sl-ev {
    flex: 1 1 auto; min-height: 0;
    margin-top: 4cqh;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center;
  }
  /* A STATEMENT SLIDE HAS NO EVIDENCE: its sentence is the slide, at step 5,
     in the middle of the height the evidence would have taken and still left
     aligned like every headline. Three lines are allowed here and nowhere
     else, because the room a headline gives to evidence is the room a third
     line of a statement takes: 3 x 20.25 x 1.1 is 66.8 per cent of the
     slide, inside the 86 the inset leaves with a caption under it. */
  .sl-ev > .sl-st { align-self: stretch; text-align: left; }
  .sl-list { list-style: none; padding: 0; margin: 0; text-align: left; }
  .sl-list li { margin: 0; }

  /* THE CAPTION, AT SMALL, IN THE CHOSEN FACE, PINNED BOTTOM LEFT. Asked with
     a screenshot of the diagram slide: *"desc seems off. perhaps write it with
     slide's smallest text font and align to bottom left?"*. It is the last
     child of the column, so the evidence region above it shrinks to make room
     and the caption's left and bottom edges ARE the inset; nothing is
     positioned and no number says where the corner is. */
  .sl-cap { flex: 0 0 auto; margin-top: 3cqh; align-self: stretch; text-align: left; color: var(--dim); }
  .sl-cap a { color: inherit; text-decoration: underline; text-underline-offset: 0.15em; }

  /* MONO DOING WHAT ONLY MONO CAN. A table here is lines of text padded with
     spaces, so a column is a character position and lines up in every face
     with no grid behind it. `white-space: pre` keeps the padding. */
  .sl-rows { text-align: left; white-space: pre; }
  .sl-rows > div { margin: 0; }
  /* A stack of numbers: label left, figure right, the same count of decimals
     in every row, so the decimal points fall in one column. `tabular-nums` is
     the half that matters in a proportional face and is said anyway. */
  .sl-stack {
    display: grid; grid-template-columns: auto auto auto; column-gap: 0.6em;
    align-items: baseline; text-align: left;
  }
  .sl-stack .sl-num { text-align: right; font-variant-numeric: tabular-nums; white-space: pre; }
  .sl-stack .sl-unit { color: var(--dim); font-weight: 400; }

  /* A canvas and a scaled component take the whole region and centre their
     own picture inside it, so they stretch rather than shrink to nothing. */
  .sl-ev canvas { display: block; width: 100%; height: 100%; object-fit: contain; align-self: stretch; }

  /* A component sized in px (a readout, a diagram, a step grid) is laid out
     at a fixed logical width and scaled to the region, the way a projector
     scales it. The scale is a custom property the page writes, never the
     transform. */
  .sl-fit { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; align-self: stretch; }
  .sl-fit-in {
    position: absolute; left: 0; top: 0;
    width: var(--fit-w, 640px);
    transform-origin: 0 0;
    transform: translate(var(--fit-x, 0px), var(--fit-y, 0px)) scale(var(--fit-k, 1));
  }
  .sl-fit-in > .pos-dg { margin: 0; }
  /* A picture over a stack on one slide: the picture takes what is left. */
  .sl-ev > .sl-stack + .sl-fit, .sl-ev > .sl-fit + .sl-stack { margin-top: 3cqh; }

  /* Blank, the way a clicker's blank button asks for: the slide goes away and
     the panel stays. */
  .sl-panel .pos-vp-stage[data-blank] .sl-slide { visibility: hidden; }

  /* Used only by the self-check, to lay the panel out at the width it has in
     a 1280 page and in a 375 page (less the 16 px gutters), without either. */
  .sl-panel.sl-w686 { max-width: 686px; }
  .sl-panel.sl-narrow { max-width: 343px; }

  .sl-count {
    font: 500 12px/1 var(--mono); color: var(--dim);
    font-variant-numeric: tabular-nums; min-width: 7ch; text-align: center;
  }
</style>

<script type="module">
  import { mount, guard, el, createReport } from '/shell/shell.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createStepper } from '/shell/stepper.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { createDiagram, TECH_HUE } from '/shell/diagram.mjs';
  import { createStepGrid } from '/shell/step-grid.mjs';
  import { burn, videoHue, FRAME_W, FRAME_H } from '/shell/pattern.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';

  const d = mount({
    name: 'slides',
    what: 'A talk made of slides that hold running parts of this site, stepped inside a panel that fills the screen when you present.',
    readout: null,
    controls: [],
  });
  guard(d);

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const frame = () => new Promise((r) => requestAnimationFrame(() => r()));

  // ── live elements ─────────────────────────────────────────────────────────
  // Each one is built the first time its slide is shown, because a box in a
  // hidden slide measures 0, and runs only while its slide is the one on
  // screen. None of them opens a connection: they are drawn from this page.
  // Each returns { start, stop, value, subject }, and `windowMs` when its
  // value moves slower than every frame, so the check knows how long to look.

  /** A component laid out at `w` logical px and scaled into `host`. */
  function fitBox(host, w) {
    const outer = el('div', 'sl-fit');
    const inner = el('div', 'sl-fit-in');
    inner.style.setProperty('--fit-w', `${w}px`);
    outer.append(inner);
    host.append(outer);
    const fit = () => {
      const ow = outer.clientWidth, oh = outer.clientHeight;
      const ih = inner.offsetHeight || 1;
      if (!ow || !oh) return;
      const k = Math.min(ow / w, oh / ih);
      inner.style.setProperty('--fit-k', String(k));
      inner.style.setProperty('--fit-x', `${(ow - w * k) / 2}px`);
      inner.style.setProperty('--fit-y', `${(oh - ih * k) / 2}px`);
    };
    const ro = new ResizeObserver(fit);
    ro.observe(outer); ro.observe(inner);
    return { outer, inner, fit };
  }

  /** The kit's own readout, measuring this screen. */
  function liveReadout(host) {
    const { inner } = fitBox(host, 360);
    const r = createReport({ readout: { fps: '', frames: '' }, showLog: false, joined: false });
    inner.append(r.readoutEl);
    // `frames` is there because `fps` alone does not move on a screen locked to
    // its refresh rate: MEASURED in headless Chrome, 60.0 for a whole second.
    let raf = 0, last = 0, times = [], shown = 0, count = 0;
    const tick = (t) => {
      count++;
      if (last) times.push(t - last);
      if (times.length > 60) times.shift();
      last = t;
      if (t - shown > 250 && times.length > 4) {
        const mean = times.reduce((a, b) => a + b, 0) / times.length;
        r.set('fps', (1000 / mean).toFixed(1));
        r.set('frames', count);
        shown = t;
      }
      raf = requestAnimationFrame(tick);
    };
    return {
      start() { last = 0; times = []; shown = 0; raf = requestAnimationFrame(tick); },
      stop() { cancelAnimationFrame(raf); raf = 0; },
      value: () => r.readoutEl.textContent,
      subject: () => r.readoutEl,
    };
  }

  /** The site's test picture, `pattern.mjs`, burning its clock row live. */
  function livePicture(host) {
    const c = el('canvas');
    c.width = FRAME_W; c.height = FRAME_H;
    host.append(c);
    const ctx = c.getContext('2d');
    let raf = 0, n = 0;
    const tick = () => {
      burn(ctx, FRAME_W, FRAME_H, n++, { hue: videoHue(1) });
      raf = requestAnimationFrame(tick);
    };
    return {
      start() { tick(); },
      stop() { cancelAnimationFrame(raf); raf = 0; },
      value: () => n,
      subject: () => c,
    };
  }

  /**
   * The machines, as `diagram.mjs` draws them. Declared here rather than
   * inside the live element because the words on other slides take their hue
   * from the same boxes: `NAME_HUE` below is read off this, so a box that
   * changes its `tech` changes the word on every slide with it. Each note
   * names other boxes in **bold**, which the diagram draws in that box's hue,
   * and that rendered word is what the self-check compares the slides against.
   */
  const MACHINES = {
    nodes: [
      { id: 'br', label: 'Browser', kind: 'here', tech: 'browser',
        children: [
          { id: 'pg', label: 'page', sub: 'built from the kit', tech: 'browser',
            note: 'Every demo is one HTML page that mounts the shell and the kit, and grades '
                + 'itself when the harness asks.' },
        ] },
      { id: 'cf', label: 'Cloudflare', tech: 'cloudflare', set: true,
        children: [
          // 1 to 2 ms: PROGRESS.md:3472, the DO hop MEASURED +1.0, +1.6 and
          // +0.8 ms over three runs against the runtime's own ping.
          { id: 'rl', label: 'relay', sub: 'Durable Object', tech: 'relay',
            note: 'One **Durable Object** per room carries notes from the **page** to the '
                + '**synths** on the **Raspberry Pi**. The hop through it measured 1 to 2 ms.' },
          { id: 'st', label: 'Stream', sub: 'LL-HLS, WHEP', tech: 'cloudflare',
            note: '**Cloudflare** Stream serves the same picture as **LL-HLS** and as **WHEP**, '
                + 'which is how the two were measured side by side.' },
        ] },
      { id: 'pi', label: 'Raspberry Pi', tech: 'raspberry',
        children: [
          { id: 'sy', label: 'synths', sub: 'Yoshimi, Circuit', tech: 'sound',
            note: 'The board plays **Yoshimi** and the **Novation Circuit** and sends their '
                + 'sound back through the **relay**.' },
        ] },
    ],
    links: [
      { from: 'pg', to: 'rl', label: 'notes', note: 'Note on and note off as small WebSocket messages.' },
      { from: 'rl', to: 'sy', label: 'notes', note: 'The relay hands them to the board, which plays them.' },
    ],
  };
  /** A box's name, lower-cased, to the hue the diagram paints it in. A `here`
   *  box paints no hue (diagram.mjs, HUELESS_KINDS), so it lends none. */
  const NAME_HUE = new Map();
  (function walk(list) {
    for (const n of list) {
      if (n.tech && n.kind !== 'here' && TECH_HUE[n.tech] != null) NAME_HUE.set(n.label.toLowerCase(), TECH_HUE[n.tech]);
      walk(n.children || []);
    }
  })(MACHINES.nodes);

  /** The machines, drawn by `diagram.mjs`, a lit box walking through them. */
  function liveStack(host) {
    const { inner, fit } = fitBox(host, 760);
    const dg = createDiagram(inner, MACHINES);
    requestAnimationFrame(fit);
    let timer = 0, at = -1;
    const step = () => {
      const boxes = [...dg.svg.querySelectorAll('.pos-dg-n')]
        .filter((g) => !g.querySelector('.pos-dg-cbox'));
      boxes.forEach((g) => { delete g.dataset.on; });
      if (!boxes.length) return;
      at = (at + 1) % boxes.length;
      boxes[at].dataset.on = '1';
    };
    return {
      start() { step(); timer = setInterval(step, 700); },
      stop() { clearInterval(timer); timer = 0; },
      value: () => at,
      subject: () => dg.svg,
      windowMs: 760,
      dg,
    };
  }

  /**
   * A stack of figures, label and number and unit per row. `rows` is
   * [label, value, unit]; a value may be a string or, for a live stack, set
   * later through the returned `set(i, text)`.
   */
  function stackOf(rows) {
    const g = el('div', `sl-stack sl-t sl-t${evStep(rows.length)}`);
    const nums = [];
    for (const [label, value, unit] of rows) {
      const n = el('span', 'sl-num');
      n.append(rich(value));
      nums.push(n);
      g.append(el('span', 'sl-dim', label), n, el('span', 'sl-unit', unit || ''));
    }
    return { el: g, nums, set: (i, t) => { nums[i].textContent = t; } };
  }

  /**
   * A step grid from the kit at a tempo this slide made up, and the time each
   * step lands behind its own mark, in ms, under it. The grid's clock is a
   * frame clock (`step-grid.mjs`: the step is a function of the clock, read
   * once a frame), so a step can only appear on the first frame after its
   * time, and what the stack prints is how long after.
   */
  function liveSteps(host) {
    const { inner } = fitBox(host, 480);
    const strip = el('div');
    inner.append(strip);
    const grid = createStepGrid({
      strip, rows: 2, steps: 16,
      readOnly: true,
      rate: { bpm: 120, whose: 'this slide, which made it up' },
    });
    for (const [r, s] of [[0, 0], [0, 4], [0, 8], [0, 12], [1, 2], [1, 6], [1, 10], [1, 14]]) grid.set(r, s, true, 'quiet');
    const st = stackOf([['late', '0.00', 'ms'], ['worst', '0.00', 'ms']]);
    host.append(st.el);
    const ms = grid.clock.stepMs();
    let t0 = 0, steps = 0, worst = 0;
    grid.clock.onStep(() => {
      const late = (performance.now() - t0) % ms;
      steps++;
      if (steps > 1 && late > worst) worst = late;
      st.set(0, late.toFixed(2).padStart(5));
      st.set(1, worst.toFixed(2).padStart(5));
    });
    return {
      start() { steps = 0; worst = 0; t0 = performance.now(); grid.clock.play(); },
      stop() { grid.clock.stop(); },
      value: () => steps,
      subject: () => st.el,
      stack: st.el,
    };
  }

  // ── the faces ─────────────────────────────────────────────────────────────
  // Seven self-hosted monospaced faces, in the order the switcher steps them.
  // `id` is what the address carries (`?face=plex`), `name` is what the picker
  // shows. The first is the default: JetBrains Mono since 2026-10-05, the
  // owner's choice (*"jetbrains default"*), plans/plan-slides.md section 9.
  const FACES = [
    { id: 'jetbrains', name: 'JetBrains',   family: 'SL JetBrains Mono' },
    { id: 'atkinson',  name: 'Atkinson',    family: 'SL Atkinson Hyperlegible Mono' },
    { id: 'geist',     name: 'Geist',       family: 'SL Geist Mono' },
    { id: 'plex',      name: 'Plex',        family: 'SL IBM Plex Mono' },
    { id: 'intel',     name: 'Intel One',   family: 'SL Intel One Mono' },

  /** `*x*` marks the accent and `[x|box]` a hue. The text with the marks out. */
  const plain = (t) => String(t ?? '').replace(/\*/g, '').replace(/\[([^|\]]+)\|[^\]]+\]/g, '$1');
  /** A fragment of `t` with each `*x*` as a `--hi` span and each `[x|box]` in
   *  the hue of the diagram box called `box`. A name with no box throws, so a
   *  typo cannot quietly print a plain word. */
  function rich(t) {
    const f = document.createDocumentFragment();
    String(t ?? '').split(/(\*[^*]+\*|\[[^|\]]+\|[^\]]+\])/).forEach((part) => {
      if (!part) return;
      let m;
      if (/^\*[^*]+\*$/.test(part)) f.append(el('span', 'sl-hi', part.slice(1, -1)));
      else if ((m = part.match(/^\[([^|\]]+)\|([^\]]+)\]$/))) {
        const hue = NAME_HUE.get(m[2].toLowerCase());
        if (hue == null) throw new Error(`no box called ${m[2]} lends a hue`);
        const sp = el('span', 'sl-hue', m[1]);
        sp.dataset.box = m[2].toLowerCase();
        sp.style.setProperty('--sl-hue', String(hue));
        f.append(sp);
      } else f.append(document.createTextNode(part));
    });
    return f;
  }
  /** Evidence is at step 3, or step 2 at four rows or more. */
  const evStep = (rows) => (rows > 3 ? 2 : 3);

  /** Pad `rows` into lines of text whose columns are character positions. */
  function padRows({ head, body, align }) {
    const all = head ? [head, ...body] : body;
    const n = Math.max(...all.map((r) => r.length));
    const w = Array.from({ length: n }, (_, c) => Math.max(...all.map((r) => plain(r[c]).length)));
    const gap = '  ';
    // Padded on the visible length, so an accent mark takes no column.
    const line = (r) => w.map((cw, c) => {
      const t = String(r[c] ?? ''), fill = ' '.repeat(cw - plain(t).length);
      return align[c] === 'r' ? fill + t : t + fill;
    }).join(gap).replace(/\s+$/, '');
    // Where each column starts, in characters, and where it ends.
    const starts = []; let x = 0;
    for (const cw of w) { starts.push(x); x += cw + gap.length; }
    return { lines: all.map(line), starts, widths: w, head: !!head };
  }

  let at = -1;
  function go(i) {

    stepper.buttons[stepper.buttons.length - 1].disabled = at === SLIDES.length - 1;

  // from its play button, and a full stop from its blank button.

  const PREV = new Set(['ArrowLeft', 'ArrowUp', 'PageUp']);

    if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    if (t && /^(BUTTON|A)$/.test(t.tagName) && (e.key === ' ' || e.key === 'Enter')) return;

    else if (PREV.has(e.key)) go(at - 1);
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(SLIDES.length - 1);

  const fromHash = () => Number((location.hash.match(/^#(\d+)$/) || [])[1]) || 1;
  go(fromHash() - 1);
  // A typed or linked `#7` lands on slide 7 without a reload.
  addEventListener('hashchange', () => go(fromHash() - 1));

  window.__demo.slides = {
    count: SLIDES.length, index: () => at, go, blank, names: SLIDES.map((s) => s.name),
  };

  // ── checks ────────────────────────────────────────────────────────────────
  // A colour as the screen gets it. `color-mix` computes to `oklab(...)`,
  // which is not three numbers out of 255, so every colour goes through a
  // canvas pixel first.
  const toRGB = (() => {
    const cx = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
    return (c) => {
      cx.clearRect(0, 0, 1, 1); cx.fillStyle = '#000'; cx.fillStyle = c; cx.fillRect(0, 0, 1, 1);
      const [r, g, b] = cx.getImageData(0, 0, 1, 1).data;
      return `rgb(${r}, ${g}, ${b})`;
    };
  })();
  const lum = (c) => {
    const m = toRGB(c).match(/\d+(\.\d+)?/g).slice(0, 3).map(Number).map((v) => {
      const s = v / 255;
      return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;
    });
    return 0.2126 * m[0] + 0.7152 * m[1] + 0.0722 * m[2];
  };
  const ratio = (a, b) => {
    const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p);
    return (x + 0.05) / (y + 0.05);
  };
  const px = (node, prop = 'font-size') => parseFloat(getComputedStyle(node).getPropertyValue(prop));
  const key = (k) => document.body.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));

  /** The x of one character's left or right edge, from the text itself,
   *  counted across every text node, so an accent span is walked through. */
  const charX = (elm, i, side = 'left') => {
    if (i < 0) return NaN;
    const w = document.createTreeWalker(elm, NodeFilter.SHOW_TEXT);
    for (let t = w.nextNode(); t; t = w.nextNode()) {
      if (i < t.length) {
        const r = document.createRange();
        r.setStart(t, i); r.setEnd(t, i + 1);
        return r.getBoundingClientRect()[side];
      }
      i -= t.length;
    }
    return NaN;
  };
  const spread = (xs) => Math.max(...xs) - Math.min(...xs);

  /**
   * Every column of a padded table, measured from the glyphs. A left column is
   * its first character's left edge, a right column its last character's
   * right edge, and a figure with a decimal point is that point's left edge.
   * Returns the worst spread in px and what it was.
   */
  function tableSpread(n) {
    const rows = [...n.table.children];
    const { starts, widths, head } = n.table.layout;
    let worst = 0, what = '';
    starts.forEach((s, c) => {
      const right = n.table.align[c] === 'r';
      const xs = [], dots = [];
      rows.forEach((row, r) => {
        const txt = row.textContent;
        const cell = txt.slice(s, s + widths[c]);
        if (!cell.trim()) return;
        const i = right ? s + widths[c] - 1 : s + cell.search(/\S/);
        // a left column is compared at its own start, which is `s` only
        // where the cell is not indented; padEnd never indents
        xs.push(charX(row, right ? i : s, right ? 'right' : 'left'));
        const dot = cell.indexOf('.');
        if (!(head && r === 0) && dot >= 0) dots.push(charX(row, s + dot));
      });
      for (const [list, kind] of [[xs, right ? 'right edge' : 'left edge'], [dots, 'decimal point']]) {
        if (list.length < 2) continue;
        const sp = spread(list);
        if (!(sp <= worst)) { worst = sp; what = `column ${c + 1} ${kind}`; }
      }
    });
    return { worst, what };
  }

  /** The decimal points of a stack of figures, from the glyphs. */
  function stackSpread(stackEl) {
    const xs = [...stackEl.querySelectorAll('.sl-num')].map((nEl) => charX(nEl, nEl.textContent.indexOf('.')));
    return { worst: spread(xs), n: xs.length, nan: xs.some((x) => Number.isNaN(x)) };
  }

  async function check() {
    const A = d.assert;
    const t0 = performance.now();
    // Every face in before counting requests, because the switcher fetches
    // the seven that were not chosen, from this origin.

      document.fonts.load(`600 20px '${f.family}'`), document.fonts.load(`400 20px '${f.family}'`)])));
    const missing = FACES.filter((f, i) => !loaded[i].every((l) => l.length)

    A(`all ${FACES.length} faces load, at 400 and 600, from this page's own vendor folder`,
      missing.length === 0, missing.map((f) => f.family).join(', ') || FACES.map((f) => f.id).join(' '));
    const resBefore = performance.getEntriesByType('resource')

    const noFace = new URLSearchParams(location.search).get('face');
    const famNow = getComputedStyle(nodes[0].node.querySelector('.sl-say')).fontFamily;

      FACES[0].id === 'jetbrains' && (noFace !== null || famNow.includes('JetBrains Mono')),
      `${noFace ?? 'no ?face'}, ${famNow}`);

    A('the talk is 12 to 16 slides and the panel holds every one',
      SLIDES.length >= 12 && SLIDES.length <= 16 && panel.stage.querySelectorAll('.sl-slide').length === SLIDES.length,
      `${SLIDES.length} declared, ${panel.stage.querySelectorAll('.sl-slide').length} drawn`);

    // The wording rules, read off the deck itself.
    // A dot inside a name (`hls.js`) is not a full stop; one at the end is.
    const badSay = SLIDES.filter((s) => /[:;\u2014\u2013\u00b7]|\s-\s|\.$|\.\s/.test(s.say));
    const badAny = SLIDES.filter((s) => /[\u2014\u00b7]/.test([s.say, s.cap, ...(s.list || [])].join(' ')));
    A('no headline carries a colon, semicolon, dash, middot or full stop, and nothing carries an em dash or middot',
      badSay.length === 0 && badAny.length === 0, [...badSay, ...badAny].map((s) => s.name).join(', ') || `${SLIDES.length} clean`);

    go(0);
    const [prevB] = stepper.buttons, nextB = stepper.buttons[stepper.buttons.length - 1];
    nextB.click();
    const a1 = at;
    prevB.click();
    const a0 = at;
    prevB.click();
    A('next moves forward one and previous moves back one', a1 === 1 && a0 === 0, `${a1}, ${a0}`);
    A('previous on the first slide stays there and is switched off',
      at === 0 && prevB.disabled, `at ${at}, disabled ${prevB.disabled}`);
    go(SLIDES.length - 1);
    nextB.click();
    A('next on the last slide stays there and is switched off',
      at === SLIDES.length - 1 && nextB.disabled, `at ${at}, disabled ${nextB.disabled}`);
    A('the footer counts the slide it is on', count.textContent === `${SLIDES.length} / ${SLIDES.length}`, count.textContent);

    go(0);
    const seen = [];
    for (const k of ['ArrowRight', 'PageDown', ' ', 'ArrowLeft', 'PageUp', 'End', 'Home', 'ArrowDown', 'ArrowUp']) {
      key(k); seen.push(at);
    }
    const last = SLIDES.length - 1;
    A('arrows, PageUp and PageDown, space, Home and End all move the deck',
      seen.join() === `1,2,3,2,1,${last},0,1,0`, seen.join());
    go(2);
    A('the address carries the slide, so a reload lands on it', location.hash === '#3', location.hash);

    // Every live element is built once, by showing its slide, so the measuring
    // pass below has every box to measure.
    for (let i = 0; i < SLIDES.length; i++) go(i);

    // The scale, read off the two numbers it is declared from, and each step
    // as a share of the slide's own height.
    const pcs = getComputedStyle(panel.el);
    const base = parseFloat(pcs.getPropertyValue('--sl-base')), rr = parseFloat(pcs.getPropertyValue('--sl-ratio'));
    const STEPS = [1, 2, 3, 4, 5, 6].map((k) => base * rr ** (k - 1) / 100);
    const stepOf = (size, h) => STEPS.findIndex((f) => Math.abs(size - f * h) < 0.5) + 1;
    const hl = nodes.findIndex((n) => !n.spec.statement && n.spec.big);
    go(hl); await frame();
    const s0 = nodes[hl].node, h0 = s0.getBoundingClientRect().height;
    const L = px(nodes[hl].say);
    A('the headline renders at step 4, 13.5 per cent of the slide height, 1.5 times the old 9',
      stepOf(L, h0) === 4 && Math.abs(L - STEPS[3] * h0) < 0.5,
      `${L.toFixed(2)} px in a ${h0.toFixed(1)} px slide at ${innerWidth} px wide, base ${base}, ratio ${rr}`);
    const XL = px(s0.querySelector('.sl-big'));
    A('one number renders at step 6, the top of the scale',
      stepOf(XL, h0) === 6, `${XL.toFixed(2)} px, ${(XL / h0 * 100).toFixed(2)} per cent`);
    const vp = panel.stage.getBoundingClientRect();
    A('in the page the slide is the panel picture, 16:9 and edge to edge',
      Math.abs(h0 - vp.height) < 1 && Math.abs(s0.getBoundingClientRect().width - vp.width) < 1,
      `slide ${s0.getBoundingClientRect().width.toFixed(1)} x ${h0.toFixed(1)}, stage ${vp.width.toFixed(1)} x ${vp.height.toFixed(1)}`);

    // ── the measuring pass: every slide, every face, two widths ──
    // Every slide is laid out at once, unseen, so each face at each width is
    // one synchronous layout. A frame was spent per slide per face before, and
    // sixteen slides in seven faces would not fit the harness's boot wait.
    const was = face, wasAt = at;
    const tm = performance.now();
    const meas = document.createElement('canvas').getContext('2d');
    const widths = [['sl-w686', 'a 1280 page'], ['sl-narrow', 'a 375 page']];
    const R = Object.fromEntries(widths.map(([, w]) => [w, {
      lines: [], longSay: [], spill: [], capOff: [], capFace: [], off: [], cols: [], dots: [], budgets: [], sizes: new Map(), offStep: [],
    }]));
    panel.stage.classList.add('sl-measure');
    for (const [cls, w] of widths) {
      panel.el.classList.add(cls);
      await frame(); await frame();   // the fitted pictures re-fit on resize
      const r = R[w];
      r.panel = Math.round(panel.el.getBoundingClientRect().width);
      for (const f of FACES) {
        setFace(f, true);
        const lines = [];
        for (let i = 0; i < SLIDES.length; i++) {
          const n = nodes[i], say = n.node.querySelector('.sl-say');
          const h = n.node.getBoundingClientRect().height;
          const nl = Math.round(say.getBoundingClientRect().height / px(say, 'line-height'));
          lines.push(nl);
          if (nl > (n.spec.statement ? 3 : 2)) r.longSay.push(`${f.id} ${n.spec.name} ${nl}`);
          // Every size on a slide, outside a scaled kit component, is a step.
          if (f === FACES[0]) {
            for (const t of n.node.querySelectorAll('.sl-in *')) {
              // Only an element that holds text of its own sets a size anybody reads.
              if (t.closest('.sl-fit') || ![...t.childNodes].some((c) => c.nodeType === 3 && c.data.trim())) continue;
              const k = stepOf(px(t), h);
              r.sizes.set(k, (r.sizes.get(k) || 0) + 1);
              if (!k) r.offStep.push(`${n.spec.name} ${t.tagName.toLowerCase()} ${(px(t) / h * 100).toFixed(2)}`);
            }
            const want = n.spec.statement ? 5 : 4;
            if (stepOf(px(say), h) !== want) r.offStep.push(`${n.spec.name} headline not step ${want}`);
          }
          const b0 = n.box.getBoundingClientRect(), cs = getComputedStyle(n.box);
          const inL = b0.left + parseFloat(cs.paddingLeft), inR = b0.right - parseFloat(cs.paddingRight);
          const inB = b0.bottom - parseFloat(cs.paddingBottom), inT = b0.top + parseFloat(cs.paddingTop);
          for (const c of n.node.querySelectorAll('.sl-say, .sl-ev > *, .sl-cap, .sl-rows > div, .sl-stack > *')) {
            const b = c.getBoundingClientRect();
            if (b.bottom > inB + 1 || b.top < inT - 1 || b.left < inL - 1 || b.right > inR + 1
              || c.scrollWidth > c.clientWidth + 1) r.spill.push(`${f.id} ${n.spec.name}`);
          }
          // The caption: SMALL, the chosen face, its left and bottom edges on
          // the inset.
          if (n.cap) {
            const b = n.cap.getBoundingClientRect();
            const size = px(n.cap);
            if (Math.abs(b.left - inL) > 2 || Math.abs(b.bottom - inB) > 2 || stepOf(size, h) !== 1) {
              r.capOff.push(`${f.id} ${n.spec.name} left ${(b.left - inL).toFixed(1)} bottom ${(b.bottom - inB).toFixed(1)} size ${size.toFixed(2)}`);
            }
            if (!getComputedStyle(n.cap).fontFamily.includes(f.family)) r.capFace.push(`${f.id} ${n.spec.name}`);
          }
          // What is under a headline sits in the middle of the inset.
          const sub = n.ctl?.subject?.() || n.ev.querySelector('.sl-list, .sl-big, .sl-rows, .sl-stack');
          if (n.spec.statement) { /* the sentence is the slide, nothing under it */ } else if (sub) {
            const b = sub.getBoundingClientRect();
            r.off.push([n.spec.name, Math.abs((b.left + b.right) / 2 - (inL + inR) / 2)]);
          } else r.off.push([n.spec.name, NaN]);
          // The character columns and the decimal points, from the glyphs.
          if (n.table) {
            const t = tableSpread(n);
            r.cols.push([`${f.id} ${n.spec.name} ${t.what}`, t.worst]);
          }
          const st = n.stack || n.ctl?.stack;
          if (st) {
            const s = stackSpread(st);
            r.dots.push([`${f.id} ${n.spec.name}`, s.nan ? NaN : s.worst, s.n]);
          }
          if (i === 0) {
            const adv = (k) => { meas.font = `600 ${STEPS[k - 1] * h}px '${f.family}'`; return meas.measureText('0').width; };
            r.budgets.push(`${f.id} ${[4, 5, 3].map((k) => Math.floor((inR - inL) / adv(k))).join('/')}`);
          }
        }
        r.lines.push(`${f.id} ${lines.join('')}`);
      }
      panel.el.classList.remove(cls);
    }
    panel.stage.classList.remove('sl-measure');
    await setFace(was, true);
    go(wasAt);
    await frame();
    d.log(`measuring pass ${(performance.now() - tm).toFixed(0)} ms; characters a line holds at steps 4/5/3, ${widths[0][1]}: ${R[widths[0][1]].budgets.join(', ')}`);

    for (const [, w] of widths) {
      const r = R[w], tag = `in ${r.panel} px, the panel in ${w}`;
      A(`every headline is two lines or fewer and every statement three or fewer, in all ${FACES.length} faces, ${tag}`,
        r.longSay.length === 0, r.longSay.join(', ') || r.lines.join(', '));
      A(`every size on every slide is one of the six steps of the scale, ${tag}`,
        r.offStep.length === 0 && r.sizes.size > 0,
        r.offStep.slice(0, 6).join(', ')
          || [...r.sizes].sort((p, q) => p[0] - q[0]).map(([k, c]) => `step ${k} x${c}`).join(', '));
      A(`nothing on any slide runs past its inset in any face, ${tag}`, r.spill.length === 0,
        [...new Set(r.spill)].join(', ') || 'all inside');
      A(`every caption is SMALL, in the chosen face, its left and bottom edges on the inset within 2 px, ${tag}`,
        r.capOff.length === 0 && r.capFace.length === 0,
        [...r.capOff, ...r.capFace.map((x) => `${x} wrong face`)].slice(0, 6).join(', ')
          || `${nodes.filter((n) => n.cap).length} captions in ${FACES.length} faces`);
      const offBad = r.off.filter(([, o]) => !(o <= 2));
      A(`everything under a headline is centred in the slide within 2 px, ${tag}`, offBad.length === 0,
        offBad.length ? offBad.slice(0, 6).map(([nm, o]) => `${nm} ${Number.isNaN(o) ? 'none' : o.toFixed(1)}`).join(', ')
          : `worst ${Math.max(...r.off.map(([, o]) => o)).toFixed(2)} px over ${r.off.length}`);
      const colBad = r.cols.filter(([, s]) => !(s <= 0.5));
      A(`every character column in every table lines up within 0.5 px in all ${FACES.length} faces, ${tag}`,
        r.cols.length >= FACES.length * 3 && colBad.length === 0,
        colBad.length ? colBad.slice(0, 4).map(([k, s]) => `${k} ${s.toFixed(2)}`).join(', ')
          : `${r.cols.length} tables, worst ${Math.max(...r.cols.map(([, s]) => s)).toFixed(2)} px`);
      const dotBad = r.dots.filter(([, s]) => !(s <= 0.5));
      A(`every stack of figures has its decimal points within 0.5 px in all ${FACES.length} faces, the live one included, ${tag}`,
        r.dots.length >= FACES.length * 3 && dotBad.length === 0,
        dotBad.length ? dotBad.slice(0, 4).map(([k, s]) => `${k} ${Number.isNaN(s) ? 'unread' : s.toFixed(2)}`).join(', ')
          : `${r.dots.length} stacks, worst ${Math.max(...r.dots.map(([, s]) => s)).toFixed(2)} px`);
    }
    const left = nodes.every((n) => getComputedStyle(n.node.querySelector('.sl-say')).textAlign !== 'center');
    A('and the headline itself stays left aligned', left);

    // The face is in the address and every slide follows it.
    const plex = FACES.find((f) => f.id === 'plex');
    await pickFace(FACES.indexOf(plex)); await frame();
    const inUrl = new URLSearchParams(location.search).get('face');
    const fam = getComputedStyle(nodes[0].node.querySelector('.sl-say')).fontFamily;
    const capFam = getComputedStyle(nodes[0].cap).fontFamily;
    await pickFace(FACES.indexOf(was), true); await frame();
    A('picking a face puts it in the address and every headline and caption follows',
      inUrl === 'plex' && fam.includes('IBM Plex Mono') && capFam.includes('IBM Plex Mono'), `${inUrl}, ${fam}, ${capFam}`);

    // Every face really is monospaced: `i` and `m` take one advance each.
    const notMono = FACES.filter((f) => {
      meas.font = `600 100px '${f.family}'`;
      return Math.abs(meas.measureText('i').width - meas.measureText('m').width) > 0.01;
    });
    A('every face on the switcher is monospaced, i as wide as m',
      notMono.length === 0, notMono.map((f) => f.id).join(', ') || `${FACES.length} of ${FACES.length}`);

    go(0); await frame();
    const ink = getComputedStyle(nodes[hl].say).color;
    const ground = getComputedStyle(panel.stage).backgroundColor;
    const cr = ratio(ink, ground);
    A('the headline is at least 7:1 against the slide ground', cr >= 7, `${cr.toFixed(1)}:1`);

    // The accent and the hues, counted per slide. Neither is on every slide,
    // and neither is on every word.
    const counted = nodes.map((n) => [n.spec.name, n.node.querySelectorAll('.sl-hi').length,
      n.node.querySelectorAll('.sl-hue').length]).filter(([, h, u]) => h + u);
    const crowded = nodes.filter((n) => {
      const words = n.node.textContent.split(/\s+/).filter(Boolean).length;
      return n.node.querySelectorAll('.sl-hi, .sl-hue').length * 2 > words;
    }).map((n) => n.spec.name);
    A('yellow and the diagram hues mark some words on some slides, never most of a slide and never every slide',
      counted.length >= 4 && counted.length < SLIDES.length && crowded.length === 0
        && counted.some(([, h]) => h) && counted.filter(([, , u]) => u).length >= 3,
      counted.map(([nm, h, u]) => `${nm} ${h} yellow ${u} hue`).join(', ')
        + `, ${counted.length} of ${SLIDES.length} slides` + (crowded.length ? `, too many on ${crowded.join(', ')}` : ''));
    const hiEl = panel.stage.querySelector('.sl-hi');
    const hcr = hiEl ? ratio(getComputedStyle(hiEl).color, ground) : 0;
    A('the yellow accent is at least 7:1 against the slide ground', hcr >= 7, `${hcr.toFixed(1)}:1`);

    // Every hued word is the colour the diagram itself draws that box's name
    // in. Each box's note names others in bold, and the diagram paints a bold
    // name in its box's hue, so showing the notes gives one rendered word per
    // box to compare against.
    const mi = SLIDES.findIndex((sl) => sl.name === 'machines');
    go(mi); await frame(); await frame();
    const dgm = nodes[mi].ctl.dg;
    const drawn = new Map();
    for (const g of dgm.svg.querySelectorAll('.pos-dg-n')) {
      g.dispatchEvent(new FocusEvent('focus'));
      for (const b of dgm.svg.parentNode.querySelectorAll('.pos-dg-cap strong')) {
        if (b.style.color) drawn.set(b.textContent.trim().toLowerCase(), getComputedStyle(b).color);
      }
      g.dispatchEvent(new PointerEvent('pointerleave'));
    }
    const hues = [...panel.stage.querySelectorAll('.sl-hue')];
    const hueBad = [], hueCr = new Map();
    for (const sp of hues) {
      const c = getComputedStyle(sp).color, want = drawn.get(sp.dataset.box);
      if (c !== want) hueBad.push(`${sp.textContent} ${c} against ${want ?? 'nothing drawn'}`);
      hueCr.set(sp.dataset.box, ratio(c, ground));
    }
    A('every hued word is exactly the colour the diagram draws its box\'s name in',
      hues.length >= 3 && hueBad.length === 0,
      hueBad.slice(0, 4).join(', ') || `${hues.length} words, ${[...new Set(hues.map((sp) => sp.dataset.box))].join(', ')}`);
    const worstHue = Math.min(...hueCr.values());
    A('every hue is at least 4.5:1 against the slide ground', worstHue >= 4.5,
      [...hueCr].map(([k, v]) => `${k} ${v.toFixed(1)}:1`).join(', '));

    // Live elements run while their slide is shown and stop when it is not.
    // One look per live slide: its own value has to move across the window
    // and every other live element's must not, which proves the stop as well.
    const live = nodes.map((n, i) => (n.spec.live ? i : -1)).filter((i) => i >= 0);
    const moved = [], stopped = [];
    for (const i of live) {
      go(i); await sleep(60);
      const v0 = live.map((j) => nodes[j].ctl.value());
      await sleep(nodes[i].ctl.windowMs || 320);
      const v1 = live.map((j) => nodes[j].ctl.value());
      live.forEach((j, k) => {
        if (j === i) moved.push(`${SLIDES[i].name} ${v0[k] !== v1[k] ? 'moved' : 'STILL'} (${v0[k]} to ${v1[k]})`);
        else if (v0[k] !== v1[k]) stopped.push(`${SLIDES[j].name} ran while ${SLIDES[i].name} was shown`);
      });
    }
    const kitLive = ['machines', 'clock', 'frames', 'kit'];
    A('at least four slides carry a live part of the kit',
      live.length >= 4 && kitLive.every((nm) => live.some((i) => SLIDES[i].name === nm)),
      live.map((i) => SLIDES[i].name).join(', '));
    A('every live element changes while its slide is shown',
      moved.every((m) => !m.includes('STILL')), moved.join(', '));
    A('and stops when the slide is left', stopped.length === 0, stopped.join(', ') || 'all stopped');
    const dgc = nodes[SLIDES.findIndex((s) => s.name === 'machines')].ctl?.dg;
    A('the diagram of the machines drew in a row and cut nothing',
      dgc && dgc.mode === 'row' && dgc.cuts.length === 0,
      dgc ? `${dgc.mode}, ${dgc.cuts.length} cut ${JSON.stringify(dgc.cuts)}` : 'not built');

    go(0);
    key('.');
    const blanked = panel.stage.hasAttribute('data-blank')
      && getComputedStyle(nodes[0].node).visibility === 'hidden';
    key('b');
    A('a full stop blanks the slide and b brings it back',
      blanked && !panel.stage.hasAttribute('data-blank'), `${blanked}`);

    // Presenting: full screen, by whichever route this browser has.
    await panel.full(true); await frame(); await frame();
    const fs = nodes[0].node.getBoundingClientRect();
    const fsL = px(nodes[0].say);
    const fullOk = panel.isFull() && Math.abs(fs.width / fs.height - 16 / 9) < 0.01
      && fs.width <= innerWidth + 1 && fs.height <= innerHeight + 1
      && stepOf(fsL, fs.height) === 5;
    await panel.full(false); await frame();
    A('full screen keeps the slide 16:9 inside the screen and the statement at step 5 of it',
      fullOk, `${panel.support?.() ?? ''} ${fs.width.toFixed(0)} x ${fs.height.toFixed(0)} in ${innerWidth} x ${innerHeight}, step 5 ${fsL.toFixed(1)} px`);
    A('and leaving it gives the panel its own shape back',
      !panel.isFull() && Math.abs(nodes[0].node.getBoundingClientRect().height - panel.stage.getBoundingClientRect().height) < 1);

    // `/_log` is the shell's own mirror of the log to the dev server, posted
    // only on 127.0.0.1, and is the shell's request rather than this page's.
    const mine = (list) => list.filter((r) => new URL(r.name).pathname !== '/_log');
    const res = mine(performance.getEntriesByType('resource'));
    const foreign = res.filter((r) => new URL(r.name).origin !== location.origin);
    A('with the faces in, stepping every slide fetched nothing, and nothing came from another host',
      res.length === resBefore && foreign.length === 0,
      `${resBefore} before, ${res.length} after, ${foreign.length} foreign`
        + (res.length !== resBefore ? `: ${res.slice(resBefore).map((r) => new URL(r.name).pathname).join(' ')}` : ''));
    go(0);
    d.log(`checks took ${(performance.now() - t0).toFixed(0)} ms`);
  }

  if (SELFCHECK) {
    try { await check(); } catch (e) { d.assert('the checks ran to the end', false, String(e?.stack || e)); }
  }
  d.ready();
</script>
</html>
