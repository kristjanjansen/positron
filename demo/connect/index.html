<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON connect</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* Unlinked nodes as the patchbay draws a box, four to a row, grouped by where they run. */
  .cn-site + .cn-site { margin-top: 32px; }
  .cn-site h3 { margin: 0 0 12px; font: 600 9.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim2); }
  .cn-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: start; gap: 12px; }
  @media (max-width: 900px) { .cn-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .cn-box { display: flex; flex-direction: column; gap: 8px; padding: 10px; background: var(--card2); border: 1px solid var(--line2); border-radius: var(--r, 4px); min-width: 0; }
  .cn-head { display: flex; flex-direction: column; gap: 2px; }
  .cn-id { font: 600 13px/1.3 var(--mono); color: var(--fg); overflow-wrap: anywhere; }
  .cn-label { font: 400 11.5px/1.3 var(--sans); color: var(--dim); }
  /* 11.5px so the widest pair a node has, value-in-2 beside midi-out-2, sits
     on one line in a quarter of the column; past that it wraps, never breaks. */
  .cn-ports { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 6px; font: 400 11.5px/1.5 var(--mono); }
  .cn-ports > div { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
  .cn-ports > div:last-child { align-items: flex-end; }
  /* The pages that build this node, so nothing in the grid is imaginary. */

  /* A port is a link button in its medium's colour; the picked one is lit. */
  button.pos-linkbtn.cn-port { font-family: var(--mono); color: var(--c); text-decoration: none; white-space: nowrap; }
  button.pos-linkbtn.cn-port[aria-pressed="true"] { background: var(--c); color: var(--bg); text-decoration: none; }
  .lv-pname.cn-pick { cursor: pointer; }
  .lv-pname.cn-pick[aria-pressed="true"] { font-weight: 600; }
  .cn-hit { fill: none; stroke: transparent; stroke-width: 12; pointer-events: stroke; cursor: pointer; }

  .cn-say { display: flex; flex-direction: column; gap: 12px; }
  .cn-ex { display: flex; flex-wrap: wrap; gap: var(--ctl-gap); }

  /* What a person says, in --voice (shell.css). Round, lowercase and in
     Geist, because a sentence is read through rather than named. */
  .cn-ex > button.cn-pill { text-transform: none; font-family: var(--sans); font-weight: 400; border-radius: 999px;
    padding: 0 12px; color: var(--voice); border-color: color-mix(in oklab, var(--voice) 45%, var(--line2));
    background: transparent; }
  .cn-ex > button.cn-pill:hover { border-color: var(--voice); background: transparent; }

  .cn-props { display: flex; flex-direction: column; gap: 12px; }
  .cn-props[hidden] { display: none; }
  /* The picture's room is held from the first frame, so linking moves nothing below it. */
  .cn-pic { min-block-size: 140px; }
  .cn-pic.cn-pic-empty { display: grid; place-items: center; border: 1px dashed var(--line2); border-radius: var(--r, 4px); }
  .cn-pic.cn-pic-empty > :not(.cn-empty) { display: none; }
  .cn-pic:not(.cn-pic-empty) > .cn-empty { display: none; }
  .cn-empty { margin: 0; font: 400 13px/1.4 var(--sans); color: var(--dim2); }
  .cn-ex > button.cn-pill[aria-pressed="true"] { border-color: var(--voice); }
  .cn-prop { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
  .cn-prop-t { font: 400 12.5px/1.4 var(--mono); color: var(--fg); overflow-wrap: anywhere; }
  .cn-prop-n { flex-basis: 100%; font: 400 12px/1.4 var(--sans); color: var(--dim); }
  .cn-prop-b { display: flex; gap: var(--ctl-gap); }
  /* Both answers in one case: the shell sets a secondary button in capitals
     and leaves a primary as written, which read `Connect` beside `DISMISS`. */
  .cn-prop-b > button.pos-sm { text-transform: none; }
  .cn-prop-n:empty { display: none; }

  /* The faces of the linked nodes, in a concept page's order: pictures, the
     knob row, the keys. Empty paints nothing. */
  .cn-faces { display: flex; flex-direction: column; gap: 24px; }
  .cn-faces[hidden] { display: none; }
  .cn-face { min-width: 0; }
</style>
<script type="module">
  import { mount, el } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createBay, checkTransforms, printLink, parseLink } from '/shell/bay.mjs';
  import { createPatchbay, useMediumColours } from '/shell/patchbay.mjs';
  import { NODES as CATALOGUE, addNodes } from '/shell/nodes.mjs';
  import { boardGraph, BOARD_SITE } from '/shell/graph-registry.mjs';
  import { CONCEPTS } from '/shell/concept-list.mjs';
  import { createRuntimes, EXTRA_PORTS, knobLinks } from '/shell/node-runtime.mjs';
  import { sharedAudio, claim, release, contexts } from '/shell/audio.mjs';
  import { createKnobGrid } from '/shell/knob-grid.mjs';
  import { knobRaw } from '/shell/synth-params.mjs';

  // ── what the site has, read rather than typed ───────────────────────────
  // Every node in the grid is one the site's own pages build, each shown ONCE
  // as a type (a knob, not knob-cutoff and knob-q), with the pages that build
  // it as links. Three sources:
  //   1. demo/shell/nodes.mjs NODES, the browser-side types read off the
  //      concept pages (plans/plan-node-catalogue.md, step 1). The key is the
  //      catalogue name and it is the box's id here, because four entries share
  //      the id segment `shader` on four different pages.
  //   2. boardGraph() in graph-registry.mjs, fed what the board announces
  //      (rig/board/board.mjs: synth, the granulator insert, the sampler, the
  //      Circuit on input 1, JACK, the GPU). Only the Pi nodes a concept page
  //      really plays are kept, and boardGraph has no `pages`, so PI_PAGES says
  //      which, read 2026-10-14 off the pages' own BOARD_SITE ids.
  //   3. The hops between sites, which are catalogue entries too (shout,
  //      stream-live, stream-hls, moq-relay), drawn after the Pi as before.
  //      cf-relay is not one: the patchbay draws it from a link.
  const PI = boardGraph({ room: 'studio-1', instruments: { synth: true, pappusFx: true, sampler: true }, jack: true, gpu: true,
    inputs: [{ name: 'circuit', channels: 2, jack: true, midi: { port: 'Circuit', channels: [1, 2, 10] } }] });
  const PI_PAGES = { circuit: ['remote/circuit'], sampler: ['remote/piano'] };
  const HOPS = Object.keys(CATALOGUE).filter((n) => CATALOGUE[n].kind === 'endpoint');
  // A box is `<site>:<name>`, except where the name is not what the pages draw:
  // the hops, and the two knobs renamed so they cannot read as a knob instance.
  const AS = { shout: 'relay', 'stream-live': 'live', 'stream-hls': 'hls', 'moq-relay': 'relay',
    'volume-knob': 'knob-volume', 'mix-knob': 'knob-mix' };
  // A type whose catalogue label is a pattern (`<drum>, SuperCollider`) is
  // named for what it is; the instances are in the box's hover.
  const LABELS = { knob: 'knob', drum: 'drum voice', recording: 'radio recording', station: 'live station', shout: 'radio relay' };
  // A station's site is its broadcaster's, so the one box is on ERR's.
  const siteOf = (name, e) => (name === 'station' ? 'err' : e.site ?? 'web');
  // room/words is built and served and kept off the index (concept-list.mjs).
  const OFF_INDEX = ['room/words'];

  const nodeOf = (portId) => portId.split(':').slice(0, 2).join(':');
  const PAGES = new Map(), INSTANCE = new Map(), TYPE = new Map();
  // A knob made per parameter (`web:knob-cutoff`) is a knob; every other node is the type it was built as.
  const typeOf = (id) => TYPE.get(id) ?? (/^web:knob-/.test(id) ? 'knob' : null);
  const isInstance = (id) => !TYPE.has(id) && typeOf(id) === 'knob';

  function makeBay() {
    const b = createBay();
    const failed = [];
    const type = (name) => {
      const e = CATALOGUE[name], site = siteOf(name, e), label = LABELS[name] ?? e.label, as = AS[name] ?? name;
      // Every port, the optional ones too: some page builds each of them.
      // A port has no label in the catalogue, and a refusal reads it.
      const ports = Object.fromEntries(Object.keys(e.ports).map((p) => [`${as}:${p}`, { label: `${label} ${p}` }]));
      try {
        addNodes(b, site, [{ name, as, site, label }], { ports });
        for (const [p, f] of Object.entries(EXTRA_PORTS[name] || {})) b.addPort({ id: `${site}:${as}:${p}`, ...f, label: `${label} ${p}` });
        TYPE.set(`${site}:${as}`, name);
        PAGES.set(`${site}:${as}`, e.pages);
        if (e.instance) INSTANCE.set(`${site}:${as}`, e.instance);
      } catch (x) { failed.push(`${name}: ${x.message}`); }
    };
    for (const name of Object.keys(CATALOGUE)) if (!HOPS.includes(name)) type(name);
    for (const n of PI.nodes) {
      const pages = PI_PAGES[n.id.split(':')[1]];
      if (!pages) continue;
      try {
        b.addNode(n);
        for (const p of PI.ports.filter((q) => nodeOf(q.id) === n.id)) b.addPort({ ...p, label: `${n.label} ${p.id.split(':')[2]}` });
        PAGES.set(n.id, pages);
      } catch (x) { failed.push(`${n.id}: ${x.message}`); }
    }
    for (const name of HOPS) type(name);
    return { bay: b, failed };
  }
  const { bay, failed } = makeBay();
  const PI_KEPT = PI.nodes.filter((n) => PI_PAGES[n.id.split(':')[1]]).length;
  const EXPECTED = Object.keys(CATALOGUE).length + PI_KEPT;

  // A link to somebody else's server or a Stream input rides the one
  // transport its port names, as the pages that make it say (`via`).
  function viaFor(from, to) {
    const a = bay.port(from)?.transports || [], b = bay.port(to)?.transports || [];
    return a.find((t) => b.includes(t)) ?? (a.length === 1 ? a[0] : b.length === 1 ? b[0] : undefined);
  }

  // Example requests, each with the links a right answer contains and the
  // concept page that already makes them (the third field), so no example
  // promises something no page does. The self-check proves every one can be
  // made in this bay, and its stand-in answers with them.
  const W = (n, p) => `web:${n}:${p}`;
  const KEYS = W('keys', 'midi-out'), SPK = W('speaker', 'audio-in'), REC = 'cf-r2:recording:file-out';
  const KNOB = W('knob', 'value-out'), CAM = W('camera', 'video-out'), SCREEN = W('screen', 'video-in');
  const CIRCUIT = `${BOARD_SITE}:circuit`, PIANO = `${BOARD_SITE}:sampler`;
  const EXAMPLES = [
    ['let the keys play the synth', 'synth/keyboard', [[KEYS, W('synth', 'midi-in')], [W('synth', 'audio-out'), SPK]]],
    ['play plaits from my midi keyboard', 'code/plaits', [[W('midi', 'midi-out'), W('plaits', 'midi-in')], [W('plaits', 'audio-out'), SPK]]],
    ['play the circuit in the studio', 'remote/circuit', [[KEYS, `${CIRCUIT}:midi-in`], [`${CIRCUIT}:audio-out`, SPK]]],
    ['change the circuit\'s patch', 'remote/circuit', [[W('patch', 'midi-out'), `${CIRCUIT}:midi-in`]]],
    ['play the piano on the pi', 'remote/piano', [[KEYS, `${PIANO}:midi-in`], [`${PIANO}:audio-out`, SPK]]],
    ['a knob opens supercollider\'s filter', 'code/collide', [[KNOB, W('collide', 'value-in')]]],
    ['a knob bends the mirror shader', 'shader/mirror', [[KNOB, W('shader', 'value-in')], [W('shader', 'video-out'), SCREEN]]],
    ['show me plaits\' waveform', 'code/plaits', [[W('plaits', 'audio-out'), W('scope', 'audio-in')]]],
    ['grain a radio recording', 'granulator/grains', [[REC, W('radio', 'file-in')], [W('radio', 'audio-out'), W('grains', 'audio-in')], [W('grains', 'audio-out'), SPK]]],
    ['grains in time with the recording', 'granulator/beat', [[REC, W('radio', 'file-in')], [W('radio', 'audio-out'), W('grains', 'audio-in')],
      [W('radio', 'audio-out'), W('tempo', 'audio-in')], [W('tempo', 'value-out'), W('grains', 'tempo-in')], [W('grains', 'audio-out'), SPK]]],
    ['what key is the live radio in?', 'radio/key', [['err:station:audio-out', 'cf-shout:relay:audio-in'], ['cf-shout:relay:audio-out', W('level', 'audio-in')],
      [W('level', 'audio-out'), W('key', 'audio-in')]]],
    ['the dial tunes the radio', 'radio/tuner', [[W('dial', 'value-out'), W('tuner', 'value-in')], [W('tuner', 'audio-out'), SPK]]],
    ['camera through the dither shader', 'video/shader', [[CAM, W('shader-dither', 'video-in')], [W('shader-dither', 'video-out'), SCREEN]]],
    ['send the camera through stream and back', 'video/webrtc', [[CAM, 'cf-stream:live:video-in'], ['cf-stream:live:video-out', SCREEN]]],
    ['the drum machine plays its drums', 'drums/machine', [[W('sequencer', 'midi-out'), W('drum', 'midi-in')], [W('drum', 'audio-out'), SPK]]],
    ['the camera plays the drums', 'drums/camera', [[CAM, W('pixelate', 'video-in')], [W('pixelate', 'value-out'), W('sequencer', 'value-in')],
      [W('sequencer', 'midi-out'), W('drum', 'midi-in')], [W('drum', 'audio-out'), SPK]]],
    ['loop what i play into the piano', 'code/piano', [[KEYS, W('looper', 'midi-in')], [W('looper', 'midi-out'), W('sampler', 'midi-in')],
      ['cf-r2:piano-samples:file-out', W('sampler', 'file-in')], [W('sampler', 'audio-out'), SPK]]],
    ['record what i play and play it back', 'synth/recorder', [[KEYS, W('rec', 'midi-in')], [W('rec', 'midi-out'), W('synth', 'midi-in')], [W('synth', 'audio-out'), SPK]]],
    ['typing plays the typewriter', 'typist/typewriter', [[W('typing', 'value-out'), W('typewriter', 'value-in')],
      ['cf-r2:typewriter-samples:file-out', W('typewriter', 'file-in')], [W('typewriter', 'audio-out'), SPK]]],
    ['the keys light up the pico', 'synth/dots', [[KEYS, W('pico', 'midi-in')], [W('pico', 'video-out'), W('oled', 'video-in')]]],
  ].map(([say, page, links]) => ({ say, page, links: links.map(([from, to]) => ({ from, to, transforms: [] })) }));

  const d = mount({ name: 'connect',
    what: 'Press an example to build its patch, or an out port and then an in port. Pressing a wire takes it away.',
    readout: null, index: '/', indexLabel: 'positron' });
  useMediumColours();

  // ── asking the wish worker ───────────────────────────────────────────────
  // The worker proposes and never connects (workers/wish/src/wish.mjs), so an
  // answer becomes rows a person confirms. Every call spends the paid Workers AI
  // account: only on a press, never on a visit, and never from the self-check.
  const API = new URLSearchParams(location.search).get('api') || 'https://wish.positron.studio';
  const HERE = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  const FACTS = 'Ports carry midi, audio, value, clock, video, program or file, and a link joins an out port to an in port '
    + 'of the same medium. Sound is only heard once an audio out reaches web:speaker:audio-in, so a request to '
    + 'play something includes that link. Transforms work on MIDI links only; every other link has none. '
    + 'Ids starting web: are in this browser tab, pi-1: is a Raspberry Pi in the studio, cf- ids are Cloudflare, '
    + 'cf-r2:recording is a radio programme we recorded, and err:station is a live station on its broadcaster\'s server, '
    + 'which reaches this tab through cf-shout:relay.';
  // The self-check's stand-in for a sentence nobody listed, with one transform
  // missing its argument so the checkTransforms path is graded too.
  const CANNED = [
    { from: KEYS, to: 'web:plaits:midi-in', transforms: [] },
    { from: KEYS, to: 'web:plaits:midi-in', transforms: [{ op: 'transpose' }] },
  ];
  // The worker refuses more than 64 ports (workers/wish/src/index.js MAX_PORTS)
  // and the bay holds about three times that, so the model is told the most
  // useful 64: every port an example names, then the other ports of the nodes
  // those examples use, then nothing. The rest stay pressable in the grid.
  const MAX_PORTS = 64;
  const EXAMPLE_PORTS = new Set(EXAMPLES.flatMap((e) => e.links.flatMap((l) => [l.from, l.to])));
  const EXAMPLE_NODES = new Set([...EXAMPLE_PORTS].map(nodeOf));
  const rankOf = (p) => (EXAMPLE_PORTS.has(p.id) ? 0 : EXAMPLE_NODES.has(nodeOf(p.id)) ? 1 : 2);
  const portsForModel = () => bay.ports()
    .map((p, i) => ({ p, i, r: rankOf(p) })).filter((x) => x.r < 2)
    .sort((a, b) => a.r - b.r || a.i - b.i).slice(0, MAX_PORTS)
    .map(({ p }) => ({ id: p.id, dir: p.dir, label: p.label }));
  let reached = 0;
  async function post(text) {
    if (SELFCHECK) {
      const ex = EXAMPLES.find((e) => e.say === text);
      return { links: ex ? ex.links : CANNED, fixed: [], ms: 0, model: 'canned', usage: { total_tokens: 0 } };
    }
    reached++;
    let r;
    try {
      r = await fetch(`${API}/wish`, { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ text, ports: portsForModel(), facts: FACTS }) });
    } catch {
      throw new Error(`nothing answered at ${API}`);
    }
    const out = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(`the agent said: ${out.error || `HTTP ${r.status}`}`);
    return out;
  }

  // No typed request for now (asked 2026-10-14, *"rm ask button and input atm"*):
  // an example press is the request.
  const exRow = el('div', 'cn-ex');
  for (const ex of EXAMPLES) {
    const b = el('button', 'pos-sm cn-pill', ex.say, { type: 'button', title: `as on /${ex.page}/` });
    b.addEventListener('click', (e) => build(ex, e.isTrusted));
    exRow.append(b);
  }

  const props = el('div', 'cn-props');
  props.hidden = true;
  let asking = Promise.resolve();
  async function ask(text) {
    text = String(text || '').trim();
    if (!text) { d.log('say something first, for example one of the sentences under the box'); return; }
    const run = (async () => {
      d.log(`asking: ${text}`);
      try {
        const out = await post(text);
        for (const f of out.fixed || []) d.log(`the model wrote "${f.said}" on ${f.op}, read as ${f.read}`);
        d.log(`the answer came back in ${out.ms ?? '?'} ms with ${out.links?.length ?? 0} link(s), ${out.usage?.total_tokens ?? '?'} tokens`);
        showProposals(out.links || []);
      } catch (e) {
        d.log(e.message, 'warn');
      }
    })();
    asking = run;
    return run;
  }

  function showProposals(links) {
    props.replaceChildren();
    if (!links.length) props.append(el('div', 'cn-prop-n', 'nothing proposed: the sentence named nothing here'));
    for (const l of links) {
      const row = el('div', 'cn-prop');
      row.dataset.line = printLink(l);
      const bad = checkTransforms(l.transforms || []);
      const v = bad ? null : bay.validate(l.from, l.to, l.transforms || []);
      const note = bad ? `cannot be made: ${bad.why}` : v.ok ? '' : `the bay would refuse it: ${v.why}`;
      const buttons = el('span', 'cn-prop-b');
      const yes = el('button', 'pos-sm pos-pri', 'connect', { type: 'button' });
      const no = el('button', 'pos-sm', 'dismiss', { type: 'button' });
      yes.disabled = !!bad;
      yes.addEventListener('click', (e) => {
        if (connect(l.from, l.to, l.transforms || [], e.isTrusted === true)) dropRow(row);
        else row.querySelector('.cn-prop-n')?.replaceChildren(document.createTextNode(`refused: ${last.why}`));
      });
      no.addEventListener('click', () => { d.log(`dismissed ${printLink(l)}`); dropRow(row); });
      buttons.append(yes, no);
      row.append(el('span', 'cn-prop-t', printLink(l)), buttons, el('span', 'cn-prop-n', note));
      props.append(row);
    }
    props.hidden = false;
  }
  function dropRow(row) {
    row.remove();
    if (!props.querySelector('.cn-prop')) { props.replaceChildren(); props.hidden = true; }
  }

  // ── linking, by press or by confirming a proposal ────────────────────────
  let last = { ok: true, why: '' };
  function connect(from, to, transforms = [], consent = false) {
    // The knob type into a value-in that names its parameters is one knob per parameter.
    const many = knobLinks(bay, from, to);
    if (many) {
      d.log(`one knob per parameter of ${nodeOf(to)}: ${many.map(([f]) => nodeOf(f).split(':')[1]).join(', ')}`);
      return many.map(([f, t]) => connect(f, t, transforms, consent)).some(Boolean);
    }
    bay.seen(from); bay.seen(to);
    // A link out of somebody else's server needs a person's own press (bay.mjs, consent).
    const via = viaFor(from, to);
    const r = bay.link(from, to, transforms, { consent, ...(via ? { via } : {}) });
    last = r;
    if (r.ok) d.log(`linked ${printLink({ from, to, transforms })}${r.warn ? `. ${r.warn}` : ''}`);
    else d.log(`refused ${from} -> ${to}: ${r.why}${r.fix ? ` ${r.fix}` : ''}`, 'warn');
    redraw();
    return r.ok;
  }
  // An example press builds its patch straight away: the links are known, so no
  // model is asked. It replaces whatever was linked, because an example is a whole patch.
  function build(ex, person) {
    for (const l of [...bay.links()]) bay.unlink(l.id);
    let made = 0;
    for (const l of ex.links) made += connect(l.from, l.to, l.transforms || [], person) ? 1 : 0;
    for (const b of exRow.children) b.setAttribute('aria-pressed', String(b.textContent === ex.say));
    d.log(`built "${ex.say}", ${made} of ${ex.links.length} links`);
    redraw();
  }
  function removeLink(id) {
    const l = bay.links().find((x) => x.id === id);
    if (!l || !bay.unlink(id)) return;
    d.log(`removed ${printLink(l)}`);
    redraw();
  }

  let armed = null;
  function pick(portId, e) {
    const p = bay.port(portId);
    if (!p) return;
    if (p.dir === 'out') {
      armed = armed === portId ? null : portId;
      if (armed) d.log(`${portId} picked, now press an in port`);
    } else if (!armed) {
      d.log(`${portId} is an in port, so press an out port first`);
    } else {
      const from = armed;
      armed = null;
      connect(from, portId, [], e?.isTrusted === true);
    }
    lightArmed();
  }
  function lightArmed() {
    for (const b of document.querySelectorAll('[data-port]')) b.setAttribute('aria-pressed', String(b.dataset.port === armed));
  }

  // ── drawing: linked nodes in the picture, the rest in the grid ───────────
  const linkedNodes = () => new Set(bay.links().flatMap((l) => [nodeOf(l.from), nodeOf(l.to)]));
  const shown = {
    nodes: () => { const s = linkedNodes(); return bay.nodes().filter((n) => s.has(n.id)); },
    ports: () => { const s = linkedNodes(); return bay.ports().filter((p) => s.has(nodeOf(p.id))); },
    links: () => bay.links(),
  };
  // The patchbay draws a relayed link through a `cf-relay:<room>` box. A link
  // to the Pi rides the studio's room, so that is the box's name.
  const pb = createPatchbay(shown, { room: 'studio-1' });
  const pic = el('div', 'cn-pic');
  pic.append(pb.el);
  const empty = el('p', 'cn-empty', 'press an example, or an out port and then an in port');
  pic.append(empty);

  // The picture is the kit's and redraws itself on resize, so its ports and
  // wires are made pressable after every draw rather than once.
  const svgOf = () => pb.view.el.querySelector('svg');
  function decorate() {
    const svg = svgOf();
    if (!svg || svg.querySelector('.cn-mark')) return;
    const mark = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    mark.setAttribute('class', 'cn-mark');
    svg.append(mark);
    const boxes = [...svg.querySelectorAll('g.lv-box')].map((g) => {
      const r = g.querySelector('rect');
      return { id: g.querySelector('.lv-title')?.textContent, x: +r.getAttribute('x'), y: +r.getAttribute('y'), w: +r.getAttribute('width'), h: +r.getAttribute('height') };
    });
    for (const t of svg.querySelectorAll('text.lv-pname')) {
      const x = +t.getAttribute('x'), y = +t.getAttribute('y');
      const box = boxes.find((b) => x >= b.x - 1 && x <= b.x + b.w + 1 && y >= b.y - 1 && y <= b.y + b.h + 1);
      const id = box && `${box.id}:${t.textContent}`;
      if (!id || !bay.port(id)) continue;
      t.dataset.port = id;
      t.classList.add('cn-pick');
      t.setAttribute('role', 'button');
      t.setAttribute('tabindex', '0');
      t.addEventListener('click', (e) => pick(id, e));
      t.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(id, e); } });
    }
    for (const [key, path] of pb.view.wires) {
      const real = linkFor(key);
      if (!real) continue;
      const hit = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      hit.setAttribute('d', path.getAttribute('d'));
      hit.setAttribute('class', 'cn-hit');
      hit.dataset.link = real.id;
      hit.append(Object.assign(document.createElementNS('http://www.w3.org/2000/svg', 'title'), { textContent: `${printLink(real)}\npress to remove` }));
      hit.addEventListener('click', () => removeLink(real.id));
      svg.append(hit);
    }
    lightArmed();
  }
  // A wire's key is its printed form; a relayed link is two hops through the drawn relay box.
  function linkFor(key) {
    let w;
    try { w = parseLink(key); } catch { return null; }
    const hop = (id) => id.startsWith('cf-relay:studio-1:');
    return bay.links().find((l) => (l.from === w.from || hop(w.from)) && (l.to === w.to || hop(w.to))
      && (l.from === w.from || l.to === w.to));
  }
  new MutationObserver(() => decorate()).observe(pb.view.el, { childList: true, subtree: true });

  // What a node is in this tab, then where else it runs.
  const GROUPS = ['controls', 'engines', 'recorders', 'outputs', 'raspberry pi', 'cloudflare', 'external'];
  function groupOf(n) {
    const site = n.id.split(':')[0];
    if (site === BOARD_SITE) return GROUPS[4];
    if (site.startsWith('cf-')) return GROUPS[5];
    if (site !== 'web') return GROUPS[6];
    return { person: GROUPS[0], device: GROUPS[0], engine: GROUPS[1], store: GROUPS[2] }[n.kind] ?? GROUPS[3];
  }
  const groups = el('div');
  function drawGrid() {
    const inPic = linkedNodes();
    const byGroup = new Map(GROUPS.map((g) => [g, []]));
    for (const n of bay.nodes()) if (!inPic.has(n.id) && !isInstance(n.id)) byGroup.get(groupOf(n)).push(n);
    const out = [];
    for (const [where, nodes] of byGroup) {
      if (!nodes.length) continue;
      const box = el('section', 'cn-site');
      box.append(el('h3', '', where));
      const grid = el('div', 'cn-grid');
      for (const n of nodes) {
        const card = el('div', 'cn-box');
        card.dataset.node = n.id;
        const head = el('div', 'cn-head');
        const id = el('span', 'cn-id', n.id);
        if (INSTANCE.has(n.id)) id.title = `one box for the type: ${INSTANCE.get(n.id)}`;
        head.append(id, el('span', 'cn-label', n.label || ''));
        const ports = el('div', 'cn-ports'), ins = el('div'), outs = el('div');
        for (const p of bay.ports().filter((q) => nodeOf(q.id) === n.id)) {
          const b = el('button', 'pos-linkbtn cn-port', p.id.split(':')[2], { type: 'button', 'aria-pressed': 'false' });
          b.dataset.port = p.id;
          b.style.setProperty('--c', `var(--md-${p.medium})`);
          b.title = p.dir === 'out' ? 'press, then press an in port' : 'press an out port first, then this';
          b.addEventListener('click', (e) => pick(p.id, e));
          (p.dir === 'out' ? outs : ins).append(b);
        }
        ports.append(ins, outs);
        card.append(head, ports);
        grid.append(card);
      }
      box.append(grid);
      out.push(box);
    }
    groups.replaceChildren(...out);
  }

  function redraw() {
    if (armed && !bay.port(armed)) armed = null;
    pic.classList.toggle('cn-pic-empty', bay.links().length === 0);
    drawGrid();
    pb.refresh();
    decorate();
    runtime.sync();
  }

  // ── the faces: what the linked nodes look like when they run ─────────────
  // node-runtime.mjs makes a runtime per linked node; this block places their
  // faces. One knob row for every knob, rebuilt only when the set of knobs changes.
  const faces = el('div', 'cn-faces');
  faces.hidden = true;
  let knobRow = null, knobKey = '';
  const part = (title, face) => { const p = el('section', 'cn-face'); p.append(el('h3', 'pos-sec-h', title), face); return p; };
  function drawFaces() {
    const all = runtime.list().filter((x) => x.rt.face);
    const knobs = all.filter((x) => x.rt.slot === 'knob');
    const parts = all.filter((x) => x.rt.slot === 'picture').map((x) => part(x.id, x.rt.face));
    if (knobs.length) {
      const key = knobs.map((x) => x.id).join();
      if (key !== knobKey) { knobRow = createKnobGrid(knobs.map((x) => ({ name: x.rt.name, knob: x.rt.knob })), { row: true }); knobKey = key; }
      parts.push(part(knobs.length === 1 ? knobs[0].id : 'knobs', knobRow.el));
    } else knobKey = '';
    parts.push(...all.filter((x) => x.rt.slot === 'keys').map((x) => part(x.id, x.rt.face)));
    faces.replaceChildren(...parts);
    faces.hidden = !parts.length;
  }
  const runtime = createRuntimes({ bay, typeOf, log: (m, lv) => d.log(m, lv), onChange: drawFaces, audio: { sharedAudio, claim, release } });
  window.__demo.runtime = runtime;

  const say = el('div', 'cn-say');
  say.append(exRow, props);
  d.stack.add(say, faces, pic, groups);
  redraw();
  for (const f of failed) d.log(f, 'bad');

  if (SELFCHECK) await check();
  d.ready();

  async function check() {
    const A = d.assert;
    const inGrid = (id) => !!groups.querySelector(`.cn-box[data-node="${id}"]`);
    // what a reader sees: an empty picture hides the last drawing rather than redrawing nothing
    const inPicture = (id) => !pic.classList.contains('cn-pic-empty') && [...(svgOf()?.querySelectorAll('.lv-title') || [])].some((t) => t.textContent === id);
    const has = (from, to) => bay.links().some((l) => l.from === from && l.to === to);
    const press = (id) => document.querySelector(`button[data-port="${id}"], text[data-port="${id}"]`)?.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    const frame = () => new Promise((r) => requestAnimationFrame(() => r()));
    const runtimes = async () => { await runtime.idle(); await frame(); };

    // Before anything is pressed: no runtime, no face, no sound device.
    A('a visit opens no sound device and shows no face', contexts() === 0 && runtime.list().length === 0
      && faces.hidden && getComputedStyle(faces).display === 'none', `contexts ${contexts()}, runtimes ${runtime.list().length}`);

    A('every node made it into the bay', failed.length === 0 && bay.nodes().length === EXPECTED,
      `${bay.nodes().length} of ${EXPECTED}: ${Object.keys(CATALOGUE).length} catalogue types (${HOPS.length} of them hops), ${PI_KEPT} Pi`
      + `${failed.length ? `, refused: ${failed.join('; ')}` : ''}`);
    // Nothing imaginary: every box names a page that builds it, and every page
    // it names is a concept page that exists.
    const known = new Set([...CONCEPTS.map((c) => c.id), ...OFF_INDEX]);
    const orphan = bay.nodes().filter((n) => !(PAGES.get(n.id) || []).length).map((n) => n.id);
    const unknown = [...new Set([...PAGES.values()].flat())].filter((pg) => !known.has(pg));
    A('every node names the pages that build it, and every one of those pages exists', !orphan.length && !unknown.length,
      `no page: ${orphan.join(', ') || 'none'}; not a page: ${unknown.join(', ') || 'none'}`);
    A('a type made per instance is one box, not one per knob', !bay.nodes().some((n) => /:knob-(?!volume$|mix$)|:midi-\d|:scope-|:screen-/.test(n.id)),
      bay.nodes().filter((n) => /:knob-|:midi-\d|:scope-|:screen-/.test(n.id)).map((n) => n.id).join(', '));
    A('nothing is linked on a visit, and the picture\'s room is held empty', bay.links().length === 0 && pic.classList.contains('cn-pic-empty') && pic.getBoundingClientRect().height >= 140);

    // Every example's links can be made, each on a fresh bay so one cannot
    // block another, and with the consent a person's press of Connect gives.
    const cant = [];
    for (const ex of EXAMPLES) {
      const s = makeBay().bay;
      for (const l of ex.links) {
        const via = viaFor(l.from, l.to);
        const r = s.link(l.from, l.to, l.transforms, { consent: true, ...(via ? { via } : {}) });
        if (!r.ok) cant.push(`"${ex.say}": ${l.from} -> ${l.to}: ${r.why}`);
      }
    }
    const lost = EXAMPLES.filter((e) => !known.has(e.page)).map((e) => `"${e.say}" on ${e.page}`);
    A('every example is something a concept page already does', !lost.length, lost.join('; '));
    const told = portsForModel();
    A('the model is told few enough ports for the worker to take them', told.length <= MAX_PORTS && EXAMPLE_PORTS.size <= MAX_PORTS,
      `${told.length} of ${MAX_PORTS}, ${EXAMPLE_PORTS.size} of them named by an example, out of ${bay.ports().length} in the bay`);
    const toldIds = new Set(told.map((p) => p.id));
    const unnamed = EXAMPLES.flatMap((e) => e.links.flatMap((l) => [l.from, l.to])).filter((id) => !toldIds.has(id));
    A('every port an example needs is one the model is told about', unnamed.length === 0, [...new Set(unnamed)].join(', '));
    A(`all ${EXAMPLES.length} examples can be linked in this bay`, cant.length === 0, cant.join('; '));

    // Picking by pressing: an out port, then an in port of the same medium.
    const SYNTH_IN = W('synth', 'midi-in'), SYNTH_OUT = W('synth', 'audio-out');
    press(KEYS); press(SYNTH_IN);
    await frame();
    A('pressing keys midi-out then synth midi-in links them', has(KEYS, SYNTH_IN));
    A('a linked node leaves the grid and is drawn in the picture',
      !inGrid('web:synth') && inPicture('web:synth') && !inGrid('web:keys') && inPicture('web:keys') && inGrid('web:plaits'),
      `synth in grid ${inGrid('web:synth')}, in picture ${inPicture('web:synth')}`);

    // A port in the picture is pressable too, so a chain can be finished there.
    press(SYNTH_OUT); press(SPK);
    await frame();
    A('a port drawn in the picture can be picked', has(SYNTH_OUT, SPK) && inPicture('web:speaker'));

    const before = bay.links().length;
    press(KEYS); press(SPK);
    const logs = () => window.__demo.logs.map((x) => x.msg).join('\n');
    A('a medium mismatch is refused in words', bay.links().length === before && /carries midi and .* takes audio/.test(logs()),
      logs().split('\n').filter((x) => x.startsWith('refused')).pop());
    // A press the browser did not make is not a person asking to listen.
    press('err:station:audio-out'); press('cf-shout:relay:audio-in');
    A('a link out of somebody else\'s server waits for a person\'s own press', bay.links().length === before && /somebody else's server/.test(logs()),
      logs().split('\n').filter((x) => x.startsWith('refused')).pop());

    // An example press builds its patch at once, replacing what was linked.
    const ex = EXAMPLES[1];
    const reached0 = reached;
    [...exRow.children].find((b) => b.textContent === ex.say).click();
    await frame();
    A('an example press builds exactly its links, asks no model, and Plaits moves into the picture',
      bay.links().length === ex.links.length && ex.links.every((l) => has(l.from, l.to))
        && inPicture('web:plaits') && !inGrid('web:plaits') && reached === reached0,
      `${bay.links().length} links`);

    // A sentence nobody listed gets the stand-in with a broken transform.
    ask('something else');
    await frame(); await asking;
    const broken = [...props.querySelectorAll('.cn-prop')].find((r) => /transpose/.test(r.dataset.line));
    A('a proposal with a malformed transform is shown and cannot be connected',
      !!broken && broken.querySelector('.pos-pri').disabled && /cannot be made/.test(broken.textContent));
    for (const r of [...props.querySelectorAll('.cn-prop')]) r.querySelector('.pos-sm:not(.pos-pri)').click();

    // Pressing a wire removes that link.
    await frame();
    const target = bay.links().find((l) => l.from === 'web:plaits:audio-out');
    svgOf()?.querySelector(`.cn-hit[data-link="${target?.id}"]`)?.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    A('pressing a wire removes that link', !!target && !bay.links().some((l) => l.id === target.id));
    const midiLink = bay.links().find((l) => l.from === 'web:midi:midi-out');
    removeLink(midiLink?.id);
    A('a node with no links left goes back to the grid', inGrid('web:plaits') && inGrid('web:midi') && !inPicture('web:plaits'));
    armed = null; lightArmed();

    await runtimes();

    // ── slice 1: the keys play the synth, through the speakers ──────────────
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const RT = (id) => runtime.get(id);
    const keyboards = () => faces.querySelectorAll('.kbd').length;
    [...exRow.children].find((b) => b.textContent === EXAMPLES[0].say).click();
    await runtimes();
    A('the example "let the keys play the synth" shows exactly one keyboard, runs the synth and the speaker, and opens no sound device yet',
      keyboards() === 1 && !!RT('web:synth') && !!RT('web:speaker') && contexts() === 0,
      `keyboards ${keyboards()}, runtimes ${runtime.list().map((x) => x.id).join(' ')}, contexts ${contexts()}`);
    const kb = RT('web:keys').kb, synth = RT('web:synth'), speaker = RT('web:speaker');
    const A3 = kb.keyOf(57);
    const h0 = synth.heard();
    kb.press(A3);   // the keyboard's own handler, which is the first press on a face (D4)
    await sleep(300);
    const loud = speaker.heard();
    A('the first press on a face starts the one sound device, the key reaches the synth and the speakers get louder',
      contexts() === 1 && runtime.context()?.state === 'running' && synth.heard() === h0 + 1 && loud > 0.01,
      `context ${runtime.context()?.state}, synth heard ${synth.heard() - h0}, level at the speakers ${loud.toFixed(4)}`);
    kb.release(A3);
    await sleep(200);

    // ── slice 3: a scope fed by the synth ───────────────────────────────────
    const SCOPE_IN = W('scope', 'audio-in');
    press(SYNTH_OUT); press(SCOPE_IN);
    await runtimes();
    const scope = RT('web:scope');
    kb.press(A3);
    await sleep(300);
    const fed = scope?.heard() ?? 0;
    A('a scope linked from the synth shows a picture, and its buffer moves while a key sounds',
      !!scope && faces.contains(scope.face) && fed > 0.01, `peak ${fed.toFixed(4)}`);
    kb.release(A3);
    await sleep(400);
    const still = scope?.heard() ?? 1;
    A('NEGATIVE CONTROL: the same scope reads zero once nothing sounds', !!scope && still < 1e-4, `peak ${still.toExponential(2)}`);

    // ── slice 2: one knob per parameter, into the synth's value-in ──────────
    const SYNTH_VAL = W('synth', 'value-in');
    press(KNOB); press(SYNTH_VAL);
    await runtimes();
    const knobIds = runtime.list().filter((x) => x.type === 'knob').map((x) => x.id);
    A('linking the knob box to the synth makes one knob per parameter, in one row',
      knobIds.length === 5 && knobRow?.knobs.length === 5 && faces.contains(knobRow.el) && !has(KNOB, SYNTH_VAL),
      knobIds.join(', '));
    // A key is held while the knob turns: Chrome stops processing a filter with
    // nothing sounding into it, and then its frequency never reads back the glide.
    const cutoff = RT('web:knob-cutoff');
    kb.press(A3);
    cutoff?.knob.set(knobRaw('cutoff', 500));
    await sleep(250);
    const fq = synth.voice.filter()?.frequency.value ?? 0;
    kb.release(A3);
    await sleep(200);
    A('turning the cutoff knob moves the synth cutoff, read back off the filter',
      Math.abs(synth.param('cutoff') - 500) < 5 && Math.abs(fq - 500) < 25, `asked 500, the synth holds ${synth.param('cutoff')?.toFixed(1)}, the filter reads ${fq.toFixed(1)} Hz`);
    const q = RT('web:knob-q'), q0 = synth.param('q');
    removeLink(bay.links().find((l) => l.from === 'web:knob-q:value-out')?.id);
    await runtimes();
    q?.knob.set(knobRaw('q', 9));
    A('NEGATIVE CONTROL: an unlinked knob moves nothing, and its face is gone',
      !!q && synth.param('q') === q0 && !faces.contains(q.face) && !RT('web:knob-q') && knobRow?.knobs.length === 4,
      `q ${q0} then ${synth.param('q')}`);

    // ── the negative control on the speakers ────────────────────────────────
    removeLink(bay.links().find((l) => l.from === SYNTH_OUT && l.to === SPK)?.id);
    await runtimes();
    const h1 = synth.heard();
    kb.press(A3);
    await sleep(300);
    const quiet = runtime.level(), meanwhile = scope?.heard() ?? 0;
    A('NEGATIVE CONTROL: with the speaker unlinked the key still reaches the synth and sounds at the scope, and nothing reaches the speakers',
      synth.heard() === h1 + 1 && meanwhile > 0.01 && quiet < 0.001 && !RT('web:speaker'),
      `synth heard ${synth.heard() - h1}, scope ${meanwhile.toFixed(4)}, speakers ${quiet.toFixed(5)} against ${loud.toFixed(4)} linked`);
    kb.release(A3);

    removeLink(bay.links().find((l) => l.from === KEYS)?.id);
    await runtimes();
    A('unlinking the keys takes the keyboard away', keyboards() === 0 && !RT('web:keys') && !!RT('web:synth'));
    for (const l of [...bay.links()]) bay.unlink(l.id);
    redraw();
    await runtimes();
    A('with nothing linked every runtime is closed and the faces take no room', runtime.list().length === 0 && faces.hidden);

    A('the self-check asked the wish worker nothing', reached === 0, `${reached} calls`);
  }
</script>
