<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON connect</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* Unlinked nodes as the patchbay draws a box, four to a row, grouped by where they run. */
  .cn-site + .cn-site { margin-top: 32px; }
  .cn-site h3 { margin: 0 0 12px; font: 600 9.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim2); }
  .cn-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 900px) { .cn-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .cn-box { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; background: var(--card2); border: 1px solid var(--line2); border-radius: var(--r, 4px); min-width: 0; }
  .cn-head { display: flex; flex-direction: column; gap: 2px; }
  .cn-id { font: 600 13px/1.3 var(--mono); color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cn-label { font: 400 11.5px/1.3 var(--sans); color: var(--dim); }
  .cn-ports { display: flex; justify-content: space-between; gap: 8px; font: 400 12px/1.5 var(--mono); }
  .cn-ports > div { display: flex; flex-direction: column; }
  .cn-ports > div:last-child { text-align: right; }
</style>
<script type="module">
  import { mount, el } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { useMediumColours } from '/shell/patchbay.mjs';

  // The things the site already has, as nodes with their ports and nothing
  // linked yet. A hand list until plans/plan-node-catalogue.md lands, when it
  // reads demo/shell/nodes.mjs and the Pi's boardGraph() instead.
  const NODES = [
    // in your hands
    ['web:keys', 'person', 'on-screen keys', ['midi-out', 'midi-in']],
    ['web:midi', 'device', 'a plugged-in MIDI keyboard', ['midi-out']],
    ['web:knob', 'device', 'a knob', ['value-out']],
    ['web:camera', 'device', 'camera', ['video-out']],
    ['web:typewriter', 'person', 'typing', ['value-out']],
    // sound made in this tab
    ['web:sine', 'engine', 'sine synth', ['midi-in', 'audio-out']],
    ['web:plaits', 'engine', 'Plaits', ['midi-in', 'value-in', 'audio-out']],
    ['web:collide', 'engine', 'SuperCollider', ['midi-in', 'value-in', 'audio-out']],
    ['web:faust', 'engine', 'Faust', ['midi-in', 'value-in', 'audio-out']],
    ['web:piano', 'engine', 'piano and Rhodes', ['midi-in', 'audio-out']],
    ['web:drums', 'engine', 'drum machine', ['clock-in', 'audio-out']],
    ['web:grains', 'engine', 'granulator', ['audio-in', 'value-in', 'audio-out']],
    ['web:looper', 'engine', 'looper', ['midi-in', 'midi-out']],
    ['web:tempo', 'engine', 'tempo detector', ['audio-in', 'clock-out', 'value-out']],
    ['web:key', 'engine', 'key detector', ['audio-in', 'value-out']],
    ['web:shader', 'engine', 'shader', ['video-in', 'value-in', 'video-out']],
    ['web:pico', 'engine', 'emulated Pico', ['midi-in', 'video-out']],
    ['web:recorder', 'store', 'recorder', ['midi-in', 'file-out']],
    // where it can be heard and seen
    ['web:speaker', 'screen', 'speakers', ['audio-in']],
    ['web:scope', 'screen', 'waveform', ['audio-in']],
    ['web:screen', 'screen', 'this screen', ['video-in']],
    // the Pi in the studio
    ['pi-1:circuit', 'device', 'Novation Circuit', ['midi-in', 'value-in', 'audio-out']],
    ['pi-1:collide', 'engine', 'SuperCollider on the Pi', ['midi-in', 'value-in', 'audio-out']],
    ['pi-1:piano', 'engine', 'Pi piano', ['midi-in', 'audio-out']],
    ['pi-1:drums', 'engine', 'Pi drums', ['clock-in', 'audio-out']],
    ['pi-1:gpu', 'engine', 'Pi GPU', ['value-in', 'video-in', 'video-out']],
    // Cloudflare
    ['cf-relay:room', 'external', 'Cloudflare relay', ['midi-in', 'midi-out', 'value-in', 'value-out', 'clock-in', 'clock-out']],
    ['cf-stream:live', 'external', 'Cloudflare Stream', ['audio-in', 'video-in', 'audio-out', 'video-out']],
    ['cf-r2:radio', 'store', 'our radio recordings', ['audio-out']],
  ];
  const SITES = { web: 'this tab', phone: 'a phone', 'pico-1': 'a Pico', 'pi-1': 'the Pi in the studio', 'cf-relay': 'Cloudflare', 'cf-stream': 'Cloudflare', 'cf-r2': 'Cloudflare' };

  const bay = createBay();
  const failed = [];
  for (const [id, kind, label, ports] of NODES) {
    try {
      bay.addNode({ id, kind, label, place: id.startsWith('web:') ? 'browser' : 'remote' });
      for (const p of ports) {
        const [medium, dir] = p.split('-');
        bay.addPort({ id: `${id}:${p}`, dir, medium });
      }
    } catch (e) { failed.push(`${id}: ${e.message}`); }
  }

  const d = mount({ name: 'connect', what: 'Everything the site can connect, laid out with nothing connected yet.', readout: null, index: '/', indexLabel: 'positron' });
  useMediumColours();

  // one box per node, ins on the left and outs on the right, as the patchbay draws them
  const bySite = new Map();
  for (const n of bay.nodes()) {
    const site = n.id.split(':')[0];
    const where = SITES[site] || site;
    if (!bySite.has(where)) bySite.set(where, []);
    bySite.get(where).push(n);
  }
  const groups = [];
  for (const [site, nodes] of bySite) {
    const box = el('section', 'cn-site');
    box.append(el('h3', '', site));
    const grid = el('div', 'cn-grid');
    for (const n of nodes) {
      const card = el('div', 'cn-box');
      const head = el('div', 'cn-head');
      head.append(el('span', 'cn-id', n.id), el('span', 'cn-label', n.label || ''));
      const ports = el('div', 'cn-ports'), ins = el('div'), outs = el('div');
      for (const p of bay.ports().filter((p) => p.id.startsWith(`${n.id}:`))) {
        (p.dir === 'out' ? outs : ins).append(el('span', `md-${p.medium}`, p.id.split(':')[2]));
      }
      ports.append(ins, outs);
      card.append(head, ports);
      grid.append(card);
    }
    box.append(grid);
    groups.push(box);
  }
  const all = el('div');
  all.append(...groups);
  d.stack.add(all);
  for (const f of failed) d.log(f, 'bad');

  if (SELFCHECK) {
    d.assert('every node made it into the bay', failed.length === 0 && bay.nodes().length === NODES.length,
      `${bay.nodes().length} of ${NODES.length}${failed.length ? `, refused: ${failed.join('; ')}` : ''}`);
    d.assert('nothing is linked yet', bay.links().length === 0);
  }
  d.ready();
</script>
