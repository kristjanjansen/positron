<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>Drum machine</title>
<link rel="stylesheet" href="/shell/shell.css">
<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount } from '/shell/shell.mjs';
  import { createDrumMachine } from '/drums/drum-machine.mjs';
  import { VOICES } from '/drums/voices.mjs';

  // A drum machine as a patchbay: a 16 by 4 grid, a sequencer sending MIDI notes, four
  // SuperCollider voices. Everything but the frame is `../drum-machine.mjs`.
  // See lessons/page-drums.md#drums-19
  const d = mount({ name: 'Drum machine', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('drums/machine');
  const m = createDrumMachine(d, { voices: VOICES });
  d.stack.add(m.surface, m.patchbay);
  window.__rhythm = m.api;
  d.ready();
</script>
