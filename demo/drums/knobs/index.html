<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>Drum knobs</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* Four scopes in one row, a quarter each; two by two on a phone, where a
     quarter of 343 px is 80 px and a waveform there is a smudge. */
  .cc-scopes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 560px) { .cc-scopes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createDrumMachine } from '/drums/drum-machine.mjs';
  import { voices } from '/drums/voices.mjs';

  // /drums/machine/ plus one knob per drum. Asked 2026-10-12: *"next
  // drum, same but each synth a parameter to tweak"*.
  //
  // Each drum's program declares its one number as a named control
  // (`\pitch.kr`, `\snap.kr`, `\length.kr`, `\bright.kr`), and each knob is a
  // bay node of its own, `web:knob-<name>:value-out`, wired into that drum's
  // `value-in`. The value travels with every hit, in the hit's own timestamped
  // bundle, so a turn is heard from the next hit and a hit already ringing
  // keeps the value it started with. Which number and why is in
  // `../voices.mjs`, `PARAMS`.
  //
  // Knobs under the grid, asked 2026-10-12: *"move knobs below grid"*.
  //
  // FOUR SCOPES ON TOP, ONE PER DRUM, asked 2026-10-12: *"add 4 scopes 1/4 each
  // on top of 010"*. Each drum plays on an output pair of its own and each
  // scope is a node, `web:scope-<drum>`, fed by that drum's `audio-out` alone,
  // so a scope shows its drum and nothing else (`../drum-machine.mjs`).
  const d = mount({ name: 'Drum knobs', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('drums/knobs');
  const m = createDrumMachine(d, { voices: voices({ knobs: true }), scopes: true });
  const scopes = el('div', 'cc-scopes');
  scopes.append(...m.scopes);
  d.stack.add(scopes, m.surface, m.knobs, m.patchbay);
  window.__rhythm = m.api;
  window.__demo.knobs = m.api.knobGrid;
  d.ready();
</script>
