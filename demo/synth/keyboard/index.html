<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>Keyboard</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* The same medium colours as /concepts/misc/000/. */
  :root {
    --md-midi: #6fb8e8; --md-audio: #ee9a4d; --md-clock: #c9ced6; --md-value: #9ad16b;
    --md-video: #e07a5f; --md-program: #c39af0; --md-file: #d68fc6; --md-state: #8a9fc4;
  }
  .md-midi { color: var(--md-midi); } .md-audio { color: var(--md-audio); }
  .md-clock { color: var(--md-clock); } .md-value { color: var(--md-value); }
  .md-video { color: var(--md-video); } .md-program { color: var(--md-program); }
  .md-file { color: var(--md-file); } .md-state { color: var(--md-state); }
</style>
<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createKeyboard, keyRange } from '/shell/keyboard.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';

  // The on-screen keyboard and a sine synth as patchbay nodes, all in this tab.
  // Named from the bay's side: what the keyboard PLAYS leaves it (an out), what
  // it SHOWS arrives (an in). Notes travel keys -> synth only along a link the
  // bay holds; the synth's sound goes to the speakers by WebAudio. No room.
  const S = 'web';
  const bay = createBay();
  for (const [n, kind, label] of [['keys', 'person', 'keyboard'], ['synth', 'engine', 'sine'], ['speaker', 'screen', 'speakers']]) {
    bay.addNode({ id: `${S}:${n}`, kind, label, place: 'browser' });
  }

  // ── the synth: one sine per held note, a short fade in and out ──────────
  let ctx = null;
  const voices = new Map();
  const hz = (n) => 440 * 2 ** ((n - 69) / 12);
  function noteOn(n, vel) {
    ctx ??= new AudioContext();
    if (voices.has(n)) return;
    const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
    o.frequency.value = hz(n);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.2 * (vel / 127), t + 0.01);
    o.connect(g).connect(ctx.destination);
    o.start();
    voices.set(n, { o, g });
  }
  function noteOff(n) {
    const v = voices.get(n);
    if (!v) return;
    const t = ctx.currentTime;
    v.g.gain.cancelScheduledValues(t);
    v.g.gain.setValueAtTime(v.g.gain.value, t);
    v.g.gain.linearRampToValueAtTime(0, t + 0.05);
    v.o.stop(t + 0.06);
    voices.delete(n);
  }

  let kb = null;
  const PORTS = [
    { id: `${S}:keys:midi-out`, dir: 'out', medium: 'midi', emits: ['note'] },
    { id: `${S}:keys:midi-in`, dir: 'in', medium: 'midi', accepts: ['note'],
      deliver: (e) => kb?.lightNote(e.d1, !!e.d2) },
    { id: `${S}:synth:midi-in`, dir: 'in', medium: 'midi', accepts: ['note'],
      deliver: (e) => (e.d2 ? noteOn(e.d1, e.d2) : noteOff(e.d1)) },
    { id: `${S}:synth:audio-out`, dir: 'out', medium: 'audio' },
    { id: `${S}:speaker:audio-in`, dir: 'in', medium: 'audio' },
  ];
  for (const p of PORTS) bay.addPort(p);

  const d = mount({ name: 'Keyboard', what: '', readout: null, index: '/', indexLabel: 'concepts' });
  conceptNav('synth/keyboard');

  // ── the links ───────────────────────────────────────────────────────────
  const WANT = [
    [`${S}:keys:midi-out`, `${S}:synth:midi-in`],
    [`${S}:synth:audio-out`, `${S}:speaker:audio-in`],
  ];
  const held = new Map();       // "from to" -> link id
  function patch(on) {
    for (const [a, b] of WANT) {
      const k = `${a} ${b}`;
      if (on && !held.has(k)) {
        const r = bay.link(a, b, [], { site: S });
        if (r.ok) held.set(k, r.id); else d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
      } else if (!on && held.has(k)) { bay.unlink(held.get(k)); held.delete(k); }
    }
    for (const n of [...voices.keys()]) noteOff(n);
    pb.refresh();
  }

  // ── the links as a picture, with the links and ports behind its details ──
  // A MIDI wire pulses once per event its link delivered; the audio wire is lit
  // while the sine sounds.
  // The picture reads only nodes(), ports() and links(), and the bay has no way
  // to forget a node, so an unplugged device is hidden here and its links are
  // dropped. With nothing plugged in the picture is the three nodes it always was.
  const plugged = new Set();    // node ids of the devices plugged in now
  const shown = (id) => !id.startsWith(`${S}:midi`) || plugged.has(id.split(':').slice(0, 2).join(':'));
  const pb = createPatchbay({
    nodes: () => bay.nodes().filter((n) => shown(n.id)),
    ports: () => bay.ports().filter((p) => shown(p.id)),
    links: () => bay.links(),
  }, { flowing: () => voices.size > 0 });

  // A key press is one event leaving keys:midi-out, sent through the bay.
  const host = el('div');
  // C to A, 13 white keys: as many as the content width holds at the kit's 49 px minimum.
  kb = createKeyboard(host, {
    ...keyRange(21), base: 48,
    onDown: (note, how) => { if (how === 'midi') return; bay.send(`${S}:keys:midi-out`, { cls: 'note', ch: 1, d1: note, d2: 100 }); },
    onUp: (note, how) => { if (how === 'midi') return; bay.send(`${S}:keys:midi-out`, { cls: 'note', ch: 1, d1: note, d2: 0 }); },
  });

  patch(true);

  // ── keyboards plugged into this machine ────────────────────────────────
  // One `device` node per MIDI input, named after the device, with one out
  // port linked to the synth (it sounds) and to the keys (they light). A device
  // keeps its node id across a replug, so web:midi stays web:midi.
  const slots = new Map();      // MIDI port id -> node id
  const devHeld = new Map();    // node id -> Set of notes held on it
  const devLinks = new Map();   // node id -> link ids
  const slotFor = (p) => {
    if (!slots.has(p.id)) slots.set(p.id, slots.size ? `${S}:midi-${slots.size + 1}` : `${S}:midi`);
    return slots.get(p.id);
  };
  const wired = new WeakSet();
  function fromDevice(e) {
    const node = slots.get(e.target.id);
    if (!node || !plugged.has(node)) return;
    const [b0, d1, d2 = 0] = e.data;
    const st = b0 & 0xf0, ch = (b0 & 0x0f) + 1;
    if (st !== 0x90 && st !== 0x80) return;
    const on = st === 0x90 && d2 > 0;
    const held = devHeld.get(node);
    if (on) held.add(d1); else held.delete(d1);
    bay.send(`${node}:midi-out`, { cls: 'note', ch, d1, d2: on ? d2 : 0 });
  }
  function plug(p) {
    const node = slotFor(p);
    bay.addNode({ id: node, kind: 'device', label: p.name || 'MIDI keyboard', place: 'browser' });
    if (plugged.has(node)) return;
    bay.addPort({ id: `${node}:midi-out`, dir: 'out', medium: 'midi', emits: ['note'] });
    const ids = [];
    for (const to of [`${S}:synth:midi-in`, `${S}:keys:midi-in`]) {
      const r = bay.link(`${node}:midi-out`, to, [], { site: S });
      if (r.ok) ids.push(r.id); else d.log(`${node}:midi-out -> ${to} refused: ${r.why}`, 'warn');
    }
    plugged.add(node); devHeld.set(node, new Set()); devLinks.set(node, ids);
    if (!wired.has(p)) { p.addEventListener('midimessage', fromDevice); wired.add(p); }
    d.log(`MIDI in: ${p.name || 'unnamed port'} as ${node}`);
  }
  function unplug(node) {
    // Let go of what it was holding first, so nothing hangs or stays lit.
    for (const n of devHeld.get(node) || []) bay.send(`${node}:midi-out`, { cls: 'note', ch: 1, d1: n, d2: 0 });
    for (const id of devLinks.get(node) || []) bay.unlink(id);
    plugged.delete(node); devHeld.delete(node); devLinks.delete(node);
    d.log(`MIDI in gone: ${bay.node(node)?.label || node}`);
  }
  function devices(access) {
    const now = new Set();
    for (const p of access.inputs.values()) if (p.state !== 'disconnected') { plug(p); now.add(slotFor(p)); }
    for (const node of [...plugged]) if (!now.has(node)) unplug(node);
    pb.refresh();
  }
  // Asking for MIDI shows the browser's prompt once; nothing else opens on a visit.
  if (navigator.requestMIDIAccess) {
    navigator.requestMIDIAccess({ sysex: false }).then((access) => {
      devices(access);
      access.onstatechange = () => devices(access);
    }, () => {});   // refused: the page stays as it is with no device, and says nothing
  }

  // Blocks in the shell's stack, at the shell's gap.
  d.stack.add(host, pb.el);
  d.ready();
</script>
