<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>Recorder</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/concept.css">
<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createTable } from '/shell/table.mjs';
  import { createKeyboard, keyRange } from '/shell/keyboard.mjs';
  import { createVoice } from '/shell/synth-voice.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { addNodes } from '/shell/nodes.mjs';
  import { createPatchbay, useMediumColours } from '/shell/patchbay.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  useMediumColours();

  // /synth/keyboard/ plus a RECORDER, a node of its own: `rec:midi-in` takes the
  // keyboard's notes along a link while armed, `rec:midi-out` plays them back
  // into the synth along another.
  const S = 'web';
  const bay = createBay();

  // ── the synth: one saw per held note, a short fade in and out ───────────
  let ctx = null;
  // The kit voice as this page's saw: no filter, so the bus is the voice's own out.
  const voice = createVoice({ wave: 'sawtooth', level: 0.08, cutoff: null });
  // The audio graph follows the links: the synth's bus reaches the speakers only
  // while synth:audio-out -> speaker:audio-in is held.
  function audio() {
    if (!ctx) return;
    const bus = voice.out();
    bus.disconnect();
    if (bay.links().some((l) => l.from === `${S}:synth:audio-out` && l.to === `${S}:speaker:audio-in`)) bus.connect(ctx.destination);
  }

  function noteOn(n, vel) {
    if (!ctx) { ctx = new AudioContext(); voice.start(ctx); audio(); }
    voice.noteOn(n, vel);
  }
  const noteOff = (n) => voice.noteOff(n);

  let kb = null;
  // The shapes are /shell/nodes.mjs's; the page says only what each in-port does.
  addNodes(bay, S, ['keys', 'synth', 'rec', 'speaker'], {
    label: { synth: 'saw' },
    deliver: {
      'keys:midi-in': (e) => (e.d2 ? kb?.press(e.d1, 'midi') : kb?.release(e.d1, 'midi')),
      'synth:midi-in': (e) => (e.d2 ? noteOn(e.d1, e.d2) : noteOff(e.d1)),
      'rec:midi-in': (e) => take(e),
    },
  });

  const d = mount({ name: 'Recorder', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('synth/recorder');

  // ── the links, rebuilt whenever an effect changes ─────────────────────
  function patch() {
    for (const l of bay.links()) bay.unlink(l.id);
    const want = [[`${S}:keys:midi-out`, `${S}:synth:midi-in`, []]];
    // The recorder hears the keys; it plays back into the synth on a link of its own.
    want.push([`${S}:keys:midi-out`, `${S}:rec:midi-in`, []], [`${S}:rec:midi-out`, `${S}:synth:midi-in`, []]);
    want.push([`${S}:synth:audio-out`, `${S}:speaker:audio-in`, []]);
    for (const [a, b, tr] of want) {
      const r = bay.link(a, b, tr, { site: S });
      if (!r.ok) d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
    }
    voice.panic();
    audio();
    pb.refresh();
   
  }

  // ── the recorder ────────────────────────────────────────────────────────
  const NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const nameOf = (n) => `${NAMES[n % 12]}${Math.floor(n / 12) - 1}`;
  let armed = false, t0 = 0;
  const notes = [];                // { n, vel, at, len }
  const open = new Map();          // note -> its row, until the key comes up
  function take(e) {
    if (!armed) return;
    const at = performance.now() - t0;
    if (e.d2) { const r = { n: e.d1, vel: e.d2, at, len: null }; notes.push(r); open.set(e.d1, r); }
    else { const r = open.get(e.d1); if (r) { r.len = at - r.at; open.delete(e.d1); } }
    drawNotes();
  }
  const notesT = createTable({ columns: [
    { key: 'i', label: '#', width: 36, align: 'right' },
    { key: 'note', label: 'note', grow: true, hi: true },
    { key: 'vel', label: 'vel', width: 48, align: 'right' },
    { key: 'at', label: 'at', width: 80, align: 'right' },
    { key: 'len', label: 'length', width: 80, align: 'right' },
  ], minRows: 6, stick: true });
  const ms = (v) => (v == null ? '' : `${(v / 1000).toFixed(2)} s`);
  function drawNotes() {
    notesT.set(notes.map((r, i) => ({ i: i + 1, note: nameOf(r.n), vel: r.vel, at: ms(r.at), len: r.len == null ? 'held' : ms(r.len) })));
  }
  let timers = [], playing = false;
  // The rows sounding right now during playback, lit with the table's own mark.
  const sounding = new Set();
  // The table scrolls inside its own box to keep the lit row in the middle;
  // scrollIntoView would move the whole page as well.
  const lit = () => {
    notesT.mark((row, i) => sounding.has(i));
    const box = notesT.scroller(), on = box.querySelector('.pos-tbl-row.on');
    if (on) box.scrollTop = on.offsetTop - box.offsetTop - (box.clientHeight - on.offsetHeight) / 2;
  };
  // Two toggles, icons only: record becomes stop while recording, play
  // becomes stop while playing. Recording and playing stop each other.
  function face() {
    const p = transport.button('play');
    transport.setIcon('rec', armed ? 'stop' : 'record', armed ? 'stop recording' : 'record');
    transport.setIcon('play', playing ? 'stop' : 'play', playing ? 'stop playing' : 'play');
    p.disabled = !notes.length && !playing;
  }
  function play() {
    stop();
    playing = true;
    const end = notes.reduce((m, r) => Math.max(m, r.at + (r.len ?? 200)), 0);
    timers.push(setTimeout(() => { playing = false; face(); }, end + 50));
    notes.forEach((r, i) => {
      timers.push(setTimeout(() => { sounding.add(i); lit(); bay.send(`${S}:rec:midi-out`, { cls: 'note', ch: 1, d1: r.n, d2: r.vel }); }, r.at));
      timers.push(setTimeout(() => { sounding.delete(i); lit(); bay.send(`${S}:rec:midi-out`, { cls: 'note', ch: 1, d1: r.n, d2: 0 }); }, r.at + (r.len ?? 200)));
    });
    face();
  }
  function stop() {
    armed = false; playing = false;
    sounding.clear(); lit();
    for (const t of timers) clearTimeout(t);
    timers = [];
    voice.panic();
    face();
  }
  function record() {
    stop();
    notes.length = 0; open.clear(); t0 = performance.now(); armed = true;
    drawNotes(); face();
  }
  const transport = createButtonGroup({ buttons: [
    { id: 'rec', icon: 'record', label: 'record', onPress: () => (armed ? stop() : record()) },
    { id: 'play', icon: 'play', label: 'play', onPress: () => (playing ? stop() : play()) },
  ] });
  transport.button('rec').classList.add('cc-rec');
  face();

  // ── the links as a picture, with the links and ports behind its details ──
  // A MIDI wire pulses once per event its link delivered; an audio wire is lit
  // while a voice sounds.
  const pb = createPatchbay(bay, { flowing: () => voice.held() > 0 });

  // A key press is one event leaving keys:midi-out, sent through the bay.
  const host = el('div');
  // C to A, 13 white keys: as many as the content width holds at the kit's 49 px minimum.
  kb = createKeyboard(host, {
    ...keyRange(21), base: 48,
    onDown: (note, how) => { if (how === 'midi') return; bay.send(`${S}:keys:midi-out`, { cls: 'note', ch: 1, d1: note, d2: 100 }); },
    onUp: (note, how) => { if (how === 'midi') return; bay.send(`${S}:keys:midi-out`, { cls: 'note', ch: 1, d1: note, d2: 0 }); },
  });

  patch();
  drawNotes();
  // Blocks in the shell's stack; the heading and what it names are one block.
  d.stack.add(host);
  d.stack.titled('RECORDING', transport.el, notesT.el);
  d.stack.add(pb.el);
  d.ready();
</script>
