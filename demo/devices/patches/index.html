<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>Patches on Pi screen</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/concept.css">
<style>
  /* One card a patch: its name, the screen as the Pi draws it at 2x, and a footer like the video panel's with the send button. */
  /* --pt-k is the screens' scale, 1, 2 or 3; a card is at least as wide as its screen and its black border. */
  .pt-grid { --pt-k: 2; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(calc(128px * var(--pt-k) + 44px), 100%), 1fr)); gap: 16px; }
  .pt-tools { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
  .pt-scale { font-size: 12px; color: var(--dim); }
  .pt-card { display: flex; flex-direction: column; background: var(--card); border: var(--edge, 1px solid var(--line));
    border-radius: var(--r, 4px); overflow: hidden; min-width: 0; }
  .pt-head { display: flex; flex-direction: column; gap: 6px; padding: 12px; }
  .pt-name { margin: 0; font: 600 14px/1.3 var(--mono); }
  .pt-say { margin: 0; font: 400 13px/1.45 var(--sans); color: var(--dim); text-wrap: balance; }
  /* The well runs edge to edge; the screen sits in it with the same air above and below it as its own black border. */
  .pt-screen { display: flex; justify-content: center; overflow-x: auto; margin-top: auto; padding: 16px 0; background: #07090d; }
  .pt-frame { padding: 8px; line-height: 0; background: #000; }
  .pt-frame canvas { display: block; width: calc(128px * var(--pt-k)); height: calc(64px * var(--pt-k)); image-rendering: pixelated; }
  .pt-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px;
    border-top: 1px solid var(--line); }
  .pt-cut { font-size: 12px; color: var(--dim2); }
  .pt-sec { display: flex; flex-direction: column; gap: 12px; }
</style>
<script type="module">
  // Small Pi-centric patches drawn as the Pi's 128x64 screen shows them (bay-oled.mjs, two facing
  // columns, the Pi's own boxes filled), each with a button that puts it on the real screen to check.
  // The Pi is reached on the first send, never on load.
  // why: lessons/page-devices.md#patches
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createBoard } from '/shell/board.mjs';
  import { BOARD_SITE } from '/shell/graph-registry.mjs';
  import { paintFrame, loadPanelUi } from '/shell/panel-screen.mjs';
  import { layoutBayOled } from '/shell/bay-oled.mjs';

  const d = mount({ name: 'Patches on Pi screen', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('devices/patches');

  const q = new URLSearchParams(location.search);
  const ROOM = q.get('room') || 'studio-1';
  const MAY_SEND = !SELFCHECK || q.get('board') === '1';
  const P = BOARD_SITE;

  // [name, what it is for, links as [from node, to node]]; every node a box. The Evolution keyboard
  // plugs into the Pi, so it is a Pi node, drawn filled, by its model name.
  const EVO = `${P}:mk-425c`;
  const USES = [
    ['Evolution to the Circuit', 'Play the Circuit from the keyboard on the Pi.', [[EVO, `${P}:circuit`]]],
    ['A split', 'Low keys play the Circuit, high keys play Plaits on the Pi.', [[EVO, `${P}:circuit`], [EVO, `${P}:plaits`]]],
    ['A layer', 'Every key plays the Circuit and the sampler\'s piano together.', [[EVO, `${P}:circuit`], [EVO, `${P}:sampler`]]],
    ['Evolution to Plaits', 'The keys play Plaits on the Pi and the knobs turn its sound.', [[EVO, `${P}:plaits`], [`${P}:plaits`, `${P}:ftpro`]]],
    ['Evolution to Collide', 'Play the SuperCollider synth on the Pi out of the Fast Track Pro.', [[EVO, `${P}:collide`], [`${P}:collide`, `${P}:ftpro`]]],
    ['The Circuit plays the drums', 'The Circuit\'s MIDI plays the drum machine on the Pi, out of the Fast Track Pro.', [[`${P}:circuit`, `${P}:drums`], [`${P}:drums`, `${P}:ftpro`]]],
    ['Circuit drums, Evolution synth', 'The Circuit plays the Pi\'s drums and the Evolution plays its synth, both out of the Fast Track.', [[`${P}:circuit`, `${P}:drums`], [EVO, `${P}:synth`], [`${P}:drums`, `${P}:ftpro`], [`${P}:synth`, `${P}:ftpro`]]],
    ['Camera on the screen', 'The Pi\'s camera drawn in one bit on its own small screen.', [[`${P}:camera`, `${P}:dither`], [`${P}:dither`, `${P}:screen`]]],
  ];
  const asPatch = ([name, say, pairs]) => {
    const nodes = [...new Set(pairs.flat())].map((id) => ({ id }));
    return { name, say, patch: { nodes, links: pairs.map(([a, b]) => ({ from: `${a}:out`, to: `${b}:in` })) } };
  };
  const SECTIONS = [['use cases', USES.map(asPatch)]];

  // ── the bay: this list sends a patch along one link to the Pi's screen ──
  const LIST_OUT = 'web:list:value-out', PI_IN = `${P}:screen:value-in`;
  const bay = createBay();
  bay.addNode({ id: 'web:list', kind: 'store', label: 'patch list', place: 'browser' });
  bay.addNode({ id: `${P}:screen`, kind: 'device', label: 'OLED 128x64', place: ROOM });
  let board = null, connected = false, sent = 0, landed = 0;
  const flash = new Map();
  bay.addPort({ id: LIST_OUT, dir: 'out', medium: 'value', emits: ['patch'], label: 'list:value-out' });
  bay.addPort({ id: PI_IN, dir: 'in', medium: 'value', accepts: ['patch'], label: 'screen:value-in',
    deliver: async (ev) => {
      if (!MAY_SEND) return;
      if (!board) connect();
      await opened;
      const r = await board.ask({ type: 'screen.patch', patch: ev.patch }, 'screen.patched', 3000);
      if (r?.ok) { landed++; d.log(`on the Pi's screen: ${ev.name}`, 'ok'); } else d.log(`the Pi did not draw it: ${r?.why || 'no answer in 3 s'}`, 'warn');
    } });
  const r = bay.link(LIST_OUT, PI_IN);
  if (!r.ok) d.log(`${LIST_OUT} -> ${PI_IN} refused: ${r.why}`, 'warn');

  let opened = null;
  function connect() {
    let ready;
    opened = new Promise((res) => { ready = res; });
    board = createBoard({ room: ROOM, of: 'Raspberry Pi', showName: false, log: (line, kind) => d.log(line, kind),
      onOpen: () => { connected = true; ready(); } });
    d.log(`reaching ${ROOM}`);
  }

  // ── the cards ──
  const ui = await loadPanelUi(await (await fetch('/resources/pico/oled-ui.wasm')).arrayBuffer());
  const blocks = [], cuts = [], screens = [];
  for (const [title, list] of SECTIONS) {
  const grid = el('div', 'pt-grid');
  for (const x of list) {
    const card = el('div', 'pt-card');
    const cv = Object.assign(document.createElement('canvas'), { width: 128, height: 64 });
    paintFrame(cv, ui.frame({ mode: 'patch', patch: x.patch }));
    screens.push([cv, x.patch]);
    const L = layoutBayOled(x.patch);
    cuts.push(L.cut.length);
    const frame = el('div', 'pt-frame'); frame.append(cv);
    const screen = el('div', 'pt-screen'); screen.append(frame);
    const send = createButtonGroup({ buttons: [{ id: 'send', icon: 'send', label: `send ${x.name} to the Pi's screen`, onPress: () => {
      sent++;
      flash.set([...bay.links()][0]?.id, performance.now() + 400);
      bay.send(LIST_OUT, { of: 'patch', cls: 'patch', name: x.name, patch: x.patch });
    } }] });
    const foot = el('div', 'pt-foot');
    foot.append(el('span', 'pt-cut', L.cut.length ? `cut: ${L.cut.map((c) => c.split(' as ')[1] || c.split(':')[1]).join(', ')}` : ''), send.el);
    const head = el('div', 'pt-head');
    head.append(el('h3', 'pt-name', x.name), ...(x.say ? [el('p', 'pt-say', x.say)] : []));
    card.append(head, screen, foot);
    grid.append(card);
  }
  const block = el('section', 'pt-sec');
  block.append(el('h3', 'pos-sec-h', title), grid);
  blocks.push(block);
  }

  // The wires run: beads move out to in, about 15 frames a second, as the Pi draws a patch it was sent.
  let last = 0;
  (function run(now) {
    if (now - last > 66) { last = now; for (const [cv, patch] of screens) paintFrame(cv, ui.frame({ mode: 'patch', patch, t: now / 1000 })); }
    requestAnimationFrame(run);
  })(0);

  // ── scale: every screen at 1x, 2x or 3x, as the simulated screen's zoom on the other device pages ──
  const ZOOMS = [1, 2, 3];
  let zi = 1;
  const scaleSay = el('span', 'pt-scale', '');
  const zoomBtns = createButtonGroup({ buttons: [
    { id: 'out', icon: 'zoom-out', label: 'smaller screens', onPress: () => setZoom(zi - 1) },
    { id: 'in', icon: 'zoom-in', label: 'larger screens', onPress: () => setZoom(zi + 1) },
  ] });
  function setZoom(i) {
    zi = Math.max(0, Math.min(ZOOMS.length - 1, i));
    for (const b of blocks) b.querySelector('.pt-grid')?.style.setProperty('--pt-k', String(ZOOMS[zi]));
    scaleSay.textContent = `128×64 at ${ZOOMS[zi]}x`;
    zoomBtns.enable('out', zi > 0, 'smallest');
    zoomBtns.enable('in', zi < ZOOMS.length - 1, 'largest');
  }
  const tools = el('div', 'pt-tools');
  tools.append(scaleSay, zoomBtns.el);
  setZoom(zi);

  const pb = createPatchbay(bay, { room: ROOM, flowing: (l) => (flash.get(l.id) || 0) > performance.now() });
  setInterval(() => pb.refresh?.(), 200);
  d.stack.add(tools, ...blocks, pb.el);
  window.__demo.bay = bay;
  window.__demo.probe = () => ({ connected, sent, landed, cuts });

  if (SELFCHECK) {
    const cards = document.querySelectorAll('.pt-card').length, all = USES.length;
    d.assert('every patch drawn as a card', cards === all, `${cards} of ${all} cards`);
    d.assert('no name is cut on these patches', cuts.every((c) => c === 0), cuts.join(' '));
    d.assert('a visit reaches nothing until a send', !board);
  }
  d.ready();
</script>
