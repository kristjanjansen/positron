<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .pt-text { display: flex; flex-direction: column; gap: 10px; }
  .pt-say { margin: 0; color: var(--dim); font-size: 13.5px; max-width: 62ch; }
  /* The scene picked and the button that marks it are one row. */
  .pt-mark { display: flex; flex-wrap: wrap; align-items: end; gap: var(--ctl-gap, 8px); }
</style>

<script type="module">
  import { mount, guard } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createTabPage } from '/shell/tab-page.mjs';
  import * as score from './score.mjs';
  import * as wall from './wall.mjs';

  /*
   * 🔴 THE SCORE AND ITS WALL AS ONE PAGE, asked 2026-10-05: *"unify partitur
   * and wall to tabbed page"*. `/wall/` was its own unlisted page for a day and
   * is gone with no redirect, the way the 2026-10-04 regrouping retired pages.
   *
   *   SCORE  Moholy-Nagy's 1924 plate as a timeline, its three lanes as sources
   *   WALL   any screen as the light lane's destination
   *
   * A wall is usually ANOTHER browser (a projector, a phone), so the two tabs
   * meet through the room, never through this page's memory: the check pass
   * proves it by joining both to the run's own room and sending a stripe
   * across. `demo/shell/tab-page.mjs` does the rest. SCORE owns the page's one
   * published transport bar.
   */
  const d = mount({
    name: 'partitur',
    // No `what` under the title: each tab says what it is in the box under the
    // tab row (`tab-page.mjs` rule 6), asked 2026-10-05 as *"rm top desriptions"*.
    readout: null,
    showLog: false,
    controls: [],
  });
  guard(d);

  const page = createTabPage(d, {
    at: 'score',
    tabs: [
      { id: 'score', label: 'SCORE', mod: score },
      { id: 'wall', label: 'WALL', mod: wall },
    ],
  });

  // Before `ready` and never after it: the harness drills the published bar
  // the moment `ready` is true, and a tab switch under it would race it.
  if (SELFCHECK) {
    const t0 = performance.now();
    await page.check();
    d.log(`the check pass took ${((performance.now() - t0) / 1000).toFixed(1)} s`);
  }
  d.ready();
</script>
</html>
