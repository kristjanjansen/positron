<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON · pack</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* 🔴 HALF THE HEIGHT, ASKED FOR AS *"patched table 1/2 less high"*. The
     component's own default is 420 px and it is a custom property for exactly
     this, so a page sets the number rather than reaching into the component.
     MEASURED before the change: 453 px showing 13 rows of 64.
     ⚠️ AND IT IS A WHOLE NUMBER OF ROWS, WHICH THE FIRST TRY WAS NOT. At a
     round 210 px the box held 6.48 rows and the seventh was sliced through the
     middle of its letters, which photographs as a rendering fault rather than
     as a scroller. MEASURED: a row is 32.39 px, so six of them is 194.34 and
     the cut lands on a border. The scrollbar and the rows under the sticky
     heading are what say there is more. */
  .pk-tbl { --tbl-h: 194px; }
  /* ⚠️ IT MOVES ON A PRESS AND NEVER ON A CLOCK, which is what makes a line of
     prose allowed here at all. `positron-ui`'s rule is that nothing redrawing
     every frame may change how much room it takes; text that changes when
     somebody did something is fine, and this one changes when a session row is
     opened. */
  .pk-line { font: 400 12px/1.5 var(--mono); color: var(--dim); }
  /* ⚠️ EVERY GLUED PART PAINTS ITS OWN GROUND. `.pos-glue` is `gap: 1px` over a
     `--line` ground, so a child with no background lets that colour through its
     whole area and the 1 px seam stops being a seam. MEASURED on `/wish/` the
     same day; neither of the kit's existing glued pairs says it out loud. */
  /* ⚠️ THE PICTURE'S HOST PAINTS A GROUND TOO, AND IT WENT RED WITHOUT ONE.
     The component styles its own `.pos-wave` and this is the wrapper the page
     puts it in, so it had no background and the glue's line colour came
     straight through its whole area. Third part, same trap, measured the same
     day on `/wish/`. */
  .pk-wave { background: var(--card); padding: 10px 12px; }
  .pk-player { background: var(--card); padding: 10px 12px;
               display: flex; flex-direction: column; gap: 8px; }
  .pk-prow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  /* 🔴 A FIXED WIDTH ON THE TWO GLYPH BUTTONS, so the row does not resize when a
     face changes. Nothing that can redraw may change how much room it takes. */
  .pk-pbtn { min-width: 34px; height: 30px; }
  .pk-loop { min-width: 52px; }
  .pk-loop[aria-pressed="true"] { border-color: var(--hi); color: var(--hi); }
  /* ⚠️ THE OPEN SAMPLE'S LINE IS A FIXED BOX. It changes on a press rather than
     on a clock, so prose is allowed, but a wrapping line would move the whole
     tab under it and `min-height` is one line's worth either way. */
  .pk-player-line { min-height: 1.5em; }
</style>
<script type="module">
  import { mount, el, createReport } from '/shell/shell.mjs';
  import { createTable } from '/shell/table.mjs';
  import { createTabs } from '/shell/tabs.mjs';
  import { createDiagram } from '/shell/diagram.mjs';
  import { createDrop } from '/shell/drop.mjs';
  import { createStack } from '/shell/stack.mjs';
  import { createGlue } from '/shell/glue.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createWaveView } from '/shell/wave-view.mjs';
  import { readZip, entry } from '/shell/unzip.mjs';
  import { survey, patchesIn } from '/shell/circuit-syx.mjs';
  import {
    readSession, summarise as summariseSession, patchPayloads,
    notesPerRegion, notesIn, VELOCITY_AT, VELOCITY_PER_STEP,
  } from '/shell/circuit-session.mjs';
  import {
    readWave, toMono, summarise as summariseWave, summariseAll,
  } from '/shell/circuit-sample.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import {
    readPatch, readPatchData, summarise, sessionStats, patchFields, modSlots,
    categoryName, named, ADDRESSES,
    PATCH_BYTES, PATCH_DATA, DATA_AT, SYSEX_HEAD, COMMANDS, MOD_DESTINATIONS,
  } from '/shell/circuit-patch.mjs';

  /**
   * 🔴 THIS PAGE SENDS NOTHING. NOT ONE BYTE, AND IT IS ASSERTED OVER A COUNTER
   * RATHER THAN OVER A READING OF THE SOURCE. There is no Web MIDI here, no
   * output and no encoder: `circuit-patch.mjs` exports nothing that makes a
   * message and its own test asserts that absence. The reason is one byte.
   * `Replace Current Patch` and `Replace Patch` differ at offset 6 of a 350 byte
   * message, the second overwrites a patch in FLASH on an instrument with no
   * factory reset, and `New Pack.circuitpack` is the backup of that flash.
   * ⚠️ A grep for `requestMIDIAccess` finds it absent on every day it is absent
   * and says nothing about the day somebody adds it behind a helper. This wraps
   * the method and counts.
   */
  let midiAsked = 0;
  if (navigator.requestMIDIAccess) {
    const real = navigator.requestMIDIAccess.bind(navigator);
    navigator.requestMIDIAccess = (...a) => { midiAsked++; return real(...a); };
  }
  let fetched = 0;
  const realFetch = window.fetch.bind(window);
  window.fetch = (...a) => { fetched++; return realFetch(...a); };

  // 🔴 THE PACK IN THIS REPOSITORY IS NOT PUBLISHED AND MUST NOT BE.
  // `workers/view/build.mjs` copies an explicit allowlist and this file is not
  // on it, deliberately: it holds 32 of somebody's sessions. Whether it is here
  // is decided from the ORIGIN rather than discovered by fetching, because the
  // first build discovered it with a 404 and took the deploy run red on
  // `no console errors`, and a red that is expected is a red everybody skips.
  const PACK = '/tmp/personal/New%20Pack.circuitpack';
  const PACK_HERE = location.protocol === 'file:'
    || /^(localhost|127\.|0\.0\.0\.0|\[::1\]|192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/
      .test(location.hostname);

  const d = mount({
    name: 'pack',
    // ⚠️ THE PAGE'S SENTENCE AND THE INDEX'S ARE ONE STRING, because a page with
    // a diagram carries the index's own line verbatim.
    what: 'open a Circuit pack and look inside its patches, sessions and samples',
    /**
     * 🔴 NO READOUT, AND `null` RATHER THAN AN OMITTED FIELD. Instructed
     * 2026-09-21: *"rm patches 64 / sessions 32 / different 32 of 32 / filled
     * 84.6%"*, which was all four cells. `mount()` checks for the DECLARATION so
     * both harnesses read this as deliberate rather than as somebody forgetting,
     * and the shell hides the empty box as well as its contents, because a page
     * that opts out of a surface and keeps its box paints a 2 px band nobody
     * wrote.
     * ⚠️ AND WHAT IT SAID IS REHOMED, WHICH IS THE HALF THAT GETS FORGOTTEN.
     * `patches` and `sessions` lead the tab titles. `different` and `filled`
     * are in the `nearest` and `filled` columns of the sessions table and in
     * the readout under it, which is where they were always checkable.
     */
    readout: null,
    /**
     * 🔴 NO CONTROLS EITHER, AND `open the pack here` WENT ON 2026-09-21 BECAUSE
     * IT WAS ASKED FOR: *"rm 'open pack here'"*. It read the repository's own
     * `New Pack.circuitpack`, which is published nowhere, so the control did
     * something on this machine and answered a sentence everywhere else. The
     * page has ONE way in now and it is the same one for everybody.
     * ⚠️ A BACKGROUND AGENT DELETED THIS CONTROL ON ITS OWN AUTHORITY EARLIER
     * THE SAME DAY AND WAS REVERTED FOR IT. It is gone now because the owner
     * said so, not because that agent turned out to be right, and `BACKLOG.md`
     * records the difference.
     * ⚠️ AND `PACK` STAYS, FOR THE HARNESS ONLY. Every reading check on this
     * page needs a real pack, and the one on this machine is the only one that
     * is always there. It is read inside `SELFCHECK` and nowhere else, so a
     * visitor still opens nothing.
     */
  });

  const stack = createStack();
  d.el.append(stack.el);

  // ── the way in ───────────────────────────────────────────────────────────
  //
  // 🔴 IT IS AN AREA AND NOT ONLY A BUTTON, AND THAT WAS THE REPORTED DEFECT.
  // The first build put a button here and nothing else, because the component's
  // cover only exists while a drag is in flight, so the thing inviting the
  // gesture appeared after the gesture.
  // ⚠️ AND IT TAKES `.zip`, WHICH IS THE SHAPE A REAL DOWNLOAD ARRIVES IN.
  // MEASURED on the soundbank in `purchased/`: one zip holding 2 `.circuitpack`,
  // 1 `.circuittrackspack`, 128 `.syx`, an `.xlsx`, two `.txt` and 10 `.url`.
  const drop = createDrop({
    accept: ['.circuitpack', '.circuittrackspack', '.zip', '.syx', '.circuitsession'],
    // ⚠️ THE WORDS WERE ASKED FOR ONE AT A TIME, 2026-09-21: a title reading
    // *"upload file"*, a control reading *"[open file] or drag a file here"*,
    // and the list of extensions *"under a button"*. `drop.mjs` gained `title`
    // and `beside` for it and moved its hint below the button, so every caller
    // gets the same order rather than this page arranging its own.
    // 🔴 THE BUTTON STILL SAYS `open`, WHICH IS THE COMPONENT'S OWN RULE AND
    // SURVIVED A REVERT. Nothing leaves the machine, and a control called
    // *upload* invites somebody to build the thing `.gitignore` exists to
    // prevent. The title is the reader's word for the block; the button is the
    // promise about what pressing it does.
    title: 'UPLOAD FILE',
    label: 'Open file',
    beside: 'or drag a file here',
    // ⚠️ NO RESTING LINE, ASKED FOR AS *"rm nothing has been opened"*. The
    // footer comes into existence when it has something to say and goes away
    // again, which is `drop.mjs`'s own answer to an empty box painting a line.
    empty: '',
    hint: 'drop a pack or a session anywhere on this page',
    says: (m, kind) => d.log(m, kind),
    onOpen: (files) => openFiles(files),
  });
  stack.add(drop.el);
  /**
   * 🔴 PUBLISHED ON `__demo`, BECAUSE A DRAG CANNOT BE SYNTHESISED AND THE
   * BUTTON OPENS AN OPERATING SYSTEM DIALOG. Those are the only two ways in for
   * a person, and neither is drivable, so without this the one path that matters
   * on this page is reachable by nothing outside it. `drop.open(files)` is the
   * same code a real drop runs.
   * ⚠️ AND IT GOES ON `window.__demo`, NOT ON `mount()`'s RETURN VALUE. They are
   * different objects: `mount` publishes its internal `api` and hands back a
   * wrapper. Setting it on the wrapper put it somewhere no harness looks, which
   * is the same trap `transport-bar.mjs` records about a page re-publishing
   * `__demo.transport`.
   */
  window.__demo.drop = drop;

  /**
   * 🔴 SIX PATCHES THE PAGE CAN OPEN WITH NO FILE AT ALL, ASKED FOR AS *"can we
   * get some sample patches in to choose from?"* and then *"at least one"*.
   * The pack in this repository is not published and never will be, so until
   * today a visitor met an upload box and an empty page, which got worse the
   * moment the tabs learned to stay away until something lands.
   * 🔴 THEY ARE THE OWNER'S OWN PATCHES AND PUBLISHING THEM WAS ASKED FOR IN
   * WORDS RATHER THAN ASSUMED. A patch is not a pack: `New Pack.circuitpack`
   * holds 32 of somebody's SESSIONS and stays unpublished, and these are six
   * 350 byte synth patches with no session data in them.
   * ✅ EVERY ONE CARRIES `00` AT OFFSET 6, WHICH IS `Replace Current Patch` AND
   * LANDS IN RAM. The extractor refused to write a file that was not 350 bytes,
   * that had any other command byte, or that `readPatch` called `writesFlash`.
   * ⚠️ AND NOTHING IS FETCHED UNTIL ONE IS PRESSED. `/reel/` asked a
   * broadcaster for a newsreel on every visit for a first frame nobody had
   * asked to see, and this page asserts `fetched === 0` for a visit.
   * ⚠️ IT IS NOT IN `.pos-controls`, because this page has no control row and
   * asserts that it has none. Both harnesses press that row by position, so the
   * checks here drive these buttons by name instead.
   */
  const READY = [
    ['aciiid', 'Aciiid'], ['flamed', 'Flamed'], ['aggie', 'Aggie'],
    ['frosted-glass', 'Frosted Glass'], ['smooth-pad', 'Smooth Pad'], ['twins', 'Twins'],
  ];
  const ready = createButtonGroup({
    // ⚠️ NO LABEL, ASKED FOR AS *"rm or open one of these from pack"*. The row
    // sits directly under a block titled UPLOAD FILE whose own hint names every
    // extension it takes, so a second sentence introducing six buttons is the
    // caption the button faces already are.
    buttons: READY.map(([id, label]) => ({ id, label })),
    onPress: (id) => openReady(id),
  });
  stack.add(ready.el);

  async function openReady(id) {
    const name = `${READY.find(([k]) => k === id)[1]}.syx`;
    try {
      const r = await fetch(`/resources/patches/${id}.syx`);
      if (!r.ok) throw new Error(`the server answered ${r.status}`);
      await openSyx(name, new Uint8Array(await r.arrayBuffer()));
    } catch (e) {
      drop.say(`${name} did not open (${e.message})`, 'bad');
    }
  }

  // ── the three lists ──────────────────────────────────────────────────────
  //
  // 🔴 TABS, AND THE COUNTS ARE IN THEIR TITLES. Asked as *"patches and sessions
  // are in separte tabs"* and *"add num of patches / sessions to tab title"*.
  // Typed uppercase though the stylesheet would do it, so the source reads like
  // the page, which is the same rule `/kit/` states about its own headings.
  // ⚠️ A TAB IS `#links`, NEVER A SUBPAGE: a subpage is a navigation, and the
  // sound stops, the service worker hands over and an installed web app flashes
  // white. `tabs.mjs` owns that and this page does not have to think about it.
  const TABS = [
    { id: 'patches', label: 'PATCHES', one: 'PATCH' },
    { id: 'sessions', label: 'SESSIONS', one: 'SESSION' },
    { id: 'samples', label: 'SAMPLES', one: 'SAMPLE' },
  ];
  const tabs = createTabs({ tabs: TABS });
  /**
   * 🔴 NOTHING BUT THE WAY IN UNTIL A FILE LANDS, REPORTED BY SCREENSHOT
   * 2026-09-21 AS *"no files, no tabs no content"*. Three tab names, three
   * column headings and a ten cell readout, all of them naming things that are
   * not there, is a page describing a file nobody has opened.
   * ⚠️ IT IS ONE ELEMENT RATHER THAN SIX. Hiding each table, each heading and
   * the readout separately is six things to keep in step and one of them will
   * be forgotten; the tabs component holds every one of them.
   * ⚠️ AND `hidden` WORKS HERE BECAUSE `.pos-tabs` SETS NO `display`. Three
   * other components on this page needed an explicit `[hidden] { display:
   * none }` to make the attribute mean anything, and the table heading needed
   * one TODAY. Checked rather than assumed, and the check reads the computed
   * style rather than the property.
   */
  tabs.el.hidden = true;
  stack.add(tabs.el);
  const panel = (id) => tabs.panel(id);

  /**
   * ⚠️ THE COUNT IS APPENDED TO THE LABEL RATHER THAN REPLACING IT, and a tab
   * with nothing in it keeps its bare word. A `0` next to a name reads as a very
   * confident measurement of nothing, which is the rule the readout already
   * states about a cell pre-set to zero.
   * 🔴 AND THE COUNT LEADS, ASKED FOR 2026-09-21 AS *"put counts on front of tab
   * titles"*. It read `PATCHES 64` and it reads `64 PATCHES` now. `BACKLOG.md`
   * had this open as the one detail a reverted agent changed that nobody had
   * actually decided, because the original ask said to add a count and never
   * said which end. This is the answer to that.
   */
  function countTabs(n) {
    TABS.forEach((t, i) => {
      const c = n[t.id];
      // ⚠️ ONE OF A THING LOSES THE `s`, ASKED FOR AS *"1 sessions <- lose s
      // when single"* and then *"same for patches / samples"*. `1 SESSIONS` is
      // a count arguing with its own noun.
      tabs.buttons[i].textContent = c ? `${c} ${c === 1 ? t.one : t.label}` : t.label;
      /**
       * 🔴 AND A TAB WITH NOTHING BEHIND IT IS SWITCHED OFF, asked for against a
       * screenshot of an empty SAMPLES tab holding a player and the words
       * `press a sample to open it here` with no samples in it. A tab is a
       * promise that there is something under it. It is the same rule as a
       * column heading over no rows and an empty box painting a line.
       * ⚠️ NOT BEFORE A FILE IS OPEN, THOUGH: with nothing open the whole tab
       * strip is away, and three greyed words would be a worse answer than no
       * words. This only runs once something has landed.
       */
      tabs.enable(t.id, c > 0, `this file carries no ${t.label.toLowerCase()}`);
    });
  }

  /**
   * 🔴 FIVE COLUMNS AND NOT EIGHT, AND THE SIXTH WAS CUT AFTER MEASURING.
   * MEASURED at 390 px with six: the row came out 598 px, so a phone had 240 px
   * of sideways drag. `kind` went rather than another for TWO reasons, and one
   * of them has since expired. The one that stands: this page is for what a
   * patch is MADE of, and a category is a label somebody typed rather than a
   * part of the sound. The one that is gone: it was the weakest column on the
   * evidence, because Novation published no label table for that byte, seven of
   * its fifteen values had been recovered by correlation, and **16 of 64 rows
   * here would have shown a bare number**. All fifteen are named now, read off
   * Novation's own editor, and this bank measures **0 of 64 unnamed**. The
   * column stays out on the first reason and on the 240 px above, and the
   * category is on every row's hover and in the picture's caption.
   * ⚠️ EVERY HEADING IS ONE SHORT WORD AND NEVER WRAPS. A wrapping heading is a
   * table reporting that its columns do not fit, in the one place a reader
   * cannot act on it.
   */
  const patchTable = createTable({
    columns: [
      { key: 'name', label: 'name', grow: true, hi: true, clip: true },
      { key: 'wave', label: 'wave', width: 96, clip: true },
      { key: 'filter', label: 'filter', width: 108, clip: true },
      { key: 'lfo', label: 'lfo', width: 48 },
      { key: 'voice', label: 'voice', width: 56 },
    ],
    cap: 200, empty: '', note: 'hover',
    onPick: (r) => showPatch(r.i),
  });
  patchTable.el.classList.add('pk-tbl');
  panel('patches').append(patchTable.el);

  /**
   * 🔴 `nearest` IS THE COLUMN THAT ANSWERS THE QUESTION THE OTHERS CANNOT, and
   * it exists because entropy was measured failing at it today. A stock
   * `Initial Session` is not blank: it has ordinary entropy and an ordinary
   * non-zero share, so every number this page had said it was somebody's work.
   * MEASURED on the owner's pack: the three stock slots sit **one byte** from
   * each other, and the closest pair among the other 29 is **415 bytes** apart.
   * ⚠️ AND IT IS SHOWN AS A NUMBER RATHER THAN CLASSIFIED, so there is no
   * threshold in this page to argue with. A reader seeing `1, 1, 1` against
   * `262` and up does not need to be told which ones are copies.
   */
  const sessionTable = createTable({
    columns: [
      { key: 'name', label: 'name', grow: true, clip: true },
      { key: 'head', label: 'head', width: 58 },
      { key: 'used', label: 'used', width: 72, align: 'right' },
      { key: 'nearest', label: 'nearest', width: 76, align: 'right' },
      { key: 'filled', label: 'filled', width: 62, align: 'right' },
    ],
    cap: 64, empty: '', note: 'hover',
    onPick: (r) => showSession(r.i),
  });
  sessionTable.el.classList.add('pk-tbl');

  /**
   * 🔴 THE LIST OPENS, ASKED FOR 2026-09-21 AS *"make session list clicable and
   * show data below what you extracted"*. The five columns in the list are what
   * a reader SCANS; these two tables are what the decoder actually got out of
   * the pressed file, and until today `circuit-session.mjs` read all of it and
   * the page showed a hover.
   * ⚠️ IT IS THE SAME ARRANGEMENT THE PATCHES TAB ALREADY HAS: a list, and one
   * detail panel under it for the pressed row. A press changes the words in a
   * panel that is already there rather than making one appear, because
   * `fill()` opens the first row the moment a pack is read, exactly as it does
   * for patches.
   * ⚖️ AND WHAT A FIELD MEANS IS STILL NOT GUESSED. `circuit-session.mjs`
   * decodes two things by name, the four byte head and the 32 byte name, and
   * both are corroborated against `index.json`. Everything else here is a
   * count, an offset or a byte total, which is what that module offers.
   */
  /**
   * 🔴 A READOUT AND NOT A TWO COLUMN TABLE, ASKED FOR 2026-09-21 AS *"convert
   * to readout"*. A `field` / `value` table is a readout with a heading over it
   * and one fact per row, which is the shape the kit already owns and does
   * better: cells side by side, `tabular-nums`, a reserved width so a changing
   * number cannot move its neighbours.
   * 🔴 TEN CELLS, BECAUSE `createReport` THROWS ON AN ODD COUNT and the facts
   * were eleven. The one that went is `name`, and it went UP rather than out:
   * it is in the line under this readout, where a 32 byte name has a whole line
   * to sit on instead of a cell with a reserved width.
   * ⚠️ AND EVERY CELL HERE CAN CHANGE. `head` is USER, DEMO or INIT, `marker`
   * is present or absent, and the eight numbers all move between sessions. A
   * cell showing a structural constant reads as a measurement and teaches a
   * reader to ignore the row.
   */
  const facts = createReport({
    readout: {
      head: '', marker: '', written: 'B', 'not erasure': 'B', payload: 'B',
      filled: '%', entropy: '', nearest: 'B', 'synth 1': '', 'synth 2': '',
    },
    // 🔴 TWO ROWS, ASKED FOR AS *"why not 5x2 cells?"* and then as
    // *"1xsomehting / 2xsomehing etc"*, against a panel that had wrapped 7 and 3
    // and cut `10,620` to `10,62…` in its own cell. The caller names the shape
    // and the ten cells make the columns, which is why the even rule earns its
    // keep twice: an even count divides by two exactly.
    rows: 2,
    size: 'sm',
    showLog: false,
  });
  const partsLine = el('div', 'pk-line', '');
  /**
   * 🔴 THE FIFTY REGIONS, WHICH ARE THE DECODER'S WHOLE MODEL OF THE FILE. A
   * header, sixteen synth slots at 1,508 bytes, thirty two drum slots at 720 and
   * a 6,004 byte tail, at the same offsets in all 32 of the owner's sessions and
   * in all 64 of the two purchased packs.
   * ⚠️ `used` AND `pad` ARE THE PAIR THAT MATTERS AND NEITHER MEANS ANYTHING
   * ALONE. A session is four fifths erased flash, so a region's size says almost
   * nothing and the bytes before the erasure starts say what is in it. That is
   * the same denominator trap this project published once and corrected.
   */
  const partsTable = createTable({
    columns: [
      { key: 'part', label: 'part', grow: true },
      { key: 'at', label: 'at', width: 76, align: 'right' },
      { key: 'used', label: 'used', width: 72, align: 'right' },
      { key: 'notes', label: 'notes', width: 64, align: 'right', hi: true },
    ],
    cap: 64, empty: '', note: 'hover',
  });
  partsTable.el.classList.add('pk-tbl');
  panel('sessions').append(sessionTable.el, facts.readoutEl, partsLine, partsTable.el);

  /**
   * 🔴 THE SAMPLES TAB, ASKED FOR AS *"why there is no samples?"*. The plan
   * deferred them on the reasoning that drawing a waveform is a different page,
   * and that reasoning is spent the moment there are tabs: a tab is where a
   * third list goes.
   * ⚠️ NO COLUMN HERE IS CONSTANT. MEASURED across the pack's 64: every one is
   * 48 kHz, 16 bit and mono, so a rate or a channel column would be the same
   * value sixty four times, which teaches a reader to ignore the row. Length and
   * size both move.
   * 🔴 AND A SAMPLE SOUNDS ON A PRESS AND NEVER OTHERWISE. Decoding 64 WAVs into
   * an `AudioContext` on a visit is the load-on-a-visit defect this project has
   * paid for three times.
   */
  const sampleTable = createTable({
    columns: [
      { key: 'name', label: 'name', grow: true, clip: true },
      { key: 'len', label: 'length', width: 76, align: 'right' },
      { key: 'peak', label: 'peak', width: 64, align: 'right' },
      { key: 'sound', label: 'sound', width: 68, align: 'right' },
    ],
    cap: 128, empty: '', note: 'hover',
    onPick: (r) => openSample(r.i, true),
  });
  sampleTable.el.classList.add('pk-tbl');
  /**
   * ⚠️ THE TOTALS, AND `refused` IS THE NUMBER THAT MATTERS MOST IN THEM.
   * `summariseAll` counts a file that would not parse rather than dropping it,
   * because a total taken over the ones that worked hides the only thing worth
   * seeing. The line is empty until something is open.
   */
  const samplesLine = el('div', 'pk-line', '');

  /**
   * 🔴 THE PLAYER IS UNDER THE TABLE AND GLUED TO IT, ASKED FOR 2026-09-21 AS
   * *"move sample player below table, add loop"*. It was asked for at the TOP
   * an hour earlier and the second instruction supersedes the first; what did
   * not change is that the two are ONE component rather than two blocks with
   * the page's rhythm between them.
   * ⚠️ EACH PART PAINTS ITS OWN GROUND, which `/wish/` measured the same day and
   * which neither of the kit's existing glued pairs says out loud: `.pos-glue`
   * is `gap: 1px` over a `--line` ground, so a child with no background of its
   * own lets that colour through its whole area and the seam stops being a seam.
   *
   * 🔴 THE LOOP IS `AudioBufferSourceNode.loop` AND NOT `looper.mjs`, AND THAT
   * IS A DECISION RATHER THAN AN OVERSIGHT. CLAUDE.md's rule is to build from
   * the kit and the kit HAS a looper, so this needs a reason. That module owns
   * a RING fed by a tap on a live graph: `keep()` opens a window, `close()`
   * makes a buffer out of what arrived, and it refuses anything under a quarter
   * of a second. A sample is already a whole buffer sitting in memory, so using
   * it would mean playing the sample into a tap and capturing it back in real
   * time to get something we are holding already, and a 0.12 s sample would be
   * refused by its own minimum.
   * ⚠️ WHAT THAT MODULE WOULD REALLY BRING IS ITS FIVE WAYS, `round back half
   * chop pingpong`, which would be worth having on a drum sample. That is a
   * component change rather than a page change and nobody has asked for it.
   */
  const playerLine = el('div', 'pk-line pk-player-line', 'press a sample to open it here');
  const playBtn = el('button', 'pk-pbtn', '\u25BA');
  playBtn.type = 'button';
  playBtn.title = 'play the open sample';
  const stopBtn = el('button', 'pk-pbtn', '\u25A0');
  stopBtn.type = 'button';
  stopBtn.title = 'stop it';
  // ⚠️ `►` AND `■`, NEVER `▶` AND `⏹`. `positron-ui`: the ones that look right
  // in an editor have an emoji presentation and render full colour at the wrong
  // size and baseline, and U+FE0E is honoured inconsistently. These two have no
  // emoji form at all.
  const loopBtn = el('button', 'pk-pbtn pk-loop', 'loop');
  loopBtn.type = 'button';
  loopBtn.setAttribute('aria-pressed', 'false');
  loopBtn.title = 'keep it running until you stop it';
  const playRow = el('div', 'pk-prow');
  playRow.append(playBtn, stopBtn, loopBtn);
  const player = el('div', 'pk-player');
  player.append(playRow, playerLine);

  /**
   * 🔴 THE WAVEFORM SITS DIRECTLY ON TOP OF THE TRANSPORT, ASKED FOR
   * 2026-09-21 as *"add waveform visualiser to pack"* and then *"its glued to
   * top of transport"*. So the component is three parts: the list, the picture
   * of the open sample, and the transport under it.
   * ⚠️ IT DRAWS AND IT DOES NOT PLAY. This page owns the `AudioContext` and
   * already builds an `AudioBuffer` out of `toMono`, so the view is handed a
   * position and never a sound. Two audio paths in one page is the shape
   * `positron-ui` records three pages paying for.
   * ⚠️ AND IT IS NOT ON SCREEN UNTIL THERE IS SOMETHING TO DRAW. The component
   * hides itself until `set()`, which is the same rule as the drop footer and
   * the empty table heading: a container with nothing in it must not paint its
   * edges.
   */
  const waveHost = el('div', 'pk-wave');
  const wave = createWaveView(waveHost, { height: 96, label: 'the open sample' });

  panel('samples').append(samplesLine, createGlue(sampleTable.el, waveHost, player));

  // ── what is open ─────────────────────────────────────────────────────────
  let patches = [], rows = [], sessions = [], samples = [];
  let picked = -1, pickedSession = -1, picked2 = -1, played = 0;
  let ac = null, lastPlayed = null, voice = null, looping = false;

  const WIDE_BYTES = 1508;
  const pct = (x) => `${(x * 100).toFixed(1)}`;
  const kb = (n) => (n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(0)} kB` : `${(n / 1048576).toFixed(1)} MB`);

  // ── the picture ──────────────────────────────────────────────────────────
  /**
   * 🔴 IT IS UNDER THE TABLE RATHER THAN LAST ON THE PAGE, WHICH IS A DOCUMENTED
   * EXCEPTION TO A STANDING RULE AND NOT AN OVERSIGHT. Instructed 2026-09-21:
   * *"patches: patched table 1/2 less high, diagram under it, reserver space
   * when no active one"*. `positron-diagram` says every diagram passes
   * `{ how: true, atEnd: true }` and sits last, because a diagram is REFERENCE
   * and putting one above the controls delays what a visitor came for.
   * ✅ **THE SMALLEST AMENDMENT THAT HONOURS THE ASK IS TO MOVE THE POSITION AND
   * NOTHING ELSE.** Same component, same standing `How it works` heading, no
   * title of its own, and `atEnd: false` so it lands where the selection is.
   * **This picture is not reference, it is the detail panel for the pressed
   * row**, and a detail panel two screens below the row it describes is not one.
   *
   * 🔴 AND IT IS DRAWN BEFORE ANYTHING IS OPENED, WHICH IS WHAT RESERVES THE
   * SPACE. Every box carries the reference's own default, built from the address
   * table rather than typed, so the picture has exactly the size it will have
   * once a patch is pressed and nothing below it moves. An empty box is shorter
   * than one with a sub, so leaving the subs blank would have reserved the wrong
   * height, which is the same shape of mistake as a `min-height` that never
   * applied.
   */
  const dgBox = {
    o1: { id: 'o1', label: 'osc 1', sub: '', tech: 'sound',
          note: 'One of thirty waveforms, and fourteen of those are wavetables rather than plain '
              + 'shapes. Its level, its tuning and its pulse width are separate bytes, so an '
              + 'oscillator can be fully configured and silent.' },
    o2: { id: 'o2', label: 'osc 2', sub: '', tech: 'sound',
          note: 'The same thirty waveforms again. Twenty six of the sixty four patches in this '
              + 'pack leave its level at zero, which is what the word silent means here.' },
    noi: { id: 'noi', label: 'noise', sub: '', tech: 'sound',
           note: 'A white noise source with one level byte at address 57. The factory bank uses '
               + 'it in five patches of sixty four and a bought bank used it in forty eight.' },
    ring: { id: 'ring', label: 'ring mod', sub: '', tech: 'sound',
            note: 'The two oscillators multiplied together, with its own level. It makes metallic '
                + 'and bell tones out of two ordinary waves and is off in most patches.' },
    mix: { id: 'mix', label: 'mixer', sub: '', tech: 'sound',
           note: 'Four levels and two more for the signal before and after the effects. What comes '
               + 'out of here is the only thing the filter ever sees.' },
    flt: { id: 'flt', label: 'filter', sub: '', tech: 'sound',
           note: 'Six types: low and high pass at 12 and 24 dB, and two band pass shapes. Its '
               + 'frequency is the parameter the mod matrix reaches more often than any other.' },
    amp: { id: 'amp', label: 'amp', sub: '', tech: 'sound',
           note: 'Envelope 1 is the amplitude envelope. Its release is the single byte that best '
               + 'separates one bank from another, at a median of 40 across these sixty four.' },
    fx: { id: 'fx', label: 'FX', sub: '', tech: 'sound',
          note: 'Distortion, chorus and a three band equaliser, each with its own level byte. A '
              + 'level of zero is the effect switched off rather than turned down.' },
    // ⚠️ THESE THREE ARE `sound` LIKE EVERYTHING ELSE, AND THE FIRST DRAFT MADE
    // THEM `graphics` TO SET THEM APART. `TECH_HUE` is one colour per technology
    // across every diagram in this project, and `graphics` means anything that
    // draws, in six other pictures. Borrowing it to mean *not audio* here would
    // teach a reader a colour that is false everywhere else. One instrument, one
    // colour; what says the LFOs are not in the signal path is that their arrows
    // go to the matrix and not to the mixer.
    lfo1: { id: 'lfo1', label: 'LFO 1', sub: '', tech: 'sound',
            note: 'Thirty eight shapes, from a sine to a random sample and hold to a sixteen step '
                + 'chromatic run. Its rate can be free or locked to the tempo.' },
    lfo2: { id: 'lfo2', label: 'LFO 2', sub: '', tech: 'sound',
            note: 'The same thirty eight shapes. Of the sixty four patches in this pack exactly '
                + 'one runs both LFOs at once, against a hundred and twelve of a bought bank.' },
    mod: { id: 'mod', label: 'mod matrix', sub: '', tech: 'sound',
           note: 'Twenty slots, each taking two sources to one of eighteen destinations with a '
               + 'depth. A depth of 64 is zero, so a slot can be addressed and reach nothing.' },
  };
  const dgSpec = {
    caption: '',
    nodes: [dgBox.o1, dgBox.o2, dgBox.noi, dgBox.ring, dgBox.lfo1, dgBox.lfo2,
            dgBox.mix, dgBox.mod, dgBox.flt, dgBox.amp, dgBox.fx],
    links: [
      { from: 'o1', to: 'mix', note: 'Its level is address 54, and a wave with a level of zero is '
          + 'a part of the patch that is configured and contributes nothing.' },
      { from: 'o2', to: 'mix', note: 'Its level is address 55. Zero there is why the table says '
          + 'silent rather than showing a wave.' },
      { from: 'noi', to: 'mix', note: 'One byte at address 57. Noise is what makes a breath or a '
          + 'snare out of a synth voice.' },
      { from: 'ring', to: 'mix', note: 'Address 56. Ring modulation needs both oscillators running '
          + 'to make anything at all, so it is silent whenever osc 2 is.' },
      { from: 'mix', to: 'flt', note: 'The mixer also carries a level before and after the effects, '
          + 'which is how a patch stays the same loudness with distortion switched on.' },
      { from: 'flt', to: 'amp', note: 'Envelope 2 is the filter envelope and envelope 1 is the '
          + 'amplifier\'s. A patch can aim either at the filter frequency through the matrix.' },
      { from: 'amp', to: 'fx', note: 'The effects sit after the amplifier, so a long release is '
          + 'heard through whatever distortion and chorus the patch has switched on.' },
      { from: 'lfo1', to: 'mod', note: 'An LFO reaches nothing by itself. It becomes audible only '
          + 'when a matrix slot names it as a source with a depth other than 64.' },
      { from: 'lfo2', to: 'mod', note: 'The same again. Forty three of these sixty four patches '
          + 'have neither LFO reaching anything at all.' },
    ],
  };
  /**
   * 🔴 THE PICTURE LIVES IN A HOST OF ITS OWN SO IT CAN BE PUT AWAY WHOLE.
   * `createDiagram` appends TWO things to whatever it is given, the standing
   * `How it works` heading and the figure, and hiding the figure alone would
   * leave a heading standing over nothing. One wrapper hides both.
   */
  const dgHost = el('div', 'pk-dg');
  dgHost.hidden = true;
  panel('patches').append(dgHost);
  const dg = createDiagram(dgHost, dgSpec, { how: true, atEnd: false });

  /**
   * The reference's own default patch, built from the address table rather than
   * typed, so the picture at rest is a real reading of real bytes and there is
   * no second copy of any default anywhere on this page.
   */
  function defaultPatch() {
    const b = new Uint8Array(PATCH_BYTES);
    SYSEX_HEAD.forEach((v, i) => { b[i] = v; });
    for (let a = 0; a < PATCH_DATA; a++) b[DATA_AT + a] = ADDRESSES[a].d;
    b[PATCH_BYTES - 1] = 0xf7;
    return readPatch(b);
  }

  function paint(p, why) {
    const s = summarise(p);
    const used = modSlots(p).filter((m) => m.used);
    const lfoWave = (n) => named(`LFO${n}_Waveform`, p.value(`LFO${n}_Waveform`));
    const reaches = (lo, hi) => used.some((m) => [lo, hi].includes(m.source1) || [lo, hi].includes(m.source2));
    dgBox.o1.sub = s.osc1;
    dgBox.o2.sub = s.osc2Silent ? 'silent' : s.osc2;
    dgBox.noi.sub = p.value('Mixer_NoiseLevel') ? `level ${p.value('Mixer_NoiseLevel')}` : 'off';
    dgBox.ring.sub = p.value('Mixer_RingModLevel12') ? `level ${p.value('Mixer_RingModLevel12')}` : 'off';
    dgBox.mix.sub = `${[p.value('Mixer_Osc1Level'), p.value('Mixer_Osc2Level'),
      p.value('Mixer_NoiseLevel'), p.value('Mixer_RingModLevel12')].filter(Boolean).length} of 4`;
    dgBox.flt.sub = s.filter;
    dgBox.amp.sub = `release ${s.release}`;
    dgBox.fx.sub = s.distortion ? 'distortion' : s.chorus ? 'chorus' : 'dry';
    dgBox.lfo1.sub = reaches(6, 7) ? lfoWave(1) : 'reaches none';
    dgBox.lfo2.sub = reaches(8, 9) ? lfoWave(2) : 'reaches none';
    dgBox.mod.sub = used.length ? `${used.length} of 20` : 'none in use';
    const where = used.length
      ? [...new Set(used.map((m) => MOD_DESTINATIONS[m.destination]))].join(', ')
      : '';
    dgSpec.caption = why
      || `${p.name}, category ${p.category}${categoryName(p.category) ? ` (${categoryName(p.category)})` : ''}. `
        + `${where ? `The matrix reaches ${where}. ` : 'Nothing in the matrix reaches anything. '}`
        + 'Nothing on this page can send it.';
    dg.render();
  }

  /**
   * 🔴 NOTHING IS PAINTED AT REST, AND `defaultPatch()` IS STILL HERE FOR THE
   * CHECK RATHER THAN FOR THE PAGE. The picture used to be drawn on load
   * carrying the reference's own default, which reserved its room; the
   * instruction on 2026-09-21 was *"do not show diargam when no file"*, so
   * there is nothing to reserve room for until something is open.
   * ⚠️ THE DEFAULT IS STILL WORTH KEEPING because it is the only patch this
   * page can build without a file, and the check uses it to prove the picture
   * really is absent rather than merely empty.
   */
  function showPatch(i) {
    const p = patches[i];
    if (!p) return;
    picked = i;
    patchTable.mark((r) => r.i === i);
    paint(p);
    const s = summarise(p);
    d.log(`${p.name}, ${s.poly}, ${s.filter}, ${modSlots(p).filter((m) => m.used).length} mod slot(s) in use`);
  }

  // ── reading ──────────────────────────────────────────────────────────────

  async function openFiles(files) {
    for (const f of files) {
      const n = f.name.toLowerCase();
      if (n.endsWith('.circuitsession')) { await openSession(f.name, f.bytes); continue; }
      if (n.endsWith('.syx')) { await openSyx(f.name, f.bytes); continue; }
      if (n.endsWith('.zip')) { await openZip(f.name, f.bytes); continue; }
      await openPack(f.name, f.bytes);
    }
  }

  /** One loose patch message, which is what all 128 in this archive are. */
  async function openSyx(name, bytes) {
    if (bytes.length !== PATCH_BYTES) {
      // ⚠️ A `.syx` LONGER THAN ONE MESSAGE IS A BANK, and a bank is 64 Replace
      // Patch messages by the reference's own definition, which is the flash
      // writing one. Scanning it is how that gets said rather than refused.
      const scan = sysexScan(bytes);
      if (scan.patches.length) {
        fill(scan.patches.map((b, i) => ({ name: `${name} #${i}`, bytes: b })), [], []);
        sayScan(name, scan, name);
        return;
      }
      drop.say(`${name} is ${bytes.length} bytes and a Circuit patch is ${PATCH_BYTES}`, 'bad');
      return;
    }
    fill([{ name, bytes }], [], []);
    sayScan(name, sysexScan(bytes), name);
  }

  /**
   * One loose `.circuitsession`, which is a thing that exists on its own.
   *
   * 🔴 ITS TWO PATCHES ARE PAYLOADS, NOT MESSAGES, which is the whole reason
   * `readPatchData` exists. A session carries them as bare 340 byte runs with no
   * command byte and no frame, so reading them through `readPatch` would mean
   * BUILDING a SysEx message round them, and building a message is the first
   * half of sending one. That function does not exist here and this path is why
   * it does not have to.
   * ⚠️ AND A SESSION IS THE ONE FILE ON THIS PAGE THAT CANNOT WRITE FLASH BY
   * ITSELF, because it is not a message at all. It still says nothing about what
   * Components would do with it.
   */
  async function openSession(name, bytes) {
    let one;
    try { one = await readOne(bytes, name.replace(/\.circuitsession$/i, '')); }
    catch (e) { drop.say(`${name} did not read as a session: ${e.message}`, 'bad'); return; }
    let held = [];
    try {
      held = patchPayloads(readSession(bytes))
        .map((x, i) => ({ name: `${one.name} synth ${i + 1}`, data: x.data }));
    } catch { /* a session this module cannot partition still weighs */ }
    lastScan = null;
    fill(held, [one], []);
    drop.say(name, 'good');
  }

  /**
   * 🔴 A REAL DOWNLOAD IS A ZIP OF PACKS, NOT A PACK, AND THE FIRST BUILD
   * REFUSED IT. MEASURED on the soundbank in `purchased/`: 2 `.circuitpack`, 1
   * `.circuittrackspack`, 128 `.syx`, an `.xlsx`, two `.txt` and 10 `.url` in one
   * archive. `unzip.mjs` already reads a zip inside a zip, which is how both of
   * those packs were measured.
   * ⚠️ A `.circuittrackspack` IS FOR THE OTHER INSTRUMENT and is named rather
   * than opened. `research/circuit-soundbank-2026-09-21.md` §5 measured that.
   */
  async function openZip(name, bytes) {
    let list;
    try { list = readZip(bytes); }
    catch (e) { drop.say(`${name} did not read as a zip: ${e.message}`, 'bad'); return; }
    const packs = list.filter((e) => e.name.endsWith('.circuitpack'));
    const others = list.filter((e) => e.name.endsWith('.circuittrackspack'));
    const loose = list.filter((e) => e.name.endsWith('.syx'));
    if (others.length) {
      d.log(`${others.length} pack(s) in it are for a Circuit Tracks, not a Circuit, and were left alone`, 'bad');
    }
    if (packs.length) {
      const pick = packs[0];
      if (packs.length > 1) {
        d.log(`${packs.length} packs in ${name}: ${packs.map((e) => e.name.split('/').pop()).join(', ')}. `
            + 'Opening the first', 'hi');
      }
      await openPack(pick.name.split('/').pop(), await pick.read(), `inside ${name}`);
      return;
    }
    if (loose.length) {
      const got = [];
      for (const e of loose) got.push({ name: e.name.split('/').pop(), bytes: await e.read() });
      fill(got, [], []);
      drop.say(name, 'good');
      return;
    }
    drop.say(`${name} holds no Circuit pack and no patches`, 'bad');
  }

  /**
   * 🔴 A FILE THAT IS NOT A ZIP IS NOT NECESSARILY HARMLESS, AND THIS PAGE USED
   * TO SAY `did not read as a pack` AND STOP. MEASURED 2026-09-21 on a file
   * called `on_the_run.circuitpack` from a public archive: it is **not a zip at
   * all**, it is a raw stream of **6,930 SysEx messages**, and 64 of those are
   * Circuit patch messages carrying **command byte `01`, `Replace Patch`, the
   * one that writes FLASH**, aimed at **every slot from 0 to 63**. The extension
   * says pack, Novation Components would refuse it, and the next thing anybody
   * reaches for is a SysEx tool, which is the one route with no safety rail.
   * **So the most dangerous shape a file can have was the one this page had
   * nothing to say about.**
   * ⚠️ READING ONE IS STILL FREE and the patches in it are shown, because
   * nothing here can send anything. What changes is that the page says out loud
   * what the file would do in a tool that can.
   */
  // ⚠️ AND THE SCANNING IS A KIT MODULE RATHER THAN A FUNCTION ON THIS PAGE.
  // It WAS a function on this page for about an hour, which made this the second
  // place in the repository that knew how to walk a sysex stream. `circuit-syx.mjs`
  // is 23 asserts with sabotages behind it, it answers `writesFlash` FIRST, and
  // it reads the session payloads too, which the page's own version could not.
  function sysexScan(b) {
    const v = survey(b);
    return {
      messages: v.messages,
      patches: patchesIn(b).map((m) => b.subarray(m.at, m.at + PATCH_BYTES)),
      flash: v.flashMessages,
      slots: new Set(v.flashLocations),
      sessions: v.sessions || [],
    };
  }

  let lastScan = null;

  /**
   * ⚠️ IT ALWAYS SAYS SOMETHING, AND THE FIRST VERSION RETURNED EARLY WHEN THERE
   * WAS NOTHING TO WARN ABOUT. That left the PREVIOUS file's warning standing on
   * screen while a harmless file was open, which is a stale alarm: the worst
   * kind, because it is the one that teaches a reader to stop believing the
   * alarms. Caught by the negative control rather than by looking.
   */
  /**
   * 🔴 THE CONFIRMATION IS THE FILE'S NAME AND NOTHING ELSE SINCE 2026-09-21.
   * It used to read *"Novation Circuit Bank Part 1.circuitpack inside
   * Synth-Patches.com - Soundbank for Novation Circuit and Tracks.zip, 64
   * patches, 32 sessions, 0 samples, read in this tab and sent nowhere"*, and
   * the instruction was *"rm it"*. Every fact in it is now somewhere a reader
   * can act on: the three counts LEAD the tab titles, and *sent nowhere* is in
   * the picture's caption under every patch and asserted over a counter.
   * ⚠️ IT STILL SAYS SOMETHING, WHICH IS THE PART THAT CANNOT GO. This line is
   * where a refusal lands, and a note left holding the PREVIOUS file's words
   * while a new one is open is a stale alarm, which is the one failure that
   * teaches a reader to stop believing the alarms. The warnings below are
   * untouched.
   */
  function sayScan(name, scan, ok) {
    lastScan = scan;
    if (!scan.flash) { if (ok) drop.say(ok, 'good'); return; }
    const slots = [...scan.slots].sort((a, b) => a - b);
    const span = slots.length > 1 ? `${slots.length} slots, ${slots[0]} to ${slots[slots.length - 1]}` : `slot ${slots[0]}`;
    drop.say(`${name} would overwrite ${span} in the flash of a Circuit if it were sent. `
      + 'Nothing here can send it', 'bad');
    d.log(`${name} carries ${scan.flash} Replace Patch message(s), which write flash on an `
        + 'instrument with no factory reset', 'bad');
  }

  async function openPack(name, bytes, from = '') {
    let list;
    try { list = readZip(bytes); }
    catch (e) {
      // ⚠️ IT SAYS BOTH THINGS: that it is not a pack, and what it IS.
      const scan = sysexScan(bytes);
      if (scan.patches.length) {
        d.log(`${name} is not a zip. It is a stream of ${scan.messages} sysex messages, `
            + `${scan.patches.length} of them Circuit patches`, 'hi');
        // 🔴 AND A STREAM CARRIES SESSIONS TOO, WHICH THE PAGE'S OWN SCANNER
        // COULD NOT SEE. They travel seven bits to the byte in 300 byte
        // carriers, and `circuit-syx.mjs` unpacks them back to 53,248 bytes
        // each, so the same three numbers that grade a pack grade one of these.
        const st = [];
        for (let k = 0; k < scan.sessions.length; k++) {
          st.push(await readOne(scan.sessions[k], `session ${k}`));
        }
        fill(scan.patches.map((b, i) => ({ name: `${name} #${i}`, bytes: b })), st, []);
        sayScan(name, scan, name);
        return;
      }
      drop.say(`${name} did not read as a pack: ${e.message}`, 'bad');
      return;
    }

    const meta = entry(list, 'index.json');
    let names = [];
    if (meta) {
      try {
        const m = JSON.parse(new TextDecoder().decode(await meta.read()));
        names = (m.sessions || []).map((s) => s.name || '');
        d.log(`${name} calls itself "${m.name || '(no name)'}", ${m.product} ${m.version}`);
      } catch { /* a pack with no readable index is still a pack */ }
    }

    const syx = list
      .filter((e) => /\.syx$/.test(e.name))
      .sort((a, b) => (+(a.name.match(/\d+/) || [0])[0]) - (+(b.name.match(/\d+/) || [0])[0]));
    const sess = list.filter((e) => e.name.endsWith('.circuitsession'));
    const wav = list.filter((e) => e.name.endsWith('.wav'));

    const got = [];
    for (const e of syx) got.push({ name: e.name.split('/').pop(), bytes: await e.read() });

    // ⚠️ THE SESSION IS DECODED NOW RATHER THAN WEIGHED. `sessionStats` treats
    // the file as opaque bytes, which is what this page had, and
    // `circuit-session.mjs` was built, tested at 68 asserts and imported by
    // nothing, which is the pattern this repository complained about in the
    // morning and then committed in the afternoon.
    const st = [];
    for (let i = 0; i < sess.length; i++) {
      const b = await sess[i].read();
      st.push(await readOne(b, names[i] || sess[i].name.split('/').pop()));
    }

    // 🔴 A SAMPLE IS READ BY `circuit-sample.mjs` AND NOT BY A FUNCTION ON THIS
    // PAGE. It had one, `wavShape`, which walked the chunks correctly and knew
    // nothing about what was IN the audio, so the table could show a length and
    // a file size and that was all it could ever show. The module answers 57
    // asserts with seven sabotages behind it, refuses thirteen kinds of file by
    // name rather than throwing, and decodes to plain floats.
    // ⚠️ AND THE RAW BYTES ARE NOT KEPT. `readWave` copies the data chunk, so
    // holding the file as well would be a second 5.1 MB of the same audio.
    const sm = [];
    for (const e of wav) {
      const b = await e.read();
      const name = e.name.split('/').pop();
      const wave = readWave(b);
      sm.push({ name, size: e.size, wave, row: summariseWave(wave, name) });
    }

    fill(got, st, sm);
    drop.say(`${name}${from ? ` ${from}` : ''}`, 'good');
  }

  /**
   * One session, weighed AND decoded. The name the file carries is preferred
   * over the one `index.json` carries, and they agree in 32 of 32 here, so the
   * fallback is for a stream that has no index at all.
   */
  async function readOne(bytes, fallbackName) {
    const stats = await sessionStats(bytes);
    let deep = null, parts = [], events = [];
    try {
      const model = readSession(bytes);
      deep = summariseSession(model);
      // ⚠️ THE `data` COPY IS DROPPED AND THE COUNTS ARE KEPT. `readSession`
      // hands back every region's leading bytes so `rebuild()` can put the file
      // back together, and thirty two sessions of those is memory this page has
      // no use for: the panel shows where a region is and how much of it is
      // written, which is four numbers.
      // 🔴 THE NOTE COUNT PER REGION, WHICH IS THE FIRST THING THIS PAGE HAS
      // EVER BEEN ABLE TO SAY ABOUT WHAT A REGION HOLDS. The owner asked *"where
      // is note data?"* against a line still reading `what they hold is not
      // known`, which was true in the morning and stopped being true at
      // 18:04.
      const per = notesPerRegion(bytes);
      let wide = 0;
      parts = model.slots.map((x) => ({
        index: x.index, kind: x.kind, at: x.at, size: x.size, used: x.used, pad: x.pad,
        notes: x.kind === 'wide' ? per[wide++] : null,
      }));
      events = notesIn(bytes);
    } catch { /* a file this module cannot partition is still weighable */ }
    return {
      ...stats,
      bytes,
      name: deep?.name || fallbackName,
      tag: deep?.tag ?? null,
      used: deep?.used ?? null,
      magicOk: deep?.magicOk ?? null,
      patchNames: deep?.patchNames || [],
      parts,
      notes: events.length,
      velocityPerStep: bytes[VELOCITY_AT] === VELOCITY_PER_STEP,
      pitches: events.length
        ? [Math.min(...events.map((e) => e.note)), Math.max(...events.map((e) => e.note))]
        : null,
    };
  }

  /**
   * One session opened out of the list. It logs, which is where a state change
   * belongs, and it never touches the network or the audio context.
   */
  function showSession(i) {
    const x = sessions[i];
    if (!x) return;
    pickedSession = i;
    sessionTable.mark((r) => r.i === i);

    const n = (v) => (v === null || v === undefined ? '' : v.toLocaleString());
    facts.set('head', x.head);
    facts.set('marker', x.magicOk === null ? '' : x.magicOk ? 'DC BB' : 'absent');
    facts.set('written', n(x.used));
    facts.set('not erasure', n(x.notErased));
    facts.set('payload', n(x.payload));
    facts.set('filled', (x.nonZero * 100).toFixed(1));
    facts.set('entropy', x.entropy.toFixed(2));
    facts.set('nearest', x.nearest === null || x.nearest === Infinity ? '' : n(x.nearest));
    facts.set('synth 1', x.patchNames[0] || '');
    facts.set('synth 2', x.patchNames[1] || '');

    /**
     * 🔴 THE REGIONS ARE NUMBERED AND NOT NAMED, CORRECTED 2026-09-21 AFTER
     * **"five synths??"**. They read `synth 1` through `synth 16` and a Circuit
     * has TWO synth parts, so the page was printing a name this project typed
     * itself as though it had been read off the file. What is measured is the
     * offset and the stride, so that is what a row says, and the line above
     * counts the two strides without claiming what either holds.
     * ⚠️ The two patches that ARE corroborated are in the readout above, out of
     * the TAIL region, which is the one place a patch really was found.
     */
    const strides = [];
    for (const r of x.parts) {
      const last = strides[strides.length - 1];
      if (last && last.size === r.size) last.n++;
      else strides.push({ size: r.size, n: 1 });
    }
    /**
     * 🔴 THIS LINE SAID `What they hold is not known` UNTIL 18:04 TODAY, AND IT
     * WAS TRUE WHEN IT WAS WRITTEN. The owner read it back at me with *"where
     * is note data?"*, which is the right question the moment the research
     * landed. What is known now is exactly one of the four strides, so the
     * sentence says which one and goes on refusing to guess about the rest.
     * ⚠️ AND IT IS SAID AS A COUNT RATHER THAN AS A NAME. Sixteen regions
     * holding note data is measured; calling them two synth parts of eight
     * patterns is still a reading, and it is still not published here.
     */
    partsLine.textContent = x.parts.length
      ? `"${x.name || '(no name)'}", ${x.parts.length} regions: `
        + strides.map((g) => `${g.n} of ${n(g.size)} bytes`).join(', ')
        + `. The ${x.parts.filter((r) => r.kind === 'wide').length} of `
        + `${n(WIDE_BYTES)} hold ${n(x.notes)} note event(s)`
        + (x.notes
          ? `, ${x.pitches[0]} to ${x.pitches[1]}, with velocity `
            + `${x.velocityPerStep ? 'per step' : 'per note'}`
          : '')
        + '. What the rest hold is not known'
      : '';

    partsTable.set(x.parts.map((r, k) => ({
      part: `region ${k + 1}`,
      at: n(r.at),
      used: n(r.used),
      // ⚠️ EMPTY AND NOT `0` ON A REGION THAT CANNOT HOLD NOTES. A zero there
      // would read as a measurement of a region that was looked at and found
      // empty, and the thirty four that are not 1,508 bytes long were never
      // looked at for notes at all.
      notes: r.notes === null ? '' : n(r.notes),
      hover: `${n(r.size)} bytes at ${n(r.at)}, ${n(r.used)} written and ${n(r.pad)} erased`
           + (r.notes === null
             ? '. Nothing is known about what this one holds'
             : `. ${n(r.notes)} note event(s) in its sixteen step records`),
    })));

    d.log(`${x.name || '(no name)'}, head ${x.head}, ${n(x.used)} B written across `
        + `${x.parts.length} regions, holding ${x.patchNames.join(' and ') || 'no readable patches'}`);
  }

  /**
   * How far each session is from its nearest neighbour in the same file, in
   * bytes. 🔴 THIS IS THE ONE MEASURE THAT SEPARATES A STOCK SESSION FROM WORK,
   * and nothing else on this page can: a template has ordinary entropy, an
   * ordinary non-zero share and a distinct fingerprint, because one byte of
   * difference is enough for all three.
   */
  function nearestEach(list) {
    const out = new Array(list.length).fill(Infinity);
    for (let i = 0; i < list.length; i++) {
      for (let j = i + 1; j < list.length; j++) {
        const a = list[i].bytes, b = list[j].bytes;
        let n = 0;
        const len = Math.max(a.length, b.length);
        for (let k = 0; k < len; k++) if (a[k] !== b[k]) n++;
        if (n < out[i]) out[i] = n;
        if (n < out[j]) out[j] = n;
      }
    }
    return out;
  }

  function fill(files, stats, wavs) {
    patches = []; rows = [];
    for (const f of files) {
      let p;
      // ⚠️ A PATCH THAT WILL NOT READ IS REPORTED BY NAME, never skipped. A
      // reader that silently dropped one leaves a pack looking smaller than it
      // is, which is a wrong answer wearing an empty one's clothes.
      // ⚠️ A SESSION'S PATCHES ARE PAYLOADS, NOT MESSAGES. `f.data` is 340
      // bytes lifted out of a session and has no command byte around it;
      // `f.bytes` is a whole 350 byte `.syx`. Reading the first as the second
      // would need a SysEx frame built round it, and building a message is the
      // first half of sending one.
      try { p = f.data ? readPatchData(f.data) : readPatch(f.bytes); }
      catch (e) { d.log(`${f.name}: ${e.message}`, 'bad'); continue; }
      if (p.writesFlash) {
        d.log(`${f.name} is a Replace Patch, which writes ${p.slotName} in flash. `
            + 'Nothing here can send it', 'bad');
      }
      const i = patches.length;
      patches.push(p);
      const s = summarise(p);
      const moved = patchFields(p).filter((x) => x.changed).length;
      rows.push({
        i,
        name: p.name || '(no name)',
        wave: s.osc1,
        filter: s.filter,
        lfo: s.lfo === 'none' ? '' : s.lfo,
        voice: s.poly,
        hover: `${p.commandName}, ${p.slotName}, category ${p.category}`
             + `${s.categoryLabel ? ` (${s.categoryLabel})` : ''}`
             + `, osc 2 ${s.osc2Silent ? 'silent' : s.osc2}`
             + `, attack ${s.attack} release ${s.release}, ${s.mods} mod slot(s)`
             + `, ${moved} of ${PATCH_DATA} parameters off their default`,
      });
    }
    patchTable.set(rows);

    sessions = stats;
    const near = stats.length > 1 ? nearestEach(stats) : stats.map(() => null);
    stats.forEach((x, i) => { x.nearest = near[i]; });
    sessionTable.set(stats.map((s, i) => ({
      i,
      name: s.name || '(no name)',
      head: s.head,
      used: s.used === null ? '' : `${s.used}`,
      nearest: s.nearest === null || s.nearest === Infinity ? '' : `${s.nearest}`,
      filled: `${pct(s.nonZero)}%`,
      hover: `${s.entropy.toFixed(2)} bits a byte, ${s.notErased} bytes not erasure`
           + `${s.patchNames.length ? `, synths ${s.patchNames.join(' and ')}` : ''}`
           + `${s.magicOk === false ? ', and it carries no Circuit session marker' : ''}`,
    })));

    samples = wavs;
    /**
     * ⚠️ A SAMPLE THAT WOULD NOT PARSE KEEPS ITS ROW AND SAYS WHY, which is the
     * same rule the patch reader already follows: a reader that silently dropped
     * one leaves a pack looking smaller than it is, and that is a wrong answer
     * wearing an empty one's clothes.
     */
    sampleTable.set(wavs.map((w, i) => {
      const r = w.row;
      if (!r.ok) {
        return { i, name: w.name, len: '', peak: '', sound: '',
                 hover: `this one did not read: ${r.why}` };
      }
      return {
        i,
        name: w.name,
        len: `${r.seconds.toFixed(2)} s`,
        peak: r.peak.toFixed(2),
        sound: `${r.sound.toFixed(0)}%`,
        hover: `${r.rate} Hz, ${r.bits} bit, ${r.channels === 1 ? 'mono' : `${r.channels} channels`}`
             + `, ${r.frames.toLocaleString()} frames in ${kb(w.size)}`
             + `, ${r.lead} frame(s) of silence at the front and ${r.trail} at the back`
             + `${r.silent ? ', and it is silent all through' : ''}. Press to hear it`,
      };
    }));

    const all = summariseAll(wavs.map((w) => w.wave));
    samplesLine.textContent = all.count
      ? `${all.parsed} of ${all.count} read`
        + (all.refused ? `, ${all.refused} refused` : '')
        + `${all.rates.length === 1 ? `, all ${all.rates[0] / 1000} kHz ${all.depths[0]} bit `
          + `${all.channels[0] === 1 ? 'mono' : `${all.channels[0]} channel`}` : ''}`
        + `, ${all.shortest.toFixed(2)} s to ${all.longest.toFixed(2)} s`
        + `, ${all.seconds.toFixed(1)} s in total`
      : '';

    countTabs({ patches: patches.length, sessions: sessions.length, samples: samples.length });
    sayCounts(stats);
    /**
     * 🔴 NO PICTURE UNTIL A FILE LANDS, ASKED FOR AS *"do not show diargam when
     * no file"*. This reverses the reservation asked for the day before, and
     * the two are genuinely in tension: a picture drawn at rest cannot move
     * later, and a picture drawn at rest is a picture of nothing.
     * 🔴 THE HOST IS UNHIDDEN BEFORE `showPatch` RATHER THAN AFTER, AND THAT
     * ORDER IS LOAD BEARING. `diagram.mjs`'s own header says a `display: none`
     * ancestor is exactly what makes `getComputedTextLength` answer 0, so a
     * render inside a hidden box lays every label out against a ruler reading
     * zero. `hidden` IS `display: none`.
     */
    dgHost.hidden = !patches.length;
    tabs.el.hidden = !(patches.length || stats.length || wavs.length);
    if (patches.length) showPatch(0);
    // ⚠️ AND THE FIRST SESSION OPENS TOO, so the panel under the list is filled
    // whenever anything is, and a press changes its words instead of adding a
    // block and moving everything under it.
    if (sessions.length) showSession(0);
    else {
      // ⚠️ EVERY CELL BACK TO EMPTY RATHER THAN TO 0. Nothing unmeasured prints
      // as a zero here: a `0` in a readout reads as a very confident
      // measurement of nothing, and `setCell` hides the unit with it.
      for (const k of facts.cells.keys()) facts.set(k, '');
      partsTable.set([]); partsLine.textContent = ''; pickedSession = -1;
    }
  }

  /**
   * 🔴 THE VERDICT BLOCK IS GONE, REMOVED 2026-09-21 AT THE OWNER'S WORD:
   * *"rm all 1 sessions differ from each other, and the emptiest is 84.7 per
   * cent filled, so this is somebody's work rather than a pack of blanks etc
   * texts"*. Every branch of it, not one sentence.
   * ✅ **THE EVIDENCE SURVIVES BECAUSE IT WAS NEVER IN THE SENTENCE.** The
   * `nearest` column carries the byte distance on every row and the readout
   * carries it again for the open one, and this page's own comment already said
   * that column is there so a reader never has to take a verdict's word for it.
   * What went is the CONCLUSION, not the measurement.
   * 🔴 **AND IT TOOK THREE ASSERTS AND TWO NEGATIVE CONTROLS WITH IT**, which
   * is a real loss and is written down rather than glossed: the blanks control,
   * the mostly copies middle ground and the `29 of real work` line all graded
   * that function. `positron-verify`'s rule is that a removed thing takes its
   * checks with it SILENTLY, so they are accounted for here.
   * ⚠️ One log line stays, and it is a count with no conclusion in it. The log
   * is where a state change belongs, and `3 sessions sit within 16 bytes of
   * another` is a measurement a reader can check against the column.
   */
  const TEMPLATE_GAP = 16;
  function sayCounts(stats) {
    if (!stats.length) return;
    const distinct = new Set(stats.map((x) => x.fingerprint)).size;
    const copies = stats.filter((x) => x.nearest !== null && x.nearest !== Infinity
      && x.nearest < TEMPLATE_GAP).length;
    d.log(`${stats.length} sessions, ${distinct} distinct`
      + (copies ? `, ${copies} within ${TEMPLATE_GAP} bytes of another` : ''));
  }

  /**
   * 🔴 ON A PRESS, AND NOTHING IS DECODED UNTIL ONE HAPPENS. Sixty four WAVs
   * through `decodeAudioData` on a visit is the load-on-a-visit defect three
   * times over.
   * ⚠️ AND SOUND NEVER GATES THE WORK. `AudioContext.resume()` waits on a
   * gesture in a real browser and does not reject, so awaiting one is a hang
   * rather than an error. It is fired and left.
   */
  /**
   * 🔴 PRESSING A ROW OPENS A SAMPLE AND PLAYS IT, AND THE TWO ARE SEPARATE
   * VERBS. `/reel/` fetched a newsreel and a day's radio on every visit for a
   * first frame nobody had asked to see, and the repair there was exactly this
   * split: `select()` moves and opens nothing, `play()` is the only half that
   * costs anything. Here nothing leaves the machine either way, but the player
   * under the table needs a sample to be OPEN without one being in the air.
   */
  function openSample(i, andPlay) {
    const w = samples[i];
    if (!w) return;
    picked2 = i;
    sampleTable.mark((r) => r.i === i);
    const r = w.row;
    playerLine.textContent = r.ok
      ? `${w.name}, ${r.seconds.toFixed(2)} s, ${r.frames.toLocaleString()} frames at `
        + `${r.rate} Hz, peak ${r.peak.toFixed(2)}`
      : `${w.name} did not read: ${r.why}`;
    playBtn.disabled = !r.ok;

    // ⚠️ THE PICTURE IS DRAWN FROM THE SAME FLOATS THE SOUND IS MADE OF, out of
    // `toMono`, so what is on screen and what comes out of the speaker cannot
    // be two readings of one file that disagree.
    const mono = r.ok ? toMono(w.wave) : { ok: false };
    if (mono.ok) wave.set(mono.samples, mono.rate, { name: w.name });
    else wave.clear();

    if (andPlay && r.ok) playSample(i);
  }

  /**
   * 🔴 THE AUDIO COMES OUT OF `circuit-sample.mjs` AND NOT OUT OF
   * `decodeAudioData`, WHICH IS THE HALF OF *"make/use sample decoder"* THAT IS
   * NOT THE TABLE. The browser's decoder is a promise, it accepts what it feels
   * like accepting, and it can say nothing about a file it refuses beyond an
   * `EncodingError`. `toMono` answers in words, and because it is SYNCHRONOUS
   * the page's own check can grade a press rather than racing a decode.
   * ⚠️ AND SOUND NEVER GATES THE WORK. `AudioContext.resume()` waits on a
   * gesture in a real browser and does not reject, so awaiting one is a hang
   * rather than an error. It is fired and left.
   */
  function playSample(i) {
    const w = samples[i];
    if (!w) return;
    const mono = toMono(w.wave);
    if (!mono.ok) { d.log(`${w.name} did not decode: ${mono.why}`, 'bad'); return; }
    try {
      stopSample();
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      ac.resume();
      const buf = ac.createBuffer(1, mono.frames, mono.rate);
      buf.copyToChannel(mono.samples, 0);
      const src = ac.createBufferSource();
      src.buffer = buf;
      src.loop = looping;
      src.connect(ac.destination);
      // ⚠️ THE HANDLE IS KEPT SO THE LOOP TOGGLE CAN REACH A SOUND THAT IS
      // ALREADY RUNNING. A toggle that only took effect on the NEXT press is a
      // control that looks live and does nothing for as long as you are
      // listening, which is this project's named hazard.
      src.onended = () => { if (voice === src) voice = null; };
      src.start();
      voice = src;
      played++;
      /**
       * 🔴 THE HEAD FOLLOWS THE CONTEXT CLOCK AND NOT A TIMER, and it stops
       * when the sound does. `AudioContext.currentTime` is the only clock that
       * agrees with what is being heard; a `setInterval` drifts against it and
       * a `requestAnimationFrame` loop that never stops is a phone's battery
       * spent drawing a still picture.
       */
      const began = ac.currentTime;
      wave.follow(() => {
        if (!voice) return null;
        const t = ac.currentTime - began;
        return looping && buf.duration > 0 ? t % buf.duration : t;
      });
      lastPlayed = { name: w.name, frames: mono.frames, rate: mono.rate, seconds: buf.duration };
      d.log(`${w.name}, ${buf.duration.toFixed(2)} s, ${mono.frames.toLocaleString()} frames at `
          + `${mono.rate} Hz${looping ? ', looping' : ''}`);
    } catch (e) {
      d.log(`no sound here (${e.message})`, 'bad');
    }
  }

  function stopSample() {
    if (!voice) return;
    try { voice.stop(); } catch { /* a voice that already ended cannot be stopped twice */ }
    voice = null;
    // ⚠️ THE HEAD GOES BACK TO THE TOP RATHER THAN STANDING WHERE THE SOUND
    // STOPPED. A line left in the middle of a picture with nothing playing
    // reads as a sound that is paused, and nothing here can resume.
    wave.rest(0);
  }

  playBtn.addEventListener('click', () => { if (picked2 >= 0) playSample(picked2); });
  stopBtn.addEventListener('click', () => stopSample());
  loopBtn.addEventListener('click', () => {
    looping = !looping;
    loopBtn.setAttribute('aria-pressed', String(looping));
    // The running voice, not only the next one. See the note above.
    if (voice) voice.loop = looping;
  });

  // ── what a visit is allowed to have done ─────────────────────────────────
  d.assert('a visit opens nothing, asks for nothing and makes no sound',
    drop.opens === 0 && patches.length === 0 && fetched === 0 && played === 0 && ac === null,
    `${drop.opens} files opened, ${patches.length} patches read, ${fetched} request(s), ${played} sample(s) played`);

  d.assert('nothing here asks for MIDI, so nothing here can write to an instrument',
    midiAsked === 0 && navigator.requestMIDIAccess !== undefined,
    `requestMIDIAccess called ${midiAsked} time(s), and the counter is still in front of it`);

  // 🔴 THE WAY IN IS ON SCREEN BEFORE ANY DRAG, which is the defect the first
  // build shipped: a component whose only visible part appeared mid-drag.
  {
    const box = drop.el.getBoundingClientRect();
    d.assert('the way in is visible at rest and says what it takes, including a zip',
      box.width > 200 && box.height > 40 && /\.zip/.test(drop.el.textContent)
      && !drop.el.dataset.over && drop.cover.isConnected === false,
      `${box.width.toFixed(0)} by ${box.height.toFixed(0)} px`);

    /**
     * 🔴 THE ORDER IS MEASURED OFF THE SCREEN AND NOT READ OFF THE SOURCE, which
     * is `positron-ui`'s rule after `/twelve/` was corrected by screenshot twelve
     * times in one evening. The ask was a title, then a button, then the
     * extensions UNDER it, and `append` order is not layout: a stylesheet can
     * reverse a column and the source still reads correctly.
     */
    /**
     * 🔴 THE FOOTER IS NOT THERE WHEN IT HAS NOTHING TO SAY, and this is the
     * assert for *"rm nothing has been opened"* plus *"should be file uplaod
     * block footer, glued"* at once. A footer with a border and no words is an
     * empty box painting a line nobody wrote.
     */
    d.assert('with nothing open there is no waveform, so no empty box paints an edge',
      wave.el.hidden === true && wave.el.getBoundingClientRect().height === 0
      && wave.facts().frames === 0,
      `the picture is ${wave.el.hidden ? 'away' : 'up'} at `
      + `${wave.el.getBoundingClientRect().height} px`);

    d.assert('the block has no footer until something has been opened',
      drop.note.hidden === true && drop.note.textContent === ''
      && drop.note.getBoundingClientRect().height === 0,
      `the footer is ${drop.note.hidden ? 'away' : 'up'} at `
      + `${drop.note.getBoundingClientRect().height} px`);

    const t = drop.el.querySelector('.pos-drop-title').getBoundingClientRect();
    const b = drop.button.getBoundingClientRect();
    const h = drop.el.querySelector('.pos-drop-hint').getBoundingClientRect();
    d.assert('the title is over the button and the list of what it takes is under it',
      t.bottom <= b.top + 1 && h.top >= b.bottom - 1
      && drop.el.querySelector('.pos-drop-title').textContent === 'UPLOAD FILE'
      && drop.button.textContent === 'Open file'
      && /or drag a file here/.test(drop.el.textContent),
      `title ends at ${t.bottom.toFixed(0)}, the button runs ${b.top.toFixed(0)} to `
      + `${b.bottom.toFixed(0)}, the list starts at ${h.top.toFixed(0)}`);

    /**
     * 🔴 ONE WAY IN, AND THIS ASSERT REPLACES THE ONE THAT WENT WITH THE BUTTON.
     * `open the pack here` was removed on 2026-09-21 because it was asked for,
     * and a control that disappears takes its checks with it silently:
     * `positron-verify` records that those asserts do not fail, they stop
     * running, and the suite stays green either way. So the removal itself is
     * graded.
     */
    const bar = document.querySelector('.pos-controls');
    d.assert('there is one way in and no control row at all, which is what the page promises',
      bar?.hidden === true && bar.querySelectorAll('button').length === 0,
      `${bar ? bar.querySelectorAll('button').length : 'no'} control(s), row ${bar?.hidden ? 'hidden' : 'shown'}`);
  }

  d.assert('the picture cut nothing and refused nothing',
    dg.cuts.length === 0, dg.cuts.map((c) => `${c.id}: ${c.shown}`).join(' · ') || 'none');
  d.assert('every line in the picture has an arrowhead on it',
    dg.ties === 0, `${dg.ties} headless tie(s)`);

  /**
   * 🔴 THE PICTURE IS NOT THERE AT ALL BEFORE A FILE IS, AND THIS REPLACES THE
   * TWO RESERVATION ASSERTS THAT USED TO SIT HERE. They measured that the
   * picture had its full height at rest and did not move when a pack opened,
   * which was the right check for the behaviour asked for on 2026-09-20 and is
   * the wrong check for the behaviour asked for on 2026-09-21.
   * ⚠️ AND IT GRADES THE HEADING TOO. Hiding a figure and leaving `How it
   * works` standing over nothing is the failure that is easy to ship here,
   * because the heading is not the diagram's own element.
   */
  {
    const box = dgHost.getBoundingClientRect();
    d.assert('with no file open there is no picture and no heading over one',
      dgHost.hidden === true && box.height === 0
      && dgHost.querySelector('.pos-how') !== null
      && dgHost.querySelector('.pos-dg') !== null,
      `the host is ${box.height} px tall holding `
      + `${dgHost.querySelectorAll('.pos-how, .pos-dg').length} parts`);
  }

  d.assert('every tab keeps its bare word until it has something to count',
    tabs.buttons.map((b) => b.textContent).join(' ') === 'PATCHES SESSIONS SAMPLES',
    tabs.buttons.map((b) => b.textContent).join(' '));

  /**
   * 🔴 THIS ASSERT PASSED EVERY RUN WHILE THE HEADINGS WERE ON SCREEN, AND A
   * SCREENSHOT IS WHAT CAUGHT IT. It read `head.hidden === true`, which is a
   * fact about an ATTRIBUTE, and `.pos-tbl-row` sets `display: grid`, which
   * beats the UA's `[hidden] { display: none }`. So `blank()` set the attribute,
   * changed nothing, and the check agreed with it.
   * ⚠️ SO IT READS THE COMPUTED STYLE NOW, WHICH IS THE ONLY THING THAT KNOWS
   * WHAT IS BEING DRAWN, and it covers all four tables rather than two.
   * `shell.css` gained `.pos-tbl-row[hidden]`, so this was a defect in every
   * empty table in the project and not only in these.
   */
  {
    const heads = [patchTable, sessionTable, partsTable, sampleTable]
      .map((t) => t.el.querySelector('.pos-tbl-head'))
      .filter(Boolean);
    const drawn = heads.filter((h) => getComputedStyle(h).display !== 'none');
    d.assert('an empty table draws no heading, because a column name over nothing labels air',
      patchTable.count() === 0 && sampleTable.count() === 0 && partsTable.count() === 0
      && heads.length === 4 && drawn.length === 0,
      `${drawn.length} of ${heads.length} headings are still being drawn over `
      + `${patchTable.count()} patch, ${sessionTable.count()} session and ${sampleTable.count()} sample rows`);

    // 🔴 AND THE WHOLE BLOCK IS AWAY, which is the request itself.
    d.assert('with no file open there are no tabs and nothing under them',
      tabs.el.hidden === true && getComputedStyle(tabs.el).display === 'none'
      && tabs.el.getBoundingClientRect().height === 0,
      `the tabs are ${getComputedStyle(tabs.el).display} at `
      + `${tabs.el.getBoundingClientRect().height} px`);
  }

  if (SELFCHECK) {
    const r = PACK_HERE ? await realFetch(PACK).catch(() => null) : null;
    if (!r || !r.ok) {
      /**
       * ⚠️ THIS BRANCH USED TO PRESS `open the pack here` AND READ WHAT IT SAID.
       * That control is gone, so what is left to grade is the only claim that
       * ever mattered on a deploy: the page asked nobody for anything and the
       * way in is the drop area, for everybody, with no branch on where it is
       * being served from.
       */
      d.log('the pack here is not published, so the reading checks did not run', 'bad');
      d.assert('where the pack is not published nothing is asked of anybody, and the way in is unchanged',
        !PACK_HERE && fetched === 0 && drop.opens === 0 && patches.length === 0
        && drop.el.classList.contains('pos-drop-area'),
        `at ${location.hostname} after ${fetched} request(s) and ${drop.opens} file(s) opened`);
    } else {
      await openPack('New Pack.circuitpack', new Uint8Array(await r.arrayBuffer()));

      /**
       * 🔴 THE FOOTER ARRIVES WITH THE FILE AND SPANS THE BLOCK. `glued` is
       * three measurements, not a look: it is as wide as the block's inside, it
       * sits at the bottom of it, and there is no gap between the body above and
       * it. `positron-ui` records `/twelve/` being corrected by screenshot twelve
       * times in one evening because layout was reasoned about instead of
       * measured.
       */
      {
        const area = drop.el.getBoundingClientRect();
        const foot = drop.note.getBoundingClientRect();
        const body = drop.el.querySelector('.pos-drop-body').getBoundingClientRect();
        d.assert('opening a file raises a footer that spans the block and is glued to the body above it',
          drop.note.hidden === false && drop.note.textContent.includes('.circuitpack')
          && Math.abs(foot.width - (area.width - 2)) < 2
          && Math.abs(foot.bottom - (area.bottom - 1)) < 2
          && Math.abs(foot.top - body.bottom) < 2,
          `the footer is ${foot.width.toFixed(0)} px of the block's ${area.width.toFixed(0)}, `
          + `${(foot.top - body.bottom).toFixed(1)} px under the body, saying `
          + `"${drop.note.textContent}"`);
      }

      /**
       * 🔴 THE SIX PUBLISHED PATCHES, DRIVEN. They are the only thing a visitor
       * to the deploy can open, so a broken one there is a page with nothing on
       * it, and that is exactly the state this check exists to notice. It
       * presses a button by NAME rather than by position, because this page has
       * no control row for a harness to sweep.
       * ⚠️ EVERY ONE MUST LAND IN RAM. `00` at offset 6 is `Replace Current
       * Patch`; `01` is `Replace Patch`, which writes flash on an instrument
       * with no factory reset. The extractor refused to write anything else and
       * this is the second reading of the same fact, off the deployed bytes.
       */
      {
        const before = fetched;
        await openReady('frosted-glass');
        d.assert('a published patch opens by name and lands in RAM rather than in flash',
          patches.length === 1 && patches[0].name === 'Frosted Glass'
          && patches[0].writesFlash === false && patches[0].bytes.length === PATCH_BYTES
          && patches[0].bytes[6] === 0x00
          && fetched === before + 1,
          `${patches[0]?.name} is ${patches[0]?.bytes.length} bytes with command `
          + `${patches[0]?.bytes[6]}, after ${fetched - before} request(s)`);

        // ⚠️ AND ALL SIX, because one working says nothing about the other five
        // and the five are what makes it a choice. They are fetched one at a
        // time rather than at once: a visitor presses one.
        const seen = [];
        for (const [id, label] of READY) {
          await openReady(id);
          seen.push({ id, label, got: patches[0]?.name, flash: patches[0]?.writesFlash });
