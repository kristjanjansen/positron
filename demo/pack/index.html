        }
        d.assert('all six open, every one lands in RAM, and no two of them are the same patch',
          seen.length === 6 && seen.every((x) => x.got === x.label && x.flash === false)
          && new Set(seen.map((x) => x.got)).size === 6,
          seen.map((x) => `${x.label}${x.got === x.label ? '' : ` -> ${x.got}`}`).join(', '));

        // 🔴 AND THE BUTTONS ARE NOT IN THE CONTROL ROW, which is what keeps the
        // page's own `no control row at all` assert true while it has six more
        // ways in than it had this morning.
        d.assert('the six sit outside the control row, so the page still has no control row to sweep',
          ready.buttons.length === 6
          && !ready.el.closest('.pos-controls')
          && document.querySelectorAll('.pos-controls button').length === 0,
          `${ready.buttons.length} buttons, ${document.querySelectorAll('.pos-controls button').length} in the control row`);
      }

      await openPack('New Pack.circuitpack', new Uint8Array(await (await realFetch(PACK)).arrayBuffer()));

      d.assert('the pack reads as 64 patches, 32 sessions and 64 samples',
        patches.length === 64 && sessions.length === 32 && samples.length === 64,
        `${patches.length} / ${sessions.length} / ${samples.length}`);

      // ⚠️ THE COUNT LEADS, WHICH IS THE WHOLE OF THE CHANGE AND IS THE ONLY
      // PART OF IT A CHECK CAN SEE. It read `PATCHES 64` until 2026-09-21.
      d.assert('and the counts lead the tab titles',
        tabs.buttons.map((b) => b.textContent).join(' ') === '64 PATCHES 32 SESSIONS 64 SAMPLES',
        tabs.buttons.map((b) => b.textContent).join(' '));

      d.assert('every patch in it lands in RAM rather than in flash',
        patches.every((p) => !p.writesFlash),
        `${patches.filter((p) => p.writesFlash).length} of ${patches.length} would write flash`);

      /**
       * 🔴 AND OPENING ONE BRINGS IT BACK, WITH REAL LAYOUT. The height is the
       * half that matters: `diagram.mjs` measures its own text with
       * `getComputedTextLength`, which answers 0 inside a `display: none`
       * ancestor, so a picture rendered while its host was hidden would come
       * back on screen laid out against a ruler reading zero.
       */
      d.assert('opening a pack brings the picture back, laid out rather than collapsed',
        dgHost.hidden === false && dg.el.getBoundingClientRect().height > 60
        && dg.cuts.length === 0,
        `${dg.el.getBoundingClientRect().height.toFixed(1)} px tall, ${dg.cuts.length} cut`);

      const distinct = new Set(sessions.map((s) => s.fingerprint)).size;
      d.assert('the sessions are all different from each other, so this is a backup',
        distinct === 32, `${distinct} distinct of ${sessions.length}`);

      /**
       * 🔴 THE PANEL UNDER THE LIST, AND THE FIRST HALF IS THAT IT IS ALREADY
       * FILLED. A detail panel that appears on the first press pushes everything
       * under it down, which is the same reservation the picture on the patches
       * tab was asked for. `fill()` opens session 0 for exactly that reason.
       */
      d.assert('opening a pack opens its first session too, so the panel under the list is never empty',
        pickedSession === 0 && partsTable.count() === 50
        && facts.cells.get('head').textContent === 'USER'
        && facts.cells.get('synth 1').textContent === 'Frog Steps'
        && /"User Session", 50 regions/.test(partsLine.textContent)
        && /16 of 1,508 bytes/.test(partsLine.textContent)
        && /32 of 720 bytes/.test(partsLine.textContent)
        && /What the rest hold is not known/.test(partsLine.textContent),
        `${facts.cells.size} cells and ${partsTable.count()} regions · "${partsLine.textContent}"`);

      /**
       * 🔴 THE NOTE DATA, ON THE PAGE. The owner read `What they hold is not
       * known` back at me with *"where is note data?"*, which was the right
       * question the moment the research landed. `notesIn` is graded in
       * `circuit-session-test.mjs` at 5,095 events against 0 in all 64 blanks;
       * what THIS asserts is that the page shows it, and shows it per region.
       * ⚠️ AND THE COLUMN IS EMPTY ON THE OTHER 34 RATHER THAN `0`. A zero would
       * read as a region that was looked at and found empty, and nothing looks
       * for notes outside the sixteen 1,508 byte regions.
       */
      {
        const rows = [...partsTable.scroller().querySelectorAll('.pos-tbl-row')];
        const cell = (r) => r.children[3].textContent.trim();
        const wide = rows.slice(1, 17);
        const rest = [...rows.slice(0, 1), ...rows.slice(17)];
        const shown = wide.reduce((n, r) => n + (+cell(r) || 0), 0);
        d.assert('the sixteen 1,508 byte regions carry a note count and the other 34 carry nothing',
          rows.length === 50 && shown === sessions[0].notes && shown > 0
          && rest.every((r) => cell(r) === ''),
          `${shown} note events across 16 regions, and ${rest.filter((r) => cell(r) === '').length} `
          + 'of the other 34 are blank rather than zero');

        d.assert('and the line says where the notes are rather than that nothing is known',
          /hold [\d,]+ note event\(s\)/.test(partsLine.textContent)
          && /velocity per (step|note)/.test(partsLine.textContent)
          && !/What they hold is not known/.test(partsLine.textContent)
          && /What the rest hold is not known/.test(partsLine.textContent),
          `"${partsLine.textContent.slice(-95)}"`);

        /**
         * 🔴 THE NEGATIVE CONTROL THE RESEARCH INSISTS ON: a decoder that found
         * notes in anything would pass every line above. The three stock
         * sessions in this very pack hold ZERO, and they are the same three that
         * distance from a template finds, which is a third independent road to
         * the same files.
         */
        const stock = sessions.filter((x) => x.nearest < 16);
        d.assert('NEGATIVE CONTROL: the three stock sessions hold no notes at all, found a third way',
          stock.length === 3 && stock.every((x) => x.notes === 0)
          && sessions.filter((x) => x.notes === 0).length === 3
          && sessions.reduce((n, x) => n + x.notes, 0) === 5095,
          `${sessions.filter((x) => x.notes === 0).length} of 32 hold none, `
          + `${sessions.reduce((n, x) => n + x.notes, 0)} events in the pack`);
      }

      /**
       * 🔴 AND NO ROW CLAIMS TO BE A SYNTH, WHICH IS THE CORRECTION ITSELF.
       * The owner asked **"five synths??"** against rows reading `synth 1` to
       * `synth 5`, and a Circuit has TWO synth parts. An assert that only
       * checked the new words would go green again the moment somebody put the
       * old ones back, so this one checks the absence.
       */
      d.assert('no region calls itself a synth or a drum, because nothing measured says it is one',
        !/synth|drum/i.test(partsTable.scroller().textContent)
        && !/synth|drum/i.test(partsLine.textContent)
        && partsTable.scroller().textContent.includes('region 1'),
        `${partsTable.count()} rows, the first reading `
        + `"${partsTable.scroller().querySelector('.pos-tbl-row')?.textContent.slice(0, 20)}"`);

      /**
       * 🔴 THE REGIONS ARE THE DECODER'S MODEL RATHER THAN A READING OF THE FILE
       * LENGTH. Fifty regions covering 53,248 bytes with no gap and no overlap is
       * the claim `circuit-session.mjs` makes, and because the page now SHOWS it
       * the page can CHECK it: every region starts where the last one ended, and
       * each one's written bytes plus its erasure come to its own size.
       */
      {
        const parts = sessions[0].parts;
        let at = 0, ok = true;
        for (const x of parts) { if (x.at !== at || x.used + x.pad !== x.size) ok = false; at += x.size; }
        d.assert('the fifty regions are contiguous, cover the whole file and each accounts for its own pad',
          ok && at === 53248 && parts.length === 50,
          `${parts.length} regions ending at ${at.toLocaleString()} of 53,248`);
      }

      /**
       * 🔴 PRESSING A SECOND SESSION OPENS THAT ONE, and the negative control is
       * the point: a panel that showed the first session whatever was pressed
       * would pass any check that only counted rows.
       */
      const otherSession = sessions.findIndex((x, k) => k > 0 && x.name !== sessions[0].name
        && x.used !== sessions[0].used);
      showSession(otherSession);
      d.assert('NEGATIVE CONTROL: pressing another session shows that one rather than the first',
        pickedSession === otherSession && otherSession > 0
        && partsLine.textContent.includes(`"${sessions[otherSession].name}"`)
        && facts.cells.get('synth 1').textContent === sessions[otherSession].patchNames[0]
        && facts.cells.get('synth 1').textContent !== sessions[0].patchNames[0],
        `session ${otherSession} is "${sessions[otherSession].name}" at ${sessions[otherSession].used} B `
        + `against session 0's "${sessions[0].name}" at ${sessions[0].used} B`);
      showSession(0);

      const stock = sessions.filter((x) => x.nearest < 16);
      d.assert('the three stock sessions are found by distance, which entropy cannot do',
        stock.length === 3 && stock.every((x) => x.nearest === 1)
        && stock.every((x) => x.name === 'Initial Session')
        && stock.every((x) => x.entropy > 0.8)
        && Math.min(...sessions.filter((x) => x.nearest >= 16).map((x) => x.nearest)) === 262,
        `${stock.length} sit 1 byte apart at entropy ${stock.map((x) => x.entropy.toFixed(2)).join(', ')}, `
        + `against ${Math.min(...sessions.filter((x) => x.nearest >= 16).map((x) => x.nearest))} for the nearest of the rest`);

      /**
       * ⚠️ THE PAGE NO LONGER CONCLUDES, SO THIS IS AN ASSERT ABOUT THE COLUMN
       * A READER LOOKS AT RATHER THAN ABOUT A SENTENCE. `29 of real work` was
       * the verdict's words; the same fact is 32 rows of which 3 read a
       * single-digit distance and 29 read 262 or more.
       */
      d.assert('the numbers a reader sees separate the three stock sessions from the other 29',
        sessions.filter((x) => x.nearest < 16).length === 3
        && sessions.filter((x) => x.nearest >= 16).length === 29,
        `${sessions.filter((x) => x.nearest < 16).length} within 16 bytes, `
        + `${sessions.filter((x) => x.nearest >= 16).length} beyond it`);

      /**
       * 🔴 THE LOOSE SESSION PATH, DRIVEN. It was advertised on the drop area
       * before it existed: the accept list named `.circuitsession` while the
       * handler called a function that was not there, so the page read green and
       * would have thrown the moment anybody dropped one. A capability a control
       * announces and cannot perform is this project's named hazard.
       */
      const oneSession = sessions[0].bytes.slice();
      await drop.open([new File([oneSession], 'User Session.circuitsession')]);
      d.assert('a loose session opens, and its two patches come out as payloads rather than messages',
        sessions.length === 1 && patches.length === 2
        && sessions[0].name === 'User Session'
        && patches[0].name === 'Frog Steps' && patches[1].name === 'Woo-z',
        `${sessions.length} session holding ${patches.map((x) => x.name).join(' and ')}`);

      await openPack('New Pack.circuitpack', new Uint8Array(await (await realFetch(PACK)).arrayBuffer()));

      const heads = new Set(sessions.map((s) => s.head));
      d.assert('and the first four bytes are not what decided it, because INIT is on both sides',
        heads.has('INIT') && new Set(sessions.map((x) => x.fingerprint)).size === 32,
        `the owner's own sessions say ${[...heads].join(', ')}`);

      showPatch(0);
      const matches = (p) => {
        const s = summarise(p);
        return dgBox.o1.sub === s.osc1 && dgBox.flt.sub === s.filter
          && dgBox.amp.sub === `release ${s.release}`;
      };
      d.assert('pressing a patch repaints the picture with that patch in it',
        matches(patches[0]) && picked === 0,
        `the picture says ${dgBox.o1.sub} into ${dgBox.mix.sub} into ${dgBox.flt.sub}`);

      const other = patches.findIndex((q, k) => k > 0 && summarise(q).filter !== summarise(patches[0]).filter);
      showPatch(other > 0 ? other : 1);
      d.assert('NEGATIVE CONTROL: a different patch draws a different picture',
        matches(patches[picked]) && dgBox.flt.sub !== summarise(patches[0]).filter,
        `patch ${picked} draws ${dgBox.flt.sub} against patch 0's ${summarise(patches[0]).filter}`);

      /**
       * 🔴 THE SAMPLES, READ BY THE KIT MODULE AND NOT BY THIS PAGE. Every one
       * of the 64 parses, none is refused, and every column in that table moves.
       * The rate, the depth and the channel count are the same sixty four times,
       * which is why they are in the totals line and the hover rather than in
       * columns nobody would read twice.
       */
      const all = summariseAll(samples.map((w) => w.wave));
      d.assert('all 64 samples read as 48 kHz 16 bit mono with none refused, and their lengths differ',
        all.parsed === 64 && all.refused === 0 && all.truncated === 0
        && all.rates.join() === '48000' && all.depths.join() === '16' && all.channels.join() === '1'
        && all.shortest < all.longest,
        `${all.parsed} of ${all.count} read, ${all.shortest.toFixed(2)} s to `
        + `${all.longest.toFixed(2)} s, ${all.seconds.toFixed(1)} s in total`);

      /**
       * 🔴 PRESSING ONE REALLY DECODES IT HERE, AND THIS CHECK COULD NOT BE
       * WRITTEN BEFORE TODAY. The old path handed the bytes to
       * `decodeAudioData`, which is a promise, so a check could press the row
       * and had nothing to read until a decoder somewhere else had finished.
       * `toMono` is synchronous, so what the press produced is on the page by
       * the time the next line runs.
       * ⚠️ AND IT COMPARES AGAINST THE FILE'S OWN HEADER RATHER THAN AGAINST A
       * NUMBER TYPED HERE, so a decoder that produced plausible audio of the
       * wrong length goes red.
       */
      const playedWas = played;
      playSample(0);
      d.assert('pressing a sample decodes it in this page and makes a buffer of exactly its own length',
        played === playedWas + 1 && lastPlayed?.frames === samples[0].row.frames
        && lastPlayed.rate === samples[0].row.rate
        && Math.abs(lastPlayed.seconds - samples[0].row.seconds) < 0.002,
        `${samples[0].name} played ${lastPlayed?.frames.toLocaleString()} frames at `
        + `${lastPlayed?.rate} Hz against ${samples[0].row.frames.toLocaleString()} in its header`);

      /**
       * 🔴 THE PLAYER IS UNDER THE TABLE AND THE TWO ARE ONE BOX, MEASURED OFF
       * REAL RECTS. `glued` is three numbers rather than a look: the player
       * starts where the table ends, the seam between them is 1 px, and both
       * paint a ground of their own, because a transparent child lets the
       * glue's own colour through and the seam stops being a seam.
       */
      {
        /**
         * 🔴 THE TAB IS OPENED FIRST, AND THE FIRST RUN OF THIS CHECK MEASURED A
         * HIDDEN PANEL AND REPORTED A 0.0 px SEAM ON A LAYOUT THAT WAS PERFECT.
         * An inactive tab panel has no layout at all, so every rect in it reads
         * zero while `getComputedStyle` goes on answering real colours, which is
         * the worst possible mixture: half the assert is true and half of it is
         * measuring nothing. `table.mjs`'s own `cuts()` answers `measured:
         * false` for exactly this case and says so in its header.
         * ⚠️ IT SWITCHES BACK IN THE SAME BLOCK WITH NO `await` IN IT, so no
         * frame can be drawn between and nobody watching the page sees a tab
         * move. That is the same argument `/kit/` makes about its own measuring
         * window, and an `await` here would break it.
         */
        const was = tabs.at();
        tabs.go('samples');
        // ⚠️ A SAMPLE IS OPENED FIRST, WITHOUT PLAYING ONE. The picture hides
        // itself until it has something to draw, so measuring the three parts
        // before anything is open measures two of them and a box that is not
        // there. `openSample(i, false)` is the half of the press that opens
        // rather than the half that sounds, which is the split this page made
        // for the player and is useful here for the same reason.
        openSample(0, false);
        const glue = player.parentElement;
        const t = sampleTable.el.getBoundingClientRect();
        const pl = player.getBoundingClientRect();
        const ground = (x) => getComputedStyle(x).backgroundColor;
        const wv = waveHost.getBoundingClientRect();
        d.assert('the list, the picture and the transport are one box, in that order, with 1 px seams',
          glue.classList.contains('pos-glue') && glue.children.length === 3
          && Math.abs(wv.top - t.bottom - 1) < 0.6
          && Math.abs(pl.top - wv.bottom - 1) < 0.6
          && ground(player) !== 'rgba(0, 0, 0, 0)'
          && ground(sampleTable.el) !== 'rgba(0, 0, 0, 0)'
          && ground(waveHost) !== 'rgba(0, 0, 0, 0)'
          && ground(player) !== ground(glue),
          `seams ${(wv.top - t.bottom).toFixed(1)} and ${(pl.top - wv.bottom).toFixed(1)} px `
          + `with the tab open, the parts paint ${ground(sampleTable.el)}, ${ground(waveHost)} `
          + `and ${ground(player)} against the glue's ${ground(glue)}`);

        /**
         * 🔴 THE PICTURE IS ASKED FOR INK RATHER THAN FOR A COLUMN COUNT, which
         * is the check the component's own header demands: every number in
         * `facts()` would read the same if the fill colour were the field
         * colour, if the scale were zero or if `paint()` returned early.
         * `/radio/` already records that a check a wave was drawn has to ask
         * the canvas.
         */
        /**
         * ⚠️ AND AN INK SHARE ON ITS OWN IS NOT EVIDENCE, WHICH THE FIRST RUN
         * SHOWED BY ANSWERING 99.9 PER CENT. `ink()` counts pixels differing
         * from the one at the top left corner, so a canvas painted edge to edge
         * in a field colour while the corner stayed transparent would answer
         * almost 100 and mean nothing. The number that carries weight is the
         * DIFFERENCE between a picture with a sample in it and the same canvas
         * with none, which is why this clears it and puts it back.
         */
        /**
         * ⚠️ AN INK SHARE ON ITS OWN IS NOT EVIDENCE, WHICH THE FIRST RUN
         * SHOWED BY ANSWERING 99.9 PER CENT. `ink()` counts pixels differing
         * from the one at the top left corner, so a canvas painted edge to edge
         * while its corner stayed clear would answer almost 100 and mean
         * nothing.
         * 🔴 AND CLEARING IT IS NOT THE DIFFERENTIAL EITHER, WHICH THE SECOND
         * RUN SHOWED: `clear()` hides the wrapper and leaves the BITMAP where it
         * was, so the same 63,264 pixels were counted before and after. That is
         * a real gap in the component rather than in this check, and it is
         * reported rather than worked around here.
         * ✅ SO THE DIFFERENTIAL IS TWO DIFFERENT SAMPLES. The shortest in the
         * pack is 5,999 frames and the longest is 95,947, and a picture that
         * followed nothing would draw them identically.
         */
        const f = wave.facts();
        const drawn = wave.ink();
        const byLen = samples.map((w, k) => ({ k, n: w.row.frames })).sort((a, b) => a.n - b.n);
        const other = byLen[0].k === 0 ? byLen[byLen.length - 1].k : byLen[0].k;
        openSample(other, false);
        const g = wave.facts();
        const second = wave.ink();
        openSample(0, false);
        d.assert('the picture really follows the open sample, because two different ones draw differently',
          f.frames === samples[0].row.frames
          && Math.abs(f.seconds - samples[0].row.seconds) < 0.002
          && f.cols > 64 && drawn.ink > 0
          && g.frames === samples[other].row.frames && g.frames !== f.frames
          && second.ink !== drawn.ink,
          `${samples[0].name} is ${f.frames.toLocaleString()} frames and ${drawn.ink} lit pixels, `
          + `${samples[other].name} is ${g.frames.toLocaleString()} and ${second.ink}`);
        tabs.go(was);
      }

      /**
       * 🔴 THE LOOP REACHES A SOUND THAT IS ALREADY RUNNING, which is the whole
       * of *"add loop"* that can go wrong. A toggle taking effect only on the
       * NEXT press is a control that looks live and does nothing for as long as
       * anybody is listening, and that is this project's named hazard. So the
       * check presses loop WHILE a voice is playing and reads the voice.
       * ⚠️ AND IT PUTS IT BACK, because every check after this one would
       * otherwise be running against a page left looping.
       */
      openSample(0, true);
      const wasLooping = voice?.loop;
      loopBtn.click();
      const nowLooping = voice?.loop;
      d.assert('pressing loop changes the sound that is already playing, not only the next one',
        wasLooping === false && nowLooping === true
        && loopBtn.getAttribute('aria-pressed') === 'true' && looping === true,
        `the running voice went loop ${wasLooping} to ${nowLooping}, `
        + `the button says ${loopBtn.getAttribute('aria-pressed')}`);

      stopBtn.click();
      d.assert('and stop really lets go of it, so a looping sample can be got out of',
        voice === null && looping === true && wave.facts().position === 0,
        `the voice is ${voice === null ? 'gone' : 'still held'}, the toggle is still on, `
        + `and the head is parked at ${wave.facts().position}`);
      loopBtn.click();

      d.assert('pressing a row opens that sample into the player under the table',
        picked2 === 0 && playerLine.textContent.includes(samples[0].name)
        && playerLine.textContent.includes('frames')
        && playBtn.disabled === false,
        `"${playerLine.textContent}"`);

      /**
       * 🔴 THE NEGATIVE CONTROL, AND IT IS THE ONE THE AGENT THAT BUILT THE
       * MODULE ASKED FOR IN WORDS: a total taken over the files that worked
       * hides the only thing worth seeing. A page that dropped a bad sample
       * would show 63 rows and a tidy total and look perfect.
       * ⚠️ IT ALSO PROVES THE PRESS REFUSES. A row that cannot decode must not
       * increment the play counter, or the page reports having played something
       * that made no sound.
       */
      const badWave = readWave(new Uint8Array([0x52, 0x58, 0x46, 0x46, 0, 0, 0, 0, 0x57, 0x41, 0x56, 0x45]));
      fill([], [], [{ name: 'broken.wav', size: 12, wave: badWave, row: summariseWave(badWave, 'broken.wav') }]);
      const beforeBad = played;
      openSample(0, true);
      d.assert('NEGATIVE CONTROL: a sample that will not read keeps its row, is counted as refused and does not play',
        sampleTable.count() === 1 && played === beforeBad && playBtn.disabled === true
        && /1 refused/.test(samplesLine.textContent)
        && /did not read/.test(sampleTable.scroller().querySelector('.pos-tbl-row')?.title || '')
        && tabs.buttons[2].textContent === '1 SAMPLE'
        && tabs.enabled('samples') === true
        && tabs.enabled('patches') === false && tabs.enabled('sessions') === false,
        `${sampleTable.count()} row saying `
        + `"${sampleTable.scroller().querySelector('.pos-tbl-row')?.title}"`
        + ` · the line reads "${samplesLine.textContent}"`);
      // ⚠️ `scroller()` AND NOT `el`, AND THE FIRST TRY READ THE HEADING. The
      // heading is `.pos-tbl-row pos-tbl-head` and it is FIRST in the element,
      // so `el.querySelector('.pos-tbl-row')` returns a row with no title and
      // the assert went red on a page doing exactly what it promises. That is
      // this page's third assert measuring something next to the quantity in
      // question, and the other two are in `HANDOFF.md`.

      await openPack('New Pack.circuitpack', new Uint8Array(await (await realFetch(PACK)).arrayBuffer()));

      /**
       * 🔴 THE FLASH WARNING, DRIVEN RATHER THAN READ. A file that would
       * overwrite every patch slot on the instrument is the one thing this page
       * exists to notice, and until today it was dismissed as `did not read as a
       * pack`. The stream is built here from the pack's own 64 patches with byte
       * 6 flipped to `01`, which is exactly the file measured in the wild.
       */
      // ⚠️ SNAPSHOT FIRST, AND THE NEGATIVE CONTROL CAUGHT THAT THIS WAS
      // MISSING. `fill()` REPLACES `patches`, so building the safe stream out of
      // `patches` after loading the flash one built it out of the flash one and
      // the control went red reporting 64 of 64 writing flash. It was measuring
      // the page correctly and my check was reading a variable that had moved.
      const orig = patches.map((q) => q.bytes.slice());
      const stream = new Uint8Array(PATCH_BYTES * 64);
      for (let k = 0; k < 64; k++) {
        const one = orig[k].slice();
        one[6] = 0x01; one[7] = k;
        stream.set(one, k * PATCH_BYTES);
      }
      await openPack('a bank that writes flash', stream);
      d.assert('a file that would overwrite flash is named as one, with how many slots it reaches',
        lastScan?.flash === 64 && lastScan.slots.size === 64 && lastScan.messages === 64
        && /overwrite 64 slots, 0 to 63/.test(drop.note.textContent)
        && patches.length === 64,
        `"${drop.note.textContent.slice(0, 80)}"`);

      // ⚠️ THE NEGATIVE CONTROL. A page that shouted at every file would pass
      // the line above and be worthless. The same 64 messages with byte 6 left
      // alone are the portable single patch format and must raise nothing.
      const safe = new Uint8Array(PATCH_BYTES * 64);
      for (let k = 0; k < 64; k++) safe.set(orig[k], k * PATCH_BYTES);
      await openPack('a bank that lands in RAM', safe);
      d.assert('NEGATIVE CONTROL: the same messages that land in RAM raise nothing',
        lastScan?.flash === 0 && !/overwrite/.test(drop.note.textContent)
        && patches.length === 64,
        `${lastScan?.patches.length} patches, ${lastScan?.flash} of them writing flash`);

      await openPack('New Pack.circuitpack', new Uint8Array(await (await realFetch(PACK)).arrayBuffer()));

      const before = fetched;
      showPatch(3);
      d.assert('stepping through them asks nobody for anything',
        fetched === before, `${fetched - before} request(s) while moving`);

      d.assert('nothing was sent while all of that happened',
        midiAsked === 0, `requestMIDIAccess called ${midiAsked} time(s)`);
    }
  }

  d.ready();
</script>
