<svg xmlns="http://www.w3.org/2000/svg" viewBox="35 27 310 147" width="310" height="147" color="#1a1a1a" role="img" aria-labelledby="eccm-logo-title eccm-logo-desc">
  <title id="eccm-logo-title">ECCM, Eesti Nüüdismuusika Keskus</title>
  <desc id="eccm-logo-desc">INTERIM. A redraw of the ECCM mark measured off the 381 by 199 JPEG that eccm.ee serves as its logo (eccm_tallinn_logod_72dpi_no_tln.jpg, read 2026-09-26), pending the vector original from ECCM. The four capitals, the five stave lines and the three joins are geometry read row by row off that raster. The tagline's typeface is not known: the two lines are set in a condensed system face, DIN Condensed where the machine has it because its natural width is nearest the picture's, and squeezed to the measured width of each line, so they are the right size and the wrong letters until ECCM names the face.</desc>
  <!-- every number below is a pixel coordinate in the served JPEG, and the
       viewBox is the ink's own box inside it (the JPEG carries 29 px of air
       above the E, 25 below the tagline, 35 left and 36 right), so a page
       that aligns to this file aligns to ink, and one that wants the JPEG's
       frame sets viewBox="0 0 381 199" and overlays it 1:1; the stroke of the capitals is 14, the stave
       hairlines are 1.5 on a 7.375 pitch, and nothing here was eyeballed -->
  <g fill="currentColor">
    <!-- E: a 14 stem, two 38 bars and a 31 bar; the bottom bar starts at
         row 108, where the raster's join to the C runs along its top edge -->
    <rect x="35" y="29" width="14" height="93"/>
    <rect x="35" y="29" width="38" height="13"/>
    <rect x="35" y="67" width="31" height="13"/>
    <rect x="35" y="108" width="38" height="14"/>
    <!-- C and C: a stadium 44 wide and 97 tall, stroke 14, open on the right
         between y 60 and y 88; the second is the first moved 81 to the right -->
    <path d="M146 60 V49 A15 15 0 0 0 116 49 V101.5 A15 15 0 0 0 146 101.5 V88" fill="none" stroke="currentColor" stroke-width="14"/>
    <path d="M227 60 V49 A15 15 0 0 0 197 49 V101.5 A15 15 0 0 0 227 101.5 V88" fill="none" stroke="currentColor" stroke-width="14"/>
    <!-- M: two 14 stems and a V whose arms are 10 wide horizontally, start
         inside the stems at the top and meet on the baseline -->
    <rect x="273" y="29" width="14" height="93"/>
    <rect x="319" y="29" width="14" height="93"/>
    <polygon points="283,29 293,29 302.5,84 312,29 322,29 306,122 299,122"/>
    <!-- the stave: five hairlines past the M on a 7.375 pitch, and three joins
         between the letters. Every join runs FLUSH along an edge of the letter
         it meets, which is how the raster draws them (rows 58 and 59 are the
         second C's upper terminal's last two rows, 88 and 89 the first C's
         lower terminal's first two, 108 and 109 the E's bottom bar's first
         two), so the first line sits on the terminal's bottom edge at 60 and
         the fifth on the terminal's top edge at 88. Reported 2026-09-26 as
         "left and center thin line does not line up with typeface" when they
         were centred on their rows instead -->
    <rect x="333" y="58.5" width="12" height="1.5"/>
    <rect x="333" y="65.875" width="12" height="1.5"/>
    <rect x="333" y="73.25" width="12" height="1.5"/>
    <rect x="333" y="80.625" width="12" height="1.5"/>
    <rect x="333" y="88" width="12" height="1.5"/>
    <rect x="234" y="58.5" width="39" height="1.5"/>
    <rect x="153" y="88" width="37" height="1.5"/>
    <rect x="73" y="108" width="36" height="1.5"/>
    <!-- the tagline: x-height 14, baselines at 153 and 174, each line squeezed
         to the width the raster measures, 311 and 221. DIN Condensed first
       because its natural width for the first line is 329 px against the
       picture's 311, a 5 per cent squeeze, where Helvetica Neue Condensed
       Bold needs 26 and Arial Narrow 25 (MEASURED on ./logo.html, 2026-09-26) -->
    <g font-family="'DIN Condensed', 'Helvetica Neue', 'Arial Narrow', sans-serif" font-stretch="condensed" font-weight="700" font-size="27" lengthAdjust="spacingAndGlyphs">
      <text x="34" y="153" textLength="311">estonian centre of contemporary music</text>
      <text x="76" y="174" textLength="221">eesti nüüdismuusika keskus</text>
    </g>
  </g>
</svg>
