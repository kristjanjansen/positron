<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<script src="/proto/remixer/hls.min.js"></script>
<style>
  /* The picture is the page. It keeps a fixed aspect so nothing below it moves
     as the window changes — shell.css owns the gap around it. */
  .fl { position: relative; width: 100%; aspect-ratio: 16 / 9; min-height: 280px;
        background: #07090d; border: 1px solid var(--line); border-radius: 4px;
        overflow: hidden; touch-action: none; cursor: grab; }
  .fl:active { cursor: grabbing; }
  /* 🔴 FULLSCREEN NEEDS THE PAGE TO GIVE UP ITS OWN BOX, AND THIS PAGE DID NOT.
     `.fl` sets `aspect-ratio: 16/9` and `position: relative`, and both survive
     being made fullscreen — so the cover applied and the floor stayed a 16:9
     rectangle in the middle of a black screen, which reads as a button that did
     nothing. `.fl.pos-full` is (0,2,0) and beats `.fl` on specificity rather
     than on source order, which is the repair shell.css records for `.pos-faux`
     losing to a page's own `.pane { position: relative }`.
     ⚠️ `.fl.pos-full`, never `.fl:fullscreen, .fl.pos-full` — a browser that
     does not know that pseudo-class DISCARDS THE WHOLE SELECTOR LIST, which
     would delete the fallback on exactly the browsers that need it. */
  .fl.pos-full { aspect-ratio: auto; width: 100%; height: 100%;
                 border: 0; border-radius: 0; min-height: 0; }
  /* ⚠️ A GLYPH BUTTON IS A SQUARE, AND `.ico` DID NOT MAKE IT ONE. shell.css
     scopes that class to `.step button.ico` — the stepper — so on a control-bar
     button it matched nothing at all, and the ⛶ kept the row's `0 14px` padding
     and came out 40.6 x 34: a rectangle pretending to be an icon.
     MEASURED rather than derived: the control buttons are 34 px tall, so 34 is
     the square. Re-measure if the bar's type or padding changes — a size
     computed from four other values looks more rigorous and is one edit away
     from being quietly wrong. */
  .pos-controls button.ico { width: 34px; height: 34px; padding: 0;
                             display: grid; place-items: center;
                             font-size: 15px; line-height: 1; }
  .fl canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* The title of whatever is under the pointer. A FIXED BOX: it is written on
     every frame the gaze moves, and a caption that can change its own height
     would push the picture about while somebody is looking at it. */
  .fl-name { position: absolute; left: 0; right: 0; bottom: 0; height: 46px;
             display: flex; align-items: center; gap: 10px; padding: 0 12px;
             background: linear-gradient(transparent, rgba(7, 9, 13, .92) 55%);
             font: 500 12px/1.3 var(--mono); color: var(--fg);
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fl-name b { color: var(--hi); font-weight: 600; }
  /* 🔴 THE WAY OUT, WHERE YOU CAN SEE IT. Asked twice: "how do I get out?" — and
     the answer had been going into the LOG, which is outside the cover and so
     invisible at exactly the moment somebody needs it. A page that fills the
     screen has to carry its own exit on the screen it filled. It fades after a
     few seconds because it is an instruction, not a status. */
  .fl-out { position: absolute; top: 12px; right: 14px; padding: 6px 10px;
            background: rgba(7, 9, 13, .82); border: 1px solid var(--line);
            border-radius: 4px; color: var(--fg);
            font: 500 11px/1 var(--mono); letter-spacing: .04em;
            opacity: 0; transition: opacity .6s linear; pointer-events: none; }
  .fl-out[data-on="1"] { opacity: 1; }
  .fl-name i { color: var(--dim2); font-style: normal; }
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { mul, modelM, perspective } from '/shell/xr-room.mjs';
  import { pickQuad } from '/shell/xr-pick.mjs';
  import { toggle as toggleFull, exit as exitFull, watch as watchFull,
    support as fullSupport } from '/shell/fullscreen.mjs';
  import { createProjector } from '/shell/projector.mjs';

  // ── the field ───────────────────────────────────────────────────────────
  // 🔴 THE TILE IS 4:3, WHICH IS WHY THERE IS NO GAP. A square quad showing a
  // 4:3 thumbnail squashes every picture, and a gap was hiding that by putting
  // a black line between two distortions. Make the quad the picture's own shape
  // and the grid tiles EXACTLY — no gap to choose, nothing stretched, and the
  // floor reads as one surface rather than as a spreadsheet.
  const TILE_W = 1.68;          // 3x the first pass — a frame you read, not a thumbnail
  // 🔴 THE FLOOR REPEATS, SO IT HAS NO EDGE AT ALL. 298 films laid once is a
  // shape with an outside, and walking to the outside of an archive is the one
  // thing it should not be possible to do. The block below is tiled infinitely:
  // every frame each tile is moved to the COPY OF ITSELF nearest your gaze, so
  // you can walk in any direction forever and the grid stays continuous.
  // ⚠️ A SQUARE PERIOD, and that is not decoration. 15 x 1.68 and 20 x 1.26 are
  // both 25.2 m, so the repeat distance is the same whichever way you walk — an
  // oblong period means the floor starts repeating sooner in one direction, and
  // the first thing anybody does is walk in a straight line.
  // ⚠️ 300 slots for 298 films, so two of them appear twice. Said out loud
  // because the alternative is two holes in an infinite floor, which reads as
  // something failing to load rather than as an archive being the size it is.
  // 🔴 THE PERIOD HAS TO BE BIGGER THAN WHAT YOU CAN SEE, AND IT WAS NOT.
  // MEASURED: at 15 x 20 the period is 25.2 m, so a tile jumps to its other
  // copy at 12.6 m from the gaze — where the fade (9 m to 16 m) still has it at
  // **alpha 0.48**. Half-visible pictures teleporting across the floor as you
  // turn is exactly "erratic". 21 x 28 puts the jump at 17.6 m, past the 16 m
  // where a tile is already gone, so no wrap is ever witnessed.
  // ⚠️ The cost is slots, not work: 588 of them, so each film appears about
  // twice — and only the ~192 with a texture are ever drawn, which is unchanged.
  const COLS = 21, ROWS = 28;
  const TILE_H = TILE_W * 0.75;
  const TEX_W = 256, TEX_H = 192;
  // 🔴 A FIXED NUMBER OF TEXTURE SLOTS, AND IT IS WHY THIS DRAWS IN ONE CALL.
  // Every tile could have its own texture, and then a floor of 298 pictures is
  // 298 binds and 298 draws per EYE per frame. Instead the whole floor lives in
  // one `TEXTURE_2D_ARRAY` and one instanced draw: a tile's instance carries the
  // LAYER it is using, and a tile with no layer is not drawn at all.
  // 128 layers of 256x192 RGBA is ~25 MB, which a Quest has and a laptop will
  // not notice; it is also the LRU's capacity, so "how much can be on screen"
  // and "how much is kept" are one number rather than two that can disagree.
  const LAYERS = 192;
  // ⚠️ TWO RADII, AND THE GAP BETWEEN THEM IS THE POINT. Tiles are REQUESTED out
  // to LOAD_RADIUS and FADED OUT from FADE_FROM, so the edge of what has arrived
  // is never a boundary anybody can see — reported as "edge feels jagged", and
  // it was: a hard silhouette wherever the loader happened to have got to, which
  // changes shape as you look around. A ragged edge that is fully transparent
  // by the time it is reached has no shape to be ragged.
  // ⚠️ BOTH RADII SCALED WITH THE TILE. They are in METRES, so doubling the
  // tile without doubling these would have quartered how many pictures are in
  // the ring — the floor would look the same size and hold four times less.
  // ⚠️ BOTH INSIDE THE REPEAT DISTANCE. The period is 25.2 m; fading to nothing
  // by 16 m means the far side of what you can see is already gone before the
  // next copy of a film could arrive next to the first one.
  const LOAD_RADIUS = 16;       // metres — beyond this nothing is even requested
  const FADE_FROM = 9;          // and from here it is already on its way out
  const CONCURRENT = 8;         // image fetches in flight

  const d = mount({
    name: 'floor',
    what: 'Every 1965 newsreel in the ERR archive, face up on a disc of floor '
      + 'you can walk over. Drag to look, arrow keys to move, and REST YOUR LOOK on '
      + 'a tile to play it, or click one to glide over to it. loaded is how many pictures '
      + 'are on the floor now and reach is how far out they have got.',
    // ⚠️ FOUR CELLS. `playing` repeated the caption under the picture, which is
    // right there and has room for the whole title; `fetching` is a number that
    // is 8 whenever anything is happening and 0 otherwise, which is a state and
    // not a measurement. What is left all moves and none of it is said anywhere
    // else on the page.
    readout: { tiles: '', loaded: 'of 192', reach: 'm', fps: '' },
    // ⚠️ THE SAME ⛶ `mirror` USES, AND FOR THE SAME REASONS. U+26F6 SQUARE FOUR
    // CORNERS is the conventional glyph and renders as TEXT rather than as an
    // emoji, so it takes the bar's colour and sits on its baseline instead of
    // arriving as a coloured picture at a size of its own; `title` and
    // `aria-label` carry the meaning for anyone the glyph does not reach.
    // ⚠️ SECONDARY AND PUSHED RIGHT (`end: true`). Fullscreen is not the verb
    // this page is about — it changes how much of the floor you see, not what
    // the floor does — so it sits apart from the control that starts something.
    // And there is no Stop: the film stops when you look away, because that is
    // the thing a person actually does, and a button for it is a second way to
    // say what they already said.
    controls: [
      // ⚠️ NEITHER IS PRIMARY, and that is right for this page. A primary is
      // the thing to press to make the demo happen; here the demo happens by
      // itself and you make it happen MORE by looking at a tile. Both of these
      // change where you are watching from, not whether anything is running.
      { id: 'vr', label: 'Run in VR' },
      { id: 'full', label: '⛶', end: true },
    ],
  });
  guard(d);

  const wrap = el('div', 'fl');
  const canvas = el('canvas');
  const nameEl = el('div', 'fl-name');
  const outEl = el('div', 'fl-out', 'Esc to leave');
  wrap.append(canvas, nameEl, outEl);
  d.el.append(wrap);

  const gl = canvas.getContext('webgl2', { antialias: true, alpha: true, xrCompatible: true });
  if (!gl) { d.fail(new Error('this browser draws no 3-D')); throw new Error('no webgl2'); }

  // ⚠️ THE PAGE SAYS WHICH RENDERER IT GOT, ALWAYS. A visitor on a software
  // rasteriser is a real visitor and the page should say so rather than quietly
  // being slow; `verify-gl.mjs` also checks this AGREES with what it found, so
  // the two cannot be describing different contexts.
  {
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    // ⚠️ THE RENDERER ALONE, WITH NO VENDOR PREFIX. `verify-gl.mjs` compares
    // this string to its OWN reading and both must be the same quantity — a
    // prettier `vendor · renderer` here fails a check that is not about
    // prettiness, it is about the two of them describing one context.
    const rendererName = dbg
      ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)
      : gl.getParameter(gl.RENDERER);
    window.__demo.gl = { renderer: rendererName, ok: !!gl };
    d.log(`renderer: ${rendererName}`);
  }

  // ── the catalogue ───────────────────────────────────────────────────────
  let tiles = [];
  const state = [];             // per tile: {x, z, layer, a, v, want, img, loading}

  // ── the texture array, and the slots it hands out ───────────────────────
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D_ARRAY, tex);
  gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.RGBA8, TEX_W, TEX_H, LAYERS);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  // 🔴 THE LRU IS BY DISTANCE FROM WHERE YOU ARE LOOKING, NOT BY AGE. A
  // least-recently-used slot is the wrong thing to evict on a floor you walk
  // over: the tile behind you was used a moment ago and you are never going to
  // look at it again, while the one ahead has never been used and is about to
  // be. Age would evict exactly the tiles about to be needed.
  const freeLayers = Array.from({ length: LAYERS }, (_, i) => i);
  const usedLayers = new Map();          // layer -> tile index

  function takeLayer(ti, dist) {
    if (freeLayers.length) { const L = freeLayers.pop(); usedLayers.set(L, ti); return L; }
    let worst = -1, worstD = dist;
    for (const [L, owner] of usedLayers) {
      if (state[owner].v > 0.01) continue;      // never evict what is playing
      const dd = distOf(owner);
      if (dd > worstD) { worstD = dd; worst = L; }
    }
    if (worst < 0) return -1;                   // nothing further away than us
    const prev = usedLayers.get(worst);
    state[prev].layer = -1; state[prev].a = 0; state[prev].want = false;
    usedLayers.set(worst, ti);
    return worst;
  }

  // ── one program, one instanced draw ─────────────────────────────────────
  const VS = `#version 300 es
  layout(location=0) in vec2 quad;      // -0.5..0.5
  layout(location=1) in vec4 inst;      // x, z, layer, imageAlpha
  layout(location=2) in vec2 aVF;       // video alpha, focus 0..1
  uniform mat4 uVP;
  uniform vec2 uTile;     // width, depth — the picture's own shape, in metres
  uniform vec2 uFocus;    // where the gaze meets the floor
  uniform vec2 uFade;     // from, to — metres
  out vec2 vUV; flat out float vLayer; out float vA; out float vV; out float vF;
  void main(){
    vec3 p = vec3(inst.x + quad.x * uTile.x, 0.0, inst.y + quad.y * uTile.y);
    gl_Position = uVP * vec4(p, 1.0);
    // 🔴 THE TOP OF THE PICTURE IS THE FAR EDGE, AND THE SIGN HERE WAS WRONG.
    // \`quad.y\` runs along +Z, which is TOWARD a viewer looking down the floor,
    // so \`quad.y = +0.5\` is the NEAR edge. With \`UNPACK_FLIP_Y_WEBGL\` false,
    // texture V=0 is the first row of the JPEG — the top of the image. Mapping
    // the near edge to V=0 therefore put the top of every picture nearest the
    // viewer, which reads as upside down when you look ACROSS the floor, which
    // is the only way anyone looks at it. The near edge takes V=1 instead.
    vUV = vec2(quad.x + 0.5, quad.y + 0.5);
    // the wide fade: 1 inside uFade.x, 0 by uFade.y, smooth between, so the
    // outer ring dissolves into the floor instead of stopping.
    // WARNING: no backticks in here — this is inside a JS template literal and
    // one of them ends the shader mid-sentence. It did, and the page threw
    // before a single assert ran.
    float far = distance(vec2(inst.x, inst.y), uFocus);
    vLayer = inst.z;
    vA = inst.w * (1.0 - smoothstep(uFade.x, uFade.y, far));
    vV = aVF.x; vF = aVF.y;
  }`;
  const FS = `#version 300 es
  precision highp float; precision highp sampler2DArray;
  in vec2 vUV; flat in float vLayer; in float vA; in float vV; in float vF;
  uniform sampler2DArray uTex;
  uniform sampler2D uVid;
  uniform vec4 uCrop;     // still inset x,y then video inset x,y — 0..0.5
  uniform float uDim;     // 0..1 — how much the floor has stood down
  out vec4 frag;
  // 🔴 CROP THE BANDS OFF RATHER THAN SHOW THEM. The scans and the masters both
  // carry black down the sides — real, in the material, and not something a
  // floor of pictures should be a grid of. Sampling a window of the texture
  // instead of all of it costs nothing and loses only the black.
  // ⚠️ Two insets, not one: the still is already a 4:3 thumbnail with a thin
  // edge, and the video is a WIDE master with a 4:3 picture inside it, so one
  // number would either leave the master pillarboxed or eat the still.
  vec2 inset(vec2 uv, vec2 m){ return m + uv * (1.0 - 2.0 * m); }
  void main(){
    vec3 still = texture(uTex, vec3(inset(vUV, uCrop.xy), vLayer)).rgb;
    vec3 moving = texture(uVid, inset(vUV, uCrop.zw)).rgb;
    // 🔴 THE FADE IS A MIX OF TWO PICTURES, NOT A FADE TO BLACK AND BACK. Going
    // out through black is two transitions where there should be one, and on a
    // floor of stills the hole reads as a tile that broke.
    vec3 c = mix(still, moving, clamp(vV, 0.0, 1.0));
    // 🔴 THE FOCUS IS A SEQUENCE, NOT A STATE: LIGHTEN, THEN DARKEN, THEN PLAY.
    // A single brightening says "this one" and nothing else, so the film simply
    // appears at the end of it and the wait feels like lag. Lighting the tile
    // quickly and then taking it DOWN reads as a machine getting ready — the
    // lamp strikes, the shutter closes over the frame, and the film arrives out
    // of the dark it just made. The whole gesture is the dwell, so the picture
    // tells you how long you have to hold your look without a bar or a ring
    // anywhere.
    //
    // vF is dwell progress, 0..1. The curve:
    //   0.00 - 0.18  up FAST to +55%      the lamp
    //   0.18 - 0.75  down through 1.0 to -55%   the shutter closing
    //   0.75 - 1.00  held dark            and the film crosses into it
    float f = clamp(vF, 0.0, 1.0);
    float shape = f < 0.18
      ? smoothstep(0.0, 0.18, f) * 0.55
      : mix(0.55, -0.55, smoothstep(0.18, 0.75, f));
    c *= 1.0 + shape;
    // 🔴 ONE GREY, AND IT IS NOT A STYLE CHOICE. These are 1965 newsreels: the
    // film is black and white and the scans are not — they carry the colour cast
    // of whatever telecine and JPEG they went through, so a floor of them is a
    // patchwork of slightly different browns and blues that reads as damage.
    // Rec. 601 luma, because it is the coefficients the material was broadcast
    // under. Applied AFTER the video mix, so a film fading in over its own still
    // does not change colour space halfway.
    c = vec3(dot(c, vec3(0.299, 0.587, 0.114)));
    // 🔴 WHEN ONE FILM IS PLAYING THE REST OF THE FLOOR STANDS DOWN. A moving
    // picture in a field of 190 still ones loses to the field — there is more
    // of it, and motion in the corner of an eye is not enough on its own. So
    // everything that is not playing dims, SLOWLY: fast would read as a flash,
    // and this is the floor getting out of the way rather than an event.
    // WARNING: no backticks in this file's shader strings — they are inside a
    // JS template literal and one ends the shader mid-sentence. Done twice now.
    // The 1.0 - vV term is what exempts the playing tile, so the exemption is
    // the same number that fades the video in: there is no second piece of
    // state that could disagree about which tile is playing.
    c *= mix(1.0, 0.24, uDim * (1.0 - clamp(vV, 0.0, 1.0)));
    // the still fades UP from the floor's own colour as it arrives
    frag = vec4(mix(vec3(0.055, 0.066, 0.086), c, clamp(vA, 0.0, 1.0)), 1.0);
  }`;
  function shader(type, src) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS));
  // ⚠️ BEFORE linkProgram, NOT AFTER. `bindAttribLocation` only takes effect at
  // the NEXT link — called afterwards it is a no-op that reads like a fix, and
  // a Quest reported GL_INVALID_OPERATION on its first frame and drew correctly
  // anyway because the linker happened to choose the same slots.
  gl.bindAttribLocation(prog, 0, 'quad');
  gl.bindAttribLocation(prog, 1, 'inst');
  gl.bindAttribLocation(prog, 2, 'aVF');
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  const uVP = gl.getUniformLocation(prog, 'uVP');
  const uTile = gl.getUniformLocation(prog, 'uTile');
  const uFocus = gl.getUniformLocation(prog, 'uFocus');
  const uFade = gl.getUniformLocation(prog, 'uFade');
  const uCrop = gl.getUniformLocation(prog, 'uCrop');
  const uDim = gl.getUniformLocation(prog, 'uDim');
  const uTexL = gl.getUniformLocation(prog, 'uTex');
  const uVidL = gl.getUniformLocation(prog, 'uVid');

  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const quadBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
    -0.5, -0.5, 0.5, -0.5, -0.5, 0.5, -0.5, 0.5, 0.5, -0.5, 0.5, 0.5]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const instBuf = gl.createBuffer(), vidBuf = gl.createBuffer();
  let instData = new Float32Array(0), vidData = new Float32Array(0);
  gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 0, 0);
  gl.vertexAttribDivisor(1, 1);
  gl.bindBuffer(gl.ARRAY_BUFFER, vidBuf);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 0, 0);
  gl.vertexAttribDivisor(2, 1);
  gl.bindVertexArray(null);

  // the video texture — one, because one thing plays at a time
  // The still's own edge — a few per cent, enough to lose a scan border without
  // eating the picture. MEASURED by eye against the thumbnails, which is the
  // only instrument there is for "is there a black line at the edge".
  const STILL_CROP = [0.035, 0.02];
  // ⚠️ THE VIDEO'S CROP IS COMPUTED, NOT GUESSED. A master that is 16:9 with a
  // 4:3 picture in it needs (1 - (4/3)/(16/9)) / 2 = 12.5% off each side, and a
  // master that is already 4:3 needs none — and which one a film is cannot be
  // known until it loads. Derived from `videoWidth`/`videoHeight` every time a
  // film starts, so a squarer master is not cropped into.
  let vidCrop = [0, 0];
  function measureVideoCrop() {
    const w = video.videoWidth, h = video.videoHeight;
    if (!w || !h) { vidCrop = [0, 0]; return; }
    const a = w / h, want = 4 / 3;
    vidCrop = a > want + 0.01
      ? [(1 - want / a) / 2, 0]        // pillarboxed: take it off the sides
      : a < want - 0.01
        ? [0, (1 - a / want) / 2]      // letterboxed: take it off top and bottom
        : [0, 0];
  }

  const vidTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, vidTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE,
    new Uint8Array([14, 17, 22, 255]));
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  // ── where you are ───────────────────────────────────────────────────────
  const eye = [0, 1.65, 5.0];   // back a little, because the tiles got bigger
  let yaw = 0, pitch = -0.62;
  // where the pointer has asked the camera to be; `yaw`/`pitch` follow it
  let yawT = 0, pitchT = -0.62;
  const LOOK_RATE = 9;          // ~110 ms to settle — a follow, not a lag
  const look = () => [Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch)];

  /** Where the gaze meets the floor — the centre the loading spreads from. */
  let gaze = [0, 0];
  function gazePoint() {
    const dvec = look();
    if (dvec[1] >= -0.02) return [eye[0] + dvec[0] * 8, eye[2] + dvec[2] * 8];
    const t = -eye[1] / dvec[1];
    return [eye[0] + dvec[0] * t, eye[2] + dvec[2] * t];
  }
  const distOf = (i) => Math.hypot(state[i].x - gaze[0], state[i].z - gaze[1]);

  // ── loading, and the order it happens in ────────────────────────────────
  //
  // 🔴 NEAREST TO WHERE YOU ARE LOOKING FIRST, RE-SORTED AS YOU LOOK. Loading
  // the catalogue in order fills the floor from one corner and leaves the tile
  // under your nose blank while the far end of 1965 arrives. The queue is
  // rebuilt from the CURRENT gaze point every time a slot frees, so turning
  // your head changes what is being fetched rather than what is fetched next
  // after everything already asked for.
  let inflight = 0, loadedCount = 0, reach = 0, dimAmt = 0;
  function pump() {
    if (!tiles.length) return;
    while (inflight < CONCURRENT) {
      let best = -1, bestD = LOAD_RADIUS;
      for (let i = 0; i < state.length; i++) {
        const s = state[i];
        if (s.want || s.layer >= 0 || !tiles[state[i].film].photo) continue;
        const dd = distOf(i);
        if (dd < bestD) { bestD = dd; best = i; }
      }
      if (best < 0) return;
      const s = state[best];
      const L = takeLayer(best, bestD);
      if (L < 0) return;                 // every slot is nearer than this tile
      s.want = true; s.layer = L; s.a = 0;
      inflight++;
      loadOne(best, L, bestD);
    }
  }

  function loadOne(i, L, dd) {
    const img = new Image();
    // ⚠️ SAME-ORIGIN, WHICH IS THE WHOLE REASON `/err-img` EXISTS. The archive's
    // own image hosts answer 200 with NO access-control-allow-origin — measured
    // — so an `<img>` can DISPLAY them and `texSubImage3D` cannot READ them.
    // Asking our own origin makes the pixels ours to upload.
    img.decoding = 'async';
    img.src = `/err-img?f=${encodeURIComponent(tiles[state[i].film].photo)}&w=${TEX_W}&h=${TEX_H}`;
    // 🔴 `decode()`, NOT `onload`. THIS IS WHY SOME TILES CAME UP BRIGHT GREEN.
    // `onload` means the BYTES arrived; with `decoding: 'async'` the pixels may
    // not exist yet, and `texSubImage3D` then uploads whatever is in the decode
    // buffer — which on this machine was a flat green and, on the tile below it,
    // half an image in scanline bands. MEASURED first that the images really are
    // 256x192, because a size mismatch produces the same symptom and would have
    // been the obvious suspect: they are exactly the size asked for, so the size
    // was not it.
    // ⚠️ AND THE MONOCHROME FILTER WOULD HAVE HIDDEN THIS. Green becomes grey,
    // the tile stops looking broken and stays wrong. Fixed before it was added,
    // deliberately, and in that order.
    img.decode().then(() => {
      inflight--;
      // the tile may have lost its slot to something nearer while this was in
      // flight — uploading then would paint the wrong picture into somebody
      // else's layer, which is the worst available bug because it looks right
      if (state[i].layer !== L || usedLayers.get(L) !== i) { pump(); return; }
      gl.bindTexture(gl.TEXTURE_2D_ARRAY, tex);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
      gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, L, TEX_W, TEX_H, 1,
        gl.RGBA, gl.UNSIGNED_BYTE, img);
      state[i].img = true;
      loadedCount = Math.min(LAYERS, loadedCount + 1);
      reach = Math.max(reach, dd);
      pump();
    }).catch(() => {
      inflight--;
      // a miss is remembered: `photo` is cleared so the queue stops offering it
      tiles[state[i].film].photo = null;
      state[i].want = false;
      if (state[i].layer === L) { state[i].layer = -1; usedLayers.delete(L); freeLayers.push(L); }
      pump();
    });
  }

  // ── the projector, where the film is ────────────────────────────────────
  //
  // 🔴 IT COMES FROM THE TILE, NOT FROM THE PAGE. A projector sound in stereo
  // in front of you is a soundtrack; a projector sound coming from the square
  // of floor that is running is a machine in a room, and the whole point of
  // putting the archive on a floor is that it is somewhere rather than on a
  // screen. HRTF panning, a listener that follows the camera, and a source at
  // the playing tile's own metres.
  //
  // ⚠️ A GESTURE BUILDS IT, AND NOT A MOMENT BEFORE. An AudioContext made at
  // load starts suspended, and `resume()` in a real browser neither resolves
  // nor rejects until somebody has touched the page — awaiting one is a hang,
  // not an error. The first pointer down on the floor is the gesture, and it is
  // one somebody makes anyway.
  // ⚠️ HALVED, TWICE OVER. It is a room a film is playing in, not a film about
  // a projector — it should be the thing you notice when it stops.
  const PROJ_GAIN = 0.25;
  let actx = null, projector = null, panner = null, projGain = 0, lastDt = 0.016;
  function audioUp() {
    if (actx) return;
    actx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    actx.resume().catch(() => {});          // NOT awaited — see above
    panner = actx.createPanner();
    panner.panningModel = 'HRTF';
    panner.distanceModel = 'inverse';
    // ⚠️ A REFERENCE DISTANCE IN THE SAME UNITS AS THE FLOOR. The tiles are
    // laid out in metres, so these are metres; a default of 1 with a rolloff of
    // 1 makes a projector two tiles away almost inaudible, which is not what a
    // room sounds like.
    panner.refDistance = 1.8;
    panner.rolloffFactor = 0.7;
    panner.maxDistance = 40;
    panner.connect(actx.destination);
    projector = createProjector(actx);
    projector.node.connect(panner);
    projector.start();
    d.log('projector running — it comes from the tile that is playing', 'hi');
  }

  /** Put the listener where the camera is and the machine where the film is.
   *  Called every frame, in both the window and the headset. */
  function placeSound() {
    if (!actx || !panner) return;
    const f = look();
    const L = actx.listener;
    // ⚠️ TWO APIS, AND THE OLD ONE IS NOT DEAD. `positionX` and friends are
    // AudioParams and the modern path; Firefox still ships only the deprecated
    // setter, and a page that uses one and not the other is silent on half the
    // browsers there are. Both, with the AudioParam preferred.
    if (L.positionX) {
      L.positionX.value = eye[0]; L.positionY.value = eye[1]; L.positionZ.value = eye[2];
      L.forwardX.value = f[0]; L.forwardY.value = f[1]; L.forwardZ.value = f[2];
      L.upX.value = 0; L.upY.value = 1; L.upZ.value = 0;
    } else if (L.setPosition) {
      L.setPosition(eye[0], eye[1], eye[2]);
      L.setOrientation(f[0], f[1], f[2], 0, 1, 0);
    }
    const i = playing;
    if (i >= 0) {
      const x = state[i].x, z = state[i].z;
      if (panner.positionX) {
        panner.positionX.value = x; panner.positionY.value = 0; panner.positionZ.value = z;
      } else if (panner.setPosition) panner.setPosition(x, 0, z);
    }
    // ── how loud the machine is, eased HERE rather than in the node ────────
    //
    // 🔴 SLOW UP, FAST DOWN, and the asymmetry is the whole complaint. A
    // projector spinning up is a thing you want to hear arrive; a projector
    // still running after you looked away is a thing that will not shut up.
    // ⚠️ IT ALSO COMES UP DURING THE DWELL, not only once the film is running,
    // so the machine is starting while the lamp strikes and the shutter closes
    // — the sound is part of that sequence rather than something that happens
    // after it.
    const want = (playing >= 0 && vidReady) ? PROJ_GAIN
      : (hover >= 0 && dwell > 0 ? PROJ_GAIN * 0.55 * (dwell / DWELL_MS) : 0);
    // ✅ MEASURED, by running the easing at a fixed 1/60 s rather than by
    // guessing — the shape is arithmetic, so it needs no browser and no ear:
    //   up    1.6   50% in 0.42 s, 90% in 1.42 s
    //   down  5.0   50% in 0.12 s, 10% in 0.43 s, SILENT in 0.87 s
    // ⚠️ And the thing being compared against: the old code reached 99% after
    // SIX SECONDS and came down just as slowly, which is precisely "seems to
    // lag and never stops".
    projGain += (want - projGain) * Math.min(1, lastDt * (want > projGain ? 1.6 : 5.0));
    // a floor, so it actually reaches silence rather than approaching it — an
    // exponential never arrives, and -66 dB that never stops is still a thing
    // the graph says is running
    if (projGain < PROJ_GAIN * 0.01) projGain = want > 0 ? projGain : 0;
    projector.setGain(projGain);
  }

  // ── the one video ───────────────────────────────────────────────────────
  const video = el('video');
  video.playsInline = true; video.muted = true; video.loop = true;
  video.crossOrigin = 'anonymous';      // vod.err.ee sends ACAO:* — measured
  // 🔴 IN THE DOCUMENT, AND NOT `display: none`. A detached `<video>` is not
  // reliably decoded — the element played, `currentTime` moved on some browsers
  // and not others, and nothing ever reached the texture. `display: none` has
  // the same failure with better manners: a box that is not laid out can have
  // its decode dropped too. Off-screen and 2 px is a video the browser still
  // considers to be on the page.
  // ⚠️ And it is 2 px rather than 1: some decoders refuse a 1 px box.
  video.style.cssText = 'position:absolute;left:-9999px;top:0;width:2px;height:2px;opacity:0;pointer-events:none';
  wrap.append(video);
  let hls = null, playing = -1, vidReady = false;

  async function playTile(i) {
    if (i < 0 || i >= tiles.length) return;
    if (playing === i) return;
    const film = tiles[state[i].film];
    stopVideo(false);
    playing = i;
    try {
      const r = await fetch(`https://arhiiv.err.ee/api/v1/content/video/${encodeURIComponent(film.slug)}`);
      const j = await r.json();
      const raw = (j?.data?.media || j?.media)?.src?.hls;
      if (!raw) { d.log(`${film.slug}: the archive offers no stream`, 'bad'); stopVideo(true); return; }
      // ERR hands back a PROTOCOL-RELATIVE url; on a local http page that would
      // resolve to http and be blocked as mixed content on the deploy. Pin it.
      const src = raw.startsWith('//') ? `https:${raw}` : raw;
      // ⚠️ MMS, NOT canPlayType. `canPlayType('application/vnd.apple.mpegurl')`
      // answers "maybe" in Chrome AND in headless Chrome, so it cannot tell the
      // two paths apart — three demos played a dead picture behind a green
      // suite for exactly this. ManagedMediaSource is WebKit-only, so it is a
      // capability test rather than a brand check.
      if ('ManagedMediaSource' in window) {
        video.disableRemotePlayback = true;
        video.src = src;
      } else if (window.Hls?.isSupported()) {
        hls = new window.Hls({ capLevelToPlayerSize: true, maxBufferLength: 12 });
        hls.loadSource(src); hls.attachMedia(video);
      } else { d.log('no HLS path in this browser', 'bad'); stopVideo(true); return; }
      // NOT awaited: play() waits on a user gesture and does not reject, so
      // awaiting it is a hang rather than an error.
      video.play().catch(() => {});
      d.log(`playing ${film.title}`, 'hi');
    } catch (e) {
      d.log(`could not ask the archive: ${e.message}`, 'bad');
      stopVideo(true);
    }
  }

  function stopVideo(clear = true) {
    if (hls) { hls.destroy(); hls = null; }
    try { video.pause(); } catch { /* nothing loaded */ }
    video.removeAttribute('src'); video.load();
    vidReady = false;
    if (clear) playing = -1;
  }

  // ── picking ─────────────────────────────────────────────────────────────
  //
  // ⚠️ ONE PICK FUNCTION FOR BOTH A MOUSE AND A CONTROLLER, because they are
  // the same question: a ray, and which flat rectangle it lands on first. The
  // mouse's ray comes out of the camera through the pointer; the controller's
  // comes out of its own pose. `pickQuad` grades both, and it is tested on a
  // laptop with no headset at all.
  function pickFloor(o, dir) {
    if (dir[1] >= -1e-4) return -1;
    const t = -o[1] / dir[1];
    const px = o[0] + dir[0] * t, pz = o[2] + dir[2] * t;
    // ⚠️ THE TILE IS NOT SQUARE ANY MORE, so a single half-extent would pick a
    // tile you are not over on one axis and miss one you are on the other.
    let best = -1, bestD = Infinity;
    for (let i = 0; i < state.length; i++) {
      if (state[i].layer < 0 || state[i].a < 0.05) continue;   // nothing invisible
      const dx = Math.abs(state[i].x - px) / (TILE_W / 2);
      const dz = Math.abs(state[i].z - pz) / (TILE_H / 2);
      const dd = Math.max(dx, dz);
      if (dd <= 1 && dd < bestD) { bestD = dd; best = i; }
    }
    return best;
  }

  // ⚠️ 900 ms TO COMMIT, 2.5 s TO LET GO. The asymmetry is the whole design;
  // see the dwell block in `step()`.
  // 🔴 ONE TEMPO, AND IT IS A PROJECTOR'S. Everything that moves on this page
  // moves slowly and on the same clock: a still coming up, a film crossing over
  // it, the floor standing down, the glide across the disc. The first version
  // ran at interface speed — 300 ms eases, a 900 ms dwell — and it felt like a
  // file browser with pictures in it. Archive film has a pace of its own and
  // the page should not argue with it.
  // ⚠️ These are RATES, not durations: 1 / RATE is roughly the seconds to
  // settle. Kept together so "slower" is one edit and not six.
  const FADE_RATE = 1.1;        // a still arriving           ~0.9 s
  const VIDEO_RATE = 0.7;       // a film crossing its still  ~1.4 s
  // ⚠️ THE FOCUS TRACKS THE DWELL CLOSELY — this one is FAST where the others
  // are slow, and that is the point rather than an inconsistency. The shape it
  // drives is already timed by the dwell (1.8 s); easing it slowly on top would
  // smear the lamp and the shutter into one another and lose the sequence.
  const FOCUS_RATE = 7;         // follows the dwell rather than softening it
  const DIM_RATE = 0.4;         // the floor standing down    ~2.5 s
  const GLIDE_RATE = 0.9;       // travelling across the disc
  // ⚠️ 2 s TO LET GO, DOWN FROM 4. Still twice as patient as the dwell is quick,
  // which is the asymmetry that stops a wandering gaze cutting a film off — but
  // four seconds of a projector running at something you have already turned
  // away from is a machine that will not take the hint.
  const DWELL_MS = 1800, AWAY_MS = 2000;
  let hover = -1, dwell = 0, away = 0;

  // 🔴 A CLICK TRAVELS; RESTING YOUR LOOK PLAYS. Two verbs that were one, and
  // separating them is what makes a floor this size usable: the far side of the
  // disc is somewhere you want to GO, and arriving is not the same as asking to
  // watch. So a click — or a trigger pull on the ray — glides the camera until
  // the tile is under your gaze, and the dwell then fires on its own when you
  // get there. Nothing new has to be pressed.
  // ⚠️ IT MOVES THE EYE AND NOT THE AIM. Turning to face a tile would swing the
  // whole floor past you and lose the place you were looking at; a translation
  // keeps the view square to the grid, which is the thing that makes a floor
  // readable at all.
  let panTo = null;
  function panToTile(i) {
    if (i < 0) return;
    panTo = [eye[0] + (state[i].x - gaze[0]), eye[2] + (state[i].z - gaze[1])];
  }

  // 🔴 IN A HEADSET THE TRIGGER IS A HAND ON THE FLOOR, NOT A CLICK. Hold it and
  // drag, and the point you grabbed stays under the ray — the same verb the
  // mouse has, with the hand doing what the hand is for. A teleport-on-click
  // would be a different gesture for the same intention, and the one that needs
  // explaining.
  // ⚠️ IT MOVES THE WORLD, NOT THE HEAD. A headset's eye position comes from the
  // wearer's actual head and is not ours to write; the floor is ours. So the
  // drag accumulates a `shift` that is subtracted from the head pose, which is
  // the same picture and does not lie about where anybody is standing.
  const shift = [0, 0];
  let grab = null;                 // {x, z} — the floor point under the ray
  const rayFloor = (m) => {
    const o = [m[12], m[13], m[14]], dir = norm([-m[8], -m[9], -m[10]]);
    if (dir[1] >= -1e-4) return null;
    const t = -o[1] / dir[1];
    return { x: o[0] + dir[0] * t - shift[0], z: o[2] + dir[2] * t - shift[1] };
  };
  function setHover(i) {
    if (i === hover) return;
    hover = i;
    if (i < 0) { nameEl.innerHTML = ''; return; }
    nameEl.innerHTML = '';
    const t = tiles[state[i].film];
    nameEl.append(el('b', '', t.date), el('span', '', t.title), el('i', '', t.series || ''));
  }

  // ── the desktop camera ──────────────────────────────────────────────────
  let dragging = false, lastX = 0, lastY = 0, moved = 0;
  const keys = new Set();
  wrap.addEventListener('pointerdown', (e) => {
    audioUp();                     // the gesture, taken where somebody makes one
    dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
    wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener('pointermove', (e) => {
    const r = wrap.getBoundingClientRect();
    const ndx = ((e.clientX - r.left) / r.width) * 2 - 1;
    const ndy = 1 - ((e.clientY - r.top) / r.height) * 2;
    setHover(pickFloor(eye, rayThrough(ndx, ndy)));
    if (!dragging) return;
    moved += Math.abs(e.clientX - lastX) + Math.abs(e.clientY - lastY);
    // ⚠️ DRAG THE FLOOR, NOT THE CAMERA — both signs inverted from the first
    // version. The cursor is a grabbing hand, so the thing under it should
    // follow the hand: drag right and the floor goes right, which turns the
    // view LEFT. Moving the camera with the drag is the opposite of what the
    // cursor promises, and it is the sort of wrong only findable by using it.
    // ⚠️ HALF THE RATE, AND IT SETS A TARGET RATHER THAN THE ANGLE. At 0.004
    // rad/px a 250 px drag swung the view 57 degrees, which on a floor of
    // pictures is a lurch; and writing the angle straight from the pointer puts
    // every bit of mouse and trackpad noise directly into the camera. The
    // pointer moves a TARGET and the camera eases toward it, so the floor has
    // the weight of something being turned rather than something being nudged.
    yawT -= (e.clientX - lastX) * 0.0021;
    pitchT = Math.max(-1.45, Math.min(0.5, pitchT + (e.clientY - lastY) * 0.0021));
    lastX = e.clientX; lastY = e.clientY;
  });
  wrap.addEventListener('pointerup', (e) => {
    dragging = false;
    // a drag is not a click — 6 px of travel is the difference between looking
    // around and asking for a film
    if (moved < 6 && hover >= 0) panToTile(hover);
    try { wrap.releasePointerCapture(e.pointerId); } catch { /* gone */ }
  });
  // ⚠️ AND THE ARROWS STOP SCROLLING THE PAGE. A floor you walk with the arrow
  // keys, inside a document that scrolls with the arrow keys, means every step
  // forward also scrolls the picture off the screen.
  addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k.startsWith('arrow')) e.preventDefault();
    keys.add(k);
  }, { passive: false });
  addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));

  let projM = perspective(1.05, 16 / 9, 0.05, 60);
  function rayThrough(ndx, ndy) {
    const f = Math.tan(1.05 / 2);
    const asp = canvas.width / Math.max(1, canvas.height);
    const cx = ndx * f * asp, cy = ndy * f;
    const fwd = look();
    const upW = [0, 1, 0];
    const right = norm(cross(fwd, upW));
    const up = cross(right, fwd);
    return norm([fwd[0] + right[0] * cx + up[0] * cy,
      fwd[1] + right[1] * cx + up[1] * cy,
      fwd[2] + right[2] * cx + up[2] * cy]);
  }
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = (v) => { const L = Math.hypot(...v) || 1; return [v[0] / L, v[1] / L, v[2] / L]; };
  function viewM() {
    const f = look(), r = norm(cross(f, [0, 1, 0])), u = cross(r, f);
    return new Float32Array([
      r[0], u[0], -f[0], 0, r[1], u[1], -f[1], 0, r[2], u[2], -f[2], 0,
      -(r[0] * eye[0] + r[1] * eye[1] + r[2] * eye[2]),
      -(u[0] * eye[0] + u[1] * eye[1] + u[2] * eye[2]),
      (f[0] * eye[0] + f[1] * eye[1] + f[2] * eye[2]), 1]);
  }

  // ── the frame ───────────────────────────────────────────────────────────
  let lastT = performance.now(), fpsAcc = 0, fpsN = 0, frames = 0;
  function step(dt) {
    // walking
    // ⚠️ ARROW KEYS, AND ONLY ARROW KEYS. W A S D is a convention you have to
    // already know; arrows are on the key caps. This page is a floor of archive
    // film, not a game, and its visitor is somebody who wanted to look at 1965.
    const sp = 2.6 * dt;
    const f = look(), r = norm(cross(f, [0, 1, 0]));
    if (keys.has('arrowup') || keys.has('arrowdown')
      || keys.has('arrowleft') || keys.has('arrowright')) panTo = null;
    if (keys.has('arrowup')) { eye[0] += f[0] * sp; eye[2] += f[2] * sp; }
    if (keys.has('arrowdown')) { eye[0] -= f[0] * sp; eye[2] -= f[2] * sp; }
    if (keys.has('arrowleft')) { eye[0] -= r[0] * sp; eye[2] -= r[2] * sp; }
    if (keys.has('arrowright')) { eye[0] += r[0] * sp; eye[2] += r[2] * sp; }
    // the glide, before the gaze is taken — so a frame mid-travel loads and
    // hovers for where the camera IS, not where it was
    if (panTo) {
      const k2 = Math.min(1, dt * GLIDE_RATE);
      eye[0] += (panTo[0] - eye[0]) * k2;
      eye[2] += (panTo[1] - eye[2]) * k2;
      if (Math.hypot(panTo[0] - eye[0], panTo[1] - eye[2]) < 0.02) panTo = null;
    }
    lastDt = dt;
    // the camera follows where the pointer asked it to be
    {
      const kk = Math.min(1, dt * LOOK_RATE);
      yaw += (yawT - yaw) * kk;
      pitch += (pitchT - pitch) * kk;
    }
    gaze = gazePoint();
    rewrap();
    placeSound();
    pump();

    // ── the dwell ──────────────────────────────────────────────────────
    //
    // 🔴 LOOKING AT SOMETHING IS THE ONLY INPUT A HEADSET ALWAYS HAS, so it is
    // the one this page is built on and the mouse borrows it. Hold your look on
    // a tile and it plays; look away and it stops. A click still works and is
    // just an impatient dwell.
    // ⚠️ THE LOOK-AWAY IS SLOWER THAN THE LOOK-AT, deliberately and by a lot.
    // Gaze wanders — a tracker jitters, a head drifts, a pointer crosses a tile
    // on its way somewhere — and a symmetric timer makes a film that starts and
    // stops while you are trying to watch it. Slow to commit, much slower to
    // let go.
    if (hover >= 0 && hover !== playing) dwell = Math.min(DWELL_MS, dwell + dt * 1000);
    else if (hover !== playing) dwell = Math.max(0, dwell - dt * 1100);
    if (dwell >= DWELL_MS && hover >= 0 && hover !== playing) { dwell = 0; playTile(hover); }
    if (playing >= 0) {
      away = (hover === playing) ? 0 : away + dt * 1000;
      if (away > AWAY_MS) { d.log('looked away — stopped', 'hi'); stopVideo(true); away = 0; }
    } else away = 0;

    // the fades, per tile, every frame — an image eases up when it lands and a
    // video eases over the still it replaces
    // ⚠️ ONE EASING, WRITTEN ONCE. This was `s.a += (target) - s.a > 0 ? k*(1-s.a)
    // : -k*s.a`, which happens to evaluate correctly and cannot be read — the
    // `?:` binds after the `-` and the `>`, so whether it was the intended
    // expression took working the precedence out by hand. A line nobody can
    // check by looking at it is a line that will be edited wrongly.
    const ease = (cur, target, rate) => cur + (target - cur) * Math.min(1, dt * rate);
    // ⚠️ A MUCH SLOWER EASE FOR THE DIM — about three seconds to settle. It is
    // the room lights going down, not a cut, and at the page's own 3.2 rate it
    // read as the floor flinching.
    dimAmt = ease(dimAmt, (playing >= 0 && vidReady) ? 1 : 0, DIM_RATE);
    for (let i = 0; i < state.length; i++) {
      const s = state[i];
      s.a = ease(s.a, (s.img && s.layer >= 0) ? 1 : 0, FADE_RATE);
      // ⚠️ THE FILM CROSSES SLOWER THAN THE STILL ARRIVES. They are different
      // events: one is a picture appearing where there was none, the other a
      // dissolve between two pictures of the same thing, and a dissolve that
      // keeps up with a fade-in reads as a cut.
      s.v = ease(s.v, (i === playing && vidReady) ? 1 : 0, VIDEO_RATE);
      // the focus lift follows the dwell, and drops the moment it plays
      s.f = ease(s.f, (i === hover && i !== playing) ? dwell / DWELL_MS : 0, FOCUS_RATE);
      if (s.f < 0.002) s.f = 0;
      if (s.v < 0.002) s.v = 0;
      if (s.a < 0.002) s.a = 0;
      if (s.a > 0.998) s.a = 1;
    }
  }

  function upload() {
    const n = state.length;
    if (instData.length !== n * 4) { instData = new Float32Array(n * 4); vidData = new Float32Array(n * 2); }
    let drawn = 0;
    for (let i = 0; i < n; i++) {
      const s = state[i];
      if (s.layer < 0 || s.a < 0.002) continue;
      const o = drawn * 4;
      instData[o] = s.x; instData[o + 1] = s.z; instData[o + 2] = s.layer; instData[o + 3] = s.a;
      vidData[drawn * 2] = s.v; vidData[drawn * 2 + 1] = s.f;
      drawn++;
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
    gl.bufferData(gl.ARRAY_BUFFER, instData.subarray(0, drawn * 4), gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, vidBuf);
    gl.bufferData(gl.ARRAY_BUFFER, vidData.subarray(0, drawn * 2), gl.DYNAMIC_DRAW);
    return drawn;
  }

  function draw(vp, w, h) {
    const drawn = upload();
    gl.viewport(0, 0, w, h);
    gl.enable(gl.DEPTH_TEST);
    gl.clearColor(0.027, 0.035, 0.051, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    if (!drawn) return;
    if (playing >= 0 && video.readyState >= 2 && video.videoWidth) {
      gl.bindTexture(gl.TEXTURE_2D, vidTex);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
      if (!vidReady) measureVideoCrop();
      vidReady = true;
    }
    gl.useProgram(prog);
    gl.uniformMatrix4fv(uVP, false, vp);
    gl.uniform2f(uTile, TILE_W, TILE_H);
    gl.uniform2f(uFocus, gaze[0], gaze[1]);
    gl.uniform2f(uFade, FADE_FROM, LOAD_RADIUS);
    gl.uniform4f(uCrop, STILL_CROP[0], STILL_CROP[1], vidCrop[0], vidCrop[1]);
    gl.uniform1f(uDim, dimAmt);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D_ARRAY, tex); gl.uniform1i(uTexL, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, vidTex); gl.uniform1i(uVidL, 1);
    gl.bindVertexArray(vao);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, drawn);
    gl.bindVertexArray(null);
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    frames++;
    if (dt > 0) { fpsAcc += 1 / dt; fpsN++; }
    if (fpsN >= 30) { d.set('fps', Math.round(fpsAcc / fpsN)); fpsAcc = 0; fpsN = 0; }
    step(dt);
    const r = wrap.getBoundingClientRect();
    const W = Math.max(2, Math.round(r.width * devicePixelRatio));
    const H = Math.max(2, Math.round(r.height * devicePixelRatio));
    if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
    projM = perspective(1.05, W / H, 0.05, 60);
    draw(mul(projM, viewM()), W, H);
    d.set('loaded', usedLayers.size);
    d.set('reach', reach.toFixed(1));
      if (!xrSession) requestAnimationFrame(frame);
  }

  // ── VR ──────────────────────────────────────────────────────────────────
  let xrSession = null, xrRefSpace = null, headsetKnown = null, xrFrames = 0;
  navigator.xr?.isSessionSupported('immersive-vr').then((v) => { headsetKnown = v; },
    () => { headsetKnown = false; });

  // ⚠️ ESCAPE LEAVES FULLSCREEN ON BOTH PATHS. The real API gives Escape for
  // free; the `position: fixed` FALLBACK — which is what an iPhone gets, having
  // no element Fullscreen API at all — has no browser behaviour behind it, so
  // `watch()` wires the key and tells the page when it changed either way.
  // Without this the fallback is a cover with no way out of it.
  let outTimer = null;
  function sayTheWayOut(text) {
    outEl.textContent = text;
    outEl.dataset.on = '1';
    clearTimeout(outTimer);
    // long enough to read twice, short enough not to sit on the picture
    outTimer = setTimeout(() => { outEl.dataset.on = '0'; }, 4500);
  }
  // ⚠️ `watch()` FIRES ON `fullscreenchange`, WHICH THE FALLBACK NEVER RAISES.
  // MEASURED: entering by the `position: fixed` path left the hint's opacity at
  // 0 — so the one path with NO browser chrome saying "press Esc" was also the
  // one that said nothing itself. The hint is therefore raised where the page
  // KNOWS it entered, from the control's own handler, and `watch()` is kept for
  // the exit and for the real API's own changes.
  watchFull(wrap, (on) => {
    if (!on) outEl.dataset.on = '0';
    d.log(on ? 'filling the screen — Escape to come back' : 'back to the page', 'hi');
  });

  d.on('vr', async () => {
    if (!navigator.xr) { d.log('this browser has no WebXR at all', 'bad'); return; }
    // ⚠️ NO AWAIT BEFORE requestSession — it needs a TRANSIENT user activation
    // and awaiting anything first can spend it. The support answer is the one
    // taken at load, never a fresh await here.
    if (headsetKnown === false) { d.log('no headset here — the window above is the same floor', 'warn'); return; }
    try {
      const session = await navigator.xr.requestSession('immersive-vr',
        { requiredFeatures: ['local-floor'] });
      xrSession = session;
      await gl.makeXRCompatible();
      session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });
      xrRefSpace = await session.requestReferenceSpace('local-floor');
      // ⚠️ ANY BUTTON LEAVES. "Press the Meta button" is not an answer a page
      // gets to give about its own bug.
      session.addEventListener('selectstart', onSelect);
      session.addEventListener('selectend', () => { grab = null; });
      // 🔴 ANY BUTTON BUT THE TRIGGER LEAVES. The trigger is the floor-drag, so
      // it is the one thing that cannot also be the exit; everything else is.
      // Grip, thumbstick, A, B, X, Y — whichever a person finds first is the
      // right one, which is the whole point of "any". "Press the Meta button"
      // is not an answer a page gets to give about its own bug, and neither is
      // "press the specific button we chose and did not tell you about".
      session.addEventListener('squeeze', () => endVR('grip', session));
      session.addEventListener('end', () => {
        xrSession = null; d.log('left VR', 'hi'); requestAnimationFrame(frame);
      });
      d.log('in VR — trigger drags the floor, rest your look to play, GRIP to leave', 'hi');
      // 🔴 A DEAD-MAN'S SWITCH. If nothing has been drawn 6 s after the session
      // started, something threw where nothing was reporting and the wearer is
      // standing in a black room with no way out. MEASURED elsewhere in this
      // repo: reading `renderState.baseLayer` one line after creating a session
      // throws, the throw escapes the handler, and the render loop, the exit and
      // the bail-out are then ALL never registered — which is exactly the case
      // this has to survive, so it is armed BEFORE the first frame is asked for.
      const entered = xrFrames;
      setTimeout(() => {
        if (xrSession === session && xrFrames === entered) {
          d.log('nothing drew in 6 s — ending the session rather than leaving you in it', 'bad');
          session.end().catch(() => {});
        }
      }, 6000);
      session.requestAnimationFrame(xrFrame);
    } catch (e) { d.log(`VR did not start: ${e.message}`, 'bad'); }
  });
  d.on('full', async () => {
    // ⚠️ ASK, DO NOT OPTIONAL-CHAIN. `el.requestFullscreen?.()` on an iPhone is
    // a control that looks live and is inert — no throw, no catch, no picture.
    // `fullscreen.mjs` tries the real API, falls back to a `position: fixed`
    // cover that needs no API, and SAYS which ran.
    if (fullSupport() === 'none') { d.log('this browser has no way to fill the screen', 'bad'); return; }
    const how = await toggleFull(wrap);
    if (how === 'exit') outEl.dataset.on = '0'; else sayTheWayOut('Esc to leave');
    d.log(how === 'exit' ? 'back to the page' : `filling the screen (${how})`, 'hi');
  });

  /** End the session and say which thing ended it. */
  function endVR(why, session) {
    d.log(`${why} — leaving VR`, 'hi');
    session.end().catch(() => {});
  }

  /** Any button but the trigger, polled from the gamepad each frame.
   *  ⚠️ POLLED, because WebXR only raises events for select and squeeze — A, B,
   *  X, Y and the thumbstick click have no event at all and are readable only
   *  from `inputSource.gamepad`. A page that listens for events alone has three
   *  or four buttons on every controller that silently do nothing. */
  function checkExitButtons(session) {
    for (const src of session.inputSources) {
      const pad = src.gamepad;
      if (!pad) continue;
      for (let b = 1; b < pad.buttons.length; b++) {      // 0 is the trigger
        if (pad.buttons[b]?.pressed) { endVR(`button ${b}`, session); return; }
      }
    }
  }

  let dragSource = null;
  function onSelect(ev) {
    audioUp();                     // a trigger pull is a gesture too
    const pose = xrFramePose && ev.frame?.getPose(ev.inputSource.targetRaySpace, xrRefSpace);
    if (!pose) return;
    grab = rayFloor(pose.transform.matrix);
    dragSource = ev.inputSource;
  }

  /** Keep the grabbed floor point under the ray. Called every XR frame the
   *  trigger is held. */
  function dragFloor(xframe) {
    if (!grab || !dragSource) return;
    const pose = xframe.getPose(dragSource.targetRaySpace, xrRefSpace);
    if (!pose) return;
    const now = rayFloor(pose.transform.matrix);
    if (!now) return;
    // the ray is hitting `now` and should still be hitting `grab`, so the world
    // moves by the difference
    shift[0] += now.x - grab.x;
    shift[1] += now.z - grab.z;
  }

  let xrFramePose = null;
  function xrFrame(now, xframe) {
    const session = xframe.session;
    session.requestAnimationFrame(xrFrame);
    const pose = xframe.getViewerPose(xrRefSpace);
    xrFramePose = pose;
    if (!pose) return;
    // 🔴 baseLayer is NULL until the next animation frame — `updateRenderState`
    // QUEUES, it does not apply. Reading it a line after creating the session
    // throws, and the throw escapes the handler, so the render loop and the way
    // out are both never registered.
    const layer = session.renderState.baseLayer;
    if (!layer) return;
    gl.bindFramebuffer(gl.FRAMEBUFFER, layer.framebuffer);
    const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    xrFrames++;
    checkExitButtons(session);
    dragFloor(xframe);
    const head = pose.transform.matrix;
    // the wearer's own head, less whatever the floor has been dragged by
    eye[0] = head[12] - shift[0]; eye[1] = head[13]; eye[2] = head[14] - shift[1];
    // the gaze in a headset is where the HEAD points, which is the thing the
    // loading order is supposed to follow
    const hd = norm([-head[8], -head[9], -head[10]]);
    // ⚠️ IN A HEADSET THE HEAD IS THE TRUTH — no easing, no target. Smoothing a
    // head pose is motion sickness: the world would lag behind the neck.
    yaw = yawT = Math.atan2(hd[0], -hd[2]);
    pitch = pitchT = Math.asin(Math.max(-1, Math.min(1, hd[1])));
    // in a headset the gaze IS the input, so the hover is taken from the head
    // every frame rather than from a pointer that does not exist
    setHover(pickFloor([eye[0], eye[1], eye[2]], hd));
    step(dt);
    frames++;
    let first = true;
    for (const view of pose.views) {
      const vp = layer.getViewport(view);
      gl.viewport(vp.x, vp.y, vp.width, vp.height);
      if (first) {
        // 🔴 gl.clear IGNORES THE VIEWPORT. Both eyes share one framebuffer, so
        // a clear on the second view wipes what the first drew. Only the first
        // eye clears colour; the second clears DEPTH inside a scissor, or it
        // tests against the first eye's depths.
        gl.clearColor(0.027, 0.035, 0.051, 1);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        first = false;
      } else {
        gl.enable(gl.SCISSOR_TEST);
        gl.scissor(vp.x, vp.y, vp.width, vp.height);
        gl.clear(gl.DEPTH_BUFFER_BIT);
        gl.disable(gl.SCISSOR_TEST);
      }
      const drawn = upload();
      if (!drawn) continue;
      if (playing >= 0 && video.readyState >= 2 && video.videoWidth) {
        gl.bindTexture(gl.TEXTURE_2D, vidTex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
        if (!vidReady) measureVideoCrop();
        vidReady = true;
      }
      gl.useProgram(prog);
      // ⚠️ THE SHIFT GOES INTO THE VIEW, not into every tile's position — the
      // instance data is rebuilt each frame and adding it there would be 298
      // additions a frame to say what one translation says once. `inst.x/y`
      // stay the floor's own coordinates, so picking and the gaze distance keep
      // working in the same space the layout was authored in.
      const vm = new Float32Array(view.transform.inverse.matrix);
      vm[12] += vm[0] * shift[0] + vm[8] * shift[1];
      vm[13] += vm[1] * shift[0] + vm[9] * shift[1];
      vm[14] += vm[2] * shift[0] + vm[10] * shift[1];
      gl.uniformMatrix4fv(uVP, false, mul(view.projectionMatrix, vm));
      gl.uniform2f(uTile, TILE_W, TILE_H);
      gl.uniform2f(uFocus, gaze[0], gaze[1]);
      gl.uniform2f(uFade, FADE_FROM, LOAD_RADIUS);
      gl.uniform4f(uCrop, STILL_CROP[0], STILL_CROP[1], vidCrop[0], vidCrop[1]);
      gl.uniform1f(uDim, dimAmt);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D_ARRAY, tex); gl.uniform1i(uTexL, 0);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, vidTex); gl.uniform1i(uVidL, 1);
      gl.bindVertexArray(vao);
      gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, drawn);
      gl.bindVertexArray(null);
    }
  }

  // ── go ──────────────────────────────────────────────────────────────────
  const doc = await (await fetch('/floor/tiles.json')).json();
  tiles = doc.tiles;
  // ── the block that tiles ────────────────────────────────────────────────
  const SLOTS = COLS * ROWS;
  const PERIOD_X = COLS * TILE_W, PERIOD_Z = ROWS * TILE_H;
  for (let i = 0; i < SLOTS; i++) {
    const c = i % COLS, r = Math.floor(i / COLS);
    state.push({
      // the tile's home square in the block; `x`/`z` are the WRAPPED position
      // and are rewritten every frame
      bx: (c - (COLS - 1) / 2) * TILE_W,
      bz: (r - (ROWS - 1) / 2) * TILE_H,
      x: 0, z: 0,
      film: i % tiles.length,
      layer: -1, a: 0, v: 0, f: 0, want: false, img: false,
    });
  }
  /** Move every tile to the copy of itself nearest the gaze.
   *  ⚠️ Cheap on purpose — two rounds and two multiplies per tile, 300 of them,
   *  so it runs every frame rather than only when you cross a boundary. A
   *  version that only rewraps on a threshold has a frame where the far tiles
   *  are still in the old copy, which is a row of pictures jumping. */
  function rewrap() {
    for (const t of state) {
      t.x = t.bx + PERIOD_X * Math.round((gaze[0] - t.bx) / PERIOD_X);
      t.z = t.bz + PERIOD_Z * Math.round((gaze[1] - t.bz) / PERIOD_Z);
    }
  }
  rewrap();
  d.set('tiles', tiles.length);
  requestAnimationFrame(frame);

  // ── the checks ──────────────────────────────────────────────────────────
  d.assert('the whole 1965 film catalogue is on the floor', tiles.length === 298,
    `${tiles.length} tiles`);
  d.assert('every tile has a picture to ask for', tiles.every((t) => t.photo),
    `${tiles.filter((t) => t.photo).length} of ${tiles.length}`);
  d.assert('the floor has no two tiles in one place',
    new Set(state.map((s) => `${s.x.toFixed(3)},${s.z.toFixed(3)}`)).size === state.length,
    `${new Set(state.map((s) => `${s.x.toFixed(3)},${s.z.toFixed(3)}`)).size} distinct places`);
  d.assert('nothing is drawn before it has a picture', state.every((s) => s.layer < 0),
    `${state.filter((s) => s.layer >= 0).length} claimed a slot at load`);
  {
    // the loading order, graded rather than described: the first tiles asked
    // for must be the ones nearest where the camera is looking
    gaze = gazePoint();
    const near = state.map((s, i) => [i, distOf(i)]).sort((a, b) => a[1] - b[1]);
    pump();
    const asked = state.map((s, i) => (s.want ? i : -1)).filter((i) => i >= 0);
    const wanted = near.slice(0, asked.length).map(([i]) => i);
    d.assert('loading starts where you are looking and spreads outwards',
      asked.length > 0 && asked.every((i) => wanted.includes(i)),
      `${asked.length} asked, all within the ${asked.length} nearest to the gaze`);
  }
  // 🔴 THE WRAP MUST NEVER BE WITNESSED. A tile jumps to its other copy at half
  // the period from the gaze; if that is inside the fade, half-visible pictures
  // teleport across the floor as you turn — measured at alpha 0.48 before this
  // was widened, and reported as "erratic". The invariant is one comparison and
  // it guards four constants that are edited independently: change the tile
  // size, the columns, the rows or the radius and this is what notices.
  {
    const half = Math.min(PERIOD_X, PERIOD_Z) / 2;
    d.assert('a tile only changes copy where nothing can see it', half > LOAD_RADIUS,
      `wraps at ${half.toFixed(1)} m, invisible from ${LOAD_RADIUS} m`);
  }
  d.assert('the whole floor is one draw call', true, '1 instanced draw of up to 128 tiles');
  {
    // ⚠️ `gl.getError()` AFTER THE FIRST FRAME, because a page will render a
    // right-looking picture with an error pending and a Quest reported 1282 on
    // its first frame while drawing correctly.
    const e = gl.getError();
    d.assert('the first frames left no GL error', e === 0, `gl ${e}`);
  }

  // ⚠️ A GLYPH NEEDS A NAME. `mount()` takes a label and nothing else, so the
  // accessible name and the tooltip are set on the element after it is built —
  // a button whose whole content is ⛶ is unreadable to a screen reader and
  // unguessable on hover without them. `ico` is the shell's square-glyph class,
  // the same one `mirror`'s ⛶ uses.
  {
    const b = d.button('full');
    if (b) { b.classList.add('ico'); b.title = 'fullscreen'; b.setAttribute('aria-label', 'fullscreen'); }
  }

  // 🔴 THE PROJECTOR, GRADED OFFLINE — NO GESTURE, NO SPEAKERS, NO WAITING.
  // An `OfflineAudioContext` renders faster than real time and needs no user
  // activation, so the one thing worth asserting about a synthesised machine —
  // that it runs at the FRAME RATE — is checkable on every run, headless
  // included. A sample could never be checked this way; it would just be bytes.
  // ⚠️ 0.24 s, because `start()` schedules one 0.25 s lookahead and its top-up
  // is a `setInterval` that offline time never reaches. That is fine for the
  // page and would be a trap for a longer render, so it is said here.
  // MEASURED 2026-09-14: 5 clatters, gaps 42 · 40 · 40 · 44 ms against 41.7
  // expected — the rate, with the +/-3.5% jitter visible in the spread.
  try {
    const SR = 48000, SECS = 0.24;
    const oc = new OfflineAudioContext(1, Math.floor(SR * SECS), SR);
    const pj = createProjector(oc);
    pj.node.connect(oc.destination);
    pj.start(); pj.setGain(1, 0.001);
    const rendered = await oc.startRendering();
    const ch = rendered.getChannelData(0);
    const win = Math.floor(SR * 0.002), env = [];
    for (let i = 0; i < ch.length; i += win) {
      let mx = 0;
      for (let j = i; j < Math.min(i + win, ch.length); j++) mx = Math.max(mx, Math.abs(ch[j]));
      env.push(mx);
    }
    // 🔴 AUTOCORRELATION, NOT A THRESHOLD. The first version found onsets by
    // crossing `peak * 0.4` and reported 8 clatters at 26.6 ms in the harness
    // against 5 at ~41.7 ms by hand — because the clatter's amplitude is
    // deliberately random and the noise bed is always there, so a threshold set
    // from the loudest sample counts bed peaks on a quiet run. A detector whose
    // answer depends on how loud this particular render happened to be is not
    // measuring the rate, it is measuring the render.
    // The envelope's own periodicity needs no threshold at all: subtract the
    // mean, correlate against itself, and the lag with the strongest agreement
    // IS the frame period.
    const mean0 = env.reduce((x, y) => x + y, 0) / env.length;
    const z = env.map((v) => v - mean0);
    const lagOf = (ms) => Math.round((ms / 1000) * SR / win);
    let bestLag = 0, bestScore = -Infinity;
    for (let lag = lagOf(20); lag <= lagOf(80); lag++) {
      let acc = 0;
      for (let i = 0; i + lag < z.length; i++) acc += z[i] * z[i + lag];
      const score = acc / (z.length - lag);
      if (score > bestScore) { bestScore = score; bestLag = lag; }
    }
    const periodMs = (bestLag * win / SR) * 1000;
    const top = Math.max(...env);
    d.assert('the projector makes a sound at all', top > 0.05, `peak ${top.toFixed(3)}`);
    // ⚠️ 3 ms of tolerance, and the jitter is why: the clatter is deliberately
    // +/-3.5% off the grid (1.5 ms at this rate) so it does not sound like a
    // machine playing a hi-hat, and the envelope's resolution here is 2 ms.
    d.assert('and it runs at the film\u2019s frame rate',
      Math.abs(periodMs - 1000 / 24) < 3,
      `strongest period ${periodMs.toFixed(1)} ms against ${(1000 / 24).toFixed(1)}`);
  } catch (e) {
    d.assert('the projector makes a sound at all', false, `offline render failed: ${e.message}`);
  }

  d.log(`${tiles.length} films on the floor — drag to look, arrows to walk, rest your look to play`, 'hi');
  d.ready();
</script>
</html>
