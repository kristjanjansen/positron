<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; margin: 0 0 10px; }
  .cell { position: relative; aspect-ratio: 16/9; background: #000; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .cell.me { border-color: var(--hi); }
  .cell video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cell .lbl { position: absolute; left: 5px; bottom: 4px; font: 600 10px/1.4 var(--mono);
               color: var(--fg); background: #0b0e14aa; border-radius: 3px; padding: 1px 5px; }
  .cell.me .lbl { color: #0b0e14; background: var(--hi); }
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';

  const ROOM = new URLSearchParams(location.search).get('room') || 'room-demo';
  const ID = Math.random().toString(36).slice(2, 8);
  const RELAY = `wss://ws.positron.studio/room/${ROOM}/ws`;

  const d = mount({
    n: '10',
    name: 'room',
    what: 'Join a room and see the others. Peer to peer; the relay only carries signalling.',
    readout: { peers: '', connected: '', join: 'ms', room: '' },
    controls: [
      { id: 'join', label: 'Join the room', primary: true },
      { id: 'check', label: 'Run the checks' },
    ],
  });
  guard(d);
  d.set('room', ROOM);

  const grid = el('div', 'grid');
  d.el.append(grid);

  function tile(id, me) {
    const cell = el('div', `cell${me ? ' me' : ''}`);
    const v = el('video', '', null, { playsinline: '', autoplay: '' });
    if (me) v.muted = true;
    cell.append(v, el('span', 'lbl', me ? `${id} (you)` : id));
    grid.append(cell);
    return { cell, video: v };
  }

  let ws = null, local = null, joinedAt = 0, firstRemoteMs = null;
  const tiles = new Map();
  const pcs = new Map();

  /**
   * A camera is not the point of this demo and asking for one is a permission
   * prompt in the way. A canvas stream is a real MediaStreamTrack — it
   * negotiates, encodes and arrives exactly like a webcam — so the peer path is
   * tested without needing a device at all.
   */
  function localStream() {
    const c = el('canvas');
    c.width = 320; c.height = 180;
    const g = c.getContext('2d');
    let f = 0;
    setInterval(() => {
      f++;
      g.fillStyle = '#11151d'; g.fillRect(0, 0, 320, 180);
      g.fillStyle = '#ffd400';
      g.font = 'bold 22px ui-monospace, monospace';
      g.fillText(ID, 16, 40);
      g.font = '13px ui-monospace, monospace';
      g.fillStyle = '#8b93a1';
      g.fillText(new Date().toISOString().slice(11, 23), 16, 66);
      g.fillRect(16, 90, (f * 3) % 288, 6);
    }, 100);
    return c.captureStream(10);
  }

  const send = (o) => { if (ws?.readyState === 1) ws.send(JSON.stringify({ ...o, from: ID })); };

  async function offerTo(peer) {
    if (pcs.has(peer)) return;
    const pc = new RTCPeerConnection();
    pcs.set(peer, pc);
    for (const t of local.getTracks()) pc.addTrack(t, local);
    pc.onicecandidate = (e) => { if (e.candidate) send({ t: 'ice', to: peer, c: e.candidate }); };
    pc.ontrack = (e) => attach(peer, e.streams[0]);
    pc.onconnectionstatechange = () => { d.log(`${peer}: ${pc.connectionState}`); paint(); };
    const o = await pc.createOffer();
    await pc.setLocalDescription(o);
    send({ t: 'offer', to: peer, sdp: o.sdp });
  }

  function attach(peer, stream) {
    if (!tiles.has(peer)) tiles.set(peer, tile(peer, false));
    tiles.get(peer).video.srcObject = stream;
    if (firstRemoteMs === null && joinedAt) {
      firstRemoteMs = performance.now() - joinedAt;
      d.set('join', firstRemoteMs);
    }
    paint();
  }

  function paint() {
    const conn = [...pcs.values()].filter((p) => p.connectionState === 'connected').length;
    d.set('peers', pcs.size);
    d.set('connected', conn, conn === pcs.size && pcs.size > 0 ? 'ok' : '');
  }

  d.on('join', async () => {
    if (ws) return;
    local = localStream();
    tiles.set(ID, tile(ID, true));
    tiles.get(ID).video.srcObject = local;
    await tiles.get(ID).video.play().catch(() => {});
    joinedAt = performance.now();

    ws = new WebSocket(RELAY);
    ws.onopen = () => { d.log(`joined ${ROOM} as ${ID}`, 'hi'); send({ t: 'hello' }); };
    ws.onmessage = async (e) => {
      let m; try { m = JSON.parse(e.data); } catch { return; }
      if (m.from === ID) return;                       // the relay echoes to us too
      if (m.to && m.to !== ID) return;
      if (m.t === 'hello') { send({ t: 'here' }); offerTo(m.from); return; }
      if (m.t === 'here') { offerTo(m.from); return; }
      if (m.t === 'offer') {
        const pc = new RTCPeerConnection();
        pcs.set(m.from, pc);
        for (const t of local.getTracks()) pc.addTrack(t, local);
        pc.onicecandidate = (ev) => { if (ev.candidate) send({ t: 'ice', to: m.from, c: ev.candidate }); };
        pc.ontrack = (ev) => attach(m.from, ev.streams[0]);
        pc.onconnectionstatechange = () => paint();
        await pc.setRemoteDescription({ type: 'offer', sdp: m.sdp });
        const a = await pc.createAnswer();
        await pc.setLocalDescription(a);
        send({ t: 'answer', to: m.from, sdp: a.sdp });
        return;
      }
      if (m.t === 'answer') {
        await pcs.get(m.from)?.setRemoteDescription({ type: 'answer', sdp: m.sdp });
        return;
      }
      if (m.t === 'ice') { try { await pcs.get(m.from)?.addIceCandidate(m.c); } catch { /* late */ } }
    };
    addEventListener('pagehide', () => { try { ws.close(); } catch { /* gone */ } });
  });

  d.on('check', async () => {
    // readyState 0 is CONNECTING, not broken — wait for the handshake rather
    // than asserting against a race
    for (let i = 0; i < 30 && ws && ws.readyState === 0; i++) await new Promise((r) => setTimeout(r, 100));
    d.assert('relay open for signalling', ws?.readyState === 1, String(ws?.readyState));
    d.assert('a local track exists', !!local && local.getTracks().length > 0,
      `${local?.getTracks().length ?? 0} track(s)`);
    d.assert('own tile rendered', tiles.has(ID));
    d.assert('media is peer to peer, not relayed',
      [...pcs.values()].every((p) => p.connectionState !== 'failed'),
      `${pcs.size} peer(s)`);
    d.log(`open this page again with ?room=${ROOM} to see a second tile`);
  });

  d.ready();
</script>
</html>
