<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* A row of squares, one per beat, always the same height whatever is
     happening — the one thing on this page that redraws several times a
     second. No margins of its own: shell.css owns the vertical rhythm. */
  .pulse { display: flex; gap: 4px; }
  .pulse i { flex: 1; height: 46px; border-radius: 3px; background: var(--card2); border: 1px solid var(--line); }
  .pulse i.on { background: var(--hi); border-color: var(--hi); }
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createPeer, wsTransport } from '/proto/looper/peer.mjs';

  const ROOM = new URLSearchParams(location.search).get('room') || 'jam-demo';
  const ID = Math.random().toString(36).slice(2, 8);
  const RELAY = `wss://ws.positron.studio/room/${ROOM}/ws`;
  const BEATS = 8, LOOP = 2000;

  const d = mount({
    name: 'jam',
    what: 'Two browsers counting the same eight beats out loud, without either '
        + 'of them leading. Press Start audio and join, then open this page a '
        + 'second time — in another tab, or on a phone — and the two click '
        + 'together. The offset is how far this browser\'s clock had to be '
        + 'moved to agree with the others, and the round trip is how long a '
        + 'message takes to reach one of them and come back.',
    readout: { offset: 'ms', 'round trip': 'ms', others: '', beat: '' },
    controls: [
      { id: 'start', label: 'Start audio and join', primary: true },
      { id: 'check', label: 'Run the checks' },
    ],
  });
  guard(d);

  const bar = el('div', 'pulse');
  const cells = [];
  for (let i = 0; i < BEATS; i++) { const c = el('i'); cells.push(c); bar.append(c); }
  d.el.append(bar);

  let ctx = null, peer = null, timer = null, lastBeat = -1, fired = 0;
  // `null`, not `''` — alone the roster string IS empty, so starting it empty
  // meant the first state was never reported and the log said nothing at all
  // about being on your own.
  let roster = null;

  function click(at) {
    if (!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 880; o.type = 'square';
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(0.25, at + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.05);
    o.connect(g); g.connect(ctx.destination);
    o.start(at); o.stop(at + 0.06);
    fired++;
  }

  d.on('start', async () => {
    if (peer) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    await ctx.resume();

    // THE CLOCK IS THE WHOLE DIFFERENCE. performance.now() is private to a
    // document — two of them cannot be compared at all — and a relay's own idea
    // of the time measured +/-50 ms of bias, which at a 2 s loop is 2.5 % of the
    // circle and an audible flam. So peer.mjs runs an NTP-style exchange, keeps
    // only the fastest sample, and elects the lowest peer id as reference.
    peer = createPeer({ id: ID, transport: wsTransport(RELAY) });
    d.log(`joined ${ROOM} as ${ID}`, 'hi');

    // Everyone derives the same grid from the shared clock, so nobody leads.
    timer = setInterval(() => {
      const now = peer.now();
      const beat = Math.floor((now % LOOP) / (LOOP / BEATS));
      if (beat === lastBeat) return;
      lastBeat = beat;
      cells.forEach((c, i) => c.classList.toggle('on', i === beat));
      click(ctx.currentTime + 0.02);
      d.set('beat', `${beat + 1}/${BEATS}`);
    }, 12);

    // 🔴 NO PARAGRAPH OF WHO IS HERE. This page used to rewrite one line per
    // peer twice a second — `<b>tbko31</b> rtt 12.4ms offset -3.1ms` — so the
    // block changed its own height as people came and went, and a reader had
    // to re-read a sentence to find a digit that had moved. Every figure in it
    // is in a cell above; who is in the room is a state CHANGE, so it goes in
    // the log, once, when it changes.
    setInterval(() => {
      const ps = peer.peers();
      // ⚠️ BLANK, NOT 0, WHEN NOBODY ELSE IS HERE. `offsetMs()` really does
      // return exactly 0 alone — with no peer there is nothing to correct to,
      // and inventing a correction would be the bug the check below guards —
      // but a cell reading `0 ms` claims a correction was measured and came out
      // at nothing. There is no measurement until somebody else turns up.
      d.set('offset', ps.length ? peer.offsetMs() : '');
      d.set('others', ps.length);
      const best = ps.filter((p) => Number.isFinite(p.rttMs) && p.rttMs < Infinity);
      d.set('round trip', best.length ? Math.min(...best.map((p) => p.rttMs)) : '');
      const now = ps.map((p) => p.id).sort().join(' ');
      if (now !== roster) {
        roster = now;
        d.log(ps.length
          ? `in the room: ${ps.map((p) => `${p.id} ${Number.isFinite(p.rttMs) ? `${p.rttMs.toFixed(1)} ms away` : 'not timed yet'}`).join(' · ')}`
          : 'alone in the room — open this page again for a second player', 'hi');
      }
    }, 500);
  });

  d.on('check', () => {
    d.assert('audio running', !!ctx && ctx.state === 'running', ctx?.state ?? 'none');
    d.assert('peer joined', !!peer, peer ? ID : 'no');
    d.assert('shared clock is not the local one', !!peer && peer.clock.domain === 'shared-epoch',
      peer?.clock.domain ?? 'none');
    d.assert('the pulse is running', fired > 0, `${fired} click(s)`);
    // THE PICTURE, GRADED AGAINST THE NUMBER. The squares are the only thing
    // this page draws, and nothing had ever asked whether the lit one is the
    // beat the shared clock is actually on.
    const lit = cells.findIndex((c) => c.classList.contains('on'));
    d.assert('the lit square is the beat the shared clock is on', lit === lastBeat && lit >= 0,
      `square ${lit + 1} lit, clock says ${lastBeat + 1} of ${BEATS}`);
    if (peer) {
      const ps = peer.peers();
      // alone, offset must be exactly 0: with no peer there is nothing to
      // correct to, and inventing a correction would be the bug
      if (ps.length === 0) d.assert('alone means zero offset', peer.offsetMs() === 0, String(peer.offsetMs()));
      else d.assert('offset estimated for every peer', ps.every((p) => Number.isFinite(p.offsetMs)), `${ps.length} peer(s)`);
    }
    d.log(`open again with ?room=${ROOM} for a second player`);
  });

  d.ready();
</script>
</html>
