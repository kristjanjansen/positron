  /**
   * Radio Tallinn 1965's three slot lengths, one of each, on a strip over a
   * local deck. research/radio-tallinn-1965-2026-08.md:7, *"fixed slots
   * (28/56/112 min)"*. One minute of schedule is 100 ms here, so the line
   * plays through in under twenty seconds and starts over. The order is this
   * slide's, not a published schedule.
   */
  function liveSlots(host) {
    const { inner, fit } = fitBox(host, 640);
    const SLOTS = [28, 56, 112];
    const MS = 100;
    let start = 0;
    const items = SLOTS.map((m, i) => {
      const it = { id: `slot${i}`, kind: 'mark', at: start * MS, payload: { label: `${m} min` } };
      start += m;
      return it;
    });
    const end = start * MS;
    const { adapter } = markAdapter({ rates: [1] });
    const tl = createTimeline({ items, adapters: { mark: adapter }, range: [0, end], tickHost: 'main' });
    const shelf = el('div');
    inner.append(shelf);
    const hi = getComputedStyle(document.documentElement).getPropertyValue('--hi').trim();
    const view = createStripView(shelf, tl, { lanes: [{ id: 'mark', kind: 'mark', label: 'slot starts', color: hi }] });
    view.strip.fit?.();
    let timer = 0;
    return {
      start() {
        tl.play(1);
        timer = setInterval(() => { if (tl.position() >= end - 50) tl.seek(0); }, 200);
      },
      stop() { clearInterval(timer); timer = 0; tl.pause(); },
      value: () => Math.round(tl.position()),
      subject: () => shelf,
      fit,
    };
  }

  /**
   * One link written the way the patchbay writes it, and notes going through
   * it. The line is `bay.mjs`'s own text form, printed back from what it
   * parsed, and every note is passed through `apply()`, the same function
   * the patchbay runs on a live link.
   */
  function liveRoute(host) {
    const link = parseLink('keys:out -> synth:in { transpose +7 }');
    const box = el('div');
    const line = el('p', 'sl-t sl-t2', printLink(link));
    const rows = el('div', 'sl-rows sl-t sl-t3');
    const rin = el('div', '', ''), rout = el('div', '', '');
    rows.append(rin, rout);
    box.append(line, rows);
    host.append(box);
    const NOTES = [60, 64, 67, 72];
    let n = 0, timer = 0;
    const show = () => {
      const ev = { cls: 'note', ch: 0, d1: NOTES[n % NOTES.length], d2: 100 };
      const out = apply(link.transforms, ev);
      rin.textContent = `note in   ${String(ev.d1).padStart(3)}`;
      rout.textContent = `note out  ${String(out.d1).padStart(3)}`;
      n++;
    };
    show();
    return {
      start() { show(); timer = setInterval(show, 250); },
      stop() { clearInterval(timer); timer = 0; },
      value: () => n,
      subject: () => box,
    };
  }

  /**
   * The stand-in's tone, drawn by the kit's wave view with its head going
   * round. demo/fake-station.mjs:50-69: two tones a fifth apart, 220 and
   * 330 Hz, the upper one swelling twice a second (`tremolo=f=2:d=0.9`).
   * Two seconds of it are made here at 8 kHz, which is enough for the
   * picture; nothing is fetched.
   */
  function liveTone(host) {
    const { inner, fit } = fitBox(host, 640);
    const wv = createWaveView(inner, { height: 200, label: 'the stand-in tone' });
    const rate = 8000, secs = 2;
    const s = new Float32Array(rate * secs);
    for (let i = 0; i < s.length; i++) {
      const t = i / rate;
      const swell = 1 - 0.9 * (0.5 + 0.5 * Math.cos(2 * Math.PI * 2 * t));
      s[i] = 0.45 * Math.sin(2 * Math.PI * 220 * t) + 0.45 * swell * Math.sin(2 * Math.PI * 330 * t);
    }
    wv.set(s, rate, { name: 'stand-in' });
    let t0 = 0, pos = 0;
    return {
      start() { t0 = performance.now(); wv.follow(() => (pos = ((performance.now() - t0) / 1000) % secs)); },
      stop() { wv.rest(); },
      value: () => pos.toFixed(3),
      subject: () => inner.querySelector('.pos-wave') || inner,
      fit,
    };
  }

      rows: { body: [['etv', 'newest 45 min'], ['etv2', 'oldest 78 min'], ['etvpluss', 'none']], align: 'll' },
      cap: 'refused part of each 2 h window, 13 points', link: 'flipper',
      notes: 'The playlists are open and the segments can be refused, by programme. There is no offset to hard code.' },
    // positron-streaming SKILL.md:941-948: a pass-through relay was one
    // listener at the broadcaster per browser, about a hundred concurrent
    // clients on 2026-09-15; one object per mount opens the origin once.
    { name: 'listeners', say: 'One connection per mount, not per tab',
      rows: { head: ['', 'upstream'], body: [['before', 'about 100'], ['after', '*1*']], align: 'lr' },
      cap: 'our tests had been counted as the station\'s listeners', link: 'radio',
      notes: 'ERR said our traffic was bending their listener statistics. The rule since: whose server it is, not which harm has been named yet.' },
    // research/cf-models-speech-to-patch-2026-09-21.md:243-244: Workers AI,
    // llama 3.3 70B, a patch from a sentence: loose schema 1.6 s, one branch
    // per operation 10.2 to 11.6 s and looping until the tokens ran out.
    { name: 'schema', say: 'A loose schema made it faster',
      stack: [['loose', '*1.6*', 's'], ['strict', '10.2', 's']],
      cap: 'Workers AI proposing patch links from a sentence', link: 'patchbay',
      notes: 'A schema constrains shape, not meaning. The loose one plus ordinary validation won, and a person presses before anything is linked.' },

    // ── what is next ──
    // HANDOFF.md:165 (the Formanta click test, flashing the real Pico 2 W) and
    // plans/plan-away-webrtc.md:216-217 (another network unmeasured).
    { name: 'next', say: 'Next is untested hardware',
      list: ['flash the Pico 2 W', '[Pi|Raspberry Pi] on another network', 'a drum machine click'],
      cap: 'carried over in the handoff', link: 'parts',
      notes: 'Each of these is a measurement that has not been made yet, and each will get a slide when it has.' },
  ];

  const deck = createDeck(d, { slides: SLIDES, hues: MACHINES });

  async function check() {
    const A = d.assert;
    const { t0 } = await checkDeck(deck, {
      range: [25, 35],
      kitLive: ['machines', 'clock', 'path', 'frames', 'slots', 'route', 'kit', 'tone'],
      minLive: 8, hueSlide: 'machines',
    });

    // Every caption links a demo that is built and deployed.
    const built = new Set(DEMOS.filter((r) => r.built).map((r) => r.name));
    const capped = deck.nodes.filter((n) => n.url);
    const dead = capped.filter((n) => {
      const slug = n.spec.link.split(/[/#]/)[0];
      return slug !== '' && !built.has(slug);
    });
    A('every caption links the full address of a demo that is a built row in the manifest',
      capped.length === deck.nodes.length && dead.length === 0,
      dead.map((n) => `${n.spec.name} ${n.url}`).join(', ')
        || `${capped.length} captions, ${new Set(capped.map((n) => n.spec.link.split(/[/#]/)[0] || 'front page')).size} pages`);

    // Each section opens on a statement.
    const st = deck.nodes.filter((n) => n.spec.statement).map((n) => n.spec.name);
    A('each section opens on a statement slide, and there are at least six',
      st.length >= 6 && deck.nodes[0].spec.statement, st.join(', '));

    // Speaker notes: on every slide, shown nowhere unless asked, and then
    // under the panel at the slide's step 1 in its face, following the slide.
    const noNotes = deck.nodes.filter((n) => !n.spec.notes).map((n) => n.spec.name);
    const asked = new URLSearchParams(location.search).get('notes') === '1';
    const hiddenBefore = getComputedStyle(deck.notesEl).display === 'none';
    deck.showNotes(true);
    deck.go(6); await frame();
    const nb = deck.notesEl.getBoundingClientRect(), pb = deck.panel.el.getBoundingClientRect();
    const capPx = parseFloat(getComputedStyle(deck.nodes[6].cap).fontSize);
    const notePx = parseFloat(getComputedStyle(deck.notesEl).fontSize);
    const face = getComputedStyle(deck.notesEl).fontFamily.includes(deck.face().family);
    const said6 = deck.notesEl.textContent === plain(deck.nodes[6].spec.notes);
    deck.go(7);
    const said7 = deck.notesEl.textContent === plain(deck.nodes[7].spec.notes);
    deck.showNotes(asked);
    A('every slide has speaker notes, and they are hidden unless the address asks for them',
      noNotes.length === 0 && (asked || hiddenBefore), noNotes.join(', ') || `${deck.nodes.length} notes, hidden ${hiddenBefore}`);
    A('asked for, the notes sit under the panel at the slide\'s step 1 in its face and follow the slide',
      nb.top >= pb.bottom - 0.5 && Math.abs(notePx - capPx) < 0.5 && face && said6 && said7,
      `${(nb.top - pb.bottom).toFixed(1)} px under, ${notePx.toFixed(2)} against ${capPx.toFixed(2)} px, face ${face}, follows ${said6 && said7}`);
    deck.go(0);
    d.log(`checks took ${(performance.now() - t0).toFixed(0)} ms`);
  }

  if (SELFCHECK) {
    try { await check(); } catch (e) { d.assert('the checks ran to the end', false, String(e?.stack || e)); }
  }
  d.ready();
</script>
