    d.assert('NEGATIVE CONTROL: with the class left off the slack is empty case, and it is reported',
      rNone.measured && rNone.growing.length === 0 && rNone.slack > 40
      && rNone.cuts.length === 1 && /panel-grow/.test(rNone.cuts[0]),
      `${rNone.slack.toFixed(1)} px of the flow empty, ${rNone.growing.length} children growing, `
      + `and it says "${(rNone.cuts[0] || 'nothing').slice(0, 64)}"`);

    /* 4. THE SCROLL BOUNDARY, COMPUTED, PLUS THE BORDER THAT MARKS IT. The
       border is the one line on a panel that survives the *separation is
       spacing, not lines* rule, and it has to be on the edge FACING the
       scroller: the left-hand column's RIGHT edge here, and `/twelve/`'s lane's
       left. MEASURED rather than read, because a border stripped by a rule
       nobody wrote is this project's fifth measured dead rule.
       ⚠️ AND THERE HAS TO BE SOMETHING TO SCROLL, or `overflow-x: auto` is a
       declaration about nothing. */
    const cs = getComputedStyle(panelWith.panel.strip);
    const cf = getComputedStyle(panelWith.panel.fixed);
    const over = panelWith.panel.strip.scrollWidth - panelWith.panel.strip.clientWidth;
    d.assert('the strip is the only scroller, with a floor of zero, and the border marks its edge',
      cs.overflowX === 'auto' && cs.minWidth === '0px'
      && parseFloat(cf.borderRightWidth) === 1 && parseFloat(cf.borderLeftWidth) === 0
      && over > 0
      && document.documentElement.scrollWidth <= document.documentElement.clientWidth,
      `overflow-x ${cs.overflowX}, min-width ${cs.minWidth}, ${over} px to scroll · `
      + `border right ${cf.borderRightWidth} and left ${cf.borderLeftWidth} · `
      + `the page overflows by `
      + `${document.documentElement.scrollWidth - document.documentElement.clientWidth} px`);

    /* 🔴 A FIFTH CHECK STOOD HERE AND IT WAS THE ONLY ONE IN THIS REPOSITORY
       THAT ENTERED A MEDIA QUERY. It read a card's left AND right edges inside
       a 320 px holder, both of them, because a card can be right on the left
       and 286 px out on the right. Its specimen was asked off on 2026-09-22
       and the assert went with it. **Nothing replaces it.** `verify.mjs` runs
       at 756 px, so every remaining panel assert passes without ever meeting a
       phone. See the note where the specimen was built. */
  }

  // ── the panel seam ────────────────────────────────────────────────────────
  //
  // 🔴 EVERY CLAIM HERE IS MEASURED AGAINST THE SEAM'S OWN CASE, never against
  // a number typed in. *"Edge to edge"* is a relationship between two
  // rectangles, and this page has already been corrected twelve times in one
  // evening for reasoning about one of them instead of reading both.
  if (seamRail && seamPlain) {
    /**
     * 🔴 THE CASE'S INNER EDGE IS ITS BORDER BOX LESS ITS OWN BORDER, AND
     * READING THE BORDER BOX WOULD HAVE BEEN WRONG BY 1 px AT EACH END. That is
     * the whole width of the thing being measured, so a check that took the
     * outer rectangle would grade a correct seam as 2 px short and an
     * overhanging one as perfect.
     */
    const inner = (panel) => {
      const c = getComputedStyle(panel.el);
      const r = panel.el.getBoundingClientRect();
      return { l: r.left + parseFloat(c.borderLeftWidth), r: r.right - parseFloat(c.borderRightWidth) };
    };

    /* 1. 🔴 EDGE TO EDGE, ON BOTH ARRANGEMENTS, WHICH IS THE ASK IN ONE LINE:
       *"on each button group have horizontal panel separator edge to edge"*.
       BOTH ends of BOTH seams, because a rule can be right on one edge and
       20 px short on the other, and `.panel-case`'s `padding: 0 var(--panel-pad)`
       is the one inset that would do exactly that. */
    {
      const rails = [['a side plate', seamRail], ['no side plate', seamPlain]];
      const read = rails.map(([what, s]) => {
        const i = inner(s.panel), r = s.seam.getBoundingClientRect();
        return { what, dl: r.left - i.l, dr: r.right - i.r, h: r.height, w: r.width };
      });
      d.assert('a seam reaches both inner edges of its case, on a panel with a rail and on one without',
        read.every((x) => Math.abs(x.dl) <= 0.6 && Math.abs(x.dr) <= 0.6 && Math.abs(x.h - 1) <= 0.1),
        read.map((x) => `${x.what}: ${x.w.toFixed(1)} px wide, `
          + `${x.dl.toFixed(1)} px off the left inner edge and ${x.dr.toFixed(1)} off the right, `
          + `${x.h.toFixed(1)} px tall`).join('; '));
    }

    /* 2. 🔴 IT CROSSES THE RAIL, AND THE NAME SURVIVES THE CROSSING. Two
       separate facts, because a seam that stopped at the plate would pass a
       width check on the other edge alone, and a seam drawn THROUGH the letters
       would pass this one. The plate carries a `z-index` so its ink paints over
       the rule, and the ground is on the LINE rather than on the plate, or the
       whole rail would mask the seam and edge to edge would stop being true. */
    {
      const plate = seamRail.panel.plate.el;
      const pr = plate.getBoundingClientRect();
      const sr = seamRail.seam.getBoundingClientRect();
      const line = plate.querySelector('.panel-plate-l');
      const ink = getComputedStyle(line).backgroundColor;
      const ground = getComputedStyle(seamRail.panel.el).backgroundColor;
      const pcs = getComputedStyle(plate);
      const railGround = pcs.backgroundColor;
      d.assert('the seam crosses the plate’s rail, and the name is painted over it rather than cut by it',
        sr.left < pr.left - 0.6 && sr.right > pr.right + 0.6
        && pcs.zIndex === '1' && ink === ground
        && /^rgba\(0, 0, 0, 0\)$|^transparent$/.test(railGround),
        `seam x${sr.left.toFixed(1)}..${sr.right.toFixed(1)} across a rail at `
        + `x${pr.left.toFixed(1)}..${pr.right.toFixed(1)}, the plate at z-index ${pcs.zIndex}, `
        + `its line painted ${ink} on a case of ${ground}, `
        + `and the rail itself ${railGround} so it masks none of the rule`);
    }

    /* 3. 🔴 NEGATIVE CONTROL, AND IT IS THE ONE THAT SAYS THE ROW COUNT IS DOING
       ANYTHING. A grid case with no count lays every child into row 1, so the
       band would sit ON TOP of the strip rather than under it and the plate
       would stop under the first row. So: the bands stack in source order, and
       the rail runs the case's whole height. MEASURED before the count existed,
       a four child case came out `1721.5px 70.5px 0px 0px 1px 70.5px`, six
       tracks for four bands, with two the plate had blocked. */
    {
      const p = seamRail.panel;
      const strip = p.strip.getBoundingClientRect();
      const seam = seamRail.seam.getBoundingClientRect();
      const band = seamRail.band.getBoundingClientRect();
      const plate = p.plate.el.getBoundingClientRect();
      const i = inner(p);
      const c = getComputedStyle(p.el);
      const cr = p.el.getBoundingClientRect();
      const bottom = cr.bottom - parseFloat(c.borderBottomWidth);
      const top = cr.top + parseFloat(c.borderTopWidth);
      d.assert('the bands stack in order and the rail runs past every one of them',
        strip.bottom <= seam.top + 0.6 && seam.bottom <= band.top + 0.6
        && Math.abs(plate.top - top) <= 0.6 && Math.abs(plate.bottom - bottom) <= 0.6
        && p.el.style.getPropertyValue('--panel-rows') === '4',
        `strip ends ${strip.bottom.toFixed(1)}, seam ${seam.top.toFixed(1)}..${seam.bottom.toFixed(1)}, `
        + `band starts ${band.top.toFixed(1)}, the rail is `
        + `${(plate.bottom - plate.top).toFixed(1)} px against a case inside of `
        + `${(bottom - top).toFixed(1)}, and --panel-rows is `
        + `"${p.el.style.getPropertyValue('--panel-rows')}"`);
    }

    /**
     * 4. 🔴 A CASE WITH BANDS HAS A VERTICAL RHYTHM, AND IT HAD NONE UNTIL
     * 2026-09-25. FOUND by the `/shape/` agent, which is the second caller
     * finding the hole the first one could not: nine sections lifted out of the
     * strip read **1.0 px** of ink from one section's last lane to the next
     * section's heading, against **40.0 px** on the page as it ships, with the
     * last band **0.0 px** off the case's inner bottom.
     * 🔴 THE CAUSE WAS `/held/`'s LESSON A THIRD TIME: `.pos-stack` owns the
     * 40 px rhythm as a margin on its own children, a block lifted out of a
     * stack stops being one, and `.panel-case` pads horizontally only.
     * 🔴 **THREE DISTANCES, NOT ONE, BECAUSE THEY COME FROM THREE PLACES AND
     * CAN BREAK SEPARATELY.** Across a seam it is the band's own inset either
     * side of a 1 px rule; band to band it is two insets and nothing between;
     * and under the last band it is one inset against the case's border, which
     * is the job `.panel-strip`'s `padding-bottom` does on a case with no
     * bands. `positron-ui` records `/twelve/` having two of three alignments
     * line up while the third was 30 px out, which one bundled assert cannot
     * report.
     * ⚠️ AND EVERY NUMBER IS READ AGAINST THE CASE'S OWN `--panel-pad` RATHER
     * THAN AGAINST A 20 TYPED HERE, so this cannot drift from the stylesheet.
     */
    {
      const p = seamRail.panel;
      const pad = parseFloat(getComputedStyle(p.el).getPropertyValue('--panel-pad'));
      const c = getComputedStyle(p.el);
      const bottom = p.el.getBoundingClientRect().bottom - parseFloat(c.borderBottomWidth);
      const seam = seamRail.seam.getBoundingClientRect();
      const a = seamRail.band.getBoundingClientRect();
      const b = seamRail.band2.getBoundingClientRect();
      const belowSeam = a.top - seam.bottom;
      const between = b.top - a.bottom;
      const under = bottom - b.bottom;
      d.assert('a band brings its own inset, so a case with bands has a rhythm and a floor',
        Math.abs(belowSeam - pad) <= 0.6
        && Math.abs(between - 2 * pad) <= 0.6
        && Math.abs(under - pad) <= 0.6,
        `--panel-pad is ${pad} px, the seam stands ${belowSeam.toFixed(1)} px off the band under it, `
        + `two bands with no seam sit ${between.toFixed(1)} px apart, `
        + `and the last one is ${under.toFixed(1)} px off the case's inner bottom`);
    }

    /* 5. ⚠️ AND A PANEL WITH NO RAIL IS NOT A GRID AND IS NOT NUMBERED, which is
       the half that keeps this off the seven cased pages that asked for none.
       An inline style nothing reads is a thing somebody has to explain later. */
    {
      const p = seamPlain.panel;
      const cs = getComputedStyle(p.el);
      d.assert('NEGATIVE CONTROL: a case with no side plate is a flex column and carries no row count',
        cs.display === 'flex' && !p.el.dataset.plateSide
        && p.el.style.getPropertyValue('--panel-rows') === ''
        && seamPlain.band.style.getPropertyValue('--panel-row') === '',
        `display ${cs.display}, plateSide ${p.el.dataset.plateSide || 'unset'}, `
        + `--panel-rows "${p.el.style.getPropertyValue('--panel-rows')}", `
        + `--panel-row on the band "${seamPlain.band.style.getPropertyValue('--panel-row')}"`);
    }
  }
  } // if (SELFCHECK)

  d.ready();
</script>
