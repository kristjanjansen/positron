<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON · kit</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* ⚠️ 10 px UNDER THE TITLE, NOT 4. Asked 2026-09-17 with a photograph: *"add
     bit more space afrer title and before examplebox"*. A heading at 10.5 px
     with `line-height: 1` has a box tight to its letters, so 4 px of margin is
     about two pixels of visible air and the sentence under it read as a second
     line of the heading. */
  .kit-h { font: 600 10.5px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase;
           color: var(--hi); margin: 30px 0 10px; }
  /* ⚠️ PROSE IS SANS HERE, EVERYTHING ELSE STAYS MONO. This page is read rather
     than operated: a paragraph explaining why a control looks the way it does
     is not a value, a key or a line of code, and setting it in the same
     monospace as the things it describes makes the description compete with
     the sample. The controls, the snippets and every readout keep the mono
     face, because there the fixed width is carrying meaning. */
  .kit-n { font: 400 13.5px/1.65 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
           color: var(--dim); margin: 0 0 12px; max-width: 66ch; }
  .kit-n code { font-family: var(--mono); font-size: .92em; }
  .kit-n code { color: var(--fg); }
  /* 🔴 A SECTION IS ONE BLOCK OF THE PAGE, AND THAT IS NOT A TIDY-UP. `.pos-body`
     is a `.pos-stack` now, which puts the project's one gap between every pair
     of its children — and this page used to append a heading, a note, a snippet
     and a box to it as FOUR children, ninety-eight in all, so every title would
     have sat 40 px from the sentence under it. A heading and the thing it
     names are one pair; the stack has nothing to say about the inside of a
     block, which is exactly the escape demo/shell/stack.mjs names. */
  .kit-sec > .kit-h { margin-top: 0; }
  /* ⚠️ AND AIR ABOVE THE BOX, for the same reason and in the same breath. The
     snippet above it is mono at 11 px and the box's own border starts at its
     last line, so the code and the specimen read as one block when they are a
     description and the thing described. */
  .kit-box { border: 1px solid var(--line); border-radius: 4px; background: var(--card);
             padding: 14px; margin: 14px 0 0; display: flex; flex-wrap: wrap;
             gap: 10px; align-items: center; }
  /* The three blocks in the layout specimen, so a gap has something to be
     measured between. They are deliberately plain: what is being shown is the
     air, not the boxes. */
  /* 🔴 A SPECIMEN'S EDGE IS LIGHTER THAN A REAL BORDER, AND IT IS ITS OWN TOKEN.
     Asked 2026-09-17 with a screenshot: *"make border a bit lighter here"*. The
     shell's line colours are `--line` #1f2937 and `--line2` #2b3546, and the
     next thing up the scale is `--dim2` #6a7280, which is the caption's ink and
     far too strong for a dashed box that is not part of what is being shown.
     There is nothing between them, so this page names its own, once, here.
     ⚠️ IT IS NOT A SHELL TOKEN ON PURPOSE. Nothing outside this sandbox draws a
     dashed specimen edge, and putting it in shell.css would offer every page a
     colour with no meaning attached to it. */
  :root { --kit-edge: #3a465c; }
  /* A row of specimens INSIDE a titled group. `.kit-box` is the flex row that
     used to hold these directly; once a group has a heading the box holds the
     group and the row needs the layout the box was providing.
     ⚠️ MEASURED BEFORE THIS EXISTED: the class was used and never defined, so
     five badges laid out as inline text and ran together into one band with
     their dots touching the word before them. */
  .kit-row { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
  /* Three panels across, wrapping to one column where a panel gets the full
     width anyway. `min-width: 0` or they refuse to shrink below their content
     and drag the page sideways, which is the defect the tab row shipped. */
  .kit-vps { align-items: flex-start; }
  .kit-vp { flex: 1 1 240px; min-width: 0; }
  /* ⚠️ NOTHING HERE UNDOES A COMPONENT'S MARGIN ANY MORE, because no component
     has one. That was the first fix and it was the wrong one: a sandbox
     cancelling a side effect leaves the side effect everywhere else. The margins
     came off the components instead, and `.pos-stack` gives the gap. */
  /* A phone's width, on any screen. 320 px is narrower than an iPhone SE's 375
     and the commonest 390 and 412, so what overflows here overflows on all of
     them. The border says where the box ends, because a scroller whose edge is
     invisible reads as a row that has been cut off. */
  .kit-phone { width: 320px; max-width: 100%; border: 1px dashed var(--kit-edge);
               border-radius: 4px; padding: 8px; }
  .kit-blk { border: 1px dashed var(--kit-edge); border-radius: 4px; color: var(--dim2);
             font: 400 11px/1 var(--mono); text-align: center; padding: 18px 0; }
  /* The stand-in for a page that covers the screen with a bare canvas, which is
     the shape `/weight/` and `/floor/` have and the shape the report came from.
     ⚠️ NO `position` DECLARED HERE ON PURPOSE. `createFullscreenExit` gives a
     static host `position: relative` itself, and a specimen that did it first
     would be this page hiding the half of the component it is grading. */
  .kit-cover { width: 260px; height: 146px; background: var(--card2);
               border: 1px solid var(--line); border-radius: 4px;
               display: flex; align-items: center; justify-content: center; }
  .kit-cover-p { font: 400 11px/1 var(--mono); color: var(--dim2); }
  /* 🔴 THE DEFECT, KEPT ALIVE ON PURPOSE. `.kbd { margin: 0 0 10px }` in
     shell.css is what put a keyboard flush against a transport bar on `/keys/`:
     a `margin` shorthand's implied `margin-top: 0`, at (0,1,0), beating a
     rhythm rule that was (0,1,0) too. This class is that shorthand, in a page
     stylesheet, which is the worst case there is — it loads after shell.css, so
     source order is on its side and only specificity can beat it. The check at
     the bottom measures the gap above it. */
  .kit-tight { margin: 0 0 10px; }
  .kit-src { font: 400 11px/1.6 var(--mono); color: var(--dim2); white-space: pre-wrap;
             margin: 0 0 6px; padding-left: 2px; }
  /* ⚠️ GREY, NOT `--hi`. This is what the control beside it last reported, and
     it was yellow — the colour this project uses for the one thing on a page
     that matters. Beside eight sample controls that all report, yellow is
     eight highlights, which is none: the sandbox lit up like a page where
     everything is urgent. It is a value, and values are `--dim`.
     ⚠️ AND `align-self: center`, because `align-items: center` on the box
     centres each FLEX LINE's items and the button rows beside these carry
     their own height — so the readout sat low against the row it describes. */
  /* ⚠️ ITS OWN LINE, ALWAYS. Beside a control it reads as part of the control —
     `LOOK ‹ random › KALEIDOSCOPE` looks like a picker with a fourth segment,
     which is exactly what it is not: it is what the picker REPORTED. A readout
     sharing a row with the thing it reports on has to be told apart by colour
     alone, and colour is already carrying whether a control is armed.
     `flex: 1 1 100%` in a wrapping row is the whole mechanism. */
  /* 🔴 THE OUTPUT LINE IS THE BOX'S FOOTER, NOT A LINE FLOATING UNDER IT. Asked
     2026-09-17 with a photograph: *"space top of 'nothing pressed'. make this
     kit example box a component to get similar example component. make that
     bottom text have border on top of it like videpanel"*.
     It sat flush against the specimen above it with no air and no edge, so a
     readout and the control it describes read as one undifferentiated block.
     `video-panel.mjs` had already solved this exact shape: one box, a hairline,
     and the row that reports sitting under it. This is the same, so the two
     surfaces on the site that pair a thing with what it says about itself look
     the same.
     ⚠️ NEGATIVE MARGINS, because the box carries 14 px of padding and a footer
     has to reach its edges. The bottom corners are rounded to match, rather than
     clipping the box, which would cut anything a specimen deliberately overflows.
     ⚠️ THE TOP MARGIN IS 4 AND NOT 14: the box is a flex row with a 10 px gap,
     so the gap and the margin add to the 14 the padding uses everywhere else. */
  .kit-out { font: 500 12px/1.6 var(--mono); color: var(--dim); min-height: 1.6em;
             flex: 1 1 100%;
             margin: 4px -14px -14px; padding: 10px 14px;
             border-top: 1px solid var(--line); border-radius: 0 0 4px 4px; }
  /* A block holding a diagram is not a row of controls: the picture wants the
     whole width and the report under it wants the line below, so these two
     turn the flex row off rather than fighting it with `flex: 1 1 100%` on
     each child. Setting `display` matters — a flex property on a non-flex box
     is silence, and a flex CHILD of a `flex-wrap` row is sized by its content
     no matter what width it asks for. */
  .kit-wide { display: block; }
  /* Half of whatever the box gives it, for a specimen that does not need the
     full width. A fraction rather than a pixel count, so the layout keeps
     owning the width and this page has no second opinion about it to defend.
     ⚠️ THE MEDIA BLOCK SITS AFTER THE PLAIN RULE, never before it. A media
     query adds no specificity, so a later plain rule of the same weight wins at
     every width — which is how `.pos-pick`'s entire phone layout sat in
     shell.css for weeks and never once ran. Under 560 px half a box is narrower
     than the transport bar's own controls, so the specimen takes it all back. */
  .kit-half { max-width: 50%; }
  @media (max-width: 560px) { .kit-half { max-width: 100%; } }
  /* the phone case. A fixed width so the one-column layout can be seen on a
     desktop, `max-width` so it is never wider than a real phone. */
  .kit-phone { width: 320px; max-width: 100%; }
  .kit-cut { font: 400 11px/1.6 var(--mono); color: var(--dim); margin-top: 8px;
             white-space: pre-wrap; }
  .kit-cut b { color: var(--warn); font-weight: 500; }
  /* The stand-in for everything between a split readout and a split log, which
     on a real page is the whole demo. 🔴 IT IS A REAL `.pos-body` AND THIS
     RULE DECLARES NO MARGIN. The gap under a split readout and the gap over a
     split log are both the shell's, and one of them is `.pos-body`'s own
     `margin-bottom` rather than anything the log asks for — so a stand-in with
     a margin typed here would be this page inventing the number it then grades
     itself against. */
  .kit-mid { border: 1px dashed var(--kit-edge); border-radius: 4px; color: var(--dim2);
             font: 400 11px/1 var(--mono); text-align: center; padding: 26px 0; }
  /* ⚠️ AND NO RULE HERE RESETTING WHAT FOLLOWS A CAPTION. The split specimen
     below is measured, and its gaps are the shell's own 22 px: a `margin-top:
     0` typed here would make this page move the thing it is grading, which is
     the same mistake as a check that mutates. */
  /* 🔴 AND A GAP UNDERNEATH, BECAUSE THERE WAS NONE. REPORTED 2026-09-17 with a
     screenshot of a caption sitting on the dashed edge of the box it labels:
     *"what is this crap? ... you are breaking you own rules in this example you
     made for preventing"*, which is exactly right. MEASURED on the live page:
     all FOUR captions read a gap of 0.0 px to their specimen, so this was never
     one section. `line-height: 1` makes the caption's box tight to its letters,
     and the specimen below starts at its edge, so uppercase text at 9.5 px
     touches a border a pixel away. The caption belongs to the thing under it,
     so it owns both sides of its own air. */
  .kit-cap { font: 600 9.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase;
             color: var(--dim2); margin: 0 0 10px; }
  /* A caption belongs to the specimen UNDER it, so the air goes above the
     caption rather than below it. Nothing measured passes through this gap:
     the two numbers graded in the split block are readout-to-page and
     page-to-log, and no caption stands in either.
     🔴 AND THE 44 px THE SHELL PUTS ABOVE A JOINED SURFACE IS MOVED HERE, NOT
     SHRUNK. That gap is the distance from the PAGE to the surface at the foot
     of it, and there is no page inside a sandbox box: what sits directly above
     each specimen is its own caption, so leaving the margin on the box put
     44 px between a label and the thing it labels. Photographed: the word
     JOINED floating in the middle of the gap, reading as a heading for
     nothing. The caption takes the air and its specimen sits under it, so the
     pair is still one group with the shell's own 44 px above it. */
  .kit-box > * + .kit-cap { margin-top: 44px; }

  /* A channel strip: four rows of controls, stacked the way a mixer stacks
     them. The row headings came off 2026-09-20 and `.kit-hwlab` went with
     them; every knob already carries its CC under it. */
  .kit-hwrow { width: 100%; }
  .kit-hwrow + .kit-hwrow { margin-top: 18px; }
  .kit-hwitems { min-width: 0; }
  /* The vertical twins, beside the horizontal ones they are meant to match. */
  .kit-vrow { display: flex; gap: var(--ctl-gap); align-items: flex-end; }

  .kit-swatch { display: inline-flex; align-items: baseline; gap: 7px; margin-right: 20px; }
  .kit-swatch-n { font: 600 12px/1.6 var(--mono); color: var(--fg); }
  .kit-swatch-w { font: 400 12px/1.6 var(--mono); color: var(--dim); }
  .kit-cap + .pos-report { margin-top: 0; }
</style>

<script type="module">
  import { mount, el, createReport } from '/shell/shell.mjs';
  import { createStack } from '/shell/stack.mjs';
  import { createStepper } from '/shell/stepper.mjs';
  import { createSlider, createSliderGroup, GLIDE_MS, HAND_YIELD_MS } from '/shell/slider.mjs';
  import { MOVE_GLYPH, MOVE_OFF, MOVE_SAYS } from '/shell/hand.mjs';
  import { createChoice } from '/shell/choice.mjs';
  import { createTabs } from '/shell/tabs.mjs';
  import { createCard, createCardGrid } from '/shell/card.mjs';
  import { DEMOS } from '/manifest.mjs';
  import { createKeyboard } from '/shell/keyboard.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { createField } from '/shell/field.mjs';
  import { createStripView, createStripFooter, STRIP_FOOTER_EMPTY } from '/shell/strip.mjs';
  import { createFullscreenExit, EXIT_IDLE_MS, toggle as fsToggle, isFull as fsIsFull }
    from '/shell/fullscreen.mjs';
  import { createDiagram } from '/shell/diagram.mjs';
  import { createVideoPanel, FULL_MODES } from '/shell/video-panel.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { centreSymbol, setSymbol } from '/shell/symbol.mjs';
  import { burn, readBurned, FRAME_W, FRAME_H, videoHue } from '/shell/pattern.mjs';
  import { createTable } from '/shell/table.mjs';
  import { createMidiLog } from '/shell/midi-log.mjs';
  import { decode } from '/shell/midi-decode.mjs';
  import { createPresence, PRESENCE_STATES } from '/shell/presence.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { markAdapter } from '/shell/fixture.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createKnob, createKnobBank } from '/shell/knob.mjs';
  import { createPad, createPadGrid } from '/shell/pad.mjs';
  import { createFader, createFaderBank } from '/shell/fader.mjs';
  import { createXrProbe, xrCaps, onXrCaps, reasonFor, canEnter, answered, XR_STATES }
    from '/shell/xr-caps.mjs';

  /**
   * 🔴 IT MOUNTS THE SHELL NOW, AND THAT IS WHAT MAKES IT GRADEABLE. It used to
   * hand-write its own head, which meant `node demo/verify.mjs kit` answered
   * "nothing for this harness to verify": no `mount()`, no `window.__demo`, no
   * asserts. So the one page whose entire job is to make component drift
   * visible was the one page the suite could not look at, and everything
   * demonstrated here had to be measured some other way.
   *
   * ⚠️ AND IT MOUNTS THE SAME SHELL EVERY OTHER PAGE DOES, which is the second
   * half of the point. A sandbox for components that opts out of the frame
   * those components live in is a sandbox that can drift from the thing it
   * exists to police. The head, the back link and the log are the real ones.
   *
   * `readout: null` because the subject here is the controls themselves. Every
   * readout on this page is a SPECIMEN rather than this page's own instrument,
   * including the two in the block at the top: that block is about where the
   * numbers and the log SIT, and a sandbox that joined its own pair could only
   * ever show one of the two arrangements.
   */
  const d = mount({
    name: 'kit',
    what: 'Every reusable control in the shell, on one page, wired to nothing. '
      + 'It is here so a control can be looked at and pushed around without starting '
      + 'a board, a relay or a stream, and so that two pages using the same component '
      + 'cannot quietly drift into looking like two different ones. Each block shows '
      + 'how it is made.',
    readout: null,
  });

  const body = d.el;
  const out = (t) => { const o = el('div', 'kit-out', t); return o; };
  // What every section reports about itself, for the checks at the bottom.
  const built = [];
  const failed = [];
  /**
   * 🔴 A SECTION THAT THROWS IS THE DEFECT THIS PAGE EXISTS TO FIND, so it is
   * caught and RECORDED rather than allowed to stop the page. A component that
   * will not build takes every block below it with it when the error escapes,
   * which turns one broken control into a blank page and hides which one it
   * was. Both lists are asserted at the bottom.
   */
  function section(title, note, src, build) {
    // 🔴 ONE ELEMENT PER SECTION, WHICH IS WHAT `.pos-body` BEING A STACK ASKS
    // FOR. These four used to be four children of the page, and a stack puts
    // the project's one gap between every pair of its children — so a title
    // would have stood 40 px away from the sentence explaining it. A heading,
    // its note, its snippet and its specimen are one block; the air belongs
    // BETWEEN blocks. See demo/shell/stack.mjs.
    const sec = el('section', 'kit-sec');
    body.append(sec);
    sec.append(el('h2', 'kit-h', title));
    if (note) sec.append(el('p', 'kit-n', note));
    if (src) sec.append(el('pre', 'kit-src', src));
    const box = el('div', 'kit-box');
    sec.append(box);
    try { build(box); built.push(title); }
    catch (e) {
      failed.push(`${title}: ${e.message}`);
      box.append(el('div', 'kit-cut', `this block did not build: ${e.message}`));
      d.log(`${title} did not build: ${e.message}`, 'bad');
    }
  }

  // The MIDI log specimen's own state, declared out here for the reason the
  // comment below gives: a block that moves must not leave its `const` behind.
  let kitMidi = [], kitMidiListed = 0, kitMidiLog = null;

  // The four specimen badges, by state, so the geometry asserts at the bottom
  // can measure them. ⚠️ DECLARED HERE RATHER THAN BESIDE THE BLOCK: this
  // section moved to the top of the page and its `const` stayed behind, so the
  // build read it in its dead zone, `section()` swallowed the throw into
  // `failed`, and the page died much later on an empty map. A block that moves
  // takes what it needs with it.
  // ⚠️ DECLARED HERE, NOT INSIDE THE BLOCKS. A block that moved on this page
  // once left its `const` behind, the build read it in its dead zone,
  // `section()` swallowed the throw into `failed`, and the page died much
  // later with a message about a different line.
  const knobSpec = [];
  let padSpec = null, halfSpec = null, fadeSpec = null, roundSpec = null, vertSpec = null;
  const presSpec = new Map();
  // ⚠️ DECLARED WITH THE OTHERS, NOT INSIDE THE BLOCK. A block that moved to the
  // top of this page once left its `const` behind, the build read it in its dead
  // zone, `section()` swallowed the throw, and the page died much later on an
  // empty map with a message about a different line.
  const busySpec = new Map();
  // The stepper whose middle is a value, for the check that it really is one.
  let stepperPick = null;
  // The narrow keyboard, for the check that it really overflows.
  let kbNarrow = null;
  // The video panels, for the checks that their slots and their picture are real.
  let vpSpec = null;
  let presLive = null;        // one badge that can change, measured over time

  // The pair in the invisible hand block: one slider with a hand and one
  // without, held so the checks at the bottom can compare them. ⚠️ DECLARED
  // HERE for the reason the two lines above give: a `let` left beside a block
  // that moves is read in its dead zone.
  let handSpec = null;

  // The three arrangements of the readout and the log, for the geometry checks
  // at the bottom. ⚠️ SAME REASON AS THE LINE ABOVE: the block that fills these
  // is the newest one and so it is the topmost one, and a `const` left where
  // the block used to be is read in its dead zone.
  // The layout specimens. ⚠️ DECLARED UP HERE, not beside the block that fills
  // them: this is the newest section and therefore the topmost one, and this
  // page has already been taken out once by a `const` left where a block used
  // to be and then read in its dead zone.
  let stackSpec = null, emptySpec = null, emptyBlock = null;
  const stackBlocks = [];

  let joinedSpec = null;      // a readout on top of a log, one surface
  let logOnlySpec = null;     // joined, with no readout declared
  let neitherSpec = null;     // joined, with neither — there is nothing to draw
  let splitSpec = null;       // the default: two surfaces, the page between them
  // the two `.pos-body` stand-ins, held rather than queried: the gaps this
  // block grades are measured FROM them, and `querySelector` would find
  // whichever came first and grade the wrong arrangement
  let joinedPage = null, splitPage = null;

  // The button group specimens, held for the checks at the bottom: one row of
  // ordinary actions, and one pair driven by what this browser actually says
  // about a headset. ⚠️ DECLARED UP HERE WITH THE OTHERS, for the reason those
  // lines give: this is the newest block and therefore the topmost one, and a
  // `let` left where a block used to be is read in its dead zone.
  let bgSpec = null, bgRow = null, xrSpec = null;
  // The choice specimen, kept so the button group can be measured AGAINST it
  // rather than against a number typed into a check. The claim being graded is
  // that the two are different sizes of object, which is a comparison or it is
  // nothing.
  let choiceSpec = null;

  // The way out of full screen, and the strip that says what is under the
  // pointer. ⚠️ DECLARED UP HERE WITH EVERY OTHER HOLDER, for the reason the
  // comments above give: these two blocks are the newest and therefore the
  // topmost, and a `let` left where a block used to be is read in its dead zone
  // and swallowed by `section()` into `failed`.
  // The panel with a transport glued under it, held for the two checks that
  // measure it. ⚠️ DECLARED UP HERE WITH EVERY OTHER HOLDER, for the reason the
  // comments above give: this is the newest block and therefore the topmost,
  // and a `let` left where a block used to be is read in its dead zone.
  let glueSpec = null;        // { panel, bar, deck, mute }
  let fsxSpec = null;         // { host, exit, out }, a cover with a way back
  let footSpec = null;        // the strip whose footer says what is hovered
  let vpUnder = null;         // the control row a panel lifts while full
  let vpStorey = null;        // the off-screen panel that row is graded against

  /**
   * 🔴 NEWEST AT THE TOP, AND THE HEADING IS UPPERCASE. Asked 2026-09-19 for
   * `/stage/`, in one line with four other things: *"move video play / stop to
   * videopanel footer"*, *"make transportbar glueable to videopanel footer"*
   * and *"replace timeline-glued transport record button with start | stop text
   * labels (same w)"*.
   *
   * ⚠️ ONE BLOCK FOR TWO COMPONENTS, because they are one arrangement: a film's
   * transport belongs to the picture it drives, and the words are what that bar
   * says. Shown apart they would be specimens of nothing in particular.
   * 🔴 THE WAY OUT OF FULL SCREEN WAS THE SECOND HALF OF THIS BLOCK AND ITS
   * SPECIMEN IS GONE, 2026-09-20, asked for by quoting the page back: *"rm this
   * part AND THE WAY BACK OUT OF FULL SCREEN / a picture / not filling the
   * screen"*. The PIECE is still built, off screen, because two checks at the
   * foot of this file press it and read its geometry. Deleting it as well as
   * the specimen would have taken both with it while the page stayed green,
   * which is this project's rule about a control you switch off.
   * ⚠️ AND NOTHING HERE IS IN A `.pos-controls` ROW, for the reason the block
   * below gives: both harnesses press that row by position, so a new top block
   * with controls in it moves every other block's press.
   */
  /**
   * 🔴 NEWEST AT THE TOP, WHICH IS THE RULE. Somebody reading this page is
   * checking what the kit has, and what they do not know about is what arrived
   * since they last looked.
   * ⚠️ NOTHING HERE IS IN A `.pos-controls` ROW, for the reason the block below
   * gives: both harnesses press that row by position.
   */
  section('MIDI LOG',
    'What arrived on the wire, in columns, under the panel it moved. The raw bytes are a '

    + 'byte is counted and never listed.',

log.add(decode(bytes))     // false if it was a flood and was not listed`,

      // ⚠️ THE LAST TWO ARE FLOODS AND MUST NOT APPEAR. The checks at the foot
      // of this file read that back, which is what makes this a specimen rather
      // than a picture of one.
      kitMidi = [[0x90, 60, 100], [0x80, 60, 0], [0xb0, 74, 64],
                 [0xe0, 0x00, 0x40], [0xb0, 80, 127], [0xf8], [0xfe]];
      kitMidiListed = kitMidi.filter((b) => log.add(decode(b))).length;
      kitMidiLog = log;
    });

  section('GLUED TRANSPORT BAR',
    'A panel and its transport bar wrapped in one edge with a 1 px seam. The toggle holds '
    + 'both of its words at once, so it cannot change width when it changes state.',
    `panel.glue(bar.el)   // wraps in place, so the pair stays where the panel was
createTransportBar(host, deck, { verb: ['start', 'stop'] })`,
    (box) => {
      box.classList.add('kit-wide');
      // 🔴 HALF THE WIDTH THE BOX GIVES IT, asked 2026-09-20: *"make it half
      // w"*. `.kit-half` is `max-width: 50%` rather than a number of pixels,
      // because the box already owns this width and a figure typed here would
      // be a second opinion about it. MEASURED after the change: the seam, the
      // edges and the toggle's two states are all unmoved.
      const glued = el('div', 'kit-half');
      box.append(glued);
      const c = document.createElement('canvas');
      c.width = FRAME_W; c.height = FRAME_H;
      const ctx = c.getContext('2d', { alpha: false });
      const panel = createVideoPanel({
        media: c,
        left: createPresence({ of: '', mode: 'badge', state: 'online',
                               says: { online: 'live' } }).el,
      });
      /**
       * 🔴 A SECOND GLYPH BESIDE THE ⛶, WHICH IS WHAT THE RIGHT SLOT LOOKS LIKE
       * WITH TWO THINGS IN IT. `/stage/` puts the film's mute there. The
       * glyphs are `♫` U+266B and `⊘` U+2298, chosen by looking: the text style
       * speakers U+1F568 to U+1F56A are an empty tofu box in this font stack,
       * and U+1F507 and U+1F50A are emoji presentation, 21 px of colour beside
       * a ⛶ whose ink is 9.86 px of grey.
       * ⚠️ `setSymbol`, NEVER `textContent`. The centring lives in a span that
       * writing `textContent` throws away, which is the defect that module was
       * written for and is invisible until somebody looks closely at a button
       * whose glyph swaps.
       */
      let muted = true;
      const mute = el('button', 'ico', '\u2298',
        { type: 'button', 'aria-label': 'the sound', 'aria-pressed': 'false', title: 'muted' });
      centreSymbol(mute);
      mute.onclick = () => {
        muted = !muted;
        setSymbol(mute, muted ? '\u2298' : '\u266b');
        mute.setAttribute('aria-pressed', String(!muted));
        mute.title = muted ? 'muted' : 'audible';
      };
      panel.slots.right.prepend(mute);
      glued.append(panel.el);

      // A deck with no adapters offers no rates, so the bar draws no rate row:
      // what is on show here is the toggle, the clock and the seam.
      const deck = createDeck({ range: [0, 60_000] });
      const bar = createTransportBar(glued, deck, {
        verb: ['start', 'stop'], live: false, loop: false, scrub: true, absolute: false,
        /**
         * 🔴 `publish: false`, AND ON THIS PAGE THAT IS NOT A TIE BREAK BETWEEN
         * TWO BARS. `/kit/` has no transport of its own and never had one, so a
         * specimen claiming `__demo.transport` would hand the suite a playhead
         * to drive on a page that is a gallery: `verify.mjs` would start
         * pressing play and seeking on a bar that exists to be looked at.
         */
        publish: false,
      });
      // ⚠️ THE PANEL IS ALREADY IN THE BOX AND THE BAR IS APPENDED AFTER IT, so
      // this is the realistic order and the one the method is for: a page has
      // its picture on screen before it has built the bar that belongs to it.
      panel.glue(bar.el);
      glueSpec = { panel, bar, deck, mute, half: glued };

      let n = 0;
      const draw = () => { burn(ctx, FRAME_W, FRAME_H, n++, { hue: videoHue(1) }); requestAnimationFrame(draw); };
      requestAnimationFrame(draw);

      /**
       * 🔴 THE WAY BACK OUT OF FULL SCREEN, BUILT AND NEVER SHOWN. Reported
       * 2026-09-19 from an iPhone: *"I can not leave fullscreen on mobile"*,
       * asked for as *"make permanett squaer button with fullscreen icon on
       * bottom right when going to fullscreen in mobile. fade out it when no
       * activity"*, and its specimen was taken off this page on 2026-09-20.
       *
       * 🔴 IT IS KEPT BECAUSE TWO CHECKS PRESS IT. `/blocks/` shipped a way out
       * that was built, compiled and drawn every frame and never once updated,
       * so there was no way out of that page at all while every line of it read
       * correct. Reading that a control is wired is not the same claim as
       * pressing it, and a piece deleted with its specimen is a check that stops
       * running rather than one that fails.
       * ⚠️ OFF SCREEN AND LAID OUT, the same shape as the video panel's second
       * storey above and the faded probe at the foot of this file: the checks
       * read `getBoundingClientRect`, so `display: none` is not available and
       * `left: -9999px` is.
       * ⚠️ AND THE HOLDER TAKES NO INLINE `position` THE COVER WOULD HAVE TO
       * BEAT. `.pos-faux` is `position: fixed; inset: 0` from the stylesheet, a
       * fixed ancestor is not a containing block for a fixed child, and an
       * inline style on the host itself would have won against the class and
       * left the cover parked off the left edge of the screen.
       * ⚠️ NOTHING HERE SITS IN A `.pos-controls` ROW, ON PURPOSE. Both
       * harnesses press every button in that row, by position, so an invisible
       * button in one would be a press landing on nothing a visitor can see.
       * The way in is pressed by the checks at the bottom instead, which is also
       * the only way to prove the way out by pressing it.
       */
      const o = out('not filling the screen');
      const host = el('div', 'kit-cover');
      host.append(el('div', 'kit-cover-p', 'a picture'));
      // ⚠️ THE PIECE IS BUILT BEFORE THE HANDLER THAT READS IT. A `const`
      // declared under the closure that closes over it is this page's most
      // repeated defect, and it has already taken this file out once.
      const exit = createFullscreenExit(host, {
        onExit: () => { o.textContent = 'came back'; },
      });
      // ⚠️ AN ORDINARY BUTTON, NOT A SHELL CONTROL, for the reason in the note
      // above. It is pressed from the checks rather than by the harness.
      const go = el('button', '', 'Fill the screen', { type: 'button' });
      go.onclick = async () => {
        const how = await fsToggle(host);
        exit.sync();
        o.textContent = `filling the screen the ${how} way`;
      };
      fsxSpec = { host, exit, out: o, go };

      const probe = el('div', '');
      probe.style.cssText = 'position:fixed;left:-9999px;top:0;width:320px';
      probe.append(host, go, o);
      document.body.append(probe);
    });

  /**
   * 🔴 ONE SECTION FOR ONE COMPONENT, MERGED 2026-09-20 on instruction: *"merge
   * STRIP VIEW + footer"*. They were `STRIP VIEW` and `STRIP FOOTER`, twenty
   * sections apart on the page, and the footer is an OPTION on the same call
   * rather than a second component. A reader meeting `createStripView` twice
   * has to work out that it is the same thing.
   *
   * The footer was asked for 2026-09-19 with a photograph of `/reel/` on an
   * iPhone: *"add feature to timeline: footer section, looks like glued that
   * shows hovered info below timeline"*. The photograph shows the sticky tap
   * tooltip covering the right half of the strip, four lines deep, over the
   * marks it is describing.
   *
   * ⚠️ THE STACK GOES INTO THE BOX BEFORE EITHER STRIP IS BUILT. `fit()`
   * measures the width it has been given, and a strip built into an element
   * that is not in the document yet measures nothing.
   */
  section('STRIP VIEW',
    'Marks on a lane over the deck\u2019s range. An optional box under it says what the '
    + 'pointer is over, at one height whatever it is saying.',
    `createStripView(host, deck, { lanes })
createStripView(host, deck, { lanes, footer: true })
createStripView(host, deck, { lanes, footer: { lines: 3, empty: 'nothing chosen' } })`,
    (box) => {
      box.classList.add('kit-wide');
      const stack = createStack(undefined, 'kit-col');
      const bare = stack.titled('MARKS ON A LANE');
      const footed = stack.titled('AND THE BOX THAT SAYS WHAT IS UNDER THE POINTER');
      box.append(stack.el);

      const { adapter } = markAdapter({ rates: [1] });
      const SPAN = 8000;
      const marks = (n, tag) => {
        const items = [];
        for (let i = 0; i < n; i++) {
          items.push({ id: `${tag}${i}`, kind: 'mark', at: (i + 0.5) * (SPAN / (n + 1)),
                       payload: { label: `${i + 1}` } });
        }
        // ⚠️ A DECK NEEDS AN ADAPTER PER KIND, and without one the lane draws
        // NOTHING: a tall empty box, no error, no warning. That is what this
        // section was on its first attempt, and an empty component in a sandbox
        // is worse than an absent one, because it reads as the component being
        // broken.
        return createDeck({ items, adapters: { mark: adapter }, range: [0, SPAN] });
      };
      // The swatch on the lane's left border AND the marks themselves take the
      // page's primary colour. `L.color` is the one place it is set, and
      // `styleFor` hands it to both.
      const hi = getComputedStyle(document.documentElement)
                   .getPropertyValue('--hi').trim() || '#ffd400';

      // ⚠️ NO SUBLABEL ON THE BARE ONE. `14 marks · 8 s` still ellipsized, the
      // gutter being narrower than fourteen characters at this width, and an
      // ellipsis means the content is in the wrong place rather than that the
      // box wants widening. A lane's own name is enough in a sandbox.
      // 'auto' takes exactly the height its lanes need. 'default' left a band
      // of empty canvas under a single lane.
      const { strip } = createStripView(bare, marks(14, 'n'), {
        size: 'auto',
        lanes: [{ id: 'mark', kind: 'mark', color: hi }],
      });
      strip.fit?.();

      footSpec = createStripView(footed, marks(9, 'f'), {
        size: 'auto',
        // 🔴 ONE LINE. Asked 2026-09-20 with a screenshot: *"1 line footer
        // here"*. The default is three, which is right on a page whose marks
        // carry a name, a time and a verdict; this specimen's marks carry a
        // number, so two of the three rows were reserved air under a single
        // sentence. **The specimen should show the component doing its job,
        // not its widest possible job.**
        footer: { lines: 1 },
        lanes: [{ id: 'mark', kind: 'mark', label: 'takes', color: hi }],
      });
      footSpec.strip.fit?.();
    });

  /**
   * 🔴 NEWEST AT THE TOP, AND THE TWO PRESENCE BLOCKS ARE ONE. Asked 2026-09-17:
   * *"bring online offline up in kit and merge busy/test into it"*. They were
   * two sections because the busy words were built second, and that is a fact
   * about the order the work happened in rather than about the component: one
   * badge answers both questions, so a reader meeting it twice has to work out
   * that it is the same thing.
   *
   * ⚠️ A SECTION TITLE IS UPPERCASE, and `.kit-h` renders it so whatever is
   * typed. Type it uppercase anyway, so the source reads like the page.
   * ⚠️ AND MOVING A BLOCK MOVES EVERY BUTTON AFTER IT. `verify.mjs` presses by
   * position, so re-run `node demo/verify.mjs kit` and diff the assert count
   * after any reorder.
   */
  section('VIDEO PANEL',
    'A picture, with a status on the left, an empty middle and a fullscreen button under it.',
    `createVideoPanel({ media: canvas, of: 'the board' })
createVideoPanel({ media, left: myBadge, centre: myThing, right: false, fullMode: 'footer' })`,
    (box) => {
      box.classList.add('kit-wide');
      const stack = createStack(undefined, 'kit-col');

      /**
       * 🔴 THE PICTURE IS THIS PROJECT'S OWN AND COMES FROM NOBODY'S SERVER.
       * `pattern.mjs` is drawn into a canvas here, so the specimen needs no
       * network, cannot 403, and looks the same on every run. CLAUDE.md's rule
       * about external sources has been broken twice; a gallery is the last
       * place to break it a third time.
       * ⚠️ ONE CANVAS PER PANEL AND ONE LOOP. A canvas cannot be in two places,
       * so the master is drawn once a frame and blitted, which is what `/stage/`
       * does with three of them.
       */
      const master = document.createElement('canvas');
      master.width = FRAME_W; master.height = FRAME_H;
      const mctx = master.getContext('2d', { alpha: false });

      /**
       * ⚠️ THREE ACROSS, NOT THREE DOWN. A panel is 16 by 9 and a page wide, so
       * three of them stacked is three screens of scrolling to compare things
       * that differ in one row of controls. Side by side they are compared at a
       * glance, which is what a gallery is for, and they wrap to one column on a
       * phone where the full width is what a panel actually gets.
       */
      const row = el('div', 'kit-row kit-vps');
      const made = [];
      const add = (heading, panel, ctx) => {
        const cell = el('div', 'kit-vp');
        cell.append(el('p', 'kit-cap', heading), panel.el);
        row.append(cell);
        made.push({ ctx, panel });
      };
      for (const [mode, heading] of [['hover', 'the defaults'],
                                     ['footer', 'footer in fullscreen']]) {
        const c = document.createElement('canvas');
        c.width = FRAME_W; c.height = FRAME_H;
        /**
         * ⚠️ THE BADGE SAYS `LIVE` RATHER THAN SHOWING A LONE DOT. Asked
         * 2026-09-17: *"add LIVE to green bullet on footer"*. A coloured dot
         * with nothing beside it is a mark whose whole meaning is its hue, which
         * this project already has a rule about, and the panel's own default is
         * the dot mode because a footer usually holds several small things. Here
         * it holds one.
         */
        const p = createVideoPanel({
          media: c, fullMode: mode,
          left: createPresence({ of: '', mode: 'badge', state: 'online',
                                 says: { online: 'live' } }).el,
        });
        add(heading, p, c.getContext('2d', { alpha: false }));
      }

      /**
       * 🔴 THE SECOND STOREY IS STILL GRADED AND IS NO LONGER SHOWN. The
       * specimen came off 2026-09-20 on instruction: *"rm a second storey under
       * the footer"*. It was asked for on 2026-09-19 with a photograph of
       * `/mirror/` filling an iPhone: *"extend videopanel footer in fullscreen
       * so it can have section below the footer bar (separaet with line). put
       * controlgroup there"*.
       *
       * 🔴 THE MECHANISM IS LIVE AND THIS IS THE ONLY THING THAT GRADES IT.
       * `/mirror/` calls `panel.under(knobRow)`, and in real element fullscreen
       * nothing outside the full subtree is on screen, so on a phone that row is
       * only reachable from inside the picture. Deleting the piece as well as the
       * specimen would take the check with it, which is this project's own rule
       * about a control you switch off. So it stays as an off-screen probe.
       * ⚠️ OFF SCREEN AND LAID OUT, the same shape as the way-out probe at the
       * foot of this file: the check reads `gridTemplateRows`, so `display:
       * none` is not available and `left: -9999px` is.
       * 🔴 IT IS THE SAME ELEMENT, MOVED. Two rows that can disagree about which
       * option is chosen would be a readout living in two files, so the check
       * grades that there is exactly ONE of them in the document.
       */
      {
        const probe = el('div', '');
        probe.style.cssText = 'position:fixed;left:-9999px;top:0;width:480px';
        const c = document.createElement('canvas');
        c.width = FRAME_W; c.height = FRAME_H;
        vpUnder = el('div', 'kit-row');
        vpUnder.append(el('div', '', 'a control row'));
        vpStorey = createVideoPanel({ media: c, fullMode: 'footer' });
        probe.append(vpStorey.el, vpUnder);
        document.body.append(probe);
        // ⚠️ HANDED OVER AFTER IT IS ON THE PAGE, which is the realistic order
        // and the one that matters: the panel records where the element lives
        // at the moment it is given it, so an element with no parent yet has no
        // home to be put back to. The constructor's `under` option is for a page
        // that builds its controls before it builds its panel.
        vpStorey.under(vpUnder);
      }

      vpSpec = made;
      stack.add(row);

      let n = 0;
      const draw = () => {
        burn(mctx, FRAME_W, FRAME_H, n++, { hue: videoHue(0) });
        for (const m of made) m.ctx.drawImage(master, 0, 0);
        requestAnimationFrame(draw);
      };
      requestAnimationFrame(draw);
      box.append(stack.el);
    });

  section('PRESENCE',
    'Five states, and whether a person or a harness is holding it.',
    `createPresence({ of: 'the board' }).set('online')
createPresence({ of: 'Raspberry Pi', busyWords: { page: 'in use', tool: 'under test' } }).busy('tool')
createPresence({ of: 'the board', mode: 'dot', state: 'online' })
presenceOf({ now, lastSeenAt, everyMs: 5000 })   // -> one of the five`,
    (box) => {
      box.classList.add('kit-wide');
      const stack = createStack(undefined, 'kit-col');

      // ⚠️ `can: [s]` IS WHAT MAKES THIS ROW EVENLY SPACED. Each of these will
      // only ever say its own word, so holding room for `coming online` put a
      // different amount of empty space after each one and the gaps read as
      // arbitrary. A badge that can really change says nothing here and keeps
      // the full reserve, which is what the width check below drives.
      const states = el('div', 'kit-row');
      for (const s of PRESENCE_STATES) {
        const p = createPresence({ state: s, can: [s] });
        presSpec.set(s, p.el);
        states.append(p.el);
      }
      // One badge that CAN change, for the check at the bottom: the claim is
      // that a badge does not twitch as ITS OWN state moves, which is about one
      // badge over time and not about five badges side by side.
      presLive = createPresence({ state: 'online' });
      presLive.el.style.position = 'absolute';
      presLive.el.style.visibility = 'hidden';
      states.append(presLive.el);

      const busy = el('div', 'kit-row');
      for (const [kind, label] of [[null, 'nobody'], ['page', 'a person'], ['tool', 'a harness']]) {
        // Born in its state rather than switched into it: `busy()` fades over
        // 90 ms, and a fixed specimen has nothing to fade from.
        const p = createPresence({ of: 'Raspberry Pi', state: 'online', can: ['online'],
                                   busyWords: { page: 'in use', tool: 'under test' }, busy: kind });
        busySpec.set(label, p.el);
        busy.append(p.el);
      }

      /**
       * The same component with `mode: 'dot'`: the ring alone, with the words
       * CLIPPED rather than removed, so the accessible name is still the whole
       * sentence and a change is still announced. It is an inline box with no
       * margins, so it drops into a button, a readout key or a row of machines
       * without any of them knowing what it is.
       */
      const inButton = el('button', '', null, { type: 'button' });
      inButton.append(createPresence({ of: 'the board', mode: 'dot', state: 'online' }).el,
        document.createTextNode(' switch it on'));
      inButton.style.cssText = 'display:inline-flex;align-items:center;gap:7px';

      // In a readout key, where a page already prints what a machine is doing.
      const inReadout = el('div', 'pos-readout');
      for (const [k, v, u, st] of [['relay', '1', '/16', 'online'], ['board', '', 'ms', 'unknown']]) {
        const c = el('div', 'pos-cell');
        const key = el('div', 'pos-k');
        key.style.cssText = 'display:flex;align-items:center;gap:5px';
        key.append(createPresence({ of: k, mode: 'dot', state: st }).el, document.createTextNode(k));
        const val = el('span', 'pos-v', v || null);
        if (st === 'unknown') val.dataset.state = 'pending';
        if (u) val.append(el('span', 'pos-u', u));
        c.append(key, val); inReadout.append(c);
      }

      // A row of machines, which is the shape /knobs/, /grains/ and /able/ all
      // want and all draw differently today.
      const machines = el('div', '');
      machines.style.cssText = 'display:grid;gap:6px;font:400 12px/1 var(--mono);color:var(--dim)';
      for (const [name, st] of [['studio-1', 'online'], ['the board', 'coming'],
        ['the Mac', 'offline'], ['the headset', 'unknown']]) {
        const row = el('div', '');
        row.style.cssText = 'display:flex;align-items:center;gap:8px';
        row.append(createPresence({ of: name, mode: 'dot', state: st }).el, document.createTextNode(name));

  // ── the flow diagram ────────────────────────────────────────────────────
  // 🔴 THE ONLY WAY TO KNOW THE WRAPPING IS RIGHT IS TO SEE FOUR AWKWARD ONES
  // SIDE BY SIDE. Every other component on this page can be judged from one
  // example; this one cannot, because what it does well or badly is decided by
  // strings nobody has typed yet. So the four cases below are the deliberately
  // difficult ones — a clean round trip, a label too long for its box, two
  // return paths that would sit on top of each other, and the whole thing at
  // the width of a phone.
  //
  // ⚠️ AND EACH ONE REPORTS WHAT IT HAD TO CUT. A drawer that quietly shortens
  // a label leaves the author believing the label fits: the picture looks
  // fine, and the missing half is only found by somebody reading the page on a
  // narrower screen. The line under each picture names every label that was
  // shortened and the width it had to fit — because a cut label is a label
  // that is too long, which is a thing to go and fix, not a feature.
  //
  // 🔴 AND THIS REPORT IS NOW THE ONLY PLACE A CUT SHOWS. The full string used
  // to sit in an svg `<title>`, i.e. in the browser's own tooltip, which is
  // gone: a tooltip drew the box's name ON TOP of the box while the line under
  // the picture was saying the same words, three channels for one fact. The
  // whole string is still in `aria-label` for a screen reader; nothing draws
  // it. So a cut that nobody reads here is a cut nobody reads at all.
  //
  // It also says whether the type was MEASURED or estimated. `getComputedText-
  // Length()` answers 0 inside a hidden ancestor, and every string then
  // "fits" — one line per box, no wrapping, no cuts. That failure reads as a
  // wrapping bug and is an attachment bug, so it gets its own word here rather
  // than being inferred from a picture that looks a bit too tidy.
  // Every diagram's own report, kept so the checks at the bottom can grade the
  // ones meant to fit against the one deliberately built not to.
  const drawn = new Map();
  const drew = new Map();
  function diagramCase(box, spec, { phone = false, id = null } = {}) {
    box.classList.add('kit-wide');
    const holder = el('div', phone ? 'kit-phone' : null);
    const report = el('div', 'kit-cut');
    box.append(holder, report);
    const made = createDiagram(holder, spec, {
      onRender: (i) => {
        const tag = id || spec.__id;
        if (tag) drawn.set(tag, i);
        report.textContent =
          `${i.mode === 'row' ? 'left to right' : 'one column'}, ${i.width} px wide` +
          `, boxes ${i.boxW} by ${i.boxH} px, ` +
          (i.measured ? 'type measured in the page' : 'TYPE ESTIMATED (nothing was measured)');
        if (!i.cuts.length) { report.append(', nothing cut'); return; }
        report.append(el('b', '', `, ${i.cuts.length} shortened to fit:`));
        for (const c of i.cuts) {
          report.append(`\n    ${c.id}, its ${c.where} at ${Math.round(c.width)} px` +
                        `\n      ${c.full}\n      became  ${c.shown}`);
        }
      },
    });
    // 🔴 KEPT, BECAUSE `onRender` CANNOT ANSWER "WAS THIS ARROW DRAWN". It
    // reports sizes and cuts; whether a link reached the picture at all is a
    // question about the svg, and the one defect this page exists to catch here
    // is a link that is quietly not there.
    if (id) drew.set(id, made);
    return made;
  }

  // check against another page's copy of it, which is the one thing this page

    'Every column is named by the caller, and exactly one of them must grow.',
    `createTable({ columns: [
  { key: 'dir',  width: 52, hi: true },
  { key: 'text', grow: true },
  { key: 'sent', width: 42, align: 'right' }] })`,
    (box) => {

        /**

          { key: 'at', width: 62, label: 'at' },

  // ── readout ─────────────────────────────────────────────────────────────
  // 🔴 AN EVEN NUMBER OF CELLS, AND A PENDING ONE SHOWS AN EM DASH AND NOTHING
  // ELSE. The row is `auto-fit minmax(96px, 1fr)`, so a phone gets two columns
  // and an odd count leaves a hole of a different colour in the last row. The
  // repair is to CUT the weakest cell, never to pad with a blank: every odd

  // ── presence ────────────────────────────────────────────────────────────
  // 🔴 FOUR STATES, AND THE FOURTH IS THE HONEST ONE. A badge that opens on
  // `offline` is a page asserting a measurement of hardware in another building

  // is watching. The specimens below are FOUR SEPARATE BADGES rather than one
  // pressed through four states, because the checks at the bottom measure them
  // and a check that drives a control is a check a visitor watches happen.
  section('COLOURS',
    '',
    // 🔴 NO SNIPPET. It read the whole table as two glued lines and the
    // swatches under it then said the same six things again, which is a block
    // telling a reader twice and neither time well. Reported 2026-09-20:
    // *"doubled and unuseful labels"*.

    (box) => {

        ['slate', 'var(--dim)', 'played, unmeasurable'],
        ['green', 'var(--ok)', 'inside what it promised'],
        ['amber', 'var(--warn)', 'later than promised'],
        ['red', 'var(--bad)', 'later still, or wrong'],
        ['yellow', 'var(--hi)', 'the one thing this page is about'],

  /**

   * item (all new should land top, make rule)"*. Asked for the other way on
   * 2026-09-20: *"add pieces to kit as well (bottom section). i want to verify
   * ui first"*. The top is where a reader finds what ARRIVED since they last
   * looked, which is what a SETTLED component wants. These are not settled.
   * ⚠️ **WHEN THEY ARE ADOPTED THEY MOVE UP.** If this comment is still here and
   * they are in a shipped page, the move was forgotten.
   */
  section('CHANNEL STRIP: KNOB, PAD, HALF PAD, FADER',
    'The four shapes a hardware layout is built from, with the knobs on a Novation '
    + 'Circuit’s measured macros, CC 80 to 87. A knob is dragged up and down rather than '
    + 'turned, and the last control in every row is disabled.',
    `createKnobBank([createKnob({ label: 'M1', sub: 'CC 80', min: 0, max: 127, value: 18 })])
createPadGrid({ cols: 8, rows: 2, pad: (x, y) => ({ tint, top, on }) })
createPadGrid({ cols: 8, pad: (x) => ({ half: true, label: String(x + 1) }) })
createFaderBank([createFader({ label: 'CH1', value: 30 })])`,
    (box) => {
      box.classList.add('kit-wide');

       * angular drag dies near the centre, where two pixels swing the angle
       * through most of its range.

          label: 'M' + (i + 1), sub: 'CC ' + (80 + i),
          min: 0, max: 127, value: 18 + i * 22,

        }));
      }
      // ⚠️ ONE SHOWN AS MOVED BY HARDWARE, because that state is the reason the
      // component tracks a source at all and it is invisible until something is

      knobSpec[3].set(96, { from: 'hardware', quiet: true });
      knobSpec.push(createKnob({

      const pRow = row();
      const TINT = ['#7fb2ff', '#ff9f7f'];

          tint: TINT[y],

      halfSpec = createPadGrid({
        cols: 8,
        pad: (x) => ({
          half: true, tint: '#8fd6a8',
          top: x % 2 === 0 ? String(x / 2 + 1) : '',

          on: x % 3 === 0,

          title: x === 7 ? 'disabled' : 'step ' + (x + 1),
        }),

      hRow.append(halfSpec.el);

      // ── round pads, which are the same component with a shape prop ────
      const rRow = row();
      roundSpec = createPadGrid({
        cols: 5,

          round: true, tint: '#c9a0ff',
          top: x === 0 ? 'top' : '',
          label: String(x + 1),

      const fRow = row();
      const faders = [];
      for (let i = 0; i < 5; i++) {
        faders.push(createFader({
          label: 'CH' + (i + 1),
          value: 30 + i * 20,
