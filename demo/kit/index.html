  section('status', 'READOUT AND LOG',
    'The numbers now and the record of what happened, split or joined into one surface.',
    `mount({ readout: { sent: '/s', lost: '' }, joined: true })   // one surface, at the foot
mount({ readout: { sent: '/s', lost: '' } })                 // two surfaces, the default
createReport({ readout, showLog: false, joined: true })      // the same pair, standalone
createReport({ readout, rows: 2, size: 'sm' })               // 1 x n, 2 x n. The count must be even
// size: 'sm' is a 15px value instead of 19. The KEY does not shrink with it`,
    (box) => {
      box.classList.add('kit-wide');

      // ── joined ──────────────────────────────────────────────────────────
      joinedSpec = createReport({ readout: { sent: '/s', lost: '' }, joined: true });
      joinedSpec.set('sent', 48);
      joinedSpec.set('lost', 0, 'ok');
      // A fixed time on every line, so this block draws the same picture on
      // every visit. `performance.now()` here would put the age of the page
      // into a specimen, which is a number that says nothing about the
      // component and changes every time anybody looks at it.
      joinedSpec.line('the board answered', 'hi', 1240);
      joinedSpec.line('holding a note', null, 2480);
      // ⚠️ THE PAGE IS PART OF THE SPECIMEN, because "at the foot" is half of
      // what joined MEANS and because the gap under it is the thing the shell
      // declares: 44 px, the diagram's number, rather than the 22 px between
      // two ordinary rows. Without a `.pos-body` here there is nothing for that
      // distance to be measured from.
      joinedPage = el('div', 'pos-body kit-mid', 'page');
      box.append(el('p', 'kit-cap', 'joined'), joinedPage, joinedSpec.foot);

      // ── joined, with only one of the two ────────────────────────────────
      // `readout: null` on a real page, which is the `/typist/` case: the
      // document IS the readout and cells repeating it would be the same facts
      // twice. The surface is still one box, and there is no seam in it.
      logOnlySpec = createReport({ joined: true });
      logOnlySpec.line('nothing to count on this page', null, 1240);
      box.append(el('p', 'kit-cap', 'joined, with no readout declared'), logOnlySpec.foot);

      // ⚠️ AND WITH NEITHER THERE IS NOTHING TO APPEND, which is the point:
      // `foot` comes back null rather than an empty box drawing its own two
      // borders as a 2 px band. Nothing goes in the page for this one.
      neitherSpec = createReport({ showLog: false, joined: true });

      // ── split ───────────────────────────────────────────────────────────
      splitSpec = createReport({ readout: { sent: '/s', lost: '' } });
      splitSpec.set('sent', 48);
      splitSpec.set('lost', 0, 'ok');
      splitSpec.line('the board answered', 'hi', 1240);
      splitSpec.line('holding a note', null, 2480);
      // a real `.pos-body` again, because the gap under a split log belongs to
      // the body rather than to the log; a plain div here would measure nothing
      splitPage = el('div', 'pos-body kit-mid', 'page');
      /**
       * 🔴 IN A STACK, BECAUSE A REAL PAGE IS ONE. The gaps this block measures
       * used to come from the components' own margins, and those came off on
       * 2026-09-17 so that a component cannot impose a gap on whoever places it.
       * A specimen assembled by hand in a box then had no gaps at all and its
       * own check said so, at `0.0 px above the page`. The fix is not to give
       * the margins back: it is for the specimen to be arranged the way the
       * thing it depicts is arranged.
       */
      const splitStack = createStack(undefined, 'kit-col');
      splitStack.add(splitSpec.top, splitPage, splitSpec.foot);
      box.append(el('p', 'kit-cap', 'split, which is the default'), splitStack.el);

      /**
       * 🔴 THE CELLS THEMSELVES, FOLDED IN FROM A SECTION OF THEIR OWN. Asked
       * 2026-09-17: *"rm separate readout cells, merge with newer one"*. A
       * readout was shown twice on this page: once as half of a surface and once
       * as a row of cells two screens away, so a reader met the same component
       * twice and had to work out they were the same thing. Same defect as the
       * presence badge, in the other half of the page.
       */
      const cells = el('div', 'pos-readout');
      for (const [k, v, u, state] of [['latency', '26.2', 'ms', 'ok'], ['holes', '3', '', 'warn'],
                                      ['lost', '0', '', ''], ['worst', '', 'ms', 'pending']]) {
        const c = el('div', 'pos-cell');
        c.append(el('div', 'pos-k', k));
        // ⚠️ THE UNIT GOES INSIDE THE VALUE, which is what shell.mjs does:
        // `.pos-v` is display:block, so a unit beside it as a SIBLING drops to a
        // line of its own with the value's whole line-height between them. The
        // sandbox existing to catch drift and then drifting itself is the joke
        // that writes itself.
        const val = el('span', 'pos-v', v);
        if (state) val.dataset.state = state;
        if (u) val.append(el('span', 'pos-u', u));
        c.append(val); cells.append(c);
      }
      box.append(el('p', 'kit-cap', 'the cells on their own, an even number of them'), cells);

      /**
       * 🔴 THE SHAPE, FOLDED IN HERE RATHER THAN GIVEN A SECTION, ASKED FOR
       * 2026-09-21 AS *"READOUT, FIXED COLUMNS - inegrate into readout docs"*.
       * It HAD a section of its own at the top of this page for about twenty
       * minutes, which is the same defect the block above records being fixed in
       * 2026-09-17: a reader met the readout twice and had to work out they were
       * the same component. The newest thing goes at the top of this page; a new
       * OPTION on an old component goes where that component already is.
       *
       * 🔴 AND IT IS WHY THE EVEN RULE EARNS ITS KEEP TWICE. The rule above was
       * demoted to EDITORIAL when the row became flex and the hole it described
       * stopped existing. `rows: 2` brings it back as structural: an even count
       * divides by two exactly, so a shape is always a full rectangle and never
       * a gap in the last row.
       */
      const ten = () => ({
        head: '', marker: '', written: 'B', 'not erasure': 'B', payload: 'B',
        filled: '%', entropy: '', nearest: 'B', 'synth 1': '', 'synth 2': '',
      });
      const fillTen = (r) => {
        r.set('head', 'USER'); r.set('marker', 'DC BB'); r.set('written', '10,620');
        r.set('not erasure', '9,206'); r.set('payload', '1,054'); r.set('filled', '84.7');
        r.set('entropy', '0.83'); r.set('nearest', '262');
        r.set('synth 1', 'SpaceRadio'); r.set('synth 2', 'SpooKey');
        return r;
      };
      // ⚠️ THE SAME TEN CELLS AND THE SAME TEN VALUES IN BOTH, so the only thing
      // that can differ on screen is the arrangement. Two specimens differing in
      // their content would be demonstrating the content.
      kitRoFlex = fillTen(createReport({ readout: ten(), showLog: false }));
      kitRoGrid = fillTen(createReport({ readout: ten(), rows: 2, size: 'sm', showLog: false }));
      box.append(
        el('p', 'kit-cap', 'ten cells with no shape asked for, which is the default'),
        kitRoFlex.readoutEl,
        el('p', 'kit-cap', 'the same ten as two rows, with a quieter value'),
        kitRoGrid.readoutEl,
      );
    });

  section('input', 'CONTROL ROW', '',
    `el('button', '', 'Ordinary', { type: 'button' })
el('button', 'pos-pri', 'Primary', { type: 'button' })
b.disabled = true
b.dataset.busy = '1'   // the working sweep, on either kind`,
    (box) => {
      /**
       * 🔴 BOTH KINDS IN ALL THREE STATES, WHICH IS SIX AND WAS FOUR. Reported
       * 2026-09-20: *"primary working button missing"*.
       * `button.pos-pri[data-busy="1"]` and `button.pos-pri:disabled` both have
       * rules in `shell.css` and neither had a specimen, so a rule that stopped
       * working would have looked exactly like a rule that works. A state with a

      for (const [cls, name] of [['', 'Ordinary'], ['pos-pri', 'Primary']]) {
        box.append(el('button', cls, name, { type: 'button' }));
        const off = el('button', cls, `${name}, off`, { type: 'button' });
        off.disabled = true;
        box.append(off);
        const busy = el('button', cls, `${name}, working`, { type: 'button' });
        busy.dataset.busy = '1';
        box.append(busy);
      }
    });

  // ── stepper ─────────────────────────────────────────────────────────────
  section('input', 'STEPPER',
    'Back and forward, with a middle holding nothing, `random`, or the one you are on. '
    + '`pick` replaces `random`, because the middle is one slot.',
    `createStepper({ what: 'look', prev, next })

  // ── the flow diagram ────────────────────────────────────────────────────
  // 🔴 THE ONLY WAY TO KNOW THE WRAPPING IS RIGHT IS TO SEE FOUR AWKWARD ONES
  // SIDE BY SIDE. Every other component on this page can be judged from one
  // example; this one cannot, because what it does well or badly is decided by
  // strings nobody has typed yet. So the four cases below are the deliberately
  // difficult ones — a clean round trip, a label too long for its box, two
  // return paths that would sit on top of each other, and the whole thing at
  // the width of a phone.
  //
  // ⚠️ AND EACH ONE REPORTS WHAT IT HAD TO CUT. A drawer that quietly shortens
  // a label leaves the author believing the label fits: the picture looks
  // fine, and the missing half is only found by somebody reading the page on a
  // narrower screen. The line under each picture names every label that was
  // shortened and the width it had to fit — because a cut label is a label
  // that is too long, which is a thing to go and fix, not a feature.
  //
  // 🔴 AND THIS REPORT IS NOW THE ONLY PLACE A CUT SHOWS. The full string used
  // to sit in an svg `<title>`, i.e. in the browser's own tooltip, which is
  // gone: a tooltip drew the box's name ON TOP of the box while the line under
  // the picture was saying the same words, three channels for one fact. The
  // whole string is still in `aria-label` for a screen reader; nothing draws
  // it. So a cut that nobody reads here is a cut nobody reads at all.
  //
  // It also says whether the type was MEASURED or estimated. `getComputedText-
  // Length()` answers 0 inside a hidden ancestor, and every string then
  // "fits" — one line per box, no wrapping, no cuts. That failure reads as a
  // wrapping bug and is an attachment bug, so it gets its own word here rather
  // than being inferred from a picture that looks a bit too tidy.
  // Every diagram's own report, kept so the checks at the bottom can grade the
  // ones meant to fit against the one deliberately built not to.
  const drawn = new Map();
  const drew = new Map();
  function diagramCase(box, spec, { phone = false, id = null } = {}) {
    box.classList.add('kit-wide');
    const holder = el('div', phone ? 'kit-phone' : null);
    const report = el('div', 'kit-cut');
    box.append(holder, report);
    const made = createDiagram(holder, spec, {
      onRender: (i) => {
        const tag = id || spec.__id;
        if (tag) drawn.set(tag, i);
        report.textContent =
          `${i.mode === 'row' ? 'left to right' : 'one column'}, ${i.width} px wide` +
          `, boxes ${i.boxW} by ${i.boxH} px, ` +
          (i.measured ? 'type measured in the page' : 'TYPE ESTIMATED (nothing was measured)');
        if (!i.cuts.length) { report.append(', nothing cut'); return; }
        report.append(el('b', '', `, ${i.cuts.length} shortened to fit:`));
        for (const c of i.cuts) {
          report.append(`\n    ${c.id}, its ${c.where} at ${Math.round(c.width)} px` +
                        `\n      ${c.full}\n      became  ${c.shown}`);
        }
      },
    });
    // 🔴 KEPT, BECAUSE `onRender` CANNOT ANSWER "WAS THIS ARROW DRAWN". It
    // reports sizes and cuts; whether a link reached the picture at all is a
    // question about the svg, and the one defect this page exists to catch here
    // is a link that is quietly not there.
    if (id) drew.set(id, made);
    return made;
  }

createPadGrid({ cols: 8, pad: (x) => ({ half: true, label: String(x + 1) }) })
createPadGrid({ cols: 5, pad: (x) => ({ round: true, bottom: 'play' }) })`,
    (box) => {
      box.classList.add('kit-wide');
      const stack = createStack(undefined, 'kit-col');
      const TINT = ['#7fb2ff', '#ff9f7f'];
      /**
       * 🔴 TWO ROWS, WHICH IS ALSO THE SPECIMEN THE BLOCK BELOW MEASURES. The
       * distance between two STACKED pads is the thing `--ctl-step` names, and
       * it needs two rows to exist at all.
       * ⚠️ AND ONLY EVERY OTHER PAD IS NAMED, which is what makes the reserved
       * slot visible: a pad with no top label still takes `--ctl-head`, or the
       * named ones would sit lower than the rest and it would read as a
       * rendering fault rather than a labelling choice.
       */
      padPair = createPadGrid({
        cols: 8, rows: 2,
        pad: (x, y) => ({
          tint: TINT[y],
          top: x % 2 === 0 ? String(x / 2 + 1) : '',
          on: y === 0 ? x % 2 === 0 : x % 4 === 1,
          disabled: x === 7 && y === 1,
          title: x === 7 && y === 1 ? 'disabled' : `step ${x + 1} of lane ${y + 1}`,
        }),
      });
      stack.titled('SQUARE, TWO LANES, AND ONLY EVERY OTHER ONE NAMED', padPair.el);

      stack.titled('HALF HEIGHT, WHICH IS ONE PROPERTY', createPadGrid({
        cols: 8,
        pad: (x) => ({
          half: true, tint: '#8fd6a8',
          top: x % 2 === 0 ? String(x / 2 + 1) : '',
          label: String(x + 1), on: x % 3 === 0, disabled: x === 7,
          title: x === 7 ? 'disabled' : `step ${x + 1}`,
        }),
      }).el);

      stack.titled('ROUND, WHICH IS ANOTHER', createPadGrid({
        cols: 5,
        pad: (x) => ({
          round: true, tint: '#c9a0ff',
          top: x === 0 ? 'top' : '', label: String(x + 1),
          bottom: ['play', 'stop', 'rec', '', 'off'][x],
          on: x === 2, disabled: x === 4,
          title: x === 4 ? 'disabled' : `round pad ${x + 1}`,
        }),
      }).el);
      box.append(stack.el);
    });

  section('hardware', 'FADER',
    'The slider turned ninety degrees, with its value above the lane and its name under it.',
    `createFader({ label: 'CH1', value: 30 })
createFaderBank([f1, f2, f3])
f.set(104, { from: 'hardware', quiet: true })`,
    (box) => {
      box.classList.add('kit-wide');
      const fs = [];
      for (let i = 0; i < 4; i++) {
        fs.push(createFader({ label: `CH${i + 1}`, value: 30 + i * 20,
          title: `channel ${i + 1} fader, pitch bend on channel ${i + 1}` }));
      }
      fs[2].set(104, { from: 'hardware', quiet: true });
      fs.push(createFader({ label: 'FX', value: 64, disabled: true,
                            title: 'disabled: no master is bound' }));
      box.append(createFaderBank(fs, {}).el);
    });

  /**
   * 🔴 THE CONTRACT BETWEEN ALL THREE, AND IT IS THE REASON THIS BLOCK EXISTS
   * RATHER THAN THE PARTS ALONE. `/twelve/` was corrected by screenshot twelve
   * times in one evening and **every single correction was the page doing
   * arithmetic about a component's insides**: a button column lifted by a
   * foot's height, which was right until the pads grew a label; a lane starting
   * 30 px below the button beside it; two labels ending on different lines.
   * The sentence the kit publishes is *the distance between two stacked
   * controls is three things, not one*, and nobody believes a sentence like
   * that until they see the three.
   * ⚠️ EVERY FIGURE IS READ OFF THE DOCUMENT, never typed. `--ctl-head`,
   * `--ctl-foot` and `--ctl-gap` are stated once in `shell.css` and
   * `--ctl-step` is declared as the sum of them there, so this block asks for
   * all four and draws what it was told. A number typed here would be a second
   * copy of a measurement and this project's rule is that two copies disagree.
   */
  section('hardware', 'HEAD, GAP AND FOOT',
    'The distance between two stacked controls is three things, and only the middle one is a gap.',
    `--ctl-head   the slot above the working surface, reserved even when empty
--ctl-foot   the slot below it
--ctl-gap    the only part of it that is actually a gap
--ctl-step   declared as the sum of the three, so a caller never adds them up`,
    (box) => {
      box.classList.add('kit-wide');
      const root = getComputedStyle(document.documentElement);
      const px = (n) => root.getPropertyValue(n).trim();
      const stack = createStack(undefined, 'kit-col');

      /**
       * 🔴 THE BANDS ARE DRAWN AT THE HEIGHTS THE STYLESHEET STATES, so the
       * picture cannot disagree with the contract: each one is `height:
       * var(--ctl-*)` rather than a figure this block chose.
       * 🔴 AND `--ctl-step` IS DRAWN AS A FOURTH BAND BESIDE THE THREE RATHER
       * THAN PRINTED AS A NUMBER, WHICH IS ALSO THE ONLY WAY TO READ IT. A
       * custom property is SUBSTITUTED, not computed, so
       * `getPropertyValue('--ctl-step')` hands back the literal text
       * `calc(var(--ctl-foot) + var(--ctl-gap) + var(--ctl-head))` and
       * `parseFloat` of that is **NaN**. This block read NaN for one run. The
       * value only exists once a browser has resolved it against a real
       * property, so the band IS the measurement, and the two columns being the
       * same height is the whole claim in one look.
       */
      const ladder = el('div', 'kit-step');
      const col = el('div', 'kit-step-c');
      for (const [name, prop] of [['head', '--ctl-head'], ['gap', '--ctl-gap'],
                                  ['foot', '--ctl-foot']]) {
        const band = el('div', 'kit-step-b', null);
        band.style.height = `var(${prop})`;
        band.append(el('span', 'kit-step-n', `${name} ${px(prop)}`));
        col.append(band);
      }
      stepBand = el('div', 'kit-step-b kit-step-s', null);
      stepBand.style.height = 'var(--ctl-step)';
      stepBand.append(el('span', 'kit-step-n', 'step'));
      const right = el('div', 'kit-step-c');
      right.append(stepBand);
      ladder.append(col, right);
      stack.titled('THREE DISTANCES, AND ONE NAME FOR ALL THREE', ladder);

      /**
       * 🔴 AND THE PAIR THE FIGURES ARE ABOUT, STACKED, WITH BOTH LABELS ON
       * BOTH. The check below measures the distance between the two BUTTONS,
       * which is where `--ctl-step` is supposed to land, and it needs a pad
       * that has something under it as well as over it or there is no foot in
       * the measurement.
       * 🔴 MEASURED WHILE WRITING THIS: TWO STACKED PADS WITH NO BOTTOM LABEL
       * SIT 23 px APART, NOT 40. That is `gap` plus `head` exactly, so the foot
       * slot is NOT reserved on a pad with nothing under it, while the head
       * slot IS reserved on a pad with nothing over it. The kit's own rule is
       * written about the head, so this is an asymmetry rather than a
       * contradiction, and it is left alone here and reported rather than
       * patched from a gallery. What it means for a caller is that `--ctl-step`
       * is the distance between two FULLY LABELLED controls and an upper bound
       * on any other pair.
       * ⚠️ THE SPECIMEN IS THIS BLOCK'S OWN. The two-lane grid in `PAD` is that
       * block's specimen and a check does not get to decide what a specimen
       * looks like, which is this project's rule about a check that mutates
       * arriving from the other side.
       */
      /**
       * ⚠️ AND THE COLUMN IS A REAL `createPadGrid`, NOT A FLEX COLUMN OF MY
       * OWN, WHICH IS ALSO A MEASUREMENT. A hand-rolled column read **32 px**
       * between the two buttons, which is `foot` plus `head` and no gap: the
       * `--ctl-gap` in the middle of the step belongs to the CONTAINER, and
       * `.pos-pad-grid` and `.pos-crow` are the two things in the kit that
       * declare it. So a specimen assembled by hand cannot demonstrate the
       * step, for the same reason the split readout block below had to be put
       * in a stack before its gaps existed at all.
       */
      const stepGrid = createPadGrid({
        cols: 1, rows: 2,
        pad: (x, y) => ({
          top: String(y + 1), label: y === 0 ? 'A' : 'B',
          bottom: y === 0 ? 'kick' : 'snare',
          tint: y === 0 ? '#7fb2ff' : '#ff9f7f', on: y === 0,
          title: 'labelled above and below',
        }),
      });
      stepPads = [stepGrid.at(0, 0), stepGrid.at(0, 1)];
      stack.titled('TWO OF THEM STACKED, WHICH IS WHERE THE STEP LANDS', stepGrid.el);

      /**
       * 🔴 AND A SLOT IS RESERVED EVEN WHEN IT IS EMPTY. One pad named above,
       * one with nothing there, and both buttons start on the same line; a grid
       * whose downbeats alone are named would otherwise have those pads sitting
       * higher than the rest, which reads as a rendering fault rather than as a
       * labelling choice.
       * ⚠️ MEASURE THE BUTTON, NEVER THE WRAPPER. A pad returns its wrapper as
       * `el` and exposes `button` separately; an assert reading the wrapper
       * once reported a button 17 px low while the button was exactly right.
       */
      const pair = el('div', 'pos-crow');
      namedPad = createPad({ top: '1', label: 'A', tint: '#7fb2ff', on: true,
                             title: 'named above' });
      barePad = createPad({ label: 'B', tint: '#7fb2ff',
                            title: 'nothing above it, and the slot is still reserved' });
      pair.append(namedPad.el, barePad.el);
      stack.titled('ONE NAMED ABOVE AND ONE NOT, STARTING ON ONE LINE', pair);
      box.append(stack.el);
    });

  /**
   * 🔴 AT THE BOTTOM, WHICH CONTRADICTS THIS PROJECT'S OWN RULE, DELIBERATELY.
   * CLAUDE.md, instructed 2026-09-16: *"in kit move online stuff to topmost
   * item (all new should land top, make rule)"*. Asked for the other way on
   * 2026-09-20: *"add pieces to kit as well (bottom section). i want to verify
   * ui first"*. The top is where a reader finds what ARRIVED since they last
   * looked, which is what a SETTLED component wants. These are not settled.
   * ⚠️ **WHEN THEY ARE ADOPTED THEY MOVE UP.** If this comment is still here and
   * they are in a shipped page, the move was forgotten.
   */
  /* 🔴 THE FOUR NAMES CAME OFF THE HEADING 2026-09-21, ASKED FOR AS *"rm :
     KNOB, PAD, HALF PAD, FADER"*. Each of the four has its own section on this
     page already, the snippet below names all four constructors, and a heading
     that lists its own contents is the caption the contents already are. */
  /**
   * 🔴 REAL CHANNELS SINCE 2026-09-22, AND THE REPORT SAID *"still"*: *"still
   * not aligned to vertical separated lanes"*. It had been asked for once
   * before and never started.
   *
   * 🔴 **WHAT WAS HERE WAS NOT A CHANNEL STRIP, AND ITS OWN DESCRIPTION SAID
   * SO**: *"the four shapes a hardware layout is built from"*. Four independent
   * HORIZONTAL rows, six knobs over eight pad columns over six faders, three
   * different pitches stacked, so nothing shared a column with anything above
   * it and a reader could not follow any channel down the picture. A catalogue
   * of four components arranged vertically, captioned as a channel strip.
   * ⚠️ **AND THE CATALOGUE IS NOT LOST**, which is why this is a rebuild rather
   * than an argument: KNOB, PAD and FADER each have their own block on this
   * page, which is where a reader compares shapes. This block is the one place
   * they are assembled, and assembly is the thing it was failing to show.
   *
   * 🔴 **THE DIVIDER IS THE PANEL'S OWN LINE.** `.panel-fixed-l` carries
   * `border-right: 1px solid var(--line)` with `padding-right:
   * var(--panel-gap)`, and `.kit-chan` uses the same two tokens, so a divider
   * here and a divider on `/twelve/` are one measurement.
   *
   * 🔴 **AND THE ALIGNMENT IS THE CONTRACT, NEVER ARITHMETIC IN THIS FILE.**
   * `--ctl-head` and `--ctl-foot` reserve the slot above and below every
   * working surface whether or not it is filled, so a column of a knob, two
   * pads and a fader lines up by itself. `positron-ui` records `/twelve/` being
   * corrected twelve times in one evening, every one of them the page doing
   * arithmetic about a component's insides. There is not one margin here.
   * ⚠️ **A KNOB IS `--ctl-w * 1.1` WIDE AND A PAD IS `--ctl-w`**, which is a
   * real difference rather than a bug, and `/circuit/` solves it by centring
   * both rather than resizing either. So does this.
   *
   * 🔴 **THREE ALIGNMENTS THAT LOOK LIKE ONE ARE THREE ASSERTS**, which is the
   * other half of the same record: two of `/twelve/`'s three lined up while the
   * third was 30 px out, and later the boxes matched while the faders inside
   * them were 17 px apart. The checks below read the DIAL, the BUTTON and the
   * LANE, never a wrapper.
   */
  section('hardware', 'CHANNEL STRIP',
    'Four channels as four vertical lanes, each control in a lane centred on one line '
    + 'and each lane divided from the next by the panel’s own border.',
    `const lane = el('div', 'kit-chan')
lane.append(knob.el, padGrid.el, halfPad.el, fader.el)
// .kit-chan is the panel's divider: border-right var(--line), padding var(--panel-gap)
// nothing here sets a margin: --ctl-head and --ctl-foot do the lining up`,
    (box) => {
      box.classList.add('kit-wide');
      const chans = el('div', 'kit-chans');
      box.append(chans);

      /* Four channels, and the last one is disabled throughout, because a
         disabled control has to line up with a live one or the state reads as
         a rendering fault. */
      const lanes = [];
      for (let i = 0; i < 4; i++) {
        const off = i === 3;
        const lane = el('div', 'kit-chan');
        const knob = createKnob({
          label: 'M' + (i + 1), sub: 'CC ' + (80 + i),
          min: 0, max: 127, value: 18 + i * 22, disabled: off,
          title: off ? 'disabled: nothing is bound to this one'
            : 'macro ' + (i + 1) + ', CC ' + (80 + i) + ' on channel 1',
        });
        /* One pad per lane, not a grid across the page, because a grid across
           the page is what this block was doing wrong. */
        const pad = createPad({
          label: String(i + 1), top: 'step', tint: '#7fb2ff',
          on: i % 2 === 0, disabled: off,
          title: off ? 'disabled' : 'step ' + (i + 1),
        });
        const half = createPad({
          half: true, label: String(i + 1), tint: '#8fd6a8',
          on: i % 3 === 0, disabled: off,
          title: off ? 'disabled' : 'mute ' + (i + 1),
        });
        const fader = createFader({
          label: 'CH' + (i + 1), value: 30 + i * 20, disabled: off,
          title: off ? 'disabled: no channel is bound'
            : 'channel ' + (i + 1) + ' fader, pitch bend on channel ' + (i + 1),
        });
        lane.append(knob.el, pad.el, half.el, fader.el,
          el('div', 'kit-chan-l', 'CH' + (i + 1)));
        chans.append(lane);
        lanes.push({ lane, knob, pad, half, fader });
      }
      /* ⚠️ ONE SHOWN AS MOVED BY HARDWARE, because that state is the reason the
         component tracks a source at all and it is invisible until something
         is in it. A live binding and one nobody ever bound look identical. */
      lanes[1].knob.set(96, { from: 'hardware', quiet: true });
      lanes[2].fader.set(104, { from: 'hardware', quiet: true });
      chanSpec = lanes;
    });

  // 🔴 EVERY BLOCK IS BUILT, SO THE PARTS CLOSE. The window was open for the
  // build because a diagram measures its own text when it is made and came out
  // laid out for 320 px inside a 658 px panel without it. Nothing above this
  // line waited for anything, so no frame was ever rendered with all five parts
  // open, and the scroll below lands where a reader will actually find it.
  settle();

  /**
   * 🔴 THE MARK THAT SAYS WHICH PART HOLDS SOMETHING NEW, AND IT IS THE RULE
   * THIS REORGANISATION WOULD OTHERWISE HAVE BROKEN IN SILENCE. The standing
   * instruction is *"in kit move online stuff to topmost item (all new should
   * land top, make rule)"*, and the reason is written down: this page is read
   * by somebody checking what the kit has, and what they do not know about is
   * what arrived since they last looked. **A tab row hides four fifths of the
   * page**, so the newest block can be at the top of a part nobody opens, and a
   * reader who never presses that tab is never told. A quiet break is the worst
   * kind.
   *
   * ✅ SO IT IS TWO FACTS AND NEITHER IS TYPED. The newest block is the FIRST
   * call to `section()`, which is the order of the file; the part holding it is
   * the part named on that call; and the mark goes on whichever tab that turns
   * out to be. Nothing here names a block or a part, so a block added at the
   * top of the file tomorrow moves the mark by itself and there is no second
   * copy to go stale. Both facts are asserted at the bottom, including the
   * negative half, that no other tab carries it.
   *
   * ⚠️ AND THE DEFAULT PART DOES NOT MOVE. Opening on whichever part is newest
   * would answer the same question and cost a reader their muscle memory every
   * time somebody lands a block somewhere else. A mark costs nothing and says
   * more: it names the part rather than replacing where you were.
   */
  // ⚠️ `newestSection` STAYS: the hash router below uses it, and so does the
  // assert that the newest block is the first one in its part. What went is the
  // MARK on the tab, not the knowledge of which block is newest.
  const newestSection = built[0] ? idFor(built[0]) : null;
  const newestPart = newestSection ? sectionTab.get(newestSection) : null;

  /**
   * 🔴 A HASH NAMING A BLOCK OPENS THE PART HOLDING IT. `/kit/#slider` has
   * never worked on this page, because nothing on it carried an `id`; behind a
   * tab row it would be worse than not working, because the block exists, is
   * addressed, and is in a panel that is `hidden`.
   * ⚠️ THE HASH IS PUT BACK AFTER THE TAB TOOK IT. `createTabs` writes the
   * part's own id over the address on its first `go`, which is right for a tab
   * press and wrong for an arrival, so the block's id goes back once it has
   * been scrolled to and survives until the reader presses a tab.
   */
  if (wanted && sectionTab.has(wanted)) {
    kitTabs.go(sectionTab.get(wanted));
    try { history.replaceState(null, '', `#${encodeURIComponent(wanted)}`); } catch { /* file:// */ }
    document.getElementById(wanted)?.scrollIntoView({ block: 'start' });
  }

  // ── what a machine can say about this page ──────────────────────────────
  //
  // 🔴 THIS PAGE WAS THE ONE THE SUITE COULD NOT SEE. Its whole job is to make
  // component drift visible, and `node demo/verify.mjs kit` answered "nothing
  // for this harness to verify" — so the drift it exists to catch had to be
  // caught by somebody looking. Every check below grades a defect that has
  // ACTUALLY happened here, which is the only reason any of them is worth the
  // run time.
  //
  // ⚠️ THEY RUN AFTER A FRAME. Two of them measure laid-out geometry, and
  // `getBoundingClientRect` before the first paint answers about a page that
  // has not been arranged yet.
  //
  // ⚠️ AND THEY ARE NOT NUMBERED ANY MORE. Every check below used to open with
  // a hand-typed index, which is a second copy of the order they already sit
  // in: inserting six at the top on 2026-09-19 made seventeen of them wrong at
  // once, and a number a reader trusts and nobody re-counts is worse than no
  // number. The order is the file.
  // ⚠️ AND THE MEASURING WINDOW IS SHUT ACROSS THIS WAIT, which is the first of
  // the three places it has to be. It has been open since before the blocks
  // were built, because a diagram measures its own text when it is made; this
  // is the first frame anybody could see, so it closes for that frame and opens
  // again underneath the checks. See `measure()` above.
  settle();
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  measure();

  /**
   * 🔴 THE TWO COLUMNS SHARE ONE PITCH, AND NOTHING IN THE BROWSER MAKES THEM.
   * The labels and the steps are separate flex children, so a pad's height and
   * a label row's height are two unrelated numbers that happen to be written
   * from one token. `/tom/` asserts this over 64 rows because `/twelve/`
   * records three alignments that looked like one with two of them lining up
   * while the third was 30 px out. Six rows is enough here and the claim is the
   * same: first row against first label, last against last.
   */
  /**
   * 🔴 A ROW THAT CANNOT FIT SCROLLS INSIDE ITSELF, AND THAT TAKES TWO
   * PROPERTIES ON ONE ELEMENT. `overflow-x` cannot shrink a flex or grid item
   * below its content, so a scroller without `min-width: 0` beside it drags the
   * PAGE instead, and `positron-ui` has 141 px of measured page overflow from
   * exactly that pair being half written.
   * 🔴 AND BOTH OF THESE WERE HALF WRITTEN UNTIL 2026-09-22, REPORTED FROM A
   * PHONE. `.pos-padgrid` had the `min-width` and not the overflow, so eight
   * fixed columns spilled 27 px out of their own box; the channel strip's own
   * scroller (`.kit-hwitems` then, `.kit-chans` now) had the
   * same half, and one channel strip at 424 px in a 358 px box dragged the
   * document **65 px sideways**. Both comments beside those rules claimed a
   * behaviour the rules did not have, one saying it wrapped and one saying this
   * project refuses horizontal scroll.
   * ⚠️ **THIS READS THE COMPUTED VALUE AND NOT THE STYLESHEET**, which is the
   * only thing that knows which rule won, and it is the fourth dead rule this
   * repository has found that way.
   * ⚠️ **AND IT IS NOT A PHONE CHECK.** `demo/verify.mjs` runs at 756 px with
   * no viewport override, so nothing here has entered a media query. What this
   * grades is that the two properties are still declared together. The
   * overflow itself was measured by hand at 390 px across all ten tabs, page
   * overflow 0, and nothing in this suite can say that.
   */
  {
    /* 🔴 `.pos-cg` JOINED THIS LIST 2026-09-22 AND SHIPPED WITH NEITHER HALF.
       Its columns are fixed at the measured pitch and never `1fr`, precisely so
       the lattice stays square at every width, so a five wide grid of 50.6 px
       knobs is 280 px whatever the phone is and had nowhere to go but the
       document. Third component with the same defect in three days. */
    const pairs = [
      ['.pos-padgrid', document.querySelector('.pos-padgrid')],
      ['.kit-chans', document.querySelector('.kit-chans')],
      ['.pos-cg', document.querySelector('.pos-cg')],
    ].filter(([, n]) => n);
    const read = pairs.map(([sel, n]) => {
      const cs = getComputedStyle(n);
      return { sel, ox: cs.overflowX, mw: cs.minWidth };
    });
    d.assert('a row too wide for its box scrolls inside itself, which is two properties and not one',
      read.length === 3
      && read.every((r) => r.ox === 'auto' && r.mw === '0px'),
      read.map((r) => `${r.sel} is overflow-x ${r.ox} at min-width ${r.mw}`).join(', ')
        || 'neither element is on the page');
  }

  /**
   * 🔴 THE PLATE IS READ AS THE BROWSER RENDERS IT, NOT AS THE PAGE TYPED IT.
   * `createNameplate.shown()` applies the `text-transform` before answering,
   * and `panel-layout.mjs` records why: `/circuit/` rendered `NOVATION`
   * correctly while its source typed `novation`, leaning entirely on the
   * stylesheet, and a check reading `textContent` graded the source and stayed
   * green whichever half went missing.
   * ⚠️ AND THE SECOND HALF IS THE SINGLE LINE CASE, which is the one a caller
   * can get wrong: `ends` is `space-between` and parks a lone child on the
   * LEFT, so a plate with no maker has to be `end`. `plateSpec` decides it and
   * this reads the decision off the rendered plate.
   */
  /**
   * 🔴 THE CLAIM IS THE SQUARE, SO THE CHECK MEASURES DIAL CENTRES AND NOTHING
   * ELSE. Asserting the pitch token would grade what the component WROTE; the
   * request was about where the working surfaces land, which is one layer out
   * and is the only thing a reader can see.
   * ⚠️ **AND IT IS A LATTICE, NOT ONE PAIR.** Across against down on a three
   * by two, so a grid that happened to be square at cell zero and drifted
   * cannot pass. The `/twelve/` lesson is exactly this: two of three
   * alignments lined up while the third was 30 px out.
   * ⚠️ THE NEGATIVE CONTROL IS THE FADERS. A different control with a
   * different natural shape, on the same rule, so a component that only
   * happened to work for knobs goes red.
   */
  /**
   * 🔴 THE INVISIBLE HAND ON A KNOB, GRADED WHERE IT IS DEMONSTRATED. Three
   * claims, and they are three asserts rather than one because two of them
   * lined up on `/twelve/` while the third was 30 px out.
   */
  if (handKnobs) {
    const withHand = handKnobs[3];
    const plain = handKnobs[0];
    const btn = withHand.el.querySelector('.pos-knob-hand');
    const dial = withHand.el.querySelector('.pos-knob-dial');
    const kb = withHand.el.getBoundingClientRect();
    const db = dial.getBoundingClientRect();
    const bb = btn.getBoundingClientRect();
    const f = parseFloat(getComputedStyle(withHand.el).getPropertyValue('--knob-ring-f'));
    /* WHERE THE RING'S LOWER EDGE ACTUALLY IS ON SCREEN, from the drawing's own
       fraction rather than from a number typed here. */
    const ringY = db.top + db.height * f;

    d.assert('the hand button is centred across the knob, not merely near the middle',
      Math.abs((bb.left + bb.width / 2) - (kb.left + kb.width / 2)) <= 0.6,
      `button centre ${(bb.left + bb.width / 2).toFixed(1)} px against the knob's `
      + `${(kb.left + kb.width / 2).toFixed(1)} px`);

    d.assert('the hand button sits on the ring\u2019s lower edge, which is read off the drawing',
      Math.abs((bb.top + bb.height / 2) - ringY) <= 1.0,
      `button centre y ${(bb.top + bb.height / 2).toFixed(1)} px against the ring edge at `
      + `${ringY.toFixed(1)} px, which is ${f} of a ${db.height.toFixed(1)} px drawing`);

    /* 🔴 THE ONE THAT MATTERS MOST, AND IT IS THE REASON THE BUTTON IS
       ABSOLUTE. A control that gained height here would push its own label down
       and every knob beside it would be a label out of line, which is the
       `--ctl-head` and `--ctl-foot` contract `positron-ui` states. */
    d.assert('a knob with a hand is exactly as tall as one without, so a row still lines up',
      Math.abs(kb.height - plain.el.getBoundingClientRect().height) <= 0.6
      && Math.abs(kb.top - plain.el.getBoundingClientRect().top) <= 0.6,
      `${kb.height.toFixed(1)} px against ${plain.el.getBoundingClientRect().height.toFixed(1)} px, `
      + `tops ${kb.top.toFixed(1)} and ${plain.el.getBoundingClientRect().top.toFixed(1)}`);

    /* 🔴 THE SIZE ASK, MEASURED AS A RATIO AND NOT AS A PIXEL COUNT. `--ctl-w`
       is the thing 10 per cent was asked against, so the assert reads both and
       divides rather than believing 50.6. */
    const ctlW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ctl-w'));
    const pad = document.querySelector('.pos-pad');
    d.assert('a knob is ten per cent wider than a control row\u2019s unit, and a pad is not',
      Math.abs(db.width / ctlW - 1.1) <= 0.02
      && (!pad || Math.abs(pad.getBoundingClientRect().width - ctlW) <= 1),
      `dial ${db.width.toFixed(1)} px against --ctl-w ${ctlW} px, a factor of `
      + `${(db.width / ctlW).toFixed(3)}`
      + (pad ? `, and a pad still ${pad.getBoundingClientRect().width.toFixed(1)} px` : ', no pad on the page'));

    /* 🔴 THE NEGATIVE CONTROL: a knob that was not given one has no button at
       all. Without this, a selector that matched nothing would satisfy every
       assert above by never running them. */
    d.assert('a knob with no hand has no button, so the option is what puts it there',
      plain.el.querySelector('.pos-knob-hand') === null && withHand.hand !== null
      && plain.hand === null,
      `the plain knob has ${plain.el.querySelectorAll('.pos-knob-hand').length} and `
      + `publishes ${plain.hand === null ? 'no hand' : 'a hand'}`);
  }

  if (cgSpec) {
    for (const g of [cgSpec.six, cgSpec.four]) g.size();
    /* ⚠️ `dy` IS null ON A SINGLE ROW, AND MY FIRST VERSION READ `c[cols].y`
       UNCONDITIONALLY AND THREW ON THE FADERS, WHICH ARE FOUR IN FOUR COLUMNS.
       The page died on `__demo.ready` rather than failing an assert, which is
       the worst shape: the harness names itself and nothing in the per-page
       count moves to say what changed. A grid with no second row has no down
       to measure and says so. */
    const read = (g, cols) => {
      const c = g.centres();
      return {
        dx: +(c[1].x - c[0].x).toFixed(1),
        dy: c[cols] ? +(c[cols].y - c[0].y).toFixed(1) : null,
        dx2: c[2] ? +(c[2].x - c[1].x).toFixed(1) : null,
        pitch: g.pitch(),
      };
    };
    const six = read(cgSpec.six, 3);
    const four = read(cgSpec.four, 2);
    d.assert('dial centres land on a square lattice, across equalling down, on both grids',
      Math.abs(six.dx - six.dy) <= 1 && Math.abs(four.dx - four.dy) <= 1
      && six.dx > 40 && four.dx > 40,
      `three by two is ${six.dx} across against ${six.dy} down at a `
      + `${six.pitch} px pitch, two by two is ${four.dx} against ${four.dy}`);

    /* 🔴 EVERY COLUMN, NOT THE FIRST PAIR. A fixed track count makes this true
       by construction, which is the point: it is graded so that the day
       somebody reaches for `1fr` it goes red rather than being square at one
       width only. */
    d.assert('the columns are even across the row, so the lattice does not drift',
      Math.abs(six.dx - six.dx2) <= 0.6,
      `first gap ${six.dx}, second ${six.dx2}`);

    /* 🔴 THE NEGATIVE CONTROL THAT USED TO SIT HERE IS GONE WITH ITS SPECIMEN,
       2026-09-22, and the block above says at length what stopped being
       checked. It read `NEGATIVE CONTROL: a grid of faders keeps the same
       centre to centre rule`.
       ⚠️ THE ONE THING WORTH KEEPING OUT OF IT IS THE TERM THAT MADE IT RIGHT:
       CENTRE TO CENTRE IS THE PITCH PLUS THE GAP. It read the pitch alone once
       and went red at `166 apart at a 156 px pitch`, and the ten it was out by
       IS the gap. The knob grids show the same, 101 across at a 91 px pitch, so
       the two asserts above carry that term and are the reason this note is
       here rather than in a commit message nobody will find. */
  }

  if (instSpec) {
    const named = instSpec.named.shown();
    /* 🔴 THE COMPUTED `justify-content`, AND MY FIRST TRY READ RECTS AND WENT
       RED ON A PLATE DOING EXACTLY WHAT IT PROMISES. A `.panel-plate-l` is a
       full width flex child, so its own left and right edges sit at the
       plate's whatever the placement is, and both offsets came back `0.0 px`.
       The rect could not see the difference; the property that implements it
       can. `ends` is `space-between` and `end` is `flex-end`, which is the
       whole of what those two placements are. */
    /* ⚠️ THE ONE LINE HALF OF THIS ASSERT MOVED UP THE PAGE WITH ITS SPECIMEN.
       It read `bare.length === 1 && bare[0] === 'MODEL 12'` and `end` is
       `flex-end`, and the INSTRUMENT HEADER block grades both against its own
       one line plate. What is no longer graded ANYWHERE is `end` inside a
       case's top inset, which is named in the comment above this block. */
    const nj = getComputedStyle(instSpec.named.plate.el).justifyContent;
    d.assert('an instrument prints the maker at one end and the model at the other, as rendered',
      named.join(' / ') === 'POSITRON / PLAI' && named.length === 2
      && instSpec.named.plate.place === 'ends' && nj === 'space-between',
      `named reads ${JSON.stringify(named)} at ${instSpec.named.plate.place} (${nj})`);

    /* 🔴 THE PLATE BELONGS TO THE CASE, ABOVE BOTH HALVES, or it scrolls away
       from the instrument it names. `/tom/` found that by prepending. */
    /**
     * 🔴 THE PLATE SITS OFF THE TOP BY THE CASE'S OWN INSET, AND NOTHING
     * GRADED THIS UNTIL 2026-09-22. `.panel-case` is `padding: 0
     * var(--panel-pad)`, horizontal only, so a plate put in from outside sat
     * on the top border. `/tom/` repaired that in its OWN stylesheet, `/plai/`
     * had no such rule, and this wrapper shipped the defect to a new page on
     * the day it was written to prevent it.
     * ⚠️ **THE CLAIM IS AN EQUALITY, NOT A NUMBER.** The plate is as far from
     * the top as the controls are from the sides, so nobody can satisfy this
     * by typing a value they liked, and a change to `--panel-pad` moves both
     * together or goes red.
     */
    {
      const caseEl = instSpec.named.el;
      const cs = getComputedStyle(caseEl);
      const cr = caseEl.getBoundingClientRect();
      /* 🔴 THE LINE, NOT THE PLATE'S BOX, AND THIS WENT RED FIRST FOR READING
         THE WRONG EDGE. The inset is `padding-block` on the plate, so the plate
         BOX starts at the case's content top and its TEXT sits 20 px down. The
         box's own rect reported `0.0 px` while the picture was correct. What a
         reader sees is the line. */
      const pr = instSpec.named.plate.el
        .querySelector('.panel-plate-l').getBoundingClientRect();
      const side = parseFloat(cs.paddingLeft);
      const top = pr.top - cr.top - parseFloat(cs.borderTopWidth);
      d.assert('the plate sits off the top by the same inset the controls sit off the sides',
        side > 0 && Math.abs(top - side) <= 1,
        `${top.toFixed(1)} px above the plate against ${side.toFixed(1)} px at the side`);
    }

    /* ⚠️ THE STRIP IS NOT A CHILD OF THE CASE, IT IS INSIDE `panel-wrap`, and
       my first reading of this assumed otherwise and went red saying so. What
       the claim is really about is ORDER: the plate is first, and everything
       the panel builds comes after it, so the plate cannot scroll away from
       the instrument it names. `compareDocumentPosition` answers that whatever
       the nesting turns out to be. */
    const kids = [...instSpec.named.el.children];
    const after = instSpec.named.plate.el
      .compareDocumentPosition(instSpec.named.strip) & Node.DOCUMENT_POSITION_FOLLOWING;
    d.assert('the plate is the case\u2019s first child, and the scrolling strip comes after it',
      kids[0] === instSpec.named.plate.el && !!after
      && instSpec.named.el.contains(instSpec.named.strip),
      `the case holds ${kids.map((k) => (k.className || '').toString().split(' ')[0]).join(', ')}, `
      + `and the strip is ${after ? 'after' : 'NOT after'} the plate`);
  }

  if (chanSpec) {
    /**
     * 🔴 THREE ALIGNMENTS THAT LOOK LIKE ONE ARE THREE ASSERTS. `positron-ui`
     * records two of `/twelve/`'s three lining up while the third was 30 px
     * out, and later the boxes matching perfectly while the faders inside them
     * were 17 px apart. One summary check would have passed both times.
     * 🔴 **AND EACH ONE READS THE WORKING SURFACE, NEVER THE WRAPPER.** A pad
     * returns its wrapper as `el` and exposes `button` separately, and an
     * assert reading the wrapper once reported a button 17 px low while the
     * button was exactly right. A knob's surface is `.pos-knob-dial`, a pad's
     * is its `button`, a fader's is `.pos-fdr-lane`.
     */
    const mid = (n) => { const r = n.getBoundingClientRect(); return r.left + r.width / 2; };
    const lanes = chanSpec.map((c) => ({
      dial: mid(c.knob.el.querySelector('.pos-knob-dial')),
      pad: mid(c.pad.button),
      half: mid(c.half.button),
      fader: mid(c.fader.el.querySelector('.pos-fdr-lane')),
      box: c.lane.getBoundingClientRect(),
    }));
    const worst = (a, b) => Math.max(...lanes.map((l) => Math.abs(l[a] - l[b])));

    d.assert('in every lane the dial and the pad sit on one centre line',
      worst('dial', 'pad') <= 1,
      `worst ${worst('dial', 'pad').toFixed(2)} px apart over ${lanes.length} lanes, `
      + `and a knob is wider than a pad so this is centring rather than matching`);

    d.assert('in every lane the pad and the half pad sit on that same line',
      worst('pad', 'half') <= 1,
      `worst ${worst('pad', 'half').toFixed(2)} px apart`);

    d.assert('in every lane the fader’s lane sits on it too',
      worst('dial', 'fader') <= 1,
      `worst ${worst('dial', 'fader').toFixed(2)} px apart, measured on the lane and not the column`);

    /**
     * 🔴 THE DIVIDER IS BETWEEN LANES AND NOT INSIDE ONE, WHICH IS THE OTHER
     * HALF OF THE REPORT. It is read as the computed border rather than as a
     * class name, and the last lane has to have none or the strip ends in a
     * line with nothing after it.
     * ⚠️ AND IT IS THE PANEL'S LINE, checked against the same token
     * `.panel-fixed-l` uses rather than against a colour typed here.
     */
    const borders = chanSpec.map((c) => getComputedStyle(c.lane));
    const lineTok = getComputedStyle(document.documentElement)
      .getPropertyValue('--line').trim();
    const probe = el('div');
    probe.style.color = lineTok;
    document.body.append(probe);
    const lineRgb = getComputedStyle(probe).color;
    probe.remove();
    d.assert('a divider sits between two lanes and never after the last one, in the panel’s own line',
      borders.slice(0, -1).every((cs) => parseFloat(cs.borderRightWidth) === 1
        && cs.borderRightColor === lineRgb)
      && parseFloat(borders[borders.length - 1].borderRightWidth) === 0,
      `${borders.length - 1} dividers of ${lineRgb} and none on lane `
      + `${borders.length}, against --line ${lineTok}`);

    /* 🔴 THE NEGATIVE CONTROL: the lanes are really four separate columns and
       not one column with four things in it. Without this, every assert above
       would pass on a single lane holding everything, because one lane's
       controls are trivially on one centre. */
    const lefts = lanes.map((l) => +l.box.left.toFixed(1));
    d.assert('NEGATIVE CONTROL: the four lanes are four columns, each starting further right',
      new Set(lefts).size === 4
      && lefts.every((x, i) => i === 0 || x > lefts[i - 1])
      && new Set(lanes.map((l) => +l.dial.toFixed(1))).size === 4,
      `lanes start at ${lefts.join(', ')} and their dials sit at `
      + `${lanes.map((l) => l.dial.toFixed(0)).join(', ')}`);
  }

  if (headSpec) {
    /**
     * 🔴 THE CENTRE IS ON THE CASE, NOT BETWEEN ITS NEIGHBOURS, AND THAT IS THE
     * WHOLE ASK: *"center patch selector (optically center to the instrument)"*.
     * It is read against the CASE'S OWN BOX rather than against the header's,
     * because the header is the thing under test and grading a thing against
     * itself is how a check comes out true by construction.
     * ⚠️ AND BOTH CASES ARE READ, because the two have deliberately different
     * outer contents: `POSITRON PLAI` with a button on the left against
     * `MODEL 12` with a badge. One of them being centred is luck.
     */
    const centres = ['acting', 'reporting'].map((k) => {
      const inst = headSpec[k];
      const caseR = inst.el.getBoundingClientRect();
      /* 🔴 THE MIDDLE CELL IS THE NAMEPLATE SINCE 2026-09-22: *"move patch
         selector the right and nameplate to center"*. The claim never was about
         the picker, it is that whatever sits in column 2 is centred on the CASE
         rather than balanced between two unequal neighbours, so it follows the
         cell rather than its tenant. */
      const midR = inst.plate.el.getBoundingClientRect();
      const onR = inst.online.el.getBoundingClientRect();
      const plateR = inst.patchSlot.getBoundingClientRect();
      return {
        k,
        off: (midR.left + midR.width / 2) - (caseR.left + caseR.width / 2),
        /* Where a flex row would have put it: the middle of the space left
           between the two outer children, which is what `space-between` on
           three children does. */
        flex: (onR.right + (plateR.left - onR.right) / 2) - (caseR.left + caseR.width / 2),
        on: onR.width, plate: plateR.width,
      };
    });
    d.assert('the nameplate sits on the case’s own centre, on both cases',
      centres.every((c) => Math.abs(c.off) <= 1),
      centres.map((c) => `${c.k} is ${c.off.toFixed(1)} px off the case centre`).join(', '));

    /* 🔴 THE NEGATIVE CONTROL, AND IT IS THE REASON THIS IS A GRID. A flex row
       puts its middle child wherever the difference between two unequal
       neighbours leaves it, which is a different place on every panel. If that
       answer happened to agree here, the assert above would be proving
       nothing. */
    d.assert('NEGATIVE CONTROL: balanced between its neighbours it would land somewhere else',
      centres.every((c) => Math.abs(c.flex) > 4)
      && centres.some((c) => Math.abs(c.on - c.plate) > 10),
      centres.map((c) => `${c.k} would be ${c.flex.toFixed(1)} px off, with a `
        + `${c.on.toFixed(0)} px status against a ${c.plate.toFixed(0)} px picker`).join(', '));

    /**
     * 🔴 A CONTROL THAT ACTS IS A BUTTON AND ONE THAT REPORTS IS NOT, AND THE
     * PRESS IS DRIVEN HERE RATHER THAN ASSUMED. `positron-ui` calls a control
     * whose only honest behaviour is to do nothing *"the shape of control this
     * project calls a lie"*, and a callback nobody calls is a binding nothing
     * grades.
     * ⚠️ IT IS NOT IN `.pos-controls`, so no harness presses it and this is the
     * only place it is ever pressed.
     */
    const was = headSpec.acting.online.state();
    headSpec.acting.online.el.click();
    const now = headSpec.acting.online.state();
    d.assert('a press on the acting header really switches it, and the badge follows',
      headSpec.acting.online.el.tagName === 'BUTTON' && headSpec.presses() === 1
      && was === 'online' && now === 'offline',
      `${was} became ${now} after ${headSpec.presses()} press`);

    /* 🔴 THE OTHER HALF, AS AN ABSENCE. A badge that was a button with the
       handler left off would satisfy the assert above by never being pressed.
       ⚠️ IT READS THE STATUS CELL AND NOT THE HEADER. My first version asked
       the whole header for buttons and went red at `2 buttons` on a header
       doing exactly what it promises: the PATCH SELECTOR has a prev and a next.
       That is the project's own rule about measuring the quantity in question
       rather than one beside it, arriving one element out. */
    const rep = headSpec.reporting.online.el;
    d.assert('NEGATIVE CONTROL: a header with nothing to press builds no button and takes no tab stop',
      rep.tagName !== 'BUTTON' && rep.tabIndex <= 0
      && rep.querySelector('button') === null
      && headSpec.acting.online.el.tagName === 'BUTTON',
      `the reporting status is a <${rep.tagName.toLowerCase()}> holding `
      + `${rep.querySelectorAll('button').length} buttons, against a `
      + `<${headSpec.acting.online.el.tagName.toLowerCase()}> on the acting one`);

    /* The plate in a header is `end` whether it has one line or two, which is
       the placement the removed INSTRUMENT specimen used to demonstrate.
       🔴 AND IT IS THE MIDDLE CELL SINCE 2026-09-22, not the last: *"move patch
       selector the right and nameplate to center"*. The placement stays `end`
       and that is not a contradiction: `end` is how a plate lays its own lines
       out, and the column is where the header puts it. This asserted both and
       had to follow the one that moved. */
    const two = headSpec.acting.plate.shown();
    const one = headSpec.reporting.plate.shown();
    d.assert('a header’s plate lays out at its end, one line or two, in the middle cell',
      two.join(' / ') === 'POSITRON / PLAI' && one.length === 1 && one[0] === 'MODEL 12'
      && headSpec.acting.plate.place === 'end' && headSpec.reporting.plate.place === 'end'
      && getComputedStyle(headSpec.acting.plate.el).justifyContent === 'flex-end'
      && getComputedStyle(headSpec.acting.plate.el).gridColumnStart === '2',
      `${JSON.stringify(two)} and ${JSON.stringify(one)}, both at `
      + `${headSpec.acting.plate.place} in column `
      + `${getComputedStyle(headSpec.acting.plate.el).gridColumnStart}`);

    /* ⚠️ THE HEADER IS THE CASE'S FIRST CHILD FOR THE REASON THE PLATE IS: it
       belongs to the case, above both halves, or it scrolls away. And the case
       carries no plate of its own, because two names on one instrument is the
       failure this option could have shipped. */
    const hk = [...headSpec.acting.el.children];
    d.assert('the header is the case’s first child, and the case carries no second plate',
      hk[0] === headSpec.acting.head
      && headSpec.acting.el.querySelectorAll('.panel-plate').length === 1,
      `the case holds ${hk.map((k) => (k.className || '').toString().split(' ')[0]).join(', ')}`);

    /**
     * 🔴 THE PHONE LAYOUT IS THREE LEVELS AND NOTHING HERE CAN GRADE IT.
     * `demo/verify.mjs` runs at 756 px with no viewport override, so this page
     * has never entered that media query and never will. What IS checkable is
     * the failure this repository has measured: `.pos-pick`'s entire phone
     * layout sat ABOVE the plain rule that beat it at every width and had never
     * run in its life. A media query adds no specificity, so order decides.
     * ⚠️ **ORDERING IS NOT BEHAVIOUR**, and this assert claims only ordering.
     */
    {
      const sheet = [...document.styleSheets].find((s) => (s.href || '').includes('shell.css'));
      let lastPlain = -1, media = -1;
      try {
        const rules = [...sheet.cssRules];
        rules.forEach((r, i) => {
          if (r.selectorText && /\.panel-head/.test(r.selectorText)) lastPlain = i;
          if (r.media && /560px/.test(r.conditionText || r.media.mediaText)
            && [...r.cssRules].some((x) => /\.panel-head/.test(x.selectorText || ''))) media = i;
        });
      } catch { /* a cross origin sheet cannot be read, and says so below */ }
      d.assert('the header’s phone block comes after every plain rule it has to beat',
        media > lastPlain && lastPlain >= 0,
        `the last plain .panel-head rule is at ${lastPlain} and the 560 px block at ${media}`);
    }
  }

  if (stepSpec) {
    /**
     * 🔴 THE NEEDLE LANDS ON THE STEP, WHICH IS THE WHOLE REASON THE ROUNDING
     * IS THE COMPONENT'S AND NOT THE PAGE'S. A page that rounds on the way out
     * leaves the dial where the number is not, and the only thing that can tell
     * those apart is reading the DRAWING. The pointer path is
     * `M cx cy L ex ey` with the tick between r=24 and r=32 off a centre at
     * 50,50, so the angle comes straight out of it.
     */
    const angleOf = (k) => {
      const d2 = k.el.querySelector('.pos-knob-ptr').getAttribute('d');
      const [, x, y] = d2.match(/L\s+([\d.-]+)\s+([\d.-]+)/).map(Number);
      return Math.atan2(x - 50, 50 - y) * 180 / Math.PI;
    };
    /* 270 degrees of sweep, so a value's angle is -135 plus its share of 270. */
    const wanted = (k, min, max) => -135 + ((k.value() - min) / (max - min)) * 270;

    stepSpec.stepped.set(5.4, { from: 'hand' });
    const landed = stepSpec.stepped.value();
    d.assert('a stepped knob lands on a whole step and the needle lands with it',
      landed === 5 && Math.abs(angleOf(stepSpec.stepped) - wanted(stepSpec.stepped, 1, 8)) < 0.5,
      `5.4 became ${landed}, needle at ${angleOf(stepSpec.stepped).toFixed(1)} degrees `
      + `against ${wanted(stepSpec.stepped, 1, 8).toFixed(1)} wanted`);

    stepSpec.quarters.set(1.4, { from: 'hand' });
    d.assert('a fractional step lands on a quarter and prints the places its step has',
      stepSpec.quarters.value() === 1.5
      && stepSpec.quarters.el.querySelector('.pos-knob-v').textContent === '1.50',
      `1.4 became ${stepSpec.quarters.value()}, printed as `
      + `"${stepSpec.quarters.el.querySelector('.pos-knob-v').textContent}"`);

    /* 🔴 THE NEGATIVE CONTROL, AND IT PROTECTS EVERY OTHER KNOB ON THE SITE. A
       snap leaking into the default would quantise thirty pages while both
       asserts above stayed green. */
    stepSpec.free.set(0.371, { from: 'hand' });
    d.assert('NEGATIVE CONTROL: a knob with no step keeps the value it was given',
      Math.abs(stepSpec.free.value() - 0.371) < 1e-9,
      `0.371 stayed ${stepSpec.free.value()}`);

    /**
     * 🔴 THE NUMBER'S BOX DOES NOT MOVE, WHICH IS THE `"stop wiggling"` REPORT.
     * Two readings at values with DIFFERENT DIGIT COUNTS, which is the half
     * that makes this a measurement: comparing two values that print the same
     * number of characters is a check that cannot fail. `positron-verify`
     * records three subjects agreeing to the digit being a broken collector.
     */
    {
      const numOf = (k) => k.el.querySelector('.pos-knob-v');
      const read = (k, v) => {
        k.set(v, { from: 'hand' });
        const n = numOf(k);
        return { text: n.textContent, w: n.getBoundingClientRect().width };
      };
      const a = read(stepSpec.free, -0.94);
      const b = read(stepSpec.free, 0.1);
      d.assert('the value box is one width at every value, and the places never change',
        a.w > 0 && Math.abs(a.w - b.w) < 0.5
        && a.text.length !== b.text.length
        && a.text.split('.')[1].length === b.text.split('.')[1].length,
        `"${a.text}" is ${a.w.toFixed(2)} px and "${b.text}" is ${b.w.toFixed(2)} px, `
        + `${a.text.length} characters against ${b.text.length}`);

      /* 🔴 THE NEGATIVE CONTROL FOR THE SAME BOX: the reserve is a real number
         off the component and not an empty box that never had a width. A
         0 to 127 knob reserves three characters and a -1 to 1 knob five. */
      const res = (k) => getComputedStyle(k.el).getPropertyValue('--knob-num-w').trim();
      d.assert('NEGATIVE CONTROL: the reserve is measured per knob, so two ranges differ',
        res(stepSpec.free) === '5ch' && res(stepSpec.stepped) === '1ch'
        && numOf(stepSpec.free).getBoundingClientRect().width
           > numOf(stepSpec.stepped).getBoundingClientRect().width,
        `-1 to 1 reserves ${res(stepSpec.free)} and 1 to 8 by ones reserves `
        + `${res(stepSpec.stepped)}`);
    }
  }

  if (gridSpec) {
    gridSpec.edit.size();
    const g = gridSpec.edit;
    const p0 = g.pads[0][0].getBoundingClientRect();
    const l0 = g.labels[0].getBoundingClientRect();
    const pz = g.pads[g.pads.length - 1][0].getBoundingClientRect();
    const lz = g.labels[g.labels.length - 1].getBoundingClientRect();
    d.assert('the label column and the steps share one pitch, at the first row and at the last',
      Math.abs(p0.top - l0.top) <= 0.6 && Math.abs(pz.top - lz.top) <= 0.6
      && Math.abs(pz.bottom - lz.bottom) <= 0.6,
      `first ${(p0.top - l0.top).toFixed(2)} px apart, last `
      + `${(pz.top - lz.top).toFixed(2)} px at the top and `
      + `${(pz.bottom - lz.bottom).toFixed(2)} at the bottom, over ${g.labels.length} rows`);

    /* 🔴 THE PADS ARE SQUARE AND THEY FILL THE ROOM, which is the measured size
       doing its job. Neither half can be read off the stylesheet: the token is
       written from script. */
    d.assert('a pad is square and the sixteen of them fill the strip they are in',
      Math.abs(p0.width - p0.height) <= 0.6 && p0.width > 20
      && Math.abs(p0.width - padWidth(g.el.parentElement.clientWidth, 16)) <= 1,
      `${p0.width.toFixed(1)} by ${p0.height.toFixed(1)} px, against `
      + `${padWidth(g.el.parentElement.clientWidth, 16)} from the arithmetic`);

    /* 🔴 THE READ ONLY GRID LEFT THIS BLOCK ON 2026-09-22 AND ITS ASSERT WENT
       WITH IT, WHICH IS WORTH SAYING RATHER THAN LEAVING AS A GAP IN A COUNT.
       It read that a read only pad is a `DIV` with no tab stop, a default
       cursor and full opacity, because `disabled` would say *switched off*
       about a picture that is perfectly current. **The structural half is
       graded without a browser** in `demo/shell/step-grid-test.mjs`, which
       reads the branch off the source. **The computed half is not graded
       anywhere now**: the cursor, the opacity and the rendered tab stops are
       claims nothing makes. `/pack/` is the page that uses that shape and is
       where the check belongs if it is wanted back. */
    d.assert('the whole editable grid is one tab stop and not one per pad',
      gridSpec.edit.rowsEl.querySelectorAll('[tabindex="0"]').length === 1
      && gridSpec.edit.pads.flat().length === 96,
      `1 of ${gridSpec.edit.pads.flat().length} pads is reachable by tab`);

    /* A lit pad on a row that can make no sound stays grey, because brightness
       here says WHETHER THIS CAN SOUND and nothing else can tell a reader. */
    const mute = gridSpec.edit.pads[4][3];
    const loud = gridSpec.edit.pads[0][0];
    d.assert('a lit pad on a row with nothing behind it is grey, and one that can sound is amber',
      mute.dataset.on === '1' && mute.dataset.mute === '1'
      && loud.dataset.on === '1' && loud.dataset.mute === undefined
      && getComputedStyle(mute).backgroundColor !== getComputedStyle(loud).backgroundColor,
      `silent row ${getComputedStyle(mute).backgroundColor} against `
      + `${getComputedStyle(loud).backgroundColor}`);

    /**
     * 🔴 NEITHER HEAD REPLACES THE FIELD ANY MORE, AND THAT IS THE SECOND HALF
     * OF A REPORT MADE TWICE. `/tom/` said *"hilite should not kill my 1st col
     * beat bg color"* about the PARKED head and it was moved to a filter. The
     * running head went on replacing `background` until 2026-09-22, when the
     * same complaint arrived about it: *"its rms cell orginial color ...
     * preseve original button hue a bit"*.
     * ✅ SO THE CLAIM IS NOW THAT THE PAD'S OWN COLOUR SURVIVES BOTH STATES,
     * which is what makes `[data-on]`, `[data-mute]` and `[data-bar]` readable
     * under a head at all. A running head is an inset wash layered OVER that
     * colour, so the two states are told apart by the shadow and not by the
     * background.
     * ⚠️ AND THE NEGATIVE HALF IS THE ONE THAT MATTERS: a parked head must NOT
     * carry the wash, or the difference between waiting and running is gone.
     */
    const at = gridSpec.edit.step();
    const cell = gridSpec.edit.pads[0][at];
    const base = getComputedStyle(gridSpec.edit.pads[0][(at + 4) % 16]).backgroundColor;
    const parked = getComputedStyle(cell);
    const parkedBg = parked.backgroundColor, parkedFilter = parked.filter;
    const parkedShadow = parked.boxShadow;
    gridSpec.edit.live(true);
    const playing = getComputedStyle(cell);
    const playBg = playing.backgroundColor, playFilter = playing.filter;
    const playShadow = playing.boxShadow;
    gridSpec.edit.live(false);
    d.assert('neither head replaces the pad\u2019s own colour, and only the running one carries the wash',
      parkedBg === base && playBg === base
      && parkedFilter !== 'none' && playFilter !== 'none'
      && /inset/.test(playShadow) && !/inset/.test(parkedShadow),
      `the pad keeps ${playBg} in both states · parked ${parkedFilter} with `
      + `shadow ${parkedShadow.slice(0, 40)} · playing ${playFilter} with `
      + `shadow ${playShadow.slice(0, 40)}`);

    /**
     * 🔴 THE CLOCK BELONGS TO THE PAGE AND SAYS SO, AND A GRID WITH NO TEMPO TO
     * CLAIM GETS NO CLOCK AT ALL. That is `/pack/`'s case: nothing in a Circuit
     * session names a rate, so a play button there would be a number presented
     * as the file's. The read only grid here was given no rate, and the
     * component answers `null` rather than a control that lies, and
     * `step-grid-test.mjs` asserts BOTH that absence and the throw on a rate
     * with no `whose`, so neither claim depends on a grid standing here.
     * ⚠️ IT IS PLAYED AND STOPPED ON THESE LINES AND PUT BACK, with no `await`
     * between them, so no frame is rendered in the middle and nobody reading
     * the page sees it happen.
     */
    const clock = gridSpec.edit.clock;
    clock.play();
    const ran = { on: clock.playing(), live: gridSpec.edit.rowsEl.hasAttribute('data-live') };
    clock.stop();
    d.assert('the clock plays, stops back at the first column, and names whose tempo it is',
      !!clock && /this page/.test(clock.whose) && clock.bpm() === 120
      && clock.stepMs() === 125
      && ran.on === true && ran.live === true
      && clock.playing() === false && gridSpec.edit.step() === 0,
      `${clock.bpm()} beats a minute is ${clock.stepMs()} ms a step, owned by `
      + `"${clock.whose}"`);

    /**
     * 🔴 THE 320 px SCROLLER LEFT THIS BLOCK ON 2026-09-22 WITH THE OTHER
     * EXAMPLES, and what it measured is named here rather than left as a hole.
     * It asserted that at a phone's width the STRIP scrolls and the page does
     * not, which takes `overflow-x: auto` AND `min-width: 0` on one element,
     * and this repository has measured 141 px of page overflow from that pair
     * being half written. **The arithmetic behind it survives** as the
     * negative control below and in `step-grid-test.mjs`. **The rendered half
     * does not**, and no check now watches a real strip scroll.
     *
     * 🔴 WHAT REPLACES IT IS THE THING THE BLOCK IS NOW ABOUT: the bar and the
     * grid are ONE surface with a 1 px seam, and the bar is ABOVE. A glue that
     * quietly stopped gluing would look like ordinary spacing, which is
     * exactly the failure `/pack/` met from the other direction when four
     * parts in one glue left a panel with a single child and no rhythm at all.
     */
    {
      const glue = gridSpec.barHost.parentElement;
      const b = gridSpec.barHost.getBoundingClientRect();
      const w = gridSpec.wrap.getBoundingClientRect();
      const seam = w.top - b.bottom;
      d.assert('the transport is one surface with the grid, seam of 1 px, and it is the half on top',
        glue.classList.contains('pos-glue')
        && glue.children[0] === gridSpec.barHost && glue.children[1] === gridSpec.wrap
        && Math.abs(seam - 1) < 0.6 && b.bottom <= w.top,
        `${glue.children.length} parts, the bar ends at ${b.bottom.toFixed(0)} and `
        + `the grid starts at ${w.top.toFixed(0)}, a seam of ${seam.toFixed(1)} px`);
    }

    /**
     * 🔴 BOTH AXES ON ONE GRID AND NEITHER ON THE OTHER, WHICH IS THE ASK AND
     * ITS OWN NEGATIVE CONTROL IN ONE PAIR. The absence is the half worth
     * grading: a component that numbered every ruler whatever it was told would
     * pass any check that only looked at the labelled one.
     * ⚠️ AND THE STEP AXIS IS COUNTED AS BEATS, NOT AS STEPS. Sixteen steps at
     * four to a beat is FOUR numbers, which is the decision `tickText` records:
     * a number under every one of 64 steps is the wrapping heading defect in a
     * new costume.
     */
    {
      const said = (g) => g.el.querySelectorAll('.pos-pg-tick')
        .length && [...g.el.querySelectorAll('.pos-pg-tick')]
        .filter((t) => t.textContent.trim()).length;
      d.assert('a grid can be labelled on both axes, and the steps are counted in beats',
        said(gridSpec.edit) === 4 && gridSpec.edit.labels.length === 6
        && [...gridSpec.edit.el.querySelectorAll('.pos-pg-tick')]
          .filter((t) => t.textContent.trim()).map((t) => t.textContent).join('') === '1234',
        `${said(gridSpec.edit)} numbers on 16 steps at 4 to a beat, over `
        + `${gridSpec.edit.labels.length} row labels`);

      d.assert('NEGATIVE CONTROL: a grid given neither axis builds no label column and no numbers',
        said(gridSpec.bare) === 0 && gridSpec.bare.labels.length === 0
        && gridSpec.bareWrap.querySelectorAll('.pos-pg-lab').length === 0
        && gridSpec.bare.el.querySelectorAll('.pos-pg-tick').length === 16,
        `${gridSpec.bare.el.querySelectorAll('.pos-pg-tick').length} ticks carrying `
        + `${said(gridSpec.bare)} words, and ${gridSpec.bare.labels.length} row labels`);
    }

    /**
     * 🔴 THE RIGHT INSET AND THE BOTTOM ONE ARE THE SAME MEASUREMENT, AND THAT
     * IS TWO CLAIMS RATHER THAN ONE. Asked as *"make sure right padding is same
     * as bottom"* from a crop of the last pad nearly touching the right edge.
     * The computed pair is the stylesheet's claim; the RENDERED distance from
     * the last pad to the content edge is what the crop actually showed, and a
     * scroll container can satisfy the first and fail the second.
     */
    {
      const cs = getComputedStyle(gridSpec.wrap);
      const pr = parseFloat(cs.paddingRight), pb = parseFloat(cs.paddingBottom);
      d.assert('the step grid’s right inset is the same measurement as its bottom one',
        pr > 0 && Math.abs(pr - pb) < 0.5,
        `${pr} px right against ${pb} px bottom, both from --kit-pg-inset`);

      const box = gridSpec.wrap.getBoundingClientRect();
      const row = gridSpec.edit.pads[0];
      const last = row[row.length - 1].getBoundingClientRect();
      const lastRow = gridSpec.edit.pads[gridSpec.edit.pads.length - 1][0]
        .getBoundingClientRect();
      const right = box.right - last.right;
      const bottom = box.bottom - lastRow.bottom;
      d.assert('and the last pad is no closer to the right edge than to the bottom one',
        right >= pr - 0.5 && bottom >= pb - 0.5,
        `${right.toFixed(1)} px to the right edge against ${bottom.toFixed(1)} px `
        + `to the bottom, on an inset of ${pr} px`);
    }

    /**
     * 🔴 THE TRAIL IS A TRANSITION AND NOTHING ELSE, WHICH IS WHY THERE IS NO
     * TRAIL CODE TO FIND. Only one column is ever marked, so every other lit
     * column behind the head is a cell still easing out. Reported from a
     * screenshot at step 13 as *"make 2nd and 3nd fade fade faster"*.
     * ⚠️ **THE NUMBER ONLY MEANS ANYTHING AS A FRACTION OF A STEP.** At 120
     * beats a minute with four steps to a beat a step is 125 ms, so the old
     * 320 ms fall was 2.6 steps of tail and the third column was still visibly
     * lit. It is asserted against the component's own `stepMsFor`, so the claim
     * survives a change of tempo rather than being a millisecond count.
     * ⚠️ **AND THE LAMP KEEPS ITS FILAMENT.** The rise stays shorter than the
     * fall, so shortening the tail did not undo the earlier repair that made
     * the light arrive smoothly.
     */
    {
      const ms = (s) => (s || '').split(',').map((x) => parseFloat(x) * (/ms/.test(x) ? 1 : 1000));
      const base = ms(getComputedStyle(gridSpec.edit.pads[0][0]).transitionDuration);
      const step = gridSpec.edit.clock.stepMs();
      d.assert('a lit pad dies inside a step and a half, and still slower than it lights',
        base[0] > 0 && base[0] / step < 1.6 && base[0] > RISE_MS && FALL_MS === base[0],
        `${base[0]} ms of fall against a ${step} ms step, which is `
        + `${(base[0] / step).toFixed(2)} steps, lighting in ${RISE_MS} ms`);

      /* 🔴 THE NEGATIVE CONTROL: the two directions really are two rules. One
         duration on the head's rule would give a lamp with no filament, and
         the earlier report that bought the asymmetry would be back. */
      const head = [...document.styleSheets]
        .flatMap((sh) => { try { return [...sh.cssRules]; } catch { return []; } })
        .find((r) => /data-live\]\[data-now="0"\]/.test(r.selectorText || ''));
      d.assert('NEGATIVE CONTROL: arriving and leaving are two separate rules, with two durations',
        !!head && ms(head.style.transitionDuration)[0] === RISE_MS
        && RISE_MS !== FALL_MS,
        `the head's own rule transitions in ${head ? ms(head.style.transitionDuration)[0] : '?'} ms `
        + `against ${FALL_MS} on the base rule`);
    }

    /**
     * 🔴 THE FLOOR IS WHAT MAKES THAT SCROLL RATHER THAN MAKING THE PADS
     * VANISH, and it is the NEGATIVE CONTROL for the measurement above: without
     * it a 320 px box over sixteen steps still fits, so the case that proves
     * the floor is a step count that does not. `/tom/` opened at 64 steps.
     */
    d.assert('NEGATIVE CONTROL: a pad never gets smaller than the floor, whatever the room',
      padWidth(320, 64) === PAD_MIN && padWidth(0, 16) === PAD_MIN
      && padWidth(320, 16) > PAD_MIN,
      `32 steps in a phone's strip is the ${PAD_MIN} px floor, 16 steps is `
      + `${padWidth(320, 16)} px and fits without scrolling`);
  }

  /**
   * 🔴 THE BAND BETWEEN TWO HANDLES IS THE ONE THING `range-slider-test.mjs`
   * CANNOT SEE. That file grades the arithmetic and says so at the top: the
   * component positions the band with a `calc()` in percentages, because a
   * percentage follows the lane with no resize observation, and a percentage
   * cannot be run in node. `spanPixels` is the same arithmetic written in
   * pixels, so this compares what the browser resolved against what the
   * arithmetic says, and the two can disagree.
   */
  if (rangeSpec) {
    const lane = rangeSpec.wide.lane.getBoundingClientRect();
    const [ka, kb] = rangeSpec.wide.knobs.map((k) => k.getBoundingClientRect());
    const bandEl = rangeSpec.wide.lane.querySelector('.sld-span');
    const band = bandEl.getBoundingClientRect();
    const { from, to } = rangeSpec.wide.get();
    const want = spanPixels(from / 127, to / 127, lane.width, ka.width);
    const gotLeft = band.left - lane.left;
    d.assert('the band runs between the two handles’ centres, and the arithmetic agrees',
      Math.abs(gotLeft - (ka.left + ka.width / 2 - lane.left)) <= 1
      && Math.abs(band.right - (kb.left + kb.width / 2)) <= 1
      && Math.abs(gotLeft - want.left) <= 1 && Math.abs(band.width - want.width) <= 1,
      `band ${gotLeft.toFixed(1)} to ${(gotLeft + band.width).toFixed(1)} in a `
      + `${lane.width.toFixed(1)} px lane, against ${want.left.toFixed(1)} and `
      + `${(want.left + want.width).toFixed(1)} from the arithmetic`);

    /**
     * 🔴 THE WHOLE ARGUMENT FOR THIS BEING A NEW MODULE RATHER THAN A COPY IS
     * THAT IT SHARES THE SLIDER'S COLUMNS, and a group holding four ranges and
     * one plain slider is the only way to measure it. `grains` once appended
     * four sliders to a class with no CSS anywhere and every lane started at a
     * different x, because a wider label pushes its own lane right.
     */
    const lanes = [...rangeSpec.group.el.querySelectorAll('.sld-lane')]
      .map((l) => +l.getBoundingClientRect().left.toFixed(2));
    const spread = Math.max(...lanes) - Math.min(...lanes);
    d.assert('four ranges and one plain slider in one group start every lane at the same x',
      lanes.length === 5 && spread <= 0.5,
      `${lanes.length} lanes, ${spread.toFixed(2)} px apart at the left edge`);

    /**
     * 🔴 TWO VALUES ARE TWO TAB STOPS, AND THE LANE IS NOT ONE OF THEM. On a
     * single slider the LANE carries `tabindex` and is the slider; a range that
     * copied that would have one of its two values unreachable from a keyboard
     * entirely, which is invisible in a screenshot and free to read off the DOM.
     */
    const stops = [...rangeSpec.wide.el.querySelectorAll('[tabindex]')];
    d.assert('a range is two tab stops, one per handle, and the lane is not one',
      stops.length === 2 && stops.every((s) => s.classList.contains('sld-knob'))
      && stops.every((s) => s.getAttribute('role') === 'slider')
      && !rangeSpec.wide.lane.hasAttribute('tabindex')
      && rangeSpec.wide.lane.getAttribute('role') === 'group',
      `${stops.length} stops, both handles, the lane is a ${rangeSpec.wide.lane.getAttribute('role')}`);

    /**
