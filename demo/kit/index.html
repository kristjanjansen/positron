     * 🔴 AND EACH HANDLE IS TOLD THE SCALE IT CAN ACTUALLY REACH. Reporting the
     * full 0 to 127 on both says the start can go to 127 while the end is at 96,
     * and the only way to find that out is to press the key and hear nothing
     * change. This reads the attributes a screen reader reads.
     */
    const [aa, ab] = rangeSpec.wide.knobs;
    d.assert('each handle’s reported scale stops at the other handle',
      aa.getAttribute('aria-valuemax') === String(to)
      && ab.getAttribute('aria-valuemin') === String(from)
      && aa.getAttribute('aria-valuenow') === String(from),
      `start reaches ${aa.getAttribute('aria-valuemax')} and end starts at `
      + `${ab.getAttribute('aria-valuemin')}, with the pair at ${from} and ${to}`);

    /* A leg with no travel, which is a real setting and is also the case where
       a wrong tie rule makes every press grab the same handle. */
    const shutBand = rangeSpec.shut.lane.querySelector('.sld-span').getBoundingClientRect();
    const [sa, sb] = rangeSpec.shut.knobs.map((k) => k.getBoundingClientRect());
    d.assert('a collapsed pair draws no band and stacks its two handles exactly',
      shutBand.width <= 0.5 && Math.abs(sa.left - sb.left) <= 0.5,
      `band ${shutBand.width.toFixed(2)} px, handles ${Math.abs(sa.left - sb.left).toFixed(2)} px apart`);

    /* 🔴 A DISABLED CONTROL LEAVES THE TAB ORDER, or it is a control that can be
       driven from a keyboard while looking greyed out. */
    d.assert('a disabled range takes both its handles out of the tab order',
      rangeSpec.off.knobs.every((k) => !k.hasAttribute('tabindex'))
      && rangeSpec.off.lane.getAttribute('aria-disabled') === 'true',
      'neither handle is reachable and the lane says it is off');

    /**
     * 🔴 THE KEYBOARD, DRIVEN RATHER THAN READ. `verify.mjs` cannot drag a lane
     * and `slider.mjs` says so in its own header, so the arrow keys are the one
     * route a harness has into a control like this. The gap slider is used
     * because it is the one where the invariant has something to do: `End` on
     * its start handle lands 20 below the end rather than at 127.
     * ⚠️ AND IT PUTS THE VALUES BACK. A check does not get to leave a reader's
     * page in a state they did not ask for, and this block holds no `await`, so
     * no frame is rendered in the middle of it.
     */
    const was = rangeSpec.gap.get();
    const key = (node, k) => node.dispatchEvent(
      new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
    key(rangeSpec.gap.knobs[0], 'ArrowRight');
    const stepped = rangeSpec.gap.get().from;
    key(rangeSpec.gap.knobs[0], 'End');
    const ended = rangeSpec.gap.get();
    rangeSpec.gap.set(was.from, was.to, true);
    d.assert('an arrow moves one handle by a step and End takes it to its own limit, not the scale’s',
      stepped === was.from + 1 && ended.from === ended.to - 20 && ended.to === was.to
      && rangeSpec.gap.get().from === was.from,
      `${was.from} stepped to ${stepped}, End landed on ${ended.from} against an end at `
      + `${ended.to} with a gap of 20, and the pair is back at ${was.from} and ${was.to}`);
  }

  /**
   * 🔴 THE TOGGLE ACTS OR IT IS NOT A CONTROL, SO NOTHING BELOW ASSERTS AN
   * OPTION THAT WAS PASSED IN. A real click goes down the same path a finger
   * takes, the counter behind all five specimens says whether the page was
   * told, and the disabled one is clicked on purpose to prove the counter can
   * refuse to move. That is what the SWITCH block asserted until 2026-09-23 and
   * it is what this one inherits; what left with the switch is the knob travel
   * and the two weights, because a button has neither.
   */
  if (toggleSpec) {
    const b = toggleSpec.lit.button;
    /* 🔴 `aria-pressed` IS THE STATE AND `get()` READS THE SAME ATTRIBUTE,
       which is the claim rather than a detail: a control whose picture and
       whose announcement come from two copies of one boolean will eventually
       disagree, and only one of the two is visible in a screenshot. */
    d.assert('a toggle is a real button that says whether it is pressed',
      b.tagName === 'BUTTON' && b.type === 'button'
      && b.getAttribute('aria-pressed') === 'true' && toggleSpec.lit.get() === true
      && toggleSpec.dark.getAttribute?.('aria-pressed') !== 'true'
      && toggleSpec.dark.button.getAttribute('aria-pressed') === 'false'
      && b.tabIndex >= 0,
      `${b.tagName} at tab index ${b.tabIndex}, pressed ${b.getAttribute('aria-pressed')} `
      + `against ${toggleSpec.dark.button.getAttribute('aria-pressed')} on the one that is up`);

    /* A press, down the path a finger takes, and the page put back afterwards. */
    const was = toggleSpec.dark.get();
    const saidWas = toggleSpec.presses.n;
    toggleSpec.dark.button.click();
    const now = toggleSpec.dark.get();
    const told = toggleSpec.presses.last, said = toggleSpec.presses.n;
    const marked = toggleSpec.dark.button.getAttribute('aria-pressed');
    toggleSpec.dark.set(was, true);
    d.assert('a press puts it down, tells the page, and says so to a reader who cannot see it',
      was === false && now === true && said === saidWas + 1 && told === 'click down'
      && marked === 'true' && toggleSpec.dark.get() === was
      && toggleSpec.dark.button.getAttribute('aria-pressed') === 'false',
      `it said "${told}" on press ${said}, marked itself ${marked}, and the check put it back`);

    /**
     * 🔴 THE TWO SIZES ARE A REAL DIFFERENCE AND THE SMALL ONE IS THE PAD'S
     * OWN HEIGHT. 34 px is every control on a page and 26 px is what
     * `shell.css` argues for under a keyboard, which is 34 minus one gap. A
     * check that only asked *is there a data-size attribute* would pass a
     * stylesheet that had stopped reading it.
     */
    const bigH = toggleSpec.lit.button.getBoundingClientRect().height;
    const smallH = toggleSpec.small.button.getBoundingClientRect().height;
    d.assert('the small toggle is the keyboard footer\'s own height and the big one is a control\'s',
      Math.abs(bigH - 34) < 0.6 && Math.abs(smallH - 26) < 0.6
      && toggleSpec.small.button.dataset.size === 'small'
      && !toggleSpec.lit.button.hasAttribute('data-size'),
      `${bigH.toFixed(1)} px big against ${smallH.toFixed(1)} px small`);

    /**
     * 🔴 ONE YELLOW, READ OFF THE STYLESHEET RATHER THAN TYPED HERE. `--hi`
     * means *the thing this control is about* on every page in this project, so
     * a pressed toggle is compared against the token itself: a colour typed
     * into a check is a second source that can disagree with the first.
     * ⚠️ AND THE NEGATIVE HALF IS THE ONE WORTH HAVING. A check that only asked
     * *is a pressed one tinted* would pass a stylesheet on which every toggle
     * is, which is the drift this grades.
     */
    {
      const asColour = (v) => {
        const probe = el('span');
        probe.style.color = v;
        document.body.append(probe);
        const c = getComputedStyle(probe).color;
        probe.remove();
        return c;
      };
      const hi = asColour(getComputedStyle(document.documentElement)
        .getPropertyValue('--hi').trim());
      const downEdge = getComputedStyle(toggleSpec.lit.button).borderColor;
      const upEdge = getComputedStyle(toggleSpec.dark.button).borderColor;
      const downBack = getComputedStyle(toggleSpec.lit.button).backgroundColor;
      const upBack = getComputedStyle(toggleSpec.dark.button).backgroundColor;
      d.assert('a pressed toggle takes the page’s own --hi and NEGATIVE CONTROL: an unpressed one does not',
        downEdge === hi && upEdge !== hi && downBack !== upBack,
        `pressed edge ${downEdge} against --hi ${hi}, unpressed edge ${upEdge}, `
        + `and two different grounds`);
    }

    /**
     * 🔴 A CONTROL THAT SAYS IT CANNOT BE PRESSED AND THEN ACTS IS THE LIE THIS
     * PROJECT HAS A NAME FOR, and the press is real rather than assumed. It is
     * wired to the same counter as the other four, so a press that got through
     * is an integer rather than something somebody has to notice in a
     * screenshot.
     */
    {
      const wasN = toggleSpec.presses.n, wasOn = toggleSpec.dim.get();
      toggleSpec.dim.button.click();
      const faded = getComputedStyle(toggleSpec.dim.button).opacity;
      d.assert('NEGATIVE CONTROL: a toggle nobody may press does not move and does not speak',
        toggleSpec.dim.button.disabled === true
        && toggleSpec.dim.get() === wasOn && toggleSpec.presses.n === wasN
        && Number(faded) < 1,
        `a real click left it ${toggleSpec.dim.get() ? 'down' : 'up'} with the counter still at `
        + `${toggleSpec.presses.n}, at opacity ${faded}`);
    }
  }

  /**
   * 🔴 THE CHECKBOX IS A REAL ONE, AND THE HALF THAT MATTERS IS THE HALF THAT
   * IS INVISIBLE. `check.mjs` clips the input to a pixel and draws the box
   * beside it, and the whole reason that is better than `display: none` is that
   * the input stays focusable. That claim cannot be seen and is free to read.
   */
  if (checkSpec) {
    const i = checkSpec.one.input;
    const box = i.nextElementSibling;
    const r = i.getBoundingClientRect();
    const cs = getComputedStyle(i);
    d.assert('the input is a real checkbox, clipped to a pixel and still focusable',
      i.tagName === 'INPUT' && i.type === 'checkbox'
      && cs.display !== 'none' && cs.visibility !== 'hidden'
      && r.width <= 2 && r.height <= 2
      && box.classList.contains('pos-check-b')
      && !i.hasAttribute('aria-pressed'),
      `${r.width.toFixed(0)} by ${r.height.toFixed(0)} px, display ${cs.display}, `
      + `and the drawn box is its next sibling`);

    /**
     * 🔴 THE THIRD STATE IS THE ONE A BUTTON WEARING `aria-pressed` CANNOT
     * DRAW, so it is the one worth grading. It is a property rather than an
     * attribute, which means nothing in the HTML says it is there and only a
     * check like this can see it.
     * ⚠️ AND A PRESS CLEARS IT, because a press has answered the question. The
     * click is put back on the next line and nothing is awaited in between.
     */
    const s = checkSpec.some;
    const mixedBefore = s.input.indeterminate;
    s.input.click();
    const afterClick = { mixed: s.input.indeterminate, on: s.input.checked };
    s.input.checked = false; s.mixed(true);
    d.assert('the half lit third state is real, and a press answers the question and clears it',
      mixedBefore === true && afterClick.mixed === false && afterClick.on === true
      && s.input.indeterminate === true,
      `it opened half lit, a press left it ${afterClick.on ? 'on' : 'off'} and no longer `
      + `half lit, and the check put it back`);

    /**
     * A set of boxes is a GROUP with its own name attached. Without that, five
     * boxes beside a word are five loose controls and a stray label.
     */
    const set = checkSpec.across.el.querySelector('[role="group"]');
    const named = document.getElementById(set.getAttribute('aria-labelledby'));
    d.assert('a set of boxes is announced by its own name rather than by a word beside it',
      !!set && !!named && named.textContent === 'sends',
      `role ${set.getAttribute('role')}, named "${named?.textContent}"`);

    /* Across and down, measured rather than read off a class name. */
    const rowTops = [...checkSpec.across.el.querySelectorAll('.pos-check')]
      .map((n) => +n.getBoundingClientRect().top.toFixed(1));
    const colTops = [...checkSpec.down.el.querySelectorAll('.pos-check')]
      .map((n) => +n.getBoundingClientRect().top.toFixed(1));
    d.assert('a row of boxes sits on one line and a column puts each on its own',
      new Set(rowTops).size === 1 && new Set(colTops).size === colTops.length
      && colTops.length === 4,
      `${rowTops.length} across on ${new Set(rowTops).size} line, `
      + `${colTops.length} down on ${new Set(colTops).size} lines`);
  }

  /**
   * 🔴 A STANDING CHOICE IS THE LYING ONE WITH THE JOIN AND THE CORNERS TURNED,
   * AND TURNING ONLY THE DIRECTION IS THE HALF FIX THAT LOOKS FINISHED.
   * `.pos-seg` overlaps its children on the LEFT and rounds the first child's
   * left corners, both of which are the wrong axis once the options are
   * stacked: a doubled border on every join, and two stray curves in the middle
   * of the column. Neither shows in a count of buttons.
   */
  if (standSpec) {
    const lay = [...standSpec.lying.el.querySelectorAll('button')];
    const std = [...standSpec.standing.el.querySelectorAll('button')];
    const layTops = new Set(lay.map((b) => +b.getBoundingClientRect().top.toFixed(1)));
    const stdTops = new Set(std.map((b) => +b.getBoundingClientRect().top.toFixed(1)));
    d.assert('the same four options lie on one line and stand on four',
      lay.length === 4 && std.length === 4 && layTops.size === 1 && stdTops.size === 4,
      `lying on ${layTops.size} line, standing on ${stdTops.size}`);

    const first = getComputedStyle(std[0]);
    const second = getComputedStyle(std[1]);
    const lastOne = getComputedStyle(std[3]);
    d.assert('the join and the corners turn with it, not just the direction',
      first.borderTopLeftRadius === '4px' && first.borderBottomLeftRadius === '0px'
      && lastOne.borderBottomLeftRadius === '4px' && lastOne.borderTopLeftRadius === '0px'
      && second.marginTop === '-1px' && second.marginLeft === '0px',
      `first corner ${first.borderTopLeftRadius} over ${first.borderBottomLeftRadius}, `
      + `last ${lastOne.borderTopLeftRadius} over ${lastOne.borderBottomLeftRadius}, `
      + `join ${second.marginTop} up and ${second.marginLeft} across`);

    d.assert('a question nobody has answered has nothing pressed',
      standSpec.empty.get() === -1
      && [...standSpec.empty.el.querySelectorAll('button')]
        .every((b) => b.getAttribute('aria-pressed') === 'false'),
      `at ${standSpec.empty.get()}, and no option is armed`);
  }

  /**
   * 🔴 THE THREE DRAWN FIGURES ARE GRADED ON WHETHER INK REACHED THE CANVAS,
   * WHICH IS THE ONE THING `synth-view-test.mjs` SAYS IT CANNOT SEE. Every
   * claim below needs a document: a picture whose arithmetic is perfect and
   * whose `clientWidth` is zero draws nothing at all and looks like a component
   * that was never wired up.
   * ⚠️ `redraw()` FIRST, AND IT IS NOT A WORKAROUND. A resize observation
   * arrives a frame after a panel is laid out, and this window holds no
   * `await`, so a figure last painted while its tab was shut is still at zero
   * width on this line. A reader never meets it, because opening a tab gives
   * the observer its frame.
   */
  if (envSpec) {
    const all = [envSpec.one, envSpec.two, envSpec.three, envSpec.flat];
    for (const v of all) v.redraw();
    const inks = all.map((v) => v.ink());
    const areas = all.map((v) => v.area());
    const shares = inks.map((n, i) => n / Math.max(1, areas[i]));
    /**
     * 🔴 THE DENOMINATOR IS HERE BECAUSE THIS ASSERT WAS BLIND FOR ONE RUN AND
     * WAS GREEN THE WHOLE TIME. It read `inks.every(n => n > 200)` and reported
     * **10032, 10032, 10032**, three different envelope shapes agreeing to the
     * digit, because `ink()` was comparing each pixel against `--card` parsed
     * with `/\d+/g` and `#11151d` answers the single number 11151. Every
     * painted pixel counted, so the statistic was the AREA OF THE BOX. Three
     * subjects agreeing exactly is a broken collector and never a finding, and
     * it is the only reason this was caught.
     * ⚠️ SO THE CLAIM IS NOW A SHARE RATHER THAN A COUNT. A drawn envelope is a
     * line and a few words, which is a small part of its box; a filled field is
     * all of it. The two are now different numbers, which they were not.
     */
    d.assert('all four envelopes draw a line on their field rather than filling it',
      inks.every((n) => n > 200) && shares.every((s) => s > 0.005 && s < 0.2)
      && new Set(inks).size > 1,
      shares.map((s, i) => `${inks[i]} of ${areas[i]} is ${(s * 100).toFixed(1)}%`).join(', '));

    /* 🔴 THE FIGURE FOLLOWS THE SETTING, MEASURED BY MOVING ONE AND PUTTING IT
       BACK. A picture that ignored its inputs would look completely ordinary
       and would pass every check above. Synchronous, so no frame is rendered
       in the middle of it. */
    const before = envSpec.one.path().stages.attack;
    const paintsBefore = envSpec.one.paints;
    envSpec.one.set({ attack: 120 });
    const after = envSpec.one.path().stages.attack;
    envSpec.one.set({ attack: 2 });
    d.assert('a longer attack widens the attack stage and the figure repaints for it',
      after > before && envSpec.one.paints > paintsBefore
      && Math.abs(envSpec.one.path().stages.attack - before) < 1e-9,
      `${before.toFixed(3)} of the width to ${after.toFixed(3)} and back, `
      + `${envSpec.one.paints - paintsBefore} repaints`);

    /* Every length at zero is a real setting and is also the divide by zero
       this component had to be written around. */
    const flat = envSpec.flat.path();
    d.assert('an envelope with no lengths at all still fills its box rather than a quarter of it',
      flat.silent === true && Math.abs(flat.end - 1) < 1e-9 && envSpec.flat.ink() > 200,
      `ends at ${flat.end}, hold takes ${flat.stages.hold} of the width`);

    /* A canvas says nothing to a screen reader on its own, so the label is the
       only channel there is and it has to carry the numbers. */
    const lab = envSpec.one.canvas.getAttribute('aria-label');
    d.assert('the picture is an image with a label carrying the four numbers',
      envSpec.one.canvas.getAttribute('role') === 'img'
      && /attack 2/.test(lab) && /sustain 127/.test(lab),
      `"${lab}"`);
  }

  /**
   * 🔴 THE FILTER IS THE ONE WITH THE HONESTY PROBLEM, so it gets the checks
   * about refusing. A drawn response curve is acceptable here only because it
   * says on its own face that it is a schematic and because a type name it
   * cannot read is refused rather than drawn as the default low pass.
   */
  if (filtSpec) {
    for (const v of [filtSpec.live, filtSpec.deep, filtSpec.refused]) v.redraw();
    /* ⚠️ THE REFUSAL HAS TO CARRY LESS INK THAN A DRAWN CURVE, which is the
       half that says the two states are really different pictures rather than
       one picture and a count that cannot see. Two lines of words are fewer
       marked pixels than a curve across the whole box with a grid under it. */
    const refInk = filtSpec.refused.ink(), drawnInk = filtSpec.live.ink();
    d.assert('a type name the component cannot read draws no curve and still says something',
      filtSpec.refused.curve() === null && filtSpec.refused.shape() === null
      && refInk > 40 && refInk < drawnInk
      && filtSpec.live.curve() !== null && filtSpec.deep.curve() !== null,
      `"comb 9dB" was refused with ${refInk} pixels of words on it against `
      + `${drawnInk} for a drawn curve of the same size`);

    /* 🔴 THE NEGATIVE CONTROL A DRAWER THAT IGNORED ITS TYPE WOULD FAIL. Any
       curve that slopes satisfies "a low pass goes down"; only a curve that
       really reads the name has a low pass and a high pass disagreeing at BOTH
       ends. Driven through the live component and put back. */
    const wasType = filtSpec.live.get().type;
    filtSpec.live.set({ type: 'low pass 12dB' });
    const lp = filtSpec.live.curve().y;
    filtSpec.live.set({ type: 'high pass 12dB' });
    const hp = filtSpec.live.curve().y;
    filtSpec.live.set({ type: wasType });
    const at = (y, u) => y[Math.round(u * (y.length - 1))];
    d.assert('a low pass and a high pass disagree at both ends, so the type is really read',
      at(lp, 0.05) > at(hp, 0.05) && at(hp, 0.95) > at(lp, 0.95)
      && filtSpec.live.get().type === wasType,
      `at the bottom ${at(lp, 0.05).toFixed(3)} against ${at(hp, 0.05).toFixed(3)}, `
      + `at the top ${at(lp, 0.95).toFixed(3)} against ${at(hp, 0.95).toFixed(3)}, `
      + `and it is back on ${wasType}`);

    /* Nothing on this picture is a measurement, and the label says so where a
       screen reader can hear it as well as where an eye can see it. */
    const lab = filtSpec.live.canvas.getAttribute('aria-label');
    d.assert('the label says the picture is a schematic and gives no frequency in hertz',
      /schematic/.test(lab) && !/Hz/.test(lab) && /of 127/.test(lab),
      `"${lab}"`);

    /**
     * 🔴 A SQUARE LATTICE IS A CLAIM ABOUT CONTROLS THAT ARE TALLER THAN THEY
     * ARE WIDE, AND THIS IS WHERE THAT CLAIM IS PAID FOR. `createControlGrid`
     * writes `gridAutoRows` at the same pitch as its columns, so a cell is as
     * tall as the WIDEST thing in the grid. Put a 300 px wide horizontal
     * slider in and every row becomes 300 px tall for a 40 px control, which is
     * the empty case condition `panel-layout.mjs` reports. The two sliders in
     * this block became knobs for exactly that reason, and the number below is
     * what stops the next person putting them back without noticing.
     * ⚠️ IT IS A RATIO, NOT A PIXEL COUNT, so the claim survives a change to
     * any of the sizes it is made of.
     */
    /* ⚠️ MEASURE IT AGAIN FIRST. This page lays every closed tab panel out
       inside a measuring window that holds no `await`, so a grid built at a
       width of zero is still at zero when a synchronous reader arrives. The
       control grid asserts above do the same, and for the same reason. */
    filtSpec.drive.size();
    const cellH = Math.max(...filtSpec.drive.cells.map((c) => c.getBoundingClientRect().height));
    const pitch = filtSpec.drive.pitch();
    d.assert('every control in the grid fills most of the square it was given',
      pitch > 0 && cellH / pitch > 0.6,
      `the tallest control is ${cellH.toFixed(0)} px in a ${pitch} px square, `
      + `which is ${(cellH / pitch * 100).toFixed(0)} per cent of it`);

    /* 🔴 THE NEGATIVE CONTROL, AND IT IS THE MEASUREMENT THAT DECIDED THE
       SHAPE OF THIS BLOCK. A horizontal slider in the same grid fails the claim
       above by a wide margin, which is why the two here are knobs. It is built,
       measured and thrown away rather than shipped. */
    {
      const probe = createSlider({ label: 'cutoff', sub: 'CC 74', min: 0, max: 127, value: 78 });
      const spare = el('div', 'kit-wide');
      filtSpec.drive.el.parentElement.append(spare);
      const g = createControlGrid({ cols: 1, gap: 10, items: [probe], host: spare });
      g.size();
      const sh = g.cells[0].getBoundingClientRect().height;
      const sp = g.pitch();
      d.assert('NEGATIVE CONTROL: a horizontal slider in the same grid is mostly empty case',
        sp > 0 && sh / sp < 0.4,
        `a slider is ${sh.toFixed(0)} px tall in the ${sp} px square its own width buys it, `
        + `which is ${(sh / sp * 100).toFixed(0)} per cent`);
      spare.remove();
    }
  }

  /**
   * 🔴 THE WAVEFORM'S WHOLE POINT IS WHAT IT REFUSES, so the counts are graded
   * against the real table through the real component rather than typed here.
   */
  if (waveSpec) {
    for (const v of [...waveSpec.drawnViews, waveSpec.pulse, waveSpec.blend,
      waveSpec.two, waveSpec.measured]) v.redraw();
    const drew = waveSpec.drawnViews.filter((v) => v.drawn());
    d.assert('4 of the Circuit’s 30 oscillator waves are drawn and 26 are not',
      waveSpec.drawnNames.length === 4 && drew.length === 4
      && OSC_WAVES.length === 30
      && OSC_WAVES.filter((n) => shapeFor(n)).length === 4,
      `${waveSpec.drawnNames.join(', ')}, and ${OSC_WAVES.length - 4} refused`);

    /* 🔴 A REFUSAL IS A PICTURE WITH WORDS ON IT, NOT AN EMPTY BOX. An empty
       box reads as a component that failed; the name and the reason read as the
       instrument not publishing a shape, which is what is true. */
    /* 🔴 ONE REFUSAL LEFT ON THE PAGE. The wavetable figure was removed on
       2026-09-22 and this read both. What it can no longer say is that a
       wavetable and a blend are refused for DIFFERENT stated reasons, which
       was the pair's whole job. */
    d.assert('a refused wave draws no curve and still names itself and its reason',
      !waveSpec.blend.drawn() && waveSpec.blend.ink() > 40
      && /not drawn/.test(waveSpec.blend.canvas.getAttribute('aria-label')),
      `"${waveSpec.blend.canvas.getAttribute('aria-label')}"`);

    /* A pulse is a family rather than a shape, so it is the one a name can
       never produce and a caller has to hand over. */
    d.assert('a pulse is drawn only when a width is handed over, never from a name',
      waveSpec.pulse.drawn() === true && shapeFor('pulse width') === null,
      `the figure drew a pulse at a duty of ${waveSpec.pulse.get().duty}, `
      + `and the name "pulse width" still maps to nothing`);

    /**
     * 🔴 TWO TRACES REALLY ARE TWO, AND THE PROOF IS INK AND NOT A FLAG. A
     * second trace that was declared and never stroked would satisfy every
     * boolean in the component and draw one line, so the measurement is the
     * count of marked pixels against the same figure with nothing over it.
     * ⚠️ AND THE INKS HAVE TO DIFFER, or two traces in ONE colour is a picture
     * that cannot say which signal is which, which is the whole ask.
     */
    const solo = createWaveShape({ name: 'sawtooth', height: 76 });
    waveSpec.two.el.parentElement.append(solo.el);
    solo.redraw();
    const [inkA, inkB] = waveSpec.two.inks();
    d.assert('a second trace adds a second line, in a second colour',
      waveSpec.two.overDrawn() === true && inkA !== inkB
      && waveSpec.two.ink() > solo.ink() * 1.3,
      `two traces mark ${waveSpec.two.ink()} pixels against ${solo.ink()} for one, `
      + `in ${inkA} and ${inkB}`);
    solo.destroy();
    solo.el.remove();

    /**
     * 🔴 SAMPLES OUTRANK A NAME, AND THIS IS THE HALF THE PAGE THAT ASKED FOR
     * IT NEEDS. `/muta/`'s two signals are a Plaits engine and a wave folder,
     * and neither is a sine, a triangle, a sawtooth or a square, so an option
     * that only took names would have been decoration on the one page it was
     * built for. A caller handing over SAMPLES is not guessing, which is the
     * only thing the refusal was ever about.
     */
    d.assert('a trace with real samples is drawn under a name that has no shape',
      waveSpec.measured.drawn() === true && waveSpec.measured.overDrawn() === true
      && shapeFor('plaits engine') === null && waveSpec.measured.ink() > 40,
      `"plaits engine" maps to ${shapeFor('plaits engine')} and still marks `
      + `${waveSpec.measured.ink()} pixels`);

    /* 🔴 THE NEGATIVE CONTROL: a figure with no second trace reports none, so
       `overDrawn` is measuring the option rather than answering true to
       everything. */
    d.assert('NEGATIVE CONTROL: a figure with one trace reports no second one and one ink',
      waveSpec.pulse.overDrawn() === false && waveSpec.pulse.inks()[1] === null
      && waveSpec.blend.overDrawn() === false,
      `the pulse reports ${waveSpec.pulse.overDrawn()} with inks `
      + `${JSON.stringify(waveSpec.pulse.inks())}`);

    /* 🔴 THE WALK ASSERT WENT WITH THE WALK ON 2026-09-22. It turned the same
       component's picture OFF at wave 14 and ON again at wave 0, which is the
       one behaviour a static specimen cannot show, and nothing on this page
       claims it now. `synth-view-test.mjs` still asserts `shapeFor` across all
       thirty names without a browser, so the COUNTS are graded and the
       transition is not. */
  }

  /**
   * 🔴 A FADER IS THE SLIDER TURNED 90 DEGREES, AND THAT IS A MEASUREMENT.
   * Both read their look from `.sld-lane` and `.sld-knob` with the axes
   * swapped, so the two can only drift if nobody compares them. **Putting them
   * side by side on this page is half of it; this is the other half.**
   */
  if (vertSpec) {
    const hLane = document.querySelector('.sld-lane');
    const vLane = vertSpec[0].el.querySelector('.pos-fdr-lane');
    const vHand = vertSpec[0].el.querySelector('.pos-fdr-hand');
    if (hLane && vLane) {
      const hr = hLane.getBoundingClientRect(), vr = vLane.getBoundingClientRect();
      const hcs = getComputedStyle(hLane), vcs = getComputedStyle(vLane);
      d.assert('a fader is the slider turned 90 degrees: the same track, across instead of along',
        Math.abs(hr.height - vr.width) <= 1
        && hcs.backgroundColor === vcs.backgroundColor
        && hcs.borderTopWidth === '0px' && vcs.borderTopWidth === '0px',
        `slider ${hr.height.toFixed(1)} px tall, fader ${vr.width.toFixed(1)} px wide, `
        + `both ${vcs.backgroundColor} with no border`);
    }
    if (vHand) {
      const hcs = getComputedStyle(vHand);
      d.assert('and its hand button is a segment of the lane, rounded only on the outside',
        hcs.borderTopLeftRadius === '0px' && hcs.borderBottomLeftRadius === '4px',
        `corners ${hcs.borderTopLeftRadius} top, ${hcs.borderBottomLeftRadius} bottom`);
    }
  }

  // every block built. A component that throws takes the page with it when
  // the error escapes, which turns one broken control into a blank page.
  /**
   * 🔴 THE DROP TARGET, AND THE FIRST TWO OF THESE ARE ABOUT A COVER NOBODY
   * SHOULD EVER BE TRAPPED UNDER. `/weight/` and `/floor/` both shipped a
   * `position: fixed; inset: 0` cover that sat over the row holding the button
   * that got you out, so this one has two independent guards and both are
   * measured: it is in the document only while a drag is in flight, and it is
   * `pointer-events: none` for its whole life. Either one alone would be enough
   * and neither one alone is checked.
   *
   * ⚠️ THE MEASUREMENT APPENDS THE COVER AND TAKES IT AWAY WITHOUT AWAITING,
   * which is the same argument the panel block's window makes: JavaScript here
   * is single threaded, no frame can be rendered between these statements, and
   * so a person reading this page never sees it. An `await` anywhere in this
   * block would break that and would be a check that mutates the page in front
   * of a reader, which is what `/tapes/`'s zoom check was doing.
   */
  {
    const tallWas = document.documentElement.scrollHeight;
    document.body.append(kitDrop.cover);
    const pe = getComputedStyle(kitDrop.cover).pointerEvents;
    const box = kitDrop.cover.getBoundingClientRect();
    kitDropTall = document.documentElement.scrollHeight;
    kitDrop.cover.remove();
    // 🔴 THE AREA IS ON SCREEN BEFORE ANYBODY DRAGS ANYTHING, which is the whole
    // repair and is exactly what the first version could not have passed.
    const areaBox = kitDrop.el.getBoundingClientRect();
    d.assert('the way in is on screen before any drag, with words saying what it takes',
      areaBox.width > 100 && areaBox.height > 40
      && kitDrop.el.classList.contains('pos-drop-area')
      && /\.circuitpack/.test(kitDrop.el.textContent) && !kitDrop.el.dataset.over,
      `${areaBox.width.toFixed(0)} by ${areaBox.height.toFixed(0)} px, saying `
      + `"${kitDrop.el.querySelector('.pos-drop-hint')?.textContent}"`);
    d.assert('a visit opens nothing, and the cover is not in the page until something is dragged over it',
      kitDrop.opens === 0 && !kitDrop.cover.isConnected,
      `${kitDrop.opens} files opened and the cover is ${kitDrop.cover.isConnected ? 'in' : 'out of'} the document`);
    d.assert('the cover cannot be pressed and cannot move anything, even while it is up',
      pe === 'none' && kitDropTall === tallWas && box.width > 0 && box.height > 0,
      `pointer-events ${pe} · the page is ${kitDropTall} px tall with it up and ${tallWas} px without `
      + `· the cover itself is ${box.width.toFixed(0)} by ${box.height.toFixed(0)}`);
  }

  /**
   * 🔴 THE REFUSAL, AND IT IS BEHIND THE GATE BECAUSE IT PRESSES A CONTROL.
   * A drop target that took everything would pass every check that counts what
   * it opened, which is the shape this project measured four times: `/tapes/`,
   * `/now/` and `/flipper/` were all fully green against stand-ins whose
   * refusals had been switched off. So the JPEG is dropped on purpose, down the
   * same code path a real drag takes, and the words it produces are asserted
   * rather than the counter alone: a refusal that increments a number and says
   * nothing to the reader is the failure this is guarding against.
   */
  if (SELFCHECK) {
    // 🔴 THE WINDOW IS SHUT ACROSS THE WAIT AND OPENED AGAIN AFTER, WHICH IS
    // THE RULE THIS PAGE ALREADY WROTE DOWN AND WHICH I BROKE ON THE FIRST RUN.
    // Reading a file is a promise, so an `await` here sits inside the measuring
    // window, a `requestAnimationFrame` callback finds it open, and a frame is
    // drawn with all five parts laid out at once. It went red immediately and
    // named the count, which is what that counter is for: no reading of the
    // source can see an await, and three other places on this page do exactly
    // this dance for the same reason.
    settle();
    const openedWas = kitDrop.opens, refusedWas = kitDrop.refused;
    await kitDrop.open([new File([new Uint8Array([0xff, 0xd8, 0xff, 0xe0])], 'photo.jpg')]);
    const said = kitDropLine.textContent;
    d.assert('a file it does not take is refused in words that name it, and it opens nothing',
      kitDrop.refused === refusedWas + 1 && kitDrop.opens === openedWas
      && said.includes('photo.jpg') && /not \.circuitpack/.test(said),
      `refused ${refusedWas} then ${kitDrop.refused}, opened ${openedWas} then ${kitDrop.opens} · it said "${said}"`);

    // ⚠️ THE NEGATIVE CONTROL. A target that refused EVERYTHING would pass the
    // assert above perfectly, so one file it does take goes down the same path.
    const before = kitDrop.opens;
    await kitDrop.open([new File([new Uint8Array([0xf0, 0x00, 0x20, 0x29])], 'one.syx')]);
    d.assert('NEGATIVE CONTROL: a file it does take is opened rather than refused, down the same path',
      kitDrop.opens === before + 1 && kitDrop.refused === refusedWas + 1
      && kitDropLine.textContent.includes('one.syx'),
      `opened ${before} then ${kitDrop.opens} · "${kitDropLine.textContent}"`);
    measure();
  }

  /**
   * 🔴 THE NEW BLOCK'S ONE CLAIM, AND IT IS A MEASUREMENT RATHER THAN A LOOK.
   * Two readouts with the SAME ten cells and the SAME ten values, so the only
   * thing that can differ between them is the arrangement. The flex row wraps
   * wherever the width lets it; the grid puts five in a row whatever happens,
   * which is the whole of what was asked for.
   * ⚠️ IT COMPARES ROW TOPS, NOT COLUMN COUNTS. A cell's column is not a thing
   * the DOM knows; how many distinct tops the ten cells have is, and it is the
   * same fact a reader sees.
   */
  {
    const tops = (r) => new Set([...r.readoutEl.children]
      .map((c) => Math.round(c.getBoundingClientRect().top)));
    const rowOf = (r, k) => Math.round([...r.readoutEl.children][k].getBoundingClientRect().top);
    const gridRows = tops(kitRoGrid);
    // ⚠️ AND IT IS FULL WIDTH, WHICH IT WAS NOT. MEASURED 2026-09-21 with a
    // throwaway probe at 1280 px: 557.6 px inside a 660 px content box, short by
    // 102.4. `.kit-box` is a flex row, so a readout in it is a flex ITEM and
    // takes its content width rather than the line. This section already carries
    // `kit-wide`, which makes the box `display: block`, and that is the fix the
    // page had already found for the same component once.
    const roBox = kitRoGrid.readoutEl.getBoundingClientRect();
    const host = kitRoGrid.readoutEl.parentElement;
    /**
     * ⚠️ `clientWidth` AND NOT A RECT MINUS PADDING, AND THE FIRST TRY WAS THE
     * SECOND. It read `rect.width - paddingLeft - paddingRight` and answered
     * `658.0 px of a 660.0 px content box`, so the assert went red by exactly
     * 2 px on a layout that was perfect: the box has a 1 px border each side and
     * the arithmetic forgot it. EVERY sibling in that box measured 658, which is
     * what said the layout was right and the ruler was wrong.
     * ⚠️ AND `clientWidth` ALONE WAS THE SECOND WRONG RULER, WHICH IS WORTH
     * WRITING DOWN BECAUSE IT SOUNDS LIKE THE RIGHT ONE. It is content PLUS
     * PADDING, with only the border and the scrollbar taken off, so it answered
     * 686 and the assert went red again by 28 px. The content box is
     * `clientWidth` minus the padding: 688 less 2 of border is 686, less 28 of
     * padding is 658, which is what every child in that box measures.
     * 🔴 THREE RULERS FOR ONE DISTANCE AND TWO OF THEM WERE WRONG. The thing
     * that told me the LAYOUT was fine both times was that every sibling
     * measured the same 658, which is a fact about the page rather than about
     * my arithmetic.
     */
    const hp = getComputedStyle(host);
    const content = host.clientWidth - parseFloat(hp.paddingLeft) - parseFloat(hp.paddingRight);
    const sibs = [...host.children].map((c) => Math.round(c.getBoundingClientRect().width));
    d.assert('a readout fills the width it is given rather than shrinking to its cells',
      Math.abs(roBox.width - content) < 1 && new Set(sibs).size === 1,
      `${roBox.width.toFixed(1)} px of a ${content.toFixed(1)} px content box, `
      + `and all ${sibs.length} children of that box measure ${[...new Set(sibs)].join(', ')}`);
    const vSize = (r) => parseFloat(getComputedStyle(r.readoutEl.querySelector('.pos-v')).fontSize);
    d.assert('asked for two rows it lays ten cells out five and five, whatever the flex row does',
      gridRows.size === 2
      && rowOf(kitRoGrid, 0) === rowOf(kitRoGrid, 4)
      && rowOf(kitRoGrid, 5) === rowOf(kitRoGrid, 9)
      && rowOf(kitRoGrid, 0) !== rowOf(kitRoGrid, 5),
      `${gridRows.size} row(s) of cells in the grid against ${tops(kitRoFlex).size} in the flex row`);

    d.assert('and the quieter value is smaller while the key it sits under is not',
      vSize(kitRoGrid) < vSize(kitRoFlex)
      && parseFloat(getComputedStyle(kitRoGrid.readoutEl.querySelector('.pos-k')).fontSize)
         === parseFloat(getComputedStyle(kitRoFlex.readoutEl.querySelector('.pos-k')).fontSize),
      `${vSize(kitRoGrid)} px against ${vSize(kitRoFlex)} px, with both keys at `
      + `${getComputedStyle(kitRoGrid.readoutEl.querySelector('.pos-k')).fontSize}`);
  }

  d.assert('every block on this page built',
    built.length > 0 && failed.length === 0,
    failed.length ? `${failed.length} did not: ${failed.join(' · ')}`
                  : `${built.length} blocks, none threw`);

  /**
   * 🔴 THE NEWEST BLOCK'S TWO CLAIMS, AND BOTH ARE MEASUREMENTS RATHER THAN
   * LOOKS. A bar UNDER a panel and a bar GLUED to one are the same order of
   * elements: what differs is whether there is one edge round the pair or two
   * edges and a gap, which is three numbers.
   * ⚠️ IT IS THE SAME SHAPE AS THE STRIP'S CHECK BELOW, on purpose. Two
   * components reach `.pos-glue` and the rule that zeroes a child's border is
   * double-classed precisely because a component can otherwise win the
   * specificity fight, so both callers grade it the same way.
   */
  if (glueSpec) {
    const surf = glueSpec.panel.surface;
    const edge = (n) => Math.round(parseFloat(getComputedStyle(n).borderTopWidth) || 0);
    const pb = glueSpec.panel.el.getBoundingClientRect();
    const bb = glueSpec.bar.el.getBoundingClientRect();
    const seam = bb.top - pb.bottom;
    /**
     * 🔴 AND HALF THE WIDTH OF ITS BOX, MEASURED RATHER THAN READ OFF THE
     * STYLESHEET. Asked 2026-09-20 as *"make it half w"*, and a rule that is
     * present and inert reads exactly like one that works: this file already
     * records three dead CSS rules found only by computing a value, and
     * `.kit-half` sits on a child of a box whose `display` another class
     * decides.
     * ⚠️ AGAINST THE BOX'S OWN CONTENT WIDTH, NEVER A PIXEL COUNT TYPED HERE. A
     * figure would be a second opinion about a width the layout owns, and it
     * would have to be retyped every time the page's column changes.
     * ⚠️ AND THE NEGATIVE HALF IS IN IT: a specimen still taking the whole box
     * would satisfy every other clause in this check.
     */
    const half = glueSpec.half;
    const hb = half.parentElement;
    const hcs = getComputedStyle(hb);
    const room = hb.clientWidth - parseFloat(hcs.paddingLeft) - parseFloat(hcs.paddingRight);
    const took = half.getBoundingClientRect().width;
    d.assert('a transport glued under a picture is one surface with one edge, at half its box',
      surf !== glueSpec.panel.el && surf.classList.contains('pos-glue')
      && surf.contains(glueSpec.panel.el) && surf.contains(glueSpec.bar.el)
      && Math.abs(seam - 1) <= 0.6 && edge(surf) === 1
      && edge(glueSpec.panel.el) === 0 && edge(glueSpec.bar.el) === 0
      && took < room - 1 && Math.abs(took - room / 2) <= 1,
      `seam ${seam.toFixed(1)} px, one edge of ${edge(surf)} px round both, `
      + `${edge(glueSpec.panel.el)} and ${edge(glueSpec.bar.el)} inside, `
      + `taking ${took.toFixed(1)} px of the ${room.toFixed(1)} px the box gives it`);

    /**
     * 🔴 THE TWO WORDS ARE THE SAME WIDTH, MEASURED IN BOTH STATES RATHER THAN
     * ASSERTED FROM THE STYLESHEET. Asked as *"start | stop text labels (same
     * w)"*, and the reason is the project's standing one about a control that
     * resizes under the pointer that just pressed it.
     * ⚠️ **AND THE WIDTH ALONE WOULD PASS ON A BUTTON SHOWING NEITHER WORD.**
     * `visibility: hidden` on both is the same width as `visibility: hidden` on
     * one, so the check reads which span is visible in each state as well. That
     * is the half that would catch the `::before` glyph rule winning the
     * specificity fight and a word never appearing at all.
     * ⚠️ IT PRESSES THE TOGGLE AND WAITS FOR THE STATE TO LAND rather than
     * setting `data-state` by hand, which would grade the stylesheet against
     * itself and say nothing about the bar.
     */
    const t = glueSpec.bar.el.querySelector('.tbar-toggle');
    const vis = (cls) => {
      const n = t?.querySelector(`.${cls}`);
      return n ? getComputedStyle(n).visibility : 'no span';
    };
    const w = () => (t ? +t.getBoundingClientRect().width.toFixed(2) : null);
    const wIdle = w();
    const seenIdle = [vis('tbar-w0'), vis('tbar-w1')];
    t?.click();
    // ⚠️ THE MEASURING WINDOW SHUTS ACROSS THIS WAIT AND OPENS AGAIN AFTER IT.
    // Both widths are read with every part laid out, which is the only state
    // either of them is a real number in; what may not happen is a frame being
    // rendered with all five parts open, and this loop is one of the two places
    // on the page that gives the browser the chance. See `measure()` above.
    settle();
    for (let i = 0; i < 40 && t?.dataset.state !== 'playing'; i++) {
      await new Promise((r) => requestAnimationFrame(r));
    }
    measure();
    const wBusy = w();
    const seenBusy = [vis('tbar-w0'), vis('tbar-w1')];
    t?.click();
    glueSpec.deck.pause();
    d.assert('a toggle that says two words is the same width in both of its states',
      wIdle != null && wBusy != null && Math.abs(wIdle - wBusy) < 0.01
      && seenIdle[0] === 'visible' && seenIdle[1] === 'hidden'
      && seenBusy[0] === 'hidden' && seenBusy[1] === 'visible',
      `${wIdle} px showing "${t?.querySelector('.tbar-w0')?.textContent}" `
      + `(${seenIdle.join('/')}), ${wBusy} px showing `
      + `"${t?.querySelector('.tbar-w1')?.textContent}" (${seenBusy.join('/')})`);
  }

  /**
   * 🔴 A BAR WITH NO PLAY BUTTON HAS NO PLAY BUTTON, AND SAYS SO IN A BOOLEAN A
   * HARNESS CAN READ. Two independent sources, which is the whole check: the
   * DOM says whether `.tbar-toggle` was ever appended, and `api.toggles` says
   * what the page asked for, so the two can disagree. Without the boolean
   * `demo/verify.mjs` clicks `.tbar-toggle` and asserts the position advanced,
   * which takes a `toggle: false` page red for a reason that is not its fault.
   * ⚠️ AND THE COMPARISON IS AGAINST THE WHOLE ROW BESIDE IT, never against a
   * count typed here. A page that had lost its toggle everywhere would satisfy
   * "this one has none".
   */
  if (tbarSpec) {
    const has = (b) => !!b.api.el.querySelector('.tbar-toggle');
    d.assert('a bar told to leave the play button off has none, and says so in one boolean',
      has(tbarSpec.whole) && tbarSpec.whole.api.toggles !== false
      && !has(tbarSpec.noToggle) && tbarSpec.noToggle.api.toggles === false
      && tbarSpec.noToggle.api.playing === false,
      `the whole row: toggle ${has(tbarSpec.whole) ? 'drawn' : 'MISSING'}, `
      + `toggles ${tbarSpec.whole.api.toggles} · with it off: `
      + `${has(tbarSpec.noToggle) ? 'STILL DRAWN' : 'no toggle'}, `
      + `toggles ${tbarSpec.noToggle.api.toggles}, playing ${tbarSpec.noToggle.api.playing}`);

    /**
     * 🔴 ONE POSITION SURFACE PER PAGE, WHICH IS WHAT `scrub: false` IS FOR.
     * ⚠️ AND IT IS NOT AN ELEMENT THAT GOES MISSING, WHICH IS WHAT THIS CHECK
     * FIRST ASSUMED AND WHY IT WENT RED ON A BAR THAT WAS RIGHT. The slider is
     * always built; `scrub: false` sets `data-scrub="0"` on the bar and
     * `shell.css` hides it from there. So the question is which rule won, and
     * the only thing that knows that is the COMPUTED style. A presence test
     * read `STILL HAS ONE` about a bar with no visible slider at all.
     * ⚠️ BOTH SIDES, because `data-scrub` is `seekable && wantScrub`: a deck
     * that could not be seeked would hide the slider on every bar here and a
     * one-sided check would have called that a success.
     */
    const shows = (b) => getComputedStyle(b.api.el.querySelector('.tbar-scrub')).display;
    const flag = (b) => b.api.el.dataset.scrub;
    d.assert('and a bar told to leave the slider off draws no second time axis',
      shows(tbarSpec.whole) !== 'none' && flag(tbarSpec.whole) === '1'
      && shows(tbarSpec.noScrub) === 'none' && flag(tbarSpec.noScrub) === '0',
      `the whole row is data-scrub=${flag(tbarSpec.whole)} showing `
      + `${shows(tbarSpec.whole)}, the one with scrub off is `
      + `data-scrub=${flag(tbarSpec.noScrub)} showing ${shows(tbarSpec.noScrub)}`);

    /**
     * 🔴 WHAT SUCH A BAR CARRIES INSTEAD, AND IT IS A BADGE RATHER THAN A WORD.
     * The chip's position held `LIVE` once: a word drawn because a page passed
     * `live: true` at BUILD time, so it said LIVE whether or not a byte had
     * arrived. On both board pages the chip is the presence badge, because the
     * fact worth having about an instrument in another building is whether it
     * is answering, which is a thing that can change.
     */
    const chip = tbarSpec.noToggle.api.el.querySelector('.pos-pres');
    d.assert('the chip on a bar with no toggle is a badge that can change, not a word',
      !!chip && chip.querySelector('.pos-pres-dot')
      && chip.querySelector('.pos-pres-w').textContent.trim().length > 0,
      chip ? `it says "${chip.querySelector('.pos-pres-w').textContent.trim()}" beside a dot`
           : 'there is nothing in the chip position');

    /**
     * 🔴 NEGATIVE CONTROL: A CHIP AND A LIVE BADGE WANT THE SAME POSITION AND
     * THE BAR REFUSES RATHER THAN PICKING. A specimen showing a refusal is
     * worth as much as one showing a shape, and this page already does it for a
     * readout with an odd number of cells and a table with two growing columns.
     */
    d.assert('NEGATIVE CONTROL: a chip and a live badge are refused rather than drawn over each other',
      typeof tbarSpec.refused === 'string' && tbarSpec.refused !== 'IT WAS ACCEPTED'
      && tbarSpec.refused.includes('same position'),
      tbarSpec.refused);

    /**
     * 🔴 EXACTLY ONE BAR ON THIS PAGE CLAIMS THE PAGE'S PLAYHEAD, AND THE COUNT
     * ALONE CANNOT SEE IT. `__demo.transport` is the only handle a CDP check
     * has; with four bars here, a page where NOTHING claimed it and a page
     * where two did would both read green, because the handle is not something
     * an assert count knows about. So both halves are graded: the handle is
     * filled, and it is filled by the bar this page chose rather than by
     * whichever was built last.
     * ⚠️ IDENTITY, NOT A SELECTOR. `document.querySelector('.tbar')` is the
     * first bar in DOM order, which is the same object only while a page has
     * one; `/stage/` has already paid for that confusion. This compares the
     * published object against the specimen itself.
     */
    const bars = [...document.querySelectorAll('.tbar')];
    const published = d.api.transport || window.__demo?.transport;
    /* FIVE since 2026-09-22: the STEP GRID block gained a standard transport
       when its hand-rolled `Play` button was reported. It passes
       `publish: false` like the other specimens, so the claim below is
       unchanged and only the count moved. */
    d.assert('of the five bars here exactly one claims the page\u2019s playhead, and it is the whole row',
      bars.length === 5 && !!published && published === tbarSpec.whole.api
      && published.el === tbarSpec.whole.api.el
      && bars.filter((b) => b === published.el).length === 1,
      `${bars.length} bars on the page · the handle holds ${published ? 'one of them' : 'NOTHING'}`
      + `${published && published === tbarSpec.whole.api ? ', the whole row' : ''}`);
  }

  // 🔴 GLUED, WHICH IS THE WORD THE ASK USED: *"footer section, looks like
  // glued that shows hovered info below timeline"*. So it is not enough that
  // the box is under the strip, it has to READ as the same surface, and that is
  // three measurements rather than a look: one border round the pair, nothing
  // between them but the 1 px seam `.pos-glue` shows through, and neither child
  // painting an edge of its own. `.pos-strip` and `.pos-glue.pos-glue > *` both
  // declare `border`, at (0,1,0) and (0,2,0), and which of them wins is the
  // specificity trap this stylesheet already records three times.
  if (footSpec) {
    const box = footSpec.surface;
    const cb = footSpec.el.getBoundingClientRect();
    const fb = footSpec.footer.el.getBoundingClientRect();
    const seam = fb.top - cb.bottom;
    const edge = (n) => Math.round(parseFloat(getComputedStyle(n).borderTopWidth) || 0);
    d.assert('the strip and the box saying what is under the pointer are one surface',
      box.classList.contains('pos-glue') && Math.abs(seam - 1) <= 0.6
      && edge(box) === 1 && edge(footSpec.el) === 0 && edge(footSpec.footer.el) === 0,
      `seam ${seam.toFixed(1)} px, one edge of ${edge(box)} px round both, `
      + `${edge(footSpec.el)} and ${edge(footSpec.footer.el)} inside`);
  }

  // 🔴 THE GROUP'S BUTTONS ARE WHERE THE HARNESSES LOOK, AND THAT IS THE ONE
  // THING A ROW COMPONENT CAN QUIETLY BREAK. `verify.mjs` and `verify-gl.mjs`
  // both press `.pos-controls button`, so a group that wraps its buttons in a
  // row of its own is one refactor away from taking them out of that selector
  // and out of the suite. `/mirror/` has already paid for this once: a stepper
  // moved into the knob row and the press count went 9 to 7 while the page read
  // green. Graded with the harnesses' OWN selector string, against a specimen
  // mounted the way a page mounts one.
  // ⚠️ PROVED BY BREAKING IT, 2026-09-19: the same specimen in a `.kit-row`
  // instead reads `0 of 3` and takes this red. The pressable count beside it is
  // 4 as of 2026-09-20, down from 6 when the headset pair went off screen, and
  // it is a fact about how many blocks currently mount a control row rather
  // than a number this check is graded against.
  const PRESSED = '.pos-controls button';
  const inRow = [...document.querySelectorAll(PRESSED)];
  const groupBtns = bgSpec ? bgSpec.buttons : [];
  d.assert('every button in a group is found by the selector both harnesses press',
    groupBtns.length === 3 && groupBtns.every((b) => inRow.includes(b)),
    `${groupBtns.filter((b) => inRow.includes(b)).length} of ${groupBtns.length} under ${PRESSED}, `
    + `${inRow.length} pressable on this page`);

  // 🔴 THE GROUP IS ONE OBJECT, AND IT SHIPPED AS THREE. Reported 2026-09-19
  // with a screenshot of `/mirror/`: *"i do not see buttongroup vr xr"*. The
  // row had `gap: 8px`, which is what two unrelated controls look like. The
  // join is `.pos-seg`'s `margin-left: -1px`, so what a reader sees is one
  // line where two buttons meet rather than two edges with a gap: measured as
  // the distance between the first button's right edge and the second's left,
  // which is -1 when they are joined and +8 when they are not.
  // ⚠️ AND THE CORNERS, because a join that overlaps borders while both
  // buttons keep four round corners reads as a mistake rather than as a seam.
  // Only the outer two are round.
  if (bgSpec) {
    const bs = bgSpec.buttons.map((b) => b.getBoundingClientRect());
    const joins = bs.slice(1).map((r, i) => +(r.left - bs[i].right).toFixed(2));
    const cs = bgSpec.buttons.map((b) => getComputedStyle(b));
    const inner = cs[1].borderTopLeftRadius;
    d.assert('a group is one object: its buttons share a border and only the outer corners are round',
      joins.every((j) => Math.abs(j + 1) < 0.02)
      && cs[0].borderTopLeftRadius !== '0px' && cs[cs.length - 1].borderTopRightRadius !== '0px'
      && inner === '0px' && cs[1].borderTopRightRadius === '0px',
      `${joins.length} join(s) at ${joins.join(', ')} px, ends rounded ${cs[0].borderTopLeftRadius}`
      + ` and ${cs[cs.length - 1].borderTopRightRadius}, the middle one ${inner}`);
  }

  // 🔴 AND IT IS STILL NOT A CHOICE, WHICH IS THE HALF THE JOIN CANNOT CARRY.
  // A segmented row with nothing armed is a legal choice state: `/stage/` ships
  // one, with `at: -1`, because a question that arrives already answered is a
  // question nobody was asked. So the difference has to live somewhere else and
  // it lives in two places a reader can see. `aria-pressed` is the channel a
  // choice arms, for a screen reader and for the `--hi` tint keyed on it, and a
  // group never writes it. And a group's buttons are FULL SIZE, because they
  // are things you press, where a choice's options are small because they are
  // values being compared.
  // ⚠️ MEASURED AS INK, NOT READ OFF THE STYLESHEET. A rule that is present and
  // inert reads exactly like one that works, which is this page's own lesson.
  if (bgSpec && choiceSpec) {
    const armed = bgSpec.buttons.filter((b) => b.hasAttribute('aria-pressed'));
    const gSize = parseFloat(getComputedStyle(bgSpec.buttons[0]).fontSize);
    const cSize = parseFloat(getComputedStyle(choiceSpec.buttons[0]).fontSize);
    d.assert('a joined group still cannot read as a choice: nothing is armed and the buttons are full size',
      armed.length === 0 && gSize > cSize,
      `${armed.length} of ${bgSpec.buttons.length} carry aria-pressed, and a group button is`
      + ` ${gSize} px against a choice option's ${cSize} px`);
  }

  // 🔴 SWITCHING A BUTTON OFF MOVES NOTHING. The answer that switches these off
  // arrives late by construction, because asking a browser about a headset is a
  // promise, so a disabled look that changed the box would reflow the control
  // row under a pointer already on its way to it. `button[disabled]` is opacity
  // and a cursor, and this measures that it stayed that way.
  if (bgSpec) {
    const b = bgSpec.button('clear');
    const on = b.getBoundingClientRect();
    bgSpec.enable('clear', false, 'The log on this page is already empty.');
    const off = b.getBoundingClientRect();
    const said = b.title;
    bgSpec.enable('clear', true);
    d.assert('a button switched off is the same size as it was on, and it says why',
      Math.abs(on.width - off.width) < 0.01 && Math.abs(on.height - off.height) < 0.01
      && said.length > 0 && b.title === '',
      `${on.width.toFixed(1)} by ${on.height.toFixed(1)} on, ${off.width.toFixed(1)} by ${off.height.toFixed(1)} off · `
      + `"${said}" · nothing left over when it came back`);
  }

  // NEGATIVE CONTROL: the reason is not optional. A grey control with no
  // explanation reads as a broken page rather than as a browser that cannot do
  // the thing, so the group refuses it the way `mount()` refuses an odd readout.
  if (bgSpec) {
    let refused = '';
    try { bgSpec.enable('save', false); }
    catch (e) { refused = e.message; }
    d.assert('NEGATIVE CONTROL: a button disabled with no reason is refused rather than drawn',
      refused.length > 0 && bgSpec.enabled('save'),
      refused || 'it was accepted, and the button is off with nothing to show for it');
  }

  // 🔴 THE IPHONE CASE, WHICH IS THE ONE THAT WAS BROKEN. Every XR page wrote
  // `navigator.xr?.isSessionSupported(...).then(...)`, and on a browser with no
  // `navigator.xr` the optional chain returns undefined, so neither handler runs
  // and the variable stays null for ever. `/held/` then reported that to a
  // visitor holding a phone as a check that had FAILED. `createXrProbe` takes
  // the system object rather than reading `navigator`, so the case that cannot
  // be reproduced in this browser can be built in one line.
  // ⚠️ THREE PROBES, NOT ONE. A module that answered `absent` about everything
  // would pass the first of these on its own, which is the whole reason the
  // other two are here.
  {
    // ⚠️ THE SECOND OF THE TWO WAITS, AND THIS ONE MEASURES NO GEOMETRY AT ALL,
    // so the window simply shuts across it. Three promises resolving is three
    // frames a browser could render with every part open. See `measure()`.
    settle();
    const nothing = createXrProbe(undefined).caps();
    const says = await createXrProbe({ isSessionSupported: async () => true }).when(1000);
    const refuses = await createXrProbe({ isSessionSupported: () => Promise.reject(new Error('no')) }).when(1000);
    measure();
    d.assert('a browser with nothing to ask is answered at once, and three browsers get three answers',
      nothing.vr === 'absent' && nothing.ar === 'absent' && answered(nothing.vr)
      && says.vr === 'yes' && says.ar === 'yes'
      && refuses.vr === 'no' && refuses.ar === 'no',
      `no headset support: ${nothing.vr} · a browser that says yes: ${says.vr} · `
      + `one that refuses to answer: ${refuses.vr}`);
  }

  // Every answer that switches a control off has a sentence a visitor can read,
  // and the answer that switches nothing off has nothing to say. A disabled
  // button with no reason is worse than an enabled one; a tooltip on a working
  // control restating its own label is furniture.
  {
    const wrong = [];
    let sentences = 0;
    for (const mode of ['vr', 'ar']) {
      for (const st of XR_STATES) {
        const says = reasonFor(st, mode);
        if (says) sentences++;
        if (!canEnter(st) && !says) wrong.push(`${mode} ${st} says nothing`);
        if (st === 'yes' && says) wrong.push(`${mode} yes carries a tooltip it does not need`);
        // The rules every visitor-facing sentence here obeys: no file path, no
        // warning sign, and no dash bolting a second clause on.
        if (says && (says.includes('/') || /[—⚠\u{1f534}]/u.test(says))) {
          wrong.push(`${mode} ${st} is not plain words`);
        }
      }
    }
    d.assert('every answer that switches a headset button off says why, in plain words',
      wrong.length === 0,
      wrong.length ? wrong.join(' · ')
        : `${XR_STATES.length} answers over 2 modes, ${sentences} sentences, and nothing said when it works`);
  }

  // The pair this page builds is wired the way the four pages wire theirs, so
  // the wiring is graded once here rather than four times over there. Whatever
  // this browser answers, the control agrees with it.
  // ⚠️ THE GROUP IS OFF SCREEN SINCE 2026-09-20, when the specimen was asked
  // for removal. It is the same object wired the same way; what went is the row
  // a visitor could see, and this check is why the group itself did not go with
  // it.
  // ⚠️ PROVED BY BREAKING IT, 2026-09-19: with the two `enable` calls taken out
  // of the subscription this reads `vr no, pressable` and goes red, which is
  // the `/held/` defect exactly. A page that forgets to wire it is the failure
  // this catches, because nothing else can see a call that is not there.
  if (xrSpec) {
    const c = xrCaps();
    d.assert('a headset button is pressable exactly when this browser says it can be',
      xrSpec.enabled('vr') === canEnter(c.vr) && xrSpec.enabled('ar') === canEnter(c.ar),
      `vr ${c.vr}, ${xrSpec.enabled('vr') ? 'pressable' : 'off'} · `
      + `ar ${c.ar}, ${xrSpec.enabled('ar') ? 'pressable' : 'off'}`);
  }

  // 🔴 NOTHING IN THE LOG IS WHITE. Asked 2026-09-19 with a photograph of a
  // phone: *"do not color log items white, keep it gray or red or whatever you
  // hae in palette"*. The emphasis on a `hi` line is carried by weight plus ONE
  // step of ink now, so what is graded is that the step is real and that it
  // stops short of the page's brightest colour.
  // ⚠️ MEASURED AS INK, NEVER AS A RULE. shell.css already records what reading
  // a stylesheet instead of a computed style costs: a rule that is present and
  // inert reads exactly like one that works.
  // ⚠️ AND THE SPECIMEN IS NEVER SEEN. `color` resolves on a `display: none`
  // element, so it goes into the real log, is measured, and is gone inside one
  // task.
  {
    const line = el('div', 'pos-line hi');
    line.style.display = 'none';
    const m = el('span', 'pos-m', 'probe');
    line.append(m);
    d.logEl.append(line);
    const emph = getComputedStyle(m).color;
    const brightest = getComputedStyle(document.body).color;
    const body = getComputedStyle(d.logEl).color;
    line.remove();
    d.assert('the loudest line in the log is quieter than the page\u2019s brightest ink',
      emph !== brightest && emph !== body,
      `the log reads ${body}, its emphasis ${emph}, the page ${brightest}`);
  }

  // 🔴 THE LEFT EDGES. Reported THREE TIMES on a real page and the third
  // report was a different bug wearing the first one's clothes: a component
  // swap moved the class a rule was keyed on, the sharing call went on setting
  // a custom property nothing consumed, and the row snapped back to the width
  // of one word while the code and the comment beside it both read as correct.
  // Measured ink, not arithmetic about ink.
  //
  // ⚠️ A PAIRED GROUP IS TWO COLUMNS ON PURPOSE, so "one left edge" is the
  // wrong claim about it and grading it that way reported 355 px apart about a
  // layout doing exactly what it was asked. It gets the claim that IS true of
  // it: two columns, and every label in a column on one edge. First written the
  // other way, which is how the difference got noticed.
  const leftsIn = (g) => [...g.querySelectorAll('.sld-l')]
    .map((n) => Math.round(n.getBoundingClientRect().left));
  const spreadOf = (xs) => (xs.length > 1 ? Math.max(...xs) - Math.min(...xs) : 0);

  const stackedGroups = [...document.querySelectorAll('.kit-box .sld-group:not(.pos-pair)')];
  let stackedWorst = 0, stackedLabels = 0;
  for (const g of stackedGroups) {
    const xs = leftsIn(g);
    stackedLabels += xs.length;
    stackedWorst = Math.max(stackedWorst, spreadOf(xs));
  }
  d.assert('sliders stacked in one group start their labels at the same left edge',
    stackedLabels > 1 && stackedWorst <= 1,
    stackedLabels > 1
      ? `${stackedLabels} labels in ${stackedGroups.length} group(s), worst ${stackedWorst} px apart`
      : 'no stacked slider labels were found, so nothing was compared');

  const pairGroups = [...document.querySelectorAll('.kit-box .sld-group.pos-pair')];
  let pairCols = 0, pairWorst = 0;
  for (const g of pairGroups) {
    const xs = leftsIn(g);
    const cols = new Map();
    for (const x of xs) {
      const key = [...cols.keys()].find((k) => Math.abs(k - x) <= 1);
      (cols.get(key ?? x) ?? cols.set(x, []).get(x)).push(x);
    }
    pairCols = Math.max(pairCols, cols.size);
    for (const col of cols.values()) pairWorst = Math.max(pairWorst, spreadOf(col));
  }
  d.assert('and a two-across group keeps exactly two of them, one per column',
    pairGroups.length > 0 && pairCols === 2 && pairWorst <= 1,
    pairGroups.length
      ? `${pairGroups.length} paired group(s), ${pairCols} column(s), worst ${pairWorst} px within one`
      : 'no paired group was found, so nothing was compared');

  // 2b. 🔴 THE INVISIBLE HAND'S BUTTON, MEASURED RATHER THAN LOOKED AT, AND
  // NOTHING HERE PRESSES IT. A visit to this page must assert a strict subset:
  // everything gradable from what is already on the screen runs, and anything
  // that would start a movement does not. The plumbing claims are graded on
  // `/knobs/` behind `?selfcheck=1`, which is the page that has two sliders and
  // a real send gate to compare them with.
  {
    const row = handSpec?.withHand.el.querySelector('.sld-hand-row');
    const btn = row?.querySelector('.sld-hand');
    const laneR = row?.querySelector('.sld-lane')?.getBoundingClientRect();
    const btnR = btn?.getBoundingClientRect();
    const seam = laneR && btnR ? Math.round(btnR.x - (laneR.x + laneR.width)) : NaN;
    const cs = btn ? getComputedStyle(btn) : null;
    const laneCs = row ? getComputedStyle(row.querySelector('.sld-lane')) : null;
    d.assert('a hand button is joined to its lane, one pixel over, with the corners rounded only outside',
      !!row && row.classList.contains('pos-seg') && seam === -1
      && cs.borderTopRightRadius === '4px' && cs.borderTopLeftRadius === '0px'
      && laneCs.borderTopRightRadius === '0px' && laneCs.borderTopLeftRadius === '4px'
      && Math.round(btnR.height) === Math.round(laneR.height),
      row ? `seam ${seam} px, lane corners ${laneCs.borderTopLeftRadius}/${laneCs.borderTopRightRadius}, `
        + `button ${cs.borderTopLeftRadius}/${cs.borderTopRightRadius}, both ${Math.round(btnR.height)} px high`
        : 'no hand row was built');
    // 🔴 AND THE WRAPPER IS CONDITIONAL, WHICH IS A REAL CASUALTY AND NOT A
    // PREFERENCE. `/grains/` selects `.fade > .sld > .sld-lane` with a CHILD
    // combinator, so an unconditional row would stop that matching in silence
    // and take the lane back to its standalone 96 px.
    // ⚠️ AND NO HAND BUTTON MAY SIT IN A CONTROL ROW: `verify.mjs` presses
    // `.pos-controls button` on every demo on every run.
    d.assert('a slider with no hand has no wrapper, and no hand button sits in a control row',
      !!handSpec && !handSpec.without.el.querySelector('.sld-hand-row')
      && handSpec.without.el.firstElementChild?.nextElementSibling?.classList.contains('sld-lane')
      && !document.querySelector('.pos-controls .sld-hand')
      && handSpec.without.hand === null && handSpec.withHand.hand !== null,
      handSpec
        ? `the plain slider's second child is its own ${handSpec.without.el.children[1]?.className}, `
          + `and ${document.querySelectorAll('.pos-controls .sld-hand').length} hand buttons are in a control row`
        : 'the block did not build');
  }

  // the readout specimen. An odd count leaves the last row short, and a
  // cell with nothing in it must be EMPTY with its unit HIDDEN: an empty value
  // beside a standing `%` reads as a number that went missing, and a pre-set 0
  // reads as a very confident measurement of nothing.
  // ⚠️ THIS COMMENT SAID "one em dash" UNTIL 2026-09-18, THREE MONTHS AFTER THE
  // PLACEHOLDER WAS REMOVED. The assert below was right the whole time: it asks
  // whether the UNIT is hidden and never what the cell draws, which is why it
  // stayed green while the sentence above it described a different page.
  const cells = [...document.querySelectorAll('.kit-box .pos-readout .pos-cell')];
  const pending = cells.map((c) => c.querySelector('.pos-v[data-state="pending"]')).filter(Boolean);
  const unitShown = pending.some((v) => {
    const u = v.querySelector('.pos-u');
    return u && getComputedStyle(u).display !== 'none';
  });
  d.assert('the readout specimen has an even number of cells and hides the unit of an unmeasured one',
    cells.length > 0 && cells.length % 2 === 0 && pending.length > 0 && !unitShown,
    `${cells.length} cells, ${pending.length} unmeasured, unit ${unitShown ? 'STILL SHOWING' : 'hidden'}`);

  // 🔴 THE NEGATIVE CONTROL FOR IT, and it is the reason the rule holds at
  // all: `mount()` REFUSES an odd count rather than trusting every page to
  // remember. A rule enforced by nothing is a rule that is already broken
  // somewhere. Called in a try, because passing is the throw.
  let odd = null;
  try {
    mount({ name: 'kit-probe', readout: { a: '', b: '', c: '' } });
    odd = 'it was accepted';
  } catch (e) { odd = e.message; }
  d.assert('NEGATIVE CONTROL: a readout with an odd number of cells is refused',
    odd !== 'it was accepted', odd);

  // the diagram grades both directions. A cuts report that can only ever
  // say "nothing cut" is not a measurement of anything: the picture built out
  // of deliberately unwritable labels has to come back with cuts, and the one
  // written properly has to come back with none.
  const fits = drawn.get('fits');
  const tooLong = drawn.get('too-long');
  d.assert('a diagram whose labels fit reports nothing shortened',
    !!fits && fits.measured && fits.cuts.length === 0,
    fits ? `${fits.width} px, type ${fits.measured ? 'measured' : 'ESTIMATED'}, ${fits.cuts.length} cut`
         : 'that picture never rendered');
  d.assert('NEGATIVE CONTROL: and one written too long reports every label it shortened',
    !!tooLong && tooLong.cuts.length > 0,
    tooLong ? `${tooLong.cuts.length} shortened: ${tooLong.cuts.map((c) => c.id).join(', ')}`
            : 'that picture never rendered');

  // 🔴 A LINK ASKED FOR AND NOT DRAWN, WHICH IS THE ONE DEFECT A PICTURE
  // CANNOT SHOW YOU. An arrow between two boxes in one container used to be
  // thrown away: the diagram still looked complete, because the plain tie
  // between those boxes stood exactly where the arrow should have been, and
  // /station/ lost three real arrows that way without anybody noticing. So this
  // counts the lines rather than looking at them — three links declared must be
  // three arrows on the picture, and the ONE gap nothing was declared across
  // must still have its tie. Both numbers matter: three arrows and two ties
  // would mean the arrow had been drawn on top of the bracket it replaces.
  const arrowsAndTies = (a) => a && {
    arrows: a.svg.querySelectorAll('.pos-dg-link').length,
    ties: a.svg.querySelectorAll('.pos-dg-tie').length,
  };
  const wide = arrowsAndTies(drew.get('siblings'));
  const narrow = arrowsAndTies(drew.get('siblings-phone'));
  const tally = (x) => (x ? `${x.arrows} arrows, ${x.ties} ties` : 'never rendered');
  d.assert('an arrow between two boxes in one machine is drawn, and it replaces their tie',
    !!wide && !!narrow && wide.arrows === 3 && wide.ties === 1
    && narrow.arrows === 3 && narrow.ties === 1,
    `left to right: ${tally(wide)} · one column: ${tally(narrow)}`);

  // 🔴 THE PRESENCE BADGE IS THE SAME WIDTH IN ALL FOUR STATES, which is
  // this project's standing rule about anything that redraws: a live sentence
  // under a picture reflowed between three and four lines and was reported as
  // "a horrible jump of content each time it updates". A badge whose word goes
  // from `online` to `coming online` would shove whatever sits to its right
  // every time a board answered.
  //
  // ⚠️ FOUR BADGES, NOT ONE PRESSED THROUGH FOUR STATES. The claim is identical
  // and this way nothing a visitor is looking at moves while it is graded,
  // which is the other rule: a check that mutates is the test.
  {
    // 🔴 ONE BADGE, WALKED. This compared four badges side by side, which is a
    // different claim and a weaker one: what must never happen is a badge
    // changing width UNDER A READER as the thing it watches comes and goes.
    // Four fixed specimens now sit at their own widths on purpose, so comparing
    // them would measure the reserve rather than the guarantee.
    const w = [];
    for (const s of PRESENCE_STATES) {
      presLive.set(s);
      w.push([s, presLive.el.getBoundingClientRect().width]);
    }
    presLive.set('online');
    const spread = Math.max(...w.map(([, x]) => x)) - Math.min(...w.map(([, x]) => x));
    d.assert('one badge is the same width in every state it can be in',
      w.length === PRESENCE_STATES.length && spread <= 0.5,
      w.length === PRESENCE_STATES.length
        ? `${w.map(([s, x]) => `${s} ${x.toFixed(1)}`).join(' · ')} px, spread ${spread.toFixed(2)}`
        : `${w.length} states were measured of ${PRESENCE_STATES.length}, so nothing was compared`);

    /**
     * 🔴 AND THE SAME GUARANTEE HAS TO SURVIVE THE BUSY WORDS, which is the
     * reason they are words on the badge rather than a mark beside it. A mark
     * that appears when somebody starts driving would change the badge's width
     * in a transport bar, and the reserve here is measured over every phrase
     * this badge can ever say, busy variants included. Sabotage: drop the busy
     * phrases out of the `widest` calculation in presence.mjs and this goes red
     * by about four characters.
     */
    const bw = [...busySpec].map(([label, el2]) => [label, el2.getBoundingClientRect().width]);
    const bs = bw.length > 1 ? Math.max(...bw.map(([, x]) => x)) - Math.min(...bw.map(([, x]) => x)) : -1;
    d.assert('a badge is the same width whether nobody, a person or a harness is driving it',
      bw.length === 3 && bs <= 0.5,
      bw.length === 3
        ? `${bw.map(([l, x]) => `${l} ${x.toFixed(1)}`).join(' · ')} px, spread ${bs.toFixed(2)}`
        : `${bw.length} specimens of 3, so nothing was compared`);

    // And that they actually SAY different things, because three badges the
    // same width could equally be three badges saying nothing.
    const said = [...busySpec].map(([l, el2]) => [l, el2.querySelector('.pos-pres-w').textContent.trim()]);
    d.assert('and it says which of the three it is, in words',
      new Set(said.map(([, t]) => t)).size === 3,
      said.map(([l, t]) => `${l}: "${t}"`).join(' · '));

    /**
     * 🔴 THE WORD GREYS AND THE DOT DOES NOT, and both halves are the claim.
     * A grey dot would say nobody has looked, which is what `checking` and
     * `unknown` use it for, so a busy board would become indistinguishable from
     * one we know nothing about. Asserting only the word would let the dot drift
     * grey and nothing would catch it.
     */
    const ink = (el2, sel) => getComputedStyle(el2.querySelector(sel)).color;
    const idle = busySpec.get('nobody'), person = busySpec.get('a person'), tool = busySpec.get('a harness');
    /**
     * 🔴 THE PANEL'S DEFAULTS ARE THE COMPONENT'S WHOLE ARGUMENT, so they are
     * what is checked: a page that writes neither still gets something that says
     * whether its source is answering and something that fills the screen.
     * ⚠️ AND THE PICTURE IS READ BACK OUT OF THE PANEL'S OWN CANVAS. A canvas
     * that is blank and one that is painting look identical to every counter,
     * and `pattern.mjs` burns a clock into the frame precisely so a page can ask.
     */
    if (vpSpec) {
      const first = vpSpec[0].panel;
      const btn = first.slots.right.querySelector('button');
      const r = btn?.getBoundingClientRect();
      d.assert('a panel comes with a status on the left and a square control on the right',
        !!first.slots.left.querySelector('.pos-pres') && !!r && Math.abs(r.width - r.height) <= 0.5
        && first.slots.centre.childElementCount === 0,
        r ? `the button is ${r.width.toFixed(1)} by ${r.height.toFixed(1)} px and the centre holds ${first.slots.centre.childElementCount}`
          : 'there is no control in the right slot');

      const ms = readBurned(vpSpec[0].ctx);
      d.assert('the picture in a panel is really being drawn, read back out of its own canvas',
        Number.isFinite(ms) && Math.abs(Date.now() - ms) < 60_000,
        Number.isFinite(ms) ? `the burned clock is ${Math.abs(Date.now() - ms)} ms from now`
          : 'nothing decoded, so the canvas is not showing the picture');

      let threw = false;
      try { first.mode('enormous'); } catch { threw = true; }
      d.assert(`a fullscreen mode outside ${FULL_MODES.join(', ')} is refused rather than ignored`,
        threw, threw ? 'it throws' : 'it accepted a mode that does not exist');
    }

    /**
     * 🔴 THE STEPPER'S MIDDLE IS REALLY A LIST, not a label that looks like one.
     * A cell that draws the right name with an empty or disabled select behind
     * it is the exact failure `picker.mjs` records on `/mirror/`: the control
     * looked correct and could not be used. So this asserts the working half.
     */
    const sel = stepperPick?.select;
    d.assert('the stepper\u2019s middle really opens a list, and the arrows still step it',
      !!sel && sel.options.length === 4 && !sel.disabled
      && stepperPick.el.querySelectorAll('button').length === 2,
      sel ? `${sel.options.length} options, ${sel.disabled ? 'disabled' : 'usable'}, `
        + `${stepperPick.el.querySelectorAll('button').length} arrows, showing "${stepperPick.el.querySelector('.pos-pick-n').textContent}"`
        : 'the stepper has no select at all');

    d.assert('the busy word is greyer than the word it qualifies, and the dot is not',
      ink(person, '.pos-pres-w') === ink(tool, '.pos-pres-w')
      && ink(person, '.pos-pres-w') !== ink(idle, '.pos-pres-w')
      && ink(person, '.pos-pres-dot') === ink(idle, '.pos-pres-dot'),
      `word ${ink(idle, '.pos-pres-w')} -> ${ink(person, '.pos-pres-w')} · `
      + `dot ${ink(idle, '.pos-pres-dot')} -> ${ink(person, '.pos-pres-dot')}`);
  }

  // 🔴 AND THE ANIMATION CANNOT MOVE ANYTHING EITHER, which is a separate
  // claim from the one above: the reserve fixes the four states against each
  // other, this fixes every frame of the breathing dot against itself. Read off
  // the KEYFRAMES rather than off two measurements a moment apart, because a
  // property that moves the layout for one frame in eighty is a defect two
  // rects would only catch by luck.
  {
    const after = (s) => getComputedStyle(presSpec.get(s).querySelector('.pos-pres-dot'), '::after');
    const moving = PRESENCE_STATES.filter((s) => (after(s).animationName || 'none') !== 'none');
    // Both moving states are meant to share ONE keyframe, so take the name only
    // when they agree: two different animations here would be two ways of
    // saying "something is happening", which is the drift this page exists for.
    const names = new Set(moving.map((x) => after(x).animationName));
    const name = names.size === 1 ? [...names][0] : null;
    // Every declaration in every keyframe of it, out of the one stylesheet.
    const props = new Set();
    for (const sheet of document.styleSheets) {
      let rules = [];
      try { rules = [...sheet.cssRules]; } catch { continue; }   // never cross-origin here
      for (const r of rules) {
        if (r.type !== CSSRule.KEYFRAMES_RULE || r.name !== name) continue;
        for (const k of r.cssRules) for (const p of k.style) props.add(p);
      }
    }
    const only = props.size > 0 && [...props].every((p) => p === 'opacity');
    /**
     * 🔴 THE TWO AXES, AS A CHECK. Colour says what is KNOWN and motion says
     * something is HAPPENING, so exactly two states move: `checking`, which is
     * this page asking, and `coming`, which is the instrument starting. The
     * three settled ones are still. Both moving states share one keyframe, and
     * that keyframe may touch nothing but opacity, or a breathing dot could
     * shove its neighbour once every eighty frames.
     */
