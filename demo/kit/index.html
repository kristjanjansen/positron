<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON kit</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/kit-page.css">
<style>
  /* The parts as cards, as the front page draws its concept pages. */
  .kit-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .kit-card {
    display: flex; flex-direction: column; gap: 6px; min-height: 110px;
    padding: var(--inset, 12px); background: var(--card);
    border: var(--edge, 1px solid var(--line)); border-radius: var(--r, 4px);
    color: inherit; text-decoration: none;
  }
  .kit-card:hover { border-color: var(--fg); }
  /* The title names a part, so it is the mono; the line under it is read
     through, so it is Geist (`--sans`, the body's face), as the front page does. */
  .kit-card-t { margin: 0; font-size: 15px; font-family: var(--mono); }
  .kit-card-s { margin: 0; color: var(--dim); font-size: 13.5px; }
  .kit-card-t, .kit-card-s { text-wrap: balance; }
</style>
<script type="module">
  import { mount, el } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { KIT_PARTS, whereIs } from '/shell/kit-parts.mjs';
  import { DEMOS } from '/manifest.mjs';

  /**
   * 🔴 `/kit/` SINCE STEP 4 OF plans/plan-kit-split.md, 2026-10-06. It used to
   * be every part of the kit on one page of eight tabs; that file moved with
   * `git mv` to `demo/kit/slides/index.html`, so its history follows SLIDES,
   * and every other part is a page of its own at `/kit/<part>/`.
   * ⚠️ WHAT IT DOES: an old address naming a block, `/kit/#keyboard`, replaces
   * itself with the part page holding that block, `/kit/input/#keyboard`; one
   * naming a part, `/kit/#hardware`, goes to `/kit/hardware/`; anything else
   * stays here and reads a list of the parts. The map is
   * `demo/shell/kit-parts.mjs`, and every part page asserts its own row of it,
   * so this page builds nothing and grades only the lookup.
   * ⚠️ `replace`, NOT `assign`, so the back button skips the address that only
   * existed to be forwarded.
   */
  const target = whereIs(decodeURIComponent((location.hash || '').replace(/^#/, '')));
  if (target && !SELFCHECK) location.replace(target);

  const d = mount({
    name: 'kit',
    what: 'Every reusable control in the shell, one part to a page, wired to nothing.',
    readout: null,
  });

  // 🔴 THE KIT'S OWN INDEX SINCE 2026-10-10 (*"make a separate kit page (rm
  // from frontpage)"*): the parts are off the front page and are cards here,
  // each with the one line its manifest row carries, so the words cannot drift.
  const one = (part) => DEMOS.find((x) => x.name === `kit/${part}`)?.one || '';
  const cards = el('div', 'kit-cards');
  for (const p of KIT_PARTS) {
    const a = el('a', 'kit-card', '', { href: `/kit/${p.part}/` });
    a.append(el('h3', 'kit-card-t', p.part));
    const say = one(p.part);
    if (say) a.append(el('p', 'kit-card-s', say.charAt(0).toUpperCase() + say.slice(1) + '.'));
    cards.append(a);
  }
  d.el.append(cards);

  if (SELFCHECK) {
    d.assert('an old block address goes to the part page that holds it, and an old part address to the part',
      whereIs('keyboard') === '/kit/input/#keyboard' && whereIs('hardware') === '/kit/hardware/'
        && whereIs('segment-display') === '/kit/devices/#segment-display',
      `keyboard to ${whereIs('keyboard')}, hardware to ${whereIs('hardware')}`);
    d.assert('NEGATIVE CONTROL: a name no block or part has goes nowhere',
      whereIs('no-such-block') === null && whereIs('') === null, `${whereIs('no-such-block')}`);
  }
  d.ready();
</script>
