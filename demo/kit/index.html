<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON · kit</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* ⚠️ 10 px UNDER THE TITLE, NOT 4. Asked 2026-09-17 with a photograph: *"add
     bit more space afrer title and before examplebox"*. A heading at 10.5 px
     with `line-height: 1` has a box tight to its letters, so 4 px of margin is
     about two pixels of visible air and the sentence under it read as a second
     line of the heading. */
  .kit-h { font: 600 10.5px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase;
           color: var(--hi); margin: 30px 0 10px; }
  /* ⚠️ PROSE IS SANS HERE, EVERYTHING ELSE STAYS MONO. This page is read rather
     than operated: a paragraph explaining why a control looks the way it does
     is not a value, a key or a line of code, and setting it in the same
     monospace as the things it describes makes the description compete with
     the sample. The controls, the snippets and every readout keep the mono
     face, because there the fixed width is carrying meaning. */
  .kit-n { font: 400 13.5px/1.65 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
           color: var(--dim); margin: 0 0 12px; max-width: 66ch; }
  .kit-n code { font-family: var(--mono); font-size: .92em; }
  .kit-n code { color: var(--fg); }
  /* 🔴 A SECTION IS ONE BLOCK OF THE PAGE, AND THAT IS NOT A TIDY-UP. `.pos-body`
     is a `.pos-stack` now, which puts the project's one gap between every pair
     of its children — and this page used to append a heading, a note, a snippet
     and a box to it as FOUR children, ninety-eight in all, so every title would
     have sat 40 px from the sentence under it. A heading and the thing it
     names are one pair; the stack has nothing to say about the inside of a
     block, which is exactly the escape demo/shell/stack.mjs names. */
  .kit-sec > .kit-h { margin-top: 0; }
  /* ⚠️ AND AIR ABOVE THE BOX, for the same reason and in the same breath. The
     snippet above it is mono at 11 px and the box's own border starts at its
     last line, so the code and the specimen read as one block when they are a
     description and the thing described. */
  .kit-box { border: 1px solid var(--line); border-radius: 4px; background: var(--card);
             padding: 14px; margin: 14px 0 0; display: flex; flex-wrap: wrap;
             gap: 10px; align-items: center; }
  /* 🔴 THE LAST CHILD GIVES UP ITS BOTTOM MARGIN, AND THE PADDING WAS NEVER THE
     PROBLEM. Reported 2026-09-21 with a crop of the `BUTTON GROUP` box as
     *"bottom pading same as top"*. MEASURED before changing anything: the
     padding was **already 14 px top and bottom on all 39 boxes**, and the ink
     sat 15 px from the top and **29** from the bottom, because the last child
     was a `.pos-controls` carrying its own `margin-bottom: 14px` which stacks
     on the padding. Moving the padding would have moved 14 px of a 29 px gap
     and been reported again, which is exactly what `/twelve/` was corrected by
     screenshot twelve times for: *"less h padding on strip"*, where the padding
     was already equal and a 146 px heading was leaving 50.2 px of air.
     🔴 AND IT IS `:not(.kit-out)` BECAUSE EIGHT BOXES DO THIS ON PURPOSE.
     `.kit-out` carries `margin-bottom: -14px`, deliberately cancelling the
     padding so a readout strip sits flush to the box's bottom edge, and it is
     the last child in eight of these. A blanket `:last-child { margin-bottom:
     0 }` would have read as a tidy-up and silently unstuck all eight. The
     survey is the only reason that is known: 11 of 39 boxes measured uneven,
     and only ONE of the eleven was the reported defect. */
  .kit-box > :last-child:not(.kit-out) { margin-bottom: 0; }
  /* The three blocks in the layout specimen, so a gap has something to be
     measured between. They are deliberately plain: what is being shown is the
     air, not the boxes. */
  /* 🔴 A SPECIMEN'S EDGE IS LIGHTER THAN A REAL BORDER, AND IT IS ITS OWN TOKEN.
     Asked 2026-09-17 with a screenshot: *"make border a bit lighter here"*. The
     shell's line colours are `--line` #1f2937 and `--line2` #2b3546, and the
     next thing up the scale is `--dim2` #6a7280, which is the caption's ink and
     far too strong for a dashed box that is not part of what is being shown.
     There is nothing between them, so this page names its own, once, here.
     ⚠️ IT IS NOT A SHELL TOKEN ON PURPOSE. Nothing outside this sandbox draws a
     dashed specimen edge, and putting it in shell.css would offer every page a
     colour with no meaning attached to it. */
  :root { --kit-edge: #3a465c; }
  /* A row of specimens INSIDE a titled group. `.kit-box` is the flex row that
     used to hold these directly; once a group has a heading the box holds the
     group and the row needs the layout the box was providing.
     ⚠️ MEASURED BEFORE THIS EXISTED: the class was used and never defined, so
     five badges laid out as inline text and ran together into one band with
     their dots touching the word before them. */
  .kit-row { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
  /* Three panels across, wrapping to one column where a panel gets the full
     width anyway. `min-width: 0` or they refuse to shrink below their content
     and drag the page sideways, which is the defect the tab row shipped. */
  .kit-vps { align-items: flex-start; }
  .kit-vp { flex: 1 1 240px; min-width: 0; }
  /* A row of drawn figures, wrapping. `min-width: 0` or a canvas refuses to
     shrink below its content and drags the page sideways, which is the defect
     the tab row shipped and is recorded three lines up. */
  .kit-figs { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start;
              width: 100%; }
  /* A step grid's two halves, which is the arrangement `step-grid.mjs` expects
     and which `/tom/` gets from `panel-layout.mjs`. It is written out here
     rather than borrowed, because what this block is showing is the GRID and a
     cased panel round it would be a second component in the picture.
     🔴 `min-width: 0` ON THE SCROLLER OR THE PAGE DRAGS SIDEWAYS. `overflow-x`
     cannot shrink a flex item below its content, and this repository has
     measured 141 px of page overflow from exactly that pair being half
     written. */
  /* 🔴 ROOM UNDER THE LAST ROW, ASKED FOR 2026-09-22 AS *"make stepgrid
     distance from glue line same as left padding"*, with a crop of the pads
     sitting on the seam.
     ⚠️ **THE WORDS COULD NOT BE TAKEN LITERALLY AND THE MEASUREMENT IS WHY.**
     MEASURED inside the glue at 900 px: left 1.0 px, right 1.0 px, bottom
     1.0 px. All three are the glue's own seam and there is no left padding to
     match, so what reads as a left inset is the LABEL COLUMN's own width, not
     a gap. The bottom had nothing playing that part, which is why only that
     edge looked wrong.
     ⚠️ AND IT IS BOTTOM ONLY, DELIBERATELY. A symmetric inset here would be
     the double padding `/pack/` was reported for on the same day, where a
     glued part painted its own box inside the glue's. */
  /* 🔴 THE RIGHT MATCHES THE BOTTOM SINCE 2026-09-22, ASKED FOR AS *"make sure
     right padding is same as bottom"* with a crop of the last pad nearly
     touching the right edge while there was clear room under it.
     ⚠️ **ONE NUMBER READ TWICE, NOT TWO THAT HAPPEN TO MATCH.** Right and bottom
     being equal is a claim that they are the same measurement, and `shell.css`
     has repaired exactly this twice, as `--sld-col` and as `--ctl-gap`.
     ⚠️ **AND IT IS ON `.kit-pg` RATHER THAN ON THE SCROLLER, WHICH IS THE TRAP
     WORTH NAMING.** `.kit-pg-strip` is the scroll container, and a scroll
     container's END padding is not reliably honoured once its content overflows:
     it can be declared, be correct in the computed style, and render as nothing
     at the far end. `.kit-pg` is the flex parent and is never the thing that
     scrolls, so its padding is real at every width. */
  .kit-pg { --kit-pg-inset: 10px;
            display: flex; align-items: flex-start; gap: 6px; width: 100%;
            padding-bottom: var(--kit-pg-inset); padding-right: var(--kit-pg-inset); }
  .kit-pg-strip { overflow-x: auto; min-width: 0; flex: 1 1 auto; }
  /* 🔴 THE SPECIMEN'S OWN FRAME COMES OFF WHERE A GLUE IS THE SPECIMEN, ASKED
     FOR 2026-09-22 AS *"rm wrapper and info footer"* with a screenshot of two
     nested rounded boxes.
     ⚠️ **THE REDUNDANT ONE IS THIS PAGE'S, NOT THE COMPONENT'S**, which is the
     half worth checking before deleting. `createGlue` draws one edge round the
     whole component and its children give up theirs, so a glue is ALREADY a
     bounded object; `.kit-pg` contributes no border at all. What was left was
     `.kit-box`'s frame round a thing that draws its own, which is a box around
     a box and an edge nobody wrote. */
  .kit-nobox { border: 0; border-radius: 0; background: none; padding: 0; }
  .kit-fig { flex: 1 1 200px; min-width: 0; }
  /* One column's worth of a figure and the word naming it, so a row of four can
     be read without a legend. The word is under the box rather than in it,
     because what is IN the box is the component's own honesty mark. */
  /* 🔴 AIR ABOVE THE NAME, ASKED FOR 2026-09-22 AS *"add more space on top of
     tese env 1, CC 73 75 70 72"*. The word sat directly on the canvas edge, so
     a row of four figures read as four boxes with their captions stuck to
     them rather than as four labelled figures. */
  .kit-fig-l { display: block; margin-top: 8px; font: 500 9.5px/1.6 var(--mono);
               letter-spacing: .1em; text-transform: uppercase; color: var(--dim2); }
  /* ⚠️ NOTHING HERE UNDOES A COMPONENT'S MARGIN ANY MORE, because no component
     has one. That was the first fix and it was the wrong one: a sandbox
     cancelling a side effect leaves the side effect everywhere else. The margins
     came off the components instead, and `.pos-stack` gives the gap. */
  /* A phone's width, on any screen. 320 px is narrower than an iPhone SE's 375
     and the commonest 390 and 412, so what overflows here overflows on all of
     them. The border says where the box ends, because a scroller whose edge is
     invisible reads as a row that has been cut off. */
  .kit-phone { width: 320px; max-width: 100%; border: 1px dashed var(--kit-edge);
               border-radius: 4px; padding: 8px; }
  .kit-blk { border: 1px dashed var(--kit-edge); border-radius: 4px; color: var(--dim2);
             font: 400 11px/1 var(--mono); text-align: center; padding: 18px 0; }
  /* The stand-in for a page that covers the screen with a bare canvas, which is
     the shape `/weight/` and `/floor/` have and the shape the report came from.
     ⚠️ NO `position` DECLARED HERE ON PURPOSE. `createFullscreenExit` gives a
     static host `position: relative` itself, and a specimen that did it first
     would be this page hiding the half of the component it is grading. */
  .kit-cover { width: 260px; height: 146px; background: var(--card2);
               border: 1px solid var(--line); border-radius: 4px;
               display: flex; align-items: center; justify-content: center; }
  .kit-cover-p { font: 400 11px/1 var(--mono); color: var(--dim2); }
  /* 🔴 THE DEFECT, KEPT ALIVE ON PURPOSE. `.kbd { margin: 0 0 10px }` in
     shell.css is what put a keyboard flush against a transport bar on `/keys/`:
     a `margin` shorthand's implied `margin-top: 0`, at (0,1,0), beating a
     rhythm rule that was (0,1,0) too. This class is that shorthand, in a page
     stylesheet, which is the worst case there is — it loads after shell.css, so
     source order is on its side and only specificity can beat it. The check at
     the bottom measures the gap above it. */
  .kit-tight { margin: 0 0 10px; }
  .kit-src { font: 400 11px/1.6 var(--mono); color: var(--dim2); white-space: pre-wrap;
             margin: 0 0 6px; padding-left: 2px; }
  /* ⚠️ GREY, NOT `--hi`. This is what the control beside it last reported, and
     it was yellow — the colour this project uses for the one thing on a page
     that matters. Beside eight sample controls that all report, yellow is
     eight highlights, which is none: the sandbox lit up like a page where
     everything is urgent. It is a value, and values are `--dim`.
     ⚠️ AND `align-self: center`, because `align-items: center` on the box
     centres each FLEX LINE's items and the button rows beside these carry
     their own height — so the readout sat low against the row it describes. */
  /* ⚠️ ITS OWN LINE, ALWAYS. Beside a control it reads as part of the control —
     `LOOK ‹ random › KALEIDOSCOPE` looks like a picker with a fourth segment,
     which is exactly what it is not: it is what the picker REPORTED. A readout
     sharing a row with the thing it reports on has to be told apart by colour
     alone, and colour is already carrying whether a control is armed.
     `flex: 1 1 100%` in a wrapping row is the whole mechanism. */
  /* 🔴 THE OUTPUT LINE IS THE BOX'S FOOTER, NOT A LINE FLOATING UNDER IT. Asked
     2026-09-17 with a photograph: *"space top of 'nothing pressed'. make this
     kit example box a component to get similar example component. make that
     bottom text have border on top of it like videpanel"*.
     It sat flush against the specimen above it with no air and no edge, so a
     readout and the control it describes read as one undifferentiated block.
     `video-panel.mjs` had already solved this exact shape: one box, a hairline,
     and the row that reports sitting under it. This is the same, so the two
     surfaces on the site that pair a thing with what it says about itself look
     the same.
     ⚠️ NEGATIVE MARGINS, because the box carries 14 px of padding and a footer
     has to reach its edges. The bottom corners are rounded to match, rather than
     clipping the box, which would cut anything a specimen deliberately overflows.
     ⚠️ THE TOP MARGIN IS 4 AND NOT 14: the box is a flex row with a 10 px gap,
     so the gap and the margin add to the 14 the padding uses everywhere else. */
  .kit-out { font: 500 12px/1.6 var(--mono); color: var(--dim); min-height: 1.6em;
             flex: 1 1 100%;
             margin: 4px -14px -14px; padding: 10px 14px;
             border-top: 1px solid var(--line); border-radius: 0 0 4px 4px; }
  /* A block holding a diagram is not a row of controls: the picture wants the
     whole width and the report under it wants the line below, so these two
     turn the flex row off rather than fighting it with `flex: 1 1 100%` on
     each child. Setting `display` matters — a flex property on a non-flex box
     is silence, and a flex CHILD of a `flex-wrap` row is sized by its content
     no matter what width it asks for. */
  .kit-wide { display: block; }
  /* Half of whatever the box gives it, for a specimen that does not need the
     full width. A fraction rather than a pixel count, so the layout keeps
     owning the width and this page has no second opinion about it to defend.
     ⚠️ THE MEDIA BLOCK SITS AFTER THE PLAIN RULE, never before it. A media
     query adds no specificity, so a later plain rule of the same weight wins at
     every width — which is how `.pos-pick`'s entire phone layout sat in
     shell.css for weeks and never once ran. Under 560 px half a box is narrower
     than the transport bar's own controls, so the specimen takes it all back. */
  .kit-half { max-width: 50%; }
  @media (max-width: 560px) { .kit-half { max-width: 100%; } }
  /* the phone case. A fixed width so the one-column layout can be seen on a
     desktop, `max-width` so it is never wider than a real phone. */
  .kit-phone { width: 320px; max-width: 100%; }
  .kit-cut { font: 400 11px/1.6 var(--mono); color: var(--dim); margin-top: 8px;
             white-space: pre-wrap; }
  .kit-cut b { color: var(--warn); font-weight: 500; }
  /* The stand-in for everything between a split readout and a split log, which
     on a real page is the whole demo. 🔴 IT IS A REAL `.pos-body` AND THIS
     RULE DECLARES NO MARGIN. The gap under a split readout and the gap over a
     split log are both the shell's, and one of them is `.pos-body`'s own
     `margin-bottom` rather than anything the log asks for — so a stand-in with
     a margin typed here would be this page inventing the number it then grades
     itself against. */
  .kit-mid { border: 1px dashed var(--kit-edge); border-radius: 4px; color: var(--dim2);
             font: 400 11px/1 var(--mono); text-align: center; padding: 26px 0; }
  /* ⚠️ AND NO RULE HERE RESETTING WHAT FOLLOWS A CAPTION. The split specimen
     below is measured, and its gaps are the shell's own 22 px: a `margin-top:
     0` typed here would make this page move the thing it is grading, which is
     the same mistake as a check that mutates. */
  /* 🔴 AND A GAP UNDERNEATH, BECAUSE THERE WAS NONE. REPORTED 2026-09-17 with a
     screenshot of a caption sitting on the dashed edge of the box it labels:
     *"what is this crap? ... you are breaking you own rules in this example you
     made for preventing"*, which is exactly right. MEASURED on the live page:
     all FOUR captions read a gap of 0.0 px to their specimen, so this was never
     one section. `line-height: 1` makes the caption's box tight to its letters,
     and the specimen below starts at its edge, so uppercase text at 9.5 px
     touches a border a pixel away. The caption belongs to the thing under it,
     so it owns both sides of its own air. */
  .kit-cap { font: 600 9.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase;
             color: var(--dim2); margin: 0 0 10px; }
  /* A caption belongs to the specimen UNDER it, so the air goes above the
     caption rather than below it. Nothing measured passes through this gap:
     the two numbers graded in the split block are readout-to-page and
     page-to-log, and no caption stands in either.
     🔴 AND THE 44 px THE SHELL PUTS ABOVE A JOINED SURFACE IS MOVED HERE, NOT
     SHRUNK. That gap is the distance from the PAGE to the surface at the foot
     of it, and there is no page inside a sandbox box: what sits directly above
     each specimen is its own caption, so leaving the margin on the box put
     44 px between a label and the thing it labels. Photographed: the word
     JOINED floating in the middle of the gap, reading as a heading for
     nothing. The caption takes the air and its specimen sits under it, so the
     pair is still one group with the shell's own 44 px above it. */
  .kit-box > * + .kit-cap { margin-top: 44px; }

  /* The PANEL specimen's fixed column and its row, which need a gap the shared
     component deliberately does not have: `.panel-fixed` and `.panel-row` carry
     no gap because what goes in them is an instrument's business, and every
     caller declares its own (`/evo/` uses 12 and 20). A sandbox is a caller
     like any other and says so rather than leaning on a default. */
  .kit-panelcol { gap: 10px; }
  .kit-panelrow { gap: 10px; }

  /* 🔴 `.kit-hwrow`, `.kit-hwitems` AND `.kit-hwstrips` WENT ON 2026-09-22 WITH
     THE CHANNEL STRIP THEY LAID OUT. They were four full width horizontal rows
     inside a wrapping flex box, which is the arrangement the report
     *"still not aligned to vertical separated lanes"* was about. `.kit-chans`
     and `.kit-chan` below replace them, and the scroller pair that
     `.kit-hwitems` carried moved to `.kit-chans` with it. */
  /* 🔴 THE FOUR SHAPES SIDE BY SIDE, ASKED FOR AS *"align channel strips
     horiztlly"*. They were four full width rows stacked, which is a picture of
     four separate demonstrations; a channel strip is the four TOGETHER, and
     nothing about that reads off a column of them.
     🔴 WRAPPING ALONE IS NOT ENOUGH AND THIS DRAGGED THE PAGE 65 px SIDEWAYS.
     Reported 2026-09-22 from a phone and then MEASURED at 390 px: `flex-wrap`
     wraps BETWEEN items, and **a single item wider than the container cannot
     wrap**. One strip's content is 424 px against a 358 px box, so it hung 65
     px off the right and took the whole document with it.
     ⚠️ **AND THE LINE THAT STOOD HERE WAS WRONG ABOUT THIS PROJECT.** It said a
     horizontal scroll is *"the thing shell.css already refuses everywhere
     else"*. It does not: `.pos-tbl-row` scrolls against its own minimum,
     `tabs.mjs` is an x-scrollable bar by design, and `step-grid.mjs` scrolls
     its strip. What `positron-ui` actually refuses is the PAGE dragging, and
     the repair for that is a scroller with `min-width: 0` beside it, because
     `overflow-x` cannot shrink a flex item below its content.
     ✅ SO IT WRAPS FIRST AND SCROLLS ONLY WHEN ONE ITEM CANNOT FIT. Four
     strips on a wide screen still sit side by side, which is what was asked
     for; on a phone they stack, and the one that is still too wide scrolls by
     itself instead of moving the page. */

  /* 🔴 REAL CHANNELS, 2026-09-22, AND THE REPORT SAID *"still"*: *"still not
     aligned to vertical separated lanes"*. What stood here was four independent
     HORIZONTAL rows, six knobs over eight pad columns over six faders, three
     pitches stacked, so a reader could not follow any channel down the picture.
     It was a catalogue of four components arranged vertically and captioned as
     a channel strip.

     🔴 **THE DIVIDER IS THE PANEL'S, WHICH IS WHAT *"(see panels)"* MEANT.**
     `.panel-fixed-l` is `border-right: 1px solid var(--line)` with
     `padding-right: var(--panel-gap)`, so a divider here and a divider on
     `/twelve/` are one line rather than two opinions. It goes on the lane
     rather than between lanes, so the last one loses it and nothing has to
     count children.

     🔴 **THE ALIGNMENT IS `--ctl-head` AND `--ctl-foot` AND NOT ARITHMETIC.**
     `positron-ui` is explicit that a row of different controls cannot be
     aligned by a caller, and `/twelve/` was corrected twelve times in one
     evening by people doing exactly that. There is no margin in this rule that
     lifts or drops a control.

     🔴 **A KNOB IS `--ctl-w * 1.1` WIDE SINCE TODAY AND A PAD IS `--ctl-w`, AND
     THAT IS THE THING THAT BITES IN A COLUMN.** `/circuit/` solves it by
     centring both in a pad sized track rather than by resizing either, which is
     what `align-items: center` does here. Resizing a control to make a column
     tidy is the page doing arithmetic about a component's insides. */
  .kit-chans { display: flex; align-items: stretch; min-width: 0; overflow-x: auto; }
  .kit-chan {
    display: flex; flex-direction: column; align-items: center;
    gap: var(--ctl-gap); flex: 0 0 auto;
    border-right: 1px solid var(--line);
    padding: 0 var(--panel-gap, 16px);
  }
  .kit-chan:last-child { border-right: 0; }
  /* The channel's own name, under the lane it names, in the panel's own ink. */
  .kit-chan-l {
    font: 500 9.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase;
    color: var(--dim2); padding-top: 2px;
  }
  /* The vertical twins, beside the horizontal ones they are meant to match. */
  .kit-vrow { display: flex; gap: var(--ctl-gap); align-items: flex-end; }

  /* A row of segment displays, each with its own caption above it. The caption
     goes ABOVE for `.kit-cap`'s own reason, which is that a caption belongs to
     the specimen under it, and the column's gap owns the air so no margin is
     typed here. */
  .kit-disp { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; }
  .kit-dispc { display: flex; flex-direction: column; gap: 8px; align-items: flex-start;
               min-width: 0; }
  .kit-dispc .kit-cap { margin: 0; }
  /* 🔴 TWO FIELDS IN ONE WINDOW, DRAWN BY THE PAGE. `segment.mjs` refuses to
     take a second field as an option and says why in its header; this is the
     other half of that decision, and it is four declarations. Both displays
     pass `frame: false`, so the pair has one edge rather than two inside a
     third.
     ⚠️ IT READS `--disp-back` OFF `:root`, which is exactly why that token is
     declared there and not on `.pos-disp`: this box is a SIBLING of both
     fields, and a custom property inherits downward and never sideways. */
  .kit-disp-window {
    display: inline-flex; align-items: flex-end; gap: 12px; padding: 7px 10px;
    background: var(--disp-back); border: 1px solid var(--line); border-radius: 3px;
  }
  .kit-swatch { display: inline-flex; align-items: baseline; gap: 7px; margin-right: 20px; }
  .kit-swatch-n { font: 600 12px/1.6 var(--mono); color: var(--fg); }
  .kit-swatch-w { font: 400 12px/1.6 var(--mono); color: var(--dim); }
  .kit-cap + .pos-report { margin-top: 0; }

  /* The three distances a stacked control keeps, drawn at the heights the
     stylesheet states rather than at heights this page chose: every band's
     `height` is `var(--ctl-*)`, set in the block that builds it. A figure typed
     here would be a second copy of a measurement.
     ⚠️ THE BANDS ARE TOLD APART BY INK RATHER THAN BY HUE, the same way the
     readout's states are: two reserved slots and one real gap, where the gap is
     the one that is not a slot. */
  .kit-step { display: flex; gap: 10px; align-items: flex-start; }
  .kit-step-c { width: 130px; }
  .kit-step-b { display: flex; align-items: center; padding-left: 8px;
                border: 1px dashed var(--kit-edge); border-bottom: 0;
                background: var(--card2); overflow: hidden; }
  /* the gap is the one band that is not a reserved slot, so it is the one band
     with nothing painted in it */

  /**

   * "nothing for this harness to verify": no `mount()`, no `window.__demo`, no
   * asserts. So the one page whose entire job is to make component drift
   * visible was the one page the suite could not look at, and everything
   * demonstrated here had to be measured some other way.
   *
   * ⚠️ AND IT MOUNTS THE SAME SHELL EVERY OTHER PAGE DOES, which is the second
   * half of the point. A sandbox for components that opts out of the frame
   * those components live in is a sandbox that can drift from the thing it
   * exists to police. The head, the back link and the log are the real ones.
   *

   * readout on this page is a SPECIMEN rather than this page's own instrument,

      + 'a board, a relay or a stream, and so that two pages using the same component '
      + 'cannot quietly drift into looking like two different ones. Each block shows '
      + 'how it is made.',

  /**

   * into tabs. recommend. my ideas: input layout hardware diagram"*. Thirty

   * two things it is read for are *what do I have for X* and *what arrived

   * and a presence badge only LOOK like equipment while what they do is answer
   * a question about a machine, which is what a readout does. That is true of a
   * badge and it is not what these two are: a channel strip and a seven segment
   * field are **parts of a picture of an object**, where a table and a log are
   * parts of a web page. So the part answers *what do I have for drawing an
   * instrument*, which is a real question three pages here have each answered
   * alone. A presence badge stayed in `status`, because a badge is a sentence
   * about whether something is answering and it sits in a transport bar, not on
   * a panel.

   * ⚠️ `timeline` IS THE PART THE FOUR PROPOSED NAMES HAD NO ROOM FOR: a
   * transport bar, a strip, the two glued together and the panel they are glued
   * to are the biggest pieces in this kit and they are all about watching
   * something happen. Folding them into `layout` would make `layout` mean
   * *everything left over*. It is the front page's own word for the same
   * family, so a reader meets one name in both places rather than two.
   *
   * ⚠️ `status` RATHER THAN `readout`, ASKED FOR AS *"readout -> status"*. A
   * part called READOUT held a block called READOUT AND LOG, so one word meant

   * surfaces, and one component inside it.
   *
   * 🔴 THERE WAS A SEVENTH PART CALLED `basics` AND IT LASTED AN HOUR. DO NOT
   * RE-PROPOSE IT. Asked for as *"move color to basics (last tab)"* and then

   * an argument about tabs rather than about colour. `COLOURS` really is the
   * weakest placement on this page: every other part answers *what do I have
   * for X*, and nobody goes looking for a colour the way they go looking for a
   * slider, so in `layout` it reads as the block that part could not find a
   * home for. But a part holding ONE block is worse than a block sitting in the
   * wrong part, because a tab is a promise that there is something behind it.
   * Three candidates were considered for joining it and all three stayed put:
   * `STACK` is the vertical rhythm and is material by the same argument, but it
   * is `createStack` with a constructor a page calls and it is the whole of
   * `layout`'s answer to *how is a page arranged*; `CONTROL ROW` is the three
   * states every button obeys rather than a component, and a reader looking for

   *

    ['hardware', 'HARDWARE'],

   * worked; a tab row makes that worse rather than better, because the block a
   * reader wants to point somebody at is now behind a press. Every section gets
   * an id off its title, and a hash naming one opens the part holding it and
   * scrolls to it.
   * ⚠️ THE TABS OWN THE ADDRESS AFTERWARDS. `createTabs` writes the part's id
   * over the hash on its first `go`, so the section hash is put BACK once the
   * scroll has happened and survives until the reader presses a tab, which is
   * the moment it stops being true.
   */
  const idFor = (title) => title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const sectionTab = new Map();       // section id -> the part holding it
  const wanted = decodeURIComponent((location.hash || '').replace(/^#/, ''));

  const kitTabs = createTabs({ tabs: GROUPS.map(([id, label]) => ({ id, label })) });
  kitTabs.el.classList.add('kit-tabs');

  /**
   * 🔴 EVERY PANEL IS A STACK, OR THE PAGE LOSES ITS OWN RHYTHM THE MOMENT THE
   * BLOCKS MOVE INSIDE ONE. `.pos-body` is a stack and gave every pair of

   * child of `.pos-body` any more, and `.pos-tabs-p > * + *` would have handed
   * it 22 px instead. Nothing would have failed and the whole page would have
   * quietly tightened. Asserted at the bottom against `--pos-gap` rather than
   * against a number typed here.
   */

   * That breaks this page in TWO different ways and only one of them is about

   *

   * FOUND BY RUNNING THIS. `createDiagram` measures its own text at BUILD time

   * inside a closed panel came out laid out for **320 px inside a 658 px
   * panel**, reporting `type ESTIMATED`. That is not a harness artefact: a
   * reader pressing DIAGRAM would have found seven pictures drawn for a page a
   * third of the width, and the only thing that noticed was one assert that
   * happens to report how the width was arrived at. **A component that measures
   * itself when it is made cannot be made inside a closed tab.**
   *
   * 🔴 THE ONE THAT IS ABOUT THE CHECKS IS THAT TWO ZEROS COMPARE EQUAL, SO A
   * CHECK THAT MEASURES ONE PASSES WHILE MEASURING NOTHING. About forty of the
   * checks below read real geometry — a badge the same width in five states,
   * two greys told apart by ink, six display fields at 55.63 px with a spread

   * were. That is the failure this project has recorded four times, and the
   * cure is the same one: make the instrument able to see, then break it and

   * HARDER OF THE TWO CHOICES. A window only the harness opened would leave a
   * visitor's run measuring zeros in silence and a visitor's diagrams drawn at
   * 320 px, and a page that measures one thing for a harness and another for a
   * person is a page nothing grades. What makes it safe for somebody reading
   * the page instead is that **the window holds no `await`**: JavaScript here
   * is single threaded, so no frame can be rendered between `measure()` and
   * `settle()` and there is nothing to see. The three places that do have to
   * wait for something — the first paint, a toggle reaching its playing state,
   * and three headset probes that are promises — settle the window first and
   * open it again after.

   * ⚠️ THE COUNTER IS THE HALF THAT MAKES THAT A MEASUREMENT RATHER THAN A
   * CLAIM ABOUT THIS FILE. A `requestAnimationFrame` callback runs immediately
   * before a frame is rendered, so a callback that finds the window open is a
   * frame about to show every part at once. It can only happen if somebody adds
   * an `await` inside the window, which is exactly the edit that would put the
   * flash back, and no reading of the source can see one.

  let measuring = false, paintedOpen = 0, watching = true;

    // the attribute beside it is not: `[data-kit-new]` matches on PRESENCE.
    document.body.classList.remove('kit-measuring');

    // gap between every pair of its children — so a title would have stood

  // build read it in its dead zone, `section()` swallowed the throw into
  // `failed`, and the page died much later on an empty map. A block that moves

  // ⚠️ DECLARED HERE, NOT INSIDE THE BLOCKS. A block that moved on this page

  // `section()` swallowed the throw into `failed`, and the page died much
  // later with a message about a different line.

  let handSpec = null;

  // ordinary actions, and one pair driven by what this browser actually says
  // about a headset. ⚠️ DECLARED UP HERE WITH THE OTHERS, for the reason those
  // lines give: this is the newest block and therefore the topmost one, and a
  // `let` left where a block used to be is read in its dead zone.
  let bgSpec = null, bgRow = null, xrSpec = null;
  // The choice specimen, kept so the button group can be measured AGAINST it
  // rather than against a number typed into a check. The claim being graded is

   * so *both axes labelled* could not be shown by passing options that existed.

   * under every one of 64 steps is this project's wrapping table heading in a
   * new costume, and `positron-ui` is explicit that a heading which does not fit

   * pressed`, belongs to the standing choice specimen and reads `standSpec`.
   * The three callbacks are gone with the line rather than left writing to a
   * detached node.
   */
  section('hardware', 'STEP GRID',
    'Rows of square pads over a ruler, with the standard transport glued above them '
    + 'and a second grid carrying no labels on either axis.',
    `const grid = createStepGrid({
  fixed, strip, rows: 6, steps: 16,
  label: (r) => String(r),                // omit fixed and there is no column
  ticks: true,                            // numbers the BEATS, never the steps
  silent: (r) => r === 4,                 // lit but grey: it can make no sound
  rate: { bpm: 120, whose: 'this page' }, // no whose, no clock, and it throws
})
createTransportBar(host, deck, { publish: false, scrub: false, loop: false,
  command: { play: () => grid.clock.play(), pause: () => grid.clock.stop() } })
createGlue(host, grid.el)                 // the bar over the thing it drives`,
    (box) => {
      const wrap = el('div', 'kit-pg');
      const fixed = el('div');
      const strip = el('div', 'kit-pg-strip');
      wrap.append(fixed, strip);

      const STEPS = 16;
      const edit = createStepGrid({
        fixed, strip, rows: 6, steps: STEPS,
        label: (r) => String(r),
        /* 🔴 BOTH AXES. The rows are named by `label` and the steps by `ticks`,
           which puts a beat number under every fourth one and nothing between
           them. `corner` is the cell above the label column and now has a word
           in it, because the ruler beside it carries text at last. */
        ticks: true,
        corner: 'beat',
        title: (r) => (r === 4
          ? 'this row has nothing behind it, so its steps are silent'
          : `row ${r}, press to hear it`),
        // Rows 0 to 3 and 5 can be heard, row 4 cannot, so a lit pad on it
        // stays grey. Brightness says WHETHER THIS CAN MAKE A SOUND, which is
        // the one thing a reader cannot see any other way.
        canPress: (r) => r !== 4,
        silent: (r) => r === 4,
        onLabel: (r) => { edit.lit(r); },
        onSeek: (s) => { edit.at(s); },
        /**
         * 🔴 THE TEMPO IS NAMED IN WORDS, AND THE COMPONENT WILL NOT PLAY
         * WITHOUT IT. Nothing about a grid of pads carries a rate, so a play
         * button is a page claiming one. This page's claim is that the number
         * is its own and nobody else's.
         */
        rate: { bpm: 120, whose: 'this page, which invented it' },
      });
      for (const [r, s] of [[0, 0], [0, 4], [0, 8], [0, 12], [1, 2], [1, 10],
        [2, 6], [4, 3], [4, 11], [5, 15]]) edit.set(r, s, true, 'quiet');

      /**
       * 🔴 THE DECK IS A FOLLOWER AND THE GRID OWNS THE CLOCK, which is the
       * arrangement `/pack/` and `/crate/` both use. The component's clock is
       * the only thing that knows the step length, so a deck running free
       * beside it would be a second reading of one tempo, and the two would
       * disagree the moment either was touched.
       * ⚠️ `publish: false`, BECAUSE THIS PAGE HAS THREE BARS. `__demo.transport`
       * may name only one, and the two blocks further down this file are what
       * the transport checks are written against.
       * ⚠️ `scrub: false` AND `loop: false`: the grid's own ruler already seeks
       * on a press, and one position surface per component is the rule.
       * ⚠️ AND THE CLOCK NEVER PRINTS A TIME. `fmt` takes the whole line, so
       * there is no `0:00.000` and no total: the deck's unit here is one step
       * and the readout says so in the same words the picture does.
       */
      const barHost = el('div', 'kit-pg-bar');
      const deck = createDeck({ items: [], adapters: {}, range: [0, STEPS] });
      const bar = createTransportBar(barHost, deck, {
        publish: false, scrub: false, loop: false,
        fmt: (pos) => `step ${Math.min(STEPS, Math.floor(pos) + 1)} of ${STEPS}`,
        command: {
          play: () => edit.clock.play(),
          pause: () => edit.clock.stop(),
        },
      });
      /* The head follows the grid rather than the deck's own clock, so the
         number in the bar and the lit column cannot come apart. */
      edit.clock.onStep((i) => deck.seek(i));

      /* 🔴 NO LABELS ON EITHER AXIS, WHICH IS THE NEGATIVE CONTROL. No `fixed`
         means no label column is built at all, and `ticks` left off means the
         ruler is what it has always been. It is a smaller grid because what is
         being shown is an absence rather than a sequence. */
      const bareWrap = el('div', 'kit-pg');
      const bareStrip = el('div', 'kit-pg-strip');
      bareWrap.append(bareStrip);
      const bare = createStepGrid({
        strip: bareStrip, rows: 3, steps: STEPS,
        padTitle: (r, s) => `row ${r}, step ${s + 1}`,
      });
      for (const [r, s] of [[0, 0], [0, 6], [1, 3], [2, 9], [2, 14]]) {
        bare.set(r, s, true, 'quiet');
      }

      /* ⚠️ `bar` AND `deck` ARE HELD SO THE BLOCK KEEPS THEM ALIVE, and neither
         is read by an assert: what is graded about the transport here is the
         GLUE, through `barHost` and `wrap`. Saying so beats a reader wondering
         which check reads them. */
      gridSpec = { edit, bare, bar, deck, barHost, wrap, bareWrap };
      box.classList.add('kit-wide', 'kit-nobox');
      box.append(createGlue(barHost, wrap),
        el('p', 'kit-cap', 'no labels on either axis'), bareWrap);
    });

   * of 2026-09-22, asked for as *"evelope editor / display (can start with
   * noninteracive)"*.
   *
   * 🔴 **NON-INTERACTIVE IS WHAT THE HARDWARE PERMITS FOR TWO OF THE THREE, NOT
   * A FIRST VERSION.** MEASURED out of `circuit-cc.mjs` and
   * `circuit-patch.mjs`: Envelope 1 is on five controller numbers, so the four
   * sliders here are honest. Envelopes 2 and 3 are in the patch format and on
   * NO controller number at all, so a control for either would name something
   * it cannot do, which is the defect that cost `/twelve/` four buttons.
   *
   * 🔴 **THE SHAPE IS EXACT AND THE TIME AXIS IS NOT, AND THE PICTURE SAYS SO
   * ON ITS OWN FACE.** Attack is `0 to 127` with no published mapping to
   * seconds, so the stage widths follow the settings and the figure paints
   * `proportions, not seconds` into its own canvas rather than into a caption
   * beside it, so the warning travels with the picture into any page that puts
   * it somewhere.
   * ⚠️ **THE FOURTH FIGURE HAS NO LENGTHS AT ALL**, which is a real setting and
   * is also the divide by zero this component had to be written around.
   */
  section('hardware', 'ENVELOPE',
    'The four stages drawn from their own settings, with the one envelope a '
    + 'controller number can reach wired to four sliders and the two it cannot '
    + 'standing still beside it.',
    `createEnvelopeView({ label: 'env 1', attack: 2, decay: 90, sustain: 127, release: 40 })
env.set({ attack: v })      // redraws, and nothing here sends anything`,
    (box) => {
      const o = out('env 1 as the patch format opens it');
      const figs = el('div', 'kit-figs');
      const fig = (title, view) => {
        const cell = el('div', 'kit-fig');
        cell.append(view.el, el('span', 'kit-fig-l', title));
        figs.append(cell);
        return view;
      };
      // The numbers are the patch format's own defaults, read off the address
      // table in `circuit-patch.mjs` rather than invented for a picture.
      const one = fig('env 1, CC 73 75 70 72',
        createEnvelopeView({ label: 'env 1', attack: 2, decay: 90, sustain: 127, release: 40 }));
      const two = fig('env 2, patch only',
        createEnvelopeView({ label: 'env 2', attack: 2, decay: 75, sustain: 35, release: 45 }));
      const three = fig('env 3, patch only, has a delay',
        createEnvelopeView({ label: 'env 3', delay: 48, attack: 10, decay: 70,
          sustain: 64, release: 40 }));
      const flat = fig('every length at zero',
        createEnvelopeView({ label: 'env 1', attack: 0, decay: 0, sustain: 96, release: 0 }));
      envSpec = { one, two, three, flat };

      // ⚠️ THE SECONDARY LABEL IS THE CONTROLLER NUMBER, which is exactly what
      // `slider.mjs` says that slot is for: the primary names what the control
      // moves and the secondary names what it is on the wire. Here it is also
      // the evidence that this envelope is the reachable one.
      const mk = (label, cc, key, value) => createSlider({
        label, sub: `CC ${cc}`, min: 0, max: 127, step: 1, value,
        onInput: (v) => {
          one.set({ [key]: v });
          o.textContent = `env 1 ${label} ${v}, and nothing was sent anywhere`;
        },
      });
      const drive = createSliderGroup([
        mk('attack', 73, 'attack', 2),
        mk('decay', 75, 'decay', 90),
        mk('sustain', 70, 'sustain', 127),
        mk('release', 72, 'release', 40),
      ], { pair: true });
      box.append(figs, drive.el, o);
    });

  /**
   * 🔴 NEWEST AT THE TOP, AND THE HEADING IS UPPERCASE. A filter figure, as of
   * 2026-09-22, asked for as *"filter editor / display (can start with
   * nonimteractive)"*.
   *
   * 🔴 **THIS ONE CAN BE DRIVEN AND IT STILL DRAWS A SCHEMATIC, AND THOSE ARE
   * TWO DIFFERENT FACTS.** The filter IS reachable over control change, type on
   * CC 68 across six values, frequency on 74 and resonance on 71, so a control
   * that moves it is honest. What is NOT honest is the curve: Novation publish
   * no response measurements for this instrument and nothing in this repository
   * has taken one. So the corner is where the parameter says, the slope is what
   * the type's NAME says, and the peak follows the resonance, and every one of
   * those is a statement about a textbook model.
   * ⚠️ **THE WORD IS PAINTED INTO THE CANVAS RATHER THAN WRITTEN BESIDE IT.** A
   * caption in this page's prose would not travel with the picture, and a curve
   * that looks like a measurement and is not is exactly the confident wrong
   * picture this project keeps paying for. There is no hertz on the x axis and
   * no decibel figure on the y for the same reason: the only scale anybody here
   * has for a cutoff is `0 to 127`, which is a parameter rather than a
   * frequency.
   * ⚠️ **AND THE THIRD FIGURE IS A NAME THE COMPONENT CANNOT READ**, which it
   * refuses in words instead of drawing the default low pass under somebody
   * else's label.

  section('hardware', 'FILTER RESPONSE',
    'A drawn response with the corner where the cutoff says and the slope the type '
    + 'name claims, marked as a schematic on its own face because nothing here has '
    + 'measured a real one.',
    `createFilterView({ type: 'low pass 24dB', freq: 78, resonance: 40 })
filt.set({ freq: v })     // the type name is read, and a name it cannot read is refused`,
    (box) => {
      const o = out('low pass 24dB, cutoff 78 of 127');
      const figs = el('div', 'kit-figs');
      const fig = (title, view) => {
        const cell = el('div', 'kit-fig');
        cell.append(view.el, el('span', 'kit-fig-l', title));
        figs.append(cell);
        return view;
      };
      const live = fig('driven below',
        createFilterView({ label: 'filter', type: 'low pass 24dB', freq: 78, resonance: 40 }));
      const deep = fig('band pass 12/12 dB, resonant',
        createFilterView({ label: 'filter', type: 'band pass 12/12 dB', freq: 64, resonance: 118 }));
      // 🔴 THE REFUSAL, WHICH IS THE HALF NOBODY TESTS. A name the component
      // cannot read has an unknown slope and an unknown direction, and drawing
      // the default under it would be an invention wearing an instrument's
      // label. `filterShapeFor` answers null and the picture says so.
      const refused = fig('a name it cannot read',
        createFilterView({ label: 'filter', type: 'comb 9dB', freq: 64, resonance: 0 }));
      filtSpec = { live, deep, refused };

      // ⚠️ `onPick` HANDS BACK AN INDEX, NOT A NAME, which is what the dropdown
      // knows about itself. `show` takes the name AND the index, so the drawn
      // cell and the native list underneath it cannot drift apart.
      let at = 1;
      const go = (i) => {
        at = ((i % FILTER_TYPES.length) + FILTER_TYPES.length) % FILTER_TYPES.length;
        const name = FILTER_TYPES[at];
        type.show(name, at);
        live.set({ type: name });
        const s = filterShapeFor(name);
        o.textContent = s
          ? `${name}, read as ${s.poles} pole ${s.kind}`
          : `${name}, and the name does not say which filter it is`;
      };
      const type = createPicker({
        label: 'type', what: 'filter type',
        prev: () => go(at - 1), next: () => go(at + 1),
        onPick: (i) => go(i),
      });
      type.options(FILTER_TYPES, at);
      go(at);

      /**
       * 🔴 THE CONTROLS ARE ONE GRID SINCE 2026-09-22, ASKED FOR AS *"put all
       * to controls grid"* after a screenshot of a type stepper on its own line
       * with two labelled sliders under it, all three placed by hand.
       *
       * 🔴 **AND THE TWO SLIDERS BECAME KNOBS, WHICH IS A CHANGE TO THE BLOCK
       * AND NOT ONLY A TIDY UP. MEASURED, BECAUSE THE OBVIOUS READING OF THE
       * ASK WOULD HAVE SHIPPED A DEFECT.** `createControlGrid` writes
       * `gridAutoRows` at the same pitch as its columns, which is
       * `max(cellW, cellH) + gap`: the whole component is the claim that two
       * working surfaces sit on a SQUARE lattice. A horizontal slider is about
       * 300 px wide and 40 tall, so a square cell for one is **300 px tall for
       * a 40 px control**, and three of them would have been a row of empty
       * case seven times the height of what is in it. That is the exact
       * condition `panel-layout.mjs`'s own `check()` exists to report.
       * ✅ **SO THE LATTICE IS RIGHT AND THE CONTROL WAS WRONG.** Cutoff is
       * CC 74 and resonance is CC 71, which are KNOBS on this instrument and on
       * every other one, and a knob is taller than it is wide, which is the
       * shape a square lattice is a claim about.
       *
       * 🔴 **AND THE TYPE PICKER IS REFUSED FROM THE GRID, ON THE SAME
       * MEASUREMENT, WHICH IS HALF OF WHAT WAS ASKED FOR.** All three were put
       * in first and the page reported it: the picker is about 272 px wide, so
       * the square lattice came out at a **282 px pitch holding a 96 px
       * control, 34 per cent filled**, and both knobs sat in the middle of a
       * box nearly three times their height. A picker is a wide horizontal
       * object exactly as a slider is, and a square lattice is a claim about
       * controls that are TALLER than they are wide.
       * ⚠️ **SO IT SITS ABOVE THE GRID RATHER THAN IN IT.** That is also what a
       * real panel does: a type or a patch selector is a display with two
       * buttons, and it is not on the knob lattice on any instrument on this
       * desk. `positron-ui`'s other half is that if the thing you need is not
       * in the kit, stop and ask, and the thing that is not in the kit here is
       * a grid cell that may span a row.
       * ⚠️ **THE EMPTY CASE IS ASSERTED BOTH WAYS BELOW**, so the day somebody
       * puts a wide control back in, the page says so rather than looking
       * slightly odd.
       */
      const cutoff = createKnob({
        label: 'CUTOFF', sub: 'CC 74', min: 0, max: 127, value: 78,
        onInput: (v) => { live.set({ freq: v }); o.textContent = `cutoff ${v} of 127`; },
      });
      const reso = createKnob({
        label: 'RESONANCE', sub: 'CC 71', min: 0, max: 127, value: 40,
        onInput: (v) => { live.set({ resonance: v }); o.textContent = `resonance ${v} of 127`; },
      });
      const drive = createControlGrid({ cols: 2, gap: 10, items: [cutoff, reso] });
      filtSpec.drive = drive;
      filtSpec.knobs = [cutoff, reso];
      filtSpec.type = type;
      box.append(figs, type.el, drive.el, o);
    });

  /**
   * 🔴 NEWEST AT THE TOP, AND THE HEADING IS UPPERCASE. A waveform figure, as
   * of 2026-09-22, and it is HALF of what was asked for under *"waveform
   * display"*. The other half is drawing a recorded buffer, which is
   * `wave-view.mjs` and `grain-scope.mjs` and already exists on four pages. A
   * second one of those is what this block is not.
   *
   * 🔴 **IT DRAWS 4 OF THE 30 AND REFUSES 26 IN WORDS, AND THE REFUSAL IS THE
   * REASON IT IS WORTH HAVING.** A name is mapped to a shape only when the name
   * IS the shape's name. Sixteen of the Circuit's thirty oscillator waves are
   * WAVETABLES, which have no single shape by definition, and nine more are
   * `saw 9:1 PW` blends whose ratios nothing here has measured, and one is a
   * `pulse width` with no width. An invented squiggle under a real
   * instrument's parameter name is the failure this component exists not to be.
   * ⚠️ **AND THAT IS STILL BETTER THAN WHAT THOSE PAGES HAVE**, which is a
   * slider reading `17`.
   * ⚠️ **THE PICKER WALKS ALL THIRTY**, which is the demonstration: press
   * through the table and watch the same component draw four of them and name
   * its reason for the rest. A block showing only the four it can draw would
   * have hidden the whole point.
   * 🔴 **SIXTEEN, AND THE REQUEST THIS WAS BUILT FROM SAID FOURTEEN.** MEASURED
   * 2026-09-22: `FIRST_WAVETABLE` is 14, which is the count of PLAIN waveforms,
   * and `OSC_WAVES.slice(14)` is 16 rows long. Two halves of one split written
   * down the wrong way round. The conclusion does not move.
   */
  section('hardware', 'WAVEFORM',
    'One cycle shape drawn from its own definition, and a name that does not name a '
    + 'shape refused in words rather than drawn as a plausible squiggle.',
    `createWaveShape({ name: 'sawtooth' })              // drawn
createWaveShape({ name: 'digital nasty 1',          // refused, and it says why
                  reason: 'a wavetable has no one shape' })
createWaveShape({ shape: 'pulse', duty: 0.2 })      // a width has to be handed over`,
    (box) => {
      const drawnNames = OSC_WAVES.filter((n) => shapeFor(n));
      const o = out(`${drawnNames.length} of ${OSC_WAVES.length} have a shape here`);
      const figs = el('div', 'kit-figs');
      const fig = (title, view) => {
        const cell = el('div', 'kit-fig');
        cell.append(view.el, el('span', 'kit-fig-l', title));
        figs.append(cell);
        return view;
      };
      // ⚠️ `drawnViews`, NOT `drawn`. This page already has a module level
      // `const drawn` holding what each diagram reported, and a second one in
      // here would shadow it inside this block only, which is the kind of
      // half-collision that reads as correct until somebody moves a line.
      const drawnViews = drawnNames.map((n) =>
        fig(n, createWaveShape({ name: n, height: 76 })));
      // A pulse is a family rather than a shape, so its width is handed over by
      // hand. `shapeFor` never returns one, on purpose.
      const pulse = fig('pulse at a fifth, given by hand',
        createWaveShape({ shape: 'pulse', duty: 0.2, name: 'pulse 20%', height: 76 }));
      /* 🔴 THE REASON IS SHORTER SINCE 2026-09-22 BECAUSE THE OLD ONE WAS BEING
         CUT. It read `a blend, and its ratio is not published` and rendered as
         `is not publ…` in this block's narrow cards. `positron-ui` is explicit
         that anything truncating with an ellipsis is in the WRONG PLACE, and
         that the ellipsis is the signal rather than a styling problem to widen
         your way out of. The words that carry the fact are `ratio not
         published`; the rest was a sentence built round them. */
      const blend = fig('a blend, refused',
        createWaveShape({ name: 'saw 5:5 PW', height: 76,
          reason: 'its ratio is not published' }));
      /**
       * 🔴 TWO TRACES IN ONE PICTURE, 2026-09-22, ASKED FOR AS *"can you have
       * wave / osilocope visualizer to top of muta. plai and warp with
       * different colors"*. A page that puts an oscillator's output and an
       * effect's output in two boxes side by side asks a reader to hold one in
       * their head while looking at the other.
       * 🔴 **AND THE SECOND SPECIMEN IS THE ONE THAT MATTERS, BECAUSE IT IS
       * MEASURED RATHER THAN DERIVED.** `points` outranks a name, and it has
       * to, or this option would be useless to the page that asked for it:
       * `/muta/`'s two signals are a Plaits engine and a wave folder, and
       * neither is a sine, a triangle, a sawtooth or a square. A caller with
       * SAMPLES is not guessing, which is the only thing the refusal is about.
       */
      const two = fig('two named shapes, two colours',
        createWaveShape({ name: 'sawtooth', height: 76, colour: '--dim',
          over: { name: 'sine', colour: '--hi' } }));
      /* Samples rather than names, under a name that has no shape at all. The
         curve is a fold of a saw, which is what a wave folder does to one. */
      const N = 256;
      const folded = Array.from({ length: N }, (_, i) => {
        const p = (i / (N - 1)) * 2;
        const saw = 2 * (p % 1) - 1;
        return Math.sin(saw * Math.PI * 1.5);
      });
      const raw = Array.from({ length: N }, (_, i) => 2 * (((i / (N - 1)) * 2) % 1) - 1);
      const measured = fig('measured samples, where a name would be refused',
        createWaveShape({ name: 'plaits engine', height: 76, points: raw, colour: '--dim',
          over: { name: 'folded', points: folded, colour: '--hi' } }));
      /* 🔴 THE WALK AND THE WAVETABLE FIGURE BOTH LEFT ON 2026-09-22, asked
         for as *"rm this exampoel a wavetable, refused"* and *"rm osc 1 wave
         example"*. The walk was a picker over all thirty waves with a figure
         following it, and its argument was that pressing through the table is
         how a reader sees four drawn and twenty six named.
         🔴 SO SAY WHAT STOPPED BEING GRADED. Two asserts went with them: that
         the walk draws exactly the four `shapeFor` answers and refuses the
         other twenty six while walking the whole table, and that a wavetable
         and a blend are refused for DIFFERENT stated reasons. **The counts
         survive** in `synth-view-test.mjs`, which asserts `shapeFor` over all
         thirty with no browser. **What is gone is the demonstration that one
         component handles both answers as a reader steps through them**, and
         the blend figure is the only refusal left on the page. */
      waveSpec = { drawnViews, pulse, blend, two, measured, drawnNames };
      box.append(figs, o);
    });

  section('input', 'DROP TARGET',

  section('hardware', 'PANEL',
    'A fixed column that does not scroll beside a strip of controls that does, in '
    + 'a case, with the instrument’s name printed on it. The column drives the depth '
    + 'and one child of the strip absorbs whatever is left, which the second panel '
    + 'here shows by leaving that one class off. A dashed block stands in for the '
    + 'control that grows, so what these two show is the mechanism rather than an '
    + 'instrument: the real case is a keyboard, where a key is fifteen times a '
    + 'keypad button on the object and only 1.6 times one here, and that is on '
    + '/evo/.',
    `const p = createPanelLayout({ side: 'left' })   // cased, column on the left
p.fixed.append(knob.el, pad.el, fader.el)        // what stays put
p.flow.append(row, block)                        // what scrolls
p.grow(block)                                    // this child absorbs the slack
p.check()                                        // -> { slack, growing, cuts }
createNameplate({ lines: ['POSITRON', 'PANEL-1'], place: 'mid' })`,
    (box) => {
      box.classList.add('kit-wide');

      /**
       * One panel, built twice: identical apart from whether anything absorbs
       * the slack. A specimen built from a shared function rather than typed
       * twice is the only version where the two can be COMPARED, which is what
       * the second one is for.
       * ⚠️ THE CONTROLS ARE REAL ONES FROM THIS PAGE'S OWN KIT. A knob, a pad
       * and a fader stacked make the column the taller child by a wide margin,
       * which is the condition the whole component exists to handle, and a
       * stand-in box of the right height would be the specimen arranging for
       * its own demonstration to succeed.
       */
      const build = (absorb) => {
        const p = createPanelLayout({
          side: 'left', cls: { fixed: 'kit-panelcol' },
          strip: { tabindex: 0, role: 'group', label: 'the panel’s strip, side scrolling' },
        });
        p.fixed.append(
          createKnob({ label: 'M1', sub: 'CC 80', min: 0, max: 127, value: 40 }).el,
          createPad({ half: true, label: 'TAP' }).el,
          createFader({ label: 'CH1', min: 0, max: 127, value: 30 }).el,
        );
        /* 🔴 SIXTEEN PADS, AND THE COUNT IS THE POINT RATHER THAN DECORATION.
           The first build of this specimen used four, and the check *there is
           something to scroll behind the border* went RED at `0 px to scroll`:
           the row fitted the page column, so `overflow-x: auto` was a
           declaration about nothing and the panel was demonstrating its
           arrangement without demonstrating the one thing that arrangement is
           for. A strip that does not overflow is not a strip. */
        const row = el('div', 'panel-row kit-panelrow');
        row.append(createPadGrid({
          cols: 16, pad: (x) => ({ top: String(x + 1) }),
        }).el);
        /* 🔴 A NAMEPLATE STOOD IN THIS ROW UNTIL 2026-09-22, ASKED OFF AS *"no
           nameplate exaple"*. It demonstrated the `mid` placement, which is
           what a plate inside a SCROLLING flow needs, and that is the one
           thing no longer shown anywhere. The plate itself is demonstrated on
           the INSTRUMENT block at the top of this file, at `ends`, which is
           the placement a cased instrument uses. `panel-layout.mjs` still
           documents all three. */
        const blk = el('div', 'kit-blk', absorb
          ? 'this block carries .panel-grow' : 'this block carries nothing');
        p.flow.append(row, blk);
        // 🔴 THE ONE LINE THAT DIFFERS, AND IT IS AN ARGUMENT RATHER THAN A
        // CLASS TYPED ON A PAGE. That is the whole reason `grow` exists: a
        // required line a caller types is a line no browser check can see when
        // it is MISSING, which is the `/blocks/` shape that shipped a headset
        // page with no way out of it.
        if (absorb) { p.grow(blk); panelGrowBlk = blk; }
        box.append(p.el);
        return { panel: p, blk, row };
      };

      box.append(el('p', 'kit-cap', 'with an absorber'));
      panelWith = build(true);
      box.append(el('p', 'kit-cap', 'no absorber, which is the negative control'));
      panelWithout = build(false);

      /* 🔴 A THIRD SPECIMEN, A CARD IN A 320 px HOLDER, STOOD HERE UNTIL
         2026-09-22 AND WAS ASKED OFF IN THOSE WORDS. **It was the only check
         in this repository that entered a media query.** `demo/verify.mjs`
         runs at 756 px with no viewport override, so every assert on all
         three panel pages passes without ever meeting one, and `/circuit/`'s
         own *the panel box starts and ends where the rest of the page does*
         is green while being FALSE at 390 px by 286.0 px.
         🔴 SO WHAT WENT IS NOT A SPECIMEN, IT IS THE PROJECT'S ONLY PHONE
         WIDTH ASSERT, and nothing replaces it. The day a panel breaks on a
         phone again, this suite will be green. `plans/plan-panel-component.md`
         has three unpriced options for grading a phone properly, and
         `BACKLOG.md` carries this as open. */
    });

  section('hardware', 'SEGMENT DISPLAY',
    'A field of digits drawn from its own parts, with every unlit bar still '
    + 'faintly there, which is what makes it read as a display rather than as '
    + 'coloured text. Nothing measured is blank and never a zero, and a value too '
    + 'wide for the field shows dashes and keeps the number in its tooltip.',
    `createSegment({ digits: 3 }).set(127)
createSegment({ digits: 3, decimals: 1 }).set(12.5)     // the dot costs no cell
createSegment({ digits: 2, frame: false, size: 16 })    // two fields, one window
seg.set('')          // -> { blank: true },  nothing lit
seg.set(1234)        // -> { over: true, asked: '1234' },  reads ---`,
    (box) => {
      box.classList.add('kit-wide');
      const stack = createStack(undefined, 'kit-col');

      /** One field with its own caption above it, so six of them in a row each
       *  say which of the six they are. */
      const field = (cap, opts) => {
        const col = el('div', 'kit-dispc');
        col.append(el('div', 'kit-cap', cap));
        const s = createSegment(opts);
        col.append(s.el);
        return { col, s };
      };

      // ── the same field, six readings ──────────────────────────────────
      // All three digits, no decimal point, default ink: the width check below
      // compares these against each other, so anything that changed the shape
      // of the box would have to change all six.
      const row = el('div', 'kit-disp');
      for (const [cap, v] of [['reading', 127], ['narrowest', 111], ['every bar', 888],
        ['measured zero', 0], ['nothing measured', ''], ['too wide', 1234]]) {
        const { col, s } = field(cap, { digits: 3, value: v });
        dispSpec.set(cap, s);
        row.append(col);
      }

      // ── a decimal point, a word, and a second colour ──────────────────
      const row2 = el('div', 'kit-disp');
      const dot = field('one decimal', { digits: 3, decimals: 1, value: 12.5 });
      dispDot = dot.s;
      row2.append(dot.col);
      // Seven bars draw a closed list of characters and no more. `rEC` is on

  /**
   * 🔴 NEWEST AT THE TOP, AND THE TWO PRESENCE BLOCKS ARE ONE. Asked 2026-09-17:
   * *"bring online offline up in kit and merge busy/test into it"*. They were
   * two sections because the busy words were built second, and that is a fact
   * about the order the work happened in rather than about the component: one

   * that it is the same thing.
   *
   * ⚠️ A SECTION TITLE IS UPPERCASE, and `.kit-h` renders it so whatever is
   * typed. Type it uppercase anyway, so the source reads like the page.
   * ⚠️ AND MOVING A BLOCK MOVES EVERY BUTTON AFTER IT. `verify.mjs` presses by
   * position, so re-run `node demo/verify.mjs kit` and diff the assert count
   * after any reorder.
   */
  section('timeline', 'VIDEO PANEL',
    'A picture, with a status on the left, an empty middle and a fullscreen button under it.',
    `createVideoPanel({ media: canvas, of: 'the board' })
createVideoPanel({ media, left: myBadge, centre: myThing, right: false, fullMode: 'footer' })`,
    (box) => {
      box.classList.add('kit-wide');
      const stack = createStack(undefined, 'kit-col');

      /**
       * 🔴 THE PICTURE IS THIS PROJECT'S OWN AND COMES FROM NOBODY'S SERVER.
       * `pattern.mjs` is drawn into a canvas here, so the specimen needs no
       * network, cannot 403, and looks the same on every run. CLAUDE.md's rule
       * about external sources has been broken twice; a gallery is the last
       * place to break it a third time.
       * ⚠️ ONE CANVAS PER PANEL AND ONE LOOP. A canvas cannot be in two places,
       * so the master is drawn once a frame and blitted, which is what `/stage/`
       * does with three of them.
       */
      const master = document.createElement('canvas');
      master.width = FRAME_W; master.height = FRAME_H;
      const mctx = master.getContext('2d', { alpha: false });

      /**
       * ⚠️ THREE ACROSS, NOT THREE DOWN. A panel is 16 by 9 and a page wide, so
       * three of them stacked is three screens of scrolling to compare things
       * that differ in one row of controls. Side by side they are compared at a
       * glance, which is what a gallery is for, and they wrap to one column on a
       * phone where the full width is what a panel actually gets.
       */
      const row = el('div', 'kit-row kit-vps');
      const made = [];
      const add = (heading, panel, ctx) => {
        const cell = el('div', 'kit-vp');
        cell.append(el('p', 'kit-cap', heading), panel.el);
        row.append(cell);
        made.push({ ctx, panel });
      };
      for (const [mode, heading] of [['hover', 'the defaults'],
                                     ['footer', 'footer in fullscreen']]) {
        const c = document.createElement('canvas');
        c.width = FRAME_W; c.height = FRAME_H;
        /**
         * ⚠️ THE BADGE SAYS `LIVE` RATHER THAN SHOWING A LONE DOT. Asked
         * 2026-09-17: *"add LIVE to green bullet on footer"*. A coloured dot
         * with nothing beside it is a mark whose whole meaning is its hue, which
         * this project already has a rule about, and the panel's own default is
         * the dot mode because a footer usually holds several small things. Here
         * it holds one.
         */
        const p = createVideoPanel({
          media: c, fullMode: mode,
          left: createPresence({ of: '', mode: 'badge', state: 'online',
                                 says: { online: 'live' } }).el,
        });
        add(heading, p, c.getContext('2d', { alpha: false }));
      }

      /**
       * 🔴 THE SECOND STOREY IS STILL GRADED AND IS NO LONGER SHOWN. The
       * specimen came off 2026-09-20 on instruction: *"rm a second storey under
       * the footer"*. It was asked for on 2026-09-19 with a photograph of
       * `/mirror/` filling an iPhone: *"extend videopanel footer in fullscreen
       * so it can have section below the footer bar (separaet with line). put
       * controlgroup there"*.
       *
       * 🔴 THE MECHANISM IS LIVE AND THIS IS THE ONLY THING THAT GRADES IT.
       * `/mirror/` calls `panel.under(knobRow)`, and in real element fullscreen
       * nothing outside the full subtree is on screen, so on a phone that row is
       * only reachable from inside the picture. Deleting the piece as well as the
       * specimen would take the check with it, which is this project's own rule
       * about a control you switch off. So it stays as an off-screen probe.
       * ⚠️ OFF SCREEN AND LAID OUT, the same shape as the way-out probe at the
       * foot of this file: the check reads `gridTemplateRows`, so `display:
       * none` is not available and `left: -9999px` is.
       * 🔴 IT IS THE SAME ELEMENT, MOVED. Two rows that can disagree about which
       * option is chosen would be a readout living in two files, so the check
       * grades that there is exactly ONE of them in the document.
       */
      {
        const probe = el('div', '');
        probe.style.cssText = 'position:fixed;left:-9999px;top:0;width:480px';
        const c = document.createElement('canvas');
        c.width = FRAME_W; c.height = FRAME_H;
        vpUnder = el('div', 'kit-row');
        vpUnder.append(el('div', '', 'a control row'));
        vpStorey = createVideoPanel({ media: c, fullMode: 'footer' });
        probe.append(vpStorey.el, vpUnder);
        document.body.append(probe);
        // ⚠️ HANDED OVER AFTER IT IS ON THE PAGE, which is the realistic order
        // and the one that matters: the panel records where the element lives
        // at the moment it is given it, so an element with no parent yet has no
        // home to be put back to. The constructor's `under` option is for a page
        // that builds its controls before it builds its panel.
        vpStorey.under(vpUnder);
      }

      vpSpec = made;
      stack.add(row);

      let n = 0;
      const draw = () => {
        burn(mctx, FRAME_W, FRAME_H, n++, { hue: videoHue(0) });
        for (const m of made) m.ctx.drawImage(master, 0, 0);
        requestAnimationFrame(draw);
      };
      requestAnimationFrame(draw);
      box.append(stack.el);
    });

  /* ⚠️ THE WORDS ARE AN OPTION AND THERE IS A NAMED MAP FOR INSTRUMENTS ON A
     CABLE. `SAYS` is network language and suits a board answering over a relay;
     `WIRED` says `connected`, `connecting` and `not connected`, and five pages
     take it (`/circuit/`, `/twelve/`, `/shape/`, `/bay/`, `/evo/`). The
     specimens below keep `SAYS`, because what they demonstrate is the five
     STATES rather than one vocabulary, and because the width check at the
     bottom is calibrated on the default phrases. */
  section('status', 'PRESENCE',
    'Five states, and whether a person or a harness is holding it.',
    `createPresence({ of: 'the board' }).set('online')
createPresence({ of: 'the Circuit', says: WIRED })   // connected / connecting / not connected
createPresence({ of: 'Raspberry Pi', busyWords: { page: 'in use', tool: 'under test' } }).busy('tool')
createPresence({ of: 'the board', mode: 'dot', state: 'online' })
presenceOf({ now, lastSeenAt, everyMs: 5000 })   // -> one of the five`,
    (box) => {
      box.classList.add('kit-wide');
      const stack = createStack(undefined, 'kit-col');

      // ⚠️ `can: [s]` IS WHAT MAKES THIS ROW EVENLY SPACED. Each of these will
      // only ever say its own word, so holding room for `coming online` put a
      // different amount of empty space after each one and the gaps read as
      // arbitrary. A badge that can really change says nothing here and keeps
      // the full reserve, which is what the width check below drives.
      const states = el('div', 'kit-row');
      for (const s of PRESENCE_STATES) {
        const p = createPresence({ state: s, can: [s] });
        presSpec.set(s, p.el);
        states.append(p.el);
      }
      // One badge that CAN change, for the check at the bottom: the claim is
      // that a badge does not twitch as ITS OWN state moves, which is about one
      // badge over time and not about five badges side by side.
      presLive = createPresence({ state: 'online' });
      presLive.el.style.position = 'absolute';
      presLive.el.style.visibility = 'hidden';
      states.append(presLive.el);

      const busy = el('div', 'kit-row');
      for (const [kind, label] of [[null, 'nobody'], ['page', 'a person'], ['tool', 'a harness']]) {
        // Born in its state rather than switched into it: `busy()` fades over
        // 90 ms, and a fixed specimen has nothing to fade from.
        const p = createPresence({ of: 'Raspberry Pi', state: 'online', can: ['online'],
                                   busyWords: { page: 'in use', tool: 'under test' }, busy: kind });
        busySpec.set(label, p.el);
        busy.append(p.el);
      }

      /**
       * The same component with `mode: 'dot'`: the ring alone, with the words
       * CLIPPED rather than removed, so the accessible name is still the whole
       * sentence and a change is still announced. It is an inline box with no
       * margins, so it drops into a button, a readout key or a row of machines
       * without any of them knowing what it is.
       */
      const inButton = el('button', '', null, { type: 'button' });
      inButton.append(createPresence({ of: 'the board', mode: 'dot', state: 'online' }).el,
        document.createTextNode(' switch it on'));
      inButton.style.cssText = 'display:inline-flex;align-items:center;gap:7px';

      // In a readout key, where a page already prints what a machine is doing.
      const inReadout = el('div', 'pos-readout');
      for (const [k, v, u, st] of [['relay', '1', '/16', 'online'], ['board', '', 'ms', 'unknown']]) {
        const c = el('div', 'pos-cell');
        const key = el('div', 'pos-k');
        key.style.cssText = 'display:flex;align-items:center;gap:5px';
        key.append(createPresence({ of: k, mode: 'dot', state: st }).el, document.createTextNode(k));
        const val = el('span', 'pos-v', v || null);
        if (st === 'unknown') val.dataset.state = 'pending';
        if (u) val.append(el('span', 'pos-u', u));
        c.append(key, val); inReadout.append(c);
      }

      // A row of machines, which is the shape /knobs/, /grains/ and /able/ all
      // want and all draw differently today.
      const machines = el('div', '');
      machines.style.cssText = 'display:grid;gap:6px;font:400 12px/1 var(--mono);color:var(--dim)';
      for (const [name, st] of [['studio-1', 'online'], ['the board', 'coming'],
        ['the Mac', 'offline'], ['the headset', 'unknown']]) {
        const row = el('div', '');
        row.style.cssText = 'display:flex;align-items:center;gap:8px';
        row.append(createPresence({ of: name, mode: 'dot', state: st }).el, document.createTextNode(name));
        machines.append(row);
      }
      // ⚠️ THE READOUT NEEDS A WIDTH OR ITS CELLS STACK. `.pos-readout` is a
      // flex row whose cells grow, so in a narrow box two cells sit on top of
      // each other and stop looking like a readout at all. It had `flex: 1 1
      // 100%` when it lived in a section of its own; inside a row of three
      // specimens it takes a basis instead.
      inReadout.style.flex = '1 1 300px';
      const dots = el('div', 'kit-row');
      // Top, not centre: three specimens of different heights centred on each
      // other reads as three things floating rather than three things in a row.
      dots.style.alignItems = 'flex-start';
      dots.append(inButton, inReadout, machines);

      // ⚠️ `stack.titled`, NOT A HAND-ROLLED CAPTION. That is what this section
      // is demonstrating three times over: the heading and what it labels are
      // ONE block, and the component owns both distances.
      stack.titled('IS IT ANSWERING', states);
      stack.titled('AND HAS SOMEBODY ELSE GOT HOLD OF IT', busy);
      stack.titled('THE SAME BADGE AS A DOT, INSIDE SOMETHING ELSE', dots);
      box.append(stack.el);
    });

  /**
   * 🔴 THE NEWEST COMPONENT GOES AT THE TOP OF THIS PAGE. Instructed
   * 2026-09-16: *"in kit move online stuff to topmost item (all new should land
   * top, make rule)"*.
   *
   * This page is read by somebody checking what the kit has, and what they do
   * not know about is what arrived since they last looked. Appending put the
   * newest thing behind every component they already knew, at the bottom of a
   * long scroll, which is the one place it cannot be found by accident. The
   * front page settled the same question the same way and for the same reason.

   * ⚠️ A SECTION TITLE IS UPPERCASE, and `.kit-h` renders it so whatever is

   * ⚠️ AND MOVING A BLOCK MOVES EVERY BUTTON AFTER IT. `verify.mjs` presses by

  section('layout', 'STACK',
    'The stack owns the air between blocks, so a block cannot change it.',
    `const page = createStack(d.el);          // mount() has already made this one
page.add(bar.el, picks, keyboard.el);    // the order of the page, in one line
const row = page.stack();                // a block that is itself a column`,
    (box) => {
      box.classList.add('kit-wide');
      stackSpec = createStack(undefined, 'kit-stackspec');
      // ⚠️ NO ARTICLE ON A SPECIMEN'S LABEL. Asked 2026-09-17 as `a block ->
      // block`. CLAUDE.md already carries this rule for diagram labels, where a
      // label is a NAME and names do not take articles: `a granulator` reads as

        stackSpec.add(b);

      // ⚠️ THE EMPTY CASE IS ITS OWN SPECIMEN, because what it has to show is

      // between those two that costs nothing. Putting it in the stack above
      // would have made the row read as four blocks with a hole in it.
      box.append(el('p', 'kit-cap', 'with a block that never got filled'));
      emptySpec = createStack(undefined, 'kit-stackspec');
      emptySpec.add(el('div', 'kit-blk', 'block'));
      emptyBlock = el('div', 'kit-blk');          // nothing in it, ever
      emptySpec.add(emptyBlock, el('div', 'kit-blk', 'next block'));
