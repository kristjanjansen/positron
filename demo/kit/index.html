      fRow.append(fadeSpec.el);
    });



  // ── what a machine can say about this page ──────────────────────────────
  //
  // 🔴 THIS PAGE WAS THE ONE THE SUITE COULD NOT SEE. Its whole job is to make
  // component drift visible, and `node demo/verify.mjs kit` answered "nothing
  // for this harness to verify" — so the drift it exists to catch had to be
  // caught by somebody looking. Every check below grades a defect that has
  // ACTUALLY happened here, which is the only reason any of them is worth the
  // run time.
  //
  // ⚠️ THEY RUN AFTER A FRAME. Two of them measure laid-out geometry, and
  // `getBoundingClientRect` before the first paint answers about a page that
  // has not been arranged yet.
  //
  // ⚠️ AND THEY ARE NOT NUMBERED ANY MORE. Every check below used to open with
  // a hand-typed index, which is a second copy of the order they already sit
  // in: inserting six at the top on 2026-09-19 made seventeen of them wrong at
  // once, and a number a reader trusts and nobody re-counts is worse than no
  // number. The order is the file.
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

  /**
   * 🔴 A FADER IS THE SLIDER TURNED 90 DEGREES, AND THAT IS A MEASUREMENT.
   * Both read their look from `.sld-lane` and `.sld-knob` with the axes
   * swapped, so the two can only drift if nobody compares them. **Putting them
   * side by side on this page is half of it; this is the other half.**
   */
  if (vertSpec) {
    const hLane = document.querySelector('.sld-lane');
    const vLane = vertSpec[0].el.querySelector('.pos-fdr-lane');
    const vHand = vertSpec[0].el.querySelector('.pos-fdr-hand');
    if (hLane && vLane) {
      const hr = hLane.getBoundingClientRect(), vr = vLane.getBoundingClientRect();
      const hcs = getComputedStyle(hLane), vcs = getComputedStyle(vLane);
      d.assert('a fader is the slider turned 90 degrees: the same track, across instead of along',
        Math.abs(hr.height - vr.width) <= 1
        && hcs.backgroundColor === vcs.backgroundColor
        && hcs.borderTopWidth === '0px' && vcs.borderTopWidth === '0px',
        `slider ${hr.height.toFixed(1)} px tall, fader ${vr.width.toFixed(1)} px wide, `
        + `both ${vcs.backgroundColor} with no border`);
    }
    if (vHand) {
      const hcs = getComputedStyle(vHand);
      d.assert('and its hand button is a segment of the lane, rounded only on the outside',
        hcs.borderTopLeftRadius === '0px' && hcs.borderBottomLeftRadius === '4px',
        `corners ${hcs.borderTopLeftRadius} top, ${hcs.borderBottomLeftRadius} bottom`);
    }
  }

  // every block built. A component that throws takes the page with it when
  // the error escapes, which turns one broken control into a blank page.
  d.assert('every block on this page built',
    built.length > 0 && failed.length === 0,
    failed.length ? `${failed.length} did not: ${failed.join(' · ')}`
                  : `${built.length} blocks, none threw`);

  /**
   * 🔴 THE NEWEST BLOCK'S TWO CLAIMS, AND BOTH ARE MEASUREMENTS RATHER THAN
   * LOOKS. A bar UNDER a panel and a bar GLUED to one are the same order of
   * elements: what differs is whether there is one edge round the pair or two
   * edges and a gap, which is three numbers.
   * ⚠️ IT IS THE SAME SHAPE AS THE STRIP'S CHECK BELOW, on purpose. Two
   * components reach `.pos-glue` and the rule that zeroes a child's border is
   * double-classed precisely because a component can otherwise win the
   * specificity fight, so both callers grade it the same way.
   */
  if (glueSpec) {
    const surf = glueSpec.panel.surface;
    const edge = (n) => Math.round(parseFloat(getComputedStyle(n).borderTopWidth) || 0);
    const pb = glueSpec.panel.el.getBoundingClientRect();
    const bb = glueSpec.bar.el.getBoundingClientRect();
    const seam = bb.top - pb.bottom;
    /**
     * 🔴 AND HALF THE WIDTH OF ITS BOX, MEASURED RATHER THAN READ OFF THE
     * STYLESHEET. Asked 2026-09-20 as *"make it half w"*, and a rule that is
     * present and inert reads exactly like one that works: this file already
     * records three dead CSS rules found only by computing a value, and
     * `.kit-half` sits on a child of a box whose `display` another class
     * decides.
     * ⚠️ AGAINST THE BOX'S OWN CONTENT WIDTH, NEVER A PIXEL COUNT TYPED HERE. A
     * figure would be a second opinion about a width the layout owns, and it
     * would have to be retyped every time the page's column changes.
     * ⚠️ AND THE NEGATIVE HALF IS IN IT: a specimen still taking the whole box
     * would satisfy every other clause in this check.
     */
    const half = glueSpec.half;
    const hb = half.parentElement;
    const hcs = getComputedStyle(hb);
    const room = hb.clientWidth - parseFloat(hcs.paddingLeft) - parseFloat(hcs.paddingRight);
    const took = half.getBoundingClientRect().width;
    d.assert('a transport glued under a picture is one surface with one edge, at half its box',
      surf !== glueSpec.panel.el && surf.classList.contains('pos-glue')
      && surf.contains(glueSpec.panel.el) && surf.contains(glueSpec.bar.el)
      && Math.abs(seam - 1) <= 0.6 && edge(surf) === 1
      && edge(glueSpec.panel.el) === 0 && edge(glueSpec.bar.el) === 0
      && took < room - 1 && Math.abs(took - room / 2) <= 1,
      `seam ${seam.toFixed(1)} px, one edge of ${edge(surf)} px round both, `
      + `${edge(glueSpec.panel.el)} and ${edge(glueSpec.bar.el)} inside, `
      + `taking ${took.toFixed(1)} px of the ${room.toFixed(1)} px the box gives it`);

    /**
     * 🔴 THE TWO WORDS ARE THE SAME WIDTH, MEASURED IN BOTH STATES RATHER THAN
     * ASSERTED FROM THE STYLESHEET. Asked as *"start | stop text labels (same
     * w)"*, and the reason is the project's standing one about a control that
     * resizes under the pointer that just pressed it.
     * ⚠️ **AND THE WIDTH ALONE WOULD PASS ON A BUTTON SHOWING NEITHER WORD.**
     * `visibility: hidden` on both is the same width as `visibility: hidden` on
     * one, so the check reads which span is visible in each state as well. That
     * is the half that would catch the `::before` glyph rule winning the
     * specificity fight and a word never appearing at all.
     * ⚠️ IT PRESSES THE TOGGLE AND WAITS FOR THE STATE TO LAND rather than
     * setting `data-state` by hand, which would grade the stylesheet against
     * itself and say nothing about the bar.
     */
    const t = glueSpec.bar.el.querySelector('.tbar-toggle');
    const vis = (cls) => {
      const n = t?.querySelector(`.${cls}`);
      return n ? getComputedStyle(n).visibility : 'no span';
    };
    const w = () => (t ? +t.getBoundingClientRect().width.toFixed(2) : null);
    const wIdle = w();
    const seenIdle = [vis('tbar-w0'), vis('tbar-w1')];
    t?.click();
    for (let i = 0; i < 40 && t?.dataset.state !== 'playing'; i++) {
      await new Promise((r) => requestAnimationFrame(r));
    }
    const wBusy = w();
    const seenBusy = [vis('tbar-w0'), vis('tbar-w1')];
    t?.click();
    glueSpec.deck.pause();
    d.assert('a toggle that says two words is the same width in both of its states',
      wIdle != null && wBusy != null && Math.abs(wIdle - wBusy) < 0.01
      && seenIdle[0] === 'visible' && seenIdle[1] === 'hidden'
      && seenBusy[0] === 'hidden' && seenBusy[1] === 'visible',
      `${wIdle} px showing "${t?.querySelector('.tbar-w0')?.textContent}" `
      + `(${seenIdle.join('/')}), ${wBusy} px showing `
      + `"${t?.querySelector('.tbar-w1')?.textContent}" (${seenBusy.join('/')})`);
  }

  // 🔴 GLUED, WHICH IS THE WORD THE ASK USED: *"footer section, looks like
  // glued that shows hovered info below timeline"*. So it is not enough that
  // the box is under the strip, it has to READ as the same surface, and that is
  // three measurements rather than a look: one border round the pair, nothing
  // between them but the 1 px seam `.pos-glue` shows through, and neither child
  // painting an edge of its own. `.pos-strip` and `.pos-glue.pos-glue > *` both
  // declare `border`, at (0,1,0) and (0,2,0), and which of them wins is the
  // specificity trap this stylesheet already records three times.
  if (footSpec) {
    const box = footSpec.surface;
    const cb = footSpec.el.getBoundingClientRect();
    const fb = footSpec.footer.el.getBoundingClientRect();
    const seam = fb.top - cb.bottom;
    const edge = (n) => Math.round(parseFloat(getComputedStyle(n).borderTopWidth) || 0);
    d.assert('the strip and the box saying what is under the pointer are one surface',
      box.classList.contains('pos-glue') && Math.abs(seam - 1) <= 0.6
      && edge(box) === 1 && edge(footSpec.el) === 0 && edge(footSpec.footer.el) === 0,
      `seam ${seam.toFixed(1)} px, one edge of ${edge(box)} px round both, `
      + `${edge(footSpec.el)} and ${edge(footSpec.footer.el)} inside`);
  }

  // 🔴 THE GROUP'S BUTTONS ARE WHERE THE HARNESSES LOOK, AND THAT IS THE ONE
  // THING A ROW COMPONENT CAN QUIETLY BREAK. `verify.mjs` and `verify-gl.mjs`
  // both press `.pos-controls button`, so a group that wraps its buttons in a
  // row of its own is one refactor away from taking them out of that selector
  // and out of the suite. `/mirror/` has already paid for this once: a stepper
  // moved into the knob row and the press count went 9 to 7 while the page read
  // green. Graded with the harnesses' OWN selector string, against a specimen
  // mounted the way a page mounts one.
  // ⚠️ PROVED BY BREAKING IT, 2026-09-19: the same specimen in a `.kit-row`
  // instead reads `0 of 3` and takes this red. The pressable count beside it is
  // 4 as of 2026-09-20, down from 6 when the headset pair went off screen, and
  // it is a fact about how many blocks currently mount a control row rather
  // than a number this check is graded against.
  const PRESSED = '.pos-controls button';
  const inRow = [...document.querySelectorAll(PRESSED)];
  const groupBtns = bgSpec ? bgSpec.buttons : [];
  d.assert('every button in a group is found by the selector both harnesses press',
    groupBtns.length === 3 && groupBtns.every((b) => inRow.includes(b)),
    `${groupBtns.filter((b) => inRow.includes(b)).length} of ${groupBtns.length} under ${PRESSED}, `
    + `${inRow.length} pressable on this page`);

  // 🔴 THE GROUP IS ONE OBJECT, AND IT SHIPPED AS THREE. Reported 2026-09-19
  // with a screenshot of `/mirror/`: *"i do not see buttongroup vr xr"*. The
  // row had `gap: 8px`, which is what two unrelated controls look like. The
  // join is `.pos-seg`'s `margin-left: -1px`, so what a reader sees is one
  // line where two buttons meet rather than two edges with a gap: measured as
  // the distance between the first button's right edge and the second's left,
  // which is -1 when they are joined and +8 when they are not.
  // ⚠️ AND THE CORNERS, because a join that overlaps borders while both
  // buttons keep four round corners reads as a mistake rather than as a seam.
  // Only the outer two are round.
  if (bgSpec) {
    const bs = bgSpec.buttons.map((b) => b.getBoundingClientRect());
    const joins = bs.slice(1).map((r, i) => +(r.left - bs[i].right).toFixed(2));
    const cs = bgSpec.buttons.map((b) => getComputedStyle(b));
    const inner = cs[1].borderTopLeftRadius;
    d.assert('a group is one object: its buttons share a border and only the outer corners are round',
      joins.every((j) => Math.abs(j + 1) < 0.02)
      && cs[0].borderTopLeftRadius !== '0px' && cs[cs.length - 1].borderTopRightRadius !== '0px'
      && inner === '0px' && cs[1].borderTopRightRadius === '0px',
      `${joins.length} join(s) at ${joins.join(', ')} px, ends rounded ${cs[0].borderTopLeftRadius}`
      + ` and ${cs[cs.length - 1].borderTopRightRadius}, the middle one ${inner}`);
  }

  // 🔴 AND IT IS STILL NOT A CHOICE, WHICH IS THE HALF THE JOIN CANNOT CARRY.
  // A segmented row with nothing armed is a legal choice state: `/stage/` ships
  // one, with `at: -1`, because a question that arrives already answered is a
  // question nobody was asked. So the difference has to live somewhere else and
  // it lives in two places a reader can see. `aria-pressed` is the channel a
  // choice arms, for a screen reader and for the `--hi` tint keyed on it, and a
  // group never writes it. And a group's buttons are FULL SIZE, because they
  // are things you press, where a choice's options are small because they are
  // values being compared.
  // ⚠️ MEASURED AS INK, NOT READ OFF THE STYLESHEET. A rule that is present and
  // inert reads exactly like one that works, which is this page's own lesson.
  if (bgSpec && choiceSpec) {
    const armed = bgSpec.buttons.filter((b) => b.hasAttribute('aria-pressed'));
    const gSize = parseFloat(getComputedStyle(bgSpec.buttons[0]).fontSize);
    const cSize = parseFloat(getComputedStyle(choiceSpec.buttons[0]).fontSize);
    d.assert('a joined group still cannot read as a choice: nothing is armed and the buttons are full size',
      armed.length === 0 && gSize > cSize,
      `${armed.length} of ${bgSpec.buttons.length} carry aria-pressed, and a group button is`
      + ` ${gSize} px against a choice option's ${cSize} px`);
  }

  // 🔴 SWITCHING A BUTTON OFF MOVES NOTHING. The answer that switches these off
  // arrives late by construction, because asking a browser about a headset is a
  // promise, so a disabled look that changed the box would reflow the control
  // row under a pointer already on its way to it. `button[disabled]` is opacity
  // and a cursor, and this measures that it stayed that way.
  if (bgSpec) {
    const b = bgSpec.button('clear');
    const on = b.getBoundingClientRect();
    bgSpec.enable('clear', false, 'The log on this page is already empty.');
    const off = b.getBoundingClientRect();
    const said = b.title;
    bgSpec.enable('clear', true);
    d.assert('a button switched off is the same size as it was on, and it says why',
      Math.abs(on.width - off.width) < 0.01 && Math.abs(on.height - off.height) < 0.01
      && said.length > 0 && b.title === '',
      `${on.width.toFixed(1)} by ${on.height.toFixed(1)} on, ${off.width.toFixed(1)} by ${off.height.toFixed(1)} off · `
      + `"${said}" · nothing left over when it came back`);
  }

  // NEGATIVE CONTROL: the reason is not optional. A grey control with no
  // explanation reads as a broken page rather than as a browser that cannot do
  // the thing, so the group refuses it the way `mount()` refuses an odd readout.
  if (bgSpec) {
    let refused = '';
    try { bgSpec.enable('save', false); }
    catch (e) { refused = e.message; }
    d.assert('NEGATIVE CONTROL: a button disabled with no reason is refused rather than drawn',
      refused.length > 0 && bgSpec.enabled('save'),
      refused || 'it was accepted, and the button is off with nothing to show for it');
  }

  // 🔴 THE IPHONE CASE, WHICH IS THE ONE THAT WAS BROKEN. Every XR page wrote
  // `navigator.xr?.isSessionSupported(...).then(...)`, and on a browser with no
  // `navigator.xr` the optional chain returns undefined, so neither handler runs
  // and the variable stays null for ever. `/held/` then reported that to a
  // visitor holding a phone as a check that had FAILED. `createXrProbe` takes
  // the system object rather than reading `navigator`, so the case that cannot
  // be reproduced in this browser can be built in one line.
  // ⚠️ THREE PROBES, NOT ONE. A module that answered `absent` about everything
  // would pass the first of these on its own, which is the whole reason the
  // other two are here.
  {
    const nothing = createXrProbe(undefined).caps();
    const says = await createXrProbe({ isSessionSupported: async () => true }).when(1000);
    const refuses = await createXrProbe({ isSessionSupported: () => Promise.reject(new Error('no')) }).when(1000);
    d.assert('a browser with nothing to ask is answered at once, and three browsers get three answers',
      nothing.vr === 'absent' && nothing.ar === 'absent' && answered(nothing.vr)
      && says.vr === 'yes' && says.ar === 'yes'
      && refuses.vr === 'no' && refuses.ar === 'no',
      `no headset support: ${nothing.vr} · a browser that says yes: ${says.vr} · `
      + `one that refuses to answer: ${refuses.vr}`);
  }

  // Every answer that switches a control off has a sentence a visitor can read,
  // and the answer that switches nothing off has nothing to say. A disabled
  // button with no reason is worse than an enabled one; a tooltip on a working
  // control restating its own label is furniture.
  {
    const wrong = [];
    let sentences = 0;
    for (const mode of ['vr', 'ar']) {
      for (const st of XR_STATES) {
        const says = reasonFor(st, mode);
        if (says) sentences++;
        if (!canEnter(st) && !says) wrong.push(`${mode} ${st} says nothing`);
        if (st === 'yes' && says) wrong.push(`${mode} yes carries a tooltip it does not need`);
        // The rules every visitor-facing sentence here obeys: no file path, no
        // warning sign, and no dash bolting a second clause on.
        if (says && (says.includes('/') || /[—⚠\u{1f534}]/u.test(says))) {
          wrong.push(`${mode} ${st} is not plain words`);
        }
      }
    }
    d.assert('every answer that switches a headset button off says why, in plain words',
      wrong.length === 0,
      wrong.length ? wrong.join(' · ')
        : `${XR_STATES.length} answers over 2 modes, ${sentences} sentences, and nothing said when it works`);
  }

  // The pair this page builds is wired the way the four pages wire theirs, so
  // the wiring is graded once here rather than four times over there. Whatever
  // this browser answers, the control agrees with it.
  // ⚠️ THE GROUP IS OFF SCREEN SINCE 2026-09-20, when the specimen was asked
  // for removal. It is the same object wired the same way; what went is the row
  // a visitor could see, and this check is why the group itself did not go with
  // it.
  // ⚠️ PROVED BY BREAKING IT, 2026-09-19: with the two `enable` calls taken out
  // of the subscription this reads `vr no, pressable` and goes red, which is
  // the `/held/` defect exactly. A page that forgets to wire it is the failure
  // this catches, because nothing else can see a call that is not there.
  if (xrSpec) {
    const c = xrCaps();
    d.assert('a headset button is pressable exactly when this browser says it can be',
      xrSpec.enabled('vr') === canEnter(c.vr) && xrSpec.enabled('ar') === canEnter(c.ar),
      `vr ${c.vr}, ${xrSpec.enabled('vr') ? 'pressable' : 'off'} · `
      + `ar ${c.ar}, ${xrSpec.enabled('ar') ? 'pressable' : 'off'}`);
  }

  // 🔴 NOTHING IN THE LOG IS WHITE. Asked 2026-09-19 with a photograph of a
  // phone: *"do not color log items white, keep it gray or red or whatever you
  // hae in palette"*. The emphasis on a `hi` line is carried by weight plus ONE
  // step of ink now, so what is graded is that the step is real and that it
  // stops short of the page's brightest colour.
  // ⚠️ MEASURED AS INK, NEVER AS A RULE. shell.css already records what reading
  // a stylesheet instead of a computed style costs: a rule that is present and
  // inert reads exactly like one that works.
  // ⚠️ AND THE SPECIMEN IS NEVER SEEN. `color` resolves on a `display: none`
  // element, so it goes into the real log, is measured, and is gone inside one
  // task.
  {
    const line = el('div', 'pos-line hi');
    line.style.display = 'none';
    const m = el('span', 'pos-m', 'probe');
    line.append(m);
    d.logEl.append(line);
    const emph = getComputedStyle(m).color;
    const brightest = getComputedStyle(document.body).color;
    const body = getComputedStyle(d.logEl).color;
    line.remove();
    d.assert('the loudest line in the log is quieter than the page\u2019s brightest ink',
      emph !== brightest && emph !== body,
      `the log reads ${body}, its emphasis ${emph}, the page ${brightest}`);
  }

  // 🔴 THE LEFT EDGES. Reported THREE TIMES on a real page and the third
  // report was a different bug wearing the first one's clothes: a component
  // swap moved the class a rule was keyed on, the sharing call went on setting
  // a custom property nothing consumed, and the row snapped back to the width
  // of one word while the code and the comment beside it both read as correct.
  // Measured ink, not arithmetic about ink.
  //
  // ⚠️ A PAIRED GROUP IS TWO COLUMNS ON PURPOSE, so "one left edge" is the
  // wrong claim about it and grading it that way reported 355 px apart about a
  // layout doing exactly what it was asked. It gets the claim that IS true of
  // it: two columns, and every label in a column on one edge. First written the
  // other way, which is how the difference got noticed.
  const leftsIn = (g) => [...g.querySelectorAll('.sld-l')]
    .map((n) => Math.round(n.getBoundingClientRect().left));
  const spreadOf = (xs) => (xs.length > 1 ? Math.max(...xs) - Math.min(...xs) : 0);

  const stackedGroups = [...document.querySelectorAll('.kit-box .sld-group:not(.pos-pair)')];
  let stackedWorst = 0, stackedLabels = 0;
  for (const g of stackedGroups) {
    const xs = leftsIn(g);
    stackedLabels += xs.length;
    stackedWorst = Math.max(stackedWorst, spreadOf(xs));
  }
  d.assert('sliders stacked in one group start their labels at the same left edge',
    stackedLabels > 1 && stackedWorst <= 1,
    stackedLabels > 1
      ? `${stackedLabels} labels in ${stackedGroups.length} group(s), worst ${stackedWorst} px apart`
      : 'no stacked slider labels were found, so nothing was compared');

  const pairGroups = [...document.querySelectorAll('.kit-box .sld-group.pos-pair')];
  let pairCols = 0, pairWorst = 0;
  for (const g of pairGroups) {
    const xs = leftsIn(g);
    const cols = new Map();
    for (const x of xs) {
      const key = [...cols.keys()].find((k) => Math.abs(k - x) <= 1);
      (cols.get(key ?? x) ?? cols.set(x, []).get(x)).push(x);
    }
    pairCols = Math.max(pairCols, cols.size);
    for (const col of cols.values()) pairWorst = Math.max(pairWorst, spreadOf(col));
  }
  d.assert('and a two-across group keeps exactly two of them, one per column',
    pairGroups.length > 0 && pairCols === 2 && pairWorst <= 1,
    pairGroups.length
      ? `${pairGroups.length} paired group(s), ${pairCols} column(s), worst ${pairWorst} px within one`
      : 'no paired group was found, so nothing was compared');

  // 2b. 🔴 THE INVISIBLE HAND'S BUTTON, MEASURED RATHER THAN LOOKED AT, AND
  // NOTHING HERE PRESSES IT. A visit to this page must assert a strict subset:
  // everything gradable from what is already on the screen runs, and anything
  // that would start a movement does not. The plumbing claims are graded on
  // `/knobs/` behind `?selfcheck=1`, which is the page that has two sliders and
  // a real send gate to compare them with.
  {
    const row = handSpec?.withHand.el.querySelector('.sld-hand-row');
    const btn = row?.querySelector('.sld-hand');
    const laneR = row?.querySelector('.sld-lane')?.getBoundingClientRect();
    const btnR = btn?.getBoundingClientRect();
    const seam = laneR && btnR ? Math.round(btnR.x - (laneR.x + laneR.width)) : NaN;
    const cs = btn ? getComputedStyle(btn) : null;
    const laneCs = row ? getComputedStyle(row.querySelector('.sld-lane')) : null;
    d.assert('a hand button is joined to its lane, one pixel over, with the corners rounded only outside',
      !!row && row.classList.contains('pos-seg') && seam === -1
      && cs.borderTopRightRadius === '4px' && cs.borderTopLeftRadius === '0px'
      && laneCs.borderTopRightRadius === '0px' && laneCs.borderTopLeftRadius === '4px'
      && Math.round(btnR.height) === Math.round(laneR.height),
      row ? `seam ${seam} px, lane corners ${laneCs.borderTopLeftRadius}/${laneCs.borderTopRightRadius}, `
        + `button ${cs.borderTopLeftRadius}/${cs.borderTopRightRadius}, both ${Math.round(btnR.height)} px high`
        : 'no hand row was built');
    // 🔴 AND THE WRAPPER IS CONDITIONAL, WHICH IS A REAL CASUALTY AND NOT A
    // PREFERENCE. `/grains/` selects `.fade > .sld > .sld-lane` with a CHILD
    // combinator, so an unconditional row would stop that matching in silence
    // and take the lane back to its standalone 96 px.
    // ⚠️ AND NO HAND BUTTON MAY SIT IN A CONTROL ROW: `verify.mjs` presses
    // `.pos-controls button` on every demo on every run.
    d.assert('a slider with no hand has no wrapper, and no hand button sits in a control row',
      !!handSpec && !handSpec.without.el.querySelector('.sld-hand-row')
      && handSpec.without.el.firstElementChild?.nextElementSibling?.classList.contains('sld-lane')
      && !document.querySelector('.pos-controls .sld-hand')
      && handSpec.without.hand === null && handSpec.withHand.hand !== null,
      handSpec
        ? `the plain slider's second child is its own ${handSpec.without.el.children[1]?.className}, `
          + `and ${document.querySelectorAll('.pos-controls .sld-hand').length} hand buttons are in a control row`
        : 'the block did not build');
  }

  // the readout specimen. An odd count leaves the last row short, and a
  // cell with nothing in it must be EMPTY with its unit HIDDEN: an empty value
  // beside a standing `%` reads as a number that went missing, and a pre-set 0
  // reads as a very confident measurement of nothing.
  // ⚠️ THIS COMMENT SAID "one em dash" UNTIL 2026-09-18, THREE MONTHS AFTER THE
  // PLACEHOLDER WAS REMOVED. The assert below was right the whole time: it asks
  // whether the UNIT is hidden and never what the cell draws, which is why it
  // stayed green while the sentence above it described a different page.
  const cells = [...document.querySelectorAll('.kit-box .pos-readout .pos-cell')];
  const pending = cells.map((c) => c.querySelector('.pos-v[data-state="pending"]')).filter(Boolean);
  const unitShown = pending.some((v) => {
    const u = v.querySelector('.pos-u');
    return u && getComputedStyle(u).display !== 'none';
  });
  d.assert('the readout specimen has an even number of cells and hides the unit of an unmeasured one',
    cells.length > 0 && cells.length % 2 === 0 && pending.length > 0 && !unitShown,
    `${cells.length} cells, ${pending.length} unmeasured, unit ${unitShown ? 'STILL SHOWING' : 'hidden'}`);

  // 🔴 THE NEGATIVE CONTROL FOR IT, and it is the reason the rule holds at
  // all: `mount()` REFUSES an odd count rather than trusting every page to
  // remember. A rule enforced by nothing is a rule that is already broken
  // somewhere. Called in a try, because passing is the throw.
  let odd = null;
  try {
    mount({ name: 'kit-probe', readout: { a: '', b: '', c: '' } });
    odd = 'it was accepted';
  } catch (e) { odd = e.message; }
  d.assert('NEGATIVE CONTROL: a readout with an odd number of cells is refused',
    odd !== 'it was accepted', odd);

  // the diagram grades both directions. A cuts report that can only ever
  // say "nothing cut" is not a measurement of anything: the picture built out
  // of deliberately unwritable labels has to come back with cuts, and the one
  // written properly has to come back with none.
  const fits = drawn.get('fits');
  const tooLong = drawn.get('too-long');
  d.assert('a diagram whose labels fit reports nothing shortened',
    !!fits && fits.measured && fits.cuts.length === 0,
    fits ? `${fits.width} px, type ${fits.measured ? 'measured' : 'ESTIMATED'}, ${fits.cuts.length} cut`
         : 'that picture never rendered');
  d.assert('NEGATIVE CONTROL: and one written too long reports every label it shortened',
    !!tooLong && tooLong.cuts.length > 0,
    tooLong ? `${tooLong.cuts.length} shortened: ${tooLong.cuts.map((c) => c.id).join(', ')}`
            : 'that picture never rendered');

  // 🔴 A LINK ASKED FOR AND NOT DRAWN, WHICH IS THE ONE DEFECT A PICTURE
  // CANNOT SHOW YOU. An arrow between two boxes in one container used to be
  // thrown away: the diagram still looked complete, because the plain tie
  // between those boxes stood exactly where the arrow should have been, and
  // /station/ lost three real arrows that way without anybody noticing. So this
  // counts the lines rather than looking at them — three links declared must be
  // three arrows on the picture, and the ONE gap nothing was declared across
  // must still have its tie. Both numbers matter: three arrows and two ties
  // would mean the arrow had been drawn on top of the bracket it replaces.
  const arrowsAndTies = (a) => a && {
    arrows: a.svg.querySelectorAll('.pos-dg-link').length,
    ties: a.svg.querySelectorAll('.pos-dg-tie').length,
  };
  const wide = arrowsAndTies(drew.get('siblings'));
  const narrow = arrowsAndTies(drew.get('siblings-phone'));
  const tally = (x) => (x ? `${x.arrows} arrows, ${x.ties} ties` : 'never rendered');
  d.assert('an arrow between two boxes in one machine is drawn, and it replaces their tie',
    !!wide && !!narrow && wide.arrows === 3 && wide.ties === 1
    && narrow.arrows === 3 && narrow.ties === 1,
    `left to right: ${tally(wide)} · one column: ${tally(narrow)}`);

  // 🔴 THE PRESENCE BADGE IS THE SAME WIDTH IN ALL FOUR STATES, which is
  // this project's standing rule about anything that redraws: a live sentence
  // under a picture reflowed between three and four lines and was reported as
  // "a horrible jump of content each time it updates". A badge whose word goes
  // from `online` to `coming online` would shove whatever sits to its right
  // every time a board answered.
  //
  // ⚠️ FOUR BADGES, NOT ONE PRESSED THROUGH FOUR STATES. The claim is identical
  // and this way nothing a visitor is looking at moves while it is graded,
  // which is the other rule: a check that mutates is the test.
  {
    // 🔴 ONE BADGE, WALKED. This compared four badges side by side, which is a
    // different claim and a weaker one: what must never happen is a badge
    // changing width UNDER A READER as the thing it watches comes and goes.
    // Four fixed specimens now sit at their own widths on purpose, so comparing
    // them would measure the reserve rather than the guarantee.
    const w = [];
    for (const s of PRESENCE_STATES) {
      presLive.set(s);
      w.push([s, presLive.el.getBoundingClientRect().width]);
    }
    presLive.set('online');
    const spread = Math.max(...w.map(([, x]) => x)) - Math.min(...w.map(([, x]) => x));
    d.assert('one badge is the same width in every state it can be in',
      w.length === PRESENCE_STATES.length && spread <= 0.5,
      w.length === PRESENCE_STATES.length
        ? `${w.map(([s, x]) => `${s} ${x.toFixed(1)}`).join(' · ')} px, spread ${spread.toFixed(2)}`
        : `${w.length} states were measured of ${PRESENCE_STATES.length}, so nothing was compared`);

    /**
     * 🔴 AND THE SAME GUARANTEE HAS TO SURVIVE THE BUSY WORDS, which is the
     * reason they are words on the badge rather than a mark beside it. A mark
     * that appears when somebody starts driving would change the badge's width
     * in a transport bar, and the reserve here is measured over every phrase
     * this badge can ever say, busy variants included. Sabotage: drop the busy
     * phrases out of the `widest` calculation in presence.mjs and this goes red
     * by about four characters.
     */
    const bw = [...busySpec].map(([label, el2]) => [label, el2.getBoundingClientRect().width]);
    const bs = bw.length > 1 ? Math.max(...bw.map(([, x]) => x)) - Math.min(...bw.map(([, x]) => x)) : -1;
    d.assert('a badge is the same width whether nobody, a person or a harness is driving it',
      bw.length === 3 && bs <= 0.5,
      bw.length === 3
        ? `${bw.map(([l, x]) => `${l} ${x.toFixed(1)}`).join(' · ')} px, spread ${bs.toFixed(2)}`
        : `${bw.length} specimens of 3, so nothing was compared`);

    // And that they actually SAY different things, because three badges the
    // same width could equally be three badges saying nothing.
    const said = [...busySpec].map(([l, el2]) => [l, el2.querySelector('.pos-pres-w').textContent.trim()]);
    d.assert('and it says which of the three it is, in words',
      new Set(said.map(([, t]) => t)).size === 3,
      said.map(([l, t]) => `${l}: "${t}"`).join(' · '));

    /**
     * 🔴 THE WORD GREYS AND THE DOT DOES NOT, and both halves are the claim.
     * A grey dot would say nobody has looked, which is what `checking` and
     * `unknown` use it for, so a busy board would become indistinguishable from
     * one we know nothing about. Asserting only the word would let the dot drift
     * grey and nothing would catch it.
     */
    const ink = (el2, sel) => getComputedStyle(el2.querySelector(sel)).color;
    const idle = busySpec.get('nobody'), person = busySpec.get('a person'), tool = busySpec.get('a harness');
    /**
     * 🔴 THE PANEL'S DEFAULTS ARE THE COMPONENT'S WHOLE ARGUMENT, so they are
     * what is checked: a page that writes neither still gets something that says
     * whether its source is answering and something that fills the screen.
     * ⚠️ AND THE PICTURE IS READ BACK OUT OF THE PANEL'S OWN CANVAS. A canvas
     * that is blank and one that is painting look identical to every counter,
     * and `pattern.mjs` burns a clock into the frame precisely so a page can ask.
     */
    if (vpSpec) {
      const first = vpSpec[0].panel;
      const btn = first.slots.right.querySelector('button');
      const r = btn?.getBoundingClientRect();
      d.assert('a panel comes with a status on the left and a square control on the right',
        !!first.slots.left.querySelector('.pos-pres') && !!r && Math.abs(r.width - r.height) <= 0.5
        && first.slots.centre.childElementCount === 0,
        r ? `the button is ${r.width.toFixed(1)} by ${r.height.toFixed(1)} px and the centre holds ${first.slots.centre.childElementCount}`
          : 'there is no control in the right slot');

      const ms = readBurned(vpSpec[0].ctx);
      d.assert('the picture in a panel is really being drawn, read back out of its own canvas',
        Number.isFinite(ms) && Math.abs(Date.now() - ms) < 60_000,
        Number.isFinite(ms) ? `the burned clock is ${Math.abs(Date.now() - ms)} ms from now`
          : 'nothing decoded, so the canvas is not showing the picture');

      let threw = false;
      try { first.mode('enormous'); } catch { threw = true; }
      d.assert(`a fullscreen mode outside ${FULL_MODES.join(', ')} is refused rather than ignored`,
        threw, threw ? 'it throws' : 'it accepted a mode that does not exist');
    }

    /**
     * 🔴 THE STEPPER'S MIDDLE IS REALLY A LIST, not a label that looks like one.
     * A cell that draws the right name with an empty or disabled select behind
     * it is the exact failure `picker.mjs` records on `/mirror/`: the control
     * looked correct and could not be used. So this asserts the working half.
     */
    const sel = stepperPick?.select;
    d.assert('the stepper\u2019s middle really opens a list, and the arrows still step it',
      !!sel && sel.options.length === 4 && !sel.disabled
      && stepperPick.el.querySelectorAll('button').length === 2,
      sel ? `${sel.options.length} options, ${sel.disabled ? 'disabled' : 'usable'}, `
        + `${stepperPick.el.querySelectorAll('button').length} arrows, showing "${stepperPick.el.querySelector('.pos-pick-n').textContent}"`
        : 'the stepper has no select at all');

    d.assert('the busy word is greyer than the word it qualifies, and the dot is not',
      ink(person, '.pos-pres-w') === ink(tool, '.pos-pres-w')
      && ink(person, '.pos-pres-w') !== ink(idle, '.pos-pres-w')
      && ink(person, '.pos-pres-dot') === ink(idle, '.pos-pres-dot'),
      `word ${ink(idle, '.pos-pres-w')} -> ${ink(person, '.pos-pres-w')} · `
      + `dot ${ink(idle, '.pos-pres-dot')} -> ${ink(person, '.pos-pres-dot')}`);
  }

  // 🔴 AND THE ANIMATION CANNOT MOVE ANYTHING EITHER, which is a separate
  // claim from the one above: the reserve fixes the four states against each
  // other, this fixes every frame of the breathing dot against itself. Read off
  // the KEYFRAMES rather than off two measurements a moment apart, because a
  // property that moves the layout for one frame in eighty is a defect two
  // rects would only catch by luck.
  {
    const after = (s) => getComputedStyle(presSpec.get(s).querySelector('.pos-pres-dot'), '::after');
    const moving = PRESENCE_STATES.filter((s) => (after(s).animationName || 'none') !== 'none');
    // Both moving states are meant to share ONE keyframe, so take the name only
    // when they agree: two different animations here would be two ways of
    // saying "something is happening", which is the drift this page exists for.
    const names = new Set(moving.map((x) => after(x).animationName));
    const name = names.size === 1 ? [...names][0] : null;
    // Every declaration in every keyframe of it, out of the one stylesheet.
    const props = new Set();
    for (const sheet of document.styleSheets) {
      let rules = [];
      try { rules = [...sheet.cssRules]; } catch { continue; }   // never cross-origin here
      for (const r of rules) {
        if (r.type !== CSSRule.KEYFRAMES_RULE || r.name !== name) continue;
        for (const k of r.cssRules) for (const p of k.style) props.add(p);
      }
    }
    const only = props.size > 0 && [...props].every((p) => p === 'opacity');
    /**
     * 🔴 THE TWO AXES, AS A CHECK. Colour says what is KNOWN and motion says
     * something is HAPPENING, so exactly two states move: `checking`, which is
     * this page asking, and `coming`, which is the instrument starting. The
     * three settled ones are still. Both moving states share one keyframe, and
     * that keyframe may touch nothing but opacity, or a breathing dot could
     * shove its neighbour once every eighty frames.
     */
    d.assert('exactly the two unsettled states move, and they move nothing but opacity',
      moving.join(',') === 'checking,coming' && only,
      `${moving.length ? moving.join(', ') : 'nothing'} moves · ${name || 'no keyframes'} touches `
      + `${props.size ? [...props].join(', ') : 'nothing this page can read'}`);
  }

  // the four states are told apart by the DOT, not by the word beside it.
  // Two states that differ only in their label are two states nobody reads,
  // which undoes the whole reason there are four. Measured ink: the ring's
  // colour, the fill's colour, the fill's opacity and whether it moves.
  {
    const ink = (s) => {
      const dot = presSpec.get(s).querySelector('.pos-pres-dot');
      const a = getComputedStyle(dot, '::after');
      return [getComputedStyle(dot).borderTopColor, a.backgroundColor,
        Math.round(Number(a.opacity)), a.animationName || 'none'].join(' ');
    };
    const inks = PRESENCE_STATES.map(ink);
    d.assert('and the five are told apart by the dot alone, with the word covered up',
      new Set(inks).size === PRESENCE_STATES.length,
      PRESENCE_STATES.map((s, i) => `${s}: ${inks[i]}`).join(' · '));
  }

  // 🔴 A DOT WHOSE MEANING IS ONLY A COLOUR IS A DOT A SCREEN READER
  // CANNOT READ. `display: none` on the word is how that happens by accident,
  // so the embedded mode CLIPS it instead: still in the accessibility tree,
  // still in the live region, and out of the flow so it costs the host nothing.
  {
    const dotMode = document.querySelector('.kit-box .pos-pres[data-mode="dot"]');
    const wordEl = dotMode?.querySelector('.pos-pres-w');
    const readable = !!wordEl && getComputedStyle(wordEl).display !== 'none'
      && wordEl.textContent.trim().length > 0;
    const wide = dotMode ? dotMode.getBoundingClientRect().width : -1;
    d.assert('an embedded dot still says its state in words, and still takes only a dot of room',
      readable && wide > 0 && wide <= 10,
      dotMode ? `says "${wordEl.textContent}", lays out ${wide.toFixed(1)} px wide`
              : 'no embedded dot was found, so nothing was compared');
  }

  // 🔴 NOTHING DRAGS THE PAGE SIDEWAYS. `min-width: 0` missing from a
  // scrolling row makes it push the whole document instead of scrolling inside
  // itself: MEASURED at 390 px, a tabs row produced 141 px of page overflow.
  // The document, not the element, is the thing to measure, because the element
  // looks fine in exactly the case that is broken.
  const over = document.documentElement.scrollWidth - document.documentElement.clientWidth;
  d.assert('no block drags the page sideways',
    over <= 0,
    over <= 0 ? `${document.documentElement.clientWidth} px wide, nothing overflowing`
              : `${over} px of horizontal overflow`);

  // 🔴 JOINED IS ONE SURFACE, AND IT TAKES TWO MEASUREMENTS TO SAY SO.
  // A border is the easiest thing in this arrangement to draw twice: the
  // readout and the log both carry `border: 1px solid var(--line)` of their
  // own on every other page, and the joined box has to take those off or the
  // log sits inside a double rule with a stray line under the readout.
  // ⚠️ THE SEAM CANNOT SEE THAT, WHICH IS WHY THE WIDTHS ARE READ TOO.
  // MEASURED by putting the defect back on purpose: with the inner borders
  // restored the seam still read **1.0 px** and only the widths moved, 0 and 0
  // to 1 and 1 — because a border is drawn INSIDE the box's own rectangle, so
  // two halves 1 px apart stay 1 px apart however thick their edges are. The
  // seam proves the gap is the mosaic's, the widths prove there is one edge.
  const px = (e, side) => Number.parseFloat(getComputedStyle(e)[`border${side}Width`]);
  // ⚠️ AND THE SECOND HALF OF WHAT JOINED MEANS IS WHERE IT SITS: at the FOOT,
  // under the BIG gap rather than the small one between two ordinary rows.
  // There is ONE gap in this project, 40 px, and this surface takes it like
  // everything else. It is stated on `.pos-report` as well as on `.pos-body`'s
  // bottom margin because the surface sits outside the body, where the rhythm
  // on that element's children cannot reach it; the two collapse rather than
  // add.
  {
    const rep = joinedSpec?.foot;
    const ro = joinedSpec?.readoutEl.getBoundingClientRect();
    const lo = joinedSpec?.logEl.getBoundingClientRect();
    const seam = ro && lo ? lo.top - ro.bottom : -1;
    const foot = rep && joinedPage
      ? rep.getBoundingClientRect().top - joinedPage.getBoundingClientRect().bottom : -1;
    const outer = rep ? px(rep, 'Top') : -1;
    const inner = joinedSpec ? [px(joinedSpec.readoutEl, 'Bottom'), px(joinedSpec.logEl, 'Top')] : [-1, -1];
    d.assert('joined is one box at the foot of the page, with the two halves one pixel apart',
      !!rep && rep.classList.contains('pos-report')
      && rep.contains(joinedSpec.readoutEl) && rep.contains(joinedSpec.logEl)
      && Math.abs(seam - 1) <= 0.5 && Math.abs(foot - 40) <= 0.5
      && outer === 1 && inner[0] === 0 && inner[1] === 0,
      `${foot.toFixed(1)} px under the page · seam ${seam.toFixed(1)} px · `
      + `one edge of ${outer} px round both, ${inner.join(' and ')} inside`);
  }

  // and the default is still two surfaces with the page between them. The
  // readout is part of the flow above the body and takes the SMALL gap; the log
  // is the foot and takes the BIG one, which is the same gap a joined report
  // gets, so the two arrangements agree about where the page ends.
  // ⚠️ THE TWO GAPS COME FROM DIFFERENT RULES AND ONLY ONE OF THEM IS THE
  // READOUT'S. Above the page it is `.pos-readout`'s own bottom margin; below
  // the page it is `.pos-body`'s, which is why the stand-in in that block IS a
  // `.pos-body`. The log asks for nothing — a `.pos-log { margin-top: 22px }`
  // stood in shell.css and was inert, beaten by a `margin` shorthand later in
  // the same file, and this measurement is what found it.
  {
    const mid = splitPage?.getBoundingClientRect();
    const ro = splitSpec?.readoutEl.getBoundingClientRect();
    const lo = splitSpec?.logEl.getBoundingClientRect();
    const above = mid && ro ? mid.top - ro.bottom : -1;
    const below = mid && lo ? lo.top - mid.bottom : -1;
    const own = splitSpec ? px(splitSpec.readoutEl, 'Top') === 1 && px(splitSpec.logEl, 'Top') === 1 : false;
    d.assert('split leaves two surfaces, with the page\u2019s one gap above and below',
      own && splitSpec.report === null
      && !splitSpec.readoutEl.closest('.pos-report') && !splitSpec.logEl.closest('.pos-report')
      && Math.abs(above - 40) <= 0.5 && Math.abs(below - 40) <= 0.5,
      `${above.toFixed(1)} px above the page and ${below.toFixed(1)} px below it, ${own ? 'two edges' : 'NOT two edges'}`);
  }

  // 🔴 HALF A SURFACE IS NOT HALF A BOX. A page that declares no readout
  // and joins anyway must get one bordered box holding a log, with no seam and
  // no empty strip where the cells would have been. A `display: none` child
  // takes no `gap` in a flex column, so the log starts exactly one border
  // inside the box; anything else means the hidden row is still taking room.
  {
    const rep = logOnlySpec?.foot;
    const drop = rep ? logOnlySpec.logEl.getBoundingClientRect().top - rep.getBoundingClientRect().top : -1;
    const gone = logOnlySpec ? getComputedStyle(logOnlySpec.readoutEl).display === 'none' : false;
    d.assert('a joined surface with no readout is one box with no seam in it',
      !!rep && gone && Math.abs(drop - 1) <= 0.5,
      `the log starts ${drop.toFixed(1)} px inside the box, which is its edge and nothing else`);
  }

  // 🔴 AND WITH NEITHER HALF, NO BOX. This is the `/typist/` defect in the
  // joined arrangement: an empty container painting its own two borders as a
  // full-width band nobody wrote. `createReport` returns no surface at all, so
  // there is nothing for a page to append and nothing to paint.
  d.assert('and with neither half to draw, nothing is put on the page at all',
    !!neitherSpec && neitherSpec.foot === null && neitherSpec.report === null
    && !document.body.contains(neitherSpec.readoutEl) && !document.body.contains(neitherSpec.logEl),
    neitherSpec && neitherSpec.foot === null
      ? 'no surface was returned, so there is no box to paint'
      : 'an empty surface was returned and would draw its own two edges');

  // 🔴 THE GAP IS THE STACK'S, AND A BLOCK CANNOT ARGUE WITH IT. The third
  // specimen carries `margin: 0 0 10px` in this page's own stylesheet, which
  // loads AFTER shell.css — the exact shape that put a keyboard flush against a
  // transport bar on `/keys/` and measured 0.0 px. A shorthand's implied
  // `margin-top: 0` is (0,1,0) and the stack's rule is (0,2,0), so it loses on
  // weight rather than on source order, which is the whole reason the rule is
  // written the way it is.
  // ⚠️ THE NUMBER IS READ OFF THE DOCUMENT, never typed here. A check that
  // types 40 grades this page against a figure it invented; `--pos-gap` is the
  // one place the project states it, so the check has to ask for it too.
  {
    const want = Number.parseFloat(
      getComputedStyle(document.documentElement).getPropertyValue('--pos-gap'));
    const gaps = [];
    for (let i = 1; i < stackBlocks.length; i++) {
      gaps.push(+(stackBlocks[i].getBoundingClientRect().top
        - stackBlocks[i - 1].getBoundingClientRect().bottom).toFixed(1));
    }
    const asked = stackBlocks.length
      ? getComputedStyle(stackBlocks[stackBlocks.length - 1]).marginTop : '?';
    d.assert('every block in a stack is one gap from the one before it, whatever margin it carries',
      Number.isFinite(want) && want > 0 && gaps.length === 2
      && gaps.every((g) => Math.abs(g - want) <= 0.5),
      `--pos-gap is ${want} px and the gaps read ${gaps.join(' and ')} px · `
      + `the block asking for margin-top 0 computes ${asked}`);
  }

  // 🔴 AND A BLOCK WITH NOTHING IN IT TAKES NO GAP. This is the `/typist/`
  // band in a third costume: an empty container that draws nothing and still
  // spends a screenful of air, or paints its own two borders as a rule nobody
  // wrote. Two blocks with an unfilled one between them must sit ONE gap apart,
  // not two — and the unfilled one must be out of the layout entirely rather
  // than merely invisible, which is the difference the display value reports.
  {
    const want = Number.parseFloat(
      getComputedStyle(document.documentElement).getPropertyValue('--pos-gap'));
    const kids = emptySpec ? [...emptySpec.el.children] : [];
    const across = kids.length === 3
      ? +(kids[2].getBoundingClientRect().top - kids[0].getBoundingClientRect().bottom).toFixed(1) : -1;
    const gone = emptyBlock ? getComputedStyle(emptyBlock).display === 'none' : false;
    d.assert('a block that never got filled takes no room and no gap',
      gone && kids.length === 3 && Math.abs(across - want) <= 0.5,
      `the two blocks around it are ${across} px apart, which is one gap of ${want} px · `
      + `the empty one computes display ${emptyBlock ? getComputedStyle(emptyBlock).display : '?'}`);
  }

  // 🔴 THE KEYBOARD UNDER A FINGER, WHICH IS THE ONE THING ABOUT IT THIS
  // MACHINE CANNOT SIT DOWN AT.
  //
  // ⚠️ EVERY CHECK BELOW IS BEHIND `?selfcheck=1`, because every one of them
  // builds a keyboard over the page and presses its keys. A visitor gets none
  // of it, which is the standing rule and not a judgement about how cheap this
  // particular block is.
  //
  // ⚠️ AND THEY BUILD THEIR OWN KEYBOARDS RATHER THAN DRIVING THE SPECIMEN.
  // The specimen sits in a box that is ~656 px wide on a laptop and 328 px on a
  // phone, and the phone layout is the thing to grade. A throwaway one in a
  // holder of a stated width asks the question directly.
  // ⚠️ THE FLAG IS `shell/selfcheck.mjs`'s NOW, read the same way on every page
  // rather than re-derived here. Same value, same moment, one place to grep.
  if (SELFCHECK) {
    const { createKeyboard, KEY_MIN_PX, BLACK_RATIO, SWIPE_PX } = await import('/shell/keyboard.mjs');
    const nap = (ms) => new Promise((r) => setTimeout(r, ms));
    const frames = (n) => new Promise((r) => {
      const step = () => (--n <= 0 ? r() : requestAnimationFrame(step));
      requestAnimationFrame(step);
    });
    /**
     * 🔴 THE FOOTER UNDER THE STRIP, WRITTEN AT IT AND MEASURED. Everything
     * below this line puts words in a box a visitor is looking at, moves a row
     * of buttons between two parents, or covers the screen, so it is behind
     * `?selfcheck=1` with the rest. The claim is the one the ask is about: it is
     * rewritten on every hover change, so it must not be able to change its own
     * height while somebody reads it.
     * ⚠️ IT IS FED THE STRIP'S OWN `hit` SHAPE, `{ detail: [...] }`, which is
     * what `describe()` hands `onHover`. A check that called some other entry
     * point would grade a path no pointer ever takes.
     */
    if (footSpec?.footer) {
      /**
       * 🔴 THE CHECK BUILDS ITS OWN FOOTER RATHER THAN GRADING THE SPECIMEN.
       * The specimen was asked to be ONE line on 2026-09-20, *"1 line footer
       * here"*, and both checks below read the SECOND row: one asserts six
       * things are cut to `lines`, the other that a name too long for row 0
       * does not push row 1 out of a box that is still the same height. Against
       * a one line footer the second row is `undefined`, so the check did not
       * fail, it THREW, and took the whole page down with a TypeError about
       * `startsWith` that named no block.
       * ⚠️ **A CHECK MUST NOT DECIDE WHAT A SPECIMEN LOOKS LIKE.** That is this
       * project's rule about a check that mutates, arriving from the other
       * side: there a check destroyed the thing it graded, here it would have
       * dictated it. Three lines is what the BEHAVIOUR needs, so the check
       * makes three lines and puts them back.
       * ⚠️ IT IS APPENDED AND THEN REMOVED, because both asserts measure a
       * height and a detached element has none.
       */
      const f = createStripFooter({ lines: 3 });
      footSpec.el.parentElement.append(f.el);
      const h = () => f.el.getBoundingClientRect().height;
      const idle = h();
      f.set({ detail: ['takes  0:03.2'] });
      const one = h();
      f.set({ detail: ['a', 'b', 'c', 'd', 'e', 'f'] });
      const six = h();
      const shown = f.says();
      f.set(null);
      const back = h();
      const empty = f.says()[0];
      d.assert('the box under the strip is one height saying six things, one thing, or nothing',
        idle > 0 && Math.abs(one - idle) < 0.5 && Math.abs(six - idle) < 0.5
        && Math.abs(back - idle) < 0.5 && shown.length === f.lines
        && shown[0] === 'a' && shown[1] === 'b' && empty === STRIP_FOOTER_EMPTY,
        `${idle.toFixed(1)} px empty, ${one.toFixed(1)} with one line, ${six.toFixed(1)} with six, `
        + `${back.toFixed(1)} back to nothing, ${f.lines} lines kept of six, and it says "${empty}"`);

      // 🔴 A NAME TOO LONG ELLIPSISES RATHER THAN WRAPPING, and that is the
      // half a height check cannot see: a wrapped first line pushes the second
      // one out of a box that is still exactly as tall as it was. Photographed
      // on `/reel/`, where a title was cut mid word inside the tooltip.
      // ⚠️ LONG ENOUGH ON ANY SCREEN, not long enough on this one. The real
      // title that was photographed being cut is about seventy characters and
      // FITS a laptop's box, so a check built on it would have passed here and
      // failed nowhere while the defect it is about lives on a phone.
      const long = `${'PÄEVAKAJA. Kaevanduse miiti ja muud, '.repeat(8)}lõpp`;
      f.set({ detail: [long, 'the second line, which must survive it'] });
      const row0 = f.el.firstElementChild;
      const cut = row0.scrollWidth - row0.clientWidth;
      const tall = h();
      const second = f.says()[1];
      f.set(null);
      d.assert('a name too long for the box is cut off at the edge, not wrapped onto the line below',
        cut > 0 && Math.abs(tall - idle) < 0.5 && second.startsWith('the second line'),
        `${long.length} characters running ${cut} px past a ${row0.clientWidth} px line, still `
        + `${tall.toFixed(1)} px tall, and the line under it reads "${second}"`);
      f.el.remove();

      // And the specimen on the page really is the one line that was asked for.
      d.assert('the footer on show is one line, which is what this specimen was asked to be',
        footSpec.footer.lines === 1, `${footSpec.footer.lines} line(s)`);
    }

    /**
     * 🔴 THE SECOND STOREY IS THE PAGE'S OWN ROW, MOVED, AND THERE IS ONE OF IT.
     * Asked 2026-09-19: *"extend videopanel footer in fullscreen so it can have
     * section below the footer bar (separaet with line). put controlgroup
     * there"*, and the thing that would quietly go wrong is a second copy, which
     * is two rows of buttons that can disagree about which option is chosen.
     * ⚠️ IT GOES FULL BY THE CLASS, NOT BY ASKING THE BROWSER. `.pos-full` is
     * what BOTH real paths set and what `isFull` reads, so this is the state
     * itself rather than a stand-in for it. Asking for real would put a cover
     * over the page in the middle of the checks that follow.
     */
    if (vpStorey && vpUnder) {
      const p = vpStorey;
      const home = vpUnder.parentNode;
      vpUnder.dataset.kit = 'storey';
      p.el.classList.add('pos-full');
      p.mode('footer');                       // re-applies, which syncs the move
      const lifted = vpUnder.parentNode;
      const rows = getComputedStyle(p.el).gridTemplateRows.split(/\s+/).filter(Boolean).length;
      const copies = document.querySelectorAll('[data-kit="storey"]').length;
      p.el.classList.remove('pos-full');
      p.mode('footer');
      const returned = vpUnder.parentNode;
      delete vpUnder.dataset.kit;
      d.assert('the second storey holds the page’s own control row, moved, and puts it back',
        lifted?.classList.contains('pos-vp-under') && p.el.contains(lifted)
        && rows === 3 && copies === 1 && returned === home,
        `${copies} of it in the document, ${rows} storeys while full, `
        + `and it came back to the ${returned === home ? 'same' : 'wrong'} parent`);
    }

    const probes = [];
    // On top of the page and out of the flow: it must be hit-testable, since
    // `document.elementFromPoint` is what decides which key a finger is on, and
    // a holder below the fold has no points to test.
    // 🔴 AND THEY MUST NOT OVERLAP EACH OTHER. The first version stacked them
    // all at `top: 0`, so the LAST one built was the one under every point and
    // three checks measured "no note was produced at all" about keyboards that
    // were working, with the width asserts passing either way because those
    // read geometry rather than hit-test it. `top` is an argument.
    const build = (width, top, opts = {}) => {
      const holder = el('div', '', null);
      holder.style.cssText = `position:fixed;top:${top}px;left:0;z-index:9999;width:${width}px;background:var(--bg)`;
      document.body.append(holder);
      const log = [];
      const kb = createKeyboard(holder, {
        base: 60, ...opts,
        onDown: (n) => { kb.lightNote(n, true); log.push(`on${n}`); },
        onUp: (n) => { kb.lightNote(n, false); log.push(`off${n}`); },
      });
      probes.push({ kb, holder, log });
      return { kb, holder, log };
    };
    const keyEls = (kb) => [...kb.keysEl.querySelectorAll('.k')];
    const whitesOf = (kb) => keyEls(kb).filter((k) => !k.classList.contains('sharp'));
    const blacksOf = (kb) => keyEls(kb).filter((k) => k.classList.contains('sharp'));
    // ⚠️ LOW ON THE KEY, CLEAR OF THE BLACKS. A point at a white key's centre is
    // inside a raised black one near the top; every gesture below aims at the
    // bottom third, which is white and nothing else.
    const lowOn = (e) => { const r = e.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.bottom - 12 }; };
    const touch = (kb, type, p, id = 3, kind = 'touch') => kb.keysEl.dispatchEvent(new PointerEvent(type, {
      bubbles: true, pointerId: id, pointerType: kind, clientX: p.x, clientY: p.y, isPrimary: true }));

    const phone = build(390, 0);
    const desk = build(1100, 130);

    // ── the width, and the negative control that proves it is a FLOOR ───────
    // MEASURED before any of this: 24.77 px a key at 390 CSS px, then 74, now
    // 49 on instruction. The pair of arms matters more than either number: a
    // fixed width would pass the first and fail the second.
    const phoneW = whitesOf(phone.kb)[0].getBoundingClientRect().width;
    const deskW = whitesOf(desk.kb)[0].getBoundingClientRect().width;
    const rowScrolls = phone.kb.keysEl.scrollWidth - phone.kb.keysEl.clientWidth;
    const deskScrolls = desk.kb.keysEl.scrollWidth - desk.kb.keysEl.clientWidth;
    const pushes = phone.holder.scrollWidth - phone.holder.clientWidth;
    d.assert('on a phone a white key is a finger wide and the ROW scrolls, never the page',
      phoneW >= KEY_MIN_PX - 0.5 && phoneW < KEY_MIN_PX + 2 && rowScrolls > 20 && pushes <= 1,
      `390 px holder · ${phoneW.toFixed(2)} px a white key, ${rowScrolls} px of row to scroll, `
      + `${pushes} px pushed sideways`);
    d.assert('NEGATIVE CONTROL: it is a floor, so a wide one still divides the room and does not scroll',
      deskW > KEY_MIN_PX && deskScrolls <= 1,
      `1100 px holder · ${deskW.toFixed(2)} px a white key, ${deskScrolls} px of row to scroll`);

    // ── the sharps: raised, narrower, and centred on the joins ─────────────
    {
      const w = whitesOf(phone.kb).map((e) => e.getBoundingClientRect());
      const b = blacksOf(phone.kb).map((e) => e.getBoundingClientRect());
      const shorter = b.every((r) => r.height < w[0].height - 10);
      const narrower = b.every((r) => Math.abs(r.width / w[0].width - BLACK_RATIO) < 0.02);
      const aligned = b.every((r) => r.top === w[0].top);
      d.assert('the sharps are raised: shorter than a white key, narrower, and sitting on its top edge',
        w.length === 8 && b.length === 5 && shorter && narrower && aligned,
        `${w.length} white and ${b.length} black · white ${w[0].width.toFixed(1)}x${w[0].height} · `
        + `black ${b[0].width.toFixed(1)}x${b[0].height}, ${(b[0].width / w[0].width).toFixed(3)} of a white`);
      /**
       * 🔴 THE WHITE KEYS ARE LEFT EQUAL, WHICH IS WHAT THE OFFSETS ARE FOR AND
       * IS NOT WHAT THIS CHECK USED TO SAY. It asserted that every black key
       * CENTRES on the join, which was the defect: seven whites sharing five
       * blacks cannot both sit on their joins and leave the whites equal, and
       * centring made the narrowest strip 0.401 of a white against 0.551 with
       * the piano's offsets. The old check passed the whole time and could only
       * ever have failed if the offsets were added, which they now are, so it
       * went red at 7.33 px — exactly the intended shift.
       * ⚠️ MEASURE THE THING THE CHANGE IS FOR. The strip a finger has between
       * two black keys is the quantity; where a black key's centre sits is one
       * way of getting there and the wrong one to assert.
       */
      const strips = [];
      for (let i = 0; i < w.length; i++) {
        const leftEdge = Math.max(w[i].left, ...b.filter((x) => x.right <= w[i].right && x.right > w[i].left).map((x) => x.right));
        const rightEdge = Math.min(w[i].right, ...b.filter((x) => x.left >= w[i].left && x.left < w[i].right).map((x) => x.left));
        strips.push(rightEdge - leftEdge);
      }
      const narrowest = Math.min(...strips);
      /**
       * ⚠️ THE NARROWEST STRIP IS THE WHOLE CLAIM, and a spread across ALL eight
       * is not: the two outer keys have a black on one side only, so they are
       * wider by construction and always will be. The first version of this
       * check included them and reported a spread of 22 px about a layout that
       * was correct.
       * The number to beat is 0.401 of a white key, which is what centring the
       * black keys gave. GarageBand measures 0.439. This reads 0.551.
       */
      d.assert('and the white key a finger lands on is wide enough to land on',
        narrowest >= w[0].width * 0.5,
        `narrowest strip ${narrowest.toFixed(1)} px, ${(narrowest / w[0].width).toFixed(3)} of a white key, `
        + `against 0.401 when the black keys were centred and 0.439 in GarageBand`);
    }

    // ── 🔴 THE OVERLAP, WHICH IS A HIT TEST AND NOT A PICTURE ──────────────
    // A raised black key covers the top corners of both whites beside it, so a
    // point up there is inside two keys at once and only paint order decides
    // which note a finger gets. The assert is here because that is an accident
    // of `z-index` that a future stacking context would undo silently, and the
    // symptom would be a keyboard that plays C when you aim at C sharp.
    {
      const b0 = blacksOf(phone.kb)[0].getBoundingClientRect();
      const nameAt = (x, y) => {
        const hit = document.elementFromPoint(x, y);
        const k = hit && hit.closest('.k');
        return k && phone.kb.keysEl.contains(k) ? k.querySelector('.kn').textContent : null;
      };
      // 🔴 BOTH SIDES, AND THE RIGHT ONE IS THE HARD ONE. A sharp straddles two
      // whites, and the white on its RIGHT comes LATER in the DOM, so with
      // equal stacking that one paints over the sharp and takes the note.
      // MEASURED by setting `z-index: 0` on the sharps: a one-sided version of
      // this assert stayed green, because the left half is covered by DOM order
      // alone and only the right half needs the z-index at all.
      const overC = nameAt(b0.left + 2, b0.top + 6);
      const overD = nameAt(b0.right - 2, b0.top + 6);
      const belowL = nameAt(b0.left + 2, b0.bottom + 8);
      const belowR = nameAt(b0.right - 2, b0.bottom + 8);
      d.assert('where a raised sharp covers a white key the sharp wins, on BOTH sides, and only where it covers',
        overC === 'C#4' && overD === 'C#4' && belowL === 'C4' && belowR === 'D4',
        `over its left white: ${overC} · over its right white: ${overD} · `
        + `below it: ${belowL} then ${belowR}`);
    }

    // ── 🔴 A SWIPE SCROLLS AND PLAYS NOTHING; A PRESS PLAYS AND THEN SLIDES ─
    // The two halves are one assert because they are one rule: *"drag to play
    // happens when playing is there"*. Splitting them would let a keyboard that
    // plays nothing at all pass the first half.
    {
      phone.log.length = 0;
      phone.kb.keysEl.scrollLeft = 0;
      const start = lowOn(whitesOf(phone.kb)[0]);
      // A swipe: lands and leaves before the verdict.
      // ⚠️ IT WAITS OUT THE VERDICT WINDOW BEFORE READING THE COUNT, or the
      // whole half is vacuous. MEASURED by disabling the distance test: with
      // the reading taken in the same tick the assert stayed green, because
      // nothing has sounded yet in EITHER case that early. What proves the
      // gesture was abandoned is that the verdict comes and goes in silence.
      touch(phone.kb, 'pointerdown', start, 41);
      touch(phone.kb, 'pointermove', { x: start.x + SWIPE_PX + 6, y: start.y }, 41);
      touch(phone.kb, 'pointermove', { x: start.x + 160, y: start.y }, 41);
      await frames(4);
      const swipeNotes = phone.log.length;
      touch(phone.kb, 'pointerup', { x: start.x + 160, y: start.y }, 41);
      const swipeTotal = phone.log.length;
      // a press: lands and stays past the verdict, then slides
      phone.log.length = 0;
      touch(phone.kb, 'pointerdown', start, 42);
      const beforeVerdict = phone.log.length;
      await frames(4);
      const afterVerdict = phone.log.join(' ');
      touch(phone.kb, 'pointermove', lowOn(whitesOf(phone.kb)[1]), 42);
      touch(phone.kb, 'pointermove', lowOn(whitesOf(phone.kb)[2]), 42);
      touch(phone.kb, 'pointerup', lowOn(whitesOf(phone.kb)[2]), 42);
      const slid = phone.log.join(' ');
      d.assert('a finger that leaves at once is a swipe and is silent; one that stays plays, and then slides',
        swipeNotes === 0 && swipeTotal === 0 && beforeVerdict === 0 && afterVerdict === 'on60'
        && slid === 'on60 off60 on62 off62 on64 off64',
        `swipe: ${swipeTotal} note(s) · press: nothing at ${SWIPE_PX}+ px, "${afterVerdict}" after the verdict, `
        + `then "${slid}"`);
    }

    // ⚠️ AND A MOUSE NEVER WAITS. Nothing on a desktop can take a drag away, so
    // there is no verdict to wait for and the note is immediate. Without this
    // the frame-counted window could be applied to every pointer and only a
    // person with a mouse would notice.
    {
      phone.log.length = 0;
      const p0 = lowOn(whitesOf(phone.kb)[3]);
      touch(phone.kb, 'pointerdown', p0, 43, 'mouse');
      const atOnce = phone.log.join(' ');
      touch(phone.kb, 'pointermove', lowOn(whitesOf(phone.kb)[4]), 43, 'mouse');
      touch(phone.kb, 'pointerup', lowOn(whitesOf(phone.kb)[4]), 43, 'mouse');
      d.assert('a mouse sounds its note on the way down and glissandos with no wait at all',
        atOnce === 'on65' && phone.log.join(' ') === 'on65 off65 on67 off67',
        `on pointerdown: "${atOnce || '(nothing)'}" · whole gesture: "${phone.log.join(' ')}"`);
    }

    // 🔴 AND `notes off` HAS TO REACH IT, BECAUSE IT IS THE WHOLE SAFETY STORY.
    // The finger is left DOWN across the press, which is the case that was
    // wrong first: the pointer kept its key and re-pressed it on the next move.
    // ⚠️ IT READS THE LIT KEY BEFORE PRESSING, OR IT PASSES VACUOUSLY: nothing
    // lit afterwards is also what a keyboard that never sounded reports, and
    // that is exactly the state overlapping holders once put it in.
    const panicky = build(390, 260);
    {
      const p0 = lowOn(whitesOf(panicky.kb)[0]);
      touch(panicky.kb, 'pointerdown', p0, 21, 'mouse');
      const started = panicky.kb.keysEl.querySelectorAll('.k.down').length;
      panicky.kb.padButtons[2].click();
      const stopped = panicky.kb.keysEl.querySelectorAll('.k.down').length;
      panicky.log.length = 0;
      touch(panicky.kb, 'pointermove', lowOn(whitesOf(panicky.kb)[1]), 21, 'mouse');
      touch(panicky.kb, 'pointerup', lowOn(whitesOf(panicky.kb)[1]), 21, 'mouse');
      d.assert('notes off stops everything even with a finger still on the keys, and the finger cannot start it again',
        started === 1 && stopped === 0 && panicky.log.length === 0,
        `${started} key lit by the finger, ${stopped} left after notes off · `
        + `${panicky.log.length} notes from the finger that was still down`);
    }

    for (const p of probes) p.kb.destroy();

    /**
     * 🔴 THE WAY BACK OUT, AND IT IS LAST ON PURPOSE. Two of the three checks
     * below really cover the screen: the faux path puts `overflow: hidden` on
     * the document and lays a fixed cover over everything, which is a state no
     * geometry check above would be measuring a visitor's page in. So they run
     * after every other check has had its answer.
     *
     * 🔴 AND THE EXIT IS PROVED BY PRESSING IT. `/blocks/` had a way out that
     * was built, compiled and drawn every frame and never once updated, so
     * there was no way out at all while every line of it read correct. Reading
     * that a control is wired is not the same claim as pressing it.
     */
    {
      /**
       * 🔴 FADED MUST MEAN UNPRESSABLE, WHICH IS THE ONE THING `opacity: 0`
       * DOES NOT SAY. Without `pointer-events: none` the bottom right corner of
       * a picture exits full screen for somebody reaching past it, on a control
       * they cannot see. MEASURED HERE RATHER THAN READ OUT OF THE STYLESHEET,
       * because a rule that is present and inert reads exactly like one that
       * works.
       * ⚠️ PROVED BY BREAKING IT, 2026-09-19: with `pointer-events: none` taken
       * off the faded rule in shell.css this reads `up auto, faded auto at
       * opacity 0` and goes red, while everything else on the page stays green.
       * ⚠️ AND IT IS A THROWAWAY PIECE WITH A SHORT IDLE, off screen, rather
       * than the specimen. The shipped wait is EXIT_IDLE_MS, and a check that
       * sat still for that long mid-block would fall off the end of the
       * harness's collector, which stops 400 ms after the last assert.
       * `.pos-full` is what both real paths set and what `isFull` reads, so the
       * button is in the state it is graded in.
       */
      const probeHost = el('div', 'pos-full');
      probeHost.style.cssText = 'position:fixed;left:-9999px;top:0;width:200px;height:120px';
      document.body.append(probeHost);
      const probe = createFullscreenExit(probeHost, { idleMs: 90 });
      const upPE = getComputedStyle(probe.el).pointerEvents;
      await nap(320);                       // the idle, then the 140 ms fade
      const faded = getComputedStyle(probe.el);
      const fadedPE = faded.pointerEvents, fadedOp = Number(faded.opacity);
      document.dispatchEvent(new PointerEvent('pointermove'));
      const backPE = getComputedStyle(probe.el).pointerEvents;
      probe.destroy();
      probeHost.remove();
      d.assert('a faded way out cannot be pressed, and any movement brings it back',
        upPE === 'auto' && fadedPE === 'none' && fadedOp === 0 && backPE === 'auto',
        `up ${upPE}, faded ${fadedPE} at opacity ${fadedOp}, ${backPE} again after a pointer moved, `
        + `on a 90 ms idle against the ${EXIT_IDLE_MS} ms a page gets`);
    }

    if (fsxSpec) {
      const { host, exit, out } = fsxSpec;
      await fsxSpec.go.onclick();
      await nap(200);                       // the 140 ms fade, on its way up
      const hb = host.getBoundingClientRect();
      const bb = exit.el.getBoundingClientRect();
      const cs = getComputedStyle(exit.el);
      const gapR = hb.right - bb.right, gapB = hb.bottom - bb.bottom;
      d.assert('the way out is inside the thing that went full, square, and off its bottom right corner',
        host.contains(exit.el) && Math.abs(bb.width - bb.height) <= 0.6
        && cs.opacity === '1' && cs.pointerEvents === 'auto'
        && gapR >= 10 && gapR < hb.width / 2 && gapB >= 10 && gapB < hb.height / 2,
        `${bb.width.toFixed(1)} by ${bb.height.toFixed(1)} px, ${gapR.toFixed(1)} px off the right edge `
        + `and ${gapB.toFixed(1)} off the bottom, inside the cover`);

      exit.el.click();
      await nap(160);
      const stillFull = fsIsFull(host);
      const stillHost = document.documentElement.classList.contains('pos-faux-host');
      d.assert('pressing it gives the screen back, which is the half that cannot be read off the source',
        !stillFull && !stillHost && out.textContent === 'came back',
        stillFull ? 'it was pressed and the cover is still there'
          : `the cover is gone, the page scrolls again, and the specimen says "${out.textContent}"`);
    }
  }

  /**
   * 🔴 THE MIDI LOG, GRADED HERE BECAUSE THIS IS THE PAGE THAT CAN SEE ALL OF
   * IT AT ONCE. Seven messages went into the specimen and two of them are a
   * clock byte and an active sensing byte.
   */
  if (kitMidiLog) {
    d.assert('the log listed five of seven and refused both floods',
      kitMidiListed === 5 && kitMidiLog.count() === 5,
      `${kitMidiListed} added, ${kitMidiLog.count()} rows, of ${kitMidi.length} messages`);

    // ⚠️ THE NEGATIVE HALF. A component that listed everything would pass the
    // line above by counting differently, so this reads the rendered text.
    const text = kitMidiLog.el.textContent;
    d.assert('and neither flood byte is anywhere in the rendered table',
      !text.includes('F8') && !text.includes('FE'), 'looked for F8 and FE');

    d.assert('every row kept its raw bytes beside the reading',
      text.includes('90 3C 64') && text.includes('C4, velocity 100'),
      'looked for the hex and the reading of one note on');

    // A pitch bend is the case where a reading and its bytes disagree most:
    // little endian, fourteen bit, centre 8192.
    d.assert('a pitch bend is listed as its bytes and read as its value',
      text.includes('E0 00 40') && text.includes('8192'),
      'looked for E0 00 40 and 8192');
  }

  d.ready();

</script>
</html>
