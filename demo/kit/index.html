    d.assert('exactly the two unsettled states move, and they move nothing but opacity',
      moving.join(',') === 'checking,coming' && only,
      `${moving.length ? moving.join(', ') : 'nothing'} moves · ${name || 'no keyframes'} touches `
      + `${props.size ? [...props].join(', ') : 'nothing this page can read'}`);
  }

  // the four states are told apart by the DOT, not by the word beside it.
  // Two states that differ only in their label are two states nobody reads,
  // which undoes the whole reason there are four. Measured ink: the ring's
  // colour, the fill's colour, the fill's opacity and whether it moves.
  {
    const ink = (s) => {
      const dot = presSpec.get(s).querySelector('.pos-pres-dot');
      const a = getComputedStyle(dot, '::after');
      return [getComputedStyle(dot).borderTopColor, a.backgroundColor,
        Math.round(Number(a.opacity)), a.animationName || 'none'].join(' ');
    };
    const inks = PRESENCE_STATES.map(ink);
    d.assert('and the five are told apart by the dot alone, with the word covered up',
      new Set(inks).size === PRESENCE_STATES.length,
      PRESENCE_STATES.map((s, i) => `${s}: ${inks[i]}`).join(' · '));
  }

  // 🔴 A DOT WHOSE MEANING IS ONLY A COLOUR IS A DOT A SCREEN READER
  // CANNOT READ. `display: none` on the word is how that happens by accident,
  // so the embedded mode CLIPS it instead: still in the accessibility tree,
  // still in the live region, and out of the flow so it costs the host nothing.
  {
    const dotMode = document.querySelector('.kit-box .pos-pres[data-mode="dot"]');
    const wordEl = dotMode?.querySelector('.pos-pres-w');
    const readable = !!wordEl && getComputedStyle(wordEl).display !== 'none'
      && wordEl.textContent.trim().length > 0;
    const wide = dotMode ? dotMode.getBoundingClientRect().width : -1;
    d.assert('an embedded dot still says its state in words, and still takes only a dot of room',
      readable && wide > 0 && wide <= 10,
      dotMode ? `says "${wordEl.textContent}", lays out ${wide.toFixed(1)} px wide`
              : 'no embedded dot was found, so nothing was compared');
  }

  // 🔴 NOTHING DRAGS THE PAGE SIDEWAYS. `min-width: 0` missing from a
  // scrolling row makes it push the whole document instead of scrolling inside
  // itself: MEASURED at 390 px, a tabs row produced 141 px of page overflow.
  // The document, not the element, is the thing to measure, because the element
  // looks fine in exactly the case that is broken.
  const over = document.documentElement.scrollWidth - document.documentElement.clientWidth;
  d.assert('no block drags the page sideways',
    over <= 0,
    over <= 0 ? `${document.documentElement.clientWidth} px wide, nothing overflowing`
              : `${over} px of horizontal overflow`);

  // 🔴 JOINED IS ONE SURFACE, AND IT TAKES TWO MEASUREMENTS TO SAY SO.
  // A border is the easiest thing in this arrangement to draw twice: the
  // readout and the log both carry `border: 1px solid var(--line)` of their
  // own on every other page, and the joined box has to take those off or the
  // log sits inside a double rule with a stray line under the readout.
  // ⚠️ THE SEAM CANNOT SEE THAT, WHICH IS WHY THE WIDTHS ARE READ TOO.
  // MEASURED by putting the defect back on purpose: with the inner borders
  // restored the seam still read **1.0 px** and only the widths moved, 0 and 0
  // to 1 and 1 — because a border is drawn INSIDE the box's own rectangle, so
  // two halves 1 px apart stay 1 px apart however thick their edges are. The
  // seam proves the gap is the mosaic's, the widths prove there is one edge.
  const px = (e, side) => Number.parseFloat(getComputedStyle(e)[`border${side}Width`]);
  // ⚠️ AND THE SECOND HALF OF WHAT JOINED MEANS IS WHERE IT SITS: at the FOOT,
  // under the BIG gap rather than the small one between two ordinary rows.
  // There is ONE gap in this project, 40 px, and this surface takes it like
  // everything else. It is stated on `.pos-report` as well as on `.pos-body`'s
  // bottom margin because the surface sits outside the body, where the rhythm
  // on that element's children cannot reach it; the two collapse rather than
  // add.
  {
    const rep = joinedSpec?.foot;
    const ro = joinedSpec?.readoutEl.getBoundingClientRect();
    const lo = joinedSpec?.logEl.getBoundingClientRect();
    const seam = ro && lo ? lo.top - ro.bottom : -1;
    const foot = rep && joinedPage
      ? rep.getBoundingClientRect().top - joinedPage.getBoundingClientRect().bottom : -1;
    const outer = rep ? px(rep, 'Top') : -1;
    const inner = joinedSpec ? [px(joinedSpec.readoutEl, 'Bottom'), px(joinedSpec.logEl, 'Top')] : [-1, -1];
    d.assert('joined is one box at the foot of the page, with the two halves one pixel apart',
      !!rep && rep.classList.contains('pos-report')
      && rep.contains(joinedSpec.readoutEl) && rep.contains(joinedSpec.logEl)
      && Math.abs(seam - 1) <= 0.5 && Math.abs(foot - 40) <= 0.5
      && outer === 1 && inner[0] === 0 && inner[1] === 0,
      `${foot.toFixed(1)} px under the page · seam ${seam.toFixed(1)} px · `
      + `one edge of ${outer} px round both, ${inner.join(' and ')} inside`);
  }

  // and the default is still two surfaces with the page between them. The
  // readout is part of the flow above the body and takes the SMALL gap; the log
  // is the foot and takes the BIG one, which is the same gap a joined report
  // gets, so the two arrangements agree about where the page ends.
  // ⚠️ THE TWO GAPS COME FROM DIFFERENT RULES AND ONLY ONE OF THEM IS THE
  // READOUT'S. Above the page it is `.pos-readout`'s own bottom margin; below
  // the page it is `.pos-body`'s, which is why the stand-in in that block IS a
  // `.pos-body`. The log asks for nothing — a `.pos-log { margin-top: 22px }`
  // stood in shell.css and was inert, beaten by a `margin` shorthand later in
  // the same file, and this measurement is what found it.
  {
    const mid = splitPage?.getBoundingClientRect();
    const ro = splitSpec?.readoutEl.getBoundingClientRect();
    const lo = splitSpec?.logEl.getBoundingClientRect();
    const above = mid && ro ? mid.top - ro.bottom : -1;
    const below = mid && lo ? lo.top - mid.bottom : -1;
    const own = splitSpec ? px(splitSpec.readoutEl, 'Top') === 1 && px(splitSpec.logEl, 'Top') === 1 : false;
    d.assert('split leaves two surfaces, with the page\u2019s one gap above and below',
      own && splitSpec.report === null
      && !splitSpec.readoutEl.closest('.pos-report') && !splitSpec.logEl.closest('.pos-report')
      && Math.abs(above - 40) <= 0.5 && Math.abs(below - 40) <= 0.5,
      `${above.toFixed(1)} px above the page and ${below.toFixed(1)} px below it, ${own ? 'two edges' : 'NOT two edges'}`);
  }

  // 🔴 HALF A SURFACE IS NOT HALF A BOX. A page that declares no readout
  // and joins anyway must get one bordered box holding a log, with no seam and
  // no empty strip where the cells would have been. A `display: none` child
  // takes no `gap` in a flex column, so the log starts exactly one border
  // inside the box; anything else means the hidden row is still taking room.
  {
    const rep = logOnlySpec?.foot;
    const drop = rep ? logOnlySpec.logEl.getBoundingClientRect().top - rep.getBoundingClientRect().top : -1;
    const gone = logOnlySpec ? getComputedStyle(logOnlySpec.readoutEl).display === 'none' : false;
    d.assert('a joined surface with no readout is one box with no seam in it',
      !!rep && gone && Math.abs(drop - 1) <= 0.5,
      `the log starts ${drop.toFixed(1)} px inside the box, which is its edge and nothing else`);
  }

  // 🔴 AND WITH NEITHER HALF, NO BOX. This is the `/typist/` defect in the
  // joined arrangement: an empty container painting its own two borders as a
  // full-width band nobody wrote. `createReport` returns no surface at all, so
  // there is nothing for a page to append and nothing to paint.
  d.assert('and with neither half to draw, nothing is put on the page at all',
    !!neitherSpec && neitherSpec.foot === null && neitherSpec.report === null
    && !document.body.contains(neitherSpec.readoutEl) && !document.body.contains(neitherSpec.logEl),
    neitherSpec && neitherSpec.foot === null
      ? 'no surface was returned, so there is no box to paint'
      : 'an empty surface was returned and would draw its own two edges');

  // 🔴 THE GAP IS THE STACK'S, AND A BLOCK CANNOT ARGUE WITH IT. The third
  // specimen carries `margin: 0 0 10px` in this page's own stylesheet, which
  // loads AFTER shell.css — the exact shape that put a keyboard flush against a
  // transport bar on `/keys/` and measured 0.0 px. A shorthand's implied
  // `margin-top: 0` is (0,1,0) and the stack's rule is (0,2,0), so it loses on
  // weight rather than on source order, which is the whole reason the rule is
  // written the way it is.
  // ⚠️ THE NUMBER IS READ OFF THE DOCUMENT, never typed here. A check that
  // types 40 grades this page against a figure it invented; `--pos-gap` is the
  // one place the project states it, so the check has to ask for it too.
  {
    const want = Number.parseFloat(
      getComputedStyle(document.documentElement).getPropertyValue('--pos-gap'));
    const gaps = [];
    for (let i = 1; i < stackBlocks.length; i++) {
      gaps.push(+(stackBlocks[i].getBoundingClientRect().top
        - stackBlocks[i - 1].getBoundingClientRect().bottom).toFixed(1));
    }
    const asked = stackBlocks.length
      ? getComputedStyle(stackBlocks[stackBlocks.length - 1]).marginTop : '?';
    d.assert('every block in a stack is one gap from the one before it, whatever margin it carries',
      Number.isFinite(want) && want > 0 && gaps.length === 2
      && gaps.every((g) => Math.abs(g - want) <= 0.5),
      `--pos-gap is ${want} px and the gaps read ${gaps.join(' and ')} px · `
      + `the block asking for margin-top 0 computes ${asked}`);
  }

  // 🔴 AND A BLOCK WITH NOTHING IN IT TAKES NO GAP. This is the `/typist/`
  // band in a third costume: an empty container that draws nothing and still
  // spends a screenful of air, or paints its own two borders as a rule nobody
  // wrote. Two blocks with an unfilled one between them must sit ONE gap apart,
  // not two — and the unfilled one must be out of the layout entirely rather
  // than merely invisible, which is the difference the display value reports.
  {
    const want = Number.parseFloat(
      getComputedStyle(document.documentElement).getPropertyValue('--pos-gap'));
    const kids = emptySpec ? [...emptySpec.el.children] : [];
    const across = kids.length === 3
      ? +(kids[2].getBoundingClientRect().top - kids[0].getBoundingClientRect().bottom).toFixed(1) : -1;
    const gone = emptyBlock ? getComputedStyle(emptyBlock).display === 'none' : false;
    d.assert('a block that never got filled takes no room and no gap',
      gone && kids.length === 3 && Math.abs(across - want) <= 0.5,
      `the two blocks around it are ${across} px apart, which is one gap of ${want} px · `
      + `the empty one computes display ${emptyBlock ? getComputedStyle(emptyBlock).display : '?'}`);
  }

  // 🔴 THE KEYBOARD UNDER A FINGER, WHICH IS THE ONE THING ABOUT IT THIS
  // MACHINE CANNOT SIT DOWN AT.
  //
  // ⚠️ EVERY CHECK BELOW IS BEHIND `?selfcheck=1`, because every one of them
  // builds a keyboard over the page and presses its keys. A visitor gets none
  // of it, which is the standing rule and not a judgement about how cheap this
  // particular block is.
  //
  // ⚠️ AND THEY BUILD THEIR OWN KEYBOARDS RATHER THAN DRIVING THE SPECIMEN.
  // The specimen sits in a box that is ~656 px wide on a laptop and 328 px on a
  // phone, and the phone layout is the thing to grade. A throwaway one in a
  // holder of a stated width asks the question directly.
  // ⚠️ THE FLAG IS `shell/selfcheck.mjs`'s NOW, read the same way on every page
  // rather than re-derived here. Same value, same moment, one place to grep.
  if (SELFCHECK) {
    // ⚠️ THE MEASURING WINDOW STAYS OPEN ACROSS THIS BLOCK AND THE WATCHDOG
    // STANDS DOWN FOR IT. Everything in here waits — for a fade, for a
    // keyboard's verdict, for a cover to come up — so frames WILL be rendered
    // with every part laid out, and none of them is rendered for a visitor,
    // because a visitor never enters this block at all. The counter comes back
    // on at the end so it still covers the run to `ready()`.
    watching = false;
    const { createKeyboard, KEY_MIN_PX, BLACK_RATIO, SWIPE_PX } = await import('/shell/keyboard.mjs');
    const nap = (ms) => new Promise((r) => setTimeout(r, ms));
    const frames = (n) => new Promise((r) => {
      const step = () => (--n <= 0 ? r() : requestAnimationFrame(step));
      requestAnimationFrame(step);
    });
    /**
     * 🔴 THE FOOTER UNDER THE STRIP, WRITTEN AT IT AND MEASURED. Everything
     * below this line puts words in a box a visitor is looking at, moves a row
     * of buttons between two parents, or covers the screen, so it is behind
     * `?selfcheck=1` with the rest. The claim is the one the ask is about: it is
     * rewritten on every hover change, so it must not be able to change its own
     * height while somebody reads it.
     * ⚠️ IT IS FED THE STRIP'S OWN `hit` SHAPE, `{ detail: [...] }`, which is
     * what `describe()` hands `onHover`. A check that called some other entry
     * point would grade a path no pointer ever takes.
     */
    if (footSpec?.footer) {
      /**
       * 🔴 THE CHECK BUILDS ITS OWN FOOTER RATHER THAN GRADING THE SPECIMEN.
       * The specimen was asked to be ONE line on 2026-09-20, *"1 line footer
       * here"*, and both checks below read the SECOND row: one asserts six
       * things are cut to `lines`, the other that a name too long for row 0
       * does not push row 1 out of a box that is still the same height. Against
       * a one line footer the second row is `undefined`, so the check did not
       * fail, it THREW, and took the whole page down with a TypeError about
       * `startsWith` that named no block.
       * ⚠️ **A CHECK MUST NOT DECIDE WHAT A SPECIMEN LOOKS LIKE.** That is this
       * project's rule about a check that mutates, arriving from the other
       * side: there a check destroyed the thing it graded, here it would have
       * dictated it. Three lines is what the BEHAVIOUR needs, so the check
       * makes three lines and puts them back.
       * ⚠️ IT IS APPENDED AND THEN REMOVED, because both asserts measure a
       * height and a detached element has none.
       */
      const f = createStripFooter({ lines: 3 });
      footSpec.el.parentElement.append(f.el);
      const h = () => f.el.getBoundingClientRect().height;
      const idle = h();
      f.set({ detail: ['takes  0:03.2'] });
      const one = h();
      f.set({ detail: ['a', 'b', 'c', 'd', 'e', 'f'] });
      const six = h();
      const shown = f.says();
      f.set(null);
      const back = h();
      const empty = f.says()[0];
      d.assert('the box under the strip is one height saying six things, one thing, or nothing',
        idle > 0 && Math.abs(one - idle) < 0.5 && Math.abs(six - idle) < 0.5
        && Math.abs(back - idle) < 0.5 && shown.length === f.lines
        && shown[0] === 'a' && shown[1] === 'b' && empty === STRIP_FOOTER_EMPTY,
        `${idle.toFixed(1)} px empty, ${one.toFixed(1)} with one line, ${six.toFixed(1)} with six, `
        + `${back.toFixed(1)} back to nothing, ${f.lines} lines kept of six, and it says "${empty}"`);

      // 🔴 A NAME TOO LONG ELLIPSISES RATHER THAN WRAPPING, and that is the
      // half a height check cannot see: a wrapped first line pushes the second
      // one out of a box that is still exactly as tall as it was. Photographed
      // on `/reel/`, where a title was cut mid word inside the tooltip.
      // ⚠️ LONG ENOUGH ON ANY SCREEN, not long enough on this one. The real
      // title that was photographed being cut is about seventy characters and
      // FITS a laptop's box, so a check built on it would have passed here and
      // failed nowhere while the defect it is about lives on a phone.
      const long = `${'PÄEVAKAJA. Kaevanduse miiti ja muud, '.repeat(8)}lõpp`;
      f.set({ detail: [long, 'the second line, which must survive it'] });
      const row0 = f.el.firstElementChild;
      const cut = row0.scrollWidth - row0.clientWidth;
      const tall = h();
      const second = f.says()[1];
      f.set(null);
      d.assert('a name too long for the box is cut off at the edge, not wrapped onto the line below',
        cut > 0 && Math.abs(tall - idle) < 0.5 && second.startsWith('the second line'),
        `${long.length} characters running ${cut} px past a ${row0.clientWidth} px line, still `
        + `${tall.toFixed(1)} px tall, and the line under it reads "${second}"`);
      f.el.remove();

      // And the specimen on the page really is the one line that was asked for.
      d.assert('the footer on show is one line, which is what this specimen was asked to be',
        footSpec.footer.lines === 1, `${footSpec.footer.lines} line(s)`);
    }

    /**
     * 🔴 THE SECOND STOREY IS THE PAGE'S OWN ROW, MOVED, AND THERE IS ONE OF IT.
     * Asked 2026-09-19: *"extend videopanel footer in fullscreen so it can have
     * section below the footer bar (separaet with line). put controlgroup
     * there"*, and the thing that would quietly go wrong is a second copy, which
     * is two rows of buttons that can disagree about which option is chosen.
     * ⚠️ IT GOES FULL BY THE CLASS, NOT BY ASKING THE BROWSER. `.pos-full` is
     * what BOTH real paths set and what `isFull` reads, so this is the state
     * itself rather than a stand-in for it. Asking for real would put a cover
     * over the page in the middle of the checks that follow.
     */
    if (vpStorey && vpUnder) {
      const p = vpStorey;
      const home = vpUnder.parentNode;
      vpUnder.dataset.kit = 'storey';
      p.el.classList.add('pos-full');
      p.mode('footer');                       // re-applies, which syncs the move
      const lifted = vpUnder.parentNode;
      const rows = getComputedStyle(p.el).gridTemplateRows.split(/\s+/).filter(Boolean).length;
      const copies = document.querySelectorAll('[data-kit="storey"]').length;
      p.el.classList.remove('pos-full');
      p.mode('footer');
      const returned = vpUnder.parentNode;
      delete vpUnder.dataset.kit;
      d.assert('the second storey holds the page’s own control row, moved, and puts it back',
        lifted?.classList.contains('pos-vp-under') && p.el.contains(lifted)
        && rows === 3 && copies === 1 && returned === home,
        `${copies} of it in the document, ${rows} storeys while full, `
        + `and it came back to the ${returned === home ? 'same' : 'wrong'} parent`);
    }

    const probes = [];
    // On top of the page and out of the flow: it must be hit-testable, since
    // `document.elementFromPoint` is what decides which key a finger is on, and
    // a holder below the fold has no points to test.
    // 🔴 AND THEY MUST NOT OVERLAP EACH OTHER. The first version stacked them
    // all at `top: 0`, so the LAST one built was the one under every point and
    // three checks measured "no note was produced at all" about keyboards that
    // were working, with the width asserts passing either way because those
    // read geometry rather than hit-test it. `top` is an argument.
    const build = (width, top, opts = {}) => {
      const holder = el('div', '', null);
      holder.style.cssText = `position:fixed;top:${top}px;left:0;z-index:9999;width:${width}px;background:var(--bg)`;
      document.body.append(holder);
      const log = [];
      const kb = createKeyboard(holder, {
        base: 60, ...opts,
        onDown: (n) => { kb.lightNote(n, true); log.push(`on${n}`); },
        onUp: (n) => { kb.lightNote(n, false); log.push(`off${n}`); },
      });
      probes.push({ kb, holder, log });
      return { kb, holder, log };
    };
    const keyEls = (kb) => [...kb.keysEl.querySelectorAll('.k')];
    const whitesOf = (kb) => keyEls(kb).filter((k) => !k.classList.contains('sharp'));
    const blacksOf = (kb) => keyEls(kb).filter((k) => k.classList.contains('sharp'));
    // ⚠️ LOW ON THE KEY, CLEAR OF THE BLACKS. A point at a white key's centre is
    // inside a raised black one near the top; every gesture below aims at the
    // bottom third, which is white and nothing else.
    const lowOn = (e) => { const r = e.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.bottom - 12 }; };
    const touch = (kb, type, p, id = 3, kind = 'touch') => kb.keysEl.dispatchEvent(new PointerEvent(type, {
      bubbles: true, pointerId: id, pointerType: kind, clientX: p.x, clientY: p.y, isPrimary: true }));

    const phone = build(390, 0);
    const desk = build(1100, 130);

    // ── the width, and the negative control that proves it is a FLOOR ───────
    // MEASURED before any of this: 24.77 px a key at 390 CSS px, then 74, now
    // 49 on instruction. The pair of arms matters more than either number: a
    // fixed width would pass the first and fail the second.
    const phoneW = whitesOf(phone.kb)[0].getBoundingClientRect().width;
    const deskW = whitesOf(desk.kb)[0].getBoundingClientRect().width;
    const rowScrolls = phone.kb.keysEl.scrollWidth - phone.kb.keysEl.clientWidth;
    const deskScrolls = desk.kb.keysEl.scrollWidth - desk.kb.keysEl.clientWidth;
    const pushes = phone.holder.scrollWidth - phone.holder.clientWidth;
    d.assert('on a phone a white key is a finger wide and the ROW scrolls, never the page',
      phoneW >= KEY_MIN_PX - 0.5 && phoneW < KEY_MIN_PX + 2 && rowScrolls > 20 && pushes <= 1,
      `390 px holder · ${phoneW.toFixed(2)} px a white key, ${rowScrolls} px of row to scroll, `
      + `${pushes} px pushed sideways`);
    d.assert('NEGATIVE CONTROL: it is a floor, so a wide one still divides the room and does not scroll',
      deskW > KEY_MIN_PX && deskScrolls <= 1,
      `1100 px holder · ${deskW.toFixed(2)} px a white key, ${deskScrolls} px of row to scroll`);

    // ── the sharps: raised, narrower, and centred on the joins ─────────────
    {
      const w = whitesOf(phone.kb).map((e) => e.getBoundingClientRect());
      const b = blacksOf(phone.kb).map((e) => e.getBoundingClientRect());
      const shorter = b.every((r) => r.height < w[0].height - 10);
      const narrower = b.every((r) => Math.abs(r.width / w[0].width - BLACK_RATIO) < 0.02);
      const aligned = b.every((r) => r.top === w[0].top);
      /* ⚠️ THE COUNTS COME OFF `QWERTY_CHROMATIC` RATHER THAN FROM TWO
         LITERALS, AND THAT IS WHY. This said `8 white and 5 black`, which was
         true for as long as the letter row was one octave and its top C; `l`
         was added on 2026-09-23 and the specimen grew a ninth white key, so a
         check about the SHAPE of a sharp went red over a number that has
         nothing to do with sharps. A count typed twice is a count that will
         disagree with the thing it counts. */
      const wantBlack = Object.keys(QWERTY_CHROMATIC).filter((k) => SHARP_KEYS.has(k)).length;
      const wantWhite = Object.keys(QWERTY_CHROMATIC).length - wantBlack;
      d.assert('the sharps are raised: shorter than a white key, narrower, and sitting on its top edge',
        w.length === wantWhite && b.length === wantBlack && shorter && narrower && aligned,
        `${w.length} white and ${b.length} black · white ${w[0].width.toFixed(1)}x${w[0].height} · `
        + `black ${b[0].width.toFixed(1)}x${b[0].height}, ${(b[0].width / w[0].width).toFixed(3)} of a white`);
      /**
       * 🔴 THE WHITE KEYS ARE LEFT EQUAL, WHICH IS WHAT THE OFFSETS ARE FOR AND
       * IS NOT WHAT THIS CHECK USED TO SAY. It asserted that every black key
       * CENTRES on the join, which was the defect: seven whites sharing five
       * blacks cannot both sit on their joins and leave the whites equal, and
       * centring made the narrowest strip 0.401 of a white against 0.551 with
       * the piano's offsets. The old check passed the whole time and could only
       * ever have failed if the offsets were added, which they now are, so it
       * went red at 7.33 px — exactly the intended shift.
       * ⚠️ MEASURE THE THING THE CHANGE IS FOR. The strip a finger has between
       * two black keys is the quantity; where a black key's centre sits is one
       * way of getting there and the wrong one to assert.
       */
      const strips = [];
      for (let i = 0; i < w.length; i++) {
        const leftEdge = Math.max(w[i].left, ...b.filter((x) => x.right <= w[i].right && x.right > w[i].left).map((x) => x.right));
        const rightEdge = Math.min(w[i].right, ...b.filter((x) => x.left >= w[i].left && x.left < w[i].right).map((x) => x.left));
        strips.push(rightEdge - leftEdge);
      }
      const narrowest = Math.min(...strips);
      /**
       * ⚠️ THE NARROWEST STRIP IS THE WHOLE CLAIM, and a spread across ALL eight
       * is not: the two outer keys have a black on one side only, so they are
       * wider by construction and always will be. The first version of this
       * check included them and reported a spread of 22 px about a layout that
       * was correct.
       * The number to beat is 0.401 of a white key, which is what centring the
       * black keys gave. GarageBand measures 0.439. This reads 0.551.
       */
      d.assert('and the white key a finger lands on is wide enough to land on',
        narrowest >= w[0].width * 0.5,
        `narrowest strip ${narrowest.toFixed(1)} px, ${(narrowest / w[0].width).toFixed(3)} of a white key, `
        + `against 0.401 when the black keys were centred and 0.439 in GarageBand`);
    }

    // ── 🔴 THE OVERLAP, WHICH IS A HIT TEST AND NOT A PICTURE ──────────────
    // A raised black key covers the top corners of both whites beside it, so a
    // point up there is inside two keys at once and only paint order decides
    // which note a finger gets. The assert is here because that is an accident
    // of `z-index` that a future stacking context would undo silently, and the
    // symptom would be a keyboard that plays C when you aim at C sharp.
    {
      const b0 = blacksOf(phone.kb)[0].getBoundingClientRect();
      const nameAt = (x, y) => {
        const hit = document.elementFromPoint(x, y);
        const k = hit && hit.closest('.k');
        return k && phone.kb.keysEl.contains(k) ? k.querySelector('.kn').textContent : null;
      };
      // 🔴 BOTH SIDES, AND THE RIGHT ONE IS THE HARD ONE. A sharp straddles two
      // whites, and the white on its RIGHT comes LATER in the DOM, so with
      // equal stacking that one paints over the sharp and takes the note.
      // MEASURED by setting `z-index: 0` on the sharps: a one-sided version of
      // this assert stayed green, because the left half is covered by DOM order
      // alone and only the right half needs the z-index at all.
      const overC = nameAt(b0.left + 2, b0.top + 6);
      const overD = nameAt(b0.right - 2, b0.top + 6);
      const belowL = nameAt(b0.left + 2, b0.bottom + 8);
      const belowR = nameAt(b0.right - 2, b0.bottom + 8);
      d.assert('where a raised sharp covers a white key the sharp wins, on BOTH sides, and only where it covers',
        overC === 'C\u266f4' && overD === 'C\u266f4' && belowL === 'C4' && belowR === 'D4',
        `over its left white: ${overC} · over its right white: ${overD} · `
        + `below it: ${belowL} then ${belowR}`);
    }

    // ── 🔴 A SWIPE SCROLLS AND PLAYS NOTHING; A PRESS PLAYS AND THEN SLIDES ─
    // The two halves are one assert because they are one rule: *"drag to play
    // happens when playing is there"*. Splitting them would let a keyboard that
    // plays nothing at all pass the first half.
    {
      phone.log.length = 0;
      phone.kb.keysEl.scrollLeft = 0;
      const start = lowOn(whitesOf(phone.kb)[0]);
      // A swipe: lands and leaves before the verdict.
      // ⚠️ IT WAITS OUT THE VERDICT WINDOW BEFORE READING THE COUNT, or the
      // whole half is vacuous. MEASURED by disabling the distance test: with
      // the reading taken in the same tick the assert stayed green, because
      // nothing has sounded yet in EITHER case that early. What proves the
      // gesture was abandoned is that the verdict comes and goes in silence.
      touch(phone.kb, 'pointerdown', start, 41);
      touch(phone.kb, 'pointermove', { x: start.x + SWIPE_PX + 6, y: start.y }, 41);
      touch(phone.kb, 'pointermove', { x: start.x + 160, y: start.y }, 41);
      await frames(4);
      const swipeNotes = phone.log.length;
      touch(phone.kb, 'pointerup', { x: start.x + 160, y: start.y }, 41);
      const swipeTotal = phone.log.length;
      // a press: lands and stays past the verdict, then slides
      phone.log.length = 0;
      touch(phone.kb, 'pointerdown', start, 42);
      const beforeVerdict = phone.log.length;
      await frames(4);
      const afterVerdict = phone.log.join(' ');
      touch(phone.kb, 'pointermove', lowOn(whitesOf(phone.kb)[1]), 42);
      touch(phone.kb, 'pointermove', lowOn(whitesOf(phone.kb)[2]), 42);
      touch(phone.kb, 'pointerup', lowOn(whitesOf(phone.kb)[2]), 42);
      const slid = phone.log.join(' ');
      d.assert('a finger that leaves at once is a swipe and is silent; one that stays plays, and then slides',
        swipeNotes === 0 && swipeTotal === 0 && beforeVerdict === 0 && afterVerdict === 'on60'
        && slid === 'on60 off60 on62 off62 on64 off64',
        `swipe: ${swipeTotal} note(s) · press: nothing at ${SWIPE_PX}+ px, "${afterVerdict}" after the verdict, `
        + `then "${slid}"`);
    }

    // ⚠️ AND A MOUSE NEVER WAITS. Nothing on a desktop can take a drag away, so
    // there is no verdict to wait for and the note is immediate. Without this
    // the frame-counted window could be applied to every pointer and only a
    // person with a mouse would notice.
    {
      phone.log.length = 0;
      const p0 = lowOn(whitesOf(phone.kb)[3]);
      touch(phone.kb, 'pointerdown', p0, 43, 'mouse');
      const atOnce = phone.log.join(' ');
      touch(phone.kb, 'pointermove', lowOn(whitesOf(phone.kb)[4]), 43, 'mouse');
      touch(phone.kb, 'pointerup', lowOn(whitesOf(phone.kb)[4]), 43, 'mouse');
      d.assert('a mouse sounds its note on the way down and glissandos with no wait at all',
        atOnce === 'on65' && phone.log.join(' ') === 'on65 off65 on67 off67',
        `on pointerdown: "${atOnce || '(nothing)'}" · whole gesture: "${phone.log.join(' ')}"`);
    }

    // 🔴 AND `notes off` HAS TO REACH IT, BECAUSE IT IS THE WHOLE SAFETY STORY.
    // The finger is left DOWN across the press, which is the case that was
    // wrong first: the pointer kept its key and re-pressed it on the next move.
    // ⚠️ IT READS THE LIT KEY BEFORE PRESSING, OR IT PASSES VACUOUSLY: nothing
    // lit afterwards is also what a keyboard that never sounded reports, and
    // that is exactly the state overlapping holders once put it in.
    const panicky = build(390, 260);
    {
      const p0 = lowOn(whitesOf(panicky.kb)[0]);
      touch(panicky.kb, 'pointerdown', p0, 21, 'mouse');
      const started = panicky.kb.keysEl.querySelectorAll('.k.down').length;
      panicky.kb.padButtons[2].click();
      const stopped = panicky.kb.keysEl.querySelectorAll('.k.down').length;
      panicky.log.length = 0;
      touch(panicky.kb, 'pointermove', lowOn(whitesOf(panicky.kb)[1]), 21, 'mouse');
      touch(panicky.kb, 'pointerup', lowOn(whitesOf(panicky.kb)[1]), 21, 'mouse');
      d.assert('notes off stops everything even with a finger still on the keys, and the finger cannot start it again',
        started === 1 && stopped === 0 && panicky.log.length === 0,
        `${started} key lit by the finger, ${stopped} left after notes off · `
        + `${panicky.log.length} notes from the finger that was still down`);
    }

    for (const p of probes) p.kb.destroy();

    /**
     * 🔴 THE WAY BACK OUT, AND IT IS LAST ON PURPOSE. Two of the three checks
     * below really cover the screen: the faux path puts `overflow: hidden` on
     * the document and lays a fixed cover over everything, which is a state no
     * geometry check above would be measuring a visitor's page in. So they run
     * after every other check has had its answer.
     *
     * 🔴 AND THE EXIT IS PROVED BY PRESSING IT. `/blocks/` had a way out that
     * was built, compiled and drawn every frame and never once updated, so
     * there was no way out at all while every line of it read correct. Reading
     * that a control is wired is not the same claim as pressing it.
     */
    {
      /**
       * 🔴 FADED MUST MEAN UNPRESSABLE, WHICH IS THE ONE THING `opacity: 0`
       * DOES NOT SAY. Without `pointer-events: none` the bottom right corner of
       * a picture exits full screen for somebody reaching past it, on a control
       * they cannot see. MEASURED HERE RATHER THAN READ OUT OF THE STYLESHEET,
       * because a rule that is present and inert reads exactly like one that
       * works.
       * ⚠️ PROVED BY BREAKING IT, 2026-09-19: with `pointer-events: none` taken
       * off the faded rule in shell.css this reads `up auto, faded auto at
       * opacity 0` and goes red, while everything else on the page stays green.
       * ⚠️ AND IT IS A THROWAWAY PIECE WITH A SHORT IDLE, off screen, rather
       * than the specimen. The shipped wait is EXIT_IDLE_MS, and a check that
       * sat still for that long mid-block would fall off the end of the
       * harness's collector, which stops 400 ms after the last assert.
       * `.pos-full` is what both real paths set and what `isFull` reads, so the
       * button is in the state it is graded in.
       */
      const probeHost = el('div', 'pos-full');
      probeHost.style.cssText = 'position:fixed;left:-9999px;top:0;width:200px;height:120px';
      document.body.append(probeHost);
      const probe = createFullscreenExit(probeHost, { idleMs: 90 });
      const upPE = getComputedStyle(probe.el).pointerEvents;
      await nap(320);                       // the idle, then the 140 ms fade
      const faded = getComputedStyle(probe.el);
      const fadedPE = faded.pointerEvents, fadedOp = Number(faded.opacity);
      document.dispatchEvent(new PointerEvent('pointermove'));
      const backPE = getComputedStyle(probe.el).pointerEvents;
      probe.destroy();
      probeHost.remove();
      d.assert('a faded way out cannot be pressed, and any movement brings it back',
        upPE === 'auto' && fadedPE === 'none' && fadedOp === 0 && backPE === 'auto',
        `up ${upPE}, faded ${fadedPE} at opacity ${fadedOp}, ${backPE} again after a pointer moved, `
        + `on a 90 ms idle against the ${EXIT_IDLE_MS} ms a page gets`);
    }

    if (fsxSpec) {
      const { host, exit, out } = fsxSpec;
      await fsxSpec.go.onclick();
      await nap(200);                       // the 140 ms fade, on its way up
      const hb = host.getBoundingClientRect();
      const bb = exit.el.getBoundingClientRect();
      const cs = getComputedStyle(exit.el);
      const gapR = hb.right - bb.right, gapB = hb.bottom - bb.bottom;
      d.assert('the way out is inside the thing that went full, square, and off its bottom right corner',
        host.contains(exit.el) && Math.abs(bb.width - bb.height) <= 0.6
        /* 🔴 A THRESHOLD, BECAUSE `=== '1'` IS AN EXACT EQUALITY ON AN
           ANIMATING PROPERTY AND THAT IS A RACE THE CHECK WILL EVENTUALLY
           LOSE. MEASURED 2026-09-22, when a busier page put a 140 ms fade at
           **0.998744** after a 200 ms nap. The claim is that the way out is
           VISIBLE, and 0.998744 is visible; nothing here ever wanted the
           difference between that and 1. The faded state it has to be told
           apart from is 0, which no threshold near 1 can reach. */
        && parseFloat(cs.opacity) > 0.9 && cs.pointerEvents === 'auto'
        && gapR >= 10 && gapR < hb.width / 2 && gapB >= 10 && gapB < hb.height / 2,
        /* 🔴 THE DETAIL COULD NOT NAME ITS OWN FAILING CLAUSE AND THE WORDS
           `inside the cover` WERE PRINTED WHETHER OR NOT IT WAS. Measured
           2026-09-22: this went red reporting a square button at the right
           inset, which is every clause it prints, so the fault was in one of
           the two it did not. Six clauses, six facts. */
        `${bb.width.toFixed(1)} by ${bb.height.toFixed(1)} px, ${gapR.toFixed(1)} px off the right edge `
        + `and ${gapB.toFixed(1)} off the bottom, contained ${host.contains(exit.el)}, `
        + `opacity ${cs.opacity}, pointer-events ${cs.pointerEvents}`);

      exit.el.click();
      await nap(160);
      const stillFull = fsIsFull(host);
      const stillHost = document.documentElement.classList.contains('pos-faux-host');
      d.assert('pressing it gives the screen back, which is the half that cannot be read off the source',
        !stillFull && !stillHost && out.textContent === 'came back',
        stillFull ? 'it was pressed and the cover is still there'
          : `the cover is gone, the page scrolls again, and the specimen says "${out.textContent}"`);
    }
    watching = true;
  }

  /**
   * 🔴 THE MIDI LOG, GRADED HERE BECAUSE THIS IS THE PAGE THAT CAN SEE ALL OF
   * IT AT ONCE. Seven messages went into the specimen and two of them are a
   * clock byte and an active sensing byte.
   */
  if (kitMidiLog) {
    d.assert('the log listed five of seven and refused both floods',
      kitMidiListed === 5 && kitMidiLog.count() === 5,
      `${kitMidiListed} added, ${kitMidiLog.count()} rows, of ${kitMidi.length} messages`);

    // ⚠️ THE NEGATIVE HALF. A component that listed everything would pass the
    // line above by counting differently, so this reads the rendered text.
    const text = kitMidiLog.el.textContent;
    d.assert('and neither flood byte is anywhere in the rendered table',
      !text.includes('F8') && !text.includes('FE'), 'looked for F8 and FE');

    d.assert('every row kept its raw bytes beside the reading',
      text.includes('90 3C 64') && text.includes('C4, velocity 100'),
      'looked for the hex and the reading of one note on');

    // A pitch bend is the case where a reading and its bytes disagree most:
    // little endian, fourteen bit, centre 8192.
    d.assert('a pitch bend is listed as its bytes and read as its value',
      text.includes('E0 00 40') && text.includes('8192'),
      'looked for E0 00 40 and 8192');
  }

  /**
   * 🔴 THE SEGMENT DISPLAY, GRADED HERE BECAUSE EVERY CLAIM ABOUT IT IS A
   * COMPARISON BETWEEN TWO FIELDS SIDE BY SIDE. `segment-test.mjs` already
   * grades its arithmetic with no browser at all, so nothing below repeats a
   * question that file can answer. What is left is the half that only a laid
   * out page knows: how wide a box came out, what opacity a rule actually won
   * with, and whether the picture takes a pointer.
   */
  if (dispSpec.size === 6) {
    const svgOf = (k) => dispSpec.get(k).svg.getBoundingClientRect();
    const keys = ['reading', 'narrowest', 'every bar', 'measured zero',
      'nothing measured', 'too wide'];

    /**
     * 🔴 THE BOX IS THE SAME WIDTH WHATEVER IS IN IT, WHICH IS THIS PROJECT'S
     * RULE ABOUT ANYTHING THAT REDRAWS LIVE. Six three digit fields showing
     * `127`, `111`, `888`, `0`, nothing and an overflow, measured against each
     * other rather than against a number typed here. A `1` is the narrowest
     * glyph there is and an `8` the widest, so if a font or a text box had
     * crept in anywhere this is where it would show.
     */
    {
      const ws = keys.map((k) => svgOf(k).width);
      const hs = keys.map((k) => svgOf(k).height);
      const spread = Math.max(...ws) - Math.min(...ws);
      d.assert('a field is the same box showing 111, 888, a zero, nothing and an overflow',
        spread <= 0.05 && Math.max(...hs) - Math.min(...hs) <= 0.05,
        `${ws.length} fields, ${ws[0].toFixed(2)} px wide, spread ${spread.toFixed(3)} px`);
    }

    /**
     * 🔴 NOTHING MEASURED IS BLANK, AND A MEASURED ZERO IS NOT. Two fields the
     * same size, one lit by nothing and one lit by a real `0`, which is the
     * pair that makes the claim mean anything: a display that simply could not
     * draw a zero would satisfy the first half on its own.
     */
    {
      const none = dispSpec.get('nothing measured');
      const zero = dispSpec.get('measured zero');
      d.assert('nothing measured lights nothing, and a measured zero lights six bars',
        none.lit() === 0 && !/[0-9]/.test(none.text()) && zero.lit() === 6,
        `nothing lit ${none.lit()} parts and reads "${none.text()}", `
        + `a zero lit ${zero.lit()}`);
    }

    /**
     * 🔴 AND THE UNLIT BARS ARE STILL DRAWN, WHICH IS THE WHOLE REASON THIS IS
     * DRAWN RATHER THAN SET IN A FONT. The blank field is the specimen for it:
     * every part is off, and every part is still on screen at a faint opacity
     * of the SAME ink as a lit one. Read off the COMPUTED style, because that
     * is the only thing that knows which rule won.
     * ⚠️ THE EXPECTED FIGURE IS READ OFF `--disp-ghost`, NOT TYPED HERE, AND
     * THAT IS A REPAIR RATHER THAN A TIDY-UP. This check named 0.13 until
     * 2026-09-21, when the ghost was raised on instruction (*"ligher noacive
     * segments"*) and the check went red on a stylesheet that was right. A
     * number typed into a check is a second copy of a measurement, and this
     * project's rule is that two copies will disagree. The claim is unchanged:
     * an unlit bar is drawn, it is faint, and it is not the lit one.
     */
    {
      const none = dispSpec.get('nothing measured');
      const all = dispSpec.get('every bar');
      const off = getComputedStyle(none.svg.querySelector('.pos-disp-p'));
      const on = getComputedStyle(all.svg.querySelector('.pos-disp-p.on'));
      const ghost = Number(off.opacity);
      const token = Number(getComputedStyle(document.documentElement)
        .getPropertyValue('--disp-ghost'));
      d.assert('an unlit bar is still drawn, faintly, in the same ink as a lit one',
        ghost > 0.02 && ghost < 0.5 && Math.abs(ghost - token) < 0.001
        && Number(on.opacity) === 1 && off.fill === on.fill,
        `unlit at opacity ${off.opacity} against lit at ${on.opacity}, both ${on.fill} · `
        + `--disp-ghost says ${token}`);
    }

    /**
     * 🔴 THE STYLESHEET AND THE MODULE AGREE ABOUT THE GHOST, AND THEY DID NOT.
     * `--disp-ghost` in shell.css and `SCHEMES.backlit.ghost` in segment.mjs
     * are the same measurement written down twice, and on 2026-09-21 one of
     * them was raised and the other was not: a field drawn with no `scheme`
     * option got 0.13 and the same field drawn with `scheme: 'backlit'` got
     * 0.22, which is one component looking two different ways depending on
     * which of its own defaults a caller happened to name. Nothing could fail.
     * ⚠️ TWO INDEPENDENT SOURCES IS THE WHOLE CHECK, which is the repair this
     * project took from the MIM corpus: one side comes out of the stylesheet
     * and the other out of the module, so the two CAN disagree and say so.
     *
     * 🔴 AND IT COVERS ALL THREE NOW, NOT JUST THE GHOST. Extended 2026-09-21,
     * the day the blue came down: `--disp-ink` and `--disp-back` are the same
     * pair as `SCHEMES.backlit.ink` and `.back`, written down twice in exactly
     * the way the ghost was, and the check that existed watched the one of the
     * three that had already been caught. **A check aimed at the defect that
     * happened is not aimed at the defect that is coming**, and these two moved
     * from `#8fb6ff` on `#0d1830` to a near-neutral pair in one edit. Two of
     * three agreeing is the MIM corpus failure precisely: the halves that were
     * compared moved together while the third sat wrong and silent.
     * ⚠️ COMPARED AS RESOLVED COLOUR, NOT AS TYPED TEXT. A token reads back
     * from `getComputedStyle` however the author spelled it, so `#a8b2be` and
     * `#A8B2BE` are one colour and two strings. The browser is the thing that
     * knows: paint each into an element and read the `color` back.
     */
    {
      const token = Number(getComputedStyle(document.documentElement)
        .getPropertyValue('--disp-ghost'));
      d.assert('the stylesheet’s ghost and the backlit scheme’s are one measurement',
        Math.abs(token - SCHEMES.backlit.ghost) < 0.001,
        `--disp-ghost ${token} against SCHEMES.backlit.ghost ${SCHEMES.backlit.ghost}`);

      /* Resolve a colour the way only a browser can, so a comparison is about
         the colour rather than about how it was spelled. */
      const asColour = (v) => {
        const probe = el('span');
        probe.style.color = v;
        document.body.append(probe);
        const out = getComputedStyle(probe).color;
        probe.remove();
        return out;
      };
      const root = getComputedStyle(document.documentElement);
      const pairs = [['ink', '--disp-ink'], ['back', '--disp-back']].map(([k, tok]) => {
        const fromCss = asColour(root.getPropertyValue(tok).trim());
        const fromJs = asColour(SCHEMES.backlit[k]);
        return { k, tok, fromCss, fromJs, same: fromCss === fromJs };
      });
      d.assert('the stylesheet’s ink and field and the backlit scheme’s are one measurement',
        pairs.every((p) => p.same),
        pairs.map((p) => `${p.tok} ${p.fromCss} against SCHEMES.backlit.${p.k} ${p.fromJs}`).join(' · '));
    }

    /**
     * 🔴 A SCHEME REALLY IS A DIFFERENT DISPLAY, MEASURED AS INK. An option
     * that did nothing would leave two fields side by side looking identical,
     * and nothing else on this page could tell. The three numbers a scheme
     * carries only make sense together, so all three are compared: a reflective
     * field's driven bars are DARKER than its own field rather than brighter,
     * which is the whole difference between a lamp behind the glass and no lamp
     * at all, and its ghost is its own rather than the backlight's.
     * ⚠️ THE DIRECTION IS THE CLAIM, NOT MERELY THE DIFFERENCE. Two schemes
     * that simply disagreed about a colour would pass a check that only asked
     * whether they differ.
     */
    if (dispRefl) {
      const lum = (c) => {
        const [r, g, b] = (c.match(/[\d.]+/g) || [0, 0, 0]).map(Number);
        return 0.2126 * r + 0.7152 * g + 0.0722 * b;
      };
      const back = getComputedStyle(dispRefl.el).backgroundColor;
      const bar = getComputedStyle(dispRefl.svg.querySelector('.pos-disp-p.on')).fill;
      const lit = getComputedStyle(dispSpec.get('reading').svg
        .querySelector('.pos-disp-p.on')).fill;
      const litBack = getComputedStyle(dispSpec.get('reading').el).backgroundColor;
      const ghost = Number(getComputedStyle(dispRefl.el).getPropertyValue('--disp-ghost'));
      d.assert('a reflective field goes dark where it is driven, while a backlit one goes bright',
        lum(bar) < lum(back) && lum(lit) > lum(litBack)
        && Math.abs(ghost - SCHEMES.reflective.ghost) < 0.001
        && dispRefl.text() === '127',
        `reflective: bar ${lum(bar).toFixed(0)} on a field of ${lum(back).toFixed(0)} · `
        + `backlit: bar ${lum(lit).toFixed(0)} on ${lum(litBack).toFixed(0)} · `
        + `ghosts ${ghost} and ${SCHEMES.backlit.ghost}`);
    }

    /**
     * 🔴 NEGATIVE CONTROL, AND IT IS THE ONE A MAP RETURNING "ALL ON" WOULD
     * FAIL. The parts lit in the picture are counted off the DOM; what they
     * are compared against comes out of `GLYPHS`. Two independent sources, so
     * the two can disagree, which is the whole repair from the MIM corpus
     * where both halves of a check were derived from one field.
     */
    {
      const ones = dispSpec.get('narrowest').lit();
      const eights = dispSpec.get('every bar').lit();
      d.assert('NEGATIVE CONTROL: three ones light six bars and three eights light all 21',
        ones === 3 * GLYPHS[1].length && eights === 3 * SEGMENTS.length
        && ones === 6 && eights === 21,
        `111 lit ${ones} parts, 888 lit ${eights} of ${3 * SEGMENTS.length}`);
    }

    /**
     * 🔴 A VALUE TOO WIDE SHOWS DASHES AND KEEPS THE NUMBER WHERE A READER CAN
     * STILL GET AT IT. The defect this was decided against is an odometer
     * printing `234` for 1234, so the check names the wrong answer as well as
     * the right one, and it reads the TOOLTIP, which is the only place the
     * value survives on screen.
     */
    {
      const over = dispSpec.get('too wide');
      const r = over.reading();
      d.assert('a value too wide reads --- and its tooltip still carries the number',
        r.over && over.text() === '---' && over.text() !== '234'
        && over.el.title.includes('1234') && over.el.classList.contains('over')
        && over.lit() === 3,
        `reads "${over.text()}" with ${over.lit()} parts lit, tooltip "${over.el.title}"`);
    }

    /**
     * A decimal point rides the digit to its left and costs no cell, so `12.5`
     * really is on a three digit field. The pure side of that is in
     * `segment-test.mjs`; what is graded here is that the part exists in the
     * picture and that it is the one on the middle digit.
     */
    if (dispDot) {
      const dots = [...dispDot.svg.querySelectorAll('[data-seg="dp"]')];
      const litDots = dots.filter((n) => n.classList.contains('on'));
      d.assert('a decimal point is a part of the middle digit, and the only dot lit',
        dispDot.text() === '12.5' && dots.length === 3 && litDots.length === 1
        && litDots[0] === dots[1],
        `"${dispDot.text()}" on ${dispDot.digits} digits, ${litDots.length} of `
        + `${dots.length} dots lit, on digit ${dots.indexOf(litDots[0])}`);
    }

    /**
     * 🔴 IT IS A PICTURE AND NOT A CONTROL, AND THE TWO HALVES OF THAT ARE ONE
     * ASSERT EACH. The picture takes no pointer while the box around it still
     * does, which is what keeps the tooltip carrying an overflowed value
     * reachable; and nothing in it is selectable, which is the rule a
     * `<canvas>` already lives under here.
     * ⚠️ THE iOS LOUPE HALF IS NOT MEASURED AND THIS CHECK SAYS SO.
     * `-webkit-touch-callout` is a WebKit property, Blink drops it at parse
     * time, and `getComputedStyle(...).webkitTouchCallout` came back
     * **undefined** rather than false, which read as a real failure on a
     * stylesheet that is correct. It is in `shell.css` beside `user-select` and
     * only a WebKit browser can report it, so the claim graded here is the
     * selection one and the callout is named as read.
     */
    {
      const one = dispSpec.get('reading');
      const svgCs = getComputedStyle(one.svg);
      const boxCs = getComputedStyle(one.el);
      const callout = boxCs.getPropertyValue('-webkit-touch-callout') || 'not reported here';
      d.assert('the picture takes no pointer while its box still does, and nothing in it selects',
        svgCs.pointerEvents === 'none' && boxCs.pointerEvents !== 'none'
        && boxCs.getPropertyValue('user-select') === 'none',
        `picture ${svgCs.pointerEvents}, box ${boxCs.pointerEvents}, `
        + `select ${boxCs.getPropertyValue('user-select')}, callout ${callout}`);
    }
  }

  /**
   * 🔴 THE DISTANCE BETWEEN TWO STACKED CONTROLS IS THREE THINGS, AND THIS IS
   * THE FIRST CHECK IN THE REPOSITORY THAT SAYS SO. `/twelve/` was corrected by
   * screenshot twelve times in one evening and every correction was a page
   * doing arithmetic about a component's insides: counting two of the three
   * made a lane 115 px against the 145 it needed, and **the error was exactly
   * one reserved slot**. The kit publishes `--ctl-step` as the sum precisely so
   * nobody adds them up, and until now nothing checked that the sum is what a
   * real pair of pads actually measures.
   * ⚠️ TWO INDEPENDENT SOURCES. One side is the four custom properties read off
   * the document; the other is the rect between two stacked pad BUTTONS in a
   * real grid. They are linked by the stylesheet and not by arithmetic here, so
   * a grid that stopped using the tokens would disagree with them.
   * ⚠️ AND THE BUTTON, NEVER THE WRAPPER. A pad returns its wrapper as `el` and
   * exposes `button` separately; an assert reading the wrapper reported a
   * button 17 px low while the button was exactly right.
   */
  if (stepPads && stepBand) {
    const root = getComputedStyle(document.documentElement);
    const n = (prop) => Number.parseFloat(root.getPropertyValue(prop));
    const head = n('--ctl-head'), foot = n('--ctl-foot'), gap = n('--ctl-gap');
    /**
     * ⚠️ `--ctl-step` IS READ OFF THE BAND DRAWN AT IT, NOT OFF `:root`. It is
     * declared as `calc(var(--ctl-foot) + var(--ctl-gap) + var(--ctl-head))`,
     * and a custom property is SUBSTITUTED rather than computed, so
     * `getPropertyValue` hands back that text and `parseFloat` of it is NaN.
     * This check read NaN for one run. A resolved length only exists once a
     * browser has put the property against something real.
     */
    const step = +Number.parseFloat(getComputedStyle(stepBand).height).toFixed(2);
    const top = stepPads[0].button, below = stepPads[1].button;
    const apart = +(below.getBoundingClientRect().top
      - top.getBoundingClientRect().bottom).toFixed(1);
    d.assert('the distance between two stacked controls is head plus gap plus foot, and --ctl-step is the sum',
      step > 0 && Math.abs(step - (head + gap + foot)) < 0.01
      && apart > 0 && Math.abs(apart - step) <= 0.6,
      `head ${head} + gap ${gap} + foot ${foot} = ${head + gap + foot} px, the band drawn at `
      + `--ctl-step measures ${step}, and two fully labelled pads stack ${apart} px apart`);
  }

  /**
   * 🔴 A SLOT IS RESERVED EVEN WHEN IT IS EMPTY, WHICH IS THE OTHER HALF OF THE
   * CONTRACT AND THE ONE A CALLER BREAKS. A pad with no top label still takes
   * `--ctl-head`, or a grid whose downbeats are named has those pads sitting
   * higher than the rest and it reads as a rendering fault rather than as a
   * labelling choice. Measured as two buttons starting on one line while only
   * one of the two wrappers has anything above it.
   * ⚠️ THE NEGATIVE HALF IS THAT THE TWO WRAPPERS REALLY DIFFER. Two pads that
   * both had a top label, or both had none, would start on the same line for a
   * reason that says nothing about the reservation.
   */
  if (namedPad && barePad) {
    const said = (pd) => (pd.el.querySelector('.pos-pad-top')?.textContent || '').trim();
    const tops = [namedPad.button.getBoundingClientRect().top,
                  barePad.button.getBoundingClientRect().top];
    const off = +Math.abs(tops[0] - tops[1]).toFixed(2);
    d.assert('a pad with nothing above it still reserves the slot, so both buttons start on one line',
      said(namedPad).length > 0 && said(barePad).length === 0
      && tops[0] > 0 && off <= 0.5,
      // ⚠️ THE DETAIL READS BOTH PADS. It said "and the other says nothing" as
      // hardcoded prose, and a sabotage that gave the bare pad a top label took
      // the assert red with a detail still claiming the pad said nothing. A
      // detail is the EVIDENCE for a claim, so it may not restate the claim.
      `one says "${said(namedPad)}" above it and the other says `
      + `"${said(barePad)}", and their buttons start ${off} px apart`);
  }

  /**
   * 🔴 THE PANEL, AND THE FIVE CLAIMS ONLY THIS PAGE CAN MAKE ABOUT IT. Every
   * one reads a real rect or a computed value, and every one has a way of going
   * red that was tried on purpose.
   */
  if (panelWith && panelWithout) {
    /* 1. The two children are ONE DEPTH, and the column is the taller one's
       content. That is contract 3, and it is the claim `/twelve/` was reported
       for with a screenshot: `align-items: flex-end` would make them END
       together and say nothing about their heights, so a check reading only the
       bottoms would pass the arrangement that was wrong. Both edges are read. */
    const f = panelWith.panel.fixed.getBoundingClientRect();
    const st = panelWith.panel.strip.getBoundingClientRect();
    const topOff = +Math.abs(f.top - st.top).toFixed(2);
    const botOff = +Math.abs(f.bottom - st.bottom).toFixed(2);
    d.assert('the fixed column and the strip are one depth, at both ends',
      f.height > 0 && topOff <= 1.5 && botOff <= 1.5
      && +Math.abs(f.height - st.height).toFixed(2) <= 1.5,
      `column ${f.height.toFixed(1)} px against strip ${st.height.toFixed(1)}, `
      + `${topOff} px apart at the top and ${botOff} at the bottom`);

    /* 2. 🔴 THE ABSORBER, WHICH IS THE COMPONENT'S CENTRAL PROMISE AND WAS
       GRADED BY NOTHING ANYWHERE BEFORE THIS BLOCK. Three things together, and
       no two of them are satisfiable by an accident: the flow's children fill
       it, exactly ONE of them carries `.panel-grow`, and that one is taller
       than the block in the panel beside it which has the same content and no
       class. The third is what makes it a measurement of GROWTH rather than of
       a number that happens to fit. */
    const rWith = panelWith.panel.check();
    const grown = panelGrowBlk.getBoundingClientRect().height;
    const bare = panelWithout.blk.getBoundingClientRect().height;
    d.assert('exactly one child of the flow absorbs the slack, and it is the one that grew',
      rWith.measured && rWith.growing.length === 1
      && rWith.growing[0] === panelGrowBlk
      && Math.abs(rWith.slack) <= 1.5 && grown > bare + 40,
      `flow ${rWith.flowH.toFixed(1)} px holding ${rWith.kidsH.toFixed(1)} of children, `
      + `${rWith.slack.toFixed(1)} px unaccounted for · the absorbing block is `
      + `${grown.toFixed(1)} px against ${bare.toFixed(1)} for the same block with no class`);

    /* 3. ⚠️ THE NEGATIVE CONTROL, AND IT IS THE HALF THAT PROVES THE INSTRUMENT.
       A panel that reported an absorber whatever it was shown would pass the
       check above. The second panel is the SAME panel with one class left off,
       so it must read the opposite: slack nobody took, no child growing, and
       the component saying so on `cuts` rather than throwing, because
       `/twelve/`'s 25.00 px of trailing air is legitimate. */
    const rNone = panelWithout.panel.check();
    d.assert('NEGATIVE CONTROL: with the class left off the slack is empty case, and it is reported',
      rNone.measured && rNone.growing.length === 0 && rNone.slack > 40
      && rNone.cuts.length === 1 && /panel-grow/.test(rNone.cuts[0]),
      `${rNone.slack.toFixed(1)} px of the flow empty, ${rNone.growing.length} children growing, `
      + `and it says "${(rNone.cuts[0] || 'nothing').slice(0, 64)}"`);

    /* 4. THE SCROLL BOUNDARY, COMPUTED, PLUS THE BORDER THAT MARKS IT. The
       border is the one line on a panel that survives the *separation is
       spacing, not lines* rule, and it has to be on the edge FACING the
       scroller: the left-hand column's RIGHT edge here, and `/twelve/`'s lane's
       left. MEASURED rather than read, because a border stripped by a rule
       nobody wrote is this project's fifth measured dead rule.
       ⚠️ AND THERE HAS TO BE SOMETHING TO SCROLL, or `overflow-x: auto` is a
       declaration about nothing. */
    const cs = getComputedStyle(panelWith.panel.strip);
    const cf = getComputedStyle(panelWith.panel.fixed);
    const over = panelWith.panel.strip.scrollWidth - panelWith.panel.strip.clientWidth;
    d.assert('the strip is the only scroller, with a floor of zero, and the border marks its edge',
      cs.overflowX === 'auto' && cs.minWidth === '0px'
      && parseFloat(cf.borderRightWidth) === 1 && parseFloat(cf.borderLeftWidth) === 0
      && over > 0
      && document.documentElement.scrollWidth <= document.documentElement.clientWidth,
      `overflow-x ${cs.overflowX}, min-width ${cs.minWidth}, ${over} px to scroll · `
      + `border right ${cf.borderRightWidth} and left ${cf.borderLeftWidth} · `
      + `the page overflows by `
      + `${document.documentElement.scrollWidth - document.documentElement.clientWidth} px`);

    /* 🔴 A FIFTH CHECK STOOD HERE AND IT WAS THE ONLY ONE IN THIS REPOSITORY
       THAT ENTERED A MEDIA QUERY. It read a card's left AND right edges inside
       a 320 px holder, both of them, because a card can be right on the left
       and 286 px out on the right. Its specimen was asked off on 2026-09-22
       and the assert went with it. **Nothing replaces it.** `verify.mjs` runs
       at 756 px, so every remaining panel assert passes without ever meeting a
       phone. See the note where the specimen was built. */
  }

  // ── the parts, and whether a reader can still find what is new ──────────
  //
  // 🔴 EVERY CHECK ABOVE THIS LINE MEASURED THE PAGE WITH ALL FIVE PARTS LAID
  // OUT. Everything below measures the parts themselves, so the window shuts
  // here and the page is in the state a reader has it in.
  settle();
  // 🔴 WHAT THE ADDRESS SAYS BEFORE ANY CHECK TOUCHES A TAB. Two of the checks
  // below press tabs to grade them, and pressing a tab writes the part's id
  // over the hash. See the assert at the end of this run.
  const addressWas = location.hash;

  /**
   * 🔴 THE FIVE PARTS HOLD EVERY BLOCK, AND NOTHING IS ORPHANED. The tab row is
   * this page's whole index now: a block in no part is a block that cannot be
   * reached, and it would look exactly like a block that was never written.
   * `section()` throws on a part that does not exist, so the failure this
   * catches is the other one, a part named in `GROUPS` that nothing was ever
   * put into, which draws a tab onto an empty panel.
   * ⚠️ COUNTED OFF THE DOM AND COMPARED AGAINST `built`, WHICH ARE TWO
   * INDEPENDENT SOURCES. One is what is on the page, the other is what the
   * builder said it made, so the two can disagree.
   */
  {
    const per = GROUPS.map(([id, label]) =>
      [label, panels.get(id).el.querySelectorAll(':scope > .kit-sec').length]);
    const total = per.reduce((n, [, c]) => n + c, 0);
    const empty = per.filter(([, c]) => c === 0).map(([l]) => l);
    // ⚠️ NO TOTAL TYPED HERE. This read `built.length === 34` for one run and
    // was wrong within the hour, because five blocks were added the same day:
    // a count nobody re-measures is this page's own lesson about the file at
    // the top of the repository. What is graded is that the two sources AGREE,
    // which is the half that can catch a block going somewhere unreachable.
    d.assert('every part of this page holds blocks, and between them they hold all of them',
      total === built.length && built.length > 0 && empty.length === 0,
      `${per.map(([l, c]) => `${l} ${c}`).join(', ')} · ${total} blocks on the page of `
      + `${built.length} built` + (empty.length ? ` · EMPTY: ${empty.join(', ')}` : ''));
  }

   /**
   * 🔴 THE HALF OF THIS THAT SURVIVES THE DOT'S REMOVAL, AND IT IS THE HALF
   * THAT WAS ALWAYS THIS PAGE'S OWN RULE: the newest block is FIRST in the part
   * that holds it. The mark that named that part went on 2026-09-21 because
   * nobody asked for it; the ordering rule predates it and is untouched.
   * ⚠️ AND IT IS WORTH SAYING WHAT IS NO LONGER CHECKED: nothing now asserts
   * that a reader can FIND the newest block, only that it is first where it
   * lives. A tab row still hides five sixths of this page, and that is a real
   * gap rather than a solved problem.
   */
  {
    const firstIn = newestPart
      ? panels.get(newestPart).el.querySelector(':scope > .kit-sec')?.id : null;
    d.assert('the newest block is the first one in the part that holds it',
      !!newestPart && firstIn === newestSection,
      `${built[0]} is the newest block, ${newestPart} holds it, `
      + `and the first block in that part is ${firstIn}`);
  }



  /**
   * ⚠️ THE CHECK THAT LIVED HERE GRADED THE NEW-BLOCK MARK AGAINST THE OPEN
   * TAB'S UNDERLINE, because the two had once been one channel: a 2 px bar in
   * `--hi` saying both *this part is open* and *the newest block is in here*.
   * The mark is gone on instruction, so the collision it guarded cannot happen
   * and the check has no subject. Removed rather than left passing vacuously.
   */


  /**
   * 🔴 GRADING THE TABS DID NOT MOVE THE READER'S ADDRESS, AND THIS IS HERE
   * BECAUSE IT DID. Two checks above press tabs to read them in both states,
   * and `go` writes the part's id over the hash on every press, so a visitor
   * arriving at `/kit/#segment-display` came to rest at `#hardware`: the right
   * part was open and the block's own address, put back on purpose so it could
   * be copied, had been destroyed by the thing grading the page. MEASURED
   * before and after, rather than read off the two `push: false` arguments,
   * because an argument is a claim and a comparison is a measurement.
   */
  {
    /**
     * ⚠️ IT PUTS A BLOCK'S ADDRESS IN THE BAR AND WALKS THE TABS UNDER IT,
     * BECAUSE COMPARING BEFORE AND AFTER IS VACUOUS ON THE HARNESS. The harness
     * arrives with no fragment, so `createTabs` writes the opening part's id and
     * a tab walk that ends where it started writes the SAME id back: sabotaging
     * `push: false` left the two readings identical and the check green. The
     * case that broke is an address naming a BLOCK, which only a person
     * following a link ever has, so the check gives itself one.
     * ⚠️ AND IT PUTS THE ADDRESS BACK. A check does not get to leave a reader
     * somewhere they did not ask to be, which is the whole defect it grades.
     */
    const link = `#${newestSection}`;
    let moved = 'no history here';
    try {
      history.replaceState(null, '', link);
      const home = kitTabs.at();
      kitTabs.go(GROUPS.map(([id]) => id).find((id) => id !== home), { push: false });
      kitTabs.go(home, { push: false });
      moved = location.hash;
      history.replaceState(null, '', addressWas || location.pathname);
    } catch { /* file:// has no history to write */ }
    d.assert('pressing tabs to grade them leaves a link to a block exactly as the reader had it',
      moved === link && location.hash === addressWas,
      `a link reading "${link}" came out of the tab walk as "${moved}", and the address is `
      + `back at "${location.hash || '(nothing)'}" from "${addressWas || '(nothing)'}"`);
  }

  /**
   * 🔴 ONE PART IS OPEN AND THE OTHER FOUR ARE NOT LAID OUT, WHICH IS BOTH THE
   * COMPONENT'S CLAIM AND THE NEGATIVE CONTROL FOR THE MEASURING WINDOW ABOVE.
   * A closed panel has to have no size, or the tabs are doing nothing; and the
   * same panel has to HAVE a size while `.kit-measuring` is on, or the window
   * every geometry check on this page depends on was decoration. The second
   * reading is the one that would have caught a tab row taking four fifths of
   * this page's coverage away in silence, and it is here rather than in a note
   * because a note cannot go red.
   */
  {
    const shutPart = GROUPS.map(([id]) => id).find((id) => id !== kitTabs.at());
    const shutSec = panels.get(shutPart).el.querySelector(':scope > .kit-sec');
    const openSec = panels.get(kitTabs.at()).el.querySelector(':scope > .kit-sec');
    const h = (n) => +n.getBoundingClientRect().height.toFixed(1);
    const closed = h(shutSec);
    const seen = h(openSec);
    measure();
    const opened = h(shutSec);
    settle();
    const hiddenCount = GROUPS.filter(([id]) => panels.get(id).el.hidden).length;
    d.assert('a closed part is laid out by nothing until the checks ask, which is what makes them measurements',
      hiddenCount === GROUPS.length - 1 && closed === 0 && seen > 0 && opened > 0,
      `${hiddenCount} of ${GROUPS.length} parts closed · the first block in ${shutPart} is `
      + `${closed} px tall closed and ${opened} px with the window open, against ${seen} px `
      + `for the open part's own first block`);
  }

  /**
   * 🔴 NO FRAME WAS EVER RENDERED WITH EVERY PART OPEN. This is what makes the
   * measuring window safe for somebody reading the page rather than only for
   * the harness: a `requestAnimationFrame` callback runs immediately before a
   * frame is drawn, so a callback that finds the window open is a frame that
   * would have shown all five parts at once. It can only happen if an `await`
   * lands inside the window, and no reading of the source can see one.
   * ⚠️ PROVED BY BREAKING IT: taking the `settle()` out of the toggle check's
   * wait reads `3 frames` here and goes red, with everything else on the page
   * still green.
   */
  d.assert('nothing was ever drawn with every part open at once',
    paintedOpen === 0,
    paintedOpen === 0 ? 'the window held no wait, so no frame fell inside it'
                      : `${paintedOpen} frame(s) were drawn with all five parts laid out`);

  /**
   * 🔴 THE BLOCKS INSIDE A PART KEEP THE PROJECT'S ONE GAP, WHICH IS THE RULE
   * THIS REORGANISATION WOULD HAVE LOST QUIETLY. `.pos-body` is a stack and was
   * giving every pair of sections 40 px; a section inside a tab panel is not its
   * child any more, and `.pos-tabs-p > * + *` would have handed it 22 instead.
   * Nothing would have failed. Every panel is a stack for exactly this, and the
   * number is read off `--pos-gap` rather than typed here.
   */
  {
    const want = Number.parseFloat(
      getComputedStyle(document.documentElement).getPropertyValue('--pos-gap'));
    const open = panels.get(kitTabs.at()).el;
    const secs = [...open.querySelectorAll(':scope > .kit-sec')];
    const gaps = secs.slice(1).map((s, i) => +(s.getBoundingClientRect().top
      - secs[i].getBoundingClientRect().bottom).toFixed(1));
    const worst = gaps.length ? Math.max(...gaps.map((g) => Math.abs(g - want))) : -1;
    d.assert('two blocks in one part sit the project’s one gap apart, not the panel’s own',
      open.classList.contains('pos-stack') && gaps.length > 1 && worst <= 0.5,
      `${gaps.length} gap(s) in ${kitTabs.at()} against --pos-gap ${want} px, worst ${worst} px out`);
  }

  /**
   * 🔴 A LINK TO A BLOCK LANDS ON THE BLOCK, WHICH IS A THING THIS PAGE COULD
   * NOT DO BEFORE IT HAD TABS. Nothing on it carried an `id`, so `/kit/#slider`
   * has never worked; behind a tab row the same link is worse than broken,
   * because the block exists, is addressed, and sits in a panel that is
   * `hidden`. Graded by resolving every block's id to a part WITHOUT
   * navigating, because a check that changed the address would leave a reader
   * somewhere they did not ask to be.
   * ⚠️ AND THE NEGATIVE HALF: a name no block has resolves to nothing, so the
   * table is a lookup rather than something that answers whatever it is asked.
   */
  {
    const ids = [...sectionTab.keys()];
    const unresolved = ids.filter((id) => !document.getElementById(id));
    const wrong = ids.filter((id) => {
      const part = sectionTab.get(id);
      return document.getElementById(id)?.closest('.pos-tabs-p') !== panels.get(part).el;
    });
    d.assert('every block has an address, and the address names the part holding it',
      ids.length === built.length && unresolved.length === 0 && wrong.length === 0
      && !sectionTab.has('no-such-block'),
      unresolved.length || wrong.length
        ? `${unresolved.length} with no element, ${wrong.length} in the wrong part`
        : `${ids.length} addresses, ${idFor('SLIDER')} is in ${sectionTab.get(idFor('SLIDER'))}`);
  }

  d.ready();

</script>
</html>
