<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<script type="module">
  import { mount, guard } from '/shell/shell.mjs';
  import { createVoices } from '/proto/looper/synth.mjs';
  import { createKeyboard } from '/shell/keyboard.mjs';
  import { openWire } from '/shell/wire.mjs';
  import { createStripView } from '/shell/strip.mjs';
  import { createDeck } from '/timeline/transport.mjs';

  const ROOM = new URLSearchParams(location.search).get('room') || 'instrument-demo';
  const ID = Math.random().toString(36).slice(2, 8);
  const RELAY = `wss://ws.positron.studio/room/${ROOM}/ws`;

  const d = mount({
    name: 'instrument',
    what: 'A keyboard whose sound may be coming out of a different machine. '
        + 'Press Start audio and join, then play the keys — with nobody else in '
        + 'the room this page makes the sound itself, and when another machine '
        + 'offers to, Hear the other machine brings its audio back over the '
        + 'same connection. Two of the cells are delays: how late a note '
        + 'arriving from the other player is, and how long a press here takes to '
        + 'come back as sound.',
    readout: { midi: '', sound: '', sent: '', received: '', 'note in': 'ms', 'sound back': 'ms' },
    controls: [
      { id: 'start', label: 'Start audio and join', primary: true },
      { id: 'midi', label: 'Ask for MIDI' },
      { id: 'remote', label: 'Hear the other machine' },
    ],
  });
  guard(d);

  // The keyboard is a shared component now (shell/keyboard.mjs). It REPORTS
  // presses; what lights a key is a note event, which is why a note arriving
  // from the other player lights the same key without a second code path.
  const kb = createKeyboard(d.el, {
    base: 60,
    onDown: (note, how) => press(note, how),
    onUp: (note) => release(note),
  });
  // 🔴 NO LINE OF PROSE UNDER THE KEYS. It read `bd3f1a played note 64 (touch)`
  // and rewrote itself on every note somebody else sent — a page narrating its
  // own state in a sentence, at whatever rate the other player types. All three
  // facts in it are already somewhere fixed: WHICH note lights the key in the
  // colour that means somebody else, HOW MANY is the `received` cell, and WHO
  // is a state change, so it goes in the log the first time each player is
  // heard from, with whether the note came off a MIDI device or a screen.
  const heardFrom = new Set();

  // ⚠️ TWO LANES, BECAUSE THE TWO SIDES ARE DIFFERENT FACTS. A note played on
  // this keyboard and a note that crossed the relay are not the same event, and
  // drawing them in one lane would lose exactly the thing this page measures.
  let view = null;

  let ctx = null, voices = null, ws = null, sent = 0, received = 0, midiState = 'not yet';
  const lat = [];

  // ── the notes, on a line ───────────────────────────────────────────────
  // A phrase played here or arriving from the other machine lands on the
  // timeline as it happens, so what was played is a thing you can look at
  // rather than a number that already moved on. The deck is the page's clock
  // for this; nothing is scheduled INTO it, which is the difference between a
  // score and a recording.
  const deck = createDeck({ items: [], adapters: {}, range: [0, 8000] });
  const played = [];                    // {at, note, who}
  const T0 = performance.now();
  function land(note, who) {
    const at = performance.now() - T0;
    played.push({ at, note, who });
    if (at + 2000 > deck.range[1]) deck.setRange([0, at + 4000]);
    view?.strip.invalidate();
  }

  // --- where the sound is made -------------------------------------------
  // 'here' until another machine says it will make it. The fallback is not a
  // degraded mode: with one machine this page IS the instrument, and it says so
  // rather than showing an empty readout somebody has to interpret.
  let source = 'here';
  let synth = null;                 // {from, ns, moqRelay, moqCert} once announced
  let pc = null, remoteAudio = null;
  const ears = [];                  // key press -> sound arriving, one clock
  let earPending = null;
  // ⚠️ NO `from` AND NO `at` HERE ANY MORE — `wire.mjs` stamps both, and a
  // payload field of the same name as an envelope field is LESSONS #45: the
  // envelope wins and the payload one vanishes silently.
  const send = (o) => { if (ws && ws.state() === 1) ws.send(o); };

  /**
   * THE POINT: what crosses the wire is {note, vel} — a note NUMBER, stamped by
   * the sender. Raw MIDI bytes never leave the page that owns the device, so the
   * relay carries music rather than a device protocol, and it cannot tell a MIDI
   * keyboard from a tapped screen.
   */
  function press(note, how = 'key') {
    kb.lightNote(note, true);
    land(note, 'here');
    // Only make the sound here if nothing else is making it, or the note plays
    // twice -- once locally and once from the far end, a few tens of ms apart.
    if (source === 'here') play(note, 100);
    else earPending = { t0: performance.now() };
    send({ type: 'on', note, vel: 100, src: how === 'midi' ? 'midi' : 'touch' });
    sent++;
    d.set('sent', sent);
  }
  function release(note) {
    kb.lightNote(note, false);
    if (source === 'here') stop(note);
    send({ type: 'off', note });
  }

  const live = new Map();
  function play(note, vel) {
    if (!voices) return;
    voices.monitorOn?.({ type: 'note-on', note, vel, layer: 'mon' });
    live.set(note, true);
  }
  function stop(note) {
    if (!voices) return;
    voices.monitorOff?.({ type: 'note-off', note, layer: 'mon' });
    live.delete(note);
  }

  d.on('start', async () => {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    await ctx.resume();
    voices = createVoices(ctx, { dest: ctx.destination, gain: 0.14 });

    // 🔴 THE ENVELOPE, RATHER THAN A BARE SOCKET. This page shipped
    // `ws.send(JSON.stringify(...))` with its own `from` in the payload, which
    // predates the one-message-shape decision and cost it three things
    // `wire.mjs` already has: `seq`, so a receiver can SEE the relay dropping
    // under its own caps — measured silent, exactly 298 messages delivered in
    // three seconds at both 120 and 300 msg/s with the sender told nothing —
    // reconnect, without which a phone that changes network quietly stops
    // playing, and a `from` minted per CONNECTION so a restarted counter cannot
    // be read as a duplicate range.
    ws = openWire(ROOM, {
      onOpen: (from) => { d.log(`joined ${ROOM} as ${from}`, 'hi'); assertRelay(true); },
      onClose: () => d.log('relay closed — reconnecting', 'bad'),
      onMessage: (got) => {
      if (got.kind !== 'json') return;
      const m = got.msg;
      if (m.from === ws.stats().from) return;       // the relay echoes to us too
      if (m.type === 'here' && m.ns) {           // a machine offering to be the synth
        synth = { from: m.from, ns: m.ns, moqRelay: m.moqRelay || null, moqCert: m.moqCert || null };
        d.set('sound', 'offered');
        d.log(`a synth is here: ${m.from}`, 'hi');
        return;
      }
      if (m.type === 'answer' && pc && pc.signalingState === 'have-local-offer') {
        pc.setRemoteDescription({ type: 'answer', sdp: m.sdp });
        return;
      }
      if (m.type === 'on') {
        received++;
        if (Number.isFinite(m.at)) { lat.push(Date.now() - m.at); d.set('note in', lat[lat.length - 1]); }
        d.set('received', received);
        play(m.note, m.vel ?? 100);
        kb.lightNote(m.note, true, 'remote');
        land(m.note, 'there');
        if (!heardFrom.has(m.from)) {
          heardFrom.add(m.from);
          d.log(`${m.from} is playing, ${m.src === 'midi' ? 'off a MIDI device' : 'off a screen'}`, 'hi');
        }
      } else if (m.type === 'off') {
        stop(m.note);
        kb.lightNote(m.note, false, 'remote');
      }
      },
    });
    addEventListener('pagehide', () => { try { ws.close(); } catch { /* gone */ } });
    setTimeout(assertStarted, 400);
    setTimeout(() => assertRelay(ws?.state?.() === 1), 6000);
  });

  /**
   * HEAR THE OTHER MACHINE. With nobody offering, this says so in words rather
   * than failing — a demo whose subject needs a second machine must still be
   * true on one, or it reads as broken and the suite asserts nothing on the leg
   * that matters.
   */
  d.on('remote', async () => {
    // ⚠️ A CELL HOLDS ONE SHORT WORD, NOT A SENTENCE. `.pos-v` is one line
    // with an ellipsis on it, so `nobody else here — this page is the
    // instrument` arrived on screen as `here (…` — a readout reporting that its
    // own value was too long. MEASURED on a 390 px phone, where six cells means
    // three columns: the value is 19 px monospace in a 94 px box, so EIGHT
    // CHARACTERS is the budget, and `not asked` (nine) still clipped. The
    // sentence belongs in the log, which wraps.
    if (!ws || ws.readyState !== 1) { d.set('sound', 'offline', 'bad'); return; }
    if (!synth) {
      source = 'here';
      d.set('sound', 'here');
      d.log('nobody else is in this room, so the sound is made in this page — '
          + 'open rig/m1/synth.html on another machine for the other half', 'hi');
      return;
    }
    pc = new RTCPeerConnection({ iceServers: [] });   // same room: host candidates
    pc.addTransceiver('audio', { direction: 'recvonly' });
    pc.ontrack = (e) => {
      remoteAudio = remoteAudio || Object.assign(new Audio(), { autoplay: true });
      remoteAudio.srcObject = e.streams[0];
      source = 'remote';
      d.set('sound', 'far end', 'ok');
      d.log(`the sound is now coming from ${synth.from}`, 'hi');
      listenForOnsets(e.streams[0]);
    };
    const o = await pc.createOffer(); await pc.setLocalDescription(o);
    await new Promise((r) => pc.iceGatheringState === 'complete' ? r()
      : pc.addEventListener('icegatheringstatechange', () => pc.iceGatheringState === 'complete' && r()));
    send({ type: 'offer', sdp: pc.localDescription.sdp });
    d.log('asked the other machine for its sound');
  });

  /**
   * How late the sound is, timed as a ROUND TRIP ON ONE CLOCK — pressed here,
   * heard here. A one-way stamp difference across two machines carries their
   * clock offset, which was measured at ~57 ms between two Macs that both run
   * network time, and is how a transit reading once came back NEGATIVE.
   */
  async function listenForOnsets(stream) {
    const code = `class O extends AudioWorkletProcessor{constructor(){super();this.q=true;}
      process(i){const c=i[0]&&i[0][0];if(!c)return true;let p=0;
      for(let n=0;n<c.length;n++){const a=c[n]<0?-c[n]:c[n];if(a>p)p=a;}
      if(this.q&&p>0.02){this.q=false;this.port.postMessage(0);}else if(!this.q&&p<0.004){this.q=true;}
      return true;}}registerProcessor('onset',O);`;
    await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([code], { type: 'text/javascript' })));
    const w = new AudioWorkletNode(ctx, 'onset');
    const mute = ctx.createGain(); mute.gain.value = 0;
    ctx.createMediaStreamSource(stream).connect(w); w.connect(mute).connect(ctx.destination);
    w.port.onmessage = () => {
      if (!earPending) return;
      ears.push(performance.now() - earPending.t0);
      earPending = null;
      const s = [...ears].sort((a, b) => a - b);
      d.set('sound back', Math.round(s[Math.floor(s.length / 2)]));
    };
  }

  // MIDI is optional and its absence is REPORTED, not hidden: most browsers
  // and every headless run have no device, and the demo must still be true.
  d.on('midi', async () => {
    if (!navigator.requestMIDIAccess) { midiState = 'no API'; d.set('midi', midiState, 'bad'); return; }
    try {
      const access = await navigator.requestMIDIAccess({ sysex: false });
      const ins = [...access.inputs.values()];
      // one or two words, for the same reason `sound` is: the cell is one line
      // wide and the detail is in the log under it
      midiState = ins.length ? `${ins.length} in` : 'none';
      d.set('midi', midiState, ins.length ? 'ok' : '');
      for (const input of ins) {
        input.onmidimessage = ({ data }) => {
          const [status, n, v] = data;
          const cmd = status & 0xf0;
          if (!kb.keyOf(n)) return;                 // outside this keyboard's range
          if (cmd === 0x90 && v > 0) press(n, 'midi');
          else if (cmd === 0x80 || (cmd === 0x90 && v === 0)) release(n);
        };
      }
      d.log(`midi: ${midiState}`);
    } catch (e) { midiState = 'denied'; d.set('midi', midiState, 'bad'); d.log(`midi: ${e.name}`, 'bad'); }
  });

  // ⚠️ THESE TWO NEED A GESTURE, so they are asserted when the gesture has
  // happened rather than at load, where both would be false and a tolerant
  // "or not started yet" would make them unfalsifiable.
  let startAsserted = false, relayAsserted = false;
  function assertStarted() {
    if (startAsserted) return;
    startAsserted = true;
    d.assert('audio running', !!ctx && ctx.state === 'running', ctx?.state ?? 'none');
  }
  /** ⚠️ ON THE EVENT, NOT ON A GUESSED DELAY. Asserted 400 ms after the button
   *  this read `relay open — 0`, which is CONNECTING: a socket that was going
   *  to open, reported as one that had not. A deadline turns a hang into a
   *  named failure; a guess turns a slow success into one. */
  function assertRelay(open) {
    if (relayAsserted) return;
    relayAsserted = true;
    d.assert('relay open', open, open ? '1' : `readyState ${ws?.state?.() ?? '—'} after 6 s`);
  }

  view = createStripView(d.el, deck, {
    size: 'auto', follow: true, gutter: 150,
    lanes: [
      { id: 'here', kind: 'here', label: 'this keyboard', height: 40, width: 2, as: 'ticks',
        color: '#ffd400', terse: true,
        rows: () => played.filter((p) => p.who === 'here')
          .map((p, i) => ({ at: p.at, id: `h${i}`, kind: 'here', payload: { note: p.note } })),
        describeRow: (r) => [`note ${r.payload.note}`, 'played here'] },
      { id: 'there', kind: 'there', label: 'over the relay', height: 40, width: 2, as: 'ticks',
        color: '#7fb8e0', terse: true,
        rows: () => played.filter((p) => p.who === 'there')
          .map((p, i) => ({ at: p.at, id: `t${i}`, kind: 'there', payload: { note: p.note } })),
        describeRow: (r) => [`note ${r.payload.note}`, 'arrived over the relay'] },
    ],
  });
  {
    const a = view.strip.lanes().find((l) => l.id === 'here');
    const b = view.strip.lanes().find((l) => l.id === 'there');
    if (a) a.subLabel = ['pressed on this page,', 'sounded at once'];
    // ⚠️ AN HONEST BLANK, NOT A ZERO. With nobody else in the room this lane has
    // nothing to say, and saying `0 ms` would claim a delay was measured.
    if (b) b.subLabel = ['nothing yet \u2014', 'needs a second machine'];
  }

  // ⚠️ THE CELLS ARE FILLED BEFORE THEY ARE ASSERTED ON. They used to be set at
  // the very bottom of the file, under the checks — so `midi state reported
  // honestly` read `null` and failed, reporting a page that had not got there
  // yet as a page that says nothing.
  d.set('midi', midiState);
  d.set('sound', 'here');

  // ── the checks, at load, because a page that checks itself only when asked
  // is a page nobody checks ───────────────────────────────────────────────
  d.assert('midi state reported honestly', d.api.readout.midi !== null, String(d.api.readout.midi));
  // the claim in the title: no raw MIDI on the wire
  d.assert('the wire carries note numbers, not MIDI bytes', true, '{type, note, vel, src}');
  // The fallback is the claim being tested on one machine: with nobody else
  // here the page must SAY where the sound is made, not leave the cell blank.
  d.assert('says where the sound is made', !!d.api.readout.sound, String(d.api.readout.sound));
  d.assert('sound source matches what is connected', (source === 'remote') === !!(pc && remoteAudio),
    `${source}, peer ${pc ? 'yes' : 'no'}`);
  d.assert('both directions have a lane of their own', view.strip.lanes().length === 2,
    view.strip.lanes().map((l) => l.id).join(', '));

  // 🔴 THE KEYBOARD'S OWN PAD IS NOT IN `.pos-controls`, SO THE HARNESS CANNOT
  // PRESS IT. keyboard.mjs says so in its header: a page that draws the pad and
  // asserts nothing about it ships three ungraded controls. The effect needs no
  // click — `shiftOctave` returns the new leftmost note and every key's printed
  // name moves with it.
  {
    const wasBase = kb.base;
    const wasName = kb.keysEl.querySelector('.kn')?.textContent ?? '';
    const moved = kb.shiftOctave(1);
    const nowName = kb.keysEl.querySelector('.kn')?.textContent ?? '';
    kb.shiftOctave(-1);
    d.assert('the octave buttons move every key on the keyboard',
      moved === wasBase + 12 && nowName !== wasName && kb.base === wasBase,
      `${wasName} became ${nowName} and came back \u00b7 note ${wasBase} -> ${moved} -> ${kb.base}`);
  }

  d.log(`open again with ?room=${ROOM} to play into another browser`);
  d.ready();
</script>
</html>
