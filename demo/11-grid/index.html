<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .tier { font: 600 10px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase;
          color: var(--hi); margin: 12px 0 5px; }
  .row { display: grid; gap: 5px; margin: 0 0 4px; }
  .row.featured { grid-template-columns: 1fr; }
  .row.live { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
  .row.wall { grid-template-columns: repeat(auto-fit, minmax(56px, 1fr)); }
  .t { position: relative; aspect-ratio: 16/9; background: #000; border: 1px solid var(--line);
       border-radius: 3px; overflow: hidden; }
  .t canvas { width: 100%; height: 100%; display: block; }
  .t .n { position: absolute; left: 3px; bottom: 2px; font: 600 9px/1.3 var(--mono);
          color: var(--fg); background: #0b0e14aa; padding: 0 3px; border-radius: 2px; }
  .row.featured .t .n { font-size: 13px; padding: 2px 6px; }
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';

  // The tiers are the measured design from plan-m2m: ONE featured, a handful
  // live, the rest a wall. It exists because attaching every participant at
  // full rate does not scale — the wall is deliberately cheap.
  const TIERS = { featured: 1, live: 5 };

  const d = mount({
    n: '11',
    name: 'grid',
    what: 'N participants, tiered. One featured, a few live, the rest a wall.',
    readout: { n: '', featured: '', live: '', wall: '' },
    controls: [
      { id: 'add', label: 'Add four', primary: true },
      { id: 'many', label: 'Go to 54' },
      { id: 'rotate', label: 'Rotate the featured' },
      { id: 'check', label: 'Run the checks' },
    ],
  });
  guard(d);

  const rows = {};
  for (const name of ['featured', 'live', 'wall']) {
    d.el.append(el('div', 'tier', name));
    rows[name] = el('div', `row ${name}`);
    d.el.append(rows[name]);
  }

  const parts = [];
  let featuredIdx = 0, painting = null;

  function addParticipant(i) {
    const c = el('canvas');
    c.width = 160; c.height = 90;
    const box = el('div', 't');
    box.append(c, el('span', 'n', `p${i}`));
    parts.push({ i, canvas: c, box, ctx: c.getContext('2d') });
  }

  function layout() {
    for (const r of Object.values(rows)) r.replaceChildren();
    parts.forEach((p, idx) => {
      // rank relative to the featured one, so rotating is a re-rank not a rebuild
      const rank = (idx - featuredIdx + parts.length) % parts.length;
      const tier = rank < TIERS.featured ? 'featured' : rank < TIERS.featured + TIERS.live ? 'live' : 'wall';
      p.tier = tier;
      rows[tier].append(p.box);
    });
    const count = (t) => parts.filter((p) => p.tier === t).length;
    d.set('n', parts.length);
    d.set('featured', count('featured'));
    d.set('live', count('live'));
    d.set('wall', count('wall'));
  }

  // The wall is drawn at a lower rate on purpose: that asymmetry IS the tiering.
  function paint() {
    const now = Date.now();
    for (const p of parts) {
      const slow = p.tier === 'wall';
      if (slow && now % 500 > 60) continue;
      const g = p.ctx;
      g.fillStyle = p.tier === 'featured' ? '#151b26' : '#11151d';
      g.fillRect(0, 0, 160, 90);
      g.fillStyle = p.tier === 'featured' ? '#ffd400' : '#8b93a1';
      g.font = `bold ${p.tier === 'featured' ? 22 : 13}px ui-monospace, monospace`;
      g.fillText(`p${p.i}`, 8, 26);
      g.fillStyle = '#2b3546';
      g.fillRect(8, 40, 144, 4);
      g.fillStyle = p.tier === 'featured' ? '#ffd400' : '#6a7280';
      g.fillRect(8, 40, ((now / 20 + p.i * 17) % 144), 4);
    }
  }

  d.on('add', () => { for (let k = 0; k < 4; k++) addParticipant(parts.length + 1); layout(); });
  d.on('many', () => { while (parts.length < 54) addParticipant(parts.length + 1); layout(); d.log('54 participants — the p95 the SFU held flat'); });
  d.on('rotate', () => { if (parts.length) { featuredIdx = (featuredIdx + 1) % parts.length; layout(); d.log(`featured -> p${parts[featuredIdx].i}`); } });

  d.on('check', () => {
    d.assert('participants present', parts.length > 0, String(parts.length));
    const f = parts.filter((p) => p.tier === 'featured').length;
    d.assert('exactly one featured', f === Math.min(1, parts.length), String(f));
    const lv = parts.filter((p) => p.tier === 'live').length;
    d.assert('live tier capped', lv <= TIERS.live, `${lv} <= ${TIERS.live}`);
    const total = parts.filter((p) => p.tier).length;
    d.assert('every participant is in exactly one tier', total === parts.length, `${total}/${parts.length}`);
    if (parts.length > TIERS.featured + TIERS.live) {
      d.assert('the overflow becomes a wall',
        parts.filter((p) => p.tier === 'wall').length === parts.length - TIERS.featured - TIERS.live);
    }
  });

  for (let k = 0; k < 4; k++) addParticipant(k + 1);
  layout();
  painting = setInterval(paint, 40);
  d.log('tiers from plan-m2m: 1 featured, 5 live, the rest a cheap wall');
  d.ready();
</script>
</html>
