<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* The same panel the headset hangs in front of you, drawn on the page too, so
     a reader with no headset sees the thing a wearer reads. No border of its
     own: panel.mjs draws its own rounded edge, and a second one around it would
     be a line where the shell's spacing already says "separate element". */
  .es-panel { display: block; width: 100%; max-width: 512px; }
</style>

<script type="module">
  // demo/earshot/index.html -- the four unmeasured audio questions about a
  // headset, asked with the window as the control.
  //
  // plan-videoradio-xr.md section 3.2 lists what nobody here has measured about
  // sound on a Quest, and section 3.3 designs this page. The four questions,
  // verbatim:
  //
  //   1. does an AudioContext survive entering and running an immersive
  //      session, and what does `state` read across the transition
  //   2. `sampleRate`, `baseLatency`, `outputLatency` inside a session, against
  //      the same three in the 2D window
  //   3. does AudioDecoder configure and decode inside a session
  //   4. does a main-thread ScriptProcessorNode callback keep being called
  //      while the compositor draws at 90 Hz, and at what rate
  //
  // 🔴 THREE ARMS AND TWO NEGATIVE CONTROLS, AND THE CONTROLS ARE WHAT MAKE THE
  // RUN MEAN ANYTHING.
  //   arm 1  a 440 Hz oscillator through a gate, read by an analyser each side
  //   arm 2  our own bytes off our own R2 worker, through AudioDecoder
  //   arm 3  a 4096-frame ScriptProcessorNode counted against wall time
  //   control A  the SAME readings taken in the window, on the same run. Without
  //              it a 0.0000 inside a session cannot be told from a 0.0000 on a
  //              page whose meter never worked.
  //   control B  the gate is shut on purpose for half a second. The post-gate
  //              level must fall to nothing AND the pre-gate level must stay up,
  //              or the meter is reading something other than the gate. This
  //              repo has shipped a meter that could not read zero.
  //
  // 🔴 NO THIRD-PARTY MOUNT IS TOUCHED, ANYWHERE, EVER. ERR told us on
  // 2026-09-16 that our connections corrupt their public listener statistics:
  // every socket this repo opens to one of their mounts appears in a public
  // broadcaster's audience measurement. So the decode arm reads from
  // `positron-station`, which is our own Worker in front of our own R2 bucket.
  // It also removes the confound: "the headset went silent" and "four of eight
  // mounts were down, which is their normal state" would otherwise be the same
  // observation.
  //
  // ⚠️ WHAT A LAPTOP CAN AND CANNOT GRADE. Everything below the session is
  // gradeable here: the window baselines, the decode path, the callback rate,
  // and the headset guard broken on purpose three ways. Nothing behind
  // `requestSession` is: desktop Chrome has a genuinely native `navigator.xr`
  // and answers `immersive-vr: false`, so the session branch is unreachable on
  // any machine without a headset, and the Immersive Web Emulator satisfying it
  // would be the iPhone mistake in a new accent. The page says which is which
  // in its own log, and `node demo/verify-quest.mjs earshot` is what asks the
  // rest.
  import { mount, guard, BUILD } from '/shell/shell.mjs';
  // 🔴 `beacon()` IS THE ONE sendBeacon IN THIS REPO AND IT GOES TO `/log`.
  // Singular: `/logs` is the READ path and a POST there is accepted and thrown
  // away, which is the worst shape a diagnostic can have. It is sendBeacon
  // rather than the batched shipper because `createShipper` holds for two
  // seconds and entering an immersive session is exactly when timers stop being
  // generous: measured on a Quest 3, every flat line arrived, then the press,
  // then nothing at all.
  import { createXRPanels, beacon, headsetSupported } from '/shell/xr-panel.mjs';
  import { createPanel } from '/shell/panel.mjs';
  import { createFrameSplitter, framingFor } from '/shell/mp3-frames.mjs';

  // Our own Worker in front of our own R2 bucket. The only network address on
  // this page. `demo/station/index.html` reads the same one.
  const STATION = 'https://positron-station.kristjan-jansen.workers.dev';
  const RANGE = 196608;        // 192 KiB of one programme: about twelve seconds
  const DECODE_FRAMES = 120;   // about three seconds of it, decoded
  const BLOCK = 4096;          // the ScriptProcessorNode block /videoradio/ uses
  const TONE_HZ = 440;
  const TONE_GAIN = 0.05;      // quiet on purpose: this plays into somebody's head
  const WATCH_MS = 1200;       // how long an arm watches before it reports
  const SHUT_MS = 500;         // how long the gate is held shut in the sabotage
  const BEAT_MS = 1000;        // how often a line goes out from inside a session
  const NO_DATA_MS = 4000;     // frames drawn and still nothing heard: say so
  const SABOTAGE_AT_MS = 6000; // when the gate is shut on purpose in a session
  const DECODE_AT_MS = 2000;   // when the decode arm runs again inside a session

  const d = mount({
    name: 'earshot',
    what: 'Four things about sound in a headset that nobody here has measured: '
      + 'whether the audio keeps running once you are inside, what the sample rate '
      + 'and the output delay read in there, whether the browser still turns '
      + 'compressed audio into samples, and whether the main thread keeps '
      + 'servicing audio while it draws ninety times a second. Press Measure here '
      + 'for all four in this window, Decode for our own bytes off our own server, '
      + 'then Enter VR to take them again inside a session. The window readings '
      + 'are the control: nothing measured inside the headset means anything '
      + 'until the same meter has been seen to read something outside it.',
    // 🔴 EIGHT CELLS, EVEN, AND EVERY ONE OF THEM CAN MOVE. `rate` looks like a
    // constant on a laptop and is not one here: whether it changes between the
    // window and the session is question 2, and a page that hid it behind "it
    // never moves" would be hiding the answer.
    readout: {
      context: '', rate: 'Hz', base: 'ms', out: 'ms',
      level: '', calls: '/s', decoded: '', drawn: '',
    },
    controls: [
      { id: 'here', label: 'Measure here', primary: true },
      { id: 'decode', label: 'Decode our bytes' },
      { id: 'vr', label: 'Enter VR' },
    ],
  });
  guard(d);

  // ── reporting ─────────────────────────────────────────────────────────────
  //
  // 🔴 ONLY FROM A BROWSER WITH A HEADSET BEHIND IT. Posting a line from every
  // desktop visitor and from every suite run would put somebody else's traffic
  // in our diagnostics and would bury the one run that matters under forty that
  // do not. `?report=1` turns it on anywhere, `?report=0` off everywhere
  // (xr-panel.mjs's own gate).
  const FORCE = new URLSearchParams(location.search).get('report');
  const reporting = () => FORCE === '1' || (FORCE !== '0' && headsetSupported() === true);
  let sent = 0;

  /** One line, to the page's log and, from a headset, to the device log. */
  function say(line, kind) {
    d.log(line, kind);
    if (reporting()) { sent++; beacon(`earshot ${line}`); }
  }

  /**
   * Every await on this page goes through here.
   *
   * 🔴 A LINE BEFORE AND A LINE AFTER, AND A DEADLINE THAT NAMES THE HANG.
   * Three headset runs were lost to entry paths that were indistinguishable
   * from outside: a throw escaped a frame callback and the render loop, the way
   * out and the bail-out timer were all never registered, and there was no line
   * saying how far it had got. It never throws, so a caller's asserts are all
   * still reached when a step fails: `{ ok: false, why }` is a result, and an
   * exception here would be one more silent branch.
   */
  async function step(name, ms, work) {
    say(`... ${name}`);
    const t0 = performance.now();
    let timer = null;
    try {
      const v = await Promise.race([
        Promise.resolve().then(work),
        new Promise((_, rej) => { timer = setTimeout(() => rej(new Error(`no answer in ${ms} ms`)), ms); }),
      ]);
      say(`ok ${name} · ${Math.round(performance.now() - t0)} ms`);
      return { ok: true, v };
    } catch (e) {
      const why = `${e.name || 'Error'}: ${e.message}`;
      say(`FAIL ${name} · ${why}`, 'bad');
      return { ok: false, why };
    } finally { clearTimeout(timer); }
  }

  // ── the headset guard ─────────────────────────────────────────────────────
  //
  // 🔴 TWO GATES, NEVER ONE, AND EACH CATCHES EXACTLY WHAT THE OTHER CANNOT.
  // A nativeness test alone passes every laptop, because desktop Chrome has a
  // genuinely native XRSystem. An `isSessionSupported` test alone passes a fake
  // device, because the Immersive Web Emulator installs a JavaScript XRSystem
  // that answers true to everything and Meta markets its coverage as "on par
  // with the Meta Quest Browser".
  //
  // ⚠️ WHY THE PAGE NEEDS ITS OWN AND NOT ONLY THE HARNESS'S.
  // `demo/verify-quest.mjs` asks these two questions and a third one this
  // cannot: `adb shell getprop`, which is the far side of the boundary and the
  // only channel page script cannot fake. But the numbers below are beaconed,
  // and a beacon attributed to a headset that was really an emulator is worse
  // than no beacon: no compositor, no reprojection, no real frame budget, and a
  // frame rate that means nothing. So the page refuses to CLAIM a headset
  // reading it cannot stand behind.
  //
  // It reads descriptors rather than values: touching an accessor on a
  // prototype with the prototype as receiver throws "Illegal invocation" in
  // Chromium, and a probe that throws reports "absent" about something present.
  function probeXr() {
    const own = Object.prototype.hasOwnProperty.call(navigator, 'xr');
    const desc = Object.getOwnPropertyDescriptor(Navigator.prototype, 'xr');
    const proto = !desc ? 'none' : typeof desc.get === 'function' ? 'accessor' : 'data';
    let obj = null;
    try { obj = navigator.xr || null; } catch { obj = null; }
    const methods = [], jsSourced = [];
    if (obj) {
      const p = Object.getPrototypeOf(obj) || obj;
      for (const k of Object.getOwnPropertyNames(p)) {
        if (k === 'constructor') continue;
        const md = Object.getOwnPropertyDescriptor(p, k);
        if (!md || typeof md.value !== 'function') continue;   // skip accessors
        methods.push(k);
        if (!String(md.value).includes('[native code]')) jsSourced.push(k);
      }
    }
    return {
      present: !!obj, own, proto, methods, jsSourced,
      ctor: (obj && obj.constructor && obj.constructor.name) || null,
      secure: !!self.isSecureContext,
    };
  }

  /**
   * @returns {{headset: boolean, native: boolean, gate: string|null, why: string}}
   *   `gate` names WHICH refusal this was, because "the XR object is fake" and
   *   "the XR object is real and there is nothing on anybody's head" are
   *   different findings with different fixes, and one boolean collapses them
   *   into a message that is wrong half the time.
   */
  function verdict(p, vrSupported) {
    if (!p.present) {
      return { headset: false, native: false, gate: 'native',
        why: p.secure ? 'this browser has no navigator.xr'
          : 'this page is not a secure context, which is reason enough on its own' };
    }
    if (p.jsSourced.length) {
      return { headset: false, native: false, gate: 'native',
        why: `${p.jsSourced.join(', ')} is JavaScript source rather than the browser's own,`
          + ' which is what an emulator extension installs' };
    }
    if (p.own) {
      return { headset: false, native: false, gate: 'native',
        why: 'navigator owns xr as its own property; a browser with it compiled in puts it on the prototype' };
    }
    if (p.proto !== 'accessor') {
      return { headset: false, native: false, gate: 'native',
        why: `Navigator.prototype.xr is ${p.proto}, not an accessor` };
    }
    if (vrSupported !== true) {
      return { headset: false, native: true, gate: 'device',
        why: `the XR object is the browser's own and immersive-vr is ${vrSupported}`
          + ', which is what desktop Chrome answers' };
    }
    return { headset: true, native: true, gate: null,
      why: `${p.ctor || 'XRSystem'} · ${p.methods.length} methods, all native · immersive-vr supported` };
  }

  const guardNow = () => verdict(probeXr(), headsetSupported());

  // ── the graph ─────────────────────────────────────────────────────────────
  let ctx = null, tone = null, preAn = null, gate = null, postAn = null, sp = null;
  let buf = null;
  let calls = 0, callMark = { n: 0, t: 0 };
  let gateWanted = 0;

  /**
   * ⚠️ FIRED, NEVER AWAITED. `AudioContext.resume()` waits on a user gesture in
   * a real browser and does NOT reject, so awaiting it before the measurement
   * is a hang rather than an error. Two demos were lost to that in one session.
   * Sound is allowed to be late; the measurement is not.
   */
  function graph() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    try { const r = ctx.resume && ctx.resume(); if (r && r.catch) r.catch(() => {}); } catch { /* late is fine */ }

    tone = ctx.createOscillator();
    tone.type = 'sine';
    tone.frequency.value = TONE_HZ;

    preAn = ctx.createAnalyser(); preAn.fftSize = 2048;
    gate = ctx.createGain(); gate.gain.value = 0;      // shut until a press opens it
    postAn = ctx.createAnalyser(); postAn.fftSize = 2048;
    buf = new Float32Array(postAn.fftSize);

    tone.connect(preAn);
    preAn.connect(gate);
    gate.connect(postAn);
    postAn.connect(ctx.destination);
    tone.start();

    // ── arm 3 ──────────────────────────────────────────────────────────────
    // 🔴 ON THE MAIN THREAD ON PURPOSE, which is the whole question. The
    // granulator on /videoradio/ lives in an AudioWorklet and is insulated from
    // a render loop; its loop recorder is a ScriptProcessorNode and is not, and
    // the main thread inside a session is the one running the XR frame
    // callback. A processor that should fire 11.7 times a second at 48 kHz and
    // fires 9 is the answer to question 4, and it is invisible in every other
    // reading this page takes.
    //
    // ⚠️ IT NEEDS A PATH TO THE DESTINATION OR IT NEVER FIRES AT ALL, so the
    // sink is a gain of zero rather than nothing. A silent node that is
    // connected is not the same as a node that is not connected, and only one
    // of them counts callbacks.
    if (typeof ctx.createScriptProcessor === 'function') {
      sp = ctx.createScriptProcessor(BLOCK, 2, 2);
      sp.onaudioprocess = () => { calls++; };
      const hush = ctx.createGain();
      hush.gain.value = 0;
      postAn.connect(sp);
      sp.connect(hush);
      hush.connect(ctx.destination);
    }
    markCalls();
    say(`audio graph up · ${ctx.sampleRate} Hz · block ${BLOCK}`
      + ` · ${sp ? 'ScriptProcessorNode present' : 'no ScriptProcessorNode in this browser'}`);
    return ctx;
  }

  const markCalls = () => { callMark = { n: calls, t: performance.now() }; };
  function callRate() {
    if (!sp) return null;
    const dt = performance.now() - callMark.t;
    return dt >= 300 ? ((calls - callMark.n) * 1000) / dt : null;
  }

  function rmsOf(an) {
    if (!an || !buf) return null;
    an.getFloatTimeDomainData(buf);
    let s = 0;
    for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
    return Math.sqrt(s / buf.length);
  }

  /** Open or shut the one gain everything downstream of the tone passes. */
  function setGate(open) {
    gateWanted = open ? TONE_GAIN : 0;
    if (gate) gate.gain.value = gateWanted;
  }

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const ms3 = (s) => (s === null || s === undefined || !Number.isFinite(s) ? null : s * 1000);

  /**
   * The five numbers, plus the two levels and the callback rate.
   *
   * ⚠️ NOTHING UNMEASURED IS A ZERO. `outputLatency` is not implemented
   * everywhere and comes back `undefined`; that is null here and prints as an
   * empty cell, because a zero reads as a very confident measurement of an
   * output delay nobody asked about.
   */
  function reading(where) {
    return {
      where,
      at: Number((performance.now() / 1000).toFixed(2)),
      state: ctx ? ctx.state : null,
      sampleRate: ctx ? ctx.sampleRate : null,
      baseLatency: ctx && Number.isFinite(ctx.baseLatency) ? ctx.baseLatency : null,
      outputLatency: ctx && Number.isFinite(ctx.outputLatency) ? ctx.outputLatency : null,
      preRms: rmsOf(preAn),
      postRms: rmsOf(postAn),
      calls,
      callRate: callRate(),
    };
  }

  const n4 = (x) => (x === null || x === undefined || !Number.isFinite(x) ? 'none' : x.toFixed(4));
  const n2 = (x) => (x === null || x === undefined || !Number.isFinite(x) ? 'none' : x.toFixed(2));

  const line = (r) => `${r.where} · ctx ${r.state} · ${r.sampleRate} Hz`
    + ` · base ${n2(ms3(r.baseLatency))} ms · out ${n2(ms3(r.outputLatency))} ms`
    + ` · pre ${n4(r.preRms)} · post ${n4(r.postRms)}`
    + ` · calls ${n2(r.callRate)}/s of ${n2(expectedRate())}`;

  const expectedRate = () => (ctx && sp ? ctx.sampleRate / BLOCK : null);

  // ── what has been taken, and from where ───────────────────────────────────
  //
  // 🔴 TWO RECORDS, NEVER ONE. The worst failure this page could have is
  // reporting a window number as a session number: it would answer every one of
  // the four questions, confidently, with the answer we already had. They are
  // separate objects, they are only ever written by the arm that took them, and
  // there is an assert below that nothing in the session record exists unless a
  // session was presented.
  const arms = {
    build: BUILD,
    window: null,          // the control
    session: null,         // inside immersive-vr, or null
    sabotage: { window: null, session: null },
    decode: { window: null, session: null },
    guard: null,
  };
  window.__demo.arms = arms;

  // ── the panel ─────────────────────────────────────────────────────────────
  //
  // 🔴 THE 2D PAGE IS INVISIBLE INSIDE A SESSION. The readout and the log are
  // behind your face, so anything a wearer needs to read has to be drawn in the
  // scene. This is `shell/panel.mjs`, which is the one panel design here.
  //
  // ⚠️ SMALL ON PURPOSE, AND IT IS A MEASUREMENT DECISION RATHER THAN A LOOKING
  // ONE. xr-panel uploads a plain canvas with `texImage2D` every frame, so a
  // 1280x800 panel would be four megabytes a frame of main-thread copy at
  // 90 Hz, competing with the very callback arm 3 is counting. At 512x320 and
  // scale 1 it is 655 KiB, and `uploadCpuMs` is beaconed so the remaining cost
  // is on the record rather than hidden inside the answer.
  const panel = createPanel({ width: 512, height: 320, scale: 1 });
  panel.canvas.className = 'es-panel';
  d.el.append(panel.canvas);

  function paint(r, note) {
    panel.draw({
      source: null,
      state: note || (r ? `${r.where} · ${r.state}` : 'nothing measured yet'),
      footer: [
        ['level', r ? n4(r.postRms) : ''],
        ['calls/s', r && r.callRate !== null ? r.callRate.toFixed(1) : ''],
        ['out ms', r ? n2(ms3(r.outputLatency)) : ''],
        ['drawn', xr && xr.state.frames ? String(xr.state.frames) : ''],
      ],
    });
  }

  function show(r) {
    if (!r) return;
    d.set('context', r.state);
    d.set('rate', r.sampleRate);
    d.set('base', ms3(r.baseLatency));
    d.set('out', ms3(r.outputLatency));
    d.set('level', r.postRms === null ? null : r.postRms.toFixed(4));
    d.set('calls', r.callRate);
    d.set('drawn', xr && xr.state.presenting ? xr.state.frames : null);
  }

  // ── control B: the gate, shut on purpose ──────────────────────────────────
  /**
   * 🔴 A METER THAT CANNOT READ ZERO IS NOT A METER, AND THIS REPO HAS SHIPPED
   * ONE. Three facts come out of one sabotage and all three are needed:
   * the post-gate level falls to nothing, the PRE-gate level stays up while it
   * does (or the tone simply stopped, which is a different failure wearing the
   * same reading), and the level comes back when the gate reopens.
   */
  async function sabotage(where) {
    const before = reading(where);
    say(`sabotage · shutting the gate for ${SHUT_MS} ms`);
    setGate(false);
    await wait(SHUT_MS);
    const shut = reading(where);
    setGate(true);
    await wait(SHUT_MS);
    const after = reading(where);
    const out = {
      where,
      beforePost: before.postRms, shutPost: shut.postRms, afterPost: after.postRms,
      shutPre: shut.preRms,
    };
    arms.sabotage[where] = out;
    say(`sabotage ${where} · post ${n4(out.beforePost)} -> ${n4(out.shutPost)} -> ${n4(out.afterPost)}`
      + ` · pre held at ${n4(out.shutPre)}`);
    return out;
  }

  // ── arm 2: our own bytes, decoded ─────────────────────────────────────────
  /**
   * Fetch a byte range of whatever our own station is playing, split it into
   * frames, and hand those to AudioDecoder.
   *
   * ⚠️ NOT `createMp3Stream`, AND THE REASON IS A PREFLIGHT. That module sends
   * `Icy-MetaData: 1`, which is not CORS-safelisted, and the station Worker's
   * `access-control-allow-headers` is `range, authorization, content-type`. The
   * preflight fails and nothing is ever fetched. There is no ICY on our own
   * bucket to demux anyway, and the question here is about the DECODER rather
   * than about a stream, so it is asked of the decoder directly.
   *
   * ⚠️ BOTH PATHS ASSERT. WebCodecs where it configures, `decodeAudioData`
   * where it does not: a page that branches has to grade every branch or the
   * suite is green over a path nobody reached.
   */
  async function decodeArm(where) {
    const t0 = performance.now();
    const out = { where, programme: null, path: 'none', framing: null, codec: null,
      frames: 0, decoded: 0, sampleRate: null, channels: null, errors: 0, why: '' };

    const now = await step(`${where}: ask our own station what it is playing`, 8000, async () => {
      const r = await fetch(`${STATION}/now.json`, { cache: 'no-store' });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    });
    const key = now.ok && now.v && typeof now.v.programme === 'string' ? now.v.programme : null;
    out.programme = key;
    if (!key) {
      out.why = now.ok ? 'the station named no programme' : now.why;
      arms.decode[where] = out;
      return out;
    }

    const got = await step(`${where}: read ${RANGE >> 10} KiB of ${key}`, 15000, async () => {
      const r = await fetch(`${STATION}/media/${encodeURIComponent(key)}`,
        { headers: { Range: `bytes=0-${RANGE - 1}` } });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return { type: r.headers.get('content-type') || '', bytes: new Uint8Array(await r.arrayBuffer()) };
    });
    if (!got.ok) { out.why = got.why; arms.decode[where] = out; return out; }

    // 🔴 THE RESPONSE SAYS WHAT IT IS SENDING, NEVER THE URL. An `.mp3` suffix
    // is not evidence, and `canPlayType` answers "maybe" in two browsers that
    // cannot both play the thing.
    out.framing = framingFor(got.v.type);
    const splitter = createFrameSplitter({ framing: out.framing });
    const frames = splitter.push(got.v.bytes);
    out.frames = frames.length;
    if (!frames.length) {
      out.why = `no frames in ${got.v.bytes.length} bytes of ${got.v.type}`;
      arms.decode[where] = out;
      return out;
    }
    const f0 = frames[0];
    out.codec = f0.codec;
    out.framing = splitter.framing;

    const take = frames.slice(0, DECODE_FRAMES);
    if (typeof AudioDecoder !== 'undefined') {
      const cfg = { codec: f0.codec, sampleRate: f0.sampleRate, numberOfChannels: f0.channels };
      const sup = await step(`${where}: ask AudioDecoder about ${f0.codec}`, 6000,
        () => AudioDecoder.isConfigSupported(cfg));
      if (sup.ok && sup.v && sup.v.supported) {
        out.path = 'AudioDecoder';
        let errs = 0;
        const dec = new AudioDecoder({
          output: (data) => {
            try {
              out.decoded++;
              out.sampleRate = data.sampleRate;
              out.channels = data.numberOfChannels;
            } finally { data.close(); }
          },
          error: () => { errs++; },
        });
        dec.configure(cfg);
        let ts = 0;
        for (const f of take) {
          // Every whole frame is independently decodable in both framings, and
          // the decoder carries its own state across them.
          dec.decode(new EncodedAudioChunk({ type: 'key', timestamp: ts, data: f.bytes }));
          ts += Math.round((f.samplesPerFrame * 1e6) / f.sampleRate);
        }
        const flushed = await step(`${where}: flush the decoder`, 10000, () => dec.flush());
        if (!flushed.ok) out.why = flushed.why;
        try { dec.close(); } catch { /* already closed */ }
        out.errors = errs;
      } else {
        out.why = sup.ok ? 'AudioDecoder will not configure for this codec' : sup.why;
      }
    } else {
      out.why = 'this browser has no AudioDecoder';
    }

    if (out.path === 'none') {
      // A run of whole frames is a valid tiny file in both framings, so this
      // needs no container around it. It costs a start-up transient per call,
      // which is exactly why it is the fallback and not the choice.
      out.path = 'decodeAudioData';
      let total = 0;
      for (const f of take) total += f.bytes.length;
      const blob = new Uint8Array(total);
      let at = 0;
      for (const f of take) { blob.set(f.bytes, at); at += f.bytes.length; }
      const dec = await step(`${where}: decodeAudioData over ${take.length} frames`, 15000,
        () => graph().decodeAudioData(blob.buffer));
      if (dec.ok && dec.v) {
        out.decoded = Math.max(1, Math.round(dec.v.length / f0.samplesPerFrame));
        out.sampleRate = dec.v.sampleRate;
        out.channels = dec.v.numberOfChannels;
      } else {
        out.why = dec.why || 'decodeAudioData returned nothing';
      }
    }

    out.ms = Math.round(performance.now() - t0);
    arms.decode[where] = out;
    d.set('decoded', out.decoded);
    say(`decode ${where} · ${out.path} · ${out.framing} · ${out.codec}`
      + ` · ${out.frames} frames in, ${out.decoded} out · ${out.sampleRate} Hz · ${out.channels} ch`
      + ` · ${out.errors} errors · ${out.ms} ms${out.why ? ` · ${out.why}` : ''}`);
    return out;
  }

  // ── the session ───────────────────────────────────────────────────────────
  //
  // 🔴 THE SESSION ITSELF IS `demo/shell/xr-panel.mjs` AND NOT THIS PAGE.
  // Getting into an immersive session is the most expensive code in this repo
  // to get right, and every one of its five defects is silent from outside:
  // `baseLayer` is null until the next animation frame, `gl.clear` ignores the
  // viewport, `alpha: false` makes passthrough impossible, a session name is
  // not a blend mode, and `bindAttribLocation` after `linkProgram` is a no-op
  // that reads like a fix. A fourth session path here would inherit none of the
  // fixes and none of the ways out.
  //
  // ⚠️ NO `surface`, AND THAT IS DELIBERATE. The module takes one, and this
  // page's subject is audio: an ungraded shader of its own would spend the one
  // headset run somebody is going to make on a picture nobody asked for. The
  // room's dotted grid is the ground, the panel above carries the numbers, and
  // the frame counter says whether anything drew at all.
  //
  // ⚠️ AND THE ROOM STAYS, THOUGH THIS PAGE WANTS NO FURNITURE. The tablet, the
  // hands and therefore the quit badge's grips are built only where there is a
  // room, so `room: null` is a session with no visible way out.
  const xr = createXRPanels({
    panels: [{ canvas: panel.canvas, w: 1.0, h: 0.625 }],
    room: { seed: 424242, sky: false, things: false, bg: [0.020, 0.025, 0.034] },
    log: (m, k) => d.log(m, k),
    onFrame: () => onXrFrame(),
    onEnd: () => onXrEnd(),
  });
  window.__demo.xr = xr.state;

  let sesT0 = 0, lastBeat = 0, noDataSaid = false, sesSabotaged = false, sesDecoded = false;

  function onXrFrame() {
    const t = performance.now();
    if (!sesT0) {
      sesT0 = t; lastBeat = t;
      markCalls();
      say(`session drawing · blend ${xr.state.blendMode} · ${xr.state.views} view(s)`
        + ` · ctx ${ctx ? ctx.state : 'none'}`);
    }
    if (t - lastBeat >= BEAT_MS) {
      lastBeat = t;
      const r = reading('session');
      arms.session = r;
      show(r);
      paint(r);
      markCalls();
      say(`${line(r)} · drawn ${xr.state.frames} · fps ${n2(xr.state.fps)}`
        + ` · upload ${n2(xr.state.uploadCpuMs)} ms`);
    }
    // 🔴 THE NO-DATA DEADLINE, WHICH IS THE ONE NOBODY HAS. A silent decoder
    // and a black picture look identical from inside a headset, and without
    // this line the wearer's report is "it did not work", which names neither.
    if (!noDataSaid && t - sesT0 > NO_DATA_MS) {
      noDataSaid = true;
      const r = reading('session');
      const heard = r.postRms !== null && r.postRms > 1e-4;
      const serviced = r.callRate !== null && r.callRate > 1;
      if (!heard || !serviced) {
        say(`NO DATA ${Math.round(t - sesT0)} ms in · frames ${xr.state.frames}`
          + ` · level ${n4(r.postRms)} · calls ${n2(r.callRate)}/s · ctx ${r.state}`, 'bad');
      }
    }
    if (!sesDecoded && t - sesT0 > DECODE_AT_MS) {
      sesDecoded = true;
      decodeArm('session').catch(() => {});
    }
    if (!sesSabotaged && t - sesT0 > SABOTAGE_AT_MS) {
      sesSabotaged = true;
      sabotage('session').catch(() => {});
    }
  }

  function onXrEnd() {
    const r = reading('window');
    // ⚠️ `sent` IS ON THIS LINE ON PURPOSE. "Nothing was measured" and "it was
    // all measured and none of it left the headset" are opposite findings and
    // they read identically at the other end, which is a reader looking at an
    // empty device log.
    say(`session ended · ${xr.state.frames} frames · fps ${n2(xr.state.fps)}`
      + ` · ${sent} lines reported`
      + ` · back in the window: ctx ${r.state} · ${r.sampleRate} Hz · post ${n4(r.postRms)}`);
    show(r);
    paint(r, 'back in the window');
  }

  // ⚠️ A DOFF IS NOT AN EXIT AND THE PAGE CANNOT SEE ONE DIRECTLY. Closing the
  // gate on `visibilitychange` is the honest analogue: a headset put down on a
  // table should not go on making a tone into an empty room. It may be about
  // ten seconds late, because that is when Horizon OS gets round to saying so.
  addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && gate && gateWanted) {
      setGate(false);
      say('hidden · gate closed. This can be about ten seconds after a headset came off.');
    }
  });

  // ── the controls ──────────────────────────────────────────────────────────
  let windowDone = false;

  d.on('here', async () => {
    graph();
    // 🔴 THE PRESS THAT MEASURES IS THE PRESS THAT OPENS THE GATE. Nothing on a
    // controller is a DOM event, so a gate that waits for one leaves a wearer
    // standing in a silent room with no way to fix it.
    setGate(true);
    markCalls();
    await wait(WATCH_MS);
    const r = reading('window');
    arms.window = r;
    show(r);
    paint(r);
    say(line(r));

    const sab = await sabotage('window');
    markCalls();
    await wait(WATCH_MS);
    const after = reading('window');
    arms.window = after;
    show(after);
    paint(after);

    windowDone = true;

    // ── the window baselines, which are the control for everything else ────
    d.assert('the audio clock is running in the window',
      after.state === 'running', `${after.state} · ${after.sampleRate} Hz`);
    d.assert('the browser reports a believable buffer delay for itself',
      Number.isFinite(after.baseLatency) && after.baseLatency > 0 && after.baseLatency < 0.2,
      `base ${n2(ms3(after.baseLatency))} ms · out ${n2(ms3(after.outputLatency))} ms`);
    d.assert('the level meter can read zero, so a zero later means something',
      sab.shutPost !== null && sab.shutPost < 1e-4, `shut: ${n4(sab.shutPost)}`);
    d.assert('and it is reading the gate rather than the oscillator',
      sab.shutPre !== null && sab.shutPre > 1e-3,
      `pre held at ${n4(sab.shutPre)} while post read ${n4(sab.shutPost)}`);
    d.assert('the level comes back when the gate reopens',
      sab.afterPost !== null && sab.afterPost > 1e-3, `after: ${n4(sab.afterPost)}`);
    d.assert('this browser has the main-thread audio callback the loop tour depends on',
      !!sp, sp ? `ScriptProcessorNode, ${BLOCK} frames a block` : 'no createScriptProcessor here');
    // 🔴 THE WINDOW ANSWER TO QUESTION 4. A quarter either way is generous and
    // it is meant to be: the point of this number is not its precision here, it
    // is having a figure from a machine doing nothing to hold the headset's
    // against.
    const want = expectedRate();
    d.assert('and it fired at the rate its block size implies',
      !!sp && after.callRate !== null && want !== null
        && Math.abs(after.callRate - want) / want < 0.25,
      sp ? `${n2(after.callRate)}/s against ${n2(want)}/s expected` : 'no ScriptProcessorNode to count');
  });

  d.on('decode', async () => {
    graph();
    const out = await decodeArm('window');
    d.assert('our own station named a programme to read',
      typeof out.programme === 'string' && out.programme.length > 0,
      out.programme || out.why || 'the station answered with no programme');
    d.assert('its bytes are audio frames this page can read',
      out.framing === 'mpeg' && out.frames > 0,
      `${out.framing} · ${out.frames} frames · ${out.codec}`);
    d.assert('and the browser turned them into samples',
      out.decoded > 0 && out.errors === 0,
      `${out.path} · ${out.decoded} out of ${Math.min(out.frames, DECODE_FRAMES)} in`
      + ` · ${out.sampleRate} Hz · ${out.channels} ch${out.why ? ` · ${out.why}` : ''}`);
  });

  d.on('vr', async () => {
    if (!windowDone) { graph(); setGate(true); }
    // ⚠️ WAIT FOR THE PROBE, NEVER RE-ASK IT. Whether this browser can show an
    // immersive session is answered once at load, away from any gesture,
    // because asking again here can spend the transient activation
    // `requestSession` needs. A bounded wait is the difference between "we have
    // not looked yet" and "there is none".
    for (let i = 0; i < 20 && headsetSupported() === null; i++) await wait(50);
    const g = guardNow();
    arms.guard = g;
    say(`headset guard · ${g.headset ? 'a headset' : `refused at the ${g.gate} gate`} · ${g.why}`);

    let entered = false, why = g.why;
    if (g.headset) {
      const r = await step('requestSession immersive-vr', 95000, () => xr.enter());
      entered = !!(r.ok && r.v);
      if (!entered) why = r.ok ? 'the module refused the session' : r.why;
    } else {
      paint(arms.window, 'no headset here');
    }

    d.assert('the page either entered a session or said in words why it could not',
      (entered && xr.state.presenting) || (!entered && !!why),
      entered ? `presenting · blend ${xr.state.blendMode}` : why);
    // 🔴 NOTHING IS CLAIMED ABOUT A HEADSET THAT WAS NOT WORN. The worst thing
    // this page could do is print a window number in a session cell: it would
    // answer all four questions, confidently, with the answer we already had.
    d.assert('and no session reading exists unless a session presented',
      xr.state.presenting ? true : arms.session === null,
      xr.state.presenting ? `${xr.state.frames} frames drawn`
        : `session record is ${arms.session === null ? 'empty, correctly' : 'POPULATED WITHOUT A SESSION'}`);
  });

  // ── what a laptop can grade, graded at load ───────────────────────────────
  //
  // 🔴 THE GUARD, BROKEN ON PURPOSE, THREE WAYS. A refusal nobody has seen
  // refuse is a hope. These run `verdict()` over fabricated probes rather than
  // over whatever browser this happens to be, so all three cases run on a
  // laptop, on a phone and on a headset, and sabotaging `verdict` turns them
  // red instead of leaving them green about nothing.
  const NATIVE_SHAPE = {
    present: true, own: false, proto: 'accessor',
    methods: ['isSessionSupported', 'requestSession'], jsSourced: [],
    ctor: 'XRSystem', secure: true,
  };
  const POLYFILL_SHAPE = {
    ...NATIVE_SHAPE, jsSourced: ['isSessionSupported', 'requestSession'],
  };
  {
    const a = verdict(NATIVE_SHAPE, true);
    d.assert('the headset guard accepts an XR object the browser compiled in',
      a.headset === true && a.gate === null, a.why);
    // The liar: it answers `immersive-vr: true`, so a support test on its own
    // waves it through. That is the whole reason the nativeness gate exists.
    const b = verdict(POLYFILL_SHAPE, true);
    d.assert('and refuses a JavaScript XR object that claims immersive-vr, at the native gate',
      b.headset === false && b.gate === 'native', b.why);
    // The genuine browser with nothing on anybody's head, which is what this
    // laptop is. A nativeness test on its own waves THIS one through.
    const c = verdict(NATIVE_SHAPE, false);
    d.assert('and refuses a genuine browser with no headset behind it, at the device gate',
      c.headset === false && c.gate === 'device', c.why);
  }
  // Without a stamp, "still broken" and "the fix never loaded" are the same
  // observation. Every beaconed line from this page can be attributed to a
  // build because this one goes out first.
  d.assert('the page says which build it is before it measures anything',
    typeof BUILD === 'string' && BUILD.length > 0, `BUILD ${BUILD}`);

  const here = guardNow();
  arms.guard = here;
  say(`BUILD ${BUILD} · ${here.headset ? 'a headset' : `no headset: refused at the ${here.gate} gate`} · ${here.why}`);
  // 🔴 SAY WHICH ANSWERS THIS MACHINE CANNOT GIVE, IN WORDS, ON THE PAGE. A
  // reader who sees eight filled cells and a green run has every reason to
  // think the questions are answered. Four of them are device facts and no
  // laptop can reach them, and a page that does not say so is a page that
  // quietly claims more than it measured.
  if (!here.headset) {
    say('only the window column can be filled here. Whether the audio clock survives a'
      + ' session, what the delays read inside one, whether the decoder still runs there'
      + ' and whether the callbacks keep up at 90 Hz are all facts about a headset.');
  }
  say(reporting()
    ? 'reporting to the device log'
    : 'not reporting: no headset here, and nothing is posted from a browser without one');
  paint(null, 'press Measure here');
  d.ready();
</script>
</html>
