<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .note-line { font: 400 11.5px/1.7 var(--mono); color: var(--dim); margin: 0 0 10px; max-width: 42rem; }
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createKeyboard } from '/shell/keyboard.mjs';

  const ROOM = new URLSearchParams(location.search).get('room') || 'carry-demo';
  const RELAY = `wss://ws.positron.studio/room/${ROOM}/ws`;
  const RATE = 48000;
  const FRAME = 960;              // 20 ms at 48 kHz -> 50 messages a second
  const ID = Math.random().toString(36).slice(2, 8);

  const d = mount({
    name: 'carry',
    what: 'Press a key and the sound you hear has been to a server and back. This page makes no sound of its own: it synthesises an electric piano, sends the raw samples out over a socket, and plays only what the server returns — so the delay is the trip, and you are listening to it rather than reading it. Raw samples, not a compressed stream, because the socket has bandwidth to spare and compressing costs more than it saves.',
    readout: { out: '', back: '', lost: '', rate: 'kbit/s', trip: 'ms' },
    controls: [
      { id: 'start', label: 'Start and connect', primary: true },
      { id: 'phrase', label: 'Play a phrase' },
      { id: 'check', label: 'Run the checks' },
    ],
  });
  guard(d);

  const noteLine = el('p', 'note-line', 'not started');
  d.el.append(noteLine);

  let ctx = null, ws = null, synth = null, playout = null;
  let seqOut = 0, sentMsgs = 0, gotMsgs = 0, sentBytes = 0, lastSeq = -1, gaps = 0;
  const trips = [];
  let pending = null;                     // {t0} of the most recent key press

  const kb = createKeyboard(d.el, {
    base: 60,
    onDown: (note) => {
      kb.lightNote(note, true);
      if (!synth) { noteLine.textContent = 'press "Start and connect" first'; return; }
      pending = { t0: performance.now() };
      synth.port.postMessage({ on: note, vel: 100 });
    },
    onUp: (note) => kb.lightNote(note, false),
  });

  /**
   * ONE SOURCE FOR THE SOUND. The electric piano is `shell/rhodes.mjs`, pure
   * per-sample arithmetic so the same maths runs here, in node, and in C on a
   * box. An AudioWorklet cannot `import`, so rather than keeping a second copy
   * of the maths — which is how the container's test picture drifted a whole
   * session behind — the module's text is fetched and inlined into the worklet
   * source at load. One file, two runtimes.
   */
  async function buildSynth() {
    const src = (await (await fetch('/shell/rhodes.mjs')).text()).replace(/^export /gm, '');
    const code = src + `
      class R extends AudioWorkletProcessor {
        constructor() {
          super();
          this.voices = [];
          this.t = 0;
          this.port.onmessage = (e) => {
            if (e.data.on !== undefined) {
              const f = 440 * Math.pow(2, (e.data.on - 69) / 12);
              this.voices.push({ v: rhodesVoice(f, e.data.vel), t0: this.t / sampleRate });
              if (this.voices.length > 24) this.voices.shift();
            }
          };
        }
        process(_i, outputs) {
          const out = outputs[0][0];
          const pcm = new Float32Array(out.length);
          for (let n = 0; n < out.length; n++) {
            const t = (this.t + n) / sampleRate;
            pcm[n] = mixVoices(this.voices, t);
            out[n] = 0;              // SILENT locally: you hear the return, not this
          }
          this.t += out.length;
          this.port.postMessage(pcm, [pcm.buffer]);
          return true;
        }
      }
      registerProcessor('rhodes', R);`;
    await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([code], { type: 'text/javascript' })));
    return new AudioWorkletNode(ctx, 'rhodes', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [1] });
  }

  // 128-sample quanta batched into 20 ms messages: 50 a second, under the
  // relay's 60/s cap, which it enforces by dropping SILENTLY.
  let batch = new Float32Array(FRAME), filled = 0;
  function onQuantum(pcm) {
    let off = 0;
    while (off < pcm.length) {
      const take = Math.min(FRAME - filled, pcm.length - off);
      batch.set(pcm.subarray(off, off + take), filled);
      filled += take; off += take;
      if (filled === FRAME) { sendFrame(batch); filled = 0; }
    }
  }

  function sendFrame(f32) {
    if (ws?.readyState !== 1) return;
    // 12-byte header: a counter so loss is visible, and the send instant so the
    // trip can be timed. The relay adds nothing and re-stamps nothing.
    const buf = new ArrayBuffer(12 + f32.length * 2);
    const dv = new DataView(buf);
    dv.setUint32(0, seqOut, true);
    dv.setFloat64(4, performance.now(), true);
    const pcm = new Int16Array(buf, 12);
    for (let i = 0; i < f32.length; i++) pcm[i] = Math.max(-32768, Math.min(32767, f32[i] * 32767));
    ws.send(buf);
    seqOut++; sentMsgs++; sentBytes += buf.byteLength;
    d.set('out', sentMsgs);
    d.set('rate', Math.round(sentBytes * 8 / 1000 / Math.max(1, (performance.now() - t0Start) / 1000)));
  }

  let t0Start = performance.now();

  d.on('start', async () => {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    await ctx.resume();

    // The playout ring is proto/jam's, with a floor we choose — the same one the
    // MoQ return path uses. WebRTC's cushion is the browser's and cannot be set;
    // this one is ours, which is the whole reason to own the transport.
    await ctx.audioWorklet.addModule('/proto/jam/playout-worklet.js');
    playout = new AudioWorkletNode(ctx, 'pcm-playout', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [1] });
    playout.connect(ctx.destination);
    playout.port.postMessage({ cmd: 'floor', ms: 40, adaptive: false });

    synth = await buildSynth();
    const sink = ctx.createGain(); sink.gain.value = 0;
    synth.connect(sink).connect(ctx.destination);      // keeps the graph alive; silent
    synth.port.onmessage = (e) => onQuantum(e.data);

    ws = new WebSocket(RELAY);
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => { t0Start = performance.now(); d.log(`joined ${ROOM}`, 'hi'); noteLine.textContent = 'press a key — what you hear came back from the server'; };
    ws.onmessage = (e) => {
      const buf = e.data;
      if (!(buf instanceof ArrayBuffer) || buf.byteLength < 12) return;
      const dv = new DataView(buf);
      const seq = dv.getUint32(0, true);
      const sentAt = dv.getFloat64(4, true);
      if (lastSeq >= 0 && seq !== lastSeq + 1) gaps += Math.max(0, seq - lastSeq - 1);
      lastSeq = seq;
      gotMsgs++;
      d.set('back', gotMsgs);
      d.set('lost', gaps, gaps ? 'bad' : 'ok');
      // one clock, both stamps: no clock offset is in this number
      trips.push(performance.now() - sentAt);
      const s = [...trips].sort((a, b) => a - b);
      d.set('trip', Math.round(s[Math.floor(s.length / 2)]));

      const pcm16 = new Int16Array(buf, 12);
      const f32 = new Float32Array(pcm16.length);
      let peak = 0;
      for (let i = 0; i < pcm16.length; i++) { f32[i] = pcm16[i] / 32768; const a = Math.abs(f32[i]); if (a > peak) peak = a; }
      if (pending && peak > 0.02) { /* the returned sound, not the sending of it */ pending = null; }
      playout.port.postMessage({ pcm: f32 }, [f32.buffer]);
    };
    addEventListener('pagehide', () => { try { ws.close(); } catch { /* gone */ } });
  });

  d.on('phrase', async () => {
    if (!synth) { noteLine.textContent = 'press "Start and connect" first'; return; }
    for (const n of [65, 69, 72, 76, 72, 69]) {
      kb.lightNote(n, true);
      synth.port.postMessage({ on: n, vel: 100 });
      await new Promise((r) => setTimeout(r, 220));
      kb.lightNote(n, false);
    }
  });

  d.on('check', () => {
    d.assert('audio running', !!ctx && ctx.state === 'running', ctx?.state ?? 'none');
    d.assert('socket open', ws?.readyState === 1, String(ws?.readyState));
    d.assert('samples went out', sentMsgs > 0, `${sentMsgs} messages, ${(sentBytes / 1024).toFixed(0)} KiB`);
    // The claim in the title: it is the RETURN you hear, so the return must exist.
    d.assert('and came back', gotMsgs > 0, `${gotMsgs} messages`);
    // seq is the only thing that can see this relay drop: it does so silently,
    // with no error, no close and no backpressure.
    d.assert('nothing was dropped', gaps === 0, `${gaps} missing of ${sentMsgs}`);
    d.assert('the trip is a real number', trips.length > 0 && trips.every((t) => t > 0),
      trips.length ? `${Math.round(Math.min(...trips))}–${Math.round(Math.max(...trips))} ms` : 'none');
    d.assert('50 messages a second, under the relay cap of 60', FRAME === 960, `${RATE / FRAME} per second`);
  });

  d.ready();
</script>
</html>
