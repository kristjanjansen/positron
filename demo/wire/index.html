<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* The air between blocks belongs to the tab's stack, so nothing here carries
     an outer margin (positron-compose §1). */
  .compose {
    display: flex; flex-wrap: wrap; gap: var(--ctl-gap); align-items: center;
    border: 1px solid var(--line); border-radius: 4px; background: var(--card);
    padding: 10px;
  }
  .compose label { font: 400 11px/1 var(--mono); color: var(--dim); }
  .compose input[type=text] {
    font: 400 12.5px/1.4 var(--mono); color: var(--fg); background: #0b0e14;
    border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; min-width: 0;
  }
  .compose .body { flex: 1 1 140px; }
  /* A tab's own buttons. Not `.pos-controls`, which the harness presses by
     position across the whole document, blind to tabs (tab-page.mjs rule 4).
     A start row, so on a phone it wraps as a cluster at each button's size. */
  .wire-acts { display: flex; flex-wrap: wrap; gap: var(--ctl-gap); align-items: center; }
  .wire-acts[hidden] { display: none; }
</style>

<script type="module">
  import { mount, guard } from '/shell/shell.mjs';
  import { createTabPage } from '/shell/tab-page.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import * as bytes from './bytes.mjs';
  import * as notes from './notes.mjs';

  /* Two tabs: BYTES (a message as the exact bytes out and back) and NOTES (a keyboard
     over the same relay). BYTES uses the shared `wire` room (manifest `room: 'fixed'`);
     NOTES names its own so harness runs never play into each other.
     See lessons/page-wire.md#wire-1 */
  const d = mount({
    name: 'wire',
    // No `what` under the title: each tab describes itself under the tab row. The
    // manifest's `one` line still describes the page on the index.
    // See lessons/page-wire.md#wire-2
    readout: null,
    showLog: false,
  });
  guard(d);

  const page = createTabPage(d, {
    tabs: [
      { id: 'bytes', label: 'MESSAGES', mod: bytes },
      { id: 'notes', label: 'KEYBOARD', mod: notes },
    ],
    at: 'bytes',
  });

  if (SELFCHECK) await page.check();
  d.ready();
</script>
</html>
