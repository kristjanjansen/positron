<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* The air between blocks belongs to the tab's stack, so nothing here carries
     an outer margin (positron-compose §1). */
  .compose {
    display: flex; flex-wrap: wrap; gap: var(--ctl-gap); align-items: center;
    border: 1px solid var(--line); border-radius: 4px; background: var(--card);
    padding: 10px;
  }
  .compose label { font: 400 11px/1 var(--mono); color: var(--dim); }
  .compose input[type=text] {
    font: 400 12.5px/1.4 var(--mono); color: var(--fg); background: #0b0e14;
    border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; min-width: 0;
  }
  .compose .body { flex: 1 1 140px; }
  /* A tab's own buttons. Not `.pos-controls`, which the harness presses by
     position across the whole document, blind to tabs (tab-page.mjs rule 4).
     A start row, so on a phone it wraps as a cluster at each button's size. */
  .wire-acts { display: flex; flex-wrap: wrap; gap: var(--ctl-gap); align-items: center; }
  .wire-acts[hidden] { display: none; }
</style>

<script type="module">
  import { mount, guard } from '/shell/shell.mjs';
  import { createTabPage } from '/shell/tab-page.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import * as bytes from './bytes.mjs';
  import * as notes from './notes.mjs';

  /*
   * 🔴 TWO OLD PAGES AS TWO TABS, decided 2026-10-04 (*"names ok, looper
   * retires, no redrect, capture is fine"*, plans/plan-demo-structure.md §3.3).
   * BYTES is the old `/wire/`: a message as the exact bytes that go out and
   * come back. NOTES is the old `/instrument/`: a keyboard over the same relay,
   * and how late a note lands on another machine. Each tab is a module beside
   * this file, built the first time it is opened, with its own readout and log.
   *
   * ⚠️ THE TWO TABS USE TWO ROOMS ON PURPOSE. BYTES's room is the shared `wire`
   * whose history is its subject, so the manifest keeps `room: 'fixed'` and the
   * harness passes no `?room=`. NOTES names its own (`notes.mjs` says how), so
   * two harness runs never play into each other.
   */
  const d = mount({
    name: 'wire',
    what: 'A message as the exact bytes that travel, and a note as how late it lands on another machine.',
    readout: null,
    showLog: false,
  });
  guard(d);

  const page = createTabPage(d, {
    tabs: [
      { id: 'bytes', label: 'BYTES', mod: bytes },
      { id: 'notes', label: 'NOTES', mod: notes },
    ],
    at: 'bytes',
  });

  if (SELFCHECK) await page.check();
  d.ready();
</script>
</html>
