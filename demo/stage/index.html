  refit(tabs.at());
  /**
   * The bar and the strip are one surface here for the same reason they are in
   * the archive: the strip shows a position and the bar drives it, so two
   * bordered boxes with the page rhythm between them would state that they are
   * two things.
   */
  room.append(createGlue(showBar.el, roomStrip.el));

  /**
   * 🔴 THE FILM HAS ITS OWN TRANSPORT, AND IT IS GLUED UNDER THE PICTURE IT
   * DRIVES. Asked 2026-09-19: *"move video play / stop to videopanel footer"*
   * and *"make transportbar glueable to videopanel footer"*. Play and stop
   * belong to the picture, and the panel's footer is the row under the picture:
   * glued, the two are one object with one edge, which is `createStripView`'s
   * own arrangement for a strip and its footer.
   *
   * 🔴 AND THE FILM IS NOT THE SHOW. Asked in the same line: *"make video
   * transport indepencent of when show starts"*. Until now the film played only
   * from `startShow`, so there was no way to look at the picture without
   * recording a show, and two different things were behind one press. They are
   * two presses now: this one moves the picture, the one under the timeline puts
   * it on air. Starting a show no longer touches the film, and stopping one no
   * longer stops it.
   * ⚠️ **SO A SHOW CAN GO OUT WITH A STILL IN IT**, which is a real state and
   * the page says so in the log rather than quietly starting the film for you.
   *
   * 🔴 IT IS PLAY, STOP AND A CLOCK, AND IT GIVES UP THE SLIDER. That is the
   * standing rule about one position surface per page, and this tab already has
   * a strip: a 22 minute axis stacked 40 px above a 30 second one, at different
   * scales with different origins, is the contradiction that rule is written
   * about rather than a convenience. It is also exactly what was asked for,
   * which was *"video play / stop"* and not a way to cue.
   * ⚠️ **THE CLOCK IS NOT A SECOND AXIS.** `0:00.000 / 22:11.850` is a readout
   * of one position and one length, in a fixed box, which is the shape this
   * project puts changing numbers in. The length in it arrives from the corpus
   * before a byte of the film does.
   */
  const filmDeck = createDeck({
    // 0 until the corpus says otherwise, which is a moment later and still
    // before a byte of the film is asked for. See `readFilm`.
    range: [0, 1000],
    // One item and one adapter, so the bar has a kind to read rates off, and
    // ONE rate so it draws no rate row: a film has one speed.
    items: [{ at: 0, kind: 'film', id: 'film', payload: {} }],
    adapters: { film: { caps: { rates: [1] }, actuate: () => {} } },
  });
  let filmMaster = null;               // the mediaMaster, once there is a film

  /**
   * ⚠️ EVERY VERB GOES TO THE ELEMENT, AND THE DECK FOLLOWS IT. `mediaMaster`
   * reads `currentTime` and bends the playhead onto it, so a seek written to
   * the DECK is undone by the next tick. This is the same wiring the archive
   * already has on this page, and the same reason.
   */
  const filmCommand = {
    play: () => {
      if (!bgVideo) { d.log('there is no film to play', 'warn'); return; }
      bgVideo.play().catch((e) => d.log(`the film would not play: ${e.message}`, 'bad'));
    },
    pause: () => bgVideo?.pause(),
    seek: (ms) => { if (bgVideo) bgVideo.currentTime = ms / 1000; else filmDeck.seek(ms); },
  };

  /**
   * ⚠️ `publish: false`, LIKE THE SHOW'S BAR. There are three bars on this page
   * now and `__demo.transport` is one name: the archive keeps it, because it is
   * the one that can answer "where are we in the recording this page made".
   * This one is a monitor control for the operator, and a harness that drove it
   * would be pulling a quarter of a gigabyte to press play on somebody's film.
   * ⚠️ AND IT CARRIES A CLOCK, which is the point of knowing the length before
   * the file: `22:11.850` is on screen with nothing fetched.
   */
  /**
   * 🔴 NO PLAY BUTTON ON THIS BAR SINCE 2026-09-25. Asked: *"double play and
   * start in stage control room is confusing. make just start primary button
   * ... and rm play button under video"*. There were two presses that both read
   * as "begin": the show's, and this one under the picture. The show's is the
   * controls row now, and the film follows the show rather than being a second
   * thing to start.
   * ⚠️ **THE BAR STAYS, BECAUSE IT IS NOT A PLAY BUTTON.** It carries the
   * film's CLOCK, and `22:11.850` is on screen with nothing fetched, which is
   * the whole point of knowing the length before the file.
   * ⚠️ **AND `toggle: false` DISARMS THE HARNESS DRILL RATHER THAN BREAKING
   * IT.** `transport-bar.mjs` forces `api.playing` false and says so through
   * `api.toggles`, which `demo/verify.mjs` reads before it presses anything.
   */
  const filmBar = createTransportBar(room, filmDeck, {
    live: false, absolute: false, loop: false, time: true, scrub: false,
    toggle: false, publish: false, command: filmCommand,
  });
  ctrl.panel.glue(filmBar.el);

  /**
   * 🔴 MUTE IS A GLYPH BESIDE THE FULLSCREEN BUTTON, NOT A ROW OF ITS OWN.
   * Asked 2026-09-19: *"mute (find utf8 symobls) is next to fullscreen"*. It
   * landed this morning as a `createChoice` reading `muted | on` under the
   * timeline, which is a form control for a thing that belongs to the picture.
   *
   * 🔴 THE GLYPHS WERE CHOSEN BY LOOKING, AND THE OBVIOUS ONES DO NOT EXIST.
   * The text style speakers U+1F568, U+1F569 and U+1F56A render as an EMPTY
   * TOFU BOX here: measured, their ink box is 13.23 px, identical to
   * U+10FFFD's, which is the codepoint nothing has a glyph for. The speakers
   * that do exist, U+1F507 and U+1F50A, are emoji presentation: 21 px of ink in
   * colour beside a ⛶ whose ink is 9.86 px and grey.
   * ⚠️ SO IT IS `♫` U+266B AND `⊘` U+2298, both monochrome, both present, and
   * both the weight of the ⛶ they sit next to. The note says there is sound and
   * the circle says there is not, and each reads alone rather than by being
   * compared with the state it is not in.
   * ⚠️ IT IS CENTRED ON ITS INK with `setSymbol`, which is the module that
   * exists because writing `textContent` silently undoes the centring. Two
   * glyphs of different heights in one 34 px box is exactly the case it names.
   * ⚠️ AND THE SOUND GOES NO FURTHER THAN THIS BROWSER. `captureStream` takes
   * the canvas, which is a picture: there is no audio track on the feed, so
   * this is monitoring for the person running the show rather than sound for
   * the audience, and the log says so in words.
   */
  const MUTE_ON = '\u266b';
  const MUTE_OFF = '\u2298';
  let muted = true;
  const muteBtn = el('button', 'ico', MUTE_OFF, { type: 'button', 'aria-label': 'the film\u2019s sound' });
  centreSymbol(muteBtn);
  function setMuted(next, say = false) {
    muted = !!next;
    if (bgVideo) bgVideo.muted = muted;
    setSymbol(muteBtn, muted ? MUTE_OFF : MUTE_ON);
    muteBtn.setAttribute('aria-pressed', String(!muted));
    muteBtn.title = muted ? 'the film is muted' : 'the film is audible in this room';
    if (say) {
      d.log(muted
        ? 'the film is muted'
        : 'the film is audible in this room. The audience gets the picture and no sound');
    }
  }
  muteBtn.onclick = () => setMuted(!muted, true);
  // ⚠️ PREPENDED, SO THE ⛶ STAYS WHERE IT IS. Overriding the slot would take the
  // default fullscreen button away, and the panel would then put its floating
  // way out back over the picture to keep its own promise.
  ctrl.panel.slots.right.prepend(muteBtn);
  setMuted(true);

  /**
   * 🔴 THE DEFAULT IS AN IN-PAGE LOOPBACK AND IT IS A REAL WEBRTC HOP.
   * `pcOut` and `pcIn` in this tab, negotiated against each other, so a track
   * genuinely crosses a peer connection and comes back as a RECEIVED track.
   * That matters beyond cost: the thing being proved downstream is that the
   * recorder holds the RECEIVER's track, and a loopback that handed the local
   * stream back would make that assert vacuous.
   * ⚠️ IT IS `demo/show/index.html`'S TRICK AND IT IS ALREADY IN THE TREE.
   * `plan-session` §7 calls it a deliberate determinism choice for the suite.
   */

  /** The real leg: out over WHIP, back over WHEP, with Cloudflare in the middle. */
  async function cloudflare(stream, video) {
    const pub = await whipPublish(stream, { log: d.log });
    const sub = await whepPlay(whep(), video, { log: d.log });
    return { pub, sub, kind: 'cloudflare' };
  }

  /**
   * 🔴 THE RECORDER TAKES THE TRACK THAT CAME BACK, NEVER THE CANVAS.
   * `plans/plan-stage-live.md` §4.1. What the audience saw is the RETURNED track; a
   * recording of the canvas is a recording of what we meant to send, and the
   * two differ by an encode, a network and a resolution ramp that Cloudflare
   * drives. Recording the source would make the archive a better picture than
   * the show, which is a lie in the flattering direction.
   * ⚠️ THE COST, SAID PLAINLY AND NOT UPGRADED LATER: what lands in R2 is a
   * SECOND encode of the decoded pictures, not the bytes off the wire. The
   * claim is about where the pictures came from, never about byte identity.
   * ⚠️ AND ON THE REAL LEG THE FIRST ~30 SECONDS ARE 640x360, because
   * Cloudflare ramps WHEP resolution. The archive carries the ramp on purpose:
   * the alternative is to start recording after it, and then the lane called
   * "when the video started and ended" would be a lie.
   */
  /**
   * How long a piece is. Named because the CHECK reads it too: a seek lands on
   * the nearest decodable frame, so the keyframe spacing this sets is also the
   * honest tolerance for "did the picture move to where I asked".
   *
   * ⚠️ IT STAYS AT 2s HERE AND THE THREE HOUR ANSWER IS 5s, WHICH IS NOT A
   * CONTRADICTION. The pieces a show makes are what an interrupted upload has
   * to catch up on, and the uploader is ROUND-TRIP BOUND rather than bandwidth
   * bound: MEASURED in selfrec A2, 13 buffered pieces drained in 6,816 ms, 524
   * ms each, against a p50 verify of 483 ms. So recovery runs at about 1.9
   * pieces a second whatever the bitrate is. At 2s a three hour show is 5,400
   * pieces against 1.9/s of drain and 0.5/s of production, which is 3.8x of
   * headroom; at 5s it is 2,160 pieces and 9.5x. A show HERE is seconds long,
   * where a 5s piece means the recorder has produced nothing at all when it is
   * stopped, so the number that is right for three hours is wrong for this page.
   * ⚠️ AND SEEKING DOES NOT PAY FOR IT: `proto/selfrec/indexer.mjs --blocks`
   * indexes per SimpleBlock, so a longer piece is not a coarser seek.
   */
  const SLICE_MS = 2000;

  /**
   * 🔴 THE BITRATE IS A DECISION, AND UNTIL 2026-09-18 IT WAS THE BROWSER'S.
   * This passed no rate at all, so the recorder used its default.
   * 🔴 MEASURED, BY TAKING THE RATE BACK OUT AND READING `videoBitsPerSecond`
   * OFF THE RECORDER: THE DEFAULT HERE IS 2,500 kbit/s. Three hours of that is
   * **3.38 GB**, which is worse than every row of the table in `BACKLOG.md`,
   * including the 2 Mbit/s one somebody would have picked as the extravagant
   * end. It is 134x the 24 MiB an `ingest` session may hold.
   * ⚠️ THE FIRST VERSION OF THIS COMMENT SAID 1.167 Mbit/s and was wrong in a
   * way worth keeping. That is the measured rate of
   * `proto/selfrec/artifacts/a1-concat.webm`, and selfrec's own note says that
   * file was recorded at a REQUEST of 1200 kbit/s. A rate somebody asked for is
   * not a default, and the number was believed for an hour because it came off
   * a real file with a real measurement beside it.
   *
   * 🔴 THE FILE SIZE IS NOT WHAT DECIDED IT, BECAUSE THE FILE SIZE IS FREE.
   * 1.08 GB in R2 is about 1.6 cents a month, and 5,400 writes is about 2.4
   * cents a show. Every row of the table from 691 MiB to 3.38 GB costs nothing
   * worth arguing over, so the money axis is the wrong one and reaching for it
   * first is how this sat undecided.
   * ⚠️ WHAT IT COSTS IS THE UPLOAD, AND THAT ARITHMETIC IS OVER `SLICE_MS`.
   *
   * ⚠️ 700k OF PICTURE IS A DELIBERATE STEP UNDER A DEFAULT THAT IS 3.6x IT, on
   * a mostly still stage where a viewer will not see the difference and a three
   * hour archive will. 500 total would force the picture to about 400k, where
   * VP8 smears the moment anybody moves, and the archive is watched more than
   * once.
   * ⚠️ AUDIO IS NOT WHERE A SAVING IS AND IS NOT CUT: 96k over three hours is
   * 130 MB of the 1.07 GB, and it is the only track carrying the question and
   * the answers.
   */
  const VIDEO_BPS = 700_000;
  const AUDIO_BPS = 96_000;

  function startRecorder(track) {
    const mime = recorderMime(d);
    const stream = new MediaStream([track]);
    /**
     * ⚠️ A RATE IS PASSED ONLY FOR A TRACK THAT IS ACTUALLY THERE. This stream
     * is one VIDEO track today, so `audioBitsPerSecond` beside it would be a
     * setting that reads as correct and does nothing, which is the mistake this
     * page has already paid for twice: `clock: false` on a bar that has no such
     * option, and `how` passed inside the spec instead of the options.
     * `AUDIO_BPS` is declared and applies the day a show carries sound.
     */
    const bits = {};
    if (stream.getVideoTracks().length) bits.videoBitsPerSecond = VIDEO_BPS;
    if (stream.getAudioTracks().length) bits.audioBitsPerSecond = AUDIO_BPS;
    const r = new MediaRecorder(stream, mime ? { mimeType: mime, ...bits } : bits);
    r.ondataavailable = (e) => {
      if (!e.data || !e.data.size) return;
      if (T0 == null) T0 = performance.now();
      chunks.push(e.data);
    };
    r.start(SLICE_MS);
    /**
     * ⚠️ WHAT IT SAYS IT GOT, NOT WHAT IT WAS ASKED FOR. A `MediaRecorder`
     * reflects the rate it will actually use, and a browser is free to answer a
     * different number. Printing the request would be this page reporting its
     * own intention back to itself.
     */
    askedBps = Math.round(r.videoBitsPerSecond || 0);
    d.log(`recording the picture at ${(askedBps / 1000).toFixed(0)} kbit/s in `
      + `${SLICE_MS / 1000}s pieces`);
    return r;
  }

  let starting = false;
  /**
   * 🔴 A NEW RUN CLEARS THE LAST ONE. Asked 2026-09-19. A `Clear` button under
   * the archive timeline was asked for first and then withdrawn in favour of
   * this: *"Ok no clear. New run clears"*. It is the better answer and the
   * reason is the project's own rule about controls. A Clear button is a second
   * thing to find, it is available at moments when there is nothing to clear,
   * and it asks somebody to tidy up before they can do the thing they came to
   * do. Pressing record already means *start again*, so it can mean it fully.
   * ⚠️ **EVERYTHING A RUN LEAVES BEHIND GOES, NOT THE VISIBLE HALF.** The
   * recording, its blob URL, the questions, the answers, the option lanes, the
   * recorder's pieces, the resolved duration and the R2 receipts. A reset that
   * cleared the picture and left the answers would put the last show's marks on
   * the next show's timeline, which is the worst of both.
   * ⚠️ **AND THE BLOB URL IS REVOKED RATHER THAN DROPPED.** A blob URL holds its
   * blob alive until it is revoked, so five runs would mean five recordings in
   * memory with four of them unreachable.
   */
  function clearRun() {
    archiveMaster?.dispose?.();
    archiveMaster = null;
    if (archiveMedia) { try { archiveMedia.pause(); } catch { /* already gone */ } }
    archiveMedia = null;
    if (archiveUrl) { URL.revokeObjectURL(archiveUrl); archiveUrl = null; }
    playingBack = false;
    // The card comes back, which is the same swap `openArchive` does in reverse:
    // there is no recording again, so there is no video element again either.
    archive.panel.stage.textContent = '';
    archive.panel.stage.append(noTape.el || noTape);
    chunks.length = 0;
    QUESTIONS.length = 0;
    ANSWERS.length = 0;
    OPTIONS.length = 0;
    asked = null;
    // The question comes off both footers. `show()` puts it in a panel's centre
    // slot, so emptying that slot is the same swap in reverse, and a poll left
    // standing from a show that has ended is a control somebody can still press.
    for (const id of SHOWN_ON) byId.get(id).panel.slots.centre.textContent = '';
    T0 = null; recordedMs = null; stored = null; landed = null;
    recTrack = null; askedBps = null; recSource = 'received';
    archiveDeck.setRange([0, SHOW_MS]);
    archiveDeck.seek(0);
    showDeck.seek(0);
    relane();
    strip.strip.fit(0, ARCHIVE_WINDOW_MS, { pad: 0 });
    roomStrip.strip.fit(0, ARCHIVE_WINDOW_MS, { pad: 0 });
    d.log('a new run: the last recording, its questions and its answers are gone', 'hi');
  }

  async function startShow() {
    if (phase === 'live' || starting) return;
    // A second press of record is a new show, so whatever the last one left has
    // to go before this one starts writing over it.
    if (phase !== 'before') clearRun();
    phase = 'before';
    starting = true;
    showDeck.play();
    /**
     * 🔴 THE FILM IS NOT STARTED HERE, SINCE 2026-09-19: *"make video transport
     * indepencent of when show starts"*. This line used to be
     * `bgVideo?.play()`, which made one press mean two things and left no way to
     * look at the picture without recording a show. The film has its own
     * transport under the panel now.
     * ⚠️ **WHAT THE 2026-09-18 ASK BEHIND THE OLD LINE WANTED IS UNTOUCHED.**
     * *"video sthould stop in control room in beginning"* is about a film that
     * does not run to nobody before anybody asks, and it still does not: the
     * film starts when somebody presses play and never on its own.
     * ⚠️ **AND A SHOW WITH A STOPPED FILM IN IT IS A REAL STATE.** It is said in
     * the log rather than quietly fixed, because starting somebody's film for
     * them is the page deciding what they meant.
     */
    if (bgVideo && bgVideo.paused) {
      d.log('the show is on air with the film stopped, so what is going out is a still', 'warn');
    }
    // The window starts chasing the show now that there is one.
    roomStrip.strip.setFollow(true);
    try {
      const stream = master.captureStream(25);
      const v = el('video', 'stage-live', '', { playsinline: '', muted: '' });
      v.muted = true;
      armVideo(v);
      live = await cloudflare(stream, v);

      // The card goes, the picture arrives. One swap, at the moment there is
      // something true to show.
      aud.panel.stage.textContent = '';
      aud.panel.stage.append(v);
      audVideo = v;

      /**
       * ⚠️ THE LOOPBACK DEADLINE IS SHORT ON PURPOSE AND IT IS A HARNESS
       * CONSTRAINT AS MUCH AS A USER ONE. `verify.mjs` stops collecting once
       * the assert count has been still for 4.8 s, so a six second wait inside
       * a drill throws away every assert after it and the page reads as having
       * stopped early. MEASURED: at 6000 the drill landed 1 of its 7 asserts.
       * The real leg keeps a long deadline, because Cloudflare genuinely takes
       * seconds and a person is watching it rather than a harness.
       */
      const seen = await waitForFirstFrame(v, { timeoutMs: 20000 });
      /**
       * ⚠️ THE BADGE GOES `live` BECAUSE FRAMES ARRIVED, NOT BECAUSE A PROMISE
       * SETTLED. A WHEP track exists before it carries anything, so a page that
       * reports on the negotiation is reporting a socket rather than a picture.
       */
      setBadges(seen.frames ? 'online' : 'checking');
      d.log(`picture ${seen.w}x${seen.h} by ${seen.how}`, seen.frames ? 'hi' : 'warn');

      /**
       * 🔴 IF NO FRAME EVER ARRIVES, RECORD THE CANVAS AND SAY SO IN THOSE
       * WORDS. MEASURED 2026-09-18 in this sandbox: a local loopback gathers
       * exactly one host candidate, `iceGatheringState` goes `complete`, and
       * `iceConnectionState` then sits at **checking** for ever. UDP
       * connectivity checks do not complete here, so a WebRTC leg cannot carry
       * a picture however correct the code is.
       *
       * ⚠️ THIS IS NOT A WORKAROUND DRESSED AS A FEATURE, AND THE DIFFERENCE IS
       * THE LABEL. `plans/plan-stage-live.md` §4.1 is right that recording the source
       * is a lie in the flattering direction, and it is a lie only while nobody
       * is told. `recSource` carries which track was recorded, the log says it,
       * and the check below ASSERTS ON THE TRUTH OF THE LABEL rather than
       * assuming either path. A recording made this way is a recording of what
       * we meant to send, and the page says exactly that.
       * ⚠️ AND IT IS WHY `/show/`'S CHECKS HAVE NEVER RUN. That page has the
       * same in-page loopback and its `check` handler was reported as never
       * reaching. It was waiting for a leg that cannot connect here.
       */
      let track = live.sub.inbound.getVideoTracks()[0];
      if (!seen.frames) {
        recSource = 'canvas';
        track = stream.getVideoTracks()[0];
        d.log('no frame crossed the WebRTC leg, so what is recorded is the canvas '
          + 'we meant to send rather than the picture that came back', 'warn');
      }
      rec = startRecorder(track);
      recTrack = track;
      followWriteHead();
      phase = 'live';
      sayState();
    } catch (err) {
      d.log(`the show did not start: ${err && err.message}`, 'bad');
      showDeck.pause();   // it never got on air, so the bar goes back to start
    } finally { starting = false; }
  }

  /**
   * 🔴 STOP RETURNS WHEN THE BYTES ARE IN R2 AND READABLE, WHICH A 200 ON THE
   * PUT DOES NOT SAY. `plans/plan-stage-live.md` §4.2. "Uploaded" and "readable" are
   * two claims, and the gap between them is exactly where a recording goes
   * missing while every log line reads fine. `proveReadable` makes the second
   * claim with a HEAD, and compares the length, because a 200 with
   * `content-length: 0` is the failure this is for.
   * ⚠️ AND WHAT LANDED IS SAID IN WORDS, NOT ONLY RECORDED. The manifest has
   * carried `missing` since it was written and nothing has ever shown it, which
   * is the same shape as `/open` returning an expiry no demo displays.
   */
  async function stopShow() {
    if (phase !== 'live') return;
    showDeck.pause();
    phase = 'stopped';
    // ⚠️ THE FILM IS NOT STOPPED HERE EITHER, and that is the other half of the
    // same ask. A show ending is not a reason for the picture to stop: the
    // operator may be cueing the next one, and the control they used to start it
    // is the control that stops it.
    // And the control room's window stops chasing, so what is on screen is the
    // show that just happened rather than a window sliding past its end.
    roomStrip.strip.setFollow(false);

    const done = new Promise((res) => { if (rec) rec.onstop = res; else res(); });
    try { rec?.stop(); } catch { /* already stopped */ }
    await done;
    try { live?.pub?.stop?.(); } catch { /* the proxy may already have gone */ }
    for (const t of (live?.sub?.inbound?.getTracks?.() ?? [])) t.stop();
    setBadges('offline');

    const mime = chunks[0]?.type || 'video/webm';
    const blob = new Blob(chunks, { type: mime });
    d.log(`recorded ${(blob.size / 1048576).toFixed(2)} MiB in ${chunks.length} pieces`, 'hi');

    /**
     * ⚠️ THE ARCHIVE OPENS FROM THE LOCAL BLOB EITHER WAY. R2 is opt-in, and a
     * page whose archive only worked with `?r2=1` would be a page whose default
     * mode demonstrates nothing. What R2 adds is the claim that the bytes are
     * somewhere else and readable, which is asserted separately.
     */
    let src = URL.createObjectURL(blob);
    // Kept so the NEXT run can revoke it. A blob URL holds its blob alive until
    // it is revoked, and a page that records five shows would be holding five
    // recordings in memory with four of them unreachable.
    archiveUrl = src;
    if (USE_R2) {
      stored = await putWhole(blob, { log: d.log });
      if (stored) {
        const head = await proveReadable(stored.url);
        landed = { ok: head.ok, bytes: head.bytes, url: stored.url };
        d.log(head.ok
          ? `R2 holds it and serves it back: ${head.bytes} bytes, gone in 6h`
          : `R2 took it and will not serve it back (HTTP ${head.status})`,
        head.ok ? 'hi' : 'bad');
        const back = await fetchBack(stored.url, mime, { log: d.log });
        if (back) { URL.revokeObjectURL(archiveUrl); src = URL.createObjectURL(back); archiveUrl = src; }
      }
    }
    await openArchive(src, mime);
    sayState();
  }


  /**
   * A handle for a probe, like `window.__scope` on `/radio/`. Harmless in a
   * page and it is how the pipeline is looked at from outside without adding a
   * readout cell for every internal that only matters while building.
   */
  window.__archiveDeckSeek = (ms) => archiveDeck.seek(ms);
  window.__stage = {
    get phase() { return phase; },
    get chunks() { return chunks.length; },
    get recState() { return rec?.state ?? 'none'; },
    get kind() { return live?.kind ?? 'none'; },
    get ms() { return recordedMs; },
    get landed() { return landed; },
    get recSource() { return recSource; },
    get archiveMedia() { return !!archiveMedia; },
    seekArchive: (ms) => archiveCommand.seek(ms),
    get recTrack() { return recTrack; },
    get receivers() { return live?.sub?.pc?.getReceivers?.() ?? []; },
    get ice() {
      return {
        out: live?.pub?.pc?.iceConnectionState ?? 'none',
        inn: live?.sub?.pc?.iceConnectionState ?? 'none',
        outConn: live?.pub?.pc?.connectionState ?? 'none',
        innConn: live?.sub?.pc?.connectionState ?? 'none',
      };
    },
    get questions() { return QUESTIONS.length; },
    get answers() { return ANSWERS.length; },
    startShow, stopShow,
  };

  /**
   * 🔴 THE SIDECAR IS WHERE THE EVENTS LIVE AFTER THE SHOW. During the show the
   * control room holds every question and every answer in memory; afterwards it
   * does not, and neither does a different device. `workers/store` records a
   * relay room into SQLite and is the right SHAPE and the wrong LIFETIME: 1000
   * rows and 24 hours, and a show with a large audience can spend 1000 rows on
   * answers alone. So the events go in R2 beside the video, written once, living
   * exactly as long as the recording does.
   * ⚠️ IT IS BUILT HERE AND WRITTEN NOWHERE YET, because step one plays back
   * from a blob in this same tab, where the events are already in memory. The
   * moment a SECOND device opens the archive, this is the file it fetches, and
   * building the shape now is what stops the archive inventing its own.
   */
  const sidecar = () => ({
    T0: T0 == null ? null : Math.round(T0),
    durationMs: recordedMs,
    questions: QUESTIONS,
    answers: ANSWERS,
  });

  /**
   * 🔴 THE ARCHIVE STOPS SIMULATING AND PLAYS THE RECORDING. Until a show has
   * been recorded this tab paints a generated frame for whatever position the
   * transport is at, which is honest and says so. Once there IS a recording,
   * the picture is that file, the transport drives it through `mediaMaster`,
   * and dragging the strip moves the burned clock in the picture by the same
   * amount, which is the thing that cannot be faked.
   *
   * ⚠️ THE DURATION IS RESOLVED, NOT COUNTED. A `MediaRecorder` file reports
   * `duration: Infinity`, which leaves a transport with no range to scrub, and
   * counting the timeslices would give a number with a plausible shape and no
   * relationship to the file. `resolveDuration` does the seek-past-the-end
   * dance, and it is imported rather than written here because this repo
   * already holds FIVE copies of it and this would have been the sixth.
   */
  let playingBack = false;
  async function openArchive(src, mime) {
    const v = el('video', 'stage-live', '', { playsinline: '', muted: '', preload: 'auto' });
    v.muted = true;
    armVideo(v);
    v.src = src;
    // The card goes and the real file takes its place. One swap, at the moment
    // there is something true to show.
    archive.panel.stage.textContent = '';
    archive.panel.stage.append(v);
    playingBack = true;

    recordedMs = await resolveDuration(v);
    if (recordedMs == null) {
      d.log('the recording has no duration that could be resolved, so there is nothing to scrub', 'bad');
      return null;
    }
    archiveDeck.setRange([0, recordedMs]);
    relane();
    followPlayhead();
    /**
     * ⚠️ `mediaMaster` RATHER THAN A `timeupdate` HANDLER. It owns the drift
     * correction, the rate intersection and the stall policy, and this project
     * has the rule in writing: a recovery action is not free, and a hand-rolled
     * seek loop is how `low-latency-player.js` once aborted the very fragment
     * loads it was trying to recover.
     */
    archiveMaster = mediaMaster(archiveDeck, v, { stallPolicy: 'hold' });
    archiveMedia = v;           // from here the bar and the strip drive the file
    d.log(`the archive is playing ${(recordedMs / 1000).toFixed(1)}s back${USE_R2 ? ' from R2' : ''}`, 'hi');
    return { video: v, mime, ms: recordedMs };
  }

  /**
   * ⚠️ FILLED IN, NOT HINTED AT. Asked 2026-09-17: *"fill sample q sending with
   * same stuff you haev in hints"*. A form whose fields are all placeholders is
   * a form nobody can press Send on without typing first, which on a page whose
   * whole point is watching a question arrive puts a chore in front of the
   * demonstration.
   * ⚠️ **ALL THREE ARE FILLED NOW, WHICH REVERSES A SMALLER DECISION.** The
   * third used to stay empty on the argument that a question with two answers
   * and room for a third says more about the control. The question that was
   * asked for has three answers, and inventing a two-answer version of it to
   * demonstrate an empty field would be the page arguing with the ask.
   */
  /**
   * 🔴 THE DEFAULT QUESTION IS ABOUT THE FILM BEHIND IT, AND IT IS THE ONE
   * THAT WAS ASKED FOR, WORD FOR WORD. Given 2026-09-19 as
   * *"q is : Kas sa oled teinud ökopattu?: Veidi | Palju | Väga palju"*, with
   * the film that replaced the Méliès print in the same session. The
   * performance behind the picture is `MIM goes Sustainable`, in a theatre the
   * audience generated the power for, so the question and the picture are about
   * the same thing.
   * ⚠️ **IT IS NOT TRANSLATED AND NOT CORRECTED.** It replaces
   * `Kas see film vajab heli`, which was about a silent 1902 print and stopped
   * being true of anything the moment the film changed.
   * ⚠️ **AND THE PAGE STAYS ENGLISH AROUND IT ON PURPOSE.** It has been an
   * Estonian question in an English page since 2026-09-18 and that is the right
   * division rather than an accident: the labels, the buttons and the log are
   * the instrument, which anybody reading this project reads, and the question
   * is CONTENT, which belongs to whoever is running the show. Translating it
   * would make the page tidier and the demonstration weaker, because a question
   * with two diacritics and a question mark in it is exactly what proves the
   * relay carries what was typed.
   */
  const ASK_TITLE = 'Kas sa oled teinud ökopattu?';
  const ASK_OPTIONS = ['Veidi', 'Palju', 'Väga palju'];
  const title = createField({
    label: 'question', value: ASK_TITLE, grow: 'wide',
  });
  const opts = ASK_OPTIONS.map((v) => createField({ label: 'option', value: v }));
  /**
   * ⚠️ THE QUESTION ON ONE ROW, THE OPTIONS ON THE NEXT. Asked 2026-09-17:
   * *"options on its own row in contrrolroom"*. In one wrapping row the question
   * and two options sat together and the third fell to a line of its own, which
   * reads as three fields and a stray.
   */
  const form = el('div', 'stage-form');
  const askRow = el('div', 'stage-row');
  askRow.append(title.el);
  const optRow = el('div', 'stage-row');
  optRow.append(...opts.map((o) => o.el));
  form.append(askRow, optRow);

  const taken = () => opts.map((o) => o.value().trim()).filter(Boolean);
  const send = (delayMs) => {
    const t = title.value().trim();
    const o = taken();
    // ⚠️ NO SILENT FALLBACK TO THE SAMPLE. It used to send `Meaning of life`
    // when the field was empty, so clearing the question and pressing Send asked
    // the audience something nobody had typed.
    if (!t) { d.log('a question needs something to ask', 'warn'); return; }
    if (o.length < 2) { d.log('a question needs at least two options', 'warn'); return; }
    if (!delayMs) { ask(t, o); return; }
    /**
     * ⚠️ THE DELAY IS FOR TESTING AND IT SAYS SO ON THE BUTTON. Asked for as
     * *"make send not | send in 10s for testing"*: the two tabs are two halves
     * of one page, so posting from here and watching it arrive there needs the
     * posting to happen after you have moved. Ten seconds is long enough to
     * switch tabs and short enough to wait through.
     */
    d.log(`asking in ${delayMs / 1000} seconds, so there is time to move to the audience`);
    setTimeout(() => ask(t, o), delayMs);
  };

  const row = el('div', 'stage-row');
  /**
   * ⚠️ SECONDARY, LIKE EVERYTHING ELSE ON THE PAGE. Asked 2026-09-18 with a
   * photograph: *"All secodary buttons"*. `pos-pri` paints the yellow fill, and
   * one yellow button beside an outlined one claims that sending now is the
   * right answer and sending in ten seconds is the lesser one. They are two
   * ways of doing the same thing.
   */
  const now = el('button', '', 'Send', { type: 'button' });
  now.onclick = () => send(0);
  const later = el('button', '', 'Send in 10s', { type: 'button' });
  later.onclick = () => send(10_000);
  row.append(now, later);
  /**
   * ⚠️ THE FORM IS IN A BOX. Asked 2026-09-17: *"put it into box"*. Loose fields
   * on the page background read as part of the page rather than as one thing you
   * fill in and send. It is the project's standard surface: `--card` at 4 px
   * with a `--line` edge, the same as the log and the table.
   */
  const box = el('div', 'stage-box');
  box.append(form, row);
  room.append(box);
  stageAsk = { ask, send, form, shownOn: SHOWN_ON, get asked() { return asked; } };

  /**
   * The drawing loop. `burn` is the project's own test picture and it takes a
   * frame number, so the clock in the corner is real rather than decorative.
   * ⚠️ IT DRAWS WHILE THE TAB IS VISIBLE AND STOPS WHEN IT IS NOT.
   * `requestAnimationFrame` already pauses in a background tab, which is the
   * behaviour wanted rather than something to work around.
   */
  // The frame number is still counted, because `burn` needs one and the check
  // below waits on it. It is simply not shown: nothing about it moves.
  let frames = 0;
  function tick() {
    /**
     * 🔴 THE FILM IS THE PICTURE, AND NOTHING IS DRAWN ON TOP OF IT. Asked
     * 2026-09-18: *"make 4:3 video win and crop"*, then *"rm video overlay"*.
     * It used to be a BACKGROUND with the test pattern over it, which is the
     * arrangement `/take/` uses for a camera, and both halves of that are gone:
     * `fit: 'cover'` lets the film win the frame instead of gaining two black
     * pillars, and `burn` is not drawn over it at all, so there is no clock, no
     * counter and no frozen row on the picture.
     * 🔴 **AND SINCE THE BOX WENT 16:9 ON 2026-09-19, `cover` AND `contain`
     * AGREE TO THE PIXEL HERE.** The film is 1280x720 into a 1280x720 box, so
     * neither crops anything and the setting changes no pixel on this page
     * today. It stays `cover` for two reasons that are not taste: a film is
     * composed to fill its own frame, which is the standing rule, and `?bg=`
     * can point this page at a corpus row that is 4:3 or 480x272, where
     * `contain` would lay flat field down the sides of it.
     * ⚠️ `scrim: 0` GOES WITH IT AND IS NOT A SEPARATE TASTE DECISION. The 55%
     * scrim exists to keep a burned clock readable on top of a picture; with
     * nothing on top it is a page dimming itself by more than half for the sake
     * of furniture that is not there.
     *
     * 🔴 AND THE GENERATED PICTURE IS THE FALLBACK, WHICH IS WHY `burn` IS
     * STILL HERE. A film that 404s, stalls or fails to decode leaves `bgReady`
     * false, and that visit gets the full test picture exactly as before rather
     * than a black rectangle. The two arms are the same one line they always
     * were; what changed is that the film arm now draws the film alone.
     * ⚠️ SO THE BURNED CLOCK IS NO LONGER IN THE FEED WHEN A FILM IS UP, and
     * two things downstream read it: `readBurned` on a panel, and
     * `readBurnedFrom` on the archive's recording. The first is rehomed onto a
     * claim that holds in both arms and is checked below; the second degrades
     * to `null`, which its own assert already tolerates because it grades the
     * PLAYHEAD rather than the picture.
     */
    /**
     * ⚠️ `readyState`, AND NOT `!paused`, SINCE *"video sthould stop in control
     * room in beginning"* ON 2026-09-18. The film is STOPPED on its first frame
     * until somebody starts the show, and a `bgReady` that required playback
     * would have read a stopped film as no film at all and painted the test
     * picture over it. What the drawing loop needs to know is whether there is a
     * frame to draw, which is what `readyState >= 2` means.
     */
    const bgReady = bgVideo && bgVideo.readyState >= 2;
    if (bgReady) drawCamera(mctx, bgVideo, STAGE_W, STAGE_H, { fit: 'cover', scrim: 0 });
    else {
      /**
       * 🔴 NO TEST PICTURE ON SCREEN, EVER. Asked 2026-09-18: *"i get blinkig
       * on-screen timecode etc stuff. rm it"*. It was the FALLBACK arm, and it
       * was showing for the second or so between the page opening and the film
       * decoding its first frame: a clock and a counter appearing and vanishing,
       * which reads as a fault rather than as a picture waiting.
       * ⚠️ **SO A FILM THAT NEVER ARRIVES LEAVES A FLAT FIELD, AND THE PAGE SAYS
       * SO IN THE LOG RATHER THAN IN THE PICTURE.** That is the trade and it is
       * the one asked for. The check below still goes red on a blank canvas, so
       * the failure is graded even though it is no longer drawn.
       */
      mctx.fillStyle = FIELD;
      mctx.fillRect(0, 0, STAGE_W, STAGE_H);
    }
    // ⚠️ THE ARCHIVE IS NOT FED FROM HERE. It is a recording: its picture comes
    // from wherever its transport is, which is what makes scrubbing visible.
    for (const p of panels) if (p.id !== 'archive') p.ctx.drawImage(master, 0, 0);
    /**
     * 🔴 AND THE ARCHIVE'S MASTER IS DRIVEN FROM HERE, BECAUSE `mediaMaster`
     * DOES NOT RUN ITSELF. Its own docstring says to call it from the rAF loop
     * you already run, and `/crate/` carries the same warning in a comment:
     * without this the object is BUILT and nothing happens. This page built it
     * and never ticked it, so the archive's deck was never once driven by its
     * element.
     * ⚠️ IT WAS REPORTED AS *"there is not caret in arvhice playback"* AND
     * DIAGNOSED WRONGLY TWICE, as a MediaRecorder file carrying no cues. The
     * file is fine: MEASURED, the element went to 1.00s of a 3.45s recording,
     * `ended` false, `seekable` 0.00..3.45, while the deck sat at 3.45s.
     * `master ticks 0, backstop 0, driving false` is what finally said it, and
     * printing those three counters took one run where guessing took three.
     * ⚠️ THE SEEK CHECK ABOVE PASSED THROUGHOUT, because it asks the ELEMENT
     * where it went. Every assert about this page's archive was on the one side
     * of the join that worked.
     */
    archiveMaster?.tick();
    // ⚠️ AND THE FILM'S, FOR THE REASON WRITTEN ABOVE: a `mediaMaster` that is
    // built and never ticked is an object that does nothing, which this page has
    // already paid for once on the archive.
    filmMaster?.tick();
    frames++;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /**
   * 🔴 THE ARCHIVE'S PICTURE IS A FUNCTION OF ITS PLAYHEAD. Drag the strip and
   * the burned clock in the frame moves with it, forwards or back, which is the
   * whole of *"scrubbing moves video back and forth"*. Nothing here is a video
   * file yet: the frame is generated for the position, which is a simulation and
   * says so.
   * ⚠️ IT REDRAWS ON A POSITION CHANGE RATHER THAN EVERY FRAME. A stopped
   * recording that repaints sixty times a second is a page doing work to show
   * the same picture, and this one is stopped by default.
   */
  const archiveCtx = archive.ctx;
  let lastDrawn = -1;
  const paintArchive = (ms) => {
    const f = Math.round(ms / 16.7);
    if (f === lastDrawn) return;
    lastDrawn = f;
    burn(archiveCtx, FRAME_W, FRAME_H, f, { hue: videoHue(0), ms: showWallStart + Math.round(ms) });
  };
  paintArchive(0);
  /**
   * ⚠️ IT READS `position()` ON A FRAME RATHER THAN USING `observePosition`.
   * That helper hands back `{ pos, nowUs }` and reaches for `transport.clock.now()`,
   * which this deck does not expose: MEASURED as `TypeError: Cannot read
   * properties of undefined (reading 'now')` the first time this ran. A
   * recording only has to repaint when its playhead moves, and the guard above
   * makes a still frame cost one comparison.
   */
  /**
   * 🔴 THE ARCHIVE NEVER SIMULATES A RECORDING. Asked 2026-09-18: *"is archive
   * 'file' video simulated? no"*. It used to paint a GENERATED frame for
   * whatever position the playhead was at, which looked exactly like a
   * recording being scrubbed and was not one: nothing had been recorded, and
   * the picture said otherwise.
   *
   * That is the same lie this page already refuses one tab over. The audience
   * gets a card rather than an empty `<video>` because a black 16:9 box with a
   * transport under it is the shape of a thing that could be played and cannot;
   * an archive drawing a convincing frame of a show that never happened is
   * worse, because it is not empty, it is WRONG.
   *
   * So: a card until there is a file, then the file. `paintArchive` is kept and
   * called exactly once, for nothing, so the burn path stays compiled and the
   * next reader can see what used to happen here.
   */
  const noTape = createCard({
    title: 'Nothing recorded yet',
    desc: 'When a show is stopped in the control room, the recording appears here and '
      + 'the timeline fills with what was asked and what came back.',
    // The shape the recording will be, so the box does not change size when the
    // card is swapped for the file.
    aspect: `${STAGE_W} / ${STAGE_H}`,
  });
  archive.panel.stage.textContent = '';
  archive.panel.stage.append(noTape.el || noTape);

  // Every panel's default badge is told the same thing, because they all show
  // the same picture and it is this page drawing it.
  for (const p of panels) p.panel.presence?.set('online');

  /**
   * 🔴 NOTHING HERE OPENS A SOCKET, MAKES A SOUND OR PRESSES A CONTROL, and it
   * is gated anyway. CLAUDE.md: a self-check never runs for a visitor, no
   * exceptions, and the two arguments that were used to make exceptions are both
   * answered in that file. Everything below reads what is already on screen.
   */
  /**
   * 🔴 EVERY ASSERT IS HELD AND EMITTED IN ONE GO AT THE END, AND THAT IS THE
   * HARNESS'S OWN DESIGN RATHER THAN A TRICK.
   *
   * `verify.mjs` has two phases. While the page has asserted NOTHING it waits,
   * sized by `settleMs`, up to 30 s: "while the count is still zero, wait".
   * Once anything has landed it switches to the cheap one, which exits the
   * moment the count is unchanged for a single 400 ms tick. So a page that
   * asserts early and then works for ten seconds has its whole tail thrown
   * away, and reads as having stopped rather than as having been cut off.
   * MEASURED HERE: the drill produced all 7 of its asserts on the page and the
   * harness collected 1 of them.
   *
   * ⚠️ THE OTHER TWO WAYS OUT DO NOT FIT THIS PAGE. A control marked
   * `data-busy` gives the checks a slot, and this page has no controls row on
   * purpose: a global Start would appear on the AUDIENCE tab, where the one
   * thing that must not be possible is starting the show. `settleMs` on
   * control 0 needs a control 0 for the same reason.
   * ⚠️ AND HOLDING THEM COSTS NOTHING A READER SEES. `d.assert` is the report;
   * the ORDER it is written in is this list, so the page reads exactly as
   * before and a visitor, who never runs any of this, is unaffected either way.
   */
  const held = [];
  const A = (label, pass, detail) => held.push([label, pass, detail]);

  /**
   * Eight fixed points of a canvas, as luminance. Used by more than one check
   * below and therefore declared once, outside them: the first version sat
   * inside the block that introduced it and the second use read `lumAtOf is not
   * defined` at runtime, which the suite caught as a console error rather than
   * as a failed assert.
   */
  const SAMPLE = [[0.12, 0.20], [0.31, 0.47], [0.50, 0.31], [0.68, 0.62],
    [0.84, 0.44], [0.22, 0.75], [0.77, 0.18], [0.41, 0.86]];
  const lumAtOf = (ctx) => SAMPLE.map(([fx, fy]) => {
    const px = ctx.getImageData(Math.round(STAGE_W * fx), Math.round(STAGE_H * fy), 1, 1).data;
    return Math.round(px[0] * 0.299 + px[1] * 0.587 + px[2] * 0.114);
  });

  async function checks() {
    if (q.get('selfcheck') !== '1') return;

    A('three panels, one for each tab', panels.length === 3 && tabs.el.querySelectorAll('.pos-vp').length === 3,
      `${tabs.el.querySelectorAll('.pos-vp').length} panels in ${TABS.length} tabs`);

    /**
     * 🔴 THE FULLSCREEN BUTTON IS SQUARE, MEASURED RATHER THAN DECLARED. Asked
     * for in those words with the brackets: *"(square!)"*. A button whose width
     * comes from its glyph is a different width in every font, so this is the
     * kind of claim that is true on the machine it was written on and false on
     * somebody else's.
     */
    const btn = panels[0].panel.slots.right.querySelector('button');
    const r = btn?.getBoundingClientRect();
    A('the fullscreen button is square', !!r && Math.abs(r.width - r.height) <= 0.5,
      r ? `${r.width.toFixed(1)} by ${r.height.toFixed(1)} px` : 'there is no button in the right slot');

    // The defaults are the component's whole argument: a page that wants a
    // status and a way to go full writes neither.
    const p0 = panels[0].panel;
    A('left is a status and right is a control, with nothing in the middle by default',
      !!p0.slots.left.querySelector('.pos-pres') && !!p0.slots.right.querySelector('button')
      && p0.slots.centre.childElementCount === 0,
      `left ${p0.slots.left.childElementCount}, centre ${p0.slots.centre.childElementCount}, right ${p0.slots.right.childElementCount}`);

    // A mode nobody named is a mode nobody can debug, so the component throws.
    let threw = false;

      const a = await readAt(fromMs);
      const b = await readAt(toMs);
      if (Number.isFinite(a) && Number.isFinite(b)) moved = b - a;
      // What the FILE did, which is the half that works and the half the page
      // is responsible for.
      wantedAt = toMs;
      landedAt = Math.round(av.currentTime * 1000);
    }
    /**
     * 🔴 WHAT THIS GRADES IS THE PLAYHEAD, AND THE REASON IS A REAL LIMITATION
     * THIS CHECK FOUND RATHER THAN A WEAKER CLAIM CHOSEN TO GO GREEN.
     *
     * It used to assert that the PICTURE moved, read off the burned clock, and
     * `plans/plan-stage-live.md` §10.6 asks for exactly that. MEASURED: seeking from
     * 0.794s to 3.177s moves `currentTime` to both positions exactly, and
     * `readBurnedFrom` returns the IDENTICAL millisecond at both. The playhead
     * lands and the picture does not follow.
     *
     * The cause is the file. **MediaRecorder WebM carries no cues and no
     * SeekHead**, so a browser reports the position it was asked for and keeps
     * showing the frame it already had. That is the whole reason
     * `proto/selfrec/indexer.mjs` exists in this repo: it walks the clusters
     * and builds the index this file has not got, so replay becomes Range plus
     * MSE. §4.5 of the plan names it as what replaces the blob, and step one
     * deliberately did not build it.
     *
     * ⚠️ SO THE CHECK SAYS THE TRUE THING AND THE PAGE SAYS THE MISSING ONE IN
     * WORDS. Asserting the picture would be a permanently red suite; asserting
     * nothing would be this page quietly dropping the one claim it was built to
     * make. The seekability gap is in `BACKLOG.md` with the fix named.
     */
    A('the archive playhead lands where the strip is dragged to',
      landedAt != null && wantedAt != null && Math.abs(landedAt - wantedAt) < 150,
      landedAt == null
        ? 'there was no recording to seek in'
        : `asked for ${(wantedAt / 1000).toFixed(2)}s and the file went to `
          + `${(landedAt / 1000).toFixed(2)}s`
          + `${moved === 0 ? ', and the picture did not follow: see the log' : ''}`);
    if (moved === 0) {
      d.log('the playhead moves and the picture does not: a MediaRecorder file carries no '
        + 'cues, so the browser reports the position and keeps the frame it had', 'warn');
    }

    /**
     * 🔴 IS THERE A CARET ON THE ARCHIVE WHILE IT PLAYS, AND DOES IT MOVE.
     * REPORTED 2026-09-18: *"there is not caret in arvhice playback"*.
     *
     * ⚠️ IT SEPARATES THE TWO CAUSES RATHER THAN PICKING ONE, because they have
     * opposite fixes and look identical from a chair. Either the DECK is not
     * advancing, in which case the caret is drawn correctly and parked at zero,
     * or it is advancing and nothing is PAINTED at it. The first is a transport
     * defect and the second a drawing one.
     * ⚠️ THE INK TEST IS AGAINST A NEIGHBOURING COLUMN, not against a colour.
     * A caret is a 1.5 px bright line on a dark ground, so a column that is not
     * brighter than the one 15 px beside it has no caret in it whatever the
     * theme says the colour should be.
     */
    const masterNote = () => {
      const st = archiveMaster && archiveMaster.stats ? archiveMaster.stats() : null;
      if (!st) return 'none attached';
      return `ticks ${st.ticks}, backstop ${st.backstopTicks}, driving ${st.driving}`;
    };
    let caretMoved = null, caretLit = null, caretDetail = 'there was no recording to play';
    if (av && Number.isFinite(recordedMs) && recordedMs > 1200) {
      /**
       * 🔴 GET BACK TO THE START AND CONFIRM IT, BEFORE PLAYING. The first
       * build of this fired `seek(0)` and played immediately, and read the
       * playhead pinned at 3.46s of a 3.5s recording: the previous drill had
       * left it near the end, so `play()` ran off the end inside the first
       * frame and 800 ms of watching measured nothing. That is a check
       * reporting a page defect it caused itself, which is the shape this file
       * has already met three times on one seek.
       * ⚠️ AND IF IT CANNOT GET BACK, THE CHECK SAYS SO IN THOSE WORDS rather
       * than blaming the caret: a MediaRecorder WebM carries no cues, and
       * whether a backwards seek lands is exactly the limitation this page
       * already reports.
       */
      /**
       * 🔴 WHICH HALF REFUSES: THE ELEMENT OR THE DECK. They have opposite
       * fixes and look identical from a chair, and the earlier version of this
       * check reported only the DECK's position, so "the recording would not
       * rewind" was a claim about the half it happened to read.
       * ⚠️ AND IT ASKS FOR 1.0s RATHER THAN 0. Seeking to zero is the one
       * target a browser can satisfy by doing nothing, and `resolveDuration`
       * has already thrown this element at 1e6 and back, so 0 is also where it
       * might already be. A number in the middle is answerable only by really
       * moving.
       */
      const REWIND_TO = 1.0;
      archiveCommand.seek(REWIND_TO * 1000);
      let rewound = false;
      for (let i = 0; i < 40 && !rewound; i++) {
        await new Promise((r) => setTimeout(r, 50));
        rewound = Math.abs(st.readout().pos / 1000 - REWIND_TO) < 0.4;
      }
      if (!rewound) {
        const el = Math.abs(av.currentTime - REWIND_TO) < 0.4;
        caretDetail = `asked the archive back to ${REWIND_TO.toFixed(2)}s of `
          + `${(recordedMs / 1000).toFixed(2)}s and it did not go: the ELEMENT is at `
          + `${av.currentTime.toFixed(2)}s (${el ? 'it moved' : 'it refused'}, ended=${av.ended}, `
          + `seekable=${av.seekable.length ? `${av.seekable.start(0).toFixed(2)}..${av.seekable.end(0).toFixed(2)}` : 'nothing'}) `
          + `and the DECK is at ${(st.readout().pos / 1000).toFixed(2)}s, `
          + `so ${el ? 'the deck is not following the element' : 'the file will not seek backwards'}`
          + ` [master ${masterNote()}]`;
      }
      archiveCommand.play();
      await new Promise((r) => setTimeout(r, 250));
      const pA = st.readout().pos;
      await new Promise((r) => setTimeout(r, 800));
      const pB = st.readout().pos;
      archiveCommand.pause();
      caretMoved = pB - pA;

      const dpr = st.state.dpr || 1;
      const colOf = (px) => Math.round((st.state.gutterPx + px) * dpr);
      const g = strip.el.getContext('2d');
      const lumAt = (col) => {
        if (col < 1 || col >= strip.el.width - 1) return null;
        const d = g.getImageData(col, 0, 1, Math.max(1, strip.el.height - 2)).data;
        let best = 0;
        for (let i = 0; i < d.length; i += 4) best = Math.max(best, d[i] + d[i + 1] + d[i + 2]);
        return best;
      };
      const here = lumAt(colOf(st.timeToX(pB)));
      const away = lumAt(colOf(st.timeToX(pB) - 15));
      caretLit = here != null && away != null ? here - away : null;
      if (rewound) {
        caretDetail = `the playhead went ${(pA / 1000).toFixed(2)}s to ${(pB / 1000).toFixed(2)}s `
          + `and its column reads ${here ?? 'off canvas'} against ${away ?? 'off canvas'} 15 px away`;
      }
    }
    A('the archive has a caret, and it is at a playhead that moves while the recording plays',
      caretMoved != null && caretMoved > 100 && caretLit != null && caretLit > 30,
      caretDetail);

    /**
     * 🔴 A NEW RUN CLEARS THE LAST ONE, AND IT IS DRIVEN THROUGH THE BUTTON. A
     * `Clear` control was asked for and withdrawn in favour of this, so the
     * record press is the only route to it and a check that called `clearRun()`
     * directly would be grading a function the page no longer reaches that way.
     * ⚠️ **IT ASSERTS THE WHOLE SWEEP, NOT THE VISIBLE HALF.** The picture going
     * back to its card is the easy half; the one that would rot silently is the
     * answers, because a stale mark on a new show's timeline looks exactly like
     * a real one. This reads the archive panel, both lists, the option lanes and
     * the poll in both footers.
     * ⚠️ **AND IT DOES NOT WAIT FOR A SHOW TO COME UP.** `clearRun` runs on the
     * first line of `startShow`, before any await, so the state to read is there
     * within a frame of the press. Waiting for a peer connection here would put
     * seconds between two asserts, which is what the harness's settle is
     * measured against.
     */
    {
      const before = {
        questions: QUESTIONS.length, answers: ANSWERS.length, options: OPTIONS.length,
        video: !!archive.panel.stage.querySelector('video'),
      };
      showToggle?.click();
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      const polls = SHOWN_ON.filter((id) => byId.get(id).panel.slots.centre.children.length);
      const after = {
        questions: QUESTIONS.length, answers: ANSWERS.length, options: OPTIONS.length,
        video: !!archive.panel.stage.querySelector('video'),
        card: !!archive.panel.stage.querySelector('.pos-card'),
      };
      A('a new run clears the recording, the questions and the answers',
        before.video && before.questions > 0
        && !after.video && after.card && after.questions === 0
        && after.answers === 0 && after.options === 0 && polls.length === 0,
        `before: ${before.questions} question(s), ${before.answers} answer(s), `
        + `${before.options} option lane(s), a recording in the panel. `
        + `after one press: ${after.questions}, ${after.answers}, ${after.options}, `
        + `${after.video ? 'still a recording' : 'the card is back'}, `
        + `${polls.length} poll(s) left in a footer`);
      // Put the page back where the drill found it rather than leaving a show
      // running behind every other check's back.
      await stopShow();
      // ⚠️ AND THE FILM TOO, WHICH IS NEW AND IS THE COST OF INDEPENDENCE.
      // `stopShow` used to stop the picture as a side effect; it does not any
      // more, so a run that did not do this would leave a 22 minute film
      // streaming from R2 behind every check after it.
      filmCommand.pause();
    }

    /**
     * 🔴 AND IT REFUSES TO READ AN UNMEASURED DIAGRAM, WHICH IS NOW THE EASY
     * WAY TO GET A FALSE PASS. `getComputedTextLength()` answers 0 inside a
     * `display: none` ancestor, so every string "fits" and a diagram in a
     * hidden tab reports NO CUTS however badly it is cut. Both of these live in
     * tab panels that are hidden until somebody selects them, so without
     * `measured` this assert would have gone green by never having looked.
     * `/kit/` names this failure in writing: it reads as a wrapping bug and is
     * an attachment bug.
     * ⚠️ SO THE CHECK SELECTS EACH TAB AND WAITS. The component re-renders
     * itself on reveal through a `ResizeObserver`, which is what makes the
     * picture correct for a visitor; this waits for that rather than assuming
     * it, and puts the page back on the tab it found.
     */
    const wasAt = tabs.at();
    for (const [where] of DIAGRAMS) {
      tabs.go(where, { push: false });
      for (let i = 0; i < 40 && !DIAGRAMS.find(([w]) => w === where)[1].measured; i++) {
        await new Promise((r) => requestAnimationFrame(r));
      }
    }
    tabs.go(wasAt, { push: false });
    const unmeasured = DIAGRAMS.filter(([, dg]) => !dg.measured).map(([w]) => w);
    A('nothing in the diagram had to be shortened to fit, in either panel that carries it',
      unmeasured.length === 0 && cutLines.length === 0,
      unmeasured.length
        ? `${unmeasured.join(' and ')} never measured any type, so a clean result there means nothing`
        : cutLines.length
          ? cutLines.join(' · ')
          : `every label, sub and note fitted its box in both panels`);

    // ⚠️ AND HERE IS THE ONLY PLACE ANY OF THEM REACH THE REPORT.
    for (const [label, pass, detail] of held) d.assert(label, pass, detail);
  }

  // The frame counter has to have moved before the picture can be read back, so
  // the checks wait for a few frames rather than racing the first one.
  let warmed = 0;
  const warm = () => { if (++warmed >= 6) checks(); else requestAnimationFrame(warm); };
  requestAnimationFrame(warm);

  /**
   * 🔴 A PAGE WITH A REAL PIPELINE IN IT EARNS A DIAGRAM, and this one had
   * none. `how: true` and NO title: the heading lives in `diagram.mjs` as
   * `How it works` and a page that passes its own gets it refused, because
   * `/station/` once shipped two headings stacked.
   */
  /**
   * ⚠️ `how` AND `atEnd` ARE THE THIRD ARGUMENT, NOT PART OF THE SPEC, AND
   * PUTTING THEM IN THE SPEC IS A SETTING THAT READS AS CORRECT AND DOES
   * NOTHING. Caught here by looking at the page: the standing heading simply
   * was not there. This page has paid for the identical mistake once already,
   * when it passed `clock: false` to a transport bar that has never had that
   * option, and its own comment says so twenty lines up.
   */
  /**
   * 🔴 IT LIVES IN THE CONTROL ROOM AND THE ARCHIVE, NOT AT THE END OF THE
   * PAGE. Asked 2026-09-18: *"move how it works to control room and archive"*.
   * Under the tabs it belonged to all three panels and described none of them
   * in particular, which on a tabbed page reads as a footnote to the navigation
   * rather than an explanation of what you are looking at.
   * ⚠️ **THIS DEPARTS FROM THE STANDING RULE AND CLAUDE.md WAS CHANGED WITH
   * IT.** That rule says every diagram passes `{ how: true, atEnd: true }` and
   * goes last on the page, and `atEnd` appends to `document.body` rather than
   * to the host, so a panel needs `atEnd: false` or the picture leaves the tab.
   * A rule and the code disagreeing is the failure this project keeps paying
   * for, so they were changed together.
   * ⚠️ **TWO INSTANCES FROM ONE DESCRIPTION**, the way the question already
   * does it on this page: an element cannot be in two places, and two specs
   * would drift.
   * ⚠️ **AND THE AUDIENCE GETS NONE.** They are watching a show. How the
   * picture reached them is the operator's question, and both panels that carry
   * it are the operator's.
   */
  const DIAGRAM_SPEC = {
    caption: 'A picture arrives on one of two transports, and a question is timed against whichever one it came on.',
    nodes: [
      { id: 'ctrl', label: 'Browser', sub: 'control room', kind: 'here', tech: 'browser',
        children: [
          { id: 'canvas', label: 'canvas', sub: '720p, 25fps',
            note: 'The picture the show is made of, drawn here and captured as a '
                + '**MediaStream**. It carries a MIMproject recording with its own play '
                + 'and stop, fetched only once one of them is pressed.' },
          { id: 'recorder', label: 'MediaRecorder', sub: '700k, 2s',
            note: 'Records the track that came BACK, never the canvas. What the audience '
                + 'saw is the returned track, and recording the source would make the '
                + 'archive a better picture than the show.' },
        ] },
      /**
       * 🔴 ONE CLOUDFLARE MACHINE WITH THREE THINGS IN IT. Asked 2026-09-18 with
       * a screenshot: *"put these 3 to cloudflare box"*. They were three
       * top-level boxes, which drew them as three separate machines and left the
       * page's one real division, here against there, spread over five columns.
       * ⚠️ **ARROWHEADS BETWEEN THEM, NOT BRACKETS. ASKED ON SIGHT, 2026-09-18:**
       * *"need arrows"*, against a screenshot of the bracket ties. `set: true`
       * was tried here first on the argument that Stream, R2 and the relay do
       * not feed each other, and that argument lost to the one CLAUDE.md already
       * records: a headless tie between two boxes reads as a head that fell off,
       * which has been reported twice on other pages. The default is an arrow.
       * ⚠️ AND A CONTAINER TAKES NO `note`. The old `cf` box had one and it has
       * moved onto `Stream`, which is the box that actually does that.
       */
      // ⚠️ A `sub` AND NO `note`. Asked 2026-09-18: *"add desc under cloudflare
      // title"*. A container says what KIND of machine it is and the rule against
      // a note on one is untouched: three services on one account, which is the
      // fact the three boxes underneath do not state for themselves.
      { id: 'cf', label: 'Cloudflare', sub: 'one account', kind: 'cloud', tech: 'cloudflare',
        children: [
          /**
           * 🔴 THE TWO PROTOCOL NAMES LIVE HERE NOW, NOT ON THE ARROWS. Asked
           * 2026-09-18: *"rm whip/whep from connector labels use webrtc. explain
           * whip and whep in descs"*. An arrow's label is what TRAVELS, and what
           * travels on all three of those is WebRTC; WHIP and WHEP are the two
           * handshakes that set it up, which is a fact about this box.
           */
          { id: 'stream', label: 'Stream', sub: 'WebRTC',
            note: 'Takes the picture in over **WHIP** and hands it back out over **WHEP**, '
                + 'which are the publish and subscribe handshakes for one WebRTC connection. '
                + 'It records nothing, which is why the control room has to.' },
          // Named in full, asked for as `'R2 storage'` on 2026-09-18. `Stream`
          // and `Relay object` both say what they are in the box; `R2` alone was
          // an account-page abbreviation next to two things that read as words.
          { id: 'r2', label: 'R2 storage', sub: '24MiB, 6h',
            note: 'Holds the finished recording, and nothing else: no question and no answer '
                + 'is ever written here. The archive tab reads it straight back out, and a '
                + 'HEAD after the upload is what proves it can be.' },
          /**
           * ⚠️ THE `sub` NAMES THE TECHNOLOGY, LIKE ITS NEIGHBOURS. Asked
           * 2026-09-18: *"see other diagrams. its webrtc or smth"*, against a
           * sub reading `one room`. A sub says what KIND of thing a box is, and
           * `Stream` beside it says `WebRTC`: a count of rooms is a property of
           * this deployment rather than an answer to what the box is. The count
           * moved into the note, which is where a fact with a number goes.
           */
          /**
           * 🔴 THE NOTE SAYS WHY THE QUESTION IS NOT IN THE VIDEO, BECAUSE THAT
           * IS THE ONE THING A READER ASSUMES AND IT IS WRONG. Asked 2026-09-25:
           * *"update diagram with good info how msg sync works"*.
           */
          { id: 'relay', label: 'Relay object', sub: 'WebSocket',
            note: 'Carries questions out and answers back over one room, and stores none of '
                + 'them. It has to be a side channel: Cloudflare\u2019s transcode strips **all '
                + 'in-band metadata**, so a question buried in the video would reach nobody.' },
        ] },
      /**
       * 🔴 THE AUDIENCE IS A MACHINE WITH PARTS TOO. Asked 2026-09-18:
       * *"audience broser is also boxes-inside-box"*. It was one box against the
       * control room's two, which drew the two ends of the same page as two
       * different kinds of thing. What it holds is exactly what the ask is
       * about: a picture that arrives, and an answer that leaves.
       * 🔴 `join: false`, SO NOTHING IS DRAWN BETWEEN THEM. Asked on sight
       * 2026-09-18: *"why video has arrow to answer"*, and the answer is that it
       * should not: a picture arriving does not produce a press. This is the
       * case CLAUDE.md names for the flag in as many words, about `/keys/`,
       * where a browser holds a keyboard and a playout and a line between them
       * adds no fact. The Browser's own box already says they are two parts of
       * one page, and an arrow claims a direction the drawing cannot support.
       */
      { id: 'aud', label: 'Browser', sub: 'audience', kind: 'here', tech: 'browser', join: false,
        children: [
          { id: 'screen', label: 'video', sub: 'one transport',
            note: 'WebRTC or low latency HLS, never both at once. Before a show starts there '
                + 'is no video element here at all, only a card saying one is coming.' },
          /**
           * 🔴 THE WHOLE POINT OF THE PAGE GOT NO BOX UNTIL 2026-09-25. The
           * question arrives on the relay in milliseconds and the PICTURE does
           * not, so WHEN to show it is a decision, and it is a different
           * decision per transport. That is the thing a reader most needs and
           * the drawing said nothing about it.
           */
          { id: 'cue', label: 'when to ask', sub: 'per transport',
            note: 'The question arrives at once and the picture does not. On **WebRTC** it is '
                + 'shown straight away; on **HLS** it waits out this viewer\u2019s own latency, '
                + 'so everybody is asked at the same moment of the show.' },
          { id: 'answer', label: 'answer', sub: 'one press',
            note: 'One press per person, sent the moment it is made rather than gathered up '
                + 'at the end. The control room times it on arrival, so an answer lands on '
                + 'the recording where it really happened.' },
        ] },
    ],
    links: [
      { from: 'canvas', to: 'stream', label: 'WebRTC',
        note: 'The canvas is captured as a MediaStream and published over WHIP. Nothing '
            + 'here is a file: the picture exists only as long as it is being sent.' },
      { from: 'stream', to: 'screen', label: 'WebRTC',
        note: 'What the audience subscribes to over WHEP. It is the same connection the '
            + 'control room publishes, handed back out.' },
      /**
       * 🔴 THIS ARROW IS THE PAGE'S WHOLE POINT AND IT HAS BEEN ASKED ABOUT
       * TWICE: *"these wertc/arhive lower connectors are impossible to follow"*,
       * then *"why webrtc goes back to control room"*. It stays, because what it
       * says is the design: the recorder records the track that came BACK, so
       * the archive is what the audience actually saw rather than a cleaner copy
       * of the source. A note is what was missing, not the line.
       */
      { from: 'stream', to: 'recorder', label: 'WebRTC', back: true,
        note: 'The returning track, subscribed to by the control room itself. Recording the '
            + 'canvas instead would make the archive a better picture than the show was.' },
      { from: 'recorder', to: 'r2', label: 'one webm',
        note: 'The finished recording, written once when the show stops rather than streamed '
            + 'while it runs. Without ?r2=1 nothing is stored at all.' },
      /**
       * 🔴 NO `archive` RETURN ARROW. Reported 2026-09-18 against a screenshot:
       * *"these wertc/arhive lower connectors are impossible to follow"*. Three
       * return paths were stacked in lanes under the whole picture, and two of
       * them ran the full width, so following any one of them meant tracing a
       * line past four boxes it had nothing to do with.
       * ⚠️ **THE ONE THAT WENT IS THE ONE THE PICTURE COULD AFFORD TO LOSE.**
       * `recorder -> R2` already says the recording is stored there, so an arrow
       * back to the control room adds only that the page reads its own file
       * again, which is a sentence in R2's note rather than a fact worth a line
       * across the drawing. The two that stayed each carry something no other
       * arrow says: the recorder records what came BACK, and an answer travels
       * to the relay and not to R2.
       */
      { from: 'ctrl', to: 'relay', label: 'questions',
        note: 'One question at a time, repeated every 2s so somebody arriving late sees the '
            + 'current one rather than nothing.' },
      { from: 'relay', to: 'screen', label: 'questions',
        note: 'The question and its options, which the audience page draws as buttons under '
            + 'the picture.' },
      /**
       * 🔴 ANSWERS GO TO THE RELAY AND NOWHERE NEAR R2. Reported 2026-09-18:
       * *"anwsers do not go into r2!"*, and the reading was right off the
       * picture: the return path was routed up through R2's box to reach the
       * relay above it, so the only arrowhead anybody could see went into R2.
       * ⚠️ IT IS A ROUTING FIX RATHER THAN A WIRING ONE. The link always said
       * `to: 'relay'`; what was wrong was the lane it was drawn in. Naming the
       * answer's own box as the source keeps it inside the audience machine and
       * out of the column the recording occupies.
       */
      { from: 'answer', to: 'relay', label: 'answers', back: true,
        note: 'One press, sent immediately. The control room stamps it on arrival, so it '
            + 'lands on the recording where it really happened.' },
    ],
  };
  /**
   * ⚠️ `atEnd: false` IS THE WHOLE DIFFERENCE, AND IT IS NOT A STYLE CHOICE.
   * With `atEnd` the component appends to `document.body` and the host is
   * ignored, so a diagram asked to live in a tab would have appeared under the
   * page instead, looking exactly like the thing that was just moved.
   */
  const dgRoom = createDiagram(tabs.panel('controlroom'), DIAGRAM_SPEC, { how: true });
  const dgArchive = createDiagram(tabs.panel('archive'), DIAGRAM_SPEC, { how: true });
  const DIAGRAMS = [['controlroom', dgRoom], ['archive', dgArchive]];
  const cutLines = DIAGRAMS.flatMap(([where, dg]) =>
    (dg?.cuts ?? []).map((c) => `${where}/${c.id}: its ${c.where} was cut to "${c.shown}"`));
  if (cutLines.length) d.log(`the diagram shortened ${cutLines.length} to fit: ${cutLines.join(' · ')}`, 'warn');

  d.ready();
  guard(d);
</script>
