   * 400 ms after the LAST assert and waits only while the count is still
   * growing, so a drill that runs ten seconds in silence and then asserts six
   * times has its whole tail thrown away, and the page reads as having stopped
   * early rather than as having been cut off.
   *
   * ⚠️ AND IT ASSERTS THE SAME NUMBER OF TIMES IN EVERY MODE. Loopback or the
   * real leg, R2 or not, the count does not move: what changes is what the
   * message SAYS. A check that exists in one mode only is the shape CLAUDE.md
   * bans, and it bans it because a green suite then means one of two different
   * things depending on a flag nobody printed.
   */
  async function showDrill() {
    // 1. Before anything starts, there is a card and no video anywhere.
    const vidsBefore = document.querySelectorAll('.pos-vp-stage video').length;
    A('the audience waits on a card, not on an empty video',
      vidsBefore === 0 && !!aud.panel.stage.querySelector('.pos-card'),
      `${vidsBefore} video elements in the page, and the audience holds `
      + `${aud.panel.stage.querySelector('.pos-card') ? 'a card' : 'nothing'}`);

    await startShow();

    // 2. A real peer connection was negotiated, whichever leg it is.
    A('a peer connection carried the picture, rather than the page handing itself its own stream',
      !!live && !!live.sub?.pc && live.sub.inbound !== live.pub?.stream,
      `${live?.kind ?? 'nothing'} leg, receiver ice ${live?.sub?.pc?.iceConnectionState ?? 'none'}`);

    /**
     * 3. 🔴 OBJECT IDENTITY, NEVER AN ID. A remote `MediaStream` carries the
     * SENDER's msid, so `remote.id === local.id` after a hop and an id
     * comparison passes vacuously in both directions. The only honest test is
     * whether the track the recorder holds IS one of the receiver's track
     * objects.
     * ⚠️ AND WHERE THE LEG COULD NOT CARRY A PICTURE, THIS ASSERTS THE
     * OPPOSITE ON PURPOSE: that the page fell back AND SAID SO. Either way the
     * claim is that the label on the recording is true.
     */
    const recvTracks = (live?.sub?.pc?.getReceivers?.() ?? []).map((r) => r.track);
    const isReceived = recTrack != null && recvTracks.includes(recTrack);
    A('the recording is the track the page says it is',
      recSource === 'received' ? isReceived : !isReceived,
      recSource === 'received'
        ? `recorded the receiver's own track object, 1 of ${recvTracks.length}`
        : 'no frame crossed the leg, so it recorded the canvas and the log says so');

    // 4. Let it run long enough to produce more than one timeslice.
    await new Promise((r) => setTimeout(r, 3500));
    A('the recorder produced data while the show was running',
      chunks.length >= 1 && rec?.state === 'recording',
      `${chunks.length} pieces after 3.5s, recorder ${rec?.state ?? 'none'}`);

    await stopShow();

    /**
     * 5. R2, asserted in BOTH modes with one count. Without `?r2=1` the claim
     * is that the page did not touch anybody's storage; with it, the claim is
     * that the bytes are READABLE, which a HEAD answers and a 200 on the PUT
     * does not.
     */
    A(USE_R2 ? 'the bytes are in R2 and R2 will serve them back'
      : 'without ?r2=1 nothing was stored anywhere, and the page says so',
    USE_R2 ? !!landed?.ok && landed.bytes > 0 : landed === null && stored === null,
    USE_R2 ? `HEAD says ${landed?.bytes} bytes readable at ${landed?.url}`
      : 'no session opened, no object written');

    // 6. The archive plays something with a real length in it.
    const av = archive.panel.stage.querySelector('video');
    A('the archive holds a recording with a duration that could be resolved',
      !!av && Number.isFinite(recordedMs) && recordedMs > 500,
      `${recordedMs == null ? 'no duration' : `${(recordedMs / 1000).toFixed(1)}s`} in the archive panel`);

    /**
     * 7. 🔴 THE PLAYHEAD MOVES THE PICTURE, AND THE BURNED CLOCK IS WHAT MAKES
     * THAT CHECKABLE RATHER THAN SOMETHING TO TAKE ON TRUST. Two positions, two
     * readings, and they must differ by roughly the distance seeked.
     * ⚠️ `readBurnedFrom` SAMPLES FIXED COORDINATES, so the scratch canvas is
     * sized to the SOURCE and never scaled. A wrong size returns null on every
     * frame, which is indistinguishable from the row not being there.
     */
    let moved = null;
    if (av && Number.isFinite(recordedMs) && recordedMs > 1200) {
      const scratch = document.createElement('canvas');
      scratch.width = av.videoWidth || FRAME_W;
      scratch.height = av.videoHeight || FRAME_H;
      const readAt = async (ms) => {
        av.currentTime = ms / 1000;
        await new Promise((r) => {
          const on = () => { av.removeEventListener('seeked', on); r(); };
          av.addEventListener('seeked', on);
          setTimeout(r, 1500);
        });
        return readBurnedFrom(av, scratch);
      };
      const a = await readAt(200);
      const b = await readAt(Math.min(recordedMs - 200, 3200));
      if (Number.isFinite(a) && Number.isFinite(b)) moved = b - a;
    }
    A('dragging the archive moves the picture, read off the clock burned into it',
      moved != null && Math.abs(moved) > 400,
      moved == null
        ? 'the burned row could not be read back out of the recording, so this says nothing'
        : `seeking 3.0s moved the burned clock by ${(moved / 1000).toFixed(2)}s`);

    // ⚠️ AND HERE IS THE ONLY PLACE ANY OF THEM REACH THE REPORT.
    for (const [label, pass, detail] of held) d.assert(label, pass, detail);
  }

  // The frame counter has to have moved before the picture can be read back, so
  // the checks wait for a few frames rather than racing the first one.
  let warmed = 0;
  const warm = () => { if (++warmed >= 6) checks(); else requestAnimationFrame(warm); };
  requestAnimationFrame(warm);

  /**
   * 🔴 A PAGE WITH A REAL PIPELINE IN IT EARNS A DIAGRAM, and this one had
   * none. `{ how: true, atEnd: true }` and NO title: the heading lives in
   * `diagram.mjs` as `How it works` and a page that passes its own gets it
   * refused, because `/station/` once shipped two headings stacked.
   */
  /**
   * ⚠️ `how` AND `atEnd` ARE THE THIRD ARGUMENT, NOT PART OF THE SPEC, AND
   * PUTTING THEM IN THE SPEC IS A SETTING THAT READS AS CORRECT AND DOES
   * NOTHING. Caught here by looking at the page: the standing heading simply
   * was not there. This page has paid for the identical mistake once already,
   * when it passed `clock: false` to a transport bar that has never had that
   * option, and its own comment says so twenty lines up.
   */
  const dg = createDiagram(d.el, {
    caption: 'One press sends a picture out and takes it back, and what came back is what is kept.',
    nodes: [
      { id: 'ctrl', label: 'Browser', sub: 'control room', kind: 'here', tech: 'browser',
        children: [
          { id: 'canvas', label: 'canvas', sub: '1280x720, 25fps',
            note: 'The picture the show is made of, drawn here and captured as a '
                + '**MediaStream**. A clock is burned into every frame, which is what makes '
                + 'a seek in the archive checkable rather than a thing to take on trust.' },
          { id: 'recorder', label: 'MediaRecorder', sub: '2s pieces',
            note: 'Records the track that came BACK, never the canvas. What the audience '
                + 'saw is the returned track, and recording the source would make the '
                + 'archive a better picture than the show.' },
        ] },
      { id: 'cf', label: 'Cloudflare', sub: 'WHIP in, WHEP out', kind: 'cloud', tech: 'cloudflare',
        note: 'Takes the picture over **WHIP** and hands it back over **WHEP**. It records '
            + 'nothing at all, which is why the control room has to.' },
      { id: 'relay', label: 'Relay object', sub: 'one room', kind: 'cloud', tech: 'cloudflare',
        note: 'Carries questions out and answers back, and stores none of them. The control '
            + 'room repeats the state every 2s so a late arrival is right within two seconds.' },
      { id: 'r2', label: 'R2', sub: '24MiB, 6h', kind: 'cloud', tech: 'cloudflare',
        note: 'Holds the finished recording. A HEAD after the upload is what proves it can '
            + 'be read back, which a 200 on the write does not.' },
      { id: 'aud', label: 'Browser', sub: 'audience', kind: 'here', tech: 'browser',
        note: 'Sees the picture and answers the question. Before a show starts there is no '
            + 'video element here at all, only a card saying one is coming.' },
    ],
    links: [
      { from: 'canvas', to: 'cf', label: 'WHIP' },
      { from: 'cf', to: 'aud', label: 'WHEP' },
      { from: 'cf', to: 'recorder', label: 'WHEP', back: true },
      { from: 'recorder', to: 'r2', label: 'one webm' },
      { from: 'r2', to: 'ctrl', label: 'archive', back: true },
      { from: 'ctrl', to: 'relay', label: 'questions' },
      { from: 'relay', to: 'aud', label: 'questions' },
      { from: 'aud', to: 'relay', label: 'answers', back: true },
    ],
  }, { how: true, atEnd: true });
  if (dg?.cuts?.length) d.log(`diagram cuts: ${dg.cuts.join(' · ')}`, 'warn');

  d.ready();
  guard(d);
</script>
