<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* The in-band title. It changes when a track changes — human pace, not a
     clock — so prose here is allowed. `min-height` reserves the line so the
     page does not jump the first time the station says something. */
  /* 🔴 THE TWO-COLUMN GRID THAT USED TO BE HERE WAS THE WRONG FIX, AND THE
     RIGHT ONE ALREADY EXISTED IN THE KIT. It put each slider in its own cell of
     a `repeat(2, 1fr)` grid, so every slider still laid ITSELF out inside that
     cell — and a slider's label column is as wide as its own label. PHOTOGRAPHED
     here: `GRAINS A SECOND` and `READ POSITION` are different widths, so their
     two lanes started at different x and were different lengths, in a control
     whose entire job is comparing four values at a glance.

     `createSliderGroup()` is what shares ONE set of columns across all of them —
     `max-content` for the labels, `minmax(0, 1fr)` for the lanes so they take
     the width that is actually there — by making each slider `display: contents`
     so its parts land in the group's columns rather than in a box of its own.
     `{ pair: true }` gives two across above 720 px and stacks below it. This is
     the same defect `/grains/` had on a phone and the reason that component was
     written; this page had not been moved onto it. */

  /* ⚠️ FULL WIDTH, WHICH `.sld-group` DELIBERATELY IS NOT — it caps at 560 px so
     a stacked column of four does not become a metre long on a desktop. This one
     slider is the whole page in one gesture: how much of what you hear is the
     station and how much is the granulator chewing it. It is the widest thing
     here on purpose, and it sits directly under the picture whose grain ticks it
     fades, so the hand and the thing it changes are never more than a line
     apart. A page making a claim about one relationship says so — CLAUDE.md. */
  /* 🔴 TWO GROUPS CANNOT SHARE A COLUMN, AND THAT IS THE WHOLE DEFECT.
     `.sld-group`'s first column is `max-content`, which is exactly right inside
     one group and says nothing across two: the fader's column is sized by
     `RADIO → GRANULATOR` and the four settings' column by `GRAINS A SECOND`,
     so the two grids resolve to different widths and every lane below the fader
     starts at a different x from the fader's. PHOTOGRAPHED on an iPhone, where
     the pair layout is off and all five are stacked in one column — which is
     precisely where a shared column is the entire point.

     CSS has no way to say "these two grids share a track" (subgrid inherits
     from a PARENT grid, and these are siblings). So the width is measured once
     from the widest label and handed to both as `--lab`; `max-content` stays as
     the fallback, so the layout is never worse than it was if the script does
     not run. ⚠️ The pair rule has to be restated here or it is lost: this
     declaration and `.sld-group.pos-pair` are both (0,2,0), and the page's
     <style> comes after the stylesheet, so the page wins the tie on order. */
  .wet-fader { max-width: none; }

  /* 🔴 THE CONTROLS ARRIVE LATE AND EVERYTHING BELOW THEM JUMPED. They cannot be
     built until scsynth is up — about a second — so the fader, the sound picker,
     the speed row and the four sliders all appeared at once and shoved the log
     down the page while somebody was reading it. That is the same complaint the
     grain-scope caption earned ("a horrible jump of content each time it
     updates"), arriving through TIME instead of through reflow.
     The space is reserved from the first paint and the controls land INTO it, so
     nothing below ever moves. ⚠️ No border and no background: an empty box that
     paints its edges is a horizontal rule nobody wrote (shell.css says so), and
     this one is empty for the first second of every visit.
     The height is the sum of what goes in — four rows at 34 px plus the shared
     22 px rhythm between them — and it is written as that sum rather than as a
     total, so it can be re-derived when a row is added. */
  /* 🔴 AND IT MUST LAY ITS CHILDREN OUT, WHICH THE FIRST VERSION DID NOT.
     `.pos-choice` is a SPAN, and the shell's vertical rhythm lives on
     `.pos-body > * + *` — direct children only. Moving these rows into a
     wrapper took both away at once, so two inline spans flowed onto ONE line
     and landed on top of the fader above them. PHOTOGRAPHED. A flex column
     restores both: block layout, and the same 22 px gap every other element
     gets, from one declaration rather than from the parent's rule. */
  .gran-slot { display: flex; flex-direction: column; gap: 22px; align-items: stretch;
               min-height: calc(3 * 34px + 2 * 34px + 4 * 22px); }
  .gran-slot > .pos-choice, .gran-slot > .pos-pick { align-self: flex-start; }
  .wet-fader, .gran-rows { grid-template-columns: var(--lab, max-content) minmax(0, 1fr); }
  @media (min-width: 720px) {
    .gran-rows.pos-pair { grid-template-columns: repeat(2, var(--lab, max-content) minmax(0, 1fr)); }
  }

  /* ⚠️ ONE VERTICAL RHYTHM, INCLUDING INSIDE THE GROUP. MEASURED down this page
     at 1100 px: scope → fader **22**, fader → first row **22**, first row →
     second row **10**. The first two are `shell.css`'s `.pos-body > * + *`; the
     last is `.sld-group`'s own `row-gap`, which is tuned for a tall stack of
     related sliders and is the odd one out here, where there are two rows under
     a fader that is spaced at 22. Three gaps down one column, one of them
     different, reads as the bottom pair being a subgroup of something — which
     they are not. (0,2,0), so it beats the kit's rule on weight rather than on
     source order: the day that becomes a tie is the day it silently stops. */
  .gran-rows { row-gap: 22px; }

  /* The in-band title, and the slot that says when there is nothing to play.
     ⚠️ ONE ELEMENT FOR BOTH, because they answer the same question — what am I
     hearing — and two lines stacked here would leave one of them empty and
     reserving space for nothing. `min-height` holds the line so the page does
     not jump the first time the station names a track. */
  .now { font: 600 13px/1.5 var(--mono); color: var(--hi); min-height: 20px; }
  .now.down { color: var(--bad, #ff7a7a); }
</style>

<script type="module">
  import { mount, guard, el, createShipper, BUILD } from '/shell/shell.mjs';
  import { icyDemuxer } from '/shell/icy.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createGrainScope } from '/shell/grain-scope.mjs';
  import { createSlider, createSliderGroup } from '/shell/slider.mjs';
  import { createChoice } from '/shell/choice.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { createMp3Stream } from '/shell/mp3-stream.mjs';
  import { bootScsynth } from '/shell/scsynth.mjs';
  import { allocBuffers, startPappusSynth, applyAudibleDefaults, setParam, PAPPUS_NODE, RING_SECONDS, GATE0 }
    from '/shell/pappus.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { mediaMaster } from '/timeline/media-master.mjs';

  // Radio 1965 is a real station: one Icecast mount run by the Estonian Centre
  // of Contemporary Music, on `live.uuu.ee`. It is played here THROUGH OUR OWN
  // relay, and that is not a convenience.
  //
  // 🔴 THEIR MOUNT IS PLAIN HTTP ON PORT 8001. A page served over HTTPS may not
  // load it at all — the browser refuses the mixed-content fetch before any
  // CORS question is asked — so without the relay this page would have nothing
  // to play, not merely nothing to measure. The relay also adds the
  // `access-control-allow-origin` their Icecast omits, and THAT is what lets
  // WebAudio see the samples: `createMediaElementSource` on a cross-origin
  // element with no CORS gives a graph that outputs SILENCE while the speakers
  // play normally. The `WebAudio can see the samples` check catches exactly that.
  const BASE = new URLSearchParams(location.search).get('base')
    || 'https://shout.positron.studio';
  // 🔴 TWO STATIONS, AND THE SECOND IS NOT A FEATURE — IT IS WHAT MAKES THIS
  // PAGE SURVIVE ITS OWN SUBJECT. Radio 1965 is one volunteer-run Icecast mount
  // and it goes down: MEASURED 2026-09-14, `live.uuu.ee:8001` accepted the TCP
  // connection and then sent zero bytes on every path, so the relay answered
  // `origin 520` and this page had nothing at all to show — no sound, no
  // granulator, and nine red asserts about a defect that was not ours.
  // Klassikaraadio is ERR's, on the same relay and the same 128 kbps MP3, and it
  // was up in the same second. A page about a live stream needs a live stream.
  //
  // ⚠️ THE ORDER IS THE PREFERENCE. Radio 1965 first because it is what this
  // page is for; the fallback is automatic and says so in the log rather than
  // silently playing something else.
  const STATIONS = [
    ['Radio 1965', 'radio1965'],
    ['Klassikaraadio', 'klassikaraadio'],
    ['Vikerraadio', 'vikerraadio'],
    ['Raadio 2', 'raadio2'],
  ];
  const srcOf = (id) => `${BASE}/${id}.mp3`;
  /**
   * 🔴 IT STARTS ON THE RELIABLE ONE AND UPGRADES TO THE ONE IT IS NAMED AFTER.
   *
   * Radio 1965 is a volunteer-run mount that has been up and down all day —
   * `520`, then `403`, then unreachable entirely — while Klassikaraadio has been
   * answering throughout. Opening on the preferred station means every visit
   * begins with a failed load, a fallback and a second decoder; opening on the
   * reliable one means sound starts immediately and the page moves up to Radio
   * 1965 within a second when it is actually there.
   *
   * ⚠️ THE UPGRADE HAPPENS ONCE, AT LOAD, AND NEVER AGAIN. The background watch
   * ungreys a station that comes back and does not move you — asked for in as
   * many words, *"do not switch channels if I do not"*. Choosing what to open
   * with is not the same as changing it under somebody's hand.
   */
  const DEFAULT_ID = 'klassikaraadio';
  const PREFERRED_ID = 'radio1965';
  const indexOfId = (id) => STATIONS.findIndex(([, s]) => s === id);
  let station = DEFAULT_ID;
  const PROBE_MS = 6000;            // long enough for a cold relay, short enough to act on
  const NOMINAL_KBPS = 128;         // both mounts: measured direct 128.076 kbit/s
  // ⚠️ A CROSS-PAGE URL, AND IT IS CHECKED AT BUILD TIME. The compiled graph
  // lives with `/grains/`'s PROVENANCE.json, which records the md5 of the `.sc`
  // it came from and which `build.mjs` REFUSES the build over when they
  // disagree. A second copy here could go stale silently — the exact failure
  // that check exists to prevent — so there is ONE definition and it stays
  // where its provenance is. `checkVendorUrls()` validates `/…/defs/…` strings
  // in the source, so a rename cannot quietly 404 this the way `moq.mjs` did.
  const DEFS = '/grains/defs/';
  const SPAN_MS = 3 * 60 * 1000;    // the opening view
  const MEASURE_MS = 5000;
  // ⚠️ DECLARED UP HERE BECAUSE THE SCOPE READS IT. It sat beside `let eng` for
  // one run, below the `createGrainScope` call that uses it — a `const` in its
  // temporal dead zone, which is a ReferenceError at module load, which is a
  // page that never calls `d.ready()`. The suite said `__demo.ready — failed`
  // and nothing else, because nothing else had run.
  const BUF_SECONDS = 8;                 // Pappus `mbuflen`, the held seconds
  const RANGE_HZ = 1;

  const d = mount({
    name: 'radio1965',
    what: 'A live community radio station in Tallinn, played through a relay of '
      + 'ours because their stream is plain HTTP and a secure page may not load it '
      + 'directly. The sound also goes into a SuperCollider granulator running in '
      + 'this tab — the same compiled graph a Raspberry Pi in the studio runs — the '
      + 'long fader blends the two, all station at the left and all granulator at '
      + 'the right, and every tick in the picture is a grain the engine reported '
      + 'firing rather than one guessed from the sound. SOUND steps through six '
      + 'finished settings, from a slow reverse drift to a stutter that leaves the '
      + 'words intelligible, and the four sliders nudge whichever one you are on. '
      + 'HEARD is how long it has played, KBPS the settled rate, BEHIND the seconds '
      + 'you missed while paused, GRAINS how many fire a second.',
    // ⚠️ FOUR CELLS, DOWN FROM SIX, AND THE TWO THAT WENT WERE THE TWO THAT
    // COULD NOT MOVE. `gap` is the worst pause over one five-second read: it is
    // measured once and then sits there for the rest of the visit, which is a
    // constant wearing a measurement's clothes (CLAUDE.md: every readout cell
    // must be able to change). It is still asserted and still in the log line —
    // REHOMED, not deleted. `wet` went because the fader now prints its own
    // value an inch below, and a second copy of a number is a number that can
    // disagree with itself — the same argument `keyboard.mjs` makes for keeping
    // the octave off the pad.
    readout: { heard: 's', kbps: '', behind: 's', grains: '/s' },
    // 🔴 NO CONTROLS AT ALL, AND THE GRANULATOR IS ALWAYS ON. There was a
    // `Synthesize` button, and before that a `Listen` button beside a transport
    // bar that already has a play button. Both were the same mistake one step
    // apart: a second control for something the page is already doing. The
    // granulator is not a mode this page can be in or out of — it is what the
    // page IS — so it comes up with the sound and the fader decides how much of
    // it reaches you. `mount()` hides an empty `.pos-controls` (shell.mjs:111),
    // so the row leaves no band behind it.
    controls: [],
  });
  guard(d);

  /**
   * 🔴 `?report=1` — THE ONLY WAY TO SEE WHAT A PHONE IS DOING. iOS Safari
   * cannot be attached to a debugger from here, and this page fails on it in the
   * worst available shape: sound out of the speakers, an empty picture, and
   * every visible step apparently succeeding. Guessing has already cost two
   * wrong hypotheses — `createMediaElementSource` before `src` (a real defect,
   * not this one) and CORS (the relay's streaming 200 carries
   * `access-control-allow-origin: *`).
   *
   * So the page reports instead. `createShipper` batches at 2 s, collapses
   * repeats and swallows its own failures, because a diagnostic is never allowed
   * to make the page worse than the thing being diagnosed. Read it back at
   * `https://pub.positron.studio/logs?format=text`.
   *
   * ⚠️ OFF UNLESS ASKED. Every visitor posting their session to a shared ring
   * buffer would push the one report somebody is waiting for straight out of it.
   * ⚠️ AND IT OPENS WITH THE BUILD AND THE USER AGENT, or a report cannot be
   * attributed to a build and "still broken" and "the fix never loaded" are the
   * same line.
   */
  /**
   * 🔴 `?decode=1` — THE STREAM WITHOUT A MEDIA ELEMENT.
   *
   * MEASURED on an iPhone: `<audio>` plays and `createMediaElementSource` hands
   * the graph 0.0000 for ever, while an oscillator through the same analyser
   * reads 0.33-0.80. `mp3-stream.mjs` fetches, demuxes the ICY text out, splits
   * MP3 frames and decodes them itself — so nothing depends on WebKit routing an
   * element into WebAudio.
   *
   * ⚠️ BEHIND A FLAG UNTIL IT HAS EARNED THE DEFAULT. The element path is 30/30
   * on this machine and this one has never run on the device it was written for.
   * Replacing a measured path with an unmeasured one because the mechanism is
   * convincing is how this page has already been "fixed" twice today.
   */
  /**
   * 🔴 DECODING IS THE DEFAULT NOW, AND `?decode=0` IS THE WAY BACK.
   *
   * It was opt-in while it was unproven, and that was right — but it has been
   * the only path that works on iOS since the day it was written (WebKit hands
   * `createMediaElementSource` silence: MEASURED, analyser 0.0000 for a whole
   * run while a 440 Hz tone through the SAME analyser read 0.33-0.80), and
   * every fix since — the crossfaded seams, the latency drain, the burst
   * trimming, the speed work — has landed on it and not on the element.
   *
   * ⚠️ LEAVING IT OPT-IN MEANT THE DEFAULT PAGE WAS THE UNFIXED ONE. Reported
   * from `positron.studio/radio1965/` with no flag: a blurb, then a hole, then
   * audio — the element path's holes, on a page whose decoded path had been
   * green for hours. A flag that has to be remembered is a flag that will be
   * forgotten, and the person who forgets it sees the old defect.
   */
  const DECODE = new URLSearchParams(location.search).get('decode') !== '0';
  const REPORTING = new URLSearchParams(location.search).get('report') === '1';
  const ship = REPORTING ? createShipper() : () => {};
  if (REPORTING) {
    ship(`--- radio1965 BUILD ${BUILD} ---`);
    ship(`UA ${navigator.userAgent}`);
    d.log('reporting to pub.positron.studio — this session is being posted');
  }

  // ⚠️ THE RELAY URL USED TO BE PRINTED HERE AND IS NOT ANY MORE. A 60-character
  // absolute URL across the top of a page is noise: it never changes, nobody can
  // act on it, and it pushed the thing you came for further down. It is in the
  // log line when the stream starts, where somebody who wants it can copy it.
  // ⚠️ THE CHOOSER IS ABOVE THE TRANSPORT because it decides what the transport
  // plays, and `createChoice` rather than two hand-rolled buttons because this
  // repo has already shipped three different radio rows and paid for all of them.
  const picker = createChoice({
    label: 'station',
    options: STATIONS,
    at: Math.max(0, indexOfId(DEFAULT_ID)),
    onPick: (id) => {
      if (id !== station) switchTo(id, selfCheck ? 'checking the buttons' : 'you chose it');
    },
  });
  d.el.append(picker.el);

  const nowEl = el('div', 'now', '');
  d.el.append(nowEl);

  // ── the line ───────────────────────────────────────────────────────────────
  // ⚠️ THERE IS NO STRIP. A strip is a picture of a span you can move around
  // in, and an Icecast stream has no past to move around in — every mark on it
  // would have said the same thing the clock says, in more space. `scrub:
  // false` for the same reason: a scrub here is a control that cannot do what
  // it looks like it does. `absolute: true` because the clock is the wall
  // clock, and after a pause it reads BEHIND it, which is the truth about how
  // far behind live you now are.
  const t0 = Date.now();
  /**
   * 🔴 THE SPEEDS BELONG TO THE TRANSPORT BAR, NOT TO A ROW OF MY OWN.
   * CLAUDE.md: *"Transport UI is `demo/shell/transport-bar.mjs` and nothing
   * else … rates from intersected `caps.rates`."* A speed picker beside the
   * sound picker was a second transport, and it collided with the first.
   *
   * The bar builds its buttons from `latticeFor(deck)`, which reads
   * `deck.caps()` — `{kind: caps}` over the registered adapters — so declaring
   * a lattice is declaring an adapter that HAS one. ⚠️ HANDOFF records an
   * earlier attempt at exactly this taking the page down at module load, with
   * `__demo.ready — failed` and nothing else; the shape below is the one
   * `adapterCaps()` actually reads (`timeline/transport.mjs:1960`), verified by
   * running the page rather than by reasoning about it.
   *
   * ⚠️ AND THE RATES ARE THE STREAM'S, NOT THE PLAYHEAD'S. This deck's position
   * is wall-clock — it follows the audio, it does not drive it — so what a rate
   * button changes is how fast the STATION is played, which is the thing a
   * listener means by speed here.
   */
  const deck = createDeck({
    items: [],
    adapters: {
      radio: {
        // 🔴 `actuate()` IS REQUIRED AND ITS ABSENCE IS WHAT KILLED THE EARLIER
        // ATTEMPT. `registerAdapter` throws `adapter radio: actuate() required`
        // at construction (`timeline/transport.mjs:1907`), inside `createDeck`,
        // at module load — so the page never reached `d.ready()` and the suite
        // reported `__demo.ready — failed` with nothing else to go on. HANDOFF
        // recorded the symptom and said the shape "was not established"; this is
        // the shape, read off the validator.
        //
        // ⚠️ IT IS EMPTY, AND HONESTLY SO. This deck holds no items — its
        // position is wall-clock and it FOLLOWS the audio rather than driving
        // it. There is nothing to actuate because the sound is not on the
        // timeline; it is the live thing the timeline is watching. What the
        // adapter is here for is the one claim it can truthfully make: which
        // speeds this stream can be played at.
        actuate() {},
        // 🔴 SLOW ONLY, AND 2x IS GONE BECAUSE IT CANNOT WORK. Bytes arrive at
        // exactly 1x, so anything faster eats the cushion and then starves —
        // MEASURED: from a 1 s cushion, 2x drains it in about a second and
        // every block after that underruns, which is the regular gating that
        // was photographed. Below 1x there is no such limit: you simply fall
        // further behind, which BEHIND already reports and which is the
        // interesting half anyway.
        // 🔴 NO RATES. Varispeed on a LIVE EDGE cannot work and the numbers
        // say so: bytes arrive at exactly 1x, so faster starves (MEASURED: a
        // 1 s cushion gone in a second, then every block underrunning — the
        // regular gating that was photographed) and slower falls behind for
        // ever (MEASURED: `buffered` 3.6 -> 17.0 s in twenty seconds at 0.5x,
        // then 168 blocks DROPPED to stay inside a 30 s ceiling, each drop a
        // jump forward in the content — which is why 0.25x was reported as
        // sounding "sped up"). There is no third option at a live edge.
        //
        // Slowing down belongs to the granulator, which reads a HELD eight
        // seconds: there the read head can crawl with no queue, no drops and no
        // falling behind, and the pitch stays where it was. See the `slowed`
        // sound below — that is this feature, done where it works.
        caps: {},
      },
    },
    range: [t0 - SPAN_MS, t0],
  });
  deck.seek(t0);

  let heardFrom = null;                 // when audio actually started arriving
  // 🔴 SECONDS PLAYED BEFORE THE CURRENT `src`, BECAUSE `currentTime` RESTARTS
  // AT ZERO ON EVERY SWITCH. HEARD says how long you have been listening, and a
  // station change — including the one `finish()` makes and undoes to check the
  // buttons — was setting it back to `0s` on a page that had been playing for
  // half a minute. PHOTOGRAPHED reading `HEARD 0s` beside `BEHIND 4s`, which
  // cannot both be true.
  let heardBefore = 0;
  let started = false;                  // has the stream ever been asked for

  const bar = createTransportBar(d.el, deck, { absolute: true, scrub: false, endStop: false });

  /**
   * The bar's speed, carried to the stream.
   *
   * ⚠️ POLLED, NOT HOOKED, because the bar exposes no rate event and reaching
   * into its buttons would be the page owning a control it does not own. One
   * read a second is free, and `setRate` is a no-op when nothing changed.
   * ⚠️ `targetRate` rather than `rate()`: a paused deck genuinely advances at
   * zero, so `rate()` reads 0 while paused and would silently stop the station
   * the moment somebody pressed pause and play.
   */
  setInterval(() => {
    const r = deck.targetRate?.() ?? deck.rate?.() ?? 1;
    if (DECODE && stream && r > 0 && r !== speed) {
      speed = r;
      stream.setRate(r);
      d.log(r === 1 ? 'back to the station\u2019s own speed'
        : r < 1 ? `${r}\u00d7 — pitched down, and falling further behind live every second`
                : `${r}\u00d7 — pitched up, and it lasts only as long as the cushion`);
    }
  }, 1000);

  // ── the picture ────────────────────────────────────────────────────────────
  // 🔴 TWO PICTURES, AND THE COMPONENT CHOOSES BY WHAT IT IS GIVEN. Before the
  // granulator exists there are no grains to draw, so this is `feed()`: a
  // scrolling waveform of the audio that arrived, and the gutter says in words
  // that it is all that can be honestly shown. Once Pappus is running, every
  // tick is a grain the ENGINE reported firing — `SendReply.ar(… '/pgrain' …)`
  // from inside the graph — never a grain inferred from an envelope, which
  // might be a note or a delay tap.
  // ⚠️ A LOCKED SCALE, because this is a stream and not a held buffer. Left on
  // the default the picture renormalises to whatever is loudest in the last six
  // seconds, so it heaves every time a loud passage leaves the right edge and a
  // quiet stretch draws the same as a loud one. `fullScale: 1` means the height
  // is an amplitude: 1.0 fills it, and a quiet passage looks quiet.
  const scope = createGrainScope(d.el, { seconds: 6, height: 140, fullScale: 1,
    // the granulator's buffer is filled from THIS audio, so grain positions and
    // this axis are the same seconds — see the note in grain-scope.mjs
    grainSeconds: BUF_SECONDS });

  scope.source('the radio, as it arrives');

  // The space the granulator's controls will occupy, reserved now so their
  // arrival a second from now moves nothing. See `.gran-slot` in <style>.
  // ⚠️ It uses the shell's own vertical rhythm by being an ordinary sibling —
  // the gap above and below it is the same 22 px every other element gets, so
  // the reserved block is not a special case that has to be kept in step.
  const granSlot = el('div', 'gran-slot');
  scope.el.after(granSlot);

  // ⚠️ THE FIRST PLAY MUST HAPPEN INSIDE THE GESTURE. A browser refuses
  // `audio.play()` from a timer, so the 1 Hz mirror below can keep the element
  // in step with the deck but cannot START it — the press on the bar's own
  // button is the only moment the browser will accept, and it is gone by the
  // next tick.
  //
  // ⚠️ AND IT LISTENS FOR `click`, NOT `pointerdown`. `verify.mjs` drives this
  // page with `document.querySelector('.tbar-toggle').click()` — no pointer
  // events at all — so a pointerdown hook would work under a finger and never
  // once under the harness, which is a page that is only tested by hand.
  // Capture-phase, so it runs BEFORE the bar's own handler flips the deck:
  // `deck.playing()` is still the state before this press.
  bar.el.addEventListener('click', () => {
    if (deck.playing()) return;                 // this press is a pause
    startListening();
  }, { capture: true });

  // BOTH ENDS MOVE, once a second: the right edge is now, and the left trails it.
  setInterval(() => {
    const t = Date.now();
    deck.setRange([t - SPAN_MS, t]);
    // 🔴 BOTH NUMBERS COME FROM THE ELEMENT, NOT FROM THIS TIMER. `heard` used
    // to be a counter this interval incremented — a measurement driven by a
    // clock, of a quantity the audio object already knows exactly.
    // `audio.currentTime` counts only while sound is actually playing, so
    // pauses fall out for free and no counter can drift from them.
    //
    // ⚠️ AND A HIDDEN TAB IS WHERE THE OLD ONE WOULD HAVE LIED. Chrome clamps a
    // background `setInterval` to 1 s and, after a few minutes, throttles it
    // far harder — so `heard` would have stalled while the radio kept playing,
    // and `behind`, computed against the wall clock, would have climbed to
    // minutes of "you missed this" for somebody who missed nothing. The
    // element's own clock has no such problem.
    if (heardFrom != null) {
      d.set('heard', played().toFixed(0));
    }
    // 🔴 BEHIND — the one number a live stream with a pause button owes you.
    // An Icecast mount has no past to seek to, so pausing does not hold your
    // place: it drops you, and resuming rejoins at the live edge while the
    // seconds you missed stay missed. This counts them. It sits still while you
    // listen and grows while you do not, which is exactly when it matters.
    if (heardFrom != null) {
      d.set('behind', Math.max(0, (Date.now() - heardFrom) / 1000 - played()).toFixed(0));
    }
    // 🔴 THE BAR MUST BE ABLE TO STOP THE SOUND, AND IT COULD NOT.
    // `mediaMaster` runs one way only — its own doc says *"a paused/ended
    // master pauses the deck, and a running one resumes it"* — so the ELEMENT
    // drives the deck and nothing drove the element. Pressing pause stopped the
    // playhead and left the radio playing, which is a transport bar lying about
    // the one thing it is for. Reported from the page, not from a test.
    if (started) {
      if (DECODE) {
        // An Icecast mount has no pause: stopping drops you and playing rejoins
        // at the live edge, which is exactly what BEHIND already reports.
        if (deck.playing() && !stream) openStream();
        else if (!deck.playing() && stream) closeStream();
      } else if (deck.playing() && audio.paused) audio.play().catch(() => {});
      else if (!deck.playing() && !audio.paused) audio.pause();
    }
    // 🔴 GRAINS FOLLOWS THE PATCH, AND BEFORE THE PATCHES IT DID NOT HAVE TO.
    // This cell used to be written ONCE, from the boot measurement, and that was
    // defensible while the page had one grain rate: `mrate` never moved unless a
    // hand moved it. Six patches span 0.9/s to 26/s and multiply that by their
    // own chord and rhythm, so a cell frozen at the opening patch's 5.6 would
    // read 5.6 under `roof rain`'s forty-two — a stale measurement, which is
    // worse than a constant because it looks live (CLAUDE.md: every readout cell
    // must be able to change, and this one had stopped being able to).
    //
    // ⚠️ A NUMBER IN A CELL, AT ONE HERTZ, WHICH IS WHERE A CHANGING NUMBER GOES.
    // The cell is a fixed box with `tabular-nums`, so it cannot reflow the page
    // under somebody reading it — unlike a sentence, which is the thing that
    // rule exists about.
    // ⚠️ AND THE ASSERT DOES NOT READ THIS. It grades `lastRate`, the boot
    // measurement taken over a known window with a known patch loaded; a cell
    // that anybody can change by pressing `›` is not evidence about anything.
    // ⚠️ `Math.max(0, …)` BECAUSE THE COUNTER IS RESET ONCE, in `startGranulator`
    // just before the boot window — without it the first tick after that reset
    // reports a negative rate.
    if (eng && G.running) {
      const now = performance.now();
      const dt = (now - grainsAt) / 1000;
      if (dt > 0.25) {
        d.set('grains', (Math.max(0, grains - grainsSeen) / dt).toFixed(1));
        grainsSeen = grains; grainsAt = now;
      }
    }
    // 🔴 THE ONE LINE THAT SEPARATES EVERY CANDIDATE, once a second.
    // `ctx` running vs suspended; the ELEMENT playing vs not; `rms`, which is
    // whether WebAudio can hear the element AT ALL and is the whole question on
    // iOS; `eng`, which answers "is it a loading problem" outright; and whether
    // the graph is firing grains. Any two of these disagreeing names the fault.
    if (REPORTING && started) {
      ship(`ctx=${ctx ? ctx.state : 'none'} sr=${ctx ? ctx.sampleRate : '-'}`
        + ` session=${navigator.audioSession ? `${navigator.audioSession.type}/${navigator.audioSession.state}` : 'unsupported'}`
        + (DECODE
          ? ` decode=${JSON.stringify(stream ? stream.stats() : null)}`
          : ` el={paused:${audio.paused},t:${audio.currentTime.toFixed(1)},ready:${audio.readyState},net:${audio.networkState},err:${audio.error ? audio.error.code : '-'}}`)
        + ` rms=${rmsPeak.toFixed(4)} fed=${scope.stats().inferred}`
        + ` eng=${eng ? Math.round(eng.bootMs) + 'ms' : 'not booted'} grains=${grains}`
        + ` station=${station} wet=${wet.toFixed(2)}`);
    }
  }, 1000 / RANGE_HZ);

  // ── the audio ──────────────────────────────────────────────────────────────
  const audio = new Audio();
  // crossOrigin is the whole point — see the note at the top of this file.
  audio.crossOrigin = 'anonymous';
  audio.preload = 'none';
  let ctx = null, srcNode = null, analyser = null, master = null, dry = null;
  let stream = null;                 // the decoded mount, when DECODE
  // ⚠️ THE SPEED SURVIVES A REOPEN. A station switch builds a new stream, and a
  // control whose setting silently reverts because something behind it was
  // rebuilt is worse than one that does not exist.
  let speed = 1;
  // ⚠️ REMEMBERED, because the stream is CLOSED by the time `finish()` asserts —
  // the transport-stop check shuts it deliberately — and reading the path off a
  // null stream printed `via nothing` about a path that had just decoded 16 s.
  let decodePath = '';

  /** Point the decoded path at the current station. Safe to call again. */
  function openStream() {
    closeStream();
    stream = createMp3Stream(ctx, {
      url: srcOf(station),
      onTitle: (t) => { nowEl.textContent = t; d.log(`now playing: ${t}`, 'hi'); },
      log: (m) => { d.log(m); ship(m); },
    });
    stream.node.connect(srcNode);
    window.__stream = stream;   // a handle for the lab probe; harmless in a page
    stream.setRate(speed);
    stream.started.then((path) => {
      decodePath = path;
      ship(`decode path: ${path}`);
      if (heardFrom == null) heardFrom = Date.now();
      deck.seek(Date.now());
      deck.play();
      if (!master) master = mediaMaster(deck, () => ({ el: null, key: 'radio', pos: heardFrom + played() * 1000 }));
    }).catch(() => {});
  }
  function closeStream() {
    if (!stream) return;
    heardBefore += playedNow();
    try { stream.stop(); } catch { /* already stopped */ }
    stream = null;
  }

  // 🔴 ONE CLOCK FOR BOTH PATHS. An element counts in `currentTime`; a decoded
  // stream counts in context seconds since its first block was scheduled.
  // Every number this page prints about listening — HEARD, BEHIND, the ring
  // warm-up, "did it play" — has to come from ONE of these or the page reports
  // two different answers to one question depending on a query parameter.
  const playedNow = () => (DECODE
    ? (stream && stream.stats().startedAt ? Math.max(0, ctx.currentTime - stream.stats().startedAt) : 0)
    : audio.currentTime);
  const played = () => heardBefore + playedNow();
  const isPlaying = () => (DECODE ? !!(stream && stream.stats().blocks > 0) : !audio.paused);
  // 🔴 IT STARTS DRY. The granulator is running from the moment there is sound,
  // but none of it reaches you until you move the fader — so the first thing
  // this page does is play a radio station, and the instrument is something you
  // bring in. At 0.85, which is where it used to land the instant the button was
  // pressed, the station was gone before anybody had heard it arrive.
  //
  // ⚠️ AND THE ASSERTS ARE UNAFFECTED BY THIS, WHICH IS WHY IT IS SAFE.
  // `bootScsynth` wires `sonic.node → meter → out`, so the engine's own meter is
  // UPSTREAM of the wet gain: `engLevel()` reads what the granulator is making
  // whatever the fader is set to. A deafness control that went quiet merely
  // because the blend was dry would be measuring the fader.
  let eng = null, grains = 0, wet = 0, sliderRow = null, lastRate = '';
  // The rolling window the GRAINS cell is computed over — see the 1 Hz tick.
  let grainsSeen = 0, grainsAt = performance.now();
  // ⚠️ DECLARED HERE, BUILT IN `startGranulator`. `applyPatch` moves the sliders
  // and renames one of them, and it is called from the boot — before the row
  // exists — so every reference to them is optional. A patch applied with no
  // sliders on screen still reaches the engine; it is only the picture of it
  // that waits.
  let sliders = null, patchPick = null, shareLabelColumn = null;
  // Has the granulator's ring been through one full lap of live radio? Until it
  // has, the engine is quiet for a reason and nothing may report that as a fault.
  let ringFilled = false;
  // What the four sliders currently hold. Seeded from the patch this page opens
  // on, never from the engine's own defaults — see PATCHES.
  const P = { rate: 1.4, size: 1.8, scan: 0.30, spray: 0.55 };
  let measured = null, done = false, synthPending = false;

  function graph() {
    if (ctx) return;
    // 🔴 iOS SENDS WEBAUDIO THROUGH THE SILENT SWITCH AND A MEDIA ELEMENT PAST
    // IT, AND THAT IS WHY REMOVING THE ELEMENT MADE THE PAGE GO QUIET.
    // MEASURED on an iPhone the moment the decode path started working: the
    // decoder ran clean — `WebCodecs AudioDecoder`, 44100 Hz, 0 errors, 0
    // underruns — and the analyser read **rms 0.16 -> 0.23**, so the graph
    // plainly had the audio, while the phone made no sound at all. A page whose
    // only output is WebAudio gets the `ambient` session by default, which the
    // ring/silent switch mutes; `<audio>` gets `playback`, which it does not.
    // That difference is invisible on a laptop and is the entire experience on
    // a phone.
    //
    // ⚠️ SET IT BEFORE THE FIRST SOUND, INSIDE THE GESTURE. WebKit's Audio
    // Session API is the only way to ask, and asking late leaves the first
    // seconds on the wrong session. It is absent everywhere else, so this is a
    // capability test and never a platform check (CLAUDE.md).
    try {
      if (navigator.audioSession) navigator.audioSession.type = 'playback';
    } catch (e) { d.log(`could not claim a playback audio session: ${e.message}`); }
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    // ⚠️ A STABLE GAIN IS THE INPUT, NOT WHATEVER IS FEEDING IT. scsynth is
    // wired to this node ONCE at boot; a station switch replaces the decoded
    // stream behind it, and if the page handed out the stream's own node the
    // granulator would keep reading the old, stopped one — silence that looks
    // like a broken engine.
    srcNode = ctx.createGain();
    if (DECODE) openStream();
    else ctx.createMediaElementSource(audio).connect(srcNode);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 2048;
    // ⚠️ THE DRY GAIN EXISTS FROM THE START even though nothing uses it until
    // Synthesize is pressed. Re-routing a live graph is how a page ends up with
    // two paths to the destination and twice the level; building the blend
    // point once means the only thing that ever changes is a number.
    dry = ctx.createGain();
    srcNode.connect(analyser);
    analyser.connect(dry);
    dry.connect(ctx.destination);

    // 🔴 iOS HAS A FOURTH AudioContext STATE — `interrupted` — AND IT DOES NOT
    // COME BACK ON ITS OWN. MEASURED on an iPhone (iOS 18.7, Safari 26.6.1):
    // the context ran for forty seconds and then went `interrupted`, at which
    // point `fed` froze at 2141 and `grains` froze at 780 and never moved again
    // for the remaining eleven seconds of the run. The page looked alive — the
    // element kept playing, `currentTime` kept climbing — while everything
    // downstream of the graph had stopped. That is the silent-stall shape this
    // repo keeps paying for, and nothing in the spec's three states describes
    // it, so nothing was watching for it.
    ctx.addEventListener?.('statechange', () => {
      ship(`ctx -> ${ctx.state}`);
      if (ctx.state === 'running') return;
      d.log(`the browser ${ctx.state} the audio; asking for it back`);
      ctx.resume?.().catch(() => {});
    });
    // ⚠️ AND A GESTURE IS THE ONLY THING THAT RELIABLY GETS IT BACK. `resume()`
    // from a timer is refused on iOS exactly when it is most needed, so the next
    // touch anywhere on the page tries again. Cheap, passive, and it costs a
    // working page nothing because it returns immediately when already running.
    addEventListener('pointerdown', () => {
      if (ctx && ctx.state !== 'running') ctx.resume?.().catch(() => {});
    }, { passive: true });
  }

  /**
   * 🔴 A DEAFNESS CONTROL FOR THE INSTRUMENT ITSELF — `?report=1` only.
   *
   * The iPhone reports `rms=0.0000` on every line while the element plays
   * happily. Two things produce that reading and they have opposite fixes: the
   * media element is not reaching WebAudio, or this page's analyser is not
   * measuring anything at all. An oscillator through the SAME analyser
   * separates them in 400 ms — *"six arms of zero is the shape of a deaf
   * instrument"*.
   *
   * ⚠️ `dry` is muted for the duration so the test tone cannot reach a speaker.
   */
  let proved = false;
  async function proveAnalyser() {
    // 🔴 ONCE, AND THE GUARD IS ON THE FUNCTION RATHER THAN ON ITS CALLER.
    // MEASURED: the call was placed one line inside `meterTick`, which re-enters
    // on every animation frame — so it armed a fresh oscillator sixty times a
    // second, each living 400 ms. Dozens summed, the analyser read 0.80 instead
    // of a lone tone's 0.18, and the picture filled its full height with MY TEST
    // TONE while the page reported it as the radio. A diagnostic that changes
    // the thing it is measuring is worse than none — so the invariant lives
    // where it cannot be re-broken by the next caller.
    if (proved || !ctx || !analyser) return;
    proved = true;
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.frequency.value = 440; g.gain.value = 0.25;
    osc.connect(g); g.connect(analyser);
    const wasDry = dry.gain.value;
    dry.gain.value = 0;
    osc.start();
    const buf = new Float32Array(analyser.fftSize);
    let peak = 0;
    const t0 = performance.now();
    while (performance.now() - t0 < 400) {
      await new Promise((r) => setTimeout(r, 50));
      analyser.getFloatTimeDomainData(buf);
      let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
      peak = Math.max(peak, Math.sqrt(s / buf.length));
    }
    try { osc.stop(); } catch { /* already stopped */ }
    osc.disconnect(); g.disconnect();
    dry.gain.value = wasDry;
    const verdict = peak > 0.01 ? 'the graph CAN hear — so the element is what is silent'
                                : 'the graph hears NOTHING — the analyser path is the fault';
    ship(`analyser control: a 440 Hz tone through the same analyser reads ${peak.toFixed(4)} — ${verdict}`);
    d.log(`analyser control: ${peak.toFixed(4)} — ${verdict}`);
  }

  // ── which station, and whether there is one at all ─────────────────────────
  // 🔴 EVERY STATE BELOW COMES FROM AN ANSWER, NEVER FROM A GUESS. "The stream
  // is down" and "we have not asked yet" are different facts with opposite
  // consequences — one disables the page, the other must not — so `avail` holds
  // three values and `undefined` never disables anything. That is `caps.mjs`'s
  // rule about `unknown` never blocking, one page over.
  const avail = new Map();          // id -> true | false | undefined (not asked)
  const granControls = [];          // every slider, so a dead stream can grey them
  let dead = false;
  // True only while `finish()` is exercising the station buttons, so the log can
  // name a press nobody made for what it is rather than claiming you chose it.
  let selfCheck = false;

  /** Ask the relay for a station, then hang up. */
  async function probeStation(id) {
    const ac = new AbortController();
    const t = setTimeout(() => ac.abort(), PROBE_MS);
    try {
      const res = await fetch(srcOf(id), { signal: ac.signal, cache: 'no-store' });
      // ⚠️ CANCEL THE BODY. This is an ENDLESS stream and the relay counts
      // listeners: a probe that reads the status line and walks away holds a
      // connection open for the life of the page, and two of those per load is
      // a page quietly using the station as a load generator.
      try { await res.body?.cancel(); } catch { /* already gone */ }
      return res.ok;
    } catch { return false; } finally { clearTimeout(t); }
  }

  /**
   * Paint whatever the answers currently say.
   *
   * ⚠️ THE PLAY BUTTON IS REACHED FOR BY CLASS, AND THAT IS A KIT GAP RATHER
   * THAN A SHORTCUT. `createTransportBar` returns `extra(id)` for the buttons a
   * page adds and nothing at all for its own toggle, so a page that must refuse
   * to play has no way to say so through the component. Reported rather than
   * worked around a second time: the bar wants a `disabled()`.
   */
  function paintStations() {
    const toggle = bar.el.querySelector('.tbar-toggle');
    if (toggle) toggle.disabled = dead;
    if (dead) {
      picker.disabled(true);
      for (const s of granControls) s.disabled(true);
      nowEl.textContent = 'no streams';
      nowEl.classList.add('down');
      return;
    }
    nowEl.classList.remove('down');
    for (const s of granControls) s.disabled(false);
    // A station known to be down is greyed; one nobody has asked about is not.
    STATIONS.forEach(([, id], i) => { picker.buttons[i].disabled = avail.get(id) === false; });
  }

  const nameOf = (id) => (STATIONS.find(([, s]) => s === id) || [id])[0];

  /**
   * Point everything at another station.
   *
   * ⚠️ THE GRANULATOR NEEDS NO REBUILD AND THAT IS NOT LUCK.
   * `createMediaElementSource` binds to the ELEMENT, not to the URL, so
   * scsynth's input follows a change of `src` without a wire being touched.
   * ⚠️ `picker.set(i, true)` is QUIET, or choosing a station from the buttons
   * would call back into this function and switch again.
   */
  function switchTo(id, why) {
    if (id === station || dead) return;
    station = id;
    picker.set(STATIONS.findIndex(([, s]) => s === id), true);
    d.log(`${nameOf(id)} — ${why}`);
    nowEl.textContent = '';
    paintStations();
    if (!started) return;
    // The element has already been played once inside a real gesture, so the
    // browser allows this one; `currentTime` restarts, which is what `heard`
    // should say about a station you have just switched to.
    // ⚠️ `heardFrom` IS NOT TOUCHED. It means "when this page first heard
    // anything", and `behind` — the seconds you missed — is measured against it.
    // Moving it on a switch makes BEHIND report the whole session as missed.
    // Only the PLAYHEAD wants "now", because an Icecast mount has no past and a
    // switch rejoins at the live edge.
    if (DECODE) { openStream(); }      // `closeStream` banks the seconds played
    else {
      heardBefore += audio.currentTime; // keep what this page has already played
      audio.src = srcOf(id);
      audio.play().catch(() => {});
    }
    deck.seek(Date.now());
    deck.play();
  }

  /**
   * Ask the relay which stations are up, and act on the answer.
   *
   * 🔴 ONE REQUEST THAT ALWAYS ANSWERS 200, AND THAT IS THE ENTIRE POINT.
   * Probing a mount directly means fetching a dead one, which answers 502 — and
   * **the browser logs that to the console with no way to suppress it**, so the
   * page tripped its own `no console errors` check and a visitor watching a
   * phone saw a red line about a station being down instead of the page quietly
   * handling it. `/health` moves the question to the thing that knows and
   * reports "down" as data rather than as an error status.
   *
   * ⚠️ THE PER-STATION PROBE IS KEPT AS THE FALLBACK, for a `?base=` pointed at
   * a relay without the route. It is worse — it is the thing that logs — but a
   * page that assumes a route exists is a page that breaks against an older
   * deploy, which is the `moq.mjs` trap in a new costume.
   */
  async function resolveStations() {
    let answers = null;
    try {
      const ac = new AbortController();
      const t = setTimeout(() => ac.abort(), PROBE_MS);
      // ⚠️ ASK ABOUT THESE FOUR, NOT ALL SIX. `/health` opens one upstream
      // connection per station it is asked about, so an unnarrowed probe made
      // every page load and every harness run cost the broadcaster six. That is
      // how three ERR mounts came to answer this relay 502 in 9 ms while serving
      // a laptop normally — LESSONS #50, earned a second time.
      const res = await fetch(`${BASE}/health?only=${STATIONS.map(([, id]) => id).join(',')}`,
        { signal: ac.signal, cache: 'no-store' });
      clearTimeout(t);
      if (res.ok) {
        const j = await res.json();
        // ⚠️ `=== true`, not truthy. A missing station must read as "we did not
        // get an answer about it", never as up.
        if (j && j.stations) answers = STATIONS.map(([, id]) => j.stations[id]?.up === true);
      }
    } catch { /* fall through to the probes */ }
    if (!answers) {
      d.log('the relay has no health route — probing the mounts directly');
      answers = await Promise.all(STATIONS.map(([, id]) => probeStation(id)));
    }
    STATIONS.forEach(([, id], i) => avail.set(id, answers[i]));
    const up = STATIONS.filter(([, id]) => avail.get(id));
    dead = up.length === 0;
    if (dead) {
      d.log('neither station is answering — there is nothing to play', 'bad');
    } else if (station !== PREFERRED_ID && avail.get(PREFERRED_ID)) {
      // The upgrade: the page is named after this station, so if it is there,
      // that is what it should be playing.
      switchTo(PREFERRED_ID, 'it is on air');
    } else if (!avail.get(station)) {
      switchTo(up[0][1], `${nameOf(station)} is not answering`);
    } else {
      d.log(`${nameOf(station)} is up${up.length > 1 ? ', and so is the other' : ''}`);
    }
    paintStations();
    return !dead;
  }

  // 🔴 AND AN OUTCOME-GATED FALLBACK BESIDE THE PROBE, because a probe is a
  // statement about one moment. A station that answers at load and stops two
  // minutes later is the ordinary case for a volunteer mount, and the element
  // failing IS the evidence — no polling, no second opinion needed. The probe
  // prevents a dead start; this catches a death in progress.
  audio.addEventListener('error', () => {
    ship(`element error code=${audio.error ? audio.error.code : '?'} on ${station}`);
    if (!started || dead) return;
    avail.set(station, false);
    const alt = STATIONS.find(([, id]) => id !== station && avail.get(id) !== false);
    if (alt) { switchTo(alt[1], 'it stopped answering'); return; }
    dead = true;
    d.log(`${nameOf(station)} stopped and there is nowhere to fall back to`, 'bad');
    paintStations();
  });

  // Asked once, at load, so the page is already telling the truth about what it
  // can play before anybody reaches for the transport.
  const resolved = resolveStations();

  /**
   * 🔴 AND THEN KEPT UNDER WATCH, BECAUSE THIS STATION COMES AND GOES.
   * Radio 1965 is one volunteer-run Icecast mount and it drops out for minutes
   * at a time — MEASURED four times in one afternoon, `origin 520` and back
   * again with nothing in between. A page that asks once at load is right for
   * about a minute and then confidently wrong: the button stays greyed after the
   * station returns, and the only way to find out is to reload.
   *
   * ⚠️ IT DOES NOT SWITCH YOU. Asked for in as many words — *"do not switch
   * channels if I do not"* — so a station coming back UNGREYS its button and
   * says so in the log, and that is all. The one automatic switch this page
   * makes is the fallback at load, when the preferred station has nothing to
   * play; moving somebody mid-listen is a different thing entirely.
   *
   * ⚠️ `/health` ANSWERS 200 WHATEVER IT FINDS, so polling it costs no console
   * errors and no failed requests — which is exactly why that route exists. A
   * poll built on fetching the mount would paint a red line every 30 s.
   */
  // ⚠️ SIXTY SECONDS, NOT THIRTY. Each poll is one upstream connection per
  // station, and the list just went from two to four — halving the rate keeps
  // the cost where it was rather than doubling it because a feature was added.
  const WATCH_MS = 60000;
  setInterval(async () => {
    if (document.hidden) return;       // a backgrounded tab is nobody watching
    let answers = null;
    try {
      const res = await fetch(`${BASE}/health?only=${STATIONS.map(([, id]) => id).join(',')}`,
        { cache: 'no-store' });
      if (!res.ok) return;
      const j = await res.json();
      if (!j?.stations) return;
      answers = STATIONS.map(([, id]) => j.stations[id]?.up === true);
    } catch { return; }
    STATIONS.forEach(([, id], i) => {
      const was = avail.get(id);
      avail.set(id, answers[i]);
      if (was === answers[i]) return;
      d.log(answers[i]
        ? `${nameOf(id)} is back — its button works again`
        : `${nameOf(id)} stopped answering`, answers[i] ? 'hi' : 'bad');
      ship(`${id} ${was} -> ${answers[i]}`);
    });
    // Everything down while we were listening is the one case that DOES change
    // what the page can do, rather than merely what a button offers.
    const anyUp = STATIONS.some(([, id]) => avail.get(id));
    if (!anyUp && !dead) { dead = true; d.log('every station stopped answering', 'bad'); }
    else if (anyUp && dead) { dead = false; d.log('a station is answering again'); }
    paintStations();
  }, WATCH_MS);

  let rmsPeak = 0;
  function meterTick() {
    if (!analyser) return;
    const buf = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    const rms = Math.sqrt(sum / buf.length);
    if (rms > rmsPeak) rmsPeak = rms;
    // ⚠️ NO COLOUR. The wave was briefly tinted by spectral centroid — hue for
    // where the energy sat — and it was asked to be reverted twice. The
    // reasoning is kept on the dead branch in `grain-scope.mjs` rather than
    // here; what this page draws is the plain wave it drew before.
    scope.feed(buf, ctx.sampleRate);
    // ⚠️ THE LEVEL IS MEASURED AND NOT DISPLAYED. It was a `loudness` cell and
    // it rewrote itself sixty times a second — a number nobody can read, which
    // is the readout version of the caption that reflowed under `grain-scope`.
    // `rmsPeak` still feeds the assert that catches a tainted graph; what the
    // cell shows now is BEHIND, below, which changes when something happens
    // rather than on a clock.
    requestAnimationFrame(meterTick);
  }

  // ── the measurement ────────────────────────────────────────────────────────
  // A SECOND connection, on purpose: this one is read as BYTES, which is what
  // the relay's CORS makes possible and is the only way to see the rate, the
  // gaps and the station's own text channel.
  const rec = { status: 0, bytes: 0, headers: {}, slots: 0, filled: 0, gaps: [], marks: [] };

  async function measure(signal) {
    const t = performance.now();
    const res = await fetch(`${srcOf(station)}?bytes=${2 << 20}`,
      { signal, cache: 'no-store', headers: { 'Icy-MetaData': '1' } });
    rec.status = res.status;
    for (const k of ['icy-name', 'icy-metaint', 'content-type', 'x-shout-ttfb']) {
      const v = res.headers.get(k);
      if (v) rec.headers[k] = v;
    }
    if (rec.headers['icy-name']) {
      d.log(`icy-name "${rec.headers['icy-name']}" — readable only because the relay exposes it`);
    }
    const eat = icyDemuxer(Number(rec.headers['icy-metaint'] || 0), {
      onSlot: () => { rec.slots++; },
      onMeta: () => { rec.filled++; },
      onTitle: (title) => { nowEl.textContent = title; d.log(`now playing: ${title}`, 'hi'); },
    });

    const reader = res.body.getReader();
    const start = performance.now();
    let last = start;
    while (performance.now() - start < MEASURE_MS) {
      const { value, done } = await reader.read();
      if (done) break;
      const nowT = performance.now();
      rec.gaps.push(nowT - last);
      last = nowT;
      rec.bytes += value.length;
      rec.marks.push([rec.bytes, nowT]);
      eat(value);
    }
    try { await reader.cancel(); } catch { /* the stream never ends; hanging up is normal */ }
    const secs = (performance.now() - start) / 1000;
    rec.kbps = (rec.bytes * 8) / 1000 / secs;
    // 🔴 MEAN BITRATE OVER A SHORT WINDOW IS THE BURST, NOT THE STREAM.
    // Icecast hands a new listener ~64 KiB faster than realtime to prime their
    // buffer, so the first reading of a 128 kbps station is comfortably in the
    // 180s — MEASURED HERE at 185 before this was fixed, and `shout` reads 195
    // over seven seconds for the identical reason. The rate worth asserting on
    // is the one after the burst has landed: everything from 40 % of the
    // window onwards. The whole-window mean stays in `rec.kbps` because the
    // difference between the two IS the burst.
    const cut = start + (performance.now() - start) * 0.4;
    const from = rec.marks.find((mk) => mk[1] >= cut);
    const end = rec.marks.at(-1);
    rec.steadyKbps = from && end && end[1] > from[1]
      ? ((end[0] - from[0]) * 8) / 1000 / ((end[1] - from[1]) / 1000)
      : null;
    rec.burstS = rec.bytes / ((NOMINAL_KBPS * 1000) / 8) - secs;
    rec.ttfbMs = start - t;
    rec.gapMax = rec.gaps.length ? Math.max(...rec.gaps) : 0;
    return rec;
  }

  // ── starting ───────────────────────────────────────────────────────────────
  // Called from the bar's own click, which is the only moment a browser will
  // accept `play()` on a fresh element.
  function startListening() {
    if (started) return;
    started = true;
    d.log(`relay ${srcOf(station)}`);
    // 🔴 THE SOURCE MUST EXIST BEFORE THE GRAPH CAPTURES IT — WEBKIT.
    // `graph()` calls `createMediaElementSource(audio)`, and this line used to
    // run TWO LINES AFTER it, so the capture was made against an element with no
    // `src` at all. Chrome does not care and binds later. WebKit binds at
    // creation: the element then plays STRAIGHT TO THE SPEAKERS and the graph
    // gets silence for ever.
    //
    // ⚠️ AND THAT FAILS IN THE SHAPE THIS REPO MINDS MOST — it sounds like it is
    // working. REPORTED from Safari: *"I hear sound but no granulator, also no
    // waveform"*, and on an iPhone `WebAudio can see the samples — peak rms
    // 0.0000` beside grain ticks still drawing, because scsynth's worklet was
    // running perfectly on a bus nothing fed. Sound out of the speakers is not
    // evidence that the page can hear it: if the capture had worked, the only
    // route to the speakers would be `dry`, which is inside the graph.
    // ⚠️ It also silently breaks the fader, since `dry.gain` then controls
    // nothing and the station stays at full volume at every setting.
    graph();
    if (!DECODE) audio.src = srcOf(station);
    // NEVER LET SOUND GATE THE WORK: neither of these rejects when a gesture is
    // missing, so awaiting them is a hang rather than an error. Fire and move on.
    ctx.resume?.();
    if (!DECODE) audio.play().catch((e) => d.log(`play refused (${e.name}) — the measurement continues`, 'bad'));
    // ?report=1 only, and exactly once — the deafness control for this page's own
    // analyser. See the guard inside it for what happened when it was not once.
    if (REPORTING) setTimeout(() => { proveAnalyser(); }, 3000);
    requestAnimationFrame(meterTick);

    audio.addEventListener('playing', () => {
      if (heardFrom == null) heardFrom = Date.now();
      // ⚠️ PUT THE LINE WHERE THE SOUND IS, AND START IT. Without these two the
      // playhead sits wherever it was last left — and the harness leaves it
      // paused and seeked backwards, because it exercises the transport before
      // pressing anything. MEASURED: the line read 95.5 s BEHIND the audio.
      deck.seek(heardFrom);
      deck.play();
      // The element's own clock is the master from here: the deck's position is
      // where the AUDIO has got to, never where a timer thinks it should be.
      if (!master) master = mediaMaster(deck, () => ({ el: audio, key: 'radio', pos: heardFrom + audio.currentTime * 1000 }));
    }, { once: true });

    // ⚠️ THE MEASUREMENT IS KEPT, NOT ASSERTED HERE. Everything this page checks
    // goes out in ONE burst from `finish()`, because the granulator's checks
    // arrive several seconds later than the radio's and `verify.mjs` stops
    // collecting 400 ms after the count last grew. MEASURED: with the radio
    // asserting on its own, the run read `10` and the five granulator checks
    // were silently dropped — a page reporting less than it knows, which is the
    // failure mode this repo minds most.
    // 🔴 THE GRANULATOR COMES UP WITH THE SOUND, DRY. There is no button to
    // press because there is nothing to decide: this page is a radio station
    // going into a SuperCollider graph, and the fader is how much of that
    // reaches you. `synthPending` is set SYNCHRONOUSLY, before any await, or the
    // 6 s fallback below latches `done` first and the granulator's five asserts
    // are dropped from the run — which is how this page twice reported ten
    // checks and looked green both times.
    //
    // ⚠️ NOT AWAITED, AND THE CATCH IS THE POINT. An engine that refuses has to
    // leave a working radio behind; `finish()` then runs from the fallback and
    // reports the radio's half alone rather than nothing at all.
    // ⚠️ AND IT WAITS FOR THE STATIONS TO ANSWER FIRST. Booting 1.7 MB of wasm
    // to granulate a stream that is not there is work nobody asked for, and the
    // sliders it would raise are controls over nothing.
    synthPending = true;
    resolved.then((any) => {
      if (!any) { synthPending = false; finish(); return null; }
      return startGranulator();
    }).catch((e) => {
      synthPending = false;
      d.log(`the granulator did not start: ${e.message} — the radio plays on`, 'bad');
    });

    measured = measure().catch((e) => { d.log(`measure failed: ${e.message}`, 'bad'); return null; });
    // If nobody presses Synthesize, the radio still has to say what it found.
    // ⚠️ BUT IT MUST NOT RACE THE GRANULATOR. This fallback fires ~6 s after the
    // listen starts; a Synthesize press takes longer than that to boot an
    // engine, load a definition and measure a level, so without the flag the
    // fallback latched `done` first and the five granulator checks were dropped
    // — the run read 10 asserts twice in a row and looked green both times.
    measured.then(() => setTimeout(() => { if (!synthPending) finish(); }, 1200));
  }

  /**
   * 🔴 EVERY ASSERT IN ONE BURST, AND THAT IS THE HARNESS'S SHAPE RATHER THAN A
   * PREFERENCE. `verify.mjs` waits for the FIRST assert for as long as
   * `settleMs` allows (12 s here), then stops 400 ms after the count last GREW,
   * capped at twelve such windows. So checks spread across a six-second listen
   * are checks the suite stops collecting at the first quiet gap: the page reads
   * as asserting four things and nobody is told the rest were dropped. Do the
   * slow work, then say everything at once.
   */
  async function finish() {
    if (done) return;
    done = true;
    // Report the whole verdict list when this burst is over — the same array
    // `verify.mjs` reads, so a phone and a laptop are answering one question.
    if (REPORTING) {
      queueMicrotask(() => setTimeout(() => {
        for (const a of (d.asserts || window.__demo?.asserts || [])) {
          ship(`${a.pass ? 'ok  ' : 'FAIL'} ${a.label} — ${a.detail}`);
        }
        ship('--- end of run ---');
      }, 1500));
    }
    const m = await measured;
    if (!m) { d.assert('the relay answered', false, 'the measurement never completed'); return; }

    // ⚠️ MAKE SURE IT IS ACTUALLY PLAYING BEFORE ASKING WHETHER IT PLAYS.
    // The page follows the transport now, and `verify.mjs` exercises the
    // transport before anything else — click to play, click to pause, then a
    // keyboard seek — so it hands over a deck that is PAUSED, and the mirror
    // below dutifully keeps the radio paused with it. The first run after the
    // Listen button was removed read `t=0.00s`, `peak rms 0.0000` and
    // `heardFrom null`: three failures that were all one fact, and the fact was
    // correct behaviour. So press play here, and WAIT FOR THE ELEMENT rather
    // than sleeping a guess at it.
    deck.play();
    for (let i = 0; i < 30 && !(played() > 0 && isPlaying()); i++) {
      await new Promise((r) => setTimeout(r, 100));
    }

    // 🔴 THE TRANSPORT MUST BE ABLE TO STOP THE SOUND, AND IT COULD NOT.
    // Found by pressing pause on the page, not by a check: the bar stopped the
    // playhead and the radio played on, because `mediaMaster` runs ONE WAY —
    // its own doc says *"a paused/ended master pauses the deck, and a running
    // one resumes it"*, so the element drove the deck and nothing drove the
    // element. Tested here, BEFORE anything is asserted, because the answer
    // takes 1.4 s and an assert arriving 1.4 s after the others is an assert
    // the stabiliser has already stopped collecting.
    const { wasPlaying, stopped } = T;

    d.set('kbps', Math.round(m.steadyKbps ?? m.kbps));
    // ⚠️ `gap` LOST ITS CELL AND KEPT ITS FACTS. It is measured once over one
    // five-second read and never moves again, so as a readout it was a constant
    // teaching the reader to ignore the row. It is still asserted below and it
    // is still in the log line, where a one-off measurement belongs.
    d.log(`${Math.round(m.bytes / 1024)} KiB · ${Math.round(m.steadyKbps ?? 0)} kbps steady `
      + `(${Math.round(m.kbps)} over the whole window — the difference is Icecast's burst, `
      + `${m.burstS.toFixed(1)} s handed over faster than realtime)`);

    d.assert('the relay answered', m.status === 200, `HTTP ${m.status || '—'}`);
    d.assert('the page could read the bytes (CORS)', m.bytes > 0,
      `${(m.bytes / 1024).toFixed(0)} KiB in ${(MEASURE_MS / 1000).toFixed(0)} s`);
    d.assert('the station named itself', !!m.headers['icy-name'],
      m.headers['icy-name'] || 'absent');
    d.assert('the in-band text channel is alive', m.slots > 0,
      `${m.slots} slots, ${m.filled} carried text`);
    d.assert('settled rate is the station\'s', m.steadyKbps != null
      && Math.abs(m.steadyKbps - NOMINAL_KBPS) < NOMINAL_KBPS * 0.2,
      `${Math.round(m.steadyKbps ?? 0)} vs ${NOMINAL_KBPS} kbps nominal, after the burst`);
    d.assert('no gap past a 1 s buffer', m.gapMax < 1000,
      `worst ${Math.round(m.gapMax)} ms over ${m.gaps.length} reads`);
    d.assert(DECODE ? 'the page decoded the stream itself' : 'the element played',
      played() > 0,
      DECODE ? `${played().toFixed(1)} s via ${decodePath || 'nothing'}`
             : `t=${played().toFixed(2)}s`);
    // 🔴 THE ONE THAT CATCHES THE TAINTED GRAPH. A cross-origin element with no
    // CORS plays out of the speakers and feeds SILENCE to WebAudio, so every
    // other assert here passes while the graph is dead.
    d.assert('WebAudio can see the samples', rmsPeak > 0.0005, `peak rms ${rmsPeak.toFixed(4)}`);
    // ⚠️ `deck.position` IS A FUNCTION — `position: () => transport.position()`.
    // Read as a property it is the function object, which compares false against
    // every number and formats as `Invalid Date`.
    const head = deck.position();
    d.assert('the line follows the audio', Number.isFinite(head) && heardFrom != null && head >= heardFrom,
      Number.isFinite(head) && heardFrom != null
        ? `playhead ${new Date(head).toTimeString().slice(0, 8)}, ${((head - heardFrom) / 1000).toFixed(1)} s in`
        : `playhead ${String(head)}, heardFrom ${String(heardFrom)}`);
    d.assert('the transport can stop the stream', !wasPlaying || stopped,
      wasPlaying
        ? (stopped ? 'pause on the bar paused the audio too'
                   : 'the bar paused the line and the radio played on')
        : 'nothing was playing to stop');


    // ── and the granulator, in the SAME burst, when it was asked for ────────
    if (!eng) return;
    d.assert('SuperCollider is running in this tab', eng.bootMs > 0,
      `up in ${Math.round(eng.bootMs)} ms, ${eng.ctx.sampleRate} Hz`);
    d.assert('the board\'s own compiled graph loaded', !!G.def?.ok,
      G.def?.ok ? `${G.def.bytes} B of SynthDef taken in ${G.def.ms} ms` : (G.def?.why ?? 'never fetched'));
    d.assert('the granulator is running', G.running,
      G.running ? `node ${PAPPUS_NODE}, reading busses 2 and 3` : 'the engine refused /s_new');
    d.assert('the engine reports the grains it fires', G.grains > 0,
      `${G.grains} reported in ${G.secs.toFixed(1)} s`);
    // 🔴 THE CHORD'S OWN WITNESS, AND IT IS AN ARITHMETIC PREDICTION RATHER THAN
    // A LEVEL. `report` fires once per GATED voice per trigger — graded against
    // the board at 8.00 / 4.00 / 15.99 for `mrate` 8 / 4 / 16 (research §10.6) —
    // so opening four voices at `mrate` 8 MUST read about 32 a second, not 8.
    // A level measurement could not tell four voices from one turned up.
    // ⚠️ This is also the check that catches `setParam` sending a scalar: with
    // one wrong message seven voices stay shut and the rate stays at `mrate`.
    // 🔴 THE WHOLE PATCH, ASKED OF THE ENGINE RATHER THAN READ BACK OFF THIS
    // PAGE. Every `/n_set` here is fire-and-forget, so `PATCHES[patch]` proves
    // nothing about what scsynth holds — and a patch is forty messages, any one
    // of which could name a control this definition does not have and be
    // discarded in silence. Twelve of them are read back with `/s_get`: they
    // span the granulator, the euclidean divider and two chain stages that this
    // page had never sent a value to at all.
    const p = G.patch;
    // ⚠️ DECLARED BEFORE THE FIRST ASSERT THAT USES IT. It reads like a helper
    // that belongs beside the array check below; put there, the patch-differs
    // assert above reaches it in its temporal dead zone, which is a ReferenceError
    // mid-burst — every assert after it silently dropped, which is this page's
    // named failure mode.
    const same = (a, b) => Array.isArray(a) && Array.isArray(b) && a.length === b.length
      && a.every((x, i) => Math.abs(x - b[i]) < 1e-3);
    d.assert('the patch that is playing reached the engine',
      !!p && Array.isArray(G.wrong) && G.wrong.length === 0,
      p ? (G.wrong?.length ? `${p.name}: ${G.wrong.join('; ')}`
                           : `${p.name}: all ${G.scalars ? Object.keys(G.scalars).length : 0} settings read back as asked`)
        : 'no patch was applied');

    // 🔴 AND A SECOND PATCH, THROUGH THE REAL `›` BUTTON. A check that only ever
    // grades the patch the page opens on is a check that would pass with the
    // other five deleted — and `verify.mjs` cannot press this row itself. Both
    // halves have to be true: the next patch's settings must arrive, AND they
    // must differ from this one's, or a picker wired to nothing passes.
    const nextP = G.otherWant;
    const near = (a, b) => Math.abs(a - b) < Math.max(0.01, Math.abs(b) * 0.02);
    const differs = !!nextP && !!p
      && (nextP.scanmode !== p.scanmode || nextP.elen !== p.elen
        || !near(nextP.rate, p.rate) || !near(nextP.size, p.size));
    const arrived = !!nextP && G.otherMode === nextP.scanmode && G.otherElen === nextP.elen
      && near(G.otherRate, nextP.rate) && near(G.otherSize, nextP.size)
      && same(G.otherPattern, patternOf(nextP));
    d.assert('the next sound along reaches the engine, and it differs',
      differs && arrived && G.here === PATCHES.indexOf(p),
      nextP && p
        ? `${p.name} → ${nextP.name} → ${p.name}; asked mode ${nextP.scanmode} `
          + `rate ${nextP.rate} size ${nextP.size}, the engine held ${G.otherMode} `
          + `${G.otherRate} ${G.otherSize}, against ${p.scanmode} ${p.rate} ${p.size} here`
          + `${same(G.otherPattern, patternOf(nextP)) ? '' : ' — and its rhythm did not arrive'}`
        : 'the picker was never exercised');

    // 🔴 THE THREE MESSAGES THAT CANNOT BE CHECKED BY A SCALAR READ. `gates`,
    // `pitches` and `probs` are eight-element controls and `setParam` sends
    // `/n_setn` only for an Array (`pappus.mjs:125`) — one scalar by mistake
    // writes voice 0 and leaves seven voices holding whatever they held, which
    // is a page that goes on working and sounds like one note. The sixteen-step
    // rhythm is not a control at all but a BUFFER the graph indexes (`:802`), so
    // it takes a third kind of message and fails in a third way: written and
    // never read, or read and never written.
    d.assert('the chord and its rhythm reached the engine',
      !!p && same(G.gates, p.gates) && same(G.pitches, p.pitches)
        && same(G.probs, p.probs) && same(G.pattern, patternOf(p)),
      p ? `gates ${G.gates ?? '—'} · notes ${G.pitches ?? '—'} · ${liveSteps(p)} of `
          + `${p.elen} step(s) open${same(G.pattern, patternOf(p)) ? '' : ` — the buffer holds ${G.pattern ?? 'nothing'}`}`
        : 'no patch was applied');

    // 🔴 AND WHAT THAT CHORD AND THAT RHYTHM MUST SOUND LIKE, AS ARITHMETIC
    // RATHER THAN AS A LEVEL. `report` fires once per GATED voice per trigger —
    // graded against the board at 8.00 / 4.00 / 15.99 for `mrate` 8 / 4 / 16
    // (research §10.6) — so the rate is `mrate × Σ(gates·probs) × open steps /
    // melen`, and nothing else. A level measurement could not tell four voices
    // from one turned up, and a grain COUNT alone cannot tell a rhythm that is
    // being read from sixteen numbers sitting in a buffer nothing indexes: at
    // `melen 1` only slot 0 is ever read, which is the same sound and a
    // different number here.
    const want = p ? predictedRate(p, P.rate) : NaN;
    const got = Number(lastRate);
    d.assert('every note in the chord is its own grain voice',
      Number.isFinite(got) && Number.isFinite(want)
        && Math.abs(got - want) <= Math.max(2, want * 0.3),
      `${got}/s measured, ${want.toFixed(1)}/s expected — `
        + `${p ? p.gates.filter((g) => g > 0.001).length : 0} voice(s) at ${P.rate}/s`
        + (p && p.elen > 1 ? `, ${liveSteps(p)} step(s) of ${p.elen}` : ''));
    d.log(`${p ? p.name : 'the granulator'} costs ${G.glitchBefore == null ? 'an unreported number of'
      : G.glitchAfter - G.glitchBefore} dropout(s) over ${G.secs.toFixed(1)} s`);
    // 🔴 THE ONE THAT MATTERS: the radio is audibly IN the graph. A grain count
    // cannot say this — measured, a Pappus with its input disconnected fired
    // 4-5 grains per window while outputting exactly 0.00000 — and a running
    // synth cannot say it either.
    d.assert('the radio reaches the granulator and is heard', G.loud > 0.0005 && G.quiet < G.loud / 4,
      `${G.loud.toFixed(4)} running, ${G.quiet.toFixed(4)} with the node paused`);

    // 🔴 THE TWO THAT WOULD HAVE CAUGHT A PICTURE WITH NOTHING IN IT, and until
    // this change there were none: every assert on this page graded the relay,
    // the engine, a level or a COUNT, and not one of them could tell a working
    // grain picture from one whose every tick was drawn off the canvas. That is
    // `/floor/`'s lesson arriving here — an instrument that grades everything
    // beside the thing being claimed.
    //
    // FIRST, THE DECODE. A reported position is a fraction of the capture ring,
    // so it is in 0..1 by construction; anything outside it is this page reading
    // the wrong field of the message rather than the engine behaving oddly. With
    // the old `m[2]` both ends of this read exactly −1.
    d.assert('every grain says where in the sound it read',
      Number.isFinite(posMin) && posMin >= 0 && posMax <= 1,
      Number.isFinite(posMin) ? `positions ${posMin.toFixed(4)}..${posMax.toFixed(4)} of the ring`
                              : 'no grain was ever reported');
    // SECOND, THE INK AND THE FADER, in one pair of numbers with the negative
    // control built in. Nothing should be lit at the dry end and something must
    // be lit at the wet end; a probe that reads the same at both is measuring
    // neither.
    d.assert('the grain ticks are drawn, and the fader fades them',
      G.inkWet > 20 && G.inkDry * 4 < G.inkWet,
      `${G.inkDry} lit all-radio, ${G.inkWet} lit all-granulator, ${G.alive} ticks alive`);

    // 🔴 AND THE STATION BUTTONS, WHICH NOTHING ELSE CAN REACH. `verify.mjs`
    // presses `.pos-controls button, .tbar-x` and this row is neither, so
    // shipping it without a check here would be two controls nobody grades —
    // exactly how `mirror` lost two asserts while reading green.
    //
    // ⚠️ A REAL CLICK ON THE ELEMENT, NEVER `picker.set()`. The fault this kind
    // of check exists to catch lives in the wiring between the button and the
    // handler, and calling the handler steps straight over it (`/floor/` spent
    // five rounds on that). Last of all, because it restarts the audio.
    // 🔴 AND IT PUTS THE STATION BACK. The first version clicked the other
    // button and stopped there, so a page that checks itself ENDED ON A STATION
    // NOBODY CHOSE — reported from a phone, where the log read `Klassikaraadio
    // — you chose it` and the reader had chosen nothing. A self-check is not
    // allowed to leave the instrument somewhere else; it restores through
    // another real click, so the restore is exercised by the same path.
    const here = STATIONS.findIndex(([, id]) => id === station);
    const other = here === 0 ? 1 : 0;

    // The station A/B ran HERE and now runs early — see `checkStationButtons`.
    d.assert(S.label, S.pass, S.detail);
  }


  // ── the granulator ─────────────────────────────────────────────────────────
  // 🔴 REAL SUPERCOLLIDER, EATING A REAL RADIO STATION. `Engine_Pappus.sc:518`
  // is `in = LeakDC.ar([In.ar(inbusl, 1), In.ar(inbusr, 1)])` — Pappus does not
  // generate, it granulates whatever is ON A BUS. On the Raspberry Pi that bus
  // is filled by JACK; `/grains/` fills it from inside scsynth with a second
  // definition, because nothing in a browser filled it. This page fills it with
  // a radio station: `bootScsynth`'s `input` connects the page's audio to
  // scsynth's hardware input busses, 2 and 3, which is exactly the `inbusl 2
  // inbusr 3` the board uses. MEASURED level-preserving and with zero engine
  // delay — research/scsynth-live-input-2026-09.md.
  /**
   * A reported grain position, moved onto the axis the picture is drawn on.
   *
   * Pappus records into a `RING_SECONDS` ring and reads grains out of a window
   * `mbuflen` seconds long, and `/pgrain`'s `pos` is a fraction of the RING —
   * see the note on `RING_SECONDS` in `pappus.mjs` for the line in the engine
   * that makes it so. This is the same rescale `/grains/` calls `winPos`, and it
   * is written from the two constants rather than from the 7.5 they currently
   * multiply out to: a number typed once can be read, a number typed twice can
   * disagree with the buffer it describes.
   */
  const winPos = (p) => Math.min(1, Math.max(0, (p ?? 0) * RING_SECONDS / BUF_SECONDS));

  // The raw reported extremes, kept for the assert that catches a decode that
  // has slipped — a position outside 0..1 is not a granulator reading oddly, it
  // is this page reading the wrong field.
  let posMin = Infinity, posMax = -Infinity;

  /**
   * 🔴 A CHORD OUT OF THE STATION — `plan-radio-sound.md` ①.
   *
   * Pappus has EIGHT grain voices, each with its own gate and its own pitch in
   * semitones (`Engine_Pappus.sc:403-404`). `base = pitches[i]` at `:851` goes
   * straight into `2 ** (base/12)` as the read speed of that voice's `GrainBuf`
   * at `:871`, so every open voice reads the same held second of radio at a
   * different speed: the station arrives as a chord of itself.
   *
   * ⚠️ ALL INSIDE `mkgrain`, WHICH EVERY RUNG BUILDS — so unlike most of that
   * plan this survives TINY, where the resonator, the shimmer and the second
   * granulator are compiled out and their controls are inert.
   *
   * ⚠️ ONLY `gates`/`pitches`, NOT `gates2`/`pitches2`. The second granulator is
