<!doctype html>
<meta charset="utf-8">
<title>mirror — positron</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0 0 14px; }
  @media (max-width: 720px) { .panes { grid-template-columns: 1fr; } }
  .pane { position: relative; background: var(--card2); border-radius: 8px; overflow: hidden; }
  .pane canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: #000; }
  .pane .lab {
    position: absolute; left: 8px; top: 8px; z-index: 2;
    font: 400 11px/1.5 var(--mono); color: var(--dim);
    background: color-mix(in oklab, var(--card2) 80%, transparent);
    padding: 2px 7px; border-radius: 4px;
  }
  .pane .lab b { color: var(--hi); font-weight: 400; }
  .pane .none {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    font: 400 12px/1.7 var(--mono); color: var(--dim); padding: 18px;
  }
  /* The bar belongs to its pane, so the numbers sit with the ink they describe
     rather than in a table somewhere else — which is what makes a legend
     necessary. */
  .bar {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 9px; background: var(--card2); border-top: 1px solid var(--line);
    font: 400 11px/1.5 var(--mono); color: var(--dim);
  }
  .bar .n { color: var(--fg); }
  .bar .sp { margin-left: auto; }
  .bar button {
    font: 400 11px/1 var(--mono); color: var(--dim);
    background: transparent; border: 1px solid var(--line); border-radius: 4px;
    padding: 4px 8px; cursor: pointer;
  }
  .bar button:hover { color: var(--fg); border-color: var(--dim); }
  .bar button.ico { font-size: 14px; line-height: 1; padding: 3px 8px; }
  /* One row, two groups. They sit ABOVE both pictures because they change both
     — a control that belongs to one pane goes in that pane's bar, and these do
     not. */
  .knobs { display: flex; flex-wrap: wrap; gap: 22px; align-items: center; margin: 18px 0 16px; }
  .knob { display: flex; align-items: center; gap: 8px; }
  /* ⚠️ THE SAME KEY STYLE AS THE READOUT, copied from shell.css's `.d-k` rather
     than invented: these name a value the way every other label on every other
     page here names one, and a second convention for the same job is how a set
     of pages stops looking like one thing. */
  .knob > span {
    font: 500 9.5px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase;
    color: var(--dim2);
  }
  .knob .seg { display: flex; gap: -1px; }
  .knob button {
    font: 400 11px/1 var(--mono); color: var(--dim);
    background: transparent; border: 1px solid var(--line);
    padding: 5px 10px; cursor: pointer;
  }
  .knob button:first-of-type { border-radius: 4px 0 0 4px; }
  .knob button:last-of-type { border-radius: 0 4px 4px 0; }
  /* ⚠️ OVERLAP, DO NOT DROP THE BORDER. The segmented look used
     `border-left: none` on every button after the first, which is fine while
     the chosen state is a FILL and wrong the moment it is a border: the chosen
     pill would be missing its left edge and read as half-drawn. A -1px margin
     puts the two borders on the same pixel, and z-index decides which is on
     top — which is the chosen one. */
  .knob button + button { margin-left: -1px; }
  .knob button[aria-pressed="true"] {
    color: var(--hi); border-color: var(--hi); background: transparent;
    position: relative; z-index: 1;
  }
  /* ⚠️ Focus is GREY here. shell.css focuses with `var(--hi)`, the same colour
     as the chosen state, so a focused-but-unchosen button read as chosen — the
     exact trap the box page already paid for. */
  .knob button:focus-visible { outline: 2px solid var(--dim); outline-offset: 1px; }
  /* ⚠️ In fullscreen the PANE is the fullscreen element, so the canvas has to be
     told to fill it — a canvas keeps its attribute size otherwise and sits in
     the middle of a black screen at 640x360. `contain`, never `cover`: this is a
     picture with a centre and cropping it is not a style choice.

     ⚠️ AND THE GRID SIZES THE ROWS, NOT A GUESSED NUMBER. This said
     `height: calc(100vh - 34px)` as well as `grid-template-rows: 1fr auto`,
     which counts the bar TWICE: the grid reserves its real height and the
     canvas then also reserves 34px of it, pushing the bar off the bottom of the
     screen. The numbers were clipped away in fullscreen — the half that says
     whether what you are looking at is arriving properly. `1fr` plus
     `min-height: 0` lets the row be exactly what is left. */
  .pane:fullscreen { background: #000; display: grid; grid-template-rows: 1fr auto; }
  .pane:fullscreen canvas {
    width: 100%; height: 100%; min-height: 0;
    object-fit: contain; aspect-ratio: auto;
  }
  .pane:fullscreen .bar { padding: 10px 14px; font-size: 12px; }
  /* ⚠️ The knob row lives ABOVE both panes, which means it is not inside the
     element that goes fullscreen — so it simply vanishes, and the picture you
     went fullscreen to look at becomes the one you cannot change. It is moved
     into the fullscreen pane's own bar instead, centred between the numbers and
     the button. */
  .bar .knobs { margin: 0 auto; gap: 18px; }
  .bar .knob button { padding: 4px 9px; }
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { format, parse, randomId, RELAY_BASE } from '/shell/wire.mjs';

  const q = new URLSearchParams(location.search);
  const ROOM = q.get('room') || 'studio-1';
  const W = 640, H = 360;

  const d = mount({
    name: 'mirror',
    what: 'The same picture drawn twice: your own machine on the left, a Raspberry Pi in another building on the right, sending its result over as video. Same shader on both sides — it is a short document, so it runs anywhere.',
    // ⚠️ NO SHELL READOUT. Every number here belongs to ONE of the two pictures,
    // so it goes in that picture's own bar rather than in a row above both —
    // joining a figure to its ink across two elements is exactly what makes a
    // legend necessary, and a single row under two panes cannot say which pane
    // it means without repeating the word every time. The machine surface is
    // `__demo.panes`, set below.
    readout: {},
    // ⚠️ NO CONTROLS. The board is asked to draw on connect and the checks run
    // themselves — see `runChecks` — because a page whose first act is asking
    // you to press something is a page that shows you nothing. That removes
    // this project's usual harness hook, so demo/verify-gl.mjs waits for
    // `__demo.ready` and reads the asserts rather than pressing buttons.
    controls: [],
  });
  guard(d);

  const panes = el('div', 'panes');
  const mk = (title) => {
    const p = el('div', 'pane');
    const c = el('canvas');
    c.width = W; c.height = H;
    const lab = el('div', 'lab');
    lab.innerHTML = title;
    // The bar under each picture: that picture's numbers, and the one control
    // that belongs to a picture rather than to the page.
    const bar = el('div', 'bar');
    const nums = el('span', 'stat', '—');
    // ⛶ U+26F6 SQUARE FOUR CORNERS — the conventional fullscreen glyph, and it
    // renders as text rather than as an emoji, so it takes the bar's colour and
    // sits on its baseline instead of arriving as a coloured picture at a size
    // of its own. `title` and `aria-label` carry the meaning for anyone the
    // glyph does not reach.
    const full = el('button', 'ico', '⛶', { type: 'button', title: 'fullscreen', 'aria-label': 'fullscreen' });
    // ⚠️ FULLSCREEN THE PANE, NOT THE CANVAS. A fullscreen canvas takes the bar
    // with it or loses it entirely, and the numbers are the half that says
    // whether what you are looking at is arriving properly.
    full.onclick = () => {
      if (document.fullscreenElement === p) document.exitFullscreen();
      else p.requestFullscreen?.().catch((e) => d.log(`fullscreen refused — ${e.message}`, 'warn'));
    };
    bar.append(nums, el('span', 'sp'), full);
    p.append(c, lab);
    const wrap = el('div', 'pane');
    wrap.style.position = 'static';
    panes.append(p);
    p.append(bar);
    return { p, c, lab, nums, full };
  };
  const local = mk('<b>here</b> — your browser');
  const far = mk('<b>the box</b> — a Raspberry Pi, over the internet');
  const farNone = el('div', 'none', 'Waiting…');
  far.p.append(farNone);
  d.el.prepend(panes);

  /**
   * ⚠️ TWO KNOBS, AND THEY DRIVE BOTH PANES. A control that moved only the
   * local picture would break the one claim this page makes — that the two
   * sides are the same shader — and would do it invisibly, because the panes
   * would simply stop matching and look like a bug. So each press sets the
   * local uniform AND sends `video.params` to the box.
   *
   * They are the two things the paragraph already names: the kaleidoscope fold
   * and the feedback. Three steps each rather than a slider, because a slider
   * here is a hundred values nobody wants and a number nobody can repeat.
   */
  // ⚠️ WIDE ENOUGH TO SEE FROM ACROSS THE ROOM. The first pair were 4/8/16
  // mirrors and three feedback amounts, and the three steps of each looked like
  // the same picture in a slightly different mood — a control whose settings a
  // viewer cannot tell apart is a control that teaches nothing. These are
  // ranges chosen so the ends are unmistakable, and the middle of each is the
  // value the renderer ships with, so "mid mid mid" is the picture the rest of
  // this repo measured.
  const KNOBS = {
    // 2 is a single fold — almost a mirror down the middle. 24 is a doily.
    mirrors: { label: 'mirrors', steps: [['2', 2], ['16', 16], ['24', 24]], at: 1 },
    // The noise frequency, which decides whether the shapes are continents or
    // filigree. An eightfold span, because a doubling is not visible here.
    grain:   { label: 'grain',   steps: [['coarse', 1.2], ['mid', 4], ['fine', 16]], at: 1 },
    // HOW FAR APART THE THREE COLOUR CHANNELS ARE. The colour is three cosines
    // of the same field, offset by vec3(0, 0.33, 0.67) — a third of a turn each,
    // which is what makes a full rainbow. Scaling those offsets is the whole
    // palette in one number: near zero the three channels move together and the
    // picture is a duotone sweep; at 1 it is the rainbow; past 1 the offsets
    // wrap and the hues come back round in a different order.
    hue:     { label: 'hue',     steps: [['close', 0.12], ['mid', 1], ['wide', 2.2]], at: 1 },
  };
  const knobRow = el('div', 'knobs');
  for (const [key, k] of Object.entries(KNOBS)) {
    const wrap = el('div', 'knob');
    wrap.append(el('span', '', k.label));
    const seg = el('div', 'seg');
    k.buttons = k.steps.map(([text, value], idx) => {
      const b = el('button', '', text, { type: 'button', 'aria-pressed': String(idx === k.at) });
      b.onclick = () => choose(key, idx);
      seg.append(b);
      return b;
    });
    wrap.append(seg);
    knobRow.append(wrap);
  }

  // ⚠️ AFTER the row is built. `const knobRow` is in the temporal dead zone
  // until its declaration runs, so inserting it earlier throws before anything
  // is drawn — and a page that throws at module scope shows a blank frame with
  // no log line to say why.
  d.el.insertBefore(knobRow, panes);

  /**
   * ⚠️ FOLLOW THE PICTURE INTO FULLSCREEN. The knobs sit above both panes,
   * which is the right place while both are on screen and the wrong place the
   * moment one of them fills it: the row is not inside the fullscreen element,
   * so it disappears and the picture you went fullscreen to look at is the one
   * you can no longer change. It moves into that pane's bar and comes back
   * afterwards.
   */
  document.addEventListener('fullscreenchange', () => {
    const fs = document.fullscreenElement;
    const pane = [local, far].find((p) => p.p === fs);
    if (pane) pane.p.querySelector('.bar').insertBefore(knobRow, pane.full);
    else d.el.insertBefore(knobRow, panes);
  });

  function choose(key, idx) {
    const k = KNOBS[key];
    k.at = idx;
    k.buttons.forEach((b, i) => b.setAttribute('aria-pressed', String(i === idx)));
    const value = k.steps[idx][1];
    // The local picture changes on the next frame; the box changes when the
    // message lands, which is a hop away. They converge, and the panes being
    // briefly different IS the latency — the same thing the lock makes visible.
    P[key] = value;
    send({ type: 'video.params', [key]: value });
    d.log(`${k.label} ${k.steps[idx][0]}`, 'hi');
  }
  // The live values, one place, read by the render loop and sent to the box.
  const P = Object.fromEntries(Object.entries(KNOBS).map(([k, v]) => [k, v.steps[v.at][1]]));
  // Exposed so a harness can sweep the ranges without pressing nine buttons.
  window.__P = P;

  /**
   * Each pane's own numbers, under it.
   *
   * ⚠️ AND `__demo.panes` IS THE MACHINE COPY, written from the same values in
   * the same call — two places that can disagree is how a readout ends up
   * describing something the page is not doing.
   */
  window.__demo.panes = { here: {}, box: {} };
  // ⚠️ EVERY FIELD IS ALWAYS DRAWN, EVEN BEFORE IT HAS A VALUE. Building the bar
  // from only the fields that happen to be known means the renderer name starts
  // at the left edge and JUMPS right the moment the first frame rate lands — a
  // second of text moving for no reason the reader can see. A dash holds the
  // place instead, which is also honest: it says "not yet", where an absent
  // field says nothing at all.
  const FIELDS = {
    here: [['fps', 'fps', (v) => v.toFixed(1)], ['note', '', (v) => v]],
    box: [['fps', 'fps', (v) => v.toFixed(1)], ['kbit', 'kbit/s', (v) => v.toFixed(0)],
          ['lost', 'lost', (v) => String(v)], ['note', '', (v) => v]],
  };
  function stat(which, fields) {
    const pane = which === 'here' ? local : far;
    Object.assign(window.__demo.panes[which], fields);
    const v = window.__demo.panes[which];
    pane.nums.innerHTML = FIELDS[which].map(([key, unit, fmt]) => {
      // `note` is the only field with nothing to hold a place for — it is a
      // name, not a measurement, and an empty one should take no room.
      if (key === 'note') return v.note ? `<span class="dim">${v.note}</span>` : '';
      const shown = v[key] == null ? '—' : fmt(v[key]);
      return `<span class="n">${shown}</span>${unit ? ' ' + unit : ''}`;
    }).filter(Boolean).join(' · ');
  }

  // ── the picture, here ────────────────────────────────────────────────────
  //
  // ⚠️ THIS IS THE SAME SHADER AS rig/vis/v3dpipe.c, PORTED RATHER THAN
  // REWRITTEN — and the port is three lines of difference, which is itself the
  // argument the page is making. The board runs `#version 310 es` because it
  // has GLES 3.1; WebGL2 is GLSL ES 3.00, and nothing in the fragment shader
  // needs 3.10. Everything else — gl_VertexID, `out vec4`, texture(), highp —
  // is unchanged.
  //
  // ⚠️ AND `uT` IS A FRAME COUNTER, NOT A CLOCK. The C drives it as i/30.0. If
  // this drove it from wall time the two panes would be the same shader making
  // visibly different motion, and the page's whole claim would read as false
  // while both halves were working.
  const VS = `#version 300 es
    void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
      gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;
  const FS = `#version 300 es
    precision highp float;
    uniform float uT; uniform vec2 uRes; uniform sampler2D uPrev;
    uniform float uSeg; uniform float uFb; uniform float uScale; uniform float uWarp; uniform float uHue;
    out vec4 o;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(h(i), h(i + vec2(1,0)), f.x), mix(h(i + vec2(0,1)), h(i + vec2(1,1)), f.x), f.y); }
    void main(){
      vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
      float a = atan(uv.y, uv.x), r = length(uv), seg = 6.2831853 / uSeg;
      a = abs(mod(a + 0.5 * seg, seg) - 0.5 * seg);
      vec2 k = vec2(cos(a), sin(a)) * r;
      float w = n(k * uScale + uT * 0.3) + 0.5 * n(k * uScale * 2.0 - uT * 0.2) + 0.25 * n(k * uScale * 4.0 + uT * 0.5);
      vec2 dd = k + uWarp * vec2(cos(w * 6.2831), sin(w * 6.2831));
      vec3 c = 0.5 + 0.5 * cos(6.2831 * (w + vec3(0.0, 0.33, 0.67) * uHue) + uT);
      vec3 fb = texture(uPrev, dd * 0.9 + 0.5).rgb;
      o = vec4(mix(c, fb, uFb), 1.0); }`;

  const gl = local.c.getContext('webgl2', { antialias: false, preserveDrawingBuffer: false });
  let rendererName = null, localFps = 0, drewAny = 0;
  // ⚠️ LOCK THE LOCAL PICTURE TO THE BOARD'S FRAME NUMBER WHEN ONE IS ARRIVING.
  // Free-running, the two panes are the same shader counting from different
  // starts — the same family of shape in unrelated colours, which a viewer
  // reads as "these do not match" and which makes the page argue against
  // itself. The board's per-frame sequence number IS its frame counter, so
  // driving `uT` from it puts both panes on the same instant. Then anything
  // still visibly different between them is the PIPELINE, which is the thing
  // worth looking at.
  let lockedFrame = null, lockedAt = 0;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function target() {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    for (const p of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER]) gl.texParameteri(gl.TEXTURE_2D, p, gl.LINEAR);
    for (const p of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T]) gl.texParameteri(gl.TEXTURE_2D, p, gl.CLAMP_TO_EDGE);
    const f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    return { t, f };
  }

  if (!gl) {
    local.p.append(el('div', 'none', 'this browser gave no WebGL2 context, so the left pane cannot be drawn here'));
    d.log('no WebGL2 context — the left pane is unavailable on this browser', 'bad');
    stat('here', { note: 'no WebGL2 here' });
  } else {
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    rendererName = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    // ⚠️ SAY WHICH RENDERER, ALWAYS. A visitor on a software rasteriser is a
    // real visitor, and a page that is quietly slow teaches nothing. It is also
    // what demo/verify-gl.mjs checks its own answer against.
    // ⚠️ THE RENDERER, ALWAYS, UNDER THE PICTURE IT DREW. A visitor on a
    // software rasteriser is a real visitor and a page that is quietly slow
    // teaches nothing; it is also what demo/verify-gl.mjs checks its own answer
    // against. It goes in the `here` bar because it is a fact about THAT pane —
    // the right-hand picture was drawn by a Raspberry Pi and this says nothing
    // about it.
    // ⚠️ NAME THE CHIP, NOT THE FIRST COMMA. Splitting
    // "ANGLE (Apple, ANGLE Metal Renderer: Apple M2 Pro, Unspecified Version)"
    // on its first comma leaves the word "Apple", which says nothing at all.
    // The part worth printing is what follows "Renderer:".
    const short = String(rendererName).match(/Renderer:\s*([^,)]+)/)?.[1]
      ?? String(rendererName).replace(/^ANGLE \(|\)$/g, '');
    stat('here', { note: short.trim().slice(0, 32) });

    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    const uT = gl.getUniformLocation(prog, 'uT');
    const uRes = gl.getUniformLocation(prog, 'uRes');
    const uPrev = gl.getUniformLocation(prog, 'uPrev');
    const uSeg = gl.getUniformLocation(prog, 'uSeg');
    const uFb = gl.getUniformLocation(prog, 'uFb');
    const uScale = gl.getUniformLocation(prog, 'uScale');
    const uWarp = gl.getUniformLocation(prog, 'uWarp');
    const uHue = gl.getUniformLocation(prog, 'uHue');
    gl.bindVertexArray(gl.createVertexArray());
    // The feedback tap needs the same ping-pong the C does: two targets, swapped
    // every frame, with the previous one bound as the texture.
    let A = target(), B = target();
    let i = 0, tick = 0, lastAt = performance.now();
    // ⚠️ WHICH FRAMEBUFFER HOLDS THE FRAME THAT WAS JUST DRAWN. Reading pixels
    // without binding one reads whatever happens to be current, and with
    // `preserveDrawingBuffer: false` the default framebuffer is not readable
    // after the frame ends at all — so a check would sample an undefined
    // surface and report a flat field on a picture that is fine.
    window.__lastFbo = null;

    const frame = () => {
      gl.bindFramebuffer(gl.FRAMEBUFFER, B.f);
      gl.viewport(0, 0, W, H);
      // ⚠️ A LOCK WITH NO TIMEOUT FREEZES THE THING IT LOCKED. When the box
      // stops sending — it died, the stream ended, the socket dropped without a
      // `video.stopped` — the counter stops advancing and this pane stops with
      // it. Both pictures then appear dead and only one of them actually is,
      // which is the page failing at the exact moment it should be showing that
      // the local one needs nobody. Unlock after a second of silence.
      if (lockedFrame !== null && performance.now() - lockedAt > 1000) {
        lockedFrame = null;
        i = Math.max(i, 1);
        local.lab.innerHTML = '<b>here</b> — your browser';
        d.log('the box stopped sending — this pane is free-running again', 'warn');
        stat('box', { fps: null, kbit: null, note: 'not arriving' });
      }
      gl.uniform1f(uT, (lockedFrame ?? i) / 30);
      gl.uniform2f(uRes, W, H);
      gl.uniform1f(uSeg, P.mirrors);
      gl.uniform1f(uFb, 0.78);
      gl.uniform1f(uScale, P.grain);
      gl.uniform1f(uWarp, 0.08);
      gl.uniform1f(uHue, P.hue);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, A.t);
      gl.uniform1i(uPrev, 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      // Blit to the canvas so it is visible, then swap.
      gl.bindFramebuffer(gl.READ_FRAMEBUFFER, B.f);
      gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
      gl.blitFramebuffer(0, 0, W, H, 0, 0, W, H, gl.COLOR_BUFFER_BIT, gl.NEAREST);
      window.__lastFbo = B.f;          // before the swap: B is what was just drawn
      [A, B] = [B, A];
      i++; tick++; drewAny++;
      const now = performance.now();
      if (now - lastAt >= 1000) { localFps = tick * 1000 / (now - lastAt); tick = 0; lastAt = now; stat('here', { fps: localFps }); }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }

  // ── the picture, from the board ──────────────────────────────────────────
  //
  // ⚠️ A SECOND SOCKET, TO `<room>-video`. The relay allows 60 messages a
  // second per socket and the box's audio is already 50 of them; thirty video
  // frames on the same socket would be 80 against a cap of 60 and the bucket
  // drops the excess with no error at all. It also keeps the binary framing
  // unambiguous — every other page here reads a binary frame as PCM.
  const FROM = `mir-${randomId(6)}`;
  let seq = 0;
  const ctl = new WebSocket(`${RELAY_BASE}/room/${ROOM}/ws`);
  const send = (m) => { const id = randomId(); ctl.send(format(m, { from: FROM, seq: seq++, id })); return id; };
  ctl.onopen = () => { d.log(`asking ${ROOM} what it can draw`); send({ type: 'video.status' }); };
  ctl.onmessage = (e) => {
    if (typeof e.data !== 'string') return;
    const { kind, msg } = parse(e.data);
    if (kind !== 'json' || msg.from === FROM) return;
    if (msg.type === 'video.started') {
      if (!msg.ok) {
        // `video.status` answers this when nothing is running, which is not a
        // fault — it is the cue to ask. Anything else is worth a line.
        if (/no picture running/.test(msg.reason || '')) { askForPicture(); return; }
        d.log(`the box is not drawing — ${msg.reason}`, msg.available === false ? 'bad' : 'warn');
        stat('box', { note: 'unavailable' });
        return;
      }
      d.log(`the box is drawing ${msg.w}x${msg.h} at ${msg.fps} — ${(msg.bitrate / 1000).toFixed(0)} kbit/s`, 'hi');
      // The box names its GPU the same way this page names yours. It arrives on
      // the second status at the latest, because the renderer prints it on its
      // own first line and the reply may be composed before that lands.
      if (msg.renderer) stat('box', { note: msg.renderer });
      // ⚠️ TELL THE BOX WHAT THIS PAGE IS SET TO. The knobs only sent on a
      // press, so at load the page rendered its own defaults and the box
      // rendered ITS defaults — and the two agreed only because the numbers
      // happened to be the same on both sides. Changing one of them anywhere
      // would have made the panes quietly disagree, which is the one thing this
      // page must never do. Sent on every start, so a box that restarted comes
      // back matching whatever is on screen.
      send({ type: 'video.params', ...P });
      // ⚠️ DO NOT REOPEN A STREAM THAT IS ALREADY OPEN. Every client's
      // `video.status` is answered to the whole room, so a second visitor's
      // question tore this one's decoder down and built it again — which showed
      // up as a bar reading "not arriving" next to a live frame rate.
      if (!vws) openVideo(msg.room, msg);
    }
    if (msg.type === 'video.stopped') { d.log(`the box stopped after ${msg.frames ?? 0} frames`); closeVideo(); }
  };
  // ⚠️ ASK ON CONNECT, NOT ON A PRESS. A page whose first act is asking you to
  // press something shows you nothing; and the box stops on its own when the
  // room empties, so nobody has to remember to switch it off.
  function askForPicture() {
    d.log('asking the box to draw…', 'hi');
    send({ type: 'video.start', w: 1280, h: 720, fps: 30 });
  }

  /**
   * Ask again, slowly, for as long as the page is open.
   *
   * ⚠️ Every five seconds and NOT faster: the thing being asked is a Raspberry
   * Pi with one hardware encoder, and a page that retries hard is a page that
   * queues work on a device which blocks rather than fails. Five seconds is
   * slow enough to be polite and quick enough that someone switching the box on
   * sees the picture without reloading.
   */
  let retry = null;
  function scheduleRetry() {
    if (retry) return;
    retry = setInterval(() => {
      if (vws) { clearInterval(retry); retry = null; return; }
      send({ type: 'video.status' });
    }, 5000);
    retry.unref?.();
  }

  let vws = null, decoder = null, farFps = 0, farBytes = 0, farGaps = 0, farDecoded = 0, waitingForKey = true;
  const fctx = far.c.getContext('2d');

  function closeVideo() {
    try { vws?.close(); } catch { /* already */ }
    try { decoder?.close(); } catch { /* already */ }
    vws = null; decoder = null;
    // Back to free-running, and SAY SO. A pane that silently stopped being
    // locked would be two different claims wearing one label.
    lockedFrame = null;
    local.lab.innerHTML = '<b>here</b> — your browser';
    stat('box', { fps: null, kbit: null, note: 'not arriving' });
    // ⚠️ "Waiting…" HAS TO BE TRUE. Saying it and then doing nothing is the
    // worst of both: a reader waits for something nobody is asking for. The
    // page re-asks, and the word is a promise it keeps.
    farNone.textContent = 'Waiting…';
    scheduleRetry();
    far.p.append(farNone);
  }

  function openVideo(room, info) {
    closeVideo();
    if (typeof VideoDecoder !== 'function') {
      farNone.textContent = 'this browser has no WebCodecs, so the box’s picture cannot be decoded here';
      d.log('no WebCodecs — the right pane is unavailable on this browser', 'bad');
      return;
    }
    waitingForKey = true; farDecoded = 0; farGaps = 0; farBytes = 0;
    decoder = new VideoDecoder({
      output: (vf) => {
        if (far.c.width !== vf.displayWidth) { far.c.width = vf.displayWidth; far.c.height = vf.displayHeight; }
        fctx.drawImage(vf, 0, 0);
        vf.close();
        farDecoded++;
        farNone.remove();
        // ⚠️ CLEAR THE STALE NOTE. "not arriving" was left behind by an earlier
        // close and sat next to a live frame rate — a bar saying both at once
        // is worse than one saying neither.
        if (window.__demo.panes.box.note) stat('box', { note: null });
      },
      error: (e) => d.log(`decode error — ${String(e.message ?? e).slice(0, 80)}`, 'bad'),
    });
    decoder.configure({ codec: info.codec ?? 'avc1.42E01E', optimizeForLatency: true });

    vws = new WebSocket(`${RELAY_BASE}/room/${room}/ws`);
    vws.binaryType = 'arraybuffer';
    let last = -1, tick = 0, at = performance.now();
    vws.onmessage = (e) => {
      if (typeof e.data === 'string') return;
      const dv = new DataView(e.data);
      const s = dv.getUint32(0, true), key = (dv.getUint32(4, true) & 1) === 1;
      // ⚠️ THE COUNTER IS IN THE PAYLOAD BECAUSE A BINARY FRAME HAS NO
      // ENVELOPE, and the relay drops frames with no error, no close and no
      // backpressure. Measured: at 8 Mbit/s it lost 101 of 361 frames and
      // nothing else on the path said so. This cell is the only witness.
      if (last >= 0 && s > last + 1) { farGaps += s - last - 1; stat('box', { lost: farGaps }); }
      last = s;
      // The board's sequence number is its frame counter — see the comment at
      // `lockedFrame`. Taken here, before the decode, because a frame the
      // decoder refuses is still a frame the board drew.
      if (lockedFrame === null) local.lab.innerHTML = '<b>here</b> — your browser, locked to the box';
      lockedFrame = s; lockedAt = performance.now();
      farBytes += e.data.byteLength;
      // ⚠️ A DECODER MUST START ON A KEYFRAME. Feeding it a delta frame first
      // is an error it reports once and then stays broken through, so a joiner
      // waits — up to one second at this GOP, which is a GOP choice and not a
      // fault.
      if (waitingForKey) { if (!key) return; waitingForKey = false; d.log('keyframe — the box’s picture starts here'); }
      try {
        decoder.decode(new EncodedVideoChunk({
          type: key ? 'key' : 'delta',
          timestamp: s * 1e6 / (info.fps ?? 30),
          data: new Uint8Array(e.data, 8),
        }));
      } catch (err) { d.log(`chunk refused — ${String(err.message ?? err).slice(0, 70)}`, 'bad'); }
      tick++;
      const now = performance.now();
      if (now - at >= 1000) {
        farFps = tick * 1000 / (now - at);
        stat('box', { fps: farFps, kbit: farBytes * 8 / (now - at), lost: farGaps });
        tick = 0; at = now; farBytes = 0;
      }
    };
    vws.onclose = () => d.log('the box’s video socket closed');
  }

  // ── what a harness can check ─────────────────────────────────────────────
  // The renderer goes on `__demo` directly, because demo/verify-gl.mjs asserts
  // the page's own answer against what it found itself — two ends disagreeing
  // about which context they are looking at is worth catching.
  window.__demo.gl = { renderer: rendererName, ok: !!gl };
  /**
   * ⚠️ THE CHECKS RUN THEMSELVES, because the controls are gone.
   *
   * This project's usual hook is a button the harness presses — "a control the
   * harness cannot press is a subject the suite cannot reach". With no controls
   * the same rule points the other way: the page must reach its own checks, and
   * demo/verify-gl.mjs waits for `__demo.ready` instead of pressing anything.
   *
   * It waits for the box before running, but only for a bounded time: a page
   * whose asserts never fire because a Raspberry Pi is switched off reads as
   * broken, and the left-hand pane is a claim that stands on its own.
   */
  async function runChecks() {
      // ⚠️ THE LOCAL PANE IS ASSERTED WITHOUT THE BOARD, ON PURPOSE. It is a
      // pure function of (parameters, clock) and needs no network at all —
      // which is the claim the page exists to make. Tying its asserts to a
      // Raspberry Pi being switched on would make the page read red for a
      // reason that is not about the page.
      d.assert('a real WebGL2 context, not a fallback', !!gl, rendererName ?? 'none');
      d.assert('the shader compiled and linked', drewAny > 0, `${drewAny} frames drawn`);
      await new Promise((r) => setTimeout(r, 1200));
      d.assert('it keeps drawing', drewAny > 30, `${drewAny} frames`);
      d.assert('and it reports a real frame rate', localFps > 5, `${localFps.toFixed(1)} fps`);
      // ⚠️ THE PICTURE IS NOT A FLAT FIELD. A shader that compiles, links and
      // draws can still be producing one colour — "it rendered" and "there is
      // something in it" are different claims and only the second is the one
      // anybody cares about.
      //
      // ⚠️ AND IT IS READ OVER THE WHOLE FRAME, NOT AT FOUR POINTS. Four points
      // read `5 of 765` on a picture whose true range is 26..254 — because this
      // image is EIGHT-FOLD SYMMETRIC and radial, so any two samples at similar
      // radius are similar BY CONSTRUCTION. The assert was measuring the
      // symmetry of the thing it was checking, and it failed a working page.
      // A whole frame at this size is 900 KB and reads in a millisecond.
      let spread = 0;
      if (gl && window.__lastFbo) {
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, window.__lastFbo);
        const px = new Uint8Array(W * H * 4);
        gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
        // ⚠️ PER CHANNEL, NOT THE SUM — AND THE SUM IS THE ONE STATISTIC THAT
        // CANNOT SEE THIS PICTURE. The colour is
        // `0.5 + 0.5*cos(2pi*(w + vec3(0, 0.33, 0.67)) + uT)`: three cosines
        // about 120 degrees apart, and three cosines 120 degrees apart SUM TO A
        // CONSTANT. So the image varies almost entirely in HUE at near-constant
        // total luminance — measured, R+G+B spans 377..386 of 765 while red
        // alone spans 26..254. A luminance check reported a flat field on a
        // vivid kaleidoscope and failed a page that was perfectly fine, twice.
        const lo = [255, 255, 255], hi = [0, 0, 0];
        for (let i = 0; i < px.length; i += 4) {
          for (let k = 0; k < 3; k++) {
            const v = px[i + k];
            if (v < lo[k]) lo[k] = v;
            if (v > hi[k]) hi[k] = v;
          }
        }
        spread = Math.max(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]);
      }
      // ⚠️ NOT A PIXEL COMPARISON AGAINST A GOLDEN IMAGE. The same shader with
      // identical inputs summed 48,147,330 of red on ANGLE Metal and 68,001,881
      // on SwiftShader — 41% apart — because the standard GLSL hash amplifies
      // last-bit float differences into unrelated noise. Structure is portable;
      // exact pixels are not.
      d.assert('there is a picture in it, not a flat field', spread > 60,
               `the widest colour channel spans ${spread} of 255`);
      // The far pane, only if the board answered. A lane with nothing to say
      // says so in words rather than counting as a failure.
      if (farDecoded > 0) {
        d.assert('the box’s picture decoded here', farDecoded > 5, `${farDecoded} frames`);
        d.assert('and arrived without the relay dropping any', farGaps === 0, `${farGaps} lost`);
      } else {
        d.log('the box is not sending — the right pane has nothing to report', 'warn');
      }
      d.ready();
  }
  (async () => {
    for (let i = 0; i < 30 && farDecoded === 0; i++) await new Promise((r) => setTimeout(r, 400));
    if (farDecoded === 0) d.log('the box did not send in 12 s — checking the left pane only', 'warn');
    runChecks();
  })();
</script>
