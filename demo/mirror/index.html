<!doctype html>
<meta charset="utf-8">
<title>mirror — positron</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0 0 14px; }
  @media (max-width: 720px) { .panes { grid-template-columns: 1fr; } }
  .pane { position: relative; background: var(--card2); border-radius: 8px; overflow: hidden; }
  .pane canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: #000; }
  .bar .lab { font: 500 11px/1 var(--mono); color: var(--dim); }
  .bar .lab b { color: var(--hi); font-weight: 500; }
  .pane .none {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    font: 400 12px/1.7 var(--mono); color: var(--dim); padding: 18px;
  }
  /* The bar belongs to its pane, so the numbers sit with the ink they describe
     rather than in a table somewhere else — which is what makes a legend
     necessary. */
  .bar {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 9px; background: var(--card2); border-top: 1px solid var(--line);
    font: 400 11px/1.5 var(--mono); color: var(--dim);
  }
  .bar .n { color: var(--fg); }
  .bar .sp { margin-left: auto; }
  .bar button {
    font: 400 11px/1 var(--mono); color: var(--dim);
    background: transparent; border: 1px solid var(--line); border-radius: 4px;
    padding: 4px 8px; cursor: pointer;
  }
  .bar button:hover { color: var(--fg); border-color: var(--dim); }
  .bar button.ico { font-size: 14px; line-height: 1; padding: 3px 8px; }
  /* One row, two groups. They sit ABOVE both pictures because they change both
     — a control that belongs to one pane goes in that pane's bar, and these do
     not. */
  .lookname { font: 500 11px/1.5 var(--mono); color: var(--hi); margin-left: 9px; }
  .knobs { display: flex; flex-wrap: wrap; gap: 22px; align-items: center; margin: 18px 0 16px; }
  .knob { display: flex; align-items: center; gap: 8px; }
  /* ⚠️ THE SAME KEY STYLE AS THE READOUT, copied from shell.css's `.pos-k` rather
     than invented: these name a value the way every other label on every other
     page here names one, and a second convention for the same job is how a set
     of pages stops looking like one thing. */
  .knob > span {
    font: 500 9.5px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase;
    color: var(--dim2);
  }
  .knob .seg { display: flex; gap: -1px; }
  .knob button {
    font: 400 11px/1 var(--mono); color: var(--dim);
    background: transparent; border: 1px solid var(--line);
    padding: 5px 10px; cursor: pointer;
  }
  .knob button:first-of-type { border-radius: 4px 0 0 4px; }
  .knob button:last-of-type { border-radius: 0 4px 4px 0; }
  /* ⚠️ OVERLAP, DO NOT DROP THE BORDER. The segmented look used
     `border-left: none` on every button after the first, which is fine while
     the chosen state is a FILL and wrong the moment it is a border: the chosen
     pill would be missing its left edge and read as half-drawn. A -1px margin
     puts the two borders on the same pixel, and z-index decides which is on
     top — which is the chosen one. */
  .knob button + button { margin-left: -1px; }
  .knob button[aria-pressed="true"] {
    color: var(--hi); border-color: var(--hi); background: transparent;
    position: relative; z-index: 1;
  }
  /* ⚠️ Focus is GREY here. shell.css focuses with `var(--hi)`, the same colour
     as the chosen state, so a focused-but-unchosen button read as chosen — the
     exact trap the box page already paid for. */
  .knob button:focus-visible { outline: 2px solid var(--dim); outline-offset: 1px; }
  /* ⚠️ In fullscreen the PANE is the fullscreen element, so the canvas has to be
     told to fill it — a canvas keeps its attribute size otherwise and sits in
     the middle of a black screen at 640x360. `contain`, never `cover`: this is a
     picture with a centre and cropping it is not a style choice.

     ⚠️ AND THE GRID SIZES THE ROWS, NOT A GUESSED NUMBER. This said
     `height: calc(100vh - 34px)` as well as `grid-template-rows: 1fr auto`,
     which counts the bar TWICE: the grid reserves its real height and the
     canvas then also reserves 34px of it, pushing the bar off the bottom of the
     screen. The numbers were clipped away in fullscreen — the half that says
     whether what you are looking at is arriving properly. `1fr` plus
     `min-height: 0` lets the row be exactly what is left. */
  .pane.pos-full { background: #000; display: grid; grid-template-rows: 1fr auto; }
  .pane.pos-full canvas {
    width: 100%; height: 100%; min-height: 0;
    object-fit: contain; aspect-ratio: auto;
  }
  .pane.pos-full .bar { padding: 10px 14px; font-size: 12px; }
  /* ⚠️ The knob row lives ABOVE both panes, which means it is not inside the
     element that goes fullscreen — so it simply vanishes, and the picture you
     went fullscreen to look at becomes the one you cannot change. It is moved
     into the fullscreen pane's own bar instead.

     ⚠️ AND A THREE-COLUMN GRID, NOT `margin: 0 auto`. Auto margins centre a
     thing in what is LEFT OVER, and the numbers on the left are much wider than
     the button on the right — so the knobs sat visibly right of centre on a
     screen where the middle is the one place the eye expects them. `1fr auto
     1fr` puts the middle column at the centre of the bar regardless of what
     flanks it. */
  .bar .knobs { margin: 0; gap: 18px; }
  .bar .knob button { padding: 4px 9px; }
  .pane.pos-full .bar {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
  }
  /* The flex spacer has no job in a grid, and an empty cell would shift the
     columns by one. */
  .pane.pos-full .bar .sp { display: none; }
  .pane.pos-full .bar .knobs { justify-self: center; }
  .pane.pos-full .bar button.ico { justify-self: end; }
  /* ⚠️ THE BAR IS ONE LINE OR IT IS NOT A BAR. Left to itself the flex row
     wraps, and a footer that becomes two lines in fullscreen pushes the picture
     up and reads as a layout that has come apart. Nothing in here is long
     enough to need wrapping — the fix when something IS too long is to shorten
     the words, which is what happened to the label, not to let it fold. */
  .bar, .bar .left, .bar .stat, .bar .knobs, .lab { white-space: nowrap; }
  .bar .left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  /* The numbers sit a thumb's width from the ⛶, so every long press here is a
     miss rather than a copy — photographed on an iPhone, selection handles
     dragged across "30.0 fps". shell.css keeps readouts selectable as a rule;
     this bar is the exception because it is a control strip. */
  .bar { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* In the bar the label is not a floating caption any more, so it drops the
     plate it needed to stay readable over a picture. */
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createStepper } from '/shell/stepper.mjs';
  import { createPanel } from '/shell/panel.mjs';
  import { createXRPanels, beacon } from '/shell/xr-panel.mjs';
  import { toggle as toggleFull, watch as watchFull, support as fullSupport } from '/shell/fullscreen.mjs';
  import { format, parse, randomId, RELAY_BASE } from '/shell/wire.mjs';

  const q = new URLSearchParams(location.search);
  const ROOM = q.get('room') || 'studio-1';
  const W = 640, H = 360;

  const d = mount({
    name: 'mirror',
    what: 'The same picture drawn twice: your own machine on the left, a Raspberry Pi in another building on the right, sending its result over as video. Same shader on both sides — it is a short document, so it runs anywhere. Put a headset on and that picture hangs on one panel in a room built from a seed, on a floor marked out in dots, with the frame rate it holds in there printed under it.',
    // ⚠️ NO SHELL READOUT. Every number here belongs to ONE of the two pictures,
    // so it goes in that picture's own bar rather than in a row above both —
    // joining a figure to its ink across two elements is exactly what makes a
    // legend necessary, and a single row under two panes cannot say which pane
    // it means without repeating the word every time. The machine surface is
    // `__demo.panes`, set below.
    readout: {},
    // ⚠️ ONE CONTROL, AND IT IS THE ONE THAT CANNOT HAPPEN BY ITSELF. The board
    // is asked to draw on connect and the checks run themselves — see
    // `runChecks` — because a page whose first act is asking you to press
    // something is a page that shows you nothing, and demo/verify-gl.mjs
    // therefore waits for `__demo.ready` rather than relying on a press.
    // Entering a headset is the exception: `requestSession` needs a user
    // gesture and there is no way to ask for one politely, so it gets a button.
    //
    // 🔴 IT IS DECLARED HERE RATHER THAN APPENDED TO THE ROW. `verify-gl.mjs`
    // presses `.pos-controls button` and nothing else — a control anywhere else
    // is never exercised and its asserts never run. This page has already paid
    // for that once: the look stepper sat in the knob row for one revision and
    // the assert count went 9 -> 7 while the page read GREEN.
    controls: [{ id: 'xr', label: 'Run in VR' }],
  });
  guard(d);

  const panes = el('div', 'panes');
  const mk = (title) => {
    const p = el('div', 'pane');
    const c = el('canvas');
    c.width = W; c.height = H;
    const lab = el('div', 'lab');
    lab.innerHTML = title;
    // The bar under each picture: that picture's numbers, and the one control
    // that belongs to a picture rather than to the page.
    const bar = el('div', 'bar');
    // A group, so the label and the numbers occupy ONE cell when the bar
    // becomes a three-column grid in fullscreen — otherwise the label takes a
    // column of its own and the knobs stop being in the middle.
    const left = el('span', 'left');
    const nums = el('span', 'stat', '');
    // Label first, numbers after: what drew it, then how it is going.
    left.append(lab, nums);
    // ⛶ U+26F6 SQUARE FOUR CORNERS — the conventional fullscreen glyph, and it
    // renders as text rather than as an emoji, so it takes the bar's colour and
    // sits on its baseline instead of arriving as a coloured picture at a size
    // of its own. `title` and `aria-label` carry the meaning for anyone the
    // glyph does not reach.
    const full = el('button', 'ico', '⛶', { type: 'button', title: 'fullscreen', 'aria-label': 'fullscreen' });
    // ⚠️ FULLSCREEN THE PANE, NOT THE CANVAS. A fullscreen canvas takes the bar
    // with it or loses it entirely, and the numbers are the half that says
    // whether what you are looking at is arriving properly.
    // 🔴 `p.requestFullscreen?.()` WAS A BUTTON THAT DID NOTHING ON AN IPHONE.
    // Safari there has no element Fullscreen API — not standard, not prefixed —
    // so the optional chain skipped straight past it: no throw, no catch, no
    // log line, no picture. An inert control that looks live is the failure
    // this repo keeps writing rules about, and optional chaining is a good way
    // to build one. shell/fullscreen.mjs tries the real API, falls back to a
    // position:fixed cover that needs no API at all, and SAYS WHICH RAN.
    full.onclick = async () => {
      const how = await toggleFull(p);
      syncFull();
      if (how !== 'exit') d.log(`fullscreen — ${how === 'element' ? 'the browser\u2019s own' : 'drawn by the page, this browser has no fullscreen'}`);
    };
    watchFull(p, () => syncFull());
    bar.append(left, el('span', 'sp'), full);
    p.append(c);
    const wrap = el('div', 'pane');
    wrap.style.position = 'static';
    panes.append(p);
    p.append(bar);
    return { p, c, lab, nums, full, left };
  };
  // ⚠️ THE LABEL NAMES THE THING THAT DREW THE PICTURE, not the side of the
  // screen it is on. "here" and "the box" say where to look; the chip says what
  // you are looking at, which is the comparison the page exists to make. Until
  // each end reports, it says what it can.
  // ⚠️ SHORT ENOUGH FOR THE PANE IT SITS ON. "on a Raspberry Pi, over the
  // internet" wrapped onto a second line across a 340-pixel pane, and a caption
  // that needs two lines to say where a picture came from is covering the
  // picture to do it. The journey is already in the paragraph above and in the
  // kbit/s under the pane; the label only has to name the far end.
  // ⚠️ NO ARTICLES IN A LABEL. "a Raspberry Pi" reads as prose in a slot that is
  // a name — and next to a chip string like "Apple M2 Pro" the mismatch is
  // obvious. A label names a thing; it does not introduce it.
  const WHERE = { here: 'your browser', box: 'Raspberry Pi' };
  const chip = { here: null, box: null };
  // ⚠️ DECLARED HERE BECAUSE `relabel` READS IT, and `relabel` is called while
  // the panes are being built. A `let` further down is in the temporal dead
  // zone until its line runs, so the first call threw at module scope — a blank
  // page, no asserts, and a harness reporting "the page reports no renderer".
  // Second time in this file; the first was `knobRow`.
  let lockedFrame = null, lockedAt = 0;
  /**
   * ⚠️ THE LABEL LIVES IN THE BAR, ALWAYS — not floating over the picture, and
   * not only once you are in fullscreen. It was drawn on top of the thing it
   * describes, which covers the corner of a picture whose whole point is to be
   * compared with the one beside it; and it then MOVED into the bar in
   * fullscreen, so the page had two layouts for one label and you learned the
   * second one by accident.
   *
   * 🔴 AND IT SAID "a Raspberry Pi — a Raspberry Pi". The name falls back to the
   * same string `WHERE` holds, so before the board reported its chip both
   * halves were identical — visible in the screenshot that prompted this. The
   * side is already named by WHICH PANE IT IS; the label only has to say what
   * drew it.
   */
  function relabel(which) {
    const pane = which === 'here' ? local : far;
    const known = chip[which];
    const lock = which === 'here' && lockedFrame !== null ? ' · locked' : '';
    pane.lab.innerHTML = '';
    if (known) pane.lab.append(el('b', '', known), document.createTextNode(lock));
    else pane.lab.append(document.createTextNode(WHERE[which] + lock));
  }
  const local = mk('');
  const far = mk('');
  relabel('here'); relabel('box');
  const farNone = el('div', 'none', 'Waiting…');
  far.p.append(farNone);
  d.el.prepend(panes);

  /**
   * ⚠️ TWO KNOBS, AND THEY DRIVE BOTH PANES. A control that moved only the
   * local picture would break the one claim this page makes — that the two
   * sides are the same shader — and would do it invisibly, because the panes
   * would simply stop matching and look like a bug. So each press sets the
   * local uniform AND sends `video.params` to the box.
   *
   * They are the two things the paragraph already names: the kaleidoscope fold
   * and the feedback. Three steps each rather than a slider, because a slider
   * here is a hundred values nobody wants and a number nobody can repeat.
   */
  // ⚠️ WIDE ENOUGH TO SEE FROM ACROSS THE ROOM. The first pair were 4/8/16
  // mirrors and three feedback amounts, and the three steps of each looked like
  // the same picture in a slightly different mood — a control whose settings a
  // viewer cannot tell apart is a control that teaches nothing. These are
  // ranges chosen so the ends are unmistakable, and the middle of each is the
  // value the renderer ships with, so "mid mid mid" is the picture the rest of
  // this repo measured.
  const KNOBS = {
    // 2 is a single fold — almost a mirror down the middle. 24 is a doily.
    mirrors: { label: 'mirrors', steps: [['2', 2], ['8', 8], ['24', 24]], at: 1 },
    // The noise frequency, which decides whether the shapes are continents or
    // filigree. An eightfold span, because a doubling is not visible here.
    grain:   { label: 'grain',   steps: [['coarse', 1.2], ['mid', 4], ['fine', 16]], at: 1 },
    // HOW FAR APART THE THREE COLOUR CHANNELS ARE. The colour is three cosines
    // of the same field, offset by vec3(0, 0.33, 0.67) — a third of a turn each,
    // which is what makes a full rainbow. Scaling those offsets is the whole
    // palette in one number: near zero the three channels move together and the
    // picture is a duotone sweep; at 1 it is the rainbow; past 1 the offsets
    // wrap and the hues come back round in a different order.
    // ⚠️ 2.2 WAS NOT "WIDER", IT WAS THE SAME RAINBOW RESHUFFLED, and it looked
    // it. Three phases a third of a turn apart is the MAXIMUM colour separation
    // there is — anything past that wraps and lands somewhere else on the
    // circle with no more spread than before, which is why `mid` and `wide`
    // were hard to tell apart. 1.5 is the interesting place instead: the green
    // channel goes half a turn while red and blue come back to nearly the same
    // phase, so the picture splits into two opposed colours — magenta against
    // green — rather than running through all of them. Checked by sweeping
    // 0.12/0.45/1.0/1.5/1.8/2.2 and looking at the six.
    hue:     { label: 'hue',     steps: [['close', 0.12], ['full', 1], ['split', 1.5]], at: 1 },
  };
  const knobRow = el('div', 'knobs');
  for (const [key, k] of Object.entries(KNOBS)) {
    const wrap = el('div', 'knob');
    wrap.append(el('span', '', k.label));
    const seg = el('div', 'seg');
    k.buttons = k.steps.map(([text, value], idx) => {
      const b = el('button', '', text, { type: 'button', 'aria-pressed': String(idx === k.at) });
      b.onclick = () => choose(key, idx);
      seg.append(b);
      return b;
    });
    wrap.append(seg);
    knobRow.append(wrap);
  }

  // 🔴 IN `.pos-controls`, AND THAT IS NOT A LAYOUT PREFERENCE. It sat in the
  // knob row for one revision and the assert count went 9 -> 7 while the page
  // read GREEN: `verify.mjs` presses `.pos-controls button, .tbar-x` and nothing
  // else, so a control anywhere else is never exercised and its asserts never
  // run. That is this project's oldest failure — a green suite over a path the
  // suite cannot reach — committed by moving a button.
  //
  // It is a STEPPER rather than a "next" because a list you can only walk
  // forwards through is one you have to go all the way round to revisit.
  {
    const wrap = el('span', 'knob');
    wrap.append(el('span', '', 'LOOK'));
    const jump = (to) => {
      lookAt_ = (to + LOOKS.length) % LOOKS.length;
      const { name, body } = LOOKS[lookAt_];
      lookName.textContent = name;
      const okHere = window.__applyShader(body);
      d.log(`“${name}” — ${okHere ? 'fading in here' : 'refused here'}`);
      const open = ctl?.readyState === 1;
      let sent = false;
      if (open) { try { send({ type: 'video.shader', body }); sent = true; } catch { sent = false; } }
      d.assert('the new look compiled in this browser', okHere, name);
      d.assert('and the same body went to the box, when there is one',
        sent || !open, open ? (sent ? 'sent' : 'the socket refused it') : 'no board in the room, so nothing to send');
    };
    const step = createStepper({
      what: 'look',
      prev: () => jump(lookAt_ - 1),
      next: () => jump(lookAt_ + 1),
      random: () => jump(Math.floor(Math.random() * LOOKS.length)),
    });
    // ⚠️ EMPTY HERE, FILLED WHERE `LOOKS` EXISTS. The shader sources are
    // declared BELOW this row, so reading `LOOKS[0].name` at build time is a
    // temporal dead zone — `Cannot access 'LOOKS' before initialization`, at
    // module scope, which means a blank page with no asserts and no log line
    // saying why. This file's own comments already record two of these; this
    // is the third.
    //
    // A stepper with no readout is three buttons and a guess about which of
    // four you are looking at, so the label still has to exist — it is just
    // named a few lines later.
    var lookName = el('span', 'lookname', '');
    const seg2 = el('div', 'seg');
    seg2.append(step.el);
    wrap.append(seg2, lookName);
    const row = document.querySelector('.pos-controls');
    if (row) { row.style.display = 'flex'; row.style.alignItems = 'center'; row.append(wrap); }
    else knobRow.append(wrap);
  }

  // ⚠️ AFTER the row is built. `const knobRow` is in the temporal dead zone
  // until its declaration runs, so inserting it earlier throws before anything
  // is drawn — and a page that throws at module scope shows a blank frame with
  // no log line to say why.
  d.el.insertBefore(knobRow, panes);

  /**
   * ⚠️ FOLLOW THE PICTURE INTO FULLSCREEN. The knobs sit above both panes,
   * which is the right place while both are on screen and the wrong place the
   * moment one of them fills it: the row is not inside the fullscreen element,
   * so it disappears and the picture you went fullscreen to look at is the one
   * you can no longer change. It moves into that pane's bar and comes back
   * afterwards.
   */
  /* ⚠️ ASK THE CLASS, NOT `document.fullscreenElement`. On the faux path there
     IS no fullscreen element — the pane is a position:fixed cover and the
     browser knows nothing about it — so keying off `fullscreenElement` left the
     knobs upstairs and the label floating over the picture on every iPhone.
     `.pos-full` is set by shell/fullscreen.mjs on both paths, which is the whole
     reason it exists. Called from the button as well as from the event, because
     the faux path fires no event. */
  function syncFull() {
    const pane = [local, far].find((p) => p.p.classList.contains('pos-full'));
    if (pane) {
      pane.p.querySelector('.bar').insertBefore(knobRow, pane.full);
      // ⚠️ AND THE LABEL COMES DOWN TOO. It is drawn ON TOP of the picture,
      // which is fine in a 340-pixel pane and wrong across a whole screen —
      // a caption floating over the middle of the thing you went fullscreen to
      // look at. In the bar it sits beside the numbers, which is where the rest
      // of what this pane has to say already is.

    } else {
      for (const q of [local, far]) {

      }
      d.el.insertBefore(knobRow, panes);
    }
  }
  document.addEventListener('fullscreenchange', syncFull);
  document.addEventListener('webkitfullscreenchange', syncFull);

  /**
   * A new picture, arriving over the same socket everything else here uses.
   *
   * ⚠️ COMPILE BEFORE COMMITTING TO IT. A shader that will not link must leave
   * the running one alone — the alternative is a page that goes black because
   * somebody typed a semicolon wrong, on a demo whose entire job is to be
   * looked at.
   */
  function choose(key, idx) {
    const k = KNOBS[key];
    k.at = idx;
    k.buttons.forEach((b, i) => b.setAttribute('aria-pressed', String(i === idx)));
    const value = k.steps[idx][1];
    // The local picture changes on the next frame; the box changes when the
    // message lands, which is a hop away. They converge, and the panes being
    // briefly different IS the latency — the same thing the lock makes visible.
    P[key] = value;
    send({ type: 'video.params', [key]: value });
    d.log(`${k.label} ${k.steps[idx][0]}`, 'hi');
  }
  // The live values, one place, read by the render loop and sent to the box.
  const P = Object.fromEntries(Object.entries(KNOBS).map(([k, v]) => [k, v.steps[v.at][1]]));
  // Exposed so a harness can sweep the ranges without pressing nine buttons.
  window.__P = P;

  /**
   * Each pane's own numbers, under it.
   *
   * ⚠️ AND `__demo.panes` IS THE MACHINE COPY, written from the same values in
   * the same call — two places that can disagree is how a readout ends up
   * describing something the page is not doing.
   */
  window.__demo.panes = { here: {}, box: {} };
  // ⚠️ EVERY FIELD IS ALWAYS DRAWN, EVEN BEFORE IT HAS A VALUE. Building the bar
  // from only the fields that happen to be known means the renderer name starts
  // at the left edge and JUMPS right the moment the first frame rate lands — a
  // second of text moving for no reason the reader can see. A dash holds the
  // place instead, which is also honest: it says "not yet", where an absent
  // field says nothing at all.
  // ⚠️ NO `note` FIELD ANY MORE. The renderer's name moved to the label, where
  // it belongs: the bar is measurements, and a name sitting among them read as
  // one. What is left here can all change.
  const FIELDS = {
    here: [['fps', 'fps', (v) => v.toFixed(1)]],
    box: [['fps', 'fps', (v) => v.toFixed(1)], ['kbit', 'kbit/s', (v) => v.toFixed(0)],
          ['lost', 'lost', (v) => String(v)]],
  };
  function stat(which, fields) {
    const pane = which === 'here' ? local : far;
    Object.assign(window.__demo.panes[which], fields);
    const v = window.__demo.panes[which];
    pane.nums.innerHTML = FIELDS[which].map(([key, unit, fmt]) => {
      // `note` is the only field with nothing to hold a place for — it is a
      // name, not a measurement, and an empty one should take no room.
      const shown = v[key] == null ? '' : fmt(v[key]);
      return `<span class="n">${shown}</span>${unit ? ' ' + unit : ''}`;
    }).filter(Boolean).join(' · ');
  }

  // ── the panel that hangs in a headset ────────────────────────────────────
  //
  // `plan-xr-room.md` §4.1: "One panel, one transport, measured." This is that
  // panel. It is a canvas — a picture with a footer of real numbers under it,
  // drawn by demo/shell/panel.mjs — and a canvas is the one thing that works in
  // both places: the page can show it, and an immersive session can hand the
  // same canvas to the graphics card and hang it in the room.
  //
  // 🔴 THE 2-D PAGE IS INVISIBLE ONCE A HEADSET IS ON. The log, the two bars and
  // every number in them are behind your face, so anything worth reading while
  // wearing it has to be drawn INTO the picture. That is why the numbers are in
  // the footer rather than left in the bars where they already live.
  const PANEL_W = 640, PANEL_H = 400;          // css units; the canvas is 2x this
  const panel = createPanel({ width: PANEL_W, height: PANEL_H, title: 'mirror' });
  // ⚠️ DRAWN ONLY WHEN SOMEBODY IS LOOKING AT IT. Copying the picture into the
  // panel and laying out five numbers costs real time every frame, and this
  // page MEASURES ITS OWN FRAME RATE — a decoration that quietly lowers the
  // number the page exists to report is worse than no decoration. It is off
  // until a session is running, and turned on for a quarter of a second when
  // the checks want to look at it.
  let wantPanel = false, panelDrawn = 0;
  // Assigned inside the renderer block below, because that is where they live.
  // ⚠️ DECLARED UP HERE, though: this file has already been bitten three times
  // by reading a `let` before its line ran — `knobRow`, `lockedFrame` and
  // `LOOKS` — and each one was a blank page with no log line saying why.
  let mirrorStep = null, flatRaf = 0, xr = null;
  let startFlat = () => {}, stopFlat = () => {};

  /**
   * Which picture goes on the panel, and what to say when there is none.
   *
   * ⚠️ THE BOX FIRST, BECAUSE IT IS THE ONE THAT CROSSED A NETWORK. A panel is
   * only interesting if it is showing something a transport carried; the local
   * shader is the fallback so that the panel is never empty on a laptop with no
   * board switched on.
   *
   * ⚠️ AND A PANEL THAT IS NOT LIVE SAYS SO IN WORDS. A frozen frame reads as a
   * broken stream — `plan-xr-room.md` §5.6, and the same rule as a blank readout
   * cell collapsing "we did not look" into "we looked and it was fine".
   */
  function panelSource() {
    // One second is the same silence this page already treats as "the box
    // stopped sending" when it unlocks the local frame counter.
    if (farDecoded > 0 && performance.now() - lockedAt < 1000) return { src: far.c, from: 'the box' };
    if (gl && drewAny > 0) return { src: local.c, from: 'your browser' };
    return { src: null, from: null };
  }

  /**
   * ⚠️ CALLED FROM INSIDE THE RENDER CALLBACK THAT JUST DREW, never on a timer
   * of its own. The left-hand canvas is a 3-D surface with no preserved
   * drawing buffer, so it can only be copied in the same turn as the frame that
   * filled it — read it a task later and you get a cleared surface, which would
   * reach the panel as a black rectangle that looks like a broken stream.
   */
  function drawPanel() {
    const { src, from } = panelSource();
    const live = xr?.state?.presenting === true;
    const fps = live ? xr.state.fps : (localFps || null);
    panel.draw({
      source: src,
      state: src ? 'live' : 'nothing is drawing here yet',
      footer: [
        ['picture', from ?? ''],
        ['fps', fps == null ? '' : fps.toFixed(1)],
        // Frames of THIS picture: the ones drawn inside the headset while one
        // is on, and the ones drawn on this page while it is not.
        ['frames', String(live ? xr.state.frames : drewAny)],
        // ⚠️ THE PROCESSOR'S TIME, NOT THE CARD'S. This is how long it takes to
        // hand the panel to the graphics card each frame; the card's own time
        // for the copy cannot be read from here at all, and `fps` beside it is
        // the number that would actually notice a problem.
        ['copy', live && xr.state.uploadCpuMs != null ? `${xr.state.uploadCpuMs.toFixed(2)} ms` : ''],
        ['headset', live && xr.state.fb ? `${xr.state.fb.w}x${xr.state.fb.h}` : ''],
        // ⚠️ WHOSE FLOOR THE DOTS ARE ON, where it can be read while wearing
        // the thing. The 2-D page is behind your face, and "the grid is on your
        // real floor" and "the grid is at a height this page guessed" look
        // identical from inside — one of them is a measurement of your room and
        // the other is not, so the panel says which.
        ['floor', live ? (xr.state.room?.floor ?? '') : ''],
      ],
    });
    panelDrawn++;
  }

  // ── the picture, here ────────────────────────────────────────────────────
  //
  // ⚠️ THIS IS THE SAME SHADER AS rig/vis/v3dpipe.c, PORTED RATHER THAN
  // REWRITTEN — and the port is three lines of difference, which is itself the
  // argument the page is making. The board runs `#version 310 es` because it
  // has GLES 3.1; WebGL2 is GLSL ES 3.00, and nothing in the fragment shader
  // needs 3.10. Everything else — gl_VertexID, `out vec4`, texture(), highp —
  // is unchanged.
  //
  // ⚠️ AND `uT` IS A FRAME COUNTER, NOT A CLOCK. The C drives it as i/30.0. If
  // this drove it from wall time the two panes would be the same shader making
  // visibly different motion, and the page's whole claim would read as false
  // while both halves were working.
  const VS = `#version 300 es
    void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
      gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;
  // ⚠️ THE BODY IS SHARED, THE HEADER IS NOT. The board compiles this same
  // text as `#version 310 es` and the browser as `300 es`, so what travels over
  // the socket is the BODY and each end puts its own first line on it. Until
  // now the two copies agreed by discipline: edit one, forget the other, and
  // nothing anywhere says so. One text, two compilers.
  const GLSL300 = '#version 300 es\n';
  const FS_BODY = `
    precision highp float;
    uniform float uT; uniform vec2 uRes; uniform sampler2D uPrev;
    uniform float uSeg; uniform float uFb; uniform float uScale; uniform float uWarp; uniform float uHue;
    out vec4 o;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(h(i), h(i + vec2(1,0)), f.x), mix(h(i + vec2(0,1)), h(i + vec2(1,1)), f.x), f.y); }
    void main(){
      vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
      float a = atan(uv.y, uv.x), r = length(uv), seg = 6.2831853 / uSeg;
      a = abs(mod(a + 0.5 * seg, seg) - 0.5 * seg);
      vec2 k = vec2(cos(a), sin(a)) * r;
      float w = n(k * uScale + uT * 0.3) + 0.5 * n(k * uScale * 2.0 - uT * 0.2) + 0.25 * n(k * uScale * 4.0 + uT * 0.5);
      vec2 dd = k + uWarp * vec2(cos(w * 6.2831), sin(w * 6.2831));
      vec3 c = 0.5 + 0.5 * cos(6.2831 * (w + vec3(0.0, 0.33, 0.67) * uHue) + uT);
      vec3 fb = texture(uPrev, dd * 0.9 + 0.5).rgb;
      o = vec4(mix(c, fb, uFb), 1.0); }`;
  const FS = GLSL300 + FS_BODY;

  /**
   * Other looks, on the SAME uniforms — so the three knobs keep meaning what
   * they say whichever one is running. A body that invented its own controls
   * would make the knobs lie, which is worse than not having the body.
   *
   * These are deliberately short. The point is not a shader library; it is that
   * a picture can be replaced while it is being watched, on two machines at
   * once, and you can see it happen.
   */
  const HEAD = `
    precision highp float;
    uniform float uT; uniform vec2 uRes; uniform sampler2D uPrev;
    uniform float uSeg; uniform float uFb; uniform float uScale; uniform float uWarp; uniform float uHue;
    out vec4 o;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    float n(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
      return mix(mix(h(i),h(i+vec2(1,0)),f.x), mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x), f.y); }
    vec2 fold(vec2 uv){ float a=atan(uv.y,uv.x), r=length(uv), seg=6.2831853/uSeg;
      a = abs(mod(a + 0.5*seg, seg) - 0.5*seg); return vec2(cos(a), sin(a))*r; }
  `;
  const LOOKS = [
    { name: 'kaleidoscope', body: FS_BODY },
    { name: 'rings', body: HEAD + `
      void main(){
        vec2 uv = (gl_FragCoord.xy - 0.5*uRes)/uRes.y;
        vec2 k = fold(uv);
        float r = length(k);
        float band = sin(r*uScale*6.0 - uT*1.4 + n(k*2.0)*6.2831*uWarp*4.0);
        vec3 c = 0.5 + 0.5*cos(6.2831*(r*1.4 + vec3(0.0,0.33,0.67)*uHue) + uT*0.5);
        c *= smoothstep(-0.2, 0.9, band);
        vec3 fb = texture(uPrev, k*0.94 + 0.5).rgb;
        o = vec4(mix(c, fb, uFb), 1.0); }` },
    { name: 'weave', body: HEAD + `
      void main(){
        vec2 uv = (gl_FragCoord.xy - 0.5*uRes)/uRes.y;
        vec2 k = fold(uv) * uScale;
        float g = sin(k.x*3.0 + uT) * sin(k.y*3.0 - uT*0.7);
        vec2 dd = fold(uv) + uWarp*vec2(sin(k.y*2.0+uT), cos(k.x*2.0-uT));
        vec3 c = 0.5 + 0.5*cos(6.2831*(g*0.5 + vec3(0.0,0.33,0.67)*uHue) + uT);
        vec3 fb = texture(uPrev, dd*0.9 + 0.5).rgb;
        o = vec4(mix(c*abs(g), fb, uFb), 1.0); }` },
    { name: 'drift', body: HEAD + `
      void main(){
        vec2 uv = (gl_FragCoord.xy - 0.5*uRes)/uRes.y;
        vec2 k = fold(uv);
        float w = n(k*uScale + uT*0.15) + 0.5*n(k*uScale*2.2 - uT*0.1);
        vec2 dd = k + uWarp*3.0*vec2(cos(w*6.2831), sin(w*6.2831));
        vec3 c = 0.5 + 0.5*cos(6.2831*(w*1.6 + vec3(0.0,0.4,0.8)*uHue) - uT*0.3);
        vec3 fb = texture(uPrev, dd*0.97 + 0.5).rgb;
        o = vec4(mix(c*0.8, fb, min(0.93, uFb+0.12)), 1.0); }` },
  ];
  let lookAt_ = 0;
  // Now that LOOKS exists, say which one is running. See the note by lookName.
  if (typeof lookName !== 'undefined' && lookName) lookName.textContent = LOOKS[0].name;

  const gl = local.c.getContext('webgl2', { antialias: false, preserveDrawingBuffer: false });
  let rendererName = null, localFps = 0, drewAny = 0;
  // ⚠️ LOCK THE LOCAL PICTURE TO THE BOARD'S FRAME NUMBER WHEN ONE IS ARRIVING.
  // Free-running, the two panes are the same shader counting from different
  // starts — the same family of shape in unrelated colours, which a viewer
  // reads as "these do not match" and which makes the page argue against
  // itself. The board's per-frame sequence number IS its frame counter, so
  // driving `uT` from it puts both panes on the same instant. Then anything
  // still visibly different between them is the PIPELINE, which is the thing
  // worth looking at.
  // (`lockedFrame` and `lockedAt` are declared with `chip`, above, because
  // `relabel` reads them while the panes are still being built.)

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function target() {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    for (const p of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER]) gl.texParameteri(gl.TEXTURE_2D, p, gl.LINEAR);
    for (const p of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T]) gl.texParameteri(gl.TEXTURE_2D, p, gl.CLAMP_TO_EDGE);
    const f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    return { t, f };
  }

  if (!gl) {
    local.p.append(el('div', 'none', 'this browser gave no WebGL2 context, so the left pane cannot be drawn here'));
    d.log('no WebGL2 context — the left pane is unavailable on this browser', 'bad');
    chip.here = 'no WebGL2';
    relabel('here');
  } else {
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    rendererName = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    // ⚠️ SAY WHICH RENDERER, ALWAYS. A visitor on a software rasteriser is a
    // real visitor, and a page that is quietly slow teaches nothing. It is also
    // what demo/verify-gl.mjs checks its own answer against.
    // ⚠️ THE RENDERER, ALWAYS, UNDER THE PICTURE IT DREW. A visitor on a
    // software rasteriser is a real visitor and a page that is quietly slow
    // teaches nothing; it is also what demo/verify-gl.mjs checks its own answer
    // against. It goes in the `here` bar because it is a fact about THAT pane —
    // the right-hand picture was drawn by a Raspberry Pi and this says nothing
    // about it.
    // ⚠️ NAME THE CHIP, NOT THE FIRST COMMA. Splitting
    // "ANGLE (Apple, ANGLE Metal Renderer: Apple M2 Pro, Unspecified Version)"
    // on its first comma leaves the word "Apple", which says nothing at all.
    // The part worth printing is what follows "Renderer:".
    const short = String(rendererName).match(/Renderer:\s*([^,)]+)/)?.[1]
      ?? String(rendererName).replace(/^ANGLE \(|\)$/g, '');
    chip.here = short.trim().slice(0, 32);
    relabel('here');

    /** One compiled picture, with its uniforms found once. */
    function makeProg(body) {
      const p = gl.createProgram();
      gl.attachShader(p, compile(gl.VERTEX_SHADER, VS));
      gl.attachShader(p, compile(gl.FRAGMENT_SHADER, GLSL300 + body));
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
      const g = (n) => gl.getUniformLocation(p, n);
      return { p, uT: g('uT'), uRes: g('uRes'), uPrev: g('uPrev'), uSeg: g('uSeg'),
               uFb: g('uFb'), uScale: g('uScale'), uWarp: g('uWarp'), uHue: g('uHue') };
    }
    // ⚠️ MIXING IS A THIRD PROGRAM, NOT A UNIFORM IN THE OTHER TWO. A crossfade
    // done with an `uAlpha` would only work on shaders that agreed to carry
    // one — and the whole point is to accept a body somebody just wrote. Two
    // pictures, drawn to their own targets, mixed by something that knows
    // nothing about either.
    const MIX_FS = GLSL300 + `
      precision highp float;
      uniform sampler2D uA, uB; uniform float uMix; uniform vec2 uRes;
      out vec4 o;
      void main(){ vec2 uv = gl_FragCoord.xy / uRes;
        o = vec4(mix(texture(uA, uv).rgb, texture(uB, uv).rgb, uMix), 1.0); }`;
    let mixP = null;
    const mixProg = () => (mixP ||= (() => {
      const p = gl.createProgram();
      gl.attachShader(p, compile(gl.VERTEX_SHADER, VS));
      gl.attachShader(p, compile(gl.FRAGMENT_SHADER, MIX_FS));
      gl.linkProgram(p);
      const g = (n) => gl.getUniformLocation(p, n);
      return { p, uA: g('uA'), uB: g('uB'), uMix: g('uMix'), uRes: g('uRes') };
    })());

    let cur = makeProg(FS_BODY), incoming = null, fadeFrom = 0;
    let tmpA = null, tmpB = null;
    const FADE_MS = 900;

    /**
     * ⚠️ DEFINED IN HERE, WHERE `makeProg` LIVES. It sat at module scope
     * reaching for `makeProg`, `tmpA` and `incoming` — all locals of this
     * block — so every call threw a ReferenceError that the catch below
     * dutifully reported as "the new look would not compile". A guard that
     * turns a scoping mistake into a plausible message about somebody else's
     * shader is worse than no guard: the harness read `FAIL … rings` and the
     * shader was fine.
     */
    window.__applyShader = function applyShader(body) {
      try {
        const next = makeProg(body);
        tmpA ||= target(); tmpB ||= target();
        incoming = next; fadeFrom = performance.now();
        d.log('a new look arrived — fading it in over 0.9 s');
        return true;
      } catch (e) {
        d.log(`the new look would not compile — keeping this one · ${String(e.message).slice(0, 80)}`, 'warn');
        return false;
      }
    };

    const prog = cur.p;
    gl.useProgram(prog);
    const { uT, uRes, uPrev, uSeg, uFb, uScale, uWarp, uHue } = cur;
    gl.bindVertexArray(gl.createVertexArray());
    // The feedback tap needs the same ping-pong the C does: two targets, swapped
    // every frame, with the previous one bound as the texture.
    let A = target(), B = target();
    let i = 0, tick = 0, lastAt = performance.now();
    // ⚠️ WHICH FRAMEBUFFER HOLDS THE FRAME THAT WAS JUST DRAWN. Reading pixels
    // without binding one reads whatever happens to be current, and with
    // `preserveDrawingBuffer: false` the default framebuffer is not readable
    // after the frame ends at all — so a check would sample an undefined
    // surface and report a flat field on a picture that is fine.
    window.__lastFbo = null;

    // ⚠️ ONE FRAME, AND A SCHEDULER THAT IS NOT PART OF IT. Inside a headset
    // this page's own requestAnimationFrame stops being the clock — the session
    // has its own, at the headset's rate — so the thing that draws a frame has
    // to be callable from either. It was one function with its own
    // `requestAnimationFrame` at the bottom, which meant the left-hand picture
    // simply froze the moment a session started, and a frozen picture on a
    // panel reads as a broken stream rather than as a stopped loop.
    const step = () => {
      gl.bindFramebuffer(gl.FRAMEBUFFER, B.f);
      gl.viewport(0, 0, W, H);
      // ⚠️ A LOCK WITH NO TIMEOUT FREEZES THE THING IT LOCKED. When the box
      // stops sending — it died, the stream ended, the socket dropped without a
      // `video.stopped` — the counter stops advancing and this pane stops with
      // it. Both pictures then appear dead and only one of them actually is,
      // which is the page failing at the exact moment it should be showing that
      // the local one needs nobody. Unlock after a second of silence.
      if (lockedFrame !== null && performance.now() - lockedAt > 1000) {
        lockedFrame = null;
        i = Math.max(i, 1);
        relabel('here');
        d.log('the box stopped sending — this pane is free-running again', 'warn');
        stat('box', { fps: null, kbit: null });
      }
      const tNow = (lockedFrame ?? i) / 30;
      const paint = (pr, fbo) => {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.viewport(0, 0, W, H);
        gl.useProgram(pr.p);
        gl.uniform1f(pr.uT, tNow);
        gl.uniform2f(pr.uRes, W, H);
        gl.uniform1f(pr.uSeg, P.mirrors);
        gl.uniform1f(pr.uFb, 0.78);
        gl.uniform1f(pr.uScale, P.grain);
        gl.uniform1f(pr.uWarp, 0.08);
        gl.uniform1f(pr.uHue, P.hue);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, A.t);
        gl.uniform1i(pr.uPrev, 0);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      };

      if (!incoming) {
        paint(cur, B.f);
      } else {
        // ⚠️ THE MIXED RESULT IS WHAT FEEDS BACK, not either half. This shader
        // reads its own previous frame; feeding it one arm of a crossfade would
        // make the trail disagree with the picture and the fade would look like
        // a glitch rather than a dissolve.
        const k = Math.min(1, (performance.now() - fadeFrom) / FADE_MS);
        paint(cur, tmpA.f);
        paint(incoming, tmpB.f);
        const M = mixProg();
        gl.bindFramebuffer(gl.FRAMEBUFFER, B.f);
        gl.viewport(0, 0, W, H);
        gl.useProgram(M.p);
        gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tmpA.t); gl.uniform1i(M.uA, 0);
        gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, tmpB.t); gl.uniform1i(M.uB, 1);
        gl.uniform1f(M.uMix, k * k * (3 - 2 * k));        // smoothstep, so it eases
        gl.uniform2f(M.uRes, W, H);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.activeTexture(gl.TEXTURE0);
        if (k >= 1) { cur = incoming; incoming = null; d.log('the new look is now the look', 'ok'); }
      }
      // Blit to the canvas so it is visible, then swap.
      gl.bindFramebuffer(gl.READ_FRAMEBUFFER, B.f);
      gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
      gl.blitFramebuffer(0, 0, W, H, 0, 0, W, H, gl.COLOR_BUFFER_BIT, gl.NEAREST);
      window.__lastFbo = B.f;          // before the swap: B is what was just drawn
      [A, B] = [B, A];
      i++; tick++; drewAny++;
      const now = performance.now();
      if (now - lastAt >= 1000) { localFps = tick * 1000 / (now - lastAt); tick = 0; lastAt = now; stat('here', { fps: localFps }); }
      // The panel, in the same turn as the frame it is copying — see drawPanel.
      if (wantPanel) drawPanel();
    };
    const loop = () => { flatRaf = requestAnimationFrame(loop); step(); };
    mirrorStep = step;
    startFlat = () => { if (!flatRaf) flatRaf = requestAnimationFrame(loop); };
    stopFlat = () => { if (flatRaf) { cancelAnimationFrame(flatRaf); flatRaf = 0; } };
    startFlat();
  }

  // ── the same panel, in a headset ─────────────────────────────────────────
  //
  // 🔴 THE SESSION ITSELF IS demo/shell/xr-panel.mjs, NOT THIS PAGE. Getting
  // into an immersive session is the most expensive code in this repo to get
  // right — five separate defects, every one of them found by a real Quest and
  // every one of them silent from outside — so it lives in one module and this
  // page hands it a canvas and a way to keep that canvas up to date. The rules
  // it holds are listed at the top of that file.
  xr = createXRPanels({
    // 1.28 m across at 1.6 m in front of you: about 44 degrees, which is wide
    // enough to read without moving and narrow enough to turn away from. Being
    // able to turn away from it is the whole of the gaze-gating in
    // `plan-xr-room.md` §2, so the panel is placed in the room rather than
    // pinned to your face.
    panels: [{ canvas: panel.canvas, w: 1.28, h: 0.80 }],
    // 🔴 AND IT HANGS IN A ROOM, NOT IN NOTHING. The same seed `scene` opens
    // with, through the same module, so this is that room rather than one like
    // it — a floor and walls marked out in dots, and the dots move onto YOUR
    // floor and YOUR walls where the headset will report them. A panel in a
    // black void has no scale to be judged against and no floor to stand on,
    // and it reads as a rectangle rather than as a screen in a place.
    room: { seed: 424242 },
    log: (m, k) => d.log(m, k),
    // ⚠️ THIS PAGE'S OWN LOOP IS THE THING THAT STOPS. Inside a session the
    // headset owns the clock, so the shader is stepped from here — without it
    // the panel would carry the last frame drawn before the session started,
    // which is a frozen picture and reads as a broken stream.
    onFrame: () => { mirrorStep?.(); drawPanel(); },
    onEnd: () => { startFlat(); },
  });
  // ⚠️ THE LIVE OBJECT, NOT A SNAPSHOT OF IT. `state` is written in place every
  // frame, so a harness reading `__demo.xr.fps` gets this frame's number rather
  // than whatever was true the last time somebody remembered to publish. Two
  // copies that can disagree is how a readout ends up describing something the
  // page is not doing.
  window.__demo.xr = xr.state;

  d.on('xr', async () => {
    // ⚠️ WAIT FOR THE PROBE, NEVER RE-ASK IT. Whether this browser can show an
    // immersive session is answered once at load, away from any gesture,
    // because asking again here can spend the user activation `requestSession`
    // needs. On a very fast press the answer may not be back yet, and a bounded
    // wait is the difference between "we have not looked" and "there is none".
    for (let i = 0; i < 20 && xr.supported() === null; i++) await new Promise((r) => setTimeout(r, 50));
    let got = false;
    try {
      got = await xr.enter();
      // One clock at a time. Both loops calling `step` would draw this page's
      // picture twice per headset frame and report double the frame rate.
      if (got) stopFlat();
    } catch (e) {
      // ⚠️ A LAST NET, ON THE BEACON. Every await inside the module is guarded,
      // but the failure that cost two headset runs was a plain synchronous
      // statement between the guarded parts — and a handler whose failure mode
      // is silence cannot be trusted to its own internal care. The batched
      // shipper is no use here: entering a session is exactly when timers stop
      // being generous.
      beacon(`FAIL enter() — ${e.name}: ${e.message}`);
      d.log(`entering failed — ${e.name}: ${e.message}`, 'bad');
      try { await xr.end(); } catch { /* it may never have started */ }
      startFlat();
    }

    // Both branches are real and both are asserted. Only a headset can reach
    // the first, which is why nothing on a laptop grades the part of this that
    // matters — see the note in runChecks.
    d.assert('it knows whether a headset can show this page',
      xr.supported() === true || xr.supported() === false,
      `a headset that can show this: ${xr.supported()}`);

    // ⚠️ THE ROOM IS ARITHMETIC, SO A LAPTOP CAN GRADE IT. The panel's frame
    // rate needs a headset and nothing here can change that — but whether the
    // room was built at all, and whether the page can SAY where the dotted
    // floor came from, are answerable on this machine. Leaving both to the
    // device would mean the only test of the new half runs where nothing is
    // watching. Both run on every branch, headset or not.
    const R = xr.state.room;
    d.assert('the panel hangs in a room, and the room is a real document',
      !!R?.on && R.things > 0, R?.on ? `seed ${R.seed}, ${R.things} things` : 'no room — the panel would hang in nothing');
    // 🔴 "NO SURFACES" MUST NEVER BE DRAWN AS "NO WALLS". Real room data is
    // optional and it does not gate the grid: with none, the dots go on the
    // page's own floor and the page has to SAY that is what they are. The
    // sentence is the assert, because a grid nobody can attribute is a picture
    // claiming to be a measurement.
    d.assert('and it says whose floor the dotted grid is on',
      typeof R?.note === 'string' && R.note.length > 10
      && ['not asked', 'waiting', 'refused', 'unreadable', 'none', 'yours'].includes(R.surfaces),
      `${R?.surfaces} · ${R?.note}`);
    // 🔴 THE CONTROLLER INTERFACE IS THE ROOM'S, NOT THIS PAGE'S, AND IT HAS NO
    // SESSION MODE IN IT. The same stand-ins, the same beam off the right
    // hand's target ray, the same tablet on the left with the same slider — out
    // of the same two modules `scene` uses, so there is no second copy here to
    // drift. The string is the one both pages beacon on their first headset
    // frame, which is how two runs in two modes are compared without a third.
    d.assert('the controllers and the tablet describe themselves without naming a kind of session',
      typeof xr.state.ui === 'string' && xr.state.ui.includes('control(s)')
      && !/\b(vr|ar|immersive|passthrough|opaque)\b/i.test(xr.state.ui),
      xr.state.ui);

    if (got) {
      // ⚠️ A BOUNDED WAIT FOR A SECOND OF FRAMES, not for the first one. The
      // frame rate is counted over a one-second window, and the FIRST of those
      // seconds contains the shader compiling and the panel's first, largest
      // copy to the graphics card — so a rate read at the first frame is a
      // number about starting up rather than about running. It is bounded
      // because a session that never draws must report that, not hang here.
      for (let i = 0; i < 40 && (xr.state.fps == null || xr.state.frames < 60); i++) {
        await new Promise((r) => setTimeout(r, 100));
      }
      const fps = xr.state.fps == null ? null : xr.state.fps.toFixed(1);
      d.assert('the panel is in the headset and frames are going into it',
        xr.state.frames > 0 && !!xr.state.fb,
        xr.state.fb
          ? `${xr.state.fb.w}x${xr.state.fb.h}, ${xr.state.eye.w}x${xr.state.eye.h} an eye, ${xr.state.frames} frames`
          : 'nothing drew');
      // 🔴 THE NUMBER `plan-xr-room.md` §4.1 EXISTS TO GET: a Quest 3 holds 89.8
      // frames a second in an empty room, and what one panel's worth of picture
      // costs against that is the open question the rest of the room depends on.
      //
      // ⚠️ GRADED AGAINST WHAT THIS HEADSET PROMISES, NEVER AGAINST A TYPED
      // NUMBER. A fixed floor of 60 was tried and it flapped on the first thing
      // that ran at 60 — a threshold sitting exactly on a plausible refresh rate
      // has no warning left in it. Where the headset says what it runs at, nine
      // tenths of that is the floor; where it will not say — and a Quest 3 does
      // not — 55 is a stall detector and the detail says so, because a number
      // whose basis is invisible cannot be argued with.
      const promised = xr.state.frameRate
        ?? (xr.state.supportedFrameRates?.length ? Math.max(...xr.state.supportedFrameRates) : null);
      d.assert('and it holds the rate this headset promises, with the picture on it',
        xr.state.fps != null && xr.state.fps >= (promised ? promised * 0.9 : 55),
        `${fps ?? 'no rate measured'} a second against ${promised ? `${promised} promised` : 'a headset that will not say what it runs at, so 55 is only a stall floor'}`
        + ` · the copy to the card costs ${xr.state.uploadCpuMs == null ? '—' : xr.state.uploadCpuMs.toFixed(2)} ms of processor time, worst ${xr.state.uploadWorstMs == null ? '—' : xr.state.uploadWorstMs.toFixed(2)} ms`);
      // ⚠️ ASSERT ON THE ERROR FLAG. A page will draw a right-looking picture
      // with an error pending — a Quest did exactly that, for an attribute
      // binding made one call too late, and nobody would have seen it by
      // looking.
      d.assert('and it drew with no graphics error pending',
        xr.state.glError === 0,
        xr.state.glError === 0 ? 'clean' : `error ${xr.state.glError}`);
    } else if (xr.supported() === true) {
      // 🔴 A HEADSET THAT REFUSED IS NOT A LAPTOP, and the assert below would
      // have said it was. "There is no headset here" and "there is one and it
      // would not start" are opposite conclusions and they were reading as the
      // same pass — the same collapse as a blank cell meaning both "we did not
      // look" and "we looked and it was fine". The line above says which step
      // did not come back; this says that it is a failure.
      d.assert('a headset is here, so the session has to start', false,
        'it did not — the line above says which step never came back');
    } else {
      d.assert('with no headset it says so and keeps drawing here',
        !xr.state.presenting && (drewAny > 0 || !gl),
        `a headset that can show this: ${xr.supported()} · ${drewAny} frames drawn here`);
    }
  });

  // ── the picture, from the board ──────────────────────────────────────────
  //
  // ⚠️ A SECOND SOCKET, TO `<room>-video`. The relay allows 60 messages a
  // second per socket and the box's audio is already 50 of them; thirty video
  // frames on the same socket would be 80 against a cap of 60 and the bucket
  // drops the excess with no error at all. It also keeps the binary framing
  // unambiguous — every other page here reads a binary frame as PCM.
  const FROM = `mir-${randomId(6)}`;
  let seq = 0;
  const ctl = new WebSocket(`${RELAY_BASE}/room/${ROOM}/ws`);
  const send = (m) => { const id = randomId(); ctl.send(format(m, { from: FROM, seq: seq++, id })); return id; };
  ctl.onopen = () => { d.log(`asking ${ROOM} what it can draw`); send({ type: 'video.status' }); };
  ctl.onmessage = (e) => {
    if (typeof e.data !== 'string') return;
    const { kind, msg } = parse(e.data);
    if (kind !== 'json' || msg.from === FROM) return;
    // ⚠️ THE SAME BODY GOES TO BOTH ENDS. This page compiles it as 300 es and
    // forwards it untouched to the board, which compiles it as 310 es — so the
    // demo's claim ("the same shader, two GPUs") becomes literally one text
    // rather than two copies kept in step by hand.
    if (msg.type === 'dev.shader' && typeof msg.body === 'string') {
      const okHere = window.__applyShader(msg.body);
      if (okHere && msg.toBox !== false) {
        send({ type: 'video.shader', body: msg.body });
        d.log('sent the same body to the box');
      }
      return;
    }
    if (msg.type === 'video.shader.applied') {
      d.log(msg.ok ? 'the box took the new look too' : `the box refused it — ${msg.reason}`, msg.ok ? 'ok' : 'warn');
      return;
    }
    if (msg.type === 'video.started') {
      if (!msg.ok) {
        // `video.status` answers this when nothing is running, which is not a
        // fault — it is the cue to ask. Anything else is worth a line.
        if (/no picture running/.test(msg.reason || '')) { askForPicture(); return; }
        d.log(`the box is not drawing — ${msg.reason}`, msg.available === false ? 'bad' : 'warn');

        return;
      }
      d.log(`the box is drawing ${msg.w}x${msg.h} at ${msg.fps} — ${(msg.bitrate / 1000).toFixed(0)} kbit/s`, 'hi');
      // The box names its GPU the same way this page names yours. It arrives on
      // the second status at the latest, because the renderer prints it on its
      // own first line and the reply may be composed before that lands.
      if (msg.renderer) { chip.box = msg.renderer; relabel('box'); }
      // ⚠️ TELL THE BOX WHAT THIS PAGE IS SET TO. The knobs only sent on a
      // press, so at load the page rendered its own defaults and the box
      // rendered ITS defaults — and the two agreed only because the numbers
      // happened to be the same on both sides. Changing one of them anywhere
      // would have made the panes quietly disagree, which is the one thing this
      // page must never do. Sent on every start, so a box that restarted comes
      // back matching whatever is on screen.
      send({ type: 'video.params', ...P });
      // ⚠️ DO NOT REOPEN A STREAM THAT IS ALREADY OPEN. Every client's
      // `video.status` is answered to the whole room, so a second visitor's
      // question tore this one's decoder down and built it again — which showed
      // up as a bar reading "not arriving" next to a live frame rate.
      if (!vws) openVideo(msg.room, msg);
    }
    if (msg.type === 'video.stopped') { d.log(`the box stopped after ${msg.frames ?? 0} frames`); closeVideo(); }
  };
  // ⚠️ ASK ON CONNECT, NOT ON A PRESS. A page whose first act is asking you to
  // press something shows you nothing; and the box stops on its own when the
  // room empties, so nobody has to remember to switch it off.
  function askForPicture() {
    d.log('asking the box to draw…', 'hi');
    send({ type: 'video.start', w: 1280, h: 720, fps: 30 });
  }

  /**
   * Ask again, slowly, for as long as the page is open.
   *
   * ⚠️ Every five seconds and NOT faster: the thing being asked is a Raspberry
   * Pi with one hardware encoder, and a page that retries hard is a page that
   * queues work on a device which blocks rather than fails. Five seconds is
   * slow enough to be polite and quick enough that someone switching the box on
   * sees the picture without reloading.
   */
  let retry = null;
  function scheduleRetry() {
    if (retry) return;
    retry = setInterval(() => {
      if (vws) { clearInterval(retry); retry = null; return; }
      send({ type: 'video.status' });
    }, 5000);
    retry.unref?.();
  }

  let vws = null, decoder = null, farFps = 0, farBytes = 0, farGaps = 0, farDecoded = 0, waitingForKey = true;
  // ⚠️ SAY THAT SOMEBODY IS WATCHING, so the box can stop when nobody is. It
  // cannot tell from its side: the relay reported seven sockets in the video
  // room while nothing was watching, because a test run that exits without a
  // clean close leaves one behind. `document.hidden` is checked because a tab
  // in the background is not a viewer either, and a socket count could never
  // have seen that.
  setInterval(() => {
    if (vws && !document.hidden) send({ type: 'video.watching' });
  }, 10000);
  const fctx = far.c.getContext('2d');

  function closeVideo() {
    try { vws?.close(); } catch { /* already */ }
    try { decoder?.close(); } catch { /* already */ }
    vws = null; decoder = null;
    // Back to free-running, and SAY SO. A pane that silently stopped being
    // locked would be two different claims wearing one label.
    lockedFrame = null;
    relabel('here');
    // ⚠️ NO `note` HERE EITHER. The bar stopped rendering it when the renderer
    // name moved to the label, but the write stayed — so `__demo.panes.box`
    // carried "not arriving" beside a live 27.7 fps. Nothing on screen showed
    // it, which is worse: the machine surface and the picture disagreed and
    // only a harness would ever have noticed.
    stat('box', { fps: null, kbit: null });
    // ⚠️ "Waiting…" HAS TO BE TRUE. Saying it and then doing nothing is the
    // worst of both: a reader waits for something nobody is asking for. The
    // page re-asks, and the word is a promise it keeps.
    farNone.textContent = 'Waiting…';
    scheduleRetry();
    far.p.append(farNone);
  }

  function openVideo(room, info) {
    closeVideo();
    if (typeof VideoDecoder !== 'function') {
      farNone.textContent = 'this browser has no WebCodecs, so the box’s picture cannot be decoded here';
      d.log('no WebCodecs — the right pane is unavailable on this browser', 'bad');
      return;
    }
    waitingForKey = true; farDecoded = 0; farGaps = 0; farBytes = 0;
    decoder = new VideoDecoder({
      output: (vf) => {
        if (far.c.width !== vf.displayWidth) { far.c.width = vf.displayWidth; far.c.height = vf.displayHeight; }
        fctx.drawImage(vf, 0, 0);
        vf.close();
        farDecoded++;
        farNone.remove();

      },
      error: (e) => d.log(`decode error — ${String(e.message ?? e).slice(0, 80)}`, 'bad'),
    });
    decoder.configure({ codec: info.codec ?? 'avc1.42E01E', optimizeForLatency: true });

    vws = new WebSocket(`${RELAY_BASE}/room/${room}/ws`);
    vws.binaryType = 'arraybuffer';
    let last = -1, tick = 0, at = performance.now();
    vws.onmessage = (e) => {
      if (typeof e.data === 'string') return;
      const dv = new DataView(e.data);
      const s = dv.getUint32(0, true), key = (dv.getUint32(4, true) & 1) === 1;
      // ⚠️ THE COUNTER IS IN THE PAYLOAD BECAUSE A BINARY FRAME HAS NO
      // ENVELOPE, and the relay drops frames with no error, no close and no
      // backpressure. Measured: at 8 Mbit/s it lost 101 of 361 frames and
      // nothing else on the path said so. This cell is the only witness.
      if (last >= 0 && s > last + 1) { farGaps += s - last - 1; stat('box', { lost: farGaps }); }
      last = s;
      // The board's sequence number is its frame counter — see the comment at
      // `lockedFrame`. Taken here, before the decode, because a frame the
      // decoder refuses is still a frame the board drew.
      const wasFree = lockedFrame === null;
      lockedFrame = s; lockedAt = performance.now();
      if (wasFree) relabel('here');
      farBytes += e.data.byteLength;
      // ⚠️ A DECODER MUST START ON A KEYFRAME. Feeding it a delta frame first
      // is an error it reports once and then stays broken through, so a joiner
      // waits — up to one second at this GOP, which is a GOP choice and not a
      // fault.
      if (waitingForKey) { if (!key) return; waitingForKey = false; d.log('keyframe — the box’s picture starts here'); }
      try {
        decoder.decode(new EncodedVideoChunk({
          type: key ? 'key' : 'delta',
          timestamp: s * 1e6 / (info.fps ?? 30),
          data: new Uint8Array(e.data, 8),
        }));
      } catch (err) { d.log(`chunk refused — ${String(err.message ?? err).slice(0, 70)}`, 'bad'); }
      tick++;
      const now = performance.now();
      if (now - at >= 1000) {
        farFps = tick * 1000 / (now - at);
        stat('box', { fps: farFps, kbit: farBytes * 8 / (now - at), lost: farGaps });
        tick = 0; at = now; farBytes = 0;
      }
    };
    vws.onclose = () => d.log('the box’s video socket closed');
  }

  // ── what a harness can check ─────────────────────────────────────────────
  // The renderer goes on `__demo` directly, because demo/verify-gl.mjs asserts
  // the page's own answer against what it found itself — two ends disagreeing
  // about which context they are looking at is worth catching.
  window.__demo.gl = { renderer: rendererName, ok: !!gl };
  /**
   * ⚠️ THE CHECKS RUN THEMSELVES, because the controls are gone.
   *
   * This project's usual hook is a button the harness presses — "a control the
   * harness cannot press is a subject the suite cannot reach". With no controls
   * the same rule points the other way: the page must reach its own checks, and
   * demo/verify-gl.mjs waits for `__demo.ready` instead of pressing anything.
   *
   * It waits for the box before running, but only for a bounded time: a page
   * whose asserts never fire because a Raspberry Pi is switched off reads as
   * broken, and the left-hand pane is a claim that stands on its own.
   */
  async function runChecks() {
      // ⚠️ THE LOCAL PANE IS ASSERTED WITHOUT THE BOARD, ON PURPOSE. It is a
      // pure function of (parameters, clock) and needs no network at all —
      // which is the claim the page exists to make. Tying its asserts to a
      // Raspberry Pi being switched on would make the page read red for a
      // reason that is not about the page.
      d.assert('a real WebGL2 context, not a fallback', !!gl, rendererName ?? 'none');
      d.assert('the shader compiled and linked', drewAny > 0, `${drewAny} frames drawn`);
      await new Promise((r) => setTimeout(r, 1200));
      d.assert('it keeps drawing', drewAny > 30, `${drewAny} frames`);
      d.assert('and it reports a real frame rate', localFps > 5, `${localFps.toFixed(1)} fps`);
      // ⚠️ THE PICTURE IS NOT A FLAT FIELD. A shader that compiles, links and
      // draws can still be producing one colour — "it rendered" and "there is
      // something in it" are different claims and only the second is the one
      // anybody cares about.
      //
      // ⚠️ AND IT IS READ OVER THE WHOLE FRAME, NOT AT FOUR POINTS. Four points
      // read `5 of 765` on a picture whose true range is 26..254 — because this
      // image is EIGHT-FOLD SYMMETRIC and radial, so any two samples at similar
      // radius are similar BY CONSTRUCTION. The assert was measuring the
      // symmetry of the thing it was checking, and it failed a working page.
      // A whole frame at this size is 900 KB and reads in a millisecond.
      let spread = 0;
      if (gl && window.__lastFbo) {
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, window.__lastFbo);
        const px = new Uint8Array(W * H * 4);
        gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
        // ⚠️ PER CHANNEL, NOT THE SUM — AND THE SUM IS THE ONE STATISTIC THAT
        // CANNOT SEE THIS PICTURE. The colour is
        // `0.5 + 0.5*cos(2pi*(w + vec3(0, 0.33, 0.67)) + uT)`: three cosines
        // about 120 degrees apart, and three cosines 120 degrees apart SUM TO A
        // CONSTANT. So the image varies almost entirely in HUE at near-constant
        // total luminance — measured, R+G+B spans 377..386 of 765 while red
        // alone spans 26..254. A luminance check reported a flat field on a
        // vivid kaleidoscope and failed a page that was perfectly fine, twice.
        const lo = [255, 255, 255], hi = [0, 0, 0];
        for (let i = 0; i < px.length; i += 4) {
          for (let k = 0; k < 3; k++) {
            const v = px[i + k];
            if (v < lo[k]) lo[k] = v;
            if (v > hi[k]) hi[k] = v;
          }
        }
        spread = Math.max(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]);
      }
      // ⚠️ NOT A PIXEL COMPARISON AGAINST A GOLDEN IMAGE. The same shader with
      // identical inputs summed 48,147,330 of red on ANGLE Metal and 68,001,881
      // on SwiftShader — 41% apart — because the standard GLSL hash amplifies
      // last-bit float differences into unrelated noise. Structure is portable;
      // exact pixels are not.
      d.assert('there is a picture in it, not a flat field', spread > 60,
               `the widest colour channel spans ${spread} of 255`);

      // ── the panel, graded on a laptop ───────────────────────────────────
      //
      // ⚠️ THE HALF THAT DOES NOT NEED A HEADSET IS GRADED WITHOUT ONE. That
      // the picture lands on the panel and that the numbers are under it is
      // ordinary code and can be checked here; what only a Quest can say — the
      // frame rate it holds in a 3360x1760 framebuffer — is asserted by the
      // control above and by nothing on this machine. Leaving all of it to the
      // device would mean the only test of it runs where nobody is watching.
      wantPanel = true;
      await new Promise((r) => setTimeout(r, 300));
      wantPanel = false;
      // With no local renderer there is no frame callback to ride on, so draw
      // it once directly rather than reporting an absent panel as a broken one.
      if (!panelDrawn) drawPanel();
      let picSpread = 0, footInk = 0;
      try {
        const sc = panel.canvas.width / PANEL_W;          // device pixels per unit
        // ⚠️ THE BOTTOM OF THE PICTURE, NOT ALL OF IT — and that is the same
        // mistake this page already made once. panel.mjs writes the title in
        // near-white at the top left and its "nothing arriving yet" line across
        // the middle, so a spread taken over the whole picture area would be
        // measuring the TEXT and would pass just as well with no picture at
        // all. A statistic that is high by construction over your subject is
        // blind, not weak.
        const pic = panel.ctx.getImageData(60 * sc, 200 * sc, 520 * sc, 130 * sc).data;
        const lo = [255, 255, 255], hi = [0, 0, 0];
        for (let i = 0; i < pic.length; i += 4) {
          for (let k = 0; k < 3; k++) {
            const v = pic[i + k];
            if (v < lo[k]) lo[k] = v;
            if (v > hi[k]) hi[k] = v;
          }
        }
        picSpread = Math.max(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]);
        // And the footer strip really has ink in it: the numbers are half of
        // what a panel is for, and a panel with a picture and no numbers is a
        // decoration.
        const foot = panel.ctx.getImageData(14 * sc, 346 * sc, (PANEL_W - 28) * sc, 40 * sc).data;
        for (let i = 0; i < foot.length; i += 4) {
          if (foot[i] > 90 || foot[i + 1] > 90 || foot[i + 2] > 90) footInk++;
        }
      } catch (e) { d.log(`the panel could not be read — ${String(e.message).slice(0, 60)}`, 'warn'); }
      d.assert('the panel carries this picture with its numbers under it',
        picSpread > 30 && footInk > 200,
        `the widest colour channel spans ${picSpread} of 255 · ${footInk} lit pixels in the footer`);
      // The far pane, only if the board answered. A lane with nothing to say
      // says so in words rather than counting as a failure.
      if (farDecoded > 0) {
        d.assert('the box’s picture decoded here', farDecoded > 5, `${farDecoded} frames`);
        d.assert('and arrived without the relay dropping any', farGaps === 0, `${farGaps} lost`);
      } else {
        d.log('box not sending — right pane has nothing to report', 'warn');
      }
      d.ready();
  }
  (async () => {
    for (let i = 0; i < 30 && farDecoded === 0; i++) await new Promise((r) => setTimeout(r, 400));
    if (farDecoded === 0) d.log('the box did not send in 12 s — checking the left pane only', 'warn');
    runChecks();
  })();

  // ⚠️ ARRIVED FROM THE INDEX WITH `?xr=1` — put the one press that matters
  // under the hand. A link CANNOT enter VR: WebXR needs a transient user
  // activation, so the button still has to be pressed. This only means you do
  // not have to find it, which through a headset is most of the work.
  if (new URLSearchParams(location.search).has('xr')) {
    const b = d.button('xr');
    if (b) { b.scrollIntoView({ block: 'center' }); setTimeout(() => b.focus(), 60); }
  }
</script>
