<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* 🔴 A FIXED HEIGHT, BECAUSE THIS IS THE PART THAT CHANGES. `Fire ten` puts
     ten cues through here in a little over a second; a box that sizes itself
     to whatever name arrived would move the message list and the log under it
     each time. One line, never wrapped, never taller.
     It used to carry a second line under the name — `fired here · delivered in
     35.0 ms` — which is a page narrating its own state in a sentence. Both
     halves of it are columns in the list below, and the time is in a cell. */
  .zone {
    border: 1px solid var(--line); border-radius: 4px; background: var(--card);
    height: 96px; display: grid; place-items: center; overflow: hidden;
  }
  .zone .cue {
    font: 700 30px/1.1 var(--mono); color: var(--hi); letter-spacing: .02em;
    white-space: nowrap;
  }
  .zone .cue.idle { color: var(--dim2); font-size: 15px; font-weight: 500; }
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createMessageList } from '/shell/messages.mjs';

  const ROOM = new URLSearchParams(location.search).get('room') || 'cues-demo';
  const ID = Math.random().toString(36).slice(2, 8);
  const RELAY = `wss://ws.positron.studio/room/${ROOM}/ws`;

  const d = mount({
    name: 'cues',
    what: 'One press here and every open copy of this page shows the same cue '
        + 'name at the same moment. Press Fire a cue, or Fire ten to see them '
        + 'queue up, and open the page again in another tab to watch them '
        + 'arrive on both. Delivery is the middle of how long those cues took to '
        + 'get here and slowest is the worst, both timed from the stamp the '
        + 'sender put on it.',
    readout: { copies: '', arrived: '', delivery: 'ms', slowest: 'ms' },
    controls: [
      { id: 'fire', label: 'Fire a cue', primary: true },
      { id: 'burst', label: 'Fire ten' },
    ],
  });
  guard(d);

  const zone = el('div', 'zone');
  const big = el('div', 'cue idle', 'waiting for a cue');
  zone.append(big);
  d.el.append(zone);

  // The shared list (demo/shell/messages.mjs) — the same renderer `wire` uses,
  // with a column per thing you need to know about one message. It was a
  // hand-built `<p>` of `innerHTML` here, which is the third copy that file
  // exists to have prevented.
  const msgs = createMessageList({ cap: 40, empty: 'no cues yet', mark: 'mine' });
  d.el.append(msgs.el);

  let ws = null, seq = 0, fired = 0, received = 0;
  const peers = new Set();
  const times = [];

  function render() {
    d.set('copies', peers.size + 1);
    d.set('arrived', received || '');
    if (times.length) {
      const s = times.slice().sort((a, b) => a - b);
      d.set('delivery', s[Math.floor(s.length / 2)]);
      d.set('slowest', s[s.length - 1]);
    }
  }

  function connect() {
    ws = new WebSocket(RELAY);
    ws.onopen = () => { d.log(`joined ${ROOM} as ${ID}`, 'hi'); send({ type: 'hello' }); };
    ws.onclose = () => d.log('relay closed', 'bad');
    ws.onerror = () => d.log('relay error', 'bad');
    ws.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch { return; }
      if (m.from && m.from !== ID) peers.add(m.from);
      if (m.type === 'hello') { send({ type: 'here' }); render(); return; }
      if (m.type === 'here') { render(); return; }
      if (m.type === 'cue') {
        // THE SENDER STAMPS; the relay never re-stamps. So delivery time is
        // honest even though the relay has no idea what time it is.
        const deliveryMs = Date.now() - m.at;
        const mine = m.from === ID;
        received++;
        times.push(deliveryMs);
        big.className = 'cue';
        big.textContent = m.id;
        msgs.add({ dir: mine ? 'echo' : 'in', bytes: e.data.length, mark: mine,
                   text: `${m.id} · ${deliveryMs.toFixed(1)} ms`, hi: mine });
        render();
      }
    };
    addEventListener('pagehide', () => { try { ws.close(); } catch { /* gone */ } });
  }

  const send = (o) => { if (ws?.readyState === 1) ws.send(JSON.stringify({ ...o, from: ID })); };

  // The echo is the point: the relay sends every message back to the sender
  // too, so everyone — including whoever fired — sees the same order.
  const fire = () => send({ type: 'cue', id: `CUE-${String(++seq).padStart(2, '0')}-${ID}`, at: Date.now() });

  d.on('fire', () => { fired++; fire(); });
  // ⚠️ THE BURST IS SPREAD OVER 1.2 s, so the checks cannot run when the LOOP
  // ends — they would count a tenth of what was asked for. They run when the
  // last one has actually gone, which is the only moment the numbers they read
  // are the numbers this control made.
  d.on('burst', async () => {
    for (let i = 0; i < 10; i++) setTimeout(() => { fired++; fire(); }, i * 120);
    await new Promise((r) => setTimeout(r, 10 * 120 + 120));
    await d.run('check');
  });

  d.on('check', async () => {
    // a burst fired 120 ms apart can still have one in flight; drain before
    // asserting rather than calling a race a failure
    for (let i = 0; i < 20 && received < fired; i++) await new Promise((r) => setTimeout(r, 100));
    d.assert('relay open', ws?.readyState === 1, String(ws?.readyState));
    d.assert('no secret in this page', !location.href.includes('token') && !RELAY.includes('token'));
    d.assert('own cues echo back', received >= fired, `${received} received / ${fired} fired`);
    // THE LIST IS THE HISTORY, so it has to hold one row per cue that arrived
    // until its cap bites. Nothing asked it that while it was hand-built.
    d.assert('every cue that arrived is in the list', msgs.count() === Math.min(received, 40),
      `${msgs.count()} rows for ${received} cues`);
    // The big name is what a second copy of this page is looking at, so it
    // cannot be the placeholder once a cue has landed.
    d.assert('the cue name on show is the last one that arrived',
      received === 0 || (!big.classList.contains('idle') && big.textContent.startsWith('CUE-')),
      big.textContent);
    if (times.length) {
      const s = times.slice().sort((a, b) => a - b);
      const p50 = s[Math.floor(s.length / 2)];
      d.assert('delivery under 250 ms', p50 < 250, `middle ${p50.toFixed(1)} ms of ${times.length}, slowest ${s[s.length - 1].toFixed(1)} ms`);
    }
    d.log(`open this page twice to see cross-device delivery (?room=${ROOM})`);
  });

  connect();
  d.ready();
</script>
</html>
