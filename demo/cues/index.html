<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .zone {
    border: 1px solid var(--line); border-radius: 4px; background: var(--card);
    padding: 22px 16px; margin: 0 0 10px; text-align: center; min-height: 96px;
  }
  .zone .cue { font: 700 34px/1.1 var(--mono); color: var(--hi); letter-spacing: .02em; }
  .zone .cue.idle { color: var(--dim2); font-size: 15px; font-weight: 500; }
  .zone .meta { font: 400 11.5px/1.6 var(--mono); color: var(--dim); margin-top: 8px; }
  .rows { font: 400 11.5px/1.7 var(--mono); color: var(--dim); margin: 0; }
  .rows b { color: var(--fg); font-weight: 500; }
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';

  const ROOM = new URLSearchParams(location.search).get('room') || 'cues-demo';
  const ID = Math.random().toString(36).slice(2, 8);
  const RELAY = `wss://ws.positron.studio/room/${ROOM}/ws`;

  const d = mount({
    name: 'cues',
    what: 'Fire one cue; every open copy of this page acts on it. No token — the relay is tokenless.',
    readout: { peers: '', fired: '', rtt: 'ms', room: '' },
    controls: [
      { id: 'fire', label: 'Fire a cue', primary: true },
      { id: 'burst', label: 'Fire ten' },
      { id: 'check', label: 'Run the checks' },
    ],
  });
  guard(d);
  d.set('room', ROOM);

  const zone = el('div', 'zone');
  const big = el('div', 'cue idle', 'waiting for a cue');
  const meta = el('div', 'meta', '');
  zone.append(big, meta);
  d.el.append(zone);
  const rows = el('p', 'rows', '');
  d.el.append(rows);

  let ws = null, seq = 0, fired = 0, received = 0;
  const peers = new Set();
  const rtts = [];
  const log = [];

  function render() {
    d.set('peers', peers.size + 1);
    d.set('fired', received);
    if (rtts.length) {
      const s = rtts.slice().sort((a, b) => a - b);
      d.set('rtt', s[Math.floor(s.length / 2)]);
    }
    rows.innerHTML = log.slice(-6).reverse()
      .map((r) => `<b>${r.id}</b> ${r.from === ID ? 'mine' : `from ${r.from}`} · ${r.deliveryMs.toFixed(1)}ms`)
      .join('<br>');
  }

  function connect() {
    ws = new WebSocket(RELAY);
    ws.onopen = () => { d.log(`joined ${ROOM} as ${ID}`, 'hi'); send({ t: 'hello' }); };
    ws.onclose = () => d.log('relay closed', 'bad');
    ws.onerror = () => d.log('relay error', 'bad');
    ws.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch { return; }
      if (m.from && m.from !== ID) peers.add(m.from);
      if (m.t === 'hello') { send({ t: 'here' }); render(); return; }
      if (m.t === 'here') { render(); return; }
      if (m.t === 'cue') {
        // THE SENDER STAMPS; the relay never re-stamps. So delivery time is
        // honest even though the relay has no idea what time it is.
        const deliveryMs = Date.now() - m.at;
        received++;
        rtts.push(deliveryMs);
        log.push({ id: m.id, from: m.from, deliveryMs });
        big.className = 'cue';
        big.textContent = m.id;
        meta.textContent = `${m.from === ID ? 'fired here' : `from ${m.from}`} · delivered in ${deliveryMs.toFixed(1)} ms`;
        render();
      }
    };
    addEventListener('pagehide', () => { try { ws.close(); } catch { /* gone */ } });
  }

  const send = (o) => { if (ws?.readyState === 1) ws.send(JSON.stringify({ ...o, from: ID })); };

  // The echo is the point: the relay sends every message back to the sender
  // too, so everyone — including whoever fired — sees the same order.
  const fire = () => send({ t: 'cue', id: `CUE-${String(++seq).padStart(2, '0')}-${ID}`, at: Date.now() });

  d.on('fire', () => { fired++; fire(); });
  d.on('burst', () => { for (let i = 0; i < 10; i++) setTimeout(() => { fired++; fire(); }, i * 120); });

  d.on('check', async () => {
    // a burst fired 120 ms apart can still have one in flight; drain before
    // asserting rather than calling a race a failure
    for (let i = 0; i < 20 && received < fired; i++) await new Promise((r) => setTimeout(r, 100));
    d.assert('relay open', ws?.readyState === 1, String(ws?.readyState));
    d.assert('tokenless — no secret in this page', !location.href.includes('token') && !RELAY.includes('token'));
    d.assert('own cues echo back', received >= fired, `${received} received / ${fired} fired`);
    if (rtts.length) {
      const s = rtts.slice().sort((a, b) => a - b);
      const p50 = s[Math.floor(s.length / 2)];
      d.assert('delivery under 250 ms', p50 < 250, `p50 ${p50.toFixed(1)} ms over ${rtts.length}`);
    }
    d.log(`open this page twice to see cross-device delivery (?room=${ROOM})`);
  });

  connect();
  d.ready();
</script>
</html>
