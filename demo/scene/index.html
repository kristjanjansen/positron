<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .stage { position: relative; border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
           background: #05070b; margin: 0 0 12px; }
  .stage canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; }
  .badge { position: absolute; left: 10px; top: 10px; font: 500 11px/1.5 var(--mono);
           color: var(--dim); background: rgba(8,11,17,.72); border: 1px solid var(--line);
           border-radius: 4px; padding: 3px 8px; pointer-events: none; }
  .badge b { color: var(--hi); font-weight: 500; }
</style>

<script type="module">
  import { mount, guard, el, createShipper, BUILD } from '/shell/shell.mjs';
  import { docOf, validate as validate0 } from '/shell/seed.mjs';
  import { touchOf } from '/shell/xr-panel.mjs';
  import {
    createXRRoom, roomOf, spaced, clashes, radiusOf, r4, holdM,
    GAP, DROP_PASSES, FADE_MS, ROOM_OPTIONAL_FEATURES,
    perspective, lookAt,
  } from '/shell/xr-room.mjs';
  import { createXRHands, BUTTON, AXIS } from '/shell/xr-hands.mjs';
  import { createXRTablet, valueFromU, TABLET } from '/shell/xr-tablet.mjs';

  // ── the room is a module now ────────────────────────────────────────────
  // 🔴 THE PICTURE AND THE RULES ABOUT IT LIVE IN demo/shell/xr-room.mjs. The
  // generator places each thing without looking at the ones already there, so
  // two of them can occupy the same piece of space — MEASURED over 200 seeds,
  // 264 overlapping pairs of 46,440, the worst 0.615 m deep. The separation
  // rule, the ball it uses, the sky, the things and the per-eye loop all moved
  // there together, because `mirror` now stands in the same room and a rule
  // applied in one page is a rule missing from the other.
  //
  // What stayed here is what is about THIS page: the seed that crosses the
  // wire, the socket it crosses, the live-update tiers, picking things up, and
  // the sweep the negative control rolls.
  //
  // Rooms the negative control rolls to grade the rule across the seed space.
  // 64 of them is ~1,300 things and ~14,000 pair tests, which is a few ms.
  const SWEEP = 64;

  // ⚠️ ALIASED, NOT USED DIRECTLY. An imported binding cannot be reassigned, and
  // tier 3 of the update story replaces the generator while a session is live.
  // Every call below goes through these.
  // ⚠️ AND THE SEPARATION IS PART OF `world`, NOT OF THE CALLERS — `roomOf` is
  // the generator WITH the rule already on it. A rule applied at three call
  // sites is a rule missing from the fourth, and a generator swapped in live
  // over the wire would arrive without it, which is why the tier-3 handler
  // rebuilds the same wrapper rather than taking `mod.world` raw.
  let world = roomOf, validate = validate0;

  const ROOM = new URLSearchParams(location.search).get('room') || 'scene-demo';
  const RELAY = `wss://ws.positron.studio/room/${ROOM}/ws`;
  const ID = Math.random().toString(36).slice(2, 8);
  // The ceiling is a constant and the readout prints it FROM this constant.
  // A description that can disagree with the config is worse than none.
  const TO_FRAME_CEIL_MS = 120;

  // ── reporting from a device that has no cable in it ─────────────────────
  // 🔴 adb IS FOR GRADING, NOT FOR USING. Opening this page on a headset needs
  // nothing: positron.studio is HTTPS and the Quest Browser is Chromium. What
  // adb buys is the two things page script CANNOT see — the hardware, read with
  // `getprop` from outside the browser, and the compositor's own frame counter
  // from `logcat -s VrApi` — plus pressing the controls unattended.
  //
  // Everything else the device can say about itself, and this is the same route
  // the iPhone work already uses: POST the lines to pub.positron.studio and read
  // them from a laptop. So a headset with no cable can still report, and the one
  // claim it cannot make on its own is the one about its own hardware — which is
  // why the report says so in its own header rather than leaving it out.
  // ⚠️ ON BY DEFAULT WHEN THERE IS A HEADSET, AND ONLY THEN. Typing
  // `?report=1` on a virtual keyboard, in a headset, is exactly the kind of
  // friction that means a measurement never gets taken — and it was the only
  // way to turn this on. But defaulting it on for EVERYONE would POST a log
  // from every desktop visitor, which is somebody else's traffic in our
  // diagnostics and nobody's idea of consent.
  //
  // So it is capability-gated like everything else here: a browser that reports
  // `immersive-vr` is a browser someone is wearing, and that is the only case
  // where these lines are wanted. `?report=1` forces it on anywhere (the laptop,
  // for checking the shipper itself), `?report=0` forces it off.
  const REPORT_PARAM = new URLSearchParams(location.search).get('report');
  let ship = null;

  /**
   * A line that must arrive even if the event loop is about to be throttled.
   *
   * 🔴 THE BATCHED SHIPPER LOST EVERYTHING PAST `requestSession`. MEASURED on a
   * Quest 3: every flat assert arrived, then `pressed "Put it on your face"`,
   * then nothing at all — no session line, no error, no assert. createShipper
   * holds lines for 2 s before POSTing, and entering an immersive session is
   * exactly the moment a browser stops being generous with timers. So the
   * lines that say WHERE something hung cannot be the ones waiting on a timer.
   *
   * `sendBeacon` exists for this: the request is handed to the browser and
   * survives whatever the page does next.
   */
  const shipNow = (line) => {
    if (!ship) return;
    ship(line);
    try { navigator.sendBeacon?.('https://pub.positron.studio/log',
      new Blob([`${(performance.now() / 1000).toFixed(2)} ${line}`], { type: 'text/plain' })); } catch { /* diagnostics */ }
  };

  /** Is `navigator.xr` the browser's, or something installed over it? */
  function nativeXR() {
    if (!navigator.xr) return { native: false, why: 'no navigator.xr at all' };
    const proto = Object.getPrototypeOf(navigator.xr);
    const names = Object.getOwnPropertyNames(proto).filter((n) => n !== 'constructor');
    const fns = names
      .map((n) => Object.getOwnPropertyDescriptor(proto, n))
      .filter((dsc) => typeof dsc?.value === 'function')
      .map((dsc) => dsc.value);
    const faked = fns.filter((fn) => !/\{\s*\[native code\]\s*\}/.test(Function.prototype.toString.call(fn)));
    if (faked.length) return { native: false, why: `${faked.length} method(s) are JavaScript — something is installed over navigator.xr` };
    if (Object.prototype.hasOwnProperty.call(navigator, 'xr')) return { native: false, why: 'navigator owns `xr` as an own property' };
    return { native: true, why: `${proto.constructor?.name || 'XRSystem'} · ${fns.length} methods, all [native code]` };
  }

  const d = mount({
    name: 'scene',
    what: `A room built from one number. Roll it and you get somewhere to stand — how many things are in it, where they sit, how big they are and what colour they run: all of it comes out of a single seed, so the room is four bytes rather than a file, and rolling the same seed again rebuilds it exactly. The request goes out over the same socket every page here uses and the room only changes when it comes back, so the round trip below is the real distance between asking and seeing. One roll each run is deliberately impossible and the room refuses it, which is counted too — a check that has never said no has not been shown to work. Put a headset on and you are inside it, or put it in your own room and the things float in the space you are actually standing in. Your right hand gets a pointer and your left a small screen — a stand-in shape rather than a picture of your real controller — with a slider on it that fades the dotted floor and a Hold to leave button under it; the trigger picks a thing up or moves that slider, the thumbstick pushes what you are holding nearer or further, either the grip or holding that button drops you back out, and letting go sends the room to everyone else in it, once, rather than ninety times a second. Nothing is allowed to sit inside anything else or inside arm's reach of your head: the roll spaces the things out before you see them, a thing let go inside another is pushed back out along the line between their centres, and a thing that ends up in your face is moved away from it.`,
    readout: { seed: '', things: '', moved: '', 'to frame': 'ms', worst: 'ms', 'round trip': 'ms', refused: '', view: '' },
    controls: [
      { id: 'roll', label: 'Roll a room', primary: true },
      { id: 'again', label: 'Same seed again' },
      { id: 'enter', label: 'Run in VR' },
      { id: 'ar', label: 'Run in XR' },
      { id: 'bad', label: 'Try an impossible room' },
    ],
  });
  guard(d);

  const stage = el('div', 'stage');
  const canvas = el('canvas', null, null, { width: 960, height: 540 });
  const badge = el('div', 'badge');
  badge.innerHTML = 'window · <b>no headset yet</b>';
  stage.append(canvas, badge);
  d.el.append(stage);

  // ── the picture ─────────────────────────────────────────────────────────
  // WebGL2 and nothing else. `OCULUS_multiview` is on by default on Quest and
  // WebGPU inside an immersive session is behind a chrome://flags switch the
  // visitor would have to set, which makes it an R&D capability rather than a
  // deliverable (research/quest-xr §1.3). And no three.js: this repo has no
  // build step, and a 600 KB renderer to draw boxes would be the first
  // bundler-shaped dependency in it — the same argument plan-nodes §1.5 made
  // about importing a node editor.
  // 🔴 `alpha: true` IS WHAT MAKES PASSTHROUGH POSSIBLE AT ALL. In an
  // `immersive-ar` session the compositor puts the real room BEHIND whatever
  // this page draws, and it can only do that through transparent pixels — with
  // `alpha: false` the framebuffer has no alpha to clear to zero and the room
  // is replaced by black rather than composited under. The flat and VR paths
  // clear to opaque, so nothing else changes.
  const gl = canvas.getContext('webgl2', { antialias: true, alpha: true, xrCompatible: true });
  if (!gl) { d.log('no WebGL2 in this browser — there is nothing to draw with', 'bad'); }

  const compile = (t, src) => {
    const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const link = (vs, fs) => {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    // 🔴 BEFORE linkProgram, NOT AFTER. One VAO feeds every program here with
    // position at 0 and normal at 1, so they all have to agree on that — and
    // `bindAttribLocation` only takes effect at the NEXT link, so calling it
    // after linking is a no-op that reads like a fix. It was called after, on
    // one of the programs, and the Quest reported GL_INVALID_OPERATION (1282)
    // on its first frame for it. It drew anyway, because the linker happened to
    // pick the same slots — which is the worst kind of working.
    gl.bindAttribLocation(p, 0, 'aPos');
    gl.bindAttribLocation(p, 1, 'aNrm');
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  };

  const PANEL_VS = `#version 300 es
    in vec3 aPos; in vec3 aNrm;
    uniform mat4 uProj, uView, uModel; out vec2 vUv;
    void main(){ vUv = vec2(aPos.x + 0.5, 0.5 - aPos.y);
      gl_Position = uProj * uView * uModel * vec4(aPos, 1.0); }`;
  const PANEL_FS = `#version 300 es
    precision highp float;
    in vec2 vUv; uniform sampler2D uTex; uniform float uFade; out vec4 o;
    void main(){ vec4 t = texture(uTex, vUv); o = vec4(t.rgb, t.a * uFade); }`;

  let progPanel = null, quad = null;
  try { progPanel = link(PANEL_VS, PANEL_FS); }
  catch (e) { d.log(`shader: ${e.message}`, 'bad'); }

  function unitQuad() {
    const P = [-0.5,-0.5,0, 0.5,-0.5,0, 0.5,0.5,0, -0.5,-0.5,0, 0.5,0.5,0, -0.5,0.5,0];
    const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
    const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(P), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
    gl.bindVertexArray(null);
    return { vao, count: 6 };
  }
  /**
   * 🔴 THREE WAYS OUT OF A ROOM, AND ONE PLACE THAT SAYS WHICH ONE FIRED.
   *
   *   · the grip on either controller          — nothing has to be drawn for it
   *   · a dead-man's switch at 4 s             — nothing has to be held for it
   *   · "Hold to leave" on the tablet          — the one you can SEE
   *
   * The third is new and it ADDS to the other two rather than replacing them.
   * It cannot replace them: it is drawn on a tablet that only exists once a
   * grip pose has resolved, so it has two conditions in front of it, and an
   * exit with conditions is not an exit. What it buys is that the way out stops
   * being folklore — "any controller button except the trigger" is a thing you
   * have to be told, and a button with the words on it is not.
   *
   * ⚠️ AND THE LOG HAS TO NAME WHICH. Three exits that all print "session
   * ended" make a page that cannot tell you why it ended, which is the same
   * defect as the run where "the button was never pressed" and "the button
   * threw" were one observation. `leftBy` is set by whichever fired and read
   * once, in the `end` handler — including the case where NOTHING here fired,
   * which is its own answer rather than a blank.
   */
  let leftBy = null;
  const leaving = (why) => { leftBy = why; shipNow(`leaving · ${why}`); };
  // ⚠️ THE TABLET'S BUTTON DOES NOT COME THROUGH HERE. `xr-hands.mjs` ends the
  // session for it, because that module is handed the session every frame and
  // this page is not the only page with a tablet on it. This is the page's own
  // two, which the page has always owned.
  const leaveNow = (why) => {
    leaving(why);
    try { session?.end().catch(() => {}); } catch { /* it may already be going */ }
  };

  // 🔴 THE ROOM. Everything this page draws except its own status panel comes
  // out of here — and so does what `mirror` draws behind its video panel, which
  // is the whole reason it is a module. `say` is the BEACON, never the batched
  // shipper: the room's lines about your real floor arrive while a session is
  // starting, which is exactly when a 2 s timer stops being generous.
  let room = null, tablet = null, xrHands = null;
  if (gl) {
    quad = unitQuad();
    room = createXRRoom(gl, { log: (m, k) => d.log(m, k), say: shipNow });
    // ── the small screen on your left hand, and the controls on it ─────────
    // 🔴 THE CONTROLS ARE A LIST IN `xr-tablet.mjs`, NOT A THING THIS PAGE
    // BUILDS. Both pages that stand in this room get the same list, which is
    // the only way "the same interface in both kinds of session" survives
    // somebody adding a knob. `ctx` is what a control's `apply` is handed, so
    // nothing on the tablet reaches into the room, the session or this page.
    // ⚠️ `left` IS A NOTIFICATION, NOT THE ACTION. The way out is performed in
    // `xr-hands.mjs`; this is only how this page learns it was that one, so the
    // `end` handler below can say so instead of printing the same line for all
    // three. The label and the hold are read off the control rather than typed
    // here — a description that can disagree with its config is worse than none.
    tablet = createXRTablet({
      ctx: {
        room,
        left: () => {
          const c = TABLET.controls.find((x) => x.leaves);
          leaving(`the tablet's "${c?.label ?? 'way out'}", held the whole ${c?.hold ?? '?'} ms`);
        },
      },
    });
    room.setTablet(tablet);
    tablet.applyAll();          // the dots start where the slider says, not at a default
    // 🔴 ONE INPUT PATH, AND IT CANNOT TELL VR FROM AR. Every controller, the
    // pointer, the tablet and its slider come out of this one module, which has
    // no session mode in it at all — so the interface is identical in both
    // modes structurally rather than by two paths agreeing today.
    xrHands = createXRHands({ tablet, log: (m, k) => d.log(m, k), say: shipNow });
  }

  // ── the status panel: text drawn to a canvas, uploaded as a texture ─────
  // 🔴 THE 2D PAGE IS INVISIBLE INSIDE AN IMMERSIVE SESSION. `d.log` and the
  // readout are behind your face, so anything you need to READ while wearing
  // the headset has to be drawn in the scene. That is the whole reason this
  // exists, and it is why the update story needed it first.
  const panelCv = document.createElement('canvas');
  panelCv.width = 768; panelCv.height = 192;
  const pctx = panelCv.getContext('2d');
  let panelTex = null, panelText = '', panelUntil = 0;

  function setPanel(text, holdMs = 9000) {
    panelText = text; panelUntil = performance.now() + holdMs;
    pctx.clearRect(0, 0, 768, 192);
    pctx.fillStyle = 'rgba(8,11,17,.88)';
    pctx.roundRect?.(0, 0, 768, 192, 18); pctx.fill();
    pctx.strokeStyle = '#ffd400'; pctx.lineWidth = 3;
    pctx.beginPath(); pctx.moveTo(3, 18); pctx.lineTo(3, 174); pctx.stroke();
    pctx.fillStyle = '#e8edf5';
    pctx.font = '600 40px ui-monospace, SFMono-Regular, Menlo, monospace';
    const lines = String(text).split('\n').slice(0, 3);
    lines.forEach((l, i) => pctx.fillText(l.slice(0, 34), 34, 62 + i * 52));
    if (!panelTex) {
      panelTex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, panelTex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    }
    gl.bindTexture(gl.TEXTURE_2D, panelTex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, panelCv);
  }

  // ⚠️ SAY WHICH RENDERER, ALWAYS. A visitor on a software rasteriser is a real
  // visitor, and a page that is quietly slow teaches nothing. demo/verify-gl.mjs
  // checks its own answer against this one, so a page that stays silent reads as
  // a broken harness rather than as a quiet page.
  let rendererName = null;
  if (gl) {
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    rendererName = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    badge.innerHTML = `window · <b>${rendererName}</b>`;
  }

  // ── the room itself ─────────────────────────────────────────────────────
  let doc = null;              // the document the room IS
  let refused = 0, applied = 0;
  // When the accepted room landed, and whether a frame has shown it yet. `to
  // frame` is the distance between those two, which is the quantity the page
  // claims to report.
  let appliedAt = 0, shown = true, lastToFrame = null;
  let worst = 0, toFrame = [];
  const lastDocs = [];         // for the negative control
  // Only the status panel's program belongs to this page now; the room's own
  // uniforms are the room's business.
  let PU = null;
  const panelLocs = () => (PU ||= {
    proj: gl.getUniformLocation(progPanel, 'uProj'),
    view: gl.getUniformLocation(progPanel, 'uView'),
    model: gl.getUniformLocation(progPanel, 'uModel'),
    tex: gl.getUniformLocation(progPanel, 'uTex'),
    fade: gl.getUniformLocation(progPanel, 'uFade'),
  });

  /**
   * One view of the room, with this page's state handed across in one place.
   *
   * ⚠️ `clear` IS PER EYE AND ONLY THE FIRST ONE MAY SAY YES — `gl.clear`
   * ignores the viewport, both eyes share one framebuffer, and a colour clear
   * on the second view wipes what the first drew. The module holds that rule;
   * the caller holds the eye index.
   *
   * `eye` is where the viewer is, and it is only used by the dotted grid, whose
   * dots fade out with distance rather than ending in a hard rectangle.
   */
  function drawRoom(proj, view, tSec, doClear = true, eye = null) {
    if (!room || !doc) return;
    room.draw({
      proj, view, tSec, doc, clear: doClear, ar: arMode, eye,
      aimed, held, aimedDist, ray: xrOk ? rayNow : null, touch: touchOf,
    });
  }

  // ── applying a room, which is the only way the room ever changes ────────
  /**
   * ⚠️ NOTHING CALLS THIS EXCEPT THE SOCKET. A roll is a request that goes out
   * and comes back; the room changes on the echo. That is what makes the
   * `round trip` number the real distance between asking and seeing rather than
   * the time to draw something we already had — and it is why two headsets in
   * one room see the same world in the same order.
   */
  function apply(next, askedAt) {
    const why = validate(next);
    if (why) {
      refused++;
      d.set('refused', refused, 'warn');
      d.log(`refused — ${why}`, 'warn');
      return false;
    }
    doc = next; applied++;
    appliedAt = performance.now(); shown = false;
    lastDocs.push(docOf(next));
    if (askedAt) { const rt = Date.now() - askedAt; d.set('round trip', rt); }
    d.set('seed', String(next.seed));
    d.set('things', next.things.length);
    d.log(`room ${next.seed} — ${next.things.length} things, ${docOf(next).length} bytes`);
    return true;
  }

  // ── moving a thing ──────────────────────────────────────────────────────
  let held = null;          // { i, dist } while a trigger is down
  let moved = 0;

  /**
   * Put one thing somewhere else, IN THE DOCUMENT.
   *
   * ⚠️ A MOVE IS AN EDIT, AND THE ROOM STOPS BEING A PURE FUNCTION OF ITS SEED
   * THE MOMENT YOU MAKE ONE. That is not a bug to hide: the seed is where a
   * room STARTS, the document is what it IS, and `plan-nodes` §4 is the same
   * argument one level up — the document is the product. Rolling again
   * regenerates from the seed and the negative control still holds, because it
   * compares two fresh rolls rather than the live room.
   *
   * Rounded like the generator rounds, so an edited document stays canonical
   * and a byte comparison keeps meaning what it says.
   */
  function moveThing(i, x, y, z) {
    const t = doc?.things?.[i];
    if (!t) return false;
    const next = { ...t, x: r4(x), y: r4(y), z: r4(z) };
    const trial = { ...doc, things: doc.things.map((o, k) => (k === i ? next : o)) };
    // ⚠️ THE SAME `validate` THE RELAY PATH USES. A hand can drag a thing
    // through a wall as easily as a generator can put one there, and a rule
    // that only applies to what arrives over the wire is not a rule about the
    // document.
    if (validate(trial)) return false;
    doc = trial;
    return true;
  }

  /**
   * A thing let go inside another is pushed out along the line between their
   * centres. Returns how far it went, in metres, or 0 if it was already clear.
   *
   * ⚠️ ONLY THE DROPPED THING MOVES. Relaxing the whole room on a drop would
   * shift things somebody else in the room is holding, and a room that
   * rearranges itself because you put one object down is a room you cannot
   * arrange. The placement rule runs once, on a room nobody is touching; this
   * one answers for the one thing you just let go of.
   *
   * It resolves the DEEPEST overlap each time round and moves the thing to
   * exactly that one's surface, because pushing clear of one thing can push
   * into a second. Measured against the obvious alternative — stepping out of
   * every overlap at once — this one moves a dropped thing 0.62 m on average
   * and 1.65 m at the very worst, where stepping out of all of them at once
   * averages 2.39 m and reaches 4.32 m. A thing that flies across the room
   * when you let go of it has not been put down.
   */
  function pushClear(i) {
    const me = doc?.things?.[i];
    if (!me) return 0;
    let x = me.x, y = me.y, z = me.z;
    for (let pass = 0; pass < DROP_PASSES; pass++) {
      let worst = null, deepest = 1e-6;
      for (let k = 0; k < doc.things.length; k++) {
        if (k === i) continue;
        const o = doc.things[k];
        const need = radiusOf(me) + radiusOf(o) + GAP;
        const len = Math.hypot(x - o.x, y - o.y, z - o.z);
        if (need - len > deepest) { deepest = need - len; worst = { o, len, need }; }
      }
      if (!worst) break;
      let dx = x - worst.o.x, dy = y - worst.o.y, dz = z - worst.o.z, len = worst.len;
      if (len < 1e-6) {
        // Dropped dead centre, with no line between the two to push along.
        // Outward from where you are standing is the direction with room in it.
        dx = x; dy = 0; dz = z; len = Math.hypot(dx, dy, dz);
        if (len < 1e-6) { dx = 1; dy = 0; dz = 0; len = 1; }
      }
      const k = worst.need / len;
      x = worst.o.x + dx * k; y = worst.o.y + dy * k; z = worst.o.z + dz * k;
    }
    const went = Math.hypot(x - me.x, y - me.y, z - me.z);
    if (went < 1e-4) return 0;
    return moveThing(i, x, y, z) ? went : 0;
  }

  let ws = null, seq = 0, echoed = false, asked = 0;

    return true;
  };

    return new Promise((done) => {
      ws = new WebSocket(RELAY);
      ws.onopen = () => { d.log(`joined ${ROOM}`); done(true); };
      ws.onerror = () => done(false);
      ws.onmessage = (e) => {

        let m; try { m = JSON.parse(e.data); } catch { return; }

      // the number is missing rather than printing a zero that looks measured.
      d.set('round trip', '');
      apply(world(seed), 0);
    }

  /**
   * Updates from whoever is writing this page, while you are wearing it.
   *
   * 🔴 A RELOAD ENDS A WEBXR SESSION AND THERE IS NO WAY AROUND THAT. So the
   * tiers exist to keep as much work as possible on THIS side of a reload:
   *
   *   dev.status   a line to read          — nothing changes
   *   dev.shader   new GLSL                — recompiled in place, session lives
   *   dev.module   a new generator         — re-imported, session lives
   *   dev.reload   everything else         — the session must end, so YOU pick when

   * up and waits, because a session ending under somebody without warning is
   * the disruptive refresh this whole arrangement exists to avoid.
   */
  let reloadOffered = null;
  async function onDev(m) {
    if (m.type === 'dev.status') {
      setPanel(m.text || '', m.holdMs || 9000);
      d.log(`dev: ${m.text}`);
      return;
    }
    if (m.type === 'dev.shader') {
      try {
        // ⚠️ HELD, NOT SWAPPED — the module dissolves the new look over
        // FADE_MS rather than cutting to it, because a hard cut across your
        // whole field of view is a great deal more violent than the same cut in
        // a browser pane. It throws if the body will not compile, and the
        // picture keeps its own.
        room.applyLook({ sky: m.sky, box: m.box });
        setPanel('✓ new look\nfading in');
        shipNow('dev.shader compiled — fading in');
      } catch (e) {
        // A shader that will not compile must not take the picture with it.
        setPanel(`✗ new look refused\n${String(e.message).slice(0, 30)}`);
        shipNow(`FAIL dev.shader — ${e.message}`);
      }
      return;
    }
    if (m.type === 'dev.module') {
      try {
        // A cache-busted URL is a NEW module, which is the only way to get a
        // second copy of one the browser has already evaluated.
        const mod = await import(`/shell/seed.mjs?v=${encodeURIComponent(m.v || Date.now())}`);
        world = (seed) => spaced(mod.world(seed)); validate = mod.validate;
        setPanel('✓ new generator, applied\nroll to see it');
        shipNow(`dev.module applied live — v${m.v}`);
      } catch (e) {
        setPanel(`✗ new generator refused\n${String(e.message).slice(0, 30)}`);
        shipNow(`FAIL dev.module — ${e.message}`);
      }
      return;
    }
    if (m.type === 'dev.reload') {
      reloadOffered = m.build || 'a new build';
      setPanel(`● update ready — ${reloadOffered}\npress A to take it`, 60000);
      d.log(`an update is ready (${reloadOffered}) — reload when you want it`);
      shipNow(`dev.reload offered — ${reloadOffered}`);
    }
  }

  /**
   * Taking a tier-4 update, as gently as it can be taken.
   *
   * ⚠️ IT CANNOT RE-ENTER BY ITSELF AFTERWARDS. `requestSession` needs a
   * transient user activation and a freshly loaded page has none, so the
   * honest design is one press on the other side rather than a promise of
   * none. The flag makes that press a single obvious button instead of finding
   * the card and the control again.
   */
  function takeReload() {
    try { sessionStorage.setItem('scene-resume', '1'); } catch { /* private mode */ }
    shipNow('taking the reload');
    location.reload();
  }

  // ── the flat window, which is also how the desktop harness sees it ──────
  /**
   * 🔴 THE TABLET AND ONE CONTROLLER, SHOWN IN THE WINDOW TOO, AND IT IS NOT
   * DECORATION. Two reasons, and the second is the one that matters.
   *
   * 1. A visitor with no headset can read the thing this page now has a control
   *    on. Otherwise the only way to see it is to own a Quest.
   * 2. ⚠️ IT IS THE ONLY WAY A LAPTOP EVER RUNS THE TABLET'S DRAW CALL. Without
   *    it the quad, its new sampler and its texture bind are reached for the
   *    first time on the FIRST FRAME OF A HEADSET SESSION — where a pending
   *    `gl.getError()` costs the one run somebody was going to do. With it,
   *    `demo/verify-gl.mjs`'s "no WebGL error is pending" covers the tablet on
   *    every run of the suite, on real ANGLE, for free.
   *
   * The pose is synthesised where a left hand would be if you were standing at
   * the camera — down and to the left, turned so its face looks back at you.
   * The stand-in is drawn with it, because a tablet floating on nothing would
   * be a picture of something that does not happen.
   */
  function previewTablet(eye) {
    if (!room) return;
    const target = [0, 1.2, 0];
    const n = (v) => { const l = Math.hypot(...v) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
    const X = (u, v) => [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
    const L = n([target[0] - eye[0], target[1] - eye[1], target[2] - eye[2]]);
    const camR = n(X(L, [0, 1, 0]));
    const pos = [
      eye[0] + L[0] * 0.95 - camR[0] * 0.30,
      eye[1] + L[1] * 0.95 - camR[1] * 0.30 - 0.30,
      eye[2] + L[2] * 0.95 - camR[2] * 0.30,
    ];
    // ⚠️ BUILT FROM THE TABLET'S POSE BACKWARDS, which is why this changed when
    // `holdM` did. The tablet's face now looks along the grip's +Y — ACROSS the
    // handle, back at whoever is holding it — rather than along -Z, so the
    // frame that points it at this camera is the one whose +Y is toward the
    // eye. It was the other way round when the tablet faced the sky, and if
    // this preview ever shows the tablet edge-on again it is saying that
    // `holdM` moved without this following.
    //   +Y toward the eye · -Z up the controller · X = Y x Z, so it is
    //   right-handed by construction rather than by inspection.
    const gy = n([eye[0] - pos[0], eye[1] - pos[1], eye[2] - pos[2]]);
    const gx = n(X(gy, [0, -1, 0]));
    const gz = X(gx, gy);
    const m = new Float32Array([
      gx[0], gx[1], gx[2], 0,
      gy[0], gy[1], gy[2], 0,
      gz[0], gz[1], gz[2], 0,
      pos[0], pos[1], pos[2], 1]);
    // ⚠️ IT CLAIMS THE PROFILE THE HEADSET REPORTS, ON PURPOSE. Without it the
    // window would draw the stand-in and the REAL model's whole path — the
    // fetch, the reader, the texture decode, the third shader program — would
    // first run on the first frame of a headset session, which is where a
    // pending `gl.getError()` costs the one run somebody was going to do. With
    // it, `demo/verify-gl.mjs` covers the models on every run of the suite, on
    // real ANGLE, and a visitor with no headset can see their controller.
    room.setInput({
      hands: [{ m, handedness: 'left', profile: 'meta-quest-touch-plus' }],
      pointer: null, tabletM: holdM(m), hit: null,
    });
  }

  let raf = 0, t0 = performance.now(), lastFrame = 0;
  function flat(now) {
    raf = requestAnimationFrame(flat);
    if (!gl || !doc) return;
    const w = canvas.clientWidth * devicePixelRatio | 0, h = w * 9 / 16 | 0;
    if (canvas.width !== w) { canvas.width = w; canvas.height = h; }
    gl.viewport(0, 0, canvas.width, canvas.height);
    const tSec = (now - t0) / 1000;
    const a = tSec * 0.12;
    const eye = [Math.cos(a) * 6.5, 2.4, Math.sin(a) * 6.5];
    previewTablet(eye);
    drawRoom(perspective(1.05, canvas.width / canvas.height, 0.1, 60),
             lookAt(eye, [0, 1.2, 0]), tSec, true, eye);
    markShown(now);
    // ⚠️ REPUBLISHED HERE, NOT ONLY AT LOAD. `publishXR` builds a plain object,
    // so a field written once answers about whichever instant it was written
    // in — and the load-time call happens before the first frame, so
    // `tabletUploadMs` and `dots` read `null` forever on a machine that never
    // enters a session. That is this file's own getter rule, broken by its own
    // author, and it was caught by reading the published object back rather
    // than by reading the code.
    publishXR();
    if (room?.retire()) d.log('the new look is now the look', 'ok');
    if (lastFrame) { const dt = now - lastFrame; if (dt > worst) worst = dt; }
    lastFrame = now;
  }
  if (gl) flat(performance.now());

  // ── the headset ─────────────────────────────────────────────────────────
  let session = null, xrSpace = null, xrOk = false, xrFrames = 0, frameViews = 0;
  let rayNow = null, aimed = null, aimedDist = 0;
  // ⚠️ NOTHING GETS TO BE CLOSER THAN THIS. A cube 20 cm from your eyes is not
  // a small cube, it is a wall — and you cannot aim at what you cannot back
  // away from.
  const MIN_HOLD = 0.4, BUBBLE = 0.45;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  let lastShove = 0, aWas = false;

  /** Nearest thing the ray passes through, or null. Spheres, from the same
   *  `radiusOf` the separation rule uses — an exact box test would be twenty
   *  lines nobody can check by eye, and aiming at one ball while being kept
   *  apart by another would be two different shapes for one thing. */
  function pick(o, dir) {
    let best = null;
    doc?.things?.forEach((t, i) => {
      const r = radiusOf(t);
      const ox = o[0] - t.x, oy = o[1] - t.y, oz = o[2] - t.z;
      const b = ox * dir[0] + oy * dir[1] + oz * dir[2];
      const c = ox * ox + oy * oy + oz * oz - r * r;
      const disc = b * b - c;
      if (disc < 0) return;
      const dist = -b - Math.sqrt(disc);
      if (dist > 0.05 && (!best || dist < best.dist)) best = { i, dist };
    });
    return best;

  let headsetKnown = null, arKnown = null, arMode = false;
  navigator.xr?.isSessionSupported('immersive-vr').then((v) => { headsetKnown = v; }, () => { headsetKnown = false; });
  navigator.xr?.isSessionSupported('immersive-ar').then((v) => { arKnown = v; }, () => { arKnown = false; });

  /**
   * What demo/verify-quest.mjs reads to turn its compositor line from context
   * into a verdict. `frames` is the count THIS PAGE drew; the harness prints it
   * beside what `adb logcat -s VrApi` says the compositor did.
   *
   * ⚠️ THE TWO ARE PRINTED SIDE BY SIDE AND NEVER AVERAGED. They are counted on
   * opposite sides of the wire — one by the page, one by the system compositor —
   * and a mean of them would hide exactly the case worth catching, which is the
   * page believing it drew frames the compositor never presented. That is
   * createMidiLane's `scheduled()` in a new costume: a count is only evidence
   * on the far side of the boundary.
   */
  const publishXR = () => {

      presenting: xrOk, mode: xrOk ? (arMode ? 'immersive-ar' : 'immersive-vr') : 'window', frames: xrFrames,
      // ⚠️ WHERE THE DOTTED GRID IS, AND WHY — published so one headset run
      // answers it without anybody reading the log. `surfaces` is the state in
      // a word (six of them; the list is beside `planes` in xr-room.mjs) and
      // `grid` is what the floor under the dots actually is, because "nobody
      // asked", "we were refused", "your room reported no surfaces" and "your
      // room has no walls" are four different statements and at most one of
      // them is true at a time.
      surfaces: room?.planes.state ?? 'no room', grid: room?.planes.from ?? '—',
      planes: room?.planes.count ?? 0, labels: room ? { ...room.planes.labels } : {},
      // 🔴 THE LINE TWO HEADSET RUNS ARE COMPARED ON, AND IT HAS NO MODE IN IT.
      // The owner will do one pass of VR and one of passthrough, not three — so
      // "is the controller interface the same in both?" has to be answerable by
      // putting the two logs side by side. This string is built entirely out of
      // declarations: sizes, counts, ranges, which hand gets what, which gamepad
      // index is the trigger. If it ever differs between two runs, something in
      // the controller path learned what kind of session it was in.
      ui: xrHands ? xrHands.fingerprint() : 'no controller interface built',
      dots: room ? room.gridAlpha : null,
      tabletUploadMs: room ? room.tabletUploadMs : null,
      // 🔴 WHICH OF THE THREE WAYS OUT FIRED, IN WORDS, AND `null` WHILE NONE
      // HAS. The owner gets one run per mode, so "did the button on the tablet
      // work?" has to be answerable from what the page published rather than
      // from remembering what was pressed. ⚠️ `null` here is not "no" — it is
      // "nothing has ended this session", which is the true answer while one is
      // running and the honest one when the system menu ended it.
      leftBy,
    };
  };
  async function enter(mode = 'immersive-vr') {
    arMode = mode === 'immersive-ar';
    if (!navigator.xr) { d.log('this browser has no WebXR at all', 'warn'); return false; }
    if (arMode && arKnown === false) { d.log('this headset will not composite over your room', 'warn'); return false; }
    // 🔴 NO AWAIT BEFORE `requestSession`. It needs a TRANSIENT user activation,
    // and awaiting anything first can spend it — so the support answer is the
    // one already taken at load (`headsetKnown`), never a fresh await here.
    // This is the whole reason the first attempt on a real Quest produced no
    // asserts at all: the handler threw where nothing was reporting.
    if (headsetKnown === false) { d.log('no headset here — the window above is the same room', 'warn'); return false; }
    // ⚠️ A DEADLINE ON EVERY STEP. A rejected promise reports itself; one that
    // simply never settles does not, and that is what the first two headset
    // runs looked like from here — a session the user was standing in, with no
    // line saying which await had not come back.
    //
    // 🔴 BUT 6 s IS NOT A DEADLINE FOR A STEP THAT CAN ASK A HUMAN A QUESTION,
    // AND THAT COST A BLACK HEADSET. MEASURED on a Quest 3, 2026-09-13:
    // `requestSession immersive-vr` did not hang — it was waiting for the
    // owner to answer a ROOM-DATA PERMISSION PROMPT, which appeared because
    // this page asks for plane detection and hand tracking as optional
    // features. The deadline fired underneath it, the page declared failure and
    // tore its own entry path down, and THEN the session started: a headset
    // standing in an immersive session that no code owned, drawing nothing.
    // Black, and a restart to get out.
    //

    // says what it is probably waiting for rather than "never returned".

    // `makeXRCompatible` is not going to ask anybody anything.
    const step = async (what, p, ms = 6000) => {

        new Promise((_, no) => setTimeout(() => no(new Error(
          `${what} did not answer in ${ms / 1000} s`
          + (ms > 6000 ? ' — is there a permission prompt waiting for you?' : ''))), ms))]);
      shipNow(`ok  ${what}`);
      return out;
    };

      // ⚠️ `local-floor` is REQUIRED, not optional: the room is authored in
      // metres from the floor, and on `local` the origin is wherever the head
      // happened to be, which puts a 0.3 m cube at eye height.
      // 🔴 `plane-detection` IS OPTIONAL AND IT MUST STAY OPTIONAL. Asking for
      // your real floor and walls is worth doing — in passthrough it is the
      // difference between a grid floating at the page's guess and a grid lying
      // on the floor you are standing on — but a headset whose owner has never
      // run Space Setup, or who says no to the permission, must still get a
      // room. In `requiredFeatures` this line would turn "I have not mapped my
      // house" into "this page refuses to start".
      // 🔴 90 s, BECAUSE THIS ONE ASKS YOU A QUESTION. See `step`.
      //
      // ⚠️ AND THE PROMISE IS KEPT, NOT ABANDONED. If the deadline wins, the
      // request is still in flight — and a session that arrives after the page
      // has given up is a headset in VR that nothing is drawing. It is caught
      // and ENDED, so the worst case is "it did not start" rather than a black
      // room and a restart.
      const ask = navigator.xr.requestSession(mode, {
          requiredFeatures: ['local-floor'],
          // ⚠️ `hand-tracking` IS OPTIONAL, for the same reason every room
          // feature is: in `requiredFeatures` a headset with hands switched
          // off would be refused a session entirely. Asking costs nothing and
          // the probe below reports what came back — including "nothing",
          // which is an answer.
          // 🔴 `tracked-sources` OR THE SECOND HAND SILENTLY DOES NOT EXIST.
          // A non-primary input goes into `session.trackedSources`, not
          // `inputSources`, and the spec says that array MUST only be
          // populated if this descriptor is granted — as must the
          // `trackedsourceschange` event that would otherwise have said so.
          // Ask for `hand-tracking` alone and one hand is simply absent, with
          // no error and no event: an array that reads exactly like a headset
          // holding one controller. Which is what the last run reported.
          optionalFeatures: [...ROOM_OPTIONAL_FEATURES, 'hand-tracking', 'tracked-sources'],
        });

      ask.then((late) => {
        if (!gaveUp) return;
        shipNow('the session arrived after this page gave up waiting — ending it rather than leaving you in a room nothing is drawing');
        try { late.end(); } catch { /* already gone */ }

        session = await step(`requestSession ${mode}`, ask, 90000);

      // `immersive-ar` and still composite opaque, and what "no surfaces"
      // means depends on which it actually is.
      room?.markAsked(session.environmentBlendMode === 'opaque');
      // 🔴 DID THE RUNTIME ACTUALLY GRANT IT? `no hand` on an input source is
      // ambiguous in the worst way: it means "hand tracking is off" and "you
      // were holding a controller" equally well, and those have completely
      // different next steps. `enabledFeatures` is the runtime answering for
      // itself. ⚠️ It is not on every implementation, so its ABSENCE is
      // reported as absence rather than as a refusal.
      shipNow(`features granted · ${session.enabledFeatures

      await step('makeXRCompatible', gl.makeXRCompatible());

      // the system menu, the headset coming off, the runtime taking it. A log
      // that printed "session ended" for all of them would leave every one of
      // those to be guessed at from the outside, which is the shape of failure
      // that has already cost this page three headset runs.
      const why = leftBy
        || 'something outside this page — the system menu, the headset coming off, or the runtime taking it';
      shipNow(`session ended · ${why} · ${xrFrames} frames drawn`);
      d.log(`the headset session ended — ${why}`);

    // gets to give about its own bug.
    // ⚠️ THE TRIGGER USED TO BE THE EXIT, AND NOW IT GRABS — so the exit moved

    // a room must keep a way out that belongs to the page: grip leaves, and the
    // dead-man's switch below still fires if nothing ever draws.
    // ⚠️ NEITHER OF THESE MOVED WHEN THE TABLET GREW A BUTTON. The button is a
