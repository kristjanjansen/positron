<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">

<script type="module">
  // demo/knobs/index.html, plan-controller.md step 3.
  //
  // Two sliders, one filter, one Raspberry Pi. The subject is CONTINUOUS
  // CONTROL, not notes: every message is a complete statement of where a knob
  // is, the last one is the only one that stays true, and losing one is
  // harmless the instant the next arrives. That is why this page has a send
  // gate and a restatement rather than an ack, and why it counts what it did
  // NOT send as carefully as what it did.
  //
  // 🔴 NO GRANULATOR ANYWHERE IN HERE. It came out of the board's signal path
  // on 2026-09-16 (archive/box-pappus/), and this page has never had one.
  import { mount, guard } from '/shell/shell.mjs';
  import { createSlider, createSliderGroup } from '/shell/slider.mjs';
  import { createPresence } from '/shell/presence.mjs';
  import { createDiagram } from '/shell/diagram.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { makeCcSend, SEND_GATE_MS, RESTATE_MS } from '/shell/cc-adapter.mjs';
  import { openWire } from '/shell/wire.mjs';

  const q = new URLSearchParams(location.search);
  // `studio-1` is the ADDRESS OF THE RASPBERRY PI, not a rendezvous this page
  // invented, which is why the manifest row says `room: 'fixed'`.
  const ROOM = q.get('room') || 'studio-1';
  /**
   * 🔴 A HARNESS PRESS MUST NOT TAKE A SHARED INSTRUMENT AWAY FROM A PERSON.
   *
   * `demo/verify.mjs` presses every control in `.pos-controls` on every run,
   * dozens of times a day, and control 0 here starts Yoshimi on a board in
   * another building. There is ONE JACK graph and ONE instrument on it, so a
   * suite run would silently stop whatever `/box/` or `/grains/` was doing.
   * plan-controller §6.6 says never start audio on load for exactly that
   * reason; a scripted press is not a load, it is worse, because it happens
   * far more often.
   *
   * So under `?selfcheck=1` this page does everything except put a note, a
   * patch or a controller value on the board, and it SAYS SO in the log and in
   * an assert. `?board=1` alongside it is the deliberate opt-in for somebody
   * who has been told the board is free.
   *
   * ⚠️ A visitor is unaffected: neither flag is set, so pressing Play does the
   * whole thing.
   */
  const SELFCHECK = q.get('selfcheck') === '1';
  const MAY_PLAY = !SELFCHECK || q.get('board') === '1';

  // The two controllers this page is about. 74 is Brightness and 71 is
  // Harmonic Intensity in the MIDI specification, and in the ZynAddSubFX family
  // Yoshimi belongs to they reach a part's filter cutoff and its resonance.
  // 64 is neutral: the value is an offset around whatever the patch's own
  // filter is set to, so the middle of the lane leaves the patch alone.
  const CUTOFF = 74, RESO = 71, NEUTRAL = 64;
  /**
   * 🔴 THE CUTOFF OPENS AT 100, NOT AT THE MIDDLE. Asked 2026-09-16: *"cutoff
   * 100 by default"*, after *"cutoff below 38 is nada"*.
   *
   * 64 is where the patch's own maker left it, which is the honest place to
   * start a control that changes somebody else's instrument, and it is not the
   * useful one: MEASURED on this board, the centroid at 64 is about 1.6 kHz and
   * at 0 it is 183 Hz, so the bottom third of the travel lives under what a
   * phone or a laptop speaker reproduces at all. Somebody who opens this page
   * and drags down hears nothing happen and concludes the page is broken.
   * ⚠️ IT IS A STARTING POSITION, NOT A LIMIT. The whole range is still there
   * and the dark end is still reachable; what changed is where a hand lands
   * before it has learned anything.
   */
  const CUTOFF_HOME = 100;
  // Bank 95 program 6 is `Analog Filter 1`, read off the live board's own
  // `voices.list` on 2026-09-16 (878 patches, 24 banks, bank map not stale).
  // Bank select is CC 32 and the board reads that number out of Yoshimi's own
  // config, so nothing here has to know it.
  const BANK = 95, PROGRAM = 6, PATCH = 'Analog Filter 1';
  // One note, held. A repeating note would retrigger the patch's own filter
  // envelope and fight the slider, which would make the page about the wrong
  // thing.
  const NOTE = 40, VEL = 96;
  // The board fixes 48000 Hz and 960-sample frames (rig/box/synth.mjs), and
  // NOTHING in this chain resamples.
  const RATE = 48000;
  // What the board publishes about its own stream. Checked against the frames
  // that actually arrive; see `checkShape`.
  const BOARD_FRAME_MS = 20, BOARD_CHANNELS = 1;

  const d = mount({
    name: 'knobs',
    // 🔴 ONE LINE, BECAUSE THIS PAGE HAS A DIAGRAM AT THE BOTTOM OF IT. A
    // paragraph and a picture of the machinery are two explanations of one
    // thing and the paragraph is the weaker of them: it describes what a reader
    // can point at an inch below. It is `manifest.mjs`'s own line verbatim, so
    // arriving from the index does not mean reading the same claim twice in two
    // wordings that can drift apart.
    // ⚠️ WHAT THE PARAGRAPH SAID IS REHOMED, NOT DELETED. The gate, the relay
    // and the twenty millisecond frame are boxes and notes in the picture now.
    what: 'Sweep a big filter on a Raspberry Pi in another building, with two sliders and no keyboard.',
    /**
     * Six cells, and every one of them moves.
     *
     * `sent` and `skipped` are your hand, counted in this page. `played` is the
     * board, counted on the far side of the wire, which is the only side that
     * can answer for it. `round trip` and `buffer` are the two biggest terms in
     * how late the sound is, and `lost` is whether anything vanished on the way.
     *
     * ⚠️ NO `lag` CELL YET. plan-controller §6.3 wants one and §5.3 says how to
     * take it: a spectral centroid crossing, because `/box/`'s silence-to-onset
     * trick cannot work on a sweep that happens on top of a note already
     * sounding. That is step 5 of the build order, and a cell that can never
     * fill teaches a reader to skip the row.
     * ⚠️ AND NOT THE BOARD'S `folded` EITHER, though §4.2 asks for a counter on
     * every stage that discards. The board drains every 5 ms and this page
     * sends at most one value per 20 ms, so `folded` reads 0 forever, which is
     * a constant wearing a measurement's clothes. The page's OWN discard is the
     * one that moves, because a pointer really does outrun the gate, and that
     * is `skipped`.
     */
    readout: { sent: '/s', skipped: '/s', played: '/s', 'round trip': 'ms', buffer: 'ms', lost: '' },
    /**
     * 🔴 THE NUMBERS AND THE LOG ARE ONE SURFACE AT THE FOOT OF THIS PAGE.
     * Asked for 2026-09-16, and this is the page it was asked about. Split,
     * the six cells sat above the sliders and the log sat under them, so the
     * two things that answer "what is this doing" were at opposite ends of the
     * page with the instrument in between: dragging a slider and reading
     * `skipped` meant looking away from your own hand, and a log line about the
     * board arrived a screen below the cell it explains. Joined, the counters
     * and the record are one block under the sliders, which is where you are
     * already looking once you have started dragging.
     */
    joined: true,
    /**
     * 🔴 THE ORDER IS LOAD-BEARING. `settleMs` lands on control 0 and nowhere
     * else, so the slow one goes first: Play opens the audio graph, asks the
     * board what it is doing, brings Yoshimi up (ten to forty seconds on a cold
     * board) and holds a note. Adding a control in front of this one would move
     * every other control's harness press, which CLAUDE.md records taking a
     * check red for a reason that had nothing to do with the control added.
     *
     * 🔴 NO KEYBOARD. The ask says the keyboard is not the point, and one held
     * note is all a filter needs.
     */
    // 🔴 NO CONTROL ROW. Transport UI is `transport-bar.mjs` and nothing else,
    // and what this page needs from a transport is exactly what that component
    // is: a play, a stop, and no invented buttons beside them.
    controls: [],
  });
  guard(d);

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  // ── the send gate ─────────────────────────────────────────────────────────
  //
  // From `demo/shell/cc-adapter.mjs`, which already owns this subject and is
  // graded without a browser by `node demo/shell/cc-send-test.mjs`. Three rules
  // come with it: the endpoint of a gesture is never held back, the gate is per
  // controller, and switches are never gated. This page has no switch; the rule
  // still applies to the first one anybody adds.
  const gate = makeCcSend();
  // `onInput` is a move and `onChange` is the endpoint, which is exactly the
  // gate's `end` flag. That is the whole reason the flag exists.
  const move = (c, v) => { gate.put(c, v); pump(); };
  const land = (c, v) => { gate.put(c, v, { end: true }); pump(); };

  let armed = false;              // an instrument is running, so values mean something
  let wireMsgs = 0;               // messages that actually went on the wire
  let heldBack = 0;               // messages the gate made that this page chose not to send
  let saidHold = false;

  function pump() {
    const out = gate.tick(performance.now());
    if (!out) return;
    if (!armed || !MAY_PLAY) {
      heldBack++;
      if (!saidHold && !armed) {
        saidHold = true;
        d.log('these values are remembered, not sent: nothing is playing on the board yet. Press Play, and the whole console goes out within half a second of the synth coming up');
      }
      return;
    }
    // ⚠️ EVERY DUE CONTROLLER IN ONE MESSAGE. Two sliders moving together are
    // one `ctl.set`, not two: the relay's budget is counted in messages, and a
    // message carrying two pairs costs the same as one carrying one.
    const r = wire.send({ type: 'ctl.set', channel: 0, set: out.set });
    if (r?.sent) wireMsgs++;
  }

  // ── the sliders ───────────────────────────────────────────────────────────
  //
  // Appended to the body rather than to the control row: they are the subject
  // of the page, not furniture beside it, and the harness cannot press a slider
  // anyway.
  const cutoff = createSlider({
    label: 'cutoff', aria: 'filter cutoff', min: 0, max: 127, step: 1, value: CUTOFF_HOME,
    onInput: (v) => move(CUTOFF, v),
    onChange: (v) => land(CUTOFF, v),
  });
  const reso = createSlider({
    label: 'resonance', aria: 'filter resonance', min: 0, max: 127, step: 1, value: NEUTRAL,
    onInput: (v) => move(RESO, v),
    onChange: (v) => land(RESO, v),
  });
  // Named, because it is moved below the transport once that exists. See there.
  const knobs = createSliderGroup([cutoff, reso], { pair: true });
  d.el.append(knobs.el);

  // ── audio ─────────────────────────────────────────────────────────────────
  let ctx = null, playout = null;
  let bufMs = 0, starved = 0, trimmed = 0, breaks = -1;
  let frames = 0, pcmMissing = 0, lastPcmSeq = -1, firstFrameAt = 0, peak = 0;
  let told = null;                       // the board's own announcement, if we heard it
  let chIn = BOARD_CHANNELS, shapeChecked = false, shapeWrong = 0, shapeSaid = '';

  async function startAudio() {
    if (ctx) return;
    // ⚠️ ASK FOR 48 kHz. The board sends 48000 and the worklet writes those
    // samples into a ring drained at the context's own rate, so a mismatch is
    // both a pitch error and a ring that fills faster than it empties.
    ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: RATE, latencyHint: 'interactive' });
    // ⚠️ Fire and move on. `resume()` waits on a user gesture in a real browser
    // and never rejects, so awaiting it is a hang rather than an error.
    ctx.resume().catch(() => { /* a suspended context is allowed. Sound is late, not broken */ });
    if (ctx.sampleRate !== RATE) {
      d.log(`this browser runs audio at ${ctx.sampleRate} Hz and the board sends ${RATE}. Nothing in the chain resamples, so the pitch will be off by ${(RATE / ctx.sampleRate).toFixed(3)}x`, 'bad');
    }
    await ctx.audioWorklet.addModule('/proto/jam/playout-worklet.js');
    playout = new AudioWorkletNode(ctx, 'pcm-playout', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [1] });
    playout.connect(ctx.destination);
    playout.port.onmessage = (e) => {
      const st = e.data?.stats; if (!st) return;
      bufMs = st.bufferedMs;
      d.set('buffer', Math.round(st.bufferedMs));
      starved = st.underruns; trimmed = st.trimEvents;
      const b = starved + trimmed;
      if (b !== breaks) {
        const first = breaks < 0;
        breaks = b;
        // One cell for both, because a reader wants to know whether what they
        // are hearing is intact, which is one question. The LINE says which,
        // because the two want opposite fixes: running dry wants a bigger
        // cushion and being trimmed wants a smaller one.
        if (!first) d.log(`${starved} ran dry, ${trimmed} trimmed · cushion ${Math.round(bufMs)} ms`, 'warn');
      }
    };
    /**
     * The cushion is OURS, not the browser's, which is the whole reason to carry
     * the samples rather than use WebRTC.
     *
     * 🔴 160 ms, RAISED FROM 100 ON A MEASUREMENT AND A REPORT. Reported
     * 2026-09-16 while listening: *"some vobbly sound, cutoffs, not nice"*, with
     * a log full of `ran dry` and `trimmed`. MEASURED off this relay the same
     * minute, 992 frames in 20 s with a node client and no browser in the way:
     * nothing was lost and the mean gap was exactly 20.0 ms, but p90 was 29.5,
     * p99 was 43.5 and the worst single gap was 83.6 ms. A 100 ms cushion has
     * 16 ms left after a lump like that, and the page's own older note records a
     * 108.6 ms gap, which a 100 ms cushion cannot survive at all.
     *
     * ⚠️ NOTHING IS BEING LOST ON THE WIRE, which is what makes this a cushion
     * decision rather than a network one: the frames all arrive, some of them
     * in lumps. A cushion has no restoring force, so the floor still ratchets
     * when it is proved too small.
     * ⚠️ AND IT COSTS WHAT IT COSTS: 60 ms more between a hand and the sound,
     * on a path whose round trip is about 45 ms. The trade is a filter that
     * answers a little later against one that clicks, and a click is the one a
     * listener cannot ignore.
     */
    playout.port.postMessage({ cmd: 'floor', ms: 160, adaptive: true, maxMs: 400 });
  }

  /**
   * The shape of what arrived, checked rather than inferred.
   *
   * 🔴 A CHANNEL COUNT CANNOT BE READ OFF A PAYLOAD. 960 int16s is a valid
   * 20 ms mono frame AND a valid 10 ms stereo one, and guessing wrong plays an
   * octave down, which sounds like a broken instrument rather than a broken
   * header. The Mac sends stereo and this board sends mono, and both are on
   * this relay at once.
   *
   * ⚠️ THE BOARD ANNOUNCES IT IN `box.hello`, WHICH IT SENDS WHEN IT JOINS, SO
   * A PAGE THAT JOINS LATER NEVER HEARS IT. There is no verb that asks for it
   * again. So the page states the board's published framing as its expectation
   * and CHECKS the arriving frames against it: `samples / channels / rate` has
   * to come out at the frame length claimed. A live announcement overrides the
   * expectation the moment one arrives.
   */
  function checkShape(samples) {
    if (shapeChecked) return;
    shapeChecked = true;
    const want = told?.frameMs ?? BOARD_FRAME_MS;
    const implied = (samples / chIn / RATE) * 1000;
    shapeSaid = `${samples} samples a frame works out at ${implied.toFixed(1)} ms as ${chIn === 2 ? 'stereo' : 'mono'}, against the ${want} ms ${told ? 'the board announced' : 'the board publishes'}`;
    if (Math.abs(implied - want) <= want * 0.02) return;
    const real = Math.max(1, Math.min(2, Math.round(samples / ((want / 1000) * RATE))));
    shapeWrong++;
    chIn = real;
    playout?.port.postMessage({ cmd: 'inChannels', n: real });
    d.log(`${shapeSaid} · playing it as ${real === 2 ? 'stereo' : 'mono'} instead`, 'warn');
  }

  function onPcm(buf) {
    const s = new DataView(buf).getUint32(0, true);
    // ⚠️ A COUNTER IS ONLY EVIDENCE ON THE FAR SIDE OF A BOUNDARY. This counts
    // gaps in the BOARD's own sequence, so it measures what the relay dropped
    // rather than what this page asked for. Byte 4 carries the board's own
    // `performance.now()`, which step 5 will read to separate the network's
    // share of the delay from the board's.
    // Audio in this room is the board and nothing else, and it arrives fifty
    // times a second against a heartbeat every five.
    pres.seen();
    pres.checking(false);
    if (lastPcmSeq >= 0 && s > lastPcmSeq + 1) pcmMissing += s - lastPcmSeq - 1;
    lastPcmSeq = s;
    frames++;
    if (!firstFrameAt) firstFrameAt = performance.now();
    const pcm = new Int16Array(buf, 12);
    checkShape(pcm.length);
    if (!playout) return;
    const f32 = new Float32Array(pcm.length);
    // 🔴 THE LOUDEST SAMPLE, BECAUSE A FRAME COUNT CANNOT TELL SOUND FROM
    // SILENCE. The board captures its JACK graph continuously, so frames arrive
    // at fifty a second whether or not a note is sounding: `104 frames of audio`
    // read green through the whole of the silence reported above. A level is the
    // quantity in question and a count is one adjacent to it.
    let hi = 0;
    for (let i = 0; i < pcm.length; i++) {
      f32[i] = pcm[i] / 32768;
      const a = f32[i] < 0 ? -f32[i] : f32[i];
      if (a > hi) hi = a;
    }
    if (hi > peak) peak = hi;
    playout.port.postMessage({ pcm: f32 }, [f32.buffer]);
  }

  // ── the socket ────────────────────────────────────────────────────────────
  //
  // 🔴 `openWire`, NOT A HAND-ROLLED WebSocket. `rig/box/listen.html` rolls its
  // own and as a result cannot tell a full room from a dead relay: a browser
  // cannot read the HTTP status of a refused upgrade, so both arrive as the
  // same silent close. `openWire` asks `/stats` and says which it was. It also
  // mints a new `from` per connection, counts what it sent against what came
  // back, and refuses a payload field the envelope would overwrite.
  const waiters = [];
  let boardAnswered = false, playing = null, boardSaid = '';
  // Which socket in this room is the board. Learned from the two messages only
  // it sends, never assumed, and relearned when it reconnects.
  let boardFrom = null;
  let meter = null, meterAt = 0, playedPerSec = 0;
  let rtt = null;

  const wire = openWire(ROOM, {
    base: q.get('relay') || undefined,
    onOpen: () => { d.log(`joined ${ROOM}`, 'hi'); askStatus(); },
    onClose: () => d.log('socket closed · reconnecting'),
    onMessage: (got) => {
      if (got.kind === 'binary') { onPcm(got.data); return; }
      if (got.kind !== 'json') return;
      if (got.msg.from === wire.stats().from) return;   // our own line, echoed back
      heard(got.msg);
    },
  });

  function sendId(m) {
    const out = wire.send(m);
    if (!out?.sent) return null;
    try { return JSON.parse(out.line).id; } catch { return null; }
  }
  /**
   * Wait for the next reply of a type, resolving null on a timeout rather than
   * hanging. A page that waits forever looks like a page that is still loading,
   * and "nobody answered" is the answer this page most often has to give.
   */
  function waitFor(type, ms, re = null) {
    return new Promise((resolve) => {
      const w = { type, re, resolve };
      w.timer = setTimeout(() => { waiters.splice(waiters.indexOf(w), 1); resolve(null); }, ms);
      waiters.push(w);
    });
  }
  async function ask(m, type, ms = 8000) {
    // The id first, so the wait is for THIS answer rather than for the next
    // message of the same shape. On a shared board that can be somebody else's
    // question, or the reply to it.
    const id = sendId(m);
    if (!id) return null;
    return waitFor(type, ms, id);
  }

  /**
   * ⚠️ A QUESTION AND ITS ANSWER CARRY THE SAME `type` ON THIS RELAY. The relay
   * is a broadcast, so another listener merely ASKING looks exactly like the
   * board answering. The board stamps every answer with `re`, the id of the
   * message it answers, which is the only thing that tells them apart.
   */
  function heard(m) {
    for (let i = waiters.length - 1; i >= 0; i--) {
      const w = waiters[i];
      if (w.type !== m.type) continue;
      if (w.re && m.re !== w.re) continue;
      clearTimeout(w.timer); waiters.splice(i, 1); w.resolve(m);
    }
    // The board's stream announcement, if this page happened to be connected
    // when it joined. A measurement outranks a repeated claim, so this only
    // re-opens the question when the claim CHANGES.
    if (m.type === 'box.hello' && m.audioChannels) {
      if (!told || told.audioChannels !== m.audioChannels || told.frameMs !== m.frameMs) {
        told = { audioChannels: m.audioChannels, frameMs: m.frameMs };
        chIn = m.audioChannels === 2 ? 2 : 1;
        shapeChecked = false;
        playout?.port.postMessage({ cmd: 'inChannels', n: chIn });
        d.log(`the board says it sends ${chIn === 2 ? 'two channels' : 'one channel'} at ${m.frameMs} ms a frame`);
      }
    }
    // ANY message from the board is proof it is there, not just the one this
    // page happened to ask for. `box.alive` is the heartbeat the interval above
    // is sized for, and an answer to a question counts just as much.
    /**
     * 🔴 ONLY THE BOARD COUNTS AS THE BOARD. This called `seen()` on ANY message
     * that was not our own echo, and the relay is VERBATIM: everything in the
     * room reaches everybody. So another tab of this page, or `/box/`, or
     * `/grains/`, or a harness run, would have painted the badge green while
     * the Raspberry Pi was unplugged. A presence badge that can be satisfied by
     * somebody else in the room is worse than no badge, because it is wrong in
     * precisely the case it exists for.
     *
     * The board is identified by the messages only it sends: it says
     * `box.hello` when it joins and `box.alive` every five seconds. Its `from`
     * is per SOCKET, so it is learned rather than assumed, and it is learned
     * again whenever the board reconnects under a new one.
     * ⚠️ AND AUDIO COUNTS TOO. A stream of PCM frames is the board playing, and
     * nothing else puts audio into this room, so `onPcm` marks it seen as well.
     * That matters because the frames arrive fifty times a second and a
     * heartbeat only every five.
     */
    if (m.type === 'box.hello' || m.type === 'box.alive') boardFrom = m.from || boardFrom;
    if (m.from && m.from === boardFrom) { pres.seen(); pres.checking(false); }
    if (m.type === 'audio.started') {
      boardAnswered = true;
      playing = m.ok ? m.source : null;
      // The board's own words for the not-playing case. A recovery action is
      // not free and a wedged jackd cannot be restarted from a page, so the
      // reason is reported verbatim rather than translated into a guess.
      boardSaid = m.ok ? `${m.source} is playing on the board` : `the board answered: ${m.reason}`;
    }
    // The coalescer's own counters, pushed once a second while anything is
    // moving. A REQUEST of the same type carries no counts, which is how the
    // two are told apart without an id.
    if (m.type === 'ctl.meter' && typeof m.out === 'number') {
      const now = performance.now();
      if (meter && now > meterAt) playedPerSec = (m.out - meter.out) / ((now - meterAt) / 1000);
      meter = m; meterAt = now;
      d.set('played', Math.max(0, Math.round(playedPerSec)));
    }
  }

  async function askStatus() {
    const r = await ask({ type: 'audio.status' }, 'audio.started', 6000);
    if (!r) {
      // plan-controller §7.7: say it in these words, within a named timeout,
      // rather than showing a live-looking slider that does nothing.
      d.log(`no board answered in ${ROOM} within six seconds. The sliders still work and nothing is going anywhere`, 'warn');
      return null;
    }
    d.log(boardSaid, r.ok ? 'hi' : 'warn');
    return r;
  }

  // ── what the numbers are counted over ─────────────────────────────────────
  let t0 = performance.now(), m0 = 0, k0 = 0;
  setInterval(() => {
    const now = performance.now(), dt = (now - t0) / 1000;
    if (dt < 1) return;
    d.set('sent', Math.round((wireMsgs - m0) / dt));
    d.set('skipped', Math.round((gate.stats.thinned - k0) / dt));
    t0 = now; m0 = wireMsgs; k0 = gate.stats.thinned;
    // ⚠️ NOT SET UNTIL SOMETHING HAS ARRIVED. A counter pre-set to 0 reads as a
    // very confident measurement of nothing, and with no board there is nothing
    // that could have been lost. `sent` and `skipped` are rates and are
    // different: 0 a second is a true statement about a hand that is not moving.
    if (!frames) return;
    const gone = pcmMissing + Math.max(0, breaks);
    d.set('lost', gone, gone ? 'bad' : 'ok');
  }, 1000);

  // The network alone, with the relay's Durable Object never woken: the runtime
  // answers `ping` with `pong` for free out of its hibernation autoresponse.
  // ⚠️ NOT `box.ping`. The board replies `box.pong` with an `at` field, and
  // `at` is an envelope field, so the board's own formatter refuses it and the
  // handler throws. Asked directly, the board answers
  // `box.error: "at" is an envelope field`. The obvious round trip verb answers
  // nothing on the board as it runs today.
  async function measureRtt() {
    const ms = await wire.ping(2500);
    if (ms === null) return;
    rtt = ms;
    d.set('round trip', Math.round(ms));
  }
  setInterval(measureRtt, 4000);

  // ── the transport ─────────────────────────────────────────────────────────
  //
  // 🔴 THE SOUND HAS NO END, AND THE BAR SAYS SO RATHER THAN COUNTING DOWN TO
  // ONE. Reported 2026-09-16 from a phone: *"Sound just ends. There shouldn't
  // be a transport slider. It should go forever."*
  //
  // The first shape of this page put the transport on a ten second deck with a
  // scrub and a loop, and everything a visitor saw followed from that: a slider
  // implying somewhere to be inside the sound, a clock counting to an end, and
  // an end-stop that released the note while a hand was still on the filter.
  // What is actually true here is that a note is held until somebody stops it,
  // which is the one fact `live` carries: the chip says THIS SOURCE HAS NO END
  // and there is no clock and no position to read.
  //
  // ⚠️ `endStop: false` IS THE HALF THAT KEEPS THE NOTE. Without it the bar
  // pauses at the end of the range, and pause here is a panic, so the sound
  // stopped by itself after ten seconds.
  // ⚠️ AND NO LOOP. Asked for in the same breath: *"For now, re remove the
  // loops. Let's figure out recording and automation later."* What was there
  // recorded a gesture and played it back, which moved the sliders with nobody
  // touching them, and a page that moves its own controls while somebody is
  // trying to learn what a control does is a page that cannot be learned. It is
  // in the history at f2c9ab7 for whenever recording is taken up properly.
  //
  // The deck is a play/pause state and a clock nobody reads. It needs a range
  // because every deck has one; nothing on this page shows it, and nothing
  // stops when it ends.
  const deck = createDeck({ items: [], adapters: {}, range: [0, 86400000] });

  /**
   * 🔴 THE BADGE REPLACES THE LIVE CHIP. Asked 2026-09-16: *"use online badge on
   * knobs"*, *"on knobs: replace live"*.
   *
   * That slot held a chip whose one fact was that this source has no end, which
   * is true and is not the fact somebody watching this page needs. The
   * instrument is in another building and the question is whether it is
   * answering. The two would be two claims about one source in one position, so
   * the bar refuses both.
   *
   * ⚠️ `everyMs` IS THE BOARD'S OWN HEARTBEAT, 5 s, and the component throws
   * without it rather than guessing: a shorter guess would call a working board
   * gone between beats and send somebody to look at hardware that is fine.
   * ⚠️ `comingMs` IS 45 s BECAUSE THAT IS HOW LONG YOSHIMI TAKES on a cold
   * board, ten to forty seconds, measured on this one.
   */
  // 🔴 THE NAME IS WHAT THE THING IS CALLED. Asked 2026-09-16: *"'rasperry pi
  // online'"*. `board` is this repo's own shorthand for it, which is the kind of
  // private vocabulary CLAUDE.md keeps out of anything a visitor reads, and it
  // is vaguer than the truth: the page already says a Raspberry Pi in another
  // building, and the diagram on /box/ calls the same machine by the same name.
  const pres = createPresence({ of: 'Raspberry Pi' });
  pres.follow({ everyMs: 5000, comingMs: 45000 });
  pres.checking();          // a question is out before anything has answered

  const bar = createTransportBar(d.el, deck, {
    chip: pres.el,       // whether the board is answering, in the chip's place
    scrub: false,        // there is no position in a held note to seek to
    loop: false,         // asked for, and recording comes back as its own thing
    endStop: false,      // the note is held until somebody stops it
    command: {
      play: () => { deck.play(); startNote(); },
      // 🔴 STOP IS A PANIC, ASKED FOR IN THOSE WORDS. It is not a pause that
      // could be resumed: it releases every note the board is holding, which
      // may include notes this page never pressed, and brings both sliders home
      // to where the patch's own filter sits.
      pause: () => { deck.pause(); panic(); },
      seek: (pos) => deck.seek(pos),
    },
  });

  // 🔴 THE SLIDERS SIT UNDER THE TRANSPORT. Asked 2026-09-16: *"put sliders
  // below transport"*. They were built before the bar and so were drawn above
  // it, which put the instrument's controls before the thing that starts it:
  // you met two sliders that did nothing, and the reason they did nothing was
  // further down the page. `append` MOVES a node already in the document, so
  // this is a reordering rather than a second copy.
  d.el.append(knobs.el);

  /**
   * One note, and the moment it started, because the audio check below cannot
   * ask "was there a sound" without knowing whether anything was meant to be
   * sounding. `peak` is reset here so the answer is about THIS note rather than
   * about whatever was in the stream before it.
   */
  let noteAt = 0, releasedAt = 0;

  /**
   * 🔴 A PATCH COMES OFF AN SD CARD, AND A NOTE SENT BEFORE IT LANDS IS LOST.
   * REPORTED TWICE AS *"No sound in knobs"*, and MEASURED over the relay with
   * no page in the way: select then note back to back gives peak 0.0000, and
   * select, wait 900 ms, then note gives 0.0213 on the same patch and the same
   * note. `yoshimi-test.mjs` and `cc-test.mjs` both wait, each with a comment
   * saying an .xiz is read off an SD card and parsed. This page sent them in
   * one breath and was silent for it.
   *
   * ⚠️ THE FIRST FIX FOR THIS REPORT WAS REAL AND WAS NOT THIS. A page that
   * found yoshimi already running never sent a note at all. Fixing that made
   * the note arrive, and it arrived too early, which looks identical from a
   * chair: no sound, no error, every counter correct.
   */
  const PATCH_SETTLE_MS = 900;
  async function selectAndHold() {
    sendId({ type: 'voice.select', channel: 0, bank: BANK, program: PROGRAM, name: PATCH });
    await wait(PATCH_SETTLE_MS);
    holdNote();
  }

  function holdNote() {
    sendId({ type: 'note.on', note: NOTE, vel: VEL, channel: 0 });
    noteAt = performance.now();
    peak = 0;
    /**
     * 🔴 AND IF IT MAKES NO SOUND, THE PAGE SAYS SO. Every counter on this page
     * reads correct while the board streams silence, which is how the fault
     * above survived two reports: the stream arrives at fifty frames a second
     * whether or not anything is sounding. A held note that produces nothing is
     * a fault and belongs in the log, which is where this page's real faults
     * are reported.
     */
    const asked = noteAt;
    setTimeout(() => {
      if (asked !== noteAt || releasedAt > noteAt) return;   // a newer note, or it was released
      if (peak > 0.002) return;
      d.log('the note is not sounding: the board is streaming silence. Press stop and play again, or check nothing else is holding the instrument', 'bad');
    }, 1800);
  }

  async function startNote() {
    await startAudio();
    await measureRtt();
    const status = boardAnswered ? { ok: playing !== null, source: playing } : await askStatus();

    if (MAY_PLAY) {
      if (status && status.ok && status.source === 'yoshimi') {
        /**
         * 🔴 AND IT STILL HAS TO PLAY A NOTE. REPORTED 2026-09-16: *"No sound
         * in the knobs. There used to be sound when you moved your own knobs,
         * but now there ain't."*
         *
         * This branch armed the page and sent nothing, so the only press that
         * ever made a sound was one that STARTED yoshimi. Once the board was
         * left running, which is what every measurement of it does, every press
         * landed here and the page went quiet while reporting that all was
         * well. Not restarting an instrument is not the same as not playing a
         * note, and this branch had confused the two.
         */
        armed = true;
        await selectAndHold();
        d.log(`yoshimi was already up, so nothing was restarted. ${PATCH} is loaded and one note is held. Drag the sliders`, 'hi');
      } else if (status && status.ok) {
        // 🔴 DO NOT AUTOSTART OVER SOMEBODY. There is one JACK graph and one
        // instrument, so starting here stops whatever `/box/` or `/grains/` is
        // doing. Say what is running and let a person decide.
        d.log(`${status.source} is playing on the board and this page will not stop it. Nothing here is going anywhere until it is free`, 'warn');
      } else if (status) {
        d.log(`starting yoshimi on the board and loading ${PATCH}. This takes ten to forty seconds`);
        const r = await ask({ type: 'audio.start', source: 'yoshimi' }, 'audio.started', 60000);
        if (r?.ok) {
          armed = true;
          await selectAndHold();
          d.log(`${PATCH} is loaded and one note is held. Drag the sliders`, 'hi');
        } else {
          // A recovery action is not free, and a wedged jackd cannot be
          // restarted from a page. Report the reason verbatim and stop.
          d.log(`the board could not start yoshimi${r?.reason ? ` · ${r.reason}` : ' and did not say why'}`, 'bad');
        }
      }
    } else {
      d.log('a check is running, so nothing has been sent to the board: it is shared hardware and somebody may be using it. Add ?board=1 to let this press through', 'warn');
    }

    // ⚠️ THE SILENT WORK GOES FIRST. The sweep takes 600 ms and asserts nothing
    // while it runs, so with it in the middle the harness saw the free checks,
    // waited 400 ms, and stopped before anything else arrived. Every assert on
    // this page now lands in one uninterrupted run.
    if (SELFCHECK) { await sweepChecks(); freeChecks(); }
    checkAll();
  }

  function panic() {
    // The sliders come back to neutral, which is where the patch's own filter
    // is, and the board is told to release every note. The board may be holding
    // notes this page never pressed, so the message has to go out as well as
    // the handles coming home.
    if (MAY_PLAY && armed) sendId({ type: 'note.panic' });
    releasedAt = performance.now();
    // Home is where each slider opened, which is not the same number for the
    // two of them: the cutoff opens where the filter can be heard and the
    // resonance opens where its maker left it.
    cutoff.set(CUTOFF_HOME, { glideMs: 240 });
    reso.set(NEUTRAL, { glideMs: 240 });
    d.log(`stopped: every note released, cutoff back to ${CUTOFF_HOME} and resonance to ${NEUTRAL}`);
  }

  // Reachable from a probe, the way `window.__hls` and `window.__strip` are on
  // other pages: `frames` is how much stream has arrived and `peak` is whether
  // any of it was a sound. A page that can only be asked "did frames arrive"
  // cannot tell a held note from silence, which is the fault this pair exists
  // to make visible from outside.
  window.__knobs = { get frames() { return frames; }, get peak() { return peak; },
                     get armed() { return armed; } };

  // ── the checks ────────────────────────────────────────────────────────────
  //
  // 🔴 NOTHING HERE OPENS A SOCKET, MAKES A SOUND, MOVES A CONTROL OR MOVES THE
  // PICTURE FOR A VISITOR. The three rules the page's wiring depends on are
  // arithmetic and are graded on a scratch gate with a clock supplied by the
  // caller, so they cost a visit nothing and still run when the board is down.
  // The page's own sliders are only driven under `?selfcheck=1`, because a
  // scripted sweep would fight a hand that is already on one.
  function freeChecks() {
    // 🔴 GATED TOO, for the reason in `checkAll`. These cost a visitor nothing
    // and move nothing, and they still put lines in the box where this page's
    // real faults are reported. The rule is not "cheap checks may run".
    if (!SELFCHECK) return;
    // Rule 1, and it is the only failure that matters for a level control: if
    // the LAST value of a gesture is held back, the filter stays wrong forever.
    const g1 = makeCcSend();
    g1.put(CUTOFF, 10); const first = g1.tick(0);
    g1.put(CUTOFF, 20); const mid = g1.tick(1);
    g1.put(CUTOFF, 30, { end: true }); const last = g1.tick(2);
    d.assert('the last value of a drag is never held back, whatever the clock says',
      !!first && mid === null && last?.set?.[0]?.[1] === 30,
      `a move ${mid === null ? 'inside the gate was held' : 'was not held'} and the release went out at ${last?.set?.[0]?.[1]}`);

    // Rule 4, the whole repair a level plane needs. No ack, no sequence number,
    // no retransmit queue: state the console again and a lost last value fixes
    // itself within half a second.
    const g2 = makeCcSend();
    g2.put(CUTOFF, 100); g2.tick(0);
    const quiet = g2.tick(RESTATE_MS - 1);
    const again = g2.tick(RESTATE_MS);
    d.assert(`with nothing moving, the whole console is stated again every ${RESTATE_MS} ms`,
      quiet === null && again?.restate === true && again.set.length === 1,
      again ? `nothing to say at ${RESTATE_MS - 1} ms, and ${again.set.length} controller restated at ${RESTATE_MS}` : 'nothing was restated');

    // The relay's budget is counted in MESSAGES, so two sliders moving together
    // have to cost one message rather than two.
    const g3 = makeCcSend();
    g3.put(CUTOFF, 91); g3.put(RESO, 40);
    const both = g3.tick(0);
    d.assert('two sliders moving together travel in one message',
      both?.set?.length === 2 && g3.stats.messages === 1,
      both ? `${g3.stats.messages} message carrying ${both.set.length} values` : 'nothing went out');

    // ⚠️ THE NAME OF THIS CHECK WAS TRUE UNTIL THE CUTOFF MOVED. Both sliders
    // used to open at the patch's own neutral; the cutoff now opens where the
    // filter can actually be heard, so the claim is about each slider's own
    // home rather than about one number.
    d.assert('each slider opens at its own home, and the cutoff\u2019s is where it can be heard',
      cutoff.get() === CUTOFF_HOME && reso.get() === NEUTRAL,
      `cutoff ${cutoff.get()} where the filter can be heard, resonance ${reso.get()} where its maker left it`);
  }

  /**
   * A drag, driven the way a finger drives one: the handle is painted and the
   * page's own `onInput` handler runs for every position, then one `onChange`
   * for the release. Behind `?selfcheck=1`, because it moves the picture.
   *
   * ⚠️ THE CEILING IS COMPUTED FROM THE TIME THE SWEEP ACTUALLY TOOK, not from
   * the time it was asked to take. A check that depends on when something
   * landed has to confirm where it landed.
   */
  let sweep = null;
  async function sweepChecks() {
    // 🔴 ASK FOR THE COUNTERS, DO NOT WAIT TO BE TOLD. The board pushes
    // `ctl.meter` once a second and ONLY while something is moving, which is
    // right for a page a person is watching and wrong for a check: whether the
    // push lands before the asserts run is a race, and it read red about a
    // board that was writing every value correctly. `ctl.meter` is also a
    // request verb, and the sweep below takes long enough that the answer is
    // always in hand by the time anything is claimed.
    if (MAY_PLAY) sendId({ type: 'ctl.meter' });
    const before = { offered: gate.stats.offered, messages: gate.stats.messages, thinned: gate.stats.thinned };
    const steps = 60, ms = 600;
    const t = performance.now();
    for (let i = 0; i <= steps; i++) {
      const v = Math.round(NEUTRAL + (127 - NEUTRAL) * (i / steps));
      cutoff.set(v, { quiet: true });      // the handle, painted, no callbacks
      move(CUTOFF, v);                     // what a pointermove does
      await wait(ms / steps);
    }
    land(CUTOFF, 127);                     // what a pointerup does
    const took = performance.now() - t;
    sweep = {
      took,
      offered: gate.stats.offered - before.offered,
      messages: gate.stats.messages - before.messages,
      thinned: gate.stats.thinned - before.thinned,
      ended: gate.live.get(CUTOFF),
    };
    cutoff.set(CUTOFF_HOME, { quiet: true });
  }

  function checkAll() {
    /**
     * 🔴 NOT FOR A VISITOR. NOT ONE OF THEM, EVER. PHOTOGRAPHED 2026-09-16 on a
     * phone, on the deployed site, with no query string: two red FAIL lines in
     * the log under the sliders, on a page where nothing was wrong.
     *
     * This ran on every press of Play, which is a REAL person's press, and then
     * graded the board against conditions only a harness creates. `the board
     * wrote to the synth what this page put on the wire` needs controller
     * traffic, and somebody who has pressed play and not yet touched a slider
     * has made none: the board pushes its counters only when they MOVE, so the
     * page had nothing to read and said so in red.
     *
     * CLAUDE.md's rule is the whole of the answer and it has no exceptions.
     * `demo/verify.mjs` appends `selfcheck=1`, so the suite still grades
     * everything, and a visitor gets the page.
     */
    if (!SELFCHECK) return;
    // ── reachable with no board at all ───────────────────────────────────
    d.assert('the page reached the relay', wire.state() === 1,
      wire.state() === 1 ? `open in ${ROOM}` : `readyState ${wire.state()}${wire.stats().refusal ? ` · ${wire.stats().refusal}` : ''}`);
    d.assert('the relay answered a round trip with nothing woken at the far end',
      Number.isFinite(rtt), rtt === null ? 'no pong came back' : `${Math.round(rtt)} ms`);
    // The relay echoes verbatim to the sender, so the difference between what
    // went out and what came back is this socket's drop count, with no
    // cooperation from anybody. A few can be in flight at check time.
    const w = wire.stats();
    d.assert('the relay delivered the control messages this page sent',
      w.sent > 0 && w.sent - w.echoed <= 3,
      `${w.echoed} of ${w.sent} came back${w.refused ? `, ${w.refused} refused by this page as too big` : ''}`);
    // Both branches. A board that is off is the ordinary case, and a page that
    // only asserts the happy path has no coverage on those days.
    // ⚠️ `d.api.logs`, NOT `d.logs`. The mount API does not carry the array;
    // only `window.__demo` does, and `d.api` is that object. `/rack/` reads
    // `d.logs.length` in exactly this position and throws a TypeError on the
    // branch where the far end is off, which is the branch that runs on the
    // ordinary day.
    d.assert('it says whether a board answered in this room',
      boardAnswered ? !!boardSaid : d.api.logs.some((l) => l.msg.includes('no board answered')),
      boardAnswered ? boardSaid : `nothing answered in ${ROOM}, and the log says so`);
    /**
     * 🔴 THE TWO THINGS A VISITOR REPORTED, AS CHECKS RATHER THAN AS A FIXED
     * BUG. *"Sound just ends. There shouldn't be a transport slider. It should
     * go forever."* Both were true of this page and both are the kind of thing
     * that creeps back in the next time somebody reaches for the transport,
     * because a scrub and an end are what a transport USUALLY has.
     */
    /**
     * 🔴 THE PICTURE IS LAST AND CARRIES THE STANDING HEADING, AND THIS PAGE
     * SHIPPED WITH NEITHER. REPORTED 2026-09-16 with a screenshot: *"no heading
     * on diagram. and not last in page. breaking the rules afgain and afain"*.
     *
     * The cause was that `how` and `atEnd` are `createDiagram`'s THIRD argument
     * and had been written inside the spec, where they are two unread keys
     * rather than an error. Nothing could see it: not the parser, not `cuts`,
     * not the suite. So it is a check now, and it is about the page rather than
     * about the call, because the next way to get this wrong will not be the
     * same way.
     */
    const kids = [...document.body.children].map((e) => e.className.split(' ')[0]);
    const fig = kids.lastIndexOf('pos-dg');
    /**
     * 🔴 AND THE PICTURE REPORTS ITS OWN DAMAGE. `createDiagram` collects every
     * label it had to shorten, every note over about forty words and every
     * arrow it could not route, and a page that never reads that list ships a
     * cut label looking exactly like a picture that is fine.
     */
    d.assert('nothing in the picture was cut, shortened or left undrawn',
      (dg.cuts?.length ?? 0) === 0,
      (dg.cuts?.length ?? 0) === 0 ? `${dg.ties ?? 0} tie(s), nothing reported`
        : dg.cuts.map((c) => `${c.id}: ${c.shown}`).join(' · '));
    d.assert('the picture is the last thing on the page, under the standing heading',
      fig === kids.length - 1 && kids[fig - 1] === 'pos-how'
        && document.querySelector('.pos-how')?.textContent === 'How it works',
      `${kids.join(' -> ')} · heading "${document.querySelector('.pos-how')?.textContent || 'none'}"`);
    d.assert('the transport offers no position and no loop, because a held note has neither',
      !d.el.querySelector('.tbar-loop') && bar.el.dataset.scrub !== '1',
      `${d.el.querySelector('.tbar-loop') ? 'a LOOP button is on the bar' : 'no loop'} · scrub ${bar.el.dataset.scrub}`);
    // ⚠️ THIS READ THE `LIVE` CHIP UNTIL THE BADGE REPLACED IT. The claim has not
    // weakened: there is still no clock, because a held note has no position to
    // count towards, and the slot now carries the fact actually worth having.
    d.assert('the bar carries the board\u2019s presence where a clock would be, and no clock',
      !!bar.el.querySelector('.pos-pres') && !bar.el.querySelector('.tbar-time'),
      bar.el.querySelector('.pos-pres')
        ? `the badge reads "${bar.el.querySelector('.pos-pres-w')?.textContent || ''}", and there is no clock`
        : 'no presence badge in the bar');
    d.assert('this page makes no sound of its own',
      !!ctx && !!playout, 'every sample it can play arrived over the socket');

    // ── the gate, driven through the page’s own sliders ───────────────
    if (SELFCHECK && sweep) {
      // 50 a second is the gate, plus one for the release and a little slack
      // for a browser that did not hand the timer back on time.
      const ceiling = Math.ceil(sweep.took / SEND_GATE_MS) + 4;
      d.assert(`a fast drag is thinned to one value per slider every ${SEND_GATE_MS} ms`,
        sweep.offered >= 40 && sweep.thinned > 0 && sweep.messages <= ceiling && sweep.messages >= 4,
        `${sweep.offered} positions in ${Math.round(sweep.took)} ms became ${sweep.messages} messages, ceiling ${ceiling}`);
      d.assert('and the position the hand stopped at was sent anyway',
        sweep.ended === 127, `the drag ended at 127 and the gate holds ${sweep.ended}`);
      if (!MAY_PLAY) {
        d.assert('a scripted press does not take a shared instrument away from whoever is using it',
          wireMsgs === 0 && !armed && heldBack > 0,
          `the gate made ${gate.stats.messages} messages, ${heldBack} were held back and ${wireMsgs} went on the wire`);
      }
    }

    // ── only answerable with a board ─────────────────────────────────────
    if (!armed) return;
    d.assert('an instrument named itself', playing === 'yoshimi', String(playing));
    d.assert('the shape of a frame is checked against what the board publishes, not read off its size',
      shapeChecked && !shapeWrong, shapeSaid || 'no frame has arrived yet');
    d.assert('the sample rate it sends is the one this page plays at',
      ctx?.sampleRate === RATE, `context ${ctx?.sampleRate} Hz against ${RATE} Hz from the board`);
    /**
     * 🔴 ONLY WHEN A NOTE IS ACTUALLY BEING HELD. The harness drives this
     * transport itself, and stop here is a PANIC, so a drill that presses play
     * and then stop leaves nothing sounding: asking for a sound after that is
     * asking the page to answer for a note somebody released. The claim is
     * skipped in words rather than failed, the way `/replay/` skips its loop
     * check, because a check that cannot be answered and a check that answered
     * badly must not look the same.
     * ⚠️ AND IT IS A LEVEL, NOT A COUNT. The board captures its JACK graph
     * continuously, so frames arrive at fifty a second whether or not anything
     * is sounding, and `104 frames of audio` read green through a reported
     * silence.
     */
    if (noteAt && releasedAt < noteAt) {
      d.assert('sound came back while the note was held, and it was not silence',
        frames > 20 && peak > 0.005,
        frames <= 20 ? `only ${frames} frames arrived`
          : `${frames} frames, loudest sample ${peak.toFixed(4)} of full scale`);
    } else {
      d.log(noteAt ? 'the note was released before the checks ran, so there was nothing to hear'
        : 'no note was held, so this run cannot say whether sound comes back');
    }
    d.assert('the relay dropped none of it', pcmMissing === 0, `${pcmMissing} missing of ${frames + pcmMissing}`);
    d.assert('the board wrote to the synth what this page put on the wire',
      !!meter && meter.in > 0 && meter.out > 0 && meter.out <= meter.in,
      meter ? `${meter.in} values arrived, ${meter.out} written, ${meter.folded} overtaken on the way` : 'the board reported no counters');
    /**
     * ⚠️ `-1` IS NOT A READING AND MUST NOT READ AS A FAILURE. `breaks` opens
     * at -1 meaning the worklet has not reported yet, which is neither `=== 0`
     * nor `> 0` — so this asserted false and printed `no breaks` as its own
     * detail, a check contradicting itself in the same line. PHOTOGRAPHED on a
     * phone. A quantity nobody has measured yet is said in those words.
     */
    /**
     * 🔴 TWO CLAIMS, NOT ONE, BECAUSE THEY HAVE DIFFERENT CAUSES AND ONLY ONE
     * OF THEM IS FIXED. Running dry is a cushion too small for the arrival
     * jitter, and it is cured: MEASURED worst gap 83.6 ms against a 160 ms
     * floor. Trimming is the board's clock and this browser's clock disagreeing
     * by a fraction of a per cent, which no cushion size can cure: the buffer
     * grows until it is cut back, and a bigger floor only sets where that
     * happens. So the check asserts the half that is fixed and REPORTS the half
     * that is not, rather than excusing itself with an `or`.
     * ⚠️ THE TRIM IS STILL AUDIBLE and is in BACKLOG.md as its own problem: the
     * repair is matching the rate, not padding it.
     */
    d.assert('the cushion never ran dry, which is the half a cushion can fix',
      starved === 0,
      breaks < 0 ? 'the playout has not reported yet, so there is nothing to say'
        : `${starved} ran dry, ${trimmed} trimmed, cushion now ${Math.round(bufMs)} ms`);
    if (trimmed > 0) {
      d.log(`the playout trimmed ${trimmed} time${trimmed === 1 ? '' : 's'}: the board's clock and `
        + 'this browser\u2019s drift apart, so the cushion grows until it is cut back', 'warn');
    }
  }

  // Finer than the gate, so a value it held back is never held much longer than
  // the gate's own 20 ms, and so the 500 ms restatement has a clock to ride on
  // with nothing moving. Started last, after the socket exists.
  setInterval(pump, 10);

  /**
   * 🔴 NOTHING IS ASSERTED AT LOAD, AND THIS PAGE LOST TEN CHECKS BY DOING IT.
   * `verify.mjs` stops collecting 400 ms after the last assert, and `settleMs`
   * is the budget for a page's FIRST one. `freeChecks()` ran here, so the
   * window opened and shut inside the first second while the checks behind the
   * play press arrived eight seconds later with nobody counting: 27 asserts
   * became 17, every one of them green, which is the worst shape a loss takes.
   * The press drives the free lane, the sweep and the board lane in one run,
   * which is what `/replay/` had to learn for the same reason.
   */
  /**
   * 🔴 THE PICTURE GOES LAST AND IT IS REFERENCE. `{ how: true, atEnd: true }`
   * and no title: the heading lives in `diagram.mjs` so no page can invent a
   * second wording for it. A diagram is read once, on purpose, by somebody who
   * has already dragged a slider and wants to know what is behind it, which is
   * under the controls rather than in front of them.
   */
  const dg = createDiagram(d.el, {
    caption: 'Your hand makes more positions than the wire needs to carry, so the page sends a '
      + 'thinned version of your gesture: SENT counts what went out, SKIPPED counts what was '
      + 'overtaken before its turn, and PLAYED counts what the board wrote to the synth.',
    nodes: [
      /**
       * 🔴 `join: false`, BECAUSE THESE THREE ARE NOT A CHAIN. REPORTED
       * 2026-09-16 with a screenshot: *"why send gate connects to playout?"*.
       *
       * An arrow between two neighbours is the container's DEFAULT, and it was
       * drawing `send gate -> playout`, which says the gate feeds the playout.
       * It does not: one is control leaving and the other is audio arriving, and
       * they never touch. The real chain is declared, sliders into the gate, and
       * the third box belongs to the return path, which reaches it from outside
       * the machine.
       * ⚠️ A DECLARED LINK IS UNAFFECTED: `join` only decides what an UNDECLARED
       * gap between two neighbours looks like, so the arrow that is true still
       * draws and the one that was invented does not.
       */
      { id: 'you', label: 'Browser', kind: 'here', tech: 'browser',
        join: false,
        children: [
          { id: 'sliders', label: 'sliders', sub: 'cutoff, resonance', tech: 'browser',
            note: 'Two ordinary range inputs, dragged with a finger or a mouse. Each one sends '
                + 'a MIDI control change, numbers 74 and 71, which is what the cutoff and '
                + 'resonance knobs on a synthesiser have sent since the 1980s.' },
          { id: 'gate', label: 'send gate', sub: 'one value per 20ms', tech: 'browser',
            note: 'A dragging finger reports about a hundred positions a second, far more than '
                + 'a filter can be heard to follow. This keeps only the newest value for each '
                + 'slider and sends one every 20 milliseconds.' },
          { id: 'playout', label: 'playout', sub: 'AudioWorklet, 160ms', tech: 'sound',
            note: 'Sound crosses the internet in uneven bursts, so this collects 160 '
                + 'milliseconds before playing any and plays out of that store. Run it empty '
                + 'and you hear a gap; fill it too deep and the filter answers late.' },
        ] },
      // ⚠️ NO `sub` ON A CONTAINER. Asked 2026-09-16: *"rm outer boxes descs not
      // helpful"*. `phone or laptop`, `one object` and `in another building` were
      // three captions saying what the boxes inside them already say: the
      // children name the machine better than a phrase above them can.
      { id: 'cf', label: 'Cloudflare', kind: 'cloud', tech: 'cloudflare',
        children: [
          // The name is `Relay`; `Durable Object` under it is what kind of thing it
          // is, so `Relay object` said the kind twice and spent a third of the
          // label's width doing it.
          { id: 'relay', label: 'Relay', sub: 'Durable Object', tech: 'cloudflare',
            note: 'A small program at Cloudflare that holds a room open and copies every '
                + 'message to everyone else in it, without reading any of them. It exists '
                + 'because a browser cannot dial a Raspberry Pi behind a home router.' },
        ] },
      // `raspberry` is in `TECH_HUE` and `board` never was, so this box had been
      // taking whatever the rotation handed it.
      { id: 'pi', label: 'Raspberry Pi', kind: 'box', tech: 'raspberry',
        children: [
          { id: 'yoshimi', label: 'yoshimi', sub: 'ZynAddSubFX', tech: 'sound',
            note: 'A software synthesiser, free and open, holding one note for as long as you '
                + 'let it. Its filter follows controller 74: measured here, the sliders move '
                + 'the sound from 162 Hz to 11.7 kHz, about six octaves.' },
          /**
           * 🔴 TWO BOXES, BECAUSE THEY ARE TWO PROGRAMS. Asked 2026-09-16:
           * *"should it break into 2 boxes (jack / ffmpeg)"*. One box called
           * `capture` with `ffmpeg, JACK` under it was a sub doing a diagram's
           * job: the fact that the synth is not wired to a loudspeaker but to a
           * sound server, and that something else reads it from there, was a
           * sentence in a note instead of a thing a reader can point at.
           * ⚠️ IT ALSO EVENS THE PICTURE. The Browser holds three boxes and the
           * board held two, and containers are drawn to one height, so the
           * board's spare row was blank ground in every machine beside it.
           */
          { id: 'jack', label: 'JACK', sub: 'sound server', tech: 'sound',
            note: 'The sound system Linux studios use, which lets separate programs pass audio '
                + 'to each other as if they were patched with cables. The synth plays into it '
                + 'rather than into a loudspeaker, so nothing in the room hears this.' },
          { id: 'ffmpeg', label: 'ffmpeg', sub: '20ms pieces', tech: 'sound',
            note: 'Takes the sound out of JACK and cuts it into 20 millisecond slices of raw '
                + 'samples, 48 kHz and one channel, uncompressed. It runs continuously, so '
                + 'slices keep arriving even when no note is sounding.' },
        ] },
    ],
    links: [
      { from: 'sliders', to: 'gate',
        note: 'Every position your finger passes through is offered here, and most are thrown '
            + 'away because a newer one arrives first. The position you let go on is always '
            + 'kept, since that is the one that stays true.' },
      { from: 'gate', to: 'relay', label: 'ctl.set',
        note: 'Both sliders travel in one message rather than two, because the relay limits how '
            + 'many messages a page may send rather than how much they carry. Sweeping both at '
            + 'once uses about a twentieth of that allowance.' },
      // ⚠️ `CC`, NOT `CC 74, CC 71`. Asked for after a screenshot showed it
      // wrapping onto two lines over the gap between two machines. Which
      // controllers travel is in the note and on the sliders themselves; what
      // the arrow has room to say is what KIND of thing is crossing.
      { from: 'relay', to: 'yoshimi', label: 'CC',
        note: 'The board writes each value to the synth as three raw MIDI bytes. If several '
            + 'arrive at once it keeps only the last for each slider, because the earlier ones '
            + 'describe a position your hand has already left.' },
      { from: 'yoshimi', to: 'jack',
        note: 'The synth writes its sound into the sound server rather than to an output. The '
            + 'Raspberry Pi is making this noise whether or not anybody is connected to hear '
            + 'it.' },
      { from: 'jack', to: 'ffmpeg',
        note: 'A connection made once when the board starts, the software equivalent of '
            + 'plugging a cable from the synth into a recorder.' },
      /**
       * ⚠️ BOTH HALVES OF THE RETURN CARRY THE SAME LABEL, BECAUSE THE SAME
       * THING IS TRAVELLING. Reported 2026-09-16: *"47khz mono on one sound
       * connector, other nothing, not good. its PCM slices?"*. It is: raw
       * samples, uncompressed, in 20 ms slices. One arrow said the format and
       * the next said nothing, which reads as two different journeys.
       * The rate and the channel count moved into ffmpeg's own note, where
       * there is room for them and where they describe the thing that chose
       * them.
       */
      { from: 'ffmpeg', to: 'relay', label: 'PCM slices', back: true,
        note: 'Fifty slices of sound a second, each stamped with a number so the far end can '
            + 'tell whether any went missing on the way. The LOST cell above counts gaps in '
            + 'those numbers.' },
      { from: 'relay', to: 'playout', label: 'PCM slices', back: true,
        note: 'The sound comes back down the same connection the slider values went out on. '
            + 'Nothing else sends audio into this room, so its arrival is also how the page '
            + 'knows the Raspberry Pi is still there.' },
    ],
    // ⚠️ `how` AND `atEnd` ARE THE THIRD ARGUMENT, NOT PART OF THE SPEC. Put
    // inside it they are silently ignored, and the page shipped with no heading
    // and the picture sitting above the log: both rules broken at once, and
    // neither the harness nor `cuts` can see it, because a spec with two extra
    // keys is not an error. Every other page with a diagram passes them here.
  }, { how: true, atEnd: true });

  d.ready();
</script>
</html>
