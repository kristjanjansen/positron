<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* 🔴 ONE PITCH, DECLARED ONCE, AND THE JAVASCRIPT NEVER TYPES IT AGAIN.
     A step's width decides where the playhead band sits, how wide the ruler
     tick under it is, and how far an arrow key moves. Three numbers that have
     to agree, and `--sld-col` is already this project's record of what happens
     when a shared measurement is typed in two files: `/radio/`'s label column
     snapped back to the width of one word and was reported three times.
     ⚠️ THE PAGE READS IT OFF THE LAID OUT ELEMENTS rather than off this
     declaration, so even this token cannot disagree with the picture: the head
     takes the ruler tick's own `offsetLeft` and `offsetWidth`.
     ⚠️ AND THE ROW PITCH IS THE SAME ONE, which is what makes the fixed name
     column line up with the steps beside it. `panel-layout.mjs`'s contract puts
     the two in separate flex children, so nothing in the browser makes them
     agree: they agree because every cell on both sides is `--tom-cell` tall
     with `--tom-gap` between. There is an assert on the top and bottom edges,
     because `/twelve/` records three alignments that looked like one and two of
     them lining up while the third was 30 px out. */
  .tom {
    --tom-gap: 2px;
    --tom-cell: 16px;
    /* ⚠️ THE RULER CARRIES NO TEXT SINCE 2026-09-21, so it is a press target and
       a measuring stick rather than a row of labels. 8 px is enough to press
       and small enough not to read as a band. */
    --tom-ruler: 8px;
    /* ⚠️ MEASURED RATHER THAN CHOSEN. `sample_10.wav` is thirteen characters of
       10 px mono, about 78 px, and the column has to hold that plus its own
       4 px each side or every row past nine reads `sample_10.wa`. It did, in
       the first screenshot. */
    /**
     * 🔴 A NUMBER, NOT A NAME, SO THE COLUMN IS 28 px RATHER THAN 108. Asked
     * 2026-09-21: *"rm divider vert line next to pads, just numbers 0..64 on
     * left"*. It was 108 px because `sample_10.wav` is thirteen characters of
     * 10 px mono, and every row in a pack differs only in the digits: 64 rows
     * of the same eight characters, in a column sized to hold a word none of
     * them differ in.
     */
    --tom-name: 22px;
  }
  /* 🔴 I READ `no top padding on titles` BACKWARDS AND SPENT FOUR ROUNDS
     REMOVING PADDING THAT WAS NOT THERE. It meant the title HAS no padding and
     needs some. Every repeat after it said so again, in plainer words each
     time, and each time I took more off: the card's top padding, then the
     plate's own, then ten pixels from both columns. The last report was
     `STILL NO TITLE PADDING`, in capitals, which is the same sentence as the
     first one.
     ✅ SO THERE IS NO OVERRIDE HERE AT ALL NOW. The plate sits at
     `panel-layout.mjs`'s own inset, which is what `/evo/`, `/twelve/` and
     `/circuit/` get, and it is the answer to *"you have several instroments
     done by now. can you not reuse ui?"*: the component already had this right
     and every line I wrote was moving away from it.
     ⚠️ ONE LINE IS STILL NEEDED AND IT ADDS RATHER THAN TAKES AWAY.
     `.panel-case` has NO vertical padding on purpose, which is what lets a
     divider reach the card's edges, so a plate placed as the case's first child
     sits 1 px under the border. `/twelve/` puts its plate above the boxes and
     `/circuit/` puts it inside the card, so neither of them has ever been in
     this position. The title gets its own room here, over it, which is what was
     asked for four times. */
  .tom .panel-plate { padding: 16px 0 0; }

  /* 🔴 NO DIVIDER. `panel-layout.mjs` gives a left fixed column a `border-right`
     and a gutter, which is right when the two halves are different KINDS of
     thing. Here they are one grid with its row labels: a rule down the middle
     is `positron-ui`'s separation rule broken in the smallest way, a line
     saying what the gap already says. (0,1,0) against the component's own
     (0,1,0), and this block is after `shell.css`, so it wins on order. */
  .tom-fixed { border-right: 0; padding-right: 0; }
  /* The column of names. `panel-fixed` already stacks; it has no gap of its own
     because the panel's flow is what normally carries one, and this page does
     not use the flow. */
  .tom-fixed { gap: var(--tom-gap); width: var(--tom-name); }
  /* ⚠️ THE SPACER IS THE RULER'S HEIGHT AND NOT A GUESS. It is the one child of
     the fixed column with no counterpart to measure against, so it is declared
     from the same token the ruler is. */
  .tom-spacer { height: var(--tom-ruler); flex: 0 0 auto; }
  /* 🔴 `line-height`, NOT `display: flex`, AND THAT IS WHY THE ELLIPSIS WORKS.
     A flex container's text is an anonymous flex item, and `text-overflow` does
     not reach it: the first build centred the name with `align-items` and every
     name past `sample_9.wav` was HARD CLIPPED mid word with no ellipsis, which
     photographs as a rendering fault rather than as a name that does not fit.
     Centring by line height leaves the text in an inline box, where the
     property applies. */
  .tom-name {
    height: var(--tom-cell); flex: 0 0 auto; padding: 0 6px 0 0;
    font: 500 10px/var(--tom-cell) var(--mono); color: var(--dim2);
    /* ⚠️ RIGHT ALIGNED AND `tabular-nums`, so 0 to 63 make one straight edge
       against the pads rather than a ragged one. It is the same reason the
       readout reserves its widest value. */
    text-align: right; font-variant-numeric: tabular-nums;
    overflow: hidden; white-space: nowrap;
  }
  /* A row whose sample can be heard is a button; a row with nothing behind it
     is a div. 🔴 NOT A DISABLED BUTTON: at rest every row is empty, and eight
     dimmed controls read as a page that failed rather than as a page waiting
     for a file. A control that cannot do what it names is this project's named
     lie, and the repair is to not draw the control. */
  button.tom-name {
    /* the global button rule is a 34 px pill with 18 px of padding; a cell in a
       grid is none of those things. The padding stays the one `.tom-name`
       already sets, so a row with a sample and a row without start their names
       at the same x. */
    height: var(--tom-cell); min-height: 0; border-radius: 3px;
    background: transparent; border: 0; color: var(--fg2);
    /* ⚠️ `right`, NOT `left`. The base `.tom-name` rule right aligns the
       numbers, and `button.tom-name` at (0,1,1) was quietly overriding it: a
       row WITH a sample is a button and a row without is a div, so opening a
       pack would have left aligned exactly the rows that had something in them
       and the straight edge asked for would have appeared only while the grid
       was empty. */
    text-align: right; cursor: pointer; display: block; width: 100%;
    /* The colour is the only thing that moves, so it is the only thing with a
       transition on it. */
    transition: color .18s ease-out;
  }
  /* 🔴 NO BACKGROUND ON A PREVIEW, ASKED FOR AS *"rm bg on sample preview, just
     animate color to yellow"*. Hearing a row is not selecting it: a filled box
     behind the number said *this one is chosen* and stayed saying it, while
     what actually happened was a sound that has already finished. Colour can
     say a moment; a box says a state.
     ⚠️ AND IT IS THE SAME LANGUAGE AS THE REST OF THE GRID, where the pads
     light rather than growing edges. This page has now had a box asked off it
     four times: the playhead cursor, the highlight border, the pad hover and
     this. */
  button.tom-name:hover { color: var(--fg); }
  .tom-name[data-pick] { color: var(--hi); animation: tom-heard .45s ease-out; }
  @keyframes tom-heard {
    0%   { color: #fff8dc; }
    100% { color: var(--hi); }
  }
  @media (prefers-reduced-motion: reduce) {
    .tom-name[data-pick] { animation: none; }
  }

  /* The steps. `width: max-content` so the panel's own scroller is what moves,
     which is contract 1 of `panel-layout.mjs`: one scrolling region, and the
     page never drags sideways. */
  .tom-grid {
    position: relative; width: max-content;
    display: flex; flex-direction: column; gap: var(--tom-gap);
  }
  .tom-ruler {
    display: flex; gap: var(--tom-gap); height: var(--tom-ruler);
    cursor: pointer;
  }
  .tom-tick {
    width: var(--tom-cell); flex: 0 0 auto; height: var(--tom-ruler);
    font: 500 9px/var(--tom-ruler) var(--mono); color: var(--dim2);
    text-align: center;
    text-align: left; letter-spacing: 0;
  }
  .tom-tick[data-bar] { color: var(--dim); }
  .tom-tick[data-now] { color: var(--hi); }
  .tom-rows { display: flex; flex-direction: column; gap: var(--tom-gap); }
  .tom-row { display: flex; gap: var(--tom-gap); height: var(--tom-cell); }
  /* 🔴 THE CELL OVERRIDES SIX THINGS THE GLOBAL `button` RULE SETS, and every
     one of them is a number that belongs to a pill rather than to a grid. */
  /* 🔴 THE PADS FILL THE WIDTH AND ARE SQUARE, ASKED FOR AS *"make tom pads fit
     the space"* and *"the rest of w are sqare pads"*. `--tom-cell` is measured
     from the strip in JavaScript rather than typed, because the name column and
     the steps live in separate flex children of `panel-layout.mjs` and nothing
     in the browser makes them agree: they agree because both sides are one
     token tall. Making the pads flex in CSS alone would have let the two halves
     drift the moment the window moved. */
  .tom-cell {
    width: var(--tom-cell); height: var(--tom-cell); min-height: 0; flex: 0 0 auto;
    padding: 0; border-radius: 3px;
    /* 🔴 NO BORDER, ASKED FOR AS *"rm borders on pads"*. That is the fifth time
       an edge has been asked off this grid: the playhead cursor, the highlight
       border, the pad hover, the preview box and now the pads themselves. The
       field IS the pad; an outline round it was a second way of saying where it
       is, and sixteen of them across a row read as a wire grid rather than as
       an instrument.
       ⚠️ `border: 0` AND NOT A COLOUR CHANGE, because `box-sizing: border-box`
       is global here: a 1 px border was taking 2 px out of every pad's inside,
       and keeping it transparent would keep taking them. */
    background: #171d29; border: 0;
  }
  /* Every fourth step is a beat and every sixteenth is a bar, so sixty four
     cells can be counted without reading the ruler. It is the field that
     changes and never the ink, which is the same decision `pattern.mjs` made
     for the opposite reason. */
  .tom-cell[data-beat] { background: #1c2331; }
  .tom-cell[data-bar] { background: #222b3c; }
  /* ⚠️ HOVER BRIGHTENS THE PAD AND LEAVES ITS EDGE ALONE, asked for as *"no
     border hover effect on pad, just make pad brigher on hover"*. A border that
     changes on hover is the bordered cursor arriving a third time, one property
     at a time: this grid has now had an edge asked off it for the playhead, for
     the focus ring and for this. The pad is the thing; its outline is not. */
  /* ⚠️ HOVER LIFTS THE FIELD AND DOES NOTHING ELSE, asked for as *"hover on pad
     only changes bg lighter a bit"*. `filter: brightness()` rather than a pair
     of typed colours, so a pad that is off, on, muted or under the playhead all
     lift by the same amount from whatever they already are, and none of them
     needs its own hover rule. Four states, one line. */
  .tom-cell:hover { filter: brightness(1.35); }
  /* 🔴 THE FOCUS RING SAT OUTSIDE THE PAD AND OVERLAPPED ITS NEIGHBOURS.
     Reported 2026-09-21 with a crop: *"outline looks bad"*, showing a 2 px
     yellow ring standing off a 16 px pad, wider than the 2 px gutter, so it
     drew over the two cells either side and read as a rendering fault.
     ✅ `outline-offset: -1px` PUTS IT INSIDE THE PAD, where it cannot reach a
     neighbour at any gap, and one pixel is enough on a shape this small. The
     ring is still the accent colour, because focus is the one thing on this
     grid that is about the person rather than about the music. */
  .tom-cell:focus-visible {
    outline: 2px solid var(--hi); outline-offset: -1px; border-radius: 3px;
  }
  /* 🔴 BRIGHTNESS SAYS WHETHER THIS CELL CAN MAKE A SOUND, WHICH IS THE ONE
     THING A READER CANNOT SEE ANY OTHER WAY. A cell on a row with no sample is
     switched on and silent, and colouring it like a cell that will sound would
     be the page asserting something nothing measured. Three greys and no hue,
     which is `grain-scope.mjs`'s settled answer reused: material is grey here,
     and the one thing that moves keeps the bright ink. */
  /* 🔴 CIRCUIT COLOURS, ASKED FOR AS *"use circuilt colors"* WITH A PHOTOGRAPH
     OF THE INSTRUMENT. A lit step on that machine is warm amber; the pad under
     the playhead is a cold near-white. So a lit cell is amber here and the
     column being played is white, which is the same two-colour language the
     hardware uses and the reason a reader can tell them apart at a glance.
     🔴 AND THE ROWS ARE NOT COLOURED BY DRUM TRACK, WHICH IS THE OBVIOUS THING
     TO DO AND WOULD BE A LIE. The photograph shows four drum tracks in two
     colours, orange and green, and it is tempting to paint rows 0 to 15 orange
     and so on. **Which of the Circuit's drum pads plays slot 37 is not known**:
     it is a property of a SESSION, it is in no WAV header, and
     `research/circuit-session-notes-2026-09-21.md` says so in as many words.
     Painting that mapping would be this project's label-as-content mistake for
     the fifth time in three days, in colour.
     ✅ SO COLOUR SAYS STATE, WHICH IS MEASURED: lit, silent, or playing. */
  /* ⚠️ LESS ORANGE, REPORTED AS *"still wrong hues on pads (orangey)"*. It was
     `#f0a030`, which is a red-leaning orange and the loudest hue on a page
     whose every other surface is a blue grey. The Circuit's lit pads photograph
     warm, but a photograph of a backlit silicone pad in a room is not a screen
     colour, and copying the camera's cast is how a page ends up with one
     element nothing else on it agrees with.
     ✅ ONE TOKEN, so moving it is one line rather than a hunt. */
  .tom-cell[data-on] { background: var(--tom-on); }
  /* A cell that is on but has no sample behind it stays grey, because
     brightness here says WHETHER THIS CAN MAKE A SOUND and nothing else can
     tell a reader that. */
  .tom-cell[data-on][data-mute] { background: var(--dim2); }
  /* 🔴 THE BAND MOVES WITH A TRANSFORM AND CHANGES NOTHING ABOUT LAYOUT. It is
     the only thing on this page that moves on its own, and `positron-ui`'s rule
     is that nothing redrawing may change how much room it takes. A transform on
     an absolutely positioned element takes no room at all. */
  /* 🔴 THE PLAYING COLUMN IS THE PADS THEMSELVES, WHITE, AND THEY BREATHE.
     Asked for as *"just hilite current col whit whitey (some anim)"*, then
     reported again as *"still no playing col hilite.."*, and finally, against a
     bordered column standing over the grid, *"just hilite the pads, no extra
     bordered cursor"*. The instrument in the photograph lights its pads; a band
     drawn on top was a second object with its own edge and its own alignment to
     get wrong.
     ⚠️ TWO TOKENS SO THE GENERATED `nth-child` RULES HAVE SOMETHING TO NAME.
     A colour written into sixteen generated rules would be sixteen places one
     decision lives. */
  .tom {
    /* ⚠️ OPAQUE RATHER THAN TRANSLUCENT. At .78 over a dark card the fill came
       out closer to the field than to white, so the only thing a reader could
       see was the edge, which is why the edge was asked for twice and then
       removed. The light is the fill now and there is nothing else. */
    /* 🔴 TWO BRIGHTNESSES, AND THE DIM ONE IS THE DEFAULT. Asked 2026-09-21:
       *"nonplaying hilited col should be way less bright"*. A full white column
       on a stopped page is the loudest thing on screen saying nothing is
       happening, and it competes with the lit steps a reader is actually
       editing. Playing, it is white; stopped, it is barely more than the field,
       which is enough to say where the playhead is parked and no more. */
    --tom-now: #dfe6ef;
    --tom-on: #e3c168;
  }
  /* ⚠️ THE BRIGHT VALUE AND THE BREATHING BOTH HANG OFF ONE ATTRIBUTE, set from
     the deck's own state rather than guessed from whether positions are
     arriving. A stopped grid does not animate at all, which is the rule about
     not running a frame loop to draw a still picture, one property along. */
  /* 🔴 THE PARKED COLUMN BREATHES AS WELL, AND DARKER. Asked 2026-09-21:
     *"hilited col when paused should breate and be bit darker"*. It held
     perfectly still at `brightness(1.85)`, which read as a selection rather
     than as a playhead waiting: what says *this is where it will start* is that
     it is alive, and what says *it is not running* is that it is dimmer. Two
     channels, one per fact, instead of stillness carrying both.
     ⚠️ EACH GENERATED RULE NAMES ITS OWN DURATION, 2.2 s parked and 1.4 s
     playing, so there is no third rule here overriding a fourth. A playhead
     that is waiting and one that is running must not pulse the same way or the
     animation stops carrying anything.
     ⚠️ AND IT IS `opacity` EITHER WAY, so nothing it does can change how much
     room anything takes, and reduced motion stops it dead.
  @media (prefers-reduced-motion: reduce) {
    .tom-rows .tom-cell { animation: none !important; }
  }
  /* ⚠️ THE PARKED BREATH IS SHALLOWER AND SLOWER THAN THE PLAYING ONE. A
     playhead that is running and one that is waiting should not pulse the same
     way, or the animation stops carrying anything. */
  @keyframes tom-breathe {
    0%, 100% { opacity: .82; }
    50%      { opacity: 1; }
  }
  /* ⚠️ IT MOVES ON A PRESS AND NEVER ON A CLOCK, which is what makes a line of
     prose allowed here at all. It says which sample was last heard and why, and
     it is a fixed box either way so a longer name cannot move the grid under
     it. */
  .tom-line {
    font: 400 12px/1.5 var(--mono); color: var(--dim); min-height: 1.5em;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createDrop } from '/shell/drop.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createStepper } from '/shell/stepper.mjs';
  import { createPanelLayout, createNameplate } from '/shell/panel-layout.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { readZip } from '/shell/unzip.mjs';
  import { samplesIn, toMono, summariseAll } from '/shell/circuit-sample.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';

  /**
   * 🔴 THIS PAGE SENDS NOTHING AND ASKS NOBODY FOR ANYTHING, AND BOTH ARE
   * ASSERTED OVER COUNTERS RATHER THAN OVER A READING OF THE SOURCE. A grep for
   * `requestMIDIAccess` finds it absent on every day it is absent and says
   * nothing about the day somebody adds it behind a helper. The reason it
   * matters here is the same one `/pack/` writes down: a Circuit has no factory
   * reset, one byte separates `Replace Current Patch` from `Replace Patch`, and
   * the file this page opens is somebody's only backup of that flash. Nothing
   * on this page can reach an instrument.
   */
  let midiAsked = 0;
  if (navigator.requestMIDIAccess) {
    const real = navigator.requestMIDIAccess.bind(navigator);
    navigator.requestMIDIAccess = (...a) => { midiAsked++; return real(...a); };
  }
  let fetched = 0;
  const realFetch = window.fetch.bind(window);
  window.fetch = (...a) => { fetched++; return realFetch(...a); };

  // 🔴 THE PACK IN THIS REPOSITORY IS NOT PUBLISHED AND MUST NOT BE.
  // `workers/view/build.mjs` copies an explicit allowlist and this file is not
  // on it, deliberately: it holds 32 of somebody's sessions. Whether it is here
  // is decided from the ORIGIN rather than discovered by fetching, because a
  // build that discovers it with a 404 takes the deploy run red on `no console
  // errors`, and a red that is expected is a red everybody skips. Copied from
  // `/pack/` on purpose: two pages deciding this two ways is one page deciding
  // it wrong.
  const PACK = '/New%20Pack.circuitpack';
  const PACK_HERE = location.protocol === 'file:'
    || /^(localhost|127\.|0\.0\.0\.0|\[::1\]|192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/
      .test(location.hostname);

  /**
   * 🔴 SIXTY FOUR STEPS ACROSS AND EIGHT ROWS DOWN UNTIL A PACK LANDS, WHICH IS
   * ONE OF TWO READINGS OF THE ASK AND IS SAID OUT LOUD RATHER THAN CHOSEN IN
   * SILENCE. The request was *"a 8x64 grid with transport on top. have
   * circuitpack uploader on top (as many rows as there are samples)"*. Read as
   * ROWS by STEPS: 8 rows is what there is before a file is open, the
   * parenthesis says the rows become the samples once one is, and 64 is the
   * step count. The other reading, 8 steps and 64 rows, is not ruled out by the
   * words, and it is ruled out by the parenthesis only if `rows` means the
   * first number. `BACKLOG.md` carries both.
   * ⚠️ SWAPPING THEM IS `REST_ROWS` AND `STEPS` CHANGING PLACES AND NOTHING
   * ELSE. Nothing below counts either of them twice.
   *
   * 🔴 AND IT IS SIXTEEN STEPS SINCE 2026-09-21, SETTLED IN THREE WORDS:
   * *"tom: 16 col"*. That is a Circuit pattern's own length, which is the
   * instrument this grid's rows come out of, so the page and the machine now
   * count the same way. It also puts the whole pattern on a phone: sixty four
   * columns meant about ten of them were on screen at 390 px and the other
   * fifty four had to be dragged to.
   * ⚠️ THE RULER'S MARKS SURVIVE THE CHANGE, which is the thing that would
   * quietly have stopped meaning anything. A beat mark every 4 steps and a bar
   * mark every 16 describe 4 bars over 64 and ONE bar over 16, and both are
   * true statements about the grid rather than decoration that happens to land.
   */
  const STEPS = 16;
  /**
   * 🔴 SIXTY FOUR ROWS AT REST SINCE 2026-09-21, ASKED FOR AS *"make 64 rows"*.
   * That is the Circuit's own sample slot count, so an empty grid is now the
   * shape of the instrument rather than a placeholder eight, and opening a pack
   * fills rows that were already there instead of growing the page by 56.
   * ⚠️ IT IS A TALL PAGE AND THAT IS THE TRADE. 64 rows is about 1,300 px, so
   * the transport scrolls off the top. A nested vertical scroller would push
   * the horizontal one below the fold and is the worse of the two.
   */
  const REST_ROWS = 64;
  /**
   * How long a step is, in milliseconds. 125 ms is a sixteenth note at 120
   * beats a minute, so the whole grid is eight seconds and four bars of four.
   * ⚠️ THERE IS NO TEMPO CONTROL AND THAT IS NOT AN OMISSION. The transport bar
   * renders a rate lattice off `caps.rates`, so the bar's own 0.5x / 1x / 2x IS
   * the tempo: 60, 120 and 240 beats a minute. A second control setting the
   * same quantity from a different direction is two numbers that can disagree.
   */
  const STEP_MS = 125;
  /** One millisecond, so no event sits exactly on the range start. See the
   *  schedule below: an event at 0 is never re-armed by a backward seek. */
  const SCORE_EPS = 1;
  const SPAN = STEPS * STEP_MS;

  const d = mount({
    name: 'tom',
    what: 'tap a grid of 16 steps whose rows become the samples in a Circuit pack you open here',
    /**
     * Four cells, all of which move, and none of which is a structural
     * constant. `rows` is not among them because the number of rows is the
     * thing you are looking at; a cell counting what is on screen teaches a
     * reader to read the cell instead of the page.
     * ⚠️ `on` IS SET AT LOAD AND THE OTHER THREE ARE NOT. A census of a grid
     * that is visibly empty is a real reading of zero. A counter of sounds that
     * have not happened is not, and `0` there would read as a very confident
     * measurement of nothing.
     */
    readout: { on: '', step: '', voices: '', late: 'ms' },
    /**
     * 🔴 NO CONTROL ROW AT ALL, AND THE MISSING CONTROL IS `clear`. `verify.mjs`
     * presses every button in `.pos-controls` in order on every run, so a
     * control that empties the pattern is a control that empties the pattern
     * underneath this page's own reading checks, and the two race. The cells
     * are the controls here, the transport bar carries the transport, and a
     * reader who wants a cell off presses it again. If `clear` is wanted it
     * wants a way for the harness to press it safely first.
     */
    controls: [],
  });
  guard(d);

  // ── where the playhead is, as a step ────────────────────────────────────
  /**
   * 🔴 PURE, SO IT CAN BE GRADED WITHOUT A BROWSER OR A SOUND. Every bug a
   * grid like this has ever had lives in exactly this arithmetic: a step index
   * one past the end at the last millisecond, a negative position from a range
   * that does not start at zero, a floor that turns into a round.
   */
  function stepAt(pos) {
    const i = Math.floor((pos - 0) / STEP_MS);
    return Math.min(STEPS - 1, Math.max(0, i));
  }

  // ── what is open ────────────────────────────────────────────────────────
  /** `[{ name, wave, row }]`. `wave` is null on a resting row, and `row.ok` is
   *  false on a sample that would not read: both keep their place in the grid,

   * `SPAN` is a wrap that is never called, and then the transport is stopped

        const c = el('button', 'tom-cell', '', {
          type: 'button',
          'aria-label': `${rows[r].name}, step ${s + 1}`,
          'aria-pressed': on[r][s] ? 'true' : 'false',
        });
        if (s % 4 === 0) c.dataset.beat = '1';
        if (s % 16 === 0) c.dataset.bar = '1';
        c.dataset.row = String(r); c.dataset.step = String(s);
        if (on[r][s]) c.dataset.on = '1';
        if (on[r][s] && !sound) c.dataset.mute = '1';
        c.tabIndex = (r === focusR && s === focusS) ? 0 : -1;
        rowCells.push(c);
        rowEl.append(c);
      }
      cells.push(rowCells);
      rowsEl.append(rowEl);
    }
    built = performance.now() - t0;
    geom = null;
    nowStep = -1;
    // ⚠️ SIZED AFTER THE ROWS EXIST, because the strip's width is what it is
    // once its content is in it, and a measurement taken before that is a
    // measurement of an empty box.
    sizeCells();
    showAt(deck.position());
    d.set('on', onCount());
  }

  /**
   * 🔴 THE PAD SIZE IS MEASURED FROM THE STRIP AND WRITTEN TO ONE TOKEN, which
   * is what makes the pads square AND keeps the two halves of the grid in step.
   * Asked 2026-09-21: *"make tom pads fit the space"* and *"the rest of w are
   * sqare pads"*.
   * ⚠️ IT CANNOT BE DONE IN CSS ALONE HERE, AND THAT IS THE WHOLE REASON THIS
   * FUNCTION EXISTS. `panel-layout.mjs` puts the names and the steps in separate
   * flex children, so nothing in the browser relates a pad's height to a name
   * row's height: they agree because both are `--tom-cell`. A pad that flexed
   * in CSS would size itself and leave the names behind, and the misalignment
   * would grow with the window. One token, measured once, read by both.
   * ⚠️ AND IT IS A CUSTOM PROPERTY, NEVER A WRITTEN `width`. A component that
   * varies a property per instance sets a custom property or no stylesheet can
   * take it back, which is the `video-panel.mjs` lesson this project already
   * paid for once.
   * ⚠️ THE FLOOR IS 10 px. At 390 px the strip has about 360 to give, which is
   * 20 px a pad over sixteen steps; the floor is there so a narrower box makes
   * the strip scroll rather than making the pads vanish.
   */
  const CELL_MIN = 10;
  function sizeCells() {
    const box = panel.strip?.clientWidth || 0;
    if (!box) return;
    const gap = 2;                     // `--tom-gap`, and the only place it is read
    const w = Math.max(CELL_MIN, Math.floor((box - (STEPS - 1) * gap) / STEPS));
    panel.el.style.setProperty('--tom-cell', `${w}px`);
    geom = null;
    nowStep = -1;
    showAt(deck.position());
  }
  // ⚠️ A `ResizeObserver` RATHER THAN A `resize` LISTENER. The strip changes
  // width when the window does AND when the log grows, and only one of those
  // fires `resize`.
  /**
   * 🔴 THE CASE IS PRINTED, ASKED FOR AS *"add titles to tom area: left:
   * positron right: tom"*. `place: 'ends'` is exactly that: the maker at one
   * end of the plate and the model at the other, which is how every other
   * instrument on this desk wears its name and is why the component has that
   * placement at all.
   * ⚠️ AND IT IS A REAL NAMEPLATE RATHER THAN TWO SPANS. `panel-layout.mjs`
   * owns it because three replicas once set their names three ways, and it
   * REFUSES a plate with no lines on it, which is the empty-box rule one
   * component along.
   * ⚠️ TYPED UPPERCASE THOUGH THE RULE UPPERCASES IT ANYWAY, so the source
   * reads like the page. Same rule `/kit/` states about its own headings.
   */
  const plate = createNameplate({ lines: ['POSITRON', 'TOM'], place: 'ends' });
  panel.el.prepend(plate.el);

  /**
   * 🔴 THE PLAY STATE COMES OFF THE TRANSPORT'S OWN LISTENER, AND MY FIRST TRY
   * WAS A DEAD OPTION. I passed `onState` to `createDeck`, which takes no such
   * option, so it was accepted, ignored and never called: the column stayed dim
   * forever and the source read as correct. That is this project's most
   * expensive shape, a guard that does nothing while looking like it does, and
   * the only reason it was caught is that the assert below reads the COMPUTED
   * colour in both states rather than trusting the attribute.
   * ⚠️ `deck.transport.onState` IS THE REAL HOOK and it hands back an
   * unsubscribe. A page that inferred playing from positions arriving would
   * call a paused deck playing for one more frame and a seeking one playing
   * forever, which is reading the event next to the state instead of the state.
   * 🔴 AND IT SUBSCRIBES HERE RATHER THAN BESIDE THE DECK, BECAUSE IT FIRES
   * IMMEDIATELY. Placed next to `createDeck` it ran while `rowsEl` and
   * `rulerEl` were still in their temporal dead zone, and the page said so:
   * `Cannot access 'rowsEl' before initialization`, twice, in its own log. A
   * `const` shadows its whole block from the top, which this project has
   * already paid for once when seven asserts went silent on it.
   */
  /**
   * 🔴 THE WRAP HAPPENS ON THE STATE CHANGE, NOT ON A POSITION, AND THAT WAS
   * THE SECOND THING WRONG WITH IT. `onPosition` STOPS FIRING once the deck
   * pauses, so a wrap hung off it could never see the end: the end stop pauses
   * at the top of the range and the last position callback arrives before it.
   * MEASURED by driving the page twice, both times `... 1824 2000 2000 2000`
   * and never a wrap.
   * ⚠️ A PAUSE AND THE END OF A LAP LOOK IDENTICAL FROM HERE, and the playhead
   * is what tells them apart: stopped within one step of the top is the end
   * stop, stopped anywhere else is somebody pressing pause. One STEP of slack
   * rather than one millisecond, because the pause lands wherever the tick
   * granularity puts it and `SPAN - 1` was too tight to catch it.
   */
  /**
   * 🔴 `onState` FIRES ONCE AT LOAD AND NEVER ON PLAY, WHICH IS WHY THREE
   * ATTEMPTS AT LOOPING FAILED. I hung an `armed` flag off it, so the flag was
   * false for the life of the page and the wrap returned early every lap.
   * TRACED with this page's own log, read back through `demo/read-log.mjs`:
   *     TRACE state playing=false pos=0 armed=false     (2.52 s, once)
   *     TRACE wrapAt pos=1876 armed=false               (every frame after)
   * Two traces, and between them they said the whole thing. Nothing about the
   * transport was wrong; my flag was never set.
   * ✅ AND THE FLAG WAS NEVER NEEDED. `onPosition` fires ONLY WHILE PLAYING, so
   * any call to `wrapAt` is already proof that it is playing. The simplest
   * thing that could work was there the whole time, behind a guard I added for
   * a case that cannot happen.
   * ⚠️ THE STATE LISTENER STAYS FOR THE ONE THING IT DOES DO: the parked column
   * is dim and the playing one is bright, and that is a paint rather than a
   * decision.
   */
  deck.transport.onState((st) => setLive(!!st?.playing));

  const ro = new ResizeObserver(() => sizeCells());
  ro.observe(panel.strip);

  /** Where the steps actually are, read off the laid out ruler rather than
   *  computed from the token, so the band and the cells cannot disagree. */
  let geom = null;
  function geometry() {
    if (geom && geom.w) return geom;
    const a = tickEls[0], b = tickEls[1];
    if (!a) return null;
    const w = a.offsetWidth;
    geom = { x0: a.offsetLeft, pitch: b ? b.offsetLeft - a.offsetLeft : w, w };
    return geom.w ? geom : null;
  }

  /**
   * Put the band on the step the position is in.
   *
   * ⚠️ IT TOUCHES THE DOM ONLY WHEN THE STEP CHANGES, which at 120 beats a
   * minute is eight times a second rather than sixty. And what it touches is a
   * transform and two attributes, none of which can change how much room
   * anything takes.
   */
  /**
   * 🔴 THE PADS THEMSELVES LIGHT UP, AND THERE IS NO CURSOR. Reported
   * 2026-09-21 with a crop of a bordered column standing over the grid: *"just
   * hilite the pads, no extra bordered cursor"*. That is what the instrument in
   * the photograph does, and it is what a band over the top could never be: the
   * band was a second object drawn on top of the pads, with its own edge, its
   * own corners and its own alignment to get wrong.
   *
   * ✅ AND IT IS ONE DOM WRITE PER STEP RATHER THAN SIXTY FOUR. Setting
   * `data-now` on each cell of a column would be 64 removals and 64 additions
   * eight times a second; one attribute on the CONTAINER, with sixteen
   * generated `nth-child` rules behind it, is one write. `positron-ui`'s rule
   * is that a live picture may not change how much room it takes, and a
   * background colour cannot.
   * ⚠️ THE RULES ARE GENERATED ONCE FROM `STEPS`, not typed sixteen times. A
   * hand-written list would be a second place the step count lives.
   */
  function showAt(pos) {
    const s = stepAt(pos);
    if (s === nowStep) return;
    if (tickEls[nowStep]) delete tickEls[nowStep].dataset.now;
    nowStep = s;
    if (tickEls[s]) tickEls[s].dataset.now = '1';
    rulerEl.setAttribute('aria-valuenow', String(s + 1));
    rowsEl.dataset.now = String(s);
    d.set('step', s + 1);
  }

  // ── pressing things ─────────────────────────────────────────────────────
  function setCell(r, s, v) {
    if (!on[r] || s < 0 || s >= STEPS) return false;
    on[r][s] = v ? 1 : 0;
    const c = cells[r] && cells[r][s];
    if (c) {
      if (v) c.dataset.on = '1'; else delete c.dataset.on;
      if (v && !hasSound(r)) c.dataset.mute = '1'; else delete c.dataset.mute;
      c.setAttribute('aria-pressed', v ? 'true' : 'false');
    }
    d.set('on', onCount());
    return true;
  }

  /**
   * 🔴 HOLD AND DRAW, ASKED FOR 2026-09-21: *"when i hold pointer down enabling
   * pads, i should be able to draw otjher pads before i do poiunterup"*. A
   * sixteen step pattern is built in runs, and clicking sixteen times to make
   * one is the kind of thing an instrument is supposed to save you.
   *
   * 🔴 THE VALUE IS DECIDED BY THE FIRST PAD AND CARRIED, NOT TOGGLED PER PAD.
   * Toggling each one under the finger means dragging across a run of lit pads
   * ERASES them while dragging across dark ones lights them, so one gesture
   * does two opposite things depending on what it crosses. The first press says
   * `on` or `off` and the whole stroke means that.
   *
   * ⚠️ NO `setPointerCapture`, WHICH IS THE OBVIOUS THING AND IS WRONG HERE.
   * Capturing retargets every later pointer event to the element that captured,
   * so `pointerover` would never fire on the pads being dragged across: the
   * stroke would paint exactly one pad, which is what it does today. The
   * listeners sit on the CONTAINER instead.
   *
   * ⚠️ AND `click` IS GONE, because a press that painted on `pointerdown` and
   * again on `click` toggles twice and lands back where it started. The
   * keyboard path is unaffected: Enter has its own branch in the keydown
   * handler and does not come through here.
   */
  let drawing = null;                 // the value this stroke is painting, or null

  function paint(c, first) {
    const r = +c.dataset.row, s = +c.dataset.step;
    if (Number.isNaN(r) || Number.isNaN(s)) return;
    if (on[r][s] === (drawing ? 1 : 0)) return;   // already what the stroke wants
    setCell(r, s, drawing);
    if (first) rove(r, s, false);
    // Hearing what you just switched on is how a pattern gets built. It is a
    // press, so it is allowed to make a sound.
    if (drawing) fire(r, 'a cell');
  }

  rowsEl.addEventListener('pointerdown', (e) => {
    const c = e.target.closest('.tom-cell');
    if (!c || e.button !== 0) return;
    e.preventDefault();
    drawing = !on[+c.dataset.row][+c.dataset.step];
    paint(c, true);
  });

  rowsEl.addEventListener('pointerover', (e) => {
    if (drawing === null) return;
    const c = e.target.closest('.tom-cell');
    if (c) paint(c, false);
  });

  // ⚠️ ON THE WINDOW, because a stroke that ends off the grid still has to end.
  // A `pointerup` on the page background never reaches the container, and a
  // stroke left armed would paint on the next hover with nothing held down.
  for (const ev of ['pointerup', 'pointercancel']) {
    addEventListener(ev, () => { drawing = null; });
  }

  fixedEl.addEventListener('click', (e) => {
    const b = e.target.closest('button.tom-name');
    if (!b) return;
    audition(+b.dataset.row);
  });

  /**
   * 🔴 THE RULER SEEKS, WHICH IS WHAT MAKES THIS PAGE'S ONE POSITION SURFACE A
   * POSITION SURFACE. Without it `scrub: false` would take seeking off the page
   * rather than moving it.
   * ⚠️ ON A PRESS AND NOT ON A DRAG, AND THAT IS A TRADE RATHER THAN AN
   * OVERSIGHT. The ruler sits inside the panel's horizontal scroller, so a
   * `touch-action: none` that captured a drag would also stop a finger
   * scrolling the steps, which is the gesture a reader makes far more often. A
   * tap seeks, a swipe scrolls, and the keyboard table the bar owns still moves
   * the playhead with the arrows.
   */
  rulerEl.addEventListener('click', (e) => {
    const t = e.target.closest('.tom-tick');
    if (!t) return;
    deck.seek(+t.dataset.step * STEP_MS);
  });

  // ── the keyboard ────────────────────────────────────────────────────────
  /**
   * 🔴 AN ARROW MOVES AND DOES NOT OPEN, AND IT MUST NOT REACH THE TRANSPORT.
   * `transport-bar.mjs` binds ONE keyboard table for the whole project on
   * `window`: space toggles play, the arrows seek, a digit jumps to a tenth. A
   * grid that moved focus with the arrows and let the event through would seek
   * two per cent of the piece on every press, so this stops the event at the
   * grid. There is an assert on exactly that, and it is a negative control: the
   * playhead must not move.
   * ⚠️ SPACE IS STOPPED TOO AND NOT HANDLED. A `<button>` activates on keyup,
   * so the cell still toggles; what is prevented is the same press also
   * starting the transport.
   */
  function rove(r, s, focus = true) {
    const old = cells[focusR] && cells[focusR][focusS];
    if (old) old.tabIndex = -1;
    focusR = Math.max(0, Math.min(rows.length - 1, r));
    focusS = Math.max(0, Math.min(STEPS - 1, s));
    const next = cells[focusR] && cells[focusR][focusS];
    if (next) { next.tabIndex = 0; if (focus) next.focus(); }
    return next;
  }

  rowsEl.addEventListener('keydown', (e) => {
    const c = e.target.closest('.tom-cell');
    if (!c) return;
    const r = +c.dataset.row, s = +c.dataset.step;
    const k = e.key;
    /**
     * 🔴 SPACE PLAYS AND STOPS, ENTER TURNS A PAD ON AND OFF. Asked 2026-09-21:
     * *"space should play and stop. enter turns pad on and off"*.
     * ⚠️ SPACE WAS BEING SWALLOWED HERE, on purpose and wrongly. A pad is a
     * `<button>`, so the browser's own default for space is to PRESS it, which
     * would have toggled a step; `stopPropagation` stopped the transport bar
     * seeing it and the default still fired. So space toggled a pad and did not
     * play, which is the two keys the other way round.
     * ✅ `preventDefault` KILLS THE BUTTON DEFAULT and the event is left to
     * bubble to the bar's own keyboard table, which already owns space as the
     * play key on every page here. One binding for play, not a second copy.
     * ⚠️ AND ENTER GETS `preventDefault` TOO, or a button fires its click as
     * well and the pad toggles twice, landing back where it started.
     */
    if (k === ' ') { e.preventDefault(); return; }
    if (k === 'Enter') { e.preventDefault(); e.stopPropagation(); setCell(r, s, !on[r][s]); return; }
    let to = null;
    if (k === 'ArrowLeft') to = [r, s - 1];
    else if (k === 'ArrowRight') to = [r, s + 1];
    else if (k === 'ArrowUp') to = [r - 1, s];
    else if (k === 'ArrowDown') to = [r + 1, s];
    else if (k === 'Home') to = [r, 0];
    else if (k === 'End') to = [r, STEPS - 1];
    else return;
    e.preventDefault();
    e.stopPropagation();
    rove(to[0], to[1]);
  });

  // ── the sound ───────────────────────────────────────────────────────────
  /**
   * 🔴 ON A PRESS OR ON A STEP, AND NEVER ON A VISIT. Sixty four WAVs through an
   * `AudioContext` at load is the load-on-a-visit defect this project has paid
   * for three times. Nothing is decoded until the row it belongs to is about to
   * be heard, and the buffer is kept afterwards.
   * ⚠️ AND SOUND NEVER GATES THE WORK. `AudioContext.resume()` waits on a
   * gesture in a real browser and does NOT reject, so awaiting one is a hang
   * rather than an error. It is fired and left.
   */
  function fire(r, why, tell = true) {
    if (!hasSound(r)) { silent++; return false; }
    let buf = bufs.get(r);
    try {
      if (!buf) {
        // 🔴 THE AUDIO COMES OUT OF `circuit-sample.mjs` AND NOT OUT OF
        // `decodeAudioData`. The browser's decoder is a promise, it accepts what
        // it feels like accepting, and it can say nothing about a file it
        // refuses beyond an `EncodingError`. `toMono` answers in words, and
        // because it is SYNCHRONOUS a check can grade a press rather than
        // racing a decode.
        const m = toMono(rows[r].wave);
        if (!m.ok) { silent++; d.log(`${rows[r].name} did not decode: ${m.why}`, 'bad'); return false; }
        ac = ac || new (window.AudioContext || window.webkitAudioContext)();
        ac.resume();
        if (!master) {
          master = ac.createGain();
          // Sixty four rows can land on one step. Half scale leaves room for
          // that without the page deciding a mix nobody asked for.
          master.gain.value = 0.5;
          master.connect(ac.destination);
        }
        buf = ac.createBuffer(1, m.frames, m.rate);
        buf.copyToChannel(m.samples, 0);
        bufs.set(r, buf);
        // ⚠️ THE FIRST SOUND IS THE ONLY ONE THAT CAN PAY THIS, because it is
        // the press that builds the context. Every other row is decoded here
        // and out of the firing path for good.
        warmRows();
      }
      const src = ac.createBufferSource();
      src.buffer = buf;
      src.connect(master);
      src.start();
      voices++;
      lastFired = { row: r, name: rows[r].name, seconds: buf.duration, frames: buf.length, rate: buf.sampleRate, why };
      d.set('voices', voices);
      // ⚠️ ON A PRESS AND NEVER ON A STEP. Eight lines of prose a second is the
      // live caption `grain-scope` was reported for, and a fixed box only stops
      // it moving the page: it does not make it readable.
      if (tell) line.textContent = `${rows[r].name}, ${buf.duration.toFixed(2)} s, ${why}`;
      return true;
    } catch (e) {
      if (!audioSaid) { d.log(`no sound here (${e.message})`, 'bad'); audioSaid = true; }
      return false;
    }
  }

  /** Every row switched on at this step, in row order. Returns how many really
   *  sounded, which is not the same as how many cells were on. */
  function fireStep(s) {
    let n = 0;
    for (let r = 0; r < rows.length; r++) if (on[r][s] && fire(r, `step ${s + 1}`, false)) n++;
    return n;
  }

  /** Hear one row on its own. A grid of sixty four rows named `sample_0.wav` to
   *  `sample_63.wav` cannot be worked without this. */
  function audition(r) {
    if (nameEls[picked]) delete nameEls[picked].dataset.pick;
    picked = r;
    if (nameEls[r]) nameEls[r].dataset.pick = '1';
    fire(r, 'its name');
  }

  // ── opening a file ──────────────────────────────────────────────────────
  async function openFiles(files) {
    for (const f of files) {
      if (f.name.toLowerCase().endsWith('.zip')) { await openZip(f.name, f.bytes); continue; }
      await openPack(f.name, f.bytes);
    }
  }

  /**
   * 🔴 THE SAMPLES COME OUT OF `circuit-sample.mjs` AND NOT OUT OF A LOOP ON
   * THIS PAGE. Asked for as *"use shared code to get samples"*. `samplesIn`
   * takes the entry list `readZip` returns rather than the bytes, so a page
   * wanting patches out of the same file does not unzip it twice, and it sorts
   * by the NUMBER in a name rather than by the name as text, because
   * `sample_10.wav` sorts before `sample_2.wav` and the pack's own index names
   * `Sample1` to `Sample64` against `sample_0.wav` to `sample_63.wav` in order.
   * ⚠️ A FILE THAT WILL NOT PARSE KEEPS ITS ROW, with `row.ok === false` and a
   * reason. A reader that silently dropped one leaves a pack looking smaller
   * than it is, which is a wrong answer wearing an empty one's clothes.
   */
  async function openPack(name, bytes, from = '') {
    let list;
    try { list = readZip(bytes); }
    catch (e) { drop.say(`${name} did not read as a pack: ${e.message}`, 'bad'); return false; }
    const got = await samplesIn(list);
    if (!got.length) { drop.say(`${name} holds no samples`, 'bad'); return false; }
    setRows(got);
    const all = summariseAll(got.map((g) => g.wave));
    d.log(`${name}: ${all.parsed} of ${all.count} samples read`
      + (all.refused ? `, ${all.refused} refused` : '')
      // ⚠️ ONLY WHERE SOMETHING PARSED. `shortest` is 0 over an empty set, and a
      // pack of sixty four refusals reported as `0.00 s to 0.00 s` is a
      // measurement of nothing wearing a measurement's clothes.
      + (all.parsed ? `, ${all.shortest.toFixed(2)} s to ${all.longest.toFixed(2)} s` : ''));
    drop.say(`${name}${from ? ` ${from}` : ''}`, 'good');
    return true;
  }

  /**
   * A real download is a zip of packs rather than a pack. MEASURED on the
   * soundbank in `purchased/`: one archive holding 2 `.circuitpack`, 1
   * `.circuittrackspack`, 128 `.syx` and a spreadsheet. `unzip.mjs` reads a zip
   * inside a zip, which is how both of those were measured.
   * ⚠️ A `.circuittrackspack` IS FOR THE OTHER INSTRUMENT and is named rather
   * than opened.
   */
  async function openZip(name, bytes) {
    let list;
    try { list = readZip(bytes); }
    catch (e) { drop.say(`${name} did not read as a zip: ${e.message}`, 'bad'); return false; }
    const packs = list.filter((e) => e.name.endsWith('.circuitpack'));
    const others = list.filter((e) => e.name.endsWith('.circuittrackspack'));
    if (others.length) {
      d.log(`${others.length} pack(s) in it are for a Circuit Tracks, not a Circuit, and were left alone`, 'bad');
    }
    if (!packs.length) { drop.say(`${name} holds no Circuit pack`, 'bad'); return false; }
    if (packs.length > 1) {
      d.log(`${packs.length} packs in ${name}: ${packs.map((e) => e.name.split('/').pop()).join(', ')}. `
          + 'Opening the first', 'hi');
    }
    return openPack(packs[0].name.split('/').pop(), await packs[0].read(), `inside ${name}`);
  }

  /**
   * 🔴 THE PATTERN SURVIVES THE PACK. A reader can tap eight rows of steps
   * before anything is open and then give them sounds, and throwing that away
   * because the row count changed would be the page discarding the only work
   * the reader has done. Rows that still exist keep their steps; rows that
   * arrive start empty.
   */
  /**
   * 🔴 EVERY SAMPLE IS DECODED WHEN THE PACK OPENS, NOT WHEN A STEP FIRES.
   * Reported 2026-09-21 with the readout showing **22.6 ms late**: *"lot of
   * late. when i put pads in and then get samples, not good timing"*, and the
   * second half of that sentence is the diagnosis. `fire()` decoded a row's
   * WAV the first time that row sounded, so the FIRST hit of every sample paid
   * `toMono` plus a `createBuffer` plus a `copyToChannel` on the firing path,
   * inside the window the readout measures. A pattern with eight rows in it
   * paid it eight times, once each, exactly while somebody was listening to
   * whether the timing was any good.
   * ⚠️ IT IS ON THE OPEN, WHICH IS A PRESS, NOT ON A VISIT. Decoding 64 WAVs
   * because somebody loaded the page is the load-on-a-visit defect this project
   * has paid for three times. Opening a pack is a person asking for this.
   * ⚠️ AND IT DOES NOT MAKE THE CONTEXT. `AudioContext` is still built on the
   * first sound, so a visit still makes none and the page's own check still
   * asserts that.
   * ⚖️ THIS IS THE CHEAP HALF OF THE TIMING AND NOT ALL OF IT. The lane here is
   * TIMER fired rather than sample accurate, which is worth single digit
   * milliseconds and is a separate change: `createAudioLane` became usable only
   * this evening, when its loop defect was fixed.
   */
  function warmRows() {
    if (!ac) return;
    for (let r = 0; r < rows.length; r++) {
      if (bufs.has(r) || !hasSound(r)) continue;
      const m = toMono(rows[r].wave);
      if (!m.ok) continue;
      const b = ac.createBuffer(1, m.frames, m.rate);
      b.copyToChannel(m.samples, 0);
      bufs.set(r, b);
    }
  }

  function setRows(got) {
    const was = on;
    rows = got;
    on = rows.map((_, i) => (was[i] ? was[i].slice() : new Uint8Array(STEPS)));
    bufs.clear();
    picked = -1;
    drawGrid();
    // ⚠️ AFTER THE GRID, so the picture is on screen before the decoding
    // starts, and only if a context already exists: making one here would be
    // the page opening an audio device nobody asked it to.
    const t1 = performance.now();
    warmRows();
    const warmed = performance.now() - t1;
    d.log(`${rows.length} rows, ${STEPS} steps, drawn in ${built.toFixed(0)} ms`
      + (bufs.size ? `, ${bufs.size} decoded in ${warmed.toFixed(0)} ms` : ''));
  }

  drawGrid();

  // ── what a visit is allowed to have done ────────────────────────────────
  d.assert('a visit opens nothing, asks for nothing and makes no sound',
    drop.opens === 0 && fetched === 0 && voices === 0 && ac === null && onCount() === 0,
    `${drop.opens} file(s) opened, ${fetched} request(s), ${voices} sound(s), `
    + `${onCount()} cell(s) on, audio context ${ac === null ? 'never made' : 'made'}`);

  d.assert('nothing here asks for MIDI, so nothing here can write to an instrument',
    midiAsked === 0 && navigator.requestMIDIAccess !== undefined,
    `requestMIDIAccess called ${midiAsked} time(s), and the counter is still in front of it`);

  d.assert('the grid is 8 rows of 16 steps before a pack lands, which is a Circuit pattern\'s own length',
    cells.length === REST_ROWS && cells.every((r) => r.length === STEPS)
    && rows.every((r) => r.wave === null),
    `${cells.length} rows of ${cells[0] ? cells[0].length : 0}, none of them a sample`);

  d.assert('the way in is visible at rest and says what it takes',
    drop.el.classList.contains('pos-drop-area')
    && /\.circuitpack/.test(drop.el.querySelector('.pos-drop-hint')?.textContent || ''),
    `"${drop.el.querySelector('.pos-drop-hint')?.textContent || ''}"`);

  d.assert('the block has no footer until something has been opened',
    drop.note.hidden === true && drop.note.textContent === '',
    `hidden ${drop.note.hidden}, saying "${drop.note.textContent}"`);

  /**
   * 🔴 THE HARNESS'S ONLY HANDLE, AND THE TRAP IS THAT THE TWO OBJECTS LOOK
   * ALIKE. `createTransportBar` publishes its internal `api` and RETURNS a
   * wrapper; a page that assigns the return value over the top hands
   * `verify.mjs` an object with no `position`, and the harness then dies inside
   * its own drill while the page looks perfect.
   */
  d.assert('the transport the harness reads is the bar\'s own api and not the wrapper around it',
    window.__demo.transport === bar.api && window.__demo.transport !== bar
    && typeof window.__demo.transport.position === 'number',
    `position ${window.__demo.transport.position}, range ${JSON.stringify(bar.api.range)}`);

  /**
   * 🔴 THE COMPUTED VALUE, BECAUSE THE ELEMENT IS THERE EITHER WAY. This assert
   * read `!bar.el.querySelector('.tbar-scrub')` first and went red on a page
   * doing exactly what it promises: `transport-bar.mjs` appends its slider
   * UNCONDITIONALLY at line 540 and `scrub: false` sets `data-scrub="0"`, which
   * `shell.css` turns into `display: none`. Asking whether the node exists is
   * asking a question next to the one in question, which is the measurement
   * mistake this project has now made on three separate pages.
   */
  {
    const scrubEl = bar.el.querySelector('.tbar-scrub');
    d.assert('the grid is the one position surface, so the bar draws no slider',
      bar.el.dataset.scrub === '0' && getComputedStyle(scrubEl).display === 'none'
      && rulerEl.getAttribute('role') === 'slider' && tickEls.length === STEPS,
      `the bar says data-scrub="${bar.el.dataset.scrub}" and its slider computes `
      + `display: ${getComputedStyle(scrubEl).display}, against ${tickEls.length} `
      + 'ticks on the ruler that do seek');
  }

  /**
   * 🔴 THREE ALIGNMENTS THAT LOOK LIKE ONE ARE THREE ASSERTS. `/twelve/` was
   * corrected by screenshot twelve times in one evening and the pattern is that
   * two of three line up while the third is 30 px out. The name column and the
   * steps are separate flex children of the panel, so nothing in the browser
   * makes them agree: they agree because both sides are built from one token.
   */
  {
    const n0 = nameEls[0].getBoundingClientRect();
    const r0 = rowsEl.children[0].getBoundingClientRect();
    const nz = nameEls[nameEls.length - 1].getBoundingClientRect();
    const rz = rowsEl.children[rowsEl.children.length - 1].getBoundingClientRect();
    d.assert('the first name sits on the first row of steps',
      Math.abs(n0.top - r0.top) < 1 && Math.abs(n0.bottom - r0.bottom) < 1,
      `top ${(n0.top - r0.top).toFixed(2)} px apart, bottom ${(n0.bottom - r0.bottom).toFixed(2)} px apart`);
    d.assert('and the last one still does, so the two columns share one pitch',
      Math.abs(nz.top - rz.top) < 1 && Math.abs(nz.bottom - rz.bottom) < 1,
      `top ${(nz.top - rz.top).toFixed(2)} px apart over ${nameEls.length} rows`);
  }

  /**
   * 🔴 THE STEPS SCROLL AND THE PAGE DOES NOT. `overflow-x` cannot shrink a flex
   * item below its content, so this is true only because the scroller also
   * carries `min-width: 0`, which is a pair `panel-layout.mjs` states as
   * contract 1 and which this project once measured as 141 px of page overflow
   * when half of it was missing.
   * ⚠️ AT WHATEVER WIDTH THE READER IS. `demo/verify.mjs` runs at 756 px with no
   * viewport override, so this assert alone says nothing about a phone. The
   * 390 px reading is in the report that shipped with the page.
   */
  /**
   * 🔴 THIS ASSERT REQUIRED THE CONTENT TO OVERFLOW AND WENT RED WHEN IT
   * STOPPED. At sixty four steps the strip held about 1,150 px of content in
   * 522 and the check read `scrollWidth > clientWidth`; at sixteen it holds 522
   * in 522, and the assert failed on a layout that had just got BETTER.
   * ⚠️ IT WAS MEASURING THE CORPUS RATHER THAN THE PAGE. Whether the steps
   * happen to overflow today is a fact about the step count; what the page
   * promises is that when they DO overflow the strip takes it and the document
   * does not, and that promise is in the computed style and in `min-width`,
   * both of which are true at any count.
   * ⚠️ AND THE HALF THAT ALWAYS MATTERED IS UNCHANGED: the page must never drag
   * sideways. `overflow-x` cannot shrink a flex item below its content, so it
   * needs `min-width: 0` on the same element, and that pair was measured on
   * this project once as 141 px of page overflow.
   */
  {
    const cs = getComputedStyle(panel.strip);
    const over = panel.strip.scrollWidth - panel.strip.clientWidth;
    /**
   * 🔴 THE PATTERN WRAPS AND SOUNDS AGAIN, WHICH IS THE ONE THING THIS PAGE
   * COULD NOT DO UNTIL `timeline/transport.mjs` WAS FIXED THIS EVENING. A
   * committed node's `onended` set its status to `rendered`, nothing reset it,
   * and every step that had SOUNDED was silent on lap two. MEASURED on the
   * audio thread: 4 heard on lap one, 0 on lap two.
   * ⚠️ SO THIS ASSERT GRADES THAT FIX FROM THE PAGE SIDE, and it counts what
   * the lane ACTUATED rather than what the deck queued. A count on the wrong
   * side of that boundary is this project's standing lesson: `createMidiLane`'s
   * `scheduled()` read identically to delivery while every note was being
   * scheduled fifty six years out.
   * ⚠️ IT SEEKS RATHER THAN WAITING TWO SECONDS OF WALL TIME. A check that sat
   * through two real laps would be eight seconds of a harness run, and the wrap
   * it is grading is a backward seek either way.
   */
  if (SELFCHECK) {
    const onFirst = (() => {
      // One step lit on a row that can sound, so there is something to count.
      const r = rows.findIndex((_, i) => hasSound(i));
      if (r < 0) return null;
      toggle(r, 0);
      return r;
    })();
    if (onFirst !== null) {
      deck.seek(0);
      const before = actuated;
      fireStep(0);
      const lap1 = actuated - before;
      // The wrap, down the same path `wrapAt` takes.
      deck.seek(0);
      const mid = actuated;
      fireStep(0);
      const lap2 = actuated - mid;
      d.assert('a step that has already sounded sounds again on the next lap',
        lap1 > 0 && lap2 === lap1,
        `${lap1} actuation(s) on the first pass and ${lap2} on the second, `
        + `after a backward seek`);
      toggle(onFirst, 0);
    }
  }

  /**
   * 🔴 A STROKE PAINTS EVERY PAD IT CROSSES, AND ONE VALUE FOR THE WHOLE
   * STROKE. Asked for as *"when i hold pointer down enabling pads, i should be
   * able to draw otjher pads"*. The thing that can go wrong and look right is
   * the stroke TOGGLING each pad: dragging across a run of lit pads would erase
   * them while dragging across dark ones lights them, so one gesture does two
   * opposite things depending on what it crosses.
   * ⚠️ SO THE NEGATIVE HALF IS THE HALF THAT MATTERS: the stroke starts on a
   * pad that is already ON, and every pad it crosses must end up OFF, including
   * the ones that were already off.
   * ⚠️ AND IT RELEASES, because a stroke left armed paints on the next hover
   * with nothing held down, which is a page that changes under a moving mouse.
   */
  if (SELFCHECK) {
    const row = cells[0];
    const down = (c) => c.dispatchEvent(new PointerEvent('pointerdown',
      { bubbles: true, button: 0, pointerId: 1 }));
    const over = (c) => c.dispatchEvent(new PointerEvent('pointerover',
      { bubbles: true, pointerId: 1 }));
    for (let s = 0; s < 4; s++) setCell(0, s, false);

    down(row[0]); over(row[1]); over(row[2]);
    const drew = [0, 1, 2, 3].map((s) => on[0][s]);
    dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 1 }));
    over(row[3]);
    const afterUp = on[0][3];

    // Now the other way: start on a lit pad and rub a run of them out.
    for (let s = 0; s < 4; s++) setCell(0, s, s !== 2);
    down(row[0]); over(row[1]); over(row[2]); over(row[3]);
    const erased = [0, 1, 2, 3].map((s) => on[0][s]);
    dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 1 }));
    for (let s = 0; s < 4; s++) setCell(0, s, false);

    d.assert('holding and dragging paints every pad it crosses, one value for the whole stroke',
      drew.join() === '1,1,1,0' && afterUp === 0
      && erased.join() === '0,0,0,0',
      `drew ${drew.join('')} then ${afterUp} after the release, `
      + `and a stroke starting on a lit pad left ${erased.join('')}`);
  }

  /**
   * 🔴 THE FACE SAYS WHAT THE SECOND PRESS DOES, which is the whole of
   * *"replace pause icon with stop icon"* and is the half that can go quietly
   * wrong: the behaviour changed this evening and a `❚❚` over it would have
   * been a control describing a verb it does not perform.
   * ⚠️ READ OFF THE COMPUTED `content` OF THE PSEUDO ELEMENT, not off a class.
   * A class is the page's intent; the glyph is what a reader sees, and the two
   * part company the day a stylesheet rule loses to another one. This project
   * has measured five dead CSS rules that read as correct.
   */
  if (SELFCHECK) {
    const tog = bar.el.querySelector('.tbar-toggle');
    const face = () => getComputedStyle(tog, '::before').content;
    const resting = face();
    tog.dataset.state = 'playing';
    const running = face();
    delete tog.dataset.state;
    d.assert('the transport shows play at rest and a STOP square while it runs, never a pause',
      /\u25B6|\u25BA/.test(resting) && running.includes('\u25A0')
      && !running.includes('\u275A') && tog.getAttribute('aria-label') === 'play/stop',
      `${resting} at rest, ${running} while playing, announced as `
      + `"${tog.getAttribute('aria-label')}"`);
  }

  d.assert('the strip is what scrolls when the steps do not fit, and the page never drags sideways',
      /auto|scroll/.test(cs.overflowX) && parseFloat(cs.minWidth) === 0
      && document.documentElement.scrollWidth <= window.innerWidth + 1,
      `overflow-x ${cs.overflowX} at min-width ${cs.minWidth}, `
      + `${over > 0 ? `${over} px of steps past the box` : 'all steps fit today'}, `
      + `document ${document.documentElement.scrollWidth} px in a ${window.innerWidth} px window`);
  }

  /**
   * 🔴 ONE TAB STOP FOR THE WHOLE GRID, AND THE NEGATIVE HALF IS THE ONE THAT
   * MATTERS. `table.mjs` records sixty three presses to tab past a table; a
   * grid is 4,096. Asserting only that one cell is reachable would pass on a
   * grid where every cell is.
   */
  {
    const all = cells.flat();
    const zero = all.filter((c) => c.tabIndex === 0).length;
    const minus = all.filter((c) => c.tabIndex === -1).length;
    d.assert('the grid is one tab stop, not one per cell',
      zero === 1 && minus === all.length - 1,
      `${zero} cell(s) at 0 and ${minus} at -1, of ${all.length}`);
  }

  /**
   * The arithmetic, graded at both edges and past both of them. A step index
   * one past the end at the last millisecond is the bug this kind of grid
   * always has.
   */
  d.assert('a position lands on the step that holds it, and never off either end',
    stepAt(0) === 0 && stepAt(STEP_MS - 1) === 0 && stepAt(STEP_MS) === 1
    && stepAt(SPAN - 1) === STEPS - 1 && stepAt(SPAN) === STEPS - 1
    && stepAt(-1000) === 0 && stepAt(SPAN * 4) === STEPS - 1,
    `0 -> ${stepAt(0)}, ${STEP_MS} -> ${stepAt(STEP_MS)}, ${SPAN - 1} -> ${stepAt(SPAN - 1)}, `
    + `-1000 -> ${stepAt(-1000)}, ${SPAN * 4} -> ${stepAt(SPAN * 4)}`);

  // ── the checks that press things, which a visitor never sees ────────────
  if (SELFCHECK) {
    const raf2 = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

    /**
     * 🔴 NEGATIVE CONTROL: A ROW WITH NO SAMPLE LIGHTS UP AND STAYS SILENT.
     * The whole page is a grid of lit squares, so "a cell is on" is the easiest
     * thing in the world to see and says nothing about whether anything was
     * heard. This is the assert that separates them, and it goes red the moment
     * `fire()` stops checking whether a row has a sample at all.
     */
    {
      const was = voices;
      setCell(0, 0, true);
      const rang = fireStep(0);
      d.assert('NEGATIVE CONTROL: a step on a row with no sample lights its cell and starts no sound',
        cells[0][0].dataset.on === '1' && cells[0][0].dataset.mute === '1'
        && rang === 0 && voices === was && ac === null,
        `${rang} sound(s) from a lit cell, ${voices - was} new voice(s), `
        + `audio context ${ac === null ? 'never made' : 'made'}`);
    }

    /**
     * 🔴 NEGATIVE CONTROL: AN ARROW INSIDE THE GRID MOVES FOCUS AND NOT THE
     * PLAYHEAD. `transport-bar.mjs` binds one keyboard table on `window` and
     * the arrows seek two per cent of the piece; a grid that let the event
     * through would drag the transport on every press. With the
     * `stopPropagation` removed this goes red on the position, which is what
     * makes it a measurement rather than a decoration.
     */
    {
      const before = deck.position();
      cells[0][0].focus();
      cells[0][0].dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
      const moved = document.activeElement === cells[0][1];
      d.assert('NEGATIVE CONTROL: an arrow inside the grid moves focus and leaves the playhead alone',
        moved && cells[0][1].tabIndex === 0 && cells[0][0].tabIndex === -1
        && Math.abs(deck.position() - before) < 1,
        `focus ${moved ? 'moved one step' : 'did not move'}, position `
        + `${before.toFixed(1)} -> ${deck.position().toFixed(1)}`);
      rove(0, 0, false);
    }

    const r = PACK_HERE ? await realFetch(PACK).catch(() => null) : null;
    if (!r || !r.ok) {
      /**
       * On a deploy the pack is not published and must not be, so what is left
       * to grade is the only claim that ever mattered out there: the page asked
       * nobody for anything and the way in is the same for everybody, with no
       * branch on where it is being served from.
       */
      d.log('the pack here is not published, so the reading checks did not run', 'bad');
      d.assert('where the pack is not published nothing is asked of anybody, and the way in is unchanged',
        !PACK_HERE && fetched === 0 && drop.opens === 0
        && rows.length === REST_ROWS && drop.el.classList.contains('pos-drop-area'),
        `at ${location.hostname} after ${fetched} request(s) and ${drop.opens} file(s) opened`);
    } else {
      const bytes = new Uint8Array(await r.arrayBuffer());
      await openPack('New Pack.circuitpack', bytes);

      d.assert('the pack gives the grid one row for every sample in it, and the steps do not move',
        rows.length === 64 && cells.length === 64
        && cells.every((row) => row.length === STEPS)
        && nameEls.length === 64 && nameEls.every((n) => n.textContent),
        `${rows.length} rows of ${cells[0].length}, first "${rows[0].name}", last "${rows[63].name}"`);

      /**
       * 🔴 THE WORK A READER DID BEFORE THE FILE ARRIVED IS STILL THERE. The
       * cell switched on in the negative control above was on row 0 of an eight
       * row grid; the grid is 64 rows now and row 0 is `sample_0.wav`. This is
       * the one assert that could only pass if `setRows` copied the pattern
       * across, and it is free because the earlier check already put it there.
       */
      d.assert('the pattern typed before the pack survives the pack arriving',
        on[0][0] === 1 && cells[0][0].dataset.on === '1'
        && cells[0][0].dataset.mute === undefined,
        `step 1 of row 1 is ${on[0][0] ? 'still on' : 'gone'} and is `
        + `${cells[0][0].dataset.mute ? 'still silent' : 'no longer silent'}`);

      const all = summariseAll(rows.map((x) => x.wave));
      d.assert('all 64 read as 48 kHz 16 bit mono with none refused, and their lengths differ',
        all.parsed === 64 && all.refused === 0 && all.rates.length === 1
        && all.rates[0] === 48000 && all.depths[0] === 16 && all.channels[0] === 1
        && all.longest > all.shortest,
        `${all.parsed} of ${all.count}, ${all.rates.join('/')} Hz, ${all.depths.join('/')} bit, `
        + `${all.shortest.toFixed(6)} s to ${all.longest.toFixed(6)} s`);

      /**
       * 🔴 A STEP PLAYS EXACTLY THE ROWS THAT ARE ON AT IT, AND THE SOUND IS THE
       * SAMPLE'S OWN LENGTH. A buffer of the wrong length is the failure that
       * looks right: something is heard, the counter goes up, and the page reads
       * as working while the decode is off.
       */
      {
        setCell(0, 0, false);
        setCell(3, 8, true);
        setCell(9, 8, true);
        const was = voices;
        const rang = fireStep(8);
        const want = rows[9].row.seconds;
        d.assert('a step starts one sound for each row that is on at it, each its own sample\'s length',
          rang === 2 && voices === was + 2
          && lastFired.name === rows[9].name
          && Math.abs(lastFired.seconds - want) < 0.002
          && lastFired.rate === rows[9].row.rate,
          `${rang} sound(s), last "${lastFired.name}" at ${lastFired.seconds.toFixed(6)} s `
          + `against ${want.toFixed(6)} s in its header, ${lastFired.rate} Hz`);

        /**
         * 🔴 NEGATIVE CONTROL: A STEP WITH NOTHING ON IT STARTS NOTHING. Without
         * this the assert above would pass on a page that played every row at
         * every step, which is the loudest possible way to be wrong and the
         * hardest to tell from working.
         */
        const was2 = voices;
        const none = fireStep(9);
        d.assert('NEGATIVE CONTROL: a step with no cell on it starts no sound at all',
          none === 0 && voices === was2,
          `${none} sound(s) and ${voices - was2} new voice(s) from an empty step`);
        setCell(3, 8, false);
        setCell(9, 8, false);
      }

      /**
       * Pressing a row's name hears that one sample. A grid of sixty four rows
       * named `sample_0.wav` to `sample_63.wav` cannot be worked without it, and
       * it is an audition rather than a transport move: nothing about the
       * playhead may change.
       */
      {
        const was = voices, where = deck.position();
        nameEls[7].click();
        d.assert('pressing a row\'s name hears that sample and does not move the transport',
          voices === was + 1 && lastFired.name === rows[7].name
          && nameEls[7].dataset.pick === '1'
          && Math.abs(deck.position() - where) < 1 && deck.playing() === false,
          `"${lastFired.name}" after pressing row 8, position `
          + `${where.toFixed(1)} -> ${deck.position().toFixed(1)}`);
      }

      /**
       * 🔴 THE BAND IS WHERE THE POSITION SAYS, AND THE EXPECTED VALUE IS
       * RE-DERIVED AT READ TIME RATHER THAN REMEMBERED FROM THE SEEK. A harness
       * that seeks in the middle of this would otherwise take it red on a page
       * doing exactly what it promises.
       */
      {
        /**
         * ⚠️ THIS MEASURED A BAND'S `translateX` UNTIL 2026-09-21 AND THERE IS
         * NO BAND. The cursor was replaced by lighting the pads themselves, so
         * the quantity to read is which COLUMN is lit, and the only honest way
         * to read that is off the computed style of a real cell: the rules are
         * generated `nth-child` selectors, so an attribute on the container is
         * the page's intent and the cell's background is the result.
         * 🔴 AND IT READS TWO CELLS, NOT ONE. A check that the right cell is lit
         * passes on a grid where EVERY cell is lit, which is the loudest way to
         * be wrong and the hardest to tell from working.
         */
        deck.seek(7 * STEP_MS);
        await raf2();
        const want = stepAt(deck.position());
        const row0 = cells[0] || [];
        /**
         * 🔴 THREE CLAIMS, AND THE FIRST TRY MEASURED A QUANTITY THAT CANNOT
         * MOVE. It compared `backgroundColor` across the two states and read
         * `field 35, parked 29, playing 229`: parked came out DARKER than the
         * field, because a parked playhead changes no colour at all. It lifts
         * what is there with `filter: brightness()`, which `getComputedStyle`
         * reports under `filter` and never under `backgroundColor`. That is
         * this project's measure-the-adjacent-quantity mistake again, and the
         * page was behaving exactly as asked while the check said otherwise.
         * ✅ SO: parked LIFTS AND REPLACES NOTHING, which is what keeps a bar
         * column's own field colour; playing REPLACES and stops lifting.
         */
        const at = row0[want];
        const parkedBg = getComputedStyle(at).backgroundColor;
        const parkedFx = getComputedStyle(at).filter;
        // The same cell with the playhead elsewhere, which is the only honest
        // reference for "its own colour survived".
        rowsEl.dataset.now = String((want + 1) % STEPS);
        const ownBg = getComputedStyle(at).backgroundColor;
        rowsEl.dataset.now = String(want);
        setLive(true);
        const liveBg = getComputedStyle(at).backgroundColor;
        const liveFx = getComputedStyle(at).filter;
        setLive(!!deck.transport.playing);
        d.assert('a parked playhead lifts the pad without replacing its field, and a playing one replaces it',
          rowsEl.dataset.now === String(want)
          && tickEls[want].dataset.now === '1'
          && window.__demo.readout.step === want + 1
          && parkedBg === ownBg && /brightness/.test(parkedFx)
          && liveFx === 'none' && liveBg !== ownBg,
          `parked keeps ${parkedBg} under ${parkedFx}, playing paints ${liveBg} `
          + `with filter ${liveFx}`);
      }

      /**
       * 🔴 NEGATIVE CONTROL: A SAMPLE THAT WILL NOT READ KEEPS ITS ROW AND
       * CANNOT BE PLAYED. Every one of the 64 in this pack parses, so the only
       * way to grade the refusal path is to hand the real module a file that
       * cannot. `samplesIn` is asked for it rather than the row being faked
       * here, because a fake row grades this page's idea of a refusal and not
       * the module's.
       */
      {
        const bad = await samplesIn([{
          name: 'sample_999.wav', size: 8,
          read: async () => new Uint8Array([0x52, 0x49, 0x46, 0x46, 0, 0, 0, 0]),
        }]);
        const good = rows.slice();
        setRows([...good, ...bad]);
        const r64 = rows.length - 1;
        setCell(r64, 0, true);
        const was = voices;
        const rang = fireStep(0);
        d.assert('NEGATIVE CONTROL: a sample that will not read keeps its row, says why, and starts nothing',
          rows.length === 65 && bad.length === 1 && bad[0].row.ok === false
          && nameEls[r64].tagName === 'DIV'
          && /did not read/.test(nameEls[r64].title)
          && rang === 0 && voices === was,
          `${rows.length} rows, the last one "${bad[0].name}" refused because `
          + `"${bad[0].row.why}", ${rang} sound(s) from it`);
        setRows(good);
      }

      d.assert('the file that was opened is named in the block\'s footer, which exists only now',
        drop.note.hidden === false && /\.circuitpack/.test(drop.note.textContent),
        `"${drop.note.textContent}"`);

      /**
       * 🔴 THE ONE LINK NOTHING ELSE HERE REACHES: THE SCHEDULER REALLY WALKING
       * THE GRID. Every check above drives `fireStep` by hand, which grades the
       * grid and the sound and says nothing at all about whether the deck ever
       * calls it. `verify.mjs`'s own drill grades that the position advances,
       * which is the other half of the same sentence and not this one.
       * ⚠️ IT IS THE ONLY CHECK ON THIS PAGE THAT COSTS WALL TIME, and 420 ms
       * is three steps: the fewest that can tell a scheduler firing repeatedly
       * from one that fired once on a seek. It is safe to run here because
       * `verify.mjs` waits for `__demo.ready` before it touches the transport,
       * so this window closes before the harness presses anything.
       * ⚠️ AND IT ASSERTS THE LATENESS IS A NUMBER RATHER THAN A BOUND. A
       * threshold on a timer lane under a loaded headless Chrome is a check
       * that goes red for reasons that are nothing to do with this page; the
       * value is in the detail, which is where a reader can act on it.
       */
      {
        setCell(0, 1, true); setCell(0, 2, true); setCell(0, 3, true);
        deck.seek(0);
        const wasV = voices, wasA = actuated;
        deck.play();
        await new Promise((r) => setTimeout(r, 420));
        deck.pause();
        const late = Number(window.__demo.readout.late);
        d.assert('playing walks the grid and fires the cells it passes over',
          actuated >= wasA + 3 && voices >= wasV + 3
          && deck.position() > 3 * STEP_MS && Number.isFinite(late),
          `${actuated - wasA} step(s) actuated and ${voices - wasV} sound(s) started over `
          + `${deck.position().toFixed(0)} ms of transport, worst ${late} ms late`);
        setCell(0, 1, false); setCell(0, 2, false); setCell(0, 3, false);
        deck.seek(0);
      }

      d.log(`${voices} sound(s) started, worst step ${worstLate.toFixed(1)} ms late`);
    }
  }

  d.ready();
</script>
