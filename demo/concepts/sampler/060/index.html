<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON concept sampler 060</title>
<link rel="stylesheet" href="/shell/shell.css">
<script type="module">
  import { conceptNav } from '/concepts/nav.mjs';
  import { mount } from '/shell/shell.mjs';
  import { bootScsynth } from '/shell/scsynth.mjs';
  import { compile } from '/shell/sclang-lite.mjs';
  import { createGrainRig } from '/concepts/sampler/grain-rig.mjs';
  import { PROGRAM, PATCHES, RING_SECONDS, valuesOf } from '/concepts/sampler/grain-ring.mjs';

  // concepts sampler/060, GRANULATOR, 2026-10-13. Asked (BACKLOG): *"the plain
  // GrainBuf ring is the real lighter twin of Pappus - do"*; archived for an
  // afternoon and brought back the same day as THE granulator (*"but we got
  // rid of pappus?!? 060 ???"*). The Pappus page it was the light twin of is
  // /archive/pappus/.
  //
  // One small SynthDef: BufWr writes the source round an eight second mono
  // buffer, GrainBuf reads grains out of it, and SendReply reports every
  // grain. Its text is `../grain-ring.mjs`'s PROGRAM, compiled in this tab by
  // `/shell/sclang-lite.mjs` as the page opens (pure JavaScript, no fetch) and
  // run on the tab's scsynth. The text is not shown (asked 2026-10-13, *"rm
  // code box from our granulator"*); every control in it is a named control.
  //
  // The five patches are sets of control values on the one program (`/n_set`),
  // so a patch never swaps the graph. After the rig's wet/dry, seven knobs
  // (asked 2026-10-13, *"our grain can have ~7 params + wet/dry as first"*),
  // most audible first:
  //   size     how long each grain is
  //   density  how many grains a second
  //   pitch    how fast each grain plays, an octave up at 2
  //   back     how far behind the input the grains read
  //   speed    how fast the read head moves: 1 follows, below 1 stretches
  //   scatter  even grains at 0, grains at random at 1
  //   freeze   the ring stops recording and holds what it has (off or on)
  // What is left, jitter, detune and pan, is the texture that makes a patch
  // that patch; the patch alone sets it, on its own wire from web:patch into
  // web:grains, with `/n_set` at once and no glide.
  //
  // Everything that is not the engine is `../grain-rig.mjs`, shared with the
  // archived Pappus page.
  const d = mount({ name: 'concept sampler 060', what: '', readout: null, index: '/concepts/', indexLabel: 'concepts' });
  conceptNav('sampler/060');

  const NODE = 4000, BUF = 0, DEF = 'gring';
  const secs = (v) => (v < 1 ? `${Math.round(v * 1000)} ms` : `${v.toFixed(2)} s`);
  const times = (v) => `${v.toFixed(2)}x`;
  const CONTROLS = [
    { name: 'size', label: 'size', kind: 'knob', min: 0.02, max: 4, warp: 'exp', fmt: secs },
    { name: 'density', label: 'density', kind: 'knob', min: 0.5, max: 64, warp: 'exp', fmt: (v) => `${v < 10 ? v.toFixed(1) : Math.round(v)}/s` },
    { name: 'pitch', label: 'pitch', kind: 'knob', min: 0.25, max: 4, warp: 'exp', fmt: times },
    { name: 'back', label: 'back', kind: 'knob', min: 0, max: 4, warp: 'lin', fmt: secs },
    { name: 'speed', label: 'speed', kind: 'knob', min: 0, max: 2, warp: 'lin', fmt: times },
    { name: 'scatter', label: 'scatter', kind: 'knob', min: 0, max: 1, warp: 'lin', fmt: (v) => `${Math.round(v * 100)}%` },
    // On or off, so a stepped knob with two positions (asked 2026-10-13,
    // *"convert freeze to 0 1 knob"*). It steps at the start of a glide.
    { name: 'freeze', label: 'freeze', kind: 'steps', choices: [{ label: 'off', value: 0 }, { label: 'on', value: 1 }] },
  ];
  const NAMES = CONTROLS.map((c) => c.name);
  const FIXED = ['jitter', 'detune', 'pan'];
  const pick = (p, names) => Object.fromEntries(names.map((n) => [n, valuesOf(p)[n]]));

  // ── the program: compiled as the page opens, pure JavaScript, no fetch ───
  const t0 = performance.now();
  const good = compile(PROGRAM, { name: DEF });
  const compileMs = performance.now() - t0;
  if (!good.ok) d.log(`the granulator's program did not compile: ${good.message}`, 'bad');

  // ── the engine, behind the rig's contract ────────────────────────────────
  let eng = null, ctx = null, values = valuesOf(PATCHES[0]), mixNow = 1;
  const T = { bufferBytes: RING_SECONDS * 48000 * 4, compileMs: +compileMs.toFixed(1) };
  const engine = {
    label: 'grain ring',
    // The wet/dry is `\mix` in the program's last line, so the blend happens
    // in the engine and the dry source never leaves it.
    mixes: true,
    async boot({ ctx: ac, input, grain, log }) {
      ctx = ac;
      const t1 = performance.now();
      if (!good.ok) throw new Error('the program did not compile');
      eng = await bootScsynth({
        audioContext: ctx, input, log,
        // `SendReply.ar(trig, '/grain', [pos, size, write / frames, rate])`
        // arrives as ['/grain', nodeID, replyID, pos, size, write head, rate]:
        // SendReply puts two of its own in front. Both positions are fractions
        // of the same eight seconds, so how long ago the grain's audio came in
        // is their difference round the ring.
        onReply: (m) => {
          if (m[0] !== '/grain') return false;
          const pos = m[3], head = m[5];
          grain({ pos, ago: ((((head - pos) % 1) + 1) % 1) * RING_SECONDS, dur: m[4], voice: 0, rate: m[6] });
          return true;
        },
      });
      eng.out.gain.value = 0;
      T.moduleMs = Math.round(eng.moduleMs); T.bootMs = Math.round(eng.bootMs);
      const ta = performance.now();
      const alloc = await eng.sendAndWait((m) => (m[0] === '/done' || m[0] === '/fail') && (m[1] === '/b_alloc' || m[1] === '/b_allocPtr'),
        5000, '/b_alloc', BUF, RING_SECONDS * ctx.sampleRate, 1);
      if (!alloc || alloc[0] !== '/done') throw new Error('the ring buffer was not allocated');
      T.allocMs = Math.round(performance.now() - ta);
      const td = performance.now();
      const done = await eng.sendAndWait((m) => m[0] === '/done' && m[1] === '/d_recv', 5000, '/d_recv', good.bytes);
      if (!done) throw new Error('the engine never said it had the definition');
      T.defMs = Math.round(performance.now() - td); T.defBytes = good.bytes.length;
      const go = await eng.sendAndWait((m) => m[0] === '/n_go' || (m[0] === '/fail' && m[1] === '/s_new'), 5000,
        '/s_new', DEF, NODE, 1, 0, 'buf', BUF, 'inbus', 2, 'mix', mixNow, ...Object.entries(values).flat());
      if (!go || go[0] !== '/n_go') throw new Error('the granulator did not start');
      T.startMs = Math.round(performance.now() - t1);
      log(`the granulator up ${T.startMs} ms after Play: one ${RING_SECONDS} s buffer of ${(T.bufferBytes / 1e6).toFixed(1)} MB, `
        + `the ${good.bytes.length} B definition compiled in ${T.compileMs} ms and taken in ${T.defMs} ms`);
      return { meter: eng.meter, out: eng.out, timing: T, scsynth: eng };
    },
    // What a patch does beyond its values: the read head starts again at the
    // write head, so `back` means what it says after a stretch has left it
    // anywhere.
    land() {
      eng.send('/n_set', NODE, 'sync', 1);
      setTimeout(() => eng.send('/n_set', NODE, 'sync', 0), 40);
    },
    knob(name, v) { if (name === 'mix') mixNow = v; else values[name] = v; eng.send('/n_set', NODE, name, v); },
    fixed(set) { Object.assign(values, set); eng.send('/n_set', NODE, ...Object.entries(set).flat()); },
    run(on) { eng.send('/n_run', NODE, on ? 1 : 0); },
    async read(name) {
      const r = await eng.sendAndWait((m) => m[0] === '/n_set' && m[2] === name, 3000, '/s_get', NODE, name);
      return r ? Number(r[3]) : null;
    },
    glitches: () => { try { return eng?.sonic.getMetrics?.()?.glitchCount ?? null; } catch { return null; } },
  };

  const rig = createGrainRig({
    d, engine,
    patches: PATCHES.map((p) => ({ name: p.name, says: p.says, set: pick(p, NAMES), fixed: pick(p, FIXED) })),
    controls: CONTROLS, roles: { size: 'size', density: 'density' },
    // The patch picker on its own row, full width, and no output scope (asked
    // 2026-10-13, *"replace with just a patch selector (no scope/viz/footer)"*
    // and *"patch selector full w"*).
    outputScope: false,
    // The page's own checks: the program compiled here, and a fixed value is
    // in the engine without a knob for it.
    check: async ({ wait, choosePatch }) => {
      d.assert('the program compiled in this tab as the page opened', good.ok && good.bytes.length > 0,
        good.ok ? `${good.bytes.length} B in ${T.compileMs} ms` : good.message);
      const to = PATCHES.findIndex((p) => p.name === 'Stutter');
      choosePatch(to);
      await wait(2600);
      const panNow = await engine.read('pan');
      d.assert('a patch sets its fixed values in the engine, with no knob for them',
        Math.abs(panNow - valuesOf(PATCHES[to]).pan) < 1e-4, `pan ${panNow} against Stutter's ${valuesOf(PATCHES[to]).pan}`);
    },
  });
  window.__demo.ring = { good: () => good, compileMs: () => T.compileMs };
  await rig.ready();
</script>
