<!doctype html>
<html lang="en">
<meta charset="utf-8">

<title>POSITRON concept sampler 040</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* The patch selector is a full width block, as /concepts/sampler/010/'s. */
  .pos-pick.cc-patch { display: flex; width: 100%; }
  .cc-patch .pos-pick-seg { display: flex; flex: 1 1 auto; min-width: 0; }
  .cc-patch .pos-pick-cell { flex: 1 1 auto; width: auto; min-width: 0; }
</style>
<script type="module">
  // concepts sampler/040, THE PI'S SAMPLER IN THIS TAB, 2026-10-11. Asked:
  // *"Build sampler/040 with the same keyboard and samples, played by the Pi's
  // synthdefs running in the tab. Then compare the two by ear and in the
  // readouts."* /concepts/sampler/010/'s keys, patch node and R2 recordings, but
  // the voice is SuperCollider: wasm scsynth (`/shell/scsynth.mjs`, SuperSonic)
  // running the board's two SynthDefs, driven by the board's own voice rules.
  // The comparison is research/scsynth-sampler-in-browser-2026-10-11.md.
  //
  // WHAT IS THE PI'S, AND HOW IT GOT HERE:
  //   - the SynthDefs `posSampler1` and `posSampler2` are
  //     rig/board/norns/possampler-defs.scd, written HERE as bytes by
  //     `/shell/synthdef.mjs` because no sclang runs in a browser. The graph is
  //     the .scd's line for line (Env.asr(0.001, 1, rel, -6) on an EnvGen with
  //     doneAction 2, PlayBuf at rate * BufRateScale with doneAction 2, times
  //     env times amp, Out at `out`). ⚠️ NOT BYTE COMPARED with what the Pi's
  //     sclang wrote: the graph is the same, the block order may not be;
  //   - the note, band, gain and release rules are imported from
  //     `/concepts/sampler/sampler.mjs`, which rig/board/test.mjs grades equal
  //     to rig/board/scsampler.mjs's copies over every input;
  //   - the voice core (32 voices, a key struck again damps the voice it
  //     replaces, the oldest taken past the cap, `/n_set rel gate 0` as the
  //     damper, a key-off sample when the damper lands, the stereo halving) is
  //     COPIED from rig/board/scsampler.mjs `createSamplerCore`, because that
  //     file opens node:child_process and node:dgram at the top and cannot be
  //     imported here;
  //   - the board's capture SUMS out_1 and out_2 to one channel
  //     (rig/board/jacksynth.mjs), and the core's halving of a stereo voice is
  //     written for that sum. So this page sums scsynth's two outputs to mono
  //     as the capture does, and both speakers play that: what the Pi would
  //     send down the relay, with no relay in between.
  //
  // WHAT IS THIS TAB'S: the Pi holds every recording on its card before the
  // first note; a tab cannot afford 208 decoded piano files up front, so a
  // press waits on its one file and the rest follow behind it, by the same plan
  // the WebAudio sampler uses (`planFor`, `PIANO.behind`). The m4a files are
  // the WebAudio sampler's, decoded by SuperSonic at the context's rate, so
  // BufRateScale is 1 here as it is on the Pi.
  //
  // NOTHING OPENS ON A VISIT. The wasm engine, the two definitions and the
  // first recording come with the first key press or program change.
  import { conceptNav } from '/concepts/nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createKeyboard, keyRange } from '/shell/keyboard.mjs';
  import { createMidi } from '/shell/midi.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { createPedal, SUSTAIN_CC } from '/shell/pedal.mjs';
  import { bootScsynth } from '/shell/scsynth.mjs';
  import { graph, RATE, OP } from '/shell/synthdef.mjs';
  import { PIANO, RHODES, PIANO_NOTES, RHODES_NOTES, RELEASE_KEYS, nearestIn, planFor, velGain }
    from '/concepts/sampler/sampler.mjs';

  const d = mount({ name: 'concept sampler 040', what: '', index: '/concepts/', indexLabel: 'concepts',
    joined: false,
    readout: { 'key to sound': 'ms', boot: 'ms', 'first note': 'ms', underruns: '' } });
  conceptNav('sampler/040');

  // ── the two SynthDefs, possampler-defs.scd as bytes ──────────────────────
  // Env.asr(0.001, 1, rel, -6) as EnvGen reads it: start 0, two segments,
  // release node 1, no loop, then (level, time, shape 5 = a curve, curve) per
  // segment. EnvGen's own inputs come first: gate, levelScale 1, levelBias 0,
  // timeScale 1, doneAction 2.
  function samplerDef(ch) {
    const g = graph(`posSampler${ch}`);
    const k = g.value;
    const [out, buf, rate, amp, gate, rel] = g.params([['out', 0], ['buf', 0], ['rate', 1], ['amp', 0.1], ['gate', 1], ['rel', 0.12]]);
    const env = g.block('EnvGen', RATE.sample, [gate, k(1), k(0), k(1), k(2),
      k(0), k(2), k(1), k(-99), k(1), k(0.001), k(5), k(-6), k(0), rel, k(5), k(-6)]);
    const scale = g.block('BufRateScale', RATE.slow, [buf]);
    const r = g.block('BinaryOpUGen', RATE.slow, [rate, scale], 1, OP.mul);
    const play = g.block('PlayBuf', RATE.sample, [buf, r, k(1), k(0), k(0), k(2)], ch);
    const sig = [];
    for (let i = 0; i < ch; i++) {
      const se = g.block('BinaryOpUGen', RATE.sample, [{ from: play.from, out: i }, env], 1, OP.mul);
      sig.push(g.block('BinaryOpUGen', RATE.sample, [se, amp], 1, OP.mul));
    }
    g.block('Out', RATE.sample, [out, ...sig], 0, 0);
    return g.bytes();
  }

  // ── the sets, as rig/board/scsampler.mjs SETS has them ──────────────────
  // Buffer numbers fixed per file the Pi's way: Rhodes 100 up, Salamander notes
  // 300 up (notes by layers 1, 6, 11, 16), releases 500 up. Keyed by URL here.
  const BUFNUM = new Map();
  PIANO_NOTES.flatMap((n) => [1, 6, 11, 16].map((l) => PIANO.file(n, l))).forEach((u, i) => BUFNUM.set(u, 300 + i));
  RELEASE_KEYS.forEach((k, i) => BUFNUM.set(PIANO.release(k), 500 + i));
  RHODES_NOTES.flatMap((n) => [1, 2, 3, 4, 5].map((l) => (RHODES.layerAt(n, l) === l ? RHODES.file(n, l) : null)))
    .filter(Boolean).forEach((u, i) => BUFNUM.set(u, 100 + i));
  const SETS = {
    0: { id: 'piano', name: 'Piano', program: 0, ins: PIANO, gain: PIANO.gain, releaseGain: PIANO.releaseGain,
      fileFor: (near, vel) => PIANO.file(near, PIANO.pick(near, vel)), releaseFor: (key) => PIANO.release(key) },
    1: { id: 'rhodes', name: 'Rhodes', program: 1, ins: RHODES, gain: (vel) => velGain(RHODES, vel),
      fileFor: (near, vel) => { const l = RHODES.pick(near, vel); return l == null ? null : RHODES.file(near, l); } },
  };
  const INSTRUMENTS = [SETS[0], SETS[1]];

  // ── the voice core, COPIED from rig/board/scsampler.mjs createSamplerCore ─
  // Changed only where a browser differs: `send` takes (address, ...args) as
  // SuperSonic does, buffers are keyed by URL, and the FluidR3 set (program 2)
  // is not here because 010 does not have it either.
  const VOICES = 32;
  function createSamplerCore({ send, buffers, onProgram = () => {}, now = () => performance.now() / 1000 }) {
    let program = 0, nextId = 2000;
    const live = [];
    const stat = { started: 0, stolen: 0, dropped: 0, ended: 0, releases: 0, last: null, peakVoices: 0 };
    const release = (note, sec) => {
      let fell = null;
      for (const v of live) if (v.note === note && !v.damped) { damp(v, sec); fell ??= v; }
      const set = fell && SETS[fell.program];
      const url = set?.releaseFor?.(note);
      const b = url && buffers.get(url);
      if (!b) return;
      const amp = set.releaseGain(fell.vel, now() - fell.at) * (b.channels === 2 ? 0.5 : 1);
      send('/s_new', b.channels === 2 ? 'posSampler2' : 'posSampler1', nextId++, 1, 0, 'buf', b.bufnum, 'rate', 1, 'amp', amp);
      stat.releases++;
    };
    const pedal = createPedal({ cc: SUSTAIN_CC, release });
    function damp(v, sec) {
      if (v.damped) return;
      v.damped = true;
      send('/n_set', v.id, 'rel', Math.max(0.005, sec), 'gate', 0);
    }
    function remove(v) { const i = live.indexOf(v); if (i >= 0) live.splice(i, 1); }
    function noteOn(note, vel) {
      if (!(note >= 0 && note <= 127)) return { ok: false };
      const set = SETS[program];
      pedal.keyDown(note);
      const near = nearestIn(set.ins.notes, note);
      const url = set.fileFor(near, vel);
      const b = url == null ? null : buffers.get(url);
      if (!b) { stat.dropped++; return { ok: false, dropped: true }; }
      for (const v of live) if (v.note === note) damp(v, 0.04);
      while (live.length >= VOICES) { const old = live[0]; damp(old, 0.02); remove(old); stat.stolen++; }
      const rate = Math.pow(2, (note - near) / 12);
      const amp = set.gain(vel) * (b.channels === 2 ? 0.5 : 1);
      const id = nextId++;
      send('/s_new', b.channels === 2 ? 'posSampler2' : 'posSampler1', id, 1, 0, 'buf', b.bufnum, 'rate', rate, 'amp', amp);
      live.push({ id, note, damped: false, program, vel, at: now() });
      stat.started++;
      stat.peakVoices = Math.max(stat.peakVoices, live.length);
      stat.last = { set: set.id, note, near, file: url.split('/').pop(), rate: +rate.toFixed(4), amp: +amp.toFixed(4), id };
      return { ok: true, ...stat.last };
    }
    function setProgram(p) {
      if (!SETS[p]) return { ok: false };
      if (p === program) return { ok: true, changed: false };
      program = p;
      for (const v of [...live]) { damp(v, 0.06); remove(v); }
      onProgram(SETS[p]);
      return { ok: true, changed: true };
    }
    function ended(id) { const v = live.find((x) => x.id === id); if (v) { remove(v); stat.ended++; } }
    function panic() { for (const v of [...live]) { damp(v, 0.02); remove(v); } pedal.panic?.(); }
    return {
      noteOn, noteOff: (n) => pedal.keyUp(n), control: (c, v) => pedal.control(c, v), program: setProgram, ended, panic,
      current: () => SETS[program], sounding: () => live.length, pedalDown: () => pedal.down(),
      stat: () => ({ ...stat, voices: live.length, program }),
    };
  }

  // ── the engine, raised on the first press ────────────────────────────────
  let ctx = null, eng = null, booting = null, core = null;
  const buffers = new Map();       // url -> { bufnum, channels, frames }
  const inflight = new Map();
  const queue = [];
  let draining = false, loading = 0, fetchedAt = 0;
  const stat = { bootMs: null, moduleMs: null, wasmMs: null, defsMs: null, files: 0, bytes: 0, loadMs: [], firstNoteMs: null };

  function ensureEngine() {
    if (booting) return booting;
    // Made here, inside the press, so the context starts running.
    ctx = new AudioContext({ latencyHint: 'interactive' });
    ctx.resume().catch(() => {});
    const t0 = performance.now();
    booting = (async () => {
      eng = await bootScsynth({
        audioContext: ctx,
        log: (line) => d.log(line.replaceAll(' \u00b7 ', ', ')),
        // scsynth's word that a voice ended, so the core's count stays true.
        onReply: (m) => {
          if (m[0] === '/n_end') { core?.ended(m[1]); return true; }
          return m[0] === '/n_go' || m[0] === '/n_off' || m[0] === '/n_on' || m[0] === '/n_move';
        },
      });
      stat.moduleMs = Math.round(eng.moduleMs); stat.wasmMs = Math.round(eng.bootMs);
      // The capture's sum, then both speakers. `out` is bootScsynth's trim at
      // 0.9; the Pi has none, so it is 1 here.
      eng.sonic.node.disconnect();
      const split = ctx.createChannelSplitter(2);
      const sum = ctx.createGain();
      sum.channelCount = 1; sum.channelCountMode = 'explicit'; sum.channelInterpretation = 'discrete';
      eng.sonic.node.connect(split);
      split.connect(sum, 0, 0); split.connect(sum, 1, 0);
      sum.connect(eng.meter);
      eng.out.gain.value = 1;
      const td = performance.now();
      for (const ch of [1, 2]) {
        const got = await eng.sendAndWait((m) => m[0] === '/done' && m[1] === '/d_recv', 20000, '/d_recv', samplerDef(ch));
        if (!got) throw new Error(`scsynth never said it had posSampler${ch}`);
      }
      stat.defsMs = Math.round(performance.now() - td);
      stat.bootMs = Math.round(performance.now() - t0);
      d.set('boot', stat.bootMs);
      d.log(`SuperCollider in this tab in ${stat.bootMs} ms, the two sampler definitions taken in ${stat.defsMs} ms`);
      core = createSamplerCore({
        send: (...m) => eng.send(...m), buffers,
        onProgram: (set) => { patchPick.show(set.name, INSTRUMENTS.indexOf(set)); d.log(`program change ${set.program}: scsynth plays the ${set.name} now`); },
      });
      listenStart();
    })();
    booting.catch((e) => d.log(`SuperCollider did not come up: ${e.message}`, 'bad'));
    return booting;
  }

  /** One recording into a scsynth buffer, once. A failure is forgotten so the next ask tries again. */
  function load(url) {
    if (buffers.has(url)) return Promise.resolve();
    if (inflight.has(url)) return inflight.get(url);
    const job = (async () => {
      const t = performance.now();
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`${url.split('/').slice(-2).join('/')} answered ${res.status}`);
        const ab = await res.arrayBuffer();
        stat.bytes += ab.byteLength; stat.files++;
        const bufnum = BUFNUM.get(url);
        const info = await eng.sonic.loadSample(bufnum, ab);
        buffers.set(url, { bufnum, channels: info.numChannels, frames: info.numFrames });
        stat.loadMs.push(Math.round(performance.now() - t));
      } catch (e) { d.log(`a recording did not load: ${e.message}`, 'warn'); }
    })().finally(() => inflight.delete(url));
    inflight.set(url, job);
    return job;
  }
  function track(p) {
    loading++; pb?.refresh?.();
    return p.finally(() => { loading--; fetchedAt = performance.now(); pb?.refresh?.(); });
  }
  /** Files a press does not wait for, one at a time behind it (sampler.mjs's order). */
  function behind(urls) {
    for (const u of urls) if (!buffers.has(u) && !queue.includes(u)) queue.push(u);
    if (draining) return;
    draining = true;
    track((async () => { while (queue.length) await load(queue.shift()); })()).finally(() => { draining = false; });
  }

  // ── a press ─────────────────────────────────────────────────────────────
  // A key let go while its recording was still coming sounds for LATE_S and is
  // then damped: sampler.mjs's rule, copied, so a first click is heard.
  const LATE_S = 0.3;
  const held = new Set(), waiting = new Map();   // note -> true once its key came up early
  async function noteOn(note, vel) {
    held.add(note);
    pressed(note);
    waiting.set(note, false);
    try {
      await ensureEngine();
      const set = core.current();
      const near = nearestIn(set.ins.notes, note);
      const layer = set.ins.pick(near, vel);
      const url = set.ins.file(near, layer);
      if (!buffers.has(url)) await track(Promise.all(planFor(set.ins, near, layer).urls.map(load)));
      if (set.ins.behind) behind(set.ins.behind(near, layer, note));
      const early = waiting.get(note);
      waiting.delete(note);
      const r = core.noteOn(note, vel);
      if (r.ok && early) setTimeout(() => { if (!held.has(note)) core.noteOff(note); }, LATE_S * 1000);
    } catch { waiting.delete(note); }
  }
  function noteOff(note) {
    held.delete(note);
    if (waiting.has(note)) { waiting.set(note, true); return; }
    core?.noteOff(note);
  }
  function program(p) {
    if (!SETS[p]) { d.log(`program ${p} is not an instrument here`, 'warn'); return; }
    ensureEngine().then(() => {
      core.program(p);
      // The keys on screen, fetched behind, so the first Rhodes note is not cold (010's warm).
      if (p === 1) {
        const near = new Set();
        for (let n = 48; n <= 69; n++) near.add(nearestIn(RHODES.notes, n));
        behind([...near].flatMap((n) => planFor(RHODES, n).urls));
      }
    }).catch(() => {});
  }
  function midi(e) {
    if (e.cls === 'note') return e.d2 ? noteOn(e.d1, e.d2) : noteOff(e.d1);
    if (e.cls === 'cc' && e.d1 === SUSTAIN_CC) { core?.control(e.d1, e.d2); return; }
    if (e.cls === 'program') return program(e.d1);
  }

  // ── key to sound, the way /concepts/sampler/030/ measures it ──────────────
  // COPIED from 030: per press, the first 1 ms block over ONSET and three times
  // the 30 ms before it, on the speaker's clock (`getOutputTimestamp`, so the
  // browser's own output latency is inside it). The tap is scsynth's meter,
  // after the sum. `first note` is the first press to its sound, the engine
  // boot and its recording included.
  const KEEP_MS = 200, ONSET = 0.02, WAIT_MS = 1500;
  const env = [], pendingPress = [], lags = [];
  let lastLag = null, readUpTo = 0, firstPress = null, fbuf = null;
  function pressed(note) {
    const at = performance.now();
    firstPress ??= { note, at };
    pendingPress.push({ note, at });
    while (pendingPress.length > 8) pendingPress.shift();
  }
  function listen() {
    const ts = ctx.getOutputTimestamp?.();
    if (!ts || !ts.performanceTime) return;
    eng.meter.getFloatTimeDomainData(fbuf);
    const sr = ctx.sampleRate, N = fbuf.length, blk = Math.round(sr / 1000);
    const tEnd = ts.performanceTime + (ctx.currentTime - ts.contextTime) * 1000;
    const t0 = tEnd - (N / sr) * 1000;
    for (let i = 0; i + blk <= N; i += blk) {
      const at = t0 + (i / sr) * 1000;
      if (at <= readUpTo) continue;
      let pk = 0;
      for (let j = i; j < i + blk; j++) { const a = fbuf[j] < 0 ? -fbuf[j] : fbuf[j]; if (a > pk) pk = a; }
      env.push({ at, peak: pk });
      readUpTo = at;
      let before = 0;
      for (let k = env.length - 31; k < env.length - 1; k++) if (k >= 0 && env[k].peak > before) before = env[k].peak;
      if (pk > ONSET && pk > before * 3) {
        const p = pendingPress.find((x) => x.at < at);
        if (p) {
          pendingPress.splice(pendingPress.indexOf(p), 1);
          const lag = at - p.at;
          if (p.at === firstPress?.at && stat.firstNoteMs == null) { stat.firstNoteMs = Math.round(lag); d.set('first note', stat.firstNoteMs); }
          else { lastLag = lag; lags.push(lag); if (lags.length > 20) lags.shift(); d.set('key to sound', Math.round(lag)); }
        }
      }
    }
    const now = performance.now();
    while (env.length && env[0].at < now - KEEP_MS) env.shift();
    // The first press waits as long as the boot takes; every other one 1.5 s.
    for (let k = pendingPress.length - 1; k >= 0; k--) {
      const p = pendingPress[k];
      if (now - p.at > (p.at === firstPress?.at ? 20000 : WAIT_MS)) pendingPress.splice(k, 1);
    }
  }
  function listenStart() {
    fbuf = new Float32Array(eng.meter.fftSize);
    const loop = () => { listen(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
    // Underruns are Chrome's count of render quanta the audio thread missed
    // (`AudioContext.playbackStats`), the one load figure a tab can read; it is
    // blank where the browser has no such counter.
    setInterval(() => { const n = ctx.playbackStats?.underrunEvents; d.set('underruns', n == null ? '' : n); }, 500);
  }

  // ── the bay ─────────────────────────────────────────────────────────────
  const S = 'web', CF = 'cf-r2';
  const bay = createBay();
  bay.addNode({ id: `${S}:keys`, kind: 'person', label: 'keyboard', place: 'browser' });
  bay.addNode({ id: `${S}:scsynth`, kind: 'engine', label: 'SuperCollider sampler', place: 'browser' });
  bay.addNode({ id: `${S}:speaker`, kind: 'screen', label: 'speakers', place: 'browser' });
  bay.addNode({ id: `${S}:patch`, kind: 'person', label: 'patch', place: 'browser' });
  bay.addNode({ id: `${CF}:piano`, kind: 'store', label: 'piano samples', place: 'cloudflare', net: 'cloudflare' });
  bay.addNode({ id: `${CF}:rhodes`, kind: 'store', label: 'Rhodes samples', place: 'cloudflare', net: 'cloudflare' });
  bay.addPort({ id: `${S}:keys:midi-out`, dir: 'out', medium: 'midi', emits: ['note', 'cc'] });
  bay.addPort({ id: `${S}:patch:midi-out`, dir: 'out', medium: 'midi', emits: ['program'] });
  bay.addPort({ id: `${S}:scsynth:midi-in`, dir: 'in', medium: 'midi', accepts: ['note', 'cc', 'program'], deliver: (e) => midi(e) });
  bay.addPort({ id: `${S}:scsynth:file-in`, dir: 'in', medium: 'file' });
  bay.addPort({ id: `${S}:scsynth:audio-out`, dir: 'out', medium: 'audio' });
  bay.addPort({ id: `${S}:speaker:audio-in`, dir: 'in', medium: 'audio' });
  bay.addPort({ id: `${CF}:piano:file-out`, dir: 'out', medium: 'file', transports: ['https'] });
  bay.addPort({ id: `${CF}:rhodes:file-out`, dir: 'out', medium: 'file', transports: ['https'] });
  for (const [a, b] of [
    [`${S}:keys:midi-out`, `${S}:scsynth:midi-in`],
    [`${S}:patch:midi-out`, `${S}:scsynth:midi-in`],
    [`${CF}:piano:file-out`, `${S}:scsynth:file-in`],
    [`${CF}:rhodes:file-out`, `${S}:scsynth:file-in`],
    [`${S}:scsynth:audio-out`, `${S}:speaker:audio-in`],
  ]) {
    const r = bay.link(a, b, [], { site: S });
    if (!r.ok) d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
  }

  // A file wire is lit while its set's recordings come down and for 600 ms
  // after; the audio wire while a voice sounds. MIDI pulses once per event.
  const flowing = (l, medium) => {
    if (medium === 'file') {
      const id = (core?.current() ?? SETS[0]).id;
      return l.from.startsWith(`${CF}:${id}:`) && (loading > 0 || (fetchedAt && performance.now() - fetchedAt < 600));
    }
    if (medium === 'audio') return (core?.sounding() ?? 0) > 0;
    return false;
  };
  const pb = createPatchbay(bay, { detail: (n) => [{ text: n.label, sans: true }], flowing });

  // ── the patch selector, its own node ─────────────────────────────────────
  let patchAt = 0;
  const pick = (i) => { patchAt = i; bay.send(`${S}:patch:midi-out`, { cls: 'program', ch: 1, d1: INSTRUMENTS[i].program }); };
  const step = (by) => pick((patchAt + by + INSTRUMENTS.length) % INSTRUMENTS.length);
  const patchPick = createPicker({ what: 'patch', cls: 'cc-patch', prev: () => step(-1), next: () => step(+1), onPick: (i) => pick(i) });
  patchPick.options(INSTRUMENTS.map((x) => x.name), 0);

  // ── the keys, and a plugged in keyboard through the same node ───────────
  const host = el('div');
  const send = (note, vel) => bay.send(`${S}:keys:midi-out`, { cls: 'note', ch: 1, d1: note, d2: vel });
  const kb = createKeyboard(host, {
    ...keyRange(21), base: 48,
    onDown: (note, how) => { if (how !== 'midi') send(note, 100); },
    onUp: (note, how) => { if (how !== 'midi') send(note, 0); },
    onPanic: () => core?.panic(),
  });
  createMidi({
    log: (line, kind) => d.log(line, kind),
    onDown: (n, vel) => { kb.lightNote?.(n, true); send(n, vel); },
    onUp: (n) => { kb.lightNote?.(n, false); send(n, 0); },
    onControl: (c, v) => { if (c === 64) bay.send(`${S}:keys:midi-out`, { cls: 'cc', ch: 1, d1: c, d2: v }); },
  });

  d.stack.add(patchPick.el, host, pb.el);
  window.__demo.bay = bay;
  // Read only, for a check over CDP.
  window.__demo.sampler = {
    stat: () => ({ ...stat, loadMs: [...stat.loadMs], buffers: buffers.size, loading: loading > 0 || draining,
      core: core?.stat() ?? null, lags: [...lags], lastLag, state: ctx?.state ?? 'none',
      underruns: ctx?.playbackStats?.underrunEvents ?? null, sampleRate: ctx?.sampleRate ?? null }),
  };
  d.ready();
</script>
