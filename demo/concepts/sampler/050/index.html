<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON concept sampler 050</title>
<link rel="stylesheet" href="/shell/shell.css">
<script type="module">
  import { conceptNav } from '/concepts/nav.mjs';
  import { mount } from '/shell/shell.mjs';
  import { bootScsynth } from '/shell/scsynth.mjs';
  import { allocBuffers, bufferPlan, startPappusSynth, applyAudibleDefaults, setParam, RING_SECONDS, PAPPUS_NODE } from '/shell/pappus.mjs';
  import { createModulator } from '/shell/pappus-mod.mjs';
  import { PATCHES, BUF_SECONDS, MOD_SPECS, MOD_FOLLOWERS, MOD_CMD, MOD_HZ,
    writeDiscrete, writeContinuous, continuousOf, basesOf, routesOf, createFeatures } from '/shell/radio-gran.mjs';
  import { createGrainRig } from '/concepts/sampler/grain-rig.mjs';

  // concepts sampler/050, GRANULATOR, 2026-10-13. Asked (BACKLOG): *"what is good
  // source? perhaps our recorded radios for start? witch patch selector. do we
  // get events for scope? do 2 knobs. what pappus gives us?"*
  //
  // A sampler because a granulator is one: it RECORDS what comes in and plays
  // pieces of it back. Pappus (rig/board/norns/Engine_Pappus.sc, the board's
  // granulator, compiled on the Pi as the TINY rung) runs in this tab's wasm
  // SuperCollider and records its INPUT into a ring. The patches are
  // radio-gran.mjs's twelve, the same ones /videoradio/ tours.
  //
  // Everything that is not Pappus (the sources, the scopes, the grain events,
  // the knobs, the patchbay, Play and the self check) is
  // `../grain-rig.mjs`, shared with /concepts/sampler/060/, the light twin.
  // This page is the engine.
  const d = mount({ name: 'concept sampler 050', what: '', readout: null, index: '/concepts/', indexLabel: 'concepts' });
  conceptNav('sampler/050');

  const sentence = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  // ── Pappus, behind the rig's engine contract ─────────────────────────────
  let eng = null, ctx = null, modulator = null, cur = null, routed = new Set();
  // The write head of Pappus's ring, on the audio clock. `wphase` is a Phasor
  // from 0 at /s_new over `mbuflen` seconds (Engine_Pappus.sc:652), and /n_run 0
  // stops it, so it is the engine's running seconds, kept here across pauses.
  let ranFor = 0, runFrom = null;
  const engSeconds = () => ranFor + (runFrom != null ? ctx.currentTime - runFrom : 0);
  const both = (name, v) => { setParam(eng, `m${name}`, v); setParam(eng, `n${name}`, v); };

  const engine = {
    label: 'Pappus granulator',
    async boot({ ctx: ac, input, grain, log }) {
      ctx = ac;
      const t0 = performance.now();
      eng = await bootScsynth({
        audioContext: ctx, input, log,
        // 🔴 EVERY GRAIN IS AN EVENT FROM THE ENGINE, NOT A GUESS FROM SETTINGS.
        // `SendReply.ar(vtrig * report, '/pgrain', [pos, dur, i, half])`
        // (Engine_Pappus.sc:849) arrives as `['/pgrain', nodeID, replyID, pos,
        // dur, voice, half]`; `pos` is at index 3 (the off by one /grains/ and
        // /radio/ both record). `pos` is a fraction of the SIXTY second ring
        // and the engine reads only its first BUF_SECONDS, so it is rescaled
        // to the window, and the window's write head says how many seconds ago
        // the audio under that grain arrived.
        onReply: (m) => {
          if (m[0] !== '/pgrain') return false;
          const pos = Math.min(1, Math.max(0, m[3] * RING_SECONDS / BUF_SECONDS));
          const head = (engSeconds() / BUF_SECONDS) % 1;
          grain({ pos, ago: ((((head - pos) % 1) + 1) % 1) * BUF_SECONDS, dur: m[4], voice: m[5], half: m[6] });
          return true;
        },
      });
      eng.out.gain.value = 0;
      const T = { moduleMs: Math.round(eng.moduleMs), bootMs: Math.round(eng.bootMs),
        bufferBytes: bufferPlan().reduce((n, [, f, c]) => n + f * c * 4, 0) };
      const ta = performance.now();
      const bufs = await allocBuffers(eng, { log });
      T.allocMs = Math.round(performance.now() - ta);
      const def = await eng.recvDef('/grains/defs/pappus-tiny.scsyndef');
      T.defMs = def.ms; T.defBytes = def.bytes;
      if (!def.ok) throw new Error(`Pappus was not taken: ${def.why}`);
      if (!(await startPappusSynth(eng))) throw new Error('Pappus did not start');
      runFrom = ctx.currentTime; ranFor = 0;
      applyAudibleDefaults(eng, { live: true, bufSeconds: BUF_SECONDS });
      T.startMs = Math.round(performance.now() - t0);
      log(`Pappus up ${T.startMs} ms after Play: ${bufs.allocated} buffers, `
        + `${(T.bufferBytes / 1e6).toFixed(1)} MB of them, the ${(def.bytes / 1024).toFixed(0)} KB definition taken in ${def.ms} ms`);
      // The modulation: the patches' routes, fed by the source's level and
      // colour, at MOD_HZ, as /videoradio/ runs it.
      const tap = ctx.createAnalyser(); tap.fftSize = 2048; tap.smoothingTimeConstant = 0;
      input.connect(tap);
      const feats = createFeatures(tap, ctx.sampleRate);
      modulator = createModulator({
        now: () => ctx.currentTime,
        send: (name, v) => setParam(eng, MOD_CMD[name] ?? `m${name}`, v),
        specs: MOD_SPECS, followers: MOD_FOLLOWERS,
        warn: (m) => log(`modulation refused: ${m}`, 'warn'),
      });
      setInterval(() => { if (runFrom == null) return; modulator.sense(feats.read()); modulator.tick(); }, 1000 / MOD_HZ);
      return { meter: eng.meter, out: eng.out, timing: T, scsynth: eng };
    },
    // A patch is landed whole (radio-gran.mjs's two halves, in /videoradio/'s
    // order: the discrete half, every base, the routes, then the continuous
    // half with the routed ones left to the modulator).
    land(i) {
      cur = { ...PATCHES[i] };
      writeDiscrete(eng, cur, { bufSeconds: BUF_SECONDS });
      for (const [k, v] of Object.entries(basesOf(cur))) modulator.setBase(k, v);
      const routes = routesOf(cur);
      modulator.setRoutes(routes);
      routed = new Set(routes.map((r) => r.dest));
      writeContinuous(eng, continuousOf(cur), { scanmode: cur.scanmode, bufSeconds: BUF_SECONDS, skip: routed });
    },
    // Pappus's own `size` (a grain's length in seconds) and `rate` (grains a
    // second), the two numbers that mean the same thing in all twelve patches;
    // `scan` is a speed, a place or a lag depending on the patch. A routed one
    // is the modulator's: move its base and it moves around the new number.
    knob(name, v) {
      cur[name] = v;
      if (routed.has(name)) modulator.setBase(name, v); else both(name, v);
    },
    run(on) {
      eng.send('/n_run', PAPPUS_NODE, on ? 1 : 0);
      if (on && runFrom == null) runFrom = ctx.currentTime;
      if (!on && runFrom != null) { ranFor += ctx.currentTime - runFrom; runFrom = null; }
    },
    async read(name) {
      const c = `m${name}`;
      const r = await eng.sendAndWait((m) => m[0] === '/n_set' && m[2] === c, 3000, '/s_get', PAPPUS_NODE, c);
      return r ? Number(r[3]) : null;
    },
    glitches: () => { try { return eng?.sonic.getMetrics?.()?.glitchCount ?? null; } catch { return null; } },
  };

  const rig = createGrainRig({
    d, engine,
    patches: PATCHES.map((p) => ({ name: sentence(p.name), says: p.says, size: p.size, rate: p.rate })),
  });
  await rig.ready();
</script>
