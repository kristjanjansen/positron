<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON concept sampler 030</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* The play button alone at the top left, as /concepts/synth/060/. What the
     board says goes to the log only. */
  .cc-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .cc-top > .pos-bgroup { flex: none; width: auto; }
  /* The patch selector is a full width block, as /concepts/sampler/010/'s. */
  .pos-pick.cc-patch { display: flex; width: 100%; }
  .cc-patch .pos-pick-seg { display: flex; flex: 1 1 auto; min-width: 0; }
  .cc-patch .pos-pick-cell { flex: 1 1 auto; width: auto; min-width: 0; }
</style>
<script type="module">
  // concepts sampler/030, THE PIANO ON THE PI, 2026-10-11. /concepts/sampler/010/'s
  // piano and Rhodes, played by the Raspberry Pi in studio-1 instead of the tab:
  // `pi-1:sampler` is a SuperCollider server of its own on the board
  // (rig/board/scsampler.mjs), the samples come from R2 onto the SD card once,
  // and its sound comes back down the relay as synth/060's Yoshimi does.
  // Asked: *"do supercollider. rm fluidsynth"*, option b) of
  // plans/plan-sampler-pi-pico.md §2.2: the sampler and Yoshimi sum into the one
  // capture, so this page starting the sampler never stops Yoshimi for somebody
  // else, and synth/060 starting Yoshimi never stops this.
  //
  // RELAY OR DIRECT, ONE PAGE SINCE 2026-10-11 (asked: *"can we combiine 030
  // and 035 with radiobutton of direct/notdirect mode?"*). 035 was this page
  // with `createBoard({ direct: true })` and `goDirect()` on play: two WebRTC
  // data channels to the Pi, signalled through the relay room, `pcm` carrying
  // the sound back and `ctl` the keys out, the relay kept for presence and as
  // the fallback (plans/plan-away-webrtc.md, rig/board/rtc.mjs). MEASURED on
  // /away/, laptop and Pi on one network: round trip 4 ms against ~72 over the
  // relay, key to speakers ~48 ms against ~175. `?path=direct` opens on direct;
  // /concepts/sampler/035/ redirects here with it. A change of mode while
  // playing stops, makes a new board for the new mode and plays again.
  //
  // NOTHING OPENS ON A VISIT. The board (and so the relay socket) is made on the
  // play press, never at load. A check run sends nothing to the shared board
  // unless ?board=1 is added, the same gate synth/060 and /knobs/ use.
  import { conceptNav } from '/concepts/nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createKeyboard, keyRange } from '/shell/keyboard.mjs';
  import { createMidi } from '/shell/midi.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { createChoice } from '/shell/choice.mjs';
  import { createWaveShape } from '/shell/synth-view.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createBoard } from '/shell/board.mjs';
  import { BOARD_SITE, boardPort } from '/shell/graph-registry.mjs';

  const d = mount({ name: 'concept sampler 030', what: '', index: '/concepts/', indexLabel: 'concepts',
    // The lag cells under the title and the log alone at the foot, asked
    // 2026-10-11: *"move readout to top of page below title in 030 and 035"*.
    joined: false,
    readout: { 'key to sound': 'ms', 'round trip': 'ms', cushion: 'ms', path: '' } });
  conceptNav('sampler/030');

  const q = new URLSearchParams(location.search);
  const ROOM = q.get('room') || 'studio-1';
  let mode = q.get('path') === 'direct' ? 'direct' : 'relay';
  // 10 ms frames on the direct path: at 20 ms /away/ ratcheted its cushion to
  // 96 ms (plan-away-webrtc.md section 9 P3). ?frame=20 and ?cushion= for measuring.
  const DIRECT_FRAME_MS = q.get('frame') === '20' ? 20 : 10;
  const MAY_PLAY = !SELFCHECK || q.get('board') === '1';
  /** Program 0 is the piano and 1 the Rhodes, on the board as in 010. */
  const INSTRUMENTS = [{ id: 'piano', name: 'Piano', program: 0 }, { id: 'rhodes', name: 'Rhodes', program: 1 }];

  // ── the bay: this page's nodes and the ports the Pi announces ───────────
  const S = 'web', CF = 'cf-r2';
  const id = (n, p) => `${S}:${n}:${p}`;
  const SAMPLER_IN = boardPort('sampler', 'midi-in'), SAMPLER_AUDIO = boardPort('sampler', 'audio-out'),
        SAMPLER_FILES = boardPort('sampler', 'file-in');
  const bay = createBay();
  bay.addNode({ id: `${S}:keys`, kind: 'person', label: 'keyboard', place: 'browser' });
  bay.addNode({ id: `${S}:patch`, kind: 'person', label: 'patch', place: 'browser' });
  bay.addNode({ id: `${BOARD_SITE}:sampler`, kind: 'engine', label: 'sampler on the Pi', place: ROOM });
  bay.addNode({ id: `${CF}:piano`, kind: 'store', label: 'piano samples', place: 'cloudflare', net: 'cloudflare' });
  bay.addNode({ id: `${CF}:rhodes`, kind: 'store', label: 'Rhodes samples', place: 'cloudflare', net: 'cloudflare' });
  bay.addNode({ id: `${S}:scope`, kind: 'screen', label: 'waveform', place: 'browser' });
  bay.addNode({ id: `${S}:speaker`, kind: 'screen', label: 'speakers', place: 'browser' });

  let board = null, armed = false, program = 0, loadingSet = null, loadedAt = 0;
  // What reaches pi-1:sampler:midi-in leaves for the board, and only once armed.
  // A program change picked before play is kept and sent on arming.
  function toSampler(ev) {
    if (ev.cls === 'program') return choose(ev.d1);
    if (!armed || !board) return;
    if (ev.cls === 'note') {
      if (ev.d2 > 0) pressed(ev.d1);
      board.send(ev.d2 > 0
        ? { type: 'note.on', node: 'sampler', note: ev.d1, vel: ev.d2, channel: 0 }
        : { type: 'note.off', node: 'sampler', note: ev.d1, channel: 0 });
    } else if (ev.cls === 'cc') {
      board.send({ type: 'cc', node: 'sampler', ctrl: ev.d1, value: ev.d2, channel: 0 });
    }
  }
  const PORTS = [
    { id: id('keys', 'midi-out'), dir: 'out', medium: 'midi', emits: ['note', 'cc'] },
    { id: id('patch', 'midi-out'), dir: 'out', medium: 'midi', emits: ['program'] },
    { id: SAMPLER_IN, dir: 'in', medium: 'midi', accepts: ['note', 'cc', 'program'], deliver: toSampler },
    { id: SAMPLER_FILES, dir: 'in', medium: 'file' },
    { id: SAMPLER_AUDIO, dir: 'out', medium: 'audio' },
    { id: `${CF}:piano:file-out`, dir: 'out', medium: 'file', transports: ['https'] },
    { id: `${CF}:rhodes:file-out`, dir: 'out', medium: 'file', transports: ['https'] },
    { id: id('scope', 'audio-in'), dir: 'in', medium: 'audio' },
    { id: id('speaker', 'audio-in'), dir: 'in', medium: 'audio' },
  ];
  for (const p of PORTS) bay.addPort({ label: p.id.split(':').slice(1).join(':'), ...p });
  const LINKS = [
    [id('keys', 'midi-out'), SAMPLER_IN],
    [id('patch', 'midi-out'), SAMPLER_IN],
    [`${CF}:piano:file-out`, SAMPLER_FILES],
    [`${CF}:rhodes:file-out`, SAMPLER_FILES],
    [SAMPLER_AUDIO, id('scope', 'audio-in')],
    [SAMPLER_AUDIO, id('speaker', 'audio-in')],
  ];
  for (const [from, to] of LINKS) {
    const r = bay.link(from, to);
    if (!r.ok) d.log(`${from} -> ${to} refused: ${r.why}`, 'warn');
  }

  // ── the scope: an analyser on the board's playout, drawn full width ──────
  const WINDOW = 512, FULL = 0.25;
  const wave = createWaveShape({ reason: null, colour: '--hi', height: 120, name: '' });
  let analyser = null, buf = null, level = 0;
  function frame() {
    if (analyser) {
      analyser.getFloatTimeDomainData(buf);
      let i0 = 0, hi = 0;
      for (let i = 1; i < buf.length - WINDOW; i++) if (buf[i - 1] < 0 && buf[i] >= 0) { i0 = i; break; }
      for (const v of buf) { const a = v < 0 ? -v : v; if (a > hi) hi = a; }
      level = hi;
      const win = buf.subarray(i0, i0 + WINDOW);
      wave.set({ points: Array.from(win, (v) => Math.max(-1, Math.min(1, v / FULL))), reason: '', name: '' });
    }
    requestAnimationFrame(frame);
  }

  // ── the lags: what came back, against when the key went down ────────────
  // Asked 2026-10-11: *"add scrope to 030 samper with lags etc"*, and the scope
  // taken out again the same day (*"rm lag scope"*), so the readout cells are
  // what is left. Key to sound is measured
  // per press: the first 1 ms block after the press that is over ONSET and
  // three times what the 30 ms before it held, on the speaker's clock
  // (`getOutputTimestamp`, so the browser's own output latency is inside it).
  // The other cells are the parts this page can name: the Pi's round trip, the
  // playout cushion, the browser's output latency, and the path. What is left
  // over is the Pi's capture block and frame (JACK 512 x 3 at 48 kHz, 20 ms
  // frames), which the page cannot see on its own.
  const KEEP_MS = 200, ONSET = 0.02, WAIT_MS = 1500;
  const env = [];          // { at, peak } per 1 ms block, performance time
  const pending = [];      // presses still waiting for their sound
  const lags = [];         // the last 20 measured lags
  let lastLag = null, readUpTo = 0;
  function pressed(note) {
    const at = performance.now();
    pending.push({ note, at });
    while (pending.length > 8) pending.shift();
  }
  function listen() {
    if (!analyser || !buf) return;
    const ctx = board.ctx();
    const ts = ctx.getOutputTimestamp?.();
    if (!ts || !ts.performanceTime) return;
    analyser.getFloatTimeDomainData(buf);
    const sr = ctx.sampleRate, N = buf.length, blk = Math.round(sr / 1000);
    // the buffer's last sample is the context's current time
    const tEnd = ts.performanceTime + (ctx.currentTime - ts.contextTime) * 1000;
    const t0 = tEnd - (N / sr) * 1000;
    for (let i = 0; i + blk <= N; i += blk) {
      const at = t0 + (i / sr) * 1000;
      if (at <= readUpTo) continue;
      let pk = 0;
      for (let j = i; j < i + blk; j++) { const a = buf[j] < 0 ? -buf[j] : buf[j]; if (a > pk) pk = a; }
      env.push({ at, peak: pk });
      readUpTo = at;
      // an onset: over ONSET and three times the 30 ms before it
      let before = 0;
      for (let k = env.length - 31; k < env.length - 1; k++) if (k >= 0 && env[k].peak > before) before = env[k].peak;
      if (pk > ONSET && pk > before * 3) {
        const p = pending.find((x) => x.at < at);
        if (p) {
          pending.splice(pending.indexOf(p), 1);
          lastLag = at - p.at;
          lags.push(lastLag); if (lags.length > 20) lags.shift();
        }
      }
    }
    const now = performance.now();
    while (env.length && env[0].at < now - KEEP_MS) env.shift();
    for (let k = pending.length - 1; k >= 0; k--) if (now - pending[k].at > WAIT_MS) pending.splice(k, 1);
  }
  // Four cells, asked 2026-10-11: *"reduce readouts 30 35 to 4 items. keep
  // relevant ones"*.
  const cell = (k, v) => d.set(k, v);
  function lagCells() {
    const st = board?.stats();
    cell('key to sound', lastLag == null ? '' : Math.round(lastLag));
    cell('round trip', st?.rttMs == null ? '' : Math.round(st.rttMs));
    cell('cushion', st?.bufferedMs == null ? '' : Math.round(st.bufferedMs));
    cell('path', st?.via ?? '');
  }
  function lagFrame() {
    listen();
    requestAnimationFrame(lagFrame);
  }
  setInterval(() => { if (board) lagCells(); }, 250);

  // ── the patch selector, its own node ─────────────────────────────────────
  // A pick is one program change leaving patch:midi-out. The cell shows what
  // the Pi says it is playing, so it changes when the change arrives there.
  let patchAt = 0;
  const pick = (i) => { patchAt = i; bay.send(id('patch', 'midi-out'), { cls: 'program', ch: 1, d1: INSTRUMENTS[i].program }); };
  const step = (by) => pick((patchAt + by + INSTRUMENTS.length) % INSTRUMENTS.length);
  const patchPick = createPicker({ what: 'patch', cls: 'cc-patch', prev: () => step(-1), next: () => step(+1), onPick: (i) => pick(i) });
  patchPick.options(INSTRUMENTS.map((x) => x.name), 0);

  async function choose(p) {
    const ins = INSTRUMENTS.find((x) => x.program === p);
    if (!ins) return;
    program = p;
    if (!armed || !board) { patchPick.show(ins.name, INSTRUMENTS.indexOf(ins)); return; }
    loadingSet = ins.id;
    pb?.refresh?.();
    const slow = setTimeout(() => say(`The ${ins.name} is coming onto the Pi's SD card from R2 for the first time, which takes about half a minute`), 2500);
    const r = await board.ask({ type: 'voice.select', node: 'sampler', program: p }, 'voice.selected', 120000);
    clearTimeout(slow);
    loadingSet = null; loadedAt = performance.now();
    if (!r?.ok) { say(`The Pi did not change to the ${ins.name}${r?.reason ? `, it said ${r.reason}` : ''}`, 'warn'); return; }
    patchPick.show(ins.name, INSTRUMENTS.indexOf(ins));
    say(`The ${ins.name} on the Raspberry Pi, ${r.load?.loaded ?? 0} recordings in`);
  }

  // ── the keyboard, and a plugged in one through the same node ─────────────
  const host = el('div');
  const send = (note, vel) => bay.send(id('keys', 'midi-out'), { cls: 'note', ch: 1, d1: note, d2: vel });
  const kb = createKeyboard(host, {
    ...keyRange(21), base: 48,
    onDown: (note, how) => { if (how !== 'midi') send(note, 100); },
    onUp: (note, how) => { if (how !== 'midi') send(note, 0); },
  });
  let midiOpen = false;
  function openMidi() {
    if (midiOpen) return;
    midiOpen = true;
    createMidi({
      log: (line, kind) => d.log(line, kind),
      onDown: (n, vel) => { kb.lightNote?.(n, true); send(n, vel); },
      onUp: (n) => { kb.lightNote?.(n, false); send(n, 0); },
      onControl: (c, v) => { if (c === 64) bay.send(id('keys', 'midi-out'), { cls: 'cc', ch: 1, d1: c, d2: v }); },
    });
  }

  // ── play: join the board and raise the sampler beside whatever is up ─────
  let saidLast = '';
  const say = (text, kind) => { saidLast = text; d.log(text, kind); };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  let opened = null, starting = false, lastStatus = null;

  // 🔴 THE LINKS SAY WHICH WIRE CARRIES THEM, and the patchbay draws that
  // (asked on 035: *"webrtc shuld be link"*). When the board's path changes,
  // every link between this page and the Pi is made again with `via`:
  // `datachannel` while direct (or through TURN), `relay` otherwise. The R2
  // file links are not the board's wire.
  let wiredVia = null;
  function rewire(path) {
    const via = path === 'direct' || path === 'turn' ? 'datachannel' : 'relay';
    if (via === wiredVia) return;
    wiredVia = via;
    for (const l of bay.links()) {
      const pi = l.from.startsWith(`${BOARD_SITE}:`) || l.to.startsWith(`${BOARD_SITE}:`);
      if (!pi || l.from.startsWith(`${CF}:`)) continue;
      bay.unlink(l.id);
      const r = bay.link(l.from, l.to, l.transforms || [], { via });
      if (!r.ok) d.log(`${l.from} -> ${l.to} via ${via} refused: ${r.why}`, 'warn');
    }
    pb?.refresh?.();
  }

  function makeBoard() {
    let open;
    opened = new Promise((r) => { open = r; });
    const direct = mode === 'direct'
      ? { cushionMs: 80, maxCushionMs: 250, direct: true, directCushionMs: Number(q.get('cushion')) || 40 }
      : { cushionMs: 160, maxCushionMs: 400 };
    board = createBoard({
      room: ROOM, of: 'Raspberry Pi', showName: false, ...direct,
      log: (line, kind) => d.log(line, kind),
      onOpen: () => open(true),
    });
  }

  async function start() {
    if (starting) return;
    starting = true;
    try {
      if (!board) makeBoard();
      say(`Reaching ${ROOM}`);
      const up = await Promise.race([opened, wait(8000).then(() => false)]);
      if (!up) { say(`The relay did not open ${ROOM} within eight seconds, so nothing is playing`, 'warn'); return; }
      await board.startAudio();
      const pl = board.playout();
      if (pl && !analyser) {
        analyser = board.ctx().createAnalyser();
        analyser.fftSize = 2048;
        buf = new Float32Array(analyser.fftSize);
        pl.connect(analyser);
        if (!looping) { looping = true; requestAnimationFrame(frame); requestAnimationFrame(lagFrame); }
      }
      if (!MAY_PLAY) { say('A check is running, so nothing was sent to the shared board. Add ?board=1 to let it through', 'warn'); return; }
      let st = await board.ask({ type: 'audio.status' }, 'audio.started', 6000);
      lastStatus = st;
      if (!st) { say(`The Raspberry Pi is not answering in ${ROOM}, so the keys go nowhere`, 'warn'); return; }
      if (!st.sampler) { say('The Pi runs board code from before the sampler, so there is nothing to play', 'warn'); return; }
      if (!st.sampler.ok) {
        say('Starting the sampler on the Pi, a few seconds');
        const r = await board.ask({ type: 'audio.start', source: 'sampler' }, 'audio.started', 60000);
        if (!r?.ok) { say(`The Pi could not start the sampler${r?.reason ? `, it said ${r.reason}` : ''}`, 'bad'); return; }
      }
      if (mode === 'direct') {
        // The direct path before the first note, so the keys never start on
        // the relay and switch mid phrase. It falls back to the relay after 3 s.
        say('Opening a direct path to the Pi');
        // `direct` sweeps while it is connecting, and the choice moves to
        // `relay` when it falls back. Asked 2026-10-12, on a screenshot with
        // direct lit and the path reading relay: show direct as connecting
        // until it is up, light relay if it falls back.
        pathChoice.pending(1);
        let path;
        try { path = await board.goDirect({ frameMs: DIRECT_FRAME_MS }); } finally { pathChoice.pending(null); }
        rewire(path);
        if (path === 'relay') fellBack();
        say(path === 'direct' ? 'Direct to the Pi, the relay only carries presence now'
          : path === 'turn' ? 'Direct to the Pi through a TURN server, so not on one network'
          : 'No direct path, so the relay carries everything', path === 'relay' ? 'warn' : undefined);
      } else rewire('relay');
      armed = true;
      board.watchRtt(2000);
      openMidi();
      transport.setIcon('play', 'stop', 'stop');
      // The sampler on the Pi keeps its program between visitors, so ask for
      // the one this page shows rather than assuming the piano.
      await choose(program);
      const beside = st.ok && st.source ? `, and ${st.source === 'yoshimi' ? 'Yoshimi' : st.source} is playing there too, both heard together` : '';
      say(`${INSTRUMENTS[program].name} on the Raspberry Pi, play the keys${beside}`);
    } finally { starting = false; }
  }
  function stop() {
    if (armed && board) board.send({ type: 'note.panic', node: 'sampler' });
    armed = false;
    board?.watchRtt(0);
    kb.panic?.();
    transport.setIcon('play', 'play', 'play');
    say('Stopped, every note of this sampler on the Pi was released');
  }

  // Relay or direct. A change while playing stops, makes a new board for the
  // new mode (its own socket, cushion and playout) and plays again.
  let looping = false;
  async function setMode(m) {
    if (m === mode) return;
    mode = m;
    const u = new URL(location.href);
    if (m === 'direct') u.searchParams.set('path', 'direct'); else u.searchParams.delete('path');
    history.replaceState(null, '', u);
    const was = armed;
    if (armed) stop();
    if (board) { board.close(); board = null; analyser = null; buf = null; }
    d.log(`mode: ${m}`);
    if (was) await start();
  }
  // The choice shows the path in use, not only the one asked for.
  function fellBack() {
    mode = 'relay';
    pathChoice.set(0, true);
    const u = new URL(location.href);
    u.searchParams.delete('path');
    history.replaceState(null, '', u);
  }
  const pathChoice = createChoice({ label: 'path', options: [['relay', 'relay'], ['direct', 'direct']],
    at: mode === 'direct' ? 1 : 0, onPick: (v) => setMode(v) });

  const transport = createButtonGroup({ buttons: [
    { id: 'play', icon: 'play', label: 'play', onPress: () => (armed ? stop() : start()) },
  ] });

  // ── the patchbay ────────────────────────────────────────────────────────
  // A file wire is lit while the Pi is loading that set and 600 ms after; the
  // audio wire while the scope hears something; MIDI while armed.
  const flowing = (l, medium) => {
    if (medium === 'file') {
      const set = l.from.split(':')[1];
      return loadingSet === set || (set === INSTRUMENTS[program].id && loadedAt && performance.now() - loadedAt < 600);
    }
    if (l.from === SAMPLER_AUDIO) return armed && level > 0.002;
    return armed;
  };
  const pb = createPatchbay(bay, { room: ROOM, flowing });
  setInterval(() => {
    if (board && armed) {
      const via = board.stats().via;
      rewire(via);
      if (mode === 'direct' && via === 'relay') { d.log('the direct path dropped, the relay carries everything now', 'warn'); fellBack(); }
    }
    pb.refresh?.();
  }, 500);

  const top = el('div', 'cc-top');
  top.append(transport.el, pathChoice.el);
  d.stack.add(top, wave.el, patchPick.el, host, pb.el);
  window.__demo.bay = bay;
  // What this page hears from the Pi, for a driver: the scope's level, the
  // board's counters (frames, lost, peak) and the last status. Reads only.
  window.__demo.probe = () => ({ armed, level, program, said: saidLast, status: lastStatus,
    stats: board ? board.stats() : null, lags: [...lags] });
  d.ready();
</script>
