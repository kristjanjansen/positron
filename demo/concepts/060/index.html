<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON concept 060</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* Start and stop on their own row at the left, the camera picker after them
     once there is more than one camera. A flex row blockifies the group, so it
     sits on no text line; on a phone the picker wraps under it. */
  .cc-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .cc-top > .pos-bgroup { flex: none; width: auto; }
  .cc-top > .pos-pick[hidden] { display: none; }
  /* The picture is asked for at half the content width on a desk, at the left
     (asked 2026-10-10, *"use 1/2 videoframe"*), and takes the full width on a
     phone, where half would be a thumbnail. */
  .cc-half { width: 50%; }
  @media (max-width: 560px) { .cc-half { width: 100%; } }
  .cc-half canvas { display: block; width: 100%; height: 100%; }
  .cc-say { font-size: 12px; color: var(--dim); }
  /* A footer line never wraps: one line, cut at the slot's edge. */
  .pos-vp-foot .cc-say { white-space: nowrap; overflow: hidden; }
</style>
<script type="module">
  import { conceptNav } from '/concepts/nav.mjs';
  import { mount, el, armVideo } from '/shell/shell.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { drawCamera, FRAME_W, FRAME_H } from '/shell/pattern.mjs';

  // The local camera half of /cam/, as a patchbay: the camera is a node with a
  // video-out, the picture on this page is a node with a video-in, and the
  // picture shows the camera only while the bay holds that link.
  //
  // NOTHING OPENS ON A VISIT, and nothing ever leaves this machine. The camera
  // is asked for on the start press, so the permission prompt comes after it;
  // stop ends every track. No WHIP, no relay, no Stream.
  const S = 'web';
  const CAM = `${S}:camera:video-out`, SCREEN = `${S}:screen:video-in`;

  const d = mount({ name: 'concept 060', what: '', readout: null, index: '/concepts/', indexLabel: 'concepts' });
  conceptNav('060');

  // ── the bay ─────────────────────────────────────────────────────────────
  const bay = createBay();
  const camNode = (label) => bay.addNode({ id: `${S}:camera`, kind: 'device', label, place: 'browser' });
  camNode('camera');
  bay.addNode({ id: `${S}:screen`, kind: 'screen', label: 'picture', place: 'browser' });
  bay.addPort({ id: CAM, label: 'camera', dir: 'out', medium: 'video', transports: ['page'] });
  bay.addPort({ id: SCREEN, label: 'picture', dir: 'in', medium: 'video' });

  const held = new Map();          // "from to" -> link id
  function hold(a, b) {
    const k = `${a} ${b}`;
    if (held.has(k)) return true;
    bay.seen(a); bay.seen(b);
    const r = bay.link(a, b, [], { site: S });
    if (r.ok) { held.set(k, r.id); return true; }
    d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
    return false;
  }
  const holds = (a, b) => held.has(`${a} ${b}`);
  // Held from load, so the picture of the patch is the same running or not.
  // Holding a link opens nothing; the camera waits for the press.
  hold(CAM, SCREEN);

  // ── the camera ──────────────────────────────────────────────────────────
  const video = el('video');
  video.muted = true; video.playsInline = true; video.autoplay = true;
  let cam = null, gen = 0, lastFrame = 0, raf = 0;
  let devices = [], deviceId = null;

  // A frame arrived: what lights the video wire.
  function watchFrames() {
    if (typeof video.requestVideoFrameCallback !== 'function') return;
    const tick = () => { if (!cam) return; lastFrame = performance.now(); video.requestVideoFrameCallback(tick); };
    video.requestVideoFrameCallback(tick);
  }
  const flowing = () => !!cam && performance.now() - lastFrame < 500;

  // ── the picture ─────────────────────────────────────────────────────────
  // The camera drawn by the test picture's own `drawCamera`, contained rather
  // than covered (a phone camera can come back portrait), with no scrim,
  // because nothing is drawn on top of it here.
  const canvas = el('canvas');
  canvas.width = FRAME_W; canvas.height = FRAME_H;
  const ctx = canvas.getContext('2d', { alpha: false });
  // Empty until the camera is on, so no placeholder name sits in the footer.
  const name = el('span', 'cc-say', '');
  const size = el('span', 'cc-say', '');
  // The name at the left, the resolution at the right beside the panel's own
  // full-screen button (asked 2026-10-10, *"no wrapping for footer. is id
  // needed? move rest to right ... add fullscreenbutton"*).
  const panel = createVideoPanel({ media: canvas, left: name });
  panel.el.querySelector('.pos-vp-r').prepend(size);
  panel.el.classList.add('cc-half');

  // The picture follows the link, as /concepts/030/'s sound does: without
  // camera -> picture held the panel shows nothing.
  // An empty picture is the page's own ground, the dither's dark, not black
  // (asked 2026-10-10, *"keep same bg color initially"*).
  const GROUND = '#0b0e14';
  function route() {
    const on = !!cam && holds(CAM, SCREEN);
    if (on) drawCamera(ctx, video, FRAME_W, FRAME_H, { scrim: 0 });
    else { ctx.fillStyle = GROUND; ctx.fillRect(0, 0, FRAME_W, FRAME_H); }
  }
  function frame() { route(); if (cam) raf = requestAnimationFrame(frame); }
  route();

  const pb = createPatchbay(bay, { flowing: (l) => l.from === CAM && holds(CAM, SCREEN) && flowing() });

  // ── start and stop ──────────────────────────────────────────────────────
  async function start() {
    const mine = ++gen;
    armVideo(video);   // before any await, or iOS refuses later
    let s;
    try {
      s = await navigator.mediaDevices.getUserMedia({
        video: { ...(deviceId ? { deviceId: { exact: deviceId } } : {}),
          width: { ideal: FRAME_W }, height: { ideal: FRAME_H }, frameRate: { ideal: 30 } },
        audio: false,
      });
    } catch (e) {
      const why = e?.name === 'NotAllowedError' ? 'the camera was refused'
        : e?.name === 'NotFoundError' ? 'this machine has no camera'
        : `the camera did not start (${e?.name || e})`;
      d.log(why, 'bad');
      face(false);
      return;
    }
    if (gen !== mine) { s.getTracks().forEach((t) => t.stop()); return; }
    cam = s;
    const track = cam.getVideoTracks()[0];
    const set = track.getSettings();
    deviceId = set.deviceId || deviceId;
    video.srcObject = cam;
    video.play().catch(() => {});
    // A camera's label ends in its USB ids, `(2C0E:82E3)`, which name nothing a reader needs.
    const label = (track.label || '').replace(/\s*\([0-9a-f]{4}:[0-9a-f]{4}\)\s*$/i, '');
    name.textContent = label;
    size.textContent = set.width && set.height ? `${set.width}x${set.height}` : '';
    camNode(label || 'camera');
    d.log(`camera on: ${track.label || 'default'} at ${set.width}x${set.height}`, 'hi');
    watchFrames();
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(frame);
    pb.refresh();
    face(true);
    await listCameras();
  }

  function stop() {
    gen++;
    cam?.getTracks().forEach((t) => t.stop());
    cam = null;
    cancelAnimationFrame(raf);
    try { video.pause(); } catch { /* fine */ }
    video.srcObject = null;
    size.textContent = '';
    route();
    pb.refresh();
    face(false);
    d.log('camera off, every track stopped');
  }

  // ── which camera, once there is more than one ───────────────────────────
  // Device labels are empty until the camera has been allowed, so the list is
  // read after the first start and never on a visit.
  const picker = createPicker({ what: 'camera',
    prev: () => pick((at() - 1 + devices.length) % devices.length),
    next: () => pick((at() + 1) % devices.length),
    onPick: (i) => pick(i) });
  picker.el.hidden = true;
  const at = () => Math.max(0, devices.findIndex((x) => x.deviceId === deviceId));
  async function listCameras() {
    try {
      devices = (await navigator.mediaDevices.enumerateDevices()).filter((x) => x.kind === 'videoinput');
    } catch { devices = []; }
    picker.options(devices.map((x, i) => x.label || `camera ${i + 1}`));
    picker.show(at());
    picker.el.hidden = devices.length < 2;
  }
  async function pick(i) {
    const dev = devices[i];
    if (!dev || dev.deviceId === deviceId) return;
    deviceId = dev.deviceId;
    picker.show(i);
    if (cam) { stop(); await start(); }
  }

  const transport = createButtonGroup({ buttons: [
    { id: 'cam', icon: 'video', label: 'start the camera', onPress: () => (cam ? stop() : start()) },
  ] });
  // The group itself disables the button while a press's promise runs, so a
  // second press cannot start a second camera while the prompt is up.
  function face(on) {
    transport.setIcon('cam', on ? 'stop' : 'video', on ? 'stop the camera' : 'start the camera');
  }

  const top = el('div', 'cc-top');
  top.append(transport.el, picker.el);
  d.stack.add(top, panel.el, pb.el);
  d.ready();
</script>
