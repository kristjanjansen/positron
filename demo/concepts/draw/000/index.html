<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON concept 016</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* No page rules: the transport bar and its strip are one glued surface, and
     the scope, pad, knob row and patchbay stack at the shell's gap. */
</style>
<script type="module">
  import { conceptNav } from '/concepts/nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createKnob } from '/shell/knob.mjs';
  import { createKnobGrid } from '/shell/knob-grid.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createStripView } from '/shell/strip.mjs';
  import { createGlue } from '/shell/glue.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { createWaveShape } from '/shell/synth-view.mjs';
  import { createXyPad } from '/shell/xy-pad.mjs';
  import { createSynth, KNOBS, PATCH, expo } from './modules.mjs';

  // /concepts/synth/040/'s synth as one fixed patch, with an XY pad that plays the
  // filter. The pad is a bay node, `web:xy`, cabled to `web:filter:value-in`,
  // so every move is a `{ of: 'param' }` event through the bay and the cable
  // pulses with it.
  //
  // THE NOTES ARE A LOOPING LINE, NOT A KEYBOARD. Asked 2026-10-12: *"Rm
  // keyboard use autoplay on xy"*. Both hands go to the pad: Play starts an
  // eight note bass line in A on a loop, Stop ends it, and the pad shapes the
  // filter while it runs. The line is /concepts/synth/110/'s arrangement, a kit
  // deck (`createDeck`) playing note ons and offs out of `web:line:midi-out`,
  // and the kit transport bar glued to a strip that draws each note, with LOOP
  // fixed on over the whole line. Each note is let go before the next, so every
  // one strikes the envelope again and the filter has an attack to shape.
  //
  // A SEEK STARTS WHAT IS SOUNDING THERE (110's chase): the deck folds the line
  // up to the new position and the page makes the held note match it.
  //
  // NOTHING OPENS ON A VISIT. The AudioContext is made on the first play press;
  // moving the pad or a knob before that only changes the synth's state.
  const d = mount({ name: 'concept draw 000', what: '', readout: null, index: '/concepts/', indexLabel: 'concepts' });
  conceptNav('draw/000');

  const synth = createSynth({ log: (m, lv) => d.log(m, lv) });
  const { bay } = synth;
  const ID = synth.id;

  // ── the line: eight eighth notes at 120 bpm, each held 180 ms ───────────
  // A2 A2 A3 A2 C3 A2 G2 E2, low so the saw has overtones for the filter to take.
  const SEQ = [45, 45, 57, 45, 48, 45, 43, 40];
  const STEP = 250, HOLD = 180, LAP = SEQ.length * STEP;
  const NOTES = SEQ.map((n, i) => ({ n, at: i * STEP, end: i * STEP + HOLD }));
  /** The pitch held at `pos` inside one lap, if any. */
  const heldAt = (pos) => NOTES.filter((x) => x.at <= pos && pos < x.end).map((x) => x.n);

  // ── one waveform, the output, as on /concepts/synth/040/ ────────────────────────
  const WINDOW = 512, FULL = 0.5;
  const wave = createWaveShape({ reason: null, colour: '--hi', height: 120, name: '' });

  // ── the pad: x is cutoff, y is resonance ─────────────────────────────────
  // The pad's axes are positions, 0 to 1, and the page maps them, because
  // cutoff wants an exponential scale and the pad's axes are linear. y runs 1
  // at the top to 0 at the bottom, so resonance grows upward.
  // WebAudio's lowpass Q is in dB: 0 is no peak, 18 is a whistle.
  const CUT = expo(60, 8000), QMAX = 18;
  // Resolved here, above the pad: the pad paints once as it is made, and a
  // canvas font cannot read a CSS variable.
  const MONO = getComputedStyle(document.documentElement).getPropertyValue('--mono').trim() || 'monospace';
  let padMoves = 0;
  const pad = createXyPad(el('div'), {
    label: 'filter',
    x: { label: 'cutoff', min: 0, max: 1 },
    y: { label: 'resonance', min: 1, max: 0 },
    onInput: (x, y) => {
      padMoves++;
      bay.send(ID('xy', 'value-out'), { of: 'param', name: 'cutoff', v: CUT.to(x) });
      bay.send(ID('xy', 'value-out'), { of: 'param', name: 'q', v: y * QMAX });
    },
    // The mark is where the filter is now, so it sits still between gestures.
    value: () => ({ x: CUT.from(synth.P.filter.cutoff), y: synth.P.filter.q / QMAX }),
    // The pad is the kit's (/draw/'s), 2x2 grid included; the axis names and
    // their ends are drawn here, through its overlay hook, in its own dim ink.
    overlay: (c, view) => labels(c, view),
  });
  function labels(c, { W, H, colors }) {
    c.save();
    c.fillStyle = colors.dim;
    // The pad draws in its own pixels and is shown at whatever width it has,
    // so the type is sized from that width: 13 px on screen, the knob values' size.
    const k = W / (c.canvas.clientWidth || W);
    c.font = `${13 * k}px ${MONO}`;
    const I = 10 * k;
    c.textBaseline = 'bottom';
    c.textAlign = 'left'; c.fillText('60 Hz', I, H - I);
    c.textAlign = 'center'; c.fillText('cutoff', W / 2, H - I);
    c.textAlign = 'right'; c.fillText('8 kHz', W - I, H - I);
    c.textBaseline = 'top';
    c.textAlign = 'left'; c.fillText('resonance', I, I);
    c.restore();
  }

  // ── the knobs: one node each, `web:knob-<name>`, a turn is one event ─────
  const knobs = new Map(KNOBS.map((k) => [k.name, createKnob({
    label: k.name, min: k.min, max: k.max, step: k.step, value: k.raw, format: k.format, hand: true,
    onInput: (r) => bay.send(ID(`knob-${k.name}`, 'value-out'), { of: 'param', name: k.name, v: k.value(r) }),
  })]));
  const grid = createKnobGrid(knobs, { row: true });

  // ── the sound, made on the first play ───────────────────────────────────
  let ctx = null;
  function wake() {
    if (!ctx) { ctx = new AudioContext(); synth.start(ctx); synth.sound(true); requestAnimationFrame(frame); }
    ctx.resume();
  }

  // ── the line: a kit deck plays it out of web:line:midi-out ──────────────
  const sounding = new Set();   // pitches the line has on right now
  let quiet = true;             // true unless the deck is rolling with sound up
  let ons = 0, offs = 0;
  function emit(n, on) {
    if (on === sounding.has(n)) return;
    if (on) { sounding.add(n); ons++; } else { sounding.delete(n); offs++; }
    bay.send(ID('line', 'midi-out'), { cls: 'note', ch: 1, d1: n, d2: on ? 100 : 0 });
  }
  /** THE CHASE: make what sounds equal what is held, touching nothing else. */
  function chase(want) {
    const w = new Set(quiet ? [] : want);
    for (const n of [...sounding]) if (!w.has(n)) emit(n, false);
    for (const n of w) if (!sounding.has(n)) emit(n, true);
  }
  const adapter = {
    caps: { rates: [1], continuous: false },
    actuate(pl) { if (!quiet) emit(pl.n, pl.on); },
    reduce(_prefix, pos) { return { pos, held: heldAt(pos) }; },
    assertState(state) { chase(state?.held || []); return state; },
  };
  const items = NOTES.flatMap((x, i) => [
    { at: x.at, kind: 'note', id: `on${i}`, payload: { n: x.n, on: true } },
    { at: x.end, kind: 'note', id: `off${i}`, payload: { n: x.n, on: false } },
  ]);
  const deck = createDeck({ items, adapters: { note: adapter }, range: [0, LAP] });

  let arming = false;
  function play() {
    if (arming) return;
    wake();
    quiet = false;
    chase(heldAt(deck.position()));
    deck.play();
    pb.refresh?.();
  }
  function stop() {
    deck.pause();
    quiet = true;
    chase([]);
    pb.refresh?.();
  }
  const glue = el('div');
  const bar = createTransportBar(glue, deck, { scrub: false, command: { play, pause: stop } });

  // ── the strip: one row, the line's notes as spans ───────────────────────
  const NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const nameOf = (n) => `${NAMES[n % 12]}${Math.floor(n / 12) - 1}`;
  const strip = createStripView(glue, deck, { size: 'auto', follow: false, gutter: 96, lanes: [{
    id: 'line', kind: 'note', label: 'line', height: 30, as: 'spans', stack: false, terse: true,
    rows: () => NOTES.map((x, i) => ({ at: x.at, id: `n${i}`, kind: 'note', payload: { n: x.n, durMs: HOLD } })),
    describeRow: (r) => [nameOf(r.payload.n), `${r.payload.durMs} ms`],
    labelOf: (sp) => nameOf(sp.row.payload.n),
  }] });
  const surface = createGlue(bar.el, strip.surface);
  // The whole lap in view once the strip has a width (typist/040's reason).
  let fitW = 0;
  new ResizeObserver(() => {
    const w = strip.el.clientWidth;
    if (w && w !== fitW) { fitW = w; strip.strip.fit(0, LAP); }
  }).observe(strip.el);
  // LOOP ON FROM THE START, through the bar's own button, as on
  // /concepts/synth/110/: a mark at 0 and a mark at the end. The bar starts the
  // deck on the first mark, so `arming` swallows that play; nothing sounds on load.
  arming = true;
  try {
    deck.seek(0); bar.api.pressLoop();
    deck.seek(LAP); bar.api.pressLoop();
  } finally { arming = false; }
  deck.seek(0);
  // The loop is fixed and read only, as on 110.
  const loopBtn = bar.el.querySelector('.tbar-loop');
  loopBtn.disabled = true;
  loopBtn.title = 'the loop is fixed to the whole line';
  loopBtn.setAttribute('aria-label', 'looping the whole line, fixed');

  function frame() {
    const buf = synth.sounding() ? synth.read() : null;
    if (buf) {
      let i0 = 0;
      for (let i = 1; i < buf.length - WINDOW; i++) if (buf[i - 1] < 0 && buf[i] >= 0) { i0 = i; break; }
      const win = buf.subarray(i0, i0 + WINDOW);
      wave.set({ points: Array.from(win, (v) => Math.max(-1, Math.min(1, v / FULL))), reason: '', name: '' });
    } else wave.set({ points: null, reason: null, name: '' });
    requestAnimationFrame(frame);
  }

  // ── the patchbay ─────────────────────────────────────────────────────────
  const pb = createPatchbay(bay, { flowing: () => synth.sounding() });
  setInterval(() => pb.refresh?.(), 500);

  // Linear, as every concept synth: the line, scope, pad, the knob row, then
  // the patchbay, as blocks in the shell's stack at the shell's gap.
  d.stack.add(surface, wave.el, pad.el, grid.el, pb.el);

  // The one patch.
  const bad = synth.load(PATCH);
  for (const b of bad) d.log(`${b.line} refused: ${b.why}`, 'warn');
  pb.refresh();
  window.__demo.synth = synth;
  window.__demo.pad = pad;
  window.__demo.knobs = grid;
  window.__demo.line = {
    deck, bar, play, stop, notes: NOTES, lap: LAP, heldAt,
    playing: () => deck.playing(), ctx: () => ctx, sounding: () => [...sounding],
    counts: () => ({ ons, offs, padMoves }),
  };
  d.ready();
</script>
