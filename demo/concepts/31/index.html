<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON concept 31</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .cc-stack { display: flex; flex-direction: column; gap: 12px; }
  /* Two pictures side by side, each half the content width; one under the other on a phone. As /concepts/14/. */
  .cc-pair { display: flex; gap: 12px; align-items: flex-start; }
  .cc-pair > * { flex: 1 1 0; min-width: 0; }
  /* In a column a 0 basis is a 0 height, so on a phone each panel takes its own height. */
  @media (max-width: 560px) { .cc-pair { flex-direction: column; align-items: stretch; } .cc-pair > * { flex: none; } }
  .cc-say { font-size: 12px; color: var(--dim); }
  /* The kit's live wave (grain-scope) as a panel's picture: the panel's stage is the
     edge and the ground, so the scope gives up its own margin, border and corner
     through the kit's tokens, and its always-empty caption takes no room. The stage
     is as tall as the scope rather than 16:9 (`aspect: 'auto'`). */
  .cc-wave .pos-scope { margin: 0; --edge: 0px; --r: 0px; }
  .cc-wave .pos-scope-gut { display: none; }
  /* Play and the crossfader, centred under the two panels. The slider takes the
     row between its two named ends, as /grains/ draws its blend. */
  /* A slider row: an end label, the slider, an end label, at the full width.
     Both label columns take the width of the longest end label on the page,
     `--end` in ch of the labels' own mono face, so every slider starts and
     ends at the same x (asked 2026-10-10, *"label area w's on slider left and
     right the longest one"*). */
  .cc-fade { display: grid; grid-template-columns: var(--end, 6ch) minmax(0, 1fr) var(--end, 6ch);
    align-items: center; gap: 14px; width: 100%; font: 400 12px/1 var(--mono); }
  .cc-fade .cc-end { color: var(--dim); white-space: nowrap; }
  /* Play on its own row: the button's own size, at the left. */
  .cc-stack > .pos-bgroup { align-self: flex-start; width: auto; }
  .cc-fade .cc-end:first-child { text-align: right; }
  .cc-fade > .sld { min-width: 0; }
  .cc-fade > .sld > .sld-lane { width: auto; flex: 1 1 auto; }
  .cc-fade > .sld > .sld-head:not(:has(.sld-l:not(:empty))) { display: none; }
</style>
<script type="module">
  import { conceptNav } from '/concepts/nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createGrainScope } from '/shell/grain-scope.mjs';
  import { createSlider } from '/shell/slider.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createMp3Stream } from '/shell/mp3-stream.mjs';

  // Concept 30 plus one node: a very basic granulator in this tab, fed from the
  // crossfader, playing into the speakers beside the dry sound. It outputs a
  // wave (its audio, drawn in a third panel) and events (one per grain, along a
  // `value` link into that panel's wave node, which draws each one as a tick).
  //
  // A simple radio as a patchbay: one ERR station and one Ida station, each an
  // external site, into a crossfader in this tab, into the speakers. The streams
  // come through positron's own relay (`shout`), which holds ONE upstream
  // connection per mount, exactly as /radio/ reaches them. `?base=` points the
  // page at demo/fake-station.mjs instead.
  //
  // NOTHING OPENS ON A VISIT. No AudioContext and no fetch to either station
  // until somebody presses play. The patch is held from load so the picture
  // does not change with play; an `external` node refuses a link out of it
  // without `consent: true`, so the page names it where the link is made.
  const BASE = new URLSearchParams(location.search).get('base') || 'https://shout.positron.studio';
  const S = 'web';
  const STATIONS = [
    { key: 'err', site: 'err', node: 'vikerraadio', mount: 'vikerraadio', name: 'ERR Vikerraadio', label: 'Vikerraadio', kbps: 128 },
    { key: 'ida', site: 'ida', node: 'tallinn', mount: 'ida-tallinn', name: 'Ida Tallinn', label: 'Ida Radio Tallinn', kbps: 320 },
  ];
  const outOf = (st) => `${st.site}:${st.node}:audio-out`;
  // The relay is a hop of its own: it holds the one connection to the station
  // and every tab reads the relay, so the station's link ends there.
  const relayIn = (st) => `shout:${st.mount}:audio-in`, relayOut = (st) => `shout:${st.mount}:audio-out`;
  // Each station's wave is its own node, fed from the relay before the fader.
  const waveIn = (st) => `${S}:wave-${st.key}:audio-in`;
  const FADER_IN = `${S}:fader:audio-in`, FADER_OUT = `${S}:fader:audio-out`, SPEAKER_IN = `${S}:speaker:audio-in`;
  // The granulator and its own wave. One out port feeds two links (relay to
  // fader and relay to wave already do in 30), so the fader's out feeds both the
  // speakers and the granulator, and the granulator's out feeds the speakers and
  // its wave. Two links into the speakers' one in-port sum there.
  const GRAN_IN = `${S}:gran:audio-in`, GRAN_OUT = `${S}:gran:audio-out`, GRAN_EV = `${S}:gran:value-out`;
  const GWAVE_IN = `${S}:wave-gran:audio-in`, GWAVE_EV = `${S}:wave-gran:value-in`;

  // ── the bay ─────────────────────────────────────────────────────────────
  const bay = createBay();
  for (const st of STATIONS) {
    bay.addNode({ id: `${st.site}:${st.node}`, kind: 'external', label: st.label, place: st.site, net: st.site });
    bay.addPort({ id: outOf(st), label: st.label, dir: 'out', medium: 'audio', transports: ['https'] });
    bay.addNode({ id: `shout:${st.mount}`, kind: 'endpoint', label: 'relay', place: 'shout' });
    bay.addPort({ id: relayIn(st), label: 'relay', dir: 'in', medium: 'audio', transports: ['https'] });
    bay.addPort({ id: relayOut(st), label: 'relay', dir: 'out', medium: 'audio', transports: ['https'],
      address: `${BASE}/${st.mount}` });
    bay.addNode({ id: `${S}:wave-${st.key}`, kind: 'screen', label: `${st.key === 'err' ? 'ERR' : 'Ida'} wave`, place: 'browser' });
    bay.addPort({ id: waveIn(st), label: 'wave', dir: 'in', medium: 'audio' });
  }
  bay.addNode({ id: `${S}:fader`, kind: 'engine', label: 'crossfader', place: 'browser' });
  bay.addNode({ id: `${S}:speaker`, kind: 'screen', label: 'speakers', place: 'browser' });
  bay.addPort({ id: FADER_IN, label: 'crossfader', dir: 'in', medium: 'audio' });
  bay.addPort({ id: FADER_OUT, label: 'crossfader', dir: 'out', medium: 'audio' });
  bay.addPort({ id: SPEAKER_IN, label: 'speakers', dir: 'in', medium: 'audio' });
  bay.addNode({ id: `${S}:gran`, kind: 'engine', label: 'granulator', place: 'browser' });
  bay.addPort({ id: GRAN_IN, label: 'granulator', dir: 'in', medium: 'audio' });
  bay.addPort({ id: GRAN_OUT, label: 'granulator', dir: 'out', medium: 'audio' });
  bay.addPort({ id: GRAN_EV, label: 'grains', dir: 'out', medium: 'value' });
  bay.addNode({ id: `${S}:wave-gran`, kind: 'screen', label: 'granulator wave', place: 'browser' });
  bay.addPort({ id: GWAVE_IN, label: 'wave', dir: 'in', medium: 'audio' });
  // The only way a grain reaches the picture: a delivered event on this port.
  // The engine never calls the scope.
  bay.addPort({ id: GWAVE_EV, label: 'grain ticks', dir: 'in', medium: 'value',
    deliver: (ev) => gscope?.mark({ pos: 1, level: ev.level }) });

  const d = mount({ name: 'concept 31', what: '', readout: null, index: '/concepts/', indexLabel: 'concepts' });
  conceptNav(31);

  // ── the sound: two streams, two gains, one AudioContext ──────────────────
  let ctx = null, sum = null, pull = null, dryG = null, wetG = null;
  // The granulator's state, up here because the patchbay asks `flowing` as soon as it is built.
  const RING_S = 3;
  const DENSITY = 28;              // grains a second; at 80 to 400 ms that is about seven at once
  const SPRAY = 0.06;              // how far either side of `where` a grain may read, as a share of the ring
  const REVERSED = 0.25;           // the share of grains played backwards
  const SEMIS = [7, 12, -12];      // the other pitches a grain can take; 0 is the rest
  let gran = null, grains = 0, timer = 0;
  // The owner's settings, asked as *"keep this. onlu show wet"*, the mix at
  // grains. Dry / wet works like opacity (*"on dry fade out frains"*): toward
  // dry the grains fade out, in the speakers and in their panel alike.
  let where = 0.22, spread = 0.19, mix = 1, frozen = false;   // 0 oldest, 1 newest; 0 plain, 1 every grain moved; 0 dry, 1 grains
  const legs = new Map();          // key -> { stream, gain, tap, buf, live }
  let x = 0.5;                     // 0 is all ERR, 1 is all Ida
  const gains = () => [Math.cos(x * Math.PI / 2), Math.sin(x * Math.PI / 2)];   // equal power
  function applyFade() {
    if (!ctx) return;
    const t = ctx.currentTime, g = gains();
    STATIONS.forEach((st, i) => legs.get(st.key)?.gain.gain.setTargetAtTime(g[i], t, 0.02));
  }

  // ── the links ───────────────────────────────────────────────────────────
  const held = new Map();          // "from to" -> link id
  function hold(a, b, opts) {
    const k = `${a} ${b}`;
    if (held.has(k)) return true;
    bay.seen(a); bay.seen(b);
    const r = bay.link(a, b, [], { site: S, ...opts });
    if (r.ok) { held.set(k, r.id); return true; }
    d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
    return false;
  }

  hold(FADER_OUT, SPEAKER_IN);
  hold(FADER_OUT, GRAN_IN);
  hold(GRAN_OUT, SPEAKER_IN);
  hold(GRAN_OUT, GWAVE_IN);
  hold(GRAN_EV, GWAVE_EV);
  // The whole patch is held from load, so the picture is the same playing or
  // stopped. Holding a link opens nothing: the streams open only on play,
  // which is the press where a person asks to listen, so the station link is
  // made with that consent named here rather than at the press.
  for (const st of STATIONS) {
    hold(outOf(st), relayIn(st), { consent: true, via: 'https' });
    hold(relayOut(st), FADER_IN, { via: 'https' });
    hold(relayOut(st), waveIn(st), { via: 'https' });
  }

  const pb = createPatchbay(bay, {
    flowing: (l) => {
      if (l.from === FADER_OUT) return [...legs.values()].some((g) => g.live);
      if (l.from === GRAN_OUT) return grains > 0 && [...legs.values()].some((g) => g.live);
      const st = STATIONS.find((s) => outOf(s) === l.from || relayOut(s) === l.from);
      return !!(st && legs.get(st.key)?.live);
    },
  });

  // ── the pictures: the kit's live wave in a video panel per station ───────
  const scopes = new Map();
  const panels = STATIONS.map((st) => {
    const host = el('div', 'cc-wave');
    const scope = createGrainScope(host, { seconds: 4, height: 150, fullScale: 1 });
    scopes.set(st.key, scope);
    return createVideoPanel({ media: host, aspect: 'auto', right: false, left: el('span', 'cc-say', st.name),
      centre: el('span', 'cc-say', `${st.kbps} kbit/s`) });
  });
  const pair = el('div', 'cc-pair');
  pair.append(...panels.map((p) => p.el));

  // The granulator's output, under the pair. Its axis is arrival time, the
  // last four seconds of what the granulator played, so a grain's tick goes at
  // the moment it fired, which is where its sound starts on this wave. That is
  // `pos: 1` on a `grainSeconds` scope: `bornAt - (1 - pos) * grainSeconds` is
  // then `bornAt`. The grain's READ position is a place in the granulator's
  // input buffer, which is not this wave, so it travels in the event and is not
  // drawn here (grain-scope's own header on why the two axes must not be mixed).
  // A tick fades in 1.2 s: at 28 grains a second a longer fade drew a wall of ticks over the wave.
  const ghost = el('div', 'cc-wave');
  const gscope = createGrainScope(ghost, { seconds: 4, height: 150, fullScale: 1, grainSeconds: 4, fadeMs: 1200 });
  const gpanel = createVideoPanel({ media: ghost, aspect: 'auto', right: false, left: el('span', 'cc-say', 'granulator'),
    centre: el('span', 'cc-say', 'output and grains') });

  // The sound follows the links the bay holds, as on /concepts/11/: a station
  // reaches the fader only along relay -> fader, its wave only along relay ->
  // wave, and the fader the speakers only along fader -> speaker. Unlink one
  // and that edge goes quiet.
  const holds = (a, b) => held.has(`${a} ${b}`);
  function route() {
    if (!ctx) return;
    for (const st of STATIONS) {
      const g = legs.get(st.key);
      if (!g) continue;
      try { g.tap.disconnect(); } catch { /* not connected */ }
      g.tap.connect(pull);
      if (holds(relayOut(st), FADER_IN)) g.tap.connect(g.gain);
      g.wave = holds(relayOut(st), waveIn(st));
    }
    // The dry / grains mix sits where each link meets the speakers, so the
    // granulator records the dry sound and its wave shows the grains whatever
    // the mix is.
    try { sum.disconnect(); } catch { /* not connected */ }
    sum.connect(dryG);
    try { dryG.disconnect(); } catch { /* not connected */ }
    if (holds(FADER_OUT, SPEAKER_IN)) dryG.connect(ctx.destination);
    if (holds(FADER_OUT, GRAN_IN)) sum.connect(gran.rec);
    try { gran.out.disconnect(); } catch { /* not connected */ }
    gran.out.connect(gran.tap);
    gran.out.connect(wetG);
    try { wetG.disconnect(); } catch { /* not connected */ }
    if (holds(GRAN_OUT, SPEAKER_IN)) wetG.connect(ctx.destination);
    gran.wave = holds(GRAN_OUT, GWAVE_IN);
  }

  function frame() {
    if (!legs.size) return;
    for (const [key, g] of legs) {
      if (!g.live || !g.wave) continue;
      g.tap.getFloatTimeDomainData(g.buf);
      scopes.get(key).feed(g.buf, ctx.sampleRate);
    }
    if (gran?.wave && grains > 0) {
      gran.tap.getFloatTimeDomainData(gran.buf);
      gscope.feed(gran.buf, ctx.sampleRate);
    }
    requestAnimationFrame(frame);
  }

  // ── the granulator: a ring of the last few seconds, and a cloud of long,
  // overlapping grains read out of it. A ScriptProcessor rather than an
  // AudioWorklet because it is one node with no module to load and runs the
  // same in Chrome and Safari; the looper (demo/shell/looper.mjs) keeps its
  // ring the same way. Freeze stops the writing, so the ring holds one moment
  // and `where` walks through it.
  function granBuild() {
    const n = Math.round(RING_S * ctx.sampleRate);
    const g = { ring: new Float32Array(n), w: 0, filled: 0, wave: false };
    g.rec = ctx.createScriptProcessor(4096, 1, 1);
    g.rec.onaudioprocess = (e) => {
      if (frozen) return;
      const x = e.inputBuffer.getChannelData(0);
      for (let i = 0; i < x.length; i++) { g.ring[g.w] = x[i]; g.w = (g.w + 1) % n; }
      g.filled = Math.min(n, g.filled + x.length);
    };
    g.rec.connect(pull);           // a processor nothing pulls never runs
    g.out = ctx.createGain(); g.out.gain.value = 1;
    g.tap = ctx.createAnalyser(); g.tap.fftSize = 2048;
    g.tap.connect(pull);
    g.buf = new Float32Array(g.tap.fftSize);
    return g;
  }
  // Equal power between the dry crossfade and the grains.
  function applyMix() {
    ghost.style.opacity = String(mix);
    if (!ctx) return;
    const t = ctx.currentTime;
    dryG.gain.setTargetAtTime(Math.cos(mix * Math.PI / 2), t, 0.03);
    wetG.gain.setTargetAtTime(Math.sin(mix * Math.PI / 2) * 1.4, t, 0.03);
  }
  // One grain: 80 to 400 ms with a Hann window, read around `where` with a
  // little spray, sometimes backwards, sometimes a fifth or an octave away,
  // somewhere across the stereo field. Its event leaves by the bay.
  function grain() {
    const g = gran, sr = ctx.sampleRate, n = g.ring.length;
    if (!holds(FADER_OUT, GRAN_IN)) return;
    const dur = 0.08 + Math.random() * 0.32;
    const semis = Math.random() < spread ? SEMIS[Math.floor(Math.random() * SEMIS.length)] : 0;
    const rate = 2 ** ((semis + (Math.random() - 0.5) * 0.12) / 12);   // and a few cents either way, which is the chorus
    const len = Math.max(2, Math.round(dur * rate * sr));               // a grain up an octave reads twice the sound
    const rev = Math.random() < REVERSED;
    const pos = Math.min(1, Math.max(0, where + (Math.random() * 2 - 1) * SPRAY));   // 0 oldest, 1 newest
    const ago = (1 - pos) * (RING_S - len / sr) + len / sr;             // seconds before the write head, inside the ring
    if (g.filled < ago * sr) return;
    const buf = ctx.createBuffer(1, len, sr), d0 = buf.getChannelData(0);
    let at = (g.w - Math.round(ago * sr) + n) % n, peak = 0;
    for (let i = 0; i < len; i++) {
      const v = g.ring[at] * 0.5 * (1 - Math.cos(2 * Math.PI * i / (len - 1)));
      d0[rev ? len - 1 - i : i] = v; if (Math.abs(v) > peak) peak = Math.abs(v);
      at = (at + 1) % n;
    }
    const src = ctx.createBufferSource(), amp = ctx.createGain(), pan = ctx.createStereoPanner();
    src.buffer = buf; src.playbackRate.value = rate;
    amp.gain.value = 0.42;         // about seven overlap, so each is quieter than the dry sound
    pan.pan.value = (Math.random() * 2 - 1) * 0.8;
    src.connect(amp).connect(pan).connect(g.out);
    src.start();
    src.onended = () => { try { pan.disconnect(); } catch { /* gone */ } };
    grains++;
    bay.send(GRAN_EV, { of: 'grain', pos, dur, semis, rev, pan: pan.pan.value, level: Math.min(1, peak * 3) });
  }
  function granLoop() {
    if (!playing) return;
    grain();
    timer = setTimeout(granLoop, (1000 / DENSITY) * (0.5 + Math.random()));
  }

  // ── play and stop ───────────────────────────────────────────────────────
  let playing = false;
  function play() {
    ctx ??= new AudioContext();
    ctx.resume();
    if (!sum) {
      sum = ctx.createGain();
      // A silent sink that keeps every tap pulled, so a wave reads its station
      // whether or not that station reaches the fader.
      pull = ctx.createGain(); pull.gain.value = 0; pull.connect(ctx.destination);
      gran = granBuild();
      dryG = ctx.createGain(); wetG = ctx.createGain();
    }
    playing = true;
    for (const st of STATIONS) {
      // The press is the person asking to listen, so the link carries consent.
      // The relay fetches the station; the page reads the relay, into the
      // fader and into the station's own wave.
      if (!hold(outOf(st), relayIn(st), { consent: true, via: 'https' })) continue;
      hold(relayOut(st), FADER_IN, { via: 'https' });
      hold(relayOut(st), waveIn(st), { via: 'https' });
      const gain = ctx.createGain(), tap = ctx.createAnalyser();
      tap.fftSize = 2048;
      const stream = createMp3Stream(ctx, { url: `${BASE}/${st.mount}`, log: (m) => d.log(`${st.label}: ${m}`) });
      // Through the tap, not beside it: an analyser nothing pulls from reads
      // silence, so the sound passes it on its way to the fader, as on /radio/.
      // The tap -> gain -> fader edge is made by route(), from the bay's links.
      stream.node.connect(tap);
      gain.connect(sum);
      const leg = { stream, gain, tap, buf: new Float32Array(tap.fftSize), live: false };
      legs.set(st.key, leg);
      stream.started.then((path) => {
        if (legs.get(st.key) !== leg) return;
        leg.live = true;
        d.log(`${st.label} playing, ${path}`);
      }).catch((e) => d.log(`${st.label} did not start: ${e?.message || e}`, 'warn'));
    }
    applyFade();
    applyMix();
    route();
    pb.refresh();
    face();
    requestAnimationFrame(frame);
    clearTimeout(timer);
    granLoop();
  }
  function stop() {
    playing = false;
    clearTimeout(timer);
    for (const st of STATIONS) {
      const g = legs.get(st.key);
      if (g) { try { g.stream.stop(); } catch { /* already stopped */ } try { g.gain.disconnect(); } catch { /* gone */ } }
    }
    legs.clear();
    pb.refresh();
    face();
  }

  const transport = createButtonGroup({ buttons: [
    { id: 'play', icon: 'play', label: 'play', onPress: () => (playing ? stop() : play()) },
  ] });
  function face() {
    transport.setIcon('play', playing ? 'stop' : 'play', playing ? 'stop' : 'play');
  }
  face();

  const fader = createSlider({ label: '', aria: 'crossfade', min: 0, max: 1, step: 0.01, value: x,
    onInput: (v) => { x = v; applyFade(); } });
  const fade = el('div', 'cc-fade');
  fade.append(el('span', 'cc-end', 'ERR'), fader.el, el('span', 'cc-end', 'Ida'));

  // One control under the granulator: dry / wet. Where it reads and how far
  // the pitch spreads stay at the owner's settings, and freeze is gone for now
  // (*"no older, plain, freeze controls for now"*).
  const mixS = createSlider({ label: '', aria: 'dry or grains', min: 0, max: 1, step: 0.01, value: mix,
    onInput: (v) => { mix = v; applyMix(); } });
  const mixRow = el('div', 'cc-fade');
  mixRow.append(el('span', 'cc-end', 'dry'), mixS.el, el('span', 'cc-end', 'grains'));

  const out = el('div', 'cc-stack');
  // Play on its own row, top left under the title.
  out.append(transport.el, pair, fade, gpanel.el, mixRow, pb.el);
  // Both label columns of every slider row take the longest end label's width.
  const ends = [...out.querySelectorAll('.cc-fade .cc-end')].map((e) => e.textContent.length);
  out.style.setProperty('--end', `${Math.max(...ends)}ch`);

  d.el.append(out);
  d.ready();
</script>
