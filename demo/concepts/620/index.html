<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON concept 620</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* Start and stop on their own row at the left, the camera picker after them
     once there is more than one camera. A flex row blockifies the group, so it
     sits on no text line; on a phone the picker wraps under it. */
  .cc-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .cc-top > .pos-bgroup { flex: none; width: auto; }
  .cc-top > .pos-pick[hidden] { display: none; }
  /* The camera as it is on the left, the same camera after the round trip on
     the right, each half the content width, as /concepts/610/. On a phone they
     stack, the original first. */
  .cc-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 560px) { .cc-pair { grid-template-columns: minmax(0, 1fr); } }
  .cc-pair canvas { display: block; width: 100%; height: 100%; }
  .cc-say { font-size: 12px; color: var(--dim); }
  /* A footer line never wraps: one line, cut at the slot's edge. */
  .pos-vp-foot .cc-say { white-space: nowrap; overflow: hidden; }
</style>
<script type="module">
  import { conceptNav } from '/concepts/nav.mjs';
  import { mount, el, armVideo } from '/shell/shell.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { drawCamera, FRAME_W, FRAME_H } from '/shell/pattern.mjs';

  // /concepts/600/ with a WebRTC round trip beside it. The camera feeds two
  // pictures: the original, camera -> screen, and a loopback, camera -> peer a
  // -> peer b -> loopback. Peer a and peer b are two RTCPeerConnections in THIS
  // tab. The offer, the answer and every ICE candidate are handed from one to
  // the other in JavaScript: no signalling server, no STUN, no TURN, and
  // nothing leaves the machine. What the right panel shows has been encoded,
  // packetised, sent over UDP on this machine, received, decoded and drawn.
  //
  // 🔴 TWO PEERS IN ONE TAB AND A VPN. MEASURED 2026-10-05 (demo/verify.mjs,
  // PEER_IN_PAGE): with no capture permission Chrome gathers ONE host
  // candidate, on the interface that routes to the internet. With the Check
  // Point VPN up that is `utun4`, UDP sent to it never comes back to this
  // machine, and the two peers sit in `checking` for good. Capture permission
  // makes Chrome list every interface (127.0.0.1, en0, the bridges), and the
  // loopback connects in about 100 ms. This page asks for the camera before it
  // builds either peer, so the grant is already there when ICE gathers.
  //
  // NOTHING OPENS ON A VISIT. The camera and both peers are made on the start
  // press; stop closes both connections and ends every track.
  const S = 'web';
  const CAM = `${S}:camera:video-out`, SCREEN = `${S}:screen:video-in`;
  const PA_IN = `${S}:peer-a:video-in`, PA_OUT = `${S}:peer-a:video-out`;
  const PB_IN = `${S}:peer-b:video-in`, PB_OUT = `${S}:peer-b:video-out`;
  const LOOP = `${S}:loopback:video-in`;

  const d = mount({ name: 'concept 620', what: '', readout: null, index: '/concepts/', indexLabel: 'concepts' });
  conceptNav('620');

  // ── the bay ─────────────────────────────────────────────────────────────
  // ⚠️ THE PEER A TO PEER B LINK CARRIES NO `via`, AND THAT IS THE BAY'S
  // ANSWER RATHER THAN AN OMISSION. Its transports are webaudio, datachannel,
  // relay, moq, llhls, page, whep, relay-h264, indexeddb, ingest, r2-hls,
  // room, https and whip: there is no `webrtc` or `peer`, and `via: 'whep'` or
  // `via: 'datachannel'` between two ports of one site is refused as "out over
  // a wire and back to where it started". So the link rides `page`, which is
  // true of where it goes even though it does go through a real RTP stack.
  const bay = createBay();
  const camNode = (label) => bay.addNode({ id: `${S}:camera`, kind: 'device', label, place: 'browser' });
  camNode('camera');
  bay.addNode({ id: `${S}:screen`, kind: 'screen', label: 'original', place: 'browser' });
  bay.addNode({ id: `${S}:peer-a`, kind: 'engine', label: 'peer a, sends', place: 'browser' });
  bay.addNode({ id: `${S}:peer-b`, kind: 'engine', label: 'peer b, receives', place: 'browser' });
  bay.addNode({ id: `${S}:loopback`, kind: 'screen', label: 'loopback', place: 'browser' });
  bay.addPort({ id: CAM, label: 'camera', dir: 'out', medium: 'video', transports: ['page'] });
  bay.addPort({ id: SCREEN, label: 'original', dir: 'in', medium: 'video' });
  bay.addPort({ id: PA_IN, label: 'peer-a:video-in', dir: 'in', medium: 'video' });
  bay.addPort({ id: PA_OUT, label: 'peer-a:video-out', dir: 'out', medium: 'video', transports: ['page'] });
  bay.addPort({ id: PB_IN, label: 'peer-b:video-in', dir: 'in', medium: 'video' });
  bay.addPort({ id: PB_OUT, label: 'peer-b:video-out', dir: 'out', medium: 'video', transports: ['page'] });
  bay.addPort({ id: LOOP, label: 'loopback', dir: 'in', medium: 'video' });

  const held = new Map();          // "from to" -> link id
  function hold(a, b) {
    const k = `${a} ${b}`;
    if (held.has(k)) return true;
    bay.seen(a); bay.seen(b);
    const r = bay.link(a, b, [], { site: S });
    if (r.ok) { held.set(k, r.id); return true; }
    d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
    return false;
  }
  const holds = (a, b) => held.has(`${a} ${b}`);
  // Held from load, so the picture of the patch is the same running or not.
  // Holding a link opens nothing; the camera and the peers wait for the press.
  hold(CAM, SCREEN);
  hold(CAM, PA_IN);
  hold(PA_OUT, PB_IN);
  hold(PB_OUT, LOOP);

  // ── the camera, and the picture that comes back ─────────────────────────
  const video = el('video');
  video.muted = true; video.playsInline = true; video.autoplay = true;
  const back = el('video');
  back.muted = true; back.playsInline = true; back.autoplay = true;
  let cam = null, gen = 0, raf = 0;
  let devices = [], deviceId = null;
  let pcA = null, pcB = null, statsTimer = 0;
  // When the last frame was presented, per video element: what lights a video wire.
  const last = new Map([[video, 0], [back, 0]]);
  function watchFrames(v) {
    if (typeof v.requestVideoFrameCallback !== 'function') return;
    const tick = () => { if (!cam) return; last.set(v, performance.now()); v.requestVideoFrameCallback(tick); };
    v.requestVideoFrameCallback(tick);
  }
  const fresh = (v) => !!cam && performance.now() - last.get(v) < 500;

  // ── the two pictures ────────────────────────────────────────────────────
  // Both drawn by the test picture's own `drawCamera`, contained, no scrim,
  // so the only difference between them is the round trip.
  const GROUND = '#0b0e14';
  function canvasPanel() {
    const c = el('canvas');
    c.width = FRAME_W; c.height = FRAME_H;
    const ctx = c.getContext('2d', { alpha: false });
    return { c, ctx };
  }
  const L = canvasPanel(), R = canvasPanel();
  // Footers as on /concepts/600/: one line, empty until on, the name at the
  // left and the value at the right beside the full-screen button.
  const name = el('span', 'cc-say', '');
  const size = el('span', 'cc-say', '');
  const panel = createVideoPanel({ media: L.c, left: name });
  panel.el.querySelector('.pos-vp-r').prepend(size);
  // The loopback's footer is what getStats() measured, each cell empty until
  // it has been read, so the row is not there until the first number lands.
  // ⚠️ FOUR CELLS, BECAUSE FOUR IS WHAT FITS ONE LINE OF A HALF PANEL AT
  // 1280. Measured with six: the rtt was cut at the panel's edge and the
  // dropped count was off screen. The codec is logged once when it is first
  // read, and the codec with the decoded and dropped counts is the row's hover.
  const loopPanel = createVideoPanel({ media: R.c, left: null, values: [
    { key: 'size', label: '', reserve: 7 },
    { key: 'fps', label: 'fps', reserve: 2 },
    { key: 'rate', label: 'kbit/s', reserve: 4 },
    { key: 'rtt', label: 'rtt', reserve: 4 },
  ] });
  const V = loopPanel.values;
  const pair = el('div', 'cc-pair');
  pair.append(panel.el, loopPanel.el);

  // The routing follows the links: without camera -> original the left panel
  // is the ground; without peer b -> loopback the right one is, whatever
  // arrives; without camera -> peer a nothing is sent at all (see start).
  function paint(p, v, on) {
    if (on && v.readyState >= 2 && v.videoWidth > 0) drawCamera(p.ctx, v, FRAME_W, FRAME_H, { scrim: 0 });
    else { p.ctx.fillStyle = GROUND; p.ctx.fillRect(0, 0, FRAME_W, FRAME_H); }
  }
  function render() {
    paint(L, video, !!cam && holds(CAM, SCREEN));
    paint(R, back, !!cam && holds(PB_OUT, LOOP));
  }
  function frame() { render(); if (cam) raf = requestAnimationFrame(frame); }
  render();

  // ── what getStats() says, about once a second ───────────────────────────
  const stat = { state: 'new', ice: 'new', bytes: 0, at: 0, arriving: false };
  async function readStats() {
    const p = pcB;
    if (!p) return;
    const stats = await p.getStats().catch(() => null);
    // Stopped while the reading was in flight: nothing lands in emptied cells.
    if (!stats || p !== pcB) return;
    let vin = null, rtt = null;
    for (const s of stats.values()) {
      if (s.type === 'inbound-rtp' && s.kind === 'video') vin = s;
      if (s.type === 'candidate-pair' && s.state === 'succeeded' && s.nominated !== false
        && Number.isFinite(s.currentRoundTripTime)) rtt = s.currentRoundTripTime * 1000;
    }
    if (rtt != null) V.set('rtt', `${rtt < 1 ? rtt.toFixed(1) : Math.round(rtt)} ms`);
    if (!vin) { stat.arriving = false; return; }
    const now = performance.now();
    const bytes = vin.bytesReceived || 0;
    if (stat.at) {
      const kbps = ((bytes - stat.bytes) * 8) / (now - stat.at);
      stat.arriving = bytes > stat.bytes;
      if (bytes > 0) V.set('rate', Math.round(kbps));
    }
    stat.bytes = bytes; stat.at = now;
    if (vin.frameWidth && vin.frameHeight) V.set('size', `${vin.frameWidth}x${vin.frameHeight}`);
    if (Number.isFinite(vin.framesPerSecond)) V.set('fps', Math.round(vin.framesPerSecond));
    const codec = vin.codecId && stats.get(vin.codecId);
    const cname = codec?.mimeType ? codec.mimeType.replace(/^video\//i, '') : '';
    if (cname && cname !== stat.cname) d.log(`peer b decodes ${cname}`);
    stat.cname = cname;
    if (Number.isFinite(vin.framesDecoded)) {
      V.el.title = `${cname}\n${vin.framesDecoded} frames decoded\n${vin.framesDropped ?? 0} dropped`.trim();
    }
    Object.assign(stat, {
      w: vin.frameWidth, h: vin.frameHeight, fps: vin.framesPerSecond, rtt,
      codec: codec?.mimeType || null, decoded: vin.framesDecoded, dropped: vin.framesDropped,
    });
    pb.refresh();
  }
  const clearStats = () => { for (const k of V.keys()) V.set(k, ''); V.el.title = ''; Object.assign(stat, { bytes: 0, at: 0, arriving: false, cname: '' }); };

  // ── the two peers ───────────────────────────────────────────────────────
  // No iceServers: host candidates only, which is all a loopback needs.
  // A candidate that arrives before the far side has its remote description
  // waits, because addIceCandidate before setRemoteDescription throws.
  function ferry(from, to) {
    const waiting = [];
    from.onicecandidate = (e) => {
      if (!e.candidate) return;
      if (to.remoteDescription) to.addIceCandidate(e.candidate).catch((x) => d.log(`a candidate was refused: ${x?.message || x}`, 'warn'));
      else waiting.push(e.candidate);
    };
    return () => { for (const c of waiting.splice(0)) to.addIceCandidate(c).catch(() => {}); };
  }
  async function connect(mine) {
    const a = new RTCPeerConnection(), b = new RTCPeerConnection();
    pcA = a; pcB = b;
    const flushB = ferry(a, b), flushA = ferry(b, a);
    b.ontrack = (e) => {
      back.srcObject = new MediaStream([e.track]);
      back.play().catch(() => {});
      watchFrames(back);
    };
    b.onconnectionstatechange = () => {
      stat.state = b.connectionState;
      d.log(`peer b ${b.connectionState}`, b.connectionState === 'connected' ? 'hi' : b.connectionState === 'failed' ? 'bad' : '');
      pb.refresh();
    };
    b.oniceconnectionstatechange = () => { stat.ice = b.iceConnectionState; };
    // Camera -> peer a not held: peer a still offers a video it will send,
    // and sends nothing.
    const track = cam.getVideoTracks()[0];
    if (holds(CAM, PA_IN)) a.addTrack(track, cam);
    else a.addTransceiver('video', { direction: 'sendonly' });
    const offer = await a.createOffer();
    await a.setLocalDescription(offer);
    await b.setRemoteDescription(offer);
    flushB();
    const answer = await b.createAnswer();
    await b.setLocalDescription(answer);
    await a.setRemoteDescription(answer);
    flushA();
    if (gen !== mine) return;
    d.log('offer and answer handed across in this tab, no server');
    statsTimer = setInterval(readStats, 1000);
  }

  const lit = (l) => {
    if (l.from === CAM && l.to === SCREEN) return fresh(video);
    if (l.from === CAM && l.to === PA_IN) return fresh(video) && !!pcA && holds(CAM, PA_IN);
    if (l.from === PA_OUT) return stat.state === 'connected' && stat.arriving;
    if (l.from === PB_OUT) return fresh(back) && holds(PB_OUT, LOOP);
    return false;
  };
  const pb = createPatchbay(bay, { flowing: lit });

  // ── start and stop ──────────────────────────────────────────────────────
  async function start() {
    const mine = ++gen;
    armVideo(video); armVideo(back);   // before any await, or iOS refuses later
    let s;
    try {
      s = await navigator.mediaDevices.getUserMedia({
        video: { ...(deviceId ? { deviceId: { exact: deviceId } } : {}),
          width: { ideal: FRAME_W }, height: { ideal: FRAME_H }, frameRate: { ideal: 30 } },
        audio: false,
      });
    } catch (e) {
      const why = e?.name === 'NotAllowedError' ? 'the camera was refused'
        : e?.name === 'NotFoundError' ? 'this machine has no camera'
        : `the camera did not start (${e?.name || e})`;
      d.log(why, 'bad');
      face(false);
      return;
    }
    if (gen !== mine) { s.getTracks().forEach((t) => t.stop()); return; }
    cam = s;
    const track = cam.getVideoTracks()[0];
    const set = track.getSettings();
    deviceId = set.deviceId || deviceId;
    video.srcObject = cam;
    video.play().catch(() => {});
    // A camera's label ends in its USB ids, `(2C0E:82E3)`, which name nothing a reader needs.
    const label = (track.label || '').replace(/\s*\([0-9a-f]{4}:[0-9a-f]{4}\)\s*$/i, '');
    name.textContent = label;
    size.textContent = set.width && set.height ? `${set.width}x${set.height}` : '';
    camNode(label || 'camera');
    d.log(`camera on: ${track.label || 'default'} at ${set.width}x${set.height}`, 'hi');
    watchFrames(video);
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(frame);
    face(true);
    try { await connect(mine); } catch (e) { d.log(`the loopback did not negotiate: ${e?.message || e}`, 'bad'); }
    pb.refresh();
    await listCameras();
  }

  function stop() {
    gen++;
    clearInterval(statsTimer);
    for (const p of [pcA, pcB]) { try { p?.close(); } catch { /* fine */ } }
    pcA = pcB = null;
    stat.state = 'closed'; stat.ice = 'closed';
    for (const v of [video, back]) {
      v.srcObject?.getTracks?.().forEach((t) => t.stop());
      try { v.pause(); } catch { /* fine */ }
      v.srcObject = null;
    }
    cam?.getTracks().forEach((t) => t.stop());
    cam = null;
    cancelAnimationFrame(raf);
    name.textContent = ''; size.textContent = '';
    clearStats();
    render();
    pb.refresh();
    face(false);
    d.log('both connections closed, every track stopped');
  }

  // ── which camera, once there is more than one ───────────────────────────
  // Device labels are empty until the camera has been allowed, so the list is
  // read after the first start and never on a visit.
  const picker = createPicker({ what: 'camera',
    prev: () => pick((at() - 1 + devices.length) % devices.length),
    next: () => pick((at() + 1) % devices.length),
    onPick: (i) => pick(i) });
  picker.el.hidden = true;
  const at = () => Math.max(0, devices.findIndex((x) => x.deviceId === deviceId));
  async function listCameras() {
    try {
      devices = (await navigator.mediaDevices.enumerateDevices()).filter((x) => x.kind === 'videoinput');
    } catch { devices = []; }
    picker.options(devices.map((x, i) => x.label || `camera ${i + 1}`));
    picker.show(at());
    picker.el.hidden = devices.length < 2;
  }
  async function pick(i) {
    const dev = devices[i];
    if (!dev || dev.deviceId === deviceId) return;
    deviceId = dev.deviceId;
    picker.show(i);
    if (cam) { stop(); await start(); }
  }

  const transport = createButtonGroup({ buttons: [
    { id: 'cam', icon: 'video', label: 'start the camera', onPress: () => (cam ? stop() : start()) },
  ] });
  // The group itself disables the button while a press's promise runs, so a
  // second press cannot start a second camera while the prompt is up.
  function face(on) {
    transport.setIcon('cam', on ? 'stop' : 'video', on ? 'stop the camera' : 'start the camera');
  }

  const top = el('div', 'cc-top');
  top.append(transport.el, picker.el);
  d.stack.add(top, pair, pb.el);
  window.__demo.loopback = { stat, values: () => Object.fromEntries(V.keys().map((k) => [k, V.cell(k).textContent])) };
  d.ready();
</script>
