<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON concept 21</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .cc-stack { display: flex; flex-direction: column; gap: 12px; }
  .cc-h { margin: 0; font-size: 14px; color: var(--dim); font-weight: 500; }
  .cc-var { display: flex; flex-direction: column; gap: 12px; }
  .cc-ex + .cc-ex { margin-top: 20px; }
  .cc-sec { margin-top: 40px; }
  .cc-h a { color: inherit; }
  .cc-lines { font-family: var(--mono); font-size: 12px; color: var(--fg2); white-space: pre; overflow-x: auto; }
  /* The same medium colours as /concepts/1/. */
  :root {
    --md-midi: #6fb8e8; --md-audio: #ee9a4d; --md-clock: #c9ced6; --md-value: #9ad16b;
    --md-video: #e07a5f; --md-program: #c39af0; --md-file: #d68fc6; --md-state: #8a9fc4;
  }
  .md-midi { color: var(--md-midi); } .md-audio { color: var(--md-audio); }
  .md-clock { color: var(--md-clock); } .md-value { color: var(--md-value); }
  .md-video { color: var(--md-video); } .md-program { color: var(--md-program); }
  .md-file { color: var(--md-file); } .md-state { color: var(--md-state); }
</style>
<script type="module">
  import { conceptNav } from '/concepts/nav.mjs';
  import { CONCEPTS } from '/concepts/list.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { MEDIA } from '/shell/bay.mjs';
  import { createBayView, BAY_VIEW_CSS } from '/concepts/20/bay-view.mjs';
  import { createPortInk } from '/concepts/20/port-ink.mjs';
  import { createBayTraffic } from '/concepts/20/bay-traffic.mjs';

  // One calm way to show a wire is alive, on every kind of link the concepts
  // use, with stand-in traffic shaped like the real thing. Light shading
  // travels out to in along a thin wire. On an event medium each event sends
  // one short soft pulse along it; on a stream medium a long gradient keeps
  // moving while it flows and fades when it stops. Nothing here is a real bay:
  // each picture is fed a bay-shaped object built from a list of links, drawn
  // by the /concepts/20/ renderer: every link the concept pages hold (1 holds
  // none, 13 holds the same as 12).
  // Clock is 48 ticks a second, so it is drawn as the stream it looks like.
  // The links each concept page holds, with `web` for the tab's own site.
  const CHAT = [['web:chat:value-out', '*:chat:value-in'], ['*:chat:value-out', 'web:chat:value-in']];
  const ADMIN = [['web:admin:value-out', '*:notice:value-in'], ['*:admin:value-out', 'web:notice:value-in']];
  const KEYS = ['web:keys:midi-out', 'web:synth:midi-in'], SOUND = ['web:synth:audio-out', 'web:speaker:audio-in'];
  const EXAMPLES = [
    { n: 2, links: [['web:webgl:program-out', 'studio-1:gpu:program-in'], ['studio-1:gpu:video-out', 'web:right:video-in'],
      ['web:webgl:video-out', 'web:left:video-in']] },
    { n: 3, links: CHAT },
    { n: 4, links: [...CHAT, ['web:chat:value-out', 'cf-store:history:value-in'], ['cf-store:history:value-out', 'web:chat:value-in']] },
    { n: 5, links: [...CHAT, ...ADMIN] },
    { n: 6, links: [...CHAT, ...ADMIN, ['web:broadcast:value-out', '*:screen:value-in'], ['*:broadcast:value-out', 'web:screen:value-in'],
      ['web:camera:video-out', 'cf-stream:live:video-in'], ['cf-stream:live:video-out', 'web:screen:video-in']] },
    { n: 10, links: [KEYS, SOUND] },
    { n: 11, links: [KEYS, [...KEYS, 'transpose +12'], [...KEYS, 'transpose -12'],
      ['web:synth:audio-out', 'web:fx:audio-in'], ['web:fx:audio-out', 'web:speaker:audio-in']] },
    { n: 12, links: [KEYS, ['web:keys:midi-out', 'web:rec:midi-in'], ['web:rec:midi-out', 'web:synth:midi-in'], SOUND] },
    { n: 14, links: [[...KEYS, 'only note'], ['web:keys:midi-out', 'web:rec:midi-in', 'only note'], ['web:rec:midi-out', 'web:synth:midi-in'], SOUND,
      ['web:keys:midi-out', 'web:midi:midi-in'], ['web:rec:midi-out', 'web:midi:midi-in'], ['web:midi:value-out', 'web:shader:value-in'],
      ['web:shader:video-out', 'web:screen:video-in'], ['web:keys:midi-out', 'web:pico:midi-in'], ['web:rec:midi-out', 'web:pico:midi-in'],
      ['web:pico:video-out', 'web:oled:video-in']] },
    // Real demos, with the ids they announce today (older names, not <medium>-<dir> yet).
    { slug: 'patchbay', title: 'the desk example', links: [['web:keys:out', 'studio-1:circuit:in', 'channel 1'],
      ['studio-1:circuit:audio', 'web:screen:audio'], ['web:editor:program', 'studio-1:gpu:program'],
      ['studio-1:gpu:video', 'phone:screen:video'], ['studio-1:circuit:audio', 'r2:recordings:in'],
      ['studio-1:circuit:audio', 'phone:screen:audio'], ['err:klassika:audio', 'web:screen:audio']],
      labels: { 'web:screen': 'browser screen', 'phone:screen': 'phone screen' } },
    { slug: 'mirror', links: [['web:webgl:video', 'web:left:video'], ['web:webgl:program', 'studio-1:gpu:program'],
      ['studio-1:gpu:video', 'web:screen:video']], labels: { 'web:screen': 'right pane' } },
    { slug: 'knobs', links: [['knobs:keys:out', 'studio-1:yoshimi:in']] },
    { slug: 'away', links: [['away:keys:out', 'studio-1:circuit:in']] },
    { slug: 'fau', links: [['web:keys:out', 'fau:fau:midi']] },
    { slug: 'nola', links: [['web:keys:out', 'nola:nola:midi']] },
    { slug: 'wish', title: 'two links the model wrote', links: [['here:mk-425c-usb-midi-keyboard:out', 'here:circuit:in', 'transpose +1'],
      ['here:model-12-midi-in:out', 'here:circuit:in', 'channel 1']] },
  ];
  // A port's medium is the word before -in or -out; the chat, history, notice
  // and admin ports carry text, which is the value medium.
  // A port's medium is the word before -in or -out, or the whole name on the
  // older ports the demos still announce (`circuit:audio`, `gpu:program`),
  // where a bare `in` or `out` is MIDI.
  const mediumOf = (id) => {
    const name = id.split(':')[2], m = name.split('-');
    if (MEDIA.includes(name)) return name;
    if (m.length > 1 && MEDIA.includes(m[0])) return m[0];
    return name === 'in' || name === 'out' ? 'midi' : 'value';
  };
  const nodeOf = (id) => id.split(':').slice(0, 2).join(':');
  // What each node is, in a few words, drawn grey at a box's top right.
  const INFO = {
    keys: 'on-screen keyboard', synth: 'saw synth', speaker: 'speakers', fx: 'low-pass filter',
    rec: 'recorder', midi: 'midi state', shader: 'WebGL shader', screen: 'canvas',
    pico: 'emulated Pico', oled: 'Pico OLED, 128x64', chat: 'chat box', admin: 'admin line',
    notice: 'notice bar', broadcast: 'on air switch', camera: 'camera',
    history: 'chat history', live: 'Stream live input', webgl: 'WebGL page', gpu: 'Pi GPU',
    left: 'left pane', right: 'right pane',
    circuit: 'Novation Circuit', yoshimi: 'Yoshimi synth', editor: 'shader editor', recordings: 'R2 recordings',
    klassika: 'Klassikaraadio', fau: 'Faust engine', nola: 'nola engine', 'mk-425c-usb-midi-keyboard': 'MK-425C keyboard',
    'model-12-midi-in': 'Model 12 MIDI IN',
  };
  const nodeInfo = (id, n, labels = {}) => {
    const node = id.split(':')[1];
    if (labels[id]) return { id, label: labels[id] };
    return { id, label: n === 10 && node === 'synth' ? 'sine synth' : n === 6 && node === 'screen' ? 'on air video' : INFO[node] || '' };
  };
  const fakeBay = (pairs, n, labels) => {
    const ports = new Map(), nodes = new Map();
    const links = pairs.map(([from, to, tf], i) => {
      for (const [id, dir] of [[from, 'out'], [to, 'in']]) {
        if (!nodes.has(nodeOf(id))) nodes.set(nodeOf(id), nodeInfo(nodeOf(id), n, labels));
        if (!ports.has(id)) ports.set(id, { id, dir, medium: mediumOf(id) });
      }
      return { id: `l${i}`, from, to, tf };
    });
    return { nodes: () => [...nodes.values()], ports: () => [...ports.values()], links: () => links };
  };
  const line = (l) => `${l.from} -> ${l.to}${l.tf ? ` { ${l.tf} }` : ''}`;
  // Which stand-in drives a link: by medium, with rare text for value and program.
  const sourceKey = (from) => {
    const m = mediumOf(from);
    return from === 'web:midi:value-out' ? 'midi' : m === 'value' || m === 'program' ? 'chat' : m;
  };

  // ── stand-in traffic, one source per row, shaped like the medium ─────────
  // Each source answers events since the last frame and a level 0..1.
  const rnd = (a, b) => a + Math.random() * (b - a);
  function phases(on, off) {            // on for `on` ms, off for `off` ms, repeating
    const len = on + off, t0 = performance.now() - Math.random() * len;
    return (t) => (t - t0) % len < on;
  }
  function source(key) {
    let next = 0, level = 0, value = 0.5;
    if (key === 'midi') {               // a player: notes 150 to 500 ms apart, 4 s on, 2 s off
      const on = phases(4000, 2000);
      return (t) => { let n = 0; if (on(t) && t >= next) { n = 1; next = t + rnd(150, 500); } return { n, level: 0 }; };
    }
    if (key === 'value') {              // a knob being turned: 30 events a second for 1 s, then left
      const on = phases(1000, 2500);
      return (t) => { let n = 0; if (on(t) && t >= next) { n = 1; next = t + 33; value = Math.min(1, Math.max(0, value + rnd(-0.08, 0.08))); } return { n, level: value }; };
    }
    if (key === 'chat') {               // a message every 2.5 to 7 s
      return (t) => { let n = 0; if (t >= next) { if (next) n = 1; next = t + rnd(2500, 7000); } return { n, level: 0 }; };
    }
    if (key === 'clock') {              // 24 ppqn at 120 bpm is 48 ticks a second, 6 s playing, 3 s stopped
      const on = phases(6000, 3000);
      return (t) => { let n = 0; const p = on(t); if (p && t >= next) { n = 1; next = t + 1000 / 48; } return { n, level: p ? 1 : 0, flowing: p }; };
    }
    if (key === 'audio') {              // a synth: each note jumps the level, it decays between them
      const on = phases(4000, 2000); let last = 0;
      return (t) => {
        if (on(t) && t >= next) { level = rnd(0.6, 1); next = t + rnd(150, 500); }
        level *= Math.exp(-(t - last) / 450); last = t;
        return { n: 0, level, flowing: level > 0.03 };
      };
    }
    if (key === 'video') {              // a camera: steady frames, bitrate wanders, 8 s live, 3 s off
      const on = phases(8000, 3000);
      return (t) => { const p = on(t); return { n: 0, level: p ? 0.7 + 0.2 * Math.sin(t / 700) : 0, flowing: p }; };
    }
    if (key === 'file') {               // a recording uploaded every 9 s, the upload takes 2.5 s
      const on = phases(2500, 6500); let was = false;
      return (t) => { const p = on(t), n = p && !was ? 1 : 0; was = p; return { n, level: p ? 1 : 0, flowing: p }; };
    }
  }

  const d = mount({ name: 'concept 21', what: '', readout: null, index: '/concepts/', indexLabel: 'concepts' });
  conceptNav(21);
  document.head.append(Object.assign(document.createElement('style'), { textContent: BAY_VIEW_CSS }));

  const EX = EXAMPLES.map((x) => ({ ...x, bay: fakeBay(x.links, x.n, x.labels) }));
  const all = { ports: () => EX.flatMap((x) => x.bay.ports()) };
  const ink = createPortInk(all, MEDIA);
  const out = el('div', 'cc-stack');
  const life = createBayTraffic();
  // Links leaving the same port in one picture share their stand-in, as a
  // real out port sends one event to every link it has.
  function addWires(view, bay) {
    const srcs = new Map();
    for (const l of bay.links()) {
      const k = `${sourceKey(l.from)}|${l.from}`;
      if (!srcs.has(k)) srcs.set(k, source(sourceKey(l.from)));
      life.add(view, l.id, mediumOf(l.from), srcs.get(k));
    }
  }

  const LABEL = (node) => [{ text: node.label, sans: true }];
  out.append(el('h3', 'cc-h', 'the concepts so far'));
  for (const x of EX) {
    if (x.slug && !x.n && x === EX.find((y) => y.slug)) out.append(el('h3', 'cc-h cc-sec', 'the demos'));
    const c = CONCEPTS.find((c) => c.n === x.n);
    const v = el('div', 'cc-var cc-ex');
    const view = createBayView(x.bay, { detail: LABEL });
    const head = x.slug ? el('h3', 'cc-h') : el('h3', 'cc-h', `${x.n} ${c?.title || ''}`);
    if (x.slug) head.append(el('a', '', `/${x.slug}/`, { href: `/${x.slug}/` }), x.title ? ` ${x.title}` : '');
    v.append(head,
      el('div', 'cc-lines', x.bay.links().map(line).join('\n')), view.el);
    out.append(v);
    addWires(view, x.bay);
  }

  d.el.append(out);
  ink.paint(d.el);

  d.ready();
</script>
