<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON concept 065</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* Start and stop on their own row at the left, the camera picker after them
     once there is more than one camera. A flex row blockifies the group, so it
     sits on no text line; on a phone the picker wraps under it. */
  .cc-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .cc-top > .pos-bgroup { flex: none; width: auto; }
  .cc-top > .pos-pick[hidden] { display: none; }
  /* A 2x2 grid, each cell half the content width as /concepts/video/010/:
     the camera as it leaves the page and the same picture back over WebRTC
     on top, back over LL-HLS and the recordings it left on Stream under them.
     Three a third wide were 219 px each in this 688 px column, where the
     burned clock is 11 px and a footer holds one cell. On a phone they stack,
     the original first. */
  .cc-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 560px) { .cc-pair { grid-template-columns: minmax(0, 1fr); } }
  .cc-pair canvas { display: block; width: 100%; height: 100%; }
  .cc-recs { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .cc-h { margin: 0; font-size: 14px; color: var(--dim); font-weight: 500; }
  .cc-say { font-size: 12px; color: var(--dim); }
  /* A footer line never wraps: one line, cut at the slot's edge. */
  .pos-vp-foot .cc-say { white-space: nowrap; overflow: hidden; }
  /* The word on the picture's plate is read against a picture, so full ink. */
  .pos-vp-tag > .cc-proto { color: var(--fg); }
</style>
<script type="module">
  import { conceptNav } from '/concepts/nav.mjs';
  import { mount, el, armVideo } from '/shell/shell.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { createTable } from '/shell/table.mjs';
  import { drawCamera, burn, readBurnedFrom, FRAME_W, FRAME_H } from '/shell/pattern.mjs';
  import { fetchIceServers, camWhipPublish, camWhep, whepPlay, camPublish, LIVE, CAM_WHIP_PROXY } from '/shell/live.mjs';
  import { createLowLatencyPlayer } from '/src/low-latency-player.js';

  // /concepts/video/000/ with two round trips through Cloudflare beside it. The
  // camera, with a clock burned into it, feeds three pictures: the original as
  // it leaves the page; a WebRTC loopback, camera -> Stream WebRTC input by WHIP
  // -> back by WHEP; and an LL-HLS loopback, camera -> pub.positron.studio/loop
  // (the /stage/ and /cam/ publisher, a container rewrapping the browser's own
  // H.264 to RTMPS) -> a Stream input of its own -> back as LL-HLS through the
  // player /llhls/ uses. The two returned pictures carry the clock row, so each
  // footer reads its glass to glass delay off the frames actually shown.
  // Both publishes go through the worker, so no input key reaches this page.
  //
  // 🔴 EACH PRESS IS REAL CLOUDFLARE STREAM MINUTES, AND AT MOST 20 SECONDS OF
  // THEM ON EACH LEG. Billed by the minute delivered whatever the protocol
  // (positron-streaming). Twenty seconds after the first leg is accepted all
  // three pictures have faded to the ground over their last three, and the
  // page stops itself exactly as a stop press does. Asked for: "limit to 10
  // sec. just fade out", then "limit to 20sec. fade out sloowly".
  //
  // 🔴 THE LL-HLS LEG IS A STREAM RECORDING, AND THE WORKER DELETES IT. RTMPS
  // cannot have recording turned off, so every take is a video counted against
  // the account's 1000 storage minutes. The loopback has an input of its own
  // ("positron-hls-loopback", src/provision-loop.sh), and positron-pub deletes
  // a take about 90 s after it ends however it ended (this page's stop, a
  // closed tab, its own 30 s cap), sweeps the input every 10 minutes, and
  // refuses a take when the account is over 600 minutes (workers/pub/loop.mjs).
  // Nothing here has to stay open for any of it. The readout and the table say
  // what is on that input, read from /loop/status after a press.
  //
  // 🔴 THE WebRTC LEG SHARES /cam/'s ONE WHIP INPUT. The worker allows one
  // camera on it at a time, so a publish answered 409 means /cam/ is on air.
  // That is said in words, and nothing is retried. The LL-HLS input is this
  // page's own; a second take on it while one runs is refused the same way.
  //
  // ⚠️ A VPN PASSES THE HANDSHAKE AND DROPS THE MEDIA. With the Check Point
  // tunnel up, WHIP and WHEP both answer 201 and no frame ever arrives (CLAUDE.md,
  // measured 2026-09-25). So when the play side has signalled and no frame has
  // been decoded after a while, the log names that as one possibility, never as
  // the cause. The LL-HLS leg is HTTPS end to end and does not have this shape.
  //
  // NOTHING OPENS ON A VISIT. The camera, the relay servers, both publishes,
  // both plays and the status read are all made on the start press.
  const Q = new URLSearchParams(location.search);
  // ?pub= points the LL-HLS leg's worker routes elsewhere: the laptop
  // stand-in for positron-pub runs the real worker module with real Stream
  // (workerd cannot run on this machine). Never needed on the site. The
  // WebRTC leg always uses the deployed /cam/whip.
  const PUB = (Q.get('pub') || 'https://pub.positron.studio').replace(/\/$/, '');
  const LOOP_WS = `${PUB.replace(/^http/, 'ws')}/loop`;
  const LOOP_STATUS = `${PUB}/loop/status`;
  const LOOP_UID = 'aafa09fdefc39016203fb23129bf5df3';
  const loopLlhls = () => `https://${LIVE.customer}.cloudflarestream.com/${LOOP_UID}/manifest/video.m3u8?protocol=llhls`;
  const loopLifecycle = () => `https://${LIVE.customer}.cloudflarestream.com/${LOOP_UID}/lifecycle`;

  const S = 'web';
  const CAM = `${S}:camera:video-out`, SCREEN = `${S}:screen:video-in`;
  const LIVE_IN = 'cf-stream:live:video-in', LIVE_OUT = 'cf-stream:live:video-out';
  const LOOP = `${S}:loopback:video-in`;
  const HLS_IN = 'cf-stream:hls:video-in', HLS_OUT = 'cf-stream:hls:video-out';
  const HLS_BACK = `${S}:hls:video-in`;
  // 20 s a press, the last 3 of them a fade (asked 2026-10-10, *"limit to
  // 20sec. fade out sloowly"*, then *"fade out bit faster, both videopanels"*).
  const NO_MEDIA_MS = 7000, CAP_MS = 20000, FADE_MS = 3000;
  // How many presented frames a delay is the median of: three seconds at 30 fps.
  const WINDOW = 90;

  const d = mount({ name: 'concept video 030', what: '', index: '/concepts/', indexLabel: 'concepts',
    // 🔴 THE READOUT ON TOP: *"yeah when concept has readout move to top"*.
    joined: false,
    readout: { recordings: '', storage: 'min' } });
  conceptNav('video/030');

  // ── the bay ─────────────────────────────────────────────────────────────
  // The camera's video goes to Stream's WebRTC input by WHIP and comes back by
  // WHEP, and to the LL-HLS input (through the publisher, which the box's grey
  // line names) and comes back as LL-HLS.
  const bay = createBay();
  const camNode = (label) => bay.addNode({ id: `${S}:camera`, kind: 'device', label, place: 'browser' });
  camNode('camera');
  bay.addNode({ id: `${S}:screen`, kind: 'screen', label: 'original', place: 'browser' });
  bay.addNode({ id: 'cf-stream:live', kind: 'endpoint', label: 'Stream WebRTC input', place: 'cloudflare', net: 'cloudflare' });
  bay.addNode({ id: `${S}:loopback`, kind: 'screen', label: 'WebRTC', place: 'browser' });
  bay.addNode({ id: 'cf-stream:hls', kind: 'endpoint', label: 'Stream LL-HLS input', place: 'cloudflare', net: 'cloudflare' });
  bay.addNode({ id: `${S}:hls`, kind: 'screen', label: 'LL-HLS', place: 'browser' });
  bay.addPort({ id: CAM, label: 'camera', dir: 'out', medium: 'video' });
  bay.addPort({ id: SCREEN, label: 'original', dir: 'in', medium: 'video' });
  bay.addPort({ id: LIVE_IN, label: 'video', dir: 'in', medium: 'video', transports: ['whip'] });
  bay.addPort({ id: LIVE_OUT, label: 'video', dir: 'out', medium: 'video', transports: ['whep'] });
  bay.addPort({ id: LOOP, label: 'WebRTC', dir: 'in', medium: 'video', transports: ['whep'] });
  bay.addPort({ id: HLS_IN, label: 'video', dir: 'in', medium: 'video' });
  bay.addPort({ id: HLS_OUT, label: 'video', dir: 'out', medium: 'video', transports: ['llhls'] });
  bay.addPort({ id: HLS_BACK, label: 'LL-HLS', dir: 'in', medium: 'video', transports: ['llhls'] });

  const held = new Map();          // "from to" -> link id
  function hold(a, b, via) {
    const k = `${a} ${b}`;
    if (held.has(k)) return true;
    bay.seen(a); bay.seen(b);
    const r = bay.link(a, b, [], { site: S, ...(via ? { via } : {}) });
    if (r.ok) { held.set(k, r.id); return true; }
    d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
    return false;
  }
  const holds = (a, b) => held.has(`${a} ${b}`);
  // Held from load, so the picture of the patch is the same running or not.
  // Holding a link opens nothing; the camera and every leg wait for the press.
  hold(CAM, SCREEN);
  hold(CAM, LIVE_IN, 'whip');
  hold(LIVE_OUT, LOOP, 'whep');
  hold(CAM, HLS_IN);
  hold(HLS_OUT, HLS_BACK, 'llhls');

  // ── the camera, the burned frame, and the pictures that come back ───────
  const video = el('video');
  video.muted = true; video.playsInline = true; video.autoplay = true;
  const back = el('video');
  back.muted = true; back.playsInline = true; back.autoplay = true;
  const hlsV = el('video');
  hlsV.muted = true; hlsV.playsInline = true; hlsV.autoplay = true;
  hlsV.disableRemotePlayback = true;   // ManagedMediaSource opens only with it (positron-streaming)
  // What leaves the page: the camera, uncropped and undimmed, with the clock
  // row and its two clocks burned over it. Both legs send THIS, so each
  // returned frame says when it left, read back on the same clock.
  const src = el('canvas');
  src.width = FRAME_W; src.height = FRAME_H;
  const sctx = src.getContext('2d', { alpha: false });
  let send = null, drawT = 0, frameN = 0;
  let cam = null, gen = 0, raf = 0;
  let devices = [], deviceId = null;
  let pub = null, sub = null, statsTimer = 0, ice = null, noMedia = 0, capTimer = 0, endAt = 0;
  // When the last frame was presented, per video element: what lights a video wire.
  const last = new Map([[video, 0], [back, 0], [hlsV, 0]]);
  function watchFrames(v) {
    if (typeof v.requestVideoFrameCallback !== 'function') return;
    const tick = () => { if (!cam) return; last.set(v, performance.now()); v.requestVideoFrameCallback(tick); };
    v.requestVideoFrameCallback(tick);
  }
  const fresh = (v) => !!cam && performance.now() - last.get(v) < 500;

  /**
   * Glass to glass off the burned clock, per PRESENTED frame, as /cam/ does:
   * this one page stamps the row and reads it, so one clock is on both ends
   * and the difference is exact. A frame whose row does not read (its checksum
   * fails, which a scaled or mid-ramp frame can) is skipped, never guessed.
   */
  function meter(v) {
    const m = { samples: [], frames: 0, read: 0, live: true, firstAt: null };
    const scratch = document.createElement('canvas');
    if (typeof v.requestVideoFrameCallback !== 'function') return m;
    const tick = () => {
      if (!m.live) return;
      m.frames++;
      const at = readBurnedFrom(v, scratch);
      if (at != null) {
        if (m.firstAt == null) m.firstAt = performance.now();
        m.samples.push(performance.timeOrigin + performance.now() - at);
        if (m.samples.length > WINDOW) m.samples.shift();
        m.read++;
      }
      v.requestVideoFrameCallback(tick);
    };
    v.requestVideoFrameCallback(tick);
    return m;
  }
  const median = (a) => {
    if (!a.length) return null;
    const s = a.slice().sort((x, y) => x - y);
    return s[Math.floor(s.length / 2)];
  };
  const delayText = (x) => (x == null ? '' : x < 1000 ? `${Math.round(x)} ms` : `${(x / 1000).toFixed(1)} s`);
  const meters = { rtc: null, hls: null };

  // ── the three pictures ──────────────────────────────────────────────────
  // The original is the burned frame itself; the two returns are drawn by the
  // test picture's own `drawCamera`, contained, no scrim, so the only
  // difference between the three is the trip.
  const GROUND = '#0b0e14';
  function canvasPanel() {
    const c = el('canvas');
    c.width = FRAME_W; c.height = FRAME_H;
    const ctx = c.getContext('2d', { alpha: false });
    return { c, ctx };
  }
  const L = canvasPanel(), R = canvasPanel(), H = canvasPanel();
  // Footers as on /concepts/video/000/: one line, empty until on, the name at the
  // left and the value at the right beside the full-screen button.
  const name = el('span', 'cc-say', '');
  const size = el('span', 'cc-say', '');
  const panel = createVideoPanel({ media: L.c, left: name });
  panel.el.querySelector('.pos-vp-r').prepend(size);
  // The WebRTC footer: the delay read off the clock, then what getStats() of
  // the WHEP connection measured, each cell empty until it has been read. The
  // word at the left is where the round trip has got to.
  // ⚠️ THREE CELLS, BECAUSE THE STATE WORD AND THREE IS WHAT FITS ONE LINE OF
  // A HALF PANEL AT 1280. `delay` took the place of `size` on 2026-10-12, when
  // the page started measuring it, and with four cells beside it the state
  // was cut to `playin` and the rtt to one digit (MEASURED in a 1280 shot).
  // The size and the rtt went into the row's hover beside the codec and the
  // decoded and dropped counts.
  const state = el('span', 'cc-say', '');
  const loopPanel = createVideoPanel({ media: R.c, left: state, values: [
    { key: 'delay', label: '', reserve: 6 },
    { key: 'fps', label: 'fps', reserve: 2 },
    { key: 'rate', label: 'kbit/s', reserve: 4 },
  ] });
  const V = loopPanel.values;
  // 🔴 THE PICTURE SAYS WEBRTC, ALWAYS, EVEN STOPPED. Reported 2026-10-12:
  // *"not clear that this is webrtc"*. On the panel's own tag plate, top left
  // of the picture, where it stays in full screen. LL-HLS the same way.
  loopPanel.slots.tag.append(el('span', 'cc-say cc-proto', 'WebRTC'));
  const hstate = el('span', 'cc-say', '');
  const hlsPanel = createVideoPanel({ media: H.c, left: hstate, values: [
    { key: 'delay', label: '', reserve: 6 },
    { key: 'size', label: '', reserve: 9 },
  ] });
  const HV = hlsPanel.values;
  hlsPanel.slots.tag.append(el('span', 'cc-say cc-proto', 'LL-HLS'));

  // What the LL-HLS leg left on Stream: every recording on the loopback's own
  // input, as /loop/status lists it. It fills after a take and empties again
  // when the worker has deleted it, which is the point of showing it.
  const recs = createTable({ minRows: 3, empty: '', columns: [
    { key: 'video', label: 'video', grow: true, clip: true, hover: 'uid' },
    { key: 'state', label: 'state', width: 96 },
    { key: 'length', label: 'length', width: 56, align: 'right' },
  ] });
  const recBox = el('div', 'cc-recs');
  recBox.append(el('h3', 'cc-h', 'recordings on Stream'), recs.el);
  const pair = el('div', 'cc-pair');
  pair.append(panel.el, loopPanel.el, hlsPanel.el, recBox);

  // The routing follows the links: without camera -> original the left panel
  // is the ground; without a leg's link its picture is.
  // `alpha` below 1 lays the picture over the ground at that strength, which
  // is how the pictures fade out over the last seconds of the cap.
  function paint(p, v, on, alpha = 1) {
    p.ctx.globalAlpha = 1;
    if (on && alpha < 1) { p.ctx.fillStyle = GROUND; p.ctx.fillRect(0, 0, FRAME_W, FRAME_H); }
    const ready = v instanceof HTMLCanvasElement || (v.readyState >= 2 && v.videoWidth > 0);
    if (on && alpha > 0 && ready) {
      p.ctx.globalAlpha = alpha;
      if (v instanceof HTMLCanvasElement) p.ctx.drawImage(v, 0, 0, FRAME_W, FRAME_H);
      else drawCamera(p.ctx, v, FRAME_W, FRAME_H, { scrim: 0 });
      p.ctx.globalAlpha = 1;
    } else if (!on || alpha <= 0) { p.ctx.fillStyle = GROUND; p.ctx.fillRect(0, 0, FRAME_W, FRAME_H); }
  }
  const fade = () => (endAt ? Math.max(0, Math.min(1, (endAt - performance.now()) / FADE_MS)) : 1);
  function render() {
    // All three fade together as the press runs out.
    paint(L, src, !!cam && holds(CAM, SCREEN), fade());
    paint(R, back, !!cam && !!sub && holds(LIVE_OUT, LOOP), fade());
    paint(H, hlsV, !!cam && !!HLS.player && holds(HLS_OUT, HLS_BACK), fade());
  }
  function frame() { render(); if (cam) raf = requestAnimationFrame(frame); }
  render();

  // ── what getStats() says, about once a second ───────────────────────────
  // Two connections: the publish (bytes sent, which lights the WHIP wire) and
  // the play (the footer, and frames decoded for the WHEP wire).
  const stat = { pub: 'new', play: 'new', sent: 0, sending: false, bytes: 0, at: 0, decoded: 0, arriving: false };
  async function readPub() {
    const p = pub?.pc;
    if (!p) return;
    const stats = await p.getStats().catch(() => null);
    if (!stats || p !== pub?.pc) return;
    let sent = 0;
    for (const s of stats.values()) if (s.type === 'outbound-rtp' && s.kind === 'video') sent += s.bytesSent || 0;
    stat.sending = sent > stat.sent;
    stat.sent = sent;
  }
  async function readPlay() {
    const p = sub?.pc;
    if (!p) return;
    const stats = await p.getStats().catch(() => null);
    // Stopped while the reading was in flight: nothing lands in emptied cells.
    if (!stats || p !== sub?.pc) return;
    let vin = null, rtt = null;
    for (const s of stats.values()) {
      if (s.type === 'inbound-rtp' && s.kind === 'video') vin = s;
      if (s.type === 'candidate-pair' && s.state === 'succeeded' && s.nominated !== false
        && Number.isFinite(s.currentRoundTripTime)) rtt = s.currentRoundTripTime * 1000;
    }
    if (!vin) { stat.arriving = false; return; }
    const now = performance.now();
    const bytes = vin.bytesReceived || 0;
    if (stat.at) {
      const kbps = ((bytes - stat.bytes) * 8) / (now - stat.at);
      if (bytes > 0) V.set('rate', Math.round(kbps));
    }
    stat.bytes = bytes; stat.at = now;
    const decoded = vin.framesDecoded || 0;
    stat.arriving = decoded > stat.decoded;
    stat.decoded = decoded;
    if (Number.isFinite(vin.framesPerSecond)) V.set('fps', Math.round(vin.framesPerSecond));
    const codec = vin.codecId && stats.get(vin.codecId);
    const cname = codec?.mimeType ? codec.mimeType.replace(/^video\//i, '') : '';
    if (cname && cname !== stat.cname) d.log(`the WHEP leg decodes ${cname}`);
    stat.cname = cname;
    const sz = vin.frameWidth && vin.frameHeight ? `${vin.frameWidth}x${vin.frameHeight}` : '';
    const rttS = rtt != null ? `rtt ${rtt < 1 ? rtt.toFixed(1) : Math.round(rtt)} ms\n` : '';
    V.el.title = `${sz} ${cname}\n${rttS}${decoded} frames decoded\n${vin.framesDropped ?? 0} dropped`.trim();
    if (stat.arriving && state.textContent !== 'playing') state.textContent = 'playing';
    Object.assign(stat, {
      w: vin.frameWidth, h: vin.frameHeight, fps: vin.framesPerSecond, rtt,
      codec: codec?.mimeType || null, dropped: vin.framesDropped,
    });
  }
  function readDelays() {
    V.set('delay', delayText(median(meters.rtc?.samples || [])));
    HV.set('delay', delayText(median(meters.hls?.samples || [])));
    if (hlsV.videoWidth) HV.set('size', `${hlsV.videoWidth}x${hlsV.videoHeight}`);
    if (meters.hls?.firstAt != null && HLS.firstMs == null && HLS.askedAt != null) {
      HLS.firstMs = meters.hls.firstAt - HLS.askedAt;
      d.log(`ll-hls: first frame back ${(HLS.firstMs / 1000).toFixed(1)} s after the take began`, 'hi');
    }
    if (meters.hls?.firstAt != null && hstate.textContent !== 'playing') hstate.textContent = 'playing';
  }
  async function readStats() { await Promise.all([readPub(), readPlay()]); readDelays(); pb.refresh(); }
  const clearStats = () => {
    for (const k of V.keys()) V.set(k, '');
    for (const k of HV.keys()) HV.set(k, '');
    V.el.title = '';
    Object.assign(stat, { sent: 0, sending: false, bytes: 0, at: 0, decoded: 0, arriving: false, cname: '' });
  };

  // The HTTP status of the last request to a URL, from resource timing, so the
  // log can say 201 rather than "ok". Empty where the browser does not say.
  const statusOf = (prefix) => {
    const e = performance.getEntriesByType('resource').filter((x) => x.name.startsWith(prefix)).pop();
    return e?.responseStatus || '';
  };

  // The cap starts when Cloudflare starts counting, on whichever leg is
  // accepted first, and ends as a stop press.
  function armCap(mine) {
    if (endAt) return;
    endAt = performance.now() + CAP_MS;
    capTimer = setTimeout(() => {
      if (gen !== mine) return;
      d.log(`${CAP_MS / 1000} s is the most one press runs through Cloudflare`);
      stop();
    }, CAP_MS);
  }

  // ── the WebRTC round trip ───────────────────────────────────────────────
  async function roundTrip(mine) {
    if (!holds(CAM, LIVE_IN)) { d.log(`${CAM} -> ${LIVE_IN} is not held, so nothing is sent`); return; }
    state.textContent = 'publishing';
    ice = ice || await fetchIceServers({ log: (m) => d.log(`webrtc ${m}`) });
    if (gen !== mine) return;
    let p;
    try {
      p = await camWhipPublish(send, { iceServers: ice.iceServers, log: (m, k) => d.log(`webrtc ${m}`, k) });
    } catch (e) {
      if (gen !== mine) return;
      const busy = /\b409\b/.test(e.message);
      d.log(busy ? 'webrtc publish 409: another camera is on /cam/\'s input (/cam/ is on air), so nothing was sent'
        : `the WebRTC publish did not start: ${e.message}`, 'bad');
      state.textContent = busy ? 'another camera is on air' : 'did not publish';
      stat.pub = 'refused';
      return;
    }
    if (gen !== mine) { p.stop(); return; }
    pub = p;
    stat.pub = pub.pc.connectionState;
    d.log(`WHIP publish answered ${statusOf(CAM_WHIP_PROXY) || 'ok'}: ${CAM} -> ${LIVE_IN}`, 'hi');
    armCap(mine);
    pub.pc.addEventListener('connectionstatechange', () => {
      stat.pub = pub?.pc.connectionState || 'closed';
      if (stat.pub === 'failed') d.log('the publish could not reach Cloudflare: UDP blocked, or a VPN, are both possible', 'bad');
      pb.refresh();
    });
    if (!holds(LIVE_OUT, LOOP)) { d.log(`${LIVE_OUT} -> ${LOOP} is not held, so nothing is played back`); state.textContent = 'on air'; return; }
    state.textContent = 'connecting';
    let s;
    try {
      s = await whepPlay(camWhep(), back, { iceServers: ice.iceServers, log: (m, k) => d.log(`webrtc ${m}`, k) });
    } catch (e) {
      if (gen !== mine) return;
      d.log(`the play back did not start: ${e.message}`, 'bad');
      state.textContent = 'did not play';
      return;
    }
    if (gen !== mine) { try { s.pc.close(); } catch { /* fine */ } return; }
    sub = s;
    stat.play = sub.pc.connectionState;
    d.log(`WHEP play answered ${statusOf(camWhep()) || 'ok'}: ${LIVE_OUT} -> ${LOOP}`, 'hi');
    watchFrames(back);
    meters.rtc = meter(back);
    sub.pc.addEventListener('connectionstatechange', () => {
      stat.play = sub?.pc.connectionState || 'closed';
      d.log(`WHEP leg ${stat.play}`, stat.play === 'connected' ? 'hi' : stat.play === 'failed' ? 'bad' : '');
      pb.refresh();
    });
    // The handshake succeeded; if no frame is decoded within a while, say what
    // that shape usually is, as a possibility and with the state it was read from.
    noMedia = setTimeout(() => {
      if (gen !== mine || !sub || stat.decoded > 0) return;
      d.log(`no frame back after ${NO_MEDIA_MS / 1000} s with WHEP ${stat.play} and the publish ${stat.pub}. `
        + 'A VPN passes the handshake and drops WebRTC media, so that is one possibility to check first', 'warn');
      state.textContent = 'no media yet, a VPN?';
    }, NO_MEDIA_MS);
  }

  // ── the LL-HLS round trip ───────────────────────────────────────────────
  // The burned frame recorded with MediaRecorder (H.264 in WebM, 2 s
  // keyframes), sent over the worker's socket, rewrapped to RTMPS by the
  // publisher container with no encode, and played back from Stream with the
  // low latency player (camPublish in live.mjs, plans/plan-cam-llhls.md).
  const HLS = { pub: null, player: null, st: null, askedAt: null, readyAt: null, liveAt: null, firstMs: null, uid: null, rebuilds: 0 };
  const HLS_SAY = { busy: 'refused', stopped: 'stopped', closed: 'lost the publisher', unsupported: 'needs Chrome or Edge' };
  // hls.js is a classic script that sets `window.Hls`, which the player reads.
  // Loaded on the press, never on the visit: 600 KB nobody asked for otherwise.
  let hlsLib = null;
  const loadHlsJs = () => (window.Hls ? Promise.resolve() : (hlsLib ||= new Promise((ok, no) => {
    const sc = document.createElement('script');
    sc.src = '/proto/remixer/hls.min.js';
    sc.onload = ok;
    sc.onerror = () => { hlsLib = null; no(new Error('hls.js did not load')); };
    document.head.append(sc);
  })));
  // Until Stream says the input is live: a player built before that meets an
  // empty manifest and rebuilds through it. One small GET on our own input.
  async function streamLive(mine, capMs = 15000) {
    const t0 = performance.now();
    while (gen === mine && HLS.st === 'ready' && performance.now() - t0 < capMs) {
      try {
        const j = await (await fetch(loopLifecycle(), { cache: 'no-store' })).json();
        if (j.live && j.videoUID) return j.videoUID;
      } catch { /* ask again */ }
      await new Promise((r) => setTimeout(r, 400));
    }
    return null;
  }
  function startHls(mine) {
    if (!holds(CAM, HLS_IN)) { d.log(`${CAM} -> ${HLS_IN} is not held, so nothing is sent`); return; }
    Object.assign(HLS, { st: null, askedAt: performance.now(), readyAt: null, liveAt: null, firstMs: null, uid: null, rebuilds: 0 });
    hstate.textContent = 'publishing';
    loadHlsJs().catch((e) => d.log(`ll-hls: ${e.message}`, 'bad'));
    HLS.pub = camPublish(send, {
      url: LOOP_WS,
      log: (m) => d.log(`ll-hls ${m}`),
      onState: ({ t, why }) => {
        if (gen !== mine) return;
        HLS.st = t;
        if (t === 'ready') {
          HLS.readyAt = performance.now();
          d.log(`ll-hls: the publisher is sending to the loopback input, ${((HLS.readyAt - HLS.askedAt) / 1000).toFixed(1)} s after asking`, 'hi');
          armCap(mine);
          hstate.textContent = 'waiting for Stream';
          pollStatus();
          if (!holds(HLS_OUT, HLS_BACK)) { d.log(`${HLS_OUT} -> ${HLS_BACK} is not held, so nothing is played back`); return; }
          Promise.all([loadHlsJs(), streamLive(mine)]).then(([, uid]) => {
            if (gen !== mine || HLS.st !== 'ready') return;
            HLS.liveAt = performance.now();
            HLS.uid = uid;
            d.log(uid
              ? `ll-hls: Stream has the take live (video ${uid.slice(0, 8)}), ${((HLS.liveAt - HLS.readyAt) / 1000).toFixed(1)} s after sending began`
              : 'll-hls: Stream did not say the input was live within 15 s, playing anyway', uid ? 'hi' : 'warn');
            hstate.textContent = 'buffering';
            HLS.player = createLowLatencyPlayer(hlsV, loopLlhls())
              .on('rebuild', ({ why: w }) => { HLS.rebuilds++; d.log(`ll-hls: player rebuilt (${w})`); });
            watchFrames(hlsV);
            meters.hls = meter(hlsV);
          }).catch((e) => { d.log(`ll-hls: ${e.message}`, 'bad'); hstate.textContent = 'could not play'; });
          return;
        }
        d.log(`ll-hls: ${why || t}`, t === 'stopped' ? 'warn' : 'bad');
        hstate.textContent = HLS_SAY[t] || 'stopped';
        try { HLS.player?.destroy(); } catch { /* gone */ }
        HLS.player = null;
        if (meters.hls) meters.hls.live = false;
      },
    });
  }
  function stopHls() {
    try { HLS.pub?.stop(); } catch { /* gone */ }
    try { HLS.player?.destroy(); } catch { /* gone */ }
    const had = !!HLS.pub;
    HLS.pub = null; HLS.player = null;
    if (meters.hls) meters.hls.live = false;
    try { hlsV.removeAttribute('src'); hlsV.load(); } catch { /* fine */ }
    return had;
  }

  // ── what is on the loopback input, from the worker ──────────────────────
  // Read after a press and every 10 s while a take runs or a clean is still
  // owed, then it stops by itself: a visit reads nothing.
  let statusT = 0;
  const minutes = (x) => (x == null ? '' : x < 10 ? x.toFixed(1) : Math.round(x));
  async function readStatus() {
    let j;
    try { j = await (await fetch(LOOP_STATUS, { cache: 'no-store' })).json(); }
    catch { d.log('could not read what is on the loopback input', 'warn'); return null; }
    const list = j.recordings || [];
    d.set('recordings', j.recordings ? list.length : '');
    d.set('storage', j.storage ? minutes(j.storage.used) : '');
    recs.set(list.map((v) => ({
      video: v.uid.slice(0, 12), uid: v.uid, state: v.state === 'live-inprogress' ? 'live' : v.state || '',
      length: v.minutes ? `${Math.round(v.minutes * 60)} s` : '',
    })));
    // Only a clean that ran after this page's own take ended is news: the
    // first read of a new take otherwise reports the LAST take's clean as if
    // it had just happened (seen in a run of three takes).
    const lc = j.lastClean;
    if (lc && lc.at !== readStatus.seen) {
      readStatus.seen = lc.at;
      if (endedAt && Date.parse(lc.at) >= endedAt) d.log(`the worker cleaned the loopback input: ${lc.deleted.length} deleted${lc.minutesFreed ? `, ${lc.minutesFreed} min freed` : ''}${lc.failed.length ? `, ${lc.failed.length} failed` : ''}`, lc.ok ? 'hi' : 'warn');
    }
    return j;
  }
  readStatus.seen = null;
  let endedAt = 0;   // when this page's last LL-HLS take ended, epoch ms
  function pollStatus() {
    clearTimeout(statusT);
    const tick = async () => {
      const j = await readStatus();
      const owed = !!cam || !!j?.take || (j?.pending || []).length > 0;
      if (owed) statusT = setTimeout(tick, 10_000);
      else if (j) d.log(`nothing owed on the loopback input: ${(j.recordings || []).length} recordings, ${minutes(j.storage?.used)} storage minutes on the account`);
    };
    tick();
  }

  const lit = (l) => {
    if (l.from === CAM && l.to === SCREEN) return !!cam;
    if (l.from === CAM && l.to === LIVE_IN) return stat.pub === 'connected' && stat.sending;
    if (l.from === LIVE_OUT) return stat.play === 'connected' && stat.arriving;
    if (l.from === CAM && l.to === HLS_IN) return HLS.st === 'ready';
    if (l.from === HLS_OUT) return fresh(hlsV);
    return false;
  };
  // Each box's grey line: the label beside the title, and under it what the
  // ports are carried by, so the two legs are named on the picture of the
  // patch and not only in a table.
  const pb = createPatchbay(bay, { flowing: lit, detail: (n) => (
    n.id === 'cf-stream:live' ? [n.label, 'WHIP in', 'WHEP out']
      : n.id === 'cf-stream:hls' ? [n.label, 'RTMPS in from the publisher', 'LL-HLS out']
      : n.id === `${S}:loopback` ? [n.label, 'WHEP in']
      : n.id === `${S}:hls` ? [n.label, 'LL-HLS in']
      : n.id === `${S}:camera` ? [n.label, null, 'WHIP and WebSocket out']
      : [n.label]) });

  // ── start and stop ──────────────────────────────────────────────────────
  async function start() {
    const mine = ++gen;
    armVideo(video); armVideo(back); armVideo(hlsV);   // before any await, or iOS refuses later
    let s;
    try {
      s = await navigator.mediaDevices.getUserMedia({
        video: { ...(deviceId ? { deviceId: { exact: deviceId } } : {}),
          width: { ideal: FRAME_W }, height: { ideal: FRAME_H }, frameRate: { ideal: 30 } },
        audio: false,
      });
    } catch (e) {
      const why = e?.name === 'NotAllowedError' ? 'the camera was refused'
        : e?.name === 'NotFoundError' ? 'this machine has no camera'
        : `the camera did not start (${e?.name || e})`;
      d.log(`${why}, so nothing was sent anywhere`, 'bad');
      face(false);
      return;
    }
    if (gen !== mine) { s.getTracks().forEach((t) => t.stop()); return; }
    cam = s;
    const track = cam.getVideoTracks()[0];
    const set = track.getSettings();
    deviceId = set.deviceId || deviceId;
    video.srcObject = cam;
    video.play().catch(() => {});
    // A camera's label ends in its USB ids, `(2C0E:82E3)`, which name nothing a reader needs.
    const label = (track.label || '').replace(/\s*\([0-9a-f]{4}:[0-9a-f]{4}\)\s*$/i, '');
    name.textContent = label;
    size.textContent = set.width && set.height ? `${set.width}x${set.height}` : '';
    camNode(label || 'camera');
    d.log(`camera on: ${track.label || 'default'} at ${set.width}x${set.height}`, 'hi');
    // The frame that leaves: camera, then the clock, 30 times a second.
    drawT = setInterval(() => {
      drawCamera(sctx, video, FRAME_W, FRAME_H, { scrim: 0 });
      burn(sctx, FRAME_W, FRAME_H, frameN++, { field: false, scrim: true });
    }, 1000 / 30);
    send = src.captureStream(30);
    watchFrames(video);
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(frame);
    statsTimer = setInterval(readStats, 1000);
    face(true);
    pb.refresh();
    d.log('this costs Cloudflare Stream minutes: a WHIP publish and a WHEP play, an RTMPS publish, its recording until the worker deletes it, and an LL-HLS play', 'warn');
    // Both legs at once. LL-HLS is not awaited: its publisher may be waking.
    startHls(mine);
    try { await roundTrip(mine); } catch (e) { d.log(`the round trip did not start: ${e?.message || e}`, 'bad'); }
    pb.refresh();
    await listCameras();
  }

  function stop() {
    gen++;
    clearInterval(statsTimer); clearTimeout(noMedia); clearTimeout(capTimer); clearInterval(drawT);
    endAt = 0;
    const p = pub, s = sub;
    pub = sub = null;
    try { s?.pc.close(); } catch { /* fine */ }
    p?.stop();
    const hadHls = stopHls();
    if (meters.rtc) meters.rtc.live = false;
    meters.rtc = meters.hls = null;
    stat.pub = 'closed'; stat.play = 'closed';
    for (const v of [video, back]) {
      v.srcObject?.getTracks?.().forEach((t) => t.stop());
      try { v.pause(); } catch { /* fine */ }
      v.srcObject = null;
    }
    send?.getTracks().forEach((t) => t.stop());
    send = null;
    cam?.getTracks().forEach((t) => t.stop());
    cam = null;
    cancelAnimationFrame(raf);
    name.textContent = ''; size.textContent = ''; state.textContent = ''; hstate.textContent = '';
    clearStats();
    render();
    pb.refresh();
    face(false);
    d.log(p || s || hadHls ? 'off air: both publishes ended, both plays closed, every track stopped' : 'camera off, every track stopped');
    if (hadHls) {
      endedAt = Date.now();
      d.log('the worker deletes this take\'s recording about 90 s from now, whether or not this page stays open');
      pollStatus();
    }
  }
  addEventListener('pagehide', () => { if (cam) stop(); });

  // ── which camera, once there is more than one ───────────────────────────
  // Device labels are empty until the camera has been allowed, so the list is
  // read after the first start and never on a visit.
  const picker = createPicker({ what: 'camera',
    prev: () => pick((at() - 1 + devices.length) % devices.length),
    next: () => pick((at() + 1) % devices.length),
    onPick: (i) => pick(i) });
  picker.el.hidden = true;
  const at = () => Math.max(0, devices.findIndex((x) => x.deviceId === deviceId));
  async function listCameras() {
    try {
      devices = (await navigator.mediaDevices.enumerateDevices()).filter((x) => x.kind === 'videoinput');
    } catch { devices = []; }
    picker.options(devices.map((x, i) => x.label || `camera ${i + 1}`));
    picker.show(at());
    picker.el.hidden = devices.length < 2;
  }
  async function pick(i) {
    const dev = devices[i];
    if (!dev || dev.deviceId === deviceId) return;
    deviceId = dev.deviceId;
    picker.show(i);
    if (cam) { stop(); await start(); }
  }

  const transport = createButtonGroup({ buttons: [
    { id: 'cam', icon: 'video', label: 'start the camera', onPress: () => (cam ? stop() : start()) },
  ] });
  // The group itself disables the button while a press's promise runs, so a
  // second press cannot start a second camera while the prompt is up.
  function face(on) {
    transport.setIcon('cam', on ? 'stop' : 'video', on ? 'stop the camera' : 'start the camera');
  }

  const top = el('div', 'cc-top');
  top.append(transport.el, picker.el);
  d.stack.add(top, pair, pb.el);
  window.__demo.loopback = {
    stat, hls: HLS,
    delays: () => ({ webrtc: median(meters.rtc?.samples || []), hls: median(meters.hls?.samples || []),
      webrtcRead: meters.rtc?.read ?? 0, hlsRead: meters.hls?.read ?? 0 }),
    values: () => Object.fromEntries(V.keys().map((k) => [k, V.cell(k).textContent])),
    hlsValues: () => Object.fromEntries(HV.keys().map((k) => [k, HV.cell(k).textContent])),
    state: () => state.textContent, hlsState: () => hstate.textContent,
    status: () => readStatus(),
  };
  d.ready();
</script>
