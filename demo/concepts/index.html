<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON concepts</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .cc-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .cc-card {
    display: flex; flex-direction: column; gap: 6px;
    min-height: 110px;
    padding: var(--inset, 12px);
    background: var(--card);
    border: var(--edge, 1px solid var(--line));
    border-radius: var(--r, 4px);
    color: inherit; text-decoration: none;
  }
  .cc-card:hover { border-color: var(--fg); }
  .cc-n { font: 400 12px var(--mono); color: var(--dim); }
  .cc-t { margin: 0; font-size: 15px; }
  .cc-s { margin: 0; color: var(--dim); font-size: 13.5px; }
</style>
<script type="module">
  import { mount, el } from '/shell/shell.mjs';

  // One card per concept, in teaching order. A card links to /concepts/<n>/.
  const CONCEPTS = [
    ['Announce', 'Every port the studio room can hear.'],
    ['Mirror', 'The mirror demo as the patchbay sees it.'],
    ['Chat', 'A multi-user chat built from patchbay blocks.'],
    ['History', 'The same chat, with a store that keeps what was said.'],
  ];

  const d = mount({ name: 'concepts', what: 'The ideas behind positron, one page each.', readout: null });

  const grid = el('div', 'cc-cards');
  CONCEPTS.forEach(([title, say], i) => {
    const a = el('a', 'cc-card', '', { href: `/concepts/${i + 1}/` });
    a.append(el('h3', 'cc-t', title));
    if (say) a.append(el('p', 'cc-s', say));
    grid.append(a);
  });
  d.el.append(grid);
  d.ready();
</script>
