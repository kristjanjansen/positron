<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON concept 40</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .cc-stack { display: flex; flex-direction: column; gap: 12px; }
  .cc-h { margin: 0; font-size: 14px; color: var(--dim); font-weight: 500; }
  /* Every part of this page follows the links, so a part the patch does not use
     is hidden, and the kit's components set `display` of their own. (0,2,0). */
  .cc-stack [hidden] { display: none; }
  /* The step picker and the sound button on one row; on a phone they wrap. */
  .cc-top { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .cc-top > .pos-bgroup { flex: none; width: auto; }
  /* The module pictures: each cell its own size, the browser counts the columns. */
  .cc-pics { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(200px, 100%), 1fr)); }
  /* Two scopes side by side, one under the other on a phone. As /concepts/30/. */
  .cc-pair { display: flex; gap: 12px; align-items: flex-start; }
  .cc-pair > * { flex: 1 1 0; min-width: 0; }
  @media (max-width: 560px) { .cc-pair { flex-direction: column; align-items: stretch; } .cc-pair > * { flex: none; } }
  .cc-say { font-size: 12px; color: var(--dim); }
  .cc-wave .pos-scope { margin: 0; --edge: 0px; --r: 0px; }
  .cc-wave .pos-scope-gut { display: none; }
</style>
<script type="module">
  import { conceptNav } from '/concepts/nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createChoice } from '/shell/choice.mjs';
  import { createKnob, createKnobBank } from '/shell/knob.mjs';
  import { createKeyboard, keyRange } from '/shell/keyboard.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createGrainScope } from '/shell/grain-scope.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { setSymbol } from '/shell/symbol.mjs';
  import { createWaveShape, createFilterView, createEnvelopeView, OCTAVES, Q_MIN, Q_MAX } from '/shell/synth-view.mjs';
  import { createSynth, STEPS, KNOBS, knobRaw } from './modules.mjs';

  // A WebAudio synth built in the patchbay, in six steps (plans/plan-synth-patch.md).
  // Every module is a bay node and every part of this page follows the links the
  // bay holds: the sound is wired by the router in modules.mjs, and a picture, a
  // knob or the keyboard shows only while its module is in the patch.
  //
  // NOTHING OPENS ON A VISIT. The AudioContext is made on the first key or play
  // press.
  const d = mount({ name: 'concept 40', what: '', readout: null, index: '/concepts/', indexLabel: 'concepts' });
  conceptNav(40);

  const pics = {};
  const synth = createSynth({ log: (m, lv) => d.log(m, lv), onParam: (mod) => draw(mod) });
  const { bay, P } = synth;
  const ID = synth.id;

  // ── the module pictures, the kit's synth view ────────────────────────────
  // The filter view's x axis is OCTAVES octaves from 20 Hz, and its resonance
  // runs Q_MIN to Q_MAX, both on a 0 to 127 travel.
  const cut = (f) => Math.max(0, Math.min(127, (Math.log2(f / 20) / OCTAVES) * 127));
  const res = (q) => Math.max(0, Math.min(127, ((q - Q_MIN) / (Q_MAX - Q_MIN)) * 127));
  const ENV_MAX = 3;
  pics.osc = createWaveShape({ label: 'osc', name: P.osc.wave });
  pics.filter = createFilterView({ label: 'filter', type: 'low pass 12dB', freq: cut(P.filter.cutoff), resonance: res(P.filter.q) });
  pics.amp = createEnvelopeView({ label: 'amp', max: ENV_MAX, unit: 's' });
  // The LFO drawn over a two second window, so a faster rate is more cycles.
  pics.lfo = createWaveShape({ label: 'lfo', name: 'sine', cycles: 1 });
  function draw(mod) {
    if (mod === 'osc') pics.osc.set({ name: P.osc.wave });
    if (mod === 'filter') pics.filter.set({ freq: cut(P.filter.cutoff), resonance: res(P.filter.q) });
    if (mod === 'amp') {
      const a = P.amp;
      pics.amp.set({ attack: a.attack, decay: a.decay, sustain: a.sustain * ENV_MAX, release: a.release });
    }
    if (mod === 'lfo') pics.lfo.set({ cycles: Math.max(0.25, Math.min(12, P.lfo.rate * 2)) });
  }
  for (const m of ['osc', 'filter', 'amp', 'lfo']) draw(m);
  const picRow = el('div', 'cc-pics');
  picRow.append(pics.osc.el, pics.filter.el, pics.amp.el, pics.lfo.el);

  // ── the scopes: grain-scope `feed()` in a video panel, as /concepts/30/ ─
  const scopes = ['scope-a', 'scope-b'].map((s) => {
    const host = el('div', 'cc-wave');
    const scope = createGrainScope(host, { seconds: 4, height: 150, fullScale: 0.6 });
    const from = el('span', 'cc-say', '');
    const panel = createVideoPanel({ media: host, aspect: 'auto', left: el('span', 'cc-say', bay.node(`web:${s}`).label), centre: from });
    return { s, scope, from, panel };
  });
  const pair = el('div', 'cc-pair');
  pair.append(...scopes.map((x) => x.panel.el));

  // ── the knobs: one `web:knobs` node, each turn one event out of value-out ─
  const knobs = new Map();
  for (const k of KNOBS) {
    knobs.set(k.name, createKnob({
      label: k.name === 'q' ? 'Q' : k.name, min: k.min, max: k.max, step: k.step, value: k.raw, format: k.format,
      onInput: (r) => bay.send(ID('knobs', 'value-out'), { of: 'param', name: k.name, v: k.value(r) }),
    }));
  }
  const bank = createKnobBank([...knobs.values()]);

  // ── the keyboard: a key is one note event out of keys:midi-out ───────────
  const keysHost = el('div');
  const inPatch = (node) => bay.links().some((l) => l.from.split(':')[1] === node || l.to.split(':')[1] === node);
  const kb = createKeyboard(keysHost, {
    ...keyRange(21), base: 48,
    onDown: (note, how) => {
      if (how === 'midi' || !inPatch('keys')) return;
      wake(); sound(true);
      bay.send(ID('keys', 'midi-out'), { cls: 'note', ch: 1, d1: note, d2: 100 });
    },
    onUp: (note, how) => {
      if (how === 'midi' || !inPatch('keys')) return;
      bay.send(ID('keys', 'midi-out'), { cls: 'note', ch: 1, d1: note, d2: 0 });
    },
  });

  // ── sound on and off ────────────────────────────────────────────────────
  let ctx = null;
  function wake() {
    if (!ctx) { ctx = new AudioContext(); synth.start(ctx); requestAnimationFrame(frame); }
    ctx.resume();
  }
  const GLYPH = { play: '►', stop: '■' };
  const transport = createButtonGroup({ buttons: [
    { id: 'play', label: GLYPH.play, aria: 'play', onPress: () => { if (!synth.on()) wake(); sound(!synth.on()); } },
  ] });
  function sound(v) {
    synth.sound(v);
    const b = transport.button('play');
    setSymbol(b, v ? GLYPH.stop : GLYPH.play);
    b.title = v ? 'stop' : 'play';
    b.setAttribute('aria-label', b.title);
  }

  function frame() {
    for (const x of scopes) {
      const buf = synth.on() ? synth.read(x.s) : null;
      if (buf) x.scope.feed(buf, ctx.sampleRate);
    }
    requestAnimationFrame(frame);
  }

  // ── the patch: a step is a text, and the text is the links ───────────────
  let step = STEPS[0];
  function apply(text) {
    let bad;
    try { bad = synth.load(text); } catch (e) { bad = [{ line: '', why: e.message.replace(/^bay: /, '') }]; }
    for (const b of bad) d.log(b.line ? `${b.line} refused: ${b.why}` : b.why, 'warn');
    follow();
  }
  // Show what the links use, and nothing else.
  function follow() {
    pics.osc.el.hidden = !inPatch('osc');
    pics.filter.el.hidden = !inPatch('filter');
    pics.amp.el.hidden = !inPatch('amp');
    pics.lfo.el.hidden = !inPatch('lfo');
    picRow.hidden = !['osc', 'filter', 'amp', 'lfo'].some(inPatch);
    for (const x of scopes) {
      const l = bay.links().find((k) => k.to === ID(x.s, 'audio-in'));
      x.panel.el.hidden = !l;
      x.from.textContent = l ? `from ${l.from.split(':')[1]}` : '';
    }
    // A knob shows when the step offers it and the knobs reach its module.
    const reach = (mod) => bay.links().some((l) => l.from === ID('knobs', 'value-out') && l.to === ID(mod, 'value-in'));
    let shown = 0;
    for (const k of KNOBS) {
      const on = step.knobs.includes(k.name) && reach(k.owner);
      knobs.get(k.name).el.hidden = !on;
      shown += on;
    }
    bank.el.hidden = !shown;
    keysHost.hidden = !inPatch('keys');
    pb.refresh();
  }

  // Choosing a step sets its starting sound and replaces the whole patch.
  const picker = createChoice({ label: 'step', at: 0,
    options: STEPS.map((s, i) => [`${i + 1} ${s.name}`, i]),
    onPick: (i) => {
      step = STEPS[i];
      for (const [name, v] of Object.entries(step.preset)) {
        const k = KNOBS.find((x) => x.name === name);
        synth.setParam(k.owner, name, v);
        knobs.get(name).set(knobRaw(name, v), { quiet: true });
      }
      apply(step.patch);
    } });

  // ── the patchbay, drawing only the nodes the links use ───────────────────
  const view = {
    nodes: () => bay.nodes().filter((n) => inPatch(n.id.split(':')[1])),
    ports: () => bay.ports().filter((p) => inPatch(p.id.split(':')[1])),
    links: () => bay.links(),
  };
  const pb = createPatchbay(view, {
    flowing: (l) => (l.from === ID('lfo', 'audio-out') ? synth.on() : synth.sounding()),
  });

  const top = el('div', 'cc-top');
  top.append(picker.el, transport.el);
  const out = el('div', 'cc-stack');
  out.append(top, picRow, pair, bank.el, keysHost, pb.el);
  d.el.append(out);
  for (const [name, v] of Object.entries(step.preset)) {
    synth.setParam(KNOBS.find((x) => x.name === name).owner, name, v);
    knobs.get(name).set(knobRaw(name, v), { quiet: true });
  }
  apply(step.patch);
  window.__demo.synth = synth;
  d.ready();
</script>
