<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON concept 41</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .cc-stack { display: flex; flex-direction: column; gap: 12px; }
  .cc-top { display: flex; align-items: flex-end; gap: 12px; }
  .cc-top > .pos-bgroup { flex: none; width: auto; }
  /* The pad and the knob group side by side on a desk. The row wraps when the
     pad's own basis and the knob grid do not both fit, so a phone stacks them with
     no media query: the decision is the row's width, not the window's. */
  .cc-play { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
  .cc-pad { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .cc-play > .pos-kgrid { flex: none; }
</style>
<script type="module">
  import { conceptNav } from '/concepts/nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createKnob } from '/shell/knob.mjs';
  import { createKnobGrid } from '/shell/knob-grid.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { setSymbol } from '/shell/symbol.mjs';
  import { createWaveShape } from '/shell/synth-view.mjs';
  import { createXyPad } from '/shell/xy-pad.mjs';
  import { createSynth, KNOBS, PATCH, expo } from './modules.mjs';

  // /concepts/40/'s synth as one fixed patch, with an XY pad that plays the
  // filter. The pad is a bay node, `web:xy`, cabled to `web:filter:value-in`,
  // so every move is a `{ of: 'param' }` event through the bay and the cable
  // pulses with it.
  //
  // NOTHING OPENS ON A VISIT. The AudioContext is made on the first key or
  // play press; moving the pad before that only changes the filter's state.
  const d = mount({ name: 'concept 41', what: '', readout: null, index: '/concepts/', indexLabel: 'concepts' });
  conceptNav(41);

  const synth = createSynth({ log: (m, lv) => d.log(m, lv) });
  const { bay } = synth;
  const ID = synth.id;

  // ── one waveform, the output, as on /concepts/40/ ────────────────────────
  const WINDOW = 512, FULL = 0.5;
  const wave = createWaveShape({ reason: null, colour: '--hi', height: 120, name: '' });

  // ── the pad: x is cutoff, y is resonance ─────────────────────────────────
  // The pad's axes are positions, 0 to 1, and the page maps them, because
  // cutoff wants an exponential scale and the pad's axes are linear. y runs 1
  // at the top to 0 at the bottom, so resonance grows upward.
  // WebAudio's lowpass Q is in dB: 0 is no peak, 18 is a whistle.
  const CUT = expo(60, 8000), QMAX = 18;
  // Resolved here, above the pad: the pad paints once as it is made, and a
  // canvas font cannot read a CSS variable.
  const MONO = getComputedStyle(document.documentElement).getPropertyValue('--mono').trim() || 'monospace';
  const pad = createXyPad(el('div'), {
    label: 'filter',
    x: { label: 'cutoff', min: 0, max: 1 },
    y: { label: 'resonance', min: 1, max: 0 },
    onInput: (x, y) => {
      bay.send(ID('xy', 'value-out'), { of: 'param', name: 'cutoff', v: CUT.to(x) });
      bay.send(ID('xy', 'value-out'), { of: 'param', name: 'q', v: y * QMAX });
    },
    // The mark is where the filter is now, so it sits still between gestures.
    value: () => ({ x: CUT.from(synth.P.filter.cutoff), y: synth.P.filter.q / QMAX }),
    // The pad is the kit's (/draw/'s), 2x2 grid included; the axis names and
    // their ends are drawn here, through its overlay hook, in its own dim ink.
    overlay: (c, view) => labels(c, view),
  });
  function labels(c, { W, H, colors }) {
    c.save();
    c.fillStyle = colors.dim;
    c.font = `22px ${MONO}`;
    const I = 16;
    c.textBaseline = 'bottom';
    c.textAlign = 'left'; c.fillText('60 Hz', I, H - I);
    c.textAlign = 'center'; c.fillText('cutoff', W / 2, H - I);
    c.textAlign = 'right'; c.fillText('8 kHz', W - I, H - I);
    c.textBaseline = 'top';
    c.textAlign = 'left'; c.fillText('resonance', I, I);
    c.restore();
  }
  const padBox = el('div', 'cc-pad');
  padBox.append(pad.el);

  // ── the knobs: one node each, `web:knob-<name>`, a turn is one event ─────
  const knobs = new Map(KNOBS.map((k) => [k.name, createKnob({
    label: k.name, min: k.min, max: k.max, step: k.step, value: k.raw, format: k.format,
    onInput: (r) => bay.send(ID(`knob-${k.name}`, 'value-out'), { of: 'param', name: k.name, v: k.value(r) }),
  })]));
  // Three boxes across at most, so beside the pad they are one row.
  const grid = createKnobGrid(knobs, { cols: 3 });

  // The keys node has no keyboard on this page: play holds a note through it.
  const note = (n, v) => bay.send(ID('keys', 'midi-out'), { cls: 'note', ch: 1, d1: n, d2: v });

  // ── play: a held A2 into the same keys:midi-out, so the pad has something
  // to filter without holding a key. A key pressed over it plays that key and
  // the drone comes back when it is let go (the osc plays the last held). ──
  const DRONE = 45;
  let ctx = null, droning = false;
  function wake() {
    if (!ctx) { ctx = new AudioContext(); synth.start(ctx); synth.sound(true); requestAnimationFrame(frame); }
    ctx.resume();
  }
  const GLYPH = { play: '►', stop: '■' };
  const transport = createButtonGroup({ buttons: [
    { id: 'play', label: GLYPH.play, aria: 'play', onPress: () => drone(!droning) },
  ] });
  function drone(v) {
    if (v) wake();
    droning = v;
    note(DRONE, v ? 100 : 0);
    const b = transport.button('play');
    setSymbol(b, v ? GLYPH.stop : GLYPH.play);
    b.title = v ? 'stop' : 'play';
    b.setAttribute('aria-label', b.title);
  }

  function frame() {
    const buf = synth.sounding() ? synth.read() : null;
    if (buf) {
      let i0 = 0;
      for (let i = 1; i < buf.length - WINDOW; i++) if (buf[i - 1] < 0 && buf[i] >= 0) { i0 = i; break; }
      const win = buf.subarray(i0, i0 + WINDOW);
      wave.set({ points: Array.from(win, (v) => Math.max(-1, Math.min(1, v / FULL))), reason: '', name: '' });
    } else wave.set({ points: null, reason: null, name: '' });
    requestAnimationFrame(frame);
  }

  // ── the patchbay ─────────────────────────────────────────────────────────
  const pb = createPatchbay(bay, { flowing: () => synth.sounding() });

  const top = el('div', 'cc-top');
  top.append(transport.el);
  const play = el('div', 'cc-play');
  play.append(padBox, grid.el);
  const out = el('div', 'cc-stack');
  out.append(top, wave.el, play, pb.el);
  d.el.append(out);

  // The one patch.
  const bad = synth.load(PATCH);
  for (const b of bad) d.log(`${b.line} refused: ${b.why}`, 'warn');
  pb.refresh();
  window.__demo.synth = synth;
  window.__demo.pad = pad;
  window.__demo.drone = drone;
  window.__demo.knobs = grid;
  d.ready();
</script>
