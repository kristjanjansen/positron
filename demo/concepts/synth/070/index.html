<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON concept synth 070</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* Play at the left end, the patch selector at the right end, two children
     so a phone wraps them into two left-aligned lines. No status label: what
     the board says goes to the log (060's rule, asked 2026-10-11). */
  .cc-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .cc-top > .pos-bgroup { flex: none; width: auto; }
</style>
<script type="module">
  import { conceptNav } from '/concepts/nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createKnob } from '/shell/knob.mjs';
  import { createKnobGrid } from '/shell/knob-grid.mjs';
  import { createKeyboard, keyRange } from '/shell/keyboard.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { createWaveShape } from '/shell/synth-view.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createBoard } from '/shell/board.mjs';
  import { createLease } from '/shell/openers.mjs';
  import { BOARD_SITE, boardPort } from '/shell/graph-registry.mjs';

  // The keyboard, two knobs and a patch selector playing the Novation Circuit
  // that is plugged into the Raspberry Pi, the way /away/ reaches it: the Pi
  // carries the Circuit as an input in a room of its own (`studio-1-circuit`),
  // takes MIDI bytes there through its gate (rig/board/inputs.mjs `midiVerdict`)
  // and sends the Circuit's sound back down the same socket while a lease is
  // held.
  //
  // 🔴 NOTHING HERE CAN WRITE THE CIRCUIT'S FLASH. Notes, two synth control
  // changes and a program change on channel 1, patches 0 to 63, which selects
  // a synth patch into RAM. No SysEx, no session change on 16. The board's gate
  // refuses everything else whatever this page sends.
  //
  // NOTHING OPENS ON A VISIT. The board is made on the play press, never at
  // load. A check run sends nothing to the Circuit unless ?board=1 is added.
  const d = mount({ name: 'concept synth 070', what: '', readout: null, index: '/concepts/', indexLabel: 'concepts' });
  conceptNav('synth/070');

  const q = new URLSearchParams(location.search);
  const ROOM = q.get('room') || 'studio-1';
  const INPUT = 'circuit';
  const INPUT_ROOM = `${ROOM}-${INPUT}`;
  const MAY_PLAY = !SELFCHECK || q.get('board') === '1';
  // Synth 1 is channel 1 (plans/plan-circuit-model12.md §3.1). The gate allows
  // program change on 1 and 2 only, patches 0 to 63.
  const CH = 1;
  // From demo/shell/circuit-cc.mjs, Synth 1 & 2 filter: 74 frequency, 71
  // resonance. A knob sends only when it is turned, so a patch keeps its own
  // filter until somebody moves one.
  const KNOBS = [
    { name: 'cutoff', label: 'cutoff', cc: 74 },
    { name: 'resonance', label: 'reso', cc: 71 },
  ];
  // Nothing on this desk carries the Circuit's patch names as data, so a patch
  // is its number (as on /away/).
  const PATCHES = Array.from({ length: 64 }, (_, i) => `Patch ${i + 1}`);

  // ── the bay ─────────────────────────────────────────────────────────────
  // The Pi's ids are boardGraph's: `pi-1:circuit:midi-in` (announced while the
  // Circuit's USB MIDI is plugged into the Pi) and `pi-1:circuit:audio-out`.
  const S = 'web';
  const id = (n, p) => `${S}:${n}:${p}`;
  const CIRCUIT_IN = boardPort(INPUT, 'midi-in'), CIRCUIT_AUDIO = boardPort(INPUT, 'audio-out');
  const bay = createBay();
  bay.addNode({ id: `${S}:keys`, kind: 'person', label: 'keyboard', place: 'browser' });
  for (const k of KNOBS) bay.addNode({ id: `${S}:knob-${k.name}`, kind: 'person', label: `knob CC ${k.cc}`, place: 'browser' });
  bay.addNode({ id: `${S}:patch`, kind: 'person', label: 'patch', place: 'browser' });
  bay.addNode({ id: `${BOARD_SITE}:${INPUT}`, kind: 'device', label: 'Circuit on the Pi', place: ROOM });
  bay.addNode({ id: `${S}:scope`, kind: 'screen', label: 'waveform', place: 'browser' });
  bay.addNode({ id: `${S}:speaker`, kind: 'screen', label: 'speakers', place: 'browser' });

  let board = null, armed = false, lease = null;
  let sent = { note: 0, cc: 0, program: 0 }, refused = 0, lastRefusal = '', lastProgram = null;
  const midi = (bytes) => (armed && board ? board.send({ type: 'midi.send', bytes }) : false);
  // CCs are thinned to one per controller per 30 ms, and the last one always goes.
  const pendingCc = new Map();
  setInterval(() => {
    for (const [cc, v] of pendingCc) if (midi([0xB0 | (CH - 1), cc, v])) sent.cc++;
    pendingCc.clear();
  }, 30);
  // What reaches the Circuit's midi-in leaves for the board, and only once armed.
  function toCircuit(ev) {
    if (!armed) return;
    if (ev.cls === 'note') {
      if (midi(ev.d2 > 0 ? [0x90 | (CH - 1), ev.d1, ev.d2] : [0x80 | (CH - 1), ev.d1, 0])) sent.note++;
    } else if (ev.cls === 'cc') {
      pendingCc.set(ev.d1, ev.d2);
    } else if (ev.cls === 'program') {
      if (ev.d1 < 0 || ev.d1 > 63) return;
      lastProgram = [0xC0 | (CH - 1), ev.d1];
      if (midi(lastProgram)) { sent.program++; d.log(`Synth 1 on ${PATCHES[ev.d1]}`); }
    }
  }
  const PORTS = [
    { id: id('keys', 'midi-out'), dir: 'out', medium: 'midi', emits: ['note'] },
    ...KNOBS.map((k) => ({ id: id(`knob-${k.name}`, 'midi-out'), dir: 'out', medium: 'midi', emits: ['cc'] })),
    { id: id('patch', 'midi-out'), dir: 'out', medium: 'midi', emits: ['program'] },
    { id: CIRCUIT_IN, dir: 'in', medium: 'midi', accepts: ['note', 'cc', 'program'], deliver: toCircuit },
    { id: CIRCUIT_AUDIO, dir: 'out', medium: 'audio' },
    { id: id('scope', 'audio-in'), dir: 'in', medium: 'audio' },
    { id: id('speaker', 'audio-in'), dir: 'in', medium: 'audio' },
  ];
  for (const p of PORTS) bay.addPort({ label: p.id.split(':').slice(1).join(':'), ...p });
  const LINKS = [
    [id('keys', 'midi-out'), CIRCUIT_IN],
    ...KNOBS.map((k) => [id(`knob-${k.name}`, 'midi-out'), CIRCUIT_IN]),
    [id('patch', 'midi-out'), CIRCUIT_IN],
    [CIRCUIT_AUDIO, id('scope', 'audio-in')],
    [CIRCUIT_AUDIO, id('speaker', 'audio-in')],
  ];
  for (const [from, to] of LINKS) {
    const r = bay.link(from, to);
    if (!r.ok) d.log(`${from} -> ${to} refused: ${r.why}`, 'warn');
  }

  // ── the scope: an analyser on the board's playout, full width ────────────
  const WINDOW = 512, FULL = 0.25;
  const wave = createWaveShape({ reason: null, colour: '--hi', height: 120, name: '' });
  let analyser = null, buf = null, level = 0;
  function frame() {
    if (analyser) {
      analyser.getFloatTimeDomainData(buf);
      let i0 = 0, hi = 0;
      for (let i = 1; i < buf.length - WINDOW; i++) if (buf[i - 1] < 0 && buf[i] >= 0) { i0 = i; break; }
      for (const v of buf) { const a = v < 0 ? -v : v; if (a > hi) hi = a; }
      level = hi;
      const win = buf.subarray(i0, i0 + WINDOW);
      wave.set({ points: Array.from(win, (v) => Math.max(-1, Math.min(1, v / FULL))), reason: '', name: '' });
    }
    requestAnimationFrame(frame);
  }

  // ── the knobs, each its own node ─────────────────────────────────────────
  const knobs = new Map();
  for (const k of KNOBS) {
    const out = id(`knob-${k.name}`, 'midi-out');
    knobs.set(k.name, createKnob({
      label: k.label, min: 0, max: 127, step: 1, value: 64, home: 64, hand: true,
      onInput: (v) => bay.send(out, { cls: 'cc', ch: CH, d1: k.cc, d2: Math.round(v) }),
      onChange: (v) => bay.send(out, { cls: 'cc', ch: CH, d1: k.cc, d2: Math.round(v), end: true }),
    }));
  }
  const grid = createKnobGrid(knobs, { row: true });

  // ── the patch selector, its own node ─────────────────────────────────────
  // It opens empty: nothing says which patch the Circuit is on, so it shows
  // what this page last sent.
  let patchAt = null;
  function pickPatch(i) {
    patchAt = i;
    patchPick.show(PATCHES[i], i);
    bay.send(id('patch', 'midi-out'), { cls: 'program', ch: CH, d1: i });
  }
  const step = (by) => pickPatch(patchAt == null ? (by > 0 ? 0 : PATCHES.length - 1) : (patchAt + by + PATCHES.length) % PATCHES.length);
  const patchPick = createPicker({ what: 'patch', prev: () => step(-1), next: () => step(+1), onPick: (i) => pickPatch(i) });
  patchPick.options(PATCHES, 0);
  patchPick.show('');
  patchPick.disabled(true);

  // ── the keyboard ────────────────────────────────────────────────────────
  const host = el('div');
  const kb = createKeyboard(host, {
    ...keyRange(21), base: 48,
    onDown: (note, how) => { if (how === 'midi') return; bay.send(id('keys', 'midi-out'), { cls: 'note', ch: CH, d1: note, d2: 100 }); },
    onUp: (note, how) => { if (how === 'midi') return; bay.send(id('keys', 'midi-out'), { cls: 'note', ch: CH, d1: note, d2: 0 }); },
  });

  // ── play: join the Circuit's room, ask the board, hold the lease ─────────
  let saidLast = '';
  const say = (text, kind) => { saidLast = text; d.log(text, kind); };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  let opened = null, starting = false;

  function makeBoard() {
    let open;
    opened = new Promise((r) => { open = r; });
    board = createBoard({
      room: INPUT_ROOM, of: 'Raspberry Pi', showName: false, cushionMs: 80, maxCushionMs: 250,
      log: (line, kind) => d.log(line, kind),
      onOpen: () => open(true),
      onMessage: (m) => {
        if (m.type === 'midi.refused') { refused++; lastRefusal = m.why || ''; d.log(`the Pi refused a message for the Circuit: ${m.why}`, 'warn'); }
      },
    });
  }

  async function start() {
    if (starting) return;
    starting = true;
    try {
      if (!board) makeBoard();
      say(`Reaching ${INPUT_ROOM}`);
      const up = await Promise.race([opened, wait(8000).then(() => false)]);
      if (!up) { say(`The relay did not open ${INPUT_ROOM} within eight seconds, so nothing is playing`, 'warn'); return; }
      await board.startAudio();
      const pl = board.playout();
      if (pl && !analyser) {
        analyser = board.ctx().createAnalyser();
        analyser.fftSize = 2048;
        buf = new Float32Array(analyser.fftSize);
        pl.connect(analyser);
        requestAnimationFrame(frame);
      }
      if (!MAY_PLAY) { say('A check is running, so nothing was sent to the Circuit. Add ?board=1 to let it through', 'warn'); return; }
      const st = await board.ask({ type: 'audio.status' }, 'audio.started', 6000);
      if (!st) { say(`The Raspberry Pi is not answering in ${INPUT_ROOM}, so the keys and knobs go nowhere`, 'warn'); return; }
      lease = createLease({ ask: (m, r, t) => board.ask(m, r, t), what: 'the Circuit capture', log: (line, kind) => d.log(line, kind) });
      armed = true;
      patchPick.disabled(false);
      say('The Circuit on the Raspberry Pi, play the keys');
      transport.setIcon('play', 'stop', 'stop');
    } finally { starting = false; }
  }
  function stop() {
    if (armed && board) board.send({ type: 'midi.panic' });
    armed = false;
    lease?.stop(); lease = null;
    pendingCc.clear();
    kb.panic?.();
    patchPick.disabled(true);
    transport.setIcon('play', 'play', 'play');
    say('Stopped, every note on the Circuit was released');
  }
  addEventListener('pagehide', () => { if (armed && board) board.send({ type: 'midi.panic' }); });

  const transport = createButtonGroup({ buttons: [
    { id: 'play', icon: 'play', label: 'play', onPress: () => (armed ? stop() : start()) },
  ] });

  // ── the patchbay ────────────────────────────────────────────────────────
  const sounding = () => armed && level > 0.002;
  const pb = createPatchbay(bay, { room: ROOM,
    flowing: (l) => (l.from === CIRCUIT_AUDIO ? sounding() : armed),
  });
  setInterval(() => pb.refresh?.(), 500);

  const top = el('div', 'cc-top');
  top.append(transport.el, patchPick.el);
  d.stack.add(top, wave.el, grid.el, host, pb.el);
  window.__demo.bay = bay;
  // What this page hears from the Pi, for a driver. Reads only.
  window.__demo.probe = () => ({
    armed, level, said: saidLast, sent: { ...sent }, refused, lastRefusal, lastProgram,
    lease: lease ? lease.last() : null, stats: board ? board.stats() : null,
  });
  d.ready();
</script>
