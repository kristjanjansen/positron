<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>MIDI dump</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .md-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
</style>
<script type="module">
  import { conceptNav } from '/concepts/nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createBay, CLASSES } from '/shell/bay.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createTable } from '/shell/table.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createKeyboard, keyRange } from '/shell/keyboard.mjs';
  import { openWire } from '/shell/wire.mjs';
  import { BOARD_SITE } from '/shell/graph-registry.mjs';
  import { decode } from '/shell/midi-decode.mjs';
  import { kindOfDecoded } from '/shell/midi-kinds.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';

  /* What this page is: every MIDI message as its raw bytes beside a plain
     reading, in one table, and the table is ONE box in the patchbay that every
     MIDI source is wired into. Asked 2026-10-12: *"130 syntg do concept for
     midi dump. midi table is a box all midis are connected to it including pi
     ones"*. The decoding is `/dump/`'s, from `midi-decode.mjs`, not a copy.

     🔴 IT ONLY LISTENS. No SysEx and nothing that writes to a device, here or
     on the Pi (CLAUDE.md, the Circuit rule): `/dump/`'s device inquiry is a
     SysEx write and is not on this page. The one message this page sends
     anywhere is `graph.ask` to the Pi's room, which reads the board's graph.

     🔴 A VISIT OPENS NOTHING. Web MIDI is asked for on Listen, the relay on
     Pi, and both are presses. */

  const d = mount({
    name: 'MIDI dump', what: '', index: '/concepts/', indexLabel: 'concepts',
    // A concept page with a readout shows it on top: *"yeah when concept has
    // readout move to top"* (positron-concepts).
    joined: false,
    readout: { messages: '', sources: '', kinds: '', floods: '' },
  });
  conceptNav('synth/130');

  const S = 'web';
  const DUMP_IN = `${S}:dump:midi-in`;
  const KEYS_OUT = `${S}:keys:midi-out`;
  const PI_ROOM = 'studio-1';

  // ── the counts ─────────────────────────────────────────────────────────
  let t0 = 0, shown = 0, floods = 0;
  const kinds = new Set(), sources = new Set();
  function render() {
    d.set('messages', shown || '');
    d.set('sources', sources.size || '');
    d.set('kinds', kinds.size || '');
    d.set('floods', floods || '');
  }

  // ── the table ──────────────────────────────────────────────────────────
  // `/dump/`'s traffic columns plus `from`, because this table has more than
  // one source and the source is the point of the patchbay under it. The bytes
  // come right after the time, so a phone (375 px) shows them without a
  // sideways scroll; `from` and `ch` are read after a row is found.
  const table = createTable({
    columns: [
      { key: 'at', label: 'at', width: 56, align: 'right' },
      { key: 'bytes', label: 'bytes', width: 104, hi: true },
      { key: 'what', label: 'what', width: 96 },
      { key: 'reading', label: 'reading', grow: true, clip: true },
      { key: 'from', label: 'from', width: 112, clip: true, hover: 'fromAll' },
      { key: 'ch', label: 'ch', width: 34, align: 'right' },
    ],
    cap: 400, stick: true, minRows: 12, note: 'hover',
  });

  /** One decoded message into the table. `from` is a bay port id or a room line. */
  function row(m, from) {
    const now = performance.now();
    if (!t0) t0 = now;
    shown++;
    kinds.add(m.kind);
    sources.add(from);
    const short = from.split(':').slice(0, 2).join(':');
    table.add({
      at: `${((now - t0) / 1000).toFixed(2)}s`,
      from: short, fromAll: from,
      ch: m.ch ?? '',
      what: m.what,
      bytes: m.bytes,
      reading: m.reading,
    });
    render();
  }

  // ── the bay: one table box, every source wired into it ─────────────────
  const bay = createBay();
  bay.addNode({ id: `${S}:keys`, kind: 'person', label: 'keyboard', place: 'browser' });
  bay.addNode({ id: `${S}:dump`, kind: 'screen', label: 'MIDI table', place: 'browser' });
  bay.addPort({ id: KEYS_OUT, dir: 'out', medium: 'midi', emits: ['note'] });
  bay.addPort({ id: DUMP_IN, dir: 'in', medium: 'midi', accepts: [...CLASSES],
    deliver: (e, _l, meta) => row(decode(e.bytes), meta.from) });
  const lay = (from, to, opts = {}) => {
    const r = bay.link(from, to, [], { site: S, ...opts });
    if (!r.ok) d.log(`${from} -> ${to} refused: ${r.why}`, 'warn');
    return r.ok ? r.id : null;
  };
  lay(KEYS_OUT, DUMP_IN);

  /**
   * A message from a source port into the table, through the bay.
   * Clock and active sensing are floods (`midi-decode.mjs` `isFlood`): 48 a
   * second at 120 bpm, three a second for ever. They are counted, never listed,
   * as `/dump/` does, or they bury the one message somebody pressed a key to see.
   * A message the bay has no class for (an undefined system byte) goes straight
   * in, so nothing that arrived is lost on the way to the table.
   */
  let sent = 0;
  function feed(portId, bytes) {
    const m = decode(bytes);
    if (m.flood) { floods++; render(); return; }
    const cls = kindOfDecoded(m);
    if (cls === 'other') { row(m, portId); return; }
    sent++;
    bay.send(portId, { cls, ch: m.ch ?? 0, d1: m.d1 ?? 0, d2: m.d2 ?? 0, bytes: Array.from(bytes) });
  }

  // ── devices plugged in here: Web MIDI, on Listen ──────────────────────
  const plugged = new Set();      // web:midi-N node ids plugged in now
  const slots = new Map();        // Web MIDI port id -> node id
  const devLinks = new Map();     // node id -> link id
  const wired = new WeakSet();
  let access = null;
  const slotFor = (p) => {
    if (!slots.has(p.id)) slots.set(p.id, `${S}:midi-${slots.size + 1}`);
    return slots.get(p.id);
  };
  async function plug(p) {
    const node = slotFor(p);
    if (plugged.has(node)) return;
    if (!bay.node(node)) {
      bay.addNode({ id: node, kind: 'device', label: p.name || 'MIDI device', place: 'browser' });
      bay.addPort({ id: `${node}:midi-out`, dir: 'out', medium: 'midi', emits: [...CLASSES] });
    }
    devLinks.set(node, lay(`${node}:midi-out`, DUMP_IN));
    plugged.add(node);
    // `/dump/` measured that assigning `onmidimessage` alone can leave a port
    // closed and silent, so it is opened explicitly.
    try { await p.open(); } catch (e) { d.log(`could not open ${p.name}: ${e.message}`, 'warn'); }
    if (!wired.has(p)) { p.addEventListener('midimessage', (e) => { if (plugged.has(slotFor(p))) feed(`${slotFor(p)}:midi-out`, e.data); }); wired.add(p); }
    d.log(`MIDI in: ${p.name || 'unnamed port'} as ${node}`);
  }
  function unplug(node) {
    const id = devLinks.get(node);
    if (id) bay.unlink(id);
    plugged.delete(node); devLinks.delete(node);
    d.log(`MIDI in gone: ${bay.node(node)?.label || node}`);
  }
  async function devices() {
    const now = new Set();
    for (const p of access.inputs.values()) if (p.state !== 'disconnected') { await plug(p); now.add(slotFor(p)); }
    for (const node of [...plugged]) if (!now.has(node)) unplug(node);
    pb.refresh();
    return now.size;
  }
  async function listen() {
    if (access) return devices();
    if (!navigator.requestMIDIAccess) { d.log('this browser has no Web MIDI, so only the keys and the Pi can feed the table', 'warn'); return 0; }
    try {
      access = await navigator.requestMIDIAccess({ sysex: false });
    } catch (e) { d.log(`MIDI was refused: ${e.message}`, 'warn'); return 0; }
    access.onstatechange = () => devices();
    const n = await devices();
    d.log(n ? `${n} MIDI input${n === 1 ? '' : 's'} here, wired into the table` : 'no MIDI inputs here. Plug one in and it appears.', n ? 'hi' : '');
    return n;
  }

  // ── the Pi: its MIDI ports from its graph, and what its room carries ──
  /*
   * 🔴 WHAT THE PI GIVES TODAY, READ 2026-10-12 FROM `rig/board/` AND FROM ONE
   * `graph.ask` ON studio-1. The board announces its MIDI ports in the graph
   * on every `board.alive` (`graph-registry.mjs` `boardGraph`): one source,
   * `pi-1:midi-fasttrack-pro:midi-out`, and three ins, `synth`, `yoshimi` and
   * `sampler`. It does NOT forward a single MIDI byte it receives: the
   * FastTrack Pro is read by `aseqdump` only inside the `synth` source
   * (`board.mjs` `alsaNotes`) and goes nowhere else. So the Pi's source boxes
   * are wired into the table over the relay and nothing arrives on them. What
   * IS readable is what the Pi RECEIVES: the relay hands every message to every
   * socket in the room (`workers/relay` `webSocketMessage`), so `note.on`,
   * `note.off`, `cc` and `midi.send` that any page sends the Pi land here too,
   * and are listed as bytes.
   * ⚠️ MISSING, AND IT IS ONE VERB ON THE BOARD: forward what `aseqdump` (or a
   * raw read of `/dev/snd/midiC*`) receives on each ALSA in port to the room as
   * JSON bytes, `{ type: 'midi.in', port, bytes }`. Then the wire drawn here
   * carries and this page needs no change but a case in `fromRoom`.
   * ⚠️ AND JOINING THE ROOM IS NOT FREE: while the Pi streams sound it sends
   * about 50 binary frames a second to every socket in studio-1, this one
   * included. Pressing Pi again leaves.
   */
  const piPorts = new Set();       // pi-1 MIDI out port ids announced now
  const piLinks = new Map();       // port id -> link id
  const piNodes = new Set();       // pi-1 node ids announced now
  const wires = new Map();         // room -> wire
  let piGraph = null, roomSeen = 0;

  const label = (g, nodeId) => g.nodes.find((n) => n.id === nodeId)?.label || nodeId.split(':')[1];
  function applyGraph(g) {
    if (g?.site !== BOARD_SITE || !Array.isArray(g.ports)) return;
    const first = !piGraph;
    piGraph = g;
    const outs = g.ports.filter((p) => p.medium === 'midi' && p.dir === 'out');
    const now = new Set(outs.map((p) => p.id));
    piNodes.clear();
    for (const p of outs) {
      const nodeId = p.id.split(':').slice(0, 2).join(':');
      piNodes.add(nodeId);
      if (!bay.node(nodeId)) bay.addNode({ id: nodeId, kind: 'device', label: label(g, nodeId), place: g.place || PI_ROOM });
      if (!bay.port(p.id)) bay.addPort({ id: p.id, dir: 'out', medium: 'midi', emits: p.emits?.length ? p.emits : [...CLASSES] });
      if (!piLinks.has(p.id)) piLinks.set(p.id, lay(p.id, DUMP_IN, { via: 'relay' }));
    }
    for (const id of [...piPorts]) if (!now.has(id)) { const l = piLinks.get(id); if (l) bay.unlink(l); piLinks.delete(id); }
    piPorts.clear(); for (const id of now) piPorts.add(id);
    // A MIDI in on the Pi that lives in a room of its own (an input such as
    // the Circuit, `<room>-<name>`) is listened to as well.
    for (const p of g.ports) if (p.medium === 'midi' && p.dir === 'in' && p.address && !wires.has(p.address)) join(p.address);
    if (first) {
      const ins = g.ports.filter((p) => p.medium === 'midi' && p.dir === 'in').map((p) => p.id);
      d.log(`the Pi announces ${outs.length} MIDI source${outs.length === 1 ? '' : 's'} (${outs.map((p) => p.id).join(', ') || 'none'}) and ${ins.length} MIDI in${ins.length === 1 ? '' : 's'} (${ins.join(', ') || 'none'})`, 'hi');
      d.log('the Pi forwards none of the bytes its MIDI sources receive, so their wires stay empty. What other pages send the Pi is listed.');
    }
    pb.refresh();
  }

  /** A message somebody sent the Pi, as the MIDI bytes it stands for, or null. */
  const b7 = (v) => Math.max(0, Math.min(127, Math.round(Number(v) || 0)));
  const ch0 = (m) => Math.max(0, Math.min(15, Math.round(Number(m.channel) || 0)));
  function toBytes(m) {
    switch (m.type) {
      case 'note.on': return [0x90 | ch0(m), b7(m.note), b7(m.vel ?? 100)];
      case 'note.off': return [0x80 | ch0(m), b7(m.note), 0];
      case 'cc': return [0xB0 | ch0(m), b7(m.ctrl), b7(m.value)];
      case 'midi.send': return Array.isArray(m.bytes) && m.bytes.every((x) => Number.isInteger(x) && x >= 0 && x <= 255) ? m.bytes : null;
      default: return null;
    }
  }
  function fromRoom(room, got, me) {
    if (got.kind !== 'json') return;
    const m = got.msg;
    if (m.from === me()) return;
    if (m.graph) { applyGraph(m.graph); return; }
    const bytes = toBytes(m);
    if (!bytes?.length) return;
    roomSeen++;
    const m2 = decode(bytes);
    if (m2.flood) { floods++; render(); return; }
    const to = m.type === 'midi.send' ? `${room}` : `${BOARD_SITE}:${m.node || 'instrument'}`;
    row(m2, `to ${to}, ${m.type} sent by ${m.by || 'page'} ${String(m.from || '').slice(0, 4)}`);
  }
  function join(room) {
    let from = null;
    const w = openWire(room, {
      onOpen: (f) => { from = f; if (room === PI_ROOM) w.send({ type: 'graph.ask' }); },
      onMessage: (got) => fromRoom(room, got, () => from),
    });
    wires.set(room, w);
  }
  function leave() {
    for (const w of wires.values()) w.close();
    wires.clear();
    piNodes.clear();
    for (const id of piLinks.values()) if (id) bay.unlink(id);
    piLinks.clear(); piPorts.clear(); piGraph = null;
    pb.refresh();
    d.log('left the Pi\'s room');
  }

  // ── the page ───────────────────────────────────────────────────────────
  const shownNode = (id) => {
    const node = id.split(':').slice(0, 2).join(':');
    if (node.startsWith(`${S}:midi-`)) return plugged.has(node);
    if (node.startsWith(`${BOARD_SITE}:`)) return piNodes.has(node);
    return true;
  };
  const pb = createPatchbay({
    nodes: () => bay.nodes().filter((n) => shownNode(n.id)),
    ports: () => bay.ports().filter((p) => shownNode(p.id)),
    links: () => bay.links(),
  }, { room: PI_ROOM });

  const group = createButtonGroup({
    buttons: [
      { id: 'listen', label: 'Listen', title: 'ask this browser for the MIDI devices plugged in here', onPress: () => listen() },
      { id: 'pi', label: 'Pi', title: 'join the Pi\'s room and read its MIDI ports', onPress: (b) => {
        if (wires.size) { leave(); b.textContent = 'Pi'; return; }
        join(PI_ROOM); b.textContent = 'Leave Pi';
        d.log('joined studio-1, asking the Pi for its graph');
      } },
    ],
  });

  const clearRow = el('div', 'kpad');
  const clearBtn = el('button', 'kpad-right', 'Clear');
  clearBtn.type = 'button';
  clearBtn.title = 'empty the table and the counts';
  clearBtn.addEventListener('click', () => {
    table.clear(); t0 = 0; shown = 0; floods = 0; kinds.clear(); sources.clear(); render();
  });
  clearRow.append(clearBtn);

  const host = el('div');
  const kb = createKeyboard(host, {
    ...keyRange(21), base: 48,
    onDown: (note, how) => { if (how === 'midi') return; feed(KEYS_OUT, [0x90, note, 100]); },
    onUp: (note, how) => { if (how === 'midi') return; feed(KEYS_OUT, [0x80, note, 0]); },
  });

  const row1 = el('div', 'md-row');
  row1.append(group.el);
  d.stack.add(row1, table.el, clearRow, host, pb.el);

  window.__demo.dump = {
    bay, table, keyboard: kb,
    shown: () => shown, floods: () => floods, sent: () => sent,
    piGraph: () => piGraph, piPorts: () => [...piPorts], roomSeen: () => roomSeen,
    rooms: () => [...wires.keys()], midiAsked: () => !!access,
  };
  /* Checks only behind ?selfcheck=1, never for a visitor, and they open
     nothing: no Web MIDI, no relay. */
  if (SELFCHECK) {
    d.assert('a visit opened no relay socket', wires.size === 0, `${wires.size} rooms`);
    d.assert('a visit asked for no Web MIDI', access === null);
    d.assert('the table is one box with the keys wired into it',
      bay.links().some((l) => l.from === KEYS_OUT && l.to === DUMP_IN));
    feed(KEYS_OUT, [0x90, 60, 100]); feed(KEYS_OUT, [0x80, 60, 0]); feed(KEYS_OUT, [0xF8]);
    d.assert('two key presses are two rows, and a clock byte is counted not listed',
      shown === 2 && floods === 1, `${shown} rows, ${floods} floods`);
    table.clear(); t0 = 0; shown = 0; floods = 0; kinds.clear(); sources.clear(); render();
  }
  d.ready();
</script>
