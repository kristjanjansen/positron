<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON concept synth 050</title>
<link rel="stylesheet" href="/shell/shell.css">
<script type="module">
  import { conceptNav } from '/concepts/nav.mjs';
  import { mount } from '/shell/shell.mjs';
  import { modulePage } from '/concepts/synth/module-page.mjs';

  // One module, a low-pass filter, between the keys' oscillator and the
  // speakers. A sawtooth, because a filter is inaudible on a sine, which has no
  // overtones to take away. Split out of synth/040 on 2026-10-13, where it was
  // step 4; the voice is ../patch-synth.mjs and the page is ../module-page.mjs.
  const d = mount({ name: 'concept synth 050', what: '', readout: null, index: '/concepts/', indexLabel: 'concepts' });
  conceptNav('synth/050');
  modulePage(d, {
    patch: `web:keys:midi-out -> web:osc:midi-in
web:osc:audio-out -> web:filter:audio-in
web:filter:audio-out -> web:speaker:audio-in
web:filter:audio-out -> web:scope:audio-in`,
    knobs: ['cutoff', 'q'],
    preset: { wave: 'sawtooth', cutoff: 800 },
  });
  d.ready();
</script>
