<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* concepts room/001, THE CHAT AS UI ONLY, 2026-10-11. Asked: *"room 001 is ui
     only. looks like slide frame or videopanel, contains room name and
     fullscreen button. inside, there is a ~ 1/3 right sidebar + chat compose
     window (autogrow, send icon in right bottom corner). below are parts of
     the chat, listed kit-style"*. Nothing here opens a socket: a sent line
     lands in this tab only. */

  /* The chat's pieces are the kit's, demo/shell/chat-ui.mjs (asked 2026-10-11,
     *"(make it reusable) as all chat ui elements"*). Only the part cards are
     the page's. */
  .rc-part { background: var(--card); border: var(--edge, 1px solid var(--line));
             border-radius: var(--r, 4px); display: flex; flex-direction: column; }
  .rc-part.msgs { height: 220px; }
</style>
<script type="module">
  import { conceptNav } from '/concepts/nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createChatLog, createChatCompose, createChatColumn, createChatWindow } from '/shell/chat-ui.mjs';

  const d = mount({ name: 'concept room 001', what: '', readout: null, index: '/concepts/', indexLabel: 'concepts' });
  conceptNav('room/001');

  const ROOM = 'chat-1';
  const now = Date.now();
  const SAMPLE = [
    { who: 'web-2qm', at: now - 180000, text: 'Is the Pi up today?' },
    { who: 'web-7zd', at: now - 120000, text: 'It answered a minute ago. Yoshimi is loaded.' },
    { who: 'web-2qm', at: now - 60000, text: 'Good. Patching the keys to it now.' },
  ];
  const logOf = (rows) => { const l = createChatLog(); for (const r of rows) l.add(r); return l; };

  // ── the frame: UI only, a sent line lands in this tab ──────────────────
  const list = logOf(SAMPLE);
  const box = createChatCompose({ placeholder: `Message ${ROOM}`, onSend: (text) => list.add({ who: 'you', at: Date.now(), text, me: true }) });
  const panel = createChatWindow({ columns: [createChatColumn({ body: list, compose: box })] });
  d.stack.add(panel.el);
  // The frame's compose box takes the focus on load (asked 2026-10-11, *"autofocus compose input"*).
  box.enable(true);

  // ── the parts, listed ──────────────────────────────────────────────────
  const msgPart = el('div', 'rc-part');
  msgPart.append(logOf([SAMPLE[1]]).el);
  d.stack.titled('MESSAGE', msgPart);

  const msgsPart = el('div', 'rc-part msgs');
  msgsPart.append(logOf(SAMPLE).el);
  d.stack.titled('MESSAGES', msgsPart);

  const composePart = el('div', 'rc-part');
  const partBox = createChatCompose({ placeholder: `Message ${ROOM}`, onSend: (text) => d.log(`send: ${text}`) });
  partBox.enable(true);
  composePart.append(partBox.el);
  d.stack.titled('COMPOSE', composePart);
  box.input.focus({ preventScroll: true });

  d.ready();
</script>
