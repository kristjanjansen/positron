<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON concept 003</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .cc-row { display: flex; flex-wrap: wrap; align-items: end; gap: var(--ctl-gap, 8px); }
  .cc-row > .pos-field { flex: 1 1 260px; min-width: 0; }
  /* The same medium colours and live dot as /concepts/bay/000/. */
  :root {
    --md-midi: #6fb8e8; --md-audio: #ee9a4d; --md-clock: #c9ced6; --md-value: #9ad16b;
    --md-video: #e07a5f; --md-program: #c39af0; --md-file: #d68fc6; --md-state: #8a9fc4;
  }
  .md-midi { color: var(--md-midi); } .md-audio { color: var(--md-audio); }
  .md-clock { color: var(--md-clock); } .md-value { color: var(--md-value); }
  .md-video { color: var(--md-video); } .md-program { color: var(--md-program); }
  .md-file { color: var(--md-file); } .md-state { color: var(--md-state); }
  .pos-tbl-c .pos-pres-dot { display: inline-block; vertical-align: middle; }
  .cc-ring::after { content: none; }
</style>
<script type="module">
  import { conceptNav } from '/concepts/nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createTable } from '/shell/table.mjs';
  import { createField } from '/shell/field.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createIconButton } from '/shell/icon-button.mjs';
  import { createBay, printLink } from '/shell/bay.mjs';
  import { createBayNode, randomSite, ROOM_RE } from '/shell/bay-node.mjs';
  import { heldPicture } from '/shell/bay-view.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';

  // The smallest multi-user chat built from patchbay blocks
  // (plans/plan-site-names.md §4h). Every tab is a SITE with one NODE and two
  // PORTS of medium `value`, shaped `of: text`. It holds two `*` LINKS: a speaker,
  // `<me>:chat:value-out -> *:chat:value-in`, and a listener, `*:chat:value-out -> <me>:chat:value-in`.
  // A line crosses the room as one `bay.event`, and the receiving bay delivers it
  // only along the listener link. No chat code beyond drawing.
  // Its own room, never studio-1, so nothing lands on the studio's desk.
  const asked = new URLSearchParams(location.search).get('room');
  const ROOM = asked && ROOM_RE.test(asked) ? asked : 'chat-1';
  const SITE = randomSite('web');
  const OUT = `${SITE}:chat:value-out`, IN = `${SITE}:chat:value-in`;
  const SELF = {
    v: 1, site: SITE, place: 'browser', kind: 'browser', label: 'browser',
    nodes: [{ id: `${SITE}:chat`, kind: 'person', label: 'chat', place: 'browser' }],
    ports: [
      { id: OUT, label: 'chat', dir: 'out', medium: 'value', shape: { of: 'text' } },
      { id: IN, label: 'chat', dir: 'in', medium: 'value', shape: { of: 'text' } },
    ],
  };

  const d = mount({ name: 'concept room 000', what: '', readout: null, index: '/concepts/', indexLabel: 'concepts' });
  conceptNav('room/000');

  const lines = createTable({
    columns: [
      { key: 'who', label: 'who', width: 96 },
      { key: 'text', label: 'line', grow: true, hi: true },
      { key: 'ago', label: 'when', width: 72 },
      { key: 'link', label: 'link', width: 220, clip: true, hover: 'why' },
    ],
    minRows: 4,
    stick: true,
  });
  const said = [];
  // The patchbay picture, made once the node exists (at the foot of the page).
  let pb = null;
  // How long ago, from the send stamp the relay envelope carries (`sent`).
  const ago = (at) => {
    const s = Math.max(0, Math.round((Date.now() - at) / 1000));
    if (s < 10) return 'now';
    if (s < 60) return `${s} s ago`;
    if (s < 3600) return `${Math.floor(s / 60)} min ago`;
    if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
    return `${Math.floor(s / 86400)} d ago`;
  };
  const draw = () => lines.set(said.map((r) => ({ ...r, ago: ago(r.at) })));
  setInterval(() => { if (said.length) draw(); }, 30000);
  const short = (site) => site === SITE ? 'you' : `browser ${site.replace(/^web-/, '')}`;

  const SPEAK = `${OUT} -> *:chat:value-in`;
  // The bay as it stands now: everybody heard, this tab's in-port able to
  // deliver, and the two links this tab holds.
  function bay() {
    const b = node.registry.fill(createBay());
    b.addPort({ ...b.port(IN), deliver: heard });
    b.link(OUT, '*:chat:value-in');
    b.link('*:chat:value-out', IN);
    return b;
  }
  const node = createBayNode({
    room: ROOM, graphs: [SELF], bay,
    log: (line, kind) => d.log(line, kind),
    onJoin: () => { join.button('join').disabled = true; text.disabled(false); send.el.disabled = false; text.input.focus(); drawSites(); pb?.refresh(); },
    onGraph: () => { drawSites(); pb?.refresh(); },
    onEvent: (m, n) => { if (n < 0) d.log(`refused a line said as ${m.source} by a socket that never announced it`, 'warn'); },
  });

  // Called by the bay, only along the listener link.
  function heard(e, l, m) {
    pb?.pulse(l.from, l.to);
    said.push({ at: Number(m.sent) || Date.now(), who: short(String(m.from).split(':')[0]), text: String(e.text || ''),
      link: `${m.from} -> ${m.to}`, why: `delivered along the link you hold, ${printLink(l)}` });
    draw();
  }

  const text = createField({ label: 'line', placeholder: 'say something', grow: 'wide' });
  text.disabled(true);
  function say() {
    const t = text.value().trim();
    if (!t) return;
    const r = node.emit(OUT, { text: t });
    if (r.sent) pb?.pulse(OUT, '*:chat:value-in');
    said.push({ at: Date.now(), who: 'you', text: t, link: SPEAK,
      why: r.far.length ? r.far.map((to) => `${OUT} -> ${to}`).join('\n') : 'nobody else in the room' });
    draw();
    text.set('');
  }
  text.input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); say(); } });
  // The kit's send icon, an ordinary button rather than the primary (asked
  // 2026-10-11, *"use send iconbutton on 000 secondary"*).
  const send = createIconButton({ icon: 'send', label: 'Send', onPress: say });
  send.el.disabled = true;
  const join = createButtonGroup({ buttons: [{ id: 'join', label: `Join ${ROOM}`, onPress: () => node.join() }] });

  // Who is in the room: the registry, as /concepts/bay/000/ draws it. Port names are
  // shown as <medium>-<dir> (plans/plan-site-names.md §4c); the real id is on hover.
  const DIR = { in: '\u2192\u25CB', out: '\u25CB\u2192' };
  const sites = createTable({
    columns: [
      { key: 'state', label: '', width: 16 },
      { key: 'id', label: 'port', grow: true, hi: true, clip: true },
      { key: 'who', label: 'who', width: 120 },
      { key: 'dir', label: 'dir', width: 48 },
      { key: 'medium', label: 'medium', width: 72 },
      { key: 'by', label: 'transport', width: 120 },
    ],
    minRows: 4,
  });
  function drawSites() {
    const rows = node.registry.merged().ports.map((p) => {
      const [site, n] = p.id.split(':');
      return { state: p.stale ? 'stale' : 'live', id: `${site}:${n}:${p.medium}-${p.dir}`,
        who: short(site), dir: DIR[p.dir] || p.dir, medium: p.medium, by: (p.transports || []).join(', ') };
    }).sort((a, b) => (a.who === 'you' ? 0 : 1) - (b.who === 'you' ? 0 : 1) || a.id.localeCompare(b.id));
    sites.set(rows);
    for (const cell of sites.el.querySelectorAll('.pos-tbl-body .pos-tbl-c')) {
      const t = cell.textContent;
      if (t === 'live' || t === 'stale') {
        const dot = document.createElement('span');
        dot.className = 'pos-pres-dot' + (t === 'live' ? '' : ' cc-ring');
        dot.style.color = t === 'live' ? 'var(--ok)' : 'var(--dim2)';
        cell.textContent = '';
        cell.append(dot);
        cell.title = t;
      } else if (/^(midi|audio|clock|value|video|program|file|state)$/.test(t)) cell.classList.add(`md-${t}`);
    }
  }


  // ── the patchbay: the two `*` links this tab holds, read from bay() itself ──
  // Before Join it is drawn from this tab's own graph, which opens nothing. A
  // wire pulses when a line really left (the room took it) or arrived along it.
  pb = createPatchbay(heldPicture(bay, SITE),
    { detail: (n) => [{ text: n.id.startsWith('*:') ? n.label : 'chat box', sans: true }] });

  const row = el('div', 'cc-row');
  row.append(text.el, send.el);
  // Blocks in the shell's stack; a heading and its table are one block.
  d.stack.add(join.el, row, lines.el, pb.el);
  d.stack.titled('IN THE ROOM', sites.el);
  d.ready();
</script>
