<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>Camera drums</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* As /concepts/video/010/: the start button on its own row at the left, the
     camera on the left half and its pixels on the right, stacked on a phone. */
  .cc-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .cc-top > .pos-bgroup { flex: none; width: auto; }
  .cc-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 560px) { .cc-pair { grid-template-columns: minmax(0, 1fr); } }
  .cc-pair canvas { display: block; width: 100%; height: 100%; }
  .cc-say { font-size: 12px; color: var(--dim); }
  .pos-vp-foot .cc-say { white-space: nowrap; overflow: hidden; }
</style>
<script type="module">
  import { conceptNav } from '/concepts/nav.mjs';
  import { mount, el, armVideo } from '/shell/shell.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { drawCamera, FRAME_W, FRAME_H } from '/shell/pattern.mjs';
  import { createDrumMachine } from '/concepts/rhythm/drum-machine.mjs';
  import { VOICES } from '/concepts/rhythm/voices.mjs';

  // The drum machine played by a picture. Asked 2026-10-12: *"do 050 drums with
  // camera input and that pixelning shader you already have done on tv demos
  // but with the size that makes 16 squares per w and according squares per h
  // (4 ? 5? 6 ?). image sqares drive the drum grid. 1/2 camera image 1/2
  // pixelated one, below is drum grid. no knobs"*.
  //
  // THE SQUARES. The pictures are the panels' 16:9, the camera COVERED into it
  // (cropped, never squashed), so the frame is always 16 squares by 9 whatever
  // camera it is: a 4:3 webcam loses a strip top and bottom, and a phone held
  // upright still gives 16 by 9 rather than 16 by 28. A square is 80 px of the
  // 1280 px frame.
  //
  // NINE ROWS, FOUR DRUMS: FOUR ROWS ARE READ, AND THE PICTURE SAYS WHICH. Rows
  // 2, 4, 6 and 8 of the nine (counted from the top) are the kick, the snare,
  // the open hat and the closed hat, in the grid's own order, top to bottom;
  // the five rows between them are drawn dimmed. That keeps every square
  // square (the owner's ask) and makes the right panel and the grid ONE picture:
  // a lit square on a bright row is a lit pad, at the same column. Averaging
  // bands of rows into four would have broken that (a pad would be the mean
  // of 2.25 rows nobody can see), and 16 by 4 cells would not be squares.
  //
  // ON OR OFF IS THE SHADER'S OWN DITHER. Each square is one brightness, then
  // one threshold from a 4x4 Bayer matrix, as on /concepts/video/010/ and
  // /concepts/video/040/, each drum on a row of the matrix chosen for it
  // (`BAYER_ROW`). The grid reads the square back off the shader's own
  // pixels (lit or ground), so it cannot disagree with what is on screen. The
  // Bayer threshold changes square to square, which is what makes it a drum
  // pattern rather than a mask: a flat mid grey wall gives a regular pattern of
  // hits instead of all on or all off, and the brighter a region, the busier.
  //
  // ONCE A BAR, SO IT CAN BE PLAYED. The picture moves every frame; the grid
  // takes it once per bar, just before the first step of the bar is handed to
  // the engine, so each bar is a pattern you can hear whole. Hold still and the
  // groove holds; move and the next bar changes. While stopped it takes it
  // twice a second so the grid shows what play would start with.
  //
  // NO CLEAR AND NO PAD PRESSES: the grid is read only here, because the next
  // bar's picture would undo either within two seconds. The tempo stays.
  //
  // THE WIRES: camera video-out to the original and to `web:pixelate`, the
  // pixelate node's video-out to the right panel and its value-out (one whole
  // pattern a bar) to `web:sequencer:value-in`, then the sequencer to the four
  // drums and the drums to the speakers, as on /concepts/rhythm/000/.
  //
  // NOTHING OPENS ON A VISIT. The camera is asked for on its own press, the
  // engine on play's, and nothing leaves this machine.
  const d = mount({ name: 'Camera drums', what: '', readout: null, index: '/concepts/', indexLabel: 'concepts' });
  conceptNav('rhythm/050');

  const S = 'web';
  const ID = (node, port) => `${S}:${node}:${port}`;
  const CAM = ID('camera', 'video-out'), SCREEN = ID('screen', 'video-in');
  const PX_IN = ID('pixelate', 'video-in'), PX_OUT = ID('pixelate', 'video-out'), PX_VAL = ID('pixelate', 'value-out');
  const PIXELS = ID('pixels', 'video-in'), SEQ_IN = ID('sequencer', 'value-in');

  const COLS = 16, CELL = FRAME_W / COLS, ROWS = Math.round(FRAME_H / CELL);    // 80 px, 9 rows
  // The four rows read, spread evenly down the nine: 1, 3, 5, 7 from the top.
  const READ = VOICES.map((_, i) => Math.round((i + 0.5) * ROWS / VOICES.length - 0.5));
  // Which row of the 4x4 Bayer matrix each drum's squares are thresholded by,
  // in grid order. Read off the matrix, every four columns:
  //   row 0  thresholds 0 8 2 10    lights column 1 of each beat first: the kick, on the beat
  //   row 3  thresholds 15 7 13 5   lights the 4th then the 2nd sixteenth: the snare, late and sparse
  //   row 2  thresholds 3 11 1 9    lights the 3rd sixteenth first, the offbeat: the open hat
  //   row 1  thresholds 12 4 14 6   lights the 2nd and 4th sixteenths: the closed hat
  // So a dim picture plays a kick on every beat and an offbeat hat, and a
  // brighter one fills in. Without this the four read rows (1, 3, 5, 7) all fall
  // on the matrix's two high rows, and MEASURED on Chrome's fake camera the
  // kick row never lit at all.
  const BAYER_ROW = [0, 3, 2, 1];

  let cam = null, lastFrame = 0;
  const flowingVideo = () => !!cam && performance.now() - lastFrame < 500;
  const m = createDrumMachine(d, {
    voices: VOICES, patternIn: true,
    onBar: () => sendPattern(),
    flowing: (l, playing) => (l.from === CAM || l.from === PX_OUT || l.from === PX_VAL ? flowingVideo() : playing),
  });
  const bay = m.api.bay;

  // ── the camera and the pixelate nodes ───────────────────────────────────
  const camNode = (label) => bay.addNode({ id: `${S}:camera`, kind: 'device', label, place: 'browser' });
  camNode('camera');
  bay.addNode({ id: `${S}:pixelate`, kind: 'engine', label: '16 squares, dithered', place: 'browser' });
  bay.addNode({ id: `${S}:screen`, kind: 'screen', label: 'original', place: 'browser' });
  bay.addNode({ id: `${S}:pixels`, kind: 'screen', label: 'pixels', place: 'browser' });
  bay.addPort({ id: CAM, label: 'camera:video-out', dir: 'out', medium: 'video', transports: ['page'] });
  bay.addPort({ id: PX_IN, label: 'pixelate:video-in', dir: 'in', medium: 'video' });
  bay.addPort({ id: PX_OUT, label: 'pixelate:video-out', dir: 'out', medium: 'video', transports: ['page'] });
  bay.addPort({ id: PX_VAL, label: 'pixelate:value-out', dir: 'out', medium: 'value', shape: { of: 'pattern' } });
  bay.addPort({ id: SCREEN, label: 'screen:video-in', dir: 'in', medium: 'video' });
  bay.addPort({ id: PIXELS, label: 'pixels:video-in', dir: 'in', medium: 'video' });
  const lay = (a, b) => { const r = bay.link(a, b, [], { site: S }); if (!r.ok) d.log(`${a} -> ${b} refused: ${r.why}`, 'warn'); };
  lay(CAM, SCREEN); lay(CAM, PX_IN); lay(PX_OUT, PIXELS); lay(PX_VAL, SEQ_IN);
  m.api.refresh();
  const holds = (a, b) => bay.links().some((l) => l.from === a && l.to === b);

  // ── the original, as /concepts/video/000/ draws it, covered ─────────────
  const video = el('video');
  video.muted = true; video.playsInline = true; video.autoplay = true;
  const orig = el('canvas');
  orig.width = FRAME_W; orig.height = FRAME_H;
  const octx = orig.getContext('2d', { alpha: false });
  const name = el('span', 'cc-say', ''), size = el('span', 'cc-say', '');
  const panel = createVideoPanel({ media: orig, left: name });
  panel.el.querySelector('.pos-vp-r').prepend(size);
  const GROUND = '#0b0e14';
  function drawOrig() {
    if (cam && holds(CAM, SCREEN)) drawCamera(octx, video, FRAME_W, FRAME_H, { scrim: 0, fit: 'cover' });
    else { octx.fillStyle = GROUND; octx.fillRect(0, 0, FRAME_W, FRAME_H); }
  }

  // ── the pixels: /concepts/video/010/'s dither at 16 squares across ──────
  const canvas = el('canvas');
  canvas.width = FRAME_W; canvas.height = FRAME_H;
  // `preserveDrawingBuffer` so the squares can be read back at the bar, after
  // the frame that drew them has been shown.
  const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, preserveDrawingBuffer: true });
  const pxName = el('span', 'cc-say', ''), pxSize = el('span', 'cc-say', gl ? '' : 'no WebGL2');
  const pxPanel = createVideoPanel({ media: canvas, left: pxName });
  pxPanel.el.querySelector('.pos-vp-r').prepend(pxSize);
  const pair = el('div', 'cc-pair');
  pair.append(panel.el, pxPanel.el);

  let prog = null, tex = null; const U = {};
  if (gl) {
    const vs = `#version 300 es
      in vec2 p;
      void main() { gl_Position = vec4(p, 0.0, 1.0); }`;
    // As /concepts/video/010/, plus `uRead`: the four rows the drums read,
    // counted from the top. The other rows are drawn at a third, so the
    // picture says which squares are the pattern.
    const fs = `#version 300 es
      precision highp float;
      uniform sampler2D uTex; uniform vec2 uRes; uniform vec2 uFit;
      uniform float uHas; uniform float uSize; uniform float uRows; uniform vec4 uRead; uniform vec4 uBay;
      out vec4 o;
      const vec3 GROUND = vec3(0.043, 0.055, 0.078);
      const vec3 INK = vec3(0.92, 0.89, 0.82);
      const vec3 HI = vec3(1.0, 0.831, 0.0);
      const float M[16] = float[16](0., 8., 2., 10., 12., 4., 14., 6., 3., 11., 1., 9., 15., 7., 13., 5.);
      float bayer(vec2 c) { ivec2 i = ivec2(mod(c, 4.0)); return (M[i.x + i.y * 4] + 0.5) / 16.0; }
      vec3 src(vec2 frag) {
        vec2 uv = (frag / uRes - 0.5) / uFit + 0.5;
        if (uHas < 0.5 || any(lessThan(uv, vec2(0.0))) || any(greaterThan(uv, vec2(1.0)))) return vec3(0.0);
        return texture(uTex, uv).rgb;
      }
      void main() {
        vec2 cell = floor(gl_FragCoord.xy / uSize);
        float l = dot(src((cell + 0.5) * uSize), vec3(0.2126, 0.7152, 0.0722));
        l = smoothstep(0.04, 0.96, l);
        vec3 ink = mix(INK, HI, smoothstep(0.86, 1.0, l) * 0.55);
        float row = uRows - 1.0 - cell.y;
        // A read row takes its drum's own row of the Bayer matrix (uBay); the
        // rows between keep the plain dither, drawn at a third.
        float b = row == uRead.x ? uBay.x : row == uRead.y ? uBay.y : row == uRead.z ? uBay.z : row == uRead.w ? uBay.w : -1.0;
        vec3 dith = mix(GROUND, ink, step(bayer(b < 0.0 ? cell : vec2(cell.x, b)), l));
        o = vec4(b < 0.0 ? mix(GROUND, dith, 0.32) : dith, 1.0);
      }`;
    const sh = (t, src) => { const x = gl.createShader(t); gl.shaderSource(x, src); gl.compileShader(x); return x; };
    prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      d.log(`the shader did not compile: ${gl.getProgramInfoLog(prog)}`, 'bad');
      prog = null;
    }
    if (prog) {
      gl.useProgram(prog);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, 'p');
      gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      for (const u of ['uTex', 'uRes', 'uFit', 'uHas', 'uSize', 'uRows', 'uRead', 'uBay']) U[u] = gl.getUniformLocation(prog, u);
      tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.uniform1i(U.uTex, 0);
      gl.uniform2f(U.uRes, FRAME_W, FRAME_H);
      gl.uniform1f(U.uSize, CELL);
      gl.uniform1f(U.uRows, ROWS);
      gl.uniform4f(U.uRead, ...READ);
      gl.uniform4f(U.uBay, ...BAYER_ROW);
    }
  } else d.log('this browser has no WebGL2, so there are no squares and the grid stays empty', 'bad');

  let has = false;
  function render() {
    drawOrig();
    if (!gl) return;
    gl.viewport(0, 0, FRAME_W, FRAME_H);
    if (!prog || !holds(PX_OUT, PIXELS)) { gl.clearColor(11 / 255, 14 / 255, 20 / 255, 1); gl.clear(gl.COLOR_BUFFER_BIT); return; }
    has = !!cam && holds(CAM, PX_IN) && video.readyState >= 2 && video.videoWidth > 0;
    if (has) {
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, video);
      // COVERED, as the original is: the frame is filled and the camera's
      // extra is cropped, so there are always 16 by 9 squares.
      const va = video.videoWidth / video.videoHeight, ca = FRAME_W / FRAME_H;
      gl.uniform2f(U.uFit, va > ca ? va / ca : 1, va > ca ? 1 : ca / va);
    }
    gl.uniform1f(U.uHas, has ? 1 : 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  /** The four read rows, lit or not, off the shader's own pixels. */
  const px = new Uint8Array(4);
  function readPattern() {
    return READ.map((row) => Array.from({ length: COLS }, (_, c) => {
      gl.readPixels(c * CELL + CELL / 2, (ROWS - 1 - row) * CELL + CELL / 2, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
      return px[0] + px[1] + px[2] > 3 * 0.3 * 255 ? 1 : 0;
    }));
  }
  let sent = 0;
  function sendPattern() {
    if (!gl || !prog || !has) return;
    bay.send(PX_VAL, { of: 'pattern', rows: readPattern() });
    sent++;
  }

  // ── the camera, on its own press ────────────────────────────────────────
  let raf = 0, gen = 0, idle = 0;
  function frame() {
    if (!cam) return;
    render();
    // Stopped, the grid still shows what play would start with.
    if (!m.api.playing() && performance.now() - idle > 500) { idle = performance.now(); sendPattern(); }
    raf = requestAnimationFrame(frame);
  }
  function watchFrames() {
    if (typeof video.requestVideoFrameCallback !== 'function') return;
    const tick = () => { if (!cam) return; lastFrame = performance.now(); video.requestVideoFrameCallback(tick); };
    video.requestVideoFrameCallback(tick);
  }
  async function start() {
    const mine = ++gen;
    armVideo(video);
    let s;
    try {
      s = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: FRAME_W }, height: { ideal: FRAME_H }, frameRate: { ideal: 30 } }, audio: false,
      });
    } catch (e) {
      d.log(e?.name === 'NotAllowedError' ? 'the camera was refused'
        : e?.name === 'NotFoundError' ? 'this machine has no camera' : `the camera did not start (${e?.name || e})`, 'bad');
      face(false);
      return;
    }
    if (gen !== mine) { s.getTracks().forEach((t) => t.stop()); return; }
    cam = s;
    const track = cam.getVideoTracks()[0];
    const set = track.getSettings();
    video.srcObject = cam;
    video.play().catch(() => {});
    const label = (track.label || '').replace(/\s*\([0-9a-f]{4}:[0-9a-f]{4}\)\s*$/i, '');
    name.textContent = label;
    size.textContent = set.width && set.height ? `${set.width}x${set.height}` : '';
    pxName.textContent = 'pixels';
    pxSize.textContent = gl ? `${COLS} by ${ROWS}` : 'no WebGL2';
    camNode(label || 'camera');
    d.log(`camera on: ${track.label || 'default'} at ${set.width}x${set.height}`, 'hi');
    watchFrames();
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(frame);
    m.api.refresh();
    face(true);
  }
  function stop() {
    gen++;
    cam?.getTracks().forEach((t) => t.stop());
    cam = null;
    cancelAnimationFrame(raf);
    try { video.pause(); } catch { /* fine */ }
    video.srcObject = null;
    name.textContent = ''; size.textContent = ''; pxName.textContent = ''; pxSize.textContent = gl ? '' : 'no WebGL2';
    has = false;
    render();
    m.api.refresh();
    face(false);
    d.log('camera off, every track stopped; the grid keeps the last bar');
  }
  const camBtn = createButtonGroup({ buttons: [
    { id: 'cam', icon: 'video', label: 'start the camera', onPress: () => (cam ? stop() : start()) },
  ] });
  function face(on) { camBtn.setIcon('cam', on ? 'stop' : 'video', on ? 'stop the camera' : 'start the camera'); }
  render();

  const top = el('div', 'cc-top');
  top.append(camBtn.el);
  d.stack.add(top, pair, m.surface, m.patchbay);
  addEventListener('pagehide', () => { stop(); });
  window.__rhythm = m.api;
  window.__camdrums = { READ, ROWS, COLS, readPattern, sent: () => sent, cam: () => !!cam, has: () => has, start, stop };
  d.ready();
</script>
