<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>Sample drums</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
</style>
<script type="module">
  import { conceptNav } from '/concepts/nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createDrop } from '/shell/drop.mjs';
  import { createSampleLoader } from '/shell/sample-loader.mjs';
  import { createDrumMachine } from '/concepts/rhythm/drum-machine.mjs';
  import { sampleVoices, createSampleBank, defaultPick, DEFAULT_KIT } from '/concepts/rhythm/sample-voices.mjs';

  // /concepts/rhythm/010/ with the four rows playing SAMPLES, on the same one
  // SuperCollider engine (asked 2026-10-12, BACKLOG "rhythm/020"). The
  // definition, the knobs and the default kit are in `../sample-voices.mjs`.
  //
  // THE DEFAULT KIT is the four 000 drums rendered once to WAVs and kept on R2,
  // fetched on the first play, so the page sounds before anybody drops a pack.
  // DROP a `.circuitpack`, a zip of WAVs or loose WAVs anywhere on the page
  // (`/shell/sample-loader.mjs`, the reader /tom/ uses) and they replace it;
  // each row then picks its sample by name (kick, snare, hat) or takes the
  // first four in order.
  //
  // EIGHT KNOBS, a pitch and a length per row, each its own bay node on a value
  // wire into its row, in one row that scrolls sideways when it does not fit.
  //
  // NOTHING OPENS ON A VISIT: the engine and the default kit wait for play, and
  // a dropped file is read in the tab and sent nowhere.
  const d = mount({ name: 'Sample drums', what: '', readout: null, index: '/concepts/', indexLabel: 'concepts' });
  conceptNav('rhythm/020');

  const bank = createSampleBank({ log: d.log });
  /** row key -> index into the bank's loaded samples */
  const pick = new Map();
  const bufOf = (key) => { const s = bank.loaded()[pick.get(key) ?? -1]; return s ? s.buf : null; };
  // No knobs since 2026-10-13 (*"sample drums: rm scopes, move upload to
  // top, no knobs."*): each row's pitch and length are fixed at the values its
  // knob started at, sent with every hit instead of wired from a knob.
  const VOICES = sampleVoices({ bufOf }).map((v) => {
    const fixed = (v.params || []).flatMap((p) => [p.control, p.toArg ? p.toArg(p.value) : p.value]);
    return { ...v, params: undefined, args: () => { const a = v.args(); return a && [...a, ...fixed]; } };
  });

  // No picker per row since 2026-10-12 (asked: *"rm"* on a shot of the four
  // row pickers): each row plays its default, by name or by order, from
  // whatever was loaded or dropped last.
  let names = [];
  /** New names: each row takes its default. */
  function offer(list) {
    names = list.map((x) => x.name.replace(/\.wav$/i, ''));
    VOICES.forEach((v, r) => {
      const i = defaultPick(names, v.key, r);
      pick.set(v.key, i);
    });
  }

  // The default kit's names are known before anything is fetched.
  offer(DEFAULT_KIT.map((name) => ({ name })));

  const m = createDrumMachine(d, {
    voices: VOICES,
    onWake: async (e) => { offer(await bank.wake(e)); },
  });

  // ── the way in ───────────────────────────────────────────────────────────
  const loader = createSampleLoader({ say: (s, k) => drop.say(s, k), log: d.log });
  const drop = createDrop({
    accept: ['.circuitpack', '.zip', '.syx', '.wav'],
    title: 'SAMPLES',
    label: 'Open files',
    beside: 'or drop a pack, a zip of WAVs or WAVs anywhere on this page',
    empty: '',
    hint: 'drop a pack anywhere on this page',
    says: (s, k) => d.log(s, k),
    onOpen: async (files) => {
      const got = await loader.openFiles(files);
      if (!got) return false;
      const ok = got.filter((g) => g.wave?.ok !== false && g.wave?.frames !== 0);
      offer(ok);
      await bank.use(ok);
      if (bank.loaded().length) offer(bank.loaded());
      dropped++;
      return true;
    },
  });
  let dropped = 0;

  // The way in first, then the grid and the patchbay; no scopes, no knobs.
  d.stack.add(drop.el, m.surface, m.patchbay);
  window.__rhythm = m.api;
  window.__samples = { bank, pick, names: () => names, dropped: () => dropped, open: (files) => drop.open(files) };
  d.ready();
</script>
