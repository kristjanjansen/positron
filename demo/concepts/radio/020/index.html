<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON concept radio 020</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .cc-say { font-size: 12px; color: var(--dim); }
  /* A footer line never wraps: one line, cut at the slot's edge. */
  .pos-vp-foot .cc-say { white-space: nowrap; overflow: hidden; }
  /* The kit's live wave (grain-scope) as a panel's picture, as /concepts/radio/000/
     draws it: the panel's stage is the edge and the ground, so the scope gives up
     its own margin, border and corner, and its always-empty caption takes no room. */
  .cc-wave .pos-scope { margin: 0; --edge: 0px; --r: 0px; }
  .cc-wave .pos-scope-gut { display: none; }
  /* The detector's beats, drawn over the wave on the wave's own seconds: a
     canvas laid exactly on the scope's, so it moves nothing. */
  .cc-wave { position: relative; }
  .cc-beats { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  /* The tempo scope: bpm up, time across, the full width of its panel and
     the wave's height (the scope's 150). It sits in a host as the wave does,
     because the panel stretches a canvas that is its direct child. */
  .cc-tempo { display: block; width: 100%; height: 150px; touch-action: pan-y; }
  /* Play on its own row: the button's own size, at the left. */
  .cc-top { display: flex; }
  .cc-top > .pos-bgroup { flex: none; width: auto; }
</style>
<script type="module">
  import { conceptNav } from '/concepts/nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createGrainScope } from '/shell/grain-scope.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { createKnob } from '/shell/knob.mjs';
  import { createKnobGrid } from '/shell/knob-grid.mjs';

  // concepts radio/020, TEMPO, 2026-10-11. Recordings of ERR's Raadio 2 and 4
  // kept in our own R2 bucket (`positron-station`, read through the station
  // worker's /media/, CORS `*`, as /concepts/sampler/000/ reads its piano),
  // played in this tab into the radio's wave, the speakers and a tempo
  // detector, whose tempo travels as events along a `value` link into a
  // display of its own. Asked: *"In radio demo we had some bpm detect demo.
  // Dearcive. Rm granulator just a radio waves and sepatare visualizer. Use r2
  // and ida. Bring to cocept to naming syrem"*. The granulator that stood here
  // is in git history before this change.
  //
  // NOTHING OPENS ON A VISIT, AND NOTHING EVER OPENS IDA'S SERVER. Play fetches
  // the recording from our bucket, once per page, and loops it. `?src=<url>`
  // points the page at another recording (a local file for a check).
  const MEDIA = 'https://positron-station.kristjan-jansen.workers.dev/media/';
  // 🔴 ERR's RAADIO 2 AND RAADIO 4, NOT IDA, SINCE 2026-10-11. Asked: *"Ida is
  // offline. Work on radio 2 and 4 from err"*. The one capture of Ida was digital
  // silence. Each station was captured ONCE, three minutes through our own relay
  // (positron-shout, one listener, 2026-10-11 10:18 UTC), and kept in our bucket,
  // so a visit, a play and a loop never reach ERR's servers.
  const STATIONS = [
    { id: 'raadio2', label: 'Raadio 2', key: 'radio/raadio2/2026-10-11.mp3' },
    { id: 'raadio4', label: 'Raadio 4', key: 'radio/raadio4/2026-10-11.mp3' },
  ];
  const asked = new URLSearchParams(location.search).get('src');
  const srcOf = (st) => asked || `${MEDIA}${st.key}`;
  let at = 0;
  const S = 'web', CF = 'cf-r2';
  const FILE_OUT = (st) => `${CF}:${st.id}:file-out`;
  const PLAYER_IN = `${S}:player:file-in`, PLAYER_OUT = `${S}:player:audio-out`;
  const WAVE_IN = `${S}:wave:audio-in`, WAVE_BEATS = `${S}:wave:value-in`, SPEAKER_IN = `${S}:speaker:audio-in`;
  const BPM_IN = `${S}:bpm:audio-in`, BPM_EV = `${S}:bpm:value-out`;
  const DISPLAY_IN = `${S}:display:value-in`;
  const FX_IN = `${S}:fx:audio-in`, FX_TEMPO = `${S}:fx:value-in`, FX_MIX = `${S}:fx:value-in-2`, FX_OUT = `${S}:fx:audio-out`;
  const MIX_OUT = `${S}:knob-mix:value-out`;

  // ── the bay ─────────────────────────────────────────────────────────────
  // A recording is a FILE in the bucket and becomes sound only in this tab, so
  // the bucket's port is `file-out` into a player, and the player's
  // `audio-out` feeds the wave, the speakers and the detector.
  const bay = createBay();
  for (const st of STATIONS) {
    bay.addNode({ id: `${CF}:${st.id}`, kind: 'store', label: `${st.label}, recorded`, place: 'cloudflare', net: 'cloudflare' });
    bay.addPort({ id: FILE_OUT(st), label: 'recording', dir: 'out', medium: 'file', transports: ['https'], address: srcOf(st) });
  }
  bay.addNode({ id: `${S}:player`, kind: 'engine', label: 'player', place: 'browser' });
  bay.addPort({ id: PLAYER_IN, label: 'player', dir: 'in', medium: 'file' });
  bay.addPort({ id: PLAYER_OUT, label: 'player', dir: 'out', medium: 'audio' });
  bay.addNode({ id: `${S}:wave`, kind: 'screen', label: 'wave', place: 'browser' });
  bay.addPort({ id: WAVE_IN, label: 'wave', dir: 'in', medium: 'audio' });
  // The beats the detector placed reach the wave as events on a link of their
  // own, so the marks on the wave are only what arrived here.
  bay.addPort({ id: WAVE_BEATS, label: 'beats', dir: 'in', medium: 'value', deliver: (ev) => beatsIn(ev) });
  bay.addNode({ id: `${S}:bpm`, kind: 'engine', label: 'tempo detector', place: 'browser' });
  bay.addPort({ id: BPM_IN, label: 'tempo detector', dir: 'in', medium: 'audio' });
  bay.addPort({ id: BPM_EV, label: 'tempo', dir: 'out', medium: 'value' });
  // The only way a tempo reaches the scope: a delivered event on this port.
  // The detector never touches the scope.
  bay.addNode({ id: `${S}:display`, kind: 'screen', label: 'tempo scope', place: 'browser' });
  bay.addPort({ id: DISPLAY_IN, label: 'tempo scope', dir: 'in', medium: 'value', deliver: (ev) => shown(ev) });
  // The fx box: the radio thinner (a low cut) with a bass drum synthesised in
  // this tab on the detector's beat grid, mixed against the untouched radio by
  // a knob of its own. It takes the tempo on one value port and the mix on the
  // second, and only its output reaches the speakers.
  bay.addNode({ id: `${S}:fx`, kind: 'engine', label: 'low cut and drum', place: 'browser' });
  bay.addPort({ id: FX_IN, label: 'fx', dir: 'in', medium: 'audio' });
  bay.addPort({ id: FX_TEMPO, label: 'tempo', dir: 'in', medium: 'value', deliver: (ev) => fxTempo(ev) });
  bay.addPort({ id: FX_MIX, label: 'mix', dir: 'in', medium: 'value', deliver: (ev) => fxMix(ev) });
  bay.addPort({ id: FX_OUT, label: 'fx', dir: 'out', medium: 'audio' });
  bay.addNode({ id: `${S}:knob-mix`, kind: 'engine', label: 'mix knob', place: 'browser' });
  bay.addPort({ id: MIX_OUT, label: 'mix', dir: 'out', medium: 'value' });
  bay.addNode({ id: `${S}:speaker`, kind: 'screen', label: 'speakers', place: 'browser' });
  bay.addPort({ id: SPEAKER_IN, label: 'speakers', dir: 'in', medium: 'audio' });

  const d = mount({ name: 'concept radio 020', what: '', readout: null, index: '/concepts/', indexLabel: 'concepts' });
  conceptNav('radio/020');

  // ── the links, held from load so the picture does not change with play ────
  const held = new Map();
  function hold(a, b) {
    const k = `${a} ${b}`;
    if (held.has(k)) return;
    const r = bay.link(a, b, [], { site: S });
    if (r.ok) held.set(k, r.id); else d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
  }
  // The sound follows the links the bay holds, read off `bay.links()`.
  const holds = (a, b) => bay.links().some((l) => l.from === a && l.to === b);
  for (const st of STATIONS) hold(FILE_OUT(st), PLAYER_IN);
  hold(PLAYER_OUT, WAVE_IN);
  hold(PLAYER_OUT, BPM_IN);
  hold(PLAYER_OUT, FX_IN);
  hold(FX_OUT, SPEAKER_IN);
  hold(BPM_EV, DISPLAY_IN);
  hold(BPM_EV, WAVE_BEATS);
  hold(BPM_EV, FX_TEMPO);
  hold(MIX_OUT, FX_MIX);

  // ── the sound ───────────────────────────────────────────────────────────
  let ctx = null, pull = null, out = null, tap = null, tapBuf = null;
  let buffer = null, loading = null, fetchedAt = 0;
  const buffers = new Map();      // station id -> decoded recording
  let src = null, playing = false;

  // The file wire is lit while the recording comes down and for 600 ms after;
  // the audio wires while it plays. The tempo wire pulses once per event.
  const pb = createPatchbay(bay, {
    flowing: (l, medium) => {
      if (medium === 'file') return l.from === FILE_OUT(STATIONS[at]) && (!!loading || (fetchedAt && performance.now() - fetchedAt < 600));
      if (medium === 'audio' && l.from.startsWith(CF)) return false;
      if (medium === 'audio') return playing && !!src;
      return false;
    },
  });

  // ── the pictures ────────────────────────────────────────────────────────
  const waveHost = el('div', 'cc-wave');
  const scope = createGrainScope(waveHost, { seconds: 4, height: 150, fullScale: 1 });
  // The station, the kit picker in the wave panel's footer. Choosing one while
  // playing switches the recording and starts a fresh tempo reading.
  const pick = createPicker({ what: 'station', prev: () => choose(at - 1), next: () => choose(at + 1), onPick: (i) => choose(i) });
  pick.options(STATIONS.map((st) => st.label), 0);
  function choose(i) {
    const n = (i + STATIONS.length) % STATIONS.length;
    if (n === at) return;
    at = n;
    pick.show(STATIONS[at].label, at);
    buffer = buffers.get(STATIONS[at].id) || null;
    pb.refresh();
    if (playing) { stop(); play(); }
  }
  const wavePanel = createVideoPanel({ media: waveHost, aspect: 'auto', left: pick.el });

  // The beats on the wave: a canvas over the scope, drawn on the scope's own
  // seconds (4 across, the newest at the right edge), so a mark scrolls left
  // with the sound it was placed on. Each is as bright as the reading that
  // placed it was sure.
  const WAVE_S = 4;
  const beatCanvas = el('canvas', 'cc-beats');
  waveHost.append(beatCanvas);
  const beats = [];                // { at, c }: a beat instant on this tab's audio clock, and the reading's confidence
  function beatsIn(ev) {
    if (ev?.of !== 'param' || ev.name !== 'bpm' || !Array.isArray(ev.beats)) return;
    for (const b of ev.beats) if (Number.isFinite(b)) beats.push({ at: b, c: ev.confidence ?? 1 });
  }

  // The tempo scope: every reading that arrived on the display's in-port, time
  // across (the last TEMPO_S seconds, the newest at NOW_AT of the width) and bpm up, the
  // detector's whole range. Asked 2026-10-11: *"show all condidences"*, *"same
  // h as waveform . no horiz grid"*, *"zoom in time, show less hsitoric"* and
  // *"show bpm and conf on all times"*. So nothing is withheld: the chosen
  // tempo is the line, each segment as bright as its confidence, every
  // candidate the detector weighed is a dot as bright as its score, and the
  // pointer reads any moment out in full. The labels on the line and the
  // vertical lines came off the same day (*"no need for annotations"*, *"rm
  // radio 020 vert line on viz"*). The range is the corner label. 15 s across is a quarter of the 60 it was.
  const TEMPO_S = 15, NOW_AT = 2 / 3;
  const tempoCanvas = el('canvas', 'cc-tempo');
  const tempoHost = el('div', 'cc-tempo-host');
  tempoHost.append(tempoCanvas);
  const tempoPanel = createVideoPanel({ media: tempoHost, aspect: 'auto', right: false,
    left: el('span', 'cc-say', 'tempo'),
    values: [{ key: 'bpm', reserve: 9 }, { key: 'conf', label: 'confidence', reserve: 4 }] });
  // The pointer over the scope: where it is, in CSS pixels from the left, or null.
  let hoverX = null;
  tempoCanvas.addEventListener('pointermove', (e) => { hoverX = e.offsetX; drawTempo(); });
  tempoCanvas.addEventListener('pointerdown', (e) => { hoverX = e.offsetX; drawTempo(); });
  tempoCanvas.addEventListener('pointerleave', () => { hoverX = null; drawTempo(); });

  // What the scope shows is only what arrived on its in-port.
  const history = [];              // every reading delivered, { at, v, confidence, beatAt, candidates }
  function shown(ev) {
    if (ev?.of !== 'param' || ev.name !== 'bpm' || !Number.isFinite(ev.v)) return;
    const c = Number.isFinite(ev.confidence) ? ev.confidence : 0;
    history.push({ at: ctx ? +ctx.currentTime.toFixed(2) : 0, v: ev.v, confidence: c, beatAt: ev.beatAt ?? null,
      candidates: Array.isArray(ev.candidates) ? ev.candidates : [] });
    tempoPanel.values.set('bpm', `${ev.v.toFixed(1)} bpm`);
    tempoPanel.values.set('conf', c.toFixed(2));
  }

  function frame() {
    if (!playing) return;
    if (holds(PLAYER_OUT, WAVE_IN)) { tap.getFloatTimeDomainData(tapBuf); scope.feed(tapBuf, ctx.sampleRate); }
    drawBeats();
    drawTempo();
    requestAnimationFrame(frame);
  }

  // ── the tempo detector. Plain WebAudio and a little arithmetic.
  // 1. Four bands of the sound: below 150 Hz (the kick and the bass), around
  //    400 Hz, around 1.5 kHz (snares, voices) and above 4 kHz (hats), merged
  //    into one four channel input.
  // 2. Each band's energy through a follower (the square, smoothed by two one
  //    pole low passes at FOLLOW_HZ), read every HOP samples on a log scale, and
  //    how much it ROSE since the hop before. The rises, summed over the bands,
  //    are the onset envelope. Before it is used, its own one second running
  //    mean is taken off and only what stands above that is kept.
  // 3. Every half second, the autocorrelation of the last WIN_S seconds of that
  //    envelope. Each tempo from LO to HI scores the mean of its correlation at
  //    one, two and four beats, plus half of it at half a beat (a beat that
  //    splits in two, as nearly all pop does), times a prior that falls off
  //    either side of 120 bpm (a Gaussian in octaves, PRIOR_OCT wide). The
  //    peaks of that score are the CANDIDATES, and all of them are sent.
  // 4. The chosen one is the best candidate, with a bonus of STICK for staying
  //    within 3% of the last choice, and the line is the median of the last
  //    five choices.
  // 5. The confidence is how strong that score is, 1 - exp(-score / 0.25),
  //    times how many of the last eight choices agree with it (half weight).
  // 6. With the period known, the phase: the offset into the last four seconds
  //    at which the envelope one period apart adds up highest is the last beat,
  //    on this tab's audio clock. The beats on that grid since the last reading
  //    go with it, and the wave draws them.
  //
  // 🔴 WHY, MEASURED 2026-10-11 OFFLINE ON BOTH RECORDINGS, after *"there is
  // very steady beat on r2"* and *"impove yr algis"*. The detector before this
  // read Raadio 2 as 127 and 84.7 by turns (84.7 is 127 times 2/3: the song's
  // pattern repeats every one and a half beats, and the old score could not
  // tell that from a beat), with a median confidence of 0.21, because that
  // confidence was the bare correlation at one beat of a two band envelope.
  // The kicks and bass in the low band come every 0.235 s, and the envelope
  // correlates more at 2, 4 and 8 of those than at 3, 5 and 7, so the beat is
  // two of them: 127.5 bpm. After: 353 of 359 readings within 3% of 127.5 on
  // Raadio 2 and every one of the 231 in Raadio 4's first two minutes, where it
  // was 127 to 129 before as well. Raadio 4's last minute has no steady beat
  // (a 55 s window's best score is 0.02 against 0.48 in its first two minutes)
  // and its confidence falls there, which is right.
  const HOP = 256;
  const WIN_S = 12, MIN_S = 4;
  const LO = 60, HI = 200, PRIOR = 120, PRIOR_OCT = 0.7, HALF_W = 0.5, STICK = 0.15;
  const EVERY_S = 0.5, KEEP = 5, AGREE = 8, CAND = 5;
  const FOLLOW_HZ = 10;
  const BANDS = [['lowpass', 150, 1], ['bandpass', 400, 1], ['bandpass', 1500, 0.8], ['highpass', 4000, 1]];
  let det = null;
  function detBuild() {
    const sr = ctx.sampleRate, rate = sr / HOP, n = Math.round(WIN_S * rate);
    const t = { rate, n, env: new Float32Array(n), w: 0, count: 0, newest: 0,
      prev: new Float32Array(BANDS.length), since: 0, picks: [], est: null, conf: null, beatAt: null, marked: -Infinity,
      f: new Float64Array(2 * BANDS.length), h: 0, k: 1 - Math.exp(-2 * Math.PI * FOLLOW_HZ / sr) };
    t.in = ctx.createGain();
    const merge = ctx.createChannelMerger(BANDS.length);
    BANDS.forEach(([type, hz, q], i) => {
      const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = hz; b.Q.value = q;
      t.in.connect(b).connect(merge, 0, i);
    });
    t.proc = ctx.createScriptProcessor(1024, BANDS.length, 1);
    merge.connect(t.proc);
    t.proc.connect(pull);          // a processor nothing pulls never runs
    t.proc.onaudioprocess = (e) => {
      if (!playing) return;
      const ch = BANDS.map((_, i) => e.inputBuffer.getChannelData(i));
      const len = ch[0].length, t0 = e.playbackTime - len / sr;
      const f = t.f, k = t.k, B = BANDS.length;
      for (let i = 0; i < len; i++) {
        for (let b = 0; b < B; b++) { const v = ch[b][i]; f[2 * b] += (v * v - f[2 * b]) * k; f[2 * b + 1] += (f[2 * b] - f[2 * b + 1]) * k; }
        if (++t.h === HOP) { t.h = 0; detHop(t0 + (i + 1) / sr); }
      }
    };
    return t;
  }
  function detHop(at) {
    const t = det;
    let o = 0;
    for (let b = 0; b < BANDS.length; b++) { const l = Math.log1p(1e4 * t.f[2 * b + 1]); o += Math.max(0, l - t.prev[b]); t.prev[b] = l; }
    t.env[t.w] = o; t.w = (t.w + 1) % t.n; t.count++; t.newest = at;
    if (++t.since >= Math.round(EVERY_S * t.rate)) { t.since = 0; detEstimate(); }
  }
  function detEstimate() {
    const t = det, N = Math.min(t.count, t.n), rate = t.rate;
    if (N < MIN_S * rate) return;
    const raw = new Float32Array(N), x = new Float32Array(N), cs = new Float64Array(N + 1);
    for (let i = 0; i < N; i++) { raw[i] = t.env[(t.w - N + i + t.n) % t.n]; cs[i + 1] = cs[i] + raw[i]; }
    const W = Math.round(rate * 0.5);
    let mean = 0;
    for (let i = 0; i < N; i++) {
      const a = Math.max(0, i - W), b = Math.min(N, i + W + 1);
      x[i] = Math.max(0, raw[i] - (cs[b] - cs[a]) / (b - a)); mean += x[i];
    }
    mean /= N;
    let e0 = 0;
    for (let i = 0; i < N; i++) { x[i] -= mean; e0 += x[i] * x[i]; }
    if (e0 < 1e-9) return;         // silence has no tempo
    const lmin = Math.floor(60 * rate / HI), lmax = Math.ceil(60 * rate / LO);
    const A = new Float32Array(4 * lmax + 4);
    for (let L = 1; L < A.length && L < N; L++) {
      let s = 0;
      for (let i = 0; i < N - L; i++) s += x[i] * x[i + L];
      A[L] = (s / (N - L)) / (e0 / N);
    }
    const at = (l) => { const i = Math.floor(l), f = l - i; return (A[i] || 0) * (1 - f) + (A[i + 1] || 0) * f; };
    const S = new Float32Array(lmax + 2);
    for (let L = lmin; L <= lmax; L++) {
      const w = Math.exp(-0.5 * (Math.log2(60 * rate / L / PRIOR) / PRIOR_OCT) ** 2);
      S[L] = w * ((at(L) + at(2 * L) + at(4 * L)) / 3 + HALF_W * at(L / 2));
    }
    const peaks = [];
    for (let L = lmin + 1; L < lmax; L++) {
      if (!(S[L] > S[L - 1] && S[L] >= S[L + 1] && S[L] > 0)) continue;
      const den = S[L - 1] - 2 * S[L] + S[L + 1];
      const Lf = L + (den ? Math.max(-0.5, Math.min(0.5, 0.5 * (S[L - 1] - S[L + 1]) / den)) : 0);
      peaks.push({ bpm: 60 * rate / Lf, s: S[L] });
    }
    if (!peaks.length) return;
    const near = (a, b) => b != null && Math.abs(a - b) / b < 0.03;
    const pick = (p) => p.s * (near(p.bpm, t.est) ? 1 + STICK : 1);
    peaks.sort((p, q) => pick(q) - pick(p));
    const chosen = peaks[0];
    t.picks.push(chosen.bpm);
    if (t.picks.length > AGREE) t.picks.shift();
    const last = t.picks.slice(-KEEP).sort((p, q) => p - q);
    t.est = last[last.length >> 1];
    const agree = t.picks.filter((b) => near(b, t.est)).length / t.picks.length;
    const conf = (1 - Math.exp(-Math.max(0, chosen.s) / 0.25)) * (0.5 + 0.5 * agree);
    t.conf = conf;
    const P = 60 / t.est * rate, span = Math.min(N, Math.round(4 * rate));
    let bestPh = 0, bestSum = -Infinity;
    for (let ph = 0; ph < P; ph++) {
      let sum = 0;
      for (let k = ph; k < span; k += P) sum += x[N - 1 - Math.round(k)];
      if (sum > bestSum) { bestSum = sum; bestPh = ph; }
    }
    t.beatAt = t.newest - bestPh / rate;
    // The beats on this grid that no reading has placed yet, at most two seconds
    // back, oldest first. Half a period of guard keeps a grid that shifted a
    // little from placing the same beat twice.
    const per = 60 / t.est, from = Math.max(t.marked + per / 2, t.newest - 2);
    const fresh = [];
    for (let b = t.beatAt; b > from; b -= per) fresh.unshift(+b.toFixed(3));
    if (fresh.length) t.marked = fresh[fresh.length - 1];
    const top = Math.max(...peaks.map((p) => p.s));
    const candidates = [...peaks].sort((p, q) => q.s - p.s).slice(0, CAND)
      .map((p) => ({ bpm: Math.round(p.bpm * 10) / 10, s: Math.round((p.s / top) * 100) / 100 }));
    bay.send(BPM_EV, { of: 'param', name: 'bpm', v: Math.round(t.est * 10) / 10, confidence: Math.round(conf * 100) / 100,
      beatAt: t.beatAt, beats: fresh, candidates });
  }

  // Canvas ink is read off the stylesheet's tokens once.
  const tok = (k) => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
  let ink = null;
  const inks = () => (ink ??= { card: tok('--card') || '#141922', line: tok('--line') || '#232c3a',
    dim: tok('--dim2') || '#6a7280', fg: tok('--fg') || '#e6e6e6', hi: tok('--hi') || '#ffd400',
    mono: tok('--mono') || 'ui-monospace, monospace' });
  function fit(c) {
    const dpr = window.devicePixelRatio || 1;
    const W = Math.round(c.clientWidth * dpr), H = Math.round(c.clientHeight * dpr);
    if (W && H && (c.width !== W || c.height !== H)) { c.width = W; c.height = H; }
    return { W, H, dpr };
  }
  // How bright a mark is for a confidence or a score, 0 to 1: never invisible.
  const shade = (c) => 0.2 + 0.8 * Math.max(0, Math.min(1, c));

  // One accent line, full height, at each beat the wave was sent.
  function drawBeats() {
    const { W, H, dpr } = fit(beatCanvas);
    if (!W || !H) return;
    const g = beatCanvas.getContext('2d');
    g.clearRect(0, 0, W, H);
    const now = ctx.currentTime;
    while (beats.length && beats[0].at < now - WAVE_S - 0.5) beats.shift();
    g.fillStyle = inks().hi;
    for (const b of beats) {
      const x = Math.round(W - ((now - b.at) / WAVE_S) * W);
      if (x < 0 || x > W) continue;
      g.globalAlpha = shade(b.c);
      g.fillRect(x - dpr, 0, dpr, H);
    }
    g.globalAlpha = 1;
  }

  // The tempo scope. No grid lines. The range in the top left corner, the
  // time across beside now.
  let stoppedAt = 0;
  const clock = () => (ctx ? (playing ? ctx.currentTime : stoppedAt) : 0);
  function drawTempo() {
    const { W, H, dpr } = fit(tempoCanvas);
    if (!W || !H) return;
    const k = inks(), g = tempoCanvas.getContext('2d');
    g.fillStyle = k.card; g.fillRect(0, 0, W, H);
    const pad = 8 * dpr, top = pad, bot = H - pad;
    const y = (v) => bot - ((v - LO) / (HI - LO)) * (bot - top);
    const now = clock();
    // Now sits at NOW_AT of the width, the last TEMPO_S seconds to its left,
    // and no lines up the scope. Asked 2026-10-11: *"rm radio 020 vert line on
    // viz. make yellow dot around 2/3 of w"*.
    const xNow = W * NOW_AT;
    const x = (at) => xNow - ((now - at) / TEMPO_S) * xNow;
    while (history.length && history[0].at < now - TEMPO_S - 1) history.shift();
    // the candidates: a dot each, as bright as its score
    g.fillStyle = k.dim;
    for (const r of history) {
      const px = x(r.at);
      for (const cd of r.candidates) { g.globalAlpha = shade(cd.s); g.fillRect(px - dpr, y(cd.bpm) - dpr, 2 * dpr, 2 * dpr); }
    }
    // the chosen tempo: one line, each segment as bright as its confidence
    g.strokeStyle = k.fg; g.lineWidth = 1.5 * dpr; g.lineJoin = 'round';
    for (let i = 1; i < history.length; i++) {
      const p = history[i - 1], q = history[i];
      g.globalAlpha = shade(q.confidence);
      g.beginPath(); g.moveTo(x(p.at), y(p.v)); g.lineTo(x(q.at), y(q.v)); g.stroke();
    }
    g.globalAlpha = 1;
    const last = history[history.length - 1];
    if (last) { g.fillStyle = k.hi; g.beginPath(); g.arc(x(last.at), y(last.v), 3 * dpr, 0, 2 * Math.PI); g.fill(); }
    g.font = `${11 * dpr}px ${k.mono}`;
    // No labels on the line since 2026-10-11 (*"no need for annotations"*):
    // the footer says the bpm and confidence, the pointer reads any moment.
    g.fillStyle = k.dim;
    g.textBaseline = 'top'; g.textAlign = 'left';
    g.fillText(`${LO} to ${HI} bpm`, 6 * dpr, 6 * dpr);
    g.textBaseline = 'bottom'; g.textAlign = 'right';
    g.fillText(`${TEMPO_S} s`, xNow - 6 * dpr, H - 6 * dpr);
    // the pointer: a hairline and the reading nearest it, in full, in a box
    // pinned to the top right so it never covers the left corner label
    if (hoverX != null && history.length) {
      const hx = hoverX * dpr;
      let r = history[0];
      for (const h of history) if (Math.abs(x(h.at) - hx) < Math.abs(x(r.at) - hx)) r = h;
      const rx = x(r.at);
      g.fillStyle = k.fg; g.fillRect(Math.round(rx), 0, dpr, H);
      const l1 = `${(now - r.at).toFixed(1)} s ago  ${r.v.toFixed(1)} bpm  ${r.confidence.toFixed(2)}`;
      const l2 = `also ${r.candidates.filter((c) => Math.abs(c.bpm - r.v) / r.v > 0.03).map((c) => c.bpm.toFixed(1)).join(' ')}`;
      const tw = Math.max(g.measureText(l1).width, g.measureText(l2).width), lh = 15 * dpr;
      const bx = W - tw - 12 * dpr, by = 4 * dpr;
      g.fillStyle = k.card; g.globalAlpha = 0.9; g.fillRect(bx - 6 * dpr, by, tw + 12 * dpr, 2 * lh + 6 * dpr); g.globalAlpha = 1;
      g.fillStyle = k.fg; g.textAlign = 'left'; g.textBaseline = 'top';
      g.fillText(l1, bx, by + 3 * dpr); g.fillStyle = k.dim; g.fillText(l2, bx, by + 3 * dpr + lh);
    }
    g.textAlign = 'left';
  }

  // ── the recording: fetched once, decoded once, looped ────────────────────
  let bytes = 0;
  function load() {
    const st = STATIONS[at], url = srcOf(st);
    if (buffers.has(st.id)) { buffer = buffers.get(st.id); return Promise.resolve(buffer); }
    loading ??= (async () => {
      pb.refresh();
      d.log(`fetching ${url}`);
      const r = await fetch(url);
      if (!r.ok) throw new Error(`${r.status} from ${url}`);
      const ab = await r.arrayBuffer();
      bytes = ab.byteLength;
      const b = await ctx.decodeAudioData(ab);
      buffers.set(st.id, b);
      if (STATIONS[at] === st) buffer = b;
      d.log(`${st.label}: ${(bytes / 1e6).toFixed(2)} MB, ${b.duration.toFixed(1)} s`);
      return b;
    })().finally(() => { loading = null; fetchedAt = performance.now(); pb.refresh(); });
    return loading;
  }

  // The sound follows the links the bay holds: the player reaches the
  // speakers, the wave and the detector each only along its own link.
  function route() {
    try { out.disconnect(); } catch { /* not connected */ }
    out.connect(tap);
    tap.connect(pull);
    if (holds(PLAYER_OUT, BPM_IN)) out.connect(det.in);
    try { fx.out.disconnect(); } catch { /* not connected */ }
    fx.out.connect(fxTap);
    fxTap.connect(pull);
    if (holds(PLAYER_OUT, FX_IN)) out.connect(fx.in);
    if (holds(FX_OUT, SPEAKER_IN)) fx.out.connect(ctx.destination);
  }

  async function play() {
    ctx ??= new AudioContext();
    ctx.resume();
    if (!out) {
      pull = ctx.createGain(); pull.gain.value = 0; pull.connect(ctx.destination);
      out = ctx.createGain();
      tap = ctx.createAnalyser(); tap.fftSize = 2048; tapBuf = new Float32Array(tap.fftSize);
      fxBuild();
    }
    playing = true;
    face();
    try { await load(); } catch (e) { d.log(`the recording did not load: ${e?.message || e}`, 'warn'); playing = false; face(); return; }
    if (!playing) return;          // stopped while it loaded
    // A fresh detector every play, so the number is this listen's measurement.
    if (det) { try { det.proc.disconnect(); det.in.disconnect(); } catch { /* gone */ } }
    det = detBuild();
    history.length = 0; beats.length = 0; fxGrid = null; hoverX = null;
    tempoPanel.values.set('bpm', ''); tempoPanel.values.set('conf', '');
    route();
    src = ctx.createBufferSource();
    src.buffer = buffer; src.loop = true;
    src.connect(out);
    src.start();
    pb.refresh();
    requestAnimationFrame(frame);
  }
  function stop() {
    stoppedAt = ctx ? ctx.currentTime : 0;
    playing = false;
    fxGrid = null;
    if (src) { try { src.stop(); src.disconnect(); } catch { /* already stopped */ } }
    src = null;
    pb.refresh();
    face();
  }

  // ── the fx box ──────────────────────────────────────────────────────────
  // in -> dry gain (1 - mix) -------------------------------------------> out
  // in -> two high passes (12 dB each) -> music gain (mix * MUSIC_AT_1) -> out
  //       drum voices -> saturation -> drum gain (mix) -----------------> out
  // At mix 0 the output is the input through a gain of exactly 1. Turning up,
  // the low cut rises from CUT_LO to CUT_HI (geometrically, so the middle of
  // the knob is the middle of the octaves) and the drum comes up, so the
  // middle is a blend and the top is thin music under a dominant drum. Asked
  // 2026-10-11: *"max mix make music whay thinner and bd dominent"*.
  //
  // 🔴 AND THE LOUDNESS STAYS WHERE THE DRY RADIO IS AT EVERY MIX, asked the
  // same day as *"keep volume the same in all mix settings"*. The music and the
  // drum go through one makeup gain, and every LEVEL_MS a loop compares the
  // output's loudness with the input's (both K weighted, as a loudness meter
  // weighs them: a high shelf of +4 dB above 1.7 kHz and a cut below 38 Hz,
  // mean squares eased over LEVEL_TAU_S) and nudges that gain toward equal. It
  // touches only the wet side, so at mix 0 the output is still the input.
  const CUT_LO = 120, CUT_HI = 900, MUSIC_AT_1 = 0.45, DRUM_GAIN = 0.85, AHEAD_S = 0.12, TICK_MS = 25;
  const LEVEL_MS = 100, LEVEL_TAU_S = 1.5;
  let fx = null, fxTap = null, fxBuf = null, mix = 0.5, fxGrid = null, fxLast = -Infinity, fxTimer = 0;
  const kicks = [];                // every drum scheduled { at, beatAt, bpm }, for a check over CDP
  function fxBuild() {
    fx = { in: ctx.createGain(), dry: ctx.createGain(), cut1: ctx.createBiquadFilter(), cut2: ctx.createBiquadFilter(),
      music: ctx.createGain(), drums: ctx.createGain(), sat: ctx.createWaveShaper(), drum: ctx.createGain(),
      makeup: ctx.createGain(), out: ctx.createGain(), g: 1, msIn: 0, msOut: 0 };
    for (const c of [fx.cut1, fx.cut2]) { c.type = 'highpass'; c.Q.value = 0; }
    // tanh at a drive of 2.5, normalised so a full scale input still peaks at 1
    const curve = new Float32Array(1024);
    for (let i = 0; i < curve.length; i++) { const u = (i / (curve.length - 1)) * 2 - 1; curve[i] = Math.tanh(2.5 * u) / Math.tanh(2.5); }
    fx.sat.curve = curve; fx.sat.oversample = '2x';
    fx.in.connect(fx.dry).connect(fx.out);
    fx.in.connect(fx.cut1).connect(fx.cut2).connect(fx.music).connect(fx.makeup);
    fx.drums.connect(fx.sat).connect(fx.drum).connect(fx.makeup);
    fx.makeup.connect(fx.out);
    fx.kIn = kMeter(fx.in); fx.kOut = kMeter(fx.out);
    fx.lvl = new Float32Array(fx.kIn.fftSize);
    setInterval(fxLevel, LEVEL_MS);
    fxTap = ctx.createAnalyser(); fxTap.fftSize = 2048; fxBuf = new Float32Array(2048);
    fxMixApply();
  }
  // A loudness meter's weighting in front of an analyser, off to the side.
  function kMeter(node) {
    const sh = ctx.createBiquadFilter(); sh.type = 'highshelf'; sh.frequency.value = 1681; sh.gain.value = 4;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 38; hp.Q.value = 0;
    const a = ctx.createAnalyser(); a.fftSize = 4096; a.smoothingTimeConstant = 0;
    node.connect(sh).connect(hp).connect(a).connect(pull);   // pulled, or it is never run
    return a;
  }
  const meanSq = (a, buf) => { a.getFloatTimeDomainData(buf); let s = 0; for (const v of buf) s += v * v; return s / buf.length; };
  function fxLevel() {
    if (!playing || !fx) return;
    const k = 1 - Math.exp(-LEVEL_MS / 1000 / LEVEL_TAU_S);
    fx.msIn += (meanSq(fx.kIn, fx.lvl) - fx.msIn) * k;
    fx.msOut += (meanSq(fx.kOut, fx.lvl) - fx.msOut) * k;
    if (mix < 0.01 || fx.msIn < 1e-7 || fx.msOut < 1e-9) return;
    fx.g = Math.max(0.1, Math.min(4, fx.g * Math.sqrt(fx.msIn / fx.msOut) ** 0.25));
    fx.makeup.gain.setTargetAtTime(fx.g, ctx.currentTime, 0.15);
  }
  function fxMixApply() {
    if (!fx) return;
    const t = ctx.currentTime, hz = CUT_LO * (CUT_HI / CUT_LO) ** mix;
    fx.dry.gain.setTargetAtTime(1 - mix, t, 0.01);
    fx.music.gain.setTargetAtTime(mix * MUSIC_AT_1, t, 0.01);
    fx.drum.gain.setTargetAtTime(mix * DRUM_GAIN, t, 0.01);
    fx.cut1.frequency.setTargetAtTime(hz, t, 0.02);
    fx.cut2.frequency.setTargetAtTime(hz, t, 0.02);
  }
  function fxMix(ev) {
    if (ev?.of !== 'param' || ev.name !== 'mix' || !Number.isFinite(ev.v)) return;
    mix = Math.max(0, Math.min(1, ev.v));
    fxMixApply();
  }
  // A tempo the detector is sure of sets the grid; one under DRUM_FLOOR takes
  // the grid away and the drum stops. The pictures show every reading; only
  // the drum waits for a sure one, because a kick on a wrong grid is heard.
  // 0.5: MEASURED offline 2026-10-11, the steady stretches of both recordings
  // read 0.6 to 0.9 and Raadio 4's last minute, which has no steady beat,
  // reads under 0.3.
  const DRUM_FLOOR = 0.5;
  function fxTempo(ev) {
    if (ev?.of !== 'param' || ev.name !== 'bpm') return;
    const sure = Number.isFinite(ev.v) && Number.isFinite(ev.beatAt) && (ev.confidence ?? 0) >= DRUM_FLOOR;
    fxGrid = sure ? { bpm: ev.v, beatAt: ev.beatAt } : null;
  }
  // A bass drum: a sine falling from 170 Hz to a 52 Hz body in 70 ms, under a
  // 2 ms attack and a 550 ms decay, with a 4 ms click of its own top, into the
  // saturation.
  function kick(at) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(170, at);
    o.frequency.exponentialRampToValueAtTime(52, at + 0.07);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(1.6, at + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.55);
    o.connect(g).connect(fx.drums);
    o.start(at); o.stop(at + 0.57);
    const c = ctx.createOscillator(), cg = ctx.createGain();
    c.type = 'triangle'; c.frequency.value = 1800;
    cg.gain.setValueAtTime(0.3, at); cg.gain.exponentialRampToValueAtTime(0.0001, at + 0.004);
    c.connect(cg).connect(fx.drums);
    c.start(at); c.stop(at + 0.006);
  }
  // Scheduled ahead on the audio clock, every TICK_MS, so a busy main thread
  // moves when the next one is booked and never when it sounds.
  function fxTick() {
    if (!playing || !fx || !fxGrid || mix <= 0) return;
    const per = 60 / fxGrid.bpm, end = ctx.currentTime + AHEAD_S;
    let k = Math.ceil((Math.max(ctx.currentTime, fxLast + per / 2) - fxGrid.beatAt) / per);
    for (let at = fxGrid.beatAt + k * per; at < end; k++, at = fxGrid.beatAt + k * per) {
      kick(at);
      fxLast = at;
      kicks.push({ at: +at.toFixed(4), beatAt: fxGrid.beatAt, bpm: fxGrid.bpm });
      if (kicks.length > 400) kicks.shift();
    }
  }
  fxTimer = setInterval(fxTick, TICK_MS);

  // The mix knob, its own node: a turn is one event on its value-out.
  const MIX0 = 0.5;
  const knobs = new Map([['mix', createKnob({
    label: 'mix', min: 0, max: 1, step: 0.01, value: MIX0, hand: true,
    format: (v) => `${Math.round(v * 100)}%`,
    onInput: (v) => bay.send(MIX_OUT, { of: 'param', name: 'mix', v }),
  })]]);
  const knobRow = createKnobGrid(knobs, { row: true });
  bay.send(MIX_OUT, { of: 'param', name: 'mix', v: MIX0 });

  const transport = createButtonGroup({ buttons: [
    { id: 'play', icon: 'play', label: 'play', onPress: () => (playing ? stop() : play()) },
  ] });
  function face() { transport.setIcon('play', playing ? 'stop' : 'play', playing ? 'stop' : 'play'); }
  face();

  const top = el('div', 'cc-top');
  top.append(transport.el);
  d.stack.add(top, wavePanel.el, tempoPanel.el, knobRow.el, pb.el);
  // Read only, for a check over CDP.
  window.__demo.tempo = { src: () => srcOf(STATIONS[at]), station: () => STATIONS[at].id, bytes: () => bytes, duration: () => buffer?.duration ?? null,
    history: () => history.slice(), beats: () => beats.slice(), kicks: () => kicks.slice(), mix: () => mix,
    setMix: (v) => { knobs.get('mix').set?.(v); bay.send(MIX_OUT, { of: 'param', name: 'mix', v }); },
    // At the current mix: the music path's energy below 300 Hz against the
    // input's, in dB, and the drum's peak against the music path's RMS, in dB,
    // over `ms` of playing.
    measure: (ms = 4000) => new Promise((res) => {
      const an = (node) => { const a = ctx.createAnalyser(); a.fftSize = 8192; a.smoothingTimeConstant = 0; node.connect(a); return a; };
      const aIn = an(fx.in), aMu = an(fx.music), aDr = an(fx.drum);
      const bins = new Float32Array(4096), buf = new Float32Array(8192);
      let eIn = 0, eMu = 0, drPeak = 0, muSq = 0, muN = 0;
      const hz = ctx.sampleRate / 8192, top = Math.floor(300 / hz);
      const low = (a) => { a.getFloatFrequencyData(bins); let e = 0; for (let i = 1; i <= top; i++) e += 10 ** (bins[i] / 10); return e; };
      const id = setInterval(() => {
        eIn += low(aIn); eMu += low(aMu);
        aDr.getFloatTimeDomainData(buf); for (const v of buf) drPeak = Math.max(drPeak, Math.abs(v));
        aMu.getFloatTimeDomainData(buf); for (const v of buf) { muSq += v * v; muN++; }
      }, 100);
      setTimeout(() => { clearInterval(id); for (const a of [aIn, aMu, aDr]) a.disconnect();
        const db = (r) => +(10 * Math.log10(r)).toFixed(1);
        res({ mix, cutHz: Math.round(CUT_LO * (CUT_HI / CUT_LO) ** mix), lowMusicVsInputDb: db(eMu / eIn), drumPeak: +drPeak.toFixed(3),
          musicRms: +Math.sqrt(muSq / muN).toFixed(4), drumPeakOverMusicRmsDb: db(drPeak ** 2 / (muSq / muN)) }); }, ms);
    }),
    // The K weighted loudness of the output against the input's over the same
    // `ms`, in dB, at the current mix.
    level: (ms = 5000) => new Promise((res) => {
      const buf = new Float32Array(fx.kIn.fftSize); let a = 0, b = 0, n = 0;
      const id = setInterval(() => { a += meanSq(fx.kIn, buf); b += meanSq(fx.kOut, buf); n++; }, 90);
      setTimeout(() => { clearInterval(id); res({ mix, outVsInDb: +(10 * Math.log10(b / a)).toFixed(2), makeup: +fx.g.toFixed(3) }); }, ms);
    }),
    diff: () => { if (!fxTap) return null; const a = new Float32Array(2048); tap.getFloatTimeDomainData(a); fxTap.getFloatTimeDomainData(fxBuf); let m = 0, p = 0; for (let i = 0; i < 2048; i++) { m = Math.max(m, Math.abs(a[i] - fxBuf[i])); p = Math.max(p, Math.abs(a[i])); } return { maxDiff: m, peak: p }; }, conf: () => det?.conf ?? null, playing: () => playing };
  d.ready();
</script>
