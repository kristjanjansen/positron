<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON concept radio 020</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .cc-say { font-size: 12px; color: var(--dim); }
  /* A footer line never wraps: one line, cut at the slot's edge. */
  .pos-vp-foot .cc-say { white-space: nowrap; overflow: hidden; }
  /* The kit's live wave (grain-scope) as a panel's picture, as /concepts/radio/000/
     draws it: the panel's stage is the edge and the ground, so the scope gives up
     its own margin, border and corner, and its always-empty caption takes no room. */
  .cc-wave .pos-scope { margin: 0; --edge: 0px; --r: 0px; }
  .cc-wave .pos-scope-gut { display: none; }
  /* The tempo's picture: the display node's number on the kit's segment display,
     and beside it the detector's onset strip, which takes the rest of the row. */
  .cc-bpm { display: flex; align-items: center; gap: 20px; padding: 20px; }
  .cc-bpm .pos-disp { flex: none; }
  .cc-strip { flex: 1 1 0; min-width: 0; height: 64px; display: block; }
  /* Play on its own row: the button's own size, at the left. */
  .cc-top { display: flex; }
  .cc-top > .pos-bgroup { flex: none; width: auto; }
</style>
<script type="module">
  import { conceptNav } from '/concepts/nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createGrainScope } from '/shell/grain-scope.mjs';
  import { createSegment } from '/shell/segment.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';

  // concepts radio/020, TEMPO, 2026-10-11. A recording of Ida Radio Tallinn
  // kept in our own R2 bucket (`positron-station`, read through the station
  // worker's /media/, CORS `*`, as /concepts/sampler/000/ reads its piano),
  // played in this tab into the radio's wave, the speakers and a tempo
  // detector, whose tempo travels as events along a `value` link into a
  // display of its own. Asked: *"In radio demo we had some bpm detect demo.
  // Dearcive. Rm granulator just a radio waves and sepatare visualizer. Use r2
  // and ida. Bring to cocept to naming syrem"*. The granulator that stood here
  // is in git history before this change.
  //
  // NOTHING OPENS ON A VISIT, AND NOTHING EVER OPENS IDA'S SERVER. Play fetches
  // the recording from our bucket, once per page, and loops it. `?src=<url>`
  // points the page at another recording (a local file for a check).
  const MEDIA = 'https://positron-station.kristjan-jansen.workers.dev/media/';
  const KEY = 'radio/ida-tallinn/2026-10-11.mp3';
  const SRC = new URLSearchParams(location.search).get('src') || `${MEDIA}${KEY}`;
  const S = 'web', CF = 'cf-r2';
  const FILE_OUT = `${CF}:ida-tallinn:file-out`;
  const PLAYER_IN = `${S}:player:file-in`, PLAYER_OUT = `${S}:player:audio-out`;
  const WAVE_IN = `${S}:wave:audio-in`, SPEAKER_IN = `${S}:speaker:audio-in`;
  const BPM_IN = `${S}:bpm:audio-in`, BPM_EV = `${S}:bpm:value-out`;
  const DISPLAY_IN = `${S}:display:value-in`;

  // ── the bay ─────────────────────────────────────────────────────────────
  // A recording is a FILE in the bucket and becomes sound only in this tab, so
  // the bucket's port is `file-out` into a player, and the player's
  // `audio-out` feeds the wave, the speakers and the detector.
  const bay = createBay();
  bay.addNode({ id: `${CF}:ida-tallinn`, kind: 'store', label: 'Ida Radio Tallinn, recorded', place: 'cloudflare', net: 'cloudflare' });
  bay.addPort({ id: FILE_OUT, label: 'recording', dir: 'out', medium: 'file', transports: ['https'], address: SRC });
  bay.addNode({ id: `${S}:player`, kind: 'engine', label: 'player', place: 'browser' });
  bay.addPort({ id: PLAYER_IN, label: 'player', dir: 'in', medium: 'file' });
  bay.addPort({ id: PLAYER_OUT, label: 'player', dir: 'out', medium: 'audio' });
  bay.addNode({ id: `${S}:wave`, kind: 'screen', label: 'wave', place: 'browser' });
  bay.addPort({ id: WAVE_IN, label: 'wave', dir: 'in', medium: 'audio' });
  bay.addNode({ id: `${S}:bpm`, kind: 'engine', label: 'tempo detector', place: 'browser' });
  bay.addPort({ id: BPM_IN, label: 'tempo detector', dir: 'in', medium: 'audio' });
  bay.addPort({ id: BPM_EV, label: 'tempo', dir: 'out', medium: 'value' });
  // The only way a tempo reaches the number: a delivered event on this port.
  // The detector never touches the display.
  bay.addNode({ id: `${S}:display`, kind: 'screen', label: 'tempo display', place: 'browser' });
  bay.addPort({ id: DISPLAY_IN, label: 'tempo display', dir: 'in', medium: 'value', deliver: (ev) => shown(ev) });
  bay.addNode({ id: `${S}:speaker`, kind: 'screen', label: 'speakers', place: 'browser' });
  bay.addPort({ id: SPEAKER_IN, label: 'speakers', dir: 'in', medium: 'audio' });

  const d = mount({ name: 'concept radio 020', what: '', readout: null, index: '/concepts/', indexLabel: 'concepts' });
  conceptNav('radio/020');

  // ── the links, held from load so the picture does not change with play ────
  const held = new Map();
  function hold(a, b) {
    const k = `${a} ${b}`;
    if (held.has(k)) return;
    const r = bay.link(a, b, [], { site: S });
    if (r.ok) held.set(k, r.id); else d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
  }
  const holds = (a, b) => held.has(`${a} ${b}`);
  hold(FILE_OUT, PLAYER_IN);
  hold(PLAYER_OUT, WAVE_IN);
  hold(PLAYER_OUT, SPEAKER_IN);
  hold(PLAYER_OUT, BPM_IN);
  hold(BPM_EV, DISPLAY_IN);

  // ── the sound ───────────────────────────────────────────────────────────
  let ctx = null, pull = null, out = null, tap = null, tapBuf = null;
  let buffer = null, loading = null, fetchedAt = 0;
  let src = null, playing = false;

  // The file wire is lit while the recording comes down and for 600 ms after;
  // the audio wires while it plays. The tempo wire pulses once per event.
  const pb = createPatchbay(bay, {
    flowing: (l, medium) => {
      if (medium === 'file') return !!loading || (fetchedAt && performance.now() - fetchedAt < 600);
      if (medium === 'audio') return playing && !!src;
      return false;
    },
  });

  // ── the pictures ────────────────────────────────────────────────────────
  const waveHost = el('div', 'cc-wave');
  const scope = createGrainScope(waveHost, { seconds: 4, height: 150, fullScale: 1 });
  const wavePanel = createVideoPanel({ media: waveHost, aspect: 'auto', left: el('span', 'cc-say', 'Ida Radio Tallinn, recorded') });

  const disp = createSegment({ digits: 4, decimals: 1, size: 56, frame: false, title: 'tempo, bpm' });
  const strip = el('canvas', 'cc-strip');
  const bpmHost = el('div', 'cc-bpm');
  bpmHost.append(disp.el, strip);
  const bpmPanel = createVideoPanel({ media: bpmHost, aspect: 'auto', right: false,
    left: el('span', 'cc-say', 'tempo'),
    values: [{ key: 'conf', label: 'confidence', reserve: 4 }] });

  // What the display node shows is only what arrived on its in-port.
  const history = [];              // every tempo delivered, { at, v, confidence }, for a check over CDP
  function shown(ev) {
    if (ev?.of !== 'param' || ev.name !== 'bpm' || !Number.isFinite(ev.v)) return;
    disp.set(ev.v);
    history.push({ at: ctx ? +ctx.currentTime.toFixed(2) : 0, v: ev.v, confidence: ev.confidence });
  }

  function frame() {
    if (!playing) return;
    if (holds(PLAYER_OUT, WAVE_IN)) { tap.getFloatTimeDomainData(tapBuf); scope.feed(tapBuf, ctx.sampleRate); }
    drawStrip();
    requestAnimationFrame(frame);
  }

  // ── the tempo detector. Plain WebAudio and a little arithmetic.
  // 1. Two bands of the sound, a low pass at 150 Hz (the kick and the bass) and
  //    a band pass at 1.5 kHz (snares, hats, consonants), merged into one two
  //    channel input.
  // 2. Each band's energy through a follower (the square, smoothed by two one
  //    pole low passes at FOLLOW_HZ), read every HOP samples on a log scale, and
  //    how much it ROSE since the hop before. The rises, summed over both bands
  //    and smoothed by a five hop triangle, are the onset envelope.
  // 3. Every half second, the autocorrelation of the last WIN_S seconds of that
  //    envelope, at every lag between 80 and 160 bpm. A lag scores its own
  //    correlation plus half the correlation at twice the lag. The best lag is
  //    refined with a parabola and folded into 80 to 160 bpm. Its correlation,
  //    0 to 1, is the confidence.
  // 4. The median of the last five readings, eased toward, is the estimate. It
  //    is sent when it first settles and whenever it moves by more than 1 bpm.
  // 5. With the period known, the phase: the offset into the last four seconds
  //    at which onsets one period apart add up highest is the last beat, sent
  //    as `beatAt` on this tab's audio clock and drawn as the strip's grid.
  const HOP = 256;
  const WIN_S = 8, MIN_S = 4;
  const LO = 80, HI = 160;
  const EVERY_S = 0.5, KEEP = 5, SETTLE_BPM = 2, MIN_CONF = 0.25, MOVE_BPM = 1;
  const STRIP_S = 6, FOLLOW_HZ = 10, SMOOTH = 2;
  let det = null;
  function detBuild() {
    const sr = ctx.sampleRate, rate = sr / HOP, n = Math.round(WIN_S * rate);
    const t = { rate, n, env: new Float32Array(n), w: 0, count: 0, newest: 0,
      pa: 0, pb: 0, o1: 0, o2: 0, m: 0, v: 0, last: -1, onsets: [], since: 0,
      raws: [], est: null, sent: null, conf: null, beatAt: null,
      f: new Float64Array(4), h: 0, k: 1 - Math.exp(-2 * Math.PI * FOLLOW_HZ / sr) };
    t.in = ctx.createGain();
    const low = ctx.createBiquadFilter(); low.type = 'lowpass'; low.frequency.value = 150;
    const mid = ctx.createBiquadFilter(); mid.type = 'bandpass'; mid.frequency.value = 1500; mid.Q.value = 0.6;
    const merge = ctx.createChannelMerger(2);
    t.in.connect(low).connect(merge, 0, 0);
    t.in.connect(mid).connect(merge, 0, 1);
    t.proc = ctx.createScriptProcessor(1024, 2, 1);
    merge.connect(t.proc);
    t.proc.connect(pull);          // a processor nothing pulls never runs
    t.proc.onaudioprocess = (e) => {
      if (!playing) return;
      const a = e.inputBuffer.getChannelData(0), b = e.inputBuffer.getChannelData(1);
      const t0 = e.playbackTime - a.length / sr;
      const f = t.f, k = t.k;
      for (let i = 0; i < a.length; i++) {
        f[0] += (a[i] * a[i] - f[0]) * k; f[1] += (f[0] - f[1]) * k;
        f[2] += (b[i] * b[i] - f[2]) * k; f[3] += (f[2] - f[3]) * k;
        if (++t.h === HOP) { t.h = 0; detHop(Math.log1p(1e4 * f[1]), Math.log1p(1e4 * f[3]), t0 + (i + 1) / sr); }
      }
    };
    return t;
  }
  function detHop(la, lb, at) {
    const t = det;
    const o = Math.max(0, la - t.pa) + Math.max(0, lb - t.pb);
    t.pa = la; t.pb = lb;
    t.env[t.w] = o; t.w = (t.w + 1) % t.n; t.count++; t.newest = at;
    // An onset, for the strip: a local peak well above the running level, at
    // least 100 ms after the last one.
    t.m += (o - t.m) * 0.01; t.v += ((o - t.m) ** 2 - t.v) * 0.01;
    if (t.o1 > t.o2 && t.o1 >= o && t.o1 > t.m + 2 * Math.sqrt(t.v) && at - t.last > 0.1) {
      t.last = at - 1 / t.rate;
      t.onsets.push(t.last);
      while (t.onsets.length && t.onsets[0] < at - STRIP_S) t.onsets.shift();
    }
    t.o2 = t.o1; t.o1 = o;
    if (++t.since >= Math.round(EVERY_S * t.rate)) { t.since = 0; detEstimate(); }
  }
  function detEstimate() {
    const t = det, N = Math.min(t.count, t.n), rate = t.rate;
    if (N < MIN_S * rate) return;
    const raw = new Float32Array(N), x = new Float32Array(N);
    for (let i = 0; i < N; i++) raw[i] = t.env[(t.w - N + i + t.n) % t.n];
    let mean = 0;
    for (let i = 0; i < N; i++) {
      let sum = 0, wsum = 0;
      for (let j = -SMOOTH; j <= SMOOTH; j++) {
        const u = i + j;
        if (u < 0 || u >= N) continue;
        const wt = SMOOTH + 1 - Math.abs(j);
        sum += raw[u] * wt; wsum += wt;
      }
      x[i] = sum / wsum; mean += x[i];
    }
    mean /= N;
    let e0 = 0;
    for (let i = 0; i < N; i++) { x[i] -= mean; e0 += x[i] * x[i]; }
    if (e0 < 1e-9) return;         // silence has no tempo
    const lmin = Math.max(2, Math.floor(60 * rate / HI) - 1), lmax = Math.ceil(60 * rate / LO) + 1;
    const A = new Float32Array(2 * lmax + 2);
    for (let L = lmin; L < A.length && L < N; L++) {
      let s = 0;
      for (let i = 0; i < N - L; i++) s += x[i] * x[i + L];
      A[L] = (s / (N - L)) / (e0 / N);
    }
    const score = (L) => A[L] + 0.5 * (A[2 * L] || 0);
    let best = -1, bestL = 0;
    for (let L = lmin + 1; L < lmax; L++) { const s = score(L); if (s > best) { best = s; bestL = L; } }
    if (!bestL) return;
    const s0 = score(bestL - 1), s1 = best, s2 = score(bestL + 1);
    const den = s0 - 2 * s1 + s2;
    const Lf = bestL + (den ? Math.max(-0.5, Math.min(0.5, 0.5 * (s0 - s2) / den)) : 0);
    let bpm = 60 * rate / Lf;
    while (bpm < LO) bpm *= 2;
    while (bpm > HI) bpm /= 2;
    const conf = Math.max(0, Math.min(1, A[bestL]));
    t.conf = conf;
    t.raws.push(bpm);
    if (t.raws.length > KEEP) t.raws.shift();
    const med = [...t.raws].sort((p, q) => p - q)[t.raws.length >> 1];
    if (t.est == null) {
      const last3 = t.raws.slice(-3);
      if (last3.length === 3 && last3.every((r) => Math.abs(r - med) <= SETTLE_BPM) && conf >= MIN_CONF) t.est = med;
    } else {
      t.est += (med - t.est) * 0.4;
    }
    bpmPanel.values.set('conf', `${Math.round(conf * 100)}%`);
    if (t.est == null) return;
    const P = 60 / t.est * rate, span = Math.min(N, Math.round(4 * rate));
    let bestPh = 0, bestSum = -Infinity;
    for (let ph = 0; ph < P; ph++) {
      let sum = 0;
      for (let k = ph; k < span; k += P) sum += x[N - 1 - Math.round(k)];
      if (sum > bestSum) { bestSum = sum; bestPh = ph; }
    }
    t.beatAt = t.newest - bestPh / rate;
    if (conf < MIN_CONF) return;
    if (t.sent != null && Math.abs(t.est - t.sent) <= MOVE_BPM) return;
    const v = Math.round(t.est * 10) / 10;
    t.sent = v;
    bay.send(BPM_EV, { of: 'param', name: 'bpm', v, confidence: Math.round(conf * 100) / 100, beatAt: t.beatAt });
  }

  // The onset strip: the last STRIP_S seconds of the onset envelope, the
  // onsets as ticks, and the detector's beat grid in the accent, scrolling right
  // to left. Canvas ink is read off the stylesheet's tokens once.
  const tok = (k) => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
  let ink = null;
  function drawStrip() {
    const c = strip, dpr = window.devicePixelRatio || 1;
    const W = Math.round(c.clientWidth * dpr), H = Math.round(c.clientHeight * dpr);
    if (!W || !H) return;
    if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
    ink ??= { dim: tok('--dim2') || '#6a7280', fg: tok('--fg') || '#e6e6e6', hi: tok('--hi') || '#ffd400' };
    const g = c.getContext('2d');
    g.clearRect(0, 0, W, H);
    const t = det;
    if (!t || !t.count) return;
    const rate = t.rate, cols = Math.min(t.count, t.n, Math.round(STRIP_S * rate));
    let peak = 1e-6;
    for (let i = 0; i < cols; i++) peak = Math.max(peak, t.env[(t.w - 1 - i + t.n) % t.n]);
    const x = (age) => W - (age / STRIP_S) * W;
    g.fillStyle = ink.dim;
    const bw = Math.max(1, W / (STRIP_S * rate));
    for (let i = 0; i < cols; i++) {
      const v = t.env[(t.w - 1 - i + t.n) % t.n] / peak;
      const h = Math.max(1, v * H * 0.9);
      g.fillRect(x(i / rate) - bw, H - h, bw, h);
    }
    if (t.beatAt != null && t.est) {
      const P = 60 / t.est;
      g.fillStyle = ink.hi;
      for (let b = t.beatAt; b > t.newest - STRIP_S; b -= P) g.fillRect(Math.round(x(t.newest - b)) - dpr, 0, dpr, H);
    }
    g.fillStyle = ink.fg;
    for (const on of t.onsets) g.fillRect(Math.round(x(t.newest - on)) - dpr, 0, 2 * dpr, 4 * dpr);
  }

  // ── the recording: fetched once, decoded once, looped ────────────────────
  let bytes = 0;
  function load() {
    if (buffer) return Promise.resolve(buffer);
    loading ??= (async () => {
      pb.refresh();
      d.log(`fetching ${SRC}`);
      const r = await fetch(SRC);
      if (!r.ok) throw new Error(`${r.status} from ${SRC}`);
      const ab = await r.arrayBuffer();
      bytes = ab.byteLength;
      buffer = await ctx.decodeAudioData(ab);
      d.log(`recording: ${(bytes / 1e6).toFixed(2)} MB, ${buffer.duration.toFixed(1)} s`);
      return buffer;
    })().finally(() => { loading = null; fetchedAt = performance.now(); pb.refresh(); });
    return loading;
  }

  // The sound follows the links the bay holds: the player reaches the
  // speakers, the wave and the detector each only along its own link.
  function route() {
    try { out.disconnect(); } catch { /* not connected */ }
    out.connect(tap);
    tap.connect(pull);
    if (holds(PLAYER_OUT, SPEAKER_IN)) out.connect(ctx.destination);
    if (holds(PLAYER_OUT, BPM_IN)) out.connect(det.in);
  }

  async function play() {
    ctx ??= new AudioContext();
    ctx.resume();
    if (!out) {
      pull = ctx.createGain(); pull.gain.value = 0; pull.connect(ctx.destination);
      out = ctx.createGain();
      tap = ctx.createAnalyser(); tap.fftSize = 2048; tapBuf = new Float32Array(tap.fftSize);
    }
    playing = true;
    face();
    try { await load(); } catch (e) { d.log(`the recording did not load: ${e?.message || e}`, 'warn'); playing = false; face(); return; }
    if (!playing) return;          // stopped while it loaded
    // A fresh detector every play, so the number is this listen's measurement.
    if (det) { try { det.proc.disconnect(); det.in.disconnect(); } catch { /* gone */ } }
    det = detBuild();
    disp.set('');
    bpmPanel.values.set('conf', '');
    route();
    src = ctx.createBufferSource();
    src.buffer = buffer; src.loop = true;
    src.connect(out);
    src.start();
    pb.refresh();
    requestAnimationFrame(frame);
  }
  function stop() {
    playing = false;
    if (src) { try { src.stop(); src.disconnect(); } catch { /* already stopped */ } }
    src = null;
    pb.refresh();
    face();
  }

  const transport = createButtonGroup({ buttons: [
    { id: 'play', icon: 'play', label: 'play', onPress: () => (playing ? stop() : play()) },
  ] });
  function face() { transport.setIcon('play', playing ? 'stop' : 'play', playing ? 'stop' : 'play'); }
  face();

  const top = el('div', 'cc-top');
  top.append(transport.el);
  d.stack.add(top, wavePanel.el, bpmPanel.el, pb.el);
  // Read only, for a check over CDP.
  window.__demo.tempo = { src: SRC, bytes: () => bytes, duration: () => buffer?.duration ?? null,
    history: () => history.slice(), conf: () => det?.conf ?? null, playing: () => playing };
  d.ready();
</script>
