<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON concept 030</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* Two pictures side by side, each half the content width; one under the other on a phone. As /concepts/synth/030/. */
  .cc-pair { display: flex; gap: 12px; align-items: flex-start; }
  .cc-pair > * { flex: 1 1 0; min-width: 0; }
  /* In a column a 0 basis is a 0 height, so on a phone each panel takes its own height. */
  @media (max-width: 560px) { .cc-pair { flex-direction: column; align-items: stretch; } .cc-pair > * { flex: none; } }
  .cc-say { font-size: 12px; color: var(--dim); }
  /* A footer line never wraps: one line, cut at the slot's edge. */
  .pos-vp-foot .cc-say { white-space: nowrap; overflow: hidden; }
  /* The kit's live wave (grain-scope) as a panel's picture: the panel's stage is the
     edge and the ground, so the scope gives up its own margin, border and corner
     through the kit's tokens, and its always-empty caption takes no room. The stage
     is as tall as the scope rather than 16:9 (`aspect: 'auto'`). */
  .cc-wave .pos-scope { margin: 0; --edge: 0px; --r: 0px; }
  .cc-wave .pos-scope-gut { display: none; }
  /* Play and the crossfader, centred under the two panels. The slider takes the
     row between its two named ends, as /grains/ draws its blend. */
  /* A slider row: an end label, the slider, an end label, at the full width.
     Both label columns take the width of the longest end label on the page,
     `--end` in ch of the labels' own mono face, so every slider starts and
     ends at the same x (asked 2026-10-10, *"label area w's on slider left and
     right the longest one"*). */
  .cc-fade { display: grid; grid-template-columns: var(--end, 6ch) minmax(0, 1fr) var(--end, 6ch);
    align-items: center; gap: 14px; width: 100%; font: 400 12px/1 var(--mono); }
  .cc-fade .cc-end { color: var(--dim); white-space: nowrap; }
  /* Play on its own row: the button's own size, at the left. A flex row
     blockifies it, so it sits on no text line. */
  .cc-top { display: flex; }
  .cc-top > .pos-bgroup { flex: none; width: auto; }
  .cc-fade .cc-end:first-child { text-align: right; }
  .cc-fade > .sld { min-width: 0; }
  .cc-fade > .sld > .sld-lane { width: auto; flex: 1 1 auto; }
  .cc-fade > .sld > .sld-head:not(:has(.sld-l:not(:empty))) { display: none; }
</style>
<script type="module">
  import { conceptNav } from '/concepts/nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createGrainScope } from '/shell/grain-scope.mjs';
  import { createSlider } from '/shell/slider.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createMp3Stream } from '/shell/mp3-stream.mjs';

  // A simple radio as a patchbay: one ERR station and one Ida station, each an
  // external site, into a crossfader in this tab, into the speakers. The streams
  // come through positron's own relay (`shout`), which holds ONE upstream
  // connection per mount, exactly as /radio/ reaches them. `?base=` points the
  // page at demo/fake-station.mjs instead.
  //
  // NOTHING OPENS ON A VISIT. No AudioContext and no fetch to either station
  // until somebody presses play. The patch is held from load so the picture
  // does not change with play; an `external` node refuses a link out of it
  // without `consent: true`, so the page names it where the link is made.
  const BASE = new URLSearchParams(location.search).get('base') || 'https://shout.positron.studio';
  const S = 'web';
  const STATIONS = [
    { key: 'err', site: 'err', node: 'vikerraadio', mount: 'vikerraadio', name: 'ERR Vikerraadio', label: 'Vikerraadio', kbps: 128 },
    { key: 'ida', site: 'ida', node: 'tallinn', mount: 'ida-tallinn', name: 'Ida Tallinn', label: 'Ida Radio Tallinn', kbps: 320 },
  ];
  const outOf = (st) => `${st.site}:${st.node}:audio-out`;
  // The relay is a hop of its own: it holds the one connection to the station
  // and every tab reads the relay, so the station's link ends there.
  const relayIn = (st) => `shout:${st.mount}:audio-in`, relayOut = (st) => `shout:${st.mount}:audio-out`;
  // Each station's wave is its own node, fed from the relay before the fader.
  const waveIn = (st) => `${S}:wave-${st.key}:audio-in`;
  const FADER_IN = `${S}:fader:audio-in`, FADER_OUT = `${S}:fader:audio-out`, SPEAKER_IN = `${S}:speaker:audio-in`;

  // ── the bay ─────────────────────────────────────────────────────────────
  const bay = createBay();
  for (const st of STATIONS) {
    bay.addNode({ id: `${st.site}:${st.node}`, kind: 'external', label: st.label, place: st.site, net: st.site });
    bay.addPort({ id: outOf(st), label: st.label, dir: 'out', medium: 'audio', transports: ['https'] });
    bay.addNode({ id: `shout:${st.mount}`, kind: 'endpoint', label: 'relay', place: 'shout' });
    bay.addPort({ id: relayIn(st), label: 'relay', dir: 'in', medium: 'audio', transports: ['https'] });
    bay.addPort({ id: relayOut(st), label: 'relay', dir: 'out', medium: 'audio', transports: ['https'],
      address: `${BASE}/${st.mount}` });
    bay.addNode({ id: `${S}:wave-${st.key}`, kind: 'screen', label: `${st.key === 'err' ? 'ERR' : 'Ida'} wave`, place: 'browser' });
    bay.addPort({ id: waveIn(st), label: 'wave', dir: 'in', medium: 'audio' });
  }
  bay.addNode({ id: `${S}:fader`, kind: 'engine', label: 'crossfader', place: 'browser' });
  bay.addNode({ id: `${S}:speaker`, kind: 'screen', label: 'speakers', place: 'browser' });
  bay.addPort({ id: FADER_IN, label: 'crossfader', dir: 'in', medium: 'audio' });
  bay.addPort({ id: FADER_OUT, label: 'crossfader', dir: 'out', medium: 'audio' });
  bay.addPort({ id: SPEAKER_IN, label: 'speakers', dir: 'in', medium: 'audio' });

  const d = mount({ name: 'concept radio 000', what: '', readout: null, index: '/concepts/', indexLabel: 'concepts' });
  conceptNav('radio/000');

  // ── the sound: two streams, two gains, one AudioContext ──────────────────
  let ctx = null, sum = null, pull = null;
  const legs = new Map();          // key -> { stream, gain, tap, buf, live }
  let x = 0.5;                     // 0 is all ERR, 1 is all Ida
  const gains = () => [Math.cos(x * Math.PI / 2), Math.sin(x * Math.PI / 2)];   // equal power
  function applyFade() {
    if (!ctx) return;
    const t = ctx.currentTime, g = gains();
    STATIONS.forEach((st, i) => legs.get(st.key)?.gain.gain.setTargetAtTime(g[i], t, 0.02));
  }

  // ── the links ───────────────────────────────────────────────────────────
  const held = new Map();          // "from to" -> link id
  function hold(a, b, opts) {
    const k = `${a} ${b}`;
    if (held.has(k)) return true;
    bay.seen(a); bay.seen(b);
    const r = bay.link(a, b, [], { site: S, ...opts });
    if (r.ok) { held.set(k, r.id); return true; }
    d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
    return false;
  }

  hold(FADER_OUT, SPEAKER_IN);
  // The whole patch is held from load, so the picture is the same playing or
  // stopped. Holding a link opens nothing: the streams open only on play,
  // which is the press where a person asks to listen, so the station link is
  // made with that consent named here rather than at the press.
  for (const st of STATIONS) {
    hold(outOf(st), relayIn(st), { consent: true, via: 'https' });
    hold(relayOut(st), FADER_IN, { via: 'https' });
    hold(relayOut(st), waveIn(st), { via: 'https' });
  }

  const pb = createPatchbay(bay, {
    flowing: (l) => {
      if (l.from === FADER_OUT) return [...legs.values()].some((g) => g.live);
      const st = STATIONS.find((s) => outOf(s) === l.from || relayOut(s) === l.from);
      return !!(st && legs.get(st.key)?.live);
    },
  });

  // ── the pictures: the kit's live wave in a video panel per station ───────
  const scopes = new Map();
  const panels = STATIONS.map((st) => {
    const host = el('div', 'cc-wave');
    const scope = createGrainScope(host, { seconds: 4, height: 150, fullScale: 1 });
    scopes.set(st.key, scope);
    // The rate at the right, beside the full-screen button.
    const p = createVideoPanel({ media: host, aspect: 'auto', left: el('span', 'cc-say', st.name) });
    p.el.querySelector('.pos-vp-r').prepend(el('span', 'cc-say', `${st.kbps} kbit/s`));
    return p;
  });
  const pair = el('div', 'cc-pair');
  pair.append(...panels.map((p) => p.el));

  // The sound follows the links the bay holds, as the archived effects concept did (archive/concepts/effects.md): a station
  // reaches the fader only along relay -> fader, its wave only along relay ->
  // wave, and the fader the speakers only along fader -> speaker. Unlink one
  // and that edge goes quiet.
  const holds = (a, b) => held.has(`${a} ${b}`);
  function route() {
    if (!ctx) return;
    for (const st of STATIONS) {
      const g = legs.get(st.key);
      if (!g) continue;
      try { g.tap.disconnect(); } catch { /* not connected */ }
      g.tap.connect(pull);
      if (holds(relayOut(st), FADER_IN)) g.tap.connect(g.gain);
      g.wave = holds(relayOut(st), waveIn(st));
    }
    try { sum.disconnect(); } catch { /* not connected */ }
    if (holds(FADER_OUT, SPEAKER_IN)) sum.connect(ctx.destination);
  }

  function frame() {
    if (!legs.size) return;
    for (const [key, g] of legs) {
      if (!g.live || !g.wave) continue;
      g.tap.getFloatTimeDomainData(g.buf);
      scopes.get(key).feed(g.buf, ctx.sampleRate);
    }
    requestAnimationFrame(frame);
  }

  // ── play and stop ───────────────────────────────────────────────────────
  let playing = false;
  function play() {
    ctx ??= new AudioContext();
    ctx.resume();
    if (!sum) {
      sum = ctx.createGain();
      // A silent sink that keeps every tap pulled, so a wave reads its station
      // whether or not that station reaches the fader.
      pull = ctx.createGain(); pull.gain.value = 0; pull.connect(ctx.destination);
    }
    playing = true;
    for (const st of STATIONS) {
      // The press is the person asking to listen, so the link carries consent.
      // The relay fetches the station; the page reads the relay, into the
      // fader and into the station's own wave.
      if (!hold(outOf(st), relayIn(st), { consent: true, via: 'https' })) continue;
      hold(relayOut(st), FADER_IN, { via: 'https' });
      hold(relayOut(st), waveIn(st), { via: 'https' });
      const gain = ctx.createGain(), tap = ctx.createAnalyser();
      tap.fftSize = 2048;
      const stream = createMp3Stream(ctx, { url: `${BASE}/${st.mount}`, log: (m) => d.log(`${st.label}: ${m}`) });
      // Through the tap, not beside it: an analyser nothing pulls from reads
      // silence, so the sound passes it on its way to the fader, as on /radio/.
      // The tap -> gain -> fader edge is made by route(), from the bay's links.
      stream.node.connect(tap);
      gain.connect(sum);
      const leg = { stream, gain, tap, buf: new Float32Array(tap.fftSize), live: false };
      legs.set(st.key, leg);
      stream.started.then((path) => {
        if (legs.get(st.key) !== leg) return;
        leg.live = true;
        d.log(`${st.label} playing, ${path}`);
      }).catch((e) => d.log(`${st.label} did not start: ${e?.message || e}`, 'warn'));
    }
    applyFade();
    route();
    pb.refresh();
    face();
    requestAnimationFrame(frame);
  }
  function stop() {
    playing = false;
    for (const st of STATIONS) {
      const g = legs.get(st.key);
      if (g) { try { g.stream.stop(); } catch { /* already stopped */ } try { g.gain.disconnect(); } catch { /* gone */ } }
    }
    legs.clear();
    pb.refresh();
    face();
  }

  const transport = createButtonGroup({ buttons: [
    { id: 'play', icon: 'play', label: 'play', onPress: () => (playing ? stop() : play()) },
  ] });
  function face() {
    transport.setIcon('play', playing ? 'stop' : 'play', playing ? 'stop' : 'play');
  }
  face();

  const fader = createSlider({ label: '', aria: 'crossfade', min: 0, max: 1, step: 0.01, value: x,
    onInput: (v) => { x = v; applyFade(); } });
  const fade = el('div', 'cc-fade');
  fade.append(el('span', 'cc-end', 'ERR'), fader.el, el('span', 'cc-end', 'Ida'));

  // Play on its own row, top left under the title.
  const top = el('div', 'cc-top');
  top.append(transport.el);
  // Blocks in the shell's stack, at the shell's gap.
  d.stack.add(top, pair, fade, pb.el);
  // Both label columns of every slider row take the longest end label's width.
  const ends = [...d.el.querySelectorAll('.cc-fade .cc-end')].map((e) => e.textContent.length);
  d.el.style.setProperty('--end', `${Math.max(...ends)}ch`);
  d.ready();
</script>
