<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* No vertical margins anywhere in here: the gap between the picture, the
     segment row and everything else is `.pos-body > * + *` in shell.css, one
     rhythm for every page. */
  canvas.src { width: 100%; max-width: 440px; display: block; background: #000;
               border: 1px solid var(--line); border-radius: 4px; }
  .segs { display: flex; flex-wrap: wrap; gap: 3px; }
  /* A row with nothing in it still takes its 22 px, which reads as something
     that failed to render. `display:flex` beats the UA's `[hidden]` rule, so
     the hidden case has to be said here. */
  .segs[hidden] { display: none; }
  .segs i { font: 500 9.5px/1.6 var(--mono); color: var(--dim2); border: 1px solid var(--line);
            border-radius: 2px; padding: 1px 5px; }
  .segs i.held { color: var(--hi); border-color: var(--hi); }
  .segs i.gone { color: var(--ok); border-color: color-mix(in oklab, var(--ok) 40%, var(--line)); }
</style>

<script type="module">
  import { mount, guard, recorderMime, el } from '/shell/shell.mjs';
  import { burn, hueFor } from '/shell/pattern.mjs';

  const SEG_MS = 2000;

  const d = mount({
    name: 'record',
    what: 'Every two seconds the recording closes a segment, which is handed off and '
      + 'then dropped, so the bytes being held never grow past one segment however '
      + 'long the show runs. Press Start recording: sent climbs with the show while '
      + 'worst — the most ever held at one time — stays where it is. Nothing actually '
      + 'leaves this page; the hand-off is stood in for, and capture is the page that '
      + 'really uploads.',
    // 🔴 EVERY CELL HAS TO BE ABLE TO MOVE. This row used to count SEGMENTS held
    // and at high-water, and both were pinned: a segment is handed off 300 ms
    // after it closes and the next one is 2 s away, so `held` read 0 and `peak`
    // read 1 on every run this page has ever had. The same two quantities in
    // KiB move — `holding` steps up and back down once a segment, `worst` is
    // the ceiling it never passes — and the pair of them against `sent` is the
    // whole finding, visible without reading a word.
    readout: { segments: '', holding: 'KiB', worst: 'KiB', sent: 'KiB' },
    controls: [
      { id: 'rec', label: 'Start recording', primary: true },
      { id: 'stop', label: 'Stop' },
    ],
  });
  guard(d);

  // A canvas source, so this needs no camera and no permission: the point of
  // the demo is the DISK BEHAVIOUR, not where the pixels come from.
  const canvas = el('canvas', 'src');
  // the shared pattern's machine-readable row is frozen on a 1280 grid
  const W = 1280, H = 720;
  canvas.width = W; canvas.height = H;
  const g = canvas.getContext('2d');
  d.el.append(canvas);
  const segsEl = el('div', 'segs');
  segsEl.hidden = true;                        // until there is a segment in it
  d.el.append(segsEl);

  let frame = 0;
  setInterval(() => { burn(g, W, H, frame++, { hue: hueFor('record') }); }, 40);

  // Counts drive the asserts (a bound of two segments is the claim); bytes
  // drive the readout, because the counts cannot move and the bytes can.
  let rec = null, closed = 0, held = 0, peak = 0;
  let heldBytes = 0, peakBytes = 0, sentBytes = 0;
  const disk = new Map();

  function paintSegs() {
    d.set('segments', closed);
    d.set('holding', Math.round(heldBytes / 1024));
    d.set('worst', Math.round(peakBytes / 1024), peak <= 2 ? 'ok' : 'bad');
    // ⚠️ BLANK, NOT 0, BEFORE THE FIRST HAND-OFF. A zero here reads as a very
    // confident measurement of nothing sent, when in truth the first segment
    // closed 300 ms ago and has not been handed off yet.
    d.set('sent', sentBytes ? Math.round(sentBytes / 1024) : '');
    segsEl.hidden = disk.size === 0;
    segsEl.replaceChildren(...[...disk.entries()].slice(-24).map(([n, s]) =>
      el('i', s.shipped ? 'gone' : 'held', `${n}:${Math.round(s.bytes / 1024)}k`)));
  }

  /**
   * THE FINDING THIS DEMO EXISTS FOR (proto/archive): a closed segment is
   * shipped and then DELETED, so the disk high-water is two segments — the one
   * being written and the one being shipped — no matter how long the show runs.
   * 1.8 MB instead of 40 MB for the measured show, and O(1) rather than O(t).
   */
  function ship(n) {
    const s = disk.get(n);
    if (!s || s.shipped) return;
    s.shipped = true;
    held--;
    heldBytes -= s.bytes;
    sentBytes += s.bytes;
    paintSegs();
  }

  d.on('rec', () => {
    if (rec) return;
    const stream = canvas.captureStream(25);
    const mime = recorderMime(d);
    if (!mime) return;
    rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 800_000 });
    rec.ondataavailable = (e) => {
      if (!e.data || !e.data.size) return;
      closed++;
      held++;
      heldBytes += e.data.size;
      peak = Math.max(peak, held);
      peakBytes = Math.max(peakBytes, heldBytes);
      disk.set(closed, { bytes: e.data.size, shipped: false });
      paintSegs();
      // "upload" then delete — the ship is what keeps the disk flat
      setTimeout(() => ship(closed), 300);
    };
    rec.onerror = (e) => d.log(`recorder: ${e.error?.name ?? 'error'}`, 'bad');
    // timeslice IS the segmenter: each tick closes a chunk
    rec.start(SEG_MS);
    d.log(`recording ${mime}, ${SEG_MS / 1000}s segments`, 'hi');
  });

  d.on('stop', async () => {
    if (!rec) return;
    rec.stop();
    rec = null;
    d.log(`stopped after ${closed} segment(s)`);
    // The checks read what this control just produced, so this is the first
    // moment they can be true — and a button for them would make them optional.
    await d.run('check');
  });

  d.on('check', async () => {
    d.assert('MediaRecorder available', typeof MediaRecorder !== 'undefined');
    // a 2 s timeslice needs 2 s to produce anything
    for (let i = 0; i < 40 && closed === 0; i++) await new Promise((r) => setTimeout(r, 200));
    d.assert('segments are closing', closed > 0, `${closed} closed`);
    d.assert('never holds more than two segments', peak <= 2,
      `${peak} at once, ${Math.round(peakBytes / 1024)} KiB`);
    d.assert('handing one off frees what it took', held <= 2, `${held} still held`);
    d.assert('what is held does not grow with the show', peak <= 2 && closed >= 1,
      `${closed} segments recorded, never more than ${peak} held at once`);
  });

  d.log(`segments close every ${SEG_MS / 1000} s`);
  d.ready();
</script>
</html>
