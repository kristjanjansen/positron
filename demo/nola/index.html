        d.assert('the voicing control really moves the chords rather than relabelling them',
          spelled.join(',') !== led.join(',') && dotsNow() === spelledDots,
          `spelled spans ${spelled.join(',')} against ${led.join(',')} when led, `
          + `and the same ${spelledDots} dots either way`);
        d.assert('and every note of every chord lands on the keys under it',
          charts.every((c) => c.outside.length === 0)
          && charts.every((c) => c.notes.every((n) => n >= keys.base && n <= keys.base + 24)),
          charts.map((c) => `${c.label} ${Math.min(...c.notes)}-${Math.max(...c.notes)}`).join(', '));
      }

      const refused = drawChords('Cmaj wibble');
      d.assert('a token that is not a chord is shown back rather than dropped',
        refused.bad.length === 1 && chordList.querySelector('.nola-bad')?.textContent.includes('wibble'),
        chordList.querySelector('.nola-bad')?.textContent || 'nothing said');
      drawChords(chordField.value());
    }

    /* 🔴 TWENTY FIVE KEYS, FIFTEEN OF THEM WHITE, AND NONE OF THEM UNDER THE
       TOUCH FLOOR. This asserted that the row does not scroll at this width,
       and it was true while the keyboard had no box around it: the fifteen
       whites filled 688 px with nothing to spare. `demo/shell/keyboard.mjs`
       gained a wrapper on 2026-09-23 and then padding on all four sides, which
       is 18 px the keys no longer have, so the row scrolls by about that much
       here.
       ⚠️ THE CLAIM THAT SURVIVES IS THE ONE WORTH MAKING. What the 44 px floor
       is FOR is that a key never squeezes under a fingertip: a row that scrolls
       is the component obeying that floor, and a row that fitted by shrinking
       its keys to 41 px would be the failure. So this measures the KEY, which
       is the thing a player touches, and reports the scroll beside it. */
    {
      const row = keysHost.querySelector('.keys');
      const whites = keysHost.querySelectorAll('.k:not(.sharp)').length;
      const w = row.querySelector('.k:not(.sharp)').getBoundingClientRect().width;
      d.assert('the keyboard is two octaves and no key is under the touch floor',
        keys.notes().length === 25 && whites === 15 && w >= KEY_MIN - 0.5,
        `${keys.notes().length} keys, ${whites} white, ${w.toFixed(1)} px each, row `
        + `${row.scrollWidth} px in ${row.clientWidth} px`);

      /* ⚠️ AND ONLY THE MIDDLE OCTAVE IS REACHABLE FROM THE COMPUTER KEYBOARD,
         because there are not twenty five letters to give. It used to be
         asserted on the drawn LETTER; `keyboard.mjs` draws a dot now, faint on
         a key that has a letter behind it, and the claim is the same one: a
         mark on a key that does nothing when you press it is worse than no
         mark. */
      /* 🔴 THE COMPUTER KEYBOARD REACHES THE BOTTOM OCTAVE, AND THIS IS THE
         CLAIM RATHER THAN A COUNT OF MARKS. It used to count drawn letters,
         then faint dots; both are gone, because a keyboard at rest draws
         nothing. What is still true and still worth grading is WHERE `a` lands:
         C3, the leftmost key, since 2026-09-23. */
      d.assert('the computer keyboard plays from the leftmost key on screen',
        keys.noteOf('a') === keys.base && keys.base === 48,
        `a is note ${keys.noteOf('a')}, the keyboard starts at ${keys.base}`);
      d.assert('and nothing on a resting keyboard is painted at all',
        keysHost.querySelectorAll('.k.down, .k.remote, .k.hint').length === 0,
        `${keysHost.querySelectorAll('.k.down, .k.remote, .k.hint').length} keys lit`);
    }

    /**
     * 🔴 THE RECORDINGS ARE FETCHED BEFORE ANY TIMED CHECK, AND THIS IS THE
     * SECOND TIME THE HARNESS'S PATIENCE HAS BITTEN. `verify.mjs` leaves after
     * about two seconds with no new assert, and `press()` awaits a fetch the
     * first time a key in an octave is played. On localhost that is tens of
     * milliseconds and invisible; against the DEPLOY it is hundreds, and two
     * runs of the same green page collected **21 and 34** asserts. Nothing
     * failed in either, the assert LIST was identical, and the only thing that
     * differed was how many of them the harness stayed for.
     * ⚠️ SO THE NETWORK COMES OUT OF THE MIDDLE OF THE BLOCK RATHER THAN THE
     * GAPS BEING SHAVED. Shaving them would have made the same defect rarer
     * instead of absent, and a check that is graded only when the link is fast
     * is a check nobody can trust the count of.
     */
    await ensureAudio();
    await Promise.all([
      fetchPlan(planFor(PIANO, 60)),
      fetchPlan(planFor(PIANO, 72)),
    ]);

    /* ── the pedal, and the control beside it ────────────────────────────── */
    //
    // ⚠️ THE CONTROL IS THE SAME GESTURE WITH NOTHING UNDER THE FOOT, MEASURED
    // AT THE SAME AGE. Without it, what is being measured is only that a note
    // takes a while to die.
    await quiet();
    await press(60, 100, performance.now());
    await sleep(150);
    lift(60);
    await sleep(700);
    const noPedal = peak();

    await quiet();
    pedal.control(PEDAL_CC, pedal.wire(true));
    await press(60, 100, performance.now());
    await sleep(150);
    lift(60);
    const heldByFoot = pedal.held();
    await sleep(700);
    const onPedal = peak();
    pedal.control(PEDAL_CC, pedal.wire(false));
    await sleep(600);
    const afterLift = peak();

    d.assert('a key let go with the pedal down keeps sounding, and lifting the pedal ends it',
      heldByFoot === 1 && onPedal > noPedal * 2 && afterLift < onPedal / 2,
      `at the same age the peak is ${onPedal.toFixed(4)} with the pedal down against `
      + `${noPedal.toFixed(4)} without it, and 600 ms after the pedal came up it is `
      + `${afterLift.toFixed(4)}`);

    /* ── the two sets, which is the bug a first implementation ships ─────── */
    await quiet();
    pedal.control(PEDAL_CC, pedal.wire(true));
    await press(62, 100, performance.now());
    await sleep(120);
    lift(62);                                   // 62 is on the foot
    const onFoot = pedal.held();
    await press(62, 100, performance.now());                 // and a finger is back on it
    const backUnderFinger = pedal.held();
    await sleep(120);
    pedal.control(PEDAL_CC, pedal.wire(false));
    await sleep(500);
    const stillThere = peak();
    d.assert('a key pressed again while the pedal is down is not taken away when it lifts',
      onFoot === 1 && backUnderFinger === 0 && stillThere > 0.01,
      `the foot held ${onFoot} note, then ${backUnderFinger} once the key was pressed again, `
      + `and 500 ms after the pedal lifted the peak is ${stillThere.toFixed(4)}`);
    lift(62);

    /* ── the damper is a ramp, read at two times ─────────────────────────── */
    //
    // 🔴 BOTH READINGS ARE CLEAR OF THE ANALYSER'S OWN 11.6 ms WINDOW, and at
    // 2048 samples neither was: a reading 40 ms after the key came up was still
    // half made of samples from before it, so an instant stop measured the same
    // as a ramp. The damper's time constant is a third of `damperSec`, so 45 ms
    // in it is at about a third of where it started and 130 ms in at a
    // twenty-fifth, which is a difference no window width can manufacture.
    await quiet();
    await press(64, 110, performance.now());
    await sleep(200);
    lift(64);
    await sleep(45);
    const early = peak();
    await sleep(85);
    const late = peak();
    d.assert('a key released is damped over time rather than stopped',
      early > 0.01 && late < early * 0.4,
      `45 ms after the key came up the peak is ${early.toFixed(4)} and 130 ms after it is `
      + `${late.toFixed(4)}, over a damper of ${damperSec(0).toFixed(2)}s`);

    /* ── the switch takes the pedal's own road ───────────────────────────── */
    await quiet();
    keys.sustain.button.click();
    const switchDown = pedal.down();
    const litDown = keys.sustain.get();
    await press(67, 100, performance.now());
    await sleep(120);
    lift(67);
    const switchHeld = pedal.held();
    keys.sustain.button.click();
    await sleep(500);
    d.assert('the sustain button goes down the same road a real pedal does',
      switchDown === true && switchHeld === 1 && pedal.down() === false && pedal.held() === 0,
      `the button put the pedal down and the foot held ${switchHeld} note, and pressing it `
      + 'again let go of it');

    /* 🔴 AND THE LAMP FOLLOWS THE FOOT RATHER THAN THE PRESS, which is the
       mistake `/muta/` shipped and had reported as *"midi off, same label on
       both states??"*. A real pedal moves this button without anybody touching
       it, so the state has to come from the pedal. */
    pedal.control(PEDAL_CC, pedal.wire(true));
    const litByPedal = keys.sustain.get();
    pedal.control(PEDAL_CC, pedal.wire(false));
    d.assert('the button follows a real pedal, not only its own press',
      litDown === true && litByPedal === true && keys.sustain.get() === false,
      `pressed ${litDown}, pedal ${litByPedal}, released ${keys.sustain.get()}`);

    /* ── the pitch shift is real, not a claim ────────────────────────────── */
    //
    // 🔴 THE PITCH, NOT THE NUMBER THE PAGE COMPUTED. Notes 63 and 64 come from
    // ONE recording, 63 at its own rate and 64 bent up a semitone, both read at
    // the same age. A semitone is a factor of 1.0595, and reading the page's own
    // `shift` instead would have been the page grading its arithmetic against
    // itself: MEASURED by forcing `playbackRate` to 1, which left this page
    // 24/24 green until this check read the sound.
    await quiet();
    await press(63, 100, performance.now());                 // 63 has its own recording
    await sleep(250);
    const hzFlat = topHz();
    const flat = lastShift;
    lift(63);
    await quiet();
    await press(64, 100, performance.now());                 // 64 is bent up from 63
    await sleep(250);
    const hzBent = topHz();
    const bent = lastShift;
    lift(64);
    await quiet();
    const ratio = hzFlat ? hzBent / hzFlat : 0;
    d.assert('a note with no recording really sounds a semitone above the one it came from',
      bent === 1 && flat === 0 && Math.abs(ratio - Math.pow(2, 1 / 12)) < 0.03,
      `note 63 came from ${nearestIn(PIANO.notes, 63)} at ${flat} and its loudest partial is `
      + `${hzFlat.toFixed(1)} Hz, note 64 came from ${nearestIn(PIANO.notes, 64)} at ${bent} and its is `
      + `${hzBent.toFixed(1)} Hz, a ratio of ${ratio.toFixed(4)} against 1.0595`);

    /* ── transpose, and the half of the keyboard it must not touch ───────── */
    //
    // 🔴 BOTH HALVES AT THE SAME SETTING, because the claim is about what
    // transpose does NOT reach. Putting it back to 0 before touching the screen
    // keys grades the second half at the one value where the two answers cannot
    // differ, and a transpose that leaked into the screen path read green.
    await quiet();
    setTranspose(1);
    midiDown(60, 100, 0, performance.now());    // a flat keyboard's middle C
    await sleep(80);
    const soundedFromMidi = voices.length ? voices[voices.length - 1].note : null;
    midiUp(60);
    await quiet();
    keys.press('a');                            // the screen's own leftmost C, still at +1
    await sleep(80);
    const fromScreenNote = voices.length ? voices[voices.length - 1].note : null;
    keys.release('a');
    setTranspose(0);
    await quiet();
    d.assert('transpose moves a MIDI keyboard and leaves the keys on screen where they are',
      soundedFromMidi === 61 && fromScreenNote === 48 && transpose === 0,
      `at +1 a keyboard sending 60 sounded ${soundedFromMidi}, and the screen's own C sounded `
      + `${fromScreenNote} at the same setting`);

    /* ── the octave pad, which no harness can press ──────────────────────── */
    //
    // 🔴 `verify.mjs` PRESSES `.pos-controls button` AND THE PAD IS NOT IN IT,
    // on purpose, because it belongs to the keyboard rather than to the page.
    // A page that ships it and asserts nothing about it has three ungraded
    // controls, which is how `/mirror/` lost two while reading green.
    const was = keys.base;
    const up = keys.shiftOctave(1);
    const down = keys.shiftOctave(-1);
    d.assert('the octave pad moves the keys, and it stops where the keyboard does',
      up === was + 12 && down === was,
      `${was} to ${up} and back to ${down}`);

    /* ── notes off, WITH SOMETHING ACTUALLY RINGING ──────────────────────── */
    //
    // 🔴 THREE KEYS STILL DOWN AND THE PEDAL STILL DOWN, because a panic check
    // run on a quiet page grades nothing. This assert used to read the state
    // after everything had already decayed on its own, so deleting the whole
    // body of `onPanic` left it green: the notes were gone either way and the
    // check could not tell which reason it was looking at.
    await quiet();
    pedal.control(PEDAL_CC, pedal.wire(true));
    for (const n of [60, 64, 67]) await press(n, 100, performance.now());
    await sleep(150);
    const ringing = voices.length, loud = peak();
    keys.panic();
    await sleep(400);
    d.assert('notes off stops what is ringing and takes the foot off the pedal',
      ringing === 3 && loud > 0.01 && voices.length === 0 && pedal.held() === 0
      && pedal.fingers() === 0 && pedal.down() === false && peak() < 0.01,
      `${ringing} voices at ${loud.toFixed(4)} before it, ${voices.length} at `
      + `${peak().toFixed(4)} after, and the pedal reads `
      + `${pedal.down() ? 'still down' : 'up'}`);

    /* ── the fetch really only took the octaves that were played ─────────── */
    //
    // ⚠️ THE PIANO'S OWN FILES, COUNTED BEFORE THE RHODES BLOCK RUNS. Nothing
    // has asked for a Rhodes file at this point, so `gotFiles` is still the
    // piano's, and the Rhodes' own fetching is graded below on the URLs rather
    // than on this count.
    d.assert('only the octaves somebody played were asked for',
      gotFiles > 0 && gotFiles < PIANO.notes.length && buffers.size === gotFiles
      && gotUrls.every((u) => u.endsWith('.mp3')),
      `${gotFiles} of ${PIANO.notes.length} recordings, ${Math.round(gotBytes / 1024)} KB, `
      + `for ${wanted.size} octave${wanted.size === 1 ? '' : 's'}`);

    /* ── the Rhodes, driven through the control a visitor presses ────────── */
    //
    // 🔴 EVERY ONE OF THESE GOES THROUGH `instPick.buttons[n].click()` RATHER
    // THAN THROUGH `setInstrument`. The picker is outside `.pos-controls`, so
    // no harness will ever press it, and a check that reached past it would
    // leave the one control this change adds graded by nothing. That is the
    // loss `positron-verify` records on `/mirror/` and `/blocks/`, where ten
    // and six asserts went silent behind a control nobody could press.
    {
      /* 🔴 THE FETCHING PART COMES FIRST AND IS READ OFF THE WIRE. What is
         being graded is which file the page ASKED FOR, not which layer it
         worked out a line earlier: reading `lastPlayed.layer` would be the page
         grading its own arithmetic, which is how a `playbackRate` forced to 1
         read green on this page once already. */
      const before = gotUrls.length;
      instPick.buttons[1].click();                            // RHODES
      await press(60, 20, performance.now());                 // barely touched
      await sleep(40);
      await press(60, 120, performance.now());                // and leaned on
      await sleep(40);
      await press(81, 127, performance.now());                // above where layer 1 stops
      await sleep(40);
      const asked = gotUrls.slice(before).map((u) => u.split('/').pop());
      const soft = asked.find((f) => f.startsWith('rhodes-059'));
      const hard = asked.filter((f) => f.startsWith('rhodes-059')).pop();
      keys.panic();

      d.assert('a soft press and a hard one really fetch two different recordings of one note',
        asked.length === 3 && soft !== hard && soft === 'rhodes-059-5.m4a'
        && hard === 'rhodes-059-1.m4a',
        `note 60 came from ${soft} at velocity 20 and from ${hard} at 120, `
        + `and layer 1 is the harder of the two`);

      /* 🔴 AND THE HOLE IS CROSSED FOR REAL, NOT IN ARITHMETIC. Note 81 has no
         layer 1 file at all, so a page that trusted the layer it computed would
         have asked for `rhodes-081-1.m4a` and got a 404 on a run whose own
         `no failed requests` line would then be the only thing that said so. */
      d.assert('a note above the top of a layer asks for the file its author plays instead',
        asked[2] === 'rhodes-081-2.m4a',
        `note 81 at velocity 127 asked for ${asked[2]}, and there is no rhodes-081-1.m4a `
        + 'in the pack at all');

      /* ⚠️ WHAT THE TIMED READINGS NEED, FETCHED BEFORE ANY OF THEM. Same
         reason as the piano's octaves above: a fetch in the middle of a
         measurement is both a distorted reading and a silence the harness may
         walk out during. */
      await Promise.all([fetchPlan(planFor(RHODES, 59, 2)), fetchPlan(planFor(RHODES, 65, 2))]);

      /* ── it really sounds, with the silence before it as the control ───── */
      await quiet();
      const hush = peak();
      await press(60, 100, performance.now());
      await sleep(150);
      const rhodesLoud = peak();
      lift(60);
      d.assert('a Rhodes note really sounds, against the silence a moment before it',
        hush < 0.002 && rhodesLoud > 0.02,
        `the analyser read ${hush.toFixed(4)} with nothing playing and `
        + `${rhodesLoud.toFixed(4)} 150 ms into a Rhodes note at velocity 100`);

      /* 🔴 AND THE LEVEL IS THE WHOLE REASON THERE ARE TWO CONSTANTS. The piano
         files are 21 dB down and the Rhodes files are at full scale, so an
         instrument switch that reused one number would be about 20 dB out in
         one direction or the other. The same key at the same velocity on both
         is the only reading that says whether that was got right. */
      await quiet();
      instPick.buttons[0].click();                            // PIANO
      await press(60, 100, performance.now());
      await sleep(150);
      const pianoLoud = peak();
      lift(60);
      const apart = 20 * Math.log10(rhodesLoud / (pianoLoud || 1e-9));
      d.assert('the two instruments land within a few dB of each other at one velocity',
        Math.abs(apart) < 6 && pianoLoud > 0.02,
        `at velocity 100 the Rhodes reads ${rhodesLoud.toFixed(4)} and the piano `
        + `${pianoLoud.toFixed(4)}, which is ${apart >= 0 ? '+' : ''}${apart.toFixed(1)} dB apart`);

      /* 🔴 AND THE READING THAT DECIDES A LEVEL IS A CHORD, NOT A NOTE. One
         note at the wrong level is quiet or loud; six at the wrong level is a
         page that clips, which is the harm the constant above exists to avoid.
         The piano's own three note chord is already measured by the notes off
         check at the same velocity and the same age, so `loud` is the
         comparison and nothing new has to be played to get it.
         🔴 AND THE TWO DO NOT AGREE, WHICH IS THE SPARSE NOTE MAP ARRIVING
         SOMEWHERE NOBODY WAS LOOKING. MEASURED here: one Rhodes note sits 2.6 dB
         from one piano note, and three Rhodes notes sit about 8 dB above three
         piano ones. Notes 64 and 67 come from the SAME Rhodes recording at two
         rates, so they start in phase and add almost coherently, while the
         piano's three notes come from three different recordings and add like
         noise. The first version of this check asserted the two chords were
         within a few dB of each other and went red on a page doing exactly what
         it promises.
         ⚠️ THE LEVEL IS STILL RIGHT AND THE HEADROOM IS STILL THERE. A triad
         reads about 0.32 against full scale at 1.0, which is the same order as
         the piano's own worst case, and `LOUDEST` is already a third of full
         scale for exactly this reason. */
      await quiet();
      instPick.buttons[1].click();                            // RHODES
      for (const n of [60, 64, 67]) await press(n, 100, performance.now());
      await sleep(150);
      const chord = peak();
      keys.panic();
      await sleep(300);
      const chordFrom = new Set([60, 64, 67].map((n) => nearestIn(RHODES.notes, n))).size;
      const pianoFrom = new Set([60, 64, 67].map((n) => nearestIn(PIANO.notes, n))).size;
      d.assert('a Rhodes chord stacks higher than a piano one, because fewer recordings cover more keys',
        chord < 1 && chord > loud && chordFrom === 2 && pianoFrom === 3,
        `notes 60, 64 and 67 come from ${chordFrom} Rhodes recordings and ${pianoFrom} piano ones, `
        + `and at velocity 100 they peak at ${chord.toFixed(4)} against ${loud.toFixed(4)}, `
        + 'both inside full scale at 1.0000');

      /* ── switching under a held note, and the control beside it ────────── */
      //
      // 🔴 A KEY THAT IS STILL DOWN IS THE SHAPE THAT STRANDS A VOICE. Its
      // release goes through `pedal`, which knows a note number and nothing
      // about which instrument made the sound, so a page holding a voice list
      // per instrument would leave this one ringing until the tab closed.
      // ⚠️ The picker is still on RHODES from the chord above, which is why
      // there is no click here and the first press already lands on it.
      await quiet();
      await press(64, 100, performance.now());                // and never let go
      await sleep(150);
      const underFinger = peak();
      instPick.buttons[0].click();                            // PIANO, key still down
      await sleep(250);
      const afterSwitch = peak(), stranded = voices.length;
      lift(64);
      await quiet();
      /* ⚠️ THE CONTROL IS THE SAME NOTE HELD THE SAME WAY WITH NOBODY
         SWITCHING. Without it all that is measured is that a Rhodes note gets
         quieter on its own, which it does. */
      instPick.buttons[1].click();
      await press(64, 100, performance.now());
      await sleep(400);
      const unswitched = peak();
      d.assert('changing instrument under a held key ends its note rather than stranding it',
        underFinger > 0.02 && afterSwitch < 0.01 && stranded === 0 && unswitched > 0.01,
        `held at ${underFinger.toFixed(4)}, then ${afterSwitch.toFixed(4)} and ${stranded} voices `
        + `250 ms after the switch, against ${unswitched.toFixed(4)} at 400 ms with no switch`);
      lift(64);
      keys.panic();
      instPick.buttons[0].click();                            // back where a visitor finds it
    }

    d.assert('the page measured its own press to sound', presses === 0 || worstMs > 0,
      presses ? `${presses} presses timed, median ${medians[medians.length >> 1].toFixed(1)} ms, `
              + `worst ${worstMs.toFixed(1)} ms`
              : 'no press carried a timestamp, which is every press under a harness');

    d.assert('nothing cut and nothing refused in the picture', dg.cuts.length === 0,
      dg.cuts.map((c) => `${c.where} ${c.id}: ${c.shown}`).join(', ') || 'nothing cut, nothing refused');
    /* 🔴 EXACTLY ONE, WHICH CATCHES BOTH DIRECTIONS. A bracket standing in for
       an arrow is the defect this is usually written against, so most pages
       assert 0. Here one is CORRECT: the keyboard's keys and its footswitch are
       a set and the component is told so. Asserting 1 rather than 0 means
       losing the bracket fails as loudly as growing a second one, and losing it
       would put an arrow from the keys into the footswitch. */
    d.assert('the only headless line in the picture is the one joining a set',
      dg.ties === 1, `${dg.ties} line${dg.ties === 1 ? '' : 's'} with no head`);
  }

  // ── the picture ───────────────────────────────────────────────────────────
  //
  // 🔴 NO BOX FOR SYMPATHETIC RESONANCE AND NO BOX FOR A STRING MODEL. Neither
  // is here, and a box for one would draw a mechanism the page does not have,
  // which is the one thing a diagram may never do.
  //
  // 🔴 AND THE BUCKET IS NOT DRAWN EITHER. `plans/plan-nola.md` §6.3 asks for a
  // `Cloudflare` container holding `workers/station` at `R2, 3.8MB`, and that is
  // where the Salamander pack will live. Today the recordings sit beside this
  // page and are served by the site itself, so the box says `workers/view` and
  // the size is the real one. A picture of next week's architecture is the same
  // defect as a note about how the picture was made.
  const dg = createDiagram(d.el, {
    caption: 'Two ways in and one sampler: a key on screen, a key on a chord chart and a '
      + 'key on a MIDI keyboard all call the same two functions, so nothing downstream can '
      + 'tell them apart. Which set of recordings that sampler reaches for is the only thing '
      + 'the instrument control changes.',
    nodes: [
      /* 🔴 THE KEYBOARD IS DRAWN AS A MACHINE WITH TWO PARTS, AND THE FOOTSWITCH
         IS ONE OF THEM. Half of a keyboard is under the player's foot, and a
         picture that draws the keys and not the pedal is a picture of the half
         this page is not about. It is also what keeps the three machines a
         similar size: `diagram.mjs` gives EVERY top level box the height of the
         tallest, so one machine with five parts beside one with none draws two
         boxes that are mostly empty, which is the shape the rules already
         refuse for a container with nothing in it. MEASURED: five children made
         this picture 962 px tall, and three made it a third of that. */
      /* ⚠️ `set: true`, BECAUSE KEYS AND A FOOTSWITCH DO NOT FEED EACH OTHER.
         Between two neighbours with no declared link the component draws an
         ARROW by default, and it drew one from the keys into the footswitch,
         which is a mechanism that does not exist. A machine whose children
         really are a set says so and gets a bracket instead. */
      { id: 'kbd', label: 'MIDI keyboard', sub: 'USB MIDI', kind: 'device', tech: 'device',
        set: true,
        children: [
          { id: 'kkeys', label: 'keys', sub: 'notes, velocity', tech: 'device',
            note: 'A note on at velocity 0 is a note off, and many keyboards never send a real '
                + 'note off at all. The one on this desk also arrives a semitone flat, which is '
                + 'what the TRANSPOSE control is for.' },
          { id: 'foot', label: 'footswitch', sub: 'CC64 by default', tech: 'device',
            note: 'Which controller a footswitch sends is a setting held inside the keyboard, so '
                + '64 is a default rather than a measurement. Open the page with **?pedal=67** '
                + 'for one that sends something else.' },
        ] },
      { id: 'br', label: 'Browser', sub: 'phone or laptop', kind: 'here', tech: 'browser',
        children: [
          { id: 'keys', label: 'screen keys', sub: 'no MIDI needed', tech: 'browser',
            note: 'The instrument and every chord chart above it are the same component in the '
                + 'same window, so a shape carries down the page. Safari has no **Web MIDI** on '
                + 'any platform, so on an iPhone these are the whole instrument.' },
          { id: 'damp', label: 'damper', sub: 'CC64, 63/64', tech: 'sound',
            note: 'The pedal is the ABSENCE of the damper rather than a sustain, so nothing is '
                + 'added to a note. A value of 63 is off and 64 is on.' },
          { id: 'smp', label: 'sampler', sub: 'piano or Rhodes', tech: 'sound',
            note: 'A key plays the nearest recording at a changed **playbackRate**, one semitone '
                + 'away on the piano and up to three on the Rhodes. Up to 64 '
                + '**AudioBufferSourceNode**s sound at once, each into its own gain.' },
        ] },
      { id: 'cf', label: 'Cloudflare', sub: 'the site itself', kind: 'cloud', tech: 'cloudflare',
        children: [
          /* ⚠️ THE FILES COME FIRST BECAUSE THE BYTES GO THAT WAY. The worker
             READS the recordings and serves them, so an arrow from the worker
             into the files would draw the flow backwards, which a reader
             following the picture would believe. */
          { id: 'files', label: 'recordings', sub: '95 files, 3.6MB', tech: 'file',
            note: 'The piano is 30 notes a minor third apart at one velocity layer. The Rhodes '
                + 'is 15 notes at five layers each, recorded by Jeff Learman and used under '
                + 'CC BY-NC-SA 4.0.' },
          { id: 'wrk', label: 'Worker', sub: 'workers/view', tech: 'cloudflare',
            note: 'The same worker that serves the page serves the recordings beside it. '
                + 'Nothing here is a bucket yet, and the Salamander pack the plan sizes will '
                + 'be.' },
        ] },
    ],
    links: [
      /* 🔴 BOTH WAYS IN LAND ON THE SAME BOX, AND THEY DID NOT UNTIL THIS WAS
         DRAWN. The MIDI keys pointed at the sampler while the screen keys
         pointed at the damper, which is a picture of two different instruments
         under one caption saying they are one. Every key event on this page,
         from either road, goes through the pedal's two sets first, because the
         pedal is what decides whether a release is a release. */
      { from: 'kkeys', to: 'damp', label: 'notes',
        note: '**requestMIDIAccess**, three bytes a message, and the browser stamps each one '
            + 'with the time it arrived. That stamp is where press to sound is measured from.' },
      { from: 'foot', to: 'damp', label: 'CC64',
        note: 'The polarity is sensed at power up on the keyboard here, so a pedal held down '
            + 'while it boots is inverted all session. The page prints the raw value so a '
            + 'player can see it lying.' },
      { from: 'keys', to: 'damp',
        note: 'A tap calls the same two functions a MIDI note calls. There is no second route, '
            + 'which is why the page cannot drift into lighting one key and playing another.' },
      { from: 'damp', to: 'smp',
        note: 'Two sets, not one: what is under a finger and what is only under the foot. '
            + 'Lifting the pedal cannot take away a key somebody is still holding.' },
      { from: 'files', to: 'wrk',
        note: 'No build pipeline exists yet and none is needed to play the thing, which is the '
            + 'whole argument for starting here rather than with an encoder.' },
      { from: 'wrk', to: 'smp', label: 'mp3 and m4a',
        note: 'A piano octave at a time and a single Rhodes file per note and velocity layer, '
            + 'on the first press that needs one. A release is a **setTargetAtTime** over about '
            + '0.12 s rather than a stop, because a stop is a click.' },
    ],
  }, { how: true, atEnd: true });

  /* The chords the field opens with, drawn before anybody types. It fetches
     nothing and sounds nothing: a chart is a picture until a key is pressed. */
  drawChords(chordField.value());
  setTranspose(Number(q.get('transpose')) || 0);

  /**
   * 🔴 THE CHECKS RUN AT LOAD AND ARE NOT AWAITED, AND THAT IS THE WHOLE COST
   * OF DELETING THE CONTROL ROW. They used to hang off `Play a phrase`, which
   * is how `demo/verify.mjs` drove this page; with no button to press they had
   * to move or vanish, and vanishing is silent. `/muta/` and `/radio/` already
   * do exactly this.
   */
  ifSelfcheck(checks, { log: d.log,
    say: 'the checks this page runs on itself are off for a visitor, because they play notes '
       + 'and press the controls in front of you' });

  /**
   * 🔴 `ready()` GOES AFTER THE CHECKS ARE STARTED AND NOT AT THE END OF THEM,
   * AND PUTTING IT AT THE END DEADLOCKED THE HARNESS ONCE ALREADY.
   * `demo/verify.mjs` waits up to six seconds for `__demo.ready` before it
   * touches the page, so a ready at the end of a ten second check block is a
   * page waiting for a harness that is waiting for the page. It read
   * `failed: null` and `console: nothing`, which is the shape that says hanging
   * rather than throwing.
   * ⚠️ SO THE TALLY LINE IS EARLY, AND THAT IS THE HOUSE PATTERN RATHER THAN A
   * SLIP. `verify.mjs` reads `__demo.asserts` and waits for the count to stop
   * growing, so nothing is lost but the number in one log line.
   */
  d.ready();
</script>

<style>
  .nola-picks { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  /* 🔴 THE SUSTAIN BUTTON SITS WITH THE OCTAVE PAD, NOT IN `.pos-controls`.
     `keyboard.mjs` already argues this about the pad itself: an octave pair and
     a `Notes off` are controls ABOUT the keys, and a hand's width away at the
     top of the page is the wrong place for any of them. A pedal is the same
     kind of thing.
     ⚠️ AND `presence.mjs` WARNS THAT A CONTROL OUTSIDE THAT ROW IS ONE NO
     HARNESS DRIVES. True, and answered: this page's own check presses it
     twice and then proves the lamp follows a REAL pedal as well as its own
     press, which is more than a harness click would have graded. */
  .nola-pad { display: flex; align-items: center; gap: 10px; margin-top: -4px; }

  /* A chord and its picture. The list wraps, so a long line of chords becomes
     rows rather than a sideways scroll: `tabs.mjs` already records that a
     scrolling row drags the whole page sideways on a phone. */
  /* 🔴 ONE PER ROW, AT THE KEYBOARD'S OWN WIDTH. Asked for as *"'hint
     keyboards': same w as regular one"*. They were a wrapping row of 320 px
     cards, which put two different key widths on one page: the chart's C and
     the instrument's C were different sizes, so the eye could not carry a shape
     from one to the other, which is the only thing a chord chart is for. */
  .nola-chords { display: flex; flex-direction: column; gap: 12px; }
  .nola-chord { width: 100%; min-width: 0; }
  /* ⚠️ `nowrap` AND `tabular-nums`, because a chord name sits over a picture
     whose width it must not change. A name that wrapped would move the keyboard
     under it and nothing that redraws may change how much room it takes. */
  .nola-chord-h { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .nola-chord-n { font: 600 12px/1.4 var(--mono); letter-spacing: .06em;
                  color: var(--fg); white-space: nowrap; overflow: hidden;
                  text-overflow: ellipsis; }
  /* ⚠️ A SECOND INK, BECAUSE IT IS A SECOND KIND OF FACT. The name is what you
     type and the numeral is what it MEANS in this key, and the reference the
     four frames came from separates them the same way. */
  .nola-chord-r { font: 600 12px/1.4 var(--mono); color: var(--hi);
                  white-space: nowrap; }
  /* A chord with a note the window cannot draw says so beside its name, because
     a chart with one key missing and nothing said is the silent kind of wrong. */
  .nola-chord-o { font: 500 11px/1.4 var(--mono); color: var(--warn);
                  white-space: nowrap; }
  /* 🔴 A CHART'S KEYS ARE SHORTER THAN AN INSTRUMENT'S. Twelve of these on a
     page at the playing keyboard's 74 px would be a screen of piano and no
     room for the piano you play. The proportions are the component's own:
     `.k.sharp` is `height: 46px` against 74, so 44 against 70 keeps the black
     key the same fraction of the white one. */
  .nola-chord-k .k { height: 44px; }
  .nola-chord-k .k.sharp { height: 27px; }
  .nola-chord-k .kbd { margin: 0; }
  .nola-chord-k .keys { margin: 0; }

  /* A token the parser refused, shown back. `.pos-log` is for things that
     HAPPENED; this is a standing statement about what is in the field, so it
     lives beside the charts it is missing from. */
  .nola-bad { flex: 1 1 100%; font: 500 12px/1.5 var(--mono); color: var(--warn); }

  /* 🔴 A 2 px GAP, NOT THE COMPONENT'S 3, AND IT IS 14 PIXELS OF ARITHMETIC.
     MEASURED: fifteen white keys at the 44 px floor plus fourteen 3 px gaps is
     702 px and this page is 688, so the row scrolled by exactly the gaps. The
     alternative was a 43 px key, and 44 is Apple's minimum touch target on the
     nose: the gap is decoration and the key is the thing a finger has to hit,
     so the gap gives way. 15 x 44 + 14 x 2 = 688.
     ⚠️ IT IS ON THIS PAGE'S KEYBOARDS ONLY. Every other keyboard on the site
     draws eight white keys and has room to spare. */
  /* ⚠️ THE GAP IS A PROPERTY NOW, NOT A RULE ON `.keys`, because the piano
     roll above the instrument is a second grid built to the same template and
     it has to read the same number. Setting `column-gap` here reached one of
     them and left the roll a pixel wider per column, which is the alignment
     defect this page has now had twice. */
  .nola-keys { --k-gap: 2px; }
  .nola-keys { display: block; }

  /* 🔴 THE INSTRUMENT PICKER, THE KEYS AND THE CREDIT ARE ONE BLOCK. `stack.mjs`
     says it in its own header: a pair that belongs tight is one block, not a
     smaller gap, and the inside of a block is the block's own business. Which
     instrument the keys play and the keys themselves are not two things a
     reader should have to associate across 40 px of air. */
  .nola-inst { display: flex; flex-direction: column; gap: 12px; }

  /* 🔴 THE CREDIT IS REQUIRED BY THE RHODES' LICENCE AND IS NOT DECORATION.
     CC BY-NC-SA means attribution, and attribution nobody can see is not
     attribution. It is a STANDING STATEMENT about what the keys play, so it
     sits with them rather than in `.pos-log`, which is for things that
     happened. Same argument as `.nola-bad` one element along. */
  .nola-credit { font: 500 11px/1.5 var(--mono); color: var(--dim); }
  .nola-credit a { color: var(--dim); text-decoration: underline;
                   text-underline-offset: 2px; }
  .nola-credit a:hover, .nola-credit a:focus-visible { color: var(--fg); }
</style>
</html>
