<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* 🔴 THE PICTURE IS THIS PAGE'S OWN BLOCK, SO THE GAPS INSIDE IT ARE ITS OWN.
     `shell.css` says it in as many words: a pair that belongs tight is ONE
     BLOCK put into the stack, and the inside of a block is the block's
     business. The standing heading keeps its 14 px to the picture, and the
     picture gives up the 14 px UNDER it, because the distance to the control
     row below is the stack's 40 and a component that carries its own gap
     carries it into places nobody meant. */
  .bay-dg > .pos-how { margin-top: 0; }
  .bay-dg > .pos-dg { margin-bottom: 0; }

  /* 🔴 THE `from` AND `to` PANEL IS THE READOUT'S OWN CELL SHAPE AND USES THE
     READOUT'S OWN CLASSES. Asked 2026-09-21 as *"a panel with 2 cols (like 2
     readings) from to what describe in and out"*, and `like 2 readings` is the
     reader pointing at a thing already on the page. Rolling a second cell look
     here would be the hand-rolled control defect in its cheapest form, so this
     borrows `.pos-readout`, `.pos-cell`, `.pos-k` and `.pos-v` and adds one
     thing they do not have: a detail line under the value.
     ⚠️ TWO DETAIL LINES, RESERVED WHETHER OR NOT THEY SAY ANYTHING. The panel
     rewrites itself while a hand is on an instrument, so it may not change its
     own height while somebody is looking at it. */
  .bay-d {
    display: block; min-height: 1.5em;
    font: 500 11px/1.5 var(--mono, ui-monospace, monospace); color: var(--dim2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* 🔴 THE PANEL AND THE SENTENCE UNDER IT ARE ONE BLOCK, NOT TWO SIBLINGS,
     AND THE REASON IS THAT THE SENTENCE IS EMPTY MOST OF THE TIME. The stack
     hides any `div` of its own with nothing in it, which is right for a wrapper
     somebody forgot to fill and wrong for a line that is deliberately blank
     until something is refused: the line would vanish, take the stack's 40 px
     with it, and the whole page would move the first time a pair could not be
     joined. Inside a block that rule does not reach it, so its reserved height
     is honoured. */
  .bay-panel > .bay-why { margin-top: 10px; }
  /* 🔴 TWO LINES RESERVED, NOT ONE. The validator's sentences run to about
     seventy characters and wrap at phone width, so a one line reservation is a
     reservation that is wrong exactly where the screen is smallest. */
  .bay-why { min-height: 36px; font-size: 12px; line-height: 1.5; color: var(--dim); }
  .bay-why[data-bad] { color: var(--bad, #e0908a); }

  /* 🔴 THE LATCH HAS TO LOOK LATCHED. A button that stays on after the pointer
     comes up and looks exactly like one that did not is a control whose state
     lives only in the page's head. `aria-pressed` carries it for a screen
     reader and this carries it for everybody else. */
  .pos-presence-btn[aria-pressed="true"] { border-color: var(--hi); }

  .bay-json {
    white-space: pre; overflow-x: auto; min-width: 0;
    padding: 10px; border: 1px solid var(--line); border-radius: 4px;
    background: var(--card); font: 12px/1.6 var(--mono, ui-monospace, monospace);
    color: var(--ink);
  }
  .bay-make { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
</style>
<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createMidiLog } from '/shell/midi-log.mjs';
  import { createPresenceButton } from '/shell/presence.mjs';
  import { createDiagram } from '/shell/diagram.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { decode } from '/shell/midi-decode.mjs';
  import { createBay, classOf, delivers } from '/shell/bay.mjs';
  import { describe } from '/shell/instruments.mjs';

  /**
   * 🔴 A PATCH BAY YOU PATCH WITH YOUR HANDS. `plans/plan-patchbay.md` is the
   * design and this is its first storey. The model, the validator and the text
   * form are all in `demo/shell/bay.mjs`, which is pure and is graded by
   * `node demo/shell/bay-test.mjs` with no browser, most of it negative
   * controls, because a validator is the one kind of code that passes a naive
   * test suite by returning `{ok: true}` to everything.
   *
   * 🔴 **THERE ARE NO TABLES ON THIS PAGE AND THAT IS THE FOURTH BUILD.**
   * Asked 2026-09-21: *"do not use tables. use the pathbay visualizer (i asked
   * to do it) above it below status button is a panel with 2 cols (like 2
   * readings) from to what describe in and out. when connected show connection
   * visualiser (json + diagram). when 2nd is conneted, stop waiting"*.
   * The first build was one row per port, the second was one row per port with
   * a `connect` button, the third was one row per instrument. Every one of them
   * answered a report about the page being hard to press by making the SCREEN
   * easier to press, and the report was never about the screen: a patch bay is
   * patched with your hands on the instruments. So the rows are gone, the
   * picture is what you read, and the two gestures that make a link are playing
   * one instrument and then playing another.
   *
   * 🔴 **THIS IS THE FIRST PAGE IN THIS REPOSITORY THAT SENDS TO AN
   * INSTRUMENT.** `/circuit/`, `/model/` and `/evo/` all listen. So the
   * `accepts` list below is not decoration, and the one line that matters is
   * that the Circuit's input does not accept SysEx: that device has no factory
   * reset, and one byte inside a SysEx message overwrites a patch.
   *
   * 🔴 **NOBODY HAS HEARD THIS PAGE DRIVE A REAL INSTRUMENT.** `HANDOFF.md`
   * carries it as an open line. Everything below is graded against a desk the
   * page invents for itself, which is the bindings, the refusals and the
   * counters. What is not graded anywhere is a note arriving at a synth.
   */

  /**
   * 🔴 WHAT EACH INSTRUMENT CONSENTS TO, AND WHY, MEASURED WHERE IT COULD BE.
   * ⚠️ **NOT `program`**, even though the Circuit answers it: a program change
   * on channel 1 loads a different patch over the one somebody is working on,
   * silently, and nothing on this page would say it had happened.
   * ⚠️ **NOT `clock`**: that Circuit was measured sending its own clock
   * continuously at about 122 bpm, which makes it the master. Sending it one is
   * an argument between two clocks.
   */
  /**
   * 🔴 `accepts` AND `never` ARE TWO DIFFERENT LISTS AND THE SECOND ONE IS THE
   * INSTRUMENT'S SAFETY. A class a port merely does not handle is dropped at
   * the boundary and the link says so; a class on `never` refuses the link
   * outright. The difference is between *I do not use that* and *that damages
   * me*, and the first build had only one list, which refused every real link
   * on this desk because a MIDI source emits six classes and a synth takes
   * three.
   */
  const CONSENT = [
    { match: /circuit/i, accepts: ['note', 'cc', 'bend'], never: ['sysex'],
      why: 'no SysEx, because one byte inside one overwrites a patch and this device has no factory reset' },
    { match: /model 12/i, accepts: ['note', 'cc'], never: ['sysex'],
      why: 'a desk, so notes and controllers only' },
    { match: /mk-?4\d\dc|evolution/i, accepts: [], never: ['sysex'],
      why: 'a controller with no sound engine, so nothing is worth sending to it' },
  ];
  const DEFAULT_ACCEPTS = ['note', 'cc', 'bend'];
  /** What a MIDI source can produce. A port cannot be asked, so this is the
   *  whole class list minus the one nothing here has ever been seen to send. */
  const EMITS = ['note', 'cc', 'bend', 'touch', 'program', 'clock'];

  const d = mount({
    name: 'bay',
    /* 🔴 ONE LINE, AND IT IS THE INDEX'S OWN LINE VERBATIM, because this page
       has a picture of its machinery on it. A paragraph and a diagram are two
       explanations of one thing and the paragraph is the weaker of them. */
    what: 'Play one instrument and then another to connect them.',
    /**
     * 🔴 NO READOUT, DECLARED RATHER THAN OMITTED. Asked 2026-09-21 as four
     * lines: *"rm instruments"*, *"links"*, *"sent"*, *"heard"*. `null` is the
     * DECLARATION that this page has nothing to put in a row of cells, which is
     * a different statement from somebody forgetting, and both harnesses read
     * it that way. The shell then leaves the box out entirely, so the page does
     * not paint the 2 px band an empty `.pos-readout` draws out of its own two
     * borders.
     * ⚠️ **AND ALL FOUR FACTS ARE REHOMED RATHER THAN DROPPED.** `instruments`
     * and `links` are the picture: the boxes are the instruments and the arrows
     * are the links, counted by looking. `sent` and `heard` moved into the
     * `from` and `to` cells, which is a better home than they had: they are
     * counted at OPPOSITE ENDS of one link, and in a readout they were two
     * cells side by side with nothing saying which end each belonged to.
     */
    readout: null,
    controls: [],
  });
  guard(d);

  const bay = createBay();
  const outs = new Map();              // port id -> the Web MIDI output behind it
  const rawName = new Map();           // port id -> the name CoreMIDI gave that port
  let access = null, sent = 0, heard = 0;
  /* THE INVARIANT: one instrument is held, or none is. There is no state in
     which a complete pair is sitting around waiting, because the gesture that
     completes a pair also tries it. */
  let pick = null;                     // the held instrument, by its node key

  // ── the two column panel ────────────────────────────────────────────────

  /**
   * One cell: a key, a value and two detail lines, which is a readout cell with
   * room for the thing a readout cell cannot say. The value is the instrument;
   * the lines under it are what that end of the wire does and what has actually
   * crossed it.
   */
  function cell(key) {
    const box = el('div', 'pos-cell');
    const v = el('span', 'pos-v');
    v.dataset.state = 'pending';
    const does = el('span', 'bay-d');
    const count = el('span', 'bay-d');
    box.append(el('span', 'pos-k', key), v, does, count);
    return { el: box, v, does, count };
  }
  const fromCell = cell('from');
  const toCell = cell('to');
  /* ⚠️ `bay-pair` CARRIES NO RULE AND IS THERE TO BE TOLD APART. This is the
     readout's own look on a page that has declared it has no readout, so a
     reader finding `.pos-readout` in this DOM needs one word saying which of
     the two it is. The shell's own hidden one is a sibling of the page, not a
     child of it. */
  const pair = el('div', 'pos-readout bay-pair');
  pair.append(fromCell.el, toCell.el);

  const why = el('div', 'bay-why');
  const panel = el('div', 'bay-panel');
  panel.append(pair, why);

  /**
   * 🔴 THE CONNECTION AS JSON, AND IT CARRIES NAMES RATHER THAN PORT IDS.
   * Asked 2026-09-21: *"when connected show connection visualiser (json +
   * diagram)"*. The picture above is the diagram half and this is the other.
   * ⚠️ **AND `here:` IS GONE WITH THE LINE THAT USED TO PRINT IT.** That prefix
   * is the SITE segment of a port id and it means *this machine*, which is a
   * word out of this project's own vocabulary and is on the banned list for
   * anything a visitor reads. It was also saying nothing: every port on this
   * page is local, so the segment that exists to tell two machines apart was
   * printing the same word on every row. Asked as *"what is here?"*, which is
   * the question answering itself.
   * ⚠️ **AND IT HOLDS NO COUNTERS.** What has crossed a link changes many times
   * a second and belongs in the two cells above, which are fixed boxes. This
   * block says what the connection IS, so it is rewritten only when one is made
   * or removed.
   */
  const json = el('pre', 'bay-json');
  json.hidden = true;

  const clearAll = el('button', 'pos-btn', 'clear', { type: 'button' });
  clearAll.title = 'put down the instrument being held and remove every connection';
  /**
   * 🔴 PANIC, AND IT EXISTS BECAUSE MIDI IS NOW ACTUALLY FLOWING. Reported
   * 2026-09-21, minutes after this page first carried a note to an instrument:
   * *"got stuch notes. panic/noteoff?"* A stuck note is a held voice on
   * somebody's synth with nothing on screen able to release it, and the only
   * other way out is unplugging the instrument.
   * 🔴 IT DOES NOT GO IN `.pos-controls`. `demo/verify.mjs` presses every button
   * in that row on every run, dozens of times a day, and this one reaches every
   * output on the desk. It sits beside `clear`, which is where this page already
   * keeps the things that act.
   * ⚠️ AND IT IS A SECOND WAY OUT OF THIS PAGE, WHICH IS THE THING WORTH
   * DECLARING. `deliver` was the only exit and that made "this page has only
   * ever sent notes, controllers and bend" an assert over a counter rather than
   * a claim about a file. Panic must not route through a LINK, because a broken
   * or removed link is exactly when it is needed, so it reaches the outputs
   * directly. It therefore shares `toBytes` and bumps the same counter, and
   * there is an assert that it can express nothing new.
   */
  const panic = el('button', 'pos-btn', 'panic', { type: 'button' });
  panic.title = 'send all notes off and all sound off on every channel to every '
    + 'instrument this page can reach, whatever is linked';
  panic.onclick = () => allOff();
  const make = el('div', 'bay-make');
  make.append(clearAll, panic);

  const traffic = createMidiLog({ empty: 'connect something, then play it' });

  d.stack.add(panel, json, make, traffic.el);

  // ── the picture ─────────────────────────────────────────────────────────

  /**
   * 🔴 THE PATCH BAY VISUALISER, AND IT IS A SECOND ASK RATHER THAN A NEW ONE.
   * *"use the pathbay visualizer (i asked to do it)"*, and the first ask is on
   * the record from earlier the same day, said while specifying a different
   * page: *"So the patcbay visualiser table plus fiagram"*. So the visualiser
   * was defined as a table beside a picture, and *"do not use tables"* in the
   * same breath as this one settles which half survives here.
   *
   * 🔴 IT IS ONE PICTURE DOING BOTH JOBS THE ASK NAMES. At rest it is the bay:
   * every instrument the browser can see, and what each one can do. With a
   * connection it is the connection: an arrow from the sender to the receiver
   * carrying what actually gets through. A second picture for the second job
   * would be two drawings of one graph that can disagree, and a page gets one
   * diagram.
   *
   * 🔴 AND IT SITS ABOVE THE CONTROL ROW, WHICH IS WHERE IT WAS ASKED TO SIT.
   * That is the one place the standing rule does not put a diagram, and the
   * standing rule has an exception written for exactly this shape: a picture
   * that REPAINTS WHEN THE READER DOES SOMETHING is a reading rather than
   * reference, so it belongs beside the thing it reads. This one repaints when
   * an instrument is played, so it qualifies the same way `/pack/`'s does. What
   * does not change is the treatment: the same component, the same standing
   * `How it works` heading, no title of its own, one per page.
   *
   * 🔴 `join: false`, AND IT IS THE ONE DETAIL THAT DECIDES WHETHER THIS
   * PICTURE IS TRUE. An arrow between two neighbours inside a container is the
   * component's DEFAULT, so without this the picture would draw a line between
   * every instrument sitting next to every other one, which is a drawing of a
   * patch nobody made on a page whose whole subject is which things are
   * patched. `dg.ties === 0` is asserted below, and it is the negative control
   * for it.
   *
   * ⚠️ AND THE INSTRUMENTS ARE CHILDREN OF ONE CONTAINER SO THE PICTURE CANNOT
   * CHANGE HEIGHT WHEN SOMEBODY PLAYS SOMETHING. Drawn as free boxes they would
   * be laid out by how far each one sits along the flow, so making a link would
   * move a box into a second column and the figure would get shorter under the
   * hand that made it. Children of a machine stack in one column whatever the
   * arrows do.
   */
  const dgSpec = { caption: '', nodes: [], links: [] };
  const dgHost = el('div', 'bay-dg');
  d.column.before(d.controls, dgHost);
  const dg = createDiagram(dgHost, dgSpec, { how: true, atEnd: false });

  // ── instruments, which are a grouping this page makes over ports ─────────

  /**
   * 🔴 ONE BOX PER INSTRUMENT, NOT ONE PER PORT. Reported three times, the last
   * as *"do press 1st intrument then another linking"*, and every report said
   * **device** or **instrument** where the page said **port**. A MIDI wire has
   * two halves and a desk does not: the Circuit appeared twice, once to send
   * and once to receive, so somebody looking for it found two Circuits and had
   * to know which of them takes notes. Worse, one of every keyboard's two rows
   * was a DEAD END: the MK-425C accepts nothing, so its receiving half existed
   * only to be refused.
   *
   * 🔴 NOTHING ABOUT THE MODEL CHANGED, AND THAT IS DELIBERATE.
   * `demo/shell/bay.mjs` is ports and links, it is pure, and
   * `node demo/shell/bay-test.mjs` grades it with no browser. An instrument is
   * a grouping THE PAGE makes, recomputed from `bay.ports()` on every paint, so
   * there is no second store that can drift from the first.
   *
   * 🔴 THE GROUPING KEY IS THE NODE SEGMENT OF THE PORT ID, WHICH IS THE SLUG
   * OF THE INSTRUMENT'S NAME WITH ITS DIRECTION WORD REMOVED. `bay.mjs` already
   * walks nodes rather than ports to find a loop, so `site:node` is the model's
   * own word for one machine and this page is not inventing a unit.
   * ⚠️ A NAME IS A FRAGILE KEY AND THE DIRECTION WORD IS WHY. MEASURED on this
   * desk and written down in `plans/plan-fasttrack-mk425c.md` section 8.1:
   * CoreMIDI offers the Model 12 as a source called `Model 12 MIDI IN` and a
   * destination called `Model 12 MIDI OUT`. One instrument, spelled differently
   * on its two sides, so a raw name would have split it in two.
   * ⚠️ IT FAILS BY SPLITTING RATHER THAN BY MERGING, WHICH IS THE SAFE
   * DIRECTION. A pair of names it cannot match leaves two boxes, each saying in
   * its own sub what it can and cannot do, and nothing is hidden. A wrong MERGE
   * would be worse, because it would send notes at a different physical
   * instrument from the one whose name was played.
   * ⚠️ TWO INSTRUMENTS WITH ONE NAME GET A NUMBERED NODE and stay two boxes.
   * ⚠️ AND A PORT BELONGING TO NO RECOGNISABLE INSTRUMENT IS STILL A BOX. An
   * IAC bus and a virtual port each become their own instrument, named whatever
   * they are called. A box that vanished would say the port does not exist,
   * which is a different and false statement.
   */
  /**
   * 🔴 THE NAME COMES FROM THE TAXONOMY, NOT FROM THE CABLE. Asked 2026-09-21
   * as *"can you not enrich the names with brands etc"* and *"have a
   * taxononomy"*. CoreMIDI calls that port `MK-425C USB MIDI Keyboard`; the
   * instrument is an **Evolution** MK-425C, and the maker was in none of the
   * strings this page had. `demo/shell/instruments.mjs` is the one place that
   * knows, graded with no browser.
   * ⚠️ AND THE RAW NAME IS STILL KEPT AND STILL PRINTED, in the log and on the
   * box that carries it, because it is the only thing tying a box back to a
   * cable and the thing a reader needs when two devices are named alike.
   */
  const instrumentName = (raw) => describe(raw).label;
  const nodeOf = (id) => id.split(':').slice(0, 2).join(':');

  /** Every instrument on the desk, in the order its first port was adopted. */
  function instruments() {
    const by = new Map();
    for (const p of bay.ports()) {
      const node = nodeOf(p.id);
      let g = by.get(node);
      if (!g) { g = { node, label: p.label, out: null, in: null }; by.set(node, g); }
      if (p.dir === 'out' && !g.out) g.out = p;
      if (p.dir === 'in' && !g.in) g.in = p;
    }
    return [...by.values()];
  }
  const instrument = (node) => instruments().find((g) => g.node === node);

  /**
   * 🔴 EVERY INSTRUMENT BY NAME, AND WHICH HALVES IT HAS. Reported 2026-09-21
   * as *"bay does not connect by i get midi events"*, and this page could not
   * answer it: it logged a COUNT. A count cannot tell a reader whether the
   * grouping split one instrument into two, whether the thing they expected is
   * absent, or whether the half they need is missing, and those are three
   * different faults with one symptom.
   * ⚠️ IT IS A FUNCTION RATHER THAN A LOOP INSIDE THE STATUS HANDLER SO THE
   * CHECKS GRADE THE REAL THING. Inline, the assert below could only ever have
   * read a log written before its own fixtures existed.
   * ⚠️ AND NO LEADING SPACES. Reported 2026-09-21 with a crop: *"can we avind
   * this uglu wrapping / indent?"* `.pos-log` is a GRID, so a wrapped message
   * already aligns under where the message began, and two literal spaces
   * indented the FIRST line only.
   */
  function sayInstruments() {
    for (const g of instruments()) {
      const halves = g.out && g.in ? 'sends and takes'
        : g.out ? 'sends only' : g.in ? 'takes only' : 'neither';
      const raw = [g.out, g.in].filter(Boolean)
        .map((x) => rawName.get(x.id))
        .filter((x, i, a) => x && a.indexOf(x) === i
          /* Redundant once the label carries the same words. `Model 12 DAW
             Control OUT` adds nothing beside `TASCAM Model 12 DAW control`. */
          && !x.toLowerCase().startsWith(g.label.toLowerCase().split(' ').slice(1).join(' ')));
      d.log(`${g.label}, ${halves}${raw.length ? ` (${raw.join(', ')})` : ''}`);
    }
  }

  /**
   * One candidate link: this instrument's output into that one's input, asked
   * of the validator.
   * 🔴 THE BOX AND THE GESTURE COME FROM THIS ONE CALL. `paint()` asks it to
   * fill each box's sub and `played()` asks it to make the link, so a box
   * reading `ready` cannot be a box whose instrument is refused, and the
   * sentence on a refused box is the same sentence the gesture would print.
   */
  function candidate(src, dst) {
    if (!src.out) return { ok: false, why: `${src.label} has no output, so nothing leaves it` };
    if (!dst.in) return { ok: false, why: `${dst.label} has no input, so nothing can reach it` };
    const transforms = suggest(src.out.id, dst.in.id);
    return { from: src.out.id, to: dst.in.id, transforms,
      ...bay.validate(src.out.id, dst.in.id, transforms) };
  }

  /**
   * 🔴 THE DIRECTION IS DECIDED BY THE ORDER OF PLAYING AND IS NEVER
   * DISCOVERED. Two instruments that can each both send and receive give two
   * possible links, and the only signal a page has is which one was played
   * first, so **THE FIRST ONE SENDS**. The `from` cell says so the moment that
   * gesture lands, before there is anything to be surprised by, and every other
   * box's sub is computed for that one direction.
   * ⚠️ AN INSTRUMENT THAT CAN ONLY RECEIVE IS NOT AMBIGUOUS AND DOES NOT NEED
   * THE RULE. There is one possible link, so it is used, and the panel reads
   * the other way round.
   * ⚠️ AND A REFUSED PAIR IS NOT QUIETLY TURNED ROUND. Sending the other way
   * because this way was refused would make a box's sub a guess about what a
   * gesture will do, and that sub is the only thing on the page that answers
   * before the gesture.
   */
  function plan(held, other) {
    return held.out ? candidate(held, other) : candidate(other, held);
  }

  /** What actually gets through a link, which is what its arrow carries. */
  function crosses(from, to, transforms) {
    const a = bay.port(from), b = bay.port(to);
    if (!a || !b) return [];
    let could;
    try { could = delivers(a.emits || [], transforms || []); }
    catch { return []; }
    return [...could].filter((c) => (b.accepts || []).includes(c));
  }

  /** A transform in the words a reader uses, never the compact form. */
  const transformWords = (t) => (t.op === 'channel' ? `channel ${t.to}`
    : t.op === 'transpose' ? `transpose ${t.by > 0 ? '+' : ''}${t.by}`
    : t.op === 'drop' ? `drop ${t.cls}`
    : t.op === 'keep' ? `keep ${t.cls}`
    : t.op);

  /** One link as a sentence, with instrument names and no port ids in it. */
  function linkWords(l) {
    const a = bay.port(l.from)?.label || l.from;
    const b = bay.port(l.to)?.label || l.to;
    const t = (l.transforms || []).map(transformWords).join(', ');
    return `${a} to ${b}${t ? `, ${t}` : ''}`;
  }

  // ── waiting, which is what the one control does ─────────────────────────

  /**
   * 🔴 THE STATUS BUTTON IS A LATCH, NOT A MOMENTARY CONTROL. Asked
   * 2026-09-21: *"online status button: 'wait for instrument' (like push to
   * talk but does not lose state on mouseup)"*. So the shape named is push to
   * talk with the release taken out: one press arms it and it stays armed
   * through the mouse coming up, through the pointer leaving, and through the
   * button losing focus.
   * 🔴 AND THE WAIT ENDS ON ITS OWN WHEN THE WORK IS DONE: *"when 2nd is
   * conneted, stop waiting"*. Two gestures make a link, so the second one is
   * the end of what the wait was for and the button says `connected` rather
   * than sitting armed with nothing left to catch.
   * ⚠️ PRESSING IT WHILE IT IS WAITING PUTS IT DOWN, because a latch with no
   * way out is a control that can only ever be pressed once, and a press that
   * appears to do nothing is this page's oldest complaint.
   * ⚠️ AND THE FOUR WORDS ARE THE BADGE'S OWN STATES RATHER THAN A LABEL THIS
   * PAGE WRITES. Grey and still is a thing nobody has asked yet, grey and
   * moving is a question that is out, green is a thing that answered. Waiting
   * for somebody to play an instrument is a question that is out.
   */
  let waiting = false, opened = false, checked = false;

  const pres = createPresenceButton({
    of: 'instrument', showName: false, state: 'unknown',
    can: ['unknown', 'checking', 'coming', 'online', 'offline'],
    says: {
      unknown: 'wait for instrument',
      checking: 'looking',
      coming: 'waiting',
      online: 'connected',
      offline: 'no instruments',
    },
    press: () => d.run('wait'),
  });
  pres.el.setAttribute('aria-label', 'wait for an instrument to be played');
  pres.el.setAttribute('aria-pressed', 'false');
  d.controls.hidden = false;
  d.controls.append(pres.el);

  function startWaiting() {
    waiting = true;
    pres.el.setAttribute('aria-pressed', 'true');
    pres.set('coming');
    say(pick ? `${instrument(pick)?.label || 'one instrument'} is held. Play the one it should reach.`
             : 'Play an instrument, then play the one it should reach.');
  }

  function stopWaiting(state, because) {
    waiting = false;
    pres.el.setAttribute('aria-pressed', 'false');
    pres.set(state, because ?? null);
  }

  // ── playing, which is how a link is made ────────────────────────────────

  /**
   * 🔴 PLAY ONE INSTRUMENT, PLAY THE NEXT, AND THEY ARE LINKED. Asked four
   * times before it was understood: *"can not get the bay work"*, *"do press
   * 1st intrument then another linking"*, *"bay does not connect ... when
   * playing instruments"*, and finally *"i want connection from pressing
   * cntroller keys on 1rst and second instrument"*. Every earlier answer made
   * the SCREEN easier to press. The ask was never about the screen.
   *
   * 🔴 IT IS A NOTE ON AND NOTHING ELSE, AND THAT IS NOT FUSSINESS. CLAUDE.md
   * records that the Circuit on this desk **sends its own clock continuously at
   * about 122 bpm**, which makes it the master. A rule that picked *the last
   * instrument that sent anything* would therefore pick the Circuit forever,
   * within a millisecond of the page opening, and nothing a person did could
   * ever change it. Clock, active sensing, aftertouch and program changes are
   * traffic; a note on with velocity is a decision.
   * ⚠️ AND VELOCITY ZERO IS A NOTE OFF, whatever the status byte says. Releasing
   * a key must not count as a second gesture, or every single press would pick
   * two instruments.
   *
   * ⚠️ THE PICK EXPIRES, because a patch bay that remembers a note from four
   * minutes ago links two things nobody meant to join. `PLAY_WINDOW` is the
   * whole of the promise: the two gestures are one gesture in two places.
   * ⚠️ AND PLAYING THE SAME INSTRUMENT AGAIN ONLY REFRESHES IT rather than
   * closing a loop on itself, so holding a chord and thinking about it is free.
   */
  const PLAY_WINDOW = 12000;
  let playAt = 0;

  /**
   * Is this message a deliberate gesture rather than traffic?
   *
   * 🔴 A NOTE ON AND NOTHING ELSE, AND THE FIRST BUILD ALSO ACCEPTED A
   * CONTROLLER AND A BEND, WHICH A LOOPBACK TURNED INTO A DEFECT WITHIN A
   * MINUTE. MEASURED in a real browser on this desk: `IAC Driver Bus 1` is a
   * loopback, so every byte this page sends to its output arrives back on its
   * input. `panic` sends 32 control changes to every output, they came straight
   * back, and the page read them as somebody playing the IAC bus and linked the
   * keyboard to it. The log said it had connected them, which looks exactly
   * like the feature working.
   * ⚠️ A KNOB TURN PICKING AN INSTRUMENT WAS THE NICER BEHAVIOUR AND IT LOST TO
   * THIS, which is the right way round: a loopback hijacking the bay is a bug
   * and a knob not picking is a smaller feature.
   */
  function isGesture(m) {
    return classOf(m) === 'note' && (m.d2 ?? 0) > 0;
  }

  /**
   * 🔴 AND NOTES ECHO TOO, WHICH THE FILTER ABOVE CANNOT CATCH. A link into a
   * loopback sends notes to its output and they arrive back on its input, so
   * the bay would read its own traffic as a gesture and pick the bus it had
   * just been told to feed. So a port is deaf for a moment after this page
   * sends to it: not to what it delivers, which is the whole job, but to what
   * it READS BACK as a decision.
   * ⚠️ IT IS PER PORT rather than one global gate, because a real hand on a
   * second instrument during that moment is a real gesture and must not be
   * swallowed.
   * ⚠️ AND IT IS 250 ms, WHICH IS A GUESS WITH A REASON. CoreMIDI loopback is
   * sub-millisecond, so this is two orders of magnitude of headroom; the cost
   * of it being too long is that playing the same instrument you just patched
   * INTO is ignored for a quarter of a second, and the cost of too short is the
   * defect above.
   */
  const ECHO_MS = 250;
  const echoUntil = new Map();            // port id -> when it may be believed again
  const hush = (id) => echoUntil.set(id, performance.now() + ECHO_MS);
  const hushed = (id) => (echoUntil.get(id) ?? 0) > performance.now();

  /**
   * 🔴 A LOOPBACK IS A DESTINATION, NOT SOMETHING YOU PLAY. Asked 2026-09-21
   * after it hijacked the bay: *"can we ignore iac"*.
   * `IAC Driver Bus 1` is a macOS virtual bus. Nobody presses a key on it, so
   * it can never be the instrument somebody meant, and everything sent to it
   * comes back on its input where it looks exactly like somebody playing.
   * ✅ **IT KEEPS ITS BOX, WHICH IS THE HALF THAT MATTERS.** This page's own
   * rule is that a port which vanished says it does not exist, and that is a
   * different and false statement: routing to the IAC bus is how you reach
   * another application on this machine, and it is a real thing to want.
   * ⚠️ AND THE ECHO HUSH STAYS DESPITE THIS. It is not redundant: other virtual
   * buses exist under other names, and two instruments daisy-chained through a
   * DIN socket echo the same way with nothing in their names to say so.
   */
  /* 🔴 THE RULE IS THE TAXONOMY'S NOW, not a second regular expression here.
     `plays: false` sits on the entry with the reason beside it, and the
     module's test asserts it is the only entry carrying it. */
  const neverPlayed = (raw) => describe(raw).plays === false;

  function played(portIdOfSender, m) {
    if (!isGesture(m)) return;
    /* This page just sent to the other half of this instrument, so what has
       arrived is very likely its own bytes coming back. */
    if (hushed(nodeOf(portIdOfSender))) return;
    if (neverPlayed(rawName.get(portIdOfSender) || '')) return;
    const node = nodeOf(portIdOfSender);
    const g = instrument(node);
    if (!g) return;
    const now = performance.now();
    /* A pick older than the window is not a held thought, it is a forgotten
       one. Drop it and treat this gesture as a fresh first one. */
    if (pick && now - playAt > PLAY_WINDOW) {
      say(`${instrument(pick)?.label || 'the last instrument'} was let go, so this starts again`);
      pick = null;
    }
    playAt = now;
    if (!pick) {
      pick = node;
      const alone = instruments().length < 2;
      say(alone
        ? `${g.label} is the only instrument here, so there is nothing to connect it to`
        : `${g.label} sent something. Play the one it should reach.`, alone);
      d.log(`${g.label} is held by playing it. Play another instrument to connect them.`);
      paint();
      return;
    }
    if (node === pick) { paint(); return; }         // still the same hand
    const held = instrument(pick);
    const plan0 = plan(held, g);
    if (!plan0.from) { say(plan0.why, true); paint(); return; }
    const r = bay.link(plan0.from, plan0.to, plan0.transforms);
    if (!r.ok) {
      say(r.why, true);
      d.log(`${held.label} to ${g.label} was refused: ${r.why}`, 'warn');
      paint();
      return;
    }
    const made = bay.links().at(-1);
    say(r.warn || `${bay.port(plan0.from).label} now reaches ${bay.port(plan0.to).label}`, !!r.warn);
    d.log(`connected by playing them: ${linkWords(made)}`);
    pick = null;
    /* 🔴 THE SECOND INSTRUMENT IS WHAT THE WAIT WAS FOR, SO THE WAIT ENDS HERE.
       Asked as *"when 2nd is conneted, stop waiting"*. */
    if (waiting) stopWaiting('online');
    paint();
  }

  /* ⚠️ `clear` DOES NOT CANCEL THE WAIT. Putting the patch down and stopping
     waiting for the next one are two different intentions, and the button that
     latches is the one that should unlatch. What it does do is take the badge
     off `connected`, because nothing is connected any more. */
  clearAll.onclick = () => {
    for (const l of bay.links()) bay.unlink(l.id);
    pick = null;
    say('');
    if (!waiting) pres.set('unknown');
    paint();
  };

  /**
   * 🔴 THE TRANSFORMS THE SMALLEST USEFUL PATCH ON THIS DESK NEEDS, AND BOTH
   * NUMBERS ARE MEASURED. The MK-425C's global channel is **2** and the
   * Circuit's first synth listens on **1**, so without a channel transform the
   * keyboard plays Synth 2, which is correct and is not what anybody means by
   * *play the Circuit*. And that keyboard was measured **a semitone flat**,
   * notes 47 to 71 where a 25 key controller sits at 48 to 72.
   * ⚠️ THEY ARE A SUGGESTION THE PAGE MAKES AND SHOWS, not something it does
   * quietly: a box that is `ready` says the whole link, transforms and all,
   * in the line under the picture, before the gesture that makes it.
   */
  function suggest(fromId, toId) {
    const a = bay.port(fromId), b = bay.port(toId);
    if (!a || !b || a.medium !== 'midi') return [];
    const t = [];
    if (/circuit/i.test(b.label)) t.push({ op: 'channel', to: 1 });
    if (/mk-?4\d\dc|evolution/i.test(a.label)) t.push({ op: 'transpose', by: 1 });
    return t;
  }

  function say(text, bad = false) {
    why.textContent = text;
    if (bad) why.dataset.bad = '1'; else delete why.dataset.bad;
  }

  // ── painting ────────────────────────────────────────────────────────────

  /** A cell's value, with the readout's own rule about an unmeasured one. */
  function setCell(c, name, does, count) {
    c.v.textContent = name || '';
    if (name) delete c.v.dataset.state; else c.v.dataset.state = 'pending';
    c.does.textContent = does || '';
    /* Nothing unmeasured prints as `0`. A zero here would read as a very
       confident measurement of nothing having crossed. */
    c.count.textContent = count || '';
  }

  /**
   * 🔴 THE REFUSAL IS STILL SHOWN BEFORE THE GESTURE, AND WITH THE TABLE GONE
   * IT MOVED INTO THE PICTURE. Every box is asked, while one instrument is
   * held, whether it could be the other end: the answer is one word in the
   * box's sub and the validator's own sentence in the line under the picture.
   * So a pair that cannot be joined says why without anybody playing anything,
   * which is the rule the `connect` button used to carry, two builds on.
   */
  function paint() {
    const held = pick ? instrument(pick) : null;
    const list = instruments();

    /* 🔴 A CONTAINER IS NEVER EMPTY, so a bay with nothing in it still holds
       one box, and that box says the true thing: the browser's own MIDI has not
       been opened, and a visit opens nothing. */
    const kids = list.length ? list.map((g) => boxFor(g, held)) : [{
      id: 'none', label: 'Web MIDI', sub: 'not opened', tech: 'browser',
      note: 'The browser\'s own list of instruments. Nothing is read from it until the '
          + 'button under this picture is pressed, so a visit opens no instrument.',
    }];

    dgSpec.nodes = [{
      id: 'here', label: 'Browser', kind: 'here', tech: 'browser',
      sub: 'Web MIDI', join: false, children: kids,
    }];
    dgSpec.links = list.length ? bay.links().map((l) => {
      const carries = crosses(l.from, l.to, l.transforms);
      const t = (l.transforms || []).map(transformWords).join(', ');
      return {
        from: nodeOf(l.from), to: nodeOf(l.to),
        label: carries.join(' ') || 'nothing',
        note: `${carries.length ? `Only ${carries.join(', ')} get through. ` : 'Nothing gets through. '}`
            + (t ? `The page rewrites each one on the way: ${t}.` : 'Nothing is rewritten on the way.'),
      };
    }) : [];

    /* 🔴 THE CAPTION IS KEPT SHORT AND ROUGHLY ONE LENGTH IN EVERY STATE,
       because the line under a picture reserves its height for the TALLEST
       string it can ever hold and the caption is one of them. A caption that
       ran to three lines while one instrument was held and one line otherwise
       would move the whole page every time somebody played a key, which is the
       jump this project has already been reported for once. So a desk of six
       connections names the newest one and counts the rest rather than listing
       them all. */
    const links = bay.links();
    dgSpec.caption = !list.length
      ? 'Press the button below to read the instruments this browser can see.'
      : links.length
        ? `${links.length === 1 ? 'One connection' : `${links.length} connections, newest`}: `
          + `${linkWords(links.at(-1))}.`
        : held
          ? `${held.label} is held, and each box says whether it can take it.`
          : `${list.length} instrument${list.length === 1 ? '' : 's'}, nothing connected.`;
    dg.render();

    /* The two cells: the sender on the left, the receiver on the right, each
       one carrying the counter that belongs to ITS end of the wire. */
    const live = links.at(-1);
    const src = live ? bay.port(live.from) : held?.out ? held.out : null;
    const dst = live ? bay.port(live.to) : (held && !held.out ? held.in : null);
    setCell(fromCell, src ? src.label : '',
      src ? `sends ${(src.emits || []).join(' ') || 'nothing'}` : '',
      sent ? `${sent} sent` : '');
    setCell(toCell, dst ? dst.label : '',
      dst ? `takes ${(dst.accepts || []).join(' ') || 'nothing'}` : '',
      heard ? `${heard} heard` : '');

    /* 🔴 THE JSON APPEARS WHEN SOMETHING IS CONNECTED AND NOT BEFORE, which is
       what was asked for. An empty block would be a box painting its own edges
       around nothing, which this project already has a rule about. */
    json.hidden = links.length === 0;
    json.textContent = links.map((l) => JSON.stringify({
      from: { instrument: bay.port(l.from)?.label ?? null,
              sends: bay.port(l.from)?.emits ?? [] },
      to: { instrument: bay.port(l.to)?.label ?? null,
            takes: bay.port(l.to)?.accepts ?? [] },
      carries: crosses(l.from, l.to, l.transforms),
      transforms: l.transforms ?? [],
    }, null, 2)).join('\n\n');
  }

  /**
   * One instrument as a box.
   *
   * 🔴 THE SUB IS WHAT CHANGES AND THE NOTE IS FIXED, WHICH IS THE ONLY WAY A
   * LIVE PICTURE KEEPS ONE HEIGHT. MEASURED here before it was written down:
   * with the refusal sentence moving into and out of the note, the figure was
   * **272.0 px at rest and 252.4 px with an instrument held**, because the line
   * under a picture reserves its height for the TALLEST string it will ever
   * hold and every box's note is in that set. Nearly 20 px of the page moving
   * under the hand that is playing, on a picture that sits ABOVE the control
   * row with everything else beneath it.
   * ⚠️ IT IS THE DISCIPLINE `/pack/` ALREADY USES and the reason that page can
   * assert 444.1 px at rest against 444.0 px loaded: only the subs move there
   * too. A sub is one short word in a fixed box; a note is a sentence in a line
   * whose height is reserved.
   *
   * 🔴 AND THE REFUSAL IS STILL READABLE BEFORE ANYTHING IS PLAYED, which is
   * the rule that must survive every rebuild of this page. The sub is the
   * verdict, `ready` or `refused`, computed for the held instrument; the note
   * is the instrument's own reason for taking what it takes, which is the same
   * fact the validator refuses on. The Circuit's note names SysEx because that
   * is why it refuses a source that could carry one.
   */
  function boxFor(g, held) {
    let sub = g.out && g.in ? 'sends, takes'
      : g.out ? 'sends only' : g.in ? 'takes only' : 'neither';
    if (held) sub = g.node === pick ? 'picked' : (plan(held, g).ok ? 'ready' : 'refused');
    return { id: g.node, label: g.label, sub, tech: 'device', note: noteFor(g) };
  }

  /** What this instrument consents to and why, which never changes. */
  function noteFor(g) {
    const bus = g.out && neverPlayed(rawName.get(g.out.id) || '');
    const takes = g.in ? ((g.in.accepts || []).join(', ') || 'nothing') : 'nothing';
    const first = bus
      ? 'A virtual bus rather than an instrument, so it is reached by connecting to it and never by playing it.'
      : `It takes ${takes}.`;
    const reason = g.in?.note
      || (g.in ? '' : 'it has no input, so it can only ever be the sending end of a link');
    return [first, reason && `${reason[0].toUpperCase()}${reason.slice(1)}.`]
      .filter(Boolean).join(' ');
  }

  // ── the wire ────────────────────────────────────────────────────────────

  function consentFor(name) {
    const rule = CONSENT.find((c) => c.match.test(name));
    return rule ? rule : { accepts: DEFAULT_ACCEPTS, never: ['sysex'], why: '' };
  }

  /**
   * A port id, whose node segment is the grouping key. See `instruments()`.
   * 🔴 IT IS NUMBERED WHEN IT IS TAKEN, because two instruments with one name
   * used to mint one id and the second silently replaced the first in the port
   * map: two keyboards on the desk, one box on the page, and no way to reach
   * whichever of them lost.
   */
  function portId(name, dir) {
    const base = slug(instrumentName(name));
    let node = base, n = 1;
    while (bay.port(`here:${node}:${dir}`)) node = `${base}-${++n}`;
    return `here:${node}:${dir}`;
  }

  /** One Web MIDI port becomes one bay port. */
  function adoptInput(p) {
    const id = portId(p.name, 'out');
    rawName.set(id, p.name || 'unnamed');
    bay.addPort({ id, label: instrumentName(p.name), dir: 'out', medium: 'midi',
      shape: { protocol: '1.0' }, emits: EMITS, note: p.manufacturer || '' });
    p.onmidimessage = (e) => {
      const m = decode(Array.from(e.data));
      /* 🔴 PATCHING BY PLAYING, AND IT IS THE THING THAT WAS ASKED FOR FOUR
         TIMES. `played()` is before the flood policy on purpose: a gesture must
         pick an instrument even on a port the log has decided to stop listing. */
      played(id, m);
      if (!traffic.add(m)) return;          // the flood policy lives in the log
      const ev = { cls: classOf(m), ch: m.ch, d1: m.d1, d2: m.d2 };
      sent += bay.send(id, ev);
      countersOnly();
    };
  }

  function adoptOutput(p) {
    const id = portId(p.name, 'in');
    rawName.set(id, p.name || 'unnamed');
    /* ⚠️ THE CONSENT RULE IS MATCHED ON THE RAW NAME, never on the grouped one.
       It is the fullest thing there is to match, and the patterns are about
       device families, which a trailing `OUT` never carried. */
    const c = consentFor(p.name || '');
    bay.addPort({ id, label: instrumentName(p.name), dir: 'in', medium: 'midi',
      shape: { protocol: '1.0' }, accepts: c.accepts, never: c.never ?? ['sysex'], note: c.why,
      deliver: (ev) => {
        const bytes = toBytes(ev);
        if (!bytes) return;
        /* ⚠️ A REAL SEND, AND THE ONLY ONE ON THIS PAGE. Everything upstream of
           here is arithmetic; this is the byte leaving the building. */
        try { outs.get(id)?.send(bytes); hush(nodeOf(id)); heard++; countersOnly(); }
        catch (err) { d.log(`${p.name} refused a message: ${err.message}`, 'warn'); }
      } });
    outs.set(id, p);
  }

  /**
   * 🔴 THE TWO COUNTERS MOVE WITHOUT REDRAWING THE PICTURE. They change many
   * times a second while a key is held, and re-laying out a diagram at that
   * rate would be the live-caption defect with a figure attached. The cells
   * they live in are fixed boxes with a reserved line, so only the text moves.
   */
  function countersOnly() {
    fromCell.count.textContent = sent ? `${sent} sent` : '';
    toCell.count.textContent = heard ? `${heard} heard` : '';
  }

  /**
   * 🔴 AN EVENT BACK INTO BYTES, AND THE LIST IS SHORT ON PURPOSE. There is no
   * branch here for SysEx, for a program change or for a clock byte, so none of
   * them **can be expressed**, whatever a link says. That is `/circuit/`'s guard
   * and it is deliberately a second wall behind the `accepts` list: a list is a
   * declaration and this is arithmetic.
   */
  function toBytes(ev) {
    const ch = Math.max(0, Math.min(15, (ev.ch ?? 1) - 1));
    if (ev.cls === 'note') return [(ev.d2 === 0 ? 0x80 : 0x90) | ch, ev.d1, ev.d2 ?? 0];
    if (ev.cls === 'cc') return [0xb0 | ch, ev.d1, ev.d2 ?? 0];
    if (ev.cls === 'bend') return [0xe0 | ch, ev.d1 ?? 0, ev.d2 ?? 64];
    return null;
  }

  /**
   * 🔴 ALL NOTES OFF AND ALL SOUND OFF, ON EVERY CHANNEL, TO EVERY OUTPUT.
   * CC 123 is All Notes Off and CC 120 is All Sound Off, and both are ordinary
   * channel mode control changes, so this expresses NOTHING `toBytes` could not
   * already build: no SysEx, no program change, no clock byte. The Circuit has
   * no factory reset and neither of these touches flash.
   * ⚠️ BOTH, AND IN THAT ORDER, BECAUSE THEY ARE DIFFERENT MESSAGES. All Notes
   * Off releases held notes and lets their release envelopes finish, which is
   * the musical answer. All Sound Off cuts the voices dead, which is the answer
   * when a note is stuck because something never sent a release at all.
   * ⚠️ AND EVERY CHANNEL, NOT THE ONE THE LINK USED. A stuck note is by
   * definition on a channel nobody is tracking any more.
   */
  function allOff() {
    let n = 0;
    const reached = [];
    for (const [id, port] of outs) {
      let ok = 0;
      for (let ch = 1; ch <= 16; ch++) {
        for (const cc of [123, 120]) {
          const bytes = toBytes({ cls: 'cc', ch, d1: cc, d2: 0 });
          if (!bytes) continue;
          try { port.send(bytes); hush(nodeOf(id)); ok++; n++; heard++; } catch { /* a port may have gone */ }
        }
      }
      if (ok) reached.push(bay.port(id)?.label || id);
    }
    countersOnly();
    if (!n) { d.log('nothing to send panic to, so press the status button first', 'warn'); return; }
    d.log(`panic: all notes off and all sound off on 16 channels to ${reached.join(', ')}`, 'hi');
  }

  const slug = (s) => String(s || 'port').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

  async function open() {
    if (!navigator.requestMIDIAccess) {
      d.log('this browser has no Web MIDI, so there is nothing to route', 'warn');
      return false;
    }
    try {
      access = await navigator.requestMIDIAccess({ sysex: false });
      for (const p of access.inputs.values()) {
        try { await p.open(); } catch { /* another client may hold it */ }
        adoptInput(p);
      }
      for (const p of access.outputs.values()) {
        try { await p.open(); } catch { /* another client may hold it */ }
        adoptOutput(p);
      }
      /**
       * 🔴 A WAIT THAT IGNORES AN INSTRUMENT BEING PLUGGED IN IS NOT A WAIT.
       * The button says `wait for instrument`, so an instrument arriving while
       * it is latched has to be adopted rather than needing a second press.
       * ⚠️ ONLY WHILE WAITING, because adopting a port on a page nobody has
       * armed is this repository's load-on-a-visit defect reaching a device.
       * ⚠️ AND IT IS UNHEARD. Nothing has been plugged into this page with the
       * latch down, so this path is written and not measured.
       */
      access.onstatechange = (e) => {
        if (!waiting) return;
        const p = e.port;
        if (!p || p.state !== 'connected') return;
        try {
          const already = [...rawName.values()].includes(p.name);
          if (already) return;
          /* ⚠️ THE `catch` IS NOT DECORATION. `port.open()` returns a promise,
             and another client already holding the port rejects it: unhandled,
             that is a console error on a page whose harness asserts there are
             none, for a condition that is ordinary. */
          p.open?.()?.catch?.(() => {});
          if (p.type === 'input') adoptInput(p); else adoptOutput(p);
          d.log(`${instrumentName(p.name)} arrived while waiting`);
          paint();
        } catch (err) { d.log(`a port arrived and could not be opened: ${err.message}`, 'warn'); }
      };
      return true;
    } catch (e) {
      d.log(`MIDI was refused: ${e.message}`, 'warn');
      return false;
    }
  }

  d.on('wait', async () => {
    if (waiting) { stopWaiting('unknown'); say(''); return; }
    if (!opened) {
      opened = true;
      pres.set('checking');
      const ok = await open();
      if (!ok) {
        stopWaiting('offline', 'this browser would not open MIDI');
        if (SELFCHECK && !checked) { checked = true; await d.run('check'); }
        return;
      }
      const n = bay.ports().length;
      const k = instruments().length;
      d.log(`${k} instrument${k === 1 ? '' : 's'} on ${n} ports. Play one and then play `
          + 'another to connect them, and the first one sends. While one is held, every '
          + 'other box in the picture says whether it can take it.');
      sayInstruments();
      /**
       * 🔴 ONE INSTRUMENT IS NOT A DESK, AND THE PAGE HAS TO SAY SO RATHER THAN
       * INVITING A GESTURE THAT CANNOT WORK. A link needs two, and a page that
       * answers the first one with *"play what it should reach"* when there is
       * nothing else to play has told somebody to do an impossible thing.
       */
      if (k === 1) {
        d.log('a link needs two instruments and there is one, so there is nothing to '
            + 'connect it to yet. Plug in something else, and it is picked up while the '
            + 'button is waiting.', 'warn');
      } else if (!k) {
        d.log('no instruments, so there is nothing to route.', 'warn');
      }
      d.log('nothing here can send SysEx, a program change or a clock byte, because '
          + 'there is no code that turns one into bytes.');
    }
    if (bay.ports().length) startWaiting();
    else stopWaiting('offline', 'nothing is plugged in');
    paint();
    if (SELFCHECK && !checked) { checked = true; await d.run('check'); }
  });

  // ── checks ──────────────────────────────────────────────────────────────

  d.on('check', async () => {
    /**
     * 🔴 THE CHECKS RUN ON A DESK THIS PAGE INVENTS, because a harness has no
     * instruments and a page whose checks needed one would be a page nothing
     * grades on any machine but this desk. The bindings, the refusals and the
     * counters are all the page's own code either way.
     */
    /* ⚠️ NAMED FOR THE INSTRUMENTS THEY STAND IN FOR, because `suggest()` and
       `consentFor()` both read a name, and a fixture called `test keys` would
       exercise half of this page while the asserts below claimed both halves.
       🔴 AND EVERY ONE OF THEM HAS BOTH HALVES OF ITS WIRE: six ports have to
       come out of the picture as three boxes.
       ⚠️ THE MK-425C EMITS SysEx ON PURPOSE, which the real one does not: the
       page credits every real source with `EMITS`, and `EMITS` has no SysEx in
       it. It is here so that playing the keyboard and then the Circuit is
       REFUSED, which is what the refusal checks need and what the happy path
       cannot use.
       ⚠️ AND THE MK-425C'S INPUT TAKES ITS `accepts` FROM `CONSENT`, which is
       the empty list. That is the dead end this build is about. */
    const kc = consentFor('MK-425C');
    bay.addPort({ id: 'test:mk-425c:out', label: 'MK-425C', dir: 'out', medium: 'midi',
      shape: { protocol: '1.0' }, emits: ['note', 'cc', 'sysex'] });
    bay.addPort({ id: 'test:mk-425c:in', label: 'MK-425C', dir: 'in', medium: 'midi',
      shape: { protocol: '1.0' }, accepts: kc.accepts, never: kc.never, note: kc.why });
    const mc = consentFor('Model 12');
    bay.addPort({ id: 'test:model12:out', label: 'Model 12', dir: 'out', medium: 'midi',
      shape: { protocol: '1.0' }, emits: ['note', 'cc'] });
    bay.addPort({ id: 'test:model12:in', label: 'Model 12', dir: 'in', medium: 'midi',
      shape: { protocol: '1.0' }, accepts: mc.accepts, never: mc.never, note: mc.why });
    const c = consentFor('Circuit');
    /* The Circuit sends its own clock, measured at about 122 bpm, so its output
       emits one and every destination here drops it. */
    bay.addPort({ id: 'test:circuit:out', label: 'Circuit', dir: 'out', medium: 'midi',
      shape: { protocol: '1.0' }, emits: ['note', 'cc', 'clock'] });
    bay.addPort({ id: 'test:circuit:in', label: 'Circuit', dir: 'in', medium: 'midi',
      shape: { protocol: '1.0' }, accepts: c.accepts, never: c.never, note: c.why,
      deliver: () => { heard++; } });
    paint();

    d.assert('a visit opened nothing', SELFCHECK ? true : access === null,
      access ? 'access taken after a press' : 'no MIDI access taken');

    /* 🔴 THE ONE THAT MATTERS. A source that can emit SysEx is refused at the
       Circuit, by name, and the reason is the one a reader needs. */
    const bad = bay.validate('test:mk-425c:out', 'test:circuit:in', []);
    d.assert('a link that could carry SysEx to the Circuit is refused, in words',
      !bad.ok && /sysex/i.test(bad.why), bad.why || 'it was allowed');

    // ⚠️ THE NEGATIVE HALF: the same pair connects once SysEx is dropped, or the
    // line above would pass on a page that refused everything.
    const good = bay.validate('test:mk-425c:out', 'test:circuit:in', [{ op: 'drop', cls: 'sysex' }]);
    d.assert('and the same pair is allowed once SysEx is dropped', good.ok, good.why);

    /**
     * 🔴 THE CONNECTION IS SHOWN AS JSON AND THE JSON CARRIES NAMES. It used to
     * be one line of the compact patch language, which printed the port ids and
     * therefore printed `here:` at a reader who had no way to know what that
     * word meant. Both halves are asserted: what the block says, and that it
     * does not say the thing that was reported.
     */
    const r = bay.link('test:mk-425c:out', 'test:circuit:in', [{ op: 'drop', cls: 'sysex' },
      { op: 'channel', to: 1 }, { op: 'transpose', by: 1 }]);
    paint();
    const shown = JSON.parse(json.textContent.split('\n\n')[0]);
    d.assert('the link is made, and the page shows it as JSON naming the two instruments',
      r.ok && !json.hidden && shown.from.instrument === 'MK-425C'
      && shown.to.instrument === 'Circuit' && !json.textContent.includes('here:'),
      `${shown.from.instrument} to ${shown.to.instrument}, carries ${shown.carries.join(' ')}`);

    const before = heard;
    bay.send('test:mk-425c:out', { cls: 'note', ch: 2, d1: 47, d2: 100 });
    d.assert('a note crosses it and the far end counts it',
      heard === before + 1, `heard ${heard} from ${before}`);

    /* 🔴 SysEx IS REFUSED AT THE DESTINATION AS WELL AS AT CONNECT TIME. The
       list is a declaration; this is the arithmetic behind it. */
    const was = heard;
    bay.send('test:mk-425c:out', { cls: 'sysex', ch: null, d1: 0, d2: 0 });
    d.assert('and a SysEx event sent down it anyway arrives nowhere',
      heard === was, `heard ${heard}, was ${was}`);

    // The second wall: there are no bytes for a class this page will not send.
    d.assert('there are no bytes for SysEx, a program change or a clock',
      toBytes({ cls: 'sysex' }) === null && toBytes({ cls: 'program', d1: 3 }) === null
      && toBytes({ cls: 'clock' }) === null, 'all three came back null');
    d.assert('and there are bytes for a note, which is the negative control',
      JSON.stringify(toBytes({ cls: 'note', ch: 1, d1: 60, d2: 100 })) === '[144,60,100]',
      JSON.stringify(toBytes({ cls: 'note', ch: 1, d1: 60, d2: 100 })));

    /* The suggestion is shown before it is applied, so it is asserted as text
       rather than as behaviour. Both numbers are measured: the keyboard's
       global channel is 2 against the Circuit's synth 1, and the keyboard is a
       semitone flat. */
    d.assert('the page suggests the two transforms this desk needs, and no others',
      JSON.stringify(suggest('test:mk-425c:out', 'test:circuit:in'))
        === '[{"op":"channel","to":1},{"op":"transpose","by":1}]',
      JSON.stringify(suggest('test:mk-425c:out', 'test:circuit:in')));

    const cyc = bay.validate('test:circuit:in', 'test:mk-425c:out', []);

    /* Put back what the JSON check made, or every count below reads one high. */
    for (const l of bay.links()) bay.unlink(l.id);
    paint();

    /**
     * 🔴 PATCHING BY PLAYING, GRADED, AND THE NEGATIVE HALF IS THE WHOLE POINT.
     * CLAUDE.md records that the Circuit here sends its own clock continuously
     * at about 122 bpm, so a rule that picked the last instrument to send
     * ANYTHING would pick it within a millisecond of the page opening and never
     * let go. These asserts say a clock byte picks nothing and a note does.
     */
    /* ⚠️ THE FIXTURES ARE WHAT `decode` REALLY PRODUCES, and the first draft of
       them was not. `classOf` switches on `kind` and its cases are `note on`,
       `note off`, `control`, `clock`; a fixture carrying `kind: 'note'` and a
       helpfully pre-set `cls` fell through to `other`, so three of these went
       red against a working feature. A fixture that sets the answer instead of
       the input grades nothing. */
    const NOTE = { kind: 'note on', ch: 2, d1: 60, d2: 100 };
    const OFF = { kind: 'note on', ch: 2, d1: 60, d2: 0 };
    const CLOCK = { kind: 'clock', ch: null, d1: 0, d2: 0 };
    {
      pick = null; playAt = 0;
      const l0 = bay.links().length;

      played('test:circuit:out', CLOCK);
      played('test:model12:out', CLOCK);
      d.assert('a clock byte picks no instrument, so a Circuit sending its own clock cannot hold the bay',
        pick === null && bay.links().length === l0,
        `pick ${pick}, ${bay.links().length - l0} links from two clocks`);

      played('test:mk-425c:out', OFF);
      d.assert('and a note off picks nothing either, so releasing a key is not a second press',
        pick === null, `pick ${pick}`);

      played('test:model12:out', NOTE);
      const afterFirst = pick;
      played('test:model12:out', NOTE);
      d.assert('playing one instrument holds it, and playing it again only refreshes it',
        afterFirst === 'test:model12' && pick === 'test:model12'
        && bay.links().length === l0,
        `held ${pick}, ${bay.links().length - l0} links`);

      /* 🔴 THE `from` CELL SAID WHICH WAY IT WOULD GO BEFORE THE SECOND
         INSTRUMENT ARRIVED, which is the difference between a rule and a
         surprise. This used to be a one line box under the table; the two cells
         are where the ask moved it. */
      const saidFrom = fromCell.v.textContent;
      const saidTo = toCell.v.textContent;

      played('test:circuit:out', NOTE);
      const made = bay.links().at(-1);
      d.assert('and playing a second instrument connects them, out of the one played first',
        bay.links().length === l0 + 1 && !pick
        && made?.from === 'test:model12:out' && made?.to === 'test:circuit:in',
        made ? linkWords(made) : 'no link');

      d.assert('the from cell named the sender before the second instrument was played',
        saidFrom === 'Model 12' && saidTo === '',
        `from "${saidFrom}", to "${saidTo}"`);

      /* 🔴 THE TWO COUNTERS ARE IN THE TWO CELLS NOW, AND THEY ARE COUNTED AT
         OPPOSITE ENDS OF THE LINK. That is the whole reason the readout is
         gone rather than the facts: side by side in a row of cells nothing said
         which end either belonged to. */
      const wasHeard = heard;
      bay.send('test:model12:out', { cls: 'note', ch: 2, d1: 60, d2: 100 });
      sent += 1;
      countersOnly();
      d.assert('the from and to cells carry the two counters, counted at the two ends',
        /sent$/.test(fromCell.count.textContent) && /heard$/.test(toCell.count.textContent)
        && heard === wasHeard + 1,
        `${fromCell.count.textContent}, ${toCell.count.textContent}`);

      /**
       * 🔴 THE LOOPBACK, WHICH IS THE DEFECT A REAL DESK FOUND AND A HARNESS
       * NEVER WOULD. `IAC Driver Bus 1` sends back everything sent to it, so
       * `panic`'s 32 control changes returned on its input and the page linked
       * the keyboard to the bus. Both halves of the repair are asserted: a
       * controller is no longer a gesture at all, and a note arriving from an
       * instrument this page has just sent to is treated as its own echo.
       */
      pick = null;
      const CC = { kind: 'control', ch: 1, d1: 74, d2: 64 };
      played('test:circuit:out', CC);
      d.assert('a controller is not a gesture, so a loopback echoing our own control changes picks nothing',
        pick === null, `pick ${pick}`);

      hush('test:circuit');
      played('test:circuit:out', NOTE);
      const duringHush = pick;
      echoUntil.clear();
      played('test:circuit:out', NOTE);
      d.assert('and a note from an instrument we just sent to is our own echo, until the moment passes',
        duringHush === null && pick === 'test:circuit',
        `during the hush ${duringHush}, after it ${pick}`);
      pick = null;

      /* The window, asserted by moving the clock rather than by waiting. */
      pick = null;
      played('test:model12:out', NOTE);
      playAt -= PLAY_WINDOW + 1;
      played('test:circuit:out', NOTE);
      d.assert('a pick older than the window starts again rather than joining something nobody meant',
        pick === 'test:circuit' && bay.links().length === l0 + 1,
        `held ${pick} after a stale first press, ${bay.links().length - l0} links total`);
      pick = null;
      /* 🔴 THIS BLOCK PUTS BACK WHAT IT MADE, because a check that leaves state
         behind breaks the check after it and the failure names the wrong one. */
      for (const l of bay.links().slice(l0)) bay.unlink(l.id);
      playAt = 0;
      paint();
    }

    d.assert('an input cannot be used as a source', !cyc.ok, cyc.why);

    /* Every claim below about a box is read off the RENDERED picture rather
       than off the code that fills it, because what a reader can find is the
       claim and a function returning the right string is not a box saying it.
       ⚠️ THE ACCESSIBLE NAME IS `label, sub. note`, uncut, which is what the
       component promises and the only place the whole of a box survives. */
    /* ⚠️ A CHILD INHERITS ITS CONTAINER'S `kind`, so `[data-kind="device"]`
       selected nothing and the first run of this check read `0 boxes`. What
       separates the two is the RECT: a container's carries `pos-dg-cbox` and a
       box inside one does not. */
    const boxes = () => [...dg.svg.querySelectorAll('.pos-dg-n')]
      .filter((g) => g.querySelector('.pos-dg-box:not(.pos-dg-cbox)'));
    const boxOf = (label) => boxes()
      .find((g) => (g.getAttribute('aria-label') || '').split(',')[0] === label);
    const subOf = (g) => g.querySelector('.pos-dg-sub')?.textContent || '';
    const noteOf = (g) => (g.getAttribute('aria-label') || '').split('. ').slice(1).join('. ');

    /**
     * 🔴 SIX PORTS, THREE INSTRUMENTS, THREE BOXES. The keyboard is the one to
     * name: it has an output and an input, the first two builds gave it two
     * rows, and one of them existed only to be refused.
     */
    d.assert('six ports on three instruments come out as three boxes in the picture, not six',
      bay.ports().length === 6 && boxes().length === 3
      && boxes().filter((g) => (g.getAttribute('aria-label') || '').startsWith('MK-425C')).length === 1,
      `${bay.ports().length} ports, ${boxes().length} boxes: `
      + `${boxes().map((g) => (g.getAttribute('aria-label') || '').split(',')[0]).join(', ')}`);

    /**
     * 🔴 THE PICTURE DRAWS AN ARROW ONLY WHERE THERE IS A LINK, AND THAT IS
     * WHAT `join: false` BUYS. Without it a container joins its neighbours by
     * default, so three instruments sitting in a browser would be drawn as a
     * chain and the page would be showing a patch nobody made. `ties` counts
     * the headless lines the component drew, so zero is the claim.
     */
    d.assert('and two instruments side by side are not joined, because a line here would be a patch nobody made',
      dg.ties === 0, `${dg.ties} headless line(s) in the picture`);

    d.assert('the picture cut no label and refused nothing',
      dg.cuts.length === 0, dg.cuts.map((x) => `${x.id}: ${x.shown}`).join(' ') || 'none');

    /**
     * 🔴 A DESK OF ONE SAYS SO, AND SAYS IT ON THE FIRST GESTURE RATHER THAN
     * AFTER A SECOND ONE THAT CANNOT HAPPEN. Reported 2026-09-21 as *"bay does
     * not connect by i get midi events"*, which is what this page looks like
     * when exactly one instrument is plugged in.
     * ⚠️ IT IS ASSERTED AGAINST THE RENDERED LINE, not against a branch, and it
     * asserts BOTH HALVES: alone it refuses, and with a neighbour it invites.
     */
    {
      const desk = instruments().length;
      pick = null; playAt = 0;
      played('test:circuit:out', NOTE);
      const withPeers = why.textContent;
      pick = null;
      d.assert('with a neighbour on the desk, playing one invites the next',
        /play the one it should reach/i.test(withPeers) && desk >= 2,
        `${desk} instruments, line reads "${withPeers}"`);
      /* 🔴 READ OFF THE LOG ELEMENT, because the claim is about what a reader
         can see. A count of ports would have passed this line on every day the
         log said nothing but a number, which is the defect being fixed. */
      sayInstruments();
      const logText = (document.querySelector('.pos-log')?.textContent || '');
      const named = [...new Set(instruments().map((g) => g.label))];
      const missing = named.filter((n) => !logText.includes(n));
      d.assert('and the log names every instrument it found, rather than only counting them',
        named.length > 0 && missing.length === 0,
        missing.length ? `not in the log: ${missing.join(', ')}` : `all ${named.length} named`);
    }

    /* ⚠️ THE OTHER ORDER. Both of these can send and both can receive, so there
       are two possible links and the order of playing is the only signal there
       is. Played first sends, so the same two gestures reversed make the
       opposite link rather than the same one. */
    pick = null; playAt = 0;
    const l1 = bay.links().length;
    played('test:circuit:out', NOTE);
    played('test:model12:out', NOTE);
    const back = bay.links().at(-1);
    d.assert('and playing them the other way round makes the opposite link',
      bay.links().length === l1 + 1 && back?.from === 'test:circuit:out'
      && back?.to === 'test:model12:in',
      back ? linkWords(back) : 'no link');
    bay.unlink(back.id);
    paint();

    /* A refusal is the second gesture ANSWERING, and the first pick has to
       survive it or a refusal costs two gestures to recover from. */
    pick = null; playAt = 0;
    const l2 = bay.links().length;
    played('test:mk-425c:out', NOTE);
    played('test:circuit:out', NOTE);
    d.assert('a refused pair is not connected, says why, and keeps the first pick',
      bay.links().length === l2 && /sysex/i.test(why.textContent)
      && pick === 'test:mk-425c',
      `${why.textContent}, holding ${pick || 'nothing'}`);

    /* 🔴 AND THE REASON IS READABLE BEFORE THE GESTURE, WHICH IS WHAT THE GONE
       BUTTON USED TO BUY AND WHAT THE GONE COLUMN CARRIED AFTER IT. */
    const circuitBox = boxOf('Circuit');
    d.assert('a box that cannot take the held instrument reads refused, with the reason on it',
      !!circuitBox && subOf(circuitBox) === 'refused' && /sysex/i.test(noteOf(circuitBox)),
      circuitBox ? `sub reads ${subOf(circuitBox)}, note says ${noteOf(circuitBox)}` : 'no box');

    /**
     * 🔴 THE INSTRUMENT THAT MOTIVATED THE ONE-BOX BUILD, AND IT IS THE
     * NEGATIVE HALF. The MK-425C is a controller with no sound engine, so
     * `CONSENT` gives it an empty `accepts` and nothing can ever be sent to it.
     * That used to be a whole row of a table which existed to be refused.
     */
    pick = null; playAt = 0;
    played('test:circuit:out', NOTE);
    const keysBox = boxOf('MK-425C');
    d.assert('an instrument that accepts nothing reads refused in the picture before anything reaches it',
      !!keysBox && subOf(keysBox) === 'refused' && /nothing is worth sending/i.test(noteOf(keysBox)),
      /* ⚠️ THE NOTE IS IN THE DETAIL BECAUSE A SABOTAGE PROVED IT HAS TO BE.
         Reversing the direction rule left the old line red with a detail that
         read like a PASS: the clause that had failed was the reason, and the
         reason was invisible. */
      keysBox ? `sub ${subOf(keysBox)}, note says ${noteOf(keysBox)}` : 'no box');

    /* ⚠️ AND THE POSITIVE CONTROL BESIDE IT, IN THE SAME PAINT, or the line
       above would pass on a page whose every box reads refused. */
    const m12Box = boxOf('Model 12');
    d.assert('and the instrument beside it reads ready, which is the negative control',
      !!m12Box && subOf(m12Box) === 'ready',
      m12Box ? `sub reads ${subOf(m12Box)}` : 'no box');

    /**
     * 🔴 THE PICTURE MAY NOT CHANGE HEIGHT WHEN SOMEBODY PLAYS SOMETHING. It
     * sits above the control row with the whole page under it, so a figure that
     * grew or shrank on a gesture would move everything a hand is working.
     * That is why the instruments are children of one machine and why a box's
     * sub is never empty.
     */
    const tall = +dg.el.getBoundingClientRect().height.toFixed(1);
    pick = null;
    paint();
    const restTall = +dg.el.getBoundingClientRect().height.toFixed(1);
    d.assert('the picture keeps one height whether an instrument is held or not',
      Math.abs(tall - restTall) < 1, `${tall} px held against ${restTall} px at rest`);

    /**
     * 🔴 THE PICTURE IS ABOVE THE CONTROL ROW, WHICH IS WHERE IT WAS ASKED TO
     * BE. A layout instruction is the kind of thing that survives one session
     * and gets tidied away in the next, so it is a check rather than a comment.
     */
    d.assert('the picture sits above the status button, which is the order that was asked for',
      !!(dgHost.compareDocumentPosition(d.controls) & Node.DOCUMENT_POSITION_FOLLOWING),
      dgHost.previousElementSibling ? `after ${dgHost.previousElementSibling.className}` : 'first on the page');

    /**
     * 🔴 THE LATCH, AND THE HALF THAT WAS ASKED FOR IS THE RELEASE. *"like push
     * to talk but does not lose state on mouseup"*, so the claim is not that a
     * press arms it: it is that nothing about the press ENDING puts it down.
     * A momentary control would fail the second half of this and pass the
     * first, which is why both are in one assert with the detail naming which.
     */
    {
      if (waiting) stopWaiting('unknown');
      pres.el.click();
      const armed = waiting && pres.el.getAttribute('aria-pressed') === 'true';
      for (const type of ['mouseup', 'pointerup', 'mouseleave', 'blur']) {
        pres.el.dispatchEvent(new Event(type, { bubbles: type !== 'blur' }));
      }
      d.assert('the status button latches, and letting go of it does not put it down',
        armed && waiting && pres.el.getAttribute('aria-pressed') === 'true',
        `armed ${armed}, still waiting ${waiting} after mouseup, pointerup, leave and blur`);

      /**
       * 🔴 AND THE WAIT ENDS WHEN THE SECOND INSTRUMENT CONNECTS, which is the
       * other half of the same ask. The negative control is one gesture: one
       * instrument played is not a connection, so the button is still waiting.
       */
      pick = null; playAt = 0;
      const l3 = bay.links().length;
      played('test:model12:out', NOTE);
      const afterOne = waiting;
      played('test:circuit:out', NOTE);
      d.assert('and the second instrument connecting stops the waiting, while the first does not',
        afterOne && !waiting && bay.links().length === l3 + 1,
        `waiting after one ${afterOne}, after two ${waiting}, ${bay.links().length - l3} link`);
    }

    /* No gesture may appear to do nothing, and `clear` is the one control left
       that acts on what is held, so it has to act on both things at once. */
    d.assert('clear puts down the held instrument and removes every connection',
      (() => { pick = 'test:model12'; clearAll.click();
               return !pick && bay.links().length === 0 && json.hidden; })(),
      `${bay.links().length} links, pick ${pick}, json hidden ${json.hidden}`);

    /* 🔴 AND THE JSON IS NOT THERE UNTIL SOMETHING IS CONNECTED, which is the
       `when connected` half of the ask. The line above leaves nothing linked,
       so this is the negative control for the JSON assert near the top. */
    d.assert('nothing is shown as JSON until something is connected',
      json.hidden && json.textContent === '',
      json.hidden ? 'hidden and empty' : 'showing with nothing connected');

    if (d.el.isConnected) {
      /* 🔴 MEASURED EMPTY AGAINST FULL, NOT AGAINST A CEILING. A bound would
         pass on a panel that grew by a line every time a link was made, which
         is the thing this reserves against: the whole page sits under it. */
      const emptyTall = +panel.getBoundingClientRect().height.toFixed(1);
      setCell(fromCell, 'Model 12', 'sends note cc', '412 sent');
      setCell(toCell, 'Circuit', 'takes note cc bend', '412 heard');
      say('Circuit does not accept sysex, and this link could deliver it', true);
      const fullTall = +panel.getBoundingClientRect().height.toFixed(1);
      say('');
      paint();
      d.assert('the from and to panel keeps one height whatever is in it',
        Math.abs(emptyTall - fullTall) < 1,
        `${emptyTall} px empty against ${fullTall} px with both ends and a refusal in it`);
      d.assert('the page does not drag sideways at this width',
        document.documentElement.scrollWidth <= window.innerWidth + 1,
        `page ${document.documentElement.scrollWidth} against ${window.innerWidth}`);
    }

    /**
     * 🔴 PANIC IS GRADED AS A SECOND EXIT, WHICH IS THE ONLY THING THAT MAKES
     * IT SAFE TO HAVE. `deliver` used to be the one way out, and that is what
     * turned "this page has only ever sent notes, controllers and bend" into a
     * counter rather than a claim about a file.
     */
    {
      /* Every byte panic can produce, built the same way it builds them. */
      const madeBytes = [];
      for (let ch = 1; ch <= 16; ch++) for (const cc of [123, 120]) {
        madeBytes.push(toBytes({ cls: 'cc', ch, d1: cc, d2: 0 }));
      }
      const wrong = madeBytes.filter((b) => !b || (b[0] & 0xf0) !== 0xb0);
      d.assert('panic can only ever produce control changes, 32 of them, on all 16 channels',
        madeBytes.length === 32 && wrong.length === 0
        && new Set(madeBytes.map((b) => b[0] & 0x0f)).size === 16,
        `${madeBytes.length} messages, ${wrong.length} that are not a control change`);

      /* The negative half: the two it sends are the two that release a voice,
         and nothing here can reach a note, a program change or SysEx. */
      d.assert('and it sends all notes off and all sound off, and can express neither a note nor a program change',
        new Set(madeBytes.map((b) => b[1])).size === 2
        && madeBytes.some((b) => b[1] === 123) && madeBytes.some((b) => b[1] === 120)
        && toBytes({ cls: 'program', d1: 3 }) === null
        && toBytes({ cls: 'sysex' }) === null,
        `controllers ${[...new Set(madeBytes.map((b) => b[1]))].join(' and ')}`);

      d.assert('panic is not in the harness row, because a suite run must not reach the desk',
        make.contains(panic) && !panic.closest('.pos-controls'),
        panic.closest('.pos-controls') ? 'it is in .pos-controls' : 'beside clear, in the page');
    }

    d.assert('no secret in this page', !location.href.includes('token'));
  });

  paint();
  d.ready();
</script>
