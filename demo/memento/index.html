<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* Layout only — the border, radius and background of a <video> come from
     shell.css's one `video` rule. The canvases match it by hand because a
     shell-wide `canvas` rule would hit the strip on every other page. */
  .clip { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
          gap: 10px; margin: 0 0 12px; align-items: start; }
  .clip figure { margin: 0; width: 100%; }
  .clip canvas, .clip video { display: block; width: 100%; aspect-ratio: 16 / 9;
                              background: var(--card); }
  .clip canvas { border: 1px solid var(--line); border-radius: 4px; }
  .clip [hidden] { display: none; }
  /* The lane you move the knob on. `touch-action: none` so a drag is a drag and
     not a scroll, and `-webkit-touch-callout: none` because a long press on iOS
     raises the text loupe over it and `user-select` does not stop that. */
  .lane { width: 100%; display: block; border: 1px solid var(--line); border-radius: 4px;
          background: var(--card); touch-action: none; cursor: ns-resize;
          -webkit-touch-callout: none; user-select: none; }
  .foot { margin-top: 16px; }
</style>

<script type="module">
  import { mount, guard, el, recorderMime } from '/shell/shell.mjs';
  import { createSlider, createSliderGroup } from '/shell/slider.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { mediaMaster } from '/timeline/media-master.mjs';
  import { burn, readBurnedFrom, videoHue } from '/shell/pattern.mjs';
  import * as CC from '/shell/cc-adapter.mjs';

  const d = mount({
    name: 'memento',
    what: 'This page records its own video clip — the project\'s test picture, with the '
      + 'moment burned into it — and then records a knob moved while that clip plays. '
      + 'Drag up and down on the lane below and the clip starts rolling: a sample is '
      + 'written down about ten times a second, which is a small part of what your finger '
      + 'did, and the line between those samples is drawn from them. Drag the bar at the '
      + 'bottom to any moment and the knob jumps back to the value it had there, because '
      + 'moving the line restores the knob rather than replaying the moves. The numbers '
      + 'say how many samples were kept against how many came in, and how far the moment '
      + 'burned into the picture sits from where the line says it is.',
    // FOUR CELLS. `kept`/`thinned` move while you drag; `off by`/`worst` are the
    // burned clock read back out of the picture and compared with the line, in
    // milliseconds. Nothing here is a constant.
    readout: { kept: '', thinned: 'x', 'off by': 'ms', worst: 'ms' },
    // ⚠️ NO CONTROLS. The page's one input is a DRAG, and `verify.mjs` reaches
    // that directly through `[data-gesture]`. A button that made a pass for you
    // would be the page answering its own question — that pattern was deleted
    // from `draw` on 2026-09-13, button and mechanism, and it is not coming back
    // here. Play, pause, the rates and the scrub live in the transport bar.
    controls: [],
  });
  guard(d);

  // ── constants, each beside the thing it governs ─────────────────────────
  const W = 1280, H = 720;        // the shared pattern is drawn on a 1280 grid
  const FPS = 25;                 // what the clip is captured at …
  const FRAME_MS = 1000 / FPS;    // … so one frame of it is this many ms
  // How long the clip is. It is recorded in REAL TIME at load and `d.ready()`
  // waits for it, so this number is most of the page's time to ready — and
  // `verify.mjs` gives a page six seconds to say it is ready before calling it
  // broken. MEASURED: 3500 ms of recording lands ready at ~3.6 s, and the two
  // fallbacks in `resolveDuration` below are sized so the WORST case (a file
  // that will not say its length at all) still comes in under the budget.
  const CLIP_MS = 3500;
  const HUE = videoHue(0);
  const CH = 0;                   // MIDI channel
  const KNOB = 74;                // the knob: CC74, which a synth reads as cutoff
  const PEDAL = 64;               // the punch-in switch: CC64, sustain
  // The dead band the clip's clock is allowed to wander inside before the line
  // is re-anchored to it. Handed to `mediaMaster` and printed from the same
  // constant, never typed twice.
  const SYNC_TOL_MS = 12;

  // ───────────────────────────────────────────────────────────────────────
  // 🔴 THE FOUR MAPPINGS, NAMED IN ONE PLACE.
  //
  // The 2025 experiment this page finishes was the demo repo's FINAL commit and
  // it died at exactly these: an absolute stamp had to reach a foreign media
  // element's own position and then a pixel, and nothing converted. The slider
  // knew where it was on screen, the video knew where it was inside itself, and
  // there was no position domain in between.
  //
  //   LEAD_IN is 500 ms ON PURPOSE. The clip does not start at the start of the
  //   line, so `posToMedia` is a real offset rather than an accidental identity
  //   — which is the only way the mapping can be wrong and be seen to be wrong.
  // ───────────────────────────────────────────────────────────────────────
  const LEAD_IN = 500;
  let clipEpochUs = 0;               // epoch µs of the clip's first drawn frame

  const posToMedia = (pos) => (pos - LEAD_IN) / 1000;                    // line ms  -> clip s
  const mediaToPos = (ct) => LEAD_IN + ct * 1000;                        // clip s   -> line ms
  const epochToPos = (atUs) => (atUs - clipEpochUs) / 1000 + LEAD_IN;    // epoch µs -> line ms
  const posToEpoch = (pos) => Math.round((pos - LEAD_IN) * 1000 + clipEpochUs);
  // line ms -> lane pixels. Set once the lane knows its own range; it is the
  // fourth mapping and the one the 2025 page had (it knew where the slider was
  // on screen) — kept here beside the three it did not.
  let posToPx = (pos) => pos;

  // ── the source picture ──────────────────────────────────────────────────
  // A CANVAS, not a camera: no permission, and the suite can reach it. The burn
  // is this project's own technique and the module is the only drawing of it.
  // Its ABSOLUTE row is the machine-readable one, and because the clip is drawn
  // and recorded here, that row's epoch maps straight onto the line through
  // `epochToPos` — the same mapping the gesture is recorded through. So the
  // picture grades the mapping FROM OUTSIDE, which is the check the 2025
  // experiment could not make: it proved its mappings against its own
  // arithmetic.
  const stage = el('div', 'clip');
  const canvas = el('canvas');
  canvas.width = W; canvas.height = H;
  const g = canvas.getContext('2d');
  const srcFig = el('figure');
  const srcCap = el('figcaption', 'pos-cap', 'making the clip');
  srcFig.append(canvas, srcCap);
  const video = el('video', '', null, { playsinline: '', muted: '' });
  video.muted = true; video.preload = 'auto'; video.autoplay = false;
  const clipFig = el('figure');
  clipFig.hidden = true;
  const clipCap = el('figcaption', 'pos-cap', 'the clip');
  clipFig.append(video, clipCap);
  stage.append(srcFig, clipFig);
  d.el.append(stage);

  let frame = 0, recStart = 0, recording = false;
  function drawFrame() {
    frame++;
    // WHAT IS BURNED IS BOTH CLOCKS. The row carries the absolute one, which is
    // what `readBurned` decodes; the second, human-readable number carries the
    // position on the line, so a reader can check a seek by eye with no
    // arithmetic. They are the same instant said two ways.
    const into = recording ? performance.now() - recStart : 0;
    burn(g, W, H, frame, { hue: HUE, position: (LEAD_IN + into) / 1000 });
  }
  // DRAWN ON EVERY ANIMATION FRAME, NOT ON A `FRAME_MS` TIMER — and the
  // difference is measurable. `captureStream(FPS)` samples whatever the canvas
  // holds at its own instants, so a canvas redrawn every 40 ms hands the
  // recorder a picture up to 40 ms stale and the burned clock inherits all of
  // it. Redrawing at the display's rate cuts that to at most one refresh.
  // MEASURED, the picture against what the line was sent to, over five seeks:
  // on a 40 ms timer, −25 ms typical with 30-81 ms of spread; on the frame loop
  // below, −14 to −20 ms with 23-47 ms. The loop is the one already running for
  // the clock servo — no second timer.
  drawFrame();

  // ── the capture gate and the adapter ────────────────────────────────────
  // 🔴 PROMOTED, UNCHANGED. `demo/shell/cc-adapter.mjs` was finished and
  // measured before this page existed; nothing in it is rewritten here. The
  // throttle the capture runs at is read off the adapter's own declared caps,
  // so the number the page prints and the number the library uses cannot
  // disagree.
  let replayCount = 0, assertCount = 0, resetCount = 0, lateFires = 0, maxBehind = 0;
  let knobValue = null, pedalValue = 0;

  function send(raw, info) {
    const [status, d1, d2] = raw;
    if (!CC.isCC(status)) return;
    if (d1 === CC.RESET_ALL_CONTROLLERS) { knobValue = null; pedalValue = 0; resetCount++; }
    else if (d1 === KNOB) knobValue = d2;
    else if (d1 === PEDAL) pedalValue = d2;
    if (info && info.reassert) assertCount++; else replayCount++;
    if (knob && knobValue !== null) knob.set(knobValue, true);   // quiet: the console, not an input
  }

  let series = new Map(), rawByKey = new Map();
  /** the INTERPOLATED value of a series at a position — the client-side index
   *  the adapter falls back to when the library's own successor channel cannot
   *  reach across the interleave (cc-adapter's `resolveAt`). */
  const resolveAt = (key, posMs) => {
    const s = series.get(key);
    if (!s || s.pts.length < 2 || !CC.isInterpolableKey(key)) return null;
    return CC.valueAt(s, posMs);
  };

  const ccAdapter = CC.makeCcAdapter({
    channels: [CH], resolveAt, send,
    onActuate: (p) => {
      // SEAM S4, counted rather than assumed. The library's overdub law fires an
      // event scheduled at or behind the playhead immediately — right for a
      // note, wrong for a level. The gate holds a sample back for up to one
      // throttle interval, so `flush()` at the end of a pass logs it AT ITS OWN
      // ORIGINAL MOMENT, which is behind where the line has got to by then.
      if (!Number.isFinite(p.atMs) || !deck) return;
      const behind = deck.position() - p.atMs;
      if (behind > maxBehind) maxBehind = behind;
      if (behind > 20) lateFires++;
    },
    onAssert: (map, info) => {
      d.log(`the line moved to ${(info.pos / 1000).toFixed(2)}s — ${map.size} `
        + `value${map.size === 1 ? '' : 's'} restated after a reset (${info.reason})`);
    },
  });
  const THROTTLE_MS = ccAdapter.caps.captureThrottleMs;
  const capture = CC.makeCcCapture({ throttleMs: THROTTLE_MS, ch: CH,
                                     keyframeMs: ccAdapter.caps.keyframeMs });

  const KNOB_KEY = CC.keyOf(CC.ST_CC | CH, KNOB);
  const PEDAL_KEY = CC.keyOf(CC.ST_CC | CH, PEDAL);

  function reindex() {
    // Rows can arrive out of order: the pedal goes up at the moment of release
    // while `flush()` logs a held-back knob sample at ITS moment, which is
    // earlier. The series index and the fold both assume time order.
    series = CC.seriesFromRows([...capture.rows].sort((a, b) => a.at - b.at), epochToPos);
    rawByKey = new Map();
    for (const r of [...capture.rawLane].sort((a, b) => a.tUs - b.tUs)) {
      let a = rawByKey.get(r.key);
      if (!a) rawByKey.set(r.key, a = []);
      a.push({ t: epochToPos(r.tUs), v: r.v });
    }
  }

  // ── the clip as a span on the line ──────────────────────────────────────
  // Two lanes on one deck: the clip is a start/end PAIR whose actuator owns the
  // element, and the knob is the second. `present` is what lets the clip be the
  // clock only while it is under the playhead — the lead-in belongs to the line
  // and to nothing else.
  let present = false, inServo = false, mediaSeeks = 0, clipMs = 0, ready = false;

  function writeMedia(pos) {
    if (!clipMs) return;
    const ct = Math.max(0, Math.min(clipMs / 1000 - 0.001, posToMedia(pos)));
    if (Math.abs(video.currentTime - ct) > 0.02) { video.currentTime = ct; mediaSeeks++; }
  }

  const clipAdapter = {
    caps: {
      kind: 'clip', domain: 'wall', unit: 'ms',
      catchUp: 'reduce', seekable: true, reducible: true, assertOnSeek: true,
      span: true, clockMaster: true,
      syncToleranceMs: SYNC_TOL_MS,
      rates: [0.5, 1, 2],
    },
    actuate(p) {
      present = p.edge === 'start';
      if (present) { writeMedia(deck.position()); if (deck.playing()) video.play().catch(() => {}); }
      else video.pause();
      d.log(`the clip ${present ? 'starts' : 'ends'} at ${(p.atMs / 1000).toFixed(2)}s on the line`);
    },
    reduce(payloads) {
      let on = false;
      for (const p of payloads) on = p.edge === 'start';
      return on;
    },
    assertState(on, info) {
      present = !!on;
      if (!present) { video.pause(); return; }
      // ⚠️ NOT WHILE THE SERVO IS RUNNING. `mediaMaster` answers a discontinuity
      // with `deck.seek()`, which lands here — and writing `currentTime` back
      // from inside that would be the page chasing its own tail. `take` carries
      // the same flag for the same reason.
      if (!inServo) writeMedia(info.pos);
      if (deck.playing()) video.play().catch(() => {});
    },
  };

  // ── the deck ────────────────────────────────────────────────────────────
  // ONE DECK FOR THE PAGE'S LIFE: the transport bar binds its deck at
  // construction, so a deck built later leaves the bar pointing at something
  // nobody is playing. The range opens at the length we asked the recorder for
  // and is corrected to the file's real length when it lands.
  const deck = createDeck({
    items: [], range: [0, LEAD_IN + CLIP_MS],
    adapters: { cc: ccAdapter, clip: clipAdapter },
  });

  let mm = null;
  deck.transport.onState(() => {
    // the master is COMMANDED by the client, never nudged by the servo (L1)
    const r = deck.targetRate();
    if (clipMs && Number.isFinite(r) && r > 0) video.playbackRate = Math.max(0.25, Math.min(4, r));
  });

  // ── the transport bar ───────────────────────────────────────────────────
  // 🔴 THE DECK IS A FOLLOWER HERE. While the clip is under the playhead it is
  // the clock master, so a control that writes to the deck alone is undone by
  // the master's next tick — silently, within a few hundred milliseconds. The
  // bar drives the ELEMENT and lets the deck follow, which is exactly what
  // `command` exists for.
  createTransportBar(d.el, deck, {
    command: {
      play: () => { deck.play(); if (present) video.play().catch(() => {}); },
      pause: () => { video.pause(); deck.pause(); },
      seek: (pos) => deck.seek(pos),      // the clip lane's assertState moves the element
    },
  });

  // ── the lane ────────────────────────────────────────────────────────────
  // `data-gesture` is how `verify.mjs` knows to DRAG across this rather than
  // click it: a page whose only input is a drag is a page the suite cannot
  // otherwise reach at all.
  const LW = 960, LH = 260, PADY = 16;
  const lane = el('canvas', 'lane', null, { 'data-gesture': 'knob' });
  lane.width = LW * 2; lane.height = LH * 2;
  lane.style.aspectRatio = `${LW} / ${LH}`;
  d.el.append(lane);
  const lctx = lane.getContext('2d');

  const css = getComputedStyle(document.documentElement);
  const tok = (n, fb) => (css.getPropertyValue(n) || '').trim() || fb;
  // THE SAME TWO COLOURS AS `draw`, which asks the same question about a
  // different gesture: what actually happened is white and loudest, what a
  // player reconstructs from the sparse record is blue and quieter. A third
  // scheme for the same distinction would say it was a different distinction.
  const C = {
    drawn: tok('--fg', '#e6e6e6'), guess: '#7aa2f7', dim: tok('--dim', '#8b93a1'),
    card: tok('--card', '#11151d'), line: tok('--line', '#1f2937'),
    warn: tok('--warn', '#e0b060'), ok: tok('--ok', '#8fd6a8'),
  };
  // ⚠️ `ctx.font` IS NOT CSS-VARIABLE-AWARE: a canvas font string is parsed with
  // no element behind it, so `var(--mono)` is invalid, the assignment is
  // silently ignored and the label comes out in the 10 px default.
  const MONO = tok('--mono', 'monospace');

  const yOf = (v14) => PADY + (1 - Math.max(0, Math.min(16383, v14)) / 16383) * (LH - 2 * PADY);
  const xOf = (pos) => {
    const [a, b] = deck.range;
    return ((pos - a) / Math.max(1, b - a)) * LW;
  };
  posToPx = xOf;

  function paintLane() {
    const ctx = lctx;
    ctx.save();
    ctx.scale(2, 2);
    ctx.fillStyle = C.card; ctx.fillRect(0, 0, LW, LH);

    // THE CLIP AS A BAND, so the lead-in is a thing you can see rather than a
    // constant in the source: the line starts before the picture does.
    // NAMED, because an unlabelled block of colour is a legend waiting to be
    // written. `--dim` like the pad's furniture, so the only bright ink on the
    // lane is the pass.
    ctx.font = `500 11px ${MONO}`;
    ctx.textBaseline = 'top';
    if (clipMs) {
      const x0 = xOf(LEAD_IN), w0 = xOf(LEAD_IN + clipMs) - x0;
      ctx.fillStyle = `hsl(${HUE} 70% 55% / 0.10)`;
      ctx.fillRect(x0, 0, w0, LH);
      ctx.fillStyle = `hsl(${HUE} 70% 55% / 0.50)`;
      ctx.fillRect(x0, 0, w0, 2);
      ctx.fillStyle = C.dim;
      ctx.fillText('the clip', x0 + 6, 7);
    }
    ctx.strokeStyle = C.line; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, LH - 0.5); ctx.lineTo(LW, LH - 0.5); ctx.stroke();

    // WHERE THE PUNCH WAS IN. The pedal is a SWITCH, so it is drawn as a block
    // held flat between its two edges — never a ramp, which is the whole point
    // of it being a step series.
    const ped = series.get(PEDAL_KEY);
    if (ped) {
      let first = null;
      for (let i = 0; i < ped.pts.length; i++) {
        if (!ped.pts[i].v) continue;
        const x0 = xOf(ped.pts[i].t);
        const x1 = xOf(ped.pts[i + 1] ? ped.pts[i + 1].t : deck.range[1]);
        ctx.fillStyle = `${C.ok}4d`;
        ctx.fillRect(x0, LH - 9, Math.max(1, x1 - x0), 7);
        if (first === null) first = x0;
      }
      if (first !== null) {
        ctx.fillStyle = C.dim;
        ctx.textBaseline = 'bottom';
        ctx.fillText('punched in', first + 4, LH - 12);
        ctx.textBaseline = 'top';
      }
    }

    // The truth, in white and underneath: every sample the browser handed over.
    const raw = rawByKey.get(KNOB_KEY);
    if (raw && raw.length > 1) {
      ctx.strokeStyle = C.drawn; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(xOf(raw[0].t), yOf(raw[0].v));
      for (const p of raw) ctx.lineTo(xOf(p.t), yOf(p.v));
      ctx.stroke();
    }

    // What a player reconstructs from the sparse record, and the samples that
    // are actually attested — in the record's own colour, because a third hue
    // here would say they were a third kind of thing.
    const s = series.get(KNOB_KEY);
    if (s && s.pts.length > 1) {
      ctx.strokeStyle = C.guess; ctx.lineWidth = 1.6; ctx.beginPath();
      const t0 = s.pts[0].t, t1 = s.pts[s.pts.length - 1].t;
      const step = Math.max(1, (t1 - t0) / 700);
      let first = true;
      for (let t = t0; t <= t1; t += step) {
        const v = CC.valueAt(s, t);
        if (v === null) continue;
        if (first) { ctx.moveTo(xOf(t), yOf(v)); first = false; } else ctx.lineTo(xOf(t), yOf(v));
      }
      ctx.stroke();
      ctx.fillStyle = C.guess;
      for (const p of s.pts) { ctx.beginPath(); ctx.arc(xOf(p.t), yOf(p.v), 2.6, 0, Math.PI * 2); ctx.fill(); }
    }

    // The clip's OWN position, drawn apart from the playhead: if these two ever
    // separate on screen, that separation is the drift number made visible.
    if (clipMs && present) {
      ctx.fillStyle = C.warn;
      ctx.fillRect(xOf(mediaToPos(video.currentTime)) - 1, LH - 22, 2, 20);
    }
    // THE PLAYHEAD CARRIES THE SWITCH. `pedalValue` is what the adapter last
    // actuated for the pedal, so a seek into a punched-in stretch turns the
    // playhead green — the step series restored on the console, beside the
    // knob's number.
    const pos = deck.position();
    ctx.fillStyle = pedalValue > 0 ? C.ok : '#fff';
    ctx.fillRect(xOf(pos) - 1, 0, 2, LH);
    // the value under the playhead, as a mark on the playhead itself
    if (knobValue !== null) {
      ctx.fillStyle = C.guess;
      ctx.beginPath(); ctx.arc(xOf(pos), yOf(knobValue << 7), 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // ── the console ─────────────────────────────────────────────────────────
  // The knob is BOTH the console and an input, and it is the kit's slider
  // rather than a fourth hand-rolled one. `send()` sets it quietly, so what you
  // see on it is what the adapter last actuated — which is what makes "moving
  // the line restores the knob" a thing you watch rather than a thing you read.
  //
  // ⚠️ `verify.mjs` CANNOT DRAG A SLIDER (`element.click()` fires no pointer
  // events), so this control's own drag is ungraded by the suite. It is the
  // same `writeAt()` the lane calls — the lane is what the harness grades, and
  // the two share one write path precisely so that grading one grades both.
  let knobPass = false;
  const knob = createSlider({
    label: 'knob', min: 0, max: 127, step: 1, value: 0,
    onInput: (v) => { if (!ready) return; if (!knobPass) { knobPass = true; startPass(); } writeAt(v); },
    onChange: () => { if (!knobPass) return; knobPass = false; endPass(); },
  });
  const foot = el('div', 'pos-controls foot');
  foot.append(createSliderGroup([knob]).el);
  d.el.append(foot);

  // ── writing a pass ──────────────────────────────────────────────────────
  function scheduleRow(r) {
    deck.schedule({ at: epochToPos(r.at), kind: 'cc', id: `cc-${r.seq}`,
                    payload: { ...r, atMs: epochToPos(r.at) } });
  }
  /** Every sample the pointer makes goes through the ONE gate: the full-rate
   *  evidence lane keeps all of them, the throttled log keeps about a tenth.
   *
   *  🔴 ONLY WHILE THE LINE IS MOVING, and this was measured the hard way. A
   *  sample's place on the line is where the playhead is, so two samples taken
   *  while the playhead is still are two different values AT ONE MOMENT — which
   *  no record can hold and no reconstruction can be graded against. The first
   *  run of this page piled ~40 of them at the end of the line, where the
   *  transport had stopped, and the reconstruction read 43% of the knob's
   *  travel out: not a bad interpolator, a degenerate input. The playhead is
   *  also allowed to move BACKWARDS by up to the servo's dead band, and the
   *  capture gate's throttle assumes a clock that only goes forward. So a
   *  sample the line has no new room for is dropped at the door — before BOTH
   *  buffers, so the evidence lane is still every sample that has a position,
   *  and is still never a view of the thinned one. */
  let lastWritePos = -Infinity, stalledSamples = 0;
  function writeAt(v7, pos = deck.position()) {
    if (!(pos > lastWritePos)) { stalledSamples++; return; }
    lastWritePos = pos;
    for (const r of capture.cc7(KNOB, v7, posToEpoch(pos))) scheduleRow(r);
    paintReadout();
  }
  function pedal(v7) {
    for (const r of capture.cc7(PEDAL, v7, posToEpoch(deck.position()))) scheduleRow(r);
  }
  /** PUNCH IN. Touching the knob rolls the line — a value written while nothing
   *  moves is a value written at one instant, which is not a pass. */
  function startPass() {
    if (deck.position() > deck.range[1] - 250) deck.seek(LEAD_IN);
    lastWritePos = -Infinity;
    deck.play();
    if (present) video.play().catch(() => {});
    pedal(127);
  }
  let afterStroke = null;
  function endPass() {
    pedal(0);
    // rule 1 of the capture discipline: the last sample is logged at ITS OWN
    // moment, never at the moment the gate noticed the pass had ended.
    for (const r of capture.flush(posToEpoch(deck.position()))) scheduleRow(r);
    reindex();
    // 🔴 SEAM S4. Those flushed rows sit BEHIND the playhead, and the overdub
    // law fires anything at or behind it immediately — which for a level means
    // the current value is dragged back to a value authored in the past. Fold
    // and re-state at the playhead to undo it.
    deck.assertAt(deck.position(), 'cc');
    const want = resolveAt(KNOB_KEY, deck.position());
    afterStroke = { knob: knobValue, want: want === null ? null : want / 128,
                    late: lateFires, behind: maxBehind };
    paintReadout();
    check();
  }

  const vOf = (ev) => {
    const r = lane.getBoundingClientRect();
    const yl = (ev.clientY - r.top) * (LH / Math.max(1, r.height));
    const v = (1 - (yl - PADY) / (LH - 2 * PADY)) * 127;
    return Math.max(0, Math.min(127, Math.round(v)));
  };
  let writing = false;
  lane.addEventListener('pointerdown', (ev) => {
    if (!ready) { d.log('the clip is still being made — one moment', 'hi'); return; }
    writing = true;
    // A synthetic pointer can refuse capture; losing it costs nothing, because
    // the lane is the only thing being drawn on.
    try { lane.setPointerCapture(ev.pointerId); } catch { /* not capturable */ }
    startPass();
    writeAt(vOf(ev));
  });
  lane.addEventListener('pointermove', (ev) => {
    if (!writing) return;
    // ⚠️ COALESCED. A browser hands one `pointermove` per frame and hides the
    // samples between; `getCoalescedEvents` is the difference between a record
    // of the INPUT and a record of the repaint. Each of them happened at a
    // KNOWN PAST INSTANT, so each gets the position the line was at then — the
    // playhead read now, wound back by how long ago that sample arrived, at the
    // rate the line is running. Handing them all the current position instead
    // would put several different values at one moment, which is exactly the
    // degenerate input `writeAt` refuses.
    const evs = ev.getCoalescedEvents ? ev.getCoalescedEvents() : [ev];
    const now = performance.now();
    const posNow = deck.position();
    const rate = deck.playing() ? deck.rate() : 0;
    for (const e of evs) {
      const back = Math.max(0, Math.min(120, now - e.timeStamp));
      writeAt(vOf(e), posNow - back * rate);
    }
  });
  for (const t of ['pointerup', 'pointercancel']) {
    lane.addEventListener(t, () => { if (!writing) return; writing = false; endPass(); });
  }

  // ── the readout ─────────────────────────────────────────────────────────
  let agreement = null;
  function paintReadout() {
    const kept = capture.rows.length;
    const raw = capture.rawLane.length;
    d.set('kept', kept || '');
    d.set('thinned', kept ? +(raw / kept).toFixed(1) : '');
    d.set('off by', agreement ? +agreement.typ.toFixed(0) : '');
    d.set('worst', agreement ? +agreement.worst.toFixed(0) : '');
  }
  paintReadout();

  // ── the loop ────────────────────────────────────────────────────────────
  (function loop() {
    requestAnimationFrame(loop);
    if (recording) drawFrame();
    if (mm) { inServo = true; try { mm.tick(); } finally { inServo = false; } }
    paintLane();
  })();

  // ── making the clip ─────────────────────────────────────────────────────
  async function resolveDuration(v) {
    await new Promise((res) => {
      v.addEventListener('loadedmetadata', res, { once: true });
      setTimeout(res, 1200);
    });
    if (!Number.isFinite(v.duration)) {
      // the documented dance: a MediaRecorder file reports duration Infinity
      // until it is asked from past the end, which leaves a transport bar with
      // no range at all.
      v.currentTime = 1e6;
      await new Promise((res) => {
        const on = () => { if (Number.isFinite(v.duration)) { v.removeEventListener('timeupdate', on); res(); } };
        v.addEventListener('timeupdate', on);
        setTimeout(res, 800);
      });
      v.currentTime = 0;
    }
    return Number.isFinite(v.duration) ? v.duration * 1000 : null;
  }

  let fileMs = null, mime = null, readyAtMs = null;
  async function makeClip() {
    mime = recorderMime(d);
    if (!mime) throw new Error('this browser cannot record');
    const stream = canvas.captureStream(FPS);
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 900_000 });
    const blobs = [];
    rec.ondataavailable = (e) => { if (e.data && e.data.size) blobs.push(e.data); };
    rec.onerror = (ev) => d.log(`recorder: ${ev.error?.name ?? 'error'}`, 'bad');
    const stopped = new Promise((res) => { rec.onstop = res; });
    // THE ANCHOR. The first frame of the clip is drawn at this instant, so the
    // absolute clock burned into any frame minus this is how far into the clip
    // that frame sits — which is what ties the picture to the line through
    // `epochToPos`, the same mapping the gesture is recorded through.
    recStart = performance.now();
    clipEpochUs = Math.round((performance.timeOrigin + recStart) * 1000);
    recording = true;
    rec.start(250);
    await new Promise((r) => setTimeout(r, CLIP_MS));
    rec.stop();
    await stopped;
    recording = false;
    for (const t of stream.getTracks()) t.stop();
    if (!blobs.length) throw new Error('the recorder produced nothing');

    video.src = URL.createObjectURL(new Blob(blobs, { type: mime }));
    fileMs = await resolveDuration(video);
    clipMs = Math.round(fileMs ?? CLIP_MS);
    deck.setRange([0, LEAD_IN + clipMs]);
    deck.schedule({ at: LEAD_IN, kind: 'clip', id: 'clip-in',
                    payload: { edge: 'start', clipId: 'clip', durMs: clipMs, atMs: LEAD_IN } });
    deck.schedule({ at: LEAD_IN + clipMs, kind: 'clip', id: 'clip-out',
                    payload: { edge: 'end', clipId: 'clip', durMs: clipMs, atMs: LEAD_IN + clipMs } });

    // THE CLIP IS THE CLOCK, BUT ONLY WHERE IT IS. The source-function form
    // returns null through the lead-in, where there is no picture to be master
    // of and the line has to run on its own.
    mm = mediaMaster(deck, () => {
      if (!clipMs || !present || video.readyState < 1) return null;
      return { el: video, pos: mediaToPos(video.currentTime), key: 'clip' };
    }, {
      toleranceMs: SYNC_TOL_MS,
      // ⚠️ THE FRAME-CALLBACK SENSOR IS OFF HERE, AND IT IS NOT A PREFERENCE.
      // MEASURED on this page: after a seek with the element PAUSED, the
      // playhead crept forward ~180 ms over the next 250 ms while
      // `currentTime` sat still at the position it had been sent to. L4b
      // carries a frame sample onto the wall clock as
      // `mediaTime + (wall − expectedDisplayTime) × rate`, and `rate` is read
      // off `playbackRate` alone — which is 1 on a paused element — so a
      // stationary picture is extrapolated forward until the sample goes stale
      // at `rvfcStaleMs`. The library's own comment states a second guard that
      // would also have caught it ("preferred only when the callback arrived
      // AFTER the last observed change of currentTime"): `ctChangedAt` is
      // computed in `sensorDeltaMs` and never read. Reported, not patched —
      // `timeline/*` is not this page's to edit. The burned clock in the
      // picture is a better sensor than rVFC for what this page measures
      // anyway, and it is the one being graded.
      useRvfc: false,
      onEvent: (e) => d.log(`clock: ${e.reason}${e.key ? ` · ${e.key}` : ''}`),
    });

    srcFig.hidden = true;
    clipFig.hidden = false;
    deck.seek(0);
    d.log(`the clip is ${(clipMs / 1000).toFixed(2)}s of ${mime}, `
      + `${Math.round(blobs.reduce((a, b) => a + b.size, 0) / 1024)} KiB, at ${FPS} frames a second`, 'hi');
    // THE FOUR MAPPINGS, ON THE PAGE AS WELL AS IN THE SOURCE — one line each,
    // because they are the thing this page exists to have.
    d.log(`mapping 1 · a moment on the line to a moment in the clip: (line − ${LEAD_IN}) / 1000`);
    d.log(`mapping 2 · a moment in the clip back to the line: ${LEAD_IN} + seconds × 1000`);
    d.log(`mapping 3 · an absolute stamp to the line: (stamp − ${clipEpochUs}) / 1000 + ${LEAD_IN}`);
    d.log(`mapping 4 · the line to lane pixels: `
      + `${(LW / (deck.range[1] - deck.range[0])).toFixed(4)} px a millisecond`);
    readyAtMs = performance.now();
    ready = true;
  }

  // ── the checks ──────────────────────────────────────────────────────────
  // 🔴 GATHER FIRST, ASSERT IN ONE BURST. `verify.mjs` stops collecting when
  // the assert count stops growing across a 400 ms sample, so a check that
  // pauses in the middle of its asserts silently loses every one after the
  // pause. Every slow thing below happens before the first `d.assert`.
  const scratch = document.createElement('canvas');
  const median = (xs) => { if (!xs.length) return null; const a = [...xs].sort((p, q) => p - q); return a[a.length >> 1]; };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  function presented(ms = 300) {
    return new Promise((res) => {
      let done = false;
      const fin = () => { if (!done) { done = true; res(); } };
      const t = setTimeout(fin, ms);
      if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(() => { clearTimeout(t); fin(); });
    });
  }
  async function seeked(ms = 900) {
    if (video.seeking) {
      await new Promise((res) => {
        const on = () => { video.removeEventListener('seeked', on); clearTimeout(t); res(); };
        const t = setTimeout(on, ms);
        video.addEventListener('seeked', on);
      });
    }
    await presented();
  }
  /** the position the PICTURE says it is at, decoded out of its own pixels */
  function pictureAt() {
    const ms = readBurnedFrom(video, scratch);
    return ms === null ? null : { ms, pos: epochToPos(ms * 1000) };
  }

  let checked = false;
  async function check() {
    if (checked || !ready) return;
    const rawKnob = rawByKey.get(KNOB_KEY) || [];
    const s = series.get(KNOB_KEY);
    if (!s || s.pts.length < 3 || rawKnob.length < 20) {
      d.log(`${rawKnob.length} sample${rawKnob.length === 1 ? '' : 's'} and `
        + `${s ? s.pts.length : 0} kept — draw a longer pass on the lane and the checks will run`, 'hi');
      return;
    }
    checked = true;

    // ── everything slow, first ───────────────────────────────────────────
    video.pause(); deck.pause();
    await wait(150);

    // a still frame, so "the picture carries its own clock" is asked of a
    // frame that has certainly been presented
    const still = pictureAt();

    // THE SEEK SWEEP. Five places along the clip: ask the line to go there,
    // then read where the PICTURE says it is. Nothing in this comparison comes
    // from the page's own arithmetic — one side is the transport, the other is
    // fifty-six blocks of pixels.
    const marks = [];
    const lo = LEAD_IN + 400, hi = LEAD_IN + clipMs - 400;
    for (let i = 0; i < 5; i++) {
      const asked = Math.round(lo + ((hi - lo) * i) / 4);
      deck.seek(asked);
      await seeked();
      const p = pictureAt();
      marks.push({ asked, pos: deck.position(), ct: video.currentTime,
                   picture: p ? p.pos : null, burned: p ? p.ms : null });
    }

    // THE CONSOLE, RESTORED. Land in the middle of the pass and see whether the
    // knob comes back to the line's value there — and count what was sent to
    // get it there, because "restore the console" and "replay the gesture" are
    // told apart by that number and by nothing else.
    const probe = Math.round((s.pts[0].t + s.pts[s.pts.length - 1].t) / 2);
    const wantAtProbe = CC.valueAt(s, probe) / 128;
    const before = { replay: replayCount, assert: assertCount, reset: resetCount };
    deck.seek(probe);
    await seeked();
    const restored = { knob: knobValue, replay: replayCount - before.replay,
                       assert: assertCount - before.assert, reset: resetCount - before.reset };

    // THE CLIP AS CLOCK. Play a stretch and sample the picture against the line
    // while it rolls. The dead band is declared, so the number below is read
    // against what the servo PROMISES rather than against an ideal.
    deck.seek(LEAD_IN + 250);
    await seeked();
    deck.play(); if (present) video.play().catch(() => {});
    const live = [];
    for (let i = 0; i < 14; i++) {
      await wait(90);
      const p = pictureAt();
      if (p && present && !video.paused) live.push(p.pos - deck.position());
    }
    const mstat = mm ? mm.stats() : null;
    video.pause(); deck.pause();

    // THE DEVIATION, AGAINST TWO READINGS OF THE SAME RECORD. ⚠️ Not against a
    // threshold: the harness draws a fast curve and a person draws a slow one,
    // and a number that has to pass for both is a number somebody tuned. What
    // is true of ANY pass is that drawing the line between the samples beats
    // holding the last one — which is the entire reason a continuous kind is a
    // kind rather than a payload. Both are measured against the full-rate
    // evidence, never against a subsample of the record itself.
    const holdAt = (ss, t) => {
      const p = ss.pts;
      if (!p.length) return null;
      if (t <= p[0].t) return p[0].v;
      if (t >= p[p.length - 1].t) return p[p.length - 1].v;
      let lo = 0, hi = p.length - 1;
      while (hi - lo > 1) { const m = (lo + hi) >> 1; if (p[m].t <= t) lo = m; else hi = m; }
      return p[lo].v;
    };
    const dev = (() => {
      const acc = { lerp: { sum: 0, worst: 0 }, hold: { sum: 0, worst: 0 } };
      let n = 0;
      for (const p of rawKnob) {
        const a = CC.valueAt(s, p.t), b = holdAt(s, p.t);
        if (a === null || b === null) continue;
        const ea = Math.abs(a - p.v), eb = Math.abs(b - p.v);
        acc.lerp.sum += ea; if (ea > acc.lerp.worst) acc.lerp.worst = ea;
        acc.hold.sum += eb; if (eb > acc.hold.worst) acc.hold.worst = eb;
        n++;
      }
      if (!n) return null;
      return { n,
        lerp: { mean: acc.lerp.sum / n, worst: acc.lerp.worst },
        hold: { mean: acc.hold.sum / n, worst: acc.hold.worst } };
    })();

    // the pedal, which is a SWITCH and therefore a step
    const ped = series.get(PEDAL_KEY);
    const pedDown = ped && ped.pts.find((p) => p.v > 0);
    const pedUp = ped && ped.pts.find((p) => p.t > (pedDown ? pedDown.t : Infinity) && p.v === 0);
    const pedMid = pedDown && pedUp ? (pedDown.t + pedUp.t) / 2 : null;
    const pedAtMid = pedMid === null ? null : CC.valueAt(ped, pedMid) / 128;
    const pedRefused = pedMid === null ? null : resolveAt(PEDAL_KEY, pedMid);

    const lit = (() => {
      const px = lctx.getImageData(0, 0, lane.width, lane.height).data;
      let n = 0;
      for (let i = 0; i < px.length; i += 4 * 7) if (px[i] > 60 || px[i + 1] > 60) n++;
      return n;
    })();

    // ── the asserts, in one burst ────────────────────────────────────────
    // 🔴 AGAINST WHAT THE LINE WAS ASKED FOR, NEVER AGAINST WHERE IT ENDED UP.
    // MEASURED by breaking it: with `posToMedia` divided by 1150 instead of
    // 1000 — a mapping 15% wrong — the picture still agreed with the PLAYHEAD
    // to within a frame, because `mediaMaster` anchors the playhead to the
    // element's own clock (L1: the picture is ground truth, the vector bends).
    // So `picture − playhead` is very nearly a statistic about one number
    // compared with itself. `asked` is the other end of the chain and the
    // burned row is the only reading in it that no part of the page produced,
    // so this pair is the one that can be wrong. In a healthy run the playhead
    // lands exactly on what was asked, so nothing is given up by asking it
    // this way.
    const got = marks.filter((m) => m.picture !== null);
    const errs = got.map((m) => m.picture - m.asked);
    const offs = errs.map(Math.abs);
    const spread = errs.length ? Math.max(...errs) - Math.min(...errs) : null;
    agreement = errs.length ? { typ: median(offs), worst: Math.max(...offs), n: errs.length } : null;
    const liveAbs = live.map(Math.abs);

    d.assert('the clip carries its own clock, readable back out of its pixels',
      still !== null,
      still ? `the picture reads ${still.ms} — ${(still.pos / 1000).toFixed(3)}s on the line`
            : 'nothing decoded out of the row');

    d.assert('the clip has a length, not Infinity — so the line has a right-hand end',
      Number.isFinite(deck.durationMs) && deck.durationMs > 0 && clipMs > 0,
      `${clipMs} ms of clip on a ${deck.durationMs} ms line`
        + (fileMs === null ? ' — the file would not say its length, so the asked-for one stands' : '')
        + `, made in ${Math.round(readyAtMs)} ms`);

    d.assert('the clip does not start where the line starts, so the mapping is a real offset',
      LEAD_IN > 0 && mediaToPos(0) === LEAD_IN && posToMedia(0) < 0
        && Math.abs(epochToPos(posToEpoch(1234)) - 1234) < 1e-6,
      `the picture begins ${LEAD_IN} ms in: ${LEAD_IN + 1000} ms on the line is `
        + `${posToMedia(LEAD_IN + 1000).toFixed(3)}s into the clip and `
        + `${posToPx(LEAD_IN + 1000).toFixed(0)} px across the lane`);

    // 🔴 THE ONE THE 2025 EXPERIMENT COULD NOT MAKE. It proved its mappings
    // against its own arithmetic; this asks the picture. `spread` is what
    // grades the mapping — a constant offset is where the recorder's timeline
    // started relative to the first frame drawn, which is not one of the four.
    // BOTH HALVES, because they catch different mistakes. The SPREAD catches a
    // mapping with the wrong slope or the wrong sign; a constant OFFSET — a
    // lead-in counted once instead of twice, say — slides every reading
    // together and leaves the spread untouched, so it needs its own bound. Three
    // frames is what the mechanism promises: the burn is redrawn on a 40 ms
    // timer, the capture samples the canvas on its own cadence, and a decoder
    // presents the frame at or before the moment it was sent to.
    d.assert('the picture and the line move together — the burned clock grades the mapping from outside',
      got.length === marks.length && spread !== null && spread <= 3 * FRAME_MS
        && Math.abs(median(errs)) <= 3 * FRAME_MS,
      `${got.length} of ${marks.length} seeks read · the picture sits `
        + `${median(errs).toFixed(0)} ms (${(median(errs) / FRAME_MS).toFixed(2)} frames) from where the `
        + `line was sent, spread ${spread === null ? '—' : spread.toFixed(0)} ms `
        + `(${spread === null ? '—' : (spread / FRAME_MS).toFixed(2)} frames) at ${FRAME_MS} ms a frame; `
        + `the playhead itself landed within `
        + `${Math.max(...marks.map((m) => Math.abs(m.pos - m.asked))).toFixed(0)} ms of every ask`);


    d.assert('a pass is recorded twice, in full and thinned',
      capture.rows.length >= 3 && capture.rawLane.length > capture.rows.length * 2,
      `${capture.rawLane.length} samples in, ${capture.rows.length} written down — `
        + `${(capture.rawLane.length / capture.rows.length).toFixed(1)}:1 at a ${THROTTLE_MS} ms gate`);

    d.assert('the last thing the knob did is written down, at the moment it happened',
      Math.abs(s.pts[s.pts.length - 1].v - rawKnob[rawKnob.length - 1].v) < 1
        && Math.abs(s.pts[s.pts.length - 1].t - rawKnob[rawKnob.length - 1].t) < 1,
      `the pass ends at ${rawKnob[rawKnob.length - 1].v >> 7} and so does the record, `
        + `${(s.pts[s.pts.length - 1].t / 1000).toFixed(3)}s against `
        + `${(rawKnob[rawKnob.length - 1].t / 1000).toFixed(3)}s on the line`);

    d.assert('drawing the line between the samples beats holding the last one',
      !!dev && dev.hold.mean > dev.lerp.mean && dev.hold.worst > dev.lerp.worst,
      dev ? `against ${dev.n} samples that actually happened: the line is `
            + `${dev.lerp.mean.toFixed(0)} of 16383 out typically `
            + `(${((100 * dev.lerp.mean) / 16383).toFixed(2)}% of the knob's travel), worst `
            + `${dev.lerp.worst.toFixed(0)}; holding the last sample is `
            + `${dev.hold.mean.toFixed(0)} and ${dev.hold.worst.toFixed(0)} — `
            + `${(dev.hold.mean / Math.max(1e-9, dev.lerp.mean)).toFixed(1)}x`
          : 'nothing to compare');

    d.assert('the punch-in switch holds, it never ramps',
      pedAtMid !== null && pedAtMid === 127 && pedRefused === null,
      pedMid === null ? 'the pass left no pair of edges'
        : `down at ${(pedDown.t / 1000).toFixed(2)}s and up at ${(pedUp.t / 1000).toFixed(2)}s reads `
          + `${pedAtMid} in between, not ${Math.round(127 / 2)}`);

    d.assert('moving the line restores the knob instead of replaying the moves',
      restored.knob !== null && Math.abs(restored.knob - wantAtProbe) <= 1
        && restored.replay === 0 && restored.reset >= 1,
      `at ${(probe / 1000).toFixed(2)}s the knob reads ${restored.knob} against `
        + `${wantAtProbe.toFixed(1)} on the line — ${restored.assert} value`
        + `${restored.assert === 1 ? '' : 's'} restated after ${restored.reset} reset`
        + `${restored.reset === 1 ? '' : 's'}, ${restored.replay} of the pass replayed`);

    d.assert('a value written behind the playhead does not move the value under it',
      !!afterStroke && afterStroke.want !== null && Math.abs(afterStroke.knob - afterStroke.want) <= 1,
      afterStroke ? `the furthest a sample landed behind the playhead was `
          + `${afterStroke.behind.toFixed(0)} ms (${afterStroke.late} of them over 20 ms, `
          + `against a ${THROTTLE_MS} ms gate); after the re-state the knob read `
          + `${afterStroke.knob} against ${afterStroke.want.toFixed(1)} on the line`
        : 'no pass');

    d.assert('while the clip is under the playhead, the clip is the clock',
      !!mstat && mstat.syncs > 0 && mstat.jumps === 0 && liveAbs.length > 0,
      mstat ? `${mediaSeeks} times the page sent the clip somewhere, then `
          + `${mstat.syncs} reads, ${mstat.corrections} correction`
          + `${mstat.corrections === 1 ? '' : 's'} over a ${SYNC_TOL_MS} ms dead band, `
          + `${mstat.jumps} jump${mstat.jumps === 1 ? '' : 's'}; while playing the picture sat `
          + `${liveAbs.length ? median(liveAbs).toFixed(0) : '—'} ms from the line, worst `
          + `${liveAbs.length ? Math.max(...liveAbs).toFixed(0) : '—'} ms, over ${liveAbs.length} reads`
        : 'no clock master');

    d.assert('there is a line on the lane, not just numbers in cells', lit > 800,
      `${lit} lit samples`);

    paintReadout();
    d.log('the picture against each ask, in ms: '
      + marks.map((m) => (m.picture === null ? '—' : (m.picture - m.asked).toFixed(0))).join(' · '));
    d.log(`${stalledSamples} sample${stalledSamples === 1 ? '' : 's'} were dropped at the door — `
      + 'the line was not moving under them');
  }

  // ── boot ────────────────────────────────────────────────────────────────
  // WHAT THIS PAGE CANNOT ANSWER, said rather than quietly missing:
  //   · how old the frames inside a MediaRecorder blob are. The API publishes
  //     no capture timestamp per chunk, so the constant offset in the seek
  //     sweep — where the recorder's timeline started against the first frame
  //     drawn — is MEASURED here and not derivable from anything it reports.
  //   · a drag of the knob itself. `verify.mjs` presses buttons and drags
  //     `[data-gesture]` elements; it cannot drag a slider, so the lane is the
  //     surface the suite grades and the knob shares its one write path.
  makeClip()
    .then(() => { d.log('drag up and down on the lane — the clip rolls while you do', 'hi'); })
    .catch((e) => { d.log(`the clip could not be made: ${e.message}`, 'bad'); })
    .finally(() => { d.ready(); });
</script>
</html>
