<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">

<script type="module">
  import { mount, guard } from '/shell/shell.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createStripView } from '/shell/strip.mjs';
  import { createHardware } from '/shell/hardware.mjs';
  import { createDeck, createAudioLane, createMidiLane } from '/timeline/transport.mjs';
  import { markAdapter, marks } from '/shell/fixture.mjs';

  const DURATION = 16000;
  const BEAT = 500;
  const AHEAD = 100;          // how far ahead every lane hands its work over

  const d = mount({
    name: 'lanes',
    what: 'One beat, sent several ways at once. Code has to wake up and do the '
      + 'work, so it lands within a millisecond or so; the sound card and the '
      + 'MIDI port are given the instant in advance and hit it themselves, a '
      + 'thousand times closer.',
    readout: { worst: 'ms', measured: '' },
    // every number now lives in its own lane's gutter; this row would repeat
    // them with less context. Still published for CDP.
    showReadout: false,
    controls: [],
  });
  guard(d);

  const { fired, adapter } = markAdapter({ rates: [0.25, 0.5, 1, 2] });
  const deck = createDeck({
    items: marks(Math.floor(DURATION / BEAT), DURATION),
    adapters: { mark: adapter },
    range: [0, DURATION],
    onDrift: (_rows, all) => { for (const r of all) driftOf.set(r.at, r.deltaMs); },
  });


  // No slider: the strip below is the position surface.
  createTransportBar(d.el, deck, { scrub: false });

  // ONE MEANING FOR COLOUR, ACROSS EVERY DEMO: a mark's colour says HOW IT
  // LANDED, never which lane it is in. Lane identity is the row you are in, its
  // label, and the swatch beside the label — three channels that already carry
  // it. Using the mark colour for identity here and for lateness in 01 meant
  // the same ink meant two different things one page apart.
  //
  //   grey        not played yet
  //   slate       played, and this lane cannot say how well
  //   green       played, inside what its way of firing promises
  //   amber/red   later than that
  //
  // "played, unmeasured" earns its own colour rather than borrowing green: the
  // sound card gives no per-note feedback, so claiming it landed well would be
  // an assertion nothing checked.
  const UNMEASURED = '#6f7d94', NOT_YET = '#3b424e';
  const LANES = [
    { id: 'worker', label: 'bg worker', swatch: '#ffd400', note: 'code ran here' },
    { id: 'sound', label: 'sound card', swatch: '#8fd6a8', note: 'the card played here' },
    { id: 'midi', label: 'midi out', swatch: '#7fb8e0', note: 'the port sent here' },
    { id: 'midiin', label: 'midi in', swatch: '#c9a0ff', note: 'a note arrived here',
      onlyMeasured: true },
  ];
  const laneSpec = (L) => ({
    id: L.id, kind: 'mark', label: L.label, height: 52, width: 2, latch: true,
    color: L.swatch,            // the gutter swatch — lane identity lives here
    terse: true,
    // The capture lane shows a row only where something ACTUALLY ARRIVED. The
    // other three are schedules and exist whether or not anything happened;
    // this one is a record, and drawing a row for a note that never came back
    // would be inventing evidence.
    rows: L.onlyMeasured ? (rows) => rows.filter((r) => loopOf.has(Math.round(r.at))) : undefined,
    colorOfRow: (r, fired) => (!fired ? NOT_YET : outcomeOf(L.id, r)),
    describeRow: (r) => {
      if (!happened(L.id, r)) return 'not played yet';
      const v = verdictOf(L.id, r);
      return v ? [L.note, v] : [L.note, 'no per-note feedback from this lane'];
    },
  });

  // Only two lanes can currently answer "how well": the worker, from the deck's
  // own drift rows, and MIDI, from the loopback. The sound card cannot, and
  // says so rather than being coloured as if it could.
  const driftOf = new Map();          // position -> deltaMs, worker lane
  const loopOf = new Map();           // position -> ms late, midi lane
  const BUDGET = 5;
  const bandColour = (ms) => (Math.abs(ms) < BUDGET ? '#8fd6a8'
    : Math.abs(ms) < BUDGET * 4 ? '#ffd400' : '#e0908a');
  function metricOf(id, r) {
    if (id === 'worker') return driftOf.get(Math.round(r.at));
    // The loopback number belongs to MIDI IN and to nothing else. Crediting it
    // to `midi out` would claim the output lane measured itself; it did not —
    // the input did, and only because both ends happen to be the same loopback
    // device. A lane may only be coloured by evidence it produced.
    if (id === 'midiin') return loopOf.get(Math.round(r.at));
    if (id === 'sound') return soundOf.get(Math.round(r.at));
    return undefined;
  }
  // Did this lane DO anything at this position, whether or not it can say how
  // well? `midi out` is the only lane that acts without being able to report,
  // so it is the only one that needs a separate record of having acted.
  const sentOf = new Set();
  function happened(id, r) {
    const at = Math.round(r.at);
    if (id === 'worker') return driftOf.has(r.at) || driftOf.has(at);
    if (id === 'sound') return soundOf.has(at);
    if (id === 'midi') return sentOf.has(at);
    if (id === 'midiin') return loopOf.has(at);
    return false;
  }
  function outcomeOf(id, r) {
    const m = metricOf(id, r);
    if (m !== undefined) return bandColour(m);
    return happened(id, r) ? UNMEASURED : NOT_YET;   // acted, but cannot say / nothing yet
  }
  function verdictOf(id, r) {
    const m = metricOf(id, r);
    if (m === undefined) return null;
    return `${Math.abs(m).toFixed(2)} ms ${m < 0 ? 'early' : 'late'}`;
  }

  const PAD = Math.max(...LANES.map((L) => L.label.length)) + 2;
  const view = createStripView(d.el, deck, {
    size: 'auto', follow: false, armWall: false, gutter: 132,
    // ONE TOOLTIP FOR ALL THREE ROWS. This page exists to compare lanes at the
    // same instant, so a tooltip about the row your pointer happened to land on
    // answers the wrong question — you had to hover three times and hold two
    // numbers in your head to make the comparison the page is about.
    describeHit: (hit) => {
      const r = hit.row;
      if (!r) return null;
      const shown = view.strip.lanes().map((l) => l.id);
      const lines = [{ text: `beat at ${(r.at / 1000).toFixed(3)} s`, dim: true }];
      for (const L of LANES) {
        if (!shown.includes(L.id)) continue;
        const name = L.label.padEnd(PAD);
        const line = (t) => lines.push({ text: `${name}${t}`, colour: L.swatch });
        if (!happened(L.id, r)) { line(L.id === 'midiin' ? 'nothing arrived' : 'not played yet'); continue; }
        const m = metricOf(L.id, r);
        if (m !== undefined) { line(`${m >= 0 ? '+' : ''}${m.toFixed(2)} ms`); continue; }
        const rt = L.id === 'midi' ? loopOf.get(Math.round(r.at)) : undefined;
        line(rt === undefined ? 'sent · no way to check' : `sent · at most ${sign(rt)} ms`);
      }
      return lines;
    },
    lanes: [laneSpec(LANES[0])],          // the other two appear with their device
  });
  const showLane = (id) => {
    if (view.strip.lanes().some((l) => l.id === id)) return;
    const spec = laneSpec(LANES.find((L) => L.id === id));
    // keep declaration order, so sound is always above midi
    const want = LANES.map((L) => L.id);
    const next = [...view.strip.lanes(), spec].sort((a, b) => want.indexOf(a.id) - want.indexOf(b.id));
    view.strip.setLanes(next);
  };

  let audio = null, midi = null, out = null, probe = null, impulse = null, hold = null;

  /**
   * AN AUDIBLE CLICK, not the lab's one.
   *
   * createAudioLane's default source is a ONE-SAMPLE impulse, because that is
   * what the measurement needs — threshold detection can find its exact sample.
   * At 48 kHz that is 20 microseconds of sound, which on a laptop speaker is
   * next to nothing, so this demo appeared to do nothing when you enabled it.
   * Same scheduled instant, given a body you can hear.
   */
  const audibleClick = (ctx, at) => {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.frequency.value = 1320;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(0.3, at + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.05);
    osc.connect(g); g.connect(out);
    osc.start(at); osc.stop(at + 0.06);

    // AND a one-sample impulse at the SAME instant, into the probe bus only.
    // The ear needs an edge it can find to the sample; the blip above has a
    // 2 ms ramp, and a threshold crossing on a ramp lags ~0.75 ms — twenty
    // times the quantity being measured. This one is never heard: the probe
    // bus ends in a silent sink.
    if (probe) {
      const tick = ctx.createBufferSource();
      tick.buffer = impulse;
      tick.connect(probe);
      tick.start(at);
    }
    return osc;                       // the lane watches this node's onended
  };

  createHardware(d, {
    onAudio(ctx) {
      out = ctx.createGain();
      out.gain.value = 1;
      out.connect(ctx.destination);

      // THE EAR. Everything the sound card actually renders on the probe bus
      // is timestamped on the audio thread, to the sample. This is the only
      // way this lane can report on itself: Web Audio has no per-note
      // callback, and `outputLatency` is an estimate of the device leg, not a
      // measurement of when a note rendered.
      impulse = ctx.createBuffer(1, 2, ctx.sampleRate);
      impulse.getChannelData(0)[0] = 1;
      probe = ctx.createGain();
      probe.gain.value = 1;
      // Chrome latches a silent bus and then hands the worklet an EMPTY input
      // array. A started ConstantSourceNode at 0 keeps it live without adding
      // a sound. Documented trap; it cost this project a session once already.
      hold = ctx.createConstantSource();
      hold.offset.value = 0;
      hold.connect(probe);
      hold.start();
      ctx.audioWorklet.addModule('/shell/impulse-worklet.js').then(() => {
        const ear = new AudioWorkletNode(ctx, 'impulse-detect');
        ear.port.onmessage = (e) => heard.push(e.data.at);
        const mute = ctx.createGain();
        mute.gain.value = 0;                 // pulled by the graph, heard by nobody
        probe.connect(ear); ear.connect(mute); mute.connect(ctx.destination);
        d.log('ear listening on the audio thread');
      }).catch((e) => d.log(`no ear: ${e.name} — sound card stays unmeasured`, 'bad'));

      audio = createAudioLane(deck.transport, ctx, { horizonMs: AHEAD, makeNode: audibleClick });
      for (let at = 0; at < DURATION; at += BEAT) audio.schedule({ at, kind: 'click', id: `c${at}` });
      audio.start();
      showLane('sound');
      // the lane anchors wall time to audio time; at rate 0 there is nothing to
      // anchor to and it commits nothing, so arming implies rolling
      if (!deck.playing()) deck.play();
      d.log(`sound on, ${Math.floor(DURATION / BEAT)} clicks queued`);
    },
    onMidiIn(input) { listenOn(input); showLane('midiin'); },
    onMidi(port, access) {
      midi?.dispose();
      midi = createMidiLane(deck.transport, port, { horizonMs: AHEAD });
      for (let at = 0, i = 0; at < DURATION; at += BEAT, i++) {
        midi.schedule({ at, note: 60 + (i % 4) * 5, id: `n${at}` });
      }
      midi.start();
      showLane('midi');
      d.log(`midi out: ${port.name}`);
    },
  });

  /**
   * MEASURING THE MIDI LANE, which otherwise cannot be measured at all.
   *
   * macOS's IAC driver is a LOOPBACK: everything written to `IAC Driver Bus 1`
   * comes straight back on the input of the same name.
   *
   * DO NOT USE `e.timeStamp` FOR THIS. Measured five sends at known instants:
   * `e.timeStamp - scheduled` was **exactly 0.000 ms, five times out of five**.
   * CoreMIDI carries the timestamp in the packet and Chrome hands it back
   * unchanged, so the arrival stamp IS the send stamp — comparing them is a
   * number compared against itself, and it reads as a flawless result. It is
   * the same trap as comparing two peers' own clocks to measure skew between
   * them: the quantity cancels.
   *
   * `performance.now()` READ IN THE HANDLER does not cancel, because it is
   * sampled on this side after the trip. Same five sends: 0.7, 0.4, 0.3, 0.3,
   * 0.3 ms. That is an UPPER BOUND on delivery — it includes CoreMIDI, Chrome's
   * MIDI thread AND the main-thread event loop getting round to us — and it is
   * the only observable there is without external hardware. It is emphatically
   * not send → a synth on a cable.
   */
  const heard = [];                   // audio-domain seconds, from the ear
  const soundOf = new Map();          // position -> render error, ms
  function pairHeard() {
    if (!heard.length || !audio) return;
    const want = audio.scheduled();
    for (const t of heard.splice(0)) {
      let best = null, bd = Infinity;
      for (const x of want) {
        const d0 = Math.abs(x.intendedAudioT - t);
        if (d0 < bd) { bd = d0; best = x; }
      }
      // intendedAudioT is the instant the lane asked the audio thread for, in
      // the audio clock's own domain — so this subtraction never leaves that
      // domain and never touches the main thread's idea of the time.
      if (best && bd < 0.25) soundOf.set(Math.round(best.at), (t - best.intendedAudioT) * 1000);
    }
  }

  const backlog = [];
  let listening = null;
  function listenOn(input) {
    if (listening && listening !== input) listening.onmidimessage = null;
    listening = input;
    d.log(`midi in: ${input.name}`);
    input.onmidimessage = (e) => {
      if ((e.data[0] & 0xf0) !== 0x90 || e.data[2] === 0) return;      // note-on only
      const want = midi?.scheduled() || [];
      // nearest scheduled instant to this arrival; loop notes repeat, so match
      // on time rather than on note number
      // `sentAtPerf` and `e.timeStamp` are BOTH performance.now() ms. Pairing
      // against `intendedUs` instead compares epoch ms with performance ms and
      // never matches — which is how the loopback read empty for a whole
      // session while looking wired up.
      const arrived = performance.now();
      let best = null, bd = Infinity;
      for (const x of want) {
        const d0 = Math.abs(x.sentAtPerf - e.timeStamp);   // stamp pairs exactly; it is the send stamp
        if (d0 < bd) { bd = d0; best = x; }
      }
      if (!best || bd > 500) return;
      const late = arrived - best.sentAtPerf;              // ...but the NUMBER comes from our own clock
      backlog.push(late);
      loopOf.set(Math.round(best.at), late);
      if (backlog.length > 200) backlog.shift();
      // The log IS the MIDI monitor: macOS ships no monitor of its own, and an
      // external one cannot see the instant we asked for, only the instant the
      // note arrived. Note-ons only — every line doubled by its note-off is a
      // log you stop reading.
      d.log(`◀ note ${e.data[1]} vel ${e.data[2]} · ${late >= 0 ? '+' : ''}${late.toFixed(2)} ms`);
    };
  }

  /**
   * WHAT "SKEW" MEANT, AND WHY IT IS GONE.
   *
   * With two rows there was one gap, so one cell could carry it. With four
   * rows there are six pairs, two of which cannot be measured at all, and a
   * single `SKEW` cell had to mean "the gap between the first row and the
   * second" — a definition nobody can act on.
   *
   * Its replacement, `spread`, lasted about an hour and was worse: it
   * subtracted the worker's FIRE-side error from MIDI's RECEIVE-side error, two
   * numbers covering different lengths of path, and called the difference "how
   * far apart the lanes landed". A derived aggregate whose meaning needs a
   * paragraph is a cell nobody can act on either.
   *
   * `beats` went with it: it counted marks fired, which is the worker row's `n`
   * column with a different name and the strip's picture in a number.
   *
   * What is left is the two things that ARE page-level: the worst error anyone
   * reported, which is the "should I be worried" number, and how many of the
   * lanes can report at all — which moves the moment a device is plugged in,
   * and is the honest headline for a page where half the rows cannot see
   * themselves.
   */
  const summarise = (xs) => {
    const a = [...xs].sort((p, q) => p - q);
    return { n: a.length, p50: a[a.length >> 1], worst: a.reduce((m, v) => (Math.abs(v) > Math.abs(m) ? v : m), 0) };
  };
  const sign = (x) => `${x >= 0 ? '+' : ''}${x.toFixed(2)}`;
  const laneOf = (id) => view.strip.lanes().find((l) => l.id === id);
  const say = (id, ...lines) => { const L = laneOf(id); if (L) L.subLabel = lines; };

  let asserted = false;
  function measure() {
    let worst = null, measured = 0;
    const take = (id, xs) => {
      if (!xs.length) return false;
      const sm = summarise(xs);
      say(id, `typical ${sign(sm.p50)} ms`, `worst ${sign(sm.worst)} ms`);
      measured++;
      if (worst === null || Math.abs(sm.worst) > Math.abs(worst)) worst = sm.worst;
      return true;
    };

    if (!take('worker', [...driftOf.values()])) say('worker', 'not started');

    pairHeard();
    const sched = audio ? audio.scheduled() : [];
    if (!audio) say('sound', 'not enabled');
    else if (!take('sound', [...soundOf.values()])) say('sound', `${sched.length} sent`, 'ear not listening yet');

    // MIDI out has no feedback path of any kind — send() is fire-and-forget,
    // there is no completion callback and no "sent at" report. But it is not
    // unbounded: the loopback round trip is out + in, and neither leg can be
    // negative, so out is AT MOST the round trip. That is derived, not observed,
    // so it is worded as a ceiling and the lane stays uncoloured — a lane is
    // only coloured by evidence it produced itself.
    if (midi) for (const x of midi.scheduled()) sentOf.add(Math.round(x.at));
    if (!midi) say('midi', 'no device');
    else {
      const back = [...loopOf.values()];
      const bound = back.length ? summarise(back).p50 : null;
      say('midi', `${midi.scheduled().length} sent`,
        bound === null ? 'no way to check' : `at most ${sign(bound)} ms`);
    }

    if (!listening) say('midiin', 'no device');
    else if (!take('midiin', [...loopOf.values()])) say('midiin', 'nothing arrived');

    if (worst !== null) d.set('worst', worst);
    d.set('measured', `${measured} of ${LANES.length}`);
    view.strip.invalidate();

    if (asserted || !sched.length) return;
    const byPos = new Map(fired.filter((f) => f.at !== null).map((f) => [Math.round(f.at), f.wall]));
    const pairs = sched
      .filter((x) => Number.isFinite(x.intendedUs) && byPos.has(Math.round(x.at)))
      .map((x) => byPos.get(Math.round(x.at)) - x.intendedUs / 1000);
    if (!pairs.length) return;
    const p50 = summarise(pairs.map(Math.abs)).p50;
    asserted = true;
    d.assert('lanes agree within 50 ms at the same position', p50 < 50,
      `typically ${p50.toFixed(1)} ms over ${pairs.length} paired positions`);
    d.assert('audio schedule anchored', sched.length > 0, `${sched.length} committed`);
    d.assert('both lanes advanced', fired.length > 0 && sched.length > 0,
      `worker ${fired.length} / sound card ${sched.length}`);
  }
  setInterval(measure, 200);

  d.log(`${DURATION / 1000}s, one beat every ${BEAT} ms`);
  d.ready();
</script>
</html>
