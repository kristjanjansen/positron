<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>Plaits</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/concept.css">
<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { addNodes } from '/shell/nodes.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createMidiDevices } from '/shell/midi-devices.mjs';
  import { createKnob } from '/shell/knob.mjs';
  import { createKnobGrid } from '/shell/knob-grid.mjs';
  import { createKeyboard, keyRange } from '/shell/keyboard.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { createPlaitsVoice, PATCHES, P } from '../plaits-voice.mjs';

  // A second Plaits concept. Asked 2026-10-12: *"make second plaits demo with
  // keyboard and all parameters. 2 row patamters perhaps to mimic muta
  // grouping"*. The voice is /concepts/synth/110/'s (`../plaits-voice.mjs`,
  // /muta/'s worklet and wasm), played from the kit keyboard and from any MIDI
  // keyboard plugged into this machine, with every parameter /muta/ exposes as
  // a knob of its own.
  //
  // EVERY KNOB IS A NODE, `web:knob-<name>`, with a value link into
  // `web:plaits:value-in`, so turning one is a value crossing a wire. ONE ROW
  // in /muta/'s order, scrolling sideways when it does not fit (*"synth 120,
  // all params in one line, scrollabel"*): model, pitch, harmonics, timbre,
  // morph, timbre CV, FM CV, morph CV, decay, colour. No voices knob (*"rm
  // voices param"*); the voice count stays the shared voice's 6.
  // THE MODEL IS A STEPPED KNOB, not a second picker: it is a Plaits parameter
  // like the others, so it gets the same node and link, and a second picker
  // beside the patch picker would be two controls that look alike and do
  // different things. Its number reads as a short model name.
  // PITCH IS THE FREQUENCY KNOB AS A TRANSPOSE. On the module, V/OCT adds to
  // FREQUENCY; here each key's note is offset by the knob's semitones, which
  // a key pressed after the turn plays (a held note keeps its pitch).
  // THE CV AMOUNTS: with nothing patched into those inputs, Plaits routes its
  // own decay envelope through them (and FM sweeps the pitch), so each is
  // heard on a note's attack.
  //
  // THE PATCH PICKER SETS EVERY KNOB, and the knobs send the values over their
  // own links. It is not a node of its own here: on 110 a program change
  // carried what no knob held, here every value has a knob, so a program
  // change would be a second road around them.
  //
  // NOTHING PLAYS ON A VISIT. A pointer over the keys fetches the wasm from
  // this origin; the first key makes the AudioContext, boots, and plays that
  // key once the voice is up if it is still held. Asking for MIDI shows the
  // browser's prompt once, as /synth/keyboard/ does.
  const d = mount({ name: 'Plaits', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('code/plaits');

  const S = 'web';
  const ID = (node, port) => `${S}:${node}:${port}`;
  const SHORT = ['analog', 'shaper', 'FM', 'formant', 'additive', 'table', 'chord', 'speech',
    'swarm', 'noise', 'dust', 'string', 'modal', 'kick', 'snare', 'hat'];
  const P0 = PATCHES[0];
  // The knobs, in /muta/'s order. `to` is what the value does at Plaits.
  // `short` is the word under a dial whose name would be cut with an ellipsis
  // (the knob cell holds about six letters); the full name is its hover, its
  // node's label and the value's name on the wire.
  const ROWS = [
    [
      { name: 'model', min: 0, max: 15, step: 1, value: P0.engine, to: (v) => param(P.engine, Math.round(v)),
        format: (v) => SHORT[Math.round(v)] ?? '' },
      { name: 'pitch', min: -24, max: 24, step: 1, value: 0, to: (v) => { transpose = Math.round(v); },
        format: (v) => `${v > 0 ? '+' : ''}${Math.round(v)}` },
      { name: 'harmonics', short: 'harm', value: P0.harmonics, to: (v) => param(P.harmonics, v) },
      { name: 'timbre', value: P0.timbre, to: (v) => param(P.timbre, v) },
      { name: 'morph', value: P0.morph, to: (v) => param(P.morph, v) },
    ],
    [
      { name: 'timbre CV', short: 'T CV', id: 'timbre-cv', min: -1, max: 1, value: 0, to: (v) => param(P.timbreModAmount, v) },
      { name: 'FM CV', id: 'fm-cv', min: -1, max: 1, value: 0, to: (v) => param(P.fmAmount, v) },
      { name: 'morph CV', short: 'M CV', id: 'morph-cv', min: -1, max: 1, value: 0, to: (v) => param(P.morphModAmount, v) },
      { name: 'decay', value: P0.decay, to: (v) => param(P.decay, v) },
      { name: 'colour', value: P0.colour, to: (v) => param(P.lpgColour, v) },
    ],
  ];
  const ALL = ROWS.flat().map((k) => ({ min: 0, max: 1, id: k.name, ...k }));
  const byName = new Map(ALL.map((k) => [k.name, k]));
  let transpose = 0;
  const param = (id, value) => voice.send({ t: 'param', id, value });

  // ── the bay ──────────────────────────────────────────────────────────────
  const bay = createBay();

  const voice = createPlaitsVoice({ log: d.log, voices: 6, onUp: () => route() });
  voice.setGain(P0.gain);   // the first patch's level trim
  const held = new Set();        // keys down that have reached Plaits, by key note
  const playing = new Map();     // key note -> the note Plaits was handed
  let notesIn = 0, paramsIn = 0;
  function noteOn(n, vel) {
    held.add(n);
    if (!voice.ready()) {
      // The first key boots the voice and plays once it is up, if still held.
      voice.boot().then((ok) => { if (ok && held.has(n) && !playing.has(n)) noteOn(n, vel); });
      return;
    }
    const at = Math.max(0, Math.min(127, n + transpose));
    playing.set(n, at);
    voice.noteOn(at, vel);
  }
  function noteOff(n) {
    held.delete(n);
    if (playing.has(n)) { voice.noteOff(playing.get(n)); playing.delete(n); }
  }
  let kb = null;
  // The shapes are /shell/nodes.mjs's. A knob is labelled with its full name,
  // and a port with its `node:port`, which is what a refusal names.
  const knobNodes = ALL.map((k) => ({ name: 'knob', as: `knob-${k.id}`, label: k.name }));
  const own = (ids) => Object.fromEntries(ids.map((i) => [i, { label: i }]));
  addNodes(bay, S, ['keys', ...knobNodes, 'plaits', 'scope', 'speaker'], {
    deliver: {
      'keys:midi-in': (e) => kb?.lightNote(e.d1, !!e.d2),
      'plaits:midi-in': (e) => {
        if (e?.cls !== 'note') return;
        notesIn++;
        if (e.d2 > 0) noteOn(e.d1, e.d2); else noteOff(e.d1);
      },
      'plaits:value-in': (e) => {
        const k = e?.of === 'param' && byName.get(e.name);
        if (!k) return;
        paramsIn++;
        k.to(e.v);
      },
    },
    ports: {
      ...own(['keys:midi-out', 'keys:midi-in', ...knobNodes.map((k) => `${k.as}:value-out`), 'plaits:midi-in', 'plaits:audio-out', 'scope:audio-in', 'speaker:audio-in']),
      'plaits:value-in': { label: 'plaits:value-in', shape: { of: 'param', names: ALL.map((k) => k.name) } },
    },
  });
  const lay = (from, to) => { const r = bay.link(from, to); if (!r.ok) d.log(`${from} -> ${to} refused: ${r.why}`, 'warn'); };
  lay(ID('keys', 'midi-out'), ID('plaits', 'midi-in'));
  for (const k of ALL) lay(ID(`knob-${k.id}`, 'value-out'), ID('plaits', 'value-in'));
  lay(ID('plaits', 'audio-out'), ID('scope', 'audio-in'));
  lay(ID('plaits', 'audio-out'), ID('speaker', 'audio-in'));

  /** THE ROUTER: the voice's sound goes where the bay's audio links say. */
  function route() {
    const out = voice.out();
    if (!out) return;
    const has = (a, b) => bay.links().some((l) => l.from === a && l.to === b);
    try { out.disconnect(); } catch { /* not connected */ }
    if (has(ID('plaits', 'audio-out'), ID('speaker', 'audio-in'))) out.connect(voice.speakers());
    if (has(ID('plaits', 'audio-out'), ID('scope', 'audio-in'))) out.connect(voice.scopeIn());
  }

  // ── the knobs: two rows, every one its own node ─────────────────────────
  const knobs = new Map(ALL.map((k) => {
    const knob = createKnob({
      label: k.short || k.name, title: k.name, min: k.min, max: k.max, step: k.step, value: k.value, home: k.value, hand: true,
      format: k.format,
      onInput: (v) => bay.send(ID(`knob-${k.id}`, 'value-out'), { of: 'param', name: k.name, v }),
    });
    return [k.name, knob];
  }));
  // Every knob sends its starting value once, so the voice holds what the
  // panel shows (queued until the voice is up).
  for (const k of ALL) bay.send(ID(`knob-${k.id}`, 'value-out'), { of: 'param', name: k.name, v: k.value });
  const grid = createKnobGrid(knobs, { row: true });

  // ── the patch picker: it moves the knobs, the knobs send ────────────────
  let at = 0;
  function pick(i) {
    at = i;
    patchPick.show(PATCHES[i].name, i);
    const p = PATCHES[i];
    voice.setGain(p.gain);
    const want = { model: p.engine, harmonics: p.harmonics, timbre: p.timbre, morph: p.morph, decay: p.decay, colour: p.colour };
    for (const [name, v] of Object.entries(want)) {
      // The knob turns to the patch's value on screen (`receive`, which glides
      // and sends nothing) and the value leaves on its own cable here, once.
      const got = knobs.get(name).receive(v, { from: 'patch', force: true });
      bay.send(ID(`knob-${byName.get(name).id}`, 'value-out'), { of: 'param', name, v: got });
    }
  }
  const stepPatch = (by) => pick((at + by + PATCHES.length) % PATCHES.length);
  const patchPick = createPicker({ what: 'patch', cls: 'cc-patch', prev: () => stepPatch(-1), next: () => stepPatch(+1), onPick: (i) => pick(i) });
  patchPick.options(PATCHES.map((p) => p.name), 0);
  patchPick.show(PATCHES[0].name, 0);

  // ── the keyboard: its notes leave on web:keys:midi-out ──────────────────
  const host = el('div');
  kb = createKeyboard(host, {
    ...keyRange(21), base: 48,
    onDown: (note, how) => { if (how === 'midi') return; bay.send(ID('keys', 'midi-out'), { cls: 'note', ch: 1, d1: note, d2: 100 }); },
    onUp: (note, how) => { if (how === 'midi') return; bay.send(ID('keys', 'midi-out'), { cls: 'note', ch: 1, d1: note, d2: 0 }); },
  });
  for (const ev of ['pointerenter', 'focusin', 'touchstart']) host.addEventListener(ev, () => { voice.warm().catch(() => {}); }, { once: true, passive: true });

  // ── keyboards plugged into this machine, as /synth/keyboard/ ────────
  const { plugged, ask: askMidi } = createMidiDevices({ bay, site: S, to: [ID('plaits', 'midi-in'), ID('keys', 'midi-in')],
    onChange: () => pb.refresh(), log: (line, kind) => d.log(line, kind) });
  const shown = (id) => !id.startsWith(`${S}:midi`) || plugged.has(id.split(':').slice(0, 2).join(':'));

  // ── the page ─────────────────────────────────────────────────────────────
  const pb = createPatchbay({
    nodes: () => bay.nodes().filter((n) => shown(n.id)),
    ports: () => bay.ports().filter((p) => shown(p.id)),
    links: () => bay.links(),
  }, { flowing: (l) => (l.from === ID('plaits', 'audio-out') ? voice.level() > 0.002 : playing.size > 0) });
  setInterval(() => pb.refresh?.(), 500);
  askMidi();
  d.stack.add(voice.scope.el, patchPick.el, grid.el, host, pb.el);

  window.__demo.keyboard = kb;
  window.__demo.knobs = grid;
  window.__demo.plaits = {
    bay, knobs, pick, patches: PATCHES, features: voice.features, ready: voice.ready, ctx: voice.ctx,
    wasmAsked: voice.asked, level: voice.level, at: () => at, transpose: () => transpose,
    playing: () => [...playing.values()].sort(),
    key: (n, on) => bay.send(ID('keys', 'midi-out'), { cls: 'note', ch: 1, d1: n, d2: on ? 100 : 0 }),
    counts: () => ({ notesIn, paramsIn }),
  };
  d.ready();
</script>
