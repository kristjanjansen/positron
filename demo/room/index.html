<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* 300, not 150: the picture in each tile is drawn on a 1280 grid, and below
     about 300 px its clocks stop being readable — a tile too small to read is
     a tile that only proves something arrived. */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 6px; margin: 0 0 10px; }
  .cell { position: relative; aspect-ratio: 16/9; background: #000; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .cell.me { border-color: var(--hi); }
  .cell video { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* TOP, not bottom: the machine-readable row lives along the bottom of every
     picture, and a label sitting on it covers the one part of the frame a
     program has to be able to read. */
  .cell .lbl { position: absolute; left: 5px; top: 4px; font: 600 10px/1.4 var(--mono);
               color: var(--fg); background: #0b0e14aa; border-radius: 3px; padding: 1px 5px; }
  .cell.me .lbl { color: #0b0e14; background: var(--hi); }
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { burn, hueFor, drawCamera, readBurned } from '/shell/pattern.mjs';

  const ROOM = new URLSearchParams(location.search).get('room') || 'room-demo';
  const ID = Math.random().toString(36).slice(2, 8);
  const RELAY = `wss://ws.positron.studio/room/${ROOM}/ws`;

  const d = mount({
    name: 'room',
    what: 'Open this page twice and each window shows the other; the picture goes '
      + 'straight between them and the server only introduces the two. Every '
      + 'frame carries the same burned-in clock, so a far window read against '
      + 'yours is how far behind it is, and FIRST is how long it took to '
      + 'appear.',
    readout: { others: '', first: 'ms', size: '', dropped: '' },
    controls: [
      { id: 'join', label: 'Join', primary: true },
      { id: 'camera', label: 'Use the camera' },
    ],
  });
  guard(d);


  const grid = el('div', 'grid');
  d.el.append(grid);

  function tile(id, me) {
    const cell = el('div', `cell${me ? ' me' : ''}`);
    const v = el('video', '', null, { playsinline: '', autoplay: '' });
    if (me) v.muted = true;
    cell.append(v, el('span', 'lbl', me ? `${id} (you)` : id));
    grid.append(cell);
    return { cell, video: v };
  }

  let ws = null, local = null, joinedAt = 0, firstRemoteMs = null;
  const tiles = new Map();
  const pcs = new Map();

  /**
   * A canvas by default, the camera on request.
   *
   * A canvas stream is a real MediaStreamTrack — it negotiates, encodes and
   * arrives exactly like a webcam — so the peer path is exercised with no
   * permission prompt in the way, and the suite stays deterministic. The camera
   * draws INTO the same canvas, so one path serves both and the clock is burned
   * either way.
   *
   * 1280x720 because the shared pattern's machine-readable row is frozen on a
   * 1280 grid. It is captured at 10 fps: this is a room of several senders and
   * the point is WHOSE picture arrives and how far behind, not frame rate.
   */
  const W = 1280, H = 720;
  const HUE = hueFor(ID);            // this window's colour, from its own id
  const canvas = el('canvas');
  canvas.width = W; canvas.height = H;
  const g = canvas.getContext('2d');
  const live = el('video', '', null, { playsinline: '', muted: '' });
  live.hidden = true;
  let camStream = null, frame = 0;

  setInterval(() => {
    frame++;
    // ONE picture across this project: the same module the recorder burns and
    // the publisher generates its ffmpeg filter from. So a tile here and a
    // frame off any other transport are the same picture, and the clock in one
    // can be read against the clock in another.
    const cam = camStream && live.readyState >= 2 && drawCamera(g, live, W, H);
    burn(g, W, H, frame, { hue: HUE, field: !cam });
  }, 100);

  function localStream() { return canvas.captureStream(10); }

  d.on('camera', async () => {
    if (camStream) { d.log('camera already on'); return; }
    try {
      camStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      live.srcObject = camStream;
      await live.play().catch(() => {});
      d.log(`camera on: ${camStream.getVideoTracks()[0].label || 'default'}`, 'hi');
    } catch (e) {
      camStream = null;
      d.log(`camera: ${e.name} — staying on the generated picture`, 'bad');
    }
  });

  const send = (o) => { if (ws?.readyState === 1) ws.send(JSON.stringify({ ...o, from: ID })); };

  /** The higher id dials; the lower id waits to be dialled. See the note below. */
  function maybeOffer(peer) {
    if (ID > peer) return offerTo(peer);
    if (!pcs.has(peer)) d.log(`${peer}: waiting for them to dial`);
    return undefined;
  }

  async function offerTo(peer) {
    if (pcs.has(peer)) return;
    const pc = new RTCPeerConnection();
    pcs.set(peer, pc);
    for (const t of local.getTracks()) pc.addTrack(t, local);
    pc.onicecandidate = (e) => { if (e.candidate) send({ type: 'ice', to: peer, c: e.candidate }); };
    pc.ontrack = (e) => attach(peer, e.streams[0]);
    pc.onconnectionstatechange = () => { d.log(`${peer}: ${pc.connectionState}`); paint(); };
    const o = await pc.createOffer();
    await pc.setLocalDescription(o);
    send({ type: 'offer', to: peer, sdp: o.sdp });
  }

  function attach(peer, stream) {
    if (!tiles.has(peer)) tiles.set(peer, tile(peer, false));
    tiles.get(peer).video.srcObject = stream;
    if (firstRemoteMs === null && joinedAt) {
      firstRemoteMs = performance.now() - joinedAt;
      d.set('first', Math.round(firstRemoteMs));
    }
    paint();
  }

  function paint() {
    const states = [...pcs.values()].map((p) => p.connectionState);
    const joined = states.filter((x) => x === 'connected').length;
    const gone = states.filter((x) => x === 'failed' || x === 'disconnected').length;
    // no `?? 0`: a number this page has not observed is an em dash, and before
    // anyone joins there is nothing to report rather than a confident zero
    d.set('others', pcs.size || null);
    d.set('dropped', pcs.size ? gone : null, gone ? 'bad' : '');

    // WHAT ACTUALLY ARRIVED, not what we sent. WebRTC starts a new sender low
    // and climbs as it learns the link: measured here, 320x180 at 4 s and
    // 1280x720 at 29 s, in six steps. Worth a cell of its own because it is the
    // reason a far window's clock cannot be read at first — without it the page
    // would look broken for half a minute and never say why.
    let best = 0, label = null;
    for (const [peer, t] of tiles) {
      if (peer === ID) continue;
      const v = t.video;
      if (v.videoWidth * v.videoHeight > best) {
        best = v.videoWidth * v.videoHeight;
        label = `${v.videoWidth}x${v.videoHeight}`;
      }
    }
    d.set('size', label, best >= 1280 * 720 ? 'ok' : '');
  }
  setInterval(paint, 1000);          // the climb happens with no event to hang on

  d.on('join', async () => {
    if (ws) return;
    local = localStream();
    tiles.set(ID, tile(ID, true));
    tiles.get(ID).video.srcObject = local;
    await tiles.get(ID).video.play().catch(() => {});
    joinedAt = performance.now();

    ws = new WebSocket(RELAY);
    ws.onopen = () => { d.log(`joined ${ROOM} as ${ID}`, 'hi'); send({ type: 'hello' }); };
    ws.onmessage = async (e) => {
      let m; try { m = JSON.parse(e.data); } catch { return; }
      if (m.from === ID) return;                       // the relay echoes to us too
      if (m.to && m.to !== ID) return;
      // ONLY ONE SIDE OFFERS. Both used to: whoever received `hello` replied
      // `here` AND offered, and whoever received `here` offered as well — so two
      // offers crossed and one of them died on `Called in wrong state: stable`,
      // leaving an empty tile with no error a reader could act on. Comparing
      // ids picks an offerer deterministically and needs no extra round trip;
      // both sides still DISCOVER each other, exactly one of them dials.
      if (m.type === 'hello') { send({ type: 'here' }); maybeOffer(m.from); return; }
      if (m.type === 'here') { maybeOffer(m.from); return; }
      if (m.type === 'offer') {
        const pc = new RTCPeerConnection();
        pcs.set(m.from, pc);
        for (const t of local.getTracks()) pc.addTrack(t, local);
        pc.onicecandidate = (ev) => { if (ev.candidate) send({ type: 'ice', to: m.from, c: ev.candidate }); };
        pc.ontrack = (ev) => attach(m.from, ev.streams[0]);
        pc.onconnectionstatechange = () => paint();
        await pc.setRemoteDescription({ type: 'offer', sdp: m.sdp });
        const a = await pc.createAnswer();
        await pc.setLocalDescription(a);
        send({ type: 'answer', to: m.from, sdp: a.sdp });
        return;
      }
      if (m.type === 'answer') {
        await pcs.get(m.from)?.setRemoteDescription({ type: 'answer', sdp: m.sdp });
        return;
      }
      if (m.type === 'ice') { try { await pcs.get(m.from)?.addIceCandidate(m.c); } catch { /* late */ } }
    };
    addEventListener('pagehide', () => { try { ws.close(); } catch { /* gone */ } });
    // Give the handshake a moment, then check ourselves. Not on `onopen`: the
    // interesting failure is the relay NOT opening, and an assert that only
    // runs on success reports nothing at all when it matters.
    setTimeout(checks, 1200);
  });

  // The checks run THEMSELVES, once, after joining. A button labelled "Run the
  // checks" is machinery from the harness showing through into a page a person
  // is meant to read — and it made the asserts optional, which is the wrong
  // default for the only thing on the page that can say it worked.
  let asserted = false;
  async function checks() {
    if (asserted) return;
    asserted = true;
    // readyState 0 is CONNECTING, not broken — wait for the handshake rather
    // than asserting against a race
    for (let i = 0; i < 30 && ws && ws.readyState === 0; i++) await new Promise((r) => setTimeout(r, 100));
    d.assert('the server is there to introduce us', ws?.readyState === 1, String(ws?.readyState));
    d.assert('this window is sending a picture', !!local && local.getTracks().length > 0,
      `${local?.getTracks().length ?? 0} track(s)`);
    d.assert('this window can see itself', tiles.has(ID));
    // The burn is checkable, not decorative: the picture we send carries a
    // clock a program can read back out of the pixels, which is what makes a
    // far-off tile comparable to this one.
    d.assert('the picture carries a readable clock', readBurned(g) !== null,
      `${W}x${H}, hue ${HUE}`);
    d.assert('nobody dropped out', [...pcs.values()].every((p) => p.connectionState !== 'failed'),
      `${pcs.size} other window(s)`);
    d.log(`open this page again with ?room=${ROOM} to see a second tile`);
  }

  d.ready();
</script>
</html>
