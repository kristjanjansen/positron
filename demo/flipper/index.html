<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* Two pictures side by side, one under the other on a phone. The grid asks
     its OWN width, never the window's, which is /cam/'s rule for the same
     shape. */
  .fl-wrap { container-type: inline-size; }
  .fl-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: calc(2 * var(--ctl-gap));
  }
  @container (max-width: 560px) {
    .fl-grid { grid-template-columns: minmax(0, 1fr); }
  }
  /* The channel's name leads its footer. A name, not a readout key, so it wears
     the value ink. */
  .fl-name { font: 500 11px/1.4 var(--mono); color: var(--fg); white-space: nowrap; }
  /* Each footer's Loop wears the transport bar's own classes, `tbar-loop
     tbar-word`, so it is the bar's button in look and in its three states.
     ⚠️ THOSE RULES SIZE IT FROM `--tbar-btn`, WHICH ONLY `.tbar` DECLARES.
     Outside a bar the var is undefined, `height` falls back to `auto` and the
     button collapses to its text. 34 px is the bar's own value and the base
     button's, so this restates one number rather than inventing one. */
  .fl-wrap { --tbar-btn: 34px; }
</style>
<script src="/proto/remixer/hls.min.js"></script>
<script type="module">
  // 🔴 `/now/` AND `/flipper/` ARE ONE PAGE SINCE 2026-10-05. Asked as *"you
  // promised to merge flipper and now. featch schedule once or optimize, do not
  // overthink"*, with *"add (un)mute buttons"* and *"no radio. 3 tvs"*. What
  // came from where, so nobody has to diff two archives to find out:
  //   from `/flipper/`  a press as the only thing that opens anything, the
  //                     fragment count as evidence of picture, and the refusal
  //                     survey's first assert
  //   from `/now/`      the line in wall clock time, both lanes, LIVE, the
  //                     walk back into the window, the 10 s playlist refresh on
  //                     a reused variant, and every check of those
  // The old `/now/` is at archive/demos/now-index.html. The five radio cells
  // went on the owner's word and the stand-in still serves their mounts.
  //
  // 🔴 TWO VIDEO PANELS, ETV AND ETV2, BOTH PLAYABLE AT ONCE, AND NO SHARED
  // TRANSPORT, SINCE 2026-10-05. Asked first as *"no start button. etv and etv2
  // only, use videopanels"*, then as *"make them work on same time or is it
  // blocked?. no common transport lane"*. Nothing blocked it: the one-at-a-time
  // rule was the page's own. So every piece of state that used to be a page
  // global (the engine, the clock, the deck, the line, the playlist, what ERR
  // refused) is now one CHANNEL object per panel, built by `makeChannel`, and
  // each panel carries its own play, LIVE, mute and full screen in its footer
  // and its own line glued under it. ETV+ is filtered out HERE and not from
  // `CHANNELS`, which other code reads.
  // ⚠️ A PLAY PRESS MAKES ITS OWN CHANNEL AUDIBLE AND TOUCHES NO OTHER. It used
  // to mute whichever channel was already audible, and the owner said
  // *"do not mute first when startic second"* (2026-10-05). Two at once is the
  // listener's call, made with each panel's own mute glyph.
  // ⚠️ THE LINE IS GLUED UNDER THE PANEL WITH `glue()`, NOT HANDED TO `under`.
  // `under` is the second storey that is only drawn while the panel is full in
  // `footer` mode (see its header); a line that vanished off full screen would
  // be no line at all.
  //
  // 🔴 THE SELF-CHECK PRESSES THOSE PLAY BUTTONS ITSELF, BEFORE `d.ready()`,
  // and closes what it opened before it says ready. With no `.pos-controls`
  // button and no published transport the harness has nothing of ours to press,
  // so the page drives itself the way a person would. Hence `bootMs` in the
  // manifest.
  import { mount, guard, el, armVideo } from '/shell/shell.mjs';
  import { centreSymbol, setSymbol } from '/shell/symbol.mjs';
  import { createStripView } from '/shell/strip.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createDiagram } from '/shell/diagram.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { formatTime } from '/timeline/strip.mjs';
  import { mediaMaster } from '/timeline/media-master.mjs';
  import { CHANNELS, NATIVE_HLS, readPlaylist, probeSegment, wallHandler, clockOf, errUrl,
           findServedEdge, surveyChannels, describeSurvey }
    from '/shell/err-live.mjs';
  // 🔴 THIS PAGE IS POINTED AT A PUBLIC BROADCASTER, SO THE GATE IS NOT ABOUT
  // TIDINESS. Every connection opened here lands in ERR's listener statistics.
  // A visit opens NOTHING until a channel's play is pressed, and a visitor then
  // gets that channel at its live edge and nothing else.
  import { SELFCHECK, DEEP, ifDeep } from '/shell/selfcheck.mjs';

  const REACH_MS = 120 * 60 * 1000;            // what ERR advertises; measured below
  const RANGE_HZ = 1;                          // both ends move, once a second
  /**
   * 🔴 THE LINE MOVES ONCE A SECOND AND THE PLAYLIST IS READ EVERY TEN.
   * ERR's media playlist is 217,851 bytes with no delta updates (MEASURED
   * 2026-09-08, `plans/plan-live-timeline.md`), and `/now/` used to fetch it
   * AND the master once a second: about 1.7 Mbit/s of playlist per open tab,
   * and a new ERR session every second, because the master mints one per read.
   * Between reads both ends are carried forward by the wall clock. Per OPEN
   * CHANNEL now, so two channels playing are two playlists every ten seconds.
   */
  const PLAYLIST_EVERY_MS = 10000;
  const OPEN_SPAN_MS = 12 * 60 * 1000;         // the opening view
  const PROBE_POINTS = 13;
  /** Every two-byte ask in one open of one channel, capped. Up to 8 at open,
   *  up to 8 more per LIVE on a walled channel (never twice inside 20 s), 13
   *  for the deep sweep and up to 9 for the deep survey of the other one. */
  const PROBE_CAP = 40;
  const PROBE_STEPS = 8;                       // how far back the edge sweep walks
  const WALL_BACKOFF_S = 90;                   // where to start behind a boundary
  const SERVED_FRESH_MS = 20000;
  const BAND = { green: [5000, 10000], amber: 20000 };

  /** The two channels this page shows. `CHANNELS` itself is shared. */
  const ON_PAGE = CHANNELS.filter((c) => c.id === 'etv' || c.id === 'etv2');

  const d = mount({
    name: 'flipper',
    // ONE LINE, AND IT IS THE INDEX'S `one`: the picture at the foot of the
    // page explains the machinery, so the sentence does not try to.
    what: 'ETV and ETV2 live in two pictures that can play together, each over its own line whose right end is the present moment.',
    // NOT DRAWN. The headline number, how far behind a picture is, sits in its
    // live row's gutter beside the marks it is about; these are for `__demo`,
    // and they follow the channel pressed last.
    readout: { channel: '', state: '', behind: 's', 'first frame': 'ms' },
    showReadout: false,
  });
  guard(d);

  const PLAY = '►';                // no emoji form, unlike U+25B6
  const STOP = '■';
  const TO_LIVE = '►►';            // two of the same ►, never ⏩, which has an emoji form
  /**
   * 🔴 LOOP MEANS WHAT THE TRANSPORT BAR'S LOOP MEANS ON A LIVE DECK.
   * `demo/shell/transport-bar.mjs`: the first press marks the start and OPENS
   * a window that the live edge fills, a second press closes it early (or the
   * window closes itself at the ceiling), the stretch then plays round, and a
   * third press takes the loop off and goes back to the live edge. The ceiling
   * is the bar's own default `liveWindowMs`, and the last quarter of a filling
   * window blinks, as the bar's does.
   * ⚠️ PAGE-LOCAL, AND WHAT SHOULD MOVE TO THE KIT IS NAMED IN THE REPORT. The
   * bar's loop lives inside its own paint loop and seeks through `deck.seek`,
   * and on this page that is the wrong verb: the deck FOLLOWS the picture
   * through `mediaMaster`, so a wrap has to move the picture (`seekTo`), and the
   * line follows it.
   */
  const LOOP_WINDOW_MS = 20000;
  const LOOP_WARN_FRAC = 0.25;
  const LOOP_BLINK_MS = 640;
  const MUTE_ON = '♫';             // the same two glyphs as /stage/'s mute
  const MUTE_OFF = '⊘';

  const hms = (ms) => new Date(ms).toTimeString().slice(0, 8);
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  // Engines alive across BOTH channels, and the channel pressed last, which is
  // what the readout cells describe.
  let hlsAlive = 0;
  let focus = null;

  // Requests to the broadcaster's addresses the browser has made so far. Read
  // at the first press, it says whether the visit opened anything first.
  const broadcasterAsks = () => performance.getEntriesByType('resource')
    .filter((e) => /\.m3u8|\/live\/|tvSchedule/.test(e.name)).length;
  let askedBeforePlay = null;

  /** ERR's schedule endpoint. One constant, read by the fetch and by the
   *  diagram's box for it, so the picture cannot name a host the page does not
   *  ask. */
  const SCHEDULE_API = 'https://www.err.ee/api/tvSchedule/getTimelineSchedule';
  /** The live origin as ERR publishes it. `CHANNELS` carries it already moved
   *  by `?base=` under a harness, so the diagram's host is written once here
   *  and checked against `CHANNELS` when there is no base. */
  const LIVE_HOST = 'live.err.ee';

  /**
   * 🔴 WHAT THE BROWSER ACTUALLY ASKED ERR FOR, SORTED INTO THE DIAGRAM'S
   * BOXES. A `PerformanceObserver` only listens, so it opens nothing and cannot
   * change what a visit fetches. `buffered: true` takes the entries already
   * there and it keeps counting after the resource buffer's 250 entry ceiling,
   * which `getEntriesByType` does not. A request to an ERR path that fits no
   * box is counted too, because that is the picture missing a part.
   */
  const ASK_BOX = [
    ['master', /\/live\/[a-z0-9]+\.m3u8(\?|$)/],
    ['variant', /\/live\/[a-z0-9]+\/[^?]+\.m3u8(\?|$)/],
    ['segments', /\/live\/[a-z0-9]+\/[^?]+\.(m4s|mp4|ts|aac)(\?|$)/],
    ['schedule', /\/api\/tvSchedule\//],
  ];
  const asks = { byBox: {}, origins: {}, unplaced: [] };
  try {
    new PerformanceObserver((list) => {
      for (const e of list.getEntries()) {
        if (!/\/live\/|tvSchedule/.test(e.name)) continue;
        const u = new URL(e.name);
        const hit = ASK_BOX.find(([, re]) => re.test(u.pathname + u.search));
        if (!hit) { asks.unplaced.push(u.pathname); continue; }
        asks.byBox[hit[0]] = (asks.byBox[hit[0]] || 0) + 1;
        (asks.origins[hit[0]] ||= new Set()).add(u.origin);
      }
    }).observe({ type: 'resource', buffered: true });
  } catch { /* no observer: the assert below then says nothing was seen */ }

  // 🔴 FETCHED ONCE PER CHANNEL AND DAY, AND KEPT. A schedule for a day that has
  // been read does not change while somebody stops and starts a channel, so a
  // second play reuses the answer and nothing refetches it on a timer. A failed
  // fetch is forgotten, so the next open of that channel asks again.
  const scheduleCache = new Map();
  let scheduleFetches = 0;
  function scheduleDay(c, day) {
    const key = `${c.id}|${day.toDateString()}`;
    if (!scheduleCache.has(key)) {
      scheduleFetches++;
      // THROUGH `errUrl` LIKE EVERY OTHER ERR ADDRESS ON THIS PAGE.
      const u = errUrl(SCHEDULE_API)
        + `?day=${day.getDate()}&month=${day.getMonth() + 1}&year=${day.getFullYear()}&channel=${c.id}`;
      scheduleCache.set(key, fetch(u).then((r) => r.json()).then((j) => {
        const rows = [];
        for (const r of Object.values(j || {})) {
          const at = Number(r?.startTime) * 1000;
          if (!Number.isFinite(at) || !at) continue;
          const clean = (r.programName || r.programNameTx || r.name || '').replace(/\*\s*$/, '').trim();
          rows.push({ at, name: clean || '', repeat: r.automaticReplay === 'Y' });
        }
        return rows;
      }).catch(() => { scheduleCache.delete(key); return []; }));
    }
    return scheduleCache.get(key);
  }

  // ── one channel: a panel, its footer controls, its line and its engine ────
  function makeChannel(c) {
    const S = { c, playing: false, muted: true, audibleAtPlay: null, opening: null,
      scheduleDone: Promise.resolve() };

    // the picture and its panel
    const video = el('video', '', null, { playsinline: '', muted: '' });
    video.muted = true;
    S.video = video;
    const play = el('button', 'ico', PLAY, { type: 'button', 'aria-label': `play ${c.name}` });
    centreSymbol(play);
    const live = el('button', 'ico', TO_LIVE, { type: 'button', 'aria-label': `${c.name} back to the live edge`,
      title: 'back to the live edge' });
    centreSymbol(live);
    // The bar's own Loop: same word, same classes, same `data-loop` states.
    const loopBtn = el('button', 'tbar-loop tbar-word', 'Loop', { type: 'button', 'aria-label': `${c.name} loop` });
    loopBtn.dataset.loop = 'off';
    loopBtn.title = 'press to hold the live picture, again to end the loop, again to take it off';
    const mute = el('button', 'ico', MUTE_OFF, { type: 'button', 'aria-label': `${c.name} sound` });
    centreSymbol(mute);
    Object.assign(S, { play, live, loopBtn, mute });
    S.loop = { a: null, b: null, filling: false, ends: null, lastWrap: 0, wraps: 0, wrapEvid: null,
      blinking: false, blinkAnim: null };
    const panel = createVideoPanel({ media: video, left: el('span', 'fl-name', c.name), fullMode: 'hover' });
    // ► ►► Loop ♫ ⛶: what plays, where in time, then the sound, and the panel's
    // own full screen square staying last.
    panel.slots.right.prepend(play, live, loopBtn, mute);
    S.panel = panel;

    // the line, in ABSOLUTE WALL MILLISECONDS, from ERR's own PDT rather than
    // from this device's clock
    const now0 = Date.now();
    const deck = createDeck({ items: [], adapters: {}, range: [now0 - REACH_MS, now0] });
    deck.seek(now0);
    S.deck = deck;

    S.reset = () => {
      Object.assign(S, {
        hls: null, clock: null, loadStopped: false, edgeMs: Date.now(), pdtMs: null, windowS: 0,
        playlist: null, served: null, servedAt: 0, survey: null,
        watched: [], probes: [], programmes: [],
        probesIssued: 0, frags: 0, fragBytes: 0,
        mastersRead: 0, playlistsRead: 0, variantUrl: null, readAt: 0, readEdge: null, openedAt: 0,
        stalledFor: 0, lastSeenPos: null, lastSeenAt: 0,
        seekTarget: null, seekUntil: 0, caughtUpMs: null,
      });
    };
    S.reset();
    S.master = null; S.openGen = 0; S.seekSeq = 0; S.jumpEvents = [];
    S.reading = false; S.triedAt = 0;

    const laneBase = (id, label, height) => ({
      id, kind: 'part', label, height, barPad: 5, as: 'spans',
      stack: false, barGap: 1, terse: true, alpha: 0.9, spanLine: false,
    });
    // A LANE ANSWERS FOR ITS OWN NUMBER AND NO OTHER, and both belong to this
    // channel and no other.
    const lanes = [
      {
        // What you watched, with what ERR refused as a number in its gutter
        // rather than a second row of small marks.
        ...laneBase('seen', `${c.name} live`, 40),
        // GREEN = shown. SLATE = shown, and this row cannot say how well.
        colorOf: () => (video.getVideoPlaybackQuality ? '#3fb950' : '#6a7280'),
        labelOf: () => '',
        rows: () => S.watched.map((w, i) => ({ at: w.from, id: `w${i}`, kind: 'part',
          payload: { durMs: Math.max(1, w.to - w.from), title: 'watched' } })),
        describeRow: (r) => [`${((r.payload.durMs) / 1000).toFixed(1)} s`,
          'you watched this stretch', 'a gap is where a seek skipped'],
      },
      {
        // GREY, because it is not a measurement: ERR telling us what was on.
        ...laneBase('epg', `${c.name} schedule`, 28),
        colorOf: () => '#5a6474',
        labelOf: (sp, { bw }) => (bw > 90 ? sp.row?.payload?.title?.slice(0, 40) ?? '' : ''),
        rows: () => S.programmes.map((p, i) => ({ at: p.at, id: `e${i}`, kind: 'part',
          payload: { durMs: p.end - p.at, title: p.name, repeat: p.repeat } })),
        describeRow: (r) => [r.payload.title?.slice(0, 46) ?? '',
          new Date(r.at).toTimeString().slice(0, 5) + (r.payload.repeat ? ' (repeat)' : ''),
          "from ERR's schedule"],
      },
    ];
    // Built detached and glued under the panel, so picture, footer and line are
    // one object with one edge. THE PRESENT IS A DOTTED LINE WITH A LABELLED
    // GAP, not a second playhead.
    const view = createStripView(el('div'), deck, {
      size: 'auto', absolute: true, follow: true, lanes, wallDash: [1, 3], wallLabel: false,
    });
    S.view = view;
    panel.glue(view.surface);
    view.strip.armWall(Date.now());

    // PRESS THE LINE TO GO THERE, ON THIS CHANNEL ONLY. Read the POINTER, not
    // the deck: on a media-mastered deck the master puts the line straight back
    // within a tick.
    view.strip.canvas.addEventListener('pointerup', (e) => {
      if (!S.clock) return;
      const r = view.strip.canvas.getBoundingClientRect();
      const st = view.strip.state;
      const px = (e.clientX - r.left) * (st.width / r.width) - st.gutterPx;
      if (px < 0) return;                         // the gutter is not the line
      const want = Math.min(deck.range[1], Math.max(deck.range[0], view.strip.xToTime(px)));
      if (S.loadStopped && S.hls) {
        S.hls.startLoad(video.currentTime + (want - S.clock.now()) / 1000); S.loadStopped = false;
      }
      seekTo(S, want);
      d.log(`${c.name}: watching from ${hms(want)}`);
    });

    play.onclick = () => { pressPlay(S); };
    live.onclick = () => { liveButton(S); };
    loopBtn.onclick = () => { pressLoop(S); };
    mute.onclick = () => setMuted(S, !S.muted, true);
    paintMute(S);
    return S;
  }

  const chans = ON_PAGE.map(makeChannel);
  const wrap = el('div', 'fl-wrap');
  const grid = el('div', 'fl-grid');
  grid.append(...chans.map((S) => S.panel.surface));
  wrap.append(grid);
  d.el.append(wrap);
  window.__strips = chans.map((S) => S.view.strip);

  // ── state words, mute and the play glyph ─────────────────────────────────
  const behindMs = (S) => {
    const p = S.clock?.now();
    return p == null ? null : Date.now() - p;
  };
  const stateWord = (S) => {
    if (!S.clock || !S.clock.now()) return S.playing ? 'opening' : S.openedAt ? 'stopped' : 'not started';
    if (S.video.paused) return S.loadStopped ? 'blocked' : 'paused';
    const b = behindMs(S);
    if (S.stalledFor > 1500) return S.loadStopped ? 'blocked' : 'stalled';
    return b != null && b > BAND.amber ? 'behind live' : 'playing';
  };
  function paintMute(S) {
    setSymbol(S.mute, S.muted ? MUTE_OFF : MUTE_ON);
    S.mute.setAttribute('aria-pressed', String(!S.muted));
    S.mute.title = S.muted ? 'muted\npress for sound' : 'audible\npress to mute';
  }
  function setMuted(S, next, say = false) {
    S.muted = !!next;
    S.video.muted = S.muted;
    paintMute(S);
    if (say) d.log(S.muted ? `${S.c.name} is muted` : `${S.c.name} is audible`);
  }
  function paintPlay(S) {
    setSymbol(S.play, S.playing ? STOP : PLAY);
    S.play.setAttribute('aria-pressed', String(S.playing));
    S.play.setAttribute('aria-label', `${S.playing ? 'stop' : 'play'} ${S.c.name}`);
    S.play.title = S.playing ? `stop ${S.c.name}` : `play ${S.c.name}`;
  }

  function gutters(S) {
    const L = (id) => S.view.strip.lanes().find((l) => l.id === id);
    const seen = L('seen'), epg = L('epg');
    if (seen) {
      const total = S.watched.reduce((a, w) => a + (w.to - w.from), 0);
      const b = behindMs(S);
      const no = S.probes.filter((p) => p.state === 'refused').length;
      const walledMin = S.served?.position != null ? Math.round(S.served.blockedMin) : 0;
      seen.subLabel = [
        b == null ? 'not playing' : `${(b / 1000).toFixed(1)} s behind`,
        S.watched.length ? `${(total / 1000).toFixed(0)} s seen` : 'none seen yet',
        walledMin ? `${walledMin} min refused`
          : S.probes.length ? (no ? `${no} refused` : 'none refused') : '',
      ].filter(Boolean);
    }
    if (epg) {
      const now = S.deck.position();
      const next = S.programmes.find((p) => p.at > now) || null;
      epg.subLabel = S.programmes.length
        ? [`${S.programmes.length} over ${(S.windowS / 3600).toFixed(0)} h`,
           next ? `next ${new Date(next.at).toTimeString().slice(0, 5)}` : '']
          .filter(Boolean)
        : '';
    }
  }

  // ── the picture ───────────────────────────────────────────────────────────
  /** THE ONE WAY TO ASK FOR A POSITION. The line goes where you asked at once
   *  and the picture catches up; while the seek is in flight the master does
   *  not drive, and the catch-up is measured. */
  function seekTo(S, want) {
    if (!S.clock) return S.deck.seek(want);
    const v = S.video;
    S.seekTarget = want;
    S.seekUntil = performance.now() + 4000;
    S.caughtUpMs = null;
    const t0 = performance.now();
    const seq = ++S.seekSeq;
    S.deck.seek(want);
    S.clock.seek(want);
    if (v.requestVideoFrameCallback) {
      const wantMedia = v.currentTime;
      const onFrame = (_now, meta) => {
        if (seq !== S.seekSeq || S.caughtUpMs !== null) return;
        if (Math.abs((meta?.mediaTime ?? wantMedia) - wantMedia) > 1) {
          if (performance.now() - t0 < 4000) v.requestVideoFrameCallback(onFrame);
          return;
        }
        S.caughtUpMs = Math.round(performance.now() - t0);
        if (S === focus) d.set('first frame', S.caughtUpMs, S.caughtUpMs < 500 ? 'ok' : '');
      };
      v.requestVideoFrameCallback(onFrame);
    } else {
      v.addEventListener('seeked', () => {
        if (seq === S.seekSeq && S.caughtUpMs === null) S.caughtUpMs = Math.round(performance.now() - t0);
      }, { once: true });
    }
    return { ok: true };
  }

  /** Play with sound when sound is wanted, and fall back to a muted picture
   *  rather than a black one if the browser refuses. */
  async function playPicture(S) {
    S.video.muted = S.muted;
    try { await S.video.play(); } catch (e) {
      if (e?.name === 'NotAllowedError' && !S.video.muted) {
        setMuted(S, true);
        d.log(`the browser refused sound without a press here, so ${S.c.name} plays muted`, 'bad');
        await S.video.play().catch(() => {});
      }
    }
  }

  /** Close this channel's engine and picture, and nothing else. */
  function closeChannel(S) {
    if (S.hls) { try { S.hls.destroy(); } catch { /* already gone */ } hlsAlive--; }
    S.hls = null; S.clock = null;
    const v = S.video;
    if (v.hasAttribute('src') || v.src) { v.muted = true; v.pause(); v.removeAttribute('src'); v.load(); }
  }

  /** Open one channel: one master read, one probe at the edge, one engine.
   *  Everything about this channel starts again from nothing. */
  async function openChannel(S) {
    const c = S.c, gen = ++S.openGen, v = S.video;
    closeChannel(S);
    S.reset();
    clearLoop(S);
    S.openedAt = Date.now();
    let pl;
    try { pl = await readPlaylist(c.url); } catch (e) {
      d.log(`${c.name}: the playlist did not come (${e.message})`, 'bad');
      return false;
    }
    if (gen !== S.openGen) return false;
    S.playlist = onRead(S, pl);
    S.pdtMs = pl.pdt; S.windowS = pl.windowS; S.edgeMs = pl.edge ?? Date.now();
    setRange(S);
    S.scheduleDone = loadSchedule(S);

    // 🔴 ASK WHERE THE LIVE EDGE IS BEFORE PLAYING IT. ERR blocks live segments
    // by PROGRAMME and was MEASURED refusing ETV's newest forty-five minutes.
    // One request on a channel that serves its edge, which is the common case.
    await askWhatIsServed(S, true);
    if (gen !== S.openGen) return false;

    if (NATIVE_HLS) {
      v.src = c.url;
    } else if (window.Hls?.isSupported()) {
      // START BEHIND THE BOUNDARY WHEN THERE IS ONE. NO CATCH-UP AND NO LATENCY
      // TARGET: being behind is the medium here, and a back-seek must stick.
      const hls = S.hls = new window.Hls({ enableWorker: true,
        ...(S.served?.position != null ? { startPosition: S.served.position } : {}) });
      window.__hls = hls;
      hlsAlive++;
      hls.loadSource(c.url);
      hls.attachMedia(v);
      // BYTES THAT ARRIVED, counted on the far side of the wire. An object
      // existing says nothing about whether a broadcaster answered.
      hls.on(window.Hls.Events.FRAG_LOADED, (_e, data) => {
        S.frags++;
        S.fragBytes += data?.frag?.stats?.total || data?.stats?.total || 0;
      });
      wallHandler(hls, window.Hls, () => {
        S.loadStopped = true;
        d.log(`${c.name}: ERR refused three fragments in a row. Stopped loading rather than hammering it`, 'bad');
      });
    } else { d.log('this browser cannot play HLS', 'bad'); return false; }

    S.clock = clockOf(v, S.hls);
    if (!S.master) {
      S.master = mediaMaster(S.deck, () => {
        const p = S.clock?.now();
        return p == null ? null : { el: v, pos: p, key: c.id };
      }, { stallPolicy: 'hold', autoPlayPause: true,
           onEvent: (e) => { if (e.reason === 'jump') S.jumpEvents.push(e); } });
    }
    await playPicture(S);
    return gen === S.openGen;
  }

  // Sessions opened at ERR (master reads) and playlist reads, counted per open
  // of a channel, so the page can assert it is not minting one a second.
  function onRead(S, pl) {
    S.playlistsRead++;
    if (pl.masterRead) S.mastersRead++;
    S.variantUrl = pl.variant;
    S.readAt = Date.now(); S.readEdge = pl.edge;
    return pl;
  }

  // ── a press on a panel's play, the only thing that opens anything ─────────
  function pressPlay(S) {
    if (S.playing) { stopChannel(S); return S.opening; }
    if (askedBeforePlay === null) askedBeforePlay = broadcasterAsks();
    // INSIDE THE PRESS: the activation is spent on this element now, so the
    // picture may start with sound once its first fragment arrives.
    armVideo(S.video);
    S.playing = true;
    focus = S;
    paintPlay(S);
    setMuted(S, false);
    d.set('channel', S.c.name);
    tickLoop();
    d.log(`opening ${S.c.name}`);
    S.opening = playChannel(S);
    return S.opening;
  }

  async function playChannel(S) {
    if (!await openChannel(S)) return false;
    S.audibleAtPlay = !S.video.muted;
    d.log(`playing ${S.c.name}`);
    await settle(S);
    if (!S.playing) return false;
    await toLive(S);
    return true;
  }

  function stopChannel(S) {
    S.openGen++;
    closeChannel(S);
    S.playing = false; S.playlist = null;
    clearLoop(S);
    S.deck.pause();
    paintPlay(S);
    if (S === focus) d.set('state', stateWord(S));
    d.log(`${S.c.name} stopped`);
  }

  // BOTH ENDS MOVE, once a second, and the playlist is re-read every ten on
  // the variant the master already handed over. Per open channel.
  function setRange(S) {
    const reach = S.windowS ? S.windowS * 1000 : REACH_MS;
    S.deck.setRange([S.edgeMs - reach, S.edgeMs]);
  }
  async function refresh(S) {
    if (!S.playlist) return;
    const gen = S.openGen;
    try {
      if (!S.reading && Date.now() - Math.max(S.readAt, S.triedAt) >= PLAYLIST_EVERY_MS) {
        S.reading = true; S.triedAt = Date.now();
        try {
          const pl = await readPlaylist(S.c.url, { variant: S.variantUrl });
          if (gen === S.openGen && S.playlist) { onRead(S, pl); S.playlist = pl; S.windowS = pl.windowS || S.windowS; }
        } finally { S.reading = false; }
      }
      if (S.readEdge != null) S.edgeMs = S.readEdge + (Date.now() - S.readAt);
      const reach = S.windowS ? S.windowS * 1000 : REACH_MS;
      const pos = S.deck.position();
      const outside = pos < S.edgeMs - reach || pos > S.edgeMs;
      setRange(S);
      if (outside && S.clock)
        d.log(`${S.c.name}: the window ate your position. Moved to ${hms(S.deck.position())}`, 'bad');
    } catch { /* one missed refresh is not an event */ }
  }
  setInterval(() => { for (const S of chans) refresh(S); }, 1000 / RANGE_HZ);

  // The page's own frame loop: each master's tick, each watched lane growing
  // at frame rate, and each present line moving while its deck is paused.
  let ticking = false;
  function tickLoop() {
    if (ticking) return;
    ticking = true;
    const step = () => {
      for (const S of chans) {
        if (S.seekTarget != null && (S.caughtUpMs !== null || performance.now() > S.seekUntil)) S.seekTarget = null;
        if (S.seekTarget == null) S.master?.tick();
        const p = S.clock?.now();
        if (p != null) {
          if (S.lastSeenPos != null && !S.video.paused) {
            const dt = p - S.lastSeenPos;
            if (dt > 0 && dt < 2000) {
              const last = S.watched[S.watched.length - 1];
              if (last && Math.abs(p - last.to) < 2000) last.to = Math.max(last.to, p);
              else S.watched.push({ from: S.lastSeenPos, to: p });
              S.stalledFor = 0;
            } else if (dt === 0) S.stalledFor = performance.now() - S.lastSeenAt;
          }
          if (p !== S.lastSeenPos) { S.lastSeenPos = p; S.lastSeenAt = performance.now(); }
        }
        loopTick(S);
        gutters(S);
        S.view.strip.invalidate();
      }
      if (focus) {
        const b = behindMs(focus);
        if (b != null) d.set('behind', (b / 1000).toFixed(1),
          b >= BAND.green[0] && b <= BAND.green[1] ? 'ok' : b <= BAND.amber ? '' : 'bad');
        d.set('state', stateWord(focus));
      }
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  const resume = async (S) => {
    if (S.video.paused) await S.video.play().catch(() => {});
    await wait(200);
  };

  const settle = (S) => new Promise((r) => {
    const t0 = performance.now();
    const check = () => {
      if (S.clock?.now() != null || performance.now() - t0 > 12000) return r();
      setTimeout(check, 200);
    };
    check();
  });

  // ── what ERR will hand over ───────────────────────────────────────────────
  // MEMBERSHIP IS THE DISCRIMINATOR: only segments in the playlist just read
  // are ever asked about, because an expired one answers like a refused one.
  async function askWhatIsServed(S, force = false) {
    if (!S.playlist) return S.served;
    if (!force && S.served && performance.now() - S.servedAt < SERVED_FRESH_MS) return S.served;
    const found = await findServedEdge(S.playlist, { steps: PROBE_STEPS, backoffS: WALL_BACKOFF_S });
    if (!found) return S.served;
    const wasWall = S.served?.position != null;
    S.served = found; S.servedAt = performance.now();
    S.probesIssued += found.probes.length;
    if (found.none) {
      d.log(`${S.c.name}: ERR refuses every point asked across the whole window (rights)`, 'bad');
    } else if (found.position != null && !wasWall) {
      d.log(`${S.c.name}: ERR refuses the newest ${Math.round(found.blockedMin)} min (rights). `
        + `Starting ${WALL_BACKOFF_S} s behind that boundary`, 'bad');
    } else if (found.edgeServed && wasWall) {
      d.log(`${S.c.name}: ERR serves to the live edge again`);
    }
    return S.served;
  }

  async function servedLiveTarget(S) {
    if (S.served?.position == null) return null;
    await askWhatIsServed(S);
    return S.served?.position != null && Number.isFinite(S.served.startAt) ? S.served.startAt : null;
  }

  async function sweep(S) {
    const pl = S.playlist;
    if (!pl?.segs?.length) return;
    const n = Math.min(PROBE_POINTS, pl.segs.length);
    const picked = [];
    for (let k = 0; k < n; k++) picked.push(Math.round((k * (pl.segs.length - 1)) / (n - 1)));
    const asking = picked.filter(() => S.probesIssued++ < PROBE_CAP).map((i) => {
      const seg = pl.segs[i];
      return probeSegment(seg).then((state) => ({ at: seg.at ?? S.edgeMs, state, i,
        fromPlaylist: pl.segs.includes(seg), sn: seg.sn }));
    });
    S.probes = (await Promise.all(asking)).sort((a, b) => a.at - b.at);
    const refused = S.probes.filter((p) => p.state === 'refused');
    d.log(refused.length
      ? `${S.c.name}: ERR refused ${refused.length} of ${S.probes.length} points asked`
      : `${S.c.name}: ERR served every one of the ${S.probes.length} points asked`,
      refused.length ? 'bad' : 'ok');
    S.view.strip.invalidate();
  }

  // 🔴 THE OTHER CHANNEL, ASKED THE SAME QUESTION ONCE, DEEP TIER ONLY. Two
  // shapes in one run is what separates a boundary finder from one that
  // answers the same way whatever it is asked.
  async function takeSurvey(S) {
    const own = S.served ? { id: S.c.id, name: S.c.name, ...S.served } : null;
    const rows = await surveyChannels(ON_PAGE.filter((c) => c.id !== own?.id),
      { steps: PROBE_STEPS, backoffS: WALL_BACKOFF_S });
    S.probesIssued += rows.reduce((n, r) => n + (r.probes?.length || 0), 0);
    S.survey = ON_PAGE
      .map((c) => (own && c.id === own.id ? own : rows.find((r) => r.id === c.id)))
      .filter(Boolean);
    d.log(`what ERR will serve: ${describeSurvey(S.survey)}`);
  }

  // ── what was on ───────────────────────────────────────────────────────────
  async function loadSchedule(S) {
    const gen = S.openGen;
    // ERR's broadcast day starts at 05:45 local, so a two-hour window that
    // reaches back past midnight needs yesterday's schedule too.
    const days = [new Date(S.edgeMs - S.windowS * 1000), new Date(S.edgeMs)]
      .filter((day, i, all) => all.findIndex((x) => x.toDateString() === day.toDateString()) === i);
    const out = (await Promise.all(days.map((day) => scheduleDay(S.c, day)))).flat()
      .map((p) => ({ ...p })).sort((a, b) => a.at - b.at);
    if (gen !== S.openGen) return;
    // CONTIGUOUS BY CONSTRUCTION: a programme runs until the next one starts.
    for (let i = 0; i < out.length; i++) out[i].end = out[i + 1] ? out[i + 1].at : out[i].at + 3600e3;
    const from = S.edgeMs - S.windowS * 1000;
    S.programmes = out.filter((p) => p.end > from && p.at < S.edgeMs);
    S.view.strip.invalidate();
  }

  // ── the two position controls ─────────────────────────────────────────────
  function stepBack(S, ms) {
    const asked = Math.max(S.deck.range[0] + 5000, (S.clock?.now() ?? Date.now()) - ms);
    // LAND WHERE ERR SAID IT WOULD SERVE: seeking into a refused stretch does
    // not move the picture at all.
    const ok = S.probes.filter((p) => p.state === 'served' && p.at <= asked);
    const want = ok.length ? ok[ok.length - 1].at : asked;
    if (S.probes.length && !ok.length) {
      d.log(`${S.c.name}: ERR served nothing older than the live edge`, 'bad');
    } else if (Math.abs(want - asked) > 60000) {
      d.log(`asked for ${new Date(asked).toTimeString().slice(0, 5)}. The nearest instant ERR agreed to serve is `
        + `${new Date(want).toTimeString().slice(0, 5)}`);
    }
    if (S.loadStopped && S.clock) {
      S.hls?.startLoad(S.video.currentTime + (want - S.clock.now()) / 1000);
      S.loadStopped = false;
    }
    const sought = seekTo(S, want);
    d.log(`${S.c.name}: walking back to ${hms(want)}${sought == null ? ' with no clock yet' : ''}`);
    return want;
  }

  // THE PAST FILLS THE VIEW: 70% of the opening span behind the present.
  const openView = (S, at = Date.now()) =>
    S.view.strip.fit(at - OPEN_SPAN_MS * 0.70, at + OPEN_SPAN_MS * 0.30);

  async function toLive(S) {
    if (S.loadStopped) { S.hls?.startLoad(); S.loadStopped = false; }
    if (S.video.paused) await S.video.play().catch(() => {});
    // 🔴 LIVE MEANS THE NEWEST FRAME ERR WILL SERVE, NOT THE NEWEST ONE IT LISTS.
    const wall = await servedLiveTarget(S);
    for (let i = 0; i < 20; i++) {
      const l = wall ?? S.clock?.live();
      if (l != null) {
        seekTo(S, l);
        openView(S, l);
        S.view.strip.setFollow(true);
        return l;
      }
      await wait(100);
    }
    d.log(`${S.c.name}: the engine offered no live position within two seconds`, 'bad');
    return null;
  }

  // LIVE waits for whatever this channel's play press is still doing, so a
  // press in the middle of the opening cannot pull the picture out from under it.
  // ►► is the way out of a loop as well: the live edge is not inside one.
  async function liveButton(S) {
    if (!S.playing) { d.log(`${S.c.name} is not playing. Press its play first`); return; }
    await S.opening;
    if (!S.playing) return;
    clearLoop(S);
    await toLive(S);
  }

  // ── the loop, one per channel ─────────────────────────────────────────────
  function drawLoop(S) {
    const L = S.loop, name = S.c.name;
    const on = L.a != null && L.b != null;
    // THE WORD NEVER CHANGES, as on the bar: state is `data-loop` and the label.
    S.loopBtn.dataset.loop = on ? 'on' : L.a != null ? 'armed' : 'off';
    // The line draws the loop from `deck.loopView`, the one object the button
    // and the strip share.
    S.deck.setLoopView(L.a == null ? null
      : { a: L.a, b: L.b, state: on ? 'on' : 'armed', filling: L.filling });
    S.loopBtn.setAttribute('aria-label',
      on ? `${name} looping. press to take the loop off`
        : L.filling ? `${name} holding the live picture. press to end the loop here` : `${name} loop`);
    S.view.strip.invalidate();
  }

  // The bar's warning: opacity only, so nothing beside the button moves, and
  // a steady dim for somebody who asked for less motion.
  const lessMotion = typeof matchMedia === 'function' ? matchMedia('(prefers-reduced-motion: reduce)') : null;
  function setLoopBlink(S, on) {
    const L = S.loop;
    if (on === L.blinking) return;
    L.blinking = on;
    L.blinkAnim?.cancel();
    L.blinkAnim = null;
    S.loopBtn.style.opacity = '';
    if (!on) return;
    if (!lessMotion?.matches) {
      L.blinkAnim = S.loopBtn.animate?.([
        { opacity: 1, offset: 0 }, { opacity: 1, offset: 0.49 },
        { opacity: 0.24, offset: 0.5 }, { opacity: 0.24, offset: 1 },
      ], { duration: LOOP_BLINK_MS, iterations: Infinity }) ?? null;
    }
    if (!L.blinkAnim) S.loopBtn.style.opacity = '0.62';
  }

  /** Both marks are known: arm the loop and play it from its start. */
  function startLoop(S, a, b) {
    const L = S.loop;
    Object.assign(L, { a, b, filling: false, ends: null });
    setLoopBlink(S, false);
    drawLoop(S);
    seekTo(S, a);
    if (S.video.paused) S.video.play().catch(() => {});
    d.log(`${S.c.name}: looping ${((b - a) / 1000).toFixed(1)} s from ${hms(a)}`);
  }

  /** Take the loop off. Only the button's third press goes back to live; a stop
   *  or a reopen just forgets it. */
  function clearLoop(S) {
    const L = S.loop;
    if (!L) return false;
    const had = L.a != null;
    Object.assign(L, { a: null, b: null, filling: false, ends: null });
    setLoopBlink(S, false);
    if (S.view) drawLoop(S);
    return had;
  }

  async function pressLoop(S) {
    if (!S.playing) { d.log(`${S.c.name} is not playing. Press its play first`); return; }
    await S.opening;
    const L = S.loop;
    const pos = S.clock?.now();
    if (!S.playing || pos == null) return;
    if (L.a == null) {
      // A LIVE CHANNEL HAS NOTHING BEHIND THIS PRESS, SO THE WINDOW IS AHEAD
      // OF IT, and the picture arriving fills it.
      Object.assign(L, { a: pos, b: null, filling: true, ends: pos + LOOP_WINDOW_MS });
      drawLoop(S);
      d.log(`${S.c.name}: holding up to ${LOOP_WINDOW_MS / 1000} s from ${hms(pos)}`);
      return;
    }
    if (L.b == null) {
      // A backwards mark is still a loop somebody meant; a zero length one is
      // a double press and is ignored, as on the bar.
      const a = Math.min(L.a, pos), b = Math.max(L.a, pos);
      if (b - a < 1) return;
      startLoop(S, a, b);
      return;
    }
    clearLoop(S);
    d.log(`${S.c.name}: loop off, back to the live edge`);
    await toLive(S);
  }

  /** On the page's frame loop: the window closing itself, the wrap, and the
   *  loop being outrun by the back of the window. */
  function loopTick(S) {
    const L = S.loop;
    if (L.a == null) return;
    const p = S.clock?.now();
    if (L.filling && p != null && p >= L.ends) { startLoop(S, L.a, L.ends); return; }
    // THE WRAP MOVES THE PICTURE, and the line follows it through the master.
    // Rate-limited like the bar's, because a seek is not instant everywhere and
    // a frame after one can still read past the end.
    if (L.b != null && p != null && !S.video.paused && p >= L.b) {
      const t = performance.now();
      if (t - L.lastWrap > 150) {
        L.lastWrap = t;
        const ct0 = S.video.currentTime;
        seekTo(S, L.a);
        L.wraps++;
        L.wrapEvid = { from: p, ct0, ct1: S.video.currentTime, a: L.a, b: L.b };
      }
    }
    if (L.a < S.deck.range[0]) { clearLoop(S); d.log(`${S.c.name}: the loop ran off the back of the window`, 'bad'); return; }
    setLoopBlink(S, L.filling && p != null && p >= L.ends - LOOP_WINDOW_MS * LOOP_WARN_FRAC);
  }

  // ── the three things a live line has to prove ────────────────────────────
  const evid = { paused: null, wallKeptGoing: null, asked: null, landed: null,
                 jumpsBefore: 0, behindAfterLive: null };

  async function pauseTest(S) {
    if (!S.clock) return;
    const w0 = S.view.strip.wallPos();
    S.video.pause();
    await wait(400);
    evid.paused = S.deck.playing() === false;
    evid.wallKeptGoing = S.view.strip.wallPos() > w0;
    S.video.play().catch(() => {});
    await wait(300);
  }

  function backTest(S, ms) {
    evid.jumpsBefore = S.jumpEvents.length;
    const want = stepBack(S, ms);
    evid.asked = want;
    evid.landed = S.clock?.now();        // synchronous: the REQUEST, not the effect
    evid.lineAt = S.deck.position();
  }

  async function waitForCatchUp(S) {
    const t0 = performance.now();
    while (S.caughtUpMs === null && performance.now() - t0 < 4500) await wait(50);
    evid.caughtUp = S.caughtUpMs;
  }

  async function liveTest(S) {
    const t0 = performance.now();
    while (S.jumpEvents.length <= evid.jumpsBefore && performance.now() - t0 < 3000) await wait(100);
    await wait(1200);
    evid.behindAfterLive = behindMs(S);
  }

  const rangeIdentity = { same: false, movedLeft: false, movedRight: false, dLeft: 0, dRight: 0 };
  const advance = { moved: 0, wall: 0 };
  async function sampleMovement(S) {
    await resume(S);
    const waitFrom = performance.now();
    while (S.seekTarget != null && performance.now() - waitFrom < 4500) await wait(100);
    const ref = S.deck.range, l0 = ref[0], r0 = ref[1];
    await wait(5000);
    rangeIdentity.same = S.deck.range === ref;
    rangeIdentity.dLeft = Math.round(S.deck.range[0] - l0);
    rangeIdentity.dRight = Math.round(S.deck.range[1] - r0);
    rangeIdentity.movedLeft = rangeIdentity.dLeft > 0;
    rangeIdentity.movedRight = rangeIdentity.dRight > 0;
    const p0 = S.clock?.now();
    const t0 = performance.now();
    await wait(1500);
    const p1 = S.clock?.now();
    advance.wall = Math.round(performance.now() - t0);
    advance.moved = p0 != null && p1 != null ? Math.round(p1 - p0) : 0;
  }

  /** Frames this picture has EVER decoded. Cumulative, so a seek cannot reset
   *  it the way it empties `readyState`. */
  const framesOf = (S) => S.video.getVideoPlaybackQuality?.()?.totalVideoFrames
    ?? S.video.webkitDecodedFrameCount ?? 0;
  const sourced = (S) => S.video.hasAttribute('src') || !!S.video.src;

  // ── the self-check, the harness's and never a visitor's ──────────────────
  // It presses ETV's play the way a person would and runs the line's checks on
  // that channel, then presses ETV2 and grades the two running together.
  async function selfcheck() {
    const A = chans[0];
    A.play.click();
    if (!await A.opening) { d.log(`${A.c.name} did not open`, 'bad'); }
    await resume(A);
    await toLive(A);
    await waitForCatchUp(A);
    await sampleMovement(A);    // both ends move, and the playhead tracks the picture
    // THE WALK, DEEP TIER ONLY: it pauses the picture, asks ERR for thirteen
    // instants, surveys the other channel and yanks the view ten minutes back
    // and forward again. It leaves the live row with a GAP, which is that
    // row's whole subject.
    const walk = async () => {
      await pauseTest(A);
      await sweep(A);
      await takeSurvey(A);
      backTest(A, 10 * 60 * 1000);
      await waitForCatchUp(A);
      await toLive(A);
      await liveTest(A);
      d.log('walked back into the window and returned. The break in the top row is where that seek skipped');
      openView(A, A.deck.position());
    };
    await ifDeep(walk, { log: d.log,
      say: 'the pause, the refusal sweep, the channel survey and the walk back into the window (DEMO_DEEP=1)' });
    // The session assert is about the REFRESH, so wait for one.
    const r0 = performance.now();
    while (A.playlistsRead < 2 && performance.now() - r0 < PLAYLIST_EVERY_MS + 2000) await wait(250);
    await A.scheduleDone;
    await checks();
  }

  // ── checks ────────────────────────────────────────────────────────────────
  const glyphOf = (b) => b.querySelector('.pos-sym')?.textContent ?? b.textContent;
  async function checks() {
    const [A, B] = chans;
    // ── the picture at the foot of the page ─────────────────────────────────
    const groups = dg.svg.querySelectorAll('.pos-dg-n').length;
    const log = document.querySelector('.pos-log');
    d.assert('the how it works diagram is built, after the log, one group per box',
      dg.svg.isConnected && groups === dgBoxes.length
        && (!log || !!(log.compareDocumentPosition(dg.el) & Node.DOCUMENT_POSITION_FOLLOWING)),
      `${groups} of ${dgBoxes.length} boxes drawn, ${log ? 'log above it' : 'no log'}`);
    for (let i = 0; i < 40 && !dg.measured; i++) await new Promise((r) => requestAnimationFrame(r));
    const svgW = dg.svg.getBoundingClientRect().width, hostW = dg.el.clientWidth;
    d.assert('the diagram is laid out at its real width, from measured type',
      dg.measured && hostW > 200 && Math.abs(svgW - hostW) <= 2,
      `${dg.mode}, svg ${svgW.toFixed(0)} px in a ${hostW} px host, measured ${dg.measured}`);
    d.assert('nothing in the diagram was cut or refused', dg.cuts.length === 0,
      dg.cuts.map((c) => `${c.id}: its ${c.where} was cut to "${c.shown}"`).join(', ') || 'none');
    // 🔴 THE BOXES AGAINST THE REQUESTS. Every kind of ask the page made has a
    // box, every ERR box was asked, nothing went to an ERR path the picture
    // does not show, and the live boxes and the schedule box went to the
    // origins the page holds for them. Under a harness both are the stand-in.
    const ids = new Set(dgBoxes.map((n) => n.id));
    const seen = Object.keys(asks.byBox);
    const liveOrigin = new URL(A.c.url).origin, schedOrigin = new URL(errUrl(SCHEDULE_API)).origin;
    const originsOk = seen.every((k) => [...asks.origins[k]].every((o) =>
      o === (k === 'schedule' ? schedOrigin : liveOrigin)));
    const hostsOk = location.search.includes('base=')
      || chans.every((S) => new URL(S.c.url).host === LIVE_HOST);
    d.assert('the diagram\'s boxes are the hosts and the asks this page makes',
      ASK_BOX.every(([k]) => ids.has(k) && asks.byBox[k] > 0) && asks.unplaced.length === 0
        && originsOk && hostsOk,
      `${ASK_BOX.map(([k]) => `${k} ${asks.byBox[k] || 0}`).join(', ')}, `
      + `${asks.unplaced.length} unplaced, live at ${liveOrigin}, schedule at ${schedOrigin}`);

    // the page, before anything was opened
    d.assert('nothing was asked of the broadcaster before a play press',
      askedBeforePlay === 0, `${askedBeforePlay} requests before the press`);
    const names = chans.map((S) => S.panel.el.querySelector('.fl-name')?.textContent ?? '');
    d.assert('two video panels, ETV and ETV2 and no other, each with its own play',
      chans.length === 2 && document.querySelectorAll('.pos-vp').length === 2
        && names.join(' ') === 'ETV ETV2'
        && chans.every((S) => S.panel.slots.right.contains(S.play)),
      `${document.querySelectorAll('.pos-vp').length} panels: ${names.join(', ')}`);
    // 🔴 NO COMMON TRANSPORT LANE. Each footer reads play, back to live, loop,
    // mute, full screen, and each panel has its own line glued under it.
    const order = chans.map((S) => [...S.panel.slots.right.children]);
    d.assert('each footer carries its own play, back to live, loop, mute and full screen, in that order',
      order.every((kids, i) => kids.length === 5 && kids[0] === chans[i].play && kids[1] === chans[i].live
        && kids[2] === chans[i].loopBtn && kids[3] === chans[i].mute && kids[4].classList.contains('pos-vp-full')),
      order.map((kids, i) => `${chans[i].c.name}: ${kids.map((k) => k.textContent.trim() || '?').join(' ')}`).join(', '));
    const strips = document.querySelectorAll('canvas.pos-strip');
    d.assert('no shared transport bar and no shared line, one line under each picture',
      !document.querySelector('.tbar') && !window.__demo?.transport && strips.length === 2
        && chans.every((S) => S.panel.surface.contains(S.view.strip.canvas) && S.panel.footers() === 2)
        && A.deck !== B.deck,
      `${document.querySelectorAll('.tbar').length} bars, ${strips.length} lines, `
      + chans.map((S) => `${S.c.name} ${S.panel.footers()} rows`).join(', '));
    const [r0, r1] = chans.map((S) => S.panel.surface.getBoundingClientRect());
    const gw = grid.getBoundingClientRect().width;
    const side = Math.abs(r0.top - r1.top) < 1 && r1.left > r0.right;
    d.assert('the two pictures sit side by side when there is room and stack when there is not',
      gw > 560 ? side : (!side && r1.top >= r0.bottom),
      `${side ? 'side by side' : 'stacked'} in a ${gw.toFixed(0)} px grid`);
    d.assert('before the second press only the pressed channel\'s picture has a source',
      sourced(A) && !sourced(B), `${chans.filter(sourced).map((S) => S.c.name).join(', ') || 'none'} sourced`);
    d.assert('before the second press only the pressed channel is loaded',
      hlsAlive === (NATIVE_HLS ? 0 : 1), `${hlsAlive} engine${hlsAlive === 1 ? '' : 's'} alive`);
    // 🔴 EVIDENCE THAT A BROADCASTER ANSWERED, NOT THAT AN OBJECT EXISTS.
    d.assert('the pressed channel received picture, not just an object',
      (NATIVE_HLS || A.frags > 0) && framesOf(A) > 0,
      `${A.c.id} ${A.frags} fragments, ${Math.round(A.fragBytes / 1024)} KB, ${framesOf(A)} frames decoded`);
    d.assert('a play press makes that channel audible',
      A.audibleAtPlay === true, A.audibleAtPlay ? 'unmuted by the press' : 'still muted after the press');

    // M: mechanism, deterministic, no network
    d.assert('the line is positioned in the present, not at zero',
      A.deck.position() >= A.deck.range[0] && A.deck.position() <= A.deck.range[1],
      hms(A.deck.position()));
    d.assert('the position domain is absolute wall milliseconds',
      A.view.strip.state.absolute === true && A.deck.range[0] > 1.7e12, `${A.deck.range[0]}`);
    d.assert('the axis reads as a clock, not a duration',
      /^\d{2}:\d{2}$/.test(formatTime(A.deck.range[1], 60000, true)),
      formatTime(A.deck.range[1], 60000, true));
    d.assert('the window keeps its identity while both ends move',
      rangeIdentity.same && rangeIdentity.movedLeft && rangeIdentity.movedRight,
      `left +${rangeIdentity.dLeft} ms, right +${rangeIdentity.dRight} ms, same array ${rangeIdentity.same}`);
    d.assert('the present is not inside the seekable window',
      (A.view.strip.readout().wall ?? 0) > A.deck.range[1] - 1,
      `${(((A.view.strip.readout().wall ?? 0) - A.deck.range[1]) / 1000).toFixed(1)} s past the edge`);

    // E: needs the broadcaster (the stand-in, under a harness)
    d.assert('the playlist carries a start date',
      Number.isFinite(A.pdtMs) && Math.abs(Date.now() - A.pdtMs) < 3 * 3600e3,
      A.pdtMs ? hms(A.pdtMs) : 'none');
    d.assert('the window is about the advertised two hours',
      A.windowS > 3600 && A.windowS < 9000, `${(A.windowS / 60).toFixed(1)} min`);
    // TWO BANDS, BECAUSE THE PAGE HAS TWO HONEST ANSWERS: a live picture's
    // worth on a channel that serves its edge, and what ERR refuses on one
    // that does not.
    const bNow = behindMs(A);
    const wallNow = A.served?.position != null ? A.served : null;
    d.assert('the playhead is behind the present by what ERR leaves open',
      bNow != null && (wallNow
        ? Math.abs(bNow / 1000 - wallNow.blockedMin * 60) < 180
        : bNow > 1000 && bNow < 30000),
      wallNow
        ? `${(bNow / 60000).toFixed(1)} min behind, and ERR refuses the newest `
          + `${wallNow.blockedMin.toFixed(1)} min`
        : `${((bNow ?? 0) / 1000).toFixed(1)} s, live edge served`);
    // 🔴 ONE SESSION AT ERR PER CHANNEL OPEN, NOT ONE PER REFRESH.
    d.assert('the broadcaster is asked for one session, not one per refresh',
      A.mastersRead === 1 && A.playlistsRead >= 2,
      `${A.mastersRead} master read${A.mastersRead === 1 ? '' : 's'}, ${A.playlistsRead} playlist reads `
      + `in ${Math.round((Date.now() - A.openedAt) / 1000)} s`);
    d.assert('the playhead advances with the picture',
      advance.moved > 1000 && advance.moved < 2500 && (A.master?.stats().syncs ?? 0) > 0,
      `${advance.moved} ms over ${advance.wall} ms, ${A.master?.stats().syncs ?? 0} syncs`);
    d.assert('the programme spans are contiguous and named',
      A.programmes.length > 0 && A.programmes.every((p, i) =>
        p.name && (i === 0 || A.programmes[i - 1].end === p.at)),
      `${A.programmes.length} programmes`);

    // These go with the walk: their evidence comes from the pause, the sweep
    // and the back-seek, which only the deep tier runs.
    if (DEEP) {
      d.assert('every probed instant was inside the playlist just read',
        A.probes.length > 0 && A.probes.every((p) => p.fromPlaylist),
        `${A.probes.length} points, all from the playlist just read`);
      d.assert('the probe stayed under its own cap',
        A.probesIssued <= PROBE_CAP, `${A.probesIssued} of ${PROBE_CAP}`);
      d.assert('pausing the picture stops the line and not the present',
        evid.paused === true && evid.wallKeptGoing === true,
        `deck paused ${evid.paused}, present still moving ${evid.wallKeptGoing}`);
      d.assert('a back-seek is expressed as an instant inside the window',
        evid.asked != null && evid.asked >= A.deck.range[0] && evid.asked <= A.deck.range[1]
          && Math.abs((evid.landed ?? 0) - evid.asked) < 1500,
        evid.asked ? `asked ${hms(evid.asked)}, clock read ${hms(evid.landed)}` : 'not asked');
      d.assert('a back-seek moves the line at once, not by drifting',
        evid.lineAt != null && evid.asked != null && Math.abs(evid.lineAt - evid.asked) < 1500,
        evid.lineAt == null ? 'no line reading'
          : `${Math.round(evid.lineAt - evid.asked)} ms from what was asked, read synchronously`);
      d.assert('a frame from the asked-for instant was actually shown',
        evid.caughtUp != null && evid.caughtUp < 4000,
        evid.caughtUp == null ? 'no frame from there within 4.5 s'
          : `${evid.caughtUp} ms from the request to a frame carrying that timestamp`);
      d.assert('returning to live restores the gap ERR leaves open',
        evid.behindAfterLive != null && (wallNow
          ? Math.abs(evid.behindAfterLive / 1000 - wallNow.blockedMin * 60) < 180
          : evid.behindAfterLive < 30000),
        wallNow ? `${(evid.behindAfterLive / 60000).toFixed(1)} min behind, `
          + `${wallNow.blockedMin.toFixed(1)} min refused`
          : `${((evid.behindAfterLive ?? 0) / 1000).toFixed(1)} s behind`);

      // 🔴 THE REFUSAL BOUNDARY, ASSERTED. Sabotaging the stand-in to serve
      // every segment used to leave both old pages fully green. Points no
      // longer in the freshest playlist are dropped rather than counted.
      const live = new Set((A.playlist?.segs || []).map((s) => s.sn));
      const inWindow = A.probes.filter((p) => p.sn == null || live.has(p.sn));
      const seq = inWindow.map((p) => p.state);
      const flips = seq.filter((s, i) => i > 0 && s !== seq[i - 1]).length;
      d.assert('the refusals are one unbroken run at one end of the window',
        seq.includes('refused') && seq.includes('served') && flips === 1,
        `${seq.map((s) => (s === 'served' ? '.' : '#')).join('')}, oldest on the left`
        + `${inWindow.length < A.probes.length ? `, ${A.probes.length - inWindow.length} expired since` : ''}`);
      const reachable = (A.survey || []).filter((r) => r && !r.unreachable);
      const walled = reachable.filter((r) => r.position != null);
      const open = reachable.filter((r) => r.edgeServed);
      const asked = reachable.flatMap((r) => r.probes || []);
      const no = asked.filter((p) => p.state === 'refused').length;
      const yes = asked.filter((p) => p.state === 'served').length;
      d.assert('the broadcaster refused some of what it listed and served the rest',
        no > 0 && yes > 0, `${no} refused and ${yes} served of ${asked.length} points asked`);
      d.assert('a channel that refuses its newest minutes gets a start behind the boundary',
        walled.length > 0 && walled.every((r) => r.blockedMin > 0
          && r.probes.some((p) => p.state === 'refused')
          && r.probes.some((p) => p.state === 'served')),
        walled.length ? describeSurvey(walled) : 'no channel refused its live edge');
      d.assert('a channel that refuses nothing is reported as refusing nothing',
        open.length > 0 && open.every((r) => r.blockedMin === 0),
        open.length ? `${open.map((r) => r.id).join(', ')} served the newest segment`
          : 'no channel served its live edge');
    }

    // ── mute, pressed for real: twice, so it ends where it started ──────────
    const glyph = (S) => glyphOf(S.mute);
    const m0 = A.video.muted, w0 = glyph(A);
    A.mute.click();
    const m1 = A.video.muted, w1 = glyph(A);
    A.mute.click();
    const m2 = A.video.muted;
    const shows = (m) => (m ? MUTE_OFF : MUTE_ON);
    d.assert('a press of a panel\'s mute toggles that channel\'s sound',
      m1 === !m0 && m2 === m0, `muted ${m0} then ${m1} then ${m2}`);
    d.assert('the mute button shows the state of the sound',
      w0 === shows(m0) && w1 === shows(m1) && w0 !== w1, `${w0} then ${w1}`);

    // ── the second channel, playing beside the first ─────────────────────────
    // Through the real play buttons, so this is the path a person takes. It
    // opens the second channel at the stand-in, which is why it is harness only.
    const f0 = scheduleFetches;
    const framesA0 = framesOf(A);
    B.play.click();
    await B.opening; await B.scheduleDone;
    await resume(B);
    const t0 = performance.now();
    while (framesOf(B) === 0 && performance.now() - t0 < 4000) await wait(100);
    const fa = framesOf(A), fb = framesOf(B);
    await wait(1000);
    const fa1 = framesOf(A), fb1 = framesOf(B);
    const f1 = scheduleFetches;
    d.assert('both channels play at once, two engines alive and both pictures decoding',
      A.playing && B.playing && sourced(A) && sourced(B)
        && hlsAlive === (NATIVE_HLS ? 0 : 2) && (NATIVE_HLS || B.frags > 0)
        && fa1 > fa && fb1 > fb && fa > framesA0,
      `${hlsAlive} engines, ${A.c.name} ${fa} then ${fa1} frames, ${B.c.name} ${fb} then ${fb1} frames`);
    d.assert('pressing the second leaves the first audible and playing',
      !A.muted && !A.video.muted && !A.video.paused && B.audibleAtPlay === true && !B.video.muted
        && glyph(A) === MUTE_ON && glyph(B) === MUTE_ON,
      `${A.c.name} muted ${A.video.muted} paused ${A.video.paused}, ${B.c.name} muted ${B.video.muted}`);
    // Each mute still answers alone: B's mute leaves A alone, and back.
    const aBefore = A.video.muted;
    B.mute.click();
    const bMuted = B.video.muted, aAfter = A.video.muted;
    B.mute.click();
    d.assert('each mute works on its own channel only',
      bMuted === true && !B.video.muted && aAfter === aBefore,
      `${B.c.name} muted ${bMuted} then ${B.video.muted}, ${A.c.name} stayed ${aAfter}`);
    const label = (S, id) => S.view.strip.lanes().find((l) => l.id === id)?.label;
    d.assert('each line follows its own channel',
      A.programmes.length > 0 && B.programmes.length > 0 && A.programmes !== B.programmes
        && label(A, 'epg') === `${A.c.name} schedule` && label(B, 'epg') === `${B.c.name} schedule`
        && A.watched.length > 0 && B.watched.length > 0 && f1 > f0,
      `${A.c.name} ${A.programmes.length} programmes ${A.watched.length} watched, `
      + `${B.c.name} ${B.programmes.length} programmes ${B.watched.length} watched, ${f1 - f0} schedule fetches for ${B.c.name}`);

    // ── ►► on one channel, pressed for real ──────────────────────────────────
    // Walk A a minute back, then press its ►►. A channel ERR walls is "live" at
    // its boundary, so the measure is the gap it had at live before the walk.
    const behindLive = behindMs(A);
    A.caughtUpMs = null;
    seekTo(A, A.clock.now() - 60000);
    await waitForCatchUp(A);
    await wait(300);
    const behindBack = behindMs(A);
    const liveSeq = A.seekSeq;
    A.live.click();
    const tl = performance.now();
    while (A.seekSeq === liveSeq && performance.now() - tl < 4000) await wait(50);
    await wait(800);
    const behindAgain = behindMs(A);
    // The edge `toLive` aims at: the served start on a walled channel (an
    // instant that ages until it is asked again), the engine's live otherwise.
    const edgeAt = () => (A.served?.position != null ? A.served.startAt : A.clock?.live());
    const offEdge = (A.clock?.now() ?? 0) - (edgeAt() ?? 0);
    d.assert('a press of ►► returns that channel to its live edge',
      behindBack - behindLive > 40000 && behindBack - behindAgain > 30000 && Math.abs(offEdge) < 3000
        && A.seekSeq > liveSeq && glyphOf(A.live) === TO_LIVE,
      `${(behindLive / 1000).toFixed(1)} s behind at live, ${(behindBack / 1000).toFixed(1)} s after the walk, `
      + `${(behindAgain / 1000).toFixed(1)} s after the press, ${(offEdge / 1000).toFixed(1)} s from the edge it aims at`);

    // ── Loop on one channel, three presses, with the other one playing ──────
    // It reads the bar's three states off the button and the line's loop off
    // `deck.loopView`, and the wrap off the picture's own currentTime.
    const L = A.loop;
    const bSeq0 = B.seekSeq, bFrames0 = framesOf(B);
    const pressed = async (fn, until) => {
      A.loopBtn.click();
      const t = performance.now();
      while (!until() && performance.now() - t < 4000) await wait(30);
      fn?.();
    };
    let s1 = null, s2 = null;
    await pressed(() => { s1 = { btn: A.loopBtn.dataset.loop, view: A.deck.loopView?.state,
      filling: L.filling, a: L.a, ends: L.ends }; }, () => L.a != null);
    d.assert('a first press of Loop on a playing channel opens a window the live edge fills',
      s1.btn === 'armed' && s1.view === 'armed' && s1.filling === true && s1.ends - s1.a === LOOP_WINDOW_MS,
      `button ${s1.btn}, line ${s1.view}, filling ${s1.filling}, ceiling ${((s1.ends - s1.a) / 1000).toFixed(0)} s`);
    await wait(1500);
    await pressed(() => { s2 = { btn: A.loopBtn.dataset.loop, view: A.deck.loopView, a: L.a, b: L.b }; },
      () => L.b != null);
    const len = s2.b != null ? s2.b - s2.a : null;
    d.assert('a second press closes the loop at the length that was measured',
      s2.btn === 'on' && s2.view?.state === 'on' && s2.view.a === s2.a && s2.view.b === s2.b
        && len > 900 && len < 2600,
      `button ${s2.btn}, line ${s2.view?.state}, ${len == null ? 'no' : (len / 1000).toFixed(2) + ' s'} loop`);
    const tw = performance.now();
    while (L.wraps < 1 && performance.now() - tw < 5000) await wait(50);
    await wait(400);
    const w = L.wrapEvid, pAfter = A.clock?.now();
    const jumpedS = w ? w.ct0 - w.ct1 : null, wantS = w ? (w.from - w.a) / 1000 : null;
    d.assert('the picture wraps back to the loop start',
      L.wraps >= 1 && w && Math.abs(jumpedS - wantS) < 0.25 && pAfter >= w.a - 500 && pAfter <= w.b + 500,
      w ? `${L.wraps} wrap${L.wraps === 1 ? '' : 's'}, currentTime ${w.ct0.toFixed(2)} to ${w.ct1.toFixed(2)} s `
        + `(${jumpedS.toFixed(2)} s back for ${wantS.toFixed(2)} s past the start), `
        + `${((pAfter - w.a) / 1000).toFixed(2)} s into the loop 0.4 s later` : 'no wrap within 5 s');
    d.assert('a loop on one channel leaves the other alone',
      B.loop.a == null && B.deck.loopView == null && B.loopBtn.dataset.loop === 'off'
        && B.seekSeq === bSeq0 && framesOf(B) > bFrames0 && !B.video.paused,
      `${B.c.name} loop ${B.loopBtn.dataset.loop}, ${B.seekSeq - bSeq0} seeks, `
      + `${bFrames0} then ${framesOf(B)} frames`);
    const offSeq = A.seekSeq;
    await pressed(null, () => L.a == null && A.seekSeq > offSeq);
    await wait(800);
    const wraps0 = L.wraps;
    await wait(1200);
    const behindOff = behindMs(A);
    const offEdge2 = (A.clock?.now() ?? 0) - (edgeAt() ?? 0);
    d.assert('a third press leaves the loop and goes back to the live edge',
      L.a == null && A.loopBtn.dataset.loop === 'off' && A.deck.loopView == null && L.wraps === wraps0
        && Math.abs(offEdge2) < 3500,
      `button ${A.loopBtn.dataset.loop}, line ${A.deck.loopView ? 'still looped' : 'clear'}, `
      + `${L.wraps - wraps0} wraps since, ${(behindOff / 1000).toFixed(1)} s behind, `
      + `${(offEdge2 / 1000).toFixed(1)} s from the edge it aims at`);

    // ── each ■ stops only its own ───────────────────────────────────────────
    A.play.click();
    await wait(300);
    const bFrames = framesOf(B);
    await wait(700);
    d.assert('each stop press stops only its own channel',
      !A.playing && !sourced(A) && B.playing && sourced(B) && framesOf(B) > bFrames
        && hlsAlive === (NATIVE_HLS ? 0 : 1)
        && A.play.getAttribute('aria-pressed') === 'false' && B.play.getAttribute('aria-pressed') === 'true',
      `${A.c.name} ${sourced(A) ? 'still open' : 'closed'}, ${B.c.name} ${B.playing ? 'playing' : 'stopped'} `
      + `(${bFrames} then ${framesOf(B)} frames), ${hlsAlive} engine alive`);
    A.play.click();
    await A.opening; await A.scheduleDone;
    const f2 = scheduleFetches;
    d.assert('playing a channel again does not fetch its schedule again',
      f2 === f1, `${f0} fetches before ${B.c.name}, ${f1} after it, ${f2} after ${A.c.name} again`);

    // ── and the self-check closes what it opened, by the same presses ───────
    A.play.click(); B.play.click();
    await wait(100);
    d.assert('a second press on each playing channel stops it, and nothing stays open',
      chans.every((S) => !S.playing && !sourced(S)) && hlsAlive === 0,
      `${chans.filter((S) => S.playing).map((S) => S.c.name).join(', ') || 'nothing'} playing, ${hlsAlive} engines, `
      + `${chans.filter(sourced).length} pictures with a source`);
  }

  // ── how it works ──────────────────────────────────────────────────────────
  // Read off this file: what the browser runs, the three things it asks ERR's
  // live origin for and how often, the schedule endpoint, and where a refusal
  // comes from. Drawing it fetches nothing.
  const DIAGRAM_SPEC = {
    caption: 'Nothing is asked of ERR until a play is pressed. Each channel then reads one master, its playlist every 10 s and segments as it plays.',
    nodes: [
      // ONE MACHINE, ERR, WITH ITS TWO HOSTS NAMED IN THE NOTES. Drawn as two
      // machines the schedule ranked under the live origin as a tall empty box.
      // `join: false`: master, variant and segments are linked by name below,
      // and nothing feeds the schedule from the segments beside it.
      { id: 'err', label: 'ERR', sub: 'err.ee', kind: 'cloud', tech: 'archive', join: false,
        children: [
          { id: 'master', label: 'master', sub: 'once per play',
            note: `The channel's address on ${LIVE_HOST}, which hands back a variant URL carrying a fresh **?id=** `
                + 'session on every read. So it is read once per press, and again only if the variant stops answering.' },
          { id: 'variant', label: 'variant', sub: 'every 10s',
            note: 'The media playlist for that session, about 218 KB covering 2 h, with one '
                + '**PROGRAM-DATE-TIME** on its first segment. It is re-read on the same URL, so the session is reused.' },
          { id: 'segments', label: 'segments', sub: 'fMP4, 1.92s',
            note: 'ERR refuses some by programme with a 403 and no CORS header, which reaches the browser as a CORS failure. '
                + 'The page asks first with a two byte Range request and starts behind the refusal.' },
          { id: 'schedule', label: 'schedule', sub: 'once per day',
            note: `The tvSchedule endpoint on ${new URL(SCHEDULE_API).host}, asked once per channel and day on the `
