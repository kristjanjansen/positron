<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Paper</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/typist/paper.css">
<style>
  /* concepts typist/000, PAPER, 2026-10-11. Asked: *"something which you
     similar to video panel, and there you have footer with full screen, and
     the top area is just white paper, white, and black or very dark type in
     our brand font, and there is also a cursor, a bit more blocky, and the
     first demo is just something you can type in, maybe a example message"*.
     Nothing here opens anything and nothing makes a sound (that is 010). */
</style>
<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';

  const d = mount({ name: 'Paper', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('typist/paper');

  const EXAMPLE = 'This is a sheet of paper.\nTap it and keep typing.';

  // ── the sheet ────────────────────────────────────────────────────────────
  const sheet = el('div', 'tp');
  const col = el('div', 'tp-col');
  const paper = el('pre', 'tp-type tp-paper', null, { 'aria-hidden': 'true' });
  // `data-typing` tells verify.mjs to type into this element rather than click it.
  const keys = el('textarea', 'tp-type tp-keys', null, {
    spellcheck: 'false', autocomplete: 'off', autocorrect: 'off', autocapitalize: 'sentences',
    'aria-label': 'the paper', 'data-typing': 'paper',
  });
  col.append(paper, keys);
  sheet.append(col);

  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  /** The text, and the cursor or the highlight exactly where the textarea's offsets say. */
  function draw() {
    const t = keys.value;
    const a = keys.selectionStart, b = keys.selectionEnd;
    const mid = a === b ? '<span class="tp-cur"></span>' : `<span class="tp-sel">${esc(t.slice(a, b))}</span>`;
    // the zero width space gives a trailing newline a line of its own, as the textarea has
    paper.innerHTML = esc(t.slice(0, a)) + mid + esc(t.slice(b)) + '​';
    follow();
  }

  /** The carriage: keep the cursor's line in view, one line of air under it. */
  function follow() {
    const cur = paper.querySelector('.tp-cur, .tp-sel');
    if (!cur) return;
    const s = sheet.getBoundingClientRect(), c = cur.getBoundingClientRect();
    const line = parseFloat(getComputedStyle(col).lineHeight) || 28;
    if (c.bottom + line > s.bottom) sheet.scrollTop += c.bottom + line - s.bottom;
    else if (c.top - line < s.top) sheet.scrollTop -= s.top - (c.top - line);
  }

  // ── the patchbay (asked 2026-10-11, *"can we patchbay 000?"*) ───────────
  // The keyboard is a node whose typing leaves on `keys:value-out`, shaped
  // text; the paper takes it on `paper:value-in`. One link, inside this tab.
  // Every keystroke is one event along it, so the wire pulses as you type;
  // the paper draws from the textarea as before.
  const S = 'web';
  const bay = createBay();
  bay.addNode({ id: `${S}:keys`, kind: 'person', label: 'keyboard', place: 'browser' });
  bay.addNode({ id: `${S}:paper`, kind: 'screen', label: 'paper', place: 'browser' });
  bay.addPort({ id: `${S}:keys:value-out`, dir: 'out', medium: 'value', shape: { of: 'text' } });
  bay.addPort({ id: `${S}:paper:value-in`, dir: 'in', medium: 'value', shape: { of: 'text' }, deliver: () => {} });
  bay.link(`${S}:keys:value-out`, `${S}:paper:value-in`);
  keys.addEventListener('input', (e) => bay.send(`${S}:keys:value-out`, { text: e.data || '', kind: e.inputType }));

  for (const ev of ['input', 'select', 'keyup', 'pointerup']) keys.addEventListener(ev, draw);
  document.addEventListener('selectionchange', () => { if (document.activeElement === keys) draw(); });
  keys.addEventListener('focus', () => { sheet.classList.add('on'); draw(); });
  keys.addEventListener('blur', () => sheet.classList.remove('on'));
  // A tap in the margins lands on the sheet, not the textarea: focus it, cursor at the end.
  sheet.addEventListener('click', (e) => {
    if (e.target === keys) return;
    keys.focus({ preventScroll: true });
    keys.setSelectionRange(keys.value.length, keys.value.length);
    draw();
  });

  keys.value = EXAMPLE;
  keys.setSelectionRange(EXAMPLE.length, EXAMPLE.length);

  // ── the frame ────────────────────────────────────────────────────────────
  const panel = createVideoPanel({ left: false, fullMode: 'footer' });
  panel.el.classList.add('tp-panel');
  panel.stage.append(sheet);
  const pb = createPatchbay(bay, { detail: (n) => [{ text: n.label, sans: true }] });
  d.stack.add(panel.el, pb.el);
  draw();
  keys.focus({ preventScroll: true });

  d.ready();
</script>
