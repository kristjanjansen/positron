<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>now positron</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .glass { width: 100%; aspect-ratio: 16 / 9; background: #000;
           border: 1px solid var(--line); border-radius: 4px; display: block; margin: 0 0 10px; }
</style>
<script src="/proto/remixer/hls.min.js"></script>
<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createStripView } from '/shell/strip.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { formatTime } from '/timeline/strip.mjs';
  import { mediaMaster } from '/timeline/media-master.mjs';
  import { CHANNELS, NATIVE_HLS, readPlaylist, probeSegment, wallHandler, clockOf, errUrl,
           findServedEdge, surveyChannels, describeSurvey }
    from '/shell/err-live.mjs';
  // 🔴 THIS PAGE IS POINTED AT A PUBLIC BROADCASTER, SO THE GATE IS NOT ABOUT
  // TIDINESS. Every connection opened here lands in ERR's listener statistics,
  // and the drill below opens thirty of them in two-byte range asks plus a
  // ten-minute back-seek that pulls a whole other stretch of the window off
  // their servers. A visitor gets the live edge and nothing else.
  import { SELFCHECK, ifSelfcheck } from '/shell/selfcheck.mjs';

  const CHANNEL = CHANNELS[0];                 // ETV. One channel: see below.
  const REACH_MS = 120 * 60 * 1000;            // what ERR advertises; measured below
  const RANGE_HZ = 1;                          // both ends move, once a second
  const OPEN_SPAN_MS = 12 * 60 * 1000;         // the opening view
  const PROBE_POINTS = 13;
  /**
   * 🔴 EVERY TWO-BYTE ASK THIS PAGE MAKES IN ONE VISIT, CAPPED. It was 30, for
   * a page whose only probing was the 13-point sweep plus a bisect. Since
   * 2026-09-18 the page also asks where the live edge is before it plays, which
   * is what stopped it showing black on a channel whose newest minutes are
   * refused, so the budget is now: up to 8 at startup, up to 8 more each time
   * LIVE is pressed on a channel with a wall (and never twice inside 20 s), 13
   * for the sweep, and up to 9 for the two channels the self-check surveys.
   * ⚠️ THE FIRST TWO ARE THE ONLY ONES A VISITOR PAYS, and on a channel that
   * serves its live edge each of them is ONE request, because the sweep starts
   * at the edge and stops the moment something is handed over.
   */
  const PROBE_CAP = 40;
  const PROBE_STEPS = 8;                       // how far back the edge sweep walks
  const WALL_BACKOFF_S = 90;                   // where to start behind a boundary
  // Do not ask the same question twice in the same breath. ERR's boundary is a
  // programme edge: it sits still for half an hour and then moves by however
  // long that programme was, so re-probing per press is spending a broadcaster's
  // bandwidth on an answer that has not changed.
  const SERVED_FRESH_MS = 20000;
  const BAND = { green: [5000, 10000], amber: 20000 };

  const d = mount({
    name: 'now',
    what: 'One ERR television channel on a line whose right-hand end is the present '
      + 'moment. The white line is the frame on the glass and the orange one is now, '
      + 'and the distance between them, about seven seconds, is what a live picture '
      + 'costs to reach you. Where ERR refuses its newest minutes for rights the '
      + 'picture starts behind that boundary instead and the distance is much larger, '
      + 'and LIVE returns to the newest frame it will hand over. ERR keeps roughly the '
      + 'last two hours, so press anywhere on the line to watch from that moment; the '
      + 'margin of the live row says how far behind the picture is and how much of the '
      + 'window you have seen, and the grey row under it is what was on.',
    // NO READOUT. Four cells above the picture repeated what the rows already
    // say and put the page's headline number — how far behind the picture is —
    // as far from the line that draws it as the layout allows. The distance is in
    // the live row's gutter now, beside the marks it is about.
    readout: { state: '', behind: 's', newest: 's', 'first frame': 'ms' },
    showReadout: false,
  });
  guard(d);

  const glass = el('video', 'glass', null, { playsinline: '', muted: '' });
  d.el.append(glass);

  // ── the line ──────────────────────────────────────────────────────────────
  // ABSOLUTE WALL MILLISECONDS, from ERR's own PDT rather than from this
  // device's clock — a visitor whose clock is ten minutes out still gets a
  // correct line, and the disagreement is printed instead of silently applied.
  const now0 = Date.now();
  const deck = createDeck({ items: [], adapters: {}, range: [now0 - REACH_MS, now0] });
  deck.seek(now0);

  let hls = null, master = null, clock = null, loadStopped = false;
  let edgeMs = now0, pdtMs = null, windowS = 0, playlist = null;
  // What ERR will hand over at the edge, and when that was last asked. `served`
  // carries `position` when something newer than it is refused; that is the
  // whole difference between this page playing and this page showing black.
  let served = null, servedAt = 0, survey = null;
  let watched = [];              // stretches actually seen: [{from, to}]
  let probes = [];               // {at, state} — one per two-byte ask
  let programmes = [];           // {at, end, name} from ERR's schedule
  let probesIssued = 0, sweepAt = null;
  const jumpEvents = [];

  /** mm:ss, or hh:mm:ss once there is an hour of it — the shape a video
   *  position is read in, rather than a decimal count of minutes. */
  const hms = (ms) => {
    const t = Math.max(0, Math.round(ms / 1000));
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = t % 60;
    const mm = String(h ? m : m).padStart(2, '0'), ss = String(sec).padStart(2, '0');
    return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
  };

  const behindMs = () => {
    const p = clock?.now();
    return p == null ? null : Date.now() - p;
  };
  const stateWord = () => {
    if (!clock || !clock.now()) return 'not started';
    if (glass.paused) return 'paused';
    const b = behindMs();
    if (stalledFor > 1500) return 'stalled';
    return b != null && b > BAND.amber ? 'behind live' : 'playing';
  };

  // ── lanes ─────────────────────────────────────────────────────────────────
  // A LANE ANSWERS FOR ITS OWN NUMBER AND NO OTHER. The picture lane says what
  // was seen, the served lane what ERR agreed to hand over, the programme lane
  // what was on. None of them colours another's ink.
  const laneBase = (id, label, height) => ({
    id, kind: 'part', label, height, barPad: 6, as: 'spans',
    stack: false, barGap: 1, terse: true, alpha: 0.9, spanLine: false,
  });
  const lanes = [
    {
      // ONE ROW FOR THE LIVE CHANNEL. It was two — what you watched, and what
      // ERR agreed to hand over — and they were reported as two questions
      // because they are two questions. But they are two questions about the
      // SAME channel at the same instants, and a reader looking at two rows of
      // small marks under one picture has to work out which is which before
      // either says anything. The probing still happens and still asserts; its
      // answer is a number in this row's gutter, where a number that has no
      // shape of its own belongs.
      ...laneBase('seen', `${CHANNEL.name} live`, 56),
      // GREEN = shown. SLATE = shown, and this row cannot say how well (no
      // frame-quality API here). Grey is the absence of a span, not a colour.
      colorOf: () => (glass.getVideoPlaybackQuality ? '#3fb950' : '#6a7280'),
      labelOf: () => '',
      rows: () => watched.map((w, i) => ({ at: w.from, id: `w${i}`, kind: 'part',
        payload: { durMs: Math.max(1, w.to - w.from), title: 'watched' } })),
      describeRow: (r) => [`${((r.payload.durMs) / 1000).toFixed(1)} s`,
        'you watched this stretch', 'a gap is where a seek skipped'],
    },
    {
      // GREY, because it is not a measurement. Every other mark on this page
      // is something that was watched or something that was asked for and
      // answered; the schedule is ERR telling us what was on, which nothing
      // here checked. Colour is spent on what was measured.
      ...laneBase('epg', `${CHANNEL.name} schedule`, 34),
      colorOf: () => '#5a6474',
      labelOf: (sp, { bw }) => (bw > 90 ? sp.row?.payload?.title?.slice(0, 40) ?? '' : ''),
      rows: () => programmes.map((p, i) => ({ at: p.at, id: `e${i}`, kind: 'part',
        payload: { durMs: p.end - p.at, title: p.name, repeat: p.repeat } })),
      describeRow: (r) => [r.payload.title?.slice(0, 46) ?? '',
        new Date(r.at).toTimeString().slice(0, 5) + (r.payload.repeat ? ' · repeat' : ''),
        "from ERR's schedule"],
    },
  ];

  // What each lane MEASURED, in its own gutter, refreshed where the numbers
  // are. Never instructions: "press Back ten minutes" belongs in the paragraph.
  function gutters() {
    const L = (id) => view.strip.lanes().find((l) => l.id === id);
    const seen = L('seen'), epg = L('epg');
    if (seen) {
      const total = watched.reduce((a, w) => a + (w.to - w.from), 0);
      const b = behindMs();
      const no = probes.filter((p) => p.state === 'refused').length;
      seen.subLabel = [
        b == null ? 'not started' : `${(b / 1000).toFixed(1)} s behind`,
        watched.length ? `${(total / 1000).toFixed(0)} s seen` : 'none seen yet',
        // WHETHER ANY WERE REFUSED is the answer; how many were asked is the
        // method, and the method fits in the log rather than in eleven
        // characters of margin.
        probes.length ? (no ? `${no} refused` : 'none refused') : '',
      ].filter(Boolean);
    }
    if (epg) {
      // "on air" read as "two things are broadcasting at once", which is
      // nonsense — it is how many programmes OVERLAP the seekable window, and
      // that is what it now says. The second line is the one that moves: when
      // the programme under the playhead gives way to the next one.
      const now = deck.position();
      const next = programmes.find((p) => p.at > now) || null;
      epg.subLabel = programmes.length
        ? [`${programmes.length} over ${(windowS / 3600).toFixed(0)} h`,
           next ? `next ${new Date(next.at).toTimeString().slice(0, 5)}` : '']
          .filter(Boolean)
        : '';
    }
  }

  // ── the bar, ABOVE the line ───────────────────────────────────────────────
  // Transport sits above the thing it drives. endStop:false because this
  // window's right-hand end is the present, which arrives about seven seconds
  // after play; command:{} because the deck is a FOLLOWER here — writing a
  // position to it is undone by the master's next tick, so the bar drives the
  // picture and the deck follows as it always does.
  const bar = createTransportBar(d.el, deck, {
    absolute: true, scrub: false, endStop: false,
    fmt: (pos, range) => `${new Date(pos).toTimeString().slice(0, 8)}`
      + `\u00a0\u00a0\u00a0\u00a0${hms(range[1] - pos)} behind the edge`,
    extras: [
      // The one verb that cannot be said as a position: the live edge is
      // wherever the engine has fragments for, which moves while you decide.
      { id: 'live', label: 'live', word: true, aria: 'Return to the live edge',
        title: 'back to the live edge', onClick: () => toLive() },
    ],
    command: {
      // PLAY MEANS PLAY LIVE. Before the picture exists there is nothing to
      // resume, so play starts it; after a walk back into the DVR, pause and
      // play are the picture's and the position is kept — that is what a DVR
      // is for, and `live` is next to them for getting back.
      // press play before the source has attached and you wait for the start
      // that is already running, then play — never a second start.
      play: () => {
        deck.play();
        if (clock) return glass.play().catch(() => {});
        return goLive().then(() => glass.play().catch(() => {}));
      },
      pause: () => (clock ? glass.pause() : deck.pause()),
      seek: (pos) => seekTo(pos),
    },
  });

  // THE PRESENT IS A DASHED LINE WITH A LABELLED GAP, not a second playhead.
  // `wallStyle: 'head'` draws it solid with a triangle on top — take arms it as
  // a recording head, where that is right — and here it made two identical
  // cursors sliding along together with nothing saying which was which. The
  // default style is the one this page's paragraph describes: dashes, and the
  // distance between the two drawn as a band and labelled in seconds.
  const view = createStripView(d.el, deck, {
    size: 'auto', absolute: true, follow: true, lanes,
    wallDash: [1, 3],          // dotted: the present, against the solid playhead
    wallLabel: false,          // the gap is already a line in the live row's margin
  });

  // PRESS THE LINE TO GO THERE. The strip seeks the DECK on press, and the
  // deck is a follower — the master would put it straight back within a tick.
  // So the gesture is mirrored to the picture, which is the thing that has to
  // move for a seek to have happened.
  // READ THE POINTER, NOT THE DECK. This used to take `deck.position()` on
  // pointerup, on the assumption that the strip's own press-to-seek had just
  // put it there. On a media-mastered deck it has not: the master's next tick
  // is ~16 ms away, it sees the picture disagreeing with the line by minutes
  // and puts the line straight back — so by the time pointerup ran, the value
  // read was the picture's own position and the seek was a no-op. Clicking
  // into the past did nothing at all, at any distance. This is the trap the
  // plan flagged for `flipper`, arrived at from the other side.
  //
  // The strip converts a pixel to an instant itself (`xToTime`), in the plot's
  // own coordinates — which is why the gutter has to come off the x first,
  // exactly as its internal `localX` does.
  const instantAt = (clientX) => {
    const r = view.strip.canvas.getBoundingClientRect();
    const st = view.strip.state;
    const px = (clientX - r.left) * (st.width / r.width) - st.gutterPx;
    return px < 0 ? null : view.strip.xToTime(px);
  };
  view.strip.canvas.addEventListener('pointerup', (e) => {
    if (!clock) return;
    const at = instantAt(e.clientX);
    if (at == null) return;                       // the gutter is not the line
    const want = Math.min(deck.range[1], Math.max(deck.range[0], at));
    seekTo(want);
    d.log(`watching from ${new Date(want).toTimeString().slice(0, 8)}`);
  });

  // ── the picture ───────────────────────────────────────────────────────────
  let stalledFor = 0, lastSeenPos = null, lastSeenAt = 0;
  let seekTarget = null, seekUntil = 0, caughtUpMs = null, seekSeq = 0;

  /** THE ONE WAY TO ASK FOR A POSITION — the bar, the line and the page's own
   *  walk back all come through here.
   *
   *  The line goes where you asked AT ONCE and the picture catches up, which
   *  is what every DVR does and what the harness's own seek check assumes.
   *  Leaving the line to follow the picture instead was truer by a strict
   *  reading — the playhead claims to be the frame on the glass — but it made
   *  a seek look like nothing had happened for as long as the fetch took, and
   *  it failed a check one run in four for a reason no reader could see.
   *
   *  While the seek is in flight the master does NOT drive: a picture that is
   *  fetching is not a clock, and letting it correct the line would put the
   *  playhead straight back where it was. The catch-up is measured and
   *  printed rather than hidden — it is a real DVR number and nothing else on
   *  the page says it. */
  function seekTo(want) {
    if (!clock) return deck.seek(want);
    seekTarget = want;
    seekUntil = performance.now() + 4000;
    caughtUpMs = null;
    const t0 = performance.now();
    const seq = ++seekSeq;
    deck.seek(want);
    clock.seek(want);
    // the first frame PRESENTED after this request, not the first tick that
    // agrees with it. Falls back to `seeked`, which is the element saying it
    // is repositioned — later than the assignment and earlier than a frame.
    if (glass.requestVideoFrameCallback) {
      const wantMedia = glass.currentTime;        // where the seek just put it
      const onFrame = (_now, meta) => {
        if (seq !== seekSeq || caughtUpMs !== null) return;
        // a frame from before the seek still carries the old timestamp
        if (Math.abs((meta?.mediaTime ?? wantMedia) - wantMedia) > 1) {
          if (performance.now() - t0 < 4000) glass.requestVideoFrameCallback(onFrame);
          return;
        }
        caughtUpMs = Math.round(performance.now() - t0);
        d.set('first frame', caughtUpMs, caughtUpMs < 500 ? 'ok' : '');
      };
      glass.requestVideoFrameCallback(onFrame);
    } else {
      glass.addEventListener('seeked', () => {
        if (seq === seekSeq && caughtUpMs === null) caughtUpMs = Math.round(performance.now() - t0);
      }, { once: true });
    }
    return { ok: true };
  }

  let starting = null;
  const goLive = () => (starting ||= startLive());

  async function startLive() {
    playlist = await readPlaylist(CHANNEL.url);
    pdtMs = playlist.pdt; windowS = playlist.windowS; edgeMs = playlist.edge ?? Date.now();
    // THE VISITOR'S CLOCK, measured and printed, never applied. Minimum round
    // trip kept rather than an average: an average is dragged by every slow
    // fetch, which is the same reason the looper's skew estimator keeps min-RTT.
    setRange();
    loadSchedule();             // fires as soon as the window is known

    // 🔴 ASK WHERE THE LIVE EDGE IS BEFORE PLAYING IT. ERR blocks live segments
    // by PROGRAMME and was MEASURED refusing ETV's newest forty-five minutes.
    // Until 2026-09-18 this page had no path for that at all: hls.js 403'd every
    // fragment at the edge, the wall handler stopped loading, the page said one
    // line and showed black, and six of its asserts went red downstream of a
    // clock that never started. `/flipper/` had solved it and the solution was
    // sitting in that page rather than in the kit. It is in `err-live.mjs` now
    // and this is the other caller.
    //
    // ⚠️ ONE REQUEST ON A CHANNEL THAT SERVES ITS EDGE, which is the common
    // case: the sweep begins at the newest segment and stops the moment
    // something is handed over.
    await askWhatIsServed(true);

    if (NATIVE_HLS) {
      glass.src = CHANNEL.url;
    } else if (window.Hls?.isSupported()) {
      // START BEHIND THE BOUNDARY WHEN THERE IS ONE. `startPosition` is the
      // only lever that works here: hls.js picks the live edge by itself
      // otherwise, and the live edge is exactly what is refused.
      hls = window.__hls = new window.Hls({ enableWorker: true,
        ...(served?.position != null ? { startPosition: served.position } : {}) });
      // NO CATCH-UP AND NO LATENCY TARGET. Being about seven seconds behind is
      // the medium here, not a defect; the page's job is to draw that distance,
      // not to close it. A back-seek must STICK rather than be yanked forward.
      hls.loadSource(CHANNEL.url);
      hls.attachMedia(glass);
      wallHandler(hls, window.Hls, () => {
        loadStopped = true;
        d.log('ERR refused three fragments in a row. Stopped loading rather than hammering it', 'bad');
      });
    } else { d.log('this browser cannot play HLS', 'bad'); return; }

    clock = clockOf(glass, hls);
    glass.muted = true;                       // no gesture yet; sound is not the subject

    master = mediaMaster(deck, () => {
      const p = clock?.now();
      return p == null ? null : { el: glass, pos: p, key: CHANNEL.id };
    }, { stallPolicy: 'hold', autoPlayPause: true,
         onEvent: (e) => { if (e.reason === 'jump') jumpEvents.push(e); } });
    tickLoop();
    await settle();
    // WAIT FOR SOMEBODY TO PRESS PLAY, then let go of the transport for a
    // moment. The suite presses play, pause and a keyboard seek within about
    // 1.1 s of each other, and a measurement started inside that window
    // measures the suite instead of the stream.
    await firstPlay();
    await new Promise((r) => setTimeout(r, 1500));
    await resume();
    await settle();
    await toLive();
    await waitForCatchUp();
    await sampleMovement();     // both ends move, and the playhead tracks the picture
    // 🔴 THE WALK IS A CHECK, AND IT USED TO RUN FOR EVERY LISTENER. It reads
    // as the page demonstrating itself, which is exactly the argument
    // `/videoradio/` lost: a check that does what the page does is still a
    // check, and this one pauses the picture, asks ERR for thirty instants it
    // was never going to play, and yanks the view ten minutes back and forward
    // again about twenty seconds into a visit. Under a harness it is the whole
    // subject; for a person the line, the schedule and the live edge already
    // are.
    await ifSelfcheck(async () => {
      await pauseTest();          // a paused picture stops the line, not the present
      await sweep();
      await takeSurvey();
      // WALK THE WINDOW ONCE. It leaves the picture row with two stretches and
      // a GAP between them, which is that row's whole subject: a gap is where a
      // seek skipped.
      backTest(10 * 60 * 1000);
      // WAIT FOR THE JUMP BEFORE RETURNING. hls.js keeps reporting the old
      // instant until fragments for the new one arrive, so going back to live
      // 900 ms later erased the 600 s error before the master had seen it — the
      // seek worked, the assert about it could not, and the page reported
      // "0 jumps since the seek" about a jump it had just made.
      await waitForCatchUp();
      await toLive();
      await liveTest();
      d.log('walked back into the window and returned. The break in the top row is where that seek skipped');
      openView(deck.position());
    }, { log: d.log, say: 'press anywhere on the line to walk back into the window' });
    checks();
  }

  // BOTH ENDS MOVE, once a second. setRange mutates deck.range in place, so
  // the strip and the bar — which both hold that reference — stay correct, and
  // a playhead pushed outside the window is moved by a real seek rather than
  // silently clamped.
  function setRange() {
    const reach = windowS ? windowS * 1000 : REACH_MS;
    deck.setRange([edgeMs - reach, edgeMs]);
  }
  setInterval(async () => {
    if (!playlist) return;
    try {
      const pl = await readPlaylist(CHANNEL.url);
      playlist = pl; edgeMs = pl.edge ?? edgeMs; windowS = pl.windowS || windowS;
      // ASK WHETHER THE POSITION WAS OUTSIDE, do not compare it with itself.
      // `deck.position()` is derived from the transport vector and the clock,
      // so while the picture is playing it advances between any two reads —
      // the old check compared a moving quantity across two statements and
      // announced that the window had eaten your position roughly once a
      // second, in red, on a page that was working perfectly.
      const reach = windowS ? windowS * 1000 : REACH_MS;
      const pos = deck.position();
      const outside = pos < edgeMs - reach || pos > edgeMs;
      setRange();
      if (outside)
        d.log(`the window ate your position · moved to ${new Date(deck.position()).toTimeString().slice(0, 8)}`, 'bad');
      d.set('newest', ((Date.now() - edgeMs) / 1000).toFixed(1));
    } catch { /* one missed refresh is not an event */ }
  }, 1000 / RANGE_HZ);

  // The page's own frame loop: the master's tick, the watched lane growing at
  // frame rate, and — the part that is easy to miss — invalidating the strip
  // WHILE THE DECK IS PAUSED, because the present line must keep moving at
  // exactly the moment the playhead does not.
  function tickLoop() {
    const step = () => {
      const p0 = clock?.now();
      if (seekTarget != null && (caughtUpMs !== null || performance.now() > seekUntil)) seekTarget = null;
      if (seekTarget == null) master?.tick();
      const p = clock?.now();
      if (p != null) {
        if (lastSeenPos != null && !glass.paused) {
          const dt = p - lastSeenPos;
          if (dt > 0 && dt < 2000) {
            const last = watched[watched.length - 1];
            if (last && Math.abs(p - last.to) < 2000) last.to = Math.max(last.to, p);
            else watched.push({ from: lastSeenPos, to: p });
            stalledFor = 0;
          } else if (dt === 0) stalledFor = performance.now() - lastSeenAt;
        }
        if (p !== lastSeenPos) { lastSeenPos = p; lastSeenAt = performance.now(); }
      }
      const b = behindMs();
      if (b != null) d.set('behind', (b / 1000).toFixed(1),
        b >= BAND.green[0] && b <= BAND.green[1] ? 'ok' : b <= BAND.amber ? '' : 'bad');
      d.set('state', stateWord());
      gutters();
      view.strip.invalidate();
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  /** resolves the first time the picture plays — the suite's press or a
   *  visitor's, it does not matter which */
  const firstPlay = () => (glass.paused
    ? new Promise((r) => glass.addEventListener('play', r, { once: true }))
    : Promise.resolve());
  const resume = async () => {
    if (glass.paused) await glass.play().catch(() => {});
    await new Promise((r) => setTimeout(r, 200));
  };

  const settle = () => new Promise((r) => {
    const t0 = performance.now();
    const check = () => {
      if (clock?.now() != null || performance.now() - t0 > 12000) return r();
      setTimeout(check, 200);
    };
    check();
  });

  // ── what ERR will hand over ───────────────────────────────────────────────
  // MEMBERSHIP IS THE DISCRIMINATOR. A segment that has fallen off the back of
  // the window answers exactly like a rights refusal — 403, no ACAO — so only
  // segments in the playlist just read are ever asked about.

  /** Where the newest frame ERR will serve is, kept for `SERVED_FRESH_MS`. */
  async function askWhatIsServed(force = false) {
    if (!playlist) return served;
    if (!force && served && performance.now() - servedAt < SERVED_FRESH_MS) return served;
    const found = await findServedEdge(playlist,
      { steps: PROBE_STEPS, backoffS: WALL_BACKOFF_S });
    if (!found) return served;
    const wasWall = served?.position != null;
    served = found; servedAt = performance.now();
    probesIssued += found.probes.length;
    if (found.none) {
      d.log('ERR refuses every point asked across the whole window (rights)', 'bad');
    } else if (found.position != null && !wasWall) {
      d.log(`ERR refuses the newest ${Math.round(found.blockedMin)} min of ${CHANNEL.name} `
        + `(rights) · starting ${WALL_BACKOFF_S} s behind that boundary`, 'bad');
    } else if (found.edgeServed && wasWall) {
      d.log(`${CHANNEL.name}: ERR serves to the live edge again`);
    }
    return served;
  }

  /** The instant LIVE should go to, or null when the engine's own edge is fine.
   *  A channel that served its edge is never re-probed: there is nothing to
   *  avoid, and asking again would spend a broadcaster's bandwidth on it. */
  async function servedLiveTarget() {
    if (served?.position == null) return null;
    await askWhatIsServed();
    return served?.position != null && Number.isFinite(served.startAt) ? served.startAt : null;
  }

  async function sweep() {
    const pl = playlist;
    if (!pl?.segs?.length) return;
    const n = Math.min(PROBE_POINTS, pl.segs.length);
    const picked = [];
    for (let k = 0; k < n; k++) picked.push(Math.round((k * (pl.segs.length - 1)) / (n - 1)));
    const asking = picked.filter(() => probesIssued++ < PROBE_CAP).map((i) => {
      const seg = pl.segs[i];
      return probeSegment(seg).then((state) => ({ at: seg.at ?? edgeMs, state, i,
        fromPlaylist: pl.segs.includes(seg), sn: seg.sn }));
    });
    probes = (await Promise.all(asking)).sort((a, b) => a.at - b.at);
    sweepAt = Date.now();
    const refused = probes.filter((p) => p.state === 'refused');
    d.log(refused.length
      ? `${CHANNEL.name}: ERR refused ${refused.length} of ${probes.length} points asked`
      : `${CHANNEL.name}: ERR served every one of the ${probes.length} points asked`,
      refused.length ? 'bad' : 'ok');
    view.strip.invalidate();
  }

  // 🔴 THE OTHER TWO CHANNELS, ASKED THE SAME QUESTION ONCE. ERR was measured
  // on 2026-09-06 refusing ETV's newest 45 minutes, ETV2's oldest 78, and
  // nothing at all on ETV+, and a boundary finder that always answered "nothing
  // is blocked" would be indistinguishable from a quiet day on the one channel
  // this page plays. Three shapes in one run is what separates them.
  // ⚠️ SELF-CHECK WORK, GATED. A visitor watching ETV has no use for what ETV2
  // is refusing, and asking costs a playlist and a probe on somebody else's
  // server. The channel this page IS playing is not asked twice.
  async function takeSurvey() {
    const own = served ? { id: CHANNEL.id, name: CHANNEL.name, ...served } : null;
    const rows = await surveyChannels(CHANNELS.filter((ch) => ch.id !== own?.id),
      { steps: PROBE_STEPS, backoffS: WALL_BACKOFF_S });
    probesIssued += rows.reduce((n, r) => n + (r.probes?.length || 0), 0);
    survey = CHANNELS
      .map((ch) => (own && ch.id === own.id ? own : rows.find((r) => r.id === ch.id)))
      .filter(Boolean);
    d.log(`what ERR will serve: ${describeSurvey(survey)}`);
  }

  // ── what was on ───────────────────────────────────────────────────────────
  async function loadSchedule() {
    // ERR's broadcast day starts at 05:45 local, so a two-hour window that
    // reaches back past midnight needs yesterday's schedule too.
    const days = [new Date(edgeMs - windowS * 1000), new Date(edgeMs)];
    const seen = new Set();
    const wanted = days.filter((day) => {
      const key = day.toDateString();
      if (seen.has(key)) return false;
      seen.add(key); return true;
    });
    const out = (await Promise.all(wanted.map(async (day) => {
      const rows = [];
      try {
        // THROUGH `errUrl` LIKE EVERY OTHER ERR ADDRESS ON THIS PAGE. The
        // schedule is on `www.err.ee` rather than `live.err.ee`, which is
        // exactly why it is easy to leave behind: it is the one request here
        // that is not a playlist or a segment, and a page pointed at a stand-in
        // with one live URL still in it is a page that contacts ERR.
        const u = errUrl('https://www.err.ee/api/tvSchedule/getTimelineSchedule')
          + `?day=${day.getDate()}&month=${day.getMonth() + 1}&year=${day.getFullYear()}&channel=${CHANNEL.id}`;
        const j = await (await fetch(u)).json();
        // The response is the schedule itself — a top-level array of entries
        // with `startTime` in epoch SECONDS. It arrives as an object with
        // numeric keys, which Object.values flattens either way.
        for (const r of Object.values(j || {})) {
          const at = Number(r?.startTime) * 1000;
          if (!Number.isFinite(at) || !at) continue;
          const clean = (r.programName || r.programNameTx || r.name || '').replace(/\*\s*$/, '').trim();
          rows.push({ at, name: clean || '', repeat: r.automaticReplay === 'Y' });
        }
      } catch { /* the schedule is decoration; the line stands without it */ }
      return rows;
    }))).flat();
    out.sort((a, b) => a.at - b.at);
    // CONTIGUOUS BY CONSTRUCTION: a programme runs until the next one starts.
    for (let i = 0; i < out.length; i++) out[i].end = out[i + 1] ? out[i + 1].at : out[i].at + 3600e3;
    const from = edgeMs - windowS * 1000;
    programmes = out.filter((p) => p.end > from && p.at < edgeMs);
    view.strip.invalidate();
  }

  // ── the two position controls ─────────────────────────────────────────────
  function stepBack(ms) {
    const asked = Math.max(deck.range[0] + 5000, (clock?.now() ?? Date.now()) - ms);
    // LAND WHERE ERR SAID IT WOULD SERVE. The sweep asked 13 instants across
    // the window two bytes at a time; walking back to an arbitrary one instead
    // ignores the only evidence on the page about where the picture can come
    // from. Seeking into a refused stretch does not move the picture at all —
    // the fragments 403 with no ACAO, the wall handler stops loading, and the
    // playhead simply stays where it was. Two runs in three failed the
    // back-seek assert that way, for ERR's reasons rather than ours.
    const served = probes.filter((p) => p.state === 'served' && p.at <= asked);
    let want = served.length ? served[served.length - 1].at : asked;
    if (probes.length && !served.length) {
      d.log('ERR served nothing older than the live edge', 'bad');
    } else if (Math.abs(want - asked) > 60000) {
      d.log(`asked for ${new Date(asked).toTimeString().slice(0, 5)}; the nearest instant ERR agreed to serve is `
        + `${new Date(want).toTimeString().slice(0, 5)}`);
    }
    if (loadStopped && clock) {
      hls?.startLoad(glass.currentTime + (want - clock.now()) / 1000);
      loadStopped = false;
    }
    const sought = seekTo(want);
    d.log(`walking back to ${new Date(want).toTimeString().slice(0, 8)}`
      + `${sought == null ? ' · no clock yet' : ''}`);
    return want;
  }

  async function toLive() {
    // here the argument-free form is the RIGHT one: the live edge is exactly
    // where this control is asking to go.
    if (loadStopped) { hls?.startLoad(); loadStopped = false; }
    if (glass.paused) await glass.play().catch(() => {});
    // 🔴 LIVE MEANS THE NEWEST FRAME ERR WILL SERVE, NOT THE NEWEST ONE IT
    // LISTS. Jumping to `liveSyncPosition` where the newest forty-five minutes
    // are refused lands the playhead in the blackout and kills a picture that
    // was playing, which is `/flipper/`'s hardest-won line and was missing here.
    const wall = await servedLiveTarget();
    for (let i = 0; i < 20; i++) {
      const l = wall ?? clock?.live();
      if (l != null) {
        // THROUGH THE ONE SEEK PATH, so the line moves at once here too, and
        // then BRING THE VIEW BACK. Returning the picture to the live edge
        // while the view is still parked ten minutes ago puts the playhead off
        // the left of the screen: the control did exactly what it said and the
        // page looked like it had stopped. Scrolling or dragging disengages
        // the strip's follow, which is the behaviour that stops it fighting
        // you; this control is the thing that re-engages it.
        seekTo(l);
        openView(l);
        view.strip.setFollow(true);
        return l;
      }
      await new Promise((r) => setTimeout(r, 100));
    }
    d.log('the engine offered no live position within two seconds', 'bad');
    return null;
  }


  // ── the three things a live line has to prove ────────────────────────────
  const evid = { paused: null, wallKeptGoing: null, asked: null, landed: null,
                 jumpsBefore: 0, jumpsAfter: 0, behindAfterLive: null };

  // A PAUSED PICTURE STOPS THE LINE AND NOT THE PRESENT. This is the closest
  // the harness can get to a stall: it exercises the same law (a paused
  // element is not a clock) from the one direction that can be induced from
  // here. A real network stall — the clock frozen while the element still
  // claims to be playing — cannot be induced without a fault injector, and is
  // not asserted rather than being asserted loosely.
  async function pauseTest() {
    if (!clock) return;
    const w0 = view.strip.wallPos();
    glass.pause();
    await new Promise((r) => setTimeout(r, 400));
    evid.paused = deck.playing() === false;
    evid.wallKeptGoing = view.strip.wallPos() > w0;
    glass.play().catch(() => {});
    await new Promise((r) => setTimeout(r, 300));
  }

  // A BACK-SEEK IS AN INSTANT, AND IT IS A JUMP. Read synchronously on
  // purpose: `currentTime = x` reflects the target immediately, so the REQUEST
  // can be asserted with no wait at all. Whether a frame from that instant was
  // then presented is the effect — it needs a wait, and an assert that has to
  // wait is an assert that gets written tolerantly. That part is logged.
  function backTest(ms) {
    evid.jumpsBefore = jumpEvents.length;
    evid.from = clock?.now();
    const want = stepBack(ms);
    evid.asked = want;
    evid.landed = clock?.now();          // synchronous: the REQUEST, not the effect
    evid.lineAt = deck.position();       // and where the line went, same tick
  }

  /** bounded wait for the picture to arrive at the instant that was asked for */
  async function waitForCatchUp() {
    const t0 = performance.now();
    while (caughtUpMs === null && performance.now() - t0 < 4500)
      await new Promise((r) => setTimeout(r, 50));
    evid.caughtUp = caughtUpMs;
  }

  async function liveTest() {
    // WAIT FOR THE JUMP RATHER THAN RACING IT. The back-seek sets currentTime
    // synchronously, but `hls.playingDate` keeps reporting the old instant
    // until fragments for the new one arrive — so the master sees no error and
    // reports no jump until then. On a warm local server that is a few frames;
    // on a cold edge it was long enough to fail one run in four. A bounded
    // wait turns the race into a check: if no jump has arrived in three
    // seconds, that is worth reading as a failure.
    const t0 = performance.now();
    while (jumpEvents.length <= evid.jumpsBefore && performance.now() - t0 < 3000)
      await new Promise((r) => setTimeout(r, 100));
    await new Promise((r) => setTimeout(r, 1200));
    evid.behindAfterLive = behindMs();
  }

  // ── checks ────────────────────────────────────────────────────────────────
  function checks() {
    // M — mechanism, deterministic, no network
    d.assert('the line is positioned in the present, not at zero',
      deck.position() >= deck.range[0] && deck.position() <= deck.range[1],
      new Date(deck.position()).toTimeString().slice(0, 8));
    d.assert('the position domain is absolute wall milliseconds',
      view.strip.state.absolute === true && deck.range[0] > 1.7e12,
      `${deck.range[0]}`);
    d.assert('the axis reads as a clock, not a duration',
      /^\d{2}:\d{2}$/.test(formatTime(deck.range[1], 60000, true)),
      formatTime(deck.range[1], 60000, true));
    d.assert('the window keeps its identity while both ends move',
      rangeIdentity.same && rangeIdentity.movedLeft && rangeIdentity.movedRight,
      `left +${rangeIdentity.dLeft} ms, right +${rangeIdentity.dRight} ms, same array ${rangeIdentity.same}`);
    d.assert('the present is not inside the seekable window',
      (view.strip.readout().wall ?? 0) > deck.range[1] - 1,
      `${(((view.strip.readout().wall ?? 0) - deck.range[1]) / 1000).toFixed(1)} s past the edge`);
    d.assert('the bar does not stop this deck at the end of the window',
      bar.endStop === false && bar.commanded === true,
      'endStop false, position commands go to the picture');

    // E — needs ERR
    d.assert('the playlist carries a start date',
      Number.isFinite(pdtMs) && Math.abs(Date.now() - pdtMs) < 3 * 3600e3,
      pdtMs ? new Date(pdtMs).toTimeString().slice(0, 8) : 'none');
    d.assert('the window is about the advertised two hours',
      windowS > 3600 && windowS < 9000, `${(windowS / 60).toFixed(1)} min`);
    // 🔴 TWO BANDS, BECAUSE THE PAGE HAS TWO HONEST ANSWERS. On a channel that
    // serves its live edge the gap is a live picture's worth, about seven
    // seconds. On one that refuses its newest minutes the picture is deliberately
    // behind the boundary, and the distance is what ERR is refusing: asserting
    // seven seconds there would fail a page doing exactly the right thing, and
    // widening the band to admit it would stop the assert saying anything.
    const bNow = behindMs();
    const wallNow = served?.position != null ? served : null;
    d.assert('the playhead is behind the present by what ERR leaves open',
      bNow != null && (wallNow
        ? Math.abs(bNow / 1000 - wallNow.blockedMin * 60) < 180
        : bNow > 1000 && bNow < 30000),
      wallNow
        ? `${(bNow / 60000).toFixed(1)} min behind, and ERR refuses the newest `
          + `${wallNow.blockedMin.toFixed(1)} min`
        : `${((bNow ?? 0) / 1000).toFixed(1)} s, live edge served`);
    d.assert('the playhead advances with the picture',
      advance.moved > 1000 && advance.moved < 2500 && (master?.stats().syncs ?? 0) > 0,
      `${advance.moved} ms over ${advance.wall} ms, ${master?.stats().syncs ?? 0} syncs`);
    // 🔴 THESE SEVEN GO WITH THE DRILL, AND THAT PAIRING IS THE RULE RATHER
    // THAN A CONVENIENCE. Their evidence comes from the pause, the sweep and
    // the back-seek above; left ungated they would read `evid.asked == null`
    // and write seven red FAIL lines into a visitor's log about checks that
    // were deliberately not run, which is worse than saying nothing.
    if (SELFCHECK) {
      d.assert('every probed instant was inside the playlist just read',
        probes.length > 0 && probes.every((p) => p.fromPlaylist),
        `${probes.length} points, all from the playlist just read`);
      d.assert('the probe stayed under its own cap',
        probesIssued <= PROBE_CAP, `${probesIssued} of ${PROBE_CAP}`);
      d.assert('pausing the picture stops the line and not the present',
        evid.paused === true && evid.wallKeptGoing === true,
        `deck paused ${evid.paused}, present still moving ${evid.wallKeptGoing}`);
      d.assert('a back-seek is expressed as an instant inside the window',
        evid.asked != null && evid.asked >= deck.range[0] && evid.asked <= deck.range[1]
          && Math.abs((evid.landed ?? 0) - evid.asked) < 1500,
        evid.asked ? `asked ${new Date(evid.asked).toTimeString().slice(0, 8)}, clock read ${new Date(evid.landed).toTimeString().slice(0, 8)}` : 'not asked');
      d.assert('a back-seek moves the line at once, not by drifting',
        evid.lineAt != null && evid.asked != null && Math.abs(evid.lineAt - evid.asked) < 1500,
        evid.lineAt == null ? 'no line reading'
          : `${Math.round(evid.lineAt - evid.asked)} ms from what was asked, read synchronously`);
      d.assert('a frame from the asked-for instant was actually shown',
        evid.caughtUp != null && evid.caughtUp < 4000,
        evid.caughtUp == null ? 'no frame from there within 4.5 s'
          : `${evid.caughtUp} ms from the request to a frame carrying that timestamp`);
      // The same two bands as the assert above, for the same reason: LIVE goes
      // to the newest frame ERR will HAND OVER, which on a walled channel is
      // behind the boundary rather than at the edge of the playlist.
      d.assert('returning to live restores the gap ERR leaves open',
        evid.behindAfterLive != null && (wallNow
          ? Math.abs(evid.behindAfterLive / 1000 - wallNow.blockedMin * 60) < 180
          : evid.behindAfterLive < 30000),
        wallNow ? `${(evid.behindAfterLive / 60000).toFixed(1)} min behind, `
          + `${wallNow.blockedMin.toFixed(1)} min refused`
          : `${((evid.behindAfterLive ?? 0) / 1000).toFixed(1)} s behind`);

      // 🔴 THE REFUSAL BOUNDARY, ASSERTED. Sabotaging the stand-in to serve
      // every segment used to leave this page fully green: no assert named a
      // refusal, a 403 or a served segment, and the only thing that moved was a
      // count in the harness summary. Finding that boundary is most of what
      // this page IS, so it is what the page now asserts.
      // ⚠️ MEMBERSHIP AGAIN, AND AT THE RIGHT INSTANT THIS TIME. The sweep only
      // ever asks about segments that were in the playlist it read, which is
      // what tells a rights refusal from one that has fallen off the back of
      // the window. But the window keeps moving while thirteen probes go out,
      // so the OLDEST point can expire between the read and the ask and come
      // back refused for the other reason. MEASURED: `#.......#####`, one
      // refusal at the old end of a channel refusing its newest minutes, which
      // is two boundaries where there is one. Points no longer in the freshest
      // playlist are dropped rather than counted.
      const live = new Set((playlist?.segs || []).map((s) => s.sn));
      const inWindow = probes.filter((p) => p.sn == null || live.has(p.sn));
      const seq = inWindow.map((p) => p.state);     // sorted by instant already
      const flips = seq.filter((s, i) => i > 0 && s !== seq[i - 1]).length;
      d.assert('the refusals are one unbroken run at one end of the window',
        seq.includes('refused') && seq.includes('served') && flips === 1,
        `${seq.map((s) => (s === 'served' ? '.' : '#')).join('')} · oldest on the left`
        + `${inWindow.length < probes.length ? `, ${probes.length - inWindow.length} expired since` : ''}`);
      const reachable = (survey || []).filter((r) => r && !r.unreachable);
      const walled = reachable.filter((r) => r.position != null);
      const open = reachable.filter((r) => r.edgeServed);
      d.assert('a channel that refuses its newest minutes gets a start behind the boundary',
        walled.length > 0 && walled.every((r) => r.blockedMin > 0
          && r.probes.some((p) => p.state === 'refused')
          && r.probes.some((p) => p.state === 'served')),
        walled.length ? describeSurvey(walled) : 'no channel refused its live edge');
      d.assert('a channel that refuses nothing is reported as refusing nothing',
        open.length > 0 && open.every((r) => r.blockedMin === 0),
        open.length ? `${open.map((r) => r.id).join(', ')} served the newest segment`
          : 'no channel served its live edge');
    }
    d.assert('the programme spans are contiguous and named',
      programmes.length > 0 && programmes.every((p, i) =>
        p.name && (i === 0 || programmes[i - 1].end === p.at)),
      `${programmes.length} programmes`);
  }

  // The two facts the mechanism asserts need, sampled once at load: whether the
  // range array keeps its identity while both ends move, and whether 1.5 s of
  // wall time moves the playhead by 1.5 s.
  const rangeIdentity = { same: false, movedLeft: false, movedRight: false, dLeft: 0, dRight: 0 };
  const advance = { moved: 0, wall: 0 };
  async function sampleMovement() {
    await resume();
    // and never measure across a seek still in flight — the master stands
    // down while one is, so the playhead legitimately does not advance and
    // the sample would read "0 ms over 1500 ms" about a page that is fine.
    const waitFrom = performance.now();
    while (seekTarget != null && performance.now() - waitFrom < 4500)
      await new Promise((r) => setTimeout(r, 100));
    const ref = deck.range, l0 = ref[0], r0 = ref[1];
    await new Promise((r) => setTimeout(r, 5000));
    rangeIdentity.same = deck.range === ref;
    rangeIdentity.dLeft = Math.round(deck.range[0] - l0);
    rangeIdentity.dRight = Math.round(deck.range[1] - r0);
    rangeIdentity.movedLeft = rangeIdentity.dLeft > 0;
    rangeIdentity.movedRight = rangeIdentity.dRight > 0;
    const p0 = clock?.now();
    const t0 = performance.now();
    await new Promise((r) => setTimeout(r, 1500));
    const p1 = clock?.now();
    advance.wall = Math.round(performance.now() - t0);
    advance.moved = p0 != null && p1 != null ? Math.round(p1 - p0) : 0;
  }

  // Up and drivable, which is what ready means — the checks fire from the last
  // control, and the harness reads them after it has pressed everything.
  view.strip.armWall(Date.now());
  // THE PAST FILLS THE VIEW. Opening with the playhead a tenth from the left
  // put nine tenths of the line in the FUTURE, which is empty by definition —
  // so a press anywhere but the first inch landed after the live edge, was
  // clamped to it, and "clicking on the past" did nothing at any distance.
  // Measured: a press a third of the way across asked for 10:19:42 while the
  // newest instant on offer was 10:17:12.
  //
  // At 70% the playhead keeps room to travel — which is what putting it near
  // the left was for, and it still crosses the follow threshold at 82% about a
  // minute and a half later — while eight of the twelve minutes on screen are
  // material you can actually watch.
  const openView = (at = Date.now()) =>
    view.strip.fit(at - OPEN_SPAN_MS * 0.70, at + OPEN_SPAN_MS * 0.30);
  openView();
  window.__strip = view.strip;

  // UP AND DRIVABLE IS WHAT READY MEANS, and a live page is not up until it is
  // live: there is no button to press any more, so the page starts itself.
  d.ready();
  goLive();
</script>
</html>
