<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>now · positron</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .glass { width: 100%; aspect-ratio: 16 / 9; background: #000;
           border: 1px solid var(--line); border-radius: 4px; display: block; margin: 0 0 10px; }
</style>
<script src="/proto/remixer/hls.min.js"></script>
<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createStripView } from '/shell/strip.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { formatTime } from '/timeline/strip.mjs';
  import { mediaMaster } from '/timeline/media-master.mjs';
  import { CHANNELS, NATIVE_HLS, readPlaylist, probeSegment, wallHandler, clockOf }
    from '/shell/err-live.mjs';

  const CHANNEL = CHANNELS[0];                 // ETV. One channel: see below.
  const REACH_MS = 120 * 60 * 1000;            // what ERR advertises; measured below
  const RANGE_HZ = 1;                          // both ends move, once a second
  const OPEN_SPAN_MS = 12 * 60 * 1000;         // the opening view
  const PROBE_POINTS = 13;
  const PROBE_CAP = 30;                        // sweep + one bisect, hard stop
  const BAND = { green: [5000, 10000], amber: 20000 };

  const d = mount({
    name: 'now',
    what: 'One ERR television channel on a line whose right-hand end is the present '
      + 'moment. The white line is the frame on the glass and the orange one is now; '
      + 'the distance between them, about seven seconds, is what a live picture costs '
      + 'to reach you, and it is drawn rather than hidden. ERR keeps roughly the last '
      + 'two hours: press anywhere on the line to watch from that moment instead, and '
      + 'live returns to the edge. The middle row is what ERR agreed to hand over when '
      + 'this page asked, two bytes at a time, and the page walks back into it once on '
      + 'its own — the break in the top row is where that seek skipped.',
    readout: { state: '', behind: 's', edge: 's', seek: 'ms' },
  });
  guard(d);

  const glass = el('video', 'glass', null, { playsinline: '', muted: '' });
  d.el.append(glass);

  // ── the line ──────────────────────────────────────────────────────────────
  // ABSOLUTE WALL MILLISECONDS, from ERR's own PDT rather than from this
  // device's clock — a visitor whose clock is ten minutes out still gets a
  // correct line, and the disagreement is printed instead of silently applied.
  const now0 = Date.now();
  const deck = createDeck({ items: [], adapters: {}, range: [now0 - REACH_MS, now0] });
  deck.seek(now0);

  let hls = null, master = null, clock = null, loadStopped = false;
  let edgeMs = now0, pdtMs = null, windowS = 0, playlist = null;
  let watched = [];              // stretches actually seen: [{from, to}]
  let probes = [];               // {at, state} — one per two-byte ask
  let programmes = [];           // {at, end, name} from ERR's schedule
  let probesIssued = 0, sweepAt = null;
  const jumpEvents = [];

  const behindMs = () => {
    const p = clock?.now();
    return p == null ? null : Date.now() - p;
  };
  const stateWord = () => {
    if (!clock || !clock.now()) return 'not started';
    if (glass.paused) return 'paused';
    const b = behindMs();
    if (stalledFor > 1500) return 'stalled';
    return b != null && b > BAND.amber ? 'behind live' : 'playing';
  };

  // ── lanes ─────────────────────────────────────────────────────────────────
  // A LANE ANSWERS FOR ITS OWN NUMBER AND NO OTHER. The picture lane says what
  // was seen, the served lane what ERR agreed to hand over, the programme lane
  // what was on. None of them colours another's ink.
  const laneBase = (id, label, height) => ({
    id, kind: 'part', label, height, barPad: 6, as: 'spans',
    stack: false, barGap: 1, terse: true, alpha: 0.9, spanLine: false,
  });
  const lanes = [
    {
      ...laneBase('seen', 'picture', 40),
      // GREEN = shown. SLATE = shown, and this lane cannot say how well (no
      // frame-quality API here). Grey is the absence of a span, not a colour.
      colorOf: () => (glass.getVideoPlaybackQuality ? '#3fb950' : '#6a7280'),
      rows: () => watched.map((w, i) => ({ at: w.from, id: `w${i}`, kind: 'part',
        payload: { durMs: Math.max(1, w.to - w.from), title: 'watched' } })),
      describeRow: (r) => [`${((r.payload.durMs) / 1000).toFixed(1)} s watched`,
        'a stretch you actually saw', 'gaps are where a seek skipped'],
    },
    {
      ...laneBase('served', 'served', 40),
      // FOUR STATES, and every one is reachable: green served, red refused,
      // slate asked-and-cannot-say, and grey (no mark) never asked.
      colorOf: (sp) => ({ served: '#3fb950', refused: '#f85149', unknown: '#6a7280' }[sp.row?.payload?.state] || '#6a7280'),
      rows: () => probes.map((p, i) => ({ at: p.at, id: `p${i}`, kind: 'part',
        payload: { durMs: 1920, state: p.state } })),
      describeRow: (r) => [({ served: 'ERR served this one', refused: 'ERR refused this one',
        unknown: 'asked, and cannot say' })[r.payload.state], 'two bytes, Range request', ''],
    },
    {
      ...laneBase('epg', CHANNEL.name, 34),
      colorOf: () => 'hsl(50 62% 45%)',
      labelOf: (sp, { bw }) => (bw > 90 ? sp.row?.payload?.title?.slice(0, 40) ?? '' : ''),
      rows: () => programmes.map((p, i) => ({ at: p.at, id: `e${i}`, kind: 'part',
        payload: { durMs: p.end - p.at, title: p.name } })),
      describeRow: (r) => [r.payload.title?.slice(0, 46) ?? '',
        new Date(r.at).toTimeString().slice(0, 5), "from ERR's schedule"],
    },
  ];

  // What each lane MEASURED, in its own gutter, refreshed where the numbers
  // are. Never instructions: "press Back ten minutes" belongs in the paragraph.
  function gutters() {
    const L = (id) => view.strip.lanes().find((l) => l.id === id);
    const seen = L('seen'), served = L('served'), epg = L('epg');
    if (seen) {
      const total = watched.reduce((a, w) => a + (w.to - w.from), 0);
      seen.subLabel = watched.length
        ? [`${(total / 1000).toFixed(0)} s seen`, `${watched.length} stretch${watched.length > 1 ? 'es' : ''}`]
        : 'none seen';
    }
    if (served) {
      const no = probes.filter((p) => p.state === 'refused').length;
      served.subLabel = probes.length
        ? [`${probes.length} asked`, no ? `${no} refused` : 'none refused']
        : 'not asked';
    }
    if (epg) epg.subLabel = programmes.length ? `${programmes.length} on air` : 'no schedule';
  }

  // ── the bar, ABOVE the line ───────────────────────────────────────────────
  // Transport sits above the thing it drives. endStop:false because this
  // window's right-hand end is the present, which arrives about seven seconds
  // after play; command:{} because the deck is a FOLLOWER here — writing a
  // position to it is undone by the master's next tick, so the bar drives the
  // picture and the deck follows as it always does.
  const bar = createTransportBar(d.el, deck, {
    absolute: true, scrub: false, endStop: false,
    fmt: (pos, range) => `${new Date(pos).toTimeString().slice(0, 8)}`
      + `  ·  ${((range[1] - pos) / 60000).toFixed(1)} min behind the edge`,
    extras: [
      // The one verb that cannot be said as a position: the live edge is
      // wherever the engine has fragments for, which moves while you decide.
      { id: 'live', label: 'live', aria: 'Return to the live edge',
        title: 'back to the live edge', onClick: () => toLive() },
    ],
    command: {
      // PLAY MEANS PLAY LIVE. Before the picture exists there is nothing to
      // resume, so play starts it; after a walk back into the DVR, pause and
      // play are the picture's and the position is kept — that is what a DVR
      // is for, and `live` is next to them for getting back.
      // press play before the source has attached and you wait for the start
      // that is already running, then play — never a second start.
      play: () => (clock ? glass.play().catch(() => {})
                         : goLive().then(() => glass.play().catch(() => {}))),
      pause: () => (clock ? glass.pause() : deck.pause()),
      seek: (pos) => seekTo(pos),
    },
  });

  // THE PRESENT IS A DASHED LINE WITH A LABELLED GAP, not a second playhead.
  // `wallStyle: 'head'` draws it solid with a triangle on top — take arms it as
  // a recording head, where that is right — and here it made two identical
  // cursors sliding along together with nothing saying which was which. The
  // default style is the one this page's paragraph describes: dashes, and the
  // distance between the two drawn as a band and labelled in seconds.
  const view = createStripView(d.el, deck, {
    size: 'auto', absolute: true, follow: true, lanes,
    wallDash: [1, 3],          // dotted: the present, against the solid playhead
  });

  // PRESS THE LINE TO GO THERE. The strip seeks the DECK on press, and the
  // deck is a follower — the master would put it straight back within a tick.
  // So the gesture is mirrored to the picture, which is the thing that has to
  // move for a seek to have happened.
  view.strip.canvas.addEventListener('pointerup', () => {
    if (clock) seekTo(deck.position());   // the strip already moved the line
  });

  // ── the picture ───────────────────────────────────────────────────────────
  let stalledFor = 0, lastSeenPos = null, lastSeenAt = 0;
  let seekTarget = null, seekUntil = 0, caughtUpMs = null, seekSeq = 0;

  /** THE ONE WAY TO ASK FOR A POSITION — the bar, the line and the page's own
   *  walk back all come through here.
   *
   *  The line goes where you asked AT ONCE and the picture catches up, which
   *  is what every DVR does and what the harness's own seek check assumes.
   *  Leaving the line to follow the picture instead was truer by a strict
   *  reading — the playhead claims to be the frame on the glass — but it made
   *  a seek look like nothing had happened for as long as the fetch took, and
   *  it failed a check one run in four for a reason no reader could see.
   *
   *  While the seek is in flight the master does NOT drive: a picture that is
   *  fetching is not a clock, and letting it correct the line would put the
   *  playhead straight back where it was. The catch-up is measured and
   *  printed rather than hidden — it is a real DVR number and nothing else on
   *  the page says it. */
  function seekTo(want) {
    if (!clock) return deck.seek(want);
    seekTarget = want;
    seekUntil = performance.now() + 4000;
    caughtUpMs = null;
    const t0 = performance.now();
    const seq = ++seekSeq;
    deck.seek(want);
    clock.seek(want);
    // the first frame PRESENTED after this request, not the first tick that
    // agrees with it. Falls back to `seeked`, which is the element saying it
    // is repositioned — later than the assignment and earlier than a frame.
    if (glass.requestVideoFrameCallback) {
      glass.requestVideoFrameCallback(() => {
        if (seq === seekSeq && caughtUpMs === null) {
          caughtUpMs = Math.round(performance.now() - t0);
          d.set('seek', caughtUpMs, caughtUpMs < 500 ? 'ok' : '');
        }
      });
    } else {
      glass.addEventListener('seeked', () => {
        if (seq === seekSeq && caughtUpMs === null) caughtUpMs = Math.round(performance.now() - t0);
      }, { once: true });
    }
    return { ok: true };
  }

  let starting = null;
  const goLive = () => (starting ||= startLive());

  async function startLive() {
    playlist = await readPlaylist(CHANNEL.url);
    pdtMs = playlist.pdt; windowS = playlist.windowS; edgeMs = playlist.edge ?? Date.now();
    // THE VISITOR'S CLOCK, measured and printed, never applied. Minimum round
    // trip kept rather than an average: an average is dragged by every slow
    // fetch, which is the same reason the looper's skew estimator keeps min-RTT.
    setRange();

    if (NATIVE_HLS) {
      glass.src = CHANNEL.url;
    } else if (window.Hls?.isSupported()) {
      hls = window.__hls = new window.Hls({ enableWorker: true });
      // NO CATCH-UP AND NO LATENCY TARGET. Being about seven seconds behind is
      // the medium here, not a defect; the page's job is to draw that distance,
      // not to close it. A back-seek must STICK rather than be yanked forward.
      hls.loadSource(CHANNEL.url);
      hls.attachMedia(glass);
      wallHandler(hls, window.Hls, () => {
        loadStopped = true;
        d.log('ERR refused three fragments in a row — stopped loading rather than hammering it', 'bad');
      });
    } else { d.log('this browser cannot play HLS', 'bad'); return; }

    clock = clockOf(glass, hls);
    glass.muted = true;                       // no gesture yet; sound is not the subject

    master = mediaMaster(deck, () => {
      const p = clock?.now();
      return p == null ? null : { el: glass, pos: p, key: CHANNEL.id };
    }, { stallPolicy: 'hold', autoPlayPause: true,
         onEvent: (e) => { if (e.reason === 'jump') jumpEvents.push(e); } });
    tickLoop();
    await settle();
    // WAIT FOR SOMEBODY TO PRESS PLAY, then let go of the transport for a
    // moment. The suite presses play, pause and a keyboard seek within about
    // 1.1 s of each other, and a measurement started inside that window
    // measures the suite instead of the stream.
    await firstPlay();
    await new Promise((r) => setTimeout(r, 1500));
    await resume();
    await settle();
    await toLive();
    await waitForCatchUp();
    await sampleMovement();     // both ends move, and the playhead tracks the picture
    await pauseTest();          // a paused picture stops the line, not the present
    await sweep();
    await loadSchedule();
    // WALK THE WINDOW ONCE, on purpose and in the open. This is the thing the
    // page is about — that the last two hours are still there — and with no
    // control to press it has to be shown rather than offered. It also leaves
    // the picture row with two stretches and a GAP between them, which is that
    // row's whole subject: a gap is where a seek skipped.
    backTest(10 * 60 * 1000);
    // WAIT FOR THE JUMP BEFORE RETURNING. hls.js keeps reporting the old
    // instant until fragments for the new one arrive, so going back to live
    // 900 ms later erased the 600 s error before the master had seen it — the
    // seek worked, the assert about it could not, and the page reported
    // "0 jumps since the seek" about a jump it had just made.
    await waitForCatchUp();
    await toLive();
    await liveTest();
    d.log('walked back ten minutes and returned — the break in the picture row is where the seek skipped');
    checks();
  }

  // BOTH ENDS MOVE, once a second. setRange mutates deck.range in place, so
  // the strip and the bar — which both hold that reference — stay correct, and
  // a playhead pushed outside the window is moved by a real seek rather than
  // silently clamped.
  function setRange() {
    const reach = windowS ? windowS * 1000 : REACH_MS;
    deck.setRange([edgeMs - reach, edgeMs]);
  }
  setInterval(async () => {
    if (!playlist) return;
    try {
      const pl = await readPlaylist(CHANNEL.url);
      playlist = pl; edgeMs = pl.edge ?? edgeMs; windowS = pl.windowS || windowS;
      // ASK WHETHER THE POSITION WAS OUTSIDE, do not compare it with itself.
      // `deck.position()` is derived from the transport vector and the clock,
      // so while the picture is playing it advances between any two reads —
      // the old check compared a moving quantity across two statements and
      // announced that the window had eaten your position roughly once a
      // second, in red, on a page that was working perfectly.
      const reach = windowS ? windowS * 1000 : REACH_MS;
      const pos = deck.position();
      const outside = pos < edgeMs - reach || pos > edgeMs;
      setRange();
      if (outside)
        d.log(`the window ate your position — moved to ${new Date(deck.position()).toTimeString().slice(0, 8)}`, 'bad');
      d.set('edge', ((Date.now() - edgeMs) / 1000).toFixed(1));
    } catch { /* one missed refresh is not an event */ }
  }, 1000 / RANGE_HZ);

  // The page's own frame loop: the master's tick, the watched lane growing at
  // frame rate, and — the part that is easy to miss — invalidating the strip
  // WHILE THE DECK IS PAUSED, because the present line must keep moving at
  // exactly the moment the playhead does not.
  function tickLoop() {
    const step = () => {
      const p0 = clock?.now();
      if (seekTarget != null && (caughtUpMs !== null || performance.now() > seekUntil)) seekTarget = null;
      if (seekTarget == null) master?.tick();
      const p = clock?.now();
      if (p != null) {
        if (lastSeenPos != null && !glass.paused) {
          const dt = p - lastSeenPos;
          if (dt > 0 && dt < 2000) {
            const last = watched[watched.length - 1];
            if (last && Math.abs(p - last.to) < 2000) last.to = Math.max(last.to, p);
            else watched.push({ from: lastSeenPos, to: p });
            stalledFor = 0;
          } else if (dt === 0) stalledFor = performance.now() - lastSeenAt;
        }
        if (p !== lastSeenPos) { lastSeenPos = p; lastSeenAt = performance.now(); }
      }
      const b = behindMs();
      if (b != null) d.set('behind', (b / 1000).toFixed(1),
        b >= BAND.green[0] && b <= BAND.green[1] ? 'ok' : b <= BAND.amber ? '' : 'bad');
      d.set('state', stateWord());
      gutters();
      view.strip.invalidate();
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  /** resolves the first time the picture plays — the suite's press or a
   *  visitor's, it does not matter which */
  const firstPlay = () => (glass.paused
    ? new Promise((r) => glass.addEventListener('play', r, { once: true }))
    : Promise.resolve());
  const resume = async () => {
    if (glass.paused) await glass.play().catch(() => {});
    await new Promise((r) => setTimeout(r, 200));
  };

  const settle = () => new Promise((r) => {
    const t0 = performance.now();
    const check = () => {
      if (clock?.now() != null || performance.now() - t0 > 12000) return r();
      setTimeout(check, 200);
    };
    check();
  });

  // ── what ERR will hand over ───────────────────────────────────────────────
  // MEMBERSHIP IS THE DISCRIMINATOR. A segment that has fallen off the back of
  // the window answers exactly like a rights refusal — 403, no ACAO — so only
  // segments in the playlist just read are ever asked about.
  async function sweep() {
    const pl = playlist;
    if (!pl?.segs?.length) return;
    const n = Math.min(PROBE_POINTS, pl.segs.length);
    const picked = [];
    for (let k = 0; k < n; k++) picked.push(Math.round((k * (pl.segs.length - 1)) / (n - 1)));
    probes = [];
    for (const i of picked) {
      if (probesIssued >= PROBE_CAP) break;
      probesIssued++;
      const seg = pl.segs[i];
      probes.push({ at: seg.at ?? edgeMs, state: await probeSegment(seg), i,
                    fromPlaylist: pl.segs.includes(seg), sn: seg.sn });
    }
    sweepAt = Date.now();
    const refused = probes.filter((p) => p.state === 'refused');
    d.log(refused.length
      ? `${CHANNEL.name}: ERR refused ${refused.length} of ${probes.length} points asked`
      : `${CHANNEL.name}: ERR served every one of the ${probes.length} points asked`,
      refused.length ? 'bad' : 'ok');
    view.strip.invalidate();
  }

  // ── what was on ───────────────────────────────────────────────────────────
  async function loadSchedule() {
    // ERR's broadcast day starts at 05:45 local, so a two-hour window that
    // reaches back past midnight needs yesterday's schedule too.
    const days = [new Date(edgeMs - windowS * 1000), new Date(edgeMs)];
    const seen = new Set(), out = [];
    for (const day of days) {
      const key = day.toDateString();
      if (seen.has(key)) continue;
      seen.add(key);
      try {
        const u = `https://www.err.ee/api/tvSchedule/getTimelineSchedule`
          + `?day=${day.getDate()}&month=${day.getMonth() + 1}&year=${day.getFullYear()}&channel=${CHANNEL.id}`;
        const j = await (await fetch(u)).json();
        // The response is the schedule itself — a top-level array of entries
        // with `startTime` in epoch SECONDS. It arrives as an object with
        // numeric keys, which Object.values flattens either way.
        for (const r of Object.values(j || {})) {
          const at = Number(r?.startTime) * 1000;
          if (!Number.isFinite(at) || !at) continue;
          out.push({ at, name: r.programNameTx || r.name || r.programName || '—' });
        }
      } catch { /* the schedule is decoration; the line stands without it */ }
    }
    out.sort((a, b) => a.at - b.at);
    // CONTIGUOUS BY CONSTRUCTION: a programme runs until the next one starts.
    for (let i = 0; i < out.length; i++) out[i].end = out[i + 1] ? out[i + 1].at : out[i].at + 3600e3;
    const from = edgeMs - windowS * 1000;
    programmes = out.filter((p) => p.end > from && p.at < edgeMs);
    view.strip.invalidate();
  }

  // ── the two position controls ─────────────────────────────────────────────
  function stepBack(ms) {
    const asked = Math.max(deck.range[0] + 5000, (clock?.now() ?? Date.now()) - ms);
    // LAND WHERE ERR SAID IT WOULD SERVE. The sweep asked 13 instants across
    // the window two bytes at a time; walking back to an arbitrary one instead
    // ignores the only evidence on the page about where the picture can come
    // from. Seeking into a refused stretch does not move the picture at all —
    // the fragments 403 with no ACAO, the wall handler stops loading, and the
    // playhead simply stays where it was. Two runs in three failed the
    // back-seek assert that way, for ERR's reasons rather than ours.
    const served = probes.filter((p) => p.state === 'served' && p.at <= asked);
    let want = served.length ? served[served.length - 1].at : asked;
    if (probes.length && !served.length) {
      d.log('ERR served nothing older than the live edge — there is nowhere to walk back to', 'bad');
    } else if (Math.abs(want - asked) > 60000) {
      d.log(`asked for ${new Date(asked).toTimeString().slice(0, 5)}; the nearest instant ERR agreed to serve is `
        + `${new Date(want).toTimeString().slice(0, 5)}`);
    }
    if (loadStopped && clock) {
      hls?.startLoad(glass.currentTime + (want - clock.now()) / 1000);
      loadStopped = false;
    }
    const sought = seekTo(want);
    d.log(`walking back to ${new Date(want).toTimeString().slice(0, 8)}`
      + `${sought == null ? ' — no clock yet' : ''}`);
    return want;
  }

  async function toLive() {
    // here the argument-free form is the RIGHT one: the live edge is exactly
    // where this control is asking to go.
    if (loadStopped) { hls?.startLoad(); loadStopped = false; }
    for (let i = 0; i < 20; i++) {
      const l = clock?.live();
      if (l != null) { clock.seek(l); return l; }
      await new Promise((r) => setTimeout(r, 100));
    }
    d.log('the engine offered no live position within two seconds', 'bad');
    return null;
  }


  // ── the three things a live line has to prove ────────────────────────────
  const evid = { paused: null, wallKeptGoing: null, asked: null, landed: null,
                 jumpsBefore: 0, jumpsAfter: 0, behindAfterLive: null };

  // A PAUSED PICTURE STOPS THE LINE AND NOT THE PRESENT. This is the closest
  // the harness can get to a stall: it exercises the same law (a paused
  // element is not a clock) from the one direction that can be induced from
  // here. A real network stall — the clock frozen while the element still
  // claims to be playing — cannot be induced without a fault injector, and is
  // not asserted rather than being asserted loosely.
  async function pauseTest() {
    if (!clock) return;
    const w0 = view.strip.wallPos();
    glass.pause();
    await new Promise((r) => setTimeout(r, 400));
    evid.paused = deck.playing() === false;
    evid.wallKeptGoing = view.strip.wallPos() > w0;
    glass.play().catch(() => {});
    await new Promise((r) => setTimeout(r, 300));
  }

  // A BACK-SEEK IS AN INSTANT, AND IT IS A JUMP. Read synchronously on
  // purpose: `currentTime = x` reflects the target immediately, so the REQUEST
  // can be asserted with no wait at all. Whether a frame from that instant was
  // then presented is the effect — it needs a wait, and an assert that has to
  // wait is an assert that gets written tolerantly. That part is logged.
  function backTest(ms) {
    evid.jumpsBefore = jumpEvents.length;
    evid.from = clock?.now();
    const want = stepBack(ms);
    evid.asked = want;
    evid.landed = clock?.now();          // synchronous: the REQUEST, not the effect
    evid.lineAt = deck.position();       // and where the line went, same tick
  }

  /** bounded wait for the picture to arrive at the instant that was asked for */
  async function waitForCatchUp() {
    const t0 = performance.now();
    while (caughtUpMs === null && performance.now() - t0 < 4500)
      await new Promise((r) => setTimeout(r, 50));
    evid.caughtUp = caughtUpMs;
  }

  async function liveTest() {
    // WAIT FOR THE JUMP RATHER THAN RACING IT. The back-seek sets currentTime
    // synchronously, but `hls.playingDate` keeps reporting the old instant
    // until fragments for the new one arrive — so the master sees no error and
    // reports no jump until then. On a warm local server that is a few frames;
    // on a cold edge it was long enough to fail one run in four. A bounded
    // wait turns the race into a check: if no jump has arrived in three
    // seconds, that is worth reading as a failure.
    const t0 = performance.now();
    while (jumpEvents.length <= evid.jumpsBefore && performance.now() - t0 < 3000)
      await new Promise((r) => setTimeout(r, 100));
    await new Promise((r) => setTimeout(r, 1200));
    evid.behindAfterLive = behindMs();
  }

  // ── checks ────────────────────────────────────────────────────────────────
  function checks() {
    // M — mechanism, deterministic, no network
    d.assert('the line is positioned in the present, not at zero',
      deck.position() >= deck.range[0] && deck.position() <= deck.range[1],
      new Date(deck.position()).toTimeString().slice(0, 8));
    d.assert('the position domain is absolute wall milliseconds',
      view.strip.state.absolute === true && deck.range[0] > 1.7e12,
      `${deck.range[0]}`);
    d.assert('the axis reads as a clock, not a duration',
      /^\d{2}:\d{2}$/.test(formatTime(deck.range[1], 60000, true)),
      formatTime(deck.range[1], 60000, true));
    d.assert('the window keeps its identity while both ends move',
      rangeIdentity.same && rangeIdentity.movedLeft && rangeIdentity.movedRight,
      `left +${rangeIdentity.dLeft} ms, right +${rangeIdentity.dRight} ms, same array ${rangeIdentity.same}`);
    d.assert('the present is not inside the seekable window',
      (view.strip.readout().wall ?? 0) > deck.range[1] - 1,
      `${(((view.strip.readout().wall ?? 0) - deck.range[1]) / 1000).toFixed(1)} s past the edge`);
    d.assert('the bar does not stop this deck at the end of the window',
      bar.endStop === false && bar.commanded === true,
      'endStop false, position commands go to the picture');

    // E — needs ERR
    d.assert('the playlist carries a start date',
      Number.isFinite(pdtMs) && Math.abs(Date.now() - pdtMs) < 3 * 3600e3,
      pdtMs ? new Date(pdtMs).toTimeString().slice(0, 8) : 'none');
    d.assert('the window is about the advertised two hours',
      windowS > 3600 && windowS < 9000, `${(windowS / 60).toFixed(1)} min`);
    d.assert('the playhead is behind the present by a live picture\'s worth',
      behindMs() != null && behindMs() > 1000 && behindMs() < 30000,
      `${((behindMs() ?? 0) / 1000).toFixed(1)} s`);
    d.assert('the playhead advances with the picture',
      advance.moved > 1000 && advance.moved < 2500 && (master?.stats().syncs ?? 0) > 0,
      `${advance.moved} ms over ${advance.wall} ms, ${master?.stats().syncs ?? 0} syncs`);
    d.assert('every probed instant was inside the playlist just read',
      probes.length > 0 && probes.every((p) => p.fromPlaylist),
      `${probes.length} points, all from the playlist just read`);
    d.assert('the probe stayed under its own cap',
      probesIssued <= PROBE_CAP, `${probesIssued} of ${PROBE_CAP}`);
    d.assert('pausing the picture stops the line and not the present',
      evid.paused === true && evid.wallKeptGoing === true,
      `deck paused ${evid.paused}, present still moving ${evid.wallKeptGoing}`);
    d.assert('a back-seek is expressed as an instant inside the window',
      evid.asked != null && evid.asked >= deck.range[0] && evid.asked <= deck.range[1]
        && Math.abs((evid.landed ?? 0) - evid.asked) < 1500,
      evid.asked ? `asked ${new Date(evid.asked).toTimeString().slice(0, 8)}, clock read ${new Date(evid.landed).toTimeString().slice(0, 8)}` : 'not asked');
    d.assert('a back-seek moves the line at once, not by drifting',
      evid.lineAt != null && evid.asked != null && Math.abs(evid.lineAt - evid.asked) < 1500,
      evid.lineAt == null ? 'no line reading'
        : `${Math.round(evid.lineAt - evid.asked)} ms from what was asked, read synchronously`);
    d.assert('a frame from the asked-for instant was actually shown',
      evid.caughtUp != null && evid.caughtUp > 0,
      evid.caughtUp == null ? 'no frame within 4.5 s'
        : `${evid.caughtUp} ms from the request to the first frame presented`);
    d.assert('returning to live restores the gap',
      evid.behindAfterLive != null && evid.behindAfterLive < 30000,
      `${((evid.behindAfterLive ?? 0) / 1000).toFixed(1)} s behind`);
    d.assert('the programme spans are contiguous and named',
      programmes.length > 0 && programmes.every((p, i) =>
        p.name && (i === 0 || programmes[i - 1].end === p.at)),
      `${programmes.length} programmes`);
  }

  // The two facts the mechanism asserts need, sampled once at load: whether the
  // range array keeps its identity while both ends move, and whether 1.5 s of
  // wall time moves the playhead by 1.5 s.
  const rangeIdentity = { same: false, movedLeft: false, movedRight: false, dLeft: 0, dRight: 0 };
  const advance = { moved: 0, wall: 0 };
  async function sampleMovement() {
    await resume();
    const ref = deck.range, l0 = ref[0], r0 = ref[1];
    await new Promise((r) => setTimeout(r, 5000));
    rangeIdentity.same = deck.range === ref;
    rangeIdentity.dLeft = Math.round(deck.range[0] - l0);
    rangeIdentity.dRight = Math.round(deck.range[1] - r0);
    rangeIdentity.movedLeft = rangeIdentity.dLeft > 0;
    rangeIdentity.movedRight = rangeIdentity.dRight > 0;
    const p0 = clock?.now();
    const t0 = performance.now();
    await new Promise((r) => setTimeout(r, 1500));
    const p1 = clock?.now();
    advance.wall = Math.round(performance.now() - t0);
    advance.moved = p0 != null && p1 != null ? Math.round(p1 - p0) : 0;
  }

  // Up and drivable, which is what ready means — the checks fire from the last
  // control, and the harness reads them after it has pressed everything.
  view.strip.armWall(Date.now());
  view.strip.fit(Date.now() - OPEN_SPAN_MS * 0.75, Date.now() + OPEN_SPAN_MS * 0.25);
  window.__strip = view.strip;

  // UP AND DRIVABLE IS WHAT READY MEANS, and a live page is not up until it is
  // live: there is no button to press any more, so the page starts itself.
  d.ready();
  goLive();
</script>
</html>
