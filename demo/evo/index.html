     that is why it is set from the module rather than declared in the
     stylesheet. The two are the same colour again now that this page is back on
     `backlit`, which is exactly when a second source stops being able to
     disagree and starts looking correct by luck. It is still read from the
     module, because the day this page changes scheme again is the day a token
     would be wrong, and the page asserts the window and the fields match. */
  win.style.setProperty('--disp-back', SCHEMES.backlit.back);
  /* The small field FIRST, because it is at the bottom left of the real window
     and the three large digits fill the right two thirds of it. */
  win.append(disp2.el, disp3.el);
  fixed.append(win);

  /** Both fields at once, so a reading can never be half replaced. */
  function show(value, about) {
    disp3.set(value);
    disp2.set(about);
  }

  // ── twelve half height buttons, in a 3 wide by 4 tall grid ──────────────

  /**
   * 🔴 EACH PRESS SENDS THREE MESSAGES, NOT ONE. Measured: a bank select LSB, a
   * bank select MSB and then a program change. Nine buttons gave programs 1 to
   * 9 on channel 2, which is the documented `Program / Bank preset` assignment
   * behaving as written, and the manual corroborates it: *"Try for instance
   * preset 01 which has been setup to send program messages 01 to 10 on the 10
   * assignable buttons."*
   * ⚠️ **AND THE TENTH SENT PROGRAM 0 ON CHANNEL 1.** One button carries an
   * explicit channel while the rest inherit the global one. It is unresolved,
   * and it is why the program number rather than the channel decides which
   * button lights here.
   * ⚠️ IN EDIT MODE THESE TEN ARE THE KEYPAD, which is why the manual says you
   * cannot select one by pressing it. They are controllers 11 to 20.
   */
  const keypadBox = el('div', 'pan-group evo-keypad');
  /**
   * 🔴 THE WORD `ASSIGNABLE` LIVES IN THE HOVER, WHICH IS THE ONE THING KEPT
   * WHEN THE PRINTED BAR CAME OFF. Asked 2026-09-21: *"rm funciton buttons /
   * assignable buttons labels"*. The fact behind that bar is real and is not on
   * the face any more: twelve keys with no name on them read as broken rather
   * than as blank on purpose, and `ASSIGNABLE BUTTONS` is the only thing the
   * real panel prints that says otherwise. So it goes where this page already
   * keeps a fact a reader may want and does not need on the panel, which is
   * exactly where the printed controller numbers went.
   */
  keypadBox.title = 'the ten assignable buttons, which the panel prints '
    + 'ASSIGNABLE BUTTONS under. They are blank on purpose: each one sends '
    + 'whatever it has been assigned, and in edit mode the ten are a keypad';
  const keypad = createPadGrid({
    cols: 3, rows: 4,
    pad: (x, y) => {
      const face = KEYPAD[y][x];
      const digit = /\d/.test(face);
      return {
        /* The digit is printed above the button on the panel, not on it. */
        top: face, half: true,
        aria: digit ? `assignable button ${face}` : `${face} button`,
        tint: '#7fb2ff', latch: false, disabled: true,
        title: digit
          ? `program ${face}, sent with a bank select pair in front of it. `
            + `In edit mode this is the keypad digit ${face}`
          : `${face}. Pressed together with the other one it sends a snap shot, `
            + 'which is every controller’s current value at once',
      };
    },
  });
  /** Program number to the button that carries it, so a flash needs no arithmetic. */
  const padByDigit = new Map();
  KEYPAD.forEach((row, y) => row.forEach((face, x) => {
    if (/\d/.test(face)) padByDigit.set(face, keypad.at(x, y));
  }));

  /* `SNAP SHOT` is what the `-` and `+` pressed together do, printed under the
     bottom row. The bracket that used to tie it to them is gone; the label is
     centred across the row those two buttons end. */
  const snap = el('div', 'pan-sub evo-snapbox', 'SNAP SHOT');
  keypadBox.append(keypad.el, snap);
  fixed.append(keypadBox);

  // ── the two wheels, frontmost on the case ───────────────────────────────

  /**
   * 🔴 THE PITCH BEND WHEEL IS SEVEN BIT INSIDE A FOURTEEN BIT MESSAGE.
   * Measured: 106 bend messages, **every one with an LSB of 0**, 63 distinct
   * values. So 128 of the 16384 positions exist and the other 16256 cannot be
   * reached. The assignment type is 14 bit; the wheel behind it is not.
   * ⚠️ **AND IT DOES NOT REACH EITHER END, NOR RELIABLY REPORT CENTRE.** Raw
   * range 0 to 13952, with only 6 of 106 messages reading exactly 8192. A
   * layout that assumes a released wheel reports centre is asserting something
   * this instrument does not do.
   */
  /* 🔴 `pitchbend`, ONE WORD. Asked 2026-09-21: *"pichbend single word"*, because
     `PITCH BEND` wrapped to two lines under a 46 px wheel while `MODULATION`
     beside it sat on one, so the pair read as two different kinds of label and
     the two slot numbers under them ended up 12.34 px apart. One token cannot
     be broken, so both labels are now one line and `C9` and `C10` land level.
     See the label rule in the styles above for the width decision that goes
     with it. */
  const bend = createFader({
    label: 'pitchbend', sub: `C${BEND_SLOT}`, min: 0, max: 16383, value: 8192,
    title: 'pitch bend, printed C9 on the panel. Seven bit in a fourteen bit '
         + 'message, and it was measured reaching 13952 rather than 16383',
    disabled: true,
  });
  /** Measured: CC 1, values 57 to 127 seen, which is the documented default. */
  const mod = createFader({
    label: 'modulation', sub: `C${MOD_SLOT}`, min: 0, max: 127, value: 0,
    title: 'the modulation wheel, printed C10 on the panel, sending CC 1',
    disabled: true,
  });
  const wheels = el('div', 'evo-wheels');
  const wheelRow = el('div', 'evo-wheelrow');
  const wheelMid = el('div', 'pan-sub evo-wheelmid');
  /* Typed uppercase rather than left to a `text-transform`, which is the house
     rule: the source should read like the page. */
  wheelMid.append(el('div', '', 'MAX'), el('div', '', 'MIN'));
  wheelRow.append(bend.el, wheelMid, mod.el);
  wheels.append(wheelRow);
  fixed.append(wheels);

  // ── the back strip: function buttons, octave pair, nameplate, rotaries ──

  const row = el('div', 'pan-row evo-row');

  const fnRow = el('div', 'evo-fn-row');
  const fnPads = [];
  for (let i = 0; i < FN_ONE.length; i++) {
    const p = createPad({
      latch: false, disabled: true,
      aria: FN_ONE[i].replace('\n', ' ').toLowerCase(),
      title: `${FN_ONE[i].replace('\n', ' ')} on a single press. Nothing this `
           + 'sends has ever been captured, and the manual says no data leaves '
           + 'the keyboard in edit mode except program and bank changes',
    });
    fnPads.push(p);
    fnRow.append(p.el);
    const lab = el('div', 'pan-sub evo-fn-lab', FN_ONE[i]);
    lab.style.setProperty('--i', String(i));
    fnRow.append(lab);
  }
  for (let i = 0; i < FN_PAIR.length; i++) {
    const lab = el('div', 'pan-sub evo-fn-pair', FN_PAIR[i]);
    lab.style.setProperty('--i', String(i));
    fnRow.append(lab);
  }
  /* 🔴 NO WRAPPER AND NO GROUP HEADING. The six buttons go straight into the
     row now that the `FUNCTION BUTTONS` bar is gone, because a wrapper holding
     one child has a `gap` with nothing to act on: this project measured a page
     whose `.pos-body` had exactly one child getting no vertical rhythm at all,
     the rule working perfectly with nothing to act on. Count the siblings
     before hunting for a rule that lost. */
  row.append(fnRow);

  /**
   * ⚠️ OCTAVE AND TRANSPOSE ARE DRAWN AND ARE LIT BY NOTHING. The manual gives
   * 11 octaves of range from these two, and `/dump/` saw no octave shift at
   * all: the 25 notes measured were one contiguous run, so whatever was pressed
   * either did not take or was undone before anything was played. **The octave
   * step is unmeasured**, and a button that moved this drawing on a guess would
   * be a page inventing a fact about an instrument.
   */
  const oct = el('div', 'evo-oct');
  const octRow = el('div', 'evo-oct-row');
  const octDown = createPad({
    top: MINUS, round: true, latch: false, disabled: true, aria: 'octave down',
    title: 'octave down. Nothing this sends has ever been captured',
  });
  const octUp = createPad({
    top: '+', round: true, latch: false, disabled: true, aria: 'octave up',
    title: 'octave up. Nothing this sends has ever been captured',
  });
  octRow.append(octDown.el, octUp.el,
    el('div', 'pan-sub evo-oct-lab', 'TRANSPOSE'));
  oct.append(el('div', 'pan-cap', 'OCTAVE'), octRow);
  row.append(oct);

  /* The nameplate, in the middle of the back strip where the logo sits, between
     the octave pair and the rotaries. See the note on `.pan-plate`. */
  const plate = el('div', 'pan-plate evo-plate');
  plate.append(el('div', 'pan-plate-l', 'EVOLUTION'),
    el('div', 'pan-plate-l', 'MK-425C'));
  row.append(plate);

  const rot = el('div', 'pan-group evo-rot');
  const knobs = [];
  for (let i = 0; i < ROTARIES.length; i++) {
    if (i === ROTARY_SPLIT) rot.append(el('div', 'evo-rot-div'));
    const k = createKnob({
      label: ROTARIES[i], min: 0, max: 127, value: 0,
      /* 🔴 NO `sub`, WHICH IS WHERE THE WORD `unbound` USED TO BE, EIGHT TIMES
         OVER. Asked 2026-09-21: *"evolution: rm unbound labels and cc labels on
         hw replicas in general"*. It was never a fact about the instrument, it
         was the page admitting it did not know what a knob was wired to, and
         printing that admission under every dial. The controller number's home
         is the hover and the MIDI table, which is where `/circuit/`, `/model/`
         and `/shape/` already keep theirs. */
      title: `${ROTARIES[i]}, a fully assignable rotary. Which controller `
           + 'number this slot sends is held in the keyboard and printed in no '
           + 'manual, so nothing here claims one until one is heard',
      disabled: true,
    });
    knobs.push(k);
    rot.append(k.el);
  }
  row.append(rot);
  flow.append(row);

  /**
   * 🔴 THE KIT'S KEYBOARD, NOT A FOURTH COPY OF ONE. `createKeyboard` already
   * knows where a black key sits on the join, which this project measured
   * against real piano proportions rather than centring them.
   * ⚠️ IT TAKES A LETTER MAP because its other callers are played from a
   * computer keyboard. This one is a picture of somebody else's instrument, so
   * the letters are off and the map is 25 slots of nothing but a note offset.
   * 🔴 **AND IT TAKES `sharps` SEPARATELY, WHICH IS THE THING THIS PAGE HAD
   * NEVER PASSED.** The set holds the LETTER names of the black keys, not their
   * notes and not their offsets, so a caller inventing its own key names has to
   * say which of them are black or it gets none. See `KEY_PATTERN` above, and
   * the note on `KEY_LO` for what that cost.
   */
  const keyMap = {};
  const keyNames = [];
  for (let i = 0; i < KEYS; i++) { keyMap[`k${i}`] = i; keyNames.push(`k${i}`); }
  const keysBox = el('div', 'evo-keys');
  const kbd = createKeyboard(keysBox, {
    base: KEY_LO, map: keyMap, keys: keyNames, letters: false,
    sharps: new Set(keyNames.filter((_, i) => KEY_PATTERN[i] === 'B')),
    minBase: KEY_LO, maxBase: KEY_LO,
  });
  flow.append(keysBox);

  /**
   * 🔴 EVERY PRINTED LABEL ON THIS PANEL NAMES SOMETHING SWITCHED OFF, SO EVERY
   * ONE OF THEM DIMS. Reported 2026-09-21: *"on dislable pad buttons make labels
   * way lighter"*. The rule and the measurements are on `.pan-sub[data-off]`
   * near the top of this file; this is the line that applies it.
   * 🔴 **IT IS A SWEEP RATHER THAN SIX SEPARATE FLAGS BECAUSE THE PREMISE IS
   * TRUE OF THE WHOLE PANEL, AND THE PREMISE IS ASSERTED.** MEASURED: 20 pads
   * of 20, 8 rotaries of 8 and 2 wheels of 2 are disabled, because this page is
   * a picture of somebody else's instrument and nothing on it is bound to
   * anything. A page where some controls were live would have to mark only the
   * labels naming the dead ones, so the check below refuses the day that
   * becomes true here rather than letting these labels quietly start lying.
   * ⚠️ THE NAMEPLATE IS NOT SWEPT and cannot be: `.pan-plate-l` is neither
   * `.pan-sub` nor `.pan-cap`, because the make and the model name no control.
   */
  for (const lab of card.querySelectorAll('.pan-sub, .pan-cap')) lab.dataset.off = '1';

  // ── the MIDI event log ──────────────────────────────────────────────────

  /**
   * 🔴 WHAT ARRIVED, IN COLUMNS, BESIDE THE PANEL IT MOVED. Asked 2026-09-21:
   * *"add midi event logs to circuit and rack demos"*, and this page was built
   * the same hour, so it carries the same table.
   * 🔴 **THE READING NEVER REPLACES THE BYTES.** That is `/dump/`'s whole
   * design and the reason `midi-decode.mjs` returns both: a relative encoder
   * reads as a position if all you have is an interpretation, and the panel
   * above is exactly an interpretation.
   * ⚠️ **CLOCK AND ACTIVE SENSING ARE COUNTED AND NEVER LISTED.** `decode`
   * flags them as a flood. A table that printed them would be a table nobody
   * can read a second after the button is pressed.
   */
  const traffic = createMidiLog({ empty: 'press the status button, then play something' });
  d.el.append(traffic.el);

  // ── what arrives ────────────────────────────────────────────────────────

  let access = null;
  let notes = 0, vLo = null, vHi = null, bendRaw = null;
  const chSeen = new Set(), ccSeen = new Set(), offGrid = new Set();
  /** Controller number to the rotary now following it. See `take` below. */
  const knobCC = new Array(ROTARIES.length).fill(null);
  let flatSaid = false;

  /**
   * 🔴 THE CHANNEL, SAID ONCE, IN WORDS. This is where the readout's `channel`
   * cell went when the row was removed on 2026-09-21 (*"rm keys / velocity /
   * bend / channel in evo"*), and it had to go SOMEWHERE: deleting a display
   * without rehoming what it said is how a page quietly stops reporting
   * something, which is worse than reporting it badly.
   * 🔴 **AND OF THE FOUR IT WAS THE ONLY ONE THAT NEEDED A NEW HOME.** The
   * other three are already on screen twice over: the log lists every message
   * with its channel, its raw bytes and a reading, so `keys` and `velocity` are
   * in it row by row, and `bend` is the number under the wheel that just moved.
   * The channel was the odd one out because the cell showed the SET of channels
   * heard across the whole session, which is a fact about the instrument rather
   * than about any one message, and no row can carry it.
   * ⚠️ **IT IS WORTH A LINE BECAUSE THE ANSWER IS SURPRISING.** This keyboard's
   * global channel was measured as 2 rather than 1, which is the kind of thing
   * somebody rediscovers the hard way; `/bay/` carries a transform to
   * compensate for it. A log line fires when something happened rather than on
   * a clock, so it is the right surface for a fact that arrives once.
   * 🔴 **AND IT IS THE OBSERVATION, NOT THE EXPECTATION, WHICH IS WHY IT IS NOT
   * A SECOND COPY OF THE LINE THE PRESS ALREADY WRITES.** That one states what
   * was MEASURED, out of `GLOBAL_CH`. This one states what is ARRIVING, out of
   * the byte. Two independent sources, so they can disagree and say so, which
   * is the repair this project took from the MIM corpus: two numbers derived
   * from one field move together while being wrong.
   */
  const chSaid = new Set();
  function sayChannel(ch) {
    if (chSaid.has(ch)) return;
    chSaid.add(ch);
    const n = ch + 1;
    d.log(n === GLOBAL_CH
      ? `this keyboard is answering on channel ${n}, which is where it was measured`
      : `this keyboard is answering on channel ${n}, and it was measured on `
        + `${GLOBAL_CH}`, n === GLOBAL_CH ? undefined : 'warn');
  }

  function take(b) {
    const m = decode(b);
    /* The log refuses a flood itself and says so by returning false, which
       is the one place that policy lives. */
    if (!traffic.add(m)) return;
    if (m.ch !== null) { chSeen.add(m.ch); sayChannel(m.ch); }

    if (m.kind === 'note on' || m.kind === 'note off') {
      /**
       * 🔴 EVERY RELEASE ON THIS KEYBOARD IS A NOTE ON AT VELOCITY 0. Measured
       * 25 times, and **not one real `0x80` in the whole capture**. Anything
       * treating `0x90` as "on" leaves all 25 keys hanging, which is the trap
       * `midi-decode.mjs` exists to close, and this instrument is the live
       * example of it. The decoder has already resolved it above.
       */
      const idx = m.note - KEY_LO;
      if (idx < 0 || idx >= KEYS) {
        if (!offGrid.has(m.note)) {
          offGrid.add(m.note);
          d.log(`${noteName(m.note)}, note ${m.note}, is outside the 25 keys this `
              + 'panel draws, so it is listed and not lit', 'warn');
        }
        return;
      }
      if (m.kind === 'note on') {
        notes++;
        vLo = vLo === null ? m.d2 : Math.min(vLo, m.d2);
        vHi = vHi === null ? m.d2 : Math.max(vHi, m.d2);
        kbd.lightNote(m.note, true);
        /* The instrument shows a velocity briefly when a button in note mode is
           pressed, and a key is the same fact. Nothing on the wire says which
           slot a KEY is, and a key is not an assignable control, so the small
           field has nothing to say about it. */
        show(m.d2, '');
        if (!flatSaid && m.note < 48) {
          flatSaid = true;
          d.log('this keyboard is playing a semitone below where a 25 key '
              + 'controller sits, which is a transpose on the device rather '
              + 'than anything on this page', 'warn');
        }
      } else {
        kbd.lightNote(m.note, false);
      }
      return;
    }

    if (m.kind === 'pitch bend') {
      bendRaw = (m.d2 << 7) | m.d1;
      bend.set(bendRaw, { from: 'hardware' });
      /* ⚠️ AND THE DISPLAY SAYS NOTHING ABOUT IT, because the real one does
         not: there is no bend row in any reading the manuals print. A 14 bit
         value would also overflow a three digit field and show dashes, which
         would read as a fault rather than as a page declining to invent a
         reading. */
      return;
    }

    if (m.kind === 'control' && m.cc === 1) {
      mod.set(m.d2, { from: 'hardware' });
      /* 🔴 THE ONE CONTROL WHOSE SLOT AND CONTROLLER NUMBER ARE BOTH KNOWN, so
         it is the one reading where both fields of the display are filled: the
         panel prints `C10` under this wheel and the wire says CC 1. */
      show(m.cc, MOD_SLOT);
      return;
    }

    if (m.kind === 'control' && (m.cc === 0 || m.cc === 32)) return;   // the bank pair

    if (m.kind === 'program') {
      const p = padByDigit.get(String(m.d1));
      if (p) p.flash(160);
      else d.log(`program ${m.d1} arrived and this panel draws ten of them`, 'warn');
      /* The manual's own reading for a program change: the number in the three
         digits and the channel it went on in the two. */
      show(m.d1, m.ch === null ? '' : m.ch);
      return;
    }

    if (m.kind === 'control') {
      ccSeen.add(m.cc);
      /**
       * 🔴 THE POSITIONS ARE A MAP NOW AND THE BINDING IS STILL NOT. Knob `n`
       * on screen is the knob printed `Cn`, full stop, which is what the report
       * about the order was about and is fixed above by `ROTARIES`. What is
       * still unknown, and is unknown in the instrument rather than in this
       * page, is which of the eight slots sends a given controller number: it
       * is a per preset, per unit setting in non volatile memory and no manual
       * prints it.
       * ⚠️ **SO A CONTROLLER NUMBER FOLLOWS THE FIRST FREE ROTARY AND THE LOG
       * SAYS THAT IN THOSE WORDS.** It is an association this page made, never
       * a reading of the panel, and the difference is the `/circuit/` drum grid
       * mistake: that page coloured a pad by a note's position in a discovery
       * map and so reported the instrument while looking like it was reporting
       * the beat.
       * ⚠️ AND THE NUMBER GOES IN THE HOVER RATHER THAN UNDER THE DIAL, because
       * the face carries what the instrument prints on itself.
       */
      let slot = knobCC.indexOf(m.cc);
      if (slot < 0) {
        slot = knobCC.indexOf(null);
        if (slot < 0) return;             // nine controller numbers, eight knobs
        knobCC[slot] = m.cc;
        knobs[slot].el.title = `${ROTARIES[slot]}, a fully assignable rotary. `
          + `CC ${m.cc} is following it, which is the order that number arrived `
          + 'in rather than a reading of the panel';
        d.log(`CC ${m.cc} is following ${ROTARIES[slot]}. Nothing on the wire says `
            + 'which of the eight sent it, so that is an order of arrival');
      }
      knobs[slot].set(m.d2, { from: 'hardware' });
      /* The instrument's default reading: the controller number in the three
         digits. The two digits stay blank because the slot is the unknown. */
      show(m.cc, '');
    }
  }

  async function open() {
    if (!navigator.requestMIDIAccess) {
      d.log('this browser has no Web MIDI, so nothing can reach this panel', 'warn');
      return false;
    }
    try {
      access = await navigator.requestMIDIAccess({ sysex: false });
      for (const p of access.inputs.values()) {
        /* 🔴 `port.open()`, WHICH THE SPECIFICATION SAYS IS IMPLICIT AND IS
           NOT RELIABLE. Measured 2026-09-20: four live instruments read as an
           empty room because every port sat `connected/closed`. A page with
           closed ports is pixel for pixel a page watching a silent one. */
        try { await p.open(); } catch { /* another client may hold it */ }
        p.onmidimessage = (e) => take(Array.from(e.data));
      }
      return true;
    } catch (e) {
      d.log(`MIDI was refused: ${e.message}`, 'warn');
      return false;
    }
  }

  const pres = createPresenceButton({
    of: 'MK-425C', state: 'unknown',
    can: ['unknown', 'checking', 'online', 'offline'],
    press: () => d.run('listen'),
  });
  d.controls.hidden = false;
  d.controls.append(pres.el);

  d.on('listen', async () => {
    pres.set('checking');
    if (await open()) {
      /* ⚠️ ONLINE MEANS A PORT WITH THIS NAME ON IT, NOT THAT MIDI WAS GRANTED.
         Permission is a fact about the browser and presence is a fact about the
         desk, and reporting the first as the second says `online` about an
         empty room. */
      const seen = [...(access?.inputs?.values() ?? [])]
        .filter((i) => /mk-?4\d\dc|evolution/i.test(i.name || ''));
      pres.set(seen.length ? 'online' : 'offline',
        seen.length ? null : 'nothing with MK-425C in its name is plugged in');
      d.log('this page only listens. Play a key, turn a knob, move either wheel, '
          + 'and the panel follows it.');
      d.log(`the global channel was measured at ${GLOBAL_CH} rather than 1, and every `
          + 'control on this keyboard can carry its own, so the channel column is '
          + 'worth watching.');
    } else {
      pres.set('offline', 'this browser would not open MIDI');
    }
    if (SELFCHECK) await d.run('check');
  });

  // ── checks ──────────────────────────────────────────────────────────────

  d.on('check', async () => {
    const ch = GLOBAL_CH - 1;
    take([0x90 | ch, 47, 96]);                       // lowest key, measured range
    take([0x90 | ch, 71, 45]);                       // highest key
    take([0x90 | ch, 71, 0]);                        // a release, as this keyboard sends one
    take([0xe0 | ch, 0x00, 0x40]);                   // bend, LSB 0 as measured
    take([0xb0 | ch, 1, 100]);                       // mod wheel

    /**
     * 🔴 THE DISPLAY'S OWN RULE, ASSERTED AT THE ONE MOMENT BOTH FIELDS CAN BE
     * FILLED. The mod wheel is the only control on this instrument whose slot
     * AND controller number are both known, so it is the only reading where the
     * small field has anything to say. Asserted here rather than at the end,
     * because the next few messages replace it.
     */
    d.assert('the mod wheel fills both fields, because its slot is printed on the panel',
      disp3.text().trim() === '1' && disp2.text().trim() === String(MOD_SLOT),
      `three digits "${disp3.text()}", two digits "${disp2.text()}"`);

    for (const cc of KNOB_CC_SEEN) take([0xb0 | ch, cc, 64]);

    // ⚠️ THE NEGATIVE HALF, and it is the whole point of the field: a rotary's
    // slot is NOT on the wire, so the small field must go back to saying
    // nothing rather than keeping the wheel's answer or printing a zero.
    d.assert('and a rotary fills only the value, because nothing says which slot sent it',
      disp3.text().trim() === String(KNOB_CC_SEEN[KNOB_CC_SEEN.length - 1])
        && disp2.text().trim() === '',
      `three digits "${disp3.text()}", two digits "${disp2.text()}"`);

    take([0xb0 | ch, 32, 0]); take([0xb0 | ch, 0, 0]); take([0xc0 | ch, 3]);   // a button
    take([0xf8]); take([0xfe]);                      // floods

    d.assert('a visit opened nothing', SELFCHECK ? true : access === null,
      access ? 'access taken after a press' : 'no MIDI access taken');

    d.assert('the keyboard is 25 keys and it is drawn where the wire says',
      kbd.notes().length === KEYS && kbd.notes()[0] === KEY_LO,
      `${kbd.notes().length} keys from ${kbd.notes()[0]}`);

    /**
     * 🔴 THE ONE THAT MATTERS ON THIS INSTRUMENT. A release arrives as a note
     * on at velocity 0 and there is no `0x80` anywhere in its traffic, so a
     * page that took `0x90` for "on" would hold every key it was ever sent.
     */
    /* ⚠️ COUNTED OFF THE PAINTED KEYS, because the keyboard publishes no list
       of what is held and an assert written against a method it does not have
       would be satisfied by that absence. Two keys were struck and the higher
       one was released, so exactly one stays down. */
    const held = () => keysBox.querySelectorAll('.down').length;
    d.assert('a note on at velocity 0 releases the key it lit',
      held() === 1, `${held()} keys held after two on and one release`);

    d.assert('the lowest key is a semitone below where a 25 key controller sits',
      KEY_LO === 47 && flatSaid, `base ${KEY_LO}, said ${flatSaid}`);

    d.assert('the bend is read little endian and fourteen bit',
      bendRaw === 8192, String(bendRaw));

    // ⚠️ AND THE NEGATIVE HALF, because a reader that returned a plausible
    // number for any input would pass the line above.
    take([0xe0 | ch, 0x7f, 0x7f]);
    d.assert('and a full scale bend reads 16383, not 255',
      bendRaw === 16383, String(bendRaw));

    d.assert('the modulation wheel is CC 1 and moved',
      mod.hardwareMoves() > 0, `${mod.hardwareMoves()} moves`);

    /* ⚠️ OFF THE KNOBS' OWN COUNTERS RATHER THAN OFF THIS PAGE'S BOOKKEEPING,
       so the claim is about what moved rather than about what was recorded. */
    const moved = knobs.filter((k) => k.hardwareMoves() > 0).length;
    d.assert('six measured controller numbers moved six of the eight rotaries',
      moved === KNOB_CC_SEEN.length, `${moved} of ${knobs.length} moved`);

    d.assert('and two rotaries were never moved, and say nothing about it',
      knobs.length - moved === 2, `${knobs.length - moved} still at rest`);

    d.assert('a program change lit a keypad button and the bank pair in front of it did not',
      !!padByDigit.get('3') && !knobCC.includes(0) && !knobCC.includes(32),
      `rotary numbers ${knobCC.filter((c) => c !== null).join(',')}`);

    d.assert('the channel heard is reported rather than assumed',
      [...chSeen].includes(GLOBAL_CH), `channels ${[...chSeen].join(',')}`);

    d.assert('no flood reached the table',
      !traffic.el.textContent.includes('F8') && !traffic.el.textContent.includes('FE'),
      `${traffic.count()} rows`);

    d.assert('every row kept its raw bytes beside the reading',
      Array.from(traffic.el.querySelectorAll('.pos-tbl-row:not(.pos-tbl-head)'))
        .every((t) => /[0-9A-F]{2}/.test(t.textContent)), `${traffic.count()} rows`);

    /**
     * 🔴 THE PANEL'S COUNTS, WHICH ARE WHERE A REPLICA GOES WRONG FIRST. Six
     * function buttons and five dual press labels is a 425C; eight and eight is
     * a 449C, and a cover photograph in one of this instrument's own manuals is
     * a third keyboard entirely.
     */
    d.assert('six function buttons, and five dual press labels one to a pair',
      fnPads.length === 6 && fnRow.querySelectorAll('.evo-fn-pair').length === 5
        && fnRow.querySelectorAll('.evo-fn-lab').length === 6,
      `${fnPads.length} buttons, ${fnRow.querySelectorAll('.evo-fn-lab').length} names, `
      + `${fnRow.querySelectorAll('.evo-fn-pair').length} pairs`);

    /**
     * 🔴 THE DISPLAY IS TWO FIELDS, READ OFF THE PICTURE RATHER THAN OFF THE
     * OPTIONS IT WAS BUILT WITH. Seven bars a digit, so three digits is 21
     * polygons and two is 14, and a field that quietly came back with a
     * different number of cells could not pass this while `digits` still said
     * the right thing.
     */
    const bars3 = disp3.svg.querySelectorAll('.pos-disp-p').length;
    const bars2 = disp2.svg.querySelectorAll('.pos-disp-p').length;
    d.assert('the display is a three digit field and a two digit one in one window',
      bars3 === 21 && bars2 === 14
        && disp3.el.parentElement === win && disp2.el.parentElement === win
        && disp3.el.classList.contains('pos-disp-bare')
        && disp2.el.classList.contains('pos-disp-bare'),
      `${bars3} bars and ${bars2} bars, both bare inside one window`);

    if (d.el.isConnected) {
      /**
       * 🔴 BOTH FIELDS ARE THE BACKLIT KIND AND THE WINDOW THEY SIT IN AGREES.
       * The failure this catches is a page and a component disagreeing about
       * which instrument they are drawing, which is visible as a pane in one
       * scheme's colour behind digits in the other's.
       * ⚠️ IT SAID `reflective` UNTIL 2026-09-21 AND WAS RE-POINTED RATHER THAN
       * DELETED, when the panel was put back on `backlit` on instruction. The
       * claim worth keeping is that the page draws the display it says it draws;
       * which of the two it is is a decision above this check.
       * 🔴 **READ AS COMPUTED COLOUR AND AS A DIRECTION, NEVER AS A HEX.** A
       * check that names a colour is a second copy of the stylesheet and the two
       * will disagree: both ghost values moved twice in one afternoon and the
       * blue came a long way down in the same day. So the ink and the glass are
       * read off the rendered elements, the expectation is resolved from
       * `SCHEMES` through the browser so a comparison is about colour rather
       * than spelling, and the LAST clause is what makes it a display rather
       * than two matching strings: a backlit panel's ink is lighter than its
       * field, which is what the word means.
       */
      const resolve = (v) => {
        const probe = el('span');
        probe.style.color = v;
        d.el.append(probe);
        const out = getComputedStyle(probe).color;
        probe.remove();
        return out;
      };
      const lumOf = (css) => {
        const [r, g, b] = css.match(/\d+/g).map(Number).map((c) => c / 255);
        const f = (c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
        return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
      };
      const glass = getComputedStyle(win).backgroundColor;
      const inkSeen = getComputedStyle(disp3.el).color;
      const wantInk = resolve(SCHEMES.backlit.ink);
      const wantBack = resolve(SCHEMES.backlit.back);
      const glows = lumOf(inkSeen) > lumOf(glass);
      d.assert('the display is the backlit kind, its window agrees, and the ink is the lit half',
        disp3.el.dataset.scheme === 'backlit'
          && disp2.el.dataset.scheme === 'backlit'
          && inkSeen === wantInk && resolve(glass) === wantBack && glows,
        `${disp3.el.dataset.scheme} · ink ${inkSeen} against ${wantInk} · `
        + `glass ${glass} against ${wantBack} · ink lum `
        + `${lumOf(inkSeen).toFixed(3)} over field ${lumOf(glass).toFixed(3)}`);

      /* 🔴 EVERY LAYOUT CLAIM BELOW IS READ OFF A RENDERED RECT AND NOT OFF THE
         CODE THAT FILLED IT, because the defect this rebuild was handed was
         invisible in the source and obvious in a rect: a nameplate at x 1780 on
         a 1280 px screen, written by a `space-between` row that read as
         perfectly ordinary. */

      /**
       * 🔴 THE EIGHT ROTARIES READ `C1` TO `C8` IN LEFT TO RIGHT SCREEN ORDER.
       * Sorted by rect rather than by DOM order, so the printed divider that
       * sits between `C4` and `C5` cannot put them out of sequence and neither
       * can a `flex-direction` somebody changes later.
       */
      const rotNames = knobs
        .map((k) => ({ x: k.el.getBoundingClientRect().left,
                       t: k.el.querySelector('.pos-knob-lab')?.textContent.trim() }))
        .sort((a, b) => a.x - b.x).map((o) => o.t);
      /* 🔴 AGAINST THE NUMBERING SCHEME, NOT AGAINST `ROTARIES`, AND SABOTAGE
         IS WHAT FOUND THAT. The first version of this line compared the
         rendered labels against the same constant that had built them, so
         reversing that constant to `C8` first left it GREEN: two numbers
         derived from one field, which is the trap that re-credited a recording
         in the MIM corpus. The expectation is generated from the instrument's
         own flat one based numbering instead, which the research closes with no
         remainder across two models, so the printed list and the scheme are two
         sources and can disagree. */
      const scheme = Array.from({ length: 8 }, (_, i) => `C${i + 1}`);
      d.assert('the eight rotaries read C1 to C8 in left to right screen order',
        rotNames.join(' ') === scheme.join(' '), rotNames.join(' '));

      /**
       * 🔴 NOTHING ON THE PANEL PRINTS A CONTROLLER NUMBER OR THE WORD
       * `unbound`. Asked 2026-09-21: *"evolution: rm unbound labels and cc
       * labels on hw replicas in general"*. Scanned over what the panel
       * RENDERS, so a `sub` re-added anywhere on it fails this wherever it is
       * put, rather than only where somebody remembered to look.
       * ⚠️ THE DISPLAY IS EXEMPT BY CONSTRUCTION AND NOT BY AN EXCEPTION: it is
       * an SVG of polygons with no text nodes in it, and showing a controller
       * number is what the real display does.
       * ⚠️ THE DETAIL NAMES WHICH HALF FAILED, because the first version
       * reported "none of them a CC" while going red on the word `unbound`, and
       * a failure line that describes the passing half is one nobody can act on.
       */
      const printed = card.textContent.replace(/\s+/g, ' ');
      const badCC = printed.match(/cc\s*\d+/i);
      const badWord = printed.match(/unbound/i);
      d.assert('nothing on the panel prints a controller number or the word unbound',
        !badCC && !badWord,
        badCC || badWord
          ? `found "${(badCC || badWord)[0]}" in the printing`
          : `${printed.length} characters of printing, no CC and no unbound`);

      /* ⚠️ AND THE OTHER HALF, because deleting the display without rehoming
         the fact is how a page quietly stops reporting something. */
      const inHover = knobs.filter((k) => /CC \d+/.test(k.el.title || '')).length;
      d.assert('and the controller number survives in the rotary’s hover',
        inHover === KNOB_CC_SEEN.length, `${inHover} hovers name a CC`);

      /**
       * 🔴 NEITHER GROUP CARRIES A PRINTED LABEL, AND THAT IS TWO BARS AND THREE
       * CONNECTORS GONE. Asked 2026-09-21: *"rm funciton buttons / assignable
       * buttons labels"* and *"no need to snapshot and funciton button separator
       * lines"*. Checked over the panel's rendered text so the words cannot come
       * back anywhere on it, and over the elements so a removed one cannot leave
       * this assert green against nothing.
       */
      const noBars = !/FUNCTION BUTTONS|ASSIGNABLE BUTTONS/i.test(printed)
        && card.querySelectorAll('.evo-bar, .pos-sec-h, .evo-join, .evo-snap-brk,'
          + ' .evo-oct-brk').length === 0;
      d.assert('neither group carries a printed label, and no connector survives',
        noBars, noBars ? 'no bars, no headings, no connectors'
          : 'a bar, a heading or a connector is still drawn');

      /* ⚠️ AND THE FACT THE `ASSIGNABLE` BAR CARRIED IS REHOMED RATHER THAN
         DELETED. Twelve blank keys with no name anywhere read as broken rather
         than as blank on purpose, so the word is in the group's hover. */
      /* ⚠️ THE DETAIL QUOTES THE HOVER RATHER THAN DESCRIBING IT, because the
         first version printed "the keypad group says so on hover" while going
         red, which is a failure line describing the thing that did not happen. */
      d.assert('and the word assignable survives in the keypad’s hover',
        /assignable/i.test(keypadBox.title || ''),
        keypadBox.title ? `hover reads "${keypadBox.title.slice(0, 44)}…"` : 'no hover at all');

      /**
       * 🔴 THE KEYPAD IS THREE ACROSS AND FOUR DOWN, counted off distinct rect
       * columns and rows rather than off the `cols` and `rows` handed to the
       * grid, which is the same two-numbers-from-one-field trap the corpus
       * build shipped once.
       */
      const cells = [...keypad.el.querySelectorAll('.pos-pad')]
        .map((b) => { const r = b.getBoundingClientRect();
                      return { x: Math.round(r.left), y: Math.round(r.top),
                               w: r.width, h: r.height,
                               t: b.parentElement.querySelector('.pos-pad-top').textContent }; });
      const cols = new Set(cells.map((c) => c.x)), rows = new Set(cells.map((c) => c.y));
      d.assert('the keypad is three across and four down',
        cells.length === 12 && cols.size === 3 && rows.size === 4,
        `${cells.length} buttons in ${cols.size} columns and ${rows.size} rows`);

      /**
       * 🔴 AND ITS BUTTONS ARE HALF HEIGHT, MEASURED OFF THE BUTTON AND NOT OFF
       * THE WRAPPER. Asked 2026-09-21: *"evo: half height buttons in numpad"*.
       * `.pos-pad-half` is *"same width, half the height"*, and its own comment
       * records that it was `aspect-ratio: 2 / 1` for an hour, which is the same
       * thing only while the width is fixed. So the WIDTH is asserted too: this
       * has to be a height change and not a scale-down.
       */
      const halves = cells.filter((c) => Math.abs(c.h - c.w / 2) < 1).length;
      const fullWidth = cells.filter((c) => Math.abs(c.w - 46) < 1).length;
      d.assert('the keypad buttons are half height, and only their height changed',
        halves === 12 && fullWidth === 12,
        `${cells[0].w.toFixed(0)} by ${cells[0].h.toFixed(0)} px, ${halves} of 12 half`);

      /**
       * 🔴 AND 0 SITS IN THE BOTTOM ROW BETWEEN `-` AND `+`. The old page drew
       * `0` to `9` in source order, so `0` came first, and `1 2 3` on the bottom
       * row is the easiest mistake available here.
       */
      const lastY = Math.max(...rows);
      const bottom = cells.filter((c) => c.y === lastY).sort((a, b) => a.x - b.x)
        .map((c) => c.t);
      const topRow = cells.filter((c) => c.y === Math.min(...rows))
        .sort((a, b) => a.x - b.x).map((c) => c.t);
      d.assert('and 0 sits in the bottom row between - and +, with 1 2 3 on top',
        bottom.join('') === `${MINUS}0+` && topRow.join('') === '123',
        `top "${topRow.join(' ')}", bottom "${bottom.join(' ')}"`);

      /**
       * 🔴 EACH DUAL PRESS NAME IS CENTRED ON THE MIDPOINT OF ITS PAIR, AND
       * THIS ASSERT EXISTS BECAUSE THE CONNECTOR WENT. With a rule and a tick
       * drawn from the label to both buttons, centring was decoration. With them
       * gone it is the only thing saying the name belongs to both rather than to
       * the left one, so it is now load-bearing and is measured.
       */
      const pairLabs = [...fnRow.querySelectorAll('.evo-fn-pair')];
      const offBy = pairLabs.map((lab, i) => {
        const a = fnPads[i].button.getBoundingClientRect();
        const b = fnPads[i + 1].button.getBoundingClientRect();
        const l = lab.getBoundingClientRect();
        return Math.abs((l.left + l.width / 2) - (a.left + a.width / 2
          + (b.left + b.width / 2 - (a.left + a.width / 2)) / 2));
      });
      d.assert('each dual press name is centred across the pair it belongs to',
        pairLabs.length === 5 && Math.max(...offBy) < 1,
        `worst ${Math.max(...offBy).toFixed(2)} px off its pair's midpoint`);

      /**
       * 🔴 THE NAMEPLATE SITS BETWEEN THE OCTAVE PAIR AND THE ROTARIES, INSIDE
       * THE STRIP'S OWN CONTENT. Asked 2026-09-21: *"evolution title + model nr
       * goes to the right of transpose, centered, scrolls with overflow"*, so it
       * is no longer asserted to be on screen at load: it legitimately may not
       * be, and scrolling reaches it.
       * ⚠️ **THIS IS STILL THE ASSERT THAT WOULD HAVE CAUGHT THE ORIGINAL BUG.**
       * That was not *a nameplate inside a scroller*: it was a `space-between`
       * row stretched across the panel, which put `MK-425C` at x 1780 in a
       * 1280 px window, past the end of everything. A block between two known
       * neighbours whose centre falls inside the strip's own content cannot land
       * there.
       */
      const pr = plate.getBoundingClientRect();
      const or = oct.getBoundingClientRect();
      const rr = rot.getBoundingClientRect();
      const fr = flow.getBoundingClientRect();
      const mid = pr.left + pr.width / 2;
      d.assert('the nameplate sits between the octave pair and the rotaries, inside the strip',
        pr.width > 0 && or.right <= pr.left + 1 && pr.right <= rr.left + 1
          && mid > fr.left && mid < fr.right,
        `${(pr.left - or.right).toFixed(0)} px after TRANSPOSE, `
        + `${(rr.left - pr.right).toFixed(0)} px before C1, centre `
        + `${(mid - fr.left).toFixed(0)} of ${fr.width.toFixed(0)} px of panel`);

      /**
       * 🔴 THE LEFT COLUMN HOLDS STILL WHILE THE STRIP SCROLLS, which is the
       * whole of what *"left is sticky area"* asked for and is the one claim a
       * screenshot cannot make.
       * ⚠️ IT PUTS THE SCROLL BACK. A check that leaves a page moved is the test
       * rather than a check, and this project has already destroyed a
       * self-moving zoom with one.
       */
      const range = strip.scrollWidth - strip.clientWidth;
      const by = Math.min(180, range);
      const fixed0 = fixed.getBoundingClientRect().left;
      const keys0 = keysBox.getBoundingClientRect().left;
      strip.scrollLeft = by;
      const fixed1 = fixed.getBoundingClientRect().left;
      const keys1 = keysBox.getBoundingClientRect().left;
      strip.scrollLeft = 0;

      d.assert('the left column holds still while the strip scrolls',
        by > 20 && Math.abs(fixed1 - fixed0) < 0.5 && keys0 - keys1 > by - 2,
        `column moved ${(fixed1 - fixed0).toFixed(1)} px, keys moved `
        + `${(keys0 - keys1).toFixed(1)} of ${by}`);

      /**
       * 🔴 AND ITS RIGHT BORDER IS WHERE THE SCROLLING STARTS, WHICH IS THE
       * AFFORDANCE. Asked 2026-09-21: *"rm shade on evolution overflow"*, and
       * the edge gradient that used to say this came off. A border does the same
       * job in a channel that does not read as a rendering fault: this project
       * has measured that a scroller with nothing marking it reads as a clipped
       * picture, which is how this page was reported in the first place.
       * ⚠️ **THE COMPUTED VALUE, NEVER THE DECLARATION.** `.pos-glue` exists for
       * children giving up their border and radius, and a border stripped by a
       * rule nobody wrote is this project's fifth measured dead rule.
       * ⚠️ AND THE OVERFLOW IS ASSERTED WITH IT, because a border marking the
       * edge of a scroll region that has nothing behind it is decoration.
       */
      const bw = parseFloat(getComputedStyle(fixed).borderRightWidth);
      d.assert('the left column’s right border is where the scrolling starts',
        bw >= 1 && range > 40,
        `${bw} px of border, ${range.toFixed(0)} px of panel off screen`);

      /**
       * 🔴 THE LEFT COLUMN IS THE FULL DEPTH OF THE PANEL. `align-items:
       * stretch` rather than `flex-end`, and the difference is invisible until
       * somebody changes it: bottom alignment makes two children END together
       * and says nothing about their heights, which is what `/model/` was
       * reported for with a screenshot.
       */
      const fh = fixed.getBoundingClientRect().height;
      const sh = strip.getBoundingClientRect().height;
      d.assert('the left column is the full depth of the panel',
        Math.abs(fh - sh) < 1.5, `${fh.toFixed(1)} px against ${sh.toFixed(1)}`);

      /**
       * 🔴 AND THE DIVIDER REACHES THE CARD'S OWN EDGES, WHICH IS A DIFFERENT
       * CLAIM FROM THE ONE ABOVE AND WAS FALSE WHILE THAT ONE PASSED. Asked
       * 2026-09-21: *"evo border on right sticky panel should extend to top and
       * bottom of the panel"*. The column was already the full height of the
       * card's CONTENT box, which is what the assert above measures, and the
       * card's own `padding: 20px` still sat between each end of the border and
       * the card's visible edge. `column depth == strip depth` is exactly the
       * kind of agreement that reads as done: both halves were right and both
       * were inside the padding.
       * 🔴 **BOTH ENDS, SEPARATELY.** Two alignments that look like one are two
       * asserts: this project has measured a case where two of three lined up
       * while the third was 30 px out, and another where two boxes matched
       * perfectly while the faders inside them were 17 px apart. One assert on
       * one end would pass while the other end was wrong, and a border short at
       * the bottom only is exactly what a `padding-bottom` nobody cancelled
       * looks like.
       * ⚠️ AGAINST THE CARD'S INNER EDGE, meaning just inside its own 1 px
       * border, because that is the line a reader sees as the edge of the panel.
       */
      const cardBox = card.getBoundingClientRect();
      const cardCs = getComputedStyle(card);
      const cardTopIn = cardBox.top + parseFloat(cardCs.borderTopWidth);
      const cardBotIn = cardBox.bottom - parseFloat(cardCs.borderBottomWidth);
      const colBox = fixed.getBoundingClientRect();
      const overTop = colBox.top - cardTopIn;
      const underBot = cardBotIn - colBox.bottom;
      d.assert('the divider starts at the panel’s top edge',
        Math.abs(overTop) < 1.5,
        `${overTop.toFixed(2)} px of card between the two, card padding-top `
        + `${cardCs.paddingTop}`);
      d.assert('and it finishes at the panel’s bottom edge',
        Math.abs(underBot) < 1.5,
        `${underBot.toFixed(2)} px of card between the two, card padding-bottom `
        + `${cardCs.paddingBottom}`);

      /**
       * 🔴 THE AIR ABOVE THE KEYBOARD, AND THAT IT IS THE CONTAINER'S. Asked
       * 2026-09-21: *"more space on top of keyboard"*. All three of the
       * quantities that make up this distance measured ZERO before the change:
       * the row's foot (a 24 px label band its two-line names fill completely),
       * the gap (a flex column with no `gap`), and the keyboard's head (the
       * kit's `.kbd` margins are overridden to nothing in this file).
       * ⚠️ **THE NEGATIVE HALF IS WHICH ONE MOVED**, and it is the point of the
       * assert rather than a flourish. A margin on the keyboard would satisfy
       * "there is air above the keys" and would be the page correcting for its
       * container, which breaks the moment the container changes. So this
       * requires the distance to equal the container's own `row-gap` AND both
       * children to contribute no margin of their own.
       */
      const rowBox = row.getBoundingClientRect();
      const keysBoxR = keysBox.getBoundingClientRect();
      const air = keysBoxR.top - rowBox.bottom;
      const flowGap = parseFloat(getComputedStyle(flow).rowGap);
      const rowFoot = parseFloat(getComputedStyle(row).marginBottom);
      const keysHead = parseFloat(getComputedStyle(keysBox).marginTop);
      d.assert('the keys sit clear of the back strip, on the container’s own gap',
        air > 8 && Math.abs(air - flowGap) < 1.5 && rowFoot === 0 && keysHead === 0,
        `${air.toFixed(2)} px of air against a row-gap of ${flowGap} px · `
        + `row margin-bottom ${rowFoot}, keys margin-top ${keysHead}`);

      /**
       * 🔴 ONE SCROLLER ON THIS PAGE AND NOT TWO. `.keys` brings its own
       * `overflow-x: auto`, so a keyboard squeezed narrower than its keys
       * scrolls INSIDE the strip that is supposed to be scrolling it, and a
       * reader dragging the outer one gets the inner one.
       */
      const inner = keysBox.querySelector('.keys');
      d.assert('the keyboard does not scroll inside the strip',
        inner.scrollWidth <= inner.clientWidth + 1,
        `${inner.scrollWidth} of key in ${inner.clientWidth} px of room`);

      /**
       * 🔴 THE ASSERT THAT WOULD HAVE CAUGHT TWENTY FIVE WHITE KEYS, AND THE
       * REASON IT IS READ OFF THE RENDERED PICTURE. The old page asserted
       * `kbd.notes()`, which said 25 notes from 47, was perfectly true, and was
       * blind to the drawing having no black keys in it at all. MEASURED before
       * this rebuild: 25 white, 0 black, `--k-cols: 25`.
       * ⚠️ SORTED BY CENTRE, NOT BY DOM ORDER OR BY LEFT EDGE. A black key
       * straddles the join between its two whites and is pulled back by half its
       * own width, so its LEFT edge is left of the white it comes after. Its
       * centre is between the two, which is what a reader sees.
       */
      const drawn = [...keysBox.querySelectorAll('.k')]
        .map((k) => { const r = k.getBoundingClientRect();
                      return { c: r.left + r.width / 2,
                               t: k.classList.contains('sharp') ? 'B' : 'W' }; })
        .sort((a, b) => a.c - b.c).map((o) => o.t).join('');
      d.assert('the keys are 15 white and 10 black, in groups of two and three',
        drawn === KEY_PATTERN,
        `${drawn.split('W').length - 1} white and ${drawn.split('B').length - 1} black, `
        + `${drawn === KEY_PATTERN ? 'in the pattern the photographs show' : drawn}`);

      /**
       * 🔴 THE WHEELS ARE LEFT OF THE KEYS AND ARE THE FRONTMOST THING ON THE
       * PANEL, WHICH IS THE CLAIM THIS ASSERT USED TO GET HALF RIGHT. It said
       * they *"end on their line"*, and they do not: on the instrument they sit
       * at the very edge of the case nearest the player, lower than the keys'
       * back edge, with nothing in front of them. So the test is that nothing in
       * their own column is below them.
       */
      /* 🔴 THE ROW, NEVER `.evo-wheels`, AND SABOTAGE IS WHAT FOUND THAT.
         `.evo-wheels` is the full-width container that CENTRES the row, so its
         own rect is the column's rect whatever is inside it: switching the
         centring off left the assert below fully green, because the box it was
         measuring had not moved and never could. That is this project's rule
         about measuring the working surface rather than the wrapper, which it
         already paid for once reading a pad's `el` instead of its `button`. */
      const keysR = keysBox.getBoundingClientRect();
      const wheelR = wheelRow.getBoundingClientRect();
      /* 🔴 THE COLUMN'S CONTENT BOTTOM, NOT ITS BOX BOTTOM, AND THIS ASSERT WENT
         RED TEACHING THE DIFFERENCE. It read the box bottom, which was the same
         line until the column took over the card's vertical inset so its right
         border could reach the card's edges: after that the box ended 20 px
         below the last control in it and this failed at `20.0 px behind the
         column's foot` with nothing in the column changed. That is the standing
         rule about measuring the working surface rather than the wrapper,
         arriving one level up from the pad it was written about. The claim here
         is that nothing is drawn BELOW the wheels, so the line to compare with
         is where the column's content stops. */
      const fixedCs = getComputedStyle(fixed);
      const colFoot = fixed.getBoundingClientRect().bottom
        - parseFloat(fixedCs.paddingBottom) - parseFloat(fixedCs.borderBottomWidth);
      d.assert('the wheels are left of the keys and nothing in their column is in front of them',
        wheelR.right <= keysR.left + 1 && colFoot - wheelR.bottom < 2,
        `${(keysR.left - wheelR.right).toFixed(1)} px left of the keys, `
        + `${(colFoot - wheelR.bottom).toFixed(1)} px behind the column's content foot`);

      /**
       * 🔴 AND THEY ARE CENTRED, WHICH IS TWO CENTRES ON THIS PANEL AND BOTH ARE
       * MEASURED. Asked 2026-09-21: *"align pitch / mod to centr"*. The column's
       * own centre is one reading of that and the keypad above them is the other,
       * and they coincide here only because the keypad is the widest thing in the
       * column. Asserting both rather than picking is the `/model/` lesson: that
       * page was corrected by screenshot twelve times in one evening and every
       * correction was plausible reasoning a rect would have refused.
       */
      const wc = wheelR.left + wheelR.width / 2;
      const kpr = keypadBox.getBoundingClientRect();
      const fixr = fixed.getBoundingClientRect();
      /* ⚠️ THE COLUMN'S RIGHT PADDING IS READ, NOT TYPED. It was a literal `16`
         here, which is the same distance as `--pan-gap` in this page's styles:
         one measurement in two places, which is the defect that cost this
         project a row snapping back to the width of one word three reports
         running. The computed value cannot disagree with the stylesheet. */
      const colPadR = parseFloat(getComputedStyle(fixed).paddingRight);
      const offCol = Math.abs(wc - (fixr.left + (fixr.width - bw - colPadR) / 2));
      const offPad = Math.abs(wc - (kpr.left + kpr.width / 2));
      d.assert('the wheels are centred in the column and under the keypad',
        offCol < 1.5 && offPad < 1.5,
        `${offCol.toFixed(1)} px off the column's centre, `
        + `${offPad.toFixed(1)} px off the keypad's`);

      /**
       * 🔴 `MAX` AND `MIN` MARK THE ENDS OF THE TRAVEL, ON BOTH LANES AT ONCE,
       * AND THAT IS TWO ALIGNMENTS RATHER THAN ONE. Photographed on the first
       * run of this rebuild sitting level with the value readout and the slot
       * number instead, which is what `space-between` over a whole column gets
       * you: two correct labels attached to the wrong things.
       * ⚠️ AND THE RENDERED TEXT IS GRADED, NOT THE SOURCE, because several kit
       * components uppercase a label in CSS whatever is typed and a
       * `toUpperCase()` on top of one is a no-op that reads as a fix.
       */
      const lanes = [...wheels.querySelectorAll('.pos-fdr-lane')]
        .map((l) => l.getBoundingClientRect());
      const maxEl = wheelMid.firstElementChild, minEl = wheelMid.lastElementChild;
      const maxR = maxEl.getBoundingClientRect(), minR = minEl.getBoundingClientRect();
      const topGap = Math.max(...lanes.map((l) => Math.abs(l.top - maxR.top)));
      const botGap = Math.max(...lanes.map((l) => Math.abs(l.bottom - minR.bottom)));
      const ink = (e) => {
        const t = getComputedStyle(e).textTransform;
        const s = (e.textContent || '').trim();
        return t === 'uppercase' ? s.toUpperCase() : t === 'lowercase' ? s.toLowerCase() : s;
      };
      d.assert('MAX and MIN sit at the ends of both wheels’ travel, in uppercase',
        lanes.length === 2 && topGap < 2 && botGap < 2
          && ink(maxEl) === 'MAX' && ink(minEl) === 'MIN',
        `"${ink(maxEl)}" is ${topGap.toFixed(1)} px off both lane tops, `
        + `"${ink(minEl)}" ${botGap.toFixed(1)} px off both bottoms`);

      /**
       * 🔴 BOTH WHEEL NAMES ARE ONE LINE, SO THEIR SLOT NUMBERS LAND LEVEL.
       * Asked 2026-09-21: *"pichbend single word"*. `PITCH BEND` had a space to
       * break at and `MODULATION` did not, so one name was two lines and the
       * other one, and `C9` ended up **12.34 px below `C10`** on a pair of
       * controls that are identical in every other respect.
       * ⚠️ **THE SLOT NUMBERS ARE THE HALF WORTH ASSERTING**, because they are
       * the visible consequence and they are downstream of the cause. A check
       * that only counted lines would pass a future label that wraps somewhere
       * this page does not look, and a check that only compared the two numbers
       * would pass two names that both wrapped.
       */
      const wlabs = [...wheels.querySelectorAll('.pos-fdr-lab')];
      const wsubs = [...wheels.querySelectorAll('.pos-fdr-sub')];
      const lineOf = (e) => e.getBoundingClientRect().height
        / parseFloat(getComputedStyle(e).lineHeight);
      const lines = wlabs.map(lineOf);
      const subSkew = Math.abs(wsubs[0].getBoundingClientRect().top
        - wsubs[1].getBoundingClientRect().top);
      d.assert('neither wheel’s name wraps, so both slot numbers sit on one line',
        wlabs.length === 2 && wsubs.length === 2
          && lines.every((n) => n < 1.5) && subSkew < 1.5,
        `${wlabs.map((e, i) => `"${e.textContent.trim()}" ${lines[i].toFixed(2)} line(s)`).join(', ')}`
        + ` · slot numbers ${subSkew.toFixed(2)} px apart`);

      /**
       * 🔴 AND THE WIDTH DECISION IS ASSERTED RATHER THAN ASSUMED, because the
       * names are deliberately allowed to overflow their wheels and that is only
       * safe while they do not touch. Both are wider than the 46 px control
       * under them, which is what the real panel prints; the clearance between
       * them is the whole reason `overflow: visible` is the right answer here
       * rather than a cut.
       */
      const lr = wlabs.map((e) => {
        const r = e.getBoundingClientRect();
        const w = e.scrollWidth;
        const mid = r.left + r.width / 2;
        return { lo: mid - w / 2, hi: mid + w / 2, w, box: r.width };
      }).sort((a, b) => a.lo - b.lo);
      const clear = lr[1].lo - lr[0].hi;
      d.assert('both names are wider than their wheels and still do not touch',
        lr.every((x) => x.w > x.box) && clear > 4,
        `${lr.map((x) => `${x.w} px of name in a ${x.box} px box`).join(', ')} · `
        + `${clear.toFixed(1)} px of clear air between them`);

      /**
       * ⚠️ AND NOTHING ON THE PANEL IS CUT WITH AN ELLIPSIS, which this project
       * treats as the signal that a word is in the wrong place rather than as a
       * way of fitting it. `PITCH …` and `MODULA…` were both photographed on the
       * first run of this rebuild.
       * 🔴 **CUT IS NOT THE SAME AS WIDER THAN ITS CONTROL, AND THE FIRST
       * VERSION OF THIS CHECK CONFLATED THEM.** It read `scrollWidth >
       * clientWidth` alone and failed on `MODULATION`, which is one unbreakable
       * word 66 px long over a 46 px wheel and is drawn IN FULL, because the box
       * does not clip. That is what the panel does: every printed name on this
       * instrument is wider than the control under it. A name is cut when it
       * overflows a box that CLIPS, so the test asks the computed overflow too.
       */
      const cut = [...card.querySelectorAll('.pos-fdr-lab, .pos-fdr-sub, .pos-pad-top, '
        + '.pos-pad-bot, .pos-pad-face, .pos-knob-lab')]
        .filter((e) => e.scrollWidth > e.clientWidth + 1
                    && getComputedStyle(e).overflowX !== 'visible')
        .map((e) => e.textContent.trim());
      d.assert('no name on the panel is cut short',
        cut.length === 0, cut.length ? `cut: ${cut.join(', ')}` : 'nothing truncated');

      /**
       * 🔴 EVERY PRINTED NAME ON THIS DEAD PANEL IS DIM, MEASURED AS CONTRAST
       * AND NOT AS A CLASS NAME. Reported 2026-09-21: *"on dislable pad buttons
       * make labels way lighter"*, because the names were the brightest thing in
       * a set of controls nobody can press.
       * 🔴 **READ AS EFFECTIVE INK, WHICH IS THE ONLY HONEST READING.** A
       * label's own `color` says nothing about what a reader sees: the opacity
       * of every ancestor multiplies down onto it, and these names sit inside a
       * card, sometimes inside a group with a different background. So this
       * walks the tree for the accumulated alpha, composites over the real
       * ground, and computes a ratio. A check reading `color` would have passed
       * the whole time.
       * 🔴 **A CEILING AND A FLOOR, BECAUSE ONLY ONE OF THEM IS THE BUG THAT WAS
       * REPORTED AND BOTH ARE FAILURES.** The ceiling catches the dimming being
       * removed: before the change these ran **3.56 to 5.91:1** and the lowest
       * of them would fail a 3.0 ceiling, so the bound discriminates rather than
       * merely passing. The floor catches over-correcting, which the ask itself
       * warns about: text at the BUTTON's own .38 of `--dim2` measures 1.56:1
       * and has stopped being a label. Something a reader cannot read at all no
       * longer says what it is.
       * ⚠️ AND THE NAMEPLATE IS THE NEGATIVE CONTROL, ASSERTED SEPARATELY BELOW.
       * A check that pushed everything down would pass "the labels are dim" and
       * would have taken the make and model down with them.
       */
      const alphaOf = (e) => {
        let a = 1, n = e;
        while (n && n !== document.documentElement) {
          a *= parseFloat(getComputedStyle(n).opacity) || 0;
          n = n.parentElement;
        }
        return a;
      };
      const groundOf = (e) => {
        let n = e;
        while (n) {
          const c = getComputedStyle(n).backgroundColor.match(/[\d.]+/g);
          if (c && (c.length < 4 || Number(c[3]) > 0.9)) return c.slice(0, 3).map(Number);
          n = n.parentElement;
        }
        return [11, 14, 20];
      };
      const relLum = ([r, g, b]) => {
        const f = (c) => (c / 255 <= 0.03928 ? c / 255 / 12.92 : ((c / 255 + 0.055) / 1.055) ** 2.4);
        return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
      };
      const seenRatio = (e) => {
        const fg = getComputedStyle(e).color.match(/[\d.]+/g).slice(0, 3).map(Number);
        const bg = groundOf(e);
        const a = alphaOf(e);
        const mix = fg.map((v, i) => v * a + bg[i] * (1 - a));
        const [hi, lo] = [relLum(mix), relLum(bg)].sort((m, n) => n - m);
        return (hi + 0.05) / (lo + 0.05);
      };
      const dimmedNames = [...card.querySelectorAll('.pan-sub, .pan-cap')]
        .filter((e) => [...e.childNodes].some((n) => n.nodeType === 3 && n.textContent.trim()))
        .map((e) => ({ t: e.textContent.replace(/\s+/g, ' ').trim().slice(0, 16),
                       r: seenRatio(e) }));
      const loudest = dimmedNames.reduce((a, b) => (b.r > a.r ? b : a), dimmedNames[0]);
      const faintest = dimmedNames.reduce((a, b) => (b.r < a.r ? b : a), dimmedNames[0]);
      d.assert('every printed name on the panel is dimmed with the controls it names',
        dimmedNames.length >= 6 && loudest.r < 3 && faintest.r > 1.5,
        `${dimmedNames.length} names, "${loudest.t}" loudest at ${loudest.r.toFixed(2)}:1, `
        + `"${faintest.t}" faintest at ${faintest.r.toFixed(2)}:1`);

      /* ⚠️ THE NEGATIVE CONTROL. The make and the model name no control, they are
         true whether or not anything is plugged in, and a sweep that dimmed
         every word on the card would have taken them too. */
      const plateEl = card.querySelector('.pan-plate-l');
      const plateR = seenRatio(plateEl);
      d.assert('NEGATIVE CONTROL: the nameplate names no control and is not dimmed',
        plateR > 3 && !plateEl.hasAttribute('data-off'),
        `"${plateEl.textContent.trim()}" at ${plateR.toFixed(2)}:1, `
        + `against ${loudest.r.toFixed(2)}:1 for the loudest printed name`);

      /**
       * 🔴 AND NOTHING ON THIS PANEL SHOWS THE REFUSAL CURSOR. Asked 2026-09-21:
       * *"rm disable cursor o ndisabled knobs/padbuttins, just use regular.
       * noniteractive cursor"*. `not-allowed` says *you tried to use this and
       * were refused*, and nothing here is refusing anybody: the page's own
       * header says the keys are a picture rather than a control surface,
       * because a key that lit when you pressed it would be claiming something
       * happened somewhere. A refusal cursor on a picture is the interface
       * apologising for a press that was never on offer.
       * ⚠️ ALL THREE KINDS, because the rule lives in three separate
       * declarations in `shell.css` and a sweep that missed one would leave the
       * fader lane refusing while the pads did not.
       */
      const cursors = {
        pad: getComputedStyle(card.querySelector('.pos-pad:disabled')).cursor,
        dial: getComputedStyle(card.querySelector('.pos-knob[data-off] .pos-knob-dial')).cursor,
        lane: getComputedStyle(card.querySelector('.pos-fdr[data-off] .pos-fdr-lane')).cursor,
      };
      d.assert('no control on this panel wears the refusal cursor',
        Object.values(cursors).every((c) => c === 'default'),
        Object.entries(cursors).map(([k, v]) => `${k} ${v}`).join(', '));

      /**
       * 🔴 THIS PAGE DECLARES NO READOUT AND DRAWS NO EMPTY BOX WHERE ONE WOULD
       * HAVE BEEN. Asked 2026-09-21: *"rm keys / velocity / bend / channel in
       * evo"*, which is all four cells.
       * 🔴 **MEASURED RATHER THAN TRUSTED, BECAUSE THE FAILURE IS RECORDED.**
       * `/typist/` declared `readout: null` and still got a `.pos-readout` div
       * with no children, whose own 1 px top and bottom borders rendered as a
       * **2 px full width band 24 px above the controls**: a horizontal rule
       * nobody wrote, reported as *"old UI creeping in"*. The shell hides an
       * empty readout now, and *"the shell handles it"* is exactly the kind of
       * sentence this project keeps finding has outlived its own truth.
       * ⚠️ IT ACCEPTS EITHER SHAPE. Whether the shell omits the element or hides
       * it is the shell's business; what this page needs is that nothing paints
       * an edge where the row used to be, so the test is on the rendered height.
       */
      const ro = d.el.parentElement.querySelector('.pos-readout')
        || document.querySelector('.pos-readout');
      const roH = ro ? ro.getBoundingClientRect().height : 0;
      d.assert('no readout, and no empty box painting an edge where it was',
        __demo.readoutOptOut === true && roH === 0,
        ro ? `a .pos-readout is present and ${roH} px tall, hidden ${ro.hasAttribute('hidden')}`
           : 'no .pos-readout element at all');

      /* The panel scrolls in its own box, never the document. Measured on this
         project at 390 px as 141 px of page overflow when it does not. */
      d.assert('the panel scrolls sideways inside its own box, not the page',
        document.documentElement.scrollWidth <= window.innerWidth + 1,
        `page ${document.documentElement.scrollWidth} against ${window.innerWidth}`);
    }

    d.assert('no secret in this page', !location.href.includes('token'));
  });

  d.ready();
</script>
