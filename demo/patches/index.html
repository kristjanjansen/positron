<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON · patches</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* 🔴 THE VERDICT IS THE LOUDEST THING ON THIS PAGE AND IT IS NOT A READOUT
     CELL. Four numbers tell a backup from a pack of blanks, and a reader who
     has to compare four figures against four figures they do not have has been
     handed the evidence and not the answer. This is one sentence, in the ink
     the page reserves for something that matters, saying which of the two this
     pack is.
     ⚠️ IT RESERVES ITS ROOM. An empty host beaten by `.pos-stack > div:empty {
     display: none }` is a measured defect on `/wish/`, where a picture meant to
     hold its place was 0 px and `display: none` for hours while the source read
     as correct. `min-height` alone would lose the same fight, so this is never
     empty: before a pack is open it says so in words. */
  .pat-verdict { font: 500 13px/1.5 var(--mono); color: var(--dim);
                 border-left: 2px solid var(--line2); padding: 2px 0 2px 12px;
                 min-height: 1.5em; }
  .pat-verdict[data-state="good"] { color: var(--fg); border-left-color: var(--ok, #3fb950); }
  .pat-verdict[data-state="bad"] { color: var(--fg); border-left-color: var(--hi); }
  /* The row holding the way in from this machine. It is NOT `.pos-controls`:
     both harnesses press every button in that row, and the button here opens
     the operating system's file picker, which is a modal dialog that would sit
     over the page for the rest of the run. */
  .pat-open { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .pat-open-n { font: 400 12px/1.5 var(--mono); color: var(--dim2); }
</style>
<script type="module">
  import { mount, el } from '/shell/shell.mjs';
  import { createTable } from '/shell/table.mjs';
  import { createDiagram } from '/shell/diagram.mjs';
  import { createDrop } from '/shell/drop.mjs';
  import { createStack } from '/shell/stack.mjs';
  import { readZip, entry } from '/shell/unzip.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import {
    readPatch, summarise, sessionStats, patchFields, modSlots,
    categoryName, PATCH_BYTES, MOD_DESTINATIONS,
  } from '/shell/circuit-patch.mjs';

  /**
   * 🔴 THIS PAGE SENDS NOTHING. NOT ONE BYTE, AND IT IS ASSERTED RATHER THAN
   * INTENDED. There is no Web MIDI here, no `requestMIDIAccess`, no output and
   * no encoder: `circuit-patch.mjs` exports nothing that makes a message, and
   * its own test asserts that absence. The reason is one byte. `Replace Current
   * Patch` and `Replace Patch` differ at offset 6 of a 350 byte message, the
   * second overwrites a patch in FLASH on an instrument with no factory reset,
   * and `New Pack.circuitpack` is the only backup of that flash. A page that
   * could send a pack is one press away from destroying it.
   *
   * ⚠️ THE COUNTER BELOW IS HOW THAT CLAIM IS GRADED. A grep for
   * `requestMIDIAccess` finds it absent on every day it is absent and says
   * nothing about the day somebody adds it behind a convenience helper. This
   * wraps the method and counts, so the assert is over a number rather than
   * over a reading of the file.
   */
  let midiAsked = 0;
  if (navigator.requestMIDIAccess) {
    const real = navigator.requestMIDIAccess.bind(navigator);
    navigator.requestMIDIAccess = (...a) => { midiAsked++; return real(...a); };
  }
  /** Every request this page makes after load, for the same reason. */
  let fetched = 0;
  const realFetch = window.fetch.bind(window);
  window.fetch = (...a) => { fetched++; return realFetch(...a); };

  // 🔴 THE PACK IN THIS REPOSITORY IS NOT PUBLISHED AND MUST NOT BE.
  // `workers/view/build.mjs` copies an explicit allowlist and this file is not
  // on it, deliberately: it holds 32 of somebody's real sessions, it is their
  // only backup, and putting it on a public website is not a decision this page
  // gets to make. So the button below works on a checkout and answers 404 on
  // the deploy, where the way in is the drop target. The page says which.
  const PACK = '/New%20Pack.circuitpack';

  /**
   * 🔴 WHETHER THE PACK IS HERE IS DECIDED FROM THE ORIGIN, NOT DISCOVERED BY
   * ASKING, AND THE FIRST VERSION ASKED. It fetched, got a 404 on the deploy,
   * and said so in words, which reads correctly to a person and took
   * `DEMO_BASE=https://positron.studio node demo/verify.mjs patches` RED on
   * `no console errors` with two 404s in it. A red that is expected is a red
   * everybody learns to skip, and the next real one goes with it.
   * ⚠️ IT IS NOT A GUESS ABOUT THE FILE, IT IS A FACT ABOUT THE DEPLOY.
   * `workers/view/build.mjs` copies an explicit allowlist and this file is not
   * on it, so the pack exists exactly where the repository does. A page served
   * off a checkout is served off loopback or off this network.
   * ⚠️ AND BEING WRONG COSTS NOTHING. Somebody serving the repository from a
   * public hostname gets the words below and the drop target, which is the same
   * way in a visitor has.
   */
  const PACK_HERE = location.protocol === 'file:'
    || /^(localhost|127\.|0\.0\.0\.0|\[::1\]|192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/
      .test(location.hostname);

  const ONE = 'open a Circuit pack and see what its patches are made of';

  const d = mount({
    name: 'patches',
    // ⚠️ THE PAGE'S SENTENCE AND THE INDEX'S ARE ONE STRING, because a page with
    // a diagram carries the index's own line verbatim: a paragraph and a picture
    // of the machinery are two explanations of one thing, and a visitor arriving
    // from the front page must not be told it twice in two wordings that drift.
    what: ONE,
    /**
     * Four cells, and all four change between one pack and another. They are
     * about the PACK rather than about a patch: every per-patch fact is a column
     * in the table under them, which is `/making/`'s lesson written down — six
     * cells describing ONE recording sat above a list of twenty-six, so the row
     * being read and the row the cells described were the same row only while
     * nobody moved.
     *
     * 🔴 `different` AND `filled` ARE THE SAFETY CHECK IN TWO NUMBERS. A pack of
     * blanks reads 1 of 32 and 0.1 per cent; the owner's own reads 32 of 32 and
     * 84.6. Both packs display as `*New Pack` in Novation Components, so these
     * two cells are what tells them apart before anybody presses Send to Circuit.
     */
    readout: { patches: '', sessions: '', different: '', filled: '%' },
    controls: [{ id: 'here', label: 'open the pack here', primary: true }],
  });

  const stack = createStack();
  d.el.append(stack.el);

  // ── the way in from this machine ─────────────────────────────────────────
  const openNote = el('div', 'pat-open-n', 'nothing has been opened');
  const drop = createDrop({
    accept: ['.circuitpack', '.syx'],
    label: 'open a pack from this machine',
    hint: 'drop a .circuitpack or a .syx',
    says: (m, kind) => { openNote.textContent = m; d.log(m, kind); },
    onOpen: (files) => openFiles(files),
  });
  const openRow = el('div', 'pat-open');
  openRow.append(drop.el, openNote);
  stack.add(openRow);

  // ── the patches ──────────────────────────────────────────────────────────
  /**
   * 🔴 FIVE COLUMNS, AND THE SIXTH WAS CUT AFTER MEASURING RATHER THAN BEFORE.
   * It started at six with a `kind` column carrying the category byte. MEASURED
   * at 390 px: the row came out **598 px**, so a phone had **240 px** of
   * sideways drag, and a table that has to be dragged sideways is already
   * recorded here as a thing nobody reads. Fewer columns beats a wider minimum.
   * ⚠️ `kind` WENT RATHER THAN ONE OF THE OTHERS FOR TWO REASONS. This page is
   * for what a patch is MADE of, and a category is a label somebody typed rather
   * than a part of the sound. And it is the weakest column on the evidence:
   * Novation publish no label table for that byte at all, seven of its fifteen
   * values were recovered by correlating against a vendor spreadsheet, and
   * MEASURED on this bank **16 of 64 rows would have shown a bare number**. It
   * is still on every row's hover and in the picture's caption.
   * ⚠️ EVERY HEADING IS ONE SHORT WORD AND NEVER WRAPS. `/making/` shipped
   * `FILE` rendered one letter per line down four rows, which is a table
   * reporting that its columns do not fit, in the one place a reader cannot act
   * on it. MEASURED here: all five heading cells are 14 px tall at both widths.
   */
  const patchTable = createTable({
    columns: [
      { key: 'name', label: 'name', grow: true, hi: true, clip: true },
      { key: 'wave', label: 'wave', width: 96, clip: true },
      { key: 'filter', label: 'filter', width: 108, clip: true },
      { key: 'lfo', label: 'lfo', width: 48 },
      { key: 'voice', label: 'voice', width: 56 },
    ],
    cap: 200,
    empty: '',
    note: 'hover',
    onPick: (r) => showPatch(r.i),
  });
  // ⚠️ `titled` RATHER THAN A HEADING OF MY OWN. `createStack` grew it on a
  // direct ask (*"add heading support for createStack and stop messing around"*)
  // and a page that types its own `h3` is the fourth copy of a control this
  // project already has, which is the rule most of `/kit/` exists to enforce.
  stack.titled('PATCHES', patchTable);

  // ── the sessions, which is the safety check ──────────────────────────────
  const sessionTable = createTable({
    columns: [
      { key: 'name', label: 'name', grow: true, clip: true },
      { key: 'head', label: 'head', width: 62 },
      { key: 'bits', label: 'bits', width: 58, align: 'right' },
      { key: 'filled', label: 'filled', width: 66, align: 'right' },
    ],
    cap: 64,
    empty: '',
    note: 'hover',
  });
  const verdict = el('div', 'pat-verdict', 'no pack is open, so there is nothing to say about one yet');
  // ⚠️ THE TABLE AND ITS VERDICT ARE ONE BLOCK, NOT TWO. A stack puts the
  // project's one gap between its children and has nothing to say about the
  // inside of one, so a verdict added as a sibling would stand 40 px from the
  // list it is about.
  stack.titled('SESSIONS', sessionTable, verdict);
  sessionTable.el.style.marginBottom = '14px';

  // ── what is open ─────────────────────────────────────────────────────────
  let patches = [];        // decoded, in pack order
  let rows = [];           // the table's own rows, so a press can find its patch
  let sessions = [];       // { name, ...sessionStats }
  let picked = -1;

  const pct = (x) => `${(x * 100).toFixed(1)}`;

  function showPatch(i) {
    const p = patches[i];
    if (!p) return;
    picked = i;
    patchTable.mark((r) => r.i === i);
    const s = summarise(p);
    const used = modSlots(p).filter((m) => m.used);
    // 🔴 THE DIAGRAM IS THE DETAIL PANEL. `plans/plan-patches-page.md` §5 left
    // open whether a pressed row should raise a panel of parameters and guessed
    // a table; the ask that settled it was *"So the patcbay visualiser table
    // plus fiagram"*. A patch is a configuration of one signal path, so the
    // picture of the machinery and the picture of the patch are the same
    // picture, and pressing a row repaints it. It stays last on the page under
    // the standing heading, which is where every diagram in this project goes.
    dgBox.o1.sub = s.osc1;
    dgBox.o2.sub = s.osc2Silent ? 'silent' : s.osc2;
    dgBox.flt.sub = s.filter;
    dgBox.amp.sub = `release ${s.release}`;
    dgBox.fx.sub = s.distortion ? 'distortion' : s.chorus ? 'chorus' : 'dry';
    const reach = used.length
      ? used.map((m) => MOD_DESTINATIONS[m.destination]).filter((x, k, a) => a.indexOf(x) === k)
      : [];
    dg.el && (dgSpec.caption = captionFor(p, s, reach));
    dg.render();
    d.log(`${p.name} · ${s.poly} · ${s.filter} · ${used.length} mod slot(s) in use`);
  }

  function captionFor(p, s, reach) {
    const lfo = s.lfo === 'none'
      ? 'Neither LFO reaches anything through the mod matrix'
      : `${s.lfo === 'both' ? 'Both LFOs reach' : `${s.lfo.toUpperCase()} reaches`} ${reach.join(', ') || 'something'}`;
    return `${p.name}, category ${p.category}${categoryName(p.category) ? ` (${categoryName(p.category)})` : ''}. `
      + `${lfo}. Nothing on this page can send it.`;
  }

  // ── reading a pack ───────────────────────────────────────────────────────

  async function openFiles(files) {
    for (const f of files) {
      if (f.name.toLowerCase().endsWith('.syx')) { await openSyx(f.name, f.bytes); continue; }
      await openPack(f.name, f.bytes);
    }
  }

  /** One loose patch message, which is what all 128 in this archive are. */
  async function openSyx(name, bytes) {
    if (bytes.length !== PATCH_BYTES) {
      d.log(`${name} is ${bytes.length} bytes and a Circuit patch is ${PATCH_BYTES}`, 'bad');
      openNote.textContent = `${name} is not a Circuit patch`;
      return;
    }
    fill([{ name, bytes }], []);
    openNote.textContent = `${name}, one patch, read in this tab and sent nowhere`;
  }

  async function openPack(name, bytes) {
    let list;
    try { list = readZip(bytes); }
    catch (e) { d.log(`${name} did not read as a pack: ${e.message}`, 'bad'); return; }

    const meta = entry(list, 'index.json');
    let names = [];
    if (meta) {
      try {
        const m = JSON.parse(new TextDecoder().decode(await meta.read()));
        names = (m.sessions || []).map((s) => s.name || '');
        d.log(`${name} calls itself "${m.name || '(no name)'}", ${m.product} ${m.version}`);
      } catch { /* a pack with no readable index is still a pack */ }
    }

    const syx = list
      .filter((e) => /\.syx$/.test(e.name))
      .sort((a, b) => (+(a.name.match(/\d+/) || [0])[0]) - (+(b.name.match(/\d+/) || [0])[0]));
    const sess = list.filter((e) => e.name.endsWith('.circuitsession'));

    const got = [];
    for (const e of syx) got.push({ name: e.name.split('/').pop(), bytes: await e.read() });

    const st = [];
    for (let i = 0; i < sess.length; i++) {
      const s = await sessionStats(await sess[i].read());
      st.push({ ...s, name: names[i] || sess[i].name.split('/').pop() });
    }
    fill(got, st);
    const wavs = list.filter((e) => e.name.endsWith('.wav')).length;
    openNote.textContent = `${name} · ${got.length} patches, ${st.length} sessions, ${wavs} samples, read in this tab and sent nowhere`;
  }

  function fill(files, stats) {
    patches = [];
    rows = [];
    for (const f of files) {
      let p;
      // ⚠️ A PATCH THAT WILL NOT READ IS REPORTED BY NAME, never skipped. A
      // reader that silently dropped one would leave a pack looking smaller
      // than it is, which is a wrong answer wearing an empty one's clothes.
      try { p = readPatch(f.bytes); }
      catch (e) { d.log(`${f.name}: ${e.message}`, 'bad'); continue; }
      if (p.writesFlash) {
        d.log(`${f.name} is a Replace Patch, which writes ${p.slotName} in flash. `
            + 'Nothing here can send it', 'bad');
      }
      const i = patches.length;
      patches.push(p);
      const s = summarise(p);
      const moved = patchFields(p).filter((f) => f.changed).length;
      rows.push({
        i,
        name: p.name || '(no name)',
        wave: s.osc1,
        filter: s.filter,
        lfo: s.lfo === 'none' ? '' : s.lfo,
        voice: s.poly,
        // ⚠️ THE HOVER CARRIES WHAT A COLUMN WOULD HAVE, AND `moved` IS THE ONE
        // FACT NOTHING ELSE ON THIS PAGE SAYS: how much of this patch somebody
        // actually changed, counted against the reference's own defaults rather
        // than against the other patches in the pack.
        hover: `${p.commandName}, ${p.slotName} · category ${p.category}`
             + `${s.categoryLabel ? ` (${s.categoryLabel})` : ''}`
             + ` · osc 2 ${s.osc2Silent ? 'silent' : s.osc2}`
             + ` · attack ${s.attack}, release ${s.release} · ${s.mods} mod slot(s)`
             + ` · ${moved} of ${patchFields(p).length} parameters off their default`,
      });
    }
    patchTable.set(rows);

    sessions = stats;
    sessionTable.set(stats.map((s) => ({
      name: s.name || '(no name)',
      head: s.head,
      bits: s.entropy.toFixed(2),
      filled: `${pct(s.nonZero)}%`,
      hover: `${s.bytes} bytes · ${s.notErased} of them are not erasure and ${s.payload} are `
           + `neither erasure nor zero · ${s.fingerprint.slice(0, 12)}`,
    })));

    const distinct = new Set(stats.map((s) => s.fingerprint)).size;
    const lowFill = stats.length ? Math.min(...stats.map((s) => s.nonZero)) : null;
    d.set('patches', patches.length);
    d.set('sessions', stats.length);
    d.set('different', stats.length ? `${distinct} of ${stats.length}` : '');
    d.set('filled', stats.length ? pct(lowFill) : '');
    sayVerdict(stats, distinct);
    if (patches.length) showPatch(0);
  }

  /**
   * 🔴 THE FOUR NUMBERS TURNED INTO THE ONE SENTENCE THEY ARE FOR.
   * MEASURED on both sides, 2026-09-21: the owner's pack is 32 distinct
   * fingerprints of 32 at 0.83 to 1.46 bits a byte and 84.6 to 89.6 per cent
   * non-zero; the two purchased packs are ONE fingerprint across all 64 of their
   * session files, 0.009 bits and 0.07 per cent. Two orders of magnitude, so the
   * test is not delicate.
   *
   * 🔴 AND THE FIRST FOUR BYTES ARE NOT PART OF IT, WHICH CORRECTS SOMETHING
   * THREE FILES IN THIS REPOSITORY PUBLISHED. `INIT` was written up as the blank
   * signature against the owner's `DEMO`. The owner's 32 sessions are USER 22,
   * DEMO 7 and INIT 3, and those three are ordinary work at 0.87 bits and 86.5
   * per cent. Deciding on the head would have condemned them. It is still shown,
   * in its own column, because a reader should be able to see for themselves
   * that it is the same on both sides.
   */
  function sayVerdict(stats, distinct) {
    if (!stats.length) {
      verdict.textContent = 'this file carries no sessions, so there is nothing here to overwrite';
      delete verdict.dataset.state;
      return;
    }
    const flat = stats.every((s) => s.entropy < 0.05);
    const empty = stats.every((s) => s.nonZero < 0.01);
    if (distinct === 1 && (flat || empty)) {
      verdict.dataset.state = 'bad';
      verdict.textContent = `all ${stats.length} sessions in this pack are the same empty session. `
        + 'Sending it to a Circuit would replace whatever is on the instrument with blanks, '
        + 'and a Circuit has no factory reset';
      d.log('this pack carries blank sessions', 'bad');
      return;
    }
    verdict.dataset.state = 'good';
    verdict.textContent = `${distinct} of ${stats.length} sessions are different from each other and `
      + `the emptiest is ${pct(Math.min(...stats.map((s) => s.nonZero)))} per cent filled, `
      + 'so this is somebody\'s work rather than a pack of blanks';
    d.log(`${distinct} of ${stats.length} sessions are distinct`, 'good');
  }

  // ── the button that reads the pack in this repository ────────────────────
  //
  // 🔴 ON A PRESS, NEVER ON LOAD. It is 3.3 MiB of somebody's bandwidth for a
  // first row nobody asked to see, which is exactly the shape `/reel/` shipped:
  // a fetch on every visit for a frame nobody wanted. A visit here opens nothing
  // and the counters say so.
  const notPublished = 'the pack in this repository is not published here, '
    + 'so open one from your own machine';

  d.button('here')?.addEventListener('click', async () => {
    // ⚠️ IT ANSWERS RATHER THAN DOING NOTHING. A control that looks live and is
    // inert is this project's named hazard, and a press that produces one
    // sentence immediately is not that: it answers the question the label asks.
    if (!PACK_HERE) {
      openNote.textContent = notPublished;
      d.log('the pack in this repository is not published on the deploy, deliberately: '
          + 'it is somebody\'s only backup and it holds 32 of their sessions', 'bad');
      return;
    }
    openNote.textContent = 'reading the pack in this repository';
    try {
      const r = await realFetch(PACK);
      if (!r.ok) throw new Error(`the server answered ${r.status}`);
      await openPack('New Pack.circuitpack', new Uint8Array(await r.arrayBuffer()));
    } catch (e) {
      openNote.textContent = notPublished;
      d.log(`the pack here did not load (${e.message})`, 'bad');
    }
  });

  // ── the picture ──────────────────────────────────────────────────────────
  /**
   * 🔴 THE PICTURE IS THE PATCH, AND IT IS THE SECOND SHAPE RATHER THAN THE
   * FIRST. It was drawn as two machines to begin with, a `Browser` holding the
   * drop target, the zip reader and the decoder, and a `Circuit` holding the
   * voice, with NO arrow between them: the absence was the message, because
   * nothing here can reach the instrument.
   * 🔴 IT MEASURED BADLY AND THE MEASUREMENT IS WHY IT CHANGED. Two machines
   * with no link between them land in the same column and stack, so the picture
   * filled **27 per cent of its width at 746 px tall**, against `/crate/`'s
   * 64 per cent at 271 px and `/items/`'s 100 per cent at 226 px, both measured
   * the same minute. The layout puts two containers side by side only when
   * something joins them, so the honest picture and the legible one were in
   * direct conflict and the drawing lost.
   * ✅ WHAT REPLACED IT IS BETTER AT THE THING THAT WAS ASKED FOR. The ask was
   * *"So the patcbay visualiser table plus fiagram"*, and this is the signal
   * path of the patch under the pointer: five boxes whose subs are read off the
   * selected patch every time a row is pressed. The two oscillators share a
   * column and meet at the filter, which is what the instrument does.
   * ⚠️ AND THE FACT THE OLD PICTURE CARRIED IS NOT LOST, IT IS SAID WHERE IT
   * CAN GO RED. The caption says nothing here can send it, and the assert over
   * `requestMIDIAccess` is what grades it. A missing arrow was never gradable.
   */
  const dgBox = {
    o1: { id: 'o1', label: 'osc 1', sub: 'wave', tech: 'sound',
          note: 'One of thirty waveforms, and fourteen of those are wavetables rather than plain '
              + 'shapes. Its level, its tuning and its pulse width are separate bytes, so an '
              + 'oscillator can be configured and silent.' },
    o2: { id: 'o2', label: 'osc 2', sub: 'wave', tech: 'sound',
          note: 'The same thirty waveforms again. Twenty six of the sixty four patches in this '
              + 'pack leave its level at zero, which is what the word silent means here.' },
    flt: { id: 'flt', label: 'filter', sub: 'type', tech: 'sound',
           note: 'Six types: low and high pass at 12 and 24 dB, and two band pass shapes. Its '
               + 'frequency is the parameter the mod matrix reaches more often than any other.' },
    amp: { id: 'amp', label: 'amp', sub: 'release', tech: 'sound',
           note: 'Envelope 1 is the amplitude envelope. Its release is the single byte that best '
               + 'separates one bank from another, at a median of 40 across these sixty four.' },
    fx: { id: 'fx', label: 'FX', sub: 'dry', tech: 'sound',
          note: 'Distortion, chorus and a three band equaliser, each with its own level byte. A '
              + 'level of zero is the effect switched off rather than turned down.' },
  };
  const dgSpec = {
    caption: 'This is the patch under the pointer, drawn from the 340 bytes it is made of. '
      + 'Nothing on this page can send it back: there is no Web MIDI here and no function '
      + 'anywhere that turns a patch into a message, because the one that writes a patch into '
      + 'flash is a single byte away from the one that does not.',
    nodes: [dgBox.o1, dgBox.o2, dgBox.flt, dgBox.amp, dgBox.fx],
    links: [
      { from: 'o1', to: 'flt', label: 'level',
        note: 'Both oscillators, a noise source and a ring modulator meet at a mixer with a '
            + 'level byte each, and what comes out of it is what the filter is given.' },
      { from: 'o2', to: 'flt', label: 'level',
        note: 'Its level is address 55. Zero there is an oscillator that is fully configured and '
            + 'contributes nothing, which is why the table says silent rather than showing a wave.' },
      { from: 'flt', to: 'amp', label: 'envelope',
        note: 'Envelope 2 is the filter envelope and envelope 1 is the amplifier\'s. A patch can '
            + 'aim either at the filter frequency through the mod matrix.' },
      { from: 'amp', to: 'fx', label: 'signal',
        note: 'The effects sit after the amplifier, so a long release is heard through whatever '
            + 'distortion and chorus the patch has switched on.' },
    ],
  };
  const dg = createDiagram(d.el, dgSpec, { how: true, atEnd: true });

  // ── what a visit is allowed to have done ─────────────────────────────────
  d.assert('a visit opens nothing and asks for nothing',
    drop.opens === 0 && patches.length === 0 && fetched === 0,
    `${drop.opens} files opened, ${patches.length} patches read, ${fetched} request(s) made`);

  // 🔴 THE ASSERT THIS PAGE EXISTS TO CARRY. Not a reading of the source: a
  // counter on the method itself, so it stays true on the day somebody adds a
  // convenience helper behind a control.
  // ⚠️ THE COUNTER AND NOTHING ELSE, AND THE FIRST VERSION OF THIS ASSERT WAS
  // WRONG IN THE MOST ORDINARY WAY. It also required `window.MIDIOutput` to be
  // undefined, which is a fact about the BROWSER and not about this page:
  // Chrome defines that constructor whether or not anybody ever asks for
  // access, so the assert went red on a page where nothing was wrong. Measure
  // the quantity in question, not one next to it.
  d.assert('nothing here asks for MIDI, so nothing here can write to an instrument',
    midiAsked === 0 && navigator.requestMIDIAccess !== undefined,
    `requestMIDIAccess called ${midiAsked} time(s), and the counter is still in front of it`);

  d.assert('the picture cut nothing and refused nothing',
    dg.cuts.length === 0, dg.cuts.map((c) => `${c.id}: ${c.shown}`).join(' · ') || 'none');

  // ⚠️ A DIAGRAM WITH A HEADLESS LINE IN IT READS AS A HEAD THAT FELL OFF,
  // which was reported on two pages before it became a rule. Every gap here is
  // a declared link, so there is nothing left for a bracket to do.
  d.assert('every line in the picture has an arrowhead on it',
    dg.ties === 0, `${dg.ties} headless tie(s)`);

  /**
   * 🔴 THE PICTURE IS THE SELECTED PATCH, ASSERTED FIELD BY FIELD RATHER THAN
   * BELIEVED. A diagram whose subs were typed once and never updated would look
   * exactly like this one and would be a drawing of whatever patch happened to
   * be first, which is the shape of defect this project calls a control that
   * looks live and is inert. Every box is compared against the decoder's own
   * reading of the patch the table has marked.
   */
  const picturePatch = () => {
    const p = patches[picked];
    if (!p) return null;
    const s = summarise(p);
    return dgBox.o1.sub === s.osc1
      && dgBox.o2.sub === (s.osc2Silent ? 'silent' : s.osc2)
      && dgBox.flt.sub === s.filter
      && dgBox.amp.sub === `release ${s.release}`
      && dgBox.fx.sub === (s.distortion ? 'distortion' : s.chorus ? 'chorus' : 'dry');
  };

  // ⚠️ THE HEADING IS `hidden`, NOT ABSENT FROM THE DOM, so a check reading
  // `textContent` finds every column name in an empty table and goes red on a
  // component doing exactly what it promises. Ask whether it is DRAWN.
  {
    const head = patchTable.el.querySelector('.pos-tbl-head');
    d.assert('an empty table draws no heading, because a column name over nothing labels air',
      patchTable.count() === 0 && !!head && head.hidden
      && patchTable.el.querySelectorAll('.pos-tbl-row:not(.pos-tbl-head)').length === 0,
      `${patchTable.count()} rows and the heading is ${head && head.hidden ? 'hidden' : 'drawn'}`);
  }

  /**
   * Everything from here is behind the gate, because it opens a 3.3 MiB file.
   * A visit asserts a strict subset and that is the intended shape.
   */
  if (SELFCHECK) {
    const r = PACK_HERE ? await realFetch(PACK).catch(() => null) : null;
    if (!r || !r.ok) {
      // ⚠️ SAID OUT LOUD RATHER THAN SKIPPED IN SILENCE. On the deploy this file
      // is not published, on purpose, so a run there grades the page's load time
      // half and nothing else. A check nobody can run must say it did not run.
      d.log('the pack here is not published, so the reading checks did not run', 'bad');
      d.assert('the pack in this repository is readable, or the page says it is not',
        openNote.textContent === notPublished && !PACK_HERE,
        `not published at ${location.hostname}, and the page says so`);
    } else {
      await openPack('New Pack.circuitpack', new Uint8Array(await r.arrayBuffer()));

      d.assert('the pack reads as 64 patches and 32 sessions',
        patches.length === 64 && sessions.length === 32,
        `${patches.length} patches, ${sessions.length} sessions`);

      d.assert('every patch in it lands in RAM rather than in flash',
        patches.every((p) => !p.writesFlash),
        `${patches.filter((p) => p.writesFlash).length} of ${patches.length} would write flash`);

      const distinct = new Set(sessions.map((s) => s.fingerprint)).size;
      d.assert('the sessions are all different from each other, so this is a backup',
        distinct === 32 && verdict.dataset.state === 'good',
        `${distinct} distinct of ${sessions.length} · the page says "${verdict.textContent.slice(0, 60)}"`);

      /**
       * 🔴 THE NEGATIVE CONTROL, AND WITHOUT IT THE VERDICT IS DECORATION. A
       * page that said `this is a backup` whatever it was shown would pass every
       * assert above. Four pages in this repository were fully green against
       * stand-ins whose refusals had been switched off, so the blank pack is
       * built here and put down the same path: 32 sessions of one repeated byte,
       * which is what the two purchased packs measure as.
       */
      const blank = Array.from({ length: 32 }, () => ({
        name: '', head: 'INIT', entropy: 0.009, nonZero: 0.0007,
        bytes: 53248, notErased: 53248, payload: 0, fingerprint: 'same',
      }));
      sayVerdict(blank, 1);
      d.assert('NEGATIVE CONTROL: a pack of blanks is called blanks, and it says what sending it costs',
        verdict.dataset.state === 'bad' && /no factory reset/.test(verdict.textContent),
        `"${verdict.textContent.slice(0, 70)}"`);
      sayVerdict(sessions, distinct);

      /**
       * ⚠️ AND THE HEAD IS NOT WHAT DECIDES IT, WHICH CORRECTS THREE FILES.
       * `INIT` was published as the blank signature. Three of the owner's own
       * sessions carry it and are ordinary work, so the fabricated blanks above
       * wear the same head as real sessions here and are still called blanks.
       */
      const heads = new Set(sessions.map((s) => s.head));
      d.assert('and the first four bytes are not what decided it, because INIT is on both sides',
        heads.has('INIT') && verdict.dataset.state === 'good',
        `the owner's own sessions say ${[...heads].join(', ')}`);

      showPatch(0);
      d.assert('pressing a patch repaints every box in the picture with that patch in it',
        picturePatch() === true && picked === 0,
        `the picture says ${dgBox.o1.sub} / ${dgBox.o2.sub} / ${dgBox.flt.sub} / ${dgBox.amp.sub} / ${dgBox.fx.sub}`);

      // ⚠️ THE NEGATIVE CONTROL. A picture that never repainted would pass the
      // line above on the first patch and on nothing else, so a second patch
      // with different parts goes through the same press.
      const other = patches.findIndex((q, k) => k > 0 && summarise(q).filter !== summarise(patches[0]).filter);
      showPatch(other > 0 ? other : 1);
      d.assert('NEGATIVE CONTROL: a different patch draws a different picture',
        picturePatch() === true && dgBox.flt.sub !== summarise(patches[0]).filter,
        `patch ${picked} draws ${dgBox.flt.sub} against patch 0's ${summarise(patches[0]).filter}`);

      const before = fetched;
      showPatch(Math.min(7, patches.length - 1));
      d.assert('and stepping through them asks nobody for anything',
        fetched === before, `${fetched - before} request(s) while moving`);

      d.assert('nothing was sent while all of that happened',
        midiAsked === 0, `requestMIDIAccess called ${midiAsked} time(s)`);
    }
  }

  d.ready();
</script>
