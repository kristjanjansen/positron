<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* The prose under a section heading, the same voice as the page's own
     sentence under its title. Two paragraphs under one heading are one block,
     so they sit a paragraph apart rather than the page's 40 px. */
  .gr-text { display: flex; flex-direction: column; gap: 10px; }
  .gr-say { margin: 0; color: var(--dim); font-size: 13.5px; max-width: 62ch; }
  /* The line being written and the consent beside it are one row. */
  .gr-write { display: flex; flex-wrap: wrap; align-items: end; gap: var(--ctl-gap, 8px); }
  .gr-write > .pos-field { flex: 1 1 320px; min-width: 0; }
  .rout-case {
    margin: 0;
    height: calc(16 * 1.6em + 2 * var(--inset, 12px));
    overflow: auto;
    padding: var(--inset, 12px);
    background: var(--card);
    border: var(--edge, 1px solid var(--line));
    border-radius: var(--r, 4px);
    font: 400 12px/1.6 var(--mono);
    color: var(--dim);
    white-space: pre;
  }
  .rout-case b { color: var(--fg); font-weight: 400; }
  .rout-case i { color: var(--bad, #e66); font-style: normal; }
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createTable } from '/shell/table.mjs';
  import { createField } from '/shell/field.mjs';
  import { createCheck } from '/shell/check.mjs';
  import { createDiagram } from '/shell/diagram.mjs';
  import { createBay, HEAVY, parseLink, printLink } from '/shell/bay.mjs';
  import { createChoice } from '/shell/choice.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createRegistry, boardGraph } from '/shell/graph-registry.mjs';
  import { createCore, fromHex, toHex } from '/shell/route-core.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createBayNode, roomFor, randomSite } from '/shell/bay-node.mjs';
  import { createOpeners, BY_TRANSPORT } from '/shell/openers.mjs';
  import { createLinkBadge, linkStateOf } from '/shell/link-badge.mjs';

  const WHAT = 'A universal patchbay that links notes, sound, video and code between this browser and the studio\u2019s Raspberry Pi, checking every link before it opens.';

  const d = mount({
    name: 'patchbay',
    what: WHAT,
    readout: { links: '', heavy: '', refused: '', heard: '' },
    controls: [
      { id: 'link', label: 'Link', primary: true },
      { id: 'open', label: 'Open' },
      { id: 'example', label: 'Example' },
      { id: 'unlink', label: 'Unlink' },
      { id: 'clear', label: 'Clear' },
      { id: 'save', label: 'Save scene' },
    ],
  });
  guard(d);

  const say = (...texts) => {
    const box = el('div', 'gr-text');
    for (const t of texts) box.append(el('p', 'gr-say', t));
    return box;
  };

  /* 🔴 `/rout/` AND `/graph/` AS ONE PAGE, asked 2026-10-04: *"i am cofused
     over rout and graph demo. unify? better name?"*, named *"Patchbay"*. The
     graph decides what exists and how a link travels; the routing core decides
     what happens to each MIDI message inside a link, and here a MIDI link from
     the keys really runs through it. Both old pages stay at their URLs.
     🔴 WHY THIS PAGE EXISTS: `plans/plan-universal-routing.md`, asked
     2026-10-04 as *"What about route-anything work?"* then *"Do it ... Nee
     demo"*. It is step 2 of that plan made visible: `bay.mjs` knows eight
     media, and a link of a heavy one carries a session instead of bytes. */
  d.stack.titled('WHY',
    say('positron moves notes, sound, video, code and recordings between browsers, a Raspberry Pi and '
      + 'Cloudflare, and every pair used to have code of its own. Here each is a link between two ports.',
      'A light link, MIDI or a program, carries its bytes through the routing core, which also runs on a '
      + 'microcontroller and holds anything that could overwrite a saved sound until a person says yes. A heavy '
      + 'link, sound or video, only describes the stream, and the ends open it over a transport chosen from '
      + 'where they are.',
      'A link opens for real only when you select it and press Open. Recordings go to Cloudflare in four '
      + 'second pieces and are kept for six hours.'));

  // ── the desk ─────────────────────────────────────────────────────────────
  //
  // ⚠️ A DESCRIPTION OF THINGS THAT EXIST, NOT A SIMULATION OF THEM. Every node
  // is something positron already talks to, named the way the plan names it,
  // and every shape is the one the wire already declares (the board's
  // `audioChannels` and `frameMs`, the GPU's video). `place` is the machine,
  // `net` the network it is on, and the transport is chosen from those two.

  const NODES = [
    { id: 'web:keys', kind: 'person', label: 'keys', place: 'browser', net: 'home' },
    { id: 'web:editor', kind: 'person', label: 'editor', place: 'browser', net: 'home' },
    { id: 'web:screen', kind: 'screen', label: 'screen', place: 'browser', net: 'home' },
    { id: 'studio-1:circuit', kind: 'device', label: 'Circuit', place: 'pi', net: 'home' },
    { id: 'studio-1:gpu', kind: 'engine', label: 'GPU', place: 'pi', net: 'home' },
    { id: 'r2:recordings', kind: 'store', label: 'recordings', place: 'cloudflare', net: 'cloudflare' },
    { id: 'phone:screen', kind: 'screen', label: 'screen', place: 'phone', net: 'cell' },
    { id: 'err:klassika', kind: 'external', label: 'Klassikaraadio', place: 'err', net: 'err' },
  ];
  const PORTS = [
    { id: 'web:keys:out', label: 'keys', dir: 'out', medium: 'midi', emits: ['note', 'cc'] },
    { id: 'web:editor:program', label: 'editor', dir: 'out', medium: 'program', shape: { language: 'glsl' } },
    { id: 'web:screen:audio', label: 'browser screen', dir: 'in', medium: 'audio', shape: { rate: 48000 } },
    { id: 'web:screen:video', label: 'browser screen', dir: 'in', medium: 'video' },
    { id: 'studio-1:circuit:in', label: 'Circuit', dir: 'in', medium: 'midi', accepts: ['note', 'cc', 'bend'], never: [] },
    { id: 'studio-1:circuit:audio', label: 'Circuit', dir: 'out', medium: 'audio', shape: { rate: 48000, channels: 2, frameMs: 10 } },
    { id: 'studio-1:gpu:program', label: 'GPU', dir: 'in', medium: 'program', shape: { language: 'glsl' } },
    { id: 'studio-1:gpu:video', label: 'GPU', dir: 'out', medium: 'video', shape: { w: 1280, h: 720, fps: 30, codec: 'h264' } },
    { id: 'r2:recordings:in', label: 'recordings', dir: 'in', medium: 'audio', address: 'ingest.positron.studio' },
    { id: 'r2:recordings:out', label: 'recordings', dir: 'out', medium: 'audio', address: 'archive.positron.studio' },
    { id: 'phone:screen:video', label: 'phone screen', dir: 'in', medium: 'video' },
    { id: 'phone:screen:audio', label: 'phone screen', dir: 'in', medium: 'audio', shape: { rate: 48000 } },
    { id: 'err:klassika:audio', label: 'Klassikaraadio', dir: 'out', medium: 'audio', shape: { rate: 48000 } },
  ];

  /* The lines a visitor can step through, in the order they teach: a light
     link, a heavy one on one network, code to an engine, video across the
     internet, a recording, the same sound to a second listener, then the two
     a validator exists for. */
  const EXAMPLES = [
    'web:keys:out -> studio-1:circuit:in { channel 1 }',
    'studio-1:circuit:audio -> web:screen:audio',
    'web:editor:program -> studio-1:gpu:program',
    'studio-1:gpu:video -> phone:screen:video',
    'studio-1:circuit:audio -> r2:recordings:in',
    'studio-1:circuit:audio -> phone:screen:audio',
    'err:klassika:audio -> web:screen:audio',
    'studio-1:gpu:video -> web:screen:audio',
    'r2:recordings:out -> web:screen:audio',
  ];

  function deskBay() {
    const b = createBay();
    for (const n of NODES) b.addNode(n);
    for (const p of PORTS) b.addPort(p);
    return b;
  }

  // ── the live desk: what announces itself in the studio's room ──────────
  //
  // 🔴 STEP 3 OF THE PLAN: `/graph/` draws what exists. The board puts its graph
  // on every `board.alive` (`demo/shell/graph-registry.mjs`), this page sends
  // its own as `graph.announce`, and anything else in the room that announces
  // is drawn too. A board that stops answering is still drawn, marked stale.
  // ⚠️ JOINING THE ROOM OPENS NOTHING BUT OUR OWN RELAY: no audio is asked for,
  // no lease is taken, and the page only listens and says what it is.
  // 🔴 AND IT JOINS ON A PRESS OF Join, NEVER ON LOAD, IN `?room=` WHEN THE PAGE
  // HAS ONE, SINCE 2026-10-06 (`demo/shell/bay-node.mjs`, plan-routing-migration
  // §3.4). Until then `ROOM` was `studio-1` with no `?room=` read and the join
  // ran at the top of this script, so every visit and every suite run put a
  // `web` site on the owner's desk and asked the Pi `graph.ask`.
  // 🔴 AND THIS TAB IS A SITE OF ITS OWN, `web-<four>`, not `web`: two visitors'
  // patchbays used to overwrite each other's `web` in every registry in the room.
  const ROOM = roomFor({ slug: 'patchbay' });
  const SITE = randomSite('web');
  const SELF = {
    v: 1, site: SITE, place: 'browser',
    nodes: [
      { id: `${SITE}:keys`, kind: 'person', label: 'keys', place: 'browser' },
      { id: `${SITE}:screen`, kind: 'screen', label: 'screen', place: 'browser' },
    ],
    ports: [
      { id: `${SITE}:keys:out`, label: 'keys', dir: 'out', medium: 'midi', emits: ['note', 'cc'] },
      { id: `${SITE}:screen:audio`, label: 'browser screen', dir: 'in', medium: 'audio' },
      { id: `${SITE}:screen:video`, label: 'browser screen', dir: 'in', medium: 'video' },
    ],
  };
  /* This browser's own ends, on the live desk (`SITE`) and the example desk
     (`web`, which is typed and never announced). */
  const OWN = {
    keys: [`${SITE}:keys:out`, 'web:keys:out'],
    screenAudio: [`${SITE}:screen:audio`, 'web:screen:audio'],
    screenVideo: [`${SITE}:screen:video`, 'web:screen:video'],
  };
  const mine = (id) => id.startsWith(`${SITE}:`) || id.startsWith('web:');
  /* 🔴 THE STORE IS ANNOUNCED BY THIS PAGE, BECAUSE THIS PAGE IS WHAT WRITES
     TO IT (plan-universal-routing §10 item 5). A recording is made by the
     browser that hears the sound and uploaded through ingest, so the store's
     ports exist exactly as long as a page that can use them does.
     ⚠️ IT IS NOT SENT TO THE ROOM. A registry keeps one graph per socket and
     site since 2026-10-06, so it could be, and is still not: every patchbay
     describes the same store, and its ports are used only by the page that
     announces them. It lives in this page's own registry (`local`). */
  const STORE = {
    v: 1, site: 'r2', place: 'cloudflare', net: 'cloudflare',
    nodes: [{ id: 'r2:recordings', kind: 'store', label: 'recordings', place: 'cloudflare', net: 'cloudflare' }],
    ports: [
      { id: 'r2:recordings:in', label: 'recordings', dir: 'in', medium: 'audio', address: 'ingest.positron.studio' },
      { id: 'r2:recordings:out', label: 'recordings', dir: 'out', medium: 'audio', address: 'archive.positron.studio' },
    ],
  };
  /* The room, the announce, `graph.ask`, the re-announce and `link.request`
     are `bay-node.mjs`'s. Building it opens nothing; Join does. It is made
     further down, beside the rest of the room's handlers, and only its
     registry is needed before then. */
  const node = createBayNode({
    room: ROOM, graphs: [SELF], local: [STORE],
    log: (line, kind) => d.log(line, kind),
    onJoin: () => { announceScenes(); joinRow.button('join').disabled = true; d.log(`listening in ${ROOM}, and this browser said what it is, as ${SITE}`); },
    onGraph: (msg) => heardGraph(msg),
    onMessage: (msg) => heardMessage(msg),
  });
  const registry = node.registry;
  function liveBay() { return registry.fill(createBay()); }

  let world = 'live';
  let bay = liveBay();
  /** Every link made, as its text line, so a redraw can make them again. */
  let made = [];

  // ── the picture, built from whatever the bay holds ───────────────────────
  //
  // ⚠️ `atEnd: false`, the one exception `positron-diagram` allows: this
  // picture changes when the reader presses something, so it sits beside it.
  // 🔴 A PLACE WITH SOURCES AND RECEIVERS IS DRAWN TWICE, BY ROLE. The first
  // layout put the browser's screen beside its keys, so sound from the Pi came
  // back right to left under the row, through other boxes. Split by role (the
  // `/keys/` shape `positron-diagram` records), links read left to right.
  const PLACE = { browser: 'Browser', phone: 'Phone', cloudflare: 'Cloudflare', err: 'ERR', pi: 'Raspberry Pi' };
  const TECH = { person: 'browser', screen: 'browser', device: 'sound', engine: 'graphics', store: 'cloudflare', external: 'station' };
  const placeLabel = (p) => PLACE[p] || (/^studio/.test(p) ? 'Raspberry Pi' : p);
  const placeTech = (p) => (p === 'browser' ? 'browser' : p === 'cloudflare' ? 'cloudflare' : p === 'err' ? 'station'
    : (p === 'pi' || /^studio/.test(p)) ? 'raspberry' : 'device');
  const boxId = (id) => id.replace(/:/g, '_');
  function specFor(b) {
    const ports = b.ports();
    const groups = new Map();
    for (const n of b.nodes()) {
      const mine = ports.filter((p) => p.id.startsWith(`${n.id}:`));
      const outs = mine.filter((p) => p.dir === 'out'), ins = mine.filter((p) => p.dir === 'in');
      const role = ins.length && !outs.length ? 'in' : 'out';
      const sub = [...new Set(outs.map((p) => `${p.medium} out`)), ...new Set(ins.map((p) => `${p.medium} in`))].join(', ');
      const key = `${n.place}|${role}`;
      if (!groups.has(key)) groups.set(key, { place: n.place, role, kids: [], stale: false });
      const gr = groups.get(key);
      gr.kids.push({ id: boxId(n.id), label: n.label, sub: n.stale ? `${sub}, not heard` : sub, tech: TECH[n.kind] || 'device' });
      gr.stale ||= !!n.stale;
    }
    return [...groups.values()].map((gr) => ({
      id: `m-${gr.place}-${gr.role}`, label: placeLabel(gr.place), tech: placeTech(gr.place),
      kind: gr.place === 'browser' ? 'here' : gr.place === 'cloudflare' ? 'cloud' : 'device',
      join: false, children: gr.kids,
    }));
  }
  const spec = { caption: '', nodes: specFor(bay), links: [] };
  const host = el('div');
  const dg = createDiagram(host, spec, { how: false, atEnd: false });

  // ── writing a link ───────────────────────────────────────────────────────
  /** In the live desk the examples are whatever this room makes possible: every
   *  out port to an in port of the same medium on another node. */
  function examples() {
    if (world === 'example') return EXAMPLES;
    const ports = bay.ports();
    const out = [];
    for (const a of ports.filter((p) => p.dir === 'out')) {
      for (const b of ports.filter((p) => p.dir === 'in' && p.medium === a.medium)) {
        if (a.id.split(':').slice(0, 2).join(':') === b.id.split(':').slice(0, 2).join(':')) continue;
        out.push(`${a.id} -> ${b.id}`);
      }
    }
    return out.length ? out : [''];
  }
  let step = 0;
  const field = createField({ label: 'link', value: examples()[0], placeholder: 'from -> to { channel 1 }', grow: 'wide' });
  const consent = createCheck({ label: 'I will listen', title: 'a link from somebody else’s server is made only by a person who will listen to it' });
  const write = el('div', 'gr-write');
  write.append(field.el, consent.el);

  let selected = null, refused = 0;
  const rows = createTable({
    columns: [
      { key: 'line', label: 'link', grow: true, hi: true },
      { key: 'medium', label: 'medium', width: 72 },
      { key: 'by', label: 'carried by', width: 120 },
      { key: 'where', label: 'where', width: 104 },
      { key: 'state', label: 'state', width: 96 },
    ],
    empty: 'no links yet',
    note: 'says',
    onPick: (r) => { selected = r.id; d.log(`${r.id} selected, Unlink takes it away`); },
  });

  const keysHost = el('div');
  const desk = createChoice({
    label: 'desk', options: [['studio, live', 'live'], ['example', 'example']], at: 0,
    title: (v) => (v === 'live' ? `what announces itself in ${ROOM}, once Join is pressed` : 'a typed desk with every kind of thing on it'),
    onPick: (v) => { for (const line of [...opened.keys()]) closeLink(line); world = v; made = []; rebuild(); field.set(examples()[0]); step = 0;
      d.log(v === 'live' ? `the live desk: what announces itself in ${ROOM}` : 'the example desk'); },
  });
  // ── scenes: a set of links kept under a name ─────────────────────────────
  //
  // 🔴 A RECALL IS A DIFF, NOT A TEARDOWN (`plans/plan-route-core.md` §5,
  // *"Changes are diffs"*). A link in both the current set and the scene is not
  // touched, so a stream that is open stays open; a link only in the current set
  // is closed and unlinked; a link only in the scene is made and DESCRIBED.
  // ⚠️ AND A RECALL OPENS NOTHING, WHEREVER IT CAME FROM. Opening stays a
  // person's press on Open, so a `scene.recall` from another page in the room,
  // such as `/partitur/`'s scenes lane, can change what is described and close
  // what a scene leaves out, and cannot start a stream on anybody's hardware.
  // ⚠️ SCENES LIVE IN THIS BROWSER, in `localStorage`, which may throw or come
  // back empty, so every read and write is wrapped and the page works without
  // it. The harness keeps them in memory only, so a run leaves nothing behind.
  const SCENES_KEY = 'positron.patchbay.scenes';
  function loadScenes() {
    try {
      const got = JSON.parse(localStorage.getItem(SCENES_KEY) || '[]');
      return Array.isArray(got) ? got.filter((x) => x && typeof x.name === 'string' && Array.isArray(x.lines)) : [];
    } catch { return []; }
  }
  let scenes = SELFCHECK ? [] : loadScenes();
  function keepScenes() {
    if (SELFCHECK) return;
    try { localStorage.setItem(SCENES_KEY, JSON.stringify(scenes)); } catch { /* full, off or private */ }
  }
  /** `scene 1`, `scene 2`, one past the highest number already used. */
  const nextSceneName = (list) => `scene ${list.reduce((n, x) => Math.max(n, Number(/^scene (\d+)$/.exec(x.name)?.[1] || 0)), 0) + 1}`;

  /**
   * Make bay `b` hold `scene`'s links, starting from `current` ({line, consent}
   * as `made` holds them). Pure apart from `b` and the `close` it is handed,
   * which answers whether the line was open. It never opens anything: there is
   * no opener in reach of this function. Answers `{ made, changes }`, where each
   * change is `{ op: 'removed' | 'made' | 'refused', line, wasOpen?, why? }`.
   */
  function applyScene(b, current, scene, { close = () => false } = {}) {
    const want = new Set(scene.lines.map((m) => m.line));
    const have = new Set(current.map((m) => m.line));
    const next = [], changes = [];
    for (const m of current) {
      if (want.has(m.line)) { next.push(m); continue; }
      const wasOpen = !!close(m.line);
      const lk = b.links().find((l) => printLink(l) === m.line);
      if (lk) b.unlink(lk.id);
      changes.push({ op: 'removed', line: m.line, wasOpen });
    }
    for (const m of scene.lines) {
      if (have.has(m.line)) continue;
      let l;
      try { l = parseLink(m.line); } catch (e) { changes.push({ op: 'refused', line: m.line, why: e.message }); continue; }
      const r = b.link(l.from, l.to, l.transforms, { consent: !!m.consent, via: l.via, site: SITE });
      if (!r.ok) { changes.push({ op: 'refused', line: m.line, why: r.why }); continue; }
      const line = printLink(b.links().find((x) => x.id === r.id));
      next.push({ line, consent: !!m.consent });
      changes.push({ op: 'made', line });
    }
    return { made: next, changes };
  }

  let sceneAt = -1;
  const pick = createPicker({
    label: 'scene', what: 'scene',
    prev: () => stepScene(-1), next: () => stepScene(1),
    onPick: (i) => { if (scenes[i]) recallScene(scenes[i].name); },
  });
  function drawScenes() {
    pick.options(scenes.map((x) => x.name), Math.max(0, sceneAt));
    if (!scenes.length) pick.show('none');
    pick.disabled(!scenes.length);
  }
  function stepScene(dir) {
    if (!scenes.length) return;
    const i = sceneAt < 0 ? (dir > 0 ? 0 : scenes.length - 1) : (sceneAt + dir + scenes.length) % scenes.length;
    recallScene(scenes[i].name);
  }
  /** Recall a saved scene into the page's own bay. One log line per change. */
  function recallScene(name, by = '') {
    const sc = scenes.find((x) => x.name === name);
    if (!sc) { d.log(`${by ? `${by} asked for ${name}, which` : `${name}`} is not a scene saved in this browser`, 'warn'); return null; }
    const r = applyScene(bay, made, sc, { close: (line) => closeLink(line, true) });
    made = r.made;
    for (const c of r.changes) {
      if (c.op === 'made') d.log(`${name} made ${c.line}, described and not opened`, 'ok');
      else if (c.op === 'removed') d.log(`${name} removed ${c.line}${c.wasOpen ? ', which was open and is closed' : ''}`);
      else d.log(`${name} could not make ${c.line}: ${c.why}`, 'bad');
    }
    if (!r.changes.length) d.log(`${name}${by ? `, asked for by ${by},` : ''} is what is linked already, nothing changed`);
    else if (by) d.log(`${name} recalled, asked for by ${by}`);
    sceneAt = scenes.indexOf(sc);
    pick.show(name, sceneAt);
    selected = null;
    redraw();
    return r;
  }
  drawScenes();

  /* ⚠️ NOT IN `.pos-controls`. The harness presses that row by position, and
     this press joins a room: a run that pressed it would join, and a control
     added there moves every other control's press. The check pass joins the
     run's own room itself, explicitly. */
  const joinRow = createButtonGroup({ buttons: [
    { id: 'join', label: `Join ${ROOM}`, onPress: () => joinRoom() },
  ] });
  const deskRow = el('div', 'gr-write');
  deskRow.append(desk.el, pick.el, joinRow.el);
  d.stack.titled('THE GRAPH',
    say('The live desk is what announces itself in the studio\u2019s room once you press Join, this browser included. '
      + 'The example desk has every kind of thing on it. Write a link as from, an arrow, then to, or press '
      + 'Example to step through what the desk allows, and press Link. A refusal says why in the log.',
      'Save scene keeps the links under a name in this browser, and picking a scene makes and removes links '
      + 'until they match it, leaving the shared ones alone and opening nothing.'),
    deskRow, host, write, rows.el, keysHost);

  // ── inside a link ─────────────────────────────────────────────────────────
  const inside = el('pre', 'rout-case');
  inside.style.height = 'auto';
  inside.style.whiteSpace = 'pre-wrap';
  function showInside() {
    const midi = [...opened.entries()].filter(([, o]) => o.core);
    inside.textContent = midi.length
      ? midi.map(([line, o]) => `${line}\n  ops       ${o.ops.length ? o.ops.map((x) => JSON.stringify(x)).join(' ') : 'none'}\n`
          + `  in ${o.stats.in}   out ${o.stats.out}   dropped ${o.stats.dropped}\n  last      ${o.stats.last || 'nothing yet'}`).join('\n\n')
      : 'Open a link from the keys to an instrument and play. Each note shows here as it went in and as it came out of the routing core.';
  }
  inside.textContent = 'Open a link from the keys to an instrument and play. Each note shows here as it went in and as it came out of the routing core.';
  d.stack.titled('INSIDE A LINK',
    say('What the routing core did to every note on an open MIDI link, including what it dropped. A transform on '
      + 'the link, like { channel 2 } or { transpose 12 }, changes the note on its way to the instrument.'),
    inside);

  const mediumOf = (l) => bay.port(l.from)?.medium || '';
  /** What an arrow says: the name a reader can look up, short enough for the gap
   *  between two columns. The table keeps `bay.mjs`'s own id. */
  const SHORT = { webaudio: 'local', datachannel: 'WebRTC', relay: 'relay', moq: 'MoQ', llhls: 'LL-HLS',
    page: 'local', whep: 'WHEP', 'relay-h264': 'relay', indexeddb: 'local', ingest: 'ingest', 'r2-hls': 'HLS', room: 'room' };
  const an = (w) => (/^[aeiou]/.test(w) ? `an ${w}` : `a ${w}`);

  /** A new bay from the current desk, and every link made so far made again. */
  function rebuild() {
    bay = world === 'live' ? liveBay() : deskBay();
    const keep = [];
    for (const m of made) {
      const l = parseLink(m.line);
      const r = bay.link(l.from, l.to, l.transforms, { consent: m.consent, via: l.via, site: SITE });
      if (r.ok) keep.push(m); else d.log(`${m.line} is gone: ${r.why}`, 'bad');
    }
    made = keep;
    spec.nodes = specFor(bay);
    redraw();
  }

  function redraw() {
    const all = bay.links();
    rows.set(all.map((l) => ({
      id: l.id,
      line: printLink(l),
      medium: mediumOf(l),
      // ⚠️ WHILE A LINK IS OPEN ITS ROW SAYS WHAT IS REALLY CARRYING IT. The
      // plan's table chose WHEP for the Pi's video; the opener uses the board's
      // relay H.264 path, and a row naming the plan's choice would be a claim.
      by: opened.get(printLink(l))?.via?.() || (l.session ? l.session.transport : 'routing core'),
      where: l.session ? l.session.where : 'bytes',
      says: (l.session ? `${l.session.says}\naddress ${l.session.address}` : 'the bytes travel through the link itself')
        + (opened.get(printLink(l))?.where ? `\n${opened.get(printLink(l)).where()}` : ''),
      state: stateOf(l),
    })));
    spec.links = all.map((l) => ({
      from: l.from.split(':').slice(0, 2).join('_'),
      to: l.to.split(':').slice(0, 2).join('_'),
      label: l.session ? (SHORT[l.session.transport] || l.session.transport) : mediumOf(l),
      note: l.session ? `${mediumOf(l)}, ${l.session.where}: ${l.session.says}.` : `${mediumOf(l)}, carried by the routing core.`,
    }));
    const heavy = all.filter((l) => HEAVY.includes(mediumOf(l))).length;
    spec.caption = all.length
      ? `${all.length} link${all.length === 1 ? '' : 's'}, ${all.length - heavy} carrying bytes and ${heavy} describing a stream.`
      : 'No links. Press Example, then Link.';
    dg.render();
    d.set('links', all.length);
    d.set('heavy', heavy);
    d.set('refused', refused);
    const sites = registry.merged().sites.filter((x) => x.site !== SITE && x.site !== STORE.site);
    d.set('heard', world === 'live' ? sites.filter((x) => !x.stale).length : '');
  }

  /** Make the link written in the field. Answers bay's result, or a parse error as one. */
  function makeLink(line = field.value()) {
    let l;
    try { l = parseLink(line); }
    catch (e) { refused++; d.log(e.message.replace(/^bay: /, ''), 'bad'); redraw(); return { ok: false, why: e.message }; }
    /* `via` is the line's own last word, and `site` says this tab is the one
       asking, which is what an input somebody holds (`heldBy`) is checked against. */
    const r = bay.link(l.from, l.to, l.transforms, { consent: consent.get(), via: l.via, site: SITE });
    if (r.ok) {
      const lk = bay.links().find((x) => x.id === r.id);
      made.push({ line: printLink(lk), consent: consent.get() });
      d.log(lk?.session
        ? `${r.id} ${line}: ${an(mediumOf(lk))} stream over ${lk.session.transport}, ${lk.session.where}`
        : `${r.id} ${line}: ${mediumOf(lk)} through the routing core`, 'ok');
      if (r.warn) d.log(r.warn);
    } else {
      refused++;
      d.log(`refused ${line}: ${r.why} ${r.fix || ''}`.trim(), 'bad');
    }
    redraw();
    return r;
  }

  d.on('link', () => makeLink());
  d.on('example', () => {
    const ex = examples();
    step = (step + 1) % ex.length;
    field.set(ex[step]);
  });
  d.on('unlink', () => {
    const all = bay.links();
    const id = selected && all.some((l) => l.id === selected) ? selected : all.at(-1)?.id;
    if (!id) { d.log('nothing to unlink'); return; }
    const line = printLink(all.find((l) => l.id === id));
    closeLink(line);
    bay.unlink(id);
    made = made.filter((m) => m.line !== line);
    selected = null;
    d.log(`${id} unlinked`);
    redraw();
  });
  d.on('save', () => {
    const name = nextSceneName(scenes);
    scenes.push({ name, lines: made.map((m) => ({ line: m.line, consent: !!m.consent })) });
    keepScenes();
    sceneAt = scenes.length - 1;
    drawScenes();
    d.log(`${name} saved with ${made.length} link${made.length === 1 ? '' : 's'}`, 'ok');
    announceScenes();
  });
  d.on('clear', () => {
    for (const l of bay.links()) { closeLink(printLink(l)); bay.unlink(l.id); }
    made = [];
    selected = null;
    d.log('every link removed');
    redraw();
  });

  /* 🔴 THE FIRST BOARD HEARD GETS THREE LINKS, WHERE ITS PORTS EXIST. With no
     links the picture has no left and right, so every machine stacked in one
     column at one height and the browser's two boxes stood empty and tall. A
     link here is a description in memory and opens nothing. */
  function starter(site) {
    const want = [`${SITE}:keys:out -> ${site}:circuit:in`, `${site}:circuit:audio -> ${SITE}:screen:audio`,
      `${site}:gpu:video -> ${SITE}:screen:video`];
    for (const line of want) {
      const [from, to] = line.split(' -> ');
      if (bay.port(from) && bay.port(to)) makeLink(line);
    }
  }

  // ── step 4: opening a link for real ──────────────────────────────────────
  //
  // 🔴 A DESCRIBED LINK OPENS NOTHING, AND ONLY A PERSON'S PRESS OPENS ONE.
  // The starter links, a visit and the harness all leave the board alone: a
  // lease starts a capture on hardware in another building, and the rule here
  // is that a visit opens nothing. Under `?selfcheck=1` Open says so and stops.
  // 🔴 THE OPENERS ARE `demo/shell/openers.mjs` SINCE 2026-10-06, chosen by the
  // TRANSPORT the link's session names, not by its medium (plan-routing-migration
  // step 2). They were eight functions in this page; the board verbs they send
  // are unchanged. Each open link wears a `link-badge.mjs` word, STARTING,
  // RECEIVING or STALLED, from what its far side counted, the stage's tag.
  const opened = new Map();          // link line -> { kind, close(), state(), count(), badge }
  /** A port that another page announced, as opposed to the Pi or this browser. */
  const pageOwned = (id, b = bay) => !mine(id) && b.node(id.split(':').slice(0, 2).join(':'))?.place === 'browser';
  const RECORDINGS_KEY = 'positron.patchbay.recordings';
  function loadRecordings() {
    try {
      const got = JSON.parse(localStorage.getItem(RECORDINGS_KEY) || '[]');
      return Array.isArray(got) ? got.filter((r) => r && typeof r.manifest === 'string' && !(r.expiresAt < Date.now())) : [];
    } catch { return []; }
  }
  /** Newest first. A note this browser keeps to itself, and the harness keeps none. */
  let recordings = SELFCHECK ? [] : loadRecordings();
  function keepRecordings() {
    if (SELFCHECK) return;
    try { localStorage.setItem(RECORDINGS_KEY, JSON.stringify(recordings.slice(0, 20))); } catch { /* full, off or private */ }
  }
  const openers = createOpeners({
    log: (line, kind) => d.log(line, kind),
    host: keysHost,
    self: OWN,
    isRemote: (id, b) => pageOwned(id, b),
    request: (source, target, open) => node.request(source, target, open),
    recordings: { latest: () => recordings[0] || null, add: (r) => { recordings.unshift(r); keepRecordings(); } },
    onCore: () => showInside(),
  });
  const OPENERS = openers.table;
  const sources = openers.sources;
  /** Which opener takes a link, or null. The bay's own session decides, through `openers.pick`. */
  const kindOf = (l, on = bay) => openers.pick(l, on).kind;
  function stateOf(l) {
    const o = opened.get(printLink(l));
    if (o) return o.badge ? `${o.badge.says()}, ${o.state()}` : `open, ${o.state()}`;
    return kindOf(l) ? 'described' : 'not built yet';
  }
  /** Close an open link. Answers whether it was open. */
  function closeLink(line, quiet = false) {
    const o = opened.get(line);
    if (!o) return false;
    o.badge?.stop();
    o.close();
    opened.delete(line);
    if (!quiet) d.log(`${line} closed`);
    return true;
  }
  /**
   * Open one link. The guard and the choice of opener are here and nowhere
   * else, so the checks below can grade them with a scratch bay, a scratch map
   * and openers that only count, and nothing real is reached.
   * @returns {Promise<{ok: boolean, kind: string|null, why?: string, level?: string}>}
   */
  async function openLink(l, { on = bay, selfcheck = SELFCHECK, openers: table = OPENERS, into = opened } = {}) {
    const line = printLink(l);
    if (into.has(line)) return { ok: false, kind: null, why: `${line} is already open` };
    const pick = openers.pick(l, on);
    const kind = pick.kind;
    if (!kind) return { ok: false, kind, level: 'warn',
      why: `${line} cannot be opened yet: ${pick.why}. What is built is ${Object.keys(BY_TRANSPORT).join(', ')} and another page's own ports` };
    if (selfcheck) return { ok: false, kind, why: `the harness opens no real stream, so ${line} stays described` };
    try {
      const o = await table[kind](l, on);
      // The badge, only where the far side can be counted. A video gets it on its picture.
      if (typeof o.count === 'function' && o.count() !== null) {
        o.badge = createLinkBadge({ count: o.count }).start();
        o.panel?.slots?.tag?.append(o.badge.el);
      }
      into.set(line, o);
      return { ok: true, kind };
    } catch (e) { return { ok: false, kind, level: 'bad', why: `${line} did not open: ${e.message || e}` }; }
  }
  d.on('open', async () => {
    const all = bay.links();
    const l = all.find((x) => x.id === selected) || all.at(-1);
    if (!l) { d.log('nothing to open, make a link first'); return; }
    const r = await openLink(l);
    if (r.ok) d.log(`${printLink(l)} opened`, 'ok');
    else d.log(r.why, r.level);
    redraw();
  });
  setInterval(() => { if (opened.size) redraw(); }, 1000);

  // ── listening to the studio's room ───────────────────────────────────────
  let lastSites = '';
  /* The names only, so another page can offer them. The harness says nothing
     here, so a run of the suite never puts a scene in front of a real page. */
  function announceScenes() {
    if (SELFCHECK || !node.joined()) return;
    node.send({ type: 'scene.list', scenes: scenes.map((x) => x.name) });
  }
  /** Join the room, from the Join press or the check pass. Answers once joined. */
  function joinRoom() { return node.join(); }
  const heardFrom = new Set();
  function heardGraph(msg) {
    const fresh = !heardFrom.has(msg.from);
    heardFrom.add(msg.from);
    if (fresh) d.log(`${msg.graph.site} announced ${msg.graph.nodes.length} things`, 'ok');
    if (world === 'live') rebuild();
    if (fresh && world === 'live' && !made.length) starter(msg.graph.site);
  }
  function heardMessage(m) {
    if (m.type === 'graph.ask') { announceScenes(); return; }
    // Another page, such as `/partitur/`'s scenes lane, asking for a scene.
    // The recall makes and removes links and opens nothing.
    if (m.type === 'scene.recall' && typeof m.name === 'string') recallScene(m.name, 'the room');
  }
  /* A board that stops answering stays drawn and is marked, so staleness is
     checked on a slow clock rather than only when something arrives. */
  setInterval(() => {
    node.refresh();
    const now = JSON.stringify(registry.merged().sites);
    if (now !== lastSites) { lastSites = now; if (world === 'live') rebuild(); }
  }, 2000);
  redraw();

  // ── the contract: the same test cases the C core passes ─────────────────
  const BASE = '/shell/route-vectors/';
  const matchOf = (s) => String(s).trim().split(/\s+/).map((h) => (h.toLowerCase() === 'xx' ? null : parseInt(h, 16)));

  function run(v) {
    const core = createCore();
    for (const p of v.ports) core.addPort({ ...p, rules: (p.rules || []).map((r) => ({ match: matchOf(r.match), do: r.do })) });
    const refused = [];
    for (const l of v.links) {
      const r = core.link(l);
      if (!r.ok) refused.push(`${l.id}:${r.reason}`);
    }
    const out = [];
    for (const s of v.in) {
      const t = s.t ?? 0;
      if (s.unlink !== undefined) out.push(...core.unlink(s.unlink, t));
      else if (s.confirm !== undefined) out.push(...core.confirm(s.confirm, t));
      else if (s.deny !== undefined) core.deny(s.deny);
      else out.push(...core.input({ port: s.port, t, bytes: fromHex(s.bytes) }));
    }
    const held = {};
    for (const p of v.ports) held[p.id] = core.held(p.id);
    return { out, refused, held };
  }

  const line = (e) => `${e.port} @${e.t ?? 0}  ${typeof e.bytes === 'string' ? toHex(fromHex(e.bytes)) : toHex(e.bytes)}`;

  function grade(v) {
    const got = run(v);
    const want = v.out.map(line), have = got.out.map(line);
    const outOk = want.length === have.length && want.every((w, i) => w === have[i]);
    const refOk = got.refused.join(' ') === (v.refused || []).map((r) => `${r.link}:${r.reason}`).join(' ');
    const heldOk = !v.held || Object.entries(v.held).every(([k, n]) => got.held[k] === n);
    return { got, want, have, ok: outOk && refOk && heldOk };
  }

  const cases = createTable({
    columns: [
      { key: 'n', label: 'no', width: 36 },
      { key: 'name', label: 'case', grow: true, hi: true },
      { key: 'ins', label: 'in', width: 40, align: 'right' },
      { key: 'outs', label: 'out', width: 40, align: 'right' },
      { key: 'res', label: 'result', width: 64 },
    ],
    empty: 'the test cases have not loaded',
    note: 'about',
    onPick: (r) => show(r.v),
  });
  const detail = el('pre', 'rout-case');
  d.stack.titled('THE CONTRACT',
    say('Each case is a file of ports, connections and messages going in, with the exact bytes that must come out, '
      + 'worked out by hand rather than by running any code. This browser runs the JavaScript core against all of them '
      + 'on every visit. Click a row to see what went in, what was expected and what came out.'),
    cases.el, detail);

  /** One case written out: what went in, what was expected, what came out. */
  function show(v) {
    const g = grade(v);
    detail.textContent = '';
    const put = (tag, text) => detail.append(tag ? el(tag, '', text) : document.createTextNode(text));
    put('b', `${v.name}\n`);
    put('', `ports  ${v.ports.map((p) => `${p.id} (${p.dir})`).join('  ')}\n`);
    for (const l of v.links) put('', `link   ${l.id}  ${l.from} > ${l.to}${(l.ops || []).length ? '  ' + l.ops.map((o) => JSON.stringify(o)).join(' ') : ''}\n`);
    if ((v.refused || []).length) put('', `refused ${v.refused.map((r) => `${r.link} ${r.reason}`).join('  ')}\n`);
    put('b', '\nin\n');
    for (const s of v.in) {
      put('', s.bytes !== undefined ? `  ${s.port} @${s.t ?? 0}  ${s.bytes}\n`
        : `  @${s.t ?? 0}  ${Object.entries(s).filter(([k]) => k !== 't').map(([k, x]) => `${k} ${x}`).join(' ')}\n`);
    }
    put('b', '\nexpected out\n');
    for (const w of g.want) put('', `  ${w}\n`);
    put('b', '\ncame out\n');
    g.have.forEach((h, i) => put(h === g.want[i] ? '' : 'i', `  ${h}\n`));
    if (!g.have.length) put('', '  nothing\n');
  }

  let vectors = [], passed = 0;
  async function loadCases() {
    const names = await (await fetch(`${BASE}index.json`, { cache: 'no-store' })).json();
    vectors = await Promise.all(names.map(async (f) => ({ file: f, ...(await (await fetch(BASE + f, { cache: 'no-store' })).json()) })));
    passed = 0;
    cases.set(vectors.map((v, i) => {
      const g = grade(v);
      if (g.ok) passed++;
      return { n: String(i + 1).padStart(2, '0'), name: v.name, ins: v.in.length, outs: v.out.length,
        res: g.ok ? 'pass' : 'FAIL', about: v.about || '', v };
    }));
    if (vectors.length) show(vectors.find((v) => !grade(v).ok) || vectors[vectors.length - 1]);
  }

  try { await loadCases(); d.log(`${passed} of ${vectors.length} test cases pass`, passed === vectors.length ? 'ok' : 'bad'); }
  catch (e) { d.log(`the test cases did not load (${e.message || e})`, 'bad'); }

  // ── checks ───────────────────────────────────────────────────────────────
  // All of them read data already in hand on a scratch graph, so they run for a
  // visitor too and change nothing on screen.
  {
    const t = deskBay();
    const opening = EXAMPLES.slice(0, 5).map((line) => { const l = parseLink(line); return t.link(l.from, l.to, l.transforms); });
    d.assert('the example desk makes its five opening links', opening.every((r) => r.ok), opening.map((r) => r.why || r.id).join(' | '));
  }
  {
    // The live desk is only as good as what a board says, so a board's graph is
    // graded here from a fixture, with no board and no socket.
    const reg = createRegistry();
    reg.ingest({ type: 'graph.announce', from: 'self', graph: SELF });
    reg.ingest({ type: 'board.alive', from: 'b', graph: boardGraph({ room: 'studio-1', instruments: { synth: true },
      inputs: [{ name: 'circuit', midi: { port: 'Circuit', channels: [1, 2] } }] }) });
    const t = reg.fill(createBay());
    const toScreen = t.link('studio-1:circuit:audio', `${SITE}:screen:audio`);
    const keys = t.link(`${SITE}:keys:out`, 'studio-1:circuit:in');
    d.assert('a board\u2019s announced Circuit can be linked to this browser, as a stream', toScreen.ok && !!toScreen.session, toScreen.why || toScreen.session?.transport);
    d.assert('and this browser\u2019s keys can be linked to the Circuit, as bytes', keys.ok && !keys.session, keys.why || keys.id);
    // ⚠️ NEGATIVE CONTROL: a graph that is not on its own site is not heard.
    const bad = createRegistry();
    d.assert('a graph that lies about its site is not heard',
      bad.ingest({ type: 'board.alive', from: 'x', graph: { v: 1, site: 'a', nodes: [{ id: 'b:n' }], ports: [] } }) === false);
  }
  {
    // The store, on a scratch live desk with a board from a fixture: data only,
    // so this runs for a visitor too, and the openers below only count.
    const reg = createRegistry();
    reg.ingest({ type: 'graph.announce', from: 'self', graph: SELF });
    reg.ingest({ type: 'graph.announce', from: 'self-store', graph: STORE });
    reg.ingest({ type: 'board.alive', from: 'b', graph: boardGraph({ room: 'studio-1',
      inputs: [{ name: 'circuit', midi: { port: 'Circuit', channels: [1, 2] } }] }) });
    const t = reg.fill(createBay());
    const rec = t.link('studio-1:circuit:audio', 'r2:recordings:in');
    d.assert('a sound linked into the recordings is accepted as an upload through ingest, at the store’s address',
      rec.ok && rec.session?.transport === 'ingest' && rec.session.address === 'ingest.positron.studio',
      JSON.stringify(rec.session || rec.why));
    const play = t.link('r2:recordings:out', `${SITE}:screen:audio`);
    const recL = t.links().find((x) => x.id === rec.id), playL = t.links().find((x) => x.id === play.id);
    d.assert('and the two store links open as a recording and a playback',
      !!recL && !!playL && kindOf(recL, t) === 'record' && kindOf(playL, t) === 'play',
      `${recL && kindOf(recL, t)} ${playL && kindOf(playL, t)}`);
    // ⚠️ NEGATIVE CONTROL: the store takes sound, so a picture is refused.
    const vid = t.link('studio-1:gpu:video', 'r2:recordings:in');
    d.assert('video into the sound recordings is refused', !vid.ok && /video/.test(vid.why || ''), vid.why);
    // The guard, with openers that only count and a map that is not the page's.
    let called = 0;
    const counting = Object.fromEntries(Object.keys(OPENERS).map((k) => [k, () => { called++; return { close() {}, state: () => '' }; }]));
    const into = new Map(), before = opened.size;
    const held = await openLink(recL, { on: t, selfcheck: true, openers: counting, into });
    d.assert('the record opener under the harness opens nothing',
      !held.ok && held.kind === 'record' && called === 0 && into.size === 0 && opened.size === before && sources.size === 0,
      held.why);
    // ⚠️ NEGATIVE CONTROL: the same call without the guard reaches the opener,
    // so the check above is the guard and not a link that never matched.
    const reached = await openLink(recL, { on: t, selfcheck: false, openers: counting, into });
    d.assert('and the same link without the guard reaches the record opener', reached.ok && called === 1 && into.size === 1,
      reached.why || reached.kind);
  }
  {
    const t = deskBay();
    const mk = (line, o = {}) => { const l = parseLink(line); return t.link(l.from, l.to, l.transforms, o); };
    const find = (r) => t.links().find((l) => l.id === r.id);
    const midi = mk(EXAMPLES[0]);
    d.assert('a MIDI link carries its bytes and has no session', midi.ok && !find(midi)?.session);
    const near = mk(EXAMPLES[1]);
    d.assert('sound from the Pi to the browser on one network is a stream, not bytes',
      near.ok && find(near)?.session?.where === 'network', JSON.stringify(find(near)?.session || near.why));
    const far = mk(EXAMPLES[3]);
    d.assert('video from the Pi to a phone on another network crosses the internet',
      far.ok && /^internet/.test(find(far)?.session?.where || ''), JSON.stringify(find(far)?.session || far.why));
    mk(EXAMPLES[4]);
    const second = mk(EXAMPLES[5]);
    /* ⚠️ THIS SAID `a third listener ... is many receivers` UNTIL 2026-10-06,
       and the third was the recording. A link into a store is an upload, not a
       listener (`bay.mjs` `whereOf`), so the phone after it is the first
       receiver across the internet. Many receivers is graded in `bay-test.mjs`. */
    d.assert('a recording is not a listener, so the phone after it is the first receiver across the internet',
      second.ok && find(second)?.session?.where === 'internet-one', JSON.stringify(find(second)?.session || second.why));
    // ⚠️ NEGATIVE CONTROLS: the two links this graph exists to refuse.
    const noConsent = mk(EXAMPLES[6]);
    d.assert('somebody else’s server is refused without a person who will listen', !noConsent.ok, noConsent.why);
    const withConsent = mk(EXAMPLES[6], { consent: true });
    d.assert('and allowed with one', withConsent.ok, withConsent.why || withConsent.id);
    const wrong = mk(EXAMPLES[7]);
    d.assert('video into a sound input is refused', !wrong.ok && /video/.test(wrong.why), wrong.why);
    d.assert('every link prints as the line it was written as',
      t.links().every((l) => { const p = parseLink(printLink(l)); return p.from === l.from && p.to === l.to; }));
  }
  {
    // Scenes, on a scratch bay: data only, so this runs for a visitor too.
    const t = deskBay();
    const lineOf = (b, r) => printLink(b.links().find((x) => x.id === r.id));
    const mk = (line) => { const l = parseLink(line); const r = t.link(l.from, l.to, l.transforms); return { id: r.id, line: lineOf(t, r) }; };
    const A = mk(EXAMPLES[0]), B = mk(EXAMPLES[1]);
    const other = deskBay(), l2 = parseLink(EXAMPLES[2]);
    const C = lineOf(other, other.link(l2.from, l2.to, l2.transforms));
    const now = [A, B].map((x) => ({ line: x.line, consent: false }));
    // Both of the current links stand in as open, so the test can see which
    // one the recall closes and that it opens nothing.
    const open = new Set([A.line, B.line]), closed = [];
    const before = opened.size;
    const r = applyScene(t, now, { name: 'test', lines: [{ line: B.line, consent: false }, { line: C, consent: false }] },
      { close: (line) => { closed.push(line); return open.delete(line); } });
    const lines = t.links().map(printLink);
    d.assert('a scene recall keeps the shared link, removes the one only now has and makes the one only the scene has',
      lines.length === 2 && lines.includes(B.line) && lines.includes(C) && !lines.includes(A.line)
        && t.links().find((x) => printLink(x) === B.line)?.id === B.id
        && r.changes.map((c) => c.op).join(' ') === 'removed made' && r.made.length === 2,
      r.changes.map((c) => `${c.op} ${c.line}`).join(' | '));
    d.assert('and opens nothing, closing only the link it removed and leaving the shared one open',
      closed.join(' | ') === A.line && open.has(B.line) && !open.has(C) && opened.size === before && !opened.has(C),
      `closed ${closed.length}, open ${[...open].join(', ')}`);
    // ⚠️ NEGATIVE CONTROL: a scene identical to now changes nothing at all.
    const ids = t.links().map((x) => x.id).join(' ');
    const same = applyScene(t, r.made, { name: 'same', lines: r.made }, { close: (line) => { closed.push(line); return true; } });
    d.assert('a recall of a scene identical to now changes nothing',
      same.changes.length === 0 && t.links().map((x) => x.id).join(' ') === ids && closed.length === 1,
      `${same.changes.length} changes`);
    d.assert('a new scene is named one past the highest number',
      nextSceneName([{ name: 'scene 1' }, { name: 'scene 3' }, { name: 'mine' }]) === 'scene 4' && nextSceneName([]) === 'scene 1');
  }
  d.assert('the picture drew every box and every arrow, and cut nothing',
    !(dg.cuts || []).length, (dg.cuts || []).map((c) => `${c.id} ${c.where}: ${c.shown || c.full}`).join(' | ') || 'no cuts');
  d.assert('the description is one sentence', !/[;:]/.test(WHAT), WHAT);
  d.assert('every listed test case loads and passes', vectors.length > 0 && passed === vectors.length, `${passed} of ${vectors.length}`);
  {
    // ⚠️ NEGATIVE CONTROL: the test-case comparison has to be able to fail.
    const v = vectors.find((x) => x.out.length) || vectors[0];
    const bent = v && { ...v, out: v.out.map((e, i) => (i ? e : { ...e, bytes: toHex(fromHex(e.bytes).map((b, j) => (j === 0 ? b ^ 1 : b))) })) };
    d.assert('a case with one expected byte changed reads as failing', !!v && !grade(bent).ok, v?.file);
  }
  {
    // The keys' path through the core, with no board: a link with a transpose
    // changes the note, and a link to an instrument that refuses SysEx drops it.
    const core = createCore();
    core.addPort({ id: 'keys', dir: 'in' });
    core.addPort({ id: 'out', dir: 'out', policy: { sysex: 'deny' } });
    core.link({ id: 'L', from: 'keys', to: 'out', ops: [{ op: 'transpose', by: 12 }, { op: 'channel', to: 2 }] });
    const up = core.input({ port: 'keys', t: 0, bytes: [0x90, 60, 100] });
    const sx = core.input({ port: 'keys', t: 1, bytes: [0xF0, 0x00, 0x20, 0x29, 0x01, 0x60, 0x01, 0xF7] });
    d.assert('a note on a link with { transpose 12, channel 2 } leaves the core moved and on channel 2',
      up.length === 1 && toHex(up[0].bytes) === '91 48 64', up.map((e) => toHex(e.bytes)).join(' | '));
    d.assert('and SysEx to an instrument that refuses it does not leave at all', sx.length === 0, `${sx.length} out`);
  }

  {
    // 🔴 THE OPENER IS CHOSEN BY THE SESSION'S TRANSPORT (openers.mjs), on a
    // scratch live desk from fixtures: data only, nothing opens.
    const reg = createRegistry();
    reg.ingest({ type: 'graph.announce', from: 'self', graph: SELF });
    reg.ingest({ type: 'graph.announce', from: 'self', graph: STORE });
    // A board graph as the Pi on the desk sends it today, with no `transports`:
    // the registry fills them in from `BOARD_TRANSPORTS`.
    const pi = boardGraph({ room: 'studio-1', instruments: { synth: true }, inputs: [{ name: 'circuit', midi: { port: 'Circuit', channels: [1] } }] });
    reg.ingest({ type: 'board.alive', from: 'b', graph: { ...pi, ports: pi.ports.map(({ transports, ...p }) => p) } });
    reg.ingest({ type: 'graph.announce', from: 'cam', graph: { v: 1, site: 'cam-1', place: 'phone', nodes: [{ id: 'cam-1:cam', kind: 'device', label: 'camera', place: 'phone' }],
      ports: [{ id: 'cam-1:cam:video', label: 'camera', dir: 'out', medium: 'video', shape: { codec: 'h264' }, address: 'cam-1-video' }] } });
    const t = reg.fill(createBay());
    const at = (from, to) => { const r = t.link(from, to); const l = t.links().find((x) => x.id === r.id); return l ? openers.pick(l, t) : { kind: null, transport: r.why }; };
    const got = {
      listen: at('studio-1:circuit:audio', `${SITE}:screen:audio`),
      synth: at('studio-1:synth:audio', `${SITE}:screen:audio`),
      video: at('studio-1:gpu:video', `${SITE}:screen:video`),
      keys: at(`${SITE}:keys:out`, 'studio-1:circuit:in'),
      notes: at(`${SITE}:keys:out`, 'studio-1:synth:in'),
      record: at('studio-1:circuit:audio', 'r2:recordings:in'),
      play: at('r2:recordings:out', `${SITE}:screen:audio`),
    };
    d.assert('each link is opened by the opener for its session\u2019s transport',
      Object.entries(got).every(([k, v]) => v.kind === k)
        && got.video.transport === 'relay-h264' && got.record.transport === 'ingest' && got.play.transport === 'https'
        && got.listen.transport === 'relay' && got.keys.transport === 'bytes',
      Object.entries(got).map(([k, v]) => `${k} ${v.kind} by ${v.transport}`).join(' | '));
    // ⚠️ NEGATIVE CONTROL: a picture from a page that says nothing of how it
    // travels is WHEP by the table, and nothing here opens WHEP. Dispatch on the
    // medium would have sent it to the board's video.start.
    const cam = at('cam-1:cam:video', `${SITE}:screen:video`);
    d.assert('a video link whose session is WHEP finds no opener, rather than the board\u2019s video one',
      cam.kind === null && cam.transport === 'whep' && /nothing here opens whep/.test(cam.why || ''), `${cam.kind} by ${cam.transport}: ${cam.why}`);
  }
  {
    // The badge rule, the stage's, fed fixtures (link-badge.mjs).
    const w = (o) => linkStateOf({ now: 10_000, ...o });
    d.assert('a link badge says starting after a press, receiving while the far count grows, stalled when it stops',
      w({ startedAt: 9_000 }) === 'coming' && w({ startedAt: 1_000, lastCountAt: 9_500 }) === 'online'
        && w({ startedAt: 1_000, lastCountAt: 7_000 }) === 'offline' && w({}) === 'unknown',
      ['coming', 'online', 'offline', 'unknown'].join(', '));
    // ⚠️ NEGATIVE CONTROL: a count that never grows stays starting and never
    // reads receiving, and a growing one does, through the real badge.
    let n = 5;
    const still = createLinkBadge({ count: () => 5, stallMs: 60, pollMs: 1000 }).start();
    const moving = createLinkBadge({ count: () => n, stallMs: 60, pollMs: 1000 }).start();
    n = 6; moving.poll();
    const firstWord = moving.says();
    // Past the stall window AND past one of the presence badge's own 200 ms
    // re-reads, which is what turns a quiet count into a word.
    await new Promise((r) => setTimeout(r, 320));
    still.poll(); moving.poll();
    d.assert('a count that never grows is never called receiving, and one that grew and stopped is stalled',
      still.says() === 'starting' && firstWord === 'receiving' && moving.says() === 'stalled' && !still.el.hidden,
      `still ${still.says()}, moving ${firstWord} then ${moving.says()}`);
    still.stop(); moving.stop();
    d.assert('a stopped badge is hidden', still.el.hidden && moving.el.hidden);
  }
  // 🔴 THE ROOM (bay-node.mjs). These two read state and open nothing.
  d.assert('building the page joined no room, the room waits for Join', !node.joined() && !node.joining(),
    node.joining() ? 'a socket is open' : 'no socket');
  d.assert('this tab is a site of its own and the harness is in a room of its own, never the studio\u2019s',
    /^web-[a-z0-9]{4}$/.test(SITE) && (!SELFCHECK || ROOM !== 'studio-1'), `${SITE} in ${ROOM}`);
  if (SELFCHECK) {
    // 🔴 THE ROUND TRIP, in the run's own room only: a second node in this tab
    // stands in for another page, announces a lane, and answers link.request.
    // The patchbay hears it, links it, opens it with the remote opener, and the
    // lane's own page says yes or no. Nothing reaches the studio.
    const until = async (ok, ms) => { const t0 = performance.now(); while (!ok() && performance.now() - t0 < ms) await new Promise((r) => setTimeout(r, 50)); return ok(); };
    const PEER = randomSite('peer');
    const asked = [];
    const peer = createBayNode({ room: ROOM, graphs: [{ v: 1, site: PEER, place: 'browser',
      nodes: [{ id: `${PEER}:lane`, kind: 'person', label: 'lane', place: 'browser' }, { id: `${PEER}:wall`, kind: 'screen', label: 'wall', place: 'browser' }],
      ports: [{ id: `${PEER}:lane:out`, label: 'lane', dir: 'out', medium: 'value' },
              { id: `${PEER}:wall:in`, label: 'wall', dir: 'in', medium: 'value' },
              { id: `${PEER}:wall:no`, label: 'shut wall', dir: 'in', medium: 'value' }] }],
      onLinkRequest: (m) => { asked.push(m); return m.target.endsWith(':no') ? { ok: false, why: 'that wall is shut' } : { ok: true }; } });
    await joinRoom();
    await peer.join();
    const heard = await until(() => bay.port(`${PEER}:lane:out`), 6000);
    const pre = asked.length;
    const r1 = bay.link(`${PEER}:lane:out`, `${PEER}:wall:in`);
    const r2 = bay.link(`${PEER}:lane:out`, `${PEER}:wall:no`);
    const l1 = bay.links().find((x) => x.id === r1.id), l2 = bay.links().find((x) => x.id === r2.id);
    const into = new Map();
    const yes = l1 ? await openLink(l1, { selfcheck: false, into }) : { ok: false, why: r1.why };
    const no = l2 ? await openLink(l2, { selfcheck: false, into }) : { ok: false, why: r2.why };
    d.assert('a lane another page announced is opened by asking that page, through the room, and it says yes',
      heard && yes.ok && yes.kind === 'remote' && asked.length === pre + 2 && asked[pre].open === true,
      heard ? `${yes.kind} ${yes.why || 'opened'}, ${asked.length - pre} asked, in ${ROOM}` : `never heard ${PEER} in ${ROOM}`);
    d.assert('and a refusal comes back in that page\u2019s own words', !no.ok && /that wall is shut/.test(no.why || ''), no.why);
    // ⚠️ NEGATIVE CONTROL: this page's own keys, asked for by another page, are refused in words, not left unanswered.
    const mineAsked = await peer.request(`${SITE}:keys:out`, `${PEER}:wall:in`, true, { timeoutMs: 4000 });
    d.assert('this page answers a request for its own keys with a refusal, because a person here opens them',
      mineAsked?.open === false && /a person here/.test(mineAsked.why || ''), JSON.stringify(mineAsked));
    for (const o of into.values()) o.close();
    if (l1) bay.unlink(l1.id);
    if (l2) bay.unlink(l2.id);
    peer.leave();
    node.leave();
    joinRow.button('join').disabled = false;
    rebuild();
  }

  d.ready();
</script>
