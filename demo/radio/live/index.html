<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>Live tempo</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/concept.css">
<style>
  /* The detector's beats, drawn over the wave on the wave's own seconds: a
     canvas laid exactly on the scope's, so it moves nothing. */
  .cc-wave { position: relative; }
  /* The tempo scope: bpm up, time across, the full width of its panel and
     the wave's height (the scope's 150). It sits in a host as the wave does,
     because the panel stretches a canvas that is its direct child. */
  .cc-tempo { display: block; width: 100%; height: 150px; touch-action: pan-y; }
  /* Play on its own row: the button's own size, at the left. */
  .cc-top { display: flex; }
</style>
<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount } from '/shell/shell.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createTempoRig } from '/radio/rig.mjs';
  import { createMp3Stream } from '/shell/mp3-stream.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';

  // concepts radio/030, LIVE TEMPO, 2026-10-11. /radio/tempo/ with one
  // thing changed, the source. Asked: *"do beats 005 with live radios"*. The
  // detector, the wave with its beat lines, the tempo scope, the fx box and the
  // mix knob are radio/020's, line for line. Instead of a recording looped
  // from our bucket, the station plays LIVE through our own relay
  // (`cf-shout`, the positron-shout worker, which holds ONE upstream connection
  // per mount however many tabs listen), read with the kit's createMp3Stream
  // exactly as /radio/blend/ reads it. `?base=` points the page at
  // demo/fake-station.mjs instead.
  //
  // 🔴 NOTHING OPENS ON A VISIT, AND ONE STATION AT A TIME. Every connection to
  // an ERR mount is counted in a public broadcaster's listener statistics
  // (CLAUDE.md, "What costs real money and somebody else's server"), so a
  // stream is opened only on Play, closed on Stop, and closed BEFORE the next
  // one opens when the station is switched while playing. Under ?selfcheck=1 the
  // page never opens a stream at all: Play logs that a check is running and
  // plays nothing.
  //
  // Ida is ADTS AAC, the two ERR mounts MP3. createMp3Stream reads both: it
  // picks the framing from the response's content-type and configures the
  // decoder from the first frame's header (mp3-stream.mjs, "TWO CODECS"), as
  // /radio/blend/ already plays ida-tallinn. No media element.
  //
  // The mounts are workers/shout/worker.mjs's: `raadio2` and `raadio4` (ERR,
  // 128 kbit/s MP3) and `ida-tallinn` (Ida Radio Tallinn).
  const BASE = new URLSearchParams(location.search).get('base') || 'https://shout.positron.studio';
  const STATIONS = [
    { id: 'raadio2', label: 'Raadio 2', site: 'err', node: 'raadio2', mount: 'raadio2', name: 'ERR Raadio 2' },
    { id: 'raadio4', label: 'Raadio 4', site: 'err', node: 'raadio4', mount: 'raadio4', name: 'ERR Raadio 4' },
    { id: 'ida', label: 'Ida', site: 'ida', node: 'tallinn', mount: 'ida-tallinn', name: 'Ida Radio Tallinn' },
  ];
  const srcOf = (st) => `${BASE}/${st.mount}`;
  const S = 'web';
  // The station is a site of its own and the relay is a hop of its own, as
  // /radio/blend/ draws them: the station's link ends at the relay, and
  // the page reads the relay.
  const STATION_OUT = (st) => `${st.site}:${st.node}:audio-out`;
  const RELAY_IN = (st) => `cf-shout:${st.mount}:audio-in`, RELAY_OUT = (st) => `cf-shout:${st.mount}:audio-out`;
  // The level node takes the place of radio/020's player: the live sound comes
  // in, is raised to one loudness, and feeds the wave, the detector and the fx.
  const PLAYER_IN = `${S}:level:audio-in`, PLAYER_OUT = `${S}:level:audio-out`;

  // ── the bay ─────────────────────────────────────────────────────────────
  // A live station is AUDIO all the way: the station's site into the relay,
  // the relay into the level node in this tab, and the level node's
  // `audio-out` feeds the wave, the speakers and the detector.
  const bay = createBay();
  for (const st of STATIONS) {
    bay.addNode({ id: `${st.site}:${st.node}`, kind: 'external', label: st.name, place: st.site, net: st.site });
    bay.addPort({ id: STATION_OUT(st), label: st.label, dir: 'out', medium: 'audio', transports: ['https'] });
    bay.addNode({ id: `cf-shout:${st.mount}`, kind: 'endpoint', label: 'relay', place: 'cf-shout' });
    bay.addPort({ id: RELAY_IN(st), label: 'relay', dir: 'in', medium: 'audio', transports: ['https'] });
    bay.addPort({ id: RELAY_OUT(st), label: 'relay', dir: 'out', medium: 'audio', transports: ['https'], address: srcOf(st) });
  }
  bay.addNode({ id: `${S}:level`, kind: 'engine', label: 'level', place: 'browser' });
  bay.addPort({ id: PLAYER_IN, label: 'level', dir: 'in', medium: 'audio' });
  bay.addPort({ id: PLAYER_OUT, label: 'level', dir: 'out', medium: 'audio' });
  // The wave, the detector, the tempo scope and the fx box are /radio/rig.mjs.

  const d = mount({ name: 'Live tempo', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('radio/live');

  // ── the sound ───────────────────────────────────────────────────────────
  let ctx = null, pull = null, out = null;   // the rig's, from its first Play
  // The one open stream, or null: { st, stream, live }. Never two.
  let leg = null;

  // The station's two wires are lit while its stream is live, only for the
  // station picked; the audio wires in this tab while it plays.
  const rig = createTempoRig({ bay, d, site: S, stations: STATIONS, srcOf, playerOut: PLAYER_OUT, seen: true,
    // Holding a link opens nothing. A link out of an `external` node is refused
    // without `consent: true`, and the consent is the Play press, the moment a
    // person asks to listen, so it is named here where the link is made, as on
    // /radio/blend/.
    holdSources: (hold) => {
      for (const st of STATIONS) {
        hold(STATION_OUT(st), RELAY_IN(st), { consent: true, via: 'https' });
        hold(RELAY_OUT(st), PLAYER_IN, { via: 'https' });
      }
    },
    flowing: (l, medium, playing) => {
      if (medium !== 'audio') return false;
      const live = playing && !!leg?.live;
      const st = STATIONS.find((s) => l.from === STATION_OUT(s) || l.from === RELAY_OUT(s));
      if (st) return live && leg.st === st;
      return live;
    },
    // 🔴 A HARNESS NEVER OPENS A LIVE STREAM. Every connection to an ERR mount
    // lands in a public broadcaster's audience statistics, and Ida's server is
    // somebody else's too, so under ?selfcheck=1 Play opens nothing, makes no
    // AudioContext and plays nothing.
    refuse: () => {
      if (!SELFCHECK) return false;
      d.log('a self check is running, so no live stream is opened and nothing plays');
      return true;
    },
    build: () => { ({ ctx, pull, out } = rig); levelBuild(); },
    // ⚠️ THE SOURCE IS LIVE HERE, AND NOTHING ABOUT WHERE A BEAT LANDS CHANGES.
    // The stream reaches this tab a few seconds behind the station (the relay,
    // the network and createMp3Stream's cushion), but the detector never sees
    // the station's clock. It hears the samples this tab plays and stamps them
    // with `e.playbackTime`, so beats are placed on the tab's audio clock as
    // before, against the very sound the speakers play, and the click is
    // scheduled on that same clock. What is new is that a reading cannot look
    // ahead or loop: the first one waits MIN_S of sound after the stream starts.
    // The press is the person asking to listen: only now does a stream open,
    // and only the one station picked.
    start: (st) => open(st),
    stop: () => close(),
    demo: { open: () => (leg ? leg.st.id : null), live: () => !!leg?.live, stream: () => leg?.stream.stats() ?? null,
      gain: () => (lv ? +lv.g.toFixed(3) : null), levels: () => Object.fromEntries(levels) },
  });

  // ── the level: one gain per station, from a running RMS ──────────────────
  // radio/020 levels each recording as it is decoded, per 1 s block, toward
  // -16 dB RMS, raise only, up to 36 dB, then a tanh knee. A live stream has no
  // whole file to measure ahead of, so here the gain follows the sound as it
  // arrives. MEASURED on the captures (the session, 2026-10-11): Ida is music
  // at about -44 dB RMS (peaks -30) for most of its length with one 25 s
  // stretch at -14 dB, against Raadio 2's -15.5 mean. So the gain has to reach
  // about 28 to 30 dB AND come down within a fraction of a second when a loud
  // stretch arrives.
  //
  // How: the stream's RMS BEFORE the gain (so the gain never measures itself),
  // read every LEVEL_READ_MS, followed twice, slowly over LEVEL_SLOW_S and fast
  // over LEVEL_FAST_S. The louder of the two sets the target LEVEL_RMS / rms,
  // never under 1 (raise only, a loud station is left alone) and never over
  // LEVEL_MAX (36 dB, as radio/020). The gain falls to a lower target fast
  // (LEVEL_DOWN_S) and rises to a higher one slowly (LEVEL_UP_S), so it never
  // rises into a loud stretch and it never pumps on a single drum hit. Under
  // LEVEL_FLOOR (a gap, a silence) it holds, so a pause is not raised into
  // hiss. A DynamicsCompressor set as a limiter after the gain takes what gets
  // over the top in the moment before the gain has come down, which is the
  // tanh knee's job in radio/020. Each station keeps its gain, so coming back to
  // Ida starts where Ida was. The detector hears the levelled sound too.
  // ⚠️ The limiter delays everything after it by its few ms of look-ahead,
  // the detector and the speakers alike, so they stay in step with each other.
  const LEVEL_RMS = 10 ** (-16 / 20), LEVEL_MAX = 10 ** (36 / 20), LEVEL_FLOOR = 10 ** (-60 / 20);
  const LEVEL_READ_MS = 100, LEVEL_SLOW_S = 3, LEVEL_FAST_S = 0.3, LEVEL_DOWN_S = 0.08, LEVEL_UP_S = 1.5;
  const levels = new Map();        // station id -> its gain, kept across plays
  let lv = null;                   // { meter, buf, gain, limit, slow, fast, g, timer }
  function levelBuild() {
    lv = { meter: ctx.createAnalyser(), gain: ctx.createGain(), limit: ctx.createDynamicsCompressor(), slow: 0, fast: 0, g: 1, timer: 0 };
    lv.meter.fftSize = 4096; lv.meter.smoothingTimeConstant = 0;
    lv.buf = new Float32Array(lv.meter.fftSize);
    lv.meter.connect(pull);          // pulled, or it is never run
    const c = lv.limit;
    c.threshold.value = -3; c.knee.value = 3; c.ratio.value = 20; c.attack.value = 0.002; c.release.value = 0.15;
    lv.gain.connect(c).connect(out);
  }
  function levelStart(st, node) {
    lv.g = levels.get(st.id) ?? 1;
    lv.slow = 0; lv.fast = 0;
    lv.gain.gain.cancelScheduledValues(ctx.currentTime);
    lv.gain.gain.setValueAtTime(lv.g, ctx.currentTime);
    node.connect(lv.meter);
    node.connect(lv.gain);
    clearInterval(lv.timer);
    const kSlow = 1 - Math.exp(-LEVEL_READ_MS / 1000 / LEVEL_SLOW_S), kFast = 1 - Math.exp(-LEVEL_READ_MS / 1000 / LEVEL_FAST_S);
    let said = 0;
    lv.timer = setInterval(() => {
      if (!rig.playing || !leg?.live || leg.st !== st) return;
      lv.meter.getFloatTimeDomainData(lv.buf);
      let s = 0; for (const v of lv.buf) s += v * v;
      const ms = s / lv.buf.length;
      lv.slow = lv.slow ? lv.slow + (ms - lv.slow) * kSlow : ms;
      lv.fast = lv.fast ? lv.fast + (ms - lv.fast) * kFast : ms;
      const rms = Math.sqrt(Math.max(lv.slow, lv.fast));
      if (rms < LEVEL_FLOOR) return;
      const g = Math.max(1, Math.min(LEVEL_MAX, LEVEL_RMS / rms));
      const tau = g < lv.g ? LEVEL_DOWN_S : LEVEL_UP_S / 3;
      lv.g = g;
      levels.set(st.id, g);
      // Each target takes over from where the last glide has got to, so no cancel.
      lv.gain.gain.setTargetAtTime(g, ctx.currentTime, tau);
      const now = performance.now();
      if (now - said > 10000) { said = now; d.log(`${st.label} at ${(20 * Math.log10(rms)).toFixed(1)} dB RMS, raised ${(20 * Math.log10(g)).toFixed(1)} dB`); }
    }, LEVEL_READ_MS);
  }

  // ── the stream: opened on Play, closed on Stop and on a switch ───────────
  function open(st) {
    // One connection at a time, whatever called this.
    close();
    const url = srcOf(st);
    d.log(`opening ${url}`);
    const stream = createMp3Stream(ctx, { url, log: (m) => d.log(`${st.label}: ${m}`) });
    const me = { st, stream, live: false };
    leg = me;
    levelStart(st, stream.node);
    stream.started.then((path) => {
      if (leg !== me) return;
      me.live = true;
      d.log(`${st.label} playing, ${path}`);
      rig.pb.refresh();
    }).catch((e) => { if (leg === me) d.log(`${st.label} did not start: ${e?.message || e}`, 'warn'); });
  }
  function close() {
    if (!leg) return;
    const { st, stream } = leg;
    leg = null;
    try { stream.stop(); } catch { /* already stopped */ }
    try { stream.node.disconnect(); } catch { /* gone */ }
    if (lv) clearInterval(lv.timer);
    d.log(`${st.label} closed`);
  }

  d.ready();
</script>
