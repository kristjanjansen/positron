<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<script type="module">
  import { mount, guard } from '/shell/shell.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createStripView } from '/shell/strip.mjs';
  import { createGlue } from '/shell/glue.mjs';
  import { createCard, createCardGrid } from '/shell/card.mjs';
  import { createDiagram } from '/shell/diagram.mjs';
  import { ifSelfcheck } from '/shell/selfcheck.mjs';
  import { createDeck } from '/timeline/transport.mjs';

  /**
   * The score of Held in Human, already read. `demo/resources/held-in-human.mjs`
   * is not a thing: the file below is generated by
   * `demo/resources/build-held-in-human.mjs` out of the score Kristjan supplied,
   * and every duration in it says whether it is stated in the score, measured by
   * summing the score's own content, or absent. This page draws that file and
   * decides nothing the file leaves open.
   *
   * 🔴 IT IS OURS AND IT IS LOCAL, SO READING IT COSTS NOBODY ANYTHING. That is
   * the whole reason the picture can be built on a visit while every control
   * that would MOVE it sits behind `ifSelfcheck`.
   */
  const SRC = '/resources/held-in-human.json';

  /** Every reach this page makes, counted, so the claim that it opens nothing
   *  outside this site is a number rather than a reading of the source. */
  let offSite = 0;
  const fetched = [];
  async function read(url) {
    const u = new URL(url, location.href);
    fetched.push(u.pathname);
    if (u.origin !== location.origin) offSite += 1;
    const r = await fetch(u);
    if (!r.ok) throw new Error(`${u.pathname} answered ${r.status}`);
    return r.json();
  }

  const d = mount({
    name: 'held',
    // ONE SENTENCE, AND IT IS THE INDEX CARD'S OWN LINE. This page carries a
    // diagram, so the paragraph and the picture would be two explanations of
    // one thing with the paragraph the weaker of them.
    what: 'Held in Human, a mixed reality piece by Liis Vares and Taavet Jansen, '
      + 'drawn from its own score: eight scenes, a voice that outlives them, and '
      + 'the one scene the score gives no length.',
    /**
     * 🔴 NO READOUT, AND `null` RATHER THAN AN OMITTED FIELD, so the harness
     * reads the opt out as deliberate. Instructed 2026-09-19: *"rm readout from
     * held"*.
     *
     * ⚠️ WHAT THE FOUR CELLS SAID IS ON THE LINE, WHICH IS WHERE IT ALWAYS
     * BELONGED. They were the playhead's own report: which scene, how much of
     * the real room, which colour table, whether the voice was speaking. Every
     * one of those is a lane the playhead crosses an inch above: the
     * scenes lane holds its current bar at full strength while the rest step
     * back, the room curve writes its held percentage on itself, the tint lane
     * now writes each table's NAME in its band, and a line being spoken is a
     * bar under the playhead. A row of cells re-saying that in words was the
     * same four facts twice.
     */
    readout: null,
    // NO CONTROLS BESIDE THE PAGE. The line is the control: it seeks on press
    // and on drag, and the transport bar under it carries play.
    controls: [],
  });
  guard(d);

  /* ── one clock, and it has a break in it ────────────────────────────────────
     🔴 THE MAZE HAS NO LENGTH IN THE SCORE, AND A PICTURE THAT GIVES IT A WIDTH
     INVENTS THE ONE NUMBER THE SCORE REFUSES TO STATE. `durationHow` is
     `absent`, `durationMs` is `null`, and the only line in the file with a
     negative time asks the visitor to walk towards the stairs. So the maze runs
     until a person moves, and nothing anybody can write down says how long that
     is.

     That is why every scene, event and spoken line in the data carries
     `at: { fromIntroMs, fromMazeEndMs }` with exactly one of the two filled in.
     The intro and the maze are placed from the intro's first keystroke;
     everything after the maze is placed from the END of the maze. Two origins,
     because one clock cannot hold both.

     WHAT THIS PAGE DRAWS is the axis the data itself states: the running order
     with the maze taken out, 12:55.2 from the first keystroke to the end of the
     outro. The maze is a BREAK in that axis, drawn as a hatched column whose
     width is in PIXELS and never in milliseconds, so it claims no duration at
     any zoom. Left of the break the clock reads from the intro; right of it,
     from the end of the maze.

     ⚠️ AND THE BREAK IS NOT EMPTY. Two things happen inside the maze and
     neither can be placed on this clock: the outer maze begins 60 s in, and the
     one line that waits for a visitor is spoken there. They are named under the
     picture rather than drawn at a position that would be a guess. */
  let MAZE_AT = 0;          // where the intro ends and the break stands
  let KNOWN = 0;            // the whole axis: the running order, maze excluded

  /** A seam is furniture, not a duration. This is the only number that decides
   *  how wide it is drawn, and it is read in pixels by the renderer at every
   *  zoom, which is what the check at the foot of this file grades. */
  const SEAM_PX = 12;

  /* 🔴 THERE ARE THREE CUTS IN THIS CLOCK AND THEY ARE ONE DRAWING. The maze
     is a break in the middle; the transition is a break at BOTH ENDS, because
     it is the reset between one visitor and the next and the outro returns to
     it. A column that looked one way in the middle and another way at the edges
     would read as two different facts about the same thing, so the hatching,
     the width and the two hairlines are written once here and called three
     times. ⚠️ `full` is passed in rather than read from the strip, because a
     renderer is handed its own lane and only the caller knows the picture's
     height. */
  function drawBreak(g, C, cx, full) {
    const w = SEAM_PX, x0 = cx - w / 2;
    g.save();
    g.beginPath(); g.rect(x0, 0, w, full); g.clip();
    g.fillStyle = C.theme.bg; g.globalAlpha = 0.95;
    g.fillRect(x0, 0, w, full);
    g.globalAlpha = 0.55; g.strokeStyle = DIM; g.lineWidth = 1;
    for (let y = -w * 2; y < full + w * 2; y += 5) {
      g.beginPath(); g.moveTo(x0 - 2, y); g.lineTo(x0 + w + 2, y + w + 4); g.stroke();
    }
    g.globalAlpha = 0.5;
    g.beginPath(); g.moveTo(x0 + 0.5, 0); g.lineTo(x0 + 0.5, full);
    g.moveTo(x0 + w - 0.5, 0); g.lineTo(x0 + w - 0.5, full); g.stroke();
    g.restore();
    return w;
  }

  /** m:ss.s, which is how the plan and the data both write these. */
  const clock = (ms) => {
    const s = Math.max(0, ms) / 1000;
    const m = Math.floor(s / 60);
    const r = s - m * 60;
    return `${m}:${r < 10 ? '0' : ''}${r.toFixed(1)}`;
  };
  const secs = (ms) => `${(ms / 1000).toFixed(1)} s`;

  /* ── ink ────────────────────────────────────────────────────────────────────
     🔴 THE WHOLE PICTURE IS ONE INK EXCEPT FOR THE TINT LANE, AND THAT LANE IS
     A DELIBERATE EXCEPTION TO THIS PROJECT'S COLOUR RULE. The standing rule is
     that a mark's colour says HOW IT LANDED and never which lane it is in,
     because lane identity is already carried by the row, the name in the gutter
     and the swatch beside it.

     Here nothing landed. A score is a document: no scene was measured, no line
     was timed against anything, and there is no quality for a hue to report. So
     every lane is drawn in one restrained ink and strength is used where two
     kinds of mark have to be told apart.

     The exception is the tint lane, where the colour IS the fact being
     reported: the score sets a named colour lookup table on the passthrough
     image per scene, and neutral, green, blue and red are what it calls them.
     Drawing that lane in grey and writing the colour underneath would be a
     legend for a fact the picture could simply carry. Because it is the only
     coloured lane on the page, a hue anywhere else cannot be mistaken for
     identity, which is what the rule exists to prevent.

     ⚠️ THE BREAK IS THE SITE'S OWN ACCENT AND THAT IS NOT A THIRD MEANING. It
     is furniture rather than a mark: it says the axis has been cut here, it is
     the one thing on the page a reader has to notice, and `--hi` is what this
     site uses for the one thing that matters on a page. Nothing is positioned
     by it and nothing is measured in it. */
  const INK = '#b6bcc7';
  const DIM = '#6a7280';
  const HI = '#ffd400';
  /** The four tables the score names. These are OUR readings of four words, not
   *  the piece's own lookup tables, which are not in the file. Muted on
   *  purpose: the band sits under a picture of a room, not on a chart. */
  /**
   * 🔴 THE ONE LANE THAT KEEPS ITS COLOUR, AND IT IS QUIETER THAN IT WAS.
   * Instructed 2026-09-19 as *"make lanes monochrome"*, then corrected within
   * the minute: *"ok tint lane is ok to leave to color. just make it subtler"*.
   * So the exception stands and the reason for it is unchanged: the score sets
   * a named colour table on the passthrough image per scene, and neutral,
   * green, blue and red are what it CALLS them, so drawing this lane in grey
   * and writing the colour underneath would be a legend for a fact the picture
   * can simply carry.
   * ⚠️ WHAT WAS WRONG WAS THE VOLUME, NOT THE CHANNEL. The four were mixed at
   * the strength of a thing being reported, on a page where every other mark is
   * one restrained ink, so the tint lane was the loudest row in a quiet
   * picture. These are the same four hues pulled towards the page's own ink:
   * each is still recognisably its colour beside the others, and none of them
   * outshouts the marks above and below.
   */
  const TINT = { neutral: '#8b93a1', green: '#7f9e8a', blue: '#7d94ad', red: '#ab8079' };

  // ── the picture, built once the score is in hand ──────────────────────────
  let strip = null, view = null, deck = null;
  let data = null;
  /** Which scene the line is standing in, read by the scenes lane so the bar it
   *  is inside keeps its full strength while the rest step back. */
  let currentScene = null;
  /** What the pointer was last on, and which refusal the log last said in full.
   *  The strip hands a press a POSITION and not a row, so the hit the footer
   *  was built from is the only thing that knows what was pressed. */
  let lastHit = null, saidOpen = null;
  /** What the break last drew, in pixels, written by its own renderer. The one
   *  check that can tell furniture from a duration reads this. */
  let seamDrawn = null;
  /** The same, for the two columns at the ends of the axis. */
  let offDrawn = null;

  /** A label is drawn only when the WHOLE of it fits in its bar.
   *
   *  🔴 A TRUNCATED QUOTATION IS A MISQUOTE, AND THE LINES IN THIS LANE ARE
   *  SOMEBODY ELSE'S WORDS. The spans renderer draws a label at 11 px
   *  monospace and does not shorten it, so a long question would simply run out
   *  of its bar and be cut by the canvas. Better nothing on the bar and the
   *  whole line under the picture. */
  const fits = (text, bw) => (bw - 16 >= String(text).length * 6.7 ? String(text) : '');

  (async () => {
    data = await read(SRC);

    const sceneById = new Map(data.scenes.map((s) => [s.id, s]));
    MAZE_AT = sceneById.get('intro').durationMs;
    KNOWN = data.piece.knownMs;

    /**
     * Where a thing sits on this axis, or null when the axis cannot hold it.
     *
     * ⚠️ `fromIntroMs` GREATER THAN THE INTRO'S LENGTH MEANS INSIDE THE MAZE.
     * The score measures the outer maze's start from the intro, at 60 s past
     * the point where the maze begins, so it reads as a perfectly ordinary
     * number and would land in the middle of the dialogue on an axis that has
     * taken the maze out. It is refused here and said in the log instead, with
     * the maze's own break beside it.
     */
    const placedAt = (at) => {
      if (!at) return null;
      if (at.fromMazeEndMs != null) return MAZE_AT + at.fromMazeEndMs;
      if (at.fromIntroMs != null) return at.fromIntroMs > MAZE_AT ? null : at.fromIntroMs;
      return null;
    };

    // ── the seven scenes this clock can hold ────────────────────────────────
    const placedScenes = data.scenes
      .map((s) => ({ s, at: placedAt(s.at) }))
      .filter((r) => r.at != null && r.s.durationMs != null)
      .map(({ s, at }) => ({ ...s, at, to: at + s.durationMs }));

    const sceneAtTime = (t) => placedScenes.find((s) => t >= s.at && t < s.to) || null;

    // ── how much of the real room is left, as a step with a ramp into it ────
    //
    // The transition's own value (1.00) is the intro's `from`, so the line
    // opens at a whole room and falls away over four seconds. The transition
    // itself is not on this axis: it is drawn as a break at each end of it,
    // for the reason its own lane carries.
    const roomSteps = data.channels.opacity.points
      .map((p) => ({ p, at: placedAt(sceneById.get(p.sceneId)?.at) }))
      .filter((r) => r.at != null && sceneById.get(r.p.sceneId).durationMs != null)
      .map(({ p, at }) => ({ at, from: p.from, value: p.value, fadeMs: p.fadeMs,
                             rate: p.ratePerSecond, sceneId: p.sceneId, sceneName: p.sceneName }))
      .sort((a, b) => a.at - b.at);

    /** The curve the renderer draws, as a function, so the check at the foot of
     *  this file grades the drawn thing rather than the table it came from. */
    const roomAt = (t) => {
      if (!roomSteps.length) return null;
      if (t <= roomSteps[0].at) return roomSteps[0].from;
      let i = 0;
      while (i + 1 < roomSteps.length && roomSteps[i + 1].at <= t) i++;
      const st = roomSteps[i], gone = t - st.at;
      if (st.fadeMs > 0 && gone < st.fadeMs) return st.from + (st.value - st.from) * (gone / st.fadeMs);
      return st.value;
    };

    // ── the colour on the camera image ──────────────────────────────────────
    const tintSteps = data.channels.lut.points
      .map((p) => ({ p, at: placedAt(sceneById.get(p.sceneId)?.at) }))
      .filter((r) => r.at != null && sceneById.get(r.p.sceneId).durationMs != null)
      .map(({ p, at }) => ({ at, from: p.from, value: p.value, fadeMs: p.fadeMs,
                             follows: p.followsRecommendation, sceneName: p.sceneName }))
      .sort((a, b) => a.at - b.at);
    const tintAt = (t) => {
      if (!tintSteps.length) return null;
      let i = 0;
      if (t < tintSteps[0].at) return tintSteps[0].from;
      while (i + 1 < tintSteps.length && tintSteps[i + 1].at <= t) i++;
      return tintSteps[i].value;
    };

    // ── the voice ───────────────────────────────────────────────────────────
    const voiceLines = data.qanda.lines
      .map((l) => ({ l, at: placedAt(l.at) }))
      .filter((r) => r.at != null && r.l.durationMs != null)
      .map(({ l, at }) => ({ ...l, at }));
    const unplacedLines = data.qanda.lines.filter((l) => placedAt(l.at) == null);
    const overrunning = voiceLines.filter((l) => l.landsIn);
    const voiceAtTime = (t) => voiceLines.find((l) => t >= l.at && t < l.at + l.durationMs) || null;

    // ── the score's other events ────────────────────────────────────────────
    //
    // The QandA blocks are left out of this lane: the voice lane above already
    // draws every line they hold, and a second mark saying the same block began
    // is one more thing to look at for a fact already on the page.
    const isQanda = (e) => /QandA/i.test(e.what);
    const otherEvents = data.events.filter((e) => e.sceneId && !isQanda(e));
    const placedEvents = otherEvents
      .map((e) => ({ e, at: placedAt(e.at) }))
      .filter((r) => r.at != null)
      .map(({ e, at }) => ({ ...e, at }));
    const mazeEvents = otherEvents.filter((e) => e.sceneId === 'maze');

    // ── the intro, which is a recording of somebody typing ──────────────────
    const keys = data.keystrokes.events;
    const correction = data.keystrokes.correction;

    // ── the deck ────────────────────────────────────────────────────────────
    //
    // ⚠️ THE RANGE IS `piece.knownMs` AND NOT A SUM THIS PAGE INVENTS. If
    // anything here ever gave the maze a width the axis would be longer than
    // the score accounts for, which is what the check below reads.
    deck = createDeck({ items: [], adapters: {}, range: [0, KNOWN] });

    // ── lanes ───────────────────────────────────────────────────────────────
    const rowsOf = (list, kind) => () => list.map((x, i) => ({
      at: x.at, id: `${kind}-${x.id ?? x.n ?? i}`, kind, payload: x,
    }));

    const scenesLane = {
      id: 'scenes', kind: 'scene', label: 'scenes', height: 44,
      as: 'spans', stack: false, terse: true, spanLine: false, barPad: 6, barGap: 1,
      color: INK, alpha: 0.9,
      // WHAT THIS LANE HOLDS, AND IT IS NOT ALL OF THEM. Six of the eight
      // scenes are bars. The maze has no length and is the break; the
      // transition has no place on this clock at all and is named under the
      // picture.
      subLabel: '6 bars of 8 scenes',
      rows: rowsOf(placedScenes.map((s) => ({ ...s, durMs: s.durationMs })), 'scene'),
      colorOf: () => INK,
      currentOf: (sp) => sp.row.payload.id === currentScene,
      labelOf: (sp, { bw }) => fits(sp.row.payload.name, bw),
    };

    /* 🔴 THE ONE LANE WHERE COLOUR IS THE FACT. See the note over `TINT`. */
    const tintLane = {
      id: 'tint', kind: 'tint', label: 'tint', height: 26,
      as: 'spans', color: INK, subLabel: '4 named tables',
      rows: rowsOf(tintSteps.map((t, i) => ({
        id: `tint-${i}`, at: t.at, durMs: (tintSteps[i + 1]?.at ?? KNOWN) - t.at, t,
      })), 'tint'),
      render: (g, L, C) => {
        const top = L.y + 4, h = L.height - 8;
        for (let i = 0; i < tintSteps.length; i++) {
          const t = tintSteps[i];
          const end = tintSteps[i + 1]?.at ?? KNOWN;
          const xa = C.x(t.at), xb = C.x(end);
          if (xb < 0 || xa > C.width) continue;
          const fadeX = C.x(t.at + t.fadeMs);
          if (t.fadeMs > 0 && fadeX > xa) {
            // THE FADE IS DRAWN AS THE FADE IT IS: the score gives each scene a
            // transition time from the PREVIOUS table to this one, so the band
            // opens as a gradient of exactly that length and only then holds.
            const grad = g.createLinearGradient(xa, 0, fadeX, 0);
            grad.addColorStop(0, TINT[t.from] || DIM);
            grad.addColorStop(1, TINT[t.value] || DIM);
            g.fillStyle = grad;
            g.fillRect(xa, top, Math.max(1, fadeX - xa), h);
          }
          g.fillStyle = TINT[t.value] || DIM;
          const holdX = Math.max(xa, fadeX);
          g.fillRect(holdX, top, Math.max(1, xb - holdX), h);
          /* 🔴 THE TABLE'S NAME, ON ITS OWN BAND, AND IT CAME OFF THE READOUT.
             A cell used to print `green` while the line stood in the cylinder,
             which answered the question for ONE instant and only while somebody
             was playing. The band is the fact, and the four names are what the
             score CALLS them, so the name goes on the thing: the same treatment
             the room curve already gives its held percentage. Drawn in the
             page's own background ink, which is a knockout label rather than a
             second colour, and only where the held part of the band is wide
             enough for the whole word. */
          /* ⚠️ TEN PIXELS IN, NOT FOUR, AND IT IS THE CARET'S OWN REASON. Two
             of these bands begin exactly where a break stands: the dialogue's
             at the maze and the first at the start of the axis. A break is a
             12 px column drawn last and over everything, so a name set hard
             against its band's left edge lost its first letter to the hatching
             and read `heutral`. */
          const holdW = xb - holdX;
          g.font = '9px ui-monospace, Menlo, monospace';
          if (holdW > g.measureText(t.value).width + 16) {
            g.fillStyle = C.theme.bg; g.globalAlpha = 0.82;
            g.fillText(t.value, holdX + 10, top + h - 5);
            g.globalAlpha = 1;
          }
          /* A scene whose fade breaks the score's own recommendation gets one
             hairline caret above the band, in the page's accent rather than in
             a hue, so the colour channel stays the score's statement and this
             stays an annotation on it. The two of them are one of the nine the
             score does not settle, and the second of the two carries that
             refusal's own mark in the lane below.
             ⚠️ EIGHT PIXELS IN FROM THE SCENE'S START, NOT ON IT. One of the
             two is the dialogue, which begins exactly where the break stands,
             and the break is drawn last and over everything: on the start the
             caret was underneath it and invisible, so the page was reporting
             one of the two and looking as though it reported both. */
          if (t.follows === false) {
            g.fillStyle = HI;
            g.fillRect(Math.round(xa) + 8, L.y + 1, 5, 2);
          }
        }
      },
    };

    const roomLane = {
      id: 'room', kind: 'room', label: 'room', height: 58,
      as: 'spans', color: INK, subLabel: '1.00 down to 0.15',
      rows: rowsOf(roomSteps.map((s, i) => ({
        id: `room-${i}`, at: s.at, durMs: (roomSteps[i + 1]?.at ?? KNOWN) - s.at, s,
      })), 'room'),
      render: (g, L, C) => {
        const top = L.y + 6, bot = L.y + L.height - 8, h = bot - top;
        const yOf = (v) => bot - v * h;
        const pts = [];
        for (const st of roomSteps) {
          pts.push([st.at, st.from]);
          pts.push([st.at + st.fadeMs, st.value]);
        }
        pts.push([KNOWN, roomSteps[roomSteps.length - 1].value]);
        g.save();
        g.beginPath();
        g.moveTo(C.x(pts[0][0]), bot);
        for (const [t, v] of pts) g.lineTo(C.x(t), yOf(v));
        g.lineTo(C.x(KNOWN), bot);
        g.closePath();
        g.globalAlpha = 0.14; g.fillStyle = INK; g.fill();
        g.globalAlpha = 0.92; g.strokeStyle = INK; g.lineWidth = 1.4;
        g.beginPath();
        g.moveTo(C.x(pts[0][0]), yOf(pts[0][1]));
        for (const [t, v] of pts) g.lineTo(C.x(t), yOf(v));
        g.lineTo(C.x(KNOWN), yOf(pts[pts.length - 1][1]));
        g.stroke();
        // The value where it holds, which is a constant per scene and so may be
        // written on the picture: it never changes while anybody is looking.
        g.globalAlpha = 1; g.fillStyle = DIM;
        g.font = '9px ui-monospace, Menlo, monospace';
        for (let i = 0; i < roomSteps.length; i++) {
          const st = roomSteps[i];
          const end = roomSteps[i + 1]?.at ?? KNOWN;
          const xa = C.x(st.at + st.fadeMs), xb = C.x(end);
          if (xb - xa < 26 || xb < 0 || xa > C.width) continue;
          g.fillText(`${Math.round(st.value * 100)}%`, xa + 3, yOf(st.value) - 3);
        }
        g.restore();
      },
    };

    const keysLane = {
      id: 'keys', kind: 'key', label: 'keys', height: 30,
      as: 'ticks', color: INK, alpha: 0.85,
      subLabel: `318 keys, ${clock(data.keystrokes.stats.spanMs)}`,
      rows: rowsOf(keys.map((k, i) => ({ ...k, id: `k${i}` })), 'key'),
      // ONE INK. A key that was typed, a Return and a Backspace are three kinds
      // of press and none of them is a measurement, so they are told apart by
      // WIDTH, which is this lane's second channel, and by the letter drawn on
      // the mark where the zoom has left room for one.
      widthOfRow: (r) => (r.payload.kind === 'type' ? 1.2 : 2.6),
      glyphOf: (r) => {
        const c = r.payload.char;
        return c && /[\p{L}\p{N}]/u.test(c) ? c : '';
      },
      describeRow: (r) => {
        const k = r.payload;
        if (k.kind === 'backspace') return [`backspace, ${JSON.stringify(k.removed)} removed`];
        if (k.kind === 'return') return ['return, a line ends here'];
        return [k.char === ' ' ? 'a space' : `the letter ${JSON.stringify(k.char)}`];
      },
    };

    const voiceLane = {
      id: 'voice', kind: 'voice', label: 'voice', height: 34,
      as: 'spans', stack: false, terse: true, spanLine: false, barPad: 6, barGap: 1,
      color: INK, subLabel: '24 lines, 8 silent',
      rows: rowsOf(voiceLines.map((l) => ({ ...l, id: `q${l.n}`, durMs: l.durationMs })), 'voice'),
      // SPEECH AND SILENCE ARE TOLD APART BY STRENGTH, NOT BY HUE. A silence in
      // this block is a row with a stated length, which is the thing that makes
      // the block work at all; it is the same voice doing the same job, so it
      // is the same ink held back rather than a second colour.
      colorOf: (sp) => (sp.row.payload.silence ? 'rgba(182,188,199,0.34)' : INK),
      labelOf: (sp, { bw }) => (sp.row.payload.silence ? '' : fits(sp.row.payload.text, bw)),
    };

    const eventsLane = {
      id: 'events', kind: 'event', label: 'events', height: 26,
      as: 'ticks', color: INK, alpha: 0.9,
      subLabel: `${placedEvents.length} of ${otherEvents.length} placed`,
      rows: rowsOf(placedEvents.map((e) => ({ ...e })), 'event'),
      widthOfRow: (r) => (r.payload.durationMs ? 2.4 : 1.4),
    };

    /* ── the nine the score does not settle, at the moment each one bites ────
       🔴 THIS LANE IS A TABLE THAT BECAME THE PICTURE. Asked for 2026-09-19:
       *"NOT ON THIS CLOCK / WHAT THE SCORE DOES NOT SETTLE: find to way to put
       it to tline"*. Both were blocks of prose under the line, and prose under
       a picture is the weaker half of two explanations of one thing.

       Every one of the nine has a place, and there are three kinds of place:
       FOUR bite at a moment and are marks in this lane; THREE are inside the
       maze, which has no length and is drawn as the break; TWO are outside the
       running order altogether and are drawn as the break at each end. Nothing
       is placed at a position the score does not give it, which is the rule
       this whole page is built on: the maze is a hatched column rather than a
       width for exactly that reason, and a region that says THE CLOCK IS CUT
       HERE is not the same claim as a point on it.

       ⚠️ WHAT EACH ONE SAYS IN FULL IS IN THE LOG, not here. A mark has one
       line under the picture and these are two and three sentence refusals with
       their readings; cutting one to fit would be quoting the score badly. The
       line says WHERE a question bites and how many ways it can be read, the
       log says what it is. */
    const sceneAt = (id) => placedAt(sceneById.get(id).at);
    const river = sceneById.get('river');
    const OPEN = {
      'trailing-keypress': {
        // The mark is on the full stop, not on the space: the space is the last
        // event in the track and lands exactly where the break stands, where a
        // mark would be drawn under the column and be invisible. The fact is
        // the GAP, and the gap begins here.
        at: data.keystrokes.stats.lastVisibleAtMs,
        say: `a space typed ${secs(data.keystrokes.stats.longestGapMs)} after this full stop, a cue or a stray` },
      'qanda-assignment': {
        // Where the two readings come apart: this slot is line 1 under one of
        // them and line 2 under the other.
        at: voiceLines[0].at,
        say: `${data.counts.qandaLines} lines for the ${data.counts.qandaAsked} the score asks for, so this is line 1 or line 2` },
      'lut-off-by-one': {
        // The second of the two adjacent fades. The first is the dialogue's,
        // which begins where the break stands and already carries its caret.
        at: sceneAt('cylinder'),
        say: `a ${secs(data.channels.lut.points.find((p) => p.sceneId === 'cylinder').fadeMs)} fade into the colour already showing, after a hard cut into the last one` },
      'river-pacing': {
        at: sceneAt('river'),
        say: `${data.counts.riverFragments} fragments in ${clock(river.durationMs)} and the block carries no timing at all` },
      'maze-length': { where: 'maze' },
      'maze-suffixes': { where: 'maze' },
      'radish': { where: 'maze' },
      'transition-clock': { where: 'transition' },
      'the-loop': { where: 'transition' },
    };
    const openMarks = data.ambiguities
      .filter((a) => OPEN[a.id]?.at != null)
      .map((a) => ({ ...a, at: OPEN[a.id].at, say: OPEN[a.id].say }))
      .sort((a, b) => a.at - b.at);
    const openInMaze = data.ambiguities.filter((a) => OPEN[a.id]?.where === 'maze');
    const openOffClock = data.ambiguities.filter((a) => OPEN[a.id]?.where === 'transition');
    /** The three places, so a check can ask whether they still add up. */
    const openPlaces = [openMarks, openInMaze, openOffClock];

    const openLane = {
      id: 'open', kind: 'open', label: 'open', height: 26,
      // 🔴 THE ACCENT, AND THIS IS THE SECOND THING ON THE PAGE TO SPEND IT.
      // The two carets in the tint lane were the first, and they are the same
      // kind of mark: an annotation ON the score rather than a part of it. The
      // score is drawn in one ink; what the score does not settle is drawn in
      // the page's own colour, so the two can never be mistaken for each other.
      as: 'ticks', color: HI, alpha: 0.95,
      subLabel: `${openMarks.length} of the ${data.ambiguities.length}`,
      rows: rowsOf(openMarks, 'open'),
      widthOfRow: () => 2.4,
    };

    /* 🔴 THE BREAK, AND IT IS DRAWN ACROSS THE WHOLE PICTURE ON PURPOSE. A lane
       renderer is handed the plot's full clip, and this one uses it: the maze is
       a property of the AXIS rather than of any one row, so a column that stops
       at the edges of its own lane would read as a mark in a track instead of as
       a clock that has been cut. Its own row is where the name and the facts
       are, which is why it is still a lane.

       ⚠️ IT IS NEAR THE END OF THE LANE LIST SO IT DRAWS OVER EVERYTHING.
       Lanes are painted in declaration order once nothing declares a provenance
       tier, and a break that other lanes painted over would be a break in
       nothing. The transition's two columns come after it and cannot collide
       with it: they stand at the ends of an axis this one is in the middle of.

       ⚠️ AND ITS WIDTH IS `SEAM_PX`, IN PIXELS, AT EVERY ZOOM. Nothing here
       converts a duration into a width, because there is no duration to
       convert. */
    const seamLane = {
      id: 'maze', kind: 'maze', label: 'maze', height: 36,
      // ⚠️ THE BREAK IS INK, NOT THE ACCENT. It was `HI`, the page's yellow,
      // which made the one piece of FURNITURE the loudest thing in the
      // picture. The accent is spent on the carets and on the open lane, which
      // are annotations on the score rather than parts of it.
      as: 'ticks', color: DIM,
      subLabel: ['no length stated', `${openInMaze.length} of the ${data.ambiguities.length}`],
      rows: () => [{ at: MAZE_AT, id: 'maze', kind: 'maze', payload: { seam: true } }],
      /* 🔴 ONE WIDTH, ON EVERY LANE. Reported 2026-09-19: *"maze should have
         same w on all lanes"*. There were TWO columns here: one at `SEAM_PX`
         across the whole picture, and a second at 26 px drawn only inside the
         break's own row, so the thing that is meant to be one break through the
         piece was twice as wide on one lane as on the lanes above it. A column
         that changes width by lane reads as two different facts about the same
         gap. */
      render: (g, L, C) => {
        const full = strip?.state?.contentH || (L.y + L.height);
        seamDrawn = { px: drawBreak(g, C, C.x(MAZE_AT), full), x: C.x(MAZE_AT) };
      },
    };

    /* 🔴 THE TRANSITION IS DRAWN AT BOTH ENDS, AND THAT IS THE LOOP. It is the
       reset between one visitor and the next: 40 s stated, with the credits
       rolling inside it and a wait after them, and nothing in the score says
       how long after it the intro begins. So it has no position in the running
       order, and the honest drawing of a thing with no position is the same one
       the maze gets: the clock is CUT here, in pixels, at a width that never
       becomes a duration.

       ⚠️ TWO COLUMNS, ONE REGION. The score's own recommendation about colour
       is satisfied only if the scene before the transition carries neutral, and
       the only candidate is the outro, so the piece reads as a loop. Drawing
       that region at the start AND at the end says the two ends are the same
       place, which a row in a table could only assert. Both ends are marks, so
       each can say its own half under the picture. */
    const offLane = {
      id: 'transition', kind: 'transition', label: 'transition', height: 36,
      as: 'ticks', color: DIM,
      subLabel: [`${secs(sceneById.get('transition').durationMs)}, no place`,
                 `${openOffClock.length} of the ${data.ambiguities.length}`],
      rows: () => [
        { at: 0, id: 'entry', kind: 'transition', payload: { end: 'entry' } },
        { at: KNOWN, id: 'loop', kind: 'transition', payload: { end: 'loop' } },
      ],
      render: (g, L, C) => {
        const full = strip?.state?.contentH || (L.y + L.height);
        offDrawn = { px: drawBreak(g, C, C.x(0), full), left: C.x(0), right: C.x(KNOWN) };
        drawBreak(g, C, C.x(KNOWN), full);
      },
    };

    // ⚠️ THE TWO LANES THAT CUT THE CLOCK ARE LAST, IN THIS ORDER, so their
    // three columns draw over everything. Lanes are painted in declaration
    // order, and a break that another lane painted over would be a break in
    // nothing.
    const lanes = [scenesLane, tintLane, roomLane, keysLane, voiceLane, eventsLane,
                   openLane, seamLane, offLane];

    // ── the bar, and the line under it as one surface ───────────────────────
    //
    // `scrub: false` because the line below is this page's position surface;
    // `loop: false` because nothing here sounds and a passage nobody can hear
    // twice does not earn a loop control. The piece's OWN loop, the outro
    // returning to the transition, is drawn as the break standing at both ends
    // of the axis rather than as a control on this bar.
    const bar = createTransportBar(d.el, deck, { scrub: false, loop: false });

    view = createStripView(d.el, deck, {
      size: 'auto', follow: false, gutter: 110, lanes,
      /* 🔴 ONE LINE, AND EMPTY WHEN NOTHING IS UNDER THE POINTER. Instructed
         2026-09-19: *"timeline footer in held: just leave empty when no hover.
         should be one line"*.
         ✅ THE EMPTY HALF IS A DECISION THIS PROJECT HAS ALREADY TAKEN ONCE.
         The readout used to print an em dash in an unmeasured cell, and it was
         removed on the reasoning that a cell does not have to show that it is a
         cell: the box around it already says so, and a row of placeholders
         reads as failed readings rather than as cells waiting. A line under a
         picture is the same shape, so `nothing under the pointer` goes.
         🔴 EMPTY MEANS NO TEXT, NEVER NO BOX. It is written on every hover
         change, so a box that collapsed when the pointer left the strip would
         push the page up and down while somebody read it, which is the measured
         `grain-scope` defect and the reason this footer has a fixed height at
         all. MEASURED after the change: 35 px with a mark under the pointer and
         35 px with nothing. */
      footer: { lines: 1, empty: '' },
      /**
       * 🔴 ONE VOICE UNDER THE LINE, WRITTEN HERE RATHER THAN PER LANE. This
       * page is ABOUT the relationship between its lanes: what is being said
       * while the room is at fifteen per cent, which scene a line lands in, how
       * far a block runs past its own end. `describeHit` is the hook for
       * exactly that, and it means the three lines say the same three kinds of
       * thing wherever the pointer is: WHAT it is, WHERE it is, and the fact
       * about it that is not on the picture.
       *
       * ⚠️ THE DEFAULT FIRST LINE IS THE LANE'S NAME AND THE CLOCK, and it is
       * replaced rather than kept. The lane's name is already in the gutter an
       * inch to the left of the mark, so spending the first of three lines on
       * it would leave one line for the thing being pointed at.
       */
      describeHit: (hit) => { lastHit = hit; return footerFor(hit); },
      /* 🔴 PRESS A REFUSAL AND THE SCORE'S OWN SENTENCE ARRIVES IN THE LOG.
         The nine are written out once at load, and a log is a scrollback: by
         the time a visitor has read the picture they are eight lines below the
         fold. The line is the index into them, so pressing a mark seeks to the
         moment the question bites AND says the whole of it again at the bottom
         of the log, where the newest line always is.
         ⚠️ IT STILL SEEKS. `onSeek` REPLACES the strip's own seek rather than
         adding to it, so the deck has to be moved here or the one position
         surface on this page stops working. */
      onSeek: (p) => {
        deck.seek(p);
        const row = lastHit?.lane?.id === 'open' ? lastHit.row?.payload : null;
        // ⚠️ DEDUPED AGAINST THE LAST ONE SAID, because a press becomes a DRAG
        // the moment a finger moves and `onSeek` fires the whole way along it.
        if (!row || row.id === saidOpen) return;
        saidOpen = row.id;
        d.log(`${row.where}: ${row.what} Read as ${row.readings.map((r) => r.how).join(', or as ')}.`);
      },
    });

    strip = view.strip;

    // THE ANCHOR IS READ BEFORE THE GLUE, because `createGlue` re-parents its
    // blocks and a node captured after the call can be detached.
    const afterStrip = view.surface.nextSibling;
    d.el.insertBefore(createGlue(bar.el, view.surface), afterStrip);

    /** What the footer says, for any hit. */
    /**
     * 🔴 ONE LINE, SO IT SAYS THE THING AND NOT THE CLOCK. Cut from three on
     * 2026-09-19. The three used to be WHAT it is, WHERE it is and the fact
     * that is not on the picture, and the clock was the cheapest of the three
     * to lose: the playhead's own cells report the time, and the mark's
     * position on the line already is its position.
     * ⚠️ WHAT EACH LANE GAVE UP IS WRITTEN HERE rather than left for somebody
     * to diff, because a line that reads worse as one than as three is worth
     * knowing about: `scenes` loses how its length is known (stated against
     * measured), which is the distinction the page is built on and which the
     * log's first line now carries; `voice` loses the reminder that which
     * scene speaks a line is a reading, which the log carries too; `tint`
     * keeps the fade because a hard cut against a fade is the score's own
     * decision, and loses the caret's sentence, which is on the caret.
     */
    function footerFor(hit) {
      if (!hit) return null;
      const L = hit.lane, p = hit.row?.payload;
      if (!p) return [L.label ?? L.id];
      switch (L.id) {
        case 'scenes':
          return [`${p.name}, ${secs(p.durationMs)} long`];
        case 'tint':
          return [p.t.fadeMs
            ? `${p.t.value} on the camera image, ${secs(p.t.fadeMs)} fade from ${p.t.from}`
            : `${p.t.value} on the camera image, a hard cut from ${p.t.from}`];
        case 'room':
          return [`${Math.round(p.s.value * 100)}% of the real room, from ${Math.round(p.s.from * 100)}%`];
        case 'keys': {
          const say = keysLane.describeRow({ payload: p })[0];
          return [p.delayMs >= 1000 ? `${say}, ${secs(p.delayMs)} of nothing before it` : say];
        }
        case 'voice':
          return [p.silence
            ? `silence, ${secs(p.durationMs)}`
            : (p.landsIn ? `${p.text} (${secs(p.landsIn.atMs)} into the ${p.landsIn.sceneName})` : p.text)];
        case 'events':
          return [p.durationMs ? `${p.what}, over ${secs(p.durationMs)}` : p.what];
        case 'open': {
          const n = p.readings.length;
          return [`${p.say}, ${n} reading${n === 1 ? '' : 's'}`];
        }
        case 'maze':
          return [`the maze, no length in the score, it waits for a visitor, `
            + `${openInMaze.length} of the ${data.ambiguities.length} open questions inside it`];
        case 'transition':
          return [p.end === 'entry'
            ? `the transition, ${secs(sceneById.get('transition').durationMs)} stated, and nothing on this clock places it`
            : 'the outro returns to the transition and the next visitor begins, which is a reading'];
        default:
          return [L.label ?? L.id];
      }
    }

    // ── which scene the line is standing in ─────────────────────────────────
    //
    // 🔴 WHAT IS LEFT OF THE READOUT'S REPORT, AND IT IS THE HALF THE PICTURE
    // CANNOT WORK OUT FOR ITSELF. The four cells are gone; the scenes lane
    // still has to know which of its bars the line is inside, so that one keeps
    // its full strength while the rest step back. The other three facts are
    // drawn where they happen: the room curve writes its percentage, the tint
    // band writes its table's name, and a line being spoken is a bar.
    //
    // ⚠️ IT WRITES NOTHING UNLESS THE SCENE HAS CHANGED. A frame loop that
    // redrew the strip sixty times a second would be repainting a picture that
    // is standing still whenever nobody is playing.
    const atLine = (t) => {
      const sc = sceneAtTime(t);
      const id = sc ? sc.id : null;
      if (id === currentScene) return;
      currentScene = id;
      strip?.invalidate?.();
    };
    atLine(deck.position());
    (function follow() {
      atLine(deck.position());
      requestAnimationFrame(follow);
    })();

    const creditsEv = data.events.find((e) => e.id === 'transition:credits');
    const waitCredits = data.events.find((e) => e.id === 'wait:credits-until-intro');
    const waitHeadset = data.events.find((e) => e.id === 'wait:headset-mounted-before-intro');
    const outerMaze = mazeEvents[0];
    const waitLine = unplacedLines[0];

    // ── whose work this is ──────────────────────────────────────────────────
    //
    /* 🔴 THE CREDITS BLOCK IS GONE. Instructed 2026-09-19: *"rm CREDITS, AS
       THE SCORE GIVES THEM"*, quoting its own heading, and it is the last of
       the three blocks that stood under the picture.
       ⚠️ TWO OF THE ELEVEN GROUPS WERE NEVER THANKS AND THEY DO NOT GO WITH
       IT. The intro and outro texts are Ene Mihkelson's, translated from
       Estonian, and THIS PAGE TYPES THAT TEXT OUT keystroke by keystroke in
       the `keys` lane, so it is not crediting a contributor, it is saying
       whose words a reader is watching appear. The dialogue is audience
       interaction from an earlier show, which is what those sixteen lines ARE.
       Both are in the log at load, where the refusals are, and the authors are
       in the page's own first sentence.
       ⚠️ AND THE OTHER NINE ARE NOT LOST, THEY ARE NOT OURS TO SHOW. They are
       in `demo/resources/held-in-human.json` under `texts.credits`, parsed into
       role groups, which is where somebody asking who made this should be
       sent. */
    const cr = data.texts.credits.groups;
    const roleOf = (h) => (cr.find((g) => g.heading === h)?.entries || [])
      .map((e) => e.replace(/,\s*$/, '')).join(', ');

    /* ── the page's own voice, and it is carrying two blocks that used to be
       tables ───────────────────────────────────────────────────────────────
       🔴 A REFUSAL IS A SENTENCE, AND A SENTENCE NEEDS A SURFACE THAT WRAPS.
       The nine used to be a three column table under the picture, which a
       phone cannot read: a table row has a floor of 560 px, so a column of
       prose in one drags the whole page sideways. The LINE now says where each
       of the nine bites and how many ways it can be read, and the log says
       what each one is, in full, in the score's own arithmetic, with every
       reading it carries. Nothing is settled here and nothing is dropped.
       ⚠️ THE FIRST LINE IS THE COUNT AND THE THREE KINDS OF PLACE, so a reader
       who has just seen four marks in a lane called `open` is told where the
       other five are before they go looking for them. */
    /* 🔴 WHOSE WORDS THESE ARE, BEFORE ANYTHING ELSE IS SAID. The credits
       block came off this page on 2026-09-19 and these two lines are what did
       not go with it, because neither is a thank you: the `keys` lane types
       out Ene Mihkelson's text keystroke by keystroke, and the sixteen
       dialogue lines ARE the audience interaction they name. Saying who wrote
       something a page is rendering is not a credit, it is the caption. */
    d.log(`the text the keys lane types is ${roleOf('Intro and Outro texts')}, `
      + `translated from Estonian by ${roleOf('Translation from Estonian')}`);
    d.log(`the dialogue, the whispers and the chat are ${roleOf('Whispers, chat, dialogue')}`);

    d.log(`the axis is the running order with the maze taken out, ${data.piece.knownClock} `
      + `from the first keystroke of the intro to the end of the outro. `
      + `${data.counts.scenesStated} of the scene lengths are stated in the score and `
      + `${data.counts.scenesMeasured} are measured by summing what the scene holds`);
    d.log(`${data.counts.qandaLines} lines of one voice, and which scene speaks each of them is a `
      + 'reading of the score rather than something it states');
    d.log(`the maze has no length in the score, so it is drawn as a break in the clock rather `
      + `than as a bar. Inside it the outer maze starts ${secs(outerMaze.atMs)} in, and `
      + `${JSON.stringify(waitLine.text)} is the only line in the score with a negative time, so it `
      + 'holds until she walks.');
    d.log(`the transition is cut out of this clock at both ends: ${secs(sceneById.get('transition').durationMs)} `
      + `stated, the credits rolling ${secs(creditsEv.atMs)} in for ${secs(creditsEv.durationMs)} and ending `
      + `${secs(creditsEv.overrunsSceneMs)} past the scene itself, then ${secs(waitCredits.durationMs)} until the `
      + `intro. A visitor who has just put the headset on waits ${secs(waitHeadset.durationMs)} instead and gets `
      + 'no transition at all.');
    d.log(`${data.ambiguities.length} things the score does not settle, and every one of them has a place on `
      + `the line: ${openMarks.length} at the moment they bite, ${openInMaze.length} inside the maze, `
      + `${openOffClock.length} off this clock at the ends.`);
    for (const a of data.ambiguities) {
      d.log(`${a.where}: ${a.what} Read as ${a.readings.map((r) => r.how).join(', or as ')}.`);
    }

    // ── the picture of the machinery ────────────────────────────────────────
    //
    /* 🔴 FOUR BOXES, THREE ARROWS, NO CONTAINERS, AND IT USED TO BE NINE
       ELEMENTS AND FOUR. Reported 2026-09-19 with a photograph: *"its messy"*.
       Two labels were wrapping onto two lines in gaps about nine characters
       wide, and the two links that had to reach past a box in another machine
       were drawn as curves. Every box in it was a chain of one thing feeding
       the next, so the three containers were adding a frame around a line.
       ⚠️ THE VOICE CAME OUT AND THAT IS NOT A LOSS. Its box said that a scene
       states how many lines it takes and never which ones, which is now a mark
       on the line at the moment the two readings come apart, and a sentence in
       the log. A fact drawn where it happens does not need a second home in a
       picture of the machinery.
       ⚠️ AND THE LABELS ARE ONE WORD EACH. A link label is laid out in the gap
       between two boxes, which is narrow enough that `line counts` broke in
       half; `parameters` broke INSIDE the word. What travels goes in the label
       when a single word carries it and in the note when it does not. */
    const dg = createDiagram(d.el, {
      caption: 'The score is the piece: every length, every placement and every line is in the '
        + 'file, so changing a number in it changes what the next visitor walks into.',
      nodes: [
        { id: 'score', label: 'score', sub: '667 lines', tech: 'file',
          note: 'Every length, placement, fade and line count, as a name on one line and its value '
            + 'on the next. Under them sit five small text formats: the maze words, the dialogue, '
            + 'the questions, the river and the credits.' },
        { id: 'order', label: 'running order', sub: 'Unity, 8 scenes', tech: 'graphics',
          note: 'Runs the scenes in turn on their stated lengths, handing out both channel values '
            + 'and a count of spoken lines as each one starts. The maze is the one that waits: it '
            + 'ends when the visitor walks towards the stairs.' },
        { id: 'chan', label: 'passthrough', sub: 'tint, opacity', tech: 'graphics',
          note: 'Two independent channels with a value and a fade time per scene. One puts a colour '
            + 'lookup table on the camera image, the other decides how much of the real room is '
            + 'left.' },
        { id: 'head', label: 'Headset', sub: 'a room, a visitor', tech: 'device',
          note: 'The gallery seen through the headset cameras, held at 15% for the two and a half '
            + 'minutes of the cylinder. One voice reads 24 lines over it, eight of them silence '
            + 'with a stated length.' },
      ],
      links: [
        { from: 'score', to: 'order', label: 'values',
          note: 'Read once at start up. A scene takes its length, both channel values, both fade '
            + 'times and its count of spoken lines from the file, so the running order holds no '
            + 'numbers of its own.' },
        { from: 'order', to: 'chan',
          note: 'Each scene hands both channels their value and their fade the moment it starts. '
            + 'The two run independently, which is why the colour can arrive a scene before the '
            + 'room goes away.' },
        { from: 'chan', to: 'head', label: 'picture',
          note: 'A lookup table on the camera image and a level that dims it. The master dimmer is '
            + 'left at 1.0, so the per scene numbers are the real ones.' },
      ],
    }, { how: true, atEnd: true });

    // ── checks ──────────────────────────────────────────────────────────────
    //
    // Everything below is gradable from data already in hand and from geometry
    // this page has already drawn, so it runs for everybody and costs a visitor
    // nothing. The three that MOVE something are behind the gate.
    const A = (label, pass, detail) => d.assert(label, pass, detail);

    // LAY THE PICTURE OUT NOW rather than on the next frame. The strip draws on
    // a raf, and a check reading a lane's geometry before the first draw would
    // be asking a canvas that has not been painted yet.
    strip.draw();
    /* 🔴 AND OPEN ON THE WHOLE PIECE, BOTH ENDS INCLUDED. The opening view ran
       about seventeen pixels past the right edge of the plot: the end of the
       outro was off screen at load, and so was the right-hand half of the
       transition, which is drawn as a break at EACH end of the axis and says
       nothing at all with only one of them visible. MEASURED on the page as a
       visitor gets it, not in the harness, which had been calling `fit()`
       inside its own zoom check and so was the only thing ever seeing the
       whole of it. It needs the canvas laid out, which is what the draw above
       is for, and a second draw to paint the view it just chose. */
    strip.fit();
    strip.draw();

    // 1. the maze, which is the whole reason this clock has a break in it
    const absent = data.scenes.filter((s) => s.durationHow === 'absent');
    A('the maze is the one scene the score gives no length',
      absent.length === 1 && absent[0].id === 'maze' && absent[0].durationMs === null,
      absent.map((s) => `${s.id} ${s.durationHow}`).join(', ') || 'none');
    A('so it is not a bar: six scenes are, and the maze and the transition are not among them',
      data.scenes.length === 8 && placedScenes.length === 6
      && !placedScenes.some((s) => s.id === 'maze' || s.id === 'transition'),
      `${placedScenes.length} bars of 8 scenes: ${placedScenes.map((s) => s.id).join(' ')}`);
    A('and the axis is exactly the running order with it taken out',
      deck.range[1] - deck.range[0] === KNOWN
      && KNOWN === placedScenes.reduce((a, s) => a + s.durationMs, 0),
      `${KNOWN} ms on the axis, ${placedScenes.reduce((a, s) => a + s.durationMs, 0)} ms of scenes`);
    /* 🔴 BOTH WAYS OF INVENTING THE MISSING NUMBER, REFUSED BY ONE CHECK. A
       page could give the maze a width by pushing everything after it along,
       and a page could give it one by leaving a gap at the seam: the first
       moves the end of the axis, the second breaks the run of scenes. Neither
       is visible in a duration table, because every scene's own length would
       still be right. */
    const lastScene = placedScenes[placedScenes.length - 1];
    A('and nothing was inserted at the break, in either direction',
      placedScenes.every((s, i) => (i === 0 ? s.at === 0 : s.at === placedScenes[i - 1].to))
      && lastScene.to === KNOWN,
      `the scenes run without a gap and end at ${clock(lastScene.to)}, which is the axis`);
    A('it is drawn all the same, as a break with a width in pixels',
      !!seamDrawn && seamDrawn.px === SEAM_PX && Number.isFinite(seamDrawn.x),
      seamDrawn ? `${seamDrawn.px} px at x ${seamDrawn.x.toFixed(1)}` : 'the break was never drawn');
    A('two things happen inside it and neither has a place on this clock',
      mazeEvents.length === 1 && mazeEvents[0].atMs === 60000 && unplacedLines.length === 1
      && unplacedLines[0].waitsForVisitor === true,
      `${mazeEvents[0]?.what} at ${secs(mazeEvents[0]?.atMs)}, and line ${unplacedLines[0]?.n}`);
    // Both channels hold their value across the maze, which is what lets the
    // line and the band cross the break unbroken. If either moved there, this
    // page would be drawing a change at a position it does not have.
    const mazeRoom = data.channels.opacity.points.find((p) => p.sceneId === 'maze');
    const mazeTint = data.channels.lut.points.find((p) => p.sceneId === 'maze');
    A('the room and the colour both hold across it, so nothing is lost at the break',
      mazeRoom.changed === 0 && mazeTint.same === true,
      `room ${mazeRoom.from} to ${mazeRoom.value}, tint ${mazeTint.from} to ${mazeTint.value}`);

    // 2. the voice that outlives its own scene
    const holdMe = sceneById.get('holdme');
    const last = voiceLines[voiceLines.length - 1];
    const outroStart = placedAt(sceneById.get('outro').at);
    const block = data.qanda.blocks.find((b) => b.id === 'holdme:second-qanda');
    A('seven lines of the last block sound after their own scene has ended',
      overrunning.length === 7 && overrunning.every((l) => l.landsIn.sceneId === 'outro'),
      `${overrunning.length} lines land in the ${overrunning[0]?.landsIn.sceneName}`);
    A('and the block runs 85.5 s past the end of hold me, drawn where the data says',
      last.at + last.durationMs - (placedAt(holdMe.at) + holdMe.durationMs) === block.overrunsSceneMs
      && block.overrunsSceneMs === 85500,
      `${clock(last.at + last.durationMs)} on the axis, ${secs(block.overrunsSceneMs)} past hold me`);
    const recognise = voiceLines.find((l) => l.n === 20);
    const outroText = placedEvents.find((e) => e.id === 'outro:outro-text');
    A('the outro text appears half a second after the voice asks whether you recognise it',
      outroText.at - (recognise.at + recognise.durationMs) === 500,
      `${outroText.at - (recognise.at + recognise.durationMs)} ms apart, at outro `
      + `${secs(outroText.at - outroStart)}`);
    A('every line\'s scene is a reading, and the page says so on every one of them',
      data.qanda.lines.every((l) => l.how === 'inferred')
      && data.counts.qandaLinesAssignedByInference === 24,
      `${data.counts.qandaLinesAssignedByInference} of ${data.counts.qandaLines} inferred`);
    A('eight of the twenty-four lines are silence, and they are drawn as lines with a length',
      voiceLines.filter((l) => l.silence).length + unplacedLines.filter((l) => l.silence).length === 8
      && voiceLines.filter((l) => l.silence).reduce((a, l) => a + l.durationMs, 0) === 77500,
      `${voiceLines.filter((l) => l.silence).length} placed silences, `
      + `${secs(voiceLines.filter((l) => l.silence).reduce((a, l) => a + l.durationMs, 0))} of them, `
      + `longest ${secs(Math.max(...voiceLines.filter((l) => l.silence).map((l) => l.durationMs)))}`);

    // 3. the two channels, graded against the curve this page actually draws
    let worstRate = 0, worstAt = '';
    for (const st of roomSteps) {
      const drawn = (roomAt(st.at + st.fadeMs) - roomAt(st.at)) / (st.fadeMs / 1000);
      const off = Math.abs(Number(drawn.toFixed(4)) - st.rate);
      if (off > worstRate) { worstRate = off; worstAt = st.sceneName; }
    }
    A('every ramp is drawn at the rate the score works out to',
      roomSteps.length === 6 && worstRate < 1e-4,
      worstRate ? `worst ${worstRate.toFixed(5)} a second, on the ${worstAt}` : 'all six exact');
    const rates = roomSteps.map((s) => Math.abs(s.rate));
    const fastest = Math.max(...rates);
    const next = Math.max(...rates.filter((r) => r < fastest));
    A('the cylinder collapses 2.75 times faster than the next move a visitor is inside',
      fastest === 0.275 && roomSteps.find((s) => Math.abs(s.rate) === fastest).sceneId === 'cylinder'
      && Math.abs(fastest / next - 2.75) < 1e-9,
      `${fastest} a second against ${next}, a ratio of ${(fastest / next).toFixed(2)}`);
    const breaks = data.channels.lut.points.filter((p) => p.followsRecommendation === false);
    A('two colour fades break the score\'s own recommendation, and they are adjacent',
      breaks.length === 2 && breaks[0].sceneId === 'dialogue' && breaks[1].sceneId === 'cylinder'
      && breaks[1].index - breaks[0].index === 1,
      breaks.map((p) => `${p.sceneName} ${p.fadeMs} ms`).join(', '));

    // 4. the intro, which is a recording rather than a string
    A('the keystroke track is exactly as long as the intro, and every mark is inside it',
      data.keystrokes.stats.spanMs === sceneById.get('intro').durationMs
      && keys.every((k) => k.at >= 0 && k.at <= MAZE_AT),
      `${keys.length} keys over ${clock(data.keystrokes.stats.spanMs)}`);
    A('the change of mind is a hesitation longer than the deletion it leads to',
      correction.hesitationMs > correction.lastBackspaceAtMs - correction.firstBackspaceAtMs
      && correction.backspaces === 6,
      `${correction.hesitationMs} ms of nothing, then ${correction.backspaces} backspaces in `
      + `${correction.lastBackspaceAtMs - correction.firstBackspaceAtMs} ms`);

    // 5. what the score refuses to decide, and what this page does about it
    //
    // 🔴 THE THREE PLACES HAVE TO ADD UP TO NINE, WITH NOTHING COUNTED TWICE.
    // This replaces a check that read `amb.count() === 9` off a table, and it
    // is the check that makes folding the table into the picture safe: a
    // refusal that lost its place would drop out of all three lists and the sum
    // would say so, where a missing table row used to be invisible.
    const placedOpen = openPlaces.flat();
    A('nine things the score does not settle, and every one of them has a place on the line',
      data.ambiguities.length === 9 && data.ambiguities.every((a) => a.settled === false)
      && placedOpen.length === data.ambiguities.length
      && new Set(placedOpen.map((a) => a.id)).size === data.ambiguities.length,
      `${openMarks.length} at a moment, ${openInMaze.length} inside the maze, `
      + `${openOffClock.length} off this clock, ${data.ambiguities.filter((a) => a.settled).length} settled`);
    /* 🔴 AND A PLACE IS NOT AN ACCOUNT. A mark has one line under the picture
       and these are two and three sentence refusals with their readings, so the
       line says WHERE each one bites and the log says WHAT it is. This check is
       the other half of the one above: it reads the log a visitor gets, so a
       sentence lost on the way out of the table cannot pass. */
    const logText = d.logEl.textContent;
    A('and each one is in the log in full, with every reading it carries, settling nothing',
      data.ambiguities.every((a) => logText.includes(a.what)
        && a.readings.every((r) => logText.includes(r.how)))
      && logText.includes(waitLine.text) && logText.includes(secs(waitHeadset.durationMs)),
      `${data.ambiguities.length} refusals and `
      + `${data.ambiguities.reduce((n, a) => n + a.readings.length, 0)} readings in ${logText.length} `
      + 'characters of log');
    A('the loop is one of them, so it is carried as a reading rather than drawn',
      data.order.loops === true && data.order.loopsHow === 'inferred',
      `loops: ${data.order.loops}, how: ${data.order.loopsHow}`);
    /* The transition is the other one with no position, and it is drawn as the
       same break the maze gets: a column in PIXELS at each end of the axis, so
       it claims no duration at either. Both ends, because the outro returns to
       it, which is what makes the two ends one place. */
    A('the transition is off this clock, so it is a break at both ends rather than a bar',
      !!offDrawn && offDrawn.px === SEAM_PX && offDrawn.right > offDrawn.left
      && sceneById.get('transition').runningIndex === null,
      offDrawn ? `${offDrawn.px} px at x ${offDrawn.left.toFixed(1)} and x ${offDrawn.right.toFixed(1)}`
        : 'neither end was drawn');

    // 6. whose work this is
    // ⚠️ THE SUBJECT SURVIVED THE BLOCK IT USED TO LIVE IN. The credits came
    // off the page on 2026-09-19 and this check did not: the authors are in
    // the page's own first sentence, and the text's provenance is in the log,
    // because this page renders that text rather than merely naming it.
    // ⚠️ `__demo.logs`, NOT `d.logs`. The mount return and the published api
    // are two different objects, which is the same distinction the transport
    // bar's own comment makes about `__demo.transport`.
    const said = (window.__demo.logs || []).map((l) => l.msg).join('\n');
    const sentence = document.querySelector('.pos-what')?.textContent || '';
    const authors = roleOf('Authors');
    A('the authors are in the page\'s own sentence, and the text\'s provenance is in the log',
      // ⚠️ CASE FOLDED, because the score writes its credits in capitals and
      // the page's own sentence does not. Comparing them as typed failed on
      // `MIHKELSON` against `Mihkelson`, which is a check failing on the
      // spelling of a name rather than on whether the name is there.
      !!authors && /liis vares/i.test(sentence) && /taavet jansen/i.test(sentence)
      && /mihkelson/i.test(said) && /mcilfarick-ksenofontov/i.test(said),
      `${authors}, and the log names the text and its translator`);

    // 7. the picture of the machinery, which grades itself
    A('the diagram drew every name and every arrow whole', dg.cuts.length === 0,
      dg.cuts.map((c) => `${c.where} ${c.id}`).join(', ') || 'nothing cut, nothing refused');
    A('and no line in it is missing its arrowhead', dg.ties === 0,
      `${dg.ties} line${dg.ties === 1 ? '' : 's'} with no head`);

    // 8. the strip's own gutters, which drop a line in silence when a lane is short
    const fit = strip.gutterFit();
    A('every lane says its own name and its own number, with nothing dropped',
      fit.every((f) => f.dropped === 0),
      fit.filter((f) => f.dropped).map((f) => `${f.id} dropped ${f.dropped}`).join(', ')
      || `${fit.length} lanes, nothing dropped`);

    // 9. nothing here reaches outside this site
    A('a visit reads one file, and it is ours',
      offSite === 0 && fetched.length === 1 && fetched[0] === SRC,
      `${fetched.join(', ')}, ${offSite} off this site`);

    /**
     * ⚠️ BEHIND THE GATE, BECAUSE EACH OF THESE MOVES SOMETHING A PERSON WOULD
     * SEE: one zooms the axis, one drags the pointer across the line, one seeks
     * the playhead. A visitor gets the picture standing still where they left
     * it, and the log says what was not run.
     */
    ifSelfcheck(() => {
      /* 🔴 THE BREAK KEEPS ITS WIDTH WHEN THE AXIS IS STRETCHED, AND A SCENE
         DOES NOT. That is the difference between furniture and a duration, and
         it is the only check that can tell them apart: a seam drawn from a
         millisecond figure would grow with the zoom exactly as the intro does. */
      strip.draw();
      const before = { seam: seamDrawn.px, intro: strip.timeToX(MAZE_AT) - strip.timeToX(0) };
      strip.zoomIn(3);
      strip.draw();
      const after = { seam: seamDrawn.px, intro: strip.timeToX(MAZE_AT) - strip.timeToX(0) };
      strip.fit();
      strip.draw();
      A('the break keeps its width when the axis is stretched, and the intro does not',
        before.seam === after.seam && after.intro > before.intro * 2.5,
        `break ${before.seam} px then ${after.seam} px, intro ${before.intro.toFixed(0)} px `
        + `then ${after.intro.toFixed(0)} px`);

      /* Pointing at the silence that carries the voice out of its own scene,
         through the strip's own pointer path rather than by handing the footer
         a hit of our making: the hit test, `describeHit` and the wiring
         `createStripView` does between them are the whole of what is worth
         grading here.

         ⚠️ IT AIMS AT THE 46.5 SECOND SILENCE AND NOT AT THE LAST LINE, and
         the reason is arithmetic rather than taste. At the zoom this page opens
         on, the axis is about 1.4 pixels a second, so the hit test's six pixel
         tolerance is more than four seconds wide: a three second line has two
         neighbours inside it and the test would name whichever comes first.
         The long silence is the one row in that block wider than the
         tolerance on both sides, so pointing at it can only mean it. */
      const r = strip.canvas.getBoundingClientRect();
      const S = strip.state;
      const lane = strip.lanes().find((l) => l.id === 'voice');
      const target = voiceLines.find((l) => l.n === 21);
      const ready = !!lane && Number.isFinite(lane.y) && r.width > 0 && S.width > 0;
      const cx = ready
        ? r.left + (strip.timeToX(target.at + target.durationMs / 2) + S.gutterPx) * (r.width / S.width)
        : 0;
      const cy = ready ? r.top + (lane.y + lane.height / 2) * (r.height / S.height) : 0;
      strip.canvas.dispatchEvent(new PointerEvent('pointermove',
        { clientX: cx, clientY: cy, bubbles: true }));
      const on = view.footer.says();
      const tall = view.footer.el.offsetHeight;
      // ⚠️ ONE LINE SINCE 2026-09-19, so this reads `on[0]` and there is no
      // `on[1]` to read. It threw rather than failing when the footer was cut,
      // which is the right way round: a check that silently stopped looking at
      // the overrun would have kept passing on the half it could still see.
      A('pointing at the long silence says which scene it lands in, under the line rather than over it',
        ready && on[0] === `silence, ${secs(target.durationMs)}`,
        ready ? on.filter(Boolean).join(' / ') : 'the strip has not been measured yet');
      strip.canvas.dispatchEvent(new PointerEvent('pointerleave',
        { clientX: r.left - 10, clientY: r.top - 10, bubbles: true }));
      const off = view.footer.says();
      // 🔴 IT SAYS NOTHING NOW, AND THE HEIGHT IS THE HALF THAT MATTERS.
      // Changed 2026-09-19 with the footer: the box used to read `nothing under
      // the pointer` and now reads empty, on the same argument that took the em
      // dash out of an unmeasured readout cell. So this checks the text is
      // EMPTY and, more importantly, that the box did not collapse: a footer
      // that lost its height when the pointer left the strip would push the
      // page up and down while somebody read it.
      A('and with nothing under it it stays empty, and the box keeps its height',
        off.every((l) => !l) && view.footer.el.offsetHeight === tall,
        `${off.filter(Boolean).length} line(s) of text, ${view.footer.el.offsetHeight} px of ${tall}`);

      /* 🔴 A PRESS ON A REFUSAL HAS TO SAY THE WHOLE OF IT, or the line is an
         index into nothing. The mark is the river's, which is the one with two
         hundred seconds of clear axis on either side, so a press can only mean
         it. It is driven through the strip's own pointer path for the same
         reason the hover above is: the hit test, `onSeek` and the wiring
         between them are the whole of what is worth grading. */
      const openGeom = strip.lanes().find((l) => l.id === 'open');
      const mark = openMarks.find((a) => a.id === 'river-pacing');
      const mx = ready && openGeom
        ? r.left + (strip.timeToX(mark.at) + S.gutterPx) * (r.width / S.width) : 0;
      const my = ready && openGeom
        ? r.top + (openGeom.y + openGeom.height / 2) * (r.height / S.height) : 0;
      /* ⚠️ A SYNTHETIC POINTER CANNOT BE CAPTURED AND THE STRIP ASKS TO CAPTURE
         IT. `setPointerCapture` throws `No active pointer with the given id`
         for an event no finger made, the throw escapes the strip's own handler,
         and the press never reaches the seek: the first run of this check read
         red with a message about pointer capture and nothing wrong with the
         page. Both are stubbed for the length of one press and DELETED
         afterwards, which puts the real methods back rather than leaving a
         copy on the element. Capture decides only where LATER events are
         routed, and there are none. */
      strip.canvas.setPointerCapture = () => {};
      strip.canvas.releasePointerCapture = () => {};
      try {
        for (const type of ['pointermove', 'pointerdown', 'pointerup']) {
          strip.canvas.dispatchEvent(new PointerEvent(type,
            { clientX: mx, clientY: my, bubbles: true, isPrimary: true, button: 0 }));
        }
      } finally {
        delete strip.canvas.setPointerCapture;
        delete strip.canvas.releasePointerCapture;
      }
      const saidLast = d.api.logs[d.api.logs.length - 1]?.msg ?? '';
      A('pressing a refusal on the line says the whole of it at the foot of the log',
        !!openGeom && saidLast.includes(mark.what)
        && mark.readings.every((x) => saidLast.includes(x.how)),
        openGeom ? `${saidLast.slice(0, 60)}…` : 'the open lane was never laid out');

      /* 🔴 THE PICTURE ANSWERS FOR WHERE THE LINE IS STANDING, AND THIS IS THE
         CHECK THAT USED TO READ FOUR CELLS. The readout went on 2026-09-19 and
         its facts stayed: the scenes lane holds the bar the line is inside at
         full strength, the room curve carries its percentage, the tint band
         carries its table's name, and a line being spoken is a bar under the
         playhead. So the four are graded where they now live, through the same
         hooks the renderers use. Ninety-five seconds into the cylinder is where
         the room is at fifteen per cent and the voice is asking whether you are
         there. */
      const cyl = placedScenes.find((s) => s.id === 'cylinder');
      deck.seek(cyl.at + 95000);
      atLine(deck.position());
      const at = deck.position();
      const spoken = voiceAtTime(at);
      A('the picture answers for wherever the line is standing',
        currentScene === 'cylinder'
        && scenesLane.currentOf({ row: { payload: { id: 'cylinder' } } }) === true
        && Math.round(roomAt(at) * 100) === 15 && tintAt(at) === 'green'
        && !!spoken && spoken.silence === false,
        `${currentScene}, ${Math.round(roomAt(at) * 100)}% of the room, ${tintAt(at)}, `
        + `${spoken ? (spoken.silence ? 'a silence' : 'speaking') : 'nothing spoken'}`);
      deck.seek(0);
      atLine(deck.position());
    }, { log: d.log,
         // ⚠️ THE COUNT IS THE NUMBER OF CHECKS AND IT SAID `three` WHILE THERE
         // WERE FOUR: the pointer is one gesture and two of them. A sentence
         // that has drifted from the code it describes is worse than none.
         say: 'five checks are not run for a visitor, because each of them moves the picture: '
            + 'the zoom, the pointer, a press and the playhead' });

    d.ready();
  })().catch((e) => d.fail(e));
</script>
</html>
