        + `${(Math.min(...inks) * 100).toFixed(0)}–${(Math.max(...inks) * 100).toFixed(0)}% of their boxes`);
    }
    // A coverage bitmap is nearly binary — a thin antialiased rim and nothing
    // else. A distance field ramps across SPREAD texels either side of every
    // edge, so a real share of it sits between the two extremes.
    {
      const worst = Math.min(...built.map((b) => b.t.stats.mid));
      d.assert('...and what is stored is a distance, not a picture of the word',
        worst > 0.05,
        `the least graded field is ${(worst * 100).toFixed(1)}% between the two ends`);
    }

    // 🔴 THE SIZING RULE, CHECKED ON THE PAIR THAT BREAKS IT, AND READ OFF THE
    // PICTURE. An accent makes the INK taller; if a quad were sized by its ink,
    // an accented word would come out SMALLER than a plain one at the same
    // declared height, which is the one thing a wall of words must not do.
    //
    // ⚠️ THE OLD VERSION COMPARED TWO `capPx` FIGURES AND THAT HALF WAS VACUOUS:
    // both words were rastered at the same `px` in the same family, so the two
    // numbers were the same number and the comparison could not fail. What is
    // asked now is what somebody looking at the wall would ask. Draw both from
    // one distance, find the band of rows the letter bodies occupy, and require
    // that band to be the SAME height while the accented word's total ink is
    // taller. `oo` and `oo` with two dots differ in nothing else, and the marks
    // sit clear of the letters with a blank row between, which is what makes the
    // band findable at all.
    {
      const pair = ['oo', 'öö'].map((text) => {
        const t = buildText(gl, { text, weight: DISPLAY_WEIGHT, px: 320, cap: 0.9 });
        const b = place({ text, wall: 'n', u: 0, y: 1.6, out: 0, cap: 0.9 }, t);
        const p = probe(b, { dist: 3 });
        // readPixels counts rows from the BOTTOM, so the letter bodies are the
        // first unbroken run of lit rows and a mark is anything above the gap.
        const lit = [];
        for (let y = 0; y < p.H; y++) {
          let n = 0;
          for (let x = 0; x < p.W; x++) if (p.mask[y * p.W + x]) n++;
          lit.push(n > 0);
        }
        const from = lit.indexOf(true);
        let to = from;
        while (to + 1 < lit.length && lit[to + 1]) to++;
        gl.deleteTexture(t.tex);
        return { text, body: from < 0 ? 0 : to - from + 1, all: p.height };
      });
      const [plain, accented] = pair;
      const sameBody = Math.abs(accented.body - plain.body) <= Math.max(2, plain.body * 0.03);
      d.assert('an accent makes a word taller without making its letters smaller',
        plain.body > 20 && sameBody && accented.all > accented.body + 4
        && accented.all > plain.all * 1.05,
        `the letters are ${plain.body} px and ${accented.body} px tall, `
        + `and the two dots take the ink to ${accented.all} px against ${plain.all}`);
    }

    {
      // ⚠️ SORTED AS NUMBERS. The first version sorted the formatted strings and
      // reported whichever word came last in the alphabet as the widest — the
      // `every()` was right and the sentence under it was confidently wrong,
      // which is the worse half to get wrong because it is the half a reader
      // believes.
      const reach = built.map((b) => ({ t: b.item.text.split('\n')[0], m: Math.abs(b.item.u) + b.w / 2 }));
      const worst = reach.reduce((a, b) => (b.m > a.m ? b : a));
      d.assert('every word fits on the wall it is on',
        reach.every((r) => r.m <= R + 0.01),
        `${worst.t} reaches ${worst.m.toFixed(1)} m of the ${R} m half-wall`);
    }

    // 🔴 THE PAGE'S OWN RULE, AND IT IS READ OFF THE PICTURE RATHER THAN OUT OF
    // THE ARITHMETIC THAT DREW IT. `capFor` divides one constant by a letter
    // count, so a check that divided the same constant by the same count would
    // be the rule agreeing with itself. This draws every word head-on from ONE
    // distance and counts how many pixels tall its letters come out: a shorter
    // word has to be bigger, and two words of a length have to match.
    //
    // ⚠️ EVERY WORD ON THIS WALL RUNS BASELINE TO ASCENDER and none of them has
    // a descender, so lit height is proportional to the size it was set at. A
    // word with a `g` in it would be taller for a reason that is not its length,
    // which is why the check reports the pixels rather than hiding them.
    {
      const rows = built.filter((b) => b.item.cap).map((b) => {
        const p = probe(b, { dist: 6 });
        return { text: b.item.text, n: [...b.item.text].length,
          tall: p.height, wide: p.width, framed: p.width < p.W - 4 && p.height < p.H - 4 };
      }).sort((a, z) => a.n - z.n);
      window.__demo.sized = rows;
      let holds = rows.length >= 3 && rows.every((r) => r.framed && r.tall > 8);
      for (let i = 1; i < rows.length; i++) {
        const a = rows[i - 1], z = rows[i];
        if (z.n === a.n) { if (Math.abs(z.tall - a.tall) > Math.max(2, a.tall * 0.05)) holds = false; }
        else if (!(z.tall < a.tall * 0.95)) holds = false;
      }
      d.assert('a shorter word is drawn bigger, and two of a length the same',
        holds, rows.map((r) => `${r.text} (${r.n}) ${r.tall} px`).join(' · '));
    }

    // 🔴 AND THE RULE HOLDS FOR A WORD THAT WAS NEVER IN THE SOURCE. Typing is
    // the one thing on this page that changes a size while somebody is looking,
    // so it is graded the same way: draw the word, type a shorter one over it,
    // draw again, and put the first one back.
    {
      const before = built.find((b) => b.item.text === 'could');
      const was = probe(before, { dist: 6 }).height;
      const typed = retext(before, 'oh');
      const now = probe(typed, { dist: 6 }).height;
      const back = retext(typed, 'could');
      const again = probe(back, { dist: 6 }).height;
      window.__demo.typed = { was, now, again };
      d.assert('typing a shorter word over a longer one makes it bigger',
        now > was * 1.8 && Math.abs(again - was) <= 2 && built.length === ITEMS.length,
        `could is ${was} px tall, oh is ${now} px, and could typed back is ${again}`);

      /**
       * 🔴 A LINE BREAK SURVIVES BEING TYPED, AND IT MAKES THE WORD BIGGER.
       * `retext` used to run `replace(/\s+/g, ' ')` over what was typed, which
       * is every kind of whitespace INCLUDING a newline, so a break typed into
       * the field was destroyed before it reached the renderer and the wall drew
       * one long line. `buildText` has honoured `\n` as a hard break since it
       * was written; the text simply never arrived carrying one.
       *
       * ⚠️ AND THE SIZE IS TAKEN OFF THE LONGEST LINE. Breaking a line makes the
       * text NARROWER, so it must come out BIGGER, and measuring the whole
       * string would make it smaller instead. MEASURED through the real field:
       * `What is going / on?` sizes on the 11 characters of its first line
       * rather than on all 14. Both halves are graded, because the break
       * surviving with the wrong size is a fix that looks like it worked.
       */
      const oneLine = retext(back, 'What is going on?');
      const flat = probe(oneLine, { dist: 6 }).height;
      const broken = retext(oneLine, 'What is going\non?');
      const tall = probe(broken, { dist: 6 }).height;
      const kept = (broken?.item?.text || '').includes('\n');
      retext(broken, 'could');            // put the room back as it was found
      d.assert('a line break typed into a word survives, and sizes on its longest line',
        kept && tall > flat,
        `${kept ? 'the break survived' : 'THE BREAK WAS FLATTENED'} · `
        + `one line ${flat} px tall, two lines ${tall} px`);
    }

    // 🔴 THE WAY BACK OUT OF THE HEADSET'S SPACE, WHICH IS WHAT A POINTED HAND
    // ARRIVES IN. A runtime reports a controller where the HEADSET's own space
    // says it is, and the words are in room coordinates: get the sign wrong and
    // the ray lands mirrored through wherever you are standing, which at a turn
    // of zero is exactly right and at every other turn is wrong by twice the
    // angle. ⚠️ This is not two derivations agreeing, which is the trap this
    // page has already fallen into once: it runs the answer back through
    // `roomToEye`, and `roomToEye` is graded by rendering further down.
    {
      const keepPos = pos.slice(), keepTurn = turn;
      pos = [2.4, -1.3]; turn = 0.9;
      const inHeadset = [0.35, 1.5, -0.8];
      const back = apply(roomToEye(pos[0], 0, pos[1], turn), pointToRoom(inHeadset));
      const off = Math.hypot(back[0] - inHeadset[0], back[1] - inHeadset[1],
        back[2] - inHeadset[2]);
      d.assert('a hand the headset reports comes back to the same spot it started',
        off < 1e-5,
        `${off.toExponential(1)} m apart after the round trip, `
        + `standing 2.8 m out and turned ${(0.9 * 180 / Math.PI).toFixed(0)}°`);
      pos = keepPos; turn = keepTurn;
    }
    // 🔴 THE PURE FUNCTION, GRADED WITH NOTHING IN THE LOOP. Walking and turning
    // can be wrong in a way no picture shows.
    {
      // Two claims, both stated as what a person would say out loud: the spot
      // you are standing on is under the camera, and the way you are facing
      // comes out as straight ahead — which in an eye's own coordinates is
      // (0, 0, -1), whatever the turn happens to be.
      const t = 0.7;
      const m = roomToEye(3, EYE_Y, -2, t);
      // 🔴 THE SPOT YOU ARE STANDING ON IS EYE_Y BELOW THE CAMERA, NOT AT IT.
      // The first version of this check asked only that the spot land at the
      // origin, which is true of a camera lying on the floor — and that is
      // exactly the bug it then failed to catch for an hour.
      const under = apply(m, [3, 0, -2]);
      const faceDir = apply(m, [3 + Math.sin(t), 0, -2 - Math.cos(t)]);
      const off = Math.hypot(under[0], under[1] + EYE_Y, under[2]);
      const ahead = Math.hypot(faceDir[0], faceDir[1] + EYE_Y, faceDir[2] + 1);
      d.assert('the floor is under your feet and what you face is straight ahead',
        off < 1e-5 && ahead < 1e-5 && Math.abs(under[1] + EYE_Y) < 1e-5,
        `the spot you stand on lands ${(-under[1]).toFixed(2)} m below the camera `
        + `and ${off.toExponential(1)} m off it; facing lands `
        + `${ahead.toExponential(1)} from straight ahead`);
    }
    {
      // Snap turn is a step, and it cannot repeat until the stick comes back.
      turn = 0; snapArmed = true;
      snapStep(1); snapStep(1); snapStep(1);
      const once = turn;
      snapStep(0); snapStep(1);
      d.assert('the stick turns you in steps, one per push',
        Math.abs(once - SNAP) < 1e-9 && Math.abs(turn - 2 * SNAP) < 1e-9,
        `held over: ${(once * 180 / Math.PI).toFixed(0)}°, `
        + `pushed twice: ${(turn * 180 / Math.PI).toFixed(0)}°`);
      turn = 0;
    }
    {
      const before = [...pos], w0 = walked;
      moveBy(0, 1, 2);                      // two metres forward, facing 0
      d.assert('walking forward moves you and looking does not',
        Math.abs(pos[1] - (before[1] - 2)) < 1e-6 && Math.abs(pos[0] - before[0]) < 1e-6
        && walked - w0 > 1.99,
        `from ${before[0].toFixed(1)},${before[1].toFixed(1)} `
        + `to ${pos[0].toFixed(1)},${pos[1].toFixed(1)}`);
      pos = before; walked = w0;
    }

    // ── what only a GPU can answer ──────────────────────────────────────────
    // ⚠️ FOUND BY SIZE, NOT BY NAME. Every word here is the visitor's to type
    // over, so a check that looked one up by its spelling would be a check
    // about a word that may not be on the wall any more. `big` is whichever
    // word is set largest and `five` is one of the full-length ones.
    const big = built.filter((b) => b.item.cap)
      .reduce((a, b) => (b.item.cap > a.item.cap ? b : a));
    const five = built.find((b) => b.item.cap && [...b.item.text].length === 5);
    const head = probe(big, { dist: 6 });
    d.assert('a word is drawn', head.ink > 2000 && head.width > 80,
      `${head.ink} lit pixels, ${head.width} across at 6 m`);

    // 🔴 THE CHECK WANTS THE PICTURE TO GET WORSE. A billboard swung round is
    // exactly as wide as it was; a word fixed to its wall narrows. Asking for
    // SAMENESS here would pass both, which is `xr-ray.mjs`'s rule — a stretched
    // box and a real billboard score the same on a test that asks for sameness.
    //
    // ⚠️ AND THE FIRST VERSION MEASURED A CLIPPED WORD. `HELD` is 9.7 m across;
    // swung 70° at 6 m it runs off the side of the frame, so `maxX` was the
    // frame's edge and the "width" was the viewport's, not the word's. Every
    // probe below refuses to be believed unless the whole word is inside the
    // frame — CLAUDE.md's *check the instrument before believing the pattern*,
    // and it is one comparison rather than a cleverer statistic.
    {
      const turns = [0, 35, 70].map((deg) => ({
        deg, p: probe(five, { dist: 12, yaw: deg * Math.PI / 180 }),
      }));
      const inside = turns.every((t) => t.p.ink > 200
        && t.p.width < t.p.W - 4 && t.p.width > 4);
      const [a, b2, c2] = turns.map((t) => t.p.width);
      window.__demo.turned = turns.map((t) => ({ deg: t.deg, width: t.p.width, ink: t.p.ink }));
      d.assert('a word does not turn to face you',
        inside && c2 < b2 && b2 < a && c2 / a < 0.6,
        `${a} px across head-on, ${b2} at 35°, ${c2} at 70°, `
        + `${((c2 / a) * 100).toFixed(0)}% of it, all of it still in frame`);
    }

    // 🔴 SHARPNESS, WITH THE CONTROL THAT MAKES IT MEAN SOMETHING. The same
    // word, same raster, same shader, same distance — one stored as a distance
    // and one as the picture it was rasterised from.
    {
      const rows = [];
      for (const dist of [6, 2, 0.9, 0.35]) {
        const f = probe(big, { dist });
        rows.push({ dist, mag: (f.W / 2) / (Math.tan(FOV / 2) * dist) * big.texelM, edge: f.edge });
      }
      window.__demo.sharp = rows;
      d.assert('the edge stays about a pixel wide however far it is blown up',
        rows.every((r) => r.edge > 0 && r.edge <= 3),
        `blown up ${rows.map((r) => `${r.mag.toFixed(0)}x`).join(', ')}, and the edge takes `
        + `${rows.map((r) => `${r.edge}px`).join(', ')}`);
    }

    // 🔴 THE CONTROL, AND THE FIRST VERSION OF IT MEASURED THE WRONG THING.
    // It compared the EDGE WIDTH of the field against a plain picture of the
    // same word, expecting the picture's to be wide. MEASURED, at 38x
    // magnification: **both are 1 px**, and that is not a bug — the shader
    // thresholds with `fwidth`, which re-sharpens a blurred ramp just as
    // happily as it reconstructs a distance. Edge width is a quantity ADJACENT
    // to the claim, and an A/B where both arms score the same reads as "no
    // difference" when what actually happened is that nothing was asked.
    //
    // What the field is FOR is being right about the letterform at a resolution
    // where a picture is not, so that is the measurement: draw the word at full
    // resolution as the reference, then draw a field and a picture that each
    // hold the SAME small number of texels, and count how many pixels each one
    // gets wrong. ⚠️ Equal texels, not equal `px` — the field is half the
    // raster it came from, so `raw` at the same `px` would be handed four times
    // the bytes and the comparison would say nothing.
    {
      // ⚠️ A FIVE-LETTER WORD RATHER THAN THE BIGGEST ONE. `disagree` divides by
      // the reference's ink, so a two-letter word gives it a small denominator
      // and a noisy answer about a letterform there is not much of.
      const word = five.item.text, capM = five.item.cap;
      const ref = probe(five, { dist: 0.9 }).mask;
      const rows = [];
      for (const px of [60, 30, 16]) {
        const fT = buildText(gl, { text: word, weight: DISPLAY_WEIGHT, px, cap: capM });
        const pT = buildText(gl, { text: word, weight: DISPLAY_WEIGHT, px: px / 2, cap: capM, raw: true });
        rows.push({
          // ⚠️ THE INK'S OWN HEIGHT, NOT THE TEXTURE'S. The field carries SPREAD
          // texels of margin on each side, so a 22-texel texture is a SIX-texel
          // word — and quoting the padded number is how the last row below
          // would have read as a reasonable resolution instead of as rubble.
          tall: fT.h - 2 * SPREAD,
          field: disagree(probe(place(five.item, fT), { dist: 0.9 }).mask, ref),
          picture: disagree(probe(place(five.item, pT), { dist: 0.9 }).mask, ref),
        });
        gl.deleteTexture(fT.tex); gl.deleteTexture(pT.tex);
      }
      window.__demo.fidelity = rows;
      // 🔴 AND THE LAST ROW IS WHERE IT STOPS BEING TRUE, WHICH IS KEPT RATHER
      // THAN DROPPED. MEASURED: at 23 ink texels the field is 14% wrong against
      // a picture's 19%, at 12 it is 33% against 36%, and at SIX texels it is
      // 47% against 44% — the field LOSES, because there is no longer a
      // letterform for a distance to be the distance to. A technique that names
      // where it expires is worth more than one that reports only the sizes
      // where it wins.
      const real = rows.filter((r) => r.tall >= 10);
      d.assert('at the same number of texels, a distance beats a picture of the word',
        real.length >= 2 && real.every((r) => r.picture > r.field),
        rows.map((r) => `${r.tall} texels of ink: ${(r.field * 100).toFixed(0)}% wrong `
          + `against ${(r.picture * 100).toFixed(0)}%${r.tall < 10 ? ' (past the floor)' : ''}`)
          .join(' · '));
    }

    // 🔴 THE CHECK THAT GOES THROUGH THE PAGE'S OWN DRAW, NOT AROUND IT. Every
    // probe above calls the shaders directly, which is right for grading ONE
    // word and is exactly how a missing `uVP` in `drawScene` survived fifteen
    // green asserts. This one runs the frame loop's own path into the same
    // off-screen target and asks whether the result looks like a room: a few
    // words and a floor, not a white wall and not an empty one.
    {
      probeTarget(640, 360);
      gl.bindFramebuffer(gl.FRAMEBUFFER, probeFB);
      gl.viewport(0, 0, 640, 360);
      gl.clearColor(0.027, 0.035, 0.051, 1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      const eye = [pos[0], EYE_Y, pos[1]];
      sortFor(eye);
      drawScene(mul(perspective(FOV, 640 / 360, 0.05, 200), windowView()), eye);
      const px = new Uint8Array(640 * 360 * 4);
      gl.readPixels(0, 0, 640, 360, gl.RGBA, gl.UNSIGNED_BYTE, px);
      let lit = 0;
      for (let i = 0; i < 640 * 360; i++) if (px[i * 4] > 128) lit++;
      const share = lit / (640 * 360);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      window.__demo.firstView = share;
      d.assert('the view you arrive at is a room with words in it',
        share > 0.008 && share < 0.35,
        `${(share * 100).toFixed(1)}% of the first frame is ink. `
        + `under 1% is an empty room, over 35% is a letter you are standing inside`);

      // 🔴 THE POINTER AND THE PICTURE, ASKED THE SAME QUESTION IN THE SAME
      // FRAME. A pick worked out from a matrix can be mirrored, offset or a
      // half-frame out and still look like a reasonable answer in a log line;
      // the only thing that can catch it is the picture beside it. Every eighth
      // pixel of the frame just drawn is turned back into the ray under it, and
      // the claim is that WHEREVER THERE IS INK, THAT RAY LANDS ON A WORD.
      //
      // ⚠️ AND THE OTHER HALF STOPS A LAZY PASS. A pick that answered "yes, a
      // word" everywhere would satisfy the first half perfectly, so most of the
      // frame has to come back EMPTY: the words are a small part of a room.
      // ⚠️ `> 128` is the words and nothing else. The floor's dots are drawn at
      // 0.64 red through at most 0.62 of alpha, which cannot pass 104.
      {
        let ink = 0, orphan = 0, onWord = 0, taken = 0;
        for (let y = 4; y < 360; y += 8) {
          for (let x = 4; x < 640; x += 8) {
            taken++;
            // readPixels counts rows from the bottom, the same way the
            // projection's +Y does, so the row index needs no flip.
            const r = rayThrough((x + 0.5) / 640 * 2 - 1, (y + 0.5) / 360 * 2 - 1, 640 / 360);
            const land = aimAt(r.origin, r.dir);
            if (land) onWord++;
            if (px[(y * 640 + x) * 4] > 128) { ink++; if (!land) orphan++; }
          }
        }
        window.__demo.aimed = { taken, ink, orphan, onWord };
        d.assert('pointing lands where the picture is',
          ink > 30 && orphan <= Math.max(1, ink * 0.05) && onWord < taken * 0.5,
          `${ink} of ${taken} sampled pixels have ink and ${ink - orphan} of those `
          + `land on a word; ${onWord} of ${taken} rays find one at all`);
      }

      // 🔴 AND THERE IS A FLOOR UNDER YOU. Nothing else here can see it: the
      // words are white and the check above counts white, so a floor that
      // never drew would leave every other assert on this page green. The dots
      // are dim and sparse on purpose, so this counts anything above the
      // background in the BOTTOM THIRD of the frame, which is floor and
      // nothing else from where you arrive.
      let floorLit = 0;
      for (let y = 0; y < 120; y++) {
        for (let x = 0; x < 640; x++) {
          const i = (y * 640 + x) * 4;
          if (px[i] > 24 || px[i + 2] > 30) floorLit++;
        }
      }
      window.__demo.floorLit = floorLit;
      d.assert('there is a floor under you, and it is made of dots',
        floorLit > 300 && floorLit < 640 * 120 * 0.5,
        `${floorLit} lit pixels in the bottom third of the first frame, of ${640 * 120}`);
    }

    /**
     * 🔴 WHAT A TRIGGER PRESS NOW DOES, READ OFF THE PICTURE. A mark that is
     * "set" in a variable is not a mark: the whole point of it is that somebody
     * standing in the room can SEE which word the trigger took, and a check that
     * compared `marked === b` would be the assignment agreeing with itself.
     * This renders the room through `drawScene` — the frame loop's own path, not
     * around it — and counts pixels by colour.
     *
     * ⚠️ FOUND BY COLOUR, NOT BY POSITION. The mark's colour has zero blue in it
     * and white ink has all of it, so "which pixels changed" is one channel
     * compared against itself before and after, with nothing derived from where
     * the word was supposed to be.
     */
    {
      const shot = () => {
        probeTarget(640, 360);
        gl.bindFramebuffer(gl.FRAMEBUFFER, probeFB);
        gl.viewport(0, 0, 640, 360);
        gl.clearColor(0.027, 0.035, 0.051, 1);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        const eye = [pos[0], EYE_Y, pos[1]];
        sortFor(eye);
        drawScene(mul(perspective(FOV, 640 / 360, 0.05, 200), windowView()), eye);
        const px = new Uint8Array(640 * 360 * 4);
        gl.readPixels(0, 0, 640, 360, gl.RGBA, gl.UNSIGNED_BYTE, px);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        // ⚠️ `> 128` on red is the words and not the floor — the dots are 0.64
        // red through at most 0.62 of alpha, which cannot pass 104. Of those,
        // the ones with no blue in them are the marked word.
        let ink = 0, lit = 0;
        for (let i = 0; i < 640 * 360; i++) {
          if (px[i * 4] > 128) { ink++; if (px[i * 4 + 2] < 64) lit++; }
        }
        return { ink, lit };
      };
      markWord(null);
      const plain = shot();
      // Every word in turn, because which of them the arrival view happens to
      // show is not something this check should be asserting about. One that
      // lights up AND leaves other ink white is what the claim needs.
      const tries = [];
      let pick = null;
      for (const b of built) {
        markWord(b);
        const s = shot();
        tries.push({ text: b.item.text.split('\n')[0].slice(0, 12), ...s });
        if (!pick && s.lit > 200 && s.ink - s.lit > 200) pick = { b, s };
      }
      markWord(null);
      const off = shot();
      window.__demo.marking = { plain, tries, off };
      d.assert('the trigger repaints the word it landed on, and leaves the rest white',
        plain.lit === 0 && off.lit === 0 && !!pick
        && Math.abs(pick.s.ink - plain.ink) < plain.ink * 0.1,
        pick
          ? `nothing marked: ${plain.ink} lit pixels of ink and ${plain.lit} of them the `
            + `mark's colour. Marking "${pick.b.item.text.split('\n')[0]}" turns `
            + `${pick.s.lit} of ${pick.s.ink} that colour, leaving `
            + `${pick.s.ink - pick.s.lit} white; unmarking puts ${off.lit} back`
          : `no word changed colour where the picture could see it: `
            + tries.map((t) => `${t.text} ${t.lit}/${t.ink}`).join(' · '));
    }

    /**
     * 🔴 THE BUG THIS PAGE WAS REPORTED FOR, AND BOTH HALVES OF THE BRANCH IT
     * SITS IN. Reported from a real Quest: *"held demo: click in vr brought me
     * back to browser."* The trigger handler is driven here with a pose the
     * runtime would have supplied, against a session object that counts being
     * ended, on both settings of `overlay`.
     *
     * ⚠️ THE RAY IS AN INPUT, NOT THE CLAIM. It is built from the wall's own
     * basis, which is where `aimAt` reads from too, and on its own that would be
     * two derivations agreeing. It is not asserted on: if the ray were wrong,
     * `aimAt` returns nothing, the handler returns early and the assert fails
     * loudly. Where a ray actually LANDS is graded above, off the picture, by
     * *pointing lands where the picture is*.
     *
     * ⚠️ AND THE WHOLE BLOCK IS SYNCHRONOUS ON PURPOSE. `xrSession` is a stub for
     * the length of it, and the window's frame loop stops asking for frames the
     * moment that is non-null — so an `await` in here would park the page on a
     * still image for the rest of the run.
     */
    {
      const keepPos = pos.slice(), keepTurn = turn;
      const keepRef = xrRefSpace, keepSession = xrSession;
      const keepOverlay = overlay, keepSys = sysKeyboard;
      // Standing at the origin facing 0, the headset's space and the room's are
      // the same space, so a pose can be written down in room metres.
      pos = [0, 0]; turn = 0;
      const target = big, w = WALLS[target.item.wall];
      // Column-major, the way a runtime hands one over: right, up, back,
      // position. A pose's forward is its NEGATIVE z, so the back column is the
      // wall's own outward normal and the pose stands 2 m off the wall.
      const m = new Float32Array([
        w.right[0], 0, w.right[2], 0,
        0, 1, 0, 0,
        w.nrm[0], 0, w.nrm[2], 0,
        target.o[0] + w.nrm[0] * 2, target.o[1], target.o[2] + w.nrm[2] * 2, 1,
      ]);
      const ev = { frame: { getPose: () => ({ transform: { matrix: m } }) },
        inputSource: { targetRaySpace: {} } };
      let ended = 0;
      xrRefSpace = { standIn: true };
      xrSession = { end: () => { ended++; return Promise.resolve(); } };

      // 1. Neither way to a keyboard. The case that was reported, and the one
      //    every runtime measured so far actually lands in.
      overlay = false; sysKeyboard = false; markWord(null); xrPending = null;
      xrAim(ev);
      const markedIt = marked === target, carried = xrPending === target;
      const endedNoOverlay = ended;

      // 2. No field of our own, but the runtime says it will raise its own
      //    keyboard over the session. Both things have to happen: the field is
      //    focused where nobody can see it, so the word must light up as well.
      overlay = false; sysKeyboard = true; markWord(null); xrPending = null;
      xrAim(ev);
      const sysOpened = editing === target && typeEl.hidden === false;
      const sysLit = marked === target;
      closeTyping();
      const endedSys = ended;

      // 2b. 🔴 THE RUNTIME DOES NOT SAY, WHICH IS THE COMMON CASE AND WAS THE
      //     ONE THAT DID NOTHING. `isSystemKeyboardSupported` is a recent
      //     addition, so a headset that has not shipped it reports `undefined`
      //     and the page treated that as a no: it refused to try on exactly the
      //     runtimes most likely to be in somebody's hands. Unknown never
      //     blocks. It must behave like the yes above, not like the no.
      overlay = false; sysKeyboard = 'unknown'; markWord(null); xrPending = null;
      xrAim(ev);
      const unkOpened = editing === target && typeEl.hidden === false;
      const unkLit = marked === target;
      closeTyping();
      const endedUnk = ended;

      // 3. A field of our own, inside the session.
      overlay = true; sysKeyboard = false; markWord(null); xrPending = null;
      xrAim(ev);
      const opened = editing === target && typeEl.hidden === false;
      // ⚠️ AND IT MUST NOT ALSO MARK. Two answers to one press is a word left
      // lit behind a field that is editing it, which is the same fact said twice
      // and the second one has no way to be cleared.
      const markedToo = marked !== null;
      closeTyping();

      xrSession = keepSession; xrRefSpace = keepRef;
      // 🔴 THE DECISION, NOT THE BRANCH. `keyboardVerdict` is what turns a
      // session's answer into what this page does, and a runtime that has not
      // shipped the attribute reports `undefined`. Treating that as a no is the
      // defect: the page refuses to try on exactly the headsets most likely to
      // be in somebody's hands. Graded here, at the source, because the branch
      // below passes for `true` and `'unknown'` alike.
      const vUnknown = keyboardVerdict({});
      const vNo = keyboardVerdict({ isSystemKeyboardSupported: false });
      const vYes = keyboardVerdict({ isSystemKeyboardSupported: true });
      d.assert('a runtime that will not say is treated as maybe, never as no',
        vUnknown === 'unknown' && !!vUnknown && vNo === false && vYes === true,
        `undefined -> ${vUnknown}, false -> ${vNo}, true -> ${vYes}`);

      d.assert('...and where the runtime will not say, it tries anyway rather than refusing',
        unkOpened && unkLit && endedUnk === 0,
        `${unkOpened ? 'the field was focused' : 'THE FIELD WAS NOT FOCUSED'} and `
        + `${unkLit ? 'the word lit' : 'THE WORD DID NOT LIGHT'}, `
        + `session ended ${endedUnk} time(s)`);

      overlay = keepOverlay; sysKeyboard = keepSys;
      pos = keepPos; turn = keepTurn;
      markWord(null); xrPending = null;
      window.__demo.trigger = { markedIt, carried, sysOpened, sysLit, opened, markedToo, ended };

      d.assert('the trigger in a headset marks a word and never ends the session',
        markedIt && carried && endedNoOverlay === 0 && ended === 0,
        ended === 0
          ? `pointing at "${target.item.text}" from 2 m marked it and kept it for `
            + 'the field, across all three ways a runtime can answer about a keyboard, '
            + 'and not one of them asked the session to end'
          : 'A TRIGGER PRESS ENDED THE SESSION, which is the bug this was reported for');
      // The second way to a keyboard, which is the one a Quest actually offers:
      // the runtime raises its own over the session when a field takes focus.
      // ⚠️ BOTH HALVES. The field is invisible in there, so an open field with no
      // lit word is a press that looks like it did nothing.
      d.assert('...and where the runtime raises its own keyboard, the press does both',
        sysOpened && sysLit && endedSys === 0,
        sysOpened && sysLit
          ? `the field took focus on "${target.item.text}" and the word stayed lit, `
            + 'which is the only part of it anybody in the room can see'
          : `field focused: ${sysOpened}, word lit: ${sysLit}`);
      // The other half of the same branch. A runtime that DOES put a field in
      // the session must type in the session, and a check that only ever ran the
      // refused side would be green about half the code.
      d.assert('...and where the runtime allows a field in the session, it types there instead',
        opened && !markedToo,
        opened
          ? `with a field allowed, the same press opened it on "${target.item.text}" `
            + `rather than marking, and left ${markedToo ? 'a word lit as well' : 'nothing lit'}`
          : 'the press did not open the field on the word it landed on');
    }

    // Both eyes share a framebuffer and a clear ignores the viewport; that is
    // only reachable in a headset, but a pending GL error is not.
    d.assert('nothing was left pending on the graphics card',
      gl.getError() === gl.NO_ERROR, 'getError is NO_ERROR after a full pass');

    // ⚠️ THE HEADSET HALF IS HUMAN-VERIFIED AND THE PAGE SAYS SO. `verify-gl`
    // cannot enter a session and cannot pull a trigger; `demo/verify-quest.mjs`
    // is what grades the two below on real hardware.
    d.assert('a headset was asked about, both ways',
      vrKnown !== null && arKnown !== null,
      `immersive-vr ${vrKnown}, immersive-ar ${arKnown}`);

    d.ready();
  }

  buildAll()
    .then(() => { requestAnimationFrame(frame); return finish(); })
    .catch((e) => d.fail(e));
</script>
</html>
