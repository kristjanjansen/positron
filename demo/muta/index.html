<style>
  /* 🔴 ONE PITCH FOR THE WHOLE PANEL, WHICH IS THE PROPORTIONS OF A REAL
     OBJECT AND THEREFORE THIS PAGE'S TO SET. `panel-layout.mjs` splits it in
     those words: the component owns the ARRANGEMENT and a page owns its own
     instrument's proportions. `/circuit/` already declares its own `14px` for
     the same reason and its comment says why one pitch beats three.
     🔴 MEASURED BEFORE IT WAS CHANGED, because *"more space around the
     rotaries"* can mean the dial, the column, the gap or the group's own
     surroundings, and those have four different fixes. At
     1280 px: every dial is `--ctl-w` 46 px wide, `.pos-knob-dial` is the full
     46 as well, and the gap between two neighbours was the site default of
     **8 px**. So a row of rotaries was 46 px of drawing, 8 px of air, 46 px of
     drawing, and the dial had NO margin of its own inside its column at all.
     The air between two knobs was the only air there was.
     ⚠️ SO IT IS THE GAP AND NOT THE COLUMN. Widening `--ctl-w` would move the
     working surface of every control on the site; widening the gap moves only
     the space complained about. 16 px, which doubles it, and the divider below
     stays three of them so the two groups keep the 4 to 1 ratio they had.
     ⚠️ AND IT IS DECLARED ON THE CASE, NOT AT `:root`, so it reaches the two
     knob rows and nothing above them. A custom property inherits downward and
     never sideways, which is what makes this safe to say once. */
  /* ⚠️ ONE DECLARATION FOR BOTH CASES, AND EACH ONE STILL CARRIES ITS OWN NAME.
     `.muta-panel` is the pitch, which is a claim about how a rotary is spaced
     and is the same claim on both instruments. `.plai-panel` and `.warp-panel`
     exist so an assert can say WHICH case it measured, because a page with two
     of them cannot query `.panel` and mean anything. */
  .muta-panel { --ctl-gap: 16px; }

  /* The picker sits above the knobs: choosing the model comes first, moving
     it comes second. One row, one class, no layout arithmetic. */
  .plai-pick { display: flex; align-items: center; }

  /* TWO ROWS THAT READ AS ONE BLOCK, AND ONE CHILD OF THE PANEL'S FLOW. The
     flow puts `--panel-gap` between its children, which is right between the
     model picker and the rotaries and too much between the two halves of a
     2 by 2 arrangement. One container, one control gap, and the flow sees a
     single child. */
  /* ⚠️ `min-width: 0` OR THE PAGE DRAGS SIDEWAYS INSTEAD OF THE ROW. It is the
     same guard `.pos-knob-row` carries and for the same reason: `overflow-x`
     cannot shrink a flex item below its content, and this container sits
     between the row and the panel's flow. */
  .plai-knobs {
    display: flex; flex-direction: column; gap: var(--ctl-gap); min-width: 0;
  }

  /* The effect has one row and one carrier picker above it, which is the same
     arrangement as the oscillator above with one row fewer. */
  .warp-pick { display: flex; align-items: center; }

  /* 🔴 THE DIVIDER IS A GAP, NEVER A RULE. `positron-ui`: separation is
     spacing, and an empty box is a line. This widens ONE existing gap in a
     flex row rather than inserting anything, so there is no element to paint
     its own edges and nothing for a phone to scroll past. It is the same
     `--ctl-gap` the row already uses, three of them, so the two groups are
     separated by four gaps where neighbours get one. */
  .plai-extra { margin-left: calc(var(--ctl-gap) * 3); }

  /* 🔴 THE WIDER PITCH IS A DESKTOP AFFORDANCE AND A PHONE HAS NOWHERE TO PUT
     IT. MEASURED at 390 px with the 16 px pitch: the top row comes to 342 px
     inside a 316 px scroller, so the strip scrolled 26 px, and what was under
     the case's right edge was the third attenuverter AND the model picker's
     die. The strip scrolling is the panel's own contract and the page never
     drags, so nothing was broken. It still puts a control a visitor needs
     behind a sideways drag inside a card, which this project already records
     as a thing nobody finds.
     ⚠️ THE ARITHMETIC, SO THE NEXT NUMBER CAN BE CHOSEN RATHER THAN GUESSED:
     the row is `5 * 46 + 7 * gap`, because the divider is three more gaps on
     top of the four between neighbours, and the scroller is the window less
     32 px of page padding and 42 px of case. At 16 px that needs a 416 px
     window. Back at the site default of 8 it is 286 px in 316, with 30 px to
     spare, which is the margin this wants rather than the 2 px that a pitch of
     12 would have left.
     🔴 AND IT IS LAST IN THIS BLOCK BECAUSE A MEDIA QUERY ADDS NO SPECIFICITY.
     `.muta-panel` above is the same weight, so a media block written before it
     would lose at every width and never run once, which is exactly what
     happened to `.pos-pick`'s entire phone layout.
     ⚠️ NOTHING IN THE SUITE CAN SEE THIS. `demo/verify.mjs` runs at 756 px with
     no viewport override, so the asserts on this page grade the 16 px pitch
     only. The 390 px reading above was taken by hand. */
  @media (max-width: 560px) { .muta-panel { --ctl-gap: 8px; } }
</style>

<script type="module">
  // 🔴 THIS PAGE RUNS SOMEBODY ELSE'S FIRMWARE, UNMODIFIED, AND THAT IS THE
  // CLAIM IT EXISTS TO MAKE. `LESSONS.md` #81: `/grains/` said *"the same
  // granulator in this page and on a Raspberry Pi"* and it was false, because
  // the page ran a REIMPLEMENTATION and *"no amount of A/B can promote similar
  // to same"*. What is under this page is `plaits/dsp/voice.cc` compiled by
  // emscripten from a pinned commit, with no line of it rewritten. The build
  // stamps its own source digest into the wasm, so a second build of the same
  // sources on the board can be compared to this one by something other than
  // listening. That comparison has NOT been made yet and the page says so.
  //
  // 🔴 AND IT IS NOT A `ScriptProcessorNode`. `plans/plan-vcv-modules.md` §9.2
  // measured the only shipped browser build in this ecosystem, Cardinal's, and
  // it runs the whole engine in `createScriptProcessor(2048, …)` on the main
  // thread: 42.7 ms of buffer, competing with layout and paint, on a node the
  // Web Audio specification deprecated years ago. This is 128 frames on the
  // audio thread.
  //
  // ── EIGHT VOICES, AND THE POLYPHONY IS THE HOST'S ───────────────────────
  //
  // 🔴 PLAITS IN HARDWARE IS ONE MODULE WITH ONE VOICE IN IT. Rack gets chords
  // out of the same DSP by instantiating `plaits::Voice voice[16]` against ONE
  // `Patch`, and the shim does the same with eight. Nothing in `plaits/` was
  // changed to make that possible, which is the point: polyphony is an
  // arrangement of copies rather than an edit to somebody's firmware.
  //
  // 🔴 AND A STOLEN VOICE IS INVISIBLE FROM THE SPEAKERS. The note that went
  // away sounds exactly like a note that was never played, so the page prints
  // which voice took each note and says out loud when one was taken from
  // something still ringing.
  import { mount, guard, el } from '/shell/shell.mjs';
  import { SELFCHECK, ifSelfcheck } from '/shell/selfcheck.mjs';
  import { createKnob, createKnobBank } from '/shell/knob.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { createInstrument } from '/shell/instrument.mjs';

  // TWO ARTEFACTS, TWO SHIMS, ONE PINNED COMMIT. Neither module knows the
  // other exists: what chains them is a WebAudio connection made in `boot()`.
  const PLAI_URL = '/muta/vendor/plai.wasm';
  const WARP_URL = '/muta/vendor/warp.wasm';

  // The sixteen models, in the order `plaits/dsp/voice.cc:38` registers them.
  // THE ORDER IS THE SOURCE'S, NOT A CHOICE MADE HERE: `plai_active_engine()`
  // returns the index the DSP is actually sounding, and a list in any other
  // order would label the wrong sound with a straight face.
  const MODELS = [
    'virtual analog', 'waveshaping', 'two operator FM', 'granular formant',
    'harmonic', 'wavetable', 'chord', 'speech',
    'swarm', 'filtered noise', 'particle noise', 'string',
    'modal', 'bass drum', 'snare drum', 'hi-hat',
  ];

  // The parameter ids, the third and last copy of this list. The other two are
  // demo/muta/build/plai_shim.cc and demo/muta/muta-worklet.js, and all three
  // spell the names out because a mismatch moves the wrong control instead of
  // throwing.
  // ⚠️ 7 (trigger) AND 9 (trigger_patched) ARE GONE and are not listed. A gate
  // belongs to one voice, so it is `plai_note_on` and `plai_set_drone` now.
  const P = {
    engine: 0, note: 1, harmonics: 2, timbre: 3, morph: 4,
    decay: 5, lpgColour: 6, level: 8, levelPatched: 10,
    fmAmount: 11, timbreModAmount: 12, morphModAmount: 13,
  };

  // HOW MANY VOICES THE SLIDER OFFERS. The wasm is the authority and reports
  // `plai_max_voices()`, but the control is built before anything is fetched,
  // so this number has to be typed once. The check below grades it against
  // what the wasm says rather than trusting that they agree.
  const SLIDER_MAX_VOICES = 8;

  // The effect's parameter ids, the third copy. The others are
  // demo/muta/build/warp_shim.cc and demo/muta/muta-worklet.js.
  const W = {
    algorithm: 0, amount: 1, drive1: 2, drive2: 3, note: 4, carrier: 5,
  };

  // THE SEVEN THINGS THE ALGORITHM KNOB CAN BE, IN THE ORDER
  // `warps/dsp/modulator.h:117` REGISTERS THEM. Six waveshapers and then a
  // vocoder, and the knob crossfades between adjacent ones rather than
  // stepping, so `warp_algorithm()` reports which pair is sounding and
  // `warp_algorithm_blend()` says how far between them the knob sits.
  // ⚠️ THE UPSTREAM SPELLING OF THE SECOND ONE IS ONE WORD THIS SITE DOES NOT
  // PRINT: `positron-ui` bans it as private vocabulary, which it is not here,
  // but a reader cannot tell those apart. `wavefolder` is what the circuit is.
  const ALGORITHMS = [
    'crossfade', 'wavefolder', 'analog ring', 'digital ring',
    'bitwise xor', 'comparator', 'vocoder',
  ];

  // WHAT THE SECOND INPUT IS. 0 takes the oscillator's aux jack, which is the
  // chain; 1 to 3 render an internal carrier instead and turn the first input
  // into a phase modulation input. `warps/ui.cc:231` is `(shape + 1) & 3`, so
  // four positions is the instrument's own count rather than a choice here.
  const CARRIERS = ['from PLAI', 'sine', 'triangle', 'saw'];

  // WHERE THE VOCODER LIVES ON THE KNOB, AND IT IS NOT AT THE TOP.
  // `modulator.cc:206` puts the vocoder above 0.725, and `:312` reads
  // `release_time > 0.995` as FREEZE, which above about 0.982 holds the last
  // spectrum forever. 0.85 is the middle of the band that sounds.
  const VOCODER_AT = 0.85;
  const SHAPER_AT = 0.25;

  // The chord four notes make, as intervals off the pitch control. Four rather
  // than eight so a press at the default setting never has to steal, and a
  // press at a setting below four always does.
  const CHORD = [0, 4, 7, 11];

  const ONE = 'Two of Emilie Gillet’s firmwares, an oscillator and an effect, compiled '
            + 'from their own C++ to WebAssembly and chained in one audio graph.';

  const d = mount({
    name: 'muta',
    what: ONE,
    // EIGHT CELLS, AND EVERY ONE MOVES. The two wasm SIZES are the headline
    // numbers of this experiment and they are deliberately NOT here: they are
    // constants, and a constant in a readout teaches a reader to stop looking
    // at the row. They are in the log, once, beside the yardsticks worth
    // comparing to.
    // 🔴 `bands` IS THE CELL THIS PAGE EXISTS TO PRINT. Warps' filter bank
    // coefficients were computed at 96 kHz and this page runs at 48, so the
    // twenty vocoder bands sit an octave below where the hardware puts them.
    // It reads the shift in octaves while the vocoder is the path running and
    // is EMPTY while it is not, because the six waveshapers are unaffected and
    // a figure that applied to nothing would be worse than no figure.
    /**
     * 🔴 FOUR CELLS, ASKED FOR 2026-09-22 AS *"readout: 4 sections only, ones
     * make sense"*. It was eight.
     * ⚠️ **THE TEST WAS `positron-ui`'S OWN AND IT REMOVED THE FOUR FOR FOUR
     * DIFFERENT REASONS:** *every readout cell must be able to change, and a
     * cell showing a structural constant reads as a measurement and teaches the
     * reader to ignore the row*.
     * - `rate` is **48000 on every visit**, which is the constant that rule was
     *   written about. It is asserted and logged, which is where a fact that
     *   never moves belongs.
     * - `boot` moves once, at the start, and is never touched again. It is the
     *   page's headline number and it is in the log, where a reader can see it
     *   beside the thing it timed.
     * - `algorithm` printed a name the WARP knob already shows, an inch away.
     * - `bands` was EMPTY except while the vocoder was the path running, so
     *   most of the time it was a key over nothing.
     * ✅ **WHAT IS LEFT ALL FOUR MOVE WHILE YOU WATCH AND ALL FOUR ARE ABOUT
     *   WHAT THE INSTRUMENT IS DOING NOW**: what a render costs, what share of
     *   the budget that is, how loud it is, and how many voices are up.
     * ⚠️ AND FOUR IS EVEN, which `mount()` throws over, because an odd readout
     *   always has a weakest cell and being made to find it is the point.
     */
    readout: {
      render: 'µs', load: '%', peak: '', sounding: '',
    },
    /**
     * 🔴 `Start audio` LEFT THIS ROW 2026-09-22: *"rm start audio, those
     * turnots enable it"*. Each case's header now carries a button that starts
     * and stops its own instrument, so a separate control would be a second way
     * to do one thing.
     * 🔴 **AND IT IS THE ROW THE HARNESS PRESSES, WHICH IS THE DANGEROUS HALF.**
     * `demo/verify.mjs` drives a page by clicking every button in
     * `.pos-controls`, and a header button is not in it. Deleting this without
     * replacing the press would leave the audio never started and **every
     * assert behind it silently not running**, which `positron-verify` records
     * happening twice in one day on `/mirror/` and `/blocks/`: ten asserts and
     * six, none of which failed, all of which disappeared.
     * ✅ **SO THE PAGE DRIVES THE HEADER BUTTON ITSELF, BEHIND `SELFCHECK`**,
     * the way `/mirror/` drives the headset buttons it can no longer reach. See
     * the boot block below.
     * ⚠️ AND `settleMs` ONLY EVER LANDS ON CONTROL 0, which was this button.
     * It is `Pluck` now, and the wait that used to cover a wasm fetch and two
     * handshakes has to cover them somewhere else.
     */
    controls: [
      { id: 'pluck', label: 'Pluck', primary: true },
      { id: 'chord', label: 'Chord' },
      { id: 'model', label: 'Next model' },
      { id: 'drone', label: 'Drone' },
      { id: 'vocoder', label: 'Vocoder' },
    ],
  });
  guard(d);

  let ctx = null, node = null, ready = null, wasmBytes = 0, wasmImports = -1;
  let bootMs = null, quiet = null, loud = null, entered = null, costPerQuantumMs = null;
  let oneVoiceMs = null, manyVoiceMs = null;
  let model = 0, droning = false, meters = 0, bench = null;
  let voiceCount = SLIDER_MAX_VOICES, trim = 1;
  let lastNote = null, chord = null, blockRule = null;
  let last = { peak: 0, blocks: 0, renders: 0, held: 0, poly: 0,
               blocksPerQuantum: 0, engine: -1, frames: 0 };

  // ── the effect's own state, kept apart from the oscillator's ──────────────
  let warpNode = null, warpReady = null, warpBytes = 0, warpImports = -1;
  let warpEntered = null, warpBench = null, warpCostMs = null, warpMeters = 0;
  let vocoding = false, carrier = 0;
  let warpLast = { peak: 0, inPeak: 0, blocks: 0, frames: 0, blocksPerQuantum: 0,
                   carry: -1, algorithm: -1, blend: 0, vocoding: false,
                   vocoderAmount: 0, carrier: 0, quantum: 0 };
  let carrySeen = new Set();
  let chainOff = null, chainOn = null;

  // ⚠️ DECLARED HERE, ABOVE EVERYTHING THAT CLOSES OVER THEM. `boot()` and
  // `onWorklet()` both reach these, and `positron-ui` records a page where a
  // `const` declared later in the same block silently took seven asserts out
  // of a run through its temporal dead zone.
  let onReady = () => {};
  let onFirst = () => {};
  let onWarpReady = () => {};

  // ── the controls ────────────────────────────────────────────────────────
  // Built before boot, because a page whose controls appear only after a press
  // is a page that looks broken until you press the one button it shows.
  //
  /**
   * 🔴 THE VOICE COUNT IS A STEPPED KNOB IN THE BOTTOM RIGHT SINCE 2026-09-22,
   * ASKED FOR AS *"move voices to knobs, bottom right, stepped knob"*. It was a
   * slider outside the case.
   * 🔴 **AND THE COMMENT THAT PUT IT OUTSIDE WAS ALREADY OUTVOTED ON THIS PAGE,
   * WHICH IS WHY THIS IS NOT A REVERSAL OF A LIVE ARGUMENT.** It read that the
   * voice count is not a panel control, that Plaits has one voice, and that
   * putting it on the case would have the case claiming a knob the instrument
   * does not have. Every word of that is true. **`decay` and `lpg_colour` are
   * not panel knobs either**: `plaits/ui.cc:70-84` binds them as the ALTERNATE
   * functions of MORPH and TIMBRE, reached by holding a button, and this page
   * gives both of them a knob of their own in the same case. The principle had
   * already been traded for usability twice before this ask arrived.
   * ⚠️ **WHAT KEEPS IT HONEST IS THE SECOND LABEL, NOT THE POSITION.** Row two
   * is where the controls the hardware does not give you a knob for live, and
   * every one of them says so underneath itself.
   * ⚠️ **AND IT TAKES NO INVISIBLE HAND.** `hand-drive.mjs` refuses a control
   * under about thirty steps, because the wander at each end would be less than
   * one step and it would draw a staircase. Eight voices is eight, so this is
   * the one knob here that asks for none rather than wearing a refused button.
   */

  const pick = createPicker({
    label: 'model',
    what: 'model',
    prev: () => setModel(model - 1),
    next: () => setModel(model + 1),
    random: () => setModel(Math.floor(Math.random() * MODELS.length)),
    onPick: (i) => setModel(i),
  });
  pick.options(MODELS, 0);
  const pickRow = el('div', 'plai-pick');
  pickRow.append(pick.el);

  // ── the panel, arranged the way the panel is ────────────────────────────
  //
  // 🔴 READ OFF `plaits/ui.cc:70-84` IN THE PINNED SOURCE, NOT OFF A
  // PHOTOGRAPH. Every pot there is bound with a primary parameter and, for
  // three of them, a SECONDARY reached by holding a button:
  //
  //   FREQUENCY   transposition_, bipolar       no secondary
  //   HARMONICS   harmonics                     octave_
  //   TIMBRE      timbre                        lpg_colour
  //   MORPH       morph                         decay
  //   three attenuverters, each `2.0f, -1.0f`, which is -1 to +1 centred at 0
  //
  // 🔴 SO THE INSTRUMENT HAS FOUR BIG ROTARIES AND THIS PAGE HAS NINE, AND
  // THAT IS A CHOICE RATHER THAN A GAP. `decay` and `lpg_colour` have no knob
  // of their own out there: they are what TIMBRE and MORPH become while a
  // button is held. Folding them into a held gesture here would be faithful
  // and would hide two controls behind something a visitor has to discover, so
  // they are visible and their second label says where the hardware keeps
  // them. WHAT WAS REFUSED is the alternate mode, and the reason is that a
  // page nobody can work is worse than a page that differs from a panel.
  //
  // ⚠️ `octave_` AND `transposition_` ARE TWO FIELDS IN THE FIRMWARE AND ONE
  // HERE. `ui.cc` combines them into `patch.note` before the DSP sees either,
  // so one pitch control is the instrument. Splitting it into coarse and fine
  // would be copying the panel rather than the instrument.
  //
  // ⚠️ AND THE ATTENUVERTERS ARE IN THE PANEL'S ORDER, TIMBRE THEN FM THEN
  // MORPH, which `plaits/drivers/pots_adc.h` enumerates in exactly that order.
  // Putting FM first would have grouped it with the row it modulates, which is
  // a better argument about meaning and a worse one about fidelity, and
  // fidelity is what was asked for.
  //
  // ⚠️ NO MARGIN ARITHMETIC. Every column is one `createKnob`, every row is one
  // `createKnobBank`, and the only geometry this page writes is one widened
  // gap. `positron-ui` records `/twelve/` being corrected by screenshot twelve
  // times in one evening, every time for a page doing arithmetic about a
  // component's insides.
  const knobs = new Map();
  /**
   * 🔴 EVERY KNOB ON THIS PAGE HAS AN INVISIBLE HAND, ASKED FOR 2026-09-22 AS
   * *"add inivisible hands to muta's"*. It is `hand: true` in these two helpers
   * rather than on fourteen call sites, so a knob added later gets one by
   * being a knob.
   * ✅ **AND IT COSTS NOBODY ANYTHING HERE, WHICH IS NOT TRUE EVERYWHERE.**
   * The ten minute ceiling in `hand-drive.mjs` was written for `/knobs/`, where
   * a hand puts fifty messages a second on a relay and into a Raspberry Pi in
   * another building. This page opens no socket and reaches no relay: a hand on
   * it moves a number across one thread boundary into an AudioWorklet on this
   * machine, and it is audible in the next render quantum, 2.67 ms away.
   * ⚠️ **A CONTROL TOO COARSE FOR ONE REFUSES ITSELF AND SAYS SO ON ITS OWN
   * BUTTON.** Every knob here is continuous, so every one qualifies; the voice
   * count does not and is not a knob in this bank.
   */
  const knob = (key, id, o) => {
    // ON EVERY MOVE. There is no wire here and no relay to overrun: the
    // message crosses one thread boundary and is audible in the next render
    // quantum, which is 2.67 ms away.
    /**
     * ⚠️ `o.onInput` WINS WHERE A CALLER GIVES ONE, AND THIS LINE USED TO PUT
     * THE HELPER'S AFTER THE SPREAD, so a caller's callback was silently
     * replaced. Every knob but one is a firmware parameter and wants the
     * default; the voice count is the host's own and has to be able to say so.
     */
    const k = createKnob({ hand: true, ...o,
      onInput: o.onInput || ((v) => send({ t: 'param', id, value: v })) });
    knobs.set(key, k);
    return k;
  };

  /**
   * 🔴 NO KNOB ON THIS PAGE CARRIES A SECOND LABEL SINCE 2026-09-22, ASKED FOR
   * AS *"rm muta sublabels"*. Fifteen of them went.
   * ⚠️ **THE HEIGHT ARGUMENT SURVIVES THE CHANGE AND THE OTHER ONE DOES NOT.**
   * `knob.mjs` appends a sub only when there is one, so a row mixing knobs with
   * and without would have columns of two different heights. None of them has
   * one now, so the rows still agree, which is what that rule was protecting.
   * 🔴 **WHAT IT COSTS IS NAMED RATHER THAN LEFT TO BE DISCOVERED: `TIMBRE` AND
   * `MORPH` EACH APPEAR TWICE ON THIS PAGE**, once as a big rotary and once as
   * an attenuverter, and the range underneath was what told them apart.
   * ✅ **THE MARKS DO MOST OF THAT JOB NOW.** The three attenuverters print `-`
   * and `+` at the ends of their travel and the four big rotaries print
   * nothing, which this page already asserts as both halves of one claim. So a
   * reader can still tell a bipolar knob from a unipolar one; what is gone is
   * the number that said BY HOW MUCH.
   * 🔴 **AND THE VOICE COUNT LOST THE LABEL THAT WAS CARRYING ITS HONESTY.** It
   * read `host, not panel`, and the note above it says in as many words that
   * what keeps a knob the hardware does not have inside this case is the second
   * label rather than the position. That claim now has nowhere on the panel to
   * live. It is recorded here, and the page's own prose is where it belongs if
   * anybody wants it back.
   */
  //
  // 🔴 AND THE THREE ATTENUVERTERS PRINT THE PANEL'S OWN MARKS, WHICH IS WHAT
  // `ends` IS FOR. `createKnob` takes either `true`, which prints `min` and
  // `max`, or a pair. The pair is right here for two reasons and the first is
  // this page's own settled rule: when meaning and fidelity disagree on a
  // panel here, fidelity wins, which is already written a few lines up about the
  // attenuverters' ORDER. Mutable print `-` and `+` beside these three pots and
  // nothing beside the four big ones.
  // ⚠️ THE SECOND REASON IS THAT `ends: true` WOULD SAY THE SAME THING TWICE.
  // These three already carry `-1 to 1` as their second label, so numbers in
  // the dial's gap would be the same two figures 12 px above themselves inside
  // one 46 px column, and the live value is printed above the dial as well.
  // `-` and `+` add the one thing neither of those carries: WHICH HALF OF THE
  // TRAVEL is negative, said by position rather than by text.
  const MARKS = ['-', '+'];
  const rowTop = createKnobBank([
    knob('pitch', P.note,
      { label: 'frequency', min: 24, max: 96, value: 60, home: 60 }),
    knob('harmonics', P.harmonics,
      { label: 'harmonics', min: 0, max: 1, value: 0.5, home: 0.5 }),
    knob('timbreMod', P.timbreModAmount,
      { label: 'timbre', min: -1, max: 1, value: 0, home: 0, ends: MARKS }),
    knob('fmMod', P.fmAmount,
      { label: 'fm', min: -1, max: 1, value: 0, home: 0, ends: MARKS }),
    knob('morphMod', P.morphModAmount,
      { label: 'morph', min: -1, max: 1, value: 0, home: 0, ends: MARKS }),
  ]);
  const rowBottom = createKnobBank([
    knob('timbre', P.timbre,
      { label: 'timbre', min: 0, max: 1, value: 0.5, home: 0.5 }),
    knob('morph', P.morph,
      { label: 'morph', min: 0, max: 1, value: 0.5, home: 0.5 }),
    knob('decay', P.decay,
      { label: 'decay', min: 0, max: 1, value: 0.5, home: 0.5 }),
    knob('colour', P.lpgColour,
      { label: 'colour', min: 0, max: 1, value: 0.5, home: 0.5 }),
    /**
     * ⚠️ `step: 1` IS THE COMPONENT'S, NOT A ROUNDING THIS PAGE DOES ON THE WAY
     * OUT. A page that rounds its own value leaves the DIAL somewhere the
     * number is not, and a voice count that reads 5 while the needle sits
     * between 5 and 6 is a control arguing with its own readout.
     * ⚠️ AND IT IS `onChange` AS WELL AS `onInput`: eight is the ceiling the
     * wasm reports, and the value that has to land is the one the drag ended
     * on.
     */
    knob('voices', null,
      { label: 'voices', min: 1, max: SLIDER_MAX_VOICES,
        step: 1, value: SLIDER_MAX_VOICES, home: SLIDER_MAX_VOICES, hand: false,
        onInput: (v) => setVoices(v) }),
  ]);
  // The first knob after the instrument's own pair, on each row, carries the
  // gap. One class, one declaration, and the two rows line up because every
  // knob is `--ctl-w` wide and the browser does the rest.
  knobs.get('timbreMod').el.classList.add('plai-extra');
  knobs.get('decay').el.classList.add('plai-extra');
  const knobGrid = el('div', 'plai-knobs');
  knobGrid.append(rowTop.el, rowBottom.el);

  // ── the case ────────────────────────────────────────────────────────────
  //
  // 🔴 `createInstrument`, WHICH IS THE COMPOSITION AND NOT A CASE THIS PAGE
  // DRAWS. It calls `createPanelLayout` and `createNameplate` and builds
  // neither itself, and five pages had written that assembly by hand before it
  // existed. The maker comes from `MAKER` in that module, so the word is typed
  // in one place on the site rather than on every panel.
  //
  // 🔴 `side: null`, WHICH IS A PANEL WITH NO FIXED COLUMN, AND `/circuit/`
  // IS THE OTHER ONE. A fixed column has to hold something that must stay put
  // while the rest scrolls, and nothing here qualifies: the two knob rows come
  // to 342 px, so at every width this page is read at there is nothing to
  // scroll. The one candidate was the model picker, and a `--pick-w` of 22ch
  // makes it about 250 px wide, which at 390 px would leave the rotaries about
  // 100 px of strip and force a sideways drag on a phone to reach the fourth
  // knob.
  //
  // ⚠️ THE VOICE SLIDER STAYS OUTSIDE THE CASE, WHICH IS THE SAME CLAIM ITS
  // OWN SECOND LABEL MAKES. Plaits is one module with one voice in it; eight
  // of them is this page's arrangement of copies. Putting that control on the
  // instrument's plate would have the case claiming a knob the instrument does
  // not have, which is the one thing a replica may not do.
  /* 🔴 NO MAKER, ASKED FOR 2026-09-22 AS *"rm positron from plai and tom
     nameplates"*. `plateSpec` turns an empty maker into ONE line at `end`
     rather than `ends`, because `ends` is `space-between` and parks a lone
     child on the left, which `/twelve/` was reported for. The page does not
     choose that placement and cannot get it wrong. */
  /**
   * 🔴 A HEADER ON EACH CASE SINCE 2026-09-22, ASKED FOR AS *"create instrumet
   * header/glue ... left: online status button: enabled disabled (green/gray).
   * right nameplate. center patch selector (optically center to the
   * instrument)"* and then *"apply to muta's"*. This page is the component's
   * first caller with TWO cases on one page, which is the arrangement that
   * finds whatever one hides.
   * 🔴 **THE STATUS REPORTS AND DOES NOT PRETEND TO ACT, WHICH IS A CHOICE THE
   * COMPONENT MAKES POSSIBLE AND THIS PAGE HAS TO MAKE.** `createInstrument`
   * gives a caller that supplies `press` a real button and a caller that
   * supplies none a badge with no tab stop and no handler. **Nothing here can
   * be switched off.** Both firmwares are compiled into the page and start
   * with the audio; a button offering to disconnect one would be a control
   * whose only honest behaviour is to do nothing, which `positron-ui` calls the
   * shape this project calls a lie.
   * ✅ **WHAT IT REPORTS IS REAL AND ARRIVES LATE**, which is why it is worth
   * a light at all: each case opens `disabled` and turns `enabled` when ITS OWN
   * wasm has compiled and its processor has answered. The two do not arrive
   * together, so on a slow load the page shows one instrument up and one not.
   * ⚠️ **AND THE PICKER MOVES OUT OF THE BODY INTO THE HEADER**, which is what
   * the centre cell is for. It was the one candidate for a fixed column and was
   * refused there for width; the header solves the same problem by giving it a
   * row of its own on a phone.
   */
  const inst = createInstrument({
    name: 'PLAI', maker: '',
    header: { online: { of: 'PLAI', state: 'offline', press: () => togglePlai() },
              patch: pickRow },
    panel: { side: null, cls: { panel: 'muta-panel plai-panel' } },
  });
  inst.add(knobGrid);

  // ── the second case, which is an effect and not an oscillator ────────────
  //
  // 🔴 TWO INSTRUMENTS ON ONE PAGE, AND THE ORDER ON THE PAGE IS THE ORDER OF
  // THE SIGNAL. PLAI makes the sound and WARP changes it, so PLAI is above.
  // Nothing about a WebAudio connection makes that visible, and a reader who
  // has to work out which way round two cases are wired has been handed a
  // puzzle rather than a panel.
  //
  // 🔴 READ OFF `warps/ui.cc` AND `warps/cv_scaler.cc` IN THE PINNED SOURCE.
  // The module has one big ALGORITHM pot, one PARAMETER pot, two LEVEL pots
  // that are the channel drives, and a button that cycles the carrier shape
  // through four positions (`ui.cc:231`, `(carrier_shape_ + 1) & 3`). The
  // LEVEL 1 pot doubles as the internal carrier's pitch when a shape is
  // chosen: `cv_scaler.cc:159` is `60 * pot + 12`, which is the range the NOTE
  // rotary below carries.
  //
  // ⚠️ THE ALGORITHM CONTROL IS ONE CONTINUOUS ROTARY AND NOT A LIST OF SEVEN.
  // `modulator.cc:302` crossfades between two adjacent algorithms on the
  // fractional part of the knob, so a picker would be a different instrument
  // wearing this one's name. What is sounding is in a readout cell instead,
  // which is where a number that moves belongs.
  const wknobs = new Map();
  // A hand on every one of these too. See the note on `knob` above.
  const wknob = (key, id, o) => {
    const k = createKnob({ hand: true, ...o, onInput: (v) => sendWarp({ t: 'param', id, value: v }) });
    wknobs.set(key, k);
    return k;
  };

  const wpick = createPicker({
    label: 'carrier',
    what: 'carrier',
    prev: () => setCarrier(carrier - 1),
    next: () => setCarrier(carrier + 1),
    random: () => setCarrier(Math.floor(Math.random() * CARRIERS.length)),
    onPick: (i) => setCarrier(i),
  });
  wpick.options(CARRIERS, 0);
  const wpickRow = el('div', 'warp-pick');
  wpickRow.append(wpick.el);

  const warpRow = createKnobBank([
    wknob('algorithm', W.algorithm,
      { label: 'algorithm', min: 0, max: 1, value: 0, home: 0 }),
    wknob('amount', W.amount,
      { label: 'amount', min: 0, max: 1, value: 0.5, home: 0.5 }),
    wknob('drive1', W.drive1,
      { label: 'level 1', min: 0, max: 1, value: 0.5, home: 0.5 }),
    wknob('drive2', W.drive2,
      { label: 'level 2', min: 0, max: 1, value: 0.5, home: 0.5 }),
    wknob('note', W.note,
      { label: 'note', min: 12, max: 72, value: 48, home: 48 }),
  ]);

  const warpInst = createInstrument({
    name: 'WARP', maker: '',
    header: { online: { of: 'WARP', state: 'offline', press: () => toggleWarp() },
              patch: wpickRow },
    panel: { side: null, cls: { panel: 'muta-panel warp-panel' } },
  });
  warpInst.add(warpRow.el);

  d.stack.add(inst.el, warpInst.el);

  function send(m) { if (node) node.port.postMessage(m); }
  function sendWarp(m) { if (warpNode) warpNode.port.postMessage(m); }

  /** Move the algorithm rotary and tell the effect, so the control and the DSP
   *  never disagree about where the knob is. */
  function setAlgorithm(v) {
    wknobs.get('algorithm').set(v);
    sendWarp({ t: 'param', id: W.algorithm, value: v });
  }

  function setCarrier(i) {
    carrier = ((i % CARRIERS.length) + CARRIERS.length) % CARRIERS.length;
    wpick.show(CARRIERS[carrier], carrier);
    sendWarp({ t: 'param', id: W.carrier, value: carrier });
    d.log(carrier === 0
      ? 'the second input comes from PLAI, so the whole sound is the chain'
      : `the carrier is WARP's own ${CARRIERS[carrier]} and PLAI's first output `
        + 'becomes a phase modulation input');
  }

  function setModel(i) {
    model = ((i % MODELS.length) + MODELS.length) % MODELS.length;
    pick.show(MODELS[model], model);
    send({ t: 'param', id: P.engine, value: model });
    d.log(`model ${model}, ${MODELS[model]}`);
    measureCost(model, voiceCount);
  }

  function setVoices(n) {
    voiceCount = Math.max(1, Math.round(n));
    send({ t: 'voices', n: voiceCount });
    measureCost(model, voiceCount);
  }

  /** One note, at the pitch the control is showing. `holdMs` of 0 sustains. */
  function noteOn(note, holdMs) { send({ t: 'noteOn', note, holdMs }); }

  /**
   * ⚠️ NOT ROUNDED TO A SEMITONE, AND THE ROUNDING IS WHAT WAS REMOVED. The
   * panel's FREQUENCY pot is continuous and `NoteToFrequency` takes a float, so
   * a knob reading 60.37 plays 60.37. Rounding it would leave the control
   * showing one number and the instrument playing another, which is the
   * smallest version of a control that lies. The chord adds whole semitones to
   * whatever this is, exactly as turning the knob on the module does.
   */
  function pitch() { return knobs.get('pitch').value(); }

  // ── boot ────────────────────────────────────────────────────────────────
  // 🔴 NOTHING HERE HAPPENS ON A VISIT. No fetch, no AudioContext, no decode.
  // A visit, a slider drag and a model change all open nothing; the wasm is
  // asked for by a press on a header's turn on and never before it.
  async function boot() {
    if (ctx) return;
    const t0 = performance.now();

    // 48000 ASKED FOR BY NAME, because Plaits is compiled against
    // `kSampleRate = 48000` and its resource tables are built at that rate.
    // Rack answers the same problem with a sample rate converter on the
    // output; this page asks the browser instead and REPORTS WHAT IT GOT, so a
    // machine that hands back 44100 says so rather than playing flat in
    // silence about it.
    ctx = new (window.AudioContext || window.webkitAudioContext)({
      sampleRate: 48000, latencyHint: 'interactive',
    });
    await ctx.resume();
    /* ⚠️ THE CELL WENT AND THE FACT DID NOT. A rate that is not 48000 is the
       one thing that stops both firmwares being able to feed each other, so it
       is said out loud rather than dropped with its cell. */
    d.log(`the audio thread runs at ${Math.round(ctx.sampleRate)} Hz`,
      ctx.sampleRate === 48000 ? 'ok' : 'bad');

    await ctx.audioWorklet.addModule('/muta/muta-worklet.js');

    // THE MAIN THREAD FETCHES, THE AUDIO THREAD COMPILES. There is no `fetch`
    // inside an AudioWorkletGlobalScope, so the bytes have to cross the port.
    //
    // 🔴 BYTES, NOT A COMPILED `WebAssembly.Module`. MEASURED 2026-09-22 in
    // headless Chrome 141: posting a Module to an AudioWorklet's port throws
    // nothing here and arrives nowhere. The page read `wasm not yet` on the
    // first render and then timed out, which looks exactly like a broken
    // instrument and is a dropped message. The worklet's header has the whole
    // account.
    const [bytes, warpBytesBuf] = await Promise.all([grab(PLAI_URL), grab(WARP_URL)]);
    wasmBytes = bytes.byteLength;               // read BEFORE the transfer empties it
    warpBytes = warpBytesBuf.byteLength;

    node = new AudioWorkletNode(ctx, 'plai-voice', { outputChannelCount: [2] });
    node.port.onmessage = (e) => onWorklet(e.data);
    // A processor that throws is dropped by the audio thread for the rest of
    // the page's life, silently. Without this the symptom is an instrument
    // that simply does not sound, which is the least informative face a fault
    // can wear.
    node.onprocessorerror = () => d.log('the audio thread dropped the oscillator', 'bad');
    node.port.onmessageerror = () => d.log('a message from the audio thread could not be read', 'bad');

    // 🔴 THE CHAIN, AND IT IS ONE LINE OF WEBAUDIO RATHER THAN ANYTHING INSIDE
    // EITHER FIRMWARE. `channelCountMode: 'explicit'` with
    // `channelInterpretation: 'discrete'` is what keeps PLAI's two jacks as two
    // jacks: the default would treat a two channel input as a stereo pair and
    // mix it, which would hand WARP the same signal on both inputs and quietly
    // turn a cross-modulator into a squarer.
    warpNode = new AudioWorkletNode(ctx, 'warp-mod', {
      numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [2],
      channelCount: 2, channelCountMode: 'explicit', channelInterpretation: 'discrete',
    });
    warpNode.port.onmessage = (e) => onWarp(e.data);
    warpNode.onprocessorerror = () => d.log('the audio thread dropped the effect', 'bad');
    warpNode.port.onmessageerror = () => d.log('a message from the effect could not be read', 'bad');

    // ⚠️ THE OSCILLATOR NEVER REACHES THE DESTINATION. Everything audible on
    // this page has been through both firmwares, which is what makes the second
    // one gradable at all: a page that mixed the dry oscillator in would sound
    // fine with the effect doing nothing.
    node.connect(warpNode);
    warpNode.connect(ctx.destination);
    d.log(`audio context ${ctx.state} at ${Math.round(ctx.sampleRate)} Hz`);

    const waitReady = new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error('the worklet never answered')), 5000);
      onReady = (m) => { clearTimeout(timer); resolve(m); };
    });
    // 🔴 THE THING WORTH TIMING IS THE FIRST SAMPLE, NOT THE HANDSHAKE.
    // "Instantiated" is a fact about the wasm; "rendered" is a fact about the
    // instrument, and the gap between them is a render quantum plus whatever
    // the audio thread was doing. The worklet announces the first one from
    // inside `process()`.
    const waitFirst = new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error('no audio was ever rendered')), 5000);
      onFirst = () => { clearTimeout(timer); resolve(performance.now()); };
    });
    const waitWarp = new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error('the effect never answered')), 5000);
      onWarpReady = (m) => { clearTimeout(timer); resolve(m); };
    });
    // NOT TRANSFERRED. The port copies it either way, and this side keeps the
    // bytes for the cost measurement below, which needs a second instance of
    // exactly the same module rather than a second download of it.
    node.port.postMessage({ t: 'wasm', bytes, rate: ctx.sampleRate });
    warpNode.port.postMessage({ t: 'wasm', bytes: warpBytesBuf, rate: ctx.sampleRate });
    warpReady = await waitWarp;
    warpImports = warpReady.imports;
    /* ⚠️ EACH LIGHT COMES ON WHEN ITS OWN PROCESSOR HAS ANSWERED, not when the
       pair has. They are two compiles and two handshakes, so a page that lit
       both together would be reporting one fact about two instruments and would
       be wrong for whichever of them was slower. */
    warpInst.online?.set('online');
    ready = await waitReady;
    wasmImports = ready.imports;
    inst.online?.set('online');
    trim = ready.trim;
    // ⚠️ A FAILED BOOT STILL REPORTS. Letting this throw would take the whole
    // check block with it, and a page that stops before it grades itself is a
    // page whose one red line is a stack trace. The assert below says the same
    // thing with the numbers beside it.
    try {
      bootMs = (await waitFirst) - t0;
      d.log(`first quantum ${bootMs.toFixed(0)} ms after the fetch began`, 'ok');
    } catch (e) {
      d.log(String(e.message || e), 'bad');
    }

    d.log(`${(wasmBytes / 1024).toFixed(1)} KB of WebAssembly, ${wasmImports} imports, `
        + `first sample ${bootMs.toFixed(0)} ms after the fetch began`, 'hi');
    d.log(ready.build);
    // ⚠️ THE 210.1 MB IS A PUBLISHED ZIP, NOT A PAGE WEIGHT, AND
    // plans/plan-vcv-modules.md §9.3 marks it as unmeasured for exactly that
    // reason. It is quoted as what somebody downloads, which is what it is.
    d.log(`this repository's own yardsticks: scsynth.wasm is 1740.8 KB booting in 747 ms, `
        + `and the only shipped whole-Rack web build publishes a 210.1 MB zip`);
    // Everything the DSP says about itself, read out of the wasm rather than
    // typed here a second time.
    d.log(`${ready.engines} models, ${ready.blockSize} frames a block, `
        + `${Math.round(ready.dspRate)} Hz`);
    // WHAT EIGHT VOICES COST IN MEMORY, read off the types in the shim rather
    // than estimated. The allocator buffer cannot be shared: `voice.cc:56`
    // frees it before every engine so that sixteen engines can share one
    // voice's RAM, which means two voices sharing one would be two live
    // engines writing the same bytes.
    d.log(`${ready.maxVoices} voices at ${ready.voiceBytes} bytes each, with `
        + `${(ready.allocBytes / 1024).toFixed(0)} KB of engine workspace apiece`);
    if (!ready.rateOk) {
      d.log(`this browser gave ${Math.round(ready.hostRate)} Hz and Plaits is compiled for `
          + `${Math.round(ready.dspRate)} Hz, so the pitch is wrong by that ratio`, 'bad');
    }

    // ── what the second firmware says about itself ───────────────────────────
    d.log(`${(warpBytes / 1024).toFixed(1)} KB of WebAssembly for the effect, `
        + `${warpImports} imports, ${warpReady.bands} bands, blocks of `
        + `${warpReady.blockSize} against a ceiling of ${warpReady.maxBlock}`, 'hi');
    d.log(warpReady.build);
    // 🔴 THE DEFECT THIS PAGE REPORTS RATHER THAN HIDES, SAID IN FULL ONCE AND
    // KEPT IN A READOUT CELL AFTERWARDS. The band figures are the wasm's own,
    // computed from the rate it was handed, so this cannot drift from what the
    // filter bank is doing.
    d.log(`the effect's twenty vocoder bands were computed at `
        + `${Math.round(warpReady.tableRate)} Hz and this page runs at `
        + `${Math.round(warpReady.dspRate)} Hz, so they sit at `
        + `${warpReady.bandLo.toFixed(1)} to ${warpReady.bandHi.toFixed(0)} Hz instead of `
        + `${(warpReady.bandLo * 2).toFixed(1)} to ${(warpReady.bandHi * 2).toFixed(0)} Hz, `
        + `which is ${warpReady.bandShift.toFixed(2)} octaves low`, 'bad');
    d.log('the six waveshaping algorithms are unaffected by that, because they hold no '
        + 'filter. Half the algorithm rotary is exactly right and half of it is an '
        + 'octave down, and the bands cell says so whenever the vocoder is the path '
        + 'running');
    d.log('running the whole page at 96000 Hz would fix it and break the other half: '
        + 'the oscillator refuses any rate but 48000, so the two firmwares would stop '
        + 'agreeing about pitch. Oversampling the effect alone is the real answer and '
        + 'is not built');

    setVoices(knobs.get('voices').value());
    setCarrier(0);

    bench = makeBench(bytes);
    warpBench = makeWarpBench(warpBytesBuf);
    // TWO PRICES, NOT ONE, because the readout cell can only show the setting
    // in front of you and the interesting fact is what the eighth voice costs.
    oneVoiceMs = costOf(model, 1);
    warpCostMs = warpCost();
    measureCost(model, voiceCount);
    manyVoiceMs = costPerQuantumMs - warpCostMs;
    d.log(`one voice ${(oneVoiceMs * 1000).toFixed(0)} µs and ${voiceCount} voices `
        + `${(manyVoiceMs * 1000).toFixed(0)} µs, against the 2667 µs those 128 frames last`);
    d.log(`the effect on top of that is ${(warpCostMs * 1000).toFixed(0)} µs, which is `
        + `${(warpCostMs / oneVoiceMs).toFixed(1)} times one oscillator voice`);
    d.log('render and load are how long the whole chain takes to produce 128 frames at '
        + 'the voice count set above, and what share that is of the 2.67 ms those frames '
        + 'last. Measured on the main thread against a second copy of each wasm, '
        + 'because an AudioWorklet has no clock in it');
    d.log(`the mix is trimmed to ${trim.toFixed(3)} at ${voiceCount} voices, so eight of `
        + 'them never sum past the end of the graph');

    // ⚠️ A SILENCE CONTROL FIRST, AND IT IS THE HALF THAT MAKES THE NEXT
    // NUMBER MEAN ANYTHING. A page that only ever measures the loud case
    // passes "there was sound" with a broken gate wide open. 600 ms of a
    // running, untriggered voice is the reading that has to be near zero.
    // ⚠️ THE COUNTER, NOT THE VALUE. `last.peak` starts at 0, so reading it
    // before any meter has arrived records a very confident measurement of
    // nothing and the silence assert below would pass having measured no
    // audio at all.
    const before = meters;
    const wbefore = warpMeters;
    await sleep(600);
    quiet = meters > before ? last.peak : null;
    // 🔴 THE SAME CONTROL ONE MODULE ALONG, AND IT IS A DIFFERENT CLAIM. The
    // oscillator being quiet says nothing about the effect: a cross-modulator
    // handed silence can still ring, can still put out its own carrier, and
    // can still have a stuck buffer in it. Both ends of the chain are measured
    // with nothing played, and both have to be near zero.
    chainOff = warpMeters > wbefore ? warpLast.peak : null;
    d.log(quiet == null ? 'the audio thread reported nothing in 600 ms'
                        : `untriggered peak ${quiet.toFixed(6)} out of PLAI and `
                          + `${chainOff == null ? 'nothing' : chainOff.toFixed(6)} out of WARP`,
          quiet == null ? 'bad' : '');

    const mid = meters;
    const wmid = warpMeters;
    pluck();
    await sleep(600);
    loud = meters > mid ? last.peak : null;
    chainOn = warpMeters > wmid ? warpLast.peak : null;

    await measureChord();

    await d.run('check');
  }

  /** Fetch one artefact and say which URL failed rather than which fetch did. */
  async function grab(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`${url} answered ${res.status}`);
    return res.arrayBuffer();
  }

  /**
   * FOUR NOTES AT ONCE, HELD, AND THE TWO THINGS THAT CAN ONLY BE MEASURED
   * WHILE THEY ARE.
   *
   * 🔴 THE GATES ARE NEVER RELEASED, which is what makes the second measurement
   * possible at all. A plucked voice frees itself when it falls quiet, so the
   * count of sounding voices drifts down through the window and
   * `renders / blocks` stops dividing for a reason that is not a fault. The
   * shim only frees a voice whose trigger has fallen, so four gates left up
   * hold four voices for the whole window.
   * ⚠️ HELD, NOT LOUD. `voice.cc:90` triggers the lowpass gate on a RISING EDGE
   * alone, so these four decay like any pluck while staying held. The peak
   * below is therefore a chord's peak and not a sustained one, and comparing it
   * with the single note above is fair for that reason.
   *
   * ⚠️ EVERYTHING BEFORE IT IS STOPPED FIRST. The single pluck above rings for
   * about a second at the default decay, so without this the chord is five
   * voices and the arithmetic below is graded against the wrong number.
   */
  async function measureChord() {
    send({ t: 'allOff' });
    await sleep(150);
    const root = pitch();
    for (const i of CHORD) noteOn(root + i, 0);
    await sleep(320);

    const a = { ...last, n: meters };
    await sleep(420);
    const b = { ...last, n: meters };

    chord = { held: b.held, peak: b.peak, poly: b.poly };
    // 🔴 A DELTA OF ZERO SATISFIES `renders === held * blocks` AND MEASURES
    // NOTHING. `positron-verify` calls this the count that is only evidence on
    // the far side of a boundary: both halves of the equation have to have
    // moved, and two different meter reports have to have arrived, before the
    // equality says anything at all.
    blockRule = {
      dBlocks: b.blocks - a.blocks,
      dRenders: b.renders - a.renders,
      held: a.held,
      steady: a.held === b.held,
      reports: b.n - a.n,
    };
    d.log(`a chord of ${CHORD.length} on ${b.held} voices, peak ${b.peak.toFixed(3)}`);
    send({ t: 'allOff' });
    await sleep(80);
  }

  /**
   * WHAT N VOICES COST, AND WHERE THE NUMBER COMES FROM.
   *
   * 🔴 ON THE MAIN THREAD, BECAUSE AN AUDIOWORKLET HAS NO CLOCK. `performance`
   * is not exposed to an `AudioWorkletGlobalScope`, measured on this machine
   * before this function existed, so timing the real render inside the real
   * callback is not available. This is the SAME wasm and the SAME shim, a
   * second instance of it, rendering as fast as the machine will go.
   *
   * ⚠️ SO IT IS THE COST OF THE DSP, NOT THE COST OF THE AUDIO CALLBACK. It
   * excludes whatever the browser spends around `process()`, and it is a main
   * thread reading of work that really happens on another thread. Both of
   * those make it a floor rather than a load figure, and the page says so
   * rather than calling it latency.
   *
   * ⚠️ IT DRONES RATHER THAN RESTS. An untriggered voice still runs its engine,
   * but the lowpass gate is shut, and measuring the quiet case would price the
   * instrument at its cheapest moment. A FREE voice is worse than that: the
   * shim does not render one at all, so a bench that never played a note would
   * price eight voices at the cost of nothing.
   *
   * ⚠️ AND IT IS RE-MEASURED PER MODEL AND PER VOICE COUNT, WHICH IS WHY THE
   * CELL MOVES. The sixteen models are not one price: measured here, the
   * cheapest and the dearest are a factor of seven apart.
   */
  function makeBench(bytes) {
    const ex = new WebAssembly.Instance(new WebAssembly.Module(bytes), {}).exports;
    if (typeof ex._initialize === 'function') ex._initialize();
    ex.plai_init(48000);
    return { ex, op: ex.plai_out_ptr(), ap: ex.plai_aux_ptr() };
  }

  /**
   * THE EFFECT'S OWN BENCH, AND IT NEEDS SOMETHING TO CHEW ON.
   *
   * ⚠️ AN EFFECT PRICED ON SILENCE IS PRICED AT ITS CHEAPEST MOMENT, which is
   * the same mistake the oscillator's bench already records about a resting
   * voice. Warps has a noise gate in `SaturatingAmplifier::Process` that pulls
   * a quiet input down, so a bench fed zeros measures the gate. This one feeds
   * two sine waves at full level.
   * ⚠️ AND IT IS PRICED ON THE VOCODER, which is the dearer of the two paths by
   * a filter bank and twenty envelope followers. A number that only ever
   * measured the waveshapers would understate the worst case the page can put
   * in front of somebody.
   */
  function makeWarpBench(bytes) {
    const ex = new WebAssembly.Instance(new WebAssembly.Module(bytes), {}).exports;
    if (typeof ex._initialize === 'function') ex._initialize();
    ex.warp_init(48000);
    const il = ex.warp_in_l_ptr(), ir = ex.warp_in_r_ptr();
    const inL = new Float32Array(ex.memory.buffer, il, 128);
    const inR = new Float32Array(ex.memory.buffer, ir, 128);
    for (let i = 0; i < 128; i++) {
      inL[i] = Math.sin((2 * Math.PI * 220 * i) / 48000) * 0.6;
      inR[i] = Math.sin((2 * Math.PI * 331 * i) / 48000) * 0.6;
    }
    return { ex, il, ir, op: ex.warp_out_ptr(), ap: ex.warp_aux_ptr() };
  }

  function warpCost() {
    if (!warpBench) return null;
    const { ex, il, ir, op, ap } = warpBench;
    ex.warp_set_param(W.algorithm, VOCODER_AT);
    ex.warp_set_param(W.carrier, 0);
    for (let i = 0; i < 200; i++) ex.warp_render(il, ir, op, ap, 128);
    const N = 1000;
    const t0 = performance.now();
    for (let i = 0; i < N; i++) ex.warp_render(il, ir, op, ap, 128);
    return (performance.now() - t0) / N;
  }

  /**
   * DOES THE EFFECT REALLY PROCESS TWO SIGNALS, OR ONLY PASS ONE THROUGH?
   *
   * 🔴 A CROSS-MODULATOR HANDED THE SAME SIGNAL TWICE PASSES EVERY "THERE WAS
   * SOUND" CHECK THERE IS, and the channel wiring is exactly what a
   * `channelInterpretation` default would break. So this runs the same wasm
   * twice: once with two different inputs and once with the second input
   * silenced, and requires the two to differ. A module ignoring its modulator
   * returns the same samples both times.
   * ⚠️ ON THE BENCH RATHER THAN THE INSTRUMENT, because it needs the ring
   * modulator rather than whatever the knob is set to, and it must not be
   * audible.
   */
  function twoInputs() {
    if (!warpBench) return null;
    const { ex, il, ir, op, ap } = warpBench;
    const inR = new Float32Array(ex.memory.buffer, ir, 128);
    const kept = Float32Array.from(inR);
    const out = new Float32Array(ex.memory.buffer, op, 128);

    // ANALOG RING MODULATION, index 2 of six, which is a knob at 2.5/8.
    ex.warp_set_param(W.algorithm, 2.5 / 8);
    ex.warp_set_param(W.carrier, 0);
    ex.warp_set_param(W.drive1, 0.8);
    ex.warp_set_param(W.drive2, 0.8);
    const run = () => {
      for (let i = 0; i < 40; i++) ex.warp_render(il, ir, op, ap, 128);
      let rms = 0;
      for (let i = 0; i < 128; i++) rms += out[i] * out[i];
      return Math.sqrt(rms / 128);
    };
    const both = run();
    inR.fill(0);
    const one = run();
    inR.set(kept);
    return { both, one, algorithm: ex.warp_algorithm() };
  }

  function costOf(engine, n) {
    const { ex, op, ap } = bench;
    ex.plai_all_off();
    ex.plai_set_polyphony(n);
    ex.plai_set_param(P.engine, engine);
    // Spread, so no two voices are rendering the same note and the engines
    // cannot share a cached anything.
    for (let i = 0; i < n; i++) ex.plai_note_on(40 + i * 5, 0);
    ex.plai_set_drone(1);                          // gate out of the way
    // WARM UP FIRST, and it is not politeness. The first few hundred calls
    // are tiering up through the engine's compilers, and timing those measures
    // the compiler. It also lets the model actually change: the DSP runs the
    // request through a hysteresis quantizer before it swaps.
    for (let i = 0; i < 200; i++) ex.plai_render(op, ap, 128);
    const N = 1000;                                // 2.7 s of audio
    const t0 = performance.now();
    for (let i = 0; i < N; i++) ex.plai_render(op, ap, 128);
    return (performance.now() - t0) / N;
  }

  /**
   * DOES IT REALLY TAKE THE QUIETEST, OR ONLY THE OLDEST?
   *
   * 🔴 THE CHECK ON THE AUDIO THREAD CANNOT ANSWER THAT, AND SAYING SO IS THE
   * POINT OF THIS ONE. Three notes played 200 ms apart leave the OLDEST voice
   * and the QUIETEST voice as the same voice, because a plucked note only ever
   * gets quieter. An assert that passes there would pass just as happily
   * against an oldest-first rule, which is `positron-verify`'s A/B where both
   * arms share the bug: the answer comes back identical and reads as fine.
   *
   * ✅ SO THIS BUILDS THE CASE WHERE THE TWO RULES DISAGREE: an older voice
   * that is LOUDER than a newer one. Oldest-first would take the note still
   * sounding out from under a listener; quietest takes the one that has faded.
   *
   * 🔴 AND THE FIRST ATTEMPT AT IT WAS WRONG, WHICH IS WHY IT IS WRITTEN DOWN.
   * It held the older voice's gate up forever on the assumption that a held
   * gate sustains. IT DOES NOT. `voice.cc:90-97` fires `lpg_envelope_.Trigger()`
   * on the RISING EDGE alone, so Plaits' trigger is a one shot and a gate that
   * stays high only stops the voice re-arming. Both voices decayed together,
   * the newer one was louder by 0.0052, and the check went red against a shim
   * that was doing exactly the right thing. The drone is the real bypass: with
   * nothing patched into the trigger the lowpass gate is out of the way and the
   * engine simply runs.
   * ⚠️ A HELD GATE STILL KEEPS A VOICE **ACTIVE**, which is a different claim
   * and is the one the chord above rests on.
   *
   * ⚠️ ON THE BENCH RATHER THAN THE INSTRUMENT, because it needs half a second
   * of rendering with no gaps in it and it must not be audible. Same wasm,
   * same shim, a second instance of it.
   */
  function stealRule() {
    if (!bench) return null;
    const { ex, op, ap } = bench;
    ex.plai_all_off();
    ex.plai_set_polyphony(2);
    ex.plai_set_param(P.engine, 0);
    const loud = ex.plai_note_on(60, 24);
    // ONE VOICE IS SOUNDING, SO THIS DRONES THAT ONE AND NOTHING ELSE. The next
    // note-on patches its own voice's trigger back in and leaves this one
    // alone, which is what makes an older-and-louder voice possible at all.
    ex.plai_set_drone(1);
    for (let i = 0; i < 8; i++) ex.plai_render(op, ap, 128);
    const faded = ex.plai_note_on(67, 24);            // 6 ms of gate, then decay
    for (let i = 0; i < 150; i++) ex.plai_render(op, ap, 128);   // 0.4 s
    const levels = [ex.plai_voice_level(0), ex.plai_voice_level(1)];
    const took = ex.plai_note_on(72, 24);
    const stolen = ex.plai_last_stolen();
    ex.plai_all_off();
    return { held: loud, faded, levels, took, stolen };
  }

  /**
   * ⚠️ THE CELL IS THE WHOLE CHAIN, NOT THE OSCILLATOR. Two firmwares run in
   * one quantum and only their sum has to fit it, so a `render` figure for one
   * of them would be a number that cannot go over budget however bad things
   * get. The effect's own share is measured once and printed in the log, and
   * `manyVoiceMs` keeps the oscillator's half so the per-voice assert still
   * grades what it always graded.
   */
  function measureCost(engine, n) {
    if (!bench) return;
    try {
      const per = costOf(engine, n) + (warpCostMs || 0);
      const budget = (128 / 48000) * 1000;          // 2.667 ms of wall clock
      costPerQuantumMs = per;
      d.set('render', (per * 1000).toFixed(0));
      d.set('load', ((per / budget) * 100).toFixed(2));
    } catch (e) {
      d.log(`the cost could not be measured: ${e.message || e}`, 'bad');
    }
  }

  function onWorklet(m) {
    if (!m) return;
    if (m.t === 'ready') { onReady(m); return; }
    if (m.t === 'fail') { d.log(m.why, 'bad'); return; }
    if (m.t === 'entered') {
      entered = m;
      d.log(`the audio thread ran the processor, ${m.chans} channels of ${m.frames} frames, `
          + `wasm ${m.ready ? 'in place' : 'not yet'}`);
      return;
    }
    if (m.t === 'first') { onFirst(); return; }
    if (m.t === 'voices') {
      trim = m.trim;
      if (m.got !== m.asked) {
        d.log(`asked for ${m.asked} voices and got ${m.got}, which is all there are`, 'bad');
      }
      return;
    }
    if (m.t === 'note') {
      lastNote = m;
      d.set('sounding', m.held);
      // 🔴 THE ONE THING A LISTENER CANNOT HEAR. A stolen voice stops making
      // the note it was making, which sounds exactly like a note that was
      // never played, so it is said in words the moment it happens.
      if (m.stolen >= 0) {
        d.log(`voice ${m.voice} took note ${m.note} from note ${Math.round(m.stolenNote)}, `
            + `which was the quietest at ${m.stolenLevel.toFixed(4)}`, 'hi');
      }
      return;
    }
    if (m.t === 'meter') {
      last = m;
      meters++;
      d.set('sounding', m.held);
    }
  }

  /**
   * THE EFFECT'S SIDE OF THE PORT.
   *
   * ⚠️ THE `peak` CELL IS THIS ONE AND NOT THE OSCILLATOR'S, because what comes
   * out of the page is what comes out of the chain. The oscillator's peak is
   * still measured, and still graded, and is in the log rather than the
   * readout: two peaks in one row would be one number nobody can attribute.
   */
  function onWarp(m) {
    if (!m) return;
    if (m.t === 'ready') { onWarpReady(m); return; }
    if (m.t === 'fail') { d.log(`the effect: ${m.why}`, 'bad'); return; }
    if (m.t === 'entered') {
      warpEntered = m;
      d.log(`the audio thread ran the effect, ${m.inChans} channels in and ${m.chans} out `
          + `of ${m.frames} frames, wasm ${m.ready ? 'in place' : 'not yet'}`);
      return;
    }
    if (m.t === 'meter') {
      warpLast = m;
      warpMeters++;
      vocoding = m.vocoding;
      // 🔴 THE CARRY IS THE ONE READING THAT PROVES THE BLOCK ARITHMETIC RAN.
      // 128 frames against blocks of 60 leaves 8, then 16, then 24, so a page
      // that saw ONE value here would be looking at a chopper that rounds.
      carrySeen.add(m.carry);
      d.set('peak', m.peak ? m.peak.toFixed(3) : '');
      // EMPTY WHILE THE WAVESHAPERS ARE RUNNING, because the shift is a fact
      // about the filter bank and the filter bank is not in that path. A
      // number printed there would be a defect claimed where there is none.
    }
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function pluck() {
    if (!node) { d.log('turn an instrument on first', 'bad'); return; }
    // Six milliseconds of gate. `voice.cc` reads the trigger through a delay
    // line five blocks long and only re-arms once it falls under 0.1, so
    // anything shorter can be written and read back as nothing.
    noteOn(pitch(), 6);
  }

  /**
   * 🔴 ONE BOOT, TWO BUTTONS, AND NEITHER OF THEM STARTS HALF A GRAPH. The two
   * firmwares are one audio chain: the oscillator feeds the effect, so there is
   * no state where one is running and the other is not. Both header buttons
   * therefore start the SAME boot, and both light when it lands.
   * ⚠️ **WHAT DIFFERS IS WHAT A SECOND PRESS DOES.** Turning either off
   * suspends the context, which stops both, and the two lights say so together.
   * A page that let one be turned off alone would be offering a state its own
   * audio graph cannot be in.
   */
  let booting = null;
  async function turnOn() {
    if (booting) return booting;
    booting = boot().catch((e) => { booting = null; d.fail(e); });
    return booting;
  }
  async function turnOff() {
    if (!ctx) return;
    await ctx.suspend();
    inst.online?.set('offline');
    warpInst.online?.set('offline');
    d.log('both instruments turned off, and the audio context is suspended');
  }
  /* ⚠️ THE STATE IS READ OFF THE CONTEXT, NEVER OFF THE BUTTON. A toggle that
     remembered its own position would disagree with the audio the first time
     anything else suspended or resumed it. */
  const running = () => !!ctx && ctx.state === 'running';
  async function togglePlai() {
    if (!running()) { await turnOn(); if (ctx) await ctx.resume(); lightBoth(); return; }
    await turnOff();
  }
  const toggleWarp = togglePlai;
  function lightBoth() {
    const on = running() ? 'online' : 'offline';
    inst.online?.set(on);
    warpInst.online?.set(on);
  }
  d.on('pluck', pluck);
  d.on('chord', () => {
    if (!node) { d.log('turn an instrument on first', 'bad'); return; }
    const root = pitch();
    // A HELD CHORD RATHER THAN A PLUCKED ONE, because a chord is the thing
    // this page gained and a 6 ms gate on four voices is four plucks that
    // happen to land together.
    for (const i of CHORD) noteOn(root + i, 900);
  });
  d.on('model', () => { setModel(model + 1); pluck(); });
  d.on('drone', () => {
    if (!node) { d.log('turn an instrument on first', 'bad'); return; }
    droning = !droning;
    // `trigger_patched` is the whole difference between a note and a drone in
    // Plaits: with nothing patched into the trigger the lowpass gate is
    // bypassed and the engine simply runs. It acts on whatever is already
    // sounding, so a chord pressed first and droned second sustains as a
    // chord.
    send({ t: 'drone', on: droning });
    // THE LABEL SAYS WHAT THE NEXT PRESS DOES. There is no toggled-button
    // style in `shell.css`, and inventing one here would be the fourth copy of
    // a control that already exists somewhere.
    const b = d.button('drone');
    if (b) b.textContent = droning ? 'Notes' : 'Drone';
    d.log(droning ? 'droning, the lowpass gate is out of the way'
                  : 'back to notes, the lowpass gate shapes each pluck');
  });

  /**
   * THE ONE PRESS THAT REACHES THE HALF OF THE ALGORITHM ROTARY THAT IS AN
   * OCTAVE LOW.
   *
   * ⚠️ IT MOVES THE ROTARY RATHER THAN SENDING PAST IT. A control showing one
   * value while the DSP holds another is the smallest version of a control that
   * lies, and this page already refuses that about the pitch knob.
   * ⚠️ AND IT LANDS AT 0.85 RATHER THAN AT 1. `modulator.cc:312` reads a
   * release time above 0.995 as FREEZE, which above about 0.982 on this rotary
   * holds the last spectrum forever, so the top of the travel is a hold and not
   * a vocoder. The instrument is faithful and the preset is chosen.
   */
  // ⚠️ THE BUTTON'S OWN STATE, NOT THE METER'S. `vocoding` arrives with a meter
  // report every 250 ms, so two presses inside one report would both read the
  // same value and the label would stop matching the knob. What the button
  // remembers is what the button last did.
  let wantVocoder = false;
  d.on('vocoder', () => {
    if (!warpNode) { d.log('turn an instrument on first', 'bad'); return; }
    const toVocoder = !wantVocoder;
    wantVocoder = toVocoder;
    setAlgorithm(toVocoder ? VOCODER_AT : SHAPER_AT);
    const b = d.button('vocoder');
    if (b) b.textContent = toVocoder ? 'Waveshaper' : 'Vocoder';
    d.log(toVocoder
      ? 'the vocoder path, twenty bands an octave below where the hardware puts them'
      : 'back to the waveshapers, which hold no filter and are exactly right at this rate');
    // SOMETHING TO HEAR IT ON. A vocoder with nothing going through it is
    // silence, and silence after a press reads as a broken button.
    const root = pitch();
    for (const i of CHORD) noteOn(root + i, 900);
  });

  // ── the checks ──────────────────────────────────────────────────────────
  // Everything gradable from numbers already in hand runs for everybody, which
  // is the shell's rule. The two checks that PRESS something and change what
  // you hear are behind the gate.
  d.on('check', async () => {
    // ⚠️ BOTH ARTEFACTS IN ONE CLAIM, because "the wasm" stopped being a
    // singular noun on this page and an assert naming one of two would leave
    // the other ungraded while reading as coverage.
    d.assert('both wasm modules compiled and need nothing from the host',
      wasmImports === 0 && warpImports === 0,
      `the oscillator ${wasmImports < 0 ? 'never compiled' : `${wasmImports} imports`}, `
      + `the effect ${warpImports < 0 ? 'never compiled' : `${warpImports} imports`}`);

    // AGAINST THIS REPOSITORY'S OWN YARDSTICK, which is the comparison
    // plan-vcv-modules.md §9.3 asks for. 1.70 MB is scsynth.wasm, measured
    // here on 2026-09-12.
    d.assert('both of them together are smaller than this project’s other sound engine',
      wasmBytes > 0 && warpBytes > 0 && wasmBytes + warpBytes < 1740800,
      `${(wasmBytes / 1024).toFixed(1)} KB and ${(warpBytes / 1024).toFixed(1)} KB against `
      + `scsynth.wasm at 1740.8 KB`);

    // ⚠️ THE TWO SILENCES SEPARATED. A processor nobody calls and a processor
    // that returns early look identical from the speakers, and the second one
    // is a bug in this file while the first is a bug in the graph around it.
    d.assert('the audio thread ran both processors and gave each 128 frames',
      !!entered && entered.chans === 2 && entered.frames === 128
        && !!warpEntered && warpEntered.chans === 2 && warpEntered.frames === 128,
      entered && warpEntered
        ? `the oscillator got ${entered.chans} channels of ${entered.frames} frames and the `
          + `effect ${warpEntered.chans} of ${warpEntered.frames}`
        : `${entered ? '' : 'the oscillator’s '}${warpEntered ? '' : 'the effect’s '}`
          + 'process() was never called');

    d.assert('the first quantum of audio was rendered',
      bootMs != null && bootMs > 0,
      bootMs == null ? 'nothing was ever rendered' : `${bootMs.toFixed(0)} ms after the fetch began`);

    d.assert('the audio thread runs at the rate the DSP was compiled for',
      !!ready && ready.rateOk && Math.round(ready.hostRate) === 48000,
      ready ? `host ${Math.round(ready.hostRate)} Hz, DSP ${Math.round(ready.dspRate)} Hz`
            : 'never started');

    // ⚠️ BOTH HALVES, AND THE QUIET ONE IS THE HARDER CLAIM. A gate stuck open
    // passes "there was sound" every time.
    d.assert('a press makes a sound and an untriggered voice does not',
      quiet != null && loud != null && quiet < 0.01 && loud > 0.02,
      quiet == null || loud == null ? 'the audio thread reported nothing'
        : `untriggered ${quiet.toFixed(6)}, plucked ${loud.toFixed(3)}, at a trim of `
          + `${trim.toFixed(3)}`);

    // 🔴 AND THE SAME TWO HALVES AT THE FAR END OF THE CHAIN, WHICH IS A
    // DIFFERENT CLAIM AND NOT A RESTATEMENT. Everything audible on this page
    // leaves the effect, so the oscillator being right says nothing about what
    // a listener gets. An effect that dropped every sample would leave the
    // assert above perfectly green.
    d.assert('the whole chain is silent when nothing is played and sounds when it is',
      chainOff != null && chainOn != null && chainOff < 0.01 && chainOn > 0.01,
      chainOff == null || chainOn == null ? 'the effect reported nothing'
        : `${chainOff.toFixed(6)} with nothing played and ${chainOn.toFixed(3)} with a pluck, `
          + `out of an oscillator at ${loud == null ? '?' : loud.toFixed(3)}`);

    // ONE WORKLET CALL IS 128 FRAMES AND PLAITS' OWN BLOCK IS 12, so a quantum
    // is ten or eleven Render calls with the remainder carried. Rack's adapter
    // is the other shape: 128 calls of `process()` buffered into blocks of 12
    // through a ring buffer and a sample rate converter.
    const bpq = last.blocksPerQuantum;
    d.assert('one worklet call is 128 frames and ten or eleven blocks of twelve',
      last.frames === 128 && (bpq === 10 || bpq === 11),
      `${last.frames} frames, ${bpq} blocks of ${ready?.blockSize ?? '?'}`);

    // 🔴 THE INVARIANT THE WHOLE ARRANGEMENT RESTS ON, ASSERTED RATHER THAN
    // COMMENTED. `voice.cc` sets three envelope rates from the `kBlockSize`
    // CONSTANT rather than from the `size` argument it was handed (lines 135,
    // 207 and 213), so a Render call of any other length advances the audio at
    // one rate and the envelopes at another and the instrument becomes a
    // different instrument. Every voice therefore has to sit on the same block
    // boundary, and `plai_voice_renders()` is what makes that checkable: with
    // N voices sounding for a whole window it has to advance by exactly N
    // times `plai_blocks_rendered()`.
    const br = blockRule;
    d.assert('every voice rendered the same blocks of twelve as every other',
      !!br && br.steady && br.held > 1 && br.reports > 0 && br.dBlocks > 0
        && br.dRenders === br.held * br.dBlocks,
      br ? `${br.dRenders} voice renders against ${br.held} voices times ${br.dBlocks} blocks, `
         + `over ${br.reports} reports from the audio thread`
         : 'the chord was never measured');

    // ⚠️ FOUR VOICES, READ OFF THE DSP'S OWN COUNT RATHER THAN OFF WHAT THIS
    // PAGE SENT. A note that never crossed the port, or four notes that all
    // landed on one voice, both leave this at 1.
    d.assert('four notes at once are four voices and not one voice retriggered',
      !!chord && chord.held === CHORD.length && chord.peak > 0.02,
      chord ? `${chord.held} of ${chord.poly} voices sounding at peak `
            + `${chord.peak.toFixed(3)}, against one note at ${loud == null ? '?' : loud.toFixed(3)}`
            : 'the chord was never measured');

    // ⚠️ A NUMBER TYPED ON THIS PAGE, GRADED AGAINST THE WASM THAT OWNS IT.
    // The control has to exist before anything is fetched, so its top end is a
    // constant here and `kMaxVoices` is a constant in the shim. This is the
    // one line that can notice them disagreeing.
    /* 🔴 AND SINCE 2026-09-22 IT ALSO GRADES THE CONTROL, which the slider
       version did not: a knob that steps can land between two voices and read a
       number the DSP was never given. `step` is the component's, so what this
       reads is the rendered value after a move rather than the option. */
    const vKnob = knobs.get('voices');
    const stepped = (() => {
      if (!vKnob) return null;
      const was = vKnob.value();
      vKnob.set(4.4, { from: 'hand' });
      const got = vKnob.value();
      vKnob.set(was, { from: 'hand' });
      return got;
    })();
    d.assert('the voice control reaches exactly as far as the wasm does, and lands on whole voices',
      !!ready && ready.maxVoices === SLIDER_MAX_VOICES && stepped === 4,
      ready
        ? `the knob reaches ${SLIDER_MAX_VOICES}, the wasm reports ${ready.maxVoices}, `
          + `and 4.4 landed on ${stepped}`
        : 'never started');

    // THE STAMP IS THE WHOLE POINT OF THE EXERCISE AND IT IS NOT YET A PROOF.
    // It names both upstream commits and a digest over the exact source set,
    // so a native build of the same sources on the board can be compared to
    // this one by something other than two people agreeing it sounds right.
    // Nothing has been built on the board. This asserts the stamp is WELL
    // FORMED and says out loud that the comparison is unmade.
    const stamp = ready?.build ?? '';
    const sha = ready?.sourceSha ?? '';
    const wstamp = warpReady?.build ?? '';
    const wsha = warpReady?.sourceSha ?? '';
    const wellFormed = (s, h, name) =>
      new RegExp(`^${name} [0-9a-f]{7} stmlib [0-9a-f]{7} src [0-9a-f]{16} emcc \\S+$`).test(s)
      && /^[0-9a-f]{16}$/.test(h) && s.includes(h);
    d.assert('each wasm carries the commits and the source digest it was built from',
      wellFormed(stamp, sha, 'plaits') && wellFormed(wstamp, wsha, 'warps'),
      `${stamp || 'no stamp'} and ${wstamp || 'no stamp'}`);

    // 🔴 AND THE TWO DIGESTS ARE DIFFERENT, WHICH IS WHAT ONE BUILD SCRIPT
    // BUYING TWO MODULES HAS TO PROVE. `build.sh` is shared now, and a shared
    // script that handed both artefacts one identity would make the digest
    // mechanism worthless in the exact way it was written to prevent. The
    // digest is computed over the SHIM'S BYTES and the SOURCE LIST, both of
    // which differ, so this is a check that the parameterisation reached the
    // part that matters rather than only the part that compiles.
    d.assert('one build script gives the two modules two different digests',
      /^[0-9a-f]{16}$/.test(sha) && /^[0-9a-f]{16}$/.test(wsha) && sha !== wsha,
      `the oscillator ${sha || 'none'}, the effect ${wsha || 'none'}`);

    // ⚠️ AN UPPER BOUND AND A SHAPE, NOT JUST A LOWER ONE. "Greater than zero"
    // passes on a loop that was optimised away, and a voice count that costs
    // the same whatever it is set to would mean seven of the eight are not
    // being rendered at all. The ratio is the half that says the voices are
    // real.
    const ratio = oneVoiceMs ? manyVoiceMs / oneVoiceMs : 0;
    d.assert('every voice costs, and all of them together still fit a render quantum',
      oneVoiceMs != null && manyVoiceMs != null && oneVoiceMs > 0.001
        && ratio > voiceCount / 2 && manyVoiceMs < 2.667,
      oneVoiceMs == null ? 'never measured'
        : `one voice ${(oneVoiceMs * 1000).toFixed(0)} µs, ${voiceCount} voices `
          + `${(manyVoiceMs * 1000).toFixed(0)} µs, a factor of ${ratio.toFixed(1)}, `
          + 'of the 2667 µs those 128 frames last');

    // 🔴 THE STEALING RULE IS **THE QUIETEST VOICE**, AND THIS IS THE ONLY
    // CHECK THAT CAN TELL IT FROM AN OLDEST-FIRST RULE. A Plaits note is a
    // pluck through a lowpass gate that rings for about a second, so taking the
    // oldest cuts whichever note a listener is still holding on to while a
    // voice that faded three notes ago sits unused. WHAT WAS REFUSED is
    // oldest-first, same-pitch-first and refusing the note outright: the first
    // for that reason, the second because this instrument has no reason to
    // expect a repeated pitch, and the third because a note that does nothing
    // is the shape of control this project calls a lie.
    const sr = stealRule();
    d.assert('a note takes the quietest voice and not merely the oldest one',
      !!sr && sr.stolen === sr.faded && sr.stolen !== sr.held
        && sr.levels[sr.held] > sr.levels[sr.faded] * 2,
      sr ? `voice ${sr.held} was older and still at ${sr.levels[sr.held].toFixed(4)}, voice `
         + `${sr.faded} was newer and down to ${sr.levels[sr.faded].toFixed(4)}, and voice `
         + `${sr.stolen} was taken`
         : 'the bench was never built');

    // ── the effect ─────────────────────────────────────────────────────────

    // 🔴 THE BLOCK LENGTH IS THE ONE THING THE PLAN GOT WRONG, SO IT IS THE
    // FIRST THING GRADED. `plans/plan-two-more-modules.md` §3.4 says 128 frames
    // are "two calls of 64 with no carry" on the evidence that every
    // `kMaxBlockSize` is an array dimension. Both floors in `filter_bank.cc`
    // and the silent `return` in `sample_rate_converter.h:220` need a multiple
    // of TWELVE, and 64 is not one. 60 is, and it is what the firmware itself
    // hands its codec.
    d.assert('the effect runs the block length the firmware runs, and it divides by twelve',
      !!warpReady && warpReady.blockSize === 60 && warpReady.blockSize % 12 === 0
        && warpReady.blockSize <= warpReady.maxBlock,
      warpReady ? `blocks of ${warpReady.blockSize} against a ceiling of ${warpReady.maxBlock}`
                : 'the effect never started');

    // 🔴 AND THE REMAINDER IS CARRIED RATHER THAN ROUNDED, WHICH ONLY A MOVING
    // READING CAN SHOW. 128 frames against blocks of 60 leaves 8 over, then 16,
    // then 24, so a chopper that rounded a quantum to two blocks would report
    // the same carry for ever. Requiring MORE THAN ONE distinct value is what
    // separates this from a constant.
    const carries = [...carrySeen];
    d.assert('the frames a quantum cannot fill are carried into the next block',
      carries.length > 1 && carries.every((c) => c >= 0 && c < 60)
        && warpLast.frames > 0 && warpLast.blocks > 0,
      carries.length
        ? `${carries.length} different carries seen (${carries.slice(0, 6).join(', ')}), over `
          + `${warpLast.blocks} blocks and ${warpLast.frames} frames`
        : 'the effect reported no carry at all');

    // 🔴 THE CLAIM THE PAGE IS FOR, AND IT IS A DEFECT REPORTED RATHER THAN
