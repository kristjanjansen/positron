    // HIDDEN. Warps' filter bank coefficients are fixed numbers computed at
    // 96 kHz by `filter_bank.py`, so at 48 kHz every band sits an octave low.
    // The numbers come out of the wasm rather than off this page, which is the
    // only way the check can disagree with the code.
    d.assert('the vocoder’s bands are an octave below the hardware’s, and the page says so',
      !!warpReady && warpReady.bands === 20
        && Math.abs(warpReady.bandShift + 1) < 0.001
        && Math.abs(warpReady.bandLo * 2 - 87.3) < 0.5
        && Math.abs(warpReady.bandHi * 2 - 7040) < 5,
      warpReady ? `${warpReady.bands} bands at ${warpReady.bandLo.toFixed(1)} to `
                + `${warpReady.bandHi.toFixed(0)} Hz, which is `
                + `${warpReady.bandShift.toFixed(2)} octaves under the `
                + `${Math.round(warpReady.tableRate)} Hz the tables were computed at`
                : 'the effect never started');

    /**
     * ⚠️ AND THE OCTAVE IS REPORTED ONLY ON THE HALF OF THE ROTARY IT IS TRUE
     * OF, WHICH IS THE NEGATIVE HALF OF THE SAME CLAIM. A page that said it all
     * the time would be claiming a defect in the six waveshapers, which hold no
     * filter and are exactly right at this rate.
     * 🔴 **THE CELL THIS READ WENT ON 2026-09-22** with three others, asked for
     * as *"readout: 4 sections only, ones make sense"*, and it was one of the
     * weakest: EMPTY except while the vocoder was running, so most of the time
     * it was a key over nothing. **The claim did not go with it.** It reads the
     * report the audio thread sends, which is where the fact was all along and
     * is one witness rather than two, and the page says it in the log.
     * ⚠️ AND THE NEGATIVE HALF IS THE REASON THIS SURVIVED THE CUT AT ALL: it
     * can fail in both directions, which a cell that was blank half the time
     * could only do by accident.
     */
    d.assert('the octave shift belongs to the vocoder alone, and is reported only when it runs',
      !!warpLast && !!warpReady
        && (warpLast.vocoding
          ? Math.abs(warpReady.bandShift + 1) < 0.001
          : true)
        && (warpLast.vocoding || ALGORITHMS[warpLast.algorithm] !== undefined),
      warpLast ? `the ${warpLast.vocoding ? 'vocoder' : ALGORITHMS[warpLast.algorithm] ?? '?'} `
               + `is running, and the shift it would carry is `
               + `${warpReady ? warpReady.bandShift.toFixed(2) : '?'} octaves`
               : 'the effect never reported');

    // 🔴 TWO SIGNALS IN, AND A CROSS-MODULATOR HANDED ONE SIGNAL TWICE PASSES
    // EVERY OTHER CHECK ON THIS PAGE. This is the one that can catch a
    // `channelInterpretation` default mixing the oscillator's two jacks into
    // one, which would look and sound like a working page.
    const ti = twoInputs();
    d.assert('the effect really combines two signals and not one of them twice',
      !!ti && ti.both > 0.001 && ti.one >= 0 && Math.abs(ti.both - ti.one) > ti.both * 0.2,
      ti ? `ring modulation at ${ti.both.toFixed(4)} with both inputs and `
         + `${ti.one.toFixed(4)} with the modulator silenced`
         : 'the bench was never built');

    // ⚠️ THE EFFECT'S SHARE OF THE QUANTUM, AND THE CHAIN'S TOTAL. An effect
    // that cost nothing would be an effect the compiler removed, and a chain
    // that does not fit 2.667 ms is not real time however good each half is.
    d.assert('the effect costs something and the whole chain still fits a render quantum',
      warpCostMs != null && warpCostMs > 0.001 && costPerQuantumMs != null
        && costPerQuantumMs < 2.667,
      warpCostMs == null ? 'never measured'
        : `the effect ${(warpCostMs * 1000).toFixed(0)} µs on top of the oscillator's `
          + `${(manyVoiceMs * 1000).toFixed(0)} µs, ${(costPerQuantumMs * 1000).toFixed(0)} µs `
          + 'of the 2667 µs those 128 frames last');

    // ⚠️ A LAYOUT CLAIM IS A MEASUREMENT, AND THREE ALIGNMENTS THAT LOOK LIKE
    // ONE ARE THREE ASSERTS. `positron-ui` records two of three lining up while
    // the third was 30 px out, and arithmetic in a comment being no evidence at
    // all.
    // 🔴 AND THEY GRADE THE DESKTOP PATH ONLY, WHICH IS A HOLE AND NOT A
    // FOOTNOTE. `demo/verify.mjs` runs at 756 px with no viewport override, so
    // nothing below 560 px is ever entered and NOTHING HERE HAS BEEN MEASURED
    // ON A PHONE. What is known is structural rather than measured: every knob
    // is `--ctl-w` wide, every gap is `--ctl-gap`, and `.pos-knob-row` carries
    // `overflow-x: auto` with `min-width: 0`, so a row too wide for the screen
    // scrolls inside itself instead of dragging the page. That is an argument
    // about the stylesheet and a browser is the only thing that can settle it.
    const box = (key) => knobs.get(key)?.el.getBoundingClientRect() ?? null;
    const near = (a, b) => a != null && b != null && Math.abs(a - b) < 1;

    // 🔴 THE THING THAT WAS ASKED FOR: the instrument's four rotaries in the
    // instrument's own two by two, FREQUENCY over TIMBRE and HARMONICS over
    // MORPH. Both columns AND the row order, because a block with its columns
    // right and its rows swapped is a different panel.
    const bFreq = box('pitch'), bHarm = box('harmonics');
    const bTimb = box('timbre'), bMorph = box('morph');
    d.assert('the instrument’s four rotaries sit two by two, in its own positions',
      near(bFreq?.x, bTimb?.x) && near(bHarm?.x, bMorph?.x) && bTimb?.y > bFreq?.y,
      bFreq && bTimb && bHarm && bMorph
        ? `frequency and timbre at ${bFreq.x.toFixed(1)} px, harmonics and morph at `
          + `${bHarm.x.toFixed(1)} px, second row ${(bTimb.y - bFreq.y).toFixed(0)} px lower`
        : 'one of the four is not on the page');

    // 🔴 AND THE SEPARATION IS A GAP THAT IS REALLY WIDER, NOT A CLASS THAT
    // EXISTS. A dead CSS rule reads as correct, and this project has measured
    // four of them. This compares the gap between the two groups against the
    // gap between two neighbours in the same row, so a rule that never applied
    // takes it red.
    const bTmod = box('timbreMod'), bDecay = box('decay');
    const wide = bTmod && bHarm ? bTmod.x - bHarm.right : NaN;
    const narrow = bHarm && bFreq ? bHarm.x - bFreq.right : NaN;
    d.assert('the added rotaries start in one column on both rows, after a wider gap',
      near(bTmod?.x, bDecay?.x) && wide > narrow + 8,
      Number.isFinite(wide)
        ? `both rows start theirs at ${bTmod.x.toFixed(1)} px, with ${wide.toFixed(0)} px `
          + `of gap against ${narrow.toFixed(0)} px between neighbours`
        : 'the two rows could not both be measured');

    // ⚠️ AND THE STACKED COMPONENTS STILL SHARE A LEFT EDGE. `/radio/` had
    // exactly this go wrong when a `createChoice` row became a `createPicker`
    // one and the rules keyed on the old class stopped matching, and it was
    // reported three times before anybody measured it.
    // ⚠️ THE VOICE ROW LEFT THIS CLAIM WHEN THE CASE ARRIVED, AND THAT IS THE
    // ARRANGEMENT RATHER THAN A HOLE. It sits OUTSIDE the case on purpose, so
    // it starts where the case's border does and the controls inside start one
    // `--panel-pad` further in. Two different edges, and the assert below
    // grades the outer one.
    /* 🔴 THIS CLAIMED THE MODEL PICKER STARTS ON THE ROTARIES' LINE UNTIL
       2026-09-22, AND THE PICKER MOVED INTO THE HEADER THAT DAY, where being
       centred on the case is the whole point of the cell it now sits in. The
       old claim is not re-baselined, it is REPLACED by the two claims that
       survive the move: the rotary rows still agree with each other, and the
       picker is centred on the CASE rather than on the space left over between
       a status light and a nameplate. */
    const rows = [
      ['row 1', document.querySelectorAll('.plai-knobs .pos-knob-row')[0]],
      ['row 2', document.querySelectorAll('.plai-knobs .pos-knob-row')[1]],
    ].map(([name, node2]) => [name, node2 ? node2.getBoundingClientRect().x : NaN]);
    const found = rows.every(([, x]) => Number.isFinite(x));
    const spread = found
      ? Math.max(...rows.map(([, x]) => x)) - Math.min(...rows.map(([, x]) => x))
      : NaN;
    d.assert('both rows of rotaries start on the same line',
      found && spread < 1,
      found ? `${rows.map(([n, x]) => `${n} ${x.toFixed(1)} px`).join(', ')}, at `
            + `${Math.round(innerWidth)} px wide`
            : 'one of the two is not on the page');

    /**
     * 🔴 THE PICKER IS CENTRED ON THE CASE, WHICH IS THE ASK AND IS THE ONE
     * THING A PLAIN ROW CANNOT DO: *"center patch selector (optically center to
     * the instrument)"*. A flex row with a status light on the left and a
     * nameplate on the right puts its middle child wherever the difference
     * between those two leaves it, which is a different place on every panel.
     * ⚠️ **BOTH CASES ARE MEASURED, BECAUSE THE TWO HAVE DIFFERENT NEIGHBOURS**:
     * `PLAI` and `WARP` are different lengths, so a header that balanced rather
     * than centred would be wrong by a different amount on each and could pass
     * on one of them by luck.
     */
    /* ⚠️ THE CELL BEING GRADED IS THE MIDDLE ONE, AND WHAT SITS IN IT CHANGED
       ON 2026-09-22: *"move patch selector the right and nameplate to center"*.
       The claim never was about the picker, it was about the middle cell being
       centred on the CASE rather than balanced between two unequal neighbours,
       so it follows the cell rather than its tenant. */
    const centres = [['PLAI', inst], ['WARP', warpInst]].map(([nm, ins]) => {
      const cell = ins.el.querySelector('.panel-head-plate');
      const kase = ins.el.querySelector('.panel-case') || ins.el;
      if (!cell) return [nm, NaN];
      const c = cell.getBoundingClientRect(), k = kase.getBoundingClientRect();
      return [nm, (c.left + c.width / 2) - (k.left + k.width / 2)];
    });
    d.assert('the nameplate is centred on its own case, not balanced between its neighbours',
      centres.every(([, off]) => Number.isFinite(off) && Math.abs(off) <= 1),
      centres.map(([nm, off]) => `${nm} ${Number.isFinite(off) ? `${off.toFixed(1)} px off centre` : 'no middle cell'}`).join(', '));

    // 🔴 THE CASE STARTS AND ENDS WHERE THE REST OF THE PAGE DOES, WHICH IS
    // `/circuit/`'s OWN CLAIM AND THE ONE IT FAILS. `shell.css` contract 8
    // records that page putting its scroller OUTSIDE its card, so at 390 px
    // the card runs 286.0 px past the right edge while its assert stays green
    // at the harness width. Here the scroller is inside the card, which is the
    // component's own arrangement, so this is a check that the page did not
    // undo it.
    // ⚠️ GRADED AGAINST THE READOUT, AND THE VOICE ROW WAS THE WRONG RULER.
    // MEASURED 2026-09-22, red on the first try: the case spans 34.0 to 722.0
    // px and the slider group above it spans 34.0 to 594.0, because a
    // `createSliderGroup` is as wide as its sliders and not as wide as the
    // page. The readout is the page's own full width furniture and is in a
    // different subtree from the case, so the two agreeing is a real reading
    // rather than a child measuring its own parent.
    const bPanel = document.querySelector('.plai-panel')?.getBoundingClientRect();
    const bRead = document.querySelector('.pos-readout')?.getBoundingClientRect();
    d.assert('the case starts and ends where the rest of the page does',
      !!bPanel && !!bRead && near(bPanel.x, bRead.x) && near(bPanel.right, bRead.right)
        && document.documentElement.scrollWidth <= document.documentElement.clientWidth,
      bPanel && bRead
        ? `the case spans ${bPanel.x.toFixed(1)} to ${bPanel.right.toFixed(1)} px `
          + `against the readout's ${bRead.x.toFixed(1)} to ${bRead.right.toFixed(1)} px, `
          + `and the page is ${document.documentElement.scrollWidth} px wide in a `
          + `${document.documentElement.clientWidth} px window`
        : 'the case or the readout is not on the page');

    // 🔴 THE SPACE THAT WAS ASKED FOR, MEASURED RATHER THAN DESCRIBED. Asked
    // 2026-09-22 as *"add more space around plai rotaties"*, and the answer is
    // the case's own inset rather than a margin this page writes: one
    // `--panel-pad` on every side, and the page never types the number.
    // 🔴 AND THE FIRST VERSION OF THIS ASSERT CLAIMED ALL THREE INSETS WERE
    // EQUAL AND WENT RED SAYING `32.0 px above, 21.0 px left, 21.0 px below`.
    // It was right and the claim was wrong: the NAMEPLATE lives in the top
    // inset, so the air above the rotaries is the pad plus the plate. An
    // arrangement that reads as symmetrical is not the same as three equal
    // numbers, and only a rect knows which.
    // ⚠️ A BORDER IS A PIXEL AND IT COUNTS. These are measured from the panel's
    // BORDER box, so 20 px of padding reads as 21.
    /* 🔴 AND THE PLATE LEFT THE TOP INSET ON 2026-09-22 WHEN THE CASE GAINED A
       HEADER, so the third term is the HEADER's height now rather than the
       plate's. The claim is unchanged and is the one worth grading: the
       rotaries are inset by the same amount left and below, and everything
       above them is that inset plus the row the case wears. Reading the header
       rather than typing its height is what keeps this true the day it gains a
       second line on a phone. */
    /* 🔴 AND THE HEADER GAINED A SEAM AND AIR ON BOTH SIDES OF IT ON
       2026-09-22: *"make top secion a glued section with line under it"*. So
       the distance from the case's top to the rotaries is no longer the inset
       plus a header, it is the header's whole band. The claim that survives and
       is worth grading is the one that was always the point: **the rotaries are
       inset by the same amount on the left, below, and under the line above
       them**, which is what makes the block read as placed rather than as
       floating. Reading the header's own bottom edge is what keeps this true
       the day it wraps to three rows on a phone. */
    const bFlow = document.querySelector('.panel-flow')?.getBoundingClientRect();
    const bHead = inst.head?.getBoundingClientRect();
    const air = bPanel && bFlow && bHead
      ? { under: bFlow.top - bHead.bottom, left: bFlow.left - bPanel.left,
          bottom: bPanel.bottom - bFlow.bottom, head: bHead.height }
      : null;
    d.assert('the case insets the rotaries equally, left, below and under the header’s line',
      !!air && air.left > 16 && Math.abs(air.left - air.bottom) < 1
        && Math.abs(air.left - air.under) < 1.5,
      air ? `${air.left.toFixed(1)} px left, ${air.bottom.toFixed(1)} px below and `
          + `${air.under.toFixed(1)} px under a ${air.head.toFixed(1)} px header`
          : 'the case, its flow or its header is not on the page');

    // 🔴 THE MARKS ARE ON EXACTLY THE THREE ATTENUVERTERS AND NOWHERE ELSE,
    // WHICH IS BOTH HALVES OF ONE CLAIM. `ends` costs no height, so a knob that
    // wrongly grew a pair would look right and a knob that wrongly lost one
    // would look right too; only the count says so. The negative half is the
    // half that catches a later `ends: true` sprayed across the bank.
    const marked = [...knobs.entries()]
      .map(([key, k]) => [key, [...k.el.querySelectorAll('.pos-knob-end')].map((e) => e.textContent)])
      .filter(([, m]) => m.length);
    const wantMarked = ['timbreMod', 'fmMod', 'morphMod'];
    d.assert('only the three attenuverters print the marks at the ends of their travel',
      marked.length === wantMarked.length
        && wantMarked.every((key) => marked.some(([k2]) => k2 === key))
        && marked.every(([, m]) => m.join('') === '-+'),
      marked.length
        ? `${marked.map(([k2, m]) => `${k2} ${m.join(' to ')}`).join(', ')}, and `
          + `${knobs.size - marked.length} of ${knobs.size} carry none`
        : 'no knob on the page prints its ends');

    // ⚠️ THE PLATE IS READ AS RENDERED, NOT AS TYPED. `createNameplate` leans on
    // `text-transform`, so a check on `textContent` would grade the source and
    // stay green whichever case the page typed. `shown()` reads the computed
    // transform, which is why it exists.
    const plate = inst.shown();
    /* 🔴 ONE LINE SINCE 2026-09-22, ASKED FOR AS *"rm positron from plai and
       tom nameplates"*, and this read two. The placement moves with the count
       and is the half a caller can get wrong: `ends` is `space-between` and
       parks a lone child on the LEFT, so a single line has to be `end`.
       `plateSpec` decides it, and this grades the decision rather than the
       page's typing. */
    d.assert('the case is named by its model alone, pushed to the far end',
      plate.length === 1 && plate[0] === 'PLAI'
      && inst.plate.place === 'end'
      && getComputedStyle(inst.plate.el).justifyContent === 'flex-end',
      `the plate reads ${plate.join(' then ')} at ${inst.plate.place}`);

    // ⚠️ BEHIND THE GATE: these press nothing a visitor pressed, change the
    // sound and move the controls in front of them. What they grade is the
    // whole chain, because every number in them is the DSP's own answer rather
    // than what this page last sent.
    await ifSelfcheck(async () => {
      const want = 13;                    // bass drum, a model nothing defaults to
      setModel(want);
      pluck();
      await sleep(400);
      d.assert('a model picked here is the model the DSP reports sounding',
        last.engine === want, `asked ${want}, sounding ${last.engine}`);
      setModel(0);

      // 🔴 THE STEALING RULE, GRADED AGAINST THE NUMBERS THE RULE SAW. The
      // worklet reads every voice's level in the line before it asks for the
      // note, so this compares the shim's choice against the levels at the
      // moment of the choice rather than against a meter up to 250 ms stale.
      // ⚠️ AND IT IS CHECKED AT TWO VOICES rather than at eight, because a
      // third note is the smallest thing that has to steal. Two hundred
      // milliseconds apart puts both of them far past the eight millisecond
      // window in which a voice's level is not yet a measurement.
      send({ t: 'allOff' });
      send({ t: 'voices', n: 2 });
      await sleep(150);
      noteOn(60, 40);
      await sleep(200);
      noteOn(67, 40);
      await sleep(200);
      const steals0 = lastNote ? lastNote.steals : 0;
      noteOn(72, 40);
      await sleep(200);

      const n = lastNote;
      const lv = n?.before ?? [];
      const quietest = lv.length ? lv.indexOf(Math.min(...lv)) : -1;
      // ⚠️ AND IT REFUSES TO GRADE ON TWO NUMBERS THAT ARE THE SAME. With a
      // `before` array of zeros, or of two equal readings, `indexOf(min)`
      // answers 0 and so does the shim, and the assert would pass having
      // compared nothing. The levels have to be far enough apart that the
      // choice between them was a real one.
      const spread2 = lv.length > 1 ? Math.max(...lv) / Math.max(1e-9, Math.min(...lv)) : 0;
      d.assert('a note with no free voice takes the quietest one and says which',
        !!n && n.stolen >= 0 && n.steals === steals0 + 1 && n.stolen === quietest
          && n.voice === n.stolen && spread2 > 1.2,
        n ? `voice ${n.stolen} was taken at level ${n.stolenLevel.toFixed(4)}, and the `
          + `levels when it was decided were ${lv.map((x) => x.toFixed(4)).join(', ')}, `
          + `a factor of ${spread2.toFixed(2)} apart`
          : 'no note was ever reported');

      send({ t: 'allOff' });
      send({ t: 'voices', n: voiceCount });
    }, { log: d.log, say: 'the model switch and the voice stealing are checked only under a harness, because both change the sound' });
  });

  d.log('turn an instrument on at the top of its case, then press Pluck or Chord. The '
      + 'voice count is this page’s own and the instrument has no such control');
  d.log('the two rotaries on the left of each row are Plaits’ front panel, in its own '
      + 'positions. After the gap come its three attenuverters, then decay and colour, '
      + 'which the panel reaches by holding a button rather than with knobs of their own');
  d.log('nothing is fetched until an instrument is turned on');

  /**
   * 🔴 THE HARNESS CANNOT REACH A HEADER BUTTON, SO THE PAGE PRESSES IT.
   * `demo/verify.mjs` clicks every button in `.pos-controls` and nothing else,
   * and `Start audio` left that row on 2026-09-22. Without this line the audio
   * would never start under a harness and **every assert behind the boot would
   * stop running rather than fail**, which is the shape `positron-verify`
   * records on `/mirror/` and `/blocks/` in one day.
   * ⚠️ **IT PRESSES THE REAL BUTTON RATHER THAN CALLING `boot()`**, so the path
   * under test is the path a person takes. A check that reached past the
   * control would pass on a page whose button was wired to nothing, which is
   * exactly the defect this arrangement could introduce.
   * ⚠️ AND IT IS ONE PRESS ON ONE HEADER. Both start the same graph, so
   * pressing both would be a press and an immediate turn off.
   */
  ifSelfcheck(() => { inst.online?.el?.click(); }, {
    log: d.log,
    say: 'the audio is started by pressing PLAI’s own turn on, because a harness '
      + 'only presses the row of controls under the page',
  });
  d.ready();
</script>
</html>
