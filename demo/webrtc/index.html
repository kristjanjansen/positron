<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* No margin: the gap between the picture and everything else is
     `.pos-stack` in shell.css, one rhythm for every page. */
  video { width: 100%; display: block; background: #000; border-radius: 4px; }
  .hold { font: 500 10.5px/1.5 var(--mono); letter-spacing: .07em; text-transform: uppercase;
          border: 1px solid var(--line2); border-radius: 999px; padding: 2px 9px; color: var(--dim2); }
  .hold[data-on="1"] { color: var(--ok); border-color: color-mix(in oklab, var(--ok) 45%, var(--line2)); }
</style>

<script type="module">
  import { mount, guard, el, armVideo, playOrPrompt, matchAspect } from '/shell/shell.mjs';
  import { whep, holdPublisher, waitForWhip } from '/shell/live.mjs';

  const d = mount({
    name: 'webrtc',
    what: 'The same live picture the HLS pages play, delivered over WHEP instead: one '
      + 'POST of an offer, one answer back, and the frames arrive over WebRTC. Press '
      + 'Start the stream and play. This page starts the publisher itself and then '
      + 'waits for it, so the first seconds are the stream coming up. round trip is '
      + 'the network round trip to Cloudflare and NOT how far behind the picture is; '
      + 'nothing on this page measures that.',
    // 🔴 `rtt` WAS A KEY THAT READ AS A LATENCY CLAIM. Quoting this number
    // beside a glass-to-glass one flattered WHEP by about three times once
    // already (CLAUDE.md, candidate-pair RTT). The words now say what it is,
    // and `state` says `playing`/`paused` rather than `playing rs4` — the
    // readyState behind it is in the assert's detail, where a number that needs
    // a spec to read belongs.
    readout: { 'round trip': 'ms', fps: '', picture: '', state: '' },
    controls: [
      { id: 'go', label: 'Start the stream and play', primary: true },
    ],
  });
  guard(d);

  const badge = el('span', 'hold', 'publisher: idle');
  badge.dataset.on = '0';
  d.head.append(badge);

  const video = matchAspect(el('video', '', null, { playsinline: '', muted: '', autoplay: '', controls: '' }));
  video.muted = true;
  d.el.append(video);

  let pc = null, ws = null, started = 0;

  // A WHEP client is small: offer recvonly, POST the SDP, take the answer.
  async function whepPlay(url) {
    pc = new RTCPeerConnection({ bundlePolicy: 'max-bundle' });
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.addTransceiver('audio', { direction: 'recvonly' });
    // A WEBRTC TRACK ARRIVES MUTED and unmutes only once media actually
    // flows. Assigning srcObject before that gives iOS a stream with no
    // frames yet, and it paints black and stays there even though decoding
    // later succeeds — which is exactly what the phone showed: rtt 16 ms,
    // 26 fps inbound, and a black rectangle.
    // ONE stream that we own, and every arriving track gets added to it.
    //
    // Adopting e.streams[0] per track loses tracks: Cloudflare delivers audio
    // and video with different msids, so the second ontrack REPLACED srcObject
    // and threw the first track away. Whichever unmuted last won, which is a
    // race — the suite showed "video:live" alone on one run and "audio:live"
    // alone on the next, while getStats() reported 2125 video frames decoded at
    // 1280x720 either way. Same bug, opposite faces.
    const inbound = new MediaStream();
    pc.ontrack = (e) => {
      inbound.addTrack(e.track);
      const attach = async () => {
        if (video.srcObject !== inbound) video.srcObject = inbound;
        // play AFTER attaching a live stream, not before
        try { await video.play(); d.log(`attached on ${e.track.kind} unmute`); }
        catch (err) { await playOrPrompt(video, d); }
      };
      if (e.track.muted) e.track.addEventListener("unmute", attach, { once: true });
      else attach();
      // some builds never fire unmute; metadata is a second chance
      video.addEventListener("loadedmetadata", () => video.play().catch(() => {}), { once: true });
    };
    pc.onconnectionstatechange = () => d.log(`pc ${pc.connectionState}`);

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    // wait for ICE gathering so the offer is complete (no trickle to WHEP)
    if (pc.iceGatheringState !== 'complete') {
      await new Promise((res) => {
        const t = setTimeout(res, 3000);
        pc.addEventListener('icegatheringstatechange', () => {
          if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); }
        });
      });
    }
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'content-type': 'application/sdp' },
      body: pc.localDescription.sdp,
    });
    if (!res.ok) throw new Error(`WHEP ${res.status}`);
    const answer = await res.text();
    await pc.setRemoteDescription({ type: 'answer', sdp: answer });
    return res.headers.get('location');
  }

  d.on('go', async () => {
    if (pc) return;
    armVideo(video);          // before any await, or iOS refuses later
    ws = holdPublisher((s) => {
      badge.dataset.on = s.held ? '1' : '0';
      badge.textContent = s.held ? `publisher: held${s.viewers ? ` (${s.viewers})` : ''}` : 'publisher: idle';
    });
    d.log('holding the publisher open');

    // Wait for the WHIP LEG, not the HLS manifest — they are different inputs.
    const w = await waitForWhip({
      onTick: ({ waitedMs, err }) => d.log(`whip leg not up at ${(waitedMs / 1000).toFixed(0)}s${err ? ` (${err})` : ''}`),
    });
    // 🔴 A PAGE THAT CANNOT REACH ITS SUBJECT SAYS SO, IN AN ASSERT, NOT IN A LOG.
    // This line used to `d.log` and return, which is how this page read 8/8
    // GREEN on a desk where it had never connected: a log is not graded, so the
    // suite saw a page that simply stopped having opinions. MEASURED 2026-09-25:
    // `node demo/verify.mjs webrtc` printed `page asserted something · 2`, and
    // both of those two are the shell's feedback-button asserts.
    // ⚠️ `aborted` IS NOT A FAILURE. The page being left is the harness tearing
    // down, and grading that red would make every clean teardown a defect.
    if (!w.ok) {
      if (w.aborted) { d.log('page left', 'bad'); return; }
      d.assert('the whip leg came up', false,
        `no publisher after ${(w.waitedMs / 1000).toFixed(0)}s, so nothing could be played`);
      await d.run('check');
      return;
    }
    d.log(`whip leg publishing after ${(w.waitedMs / 1000).toFixed(1)}s`, 'hi');

    // ffmpeg reaching DTLS state=10 is not the same as Cloudflare being ready
    // to answer a WHEP offer, so a 409 here is "not yet" rather than "no".
    for (let attempt = 1; attempt <= 6; attempt++) {
      try {
        started = performance.now();
        await whepPlay(whep());
        d.log(`WHEP negotiated in ${Math.round(performance.now() - started)} ms`, 'hi');
        await playOrPrompt(video, d);
        // 🔴 `break`, NOT `return`, AND THIS ONE CHARACTER IS WHY THIS PAGE HAS
        // NEVER GRADED ITSELF. A `return` here leaves `d.run('check')` below
        // unreachable on the SUCCESS path, and the failure path returns too, so
        // every route out of this handler skipped the checks. The standing
        // explanation in this repository was that the checks sat behind a
        // connection that never happened. That was wrong and it was the more
        // comforting answer: they sat behind a connection that DID happen, and
        // were skipped anyway. MEASURED 2026-09-25 with a publisher awake and
        // WHEP media confirmed reaching this machine at 389 frames and
        // 3,554,870 bytes: still `page asserted something · 2`.
        break;
      } catch (e) {
        try { pc?.close(); } catch { /* fine */ }
        pc = null;
        d.log(`whep attempt ${attempt}: ${e.message}`, 'bad');
        if (attempt === 6) { d.fail(e); return; }
        await new Promise((r) => setTimeout(r, 4000));
      }
    }
    // The checks read what this control just produced, so this is the first
    // moment they can be true — and a button for them would make them optional.
    await d.run('check');
  });

  setInterval(async () => {
    if (!pc) return;
    // the element's own view, which is where the black frame actually lives
    d.set('picture', video.videoWidth ? `${video.videoWidth}x${video.videoHeight}` : 'no frame',
      video.videoWidth ? 'ok' : 'bad');
    d.set('state', video.paused ? 'paused' : 'playing', video.paused ? 'bad' : 'ok');
    notePresented();
    const stats = await pc.getStats().catch(() => null);
    if (!stats) return;
    for (const s of stats.values()) {
      if (s.type === 'inbound-rtp' && s.kind === 'video') {
        if (Number.isFinite(s.framesPerSecond)) d.set('fps', s.framesPerSecond);
        // Keep these: "videoWidth is 0" alone cannot tell apart "no video RTP
        // arrived at all" from "packets arrived and the decoder produced
        // nothing" from "frames decoded but never presented". They are three
        // different bugs and the assert used to report all three the same way.
        lastVideoRtp = {
          received: s.framesReceived, decoded: s.framesDecoded, dropped: s.framesDropped,
          packets: s.packetsReceived, bytes: s.bytesReceived, w: s.frameWidth, h: s.frameHeight,
          decoder: s.decoderImplementation, keyframes: s.keyFramesDecoded,
        };
      }
      if (s.type === 'candidate-pair' && s.state === 'succeeded' && Number.isFinite(s.currentRoundTripTime)) {
        d.set('round trip', s.currentRoundTripTime * 1000);
      }
    }
  }, 1000);

  /**
   * Did the element EVER present a frame? Latched, not sampled.
   *
   * Two wrong versions preceded this one. Sampling videoWidth at check time
   * is a race — the assert failed three runs, then passed when two unrelated
   * lines were inserted ahead of it. Awaiting the frame INSIDE the check is
   * worse: the harness stops when asserts stop growing, so a 4 s await made it
   * tear down mid-check and four asserts silently vanished from the suite
   * (07 went 13 -> 9 while still reporting all green).
   *
   * A latch is both deterministic and synchronous: `resize` is the canonical
   * signal that videoWidth became known, and the 1 s stats interval already
   * running below is a second chance if it is missed.
   */
  let framePresented = null;
  function notePresented() {
    if (!framePresented && video.videoWidth > 0) {
      framePresented = `${video.videoWidth}x${video.videoHeight}`;
    }
  }
  video.addEventListener('resize', notePresented);
  video.addEventListener('loadeddata', notePresented);
  let lastVideoRtp = null;

  d.on('check', () => {
    d.assert('publisher held by this page', badge.dataset.on === '1', badge.textContent);
    d.assert('peer connection created', !!pc);
    if (pc) {
      d.assert('peer connection connected', pc.connectionState === 'connected', pc.connectionState);
      const tracks = video.srcObject?.getTracks?.() || [];
      d.assert('a track arrived', tracks.length > 0,
        tracks.map((t) => `${t.kind}${t.muted ? ':muted' : ''}:${t.readyState}`).join(' ') || 'none');
      d.assert('a VIDEO track arrived', tracks.some((t) => t.kind === 'video'),
        tracks.filter((t) => t.kind === 'video').length ? 'yes' : 'audio only');
      d.assert('video is advancing', video.currentTime > 0, `${video.currentTime.toFixed(1)}s`);
      // decoding is not rendering: this is the assert the black frame failed
      notePresented();
      d.assert('frames are actually RENDERED', !!framePresented,
        framePresented
          ? framePresented
          : lastVideoRtp
            ? `nothing presented · rtp says ${JSON.stringify(lastVideoRtp)}`
            : 'nothing presented and NO inbound video rtp at all');
      d.assert('element is playing', !video.paused, video.paused ? `paused rs${video.readyState}` : 'playing');
    }
  });

  d.log('WHEP: one POST of an SDP offer, one answer back');
  d.ready();
</script>
</html>
