     * TASCAM. It is the negative half and it is a separate assert on purpose: a
     * page that took the first output would pass the line above unharmed, and
     * the first output on this desk is a Model 12 or an Evolution keyboard, both
     * of which move something real when CC 74 arrives. With no chooser left,
     * this is the only thing choosing, so it is the only thing refusing.
     */
    d.assert('and where no name matches, nothing is chosen rather than the first output',
      chosenOut([{ name: 'IAC Driver Bus 1' }, { name: 'Model 12' }, { name: 'MK-425C USB MIDI Keyboard' }]) === null
      && chosenOut([{ name: 'Model 12' }]) === null
      && chosenOut([]) === null,
      'three lists chose nothing');

    d.assert('a visit chooses no output and opens no port',
      port === null && ports.length === 0,
      `${ports.length} outputs known, sending to ${port ? portName(port) : 'nothing'}`);

    /**
     * 🔴 ONE HAND IS A FRAME AND FORTY ARE A CEILING, AND BOTH HALVES ARE HERE.
     * The first two cases are the negative control: a page that paced one hand
     * would have made the sweep this page exists for worse in order to solve a
     * problem it does not have. The last is the arithmetic that keeps forty of
     * them under the ceiling, which was measured at 1289 a second before it
     * existed.
     */
    d.assert('one hand is paced not at all, and forty are held under the ceiling',
      handGap(0) === 0 && handGap(1) === 0
      && handGap(40) === 67 && 40 * (1000 / handGap(40)) <= HAND_CEILING,
      `${handGap(40)} ms apart for forty lanes, ${Math.round(40 * (1000 / handGap(40)))} a second`);

    /**
     * 🔴 A HAND WHERE ONE CAN BE SEEN AND NOWHERE ELSE, BOTH HALVES. The first
     * half alone would pass on a page that gave every slider a hand; the second
     * would pass on a page that gave none.
     */
    const withHand = sliders.filter((s) => s.sld.hand);
    d.assert('every slider with a hand has the steps to show one, and every slider without is too coarse',
      withHand.every((s) => !s.sld.hand.coarse)
      && sliders.filter((s) => !s.sld.hand).every((s) => (s.p.hi - s.p.lo) < HAND_STEPS)
      && withHand.length > 0 && withHand.length < sliders.length,
      `${withHand.length} of ${sliders.length} carry one, at ${HAND_STEPS} steps or more`);

    /**
     * 🔴 THE GROUPING IS A DECISION WITH A SOURCE, SO IT IS ASSERTED AND NOT
     * DESCRIBED. Three claims in one, and the third is the negative control: the
     * nine headings come out in the reference's own order, a parameter this page
     * regroups loses exactly the word its heading gained, and a parameter this
     * page does NOT regroup keeps both its heading and its full name. Without
     * that last one the check would pass on a page that stripped every label
     * down to nothing.
     */
    d.assert('the rack is grouped the way the reference and Novation both group it, and only the shared word is dropped',
      shownSections('1/2').join(' ') === 'VOICE OSC 1 OSC 2 MIXER FILTER ENVELOPE 1 DISTORTION CHORUS MACRO KNOBS'
      && shown(param('1/2', 22)).sec === 'OSC 1' && shown(param('1/2', 22)).label === 'virtual sync depth'
      && shown(param('1/2', 33)).sec === 'OSC 2' && shown(param('1/2', 33)).label === 'virtual sync depth'
      && shown(param('1/2', 70)).sec === 'ENVELOPE 1' && shown(param('1/2', 70)).label === 'sustain'
      && shown(param('1/2', 3)).sec === 'VOICE' && shown(param('1/2', 3)).label === 'Polyphony Mode'
      && shown(param('16', 74)).sec === 'MASTER FILTER' && shown(param('16', 74)).label === 'frequency',
      `${shownSections('1/2').length} headings on a synth, ${shownSections('16').length} on the session`);

    /**
     * 🔴 A LAYOUT CLAIM IS A MEASUREMENT. Nine sections are nine separate grids,
     * each of which would size its label column from its own widest name, so one
     * left edge A COLUMN across all of them is the whole of what `--lab` is for
     * and it is exactly the kind of rule this project has watched lose silently
     * to another rule. Measured off real rects, after re-running the share, so
     * the measurement and the claim are in the same font state.
     * 🔴 AND THE NUMBER OF EDGES IS READ OFF THE BREAKPOINT RATHER THAN ASSUMED,
     * BECAUSE THE HARNESS ONLY EVER SEES ONE OF THE TWO CASES. `demo/verify.mjs`
     * runs at 756 px with no viewport override, which is ABOVE the kit's 720 px
     * pair breakpoint, so the case this green line measures is the two column
     * one. The phone case is one column and one edge and nothing in this suite
     * can reach it: it was measured with a throwaway probe at 390 px on
     * 2026-09-21 and that measurement is not this assert.
     */
    shareLabelColumn();
    const lanes = [...rack.el.querySelectorAll('.sld-lane')].map((e) => e.getBoundingClientRect().left);
    const edges = [];
    for (const x of lanes) if (!edges.some((e) => Math.abs(e - x) <= 1.5)) edges.push(x);
    const paired = matchMedia('(min-width: 720px)').matches;
    d.assert('every lane in the rack starts at one left edge a column, across all nine sections',
      lanes.length === sliders.length && edges.length === (paired ? 2 : 1),
      `${lanes.length} lanes on ${edges.length} edge${edges.length === 1 ? '' : 's'} at ${Math.round(innerWidth)} px`);

    d.assert('the page does not drag sideways at this width',
      document.documentElement.scrollWidth <= window.innerWidth + 1,
      `page ${document.documentElement.scrollWidth} against ${window.innerWidth}`);

    d.assert('no secret in this page', !location.href.includes('token'));
  }

  /**
   * 🔴 THE HALF THAT COSTS SOMETHING, BEHIND THE GATE. It moves handles, runs an
   * invisible hand and produces bytes, and a visitor would see all three happen
   * in front of them.
   * ⚠️ AND NOTHING REACHES AN INSTRUMENT WHILE IT RUNS. `sink` takes every
   * message, so a suite run on the desk this Circuit is plugged into is not a
   * hand on it. There is an assert on the counter at the end.
   */
  d.on('drive', async () => {
    sink = [];

    // ── the invisible hand, which is what this page is for ───────────────────
    //
    // 🔴 IT IS FIRST BECAUSE IT IS SLOW, AND SLOW IS MEASURED RATHER THAN
    // GUESSED. A sweep is 7000 ms end to end with a Beta(3,4) speed profile, so
    // the first STEP of a 127 step lane lands about half a second in: the curve
    // is deliberately gentle at the start, which is the thing that makes it read
    // as a hand rather than as a ramp. `settleMs` in the manifest covers it.
    const filt = find('frequency');
    const startedAt = filt.sld.get();
    sink.length = 0;
    filt.sld.hand.start(0, 'check');
    /* 🔴 THREE STEPS, NOT ONE, AND THE NUMBER IS THE POINT. One step proves the
       handle twitched and would be satisfied by a rounding error; three proves
       it is travelling, and three is also what makes the assert below about a
       SEQUENCE of messages rather than about a single one. MEASURED at about
       800 ms on a 127 step lane, against a 2500 ms deadline. */
    const STEPS = 3;
    const moving = () => Math.abs(filt.sld.get() - startedAt) >= STEPS;
    const movedByItself = await waitFor(moving, 2500);
    d.assert('an invisible hand moves a handle with nobody touching it',
      movedByItself && filt.sld.hand.running,
      `${startedAt} to ${filt.sld.get()}, hand ${filt.sld.hand.running ? 'running' : 'stopped'}`);

    flushNow();
    const handMsgs = sink.filter((m) => m.cc === filt.p.cc);
    /* 🔴 A HAND THAT MOVED A CONTROL WITHOUT THE SOUND CHANGING WOULD BE A LYING
       CONTROL, which is this project's own phrase for the defect. So the claim
       is not that the handle moved, it is that every position it passed through
       went out, on this part's own channel and controller, as a sequence of
       distinct values rather than as one message at the end. */
    const handValues = new Set(handMsgs.map((m) => m.value));
    d.assert('and every position it passes through goes out, on the channel and controller this part uses',
      handMsgs.length >= 2 && handValues.size === handMsgs.length
      && handMsgs.every((m) => m.bytes[0] === 0xb0 && m.bytes[1] === 74),
      `${handMsgs.length} control changes at ${[...handValues].join(', ')}`);

    sink.length = 0;
    filt.sld.hand.stop('check');
    flushNow();
    /* ⚠️ THE LAST VALUE OF A GESTURE IS THE ONE THAT STAYS TRUE FOREVER. A hand
       stopping is a gesture ending, so it has to land, or a filter sits at the
       second to last position for as long as the instrument is on. */
    d.assert('and when it stops, the position it stopped at is sent',
      sink.length === 1 && sink[0].value === Math.round(filt.sld.get()),
      `${sink.length} message for a handle at ${filt.sld.get()}`);
    d.assert('the hand said so in the log rather than moving silently',
      handStarts === 1, `${handStarts} starts`);

    // ── one move, one message, one channel ───────────────────────────────────

    sink.length = 0;
    filt.sld.set(37);
    flushNow();
    d.assert('a slider move leaves as exactly one control change, with the right channel and controller',
      sink.length === 1 && JSON.stringify(sink[0].bytes) === JSON.stringify([0xb0, 74, 37]),
      `${sink.length} message${sink.length === 1 ? '' : 's'}, ${sink[0]?.bytes.map((b) => b.toString(16).toUpperCase()).join(' ')}`);

    /* 🔴 THE SAME CONTROLLER ON THE WRONG CHANNEL IS THE ONE MISTAKE THIS
       INSTRUMENT PUNISHES. CC 74 is the synth filter on 1 and the MASTER filter
       on 16, and a page keyed by controller number alone would move whichever
       one it happened to remember. */
    d.assert('and the same controller on the session channel was not produced',
      !sink.some((m) => m.bytes[0] === 0xbf),
      `${sink.filter((m) => m.bytes[0] === 0xbf).length} on channel 16`);

    // ── the coalescer ────────────────────────────────────────────────────────

    sink.length = 0;
    const mergedBefore = mergedTotal();
    for (let i = 0; i < 40; i++) moved(voice, filt.p, 20 + i, false);
    flushNow();
    d.assert('forty moves inside one frame leave as one control change, carrying the last of them',
      sink.length === 1 && sink[0].value === 59,
      `${sink.length} message${sink.length === 1 ? '' : 's'} at ${sink[0]?.value}`);
    d.assert('and the thirty nine that never left are counted rather than lost quietly',
      mergedTotal() - mergedBefore === 39, `${mergedTotal() - mergedBefore} merged`);

    // ── the parts ────────────────────────────────────────────────────────────
    //
    // 🔴 DRIVEN HERE BECAUSE THE HARNESS CANNOT REACH IT. The chooser is not in
    // `.pos-controls` on purpose, and a check only a control can reach is a
    // check nobody runs.
    parts.set(2);                                  // Session, channel 16
    d.assert('choosing the session gives the eighteen parameters it has',
      sliders.length === 18 && voice.ch === 16, `${sliders.length} on channel ${voice.ch}`);

    sink.length = 0;
    find('frequency').sld.set(90);
    flushNow();
    d.assert('the master filter is the same controller number and goes out on channel 16',
      sink.length === 1 && JSON.stringify(sink[0].bytes) === JSON.stringify([0xbf, 74, 90]),
      sink[0]?.bytes.map((b) => b.toString(16).toUpperCase()).join(' ') || 'nothing');

    parts.set(1);                                  // Synth 2, channel 2
    sink.length = 0;
    find('frequency').sld.set(51);
    flushNow();
    d.assert('Synth 2 is the same parameter on channel 2',
      sink.length === 1 && JSON.stringify(sink[0].bytes) === JSON.stringify([0xb1, 74, 51]),
      sink[0]?.bytes.map((b) => b.toString(16).toUpperCase()).join(' ') || 'nothing');

    parts.set(0);

    // ── putting it back ──────────────────────────────────────────────────────

    d.assert('the page knows how far it has moved the instrument',
      changed() > 0, `${changed()} parameters away from where this page opened`);
    sink.length = 0;
    putBack();
    d.assert('put back re-sends every parameter this page moved, on all three parts',
      changed() === 0 && sink.length > 0
      && sink.every((m) => m.value === homeOf(param(m.group, m.cc))),
      `${sink.length} control changes, ${changed()} left moved`);

    // ── move everything ──────────────────────────────────────────────────────
    //
    // 🔴 DRIVEN BY PRESSING THE REAL BUTTON, NOT BY CALLING THE FUNCTION. The
    // button is in `.shape-bar` precisely so the harness never presses it, and a
    // check that called `moveEverything()` instead would grade the arithmetic
    // while leaving the control itself untested. `element.click()` is what
    // `verify.mjs` does to every other button on every other page.

    const wide = sliders.filter((s) => s.sld.hand);
    const coarse = sliders.filter((s) => !s.sld.hand);
    const startsBefore = handStarts, linesBefore = handLines;
    sink.length = 0;
    hand.click();
    flushNow();

    d.assert('one press leaves every lane with room for a hand moving by itself, and the coarse ones alone',
      wide.every((s) => s.sld.hand.running) && coarse.every((s) => !s.sld.hand)
      && handStarts - startsBefore === wide.length
      && wide.length > 0 && coarse.length > 0,
      `${wide.filter((s) => s.sld.hand.running).length} of ${wide.length} moving, `
      + `${coarse.length} too coarse for one`);

    /* 🔴 FORTY HANDS, ONE LINE. A line per slider is the log this page reports
       real faults in, filled with forty rows nobody needs, and the one thing
       worth reading gets pushed off the top of it. */
    d.assert('and it says so once rather than once per slider',
      handLines - linesBefore === 1, `${handLines - linesBefore} lines for ${wide.length} hands`);

    /* 🔴 THE COARSE LANES REALLY DO MOVE, AND THIS IS WHERE THAT IS GRADED.
       Twelve of the fifty two are modes and switches that a hand cannot animate,
       which is a statement about the ANIMATION: a filter type and an oscillator
       wave are two of the biggest changes this instrument takes, and a button
       called `move everything` that skipped a quarter of the rack would be
       naming one thing and doing another. */
    const ccs = new Set(sink.map((m) => m.cc));
    d.assert('every parameter on the part went out, the twelve coarse ones included, one message each',
      sink.length === sliders.length && ccs.size === sink.length
      && coarse.every((s) => ccs.has(s.p.cc)),
      `${sink.length} control changes for ${sliders.length} parameters, ${ccs.size} distinct`);

    /**
     * 🔴 AND THE PACING IS CONSULTED ON THE REAL PATH, WHICH IS A DIFFERENT
     * CLAIM FROM THE ARITHMETIC ABOVE. A formula nothing calls is this
     * project's most expensive kind of defect, and it reads as correct. Two
     * offers per lane inside one frame, with forty hands running: the first
     * sets each lane's clock and the second is inside the 67 ms gap, so forty
     * positions are held back rather than put on the wire.
     * ⚠️ THE FIRST ROUND IS NOT A CONTROL, IT IS THE SETUP. Each lane's clock
     * is empty until something offers, so a single round would pass on a page
     * with no pacing at all.
     */
    const pacedBefore = paced;
    sink.length = 0;
    for (const s of wide) moved(s.v, s.p, s.p.lo + 3, false);
    const pacedAfterFirst = paced;
    for (const s of wide) moved(s.v, s.p, s.p.lo + 4, false);
    flushNow();
    d.assert('with forty hands running, a second position inside the gap is held back rather than sent',
      pacedAfterFirst === pacedBefore && paced - pacedBefore === wide.length
      && sink.length === wide.length,
      `${paced - pacedBefore} held back, ${sink.length} sent for ${wide.length} lanes`);

    /* 🔴 AND PUT BACK IS THE WAY OUT OF IT. A button that starts forty hands and
       no button that stops them is a page somebody has to reload, and a reload
       is how this project's `/weight/` full screen bug was reported. */
    sink.length = 0;
    back.click();
    d.assert('put back stops every hand the press started, on every part',
      everyRow().every((s) => !s.sld.hand?.running) && changed() === 0,
      `${everyRow().filter((s) => s.sld.hand?.running).length} still moving, ${changed()} left moved`);

    // ── the audit ────────────────────────────────────────────────────────────

    /* Over everything this page has ever produced, not over the last batch: the
       counter is raised inside `emit`, which is the one door out. */
    d.assert('every byte this page has put out is a control change',
      out > 0 && notCc === 0 && refused === 0,
      `${out} out, ${notCc} that were not a control change, ${refused} refused`);

    /* 🔴 AND NONE OF IT REACHED AN INSTRUMENT. A suite run on the desk this
       Circuit is plugged into must not be a hand on it, and this is the counter
       that says so rather than a comment claiming it. */
    d.assert('and no message reached a real instrument while the checks ran',
      portSends === 0, `${portSends} sends to a port`);

    d.assert('the log lists what left rather than staying empty',
      traffic.count() > 0, `${traffic.count()} rows`);

    sink = null;
  });

  grade();

  /**
   * 🔴 THE PRESS THE HARNESS NO LONGER MAKES, MADE HERE, BEHIND THE GATE.
   * `.pos-controls` is empty since the status control joined the page's own
   * row, and `demo/verify.mjs` drives a page by clicking that row, so without
   * this line `look` never runs, `drive` never runs, and every assert behind
   * them goes silent while the suite reads green. `/muta/` carries the same
   * line for the same reason and `/mirror/` drives its headset buttons the same
   * way.
   * ⚠️ AFTER `grade()`, NOT BEFORE IT. `a visit opened nothing`, `a visit
   * chooses no output and opens no port` and `the page knows how far it has
   * moved the instrument` are all statements about a page nobody has pressed,
   * so they are read while that is still true.
   * ⚠️ AND BEFORE `d.ready()`, WHICH IS DELIBERATE AND WAS GOT WRONG ONCE ON
   * `/muta/`. `verify.mjs` waits 7.4 s for `ready` before it grades anything,
   * so a page that only says it is ready when its checks have FINISHED is never
   * graded at all. The flag means this page is up.
   */
  ifSelfcheck(() => pres.el.click(), {
    log: d.log,
    say: 'the checks behind the status button move handles and produce bytes, so they run '
      + 'under a harness and never for somebody who just opened this page',
  });

  d.ready();
</script>
</html>
