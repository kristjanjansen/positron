  // 🔴 IT SWITCHES ITSELF ON. This page's entire subject is the granulator, so
  // arriving with it off is a page that does nothing until you find a button —
  // and the state it arrives in is "the board is answering but nothing is
  // granulating", which is a normal moment being reported as a problem.
  //
  // ⚠️ ONCE, AND NOT WHILE IT IS ALREADY HAPPENING. The board is shared and
  // raising the insert takes ~40 s, so a second request mid-compile is a second
  // engine. `enabling` guards the window the reply has not closed yet.
  let enabling = false, enabledOnce = false;
  async function enable() {
    if (enabling || fxOn) return;
    enabling = true;
    try { await enableNow(); } finally { enabling = false; }
  }

  async function enableNow() {
    startAudio();
    // ⚠️ A WINDOW, NOT A RACE. Nobody answering is a real answer here, so this
    // waits a bounded time and then reports silence rather than waiting forever
    // and looking like it is still loading.
    for (let i = 0; i < 20 && !answered; i++) await wait(250);
    if (!answered) {
      d.log(`nothing answered in “${ROOM}” — the board is not in this room`, 'warn');
      render();
      return;
    }
    // Something has to be going into it, or it granulates an empty recording
    // and the page is honestly, uselessly silent.
    const st = await ask({ type: 'audio.status' }, 'audio.started', 6000);
    if (st && !st.ok) {
      d.log('nothing was playing — starting the sampled instrument so there is something to chew', 'hi');
      wantSource = SOURCE;
      await ask({ type: 'audio.start', source: 'fluidsynth' }, 'audio.started', 60000);
    }
    // First time this is asked of a cold board it compiles a two-thousand line
    // engine, about forty seconds; after that it is a re-patch. `switching` is
    // what lets the page say THAT rather than "it is off", which is the same
    // sentence about two different situations.
    switching = true; render();
    const fx = await ask({ type: 'fx.pappus', on: true }, 'fx.pappus', 90000);
    switching = false;
    if (!fx) { d.log('the granulator did not answer in ninety seconds', 'warn'); render(); return; }
    if (!fx.ok) { render(); return; }
    // ⚠️ ADOPT BEFORE ROLLING. The board is shared and it keeps playing with
    // nobody connected: if it already has settings, taking them over would
    // change the sound under whoever is listening for no reason the page could
    // name. A roll happens when there is nothing to adopt, or when asked for.
    const state = await ask({ type: 'params.state' }, 'params.state', 6000);
    void state;
    await applyPatch(patch);
    // 🔴 THE MATERIAL, AND IT IS AWAITED — plan-twins §4a. One description, two
    // builders: this page expands the spec with `partialsOf` for its own
    // worklet, and the board expands the SAME spec with the SAME function and
    // hands it to `PosSource.sc` on its own scsynth.
    //
    // ⚠️ AWAITED BECAUSE THE CHECK BELOW BRANCHES ON IT. Sent and forgotten, the
    // reply landed several seconds later — after `probeSound()` had already
    // chosen the key branch and measured an instrument that was about to be
    // unplugged. Read 0.1434 against 0.0870 and passed, which is a check
    // grading a transition.
    const src = await ask({ type: 'source.set', spec: SPEC }, 'source.applied', 20000);
    if (!src) d.log('the board did not answer about the material', 'warn');
    render();
  }

  /**
   * ⚠️ MEASURE THE SOUND, NOT THE FRAME COUNT — and measure it where the CHECK
   * is, not where the switching-on is. A stream of digital silence arrives at
   * exactly the rate a working one does, so this holds a key and compares what
   * comes back against what was coming back before it: the only thing on this
   * page that crosses the whole chain.
   *
   * It lived inside `enable()` until the page started switching itself on, at
   * which point the control's own `enable()` returned early — already on — and
   * skipped the measurement, so the assert read "no key has been held yet"
   * about a working board. Enabling is a side effect; measuring is the check.
   */
  async function probeSound() {
    // 🔴 TWO WAYS TO MAKE THE BOARD LOUDER, AND THE FIRST ONE IS BETTER — and it
    // had to change, because the generated material MADE THE KEY PROBE VACUOUS.
    // With `PosSource` feeding the granulator the instrument is unplugged from
    // it (it has to be: scsynth sums its input bus, so an instrument still
    // patched in is a second material nobody declared), so a held key changes
    // nothing — and the old assert would still have passed, on the drone that
    // was there before the key and after it. A check that cannot fail is not a
    // check.
    //
    // Turning the MATERIAL down and up crosses strictly more of the chain than
    // a key does: this page's own description, the relay, the box, the shared
    // `partialsOf`, sclang, the wavetable, the granulator, the capture, and the
    // relay again. A key only ever reached the instrument.
    //
    // ⚠️ 0.001 RATHER THAN 0. An all-zero amplitude table is a `/b_gen sine1`
    // edge nobody here has tested; a peak of 0.001 is -60 dB, which is silence
    // by any threshold on this page and is an ordinary value all the way down.
    if (made?.partials) {
      // 🔴 LOUD FIRST, QUIET SECOND, AND THAT ORDER IS A MEASUREMENT. A
      // granulator answers a change of material only when its write head next
      // passes the point the grains are reading, so the two directions cost
      // very different amounts of time: `bufclear` empties the ring and the
      // QUIET arm lands inside a second, while the LOUD arm has to wait for the
      // head to come round — measured at about six seconds at this page's own
      // settings, and variable, because where the head is when `bufclear` lands
      // is not something anybody chose.
      //
      // Three shapes of this check were wrong before this one. A flat 1.6 s
      // read 0.0880 against 0.0821 (the old material still in the ring). A
      // shortened `mbuflen` read 0.0000 twice over. A fixed 1.8 s on the loud
      // arm read the QUIET level twice, three runs out of three. So the slow
      // direction is waited on in one-second slices until there is something to
      // report, and the fast one follows it.
      const hi = { peak: 0, frames: 0 };
      for (let i = 0; i < 12 && hi.peak < 0.01; i++) {
        const slice = await listen(1000);
        hi.frames += slice.frames;
        if (slice.peak > hi.peak) hi.peak = slice.peak;
      }
      // ⚠️ AWAITED, AND `bufclear` ONLY AFTER IT. Sent together, the two race:
      // `params.set` is one hop to the box and straight out as OSC, while
      // `source.set` has to reach sclang, fill the wavetable that is not playing
      // and crossfade to it. Emptying the ring BEFORE the material goes quiet
      // just refills it with the loud one — measured, a down arm that read
      // 0.0331 against a 0.0555 up arm on one run in three while the other two
      // read 0.0000.
      await ask({ type: 'source.set', spec: { ...SPEC, level: 0.001 } }, 'source.applied', 15000);
      send({ type: 'params.set', cmd: 'bufclear', args: [1] });
      await wait(1200);
      const lo = await listen(1200);
      // ⚠️ PUT IT BACK. The check ends on the quiet arm, and a page that left
      // the material turned down would hand the next visitor a granulator
      // chewing something 60 dB below what the screen says it is chewing —
      // which is the same class of mistake as leaving `msrc 1` behind.
      send(sourceMessage(SPEC));
      probe = { quiet: lo.peak, held: hi.peak, frames: lo.frames + hi.frames, how: 'material' };
      d.log(`the material turned down and up: ${hi.peak.toFixed(4)} against ${lo.peak.toFixed(4)} over `
            + `${probe.frames} frames — the board is making the sound this page described`,
            hi.peak > 0.002 ? 'hi' : 'bad');
      render();
      return;
    }
    const lo = await listen(900);
    send({ type: 'note.on', note: 60, vel: 100, channel: 0 });
    const hi = await listen(1800);
    send({ type: 'note.off', note: 60, channel: 0 });
    const quiet = lo.peak, held = hi.peak;
    probe = { quiet, held, frames: lo.frames + hi.frames, how: 'key' };
    // ⚠️ SAY WHICH OF THE TWO THE NUMBERS MEAN. A cloud that was already
    // droning is often LOUDER before the key than during it, and printing the
    // pair without saying so reads as a failure on a working board.
    d.log(`holding a key: ${held.toFixed(4)} against ${quiet.toFixed(4)} with nothing pressed — `
          + (quiet <= 0.002 ? 'the key is what started it' : 'it was already droning, which is what a cloud does'),
          held > 0.002 ? 'hi' : 'bad');
    render();
  }

  // The control is still here, still pressed by the harness, and now it is the
  // one that CHECKS as well — a page that checks itself only when asked is a
  // page nobody checks.
  d.on('on', async () => {
    // BOTH ENGINES. The page one is instant and needs only a gesture; the
    // board one compiles a 2,030-line graph and is why this control owns the
    // page's `settleMs`. Starting them together is what makes the blend mean
    // something the moment anybody touches it.
    startLocal().catch((e) => d.log(`no granulator in this page: ${e.message}`, 'bad'));
    await enable();
    // Wait out an enable that is already in flight — the page starts one the
    // moment the board answers, and the harness can press this before it ends.
    for (let i = 0; i < 160 && enabling; i++) await wait(500);
    if (fxOn) await probeSound();
    checkAll();
  });

  function checkAll() {
    // ── the lane that is always reachable ─────────────────────────────────
    // 🔴 THESE RUN ON EVERY RUN, WITH NO BOARD AND NO NETWORK. That is the
    // whole reason this lane exists: `grains` used to assert nothing at all
    // about a granulator when the Pi was down, so a page about granulation
    // could go green having granulated nothing. And it is the only lane where
    // the picture can be checked, because it is the only one whose engine
    // reports the grains it fired.
    d.assert('a granulator is running in this page, with no network in the path',
      !!lnode && !!lctx, lctx ? `an AudioWorklet at ${lctx.sampleRate} Hz` : 'no audio context');
    d.assert('it is holding sound to chew', lstats.heldSec > 0.5, `${lstats.heldSec?.toFixed(1)} s held`);
    // ⚠️ MEASURED, NOT DRAWN FROM THE SETTINGS. A scope fed parameters would
    // look identical and mean nothing — which is the picture this page deleted
    // once already.
    const sc = scope.stats();
    d.assert('every tick in this page’s picture is a grain it actually started',
      sc.measured > 0 && sc.inferred === 0,
      `${sc.measured} reported by the engine, ${sc.inferred} guessed from audio`);

    // 🔴 WHAT IT IS CHEWING, CHECKED — because the whole side-by-side rests on
    // both ends being handed the same material, and this is the end that can
    // answer for itself. A sine table is the one description two different
    // engines render identically; a `type: 'sawtooth'` would look the same on
    // screen and be a different sound on the board (plan-twins §4a).
    const plan = lsrc?.plan;
    const top = plan?.partials?.length ? Math.max(...plan.partials.map((p) => p.hz)) : 0;
    d.assert('the material is the table the spec asked for, and none of it aliases',
      !!plan && plan.partials.length > 0 && plan.dropped === 0 && top < lctx.sampleRate / 2,
      plan ? `${plan.partials.length} sine partials of ${SPEC.shape} over ${SPEC.chord.length} notes, `
        + `top at ${Math.round(top)} Hz against a ${lctx.sampleRate / 2} Hz ceiling` : 'no source built');

    d.assert('the page reached the relay', wire.state() === 1, `readyState ${wire.state()}`);
    // ⚠️ ONE BRANCH PER NAMED STATE, AND THE COUNT MOVES WITH IT. This board is
    // shared and it keeps running with nobody connected, so "answering" is not
    // one condition: it can be compiling its engine, refusing the insert, or
    // playing nothing at all into it — and asserting a running instrument's
    // numbers in those states reported four failures about a board that was
    // fine. Each state asserts what it can answer for and says which it was.
    // Diff the count against the BRANCH: silent 4, answering-but-not-sounding 5,
    // sounding 8 — 12 with the drift, the board's grains, the patch, the shared
    // material and the grain rate. (It was 10 before plan-twins landed §4a and
    // §5 here; the two new ones are the material and the rate.)
    const st = panel.dataset.state;
    const why = {
      silent: 'the board is silent, and the page says so',
      warming: 'the granulator is still compiling on the board — about forty seconds the first time',
      off: fxWhy ? `the board refused to switch the granulator on: ${fxWhy}` : 'switching the granulator on',
      empty: 'the granulator is running with no instrument playing into it',
      idle: 'the granulator is running with nothing rolled',
      live: 'the board is answering and set up',
    }[st];
    d.assert('it says which of the two it is in', answered ? st !== 'silent' : st === 'silent', why);
    if (!answered) {
      d.assert('silence is reported as silence, not as an instrument that makes none',
        panel.textContent.includes('Nobody is answering'), 'the panel names the silence');
      d.assert('no sound is claimed that never arrived',
        frames === 0 && d.api.readout.sound === 'nothing' && roll === null && level === 0,
        `${frames} frames, sound cell “${d.api.readout.sound}”, nothing rolled`);
      return;
    }
    d.assert('the board answered in this room', Number.isFinite(rtt), `${rtt} ms out to the board and back`);
    d.assert('the page says what the grains are made of', !!materialShort(), String(materialShort()));
    if (st !== 'live') {
      // Not a pass dressed as one. The claim is that the page NAMES the state
      // it is in — the same claim the silent branch makes — rather than drawing
      // an instrument's numbers for a sound nobody is making.
      d.assert('it says why there is nothing to hear yet, rather than printing numbers for a sound nobody is making',
        panel.textContent.length > 40, why);
      return;
    }
    d.assert('the granulator is switched on, with something playing into it',
      fxOn && !!playing, `wrapping ${playing}${fed === false ? ' — nothing feeding it' : ''}`);
    d.assert('the two halves are set differently, which is what stops one flat wash',
      PATCHES[patch].m.rate !== PATCHES[patch].n.rate && PATCHES[patch].m.size !== PATCHES[patch].n.size,
      `${PATCHES[patch].m.rate} against ${PATCHES[patch].n.rate} grains a second`);
    // The claim the whole page rests on: this is sound that was made on a
    // machine somewhere else and came back, not a page making a noise.
    // ⚠️ AND IT HAS TO SEPARATE THE TWO, NOT JUST BE LOUD. Both branches now
    // require the quiet arm to be QUIET — with the material driven from this
    // page there is something to turn down, so "it was already droning" stops
    // being an excuse the check has to accept.
    d.assert(probe?.how === 'material'
      ? 'the board is making the sound this page described, and stops when it is turned down'
      : 'sound comes back from the board while a key is held',
      !!probe && probe.held > 0.002 && (probe.how === 'material' ? probe.quiet < probe.held * 0.5 : true),
      probe ? (probe.frames === 0
        ? 'not one audio frame arrived in either window — nothing was measured, and that is a socket rather than a silence'
        : `${probe.held.toFixed(4)} with it up, ${probe.quiet.toFixed(4)} with it down, over ${probe.frames} frames`
          + (probe.how === 'material' ? ' — the material is this page’s own description' : ''))
        : 'nothing has been measured yet — press “Switch it on”');
    // 🔴 THE MECHANISM AND WHETHER IT HAS ANYTHING TO ACT ON — NOT THE COUNT ON
    // ITS OWN. This asserted `nudges > 0` and read red for a reason that was
    // true and was not a timing fault: the movement circled the last dice roll
    // and this page does not roll, so the count was never going to climb
    // however long anyone waited. Waiting longer was the wrong fix twice over —
    // the effect was absent by construction, and an assert that has to wait is
    // an assert that gets written tolerantly, which is how a page's whole
    // subject goes missing (LESSONS #27). The board takes a set value as a
    // centre now, so the count does climb here; the shape of the check is
    // unchanged, because the reason it is shaped this way has not gone away —
    // the board can still be silent, or have its movement switched off.
    //
    // WHAT THIS COVERS: the board's movement timer is running, this page
    // watched it for a real window, and the board's own nudge counter agrees
    // with the board's own report of whether it has anything to move —
    // climbing when it has, still when it has not. Every term is read off the
    // wire and none of them has to be waited for.
    //
    // WHAT IT DOES NOT COVER: that any sound changed. Nothing here listens. The
    // assert two above, which holds a key and measures what comes back, is the
    // one that crosses the whole chain.
    const moved = driftMoved();
    const dstate = driftState();
    // Nudges go out at 8 Hz, so a centre that landed in the last half second
    // has not had a tick yet. Without this the check would be a coin toss for
    // 125 ms after somebody else in the room rolls (LESSONS #35).
    const fresh = dstate === 'moving' && (drift.sinceMs ?? Infinity) < 500;
    const climbing = !!moved && moved.nudges > 0;
    d.assert('the board’s own movement is running, and its count matches what it has to move',
      dstate !== null && dstate !== 'off' && moved !== null && (dstate === 'moving' ? climbing || fresh : !climbing),
      dstate === 'moving'
        ? `${moved ? `${moved.nudges} nudges in ${secs(moved.ms)}` : 'only one reading so far'}, reading at ${drift.scan}`
        : dstate === 'nothing'
          ? `switched on and circling nothing — ${moved ? `${moved.nudges} nudges in ${secs(moved.ms)}` : 'no window yet'}, `
            + 'which is the right count for a board with no roll to circle, not a stalled timer'
          : dstate === 'off' ? 'the movement is switched off on the board' : 'the board said nothing about movement');
    // 🔴 THE CLAIM THIS WHOLE DAY'S BOARD WORK EXISTS FOR. Until today the
    // right-hand card could draw the sound that arrived and nothing else,
    // because a bump in an envelope might be a note, a delay tap or a reverb
    // swell. Now the engine reports each grain as `GrainBuf` is triggered, so
    // both cards mark real grains and the two are finally comparable.
    //
    // ⚠️ IT ASSERTS THE SCOPE'S OWN COUNTERS, not the page's. `measured`
    // against `inferred` is the scope saying where its ink came from, which is
    // the only way to tell a picture of grains from a picture of settings —
    // and this page has drawn the wrong one before.
    const bs = boardScope.stats();
    d.assert('the board’s grains are reported by the engine that fired them, not guessed from its audio',
      boardGrains > 0 && bs.measured > 0,
      `${boardGrains} reported by the board, ${bs.measured} drawn, ${bs.inferred} guessed from audio`);

    // 🔴 THE CLAIM plan-twins §4a EXISTS FOR. Two panes side by side are a claim
    // that they are comparable, and until today that claim was false for a
    // reason nothing on the page could see: this end granulated a table of sines
    // and the board granulated whatever instrument was running. Both ends now
    // expand ONE spec with ONE function (`partialsOf`), and the board builds it
    // on its own scsynth.
    //
    // ⚠️ IT ASSERTS THE ENGINE'S OWN ANSWER, not the box's. `engine.voices` and
    // `engine.hz` come back from an `/s_get` to scsynth, which replies only for a
    // node that really exists holding the value it really holds — and the first
    // version of this path reported `node 1002, engineOn true` about a SynthDef
    // that had failed to load, because `Synth.new` allocates an id on the client
    // before the server has read the message.
    const lp = lsrc?.plan?.partials?.length ?? 0;
    d.assert('both granulators are chewing the same description, and the board’s engine says so',
      !!made?.partials && made.partials === lp && made.engine?.voices === SPEC.chord.length,
      made?.partials
        ? `${lp} sine partials here, ${made.partials} on the board, and scsynth answers ${made.engine?.voices} notes at ${Math.round(made.engine?.hz)} Hz`
        : made?.reason ? `the board refused: ${made.reason}` : 'the board has not answered about the material');
    // 🔴 `rate` HAS TO MEAN ONE THING — plan-twins §5, and it is measured here
    // rather than assumed. The board's granulator has eight voices and each can
    // bring up swarm duplicates, so "grains a second" could have meant anything
    // from 1x to 50x the number on the slider. MEASURED over the relay: at
    // `mrate` 8 the engine reported 8.0 grains a second, at 4 it reported 4.0, at
    // 16 it reported 16.0 — one voice is gated by default, so the slider's number
    // IS grains a second on both engines and no division is needed.
    //
    // ⚠️ COUNTED ON THE FAR SIDE. These are the board's own `SendReply` per
    // trigger, not anything this page asked for. Tolerant by a factor of two
    // because a patch can open more voices and because the window starts
    // whenever the first report happens to land.
    // ⚠️ THE FIRST BATCH'S GRAINS FIRED BEFORE THE WINDOW OPENED, so its count
    // is the one dropped rather than an arbitrary one — the span is measured
    // from its arrival, and everything after it happened inside that span.
    const gspan = grainLog.length > 1 ? (grainLog[grainLog.length - 1].t - grainLog[0].t) / 1000 : 0;
    const gsec = gspan > 0.5 ? grainLog.slice(1).reduce((t, g) => t + g.seen, 0) / gspan : 0;
    d.assert('a grain a second means the same thing on both engines',
      gsec > 0 && gsec >= K.rate * 0.4 && gsec <= K.rate * 2.5,
      gspan > 0.5
        ? `${gsec.toFixed(1)} a second reported by the board over ${gspan.toFixed(0)} s, against ${K.rate.toFixed(1)} asked for`
        : 'the board has not reported two batches of grains yet');

    d.assert('a named patch is on screen, chosen rather than rolled',
      !!PATCHES[patch] && step.select.options[step.select.selectedIndex]?.text === PATCHES[patch].name,
      `${PATCHES[patch].name} · ${PATCHES[patch].voice} · ${PATCHES[patch].notes.length} notes`);
  }

  render();
  d.log('press a sound, or ‹ random › for another');
  d.ready();
</script>
</html>
