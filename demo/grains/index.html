<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  @keyframes g-wait {
    0%, 100% { background: color-mix(in oklab, var(--hi)  6%, var(--card2)); }
    50%      { background: color-mix(in oklab, var(--hi) 26%, var(--card2)); }
  }
  .now  { font: 400 12px/1.6 var(--mono); color: var(--dim); margin: 0 0 6px; }
  .now b { color: var(--fg); font-weight: 500; }
  /* The open question, in the place where it is actually being asked. */
  .open { font: 400 12px/1.7 var(--mono); color: var(--dim2); margin: 0 0 14px; max-width: 74ch;
          border-left: 2px solid var(--line2); padding-left: 10px; }

  /* ── the roll, one block per granulator ────────────────────────────────
     Per-half numbers sit under the half they describe, never in a table of
     their own: joining a figure to the thing it is about across two elements
     is what makes a legend necessary. */
  .roll { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
          gap: 1px; background: var(--line); border: 1px solid var(--line);
          border-radius: 4px; overflow: hidden; margin: 0 0 10px; }
  .side { background: var(--card); padding: 10px 12px; min-width: 0; }
  /* ⚠️ NOT `.k`. That is the shell's PIANO KEY — 74 px tall, bordered, its own
     background — and this page appends a real keyboard from the same stylesheet,
     so a label wearing that class drew an empty key inside each block. A page
     that borrows a shared stylesheet borrows its whole namespace. */
  .side .hd { display: block; font: 500 11px/1.4 var(--mono); color: var(--dim2);
              letter-spacing: .06em; text-transform: uppercase; }
  .side .ch { display: block; font: 600 17px/1.5 var(--mono); color: var(--hi); }
  .side .nums { display: block; font: 400 11.5px/1.6 var(--mono); color: var(--dim); }
  /* ⚠️ THE NAME TAKES THE REST OF THE ROW. A selector that keeps its label at
     its own text width leaves a phone with a stepper and an acre of nothing
     beside it — the same complaint as the sliders, one row up. `1fr` here is
     the same fix as `minmax(0,1fr)` there. */
  /* The name is inside the control now, so this row only has to place one
     thing — the two-column grid and `.pick-n` existed to put a label beside a
     stepper, which is what `createPicker` does for itself. */
  .pick { display: flex; align-items: center; margin: 0 0 12px; }
  .drift { font: 400 12px/1.7 var(--mono); color: var(--dim); margin: 0 0 12px; }
  /* ⚠️ NEVER AN EMPTY PAGE. A board that is switched off and a board that is
     playing must not look the same, which is the whole reason this block
     exists — same rule as the chain on /rack/. */
  .none { padding: 22px 14px; text-align: center; font: 500 13px/1.7 var(--mono); color: var(--dim2);
          background: var(--card); border: 1px solid var(--line); border-radius: 4px; margin: 0 0 12px; }
  .none b { display: block; color: var(--fg); font-size: 15px; margin-bottom: 6px; font-weight: 600; }
  .none span { display: block; max-width: 62ch; margin: 0 auto; }
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createSlider, createSliderGroup } from '/shell/slider.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { openWire } from '/shell/wire.mjs';
  import { createKeyboard } from '/shell/keyboard.mjs';

  const q = new URLSearchParams(location.search);
  const ROOM = q.get('room') || 'studio-1';

  const d = mount({
    name: 'grains',
    what: 'A Raspberry Pi holds the last sixty seconds of sound and replays it as thousands of short overlapping fragments. Pick a patch and it starts an instrument, holds a chord and chews it — the sliders move the cloud from there. Everything you hear is made on the board and sent back.',
    // ⚠️ FIVE CELLS, MEASURED RATHER THAN GUESSED. It was eight, and five of
    // those ellipsised — `answe…`, `fluid…`, `shatt…`. A readout cell here is
    // 90 px of text whatever the window does (the page's own measure caps it,
    // not the viewport), which is EIGHT characters at five cells and seven at
    // six, so every value below is nine characters or fewer and the cells were
    // counted backwards from that. The things that would not fit are names
    // rather than numbers — which sound it is, what it is chewing — and they
    // are on the two lines under this row, where they have room and context.
    readout: {
      board: '', sound: '',
      'grains a second': '', 'moved on its own': '', 'round trip': 'ms',
    },
    controls: [{ id: 'on', label: 'Switch it on', primary: true }],
  });
  guard(d);

  // ── state ────────────────────────────────────────────────────────────────
  let me = null;                       // this connection's id, to drop our own echo
  let answered = false, lastHeard = 0, rtt = null, stateAt = 0, stateId = null;
  let wantSource = null;               // a source this page asked the board to start
  let playing = null, onJack = false;  // what the board is sounding, and whether the granulator can reach it
  let fxOn = false, fxWhy = null, fed = null, switching = false;
  let roll = null;                     // the board's current roll: character, seed, every parameter
  let drift = null, rolledAt = 0;
  const driftLog = [];                 // {t, nudges} — every reading, so the window is real
  let probe = null;                    // { quiet, held } — peak with nothing pressed, then with a key down
  let frames = 0, gaps = 0, gapWarned = false, lastSeq = -1, firstFrame = 0, level = 0, levelAt = 0;
  let collect = null;                  // set while a measurement is open

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  // What a seed is supposed to reproduce: the two characters and every
  // continuous parameter of both halves. The same claim pappus-live.mjs makes
  // against the board, made here against the board's own report of itself.
  const settings = (r) => JSON.stringify({ c: r?.character, m: r?.m, n: r?.n });
  /**
   * Every reading of the board's own nudge counter, with the time it was taken.
   *
   * ⚠️ A SINGLE BASELINE VARIABLE WAS NOT ENOUGH, TWICE. Re-taken on every roll,
   * it made the check compare a counter against a baseline set half a second
   * earlier and report a drift that had stopped. Taken once and never again, it
   * was silently thrown away whenever the board answered with no granulator
   * (which happens between switching the insert on and the first roll, and
   * after a restart of the service) and the next reading became a brand new
   * "first" — one run reported 6 nudges in 1 s where 340 in 45 s was the truth.
   * A list cannot have either bug: the window is whatever the page actually
   * watched, and it is reported beside the count.
   */
  function markDrift() {
    if (Number.isFinite(drift?.nudges)) {
      driftLog.push({ t: Date.now(), nudges: drift.nudges });
      if (driftLog.length > 400) driftLog.shift();
    }
  }
  /** How much the board moved on its own, over how long. Null until two readings. */
  function driftMoved() {
    if (driftLog.length < 2) return null;
    const a = driftLog[0], b = driftLog[driftLog.length - 1];
    return { nudges: b.nudges - a.nudges, ms: b.t - a.t };
  }

  // ── the page ─────────────────────────────────────────────────────────────
  // 🔴 NO SOURCE PICKER, AND NO ARCHIVE. This page makes no request to ERR at
  // all: it is somebody else's public archive, it blocked this board's address
  // once after a day of testing, and the relay's broadcast shape meant a reply
  // to ANOTHER listener's search made this page fire its own load — twelve went
  // out for one press. What the grains should be made of is still an open
  // question; it will be answered without a page that can hammer a stranger.
  //
  // Until then the board plays Yoshimi into the granulator and the sliders are
  // the point. Yoshimi rather than the sampled instrument because it is a JACK
  // client the insert can actually wrap, and because it holds a note — a
  // granulator with nothing arriving has nothing to granulate.
  const SOURCE = 'yoshimi';

  const panel = el('div', '');
  d.el.append(panel);

  /**
   * The engine's own knobs. `params.set {cmd, args}` takes a command NAME and
   * numbers; the roll table in pappus.mjs is where these ranges come from, so a
   * slider cannot ask for something a roll would never produce.
   *
   * 🔴 ONE SLIDER, TWO HALVES, AND THE RELATION BETWEEN THEM SURVIVES. The
   * comment here used to claim that sending one value to both "keeps the
   * relation while changing the scale". It does not — it OVERWRITES the
   * relation: `slow drift` loads granulator one at 2.2 grains a second and two
   * at 1.4, and the first drag of the rate slider made both of them the same
   * number. So the patches were built to have two unlike halves, the page said
   * they were unlike, and one touch of any control made them identical. That is
   * why both granulators sounded the same.
   *
   * The slider now moves half one and carries half two with it at the PATCH's
   * own ratio, which is what "changing the scale" was supposed to mean. A ratio
   * needs a non-zero base, so a patch whose half one is 0 keeps the DIFFERENCE
   * instead — `spray` and `strum` are legitimately zero in several patches.
   */
  const KNOBS = [
    ['rate',  0.5, 24,  0.1, '/s',  'how often a grain starts'],
    ['size',  0.02, 0.4, 0.01, 's', 'how long each one lasts'],
    ['spray', 0,   0.5, 0.01, '',   'how far they scatter from the playhead'],
    ['swarm', 0,   0.9, 0.01, '',   'how much they drift apart from each other'],
  ];
  const sliders = new Map();
  const knobRow = createSliderGroup();
  for (const [key, min, max, step, unit, why] of KNOBS) {
    const s = createSlider({
      label: key, min, max, step, unit, value: (min + max) / 3,
      // ⚠️ ON RELEASE, NOT ON EVERY MOVE. A drag is ~60 events a second into a
      // relay whose measured ceiling is 60 msg/s for everything on it — and it
      // drops silently past that, so the last value you let go on would be the
      // one lost. `onChange` sends one message when the hand stops.
      onChange: (v) => {
        if (!fxOn) { d.log('switch the granulator on first', 'warn'); return; }
        const other = partner(key, v);
        setLive(key, v, other);
        send({ type: 'params.set', cmd: `m${key}`, args: [v] });
        send({ type: 'params.set', cmd: `n${key}`, args: [other] });
        d.log(`${key} ${v} and ${round(other)}${unit ? ' ' + unit : ''} — ${why}`);
      },
    });
    sliders.set(key, s);
    knobRow.add(s);
  }
  d.el.append(knobRow.el);

  /**
   * 🔴 SIX FINISHED SOUNDS, NOT SIX DICE. The page used to hand you a random
   * number and nine sliders and call that a choice — every roll landed in the
   * middle of nine ranges, so they all sounded like one wash wearing different
   * digits, and the number on screen meant nothing to anybody.
   *
   * A patch here is the WHOLE sound: which instrument, which chord it holds,
   * and every engine setting for both halves of the granulator. The randomiser
   * picks between these, never between slider positions — a random position is
   * how you get the mid-range wash back.
   *
   * ⚠️ The two halves are deliberately unlike each other. Giving both the same
   * numbers is what made the old roll sound like one thing played twice.
   */
  const PATCHES = [
    { name: 'slow drift', voice: 'pad', notes: [43, 50, 55, 62],
      m: { rate: 2.2, size: 0.30, scan: 0.35, spray: 0.12, swarm: 0.35, tilt: -0.2, delay: 0.35, sos: 0.45, strum: 0.05 },
      n: { rate: 1.4, size: 0.36, scan: 0.60, spray: 0.20, swarm: 0.55, tilt: -0.35, delay: 0.50, sos: 0.55, strum: 0 } },
    { name: 'far choir', voice: 'choir', notes: [48, 55, 60, 64, 67],
      m: { rate: 3.0, size: 0.28, scan: 0.40, spray: 0.25, swarm: 0.30, tilt: -0.1, delay: 0.40, sos: 0.50, strum: 0.1 },
      n: { rate: 1.8, size: 0.38, scan: 0.70, spray: 0.35, swarm: 0.50, tilt: -0.3, delay: 0.55, sos: 0.60, strum: 0 } },
    { name: 'glass rain', voice: 'bells', notes: [72, 76, 79, 84],
      m: { rate: 14, size: 0.050, scan: 0.50, spray: 0.40, swarm: 0.55, tilt: 0.30, delay: 0.30, sos: 0.15, strum: 0.30 },
      n: { rate: 18, size: 0.035, scan: 0.30, spray: 0.50, swarm: 0.70, tilt: 0.45, delay: 0.20, sos: 0.10, strum: 0.40 } },
    { name: 'deep hum', voice: 'pad', notes: [31, 36, 43],
      m: { rate: 0.9, size: 0.38, scan: 0.50, spray: 0.08, swarm: 0.60, tilt: -0.6, delay: 0.50, sos: 0.62, strum: 0 },
      n: { rate: 0.6, size: 0.40, scan: 0.25, spray: 0.15, swarm: 0.80, tilt: -0.7, delay: 0.60, sos: 0.68, strum: 0 } },
    { name: 'wide strings', voice: 'strings', notes: [45, 52, 57, 61, 64],
      m: { rate: 8, size: 0.16, scan: 0.45, spray: 0.30, swarm: 0.45, tilt: 0, delay: 0.35, sos: 0.30, strum: 0.15 },
      n: { rate: 11, size: 0.12, scan: 0.65, spray: 0.42, swarm: 0.60, tilt: 0.1, delay: 0.25, sos: 0.25, strum: 0.25 } },
    { name: 'thin ice', voice: 'kalimba', notes: [67, 72, 74, 79],
      m: { rate: 20, size: 0.030, scan: 0.50, spray: 0.50, swarm: 0.70, tilt: 0.5, delay: 0.20, sos: 0.10, strum: 0.35 },
      n: { rate: 16, size: 0.040, scan: 0.20, spray: 0.55, swarm: 0.85, tilt: 0.4, delay: 0.30, sos: 0.20, strum: 0.45 } },
  ];

  let patch = 0, holding = [];
  // 🔴 WHAT WAS ACTUALLY SENT, not what the patch table says. `render()` drew
  // `PATCHES[patch].m/n` — the values a patch loads — so every slider move left
  // the panel describing settings that had already left the sound. Same shape
  // as the `params.state` bug this page was fixed for once already: a readout
  // answering with something that used to be true.
  // ⚠️ SEEDED FROM THE PATCH, NOT EMPTY. `render()` runs on the first frame that
  // arrives, long before anything is applied, and an empty object put
  // `undefined.toFixed()` on the page's own error line — a readout that starts
  // blank is a readout that throws.
  let live = { m: { ...PATCHES[0].m }, n: { ...PATCHES[0].n } };
  const round = (x) => Math.round(x * 1000) / 1000;
  const clampTo = (key, v) => {
    const k = KNOBS.find(([n]) => n === key);
    return k ? Math.min(k[2], Math.max(k[1], v)) : v;
  };
  /** Half two's value for a slider on half one, at the patch's own relation. */
  function partner(key, v) {
    const p = PATCHES[patch];
    const base = p.m[key], mate = p.n[key];
    if (base > 0 && mate > 0) return round(clampTo(key, v * (mate / base)));
    return round(clampTo(key, v + (mate - base)));
  }
  function setLive(key, mv, nv) { live.m[key] = mv; live.n[key] = nv; }

  /** Release the old chord, load the new instrument, hold the new chord, set both halves. */
  async function applyPatch(i) {
    patch = ((i % PATCHES.length) + PATCHES.length) % PATCHES.length;
    const p = PATCHES[patch];
    step.render();
    for (const n of holding) send({ type: 'note.off', note: n, channel: 0 });
    holding = [];
    send({ type: 'voice.select', voice: p.voice });
    // ⚠️ A BEAT BEFORE THE CHORD. A program change and a note in the same
    // millisecond can land in either order, and a note that arrives first is
    // played by the OUTGOING instrument — which reads as the patch not working.
    await wait(140);
    for (const n of p.notes) { send({ type: 'note.on', note: n, vel: 80, channel: 0 }); holding.push(n); }
    for (const [k, v] of Object.entries(p.m)) send({ type: 'params.set', cmd: `m${k}`, args: [v] });
    for (const [k, v] of Object.entries(p.n)) send({ type: 'params.set', cmd: `n${k}`, args: [v] });
    // A patch is the new truth about both halves, so the panel's source of
    // truth is reset with it.
    live = { m: { ...p.m }, n: { ...p.n } };
    for (const key of ['rate', 'size', 'spray', 'swarm']) sliders.get(key)?.set(p.m[key], true);
    d.log(`${p.name} — ${p.voice}, ${p.notes.length} notes held`, 'hi');
    render();
  }

  // The name IS the control — press it and the six sounds are a list. It used
  // to be a stepper with the name printed beside it as dead text, so the one
  // thing you read had none of the behaviour you wanted from it.
  const step = createPicker({
    label: 'sound',
    what: 'sound',
    prev: () => applyPatch(patch - 1),
    next: () => applyPatch(patch + 1),
    // ⚠️ BETWEEN THE PATCHES, NEVER BETWEEN SLIDER POSITIONS. A random point in
    // nine ranges is the middle of all nine almost every time — one wash, every
    // time, which is the thing this page was before.
    random: () => applyPatch(Math.floor(Math.random() * (PATCHES.length - 1)) + patch + 1),
    onPick: (i) => applyPatch(i),
  });
  step.options(PATCHES.map((p) => p.name), 0);
  step.render = () => step.show(PATCHES[patch].name, patch);
  const patchRow = el('div', 'pick');
  patchRow.append(step.el);
  d.el.append(patchRow);
  step.render();

  const kb = createKeyboard(d.el, {
    base: 60,
    onDown: (note) => { kb.lightNote(note, true); startAudio(); send({ type: 'note.on', note, vel: 100, channel: 0 }); },
    onUp: (note) => { kb.lightNote(note, false); send({ type: 'note.off', note, channel: 0 }); },
  });
  // A gutter carries what this lane MEASURED or what it IS, never instructions.
  // Which of the two things a key does here depends on what is in the buffers,
  // and the two are genuinely different instruments — so it is filled in by
  // render() rather than written once.
  const keyLine = el('p', 'now', '');
  d.el.append(keyLine);

  // ── drawing ──────────────────────────────────────────────────────────────
  const secs = (ms) => `${Math.round(ms / 1000)} s`;
  // The board rounds to three decimals; a tenth of a grain a second is already
  // finer than anyone can hear, and 8.908 in a readout cell reads as precision
  // somebody is claiming rather than as a rate.
  const rate = (side) => (side.rate >= 10 ? side.rate.toFixed(0) : side.rate.toFixed(1));
  function materialShort() {
    if (!answered) return null;
    if (playing) return playing;          // hexter · yoshimi · fluidsynth
    return 'nothing';
  }
  function materialLong() {
    if (!answered) return null;
    if (playing) return [el('b', '', playing), ' · playing into the granulator, and the keys play it'];
    return [el('b', '', 'nothing'), ' · the board has no sound running, so the granulator has an empty recording to read'];
  }

  function render() {
    // ── the readout ──
    // `answers` rather than `answering`, and `1.1+2.1` rather than `1.1 + 2.1`:
    // two characters each, and the difference between a cell that reads and a
    // cell that ends in an ellipsis on a phone. Measured at 390 px.
    d.set('board', answered ? 'answers' : 'silent', answered ? 'ok' : 'bad');
    d.set('round trip', rtt ?? null);
    if (!frames) d.set('sound', 'nothing', answered ? 'bad' : undefined);
    else if (level < 0.002) d.set('sound', 'silent');
    else d.set('sound', `${Math.round(20 * Math.log10(level))} dB`, 'ok');
    d.set('grains a second', roll ? `${rate(roll.m)}+${rate(roll.n)}` : null);
    d.set('moved on its own', drift ? drift.nudges : null);

    // ── the material row ──

    // ── the panel: the roll, or the silence ──
    // ⚠️ FOUR NAMED STATES, NOT TWO, AND THE THIRD ONE COST A RED SUITE. The
    // board can be answering with its granulator NOT RUNNING — which is what a
    // cold board looks like for the forty seconds it spends compiling a
    // two-thousand line engine — and a page that only knows "playing" and
    // "nobody home" describes that as the first one and reads as broken. Each
    // of the four says what it is and what would change it.
    panel.replaceChildren();
    const st = !answered ? 'silent' : switching ? 'warming' : !fxOn ? 'off'
      : !playing ? 'empty' : 'live';
    panel.dataset.state = st;
    if (st !== 'live') {
      const b = el('div', 'none');
      const say = {
        silent: ['Nobody is answering',
          `nothing has replied in “${ROOM}”. The board is a Raspberry Pi that dials out to this room on its own; it has to be `
          + 'switched on and running, and it cannot be woken from here. Everything below would be a number about a sound that '
          + 'is not being made, so there are no numbers.'],
        warming: ['Switching the granulator on',
          'the board is answering. The first time it is asked, it compiles a two-thousand line engine before anything can be '
          + 'heard, which takes about forty seconds; after that a switch is instant.'],
        off: ['The granulator is not in the sound',
          fxWhy ? `the board refused: ${fxWhy}` : 'the board is answering but nothing is granulating yet — press “Switch it on”'],
        // It records its input, so with no input it is reading sixty seconds of
        // silence. That is not a fault and it is not a sound either, and it
        // happens whenever somebody else stops the board's instrument.
        empty: ['Nothing is going into it',
          'the granulator is running and the board has no instrument playing, so all it has to read is the last sixty seconds '
          + 'of silence — press one of the material buttons above'],
        idle: ['Nothing is rolled yet',
          'the granulator is running and has been given no settings, so there is nothing to describe — press “Roll the dice”'],
      }[st];
      b.append(el('b', '', say[0]), el('span', '', say[1]));
      panel.append(b);
      keyLine.textContent = '';
      return;
    }
    // ⚠️ THE PATCH, NOT THE BOARD'S LAST ROLL. `params.state` answers with the
    // last DICE ROLL, and this page no longer rolls — it sets each parameter
    // directly. Drawing the roll's names beside a patch that overwrote them is
    // a readout describing settings that left the sound minutes ago.
    const p = PATCHES[patch];
    const box = el('div', 'roll');
    for (const [k, side] of [['one', live.m], ['two', live.n]]) {
      const s = el('div', 'side');
      // ⚠️ NO PATCH NAME IN HERE. It was printed in BOTH halves and is now in
      // the picker as well — the same two words three times, and the one thing
      // in the block that is identical between the two halves, in a block whose
      // entire job is showing how they differ.
      s.append(el('span', 'hd', `granulator ${k}`),
               el('span', 'nums', `${side.rate} grains a second · each ${Math.round(side.size * 1000)} ms long`
                  + ` · reading ${side.scan.toFixed(2)} of the way through the sixty seconds`));
      box.append(s);
    }
    panel.append(box);
    // What the board has done to the sound since the roll, with nobody asking.
    const moved = driftMoved();
    panel.append(el('p', 'drift', drift?.on
      ? `moving on its own · ${moved ? `${moved.nudges} nudges in the ${secs(moved.ms)} this page has been watching` : 'no reading yet'}`
        + ', none of them asked for'
        + ` · the slow one is reading at ${drift.scan ?? '—'} of the way through the sixty seconds`
      : 'not moving on its own — the drift is switched off on the board'));
    keyLine.textContent = 'the keys play whatever is going into the granulator';
  }

  // ── audio out of this page ───────────────────────────────────────────────
  let ctx = null, playout = null;
  async function startAudio() {
    if (ctx) return;
    try { await openAudio(); }
    // ⚠️ NEVER LET THE SPEAKERS TAKE THE PAGE DOWN. Everything measured here is
    // read off the socket, so a browser that will not give this page an audio
    // output still answers every question the page asks — but an unhandled
    // rejection would reach guard() and mark the whole demo failed.
    catch (e) { ctx = null; d.log(`no sound out of this page: ${e.message}`, 'bad'); }
  }
  async function openAudio() {
    // ⚠️ ASK FOR 48 kHz. The board fixes 48000 and the worklet writes those
    // samples into a ring drained at this context's own rate, so on a 44.1 kHz
    // output the pitch is wrong by the ratio AND the ring overruns several
    // times a second — periodic clicking, with every counter on this page
    // reading green throughout.
    ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000, latencyHint: 'interactive' });
    if (ctx.sampleRate !== 48000) {
      d.log(`this browser runs audio at ${ctx.sampleRate} Hz and the board sends 48000 — pitch will be off by `
            + `${(48000 / ctx.sampleRate).toFixed(3)}x and you will hear clicks`, 'bad');
    }
    // ⚠️ Fire and move on. resume() waits on a user gesture in a real browser
    // and never rejects, so awaiting it is a hang rather than an error — and
    // the measurements below do not need it, because they read the frames off
    // the socket rather than out of the speakers.
    ctx.resume().catch(() => {});
    await ctx.audioWorklet.addModule('/proto/jam/playout-worklet.js');
    playout = new AudioWorkletNode(ctx, 'pcm-playout', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [1] });
    playout.connect(ctx.destination);
    playout.port.postMessage({ cmd: 'floor', ms: 60, adaptive: false });
  }

  function onPcm(buf) {
    const s = new DataView(buf).getUint32(0, true);
    if (lastSeq >= 0 && s > lastSeq + 1) gaps += s - lastSeq - 1;
    lastSeq = s; frames++;
    // Audio is the board too, and the loudest possible proof of it: a room with
    // nothing in it cannot produce a PCM frame.
    lastHeard = Date.now();
    if (!firstFrame) { firstFrame = performance.now(); answered = true; render(); }
    const pcm = new Int16Array(buf, 12);
    const f32 = new Float32Array(pcm.length);
    let peak = 0;
    for (let i = 0; i < pcm.length; i++) { const v = pcm[i] / 32768; f32[i] = v; const a = v < 0 ? -v : v; if (a > peak) peak = a; }
    // ⚠️ THE LEVEL IS THE ONLY THING THAT CAN TELL A WORKING STREAM FROM A
    // STREAM OF DIGITAL SILENCE, and this project has read three numbers wrong
    // for exactly that reason. It decays rather than resetting, so a cloud
    // between grains does not read as a dead board.
    const t = performance.now();
    level = Math.max(peak, level * Math.pow(0.5, (t - levelAt) / 400));
    levelAt = t;
    collect?.(peak);
    playout?.port.postMessage({ pcm: f32 }, [f32.buffer]);
    // Fifty frames a second is ONE source. Anything missing is the relay's own
    // bucket dropping them — which is what two instruments streaming into one
    // socket sounds like — and the sender is told nothing at all when that
    // bites, so a counter here is the only place it can be seen.
    if (!gapWarned && frames > 250 && gaps > frames * 0.02) {
      gapWarned = true;
      const fps = frames / Math.max(0.001, (performance.now() - firstFrame) / 1000);
      d.log(`${gaps} frames never arrived out of ${frames + gaps}, and ${fps.toFixed(0)} a second are getting through`
            + ' — the relay is dropping them, and it sounds like clicks', 'bad');
    }
    if (frames % 25 === 0) render();
  }

  /** Loudest thing that arrives in a window. Resolves a number, always. */
  async function listen(ms) {
    let p = 0;
    collect = (v) => { if (v > p) p = v; };
    await wait(ms);
    collect = null;
    return p;
  }

  // ── the socket ───────────────────────────────────────────────────────────
  // openWire rather than a hand-rolled socket: it reconnects, it mints a new
  // `from` per connection, and it refuses to send a payload field that the
  // envelope would overwrite — which is the bug that made `source.load`'s only
  // control silently do nothing for a day.
  const waiters = [];
  const wire = openWire(ROOM, {
    onOpen: (from) => { me = from; d.log(`joined ${ROOM}`, 'hi'); hello(); send({ type: 'audio.status' }); },
    onClose: () => { d.log('socket closed — reconnecting'); },
    onMessage: (got) => {
      if (got.kind === 'binary') { onPcm(got.data); return; }
      if (got.kind !== 'json' || got.msg.from === me) return;
      heard(got.msg);
    },
  });
  const send = (m) => !!wire.send(m);
  /**
   * Send, and keep the id that went out.
   *
   * ⚠️ FOLLOWING THE BOARD'S ANSWERS IS RIGHT; ACTING ON SOMEBODY ELSE'S IS NOT,
   * and the difference cost twelve requests to a stranger's archive. The relay
   * broadcasts, so a reply to another listener's `source.search` arrives here
   * too — and this page's handler turned every one of them into a `source.load`
   * of its own. Twelve loads went out for one press, each one a minute of ERR's
   * bandwidth, which is precisely how this board got itself blocked once
   * already. State may be read from any of the board's answers; an ACTION may
   * only follow an answer to a question this page asked, which is what `re` is
   * for. `wire.send` hands back the exact line, so the id is readable from it.
   */
  const sendId = (m) => { const out = wire.send(m); return out?.sent ? JSON.parse(out.line).id : null; };

  /**
   * The heartbeat, and the round trip, on one message.
   *
   * ⚠️ NOT `box.ping`. The board's pong is `reply('box.pong', { at: … })` and
   * `at` is an envelope field, so the envelope refuses to format it and the
   * handler throws — asked directly, the board answers `box.error: "at" is an
   * envelope field`. So the obvious round trip verb answers NOTHING on the
   * board as it runs today, and a page timing it reads an empty cell forever.
   * `params.state` is the cheapest verb that always answers, answers with no
   * work behind it, and is worth asking anyway — so the round trip is timed on
   * a question this page was going to ask regardless.
   */
  function hello() {
    stateAt = performance.now();
    stateId = sendId({ type: 'params.state' });
  }

  /**
   * Wait for the next reply of a type. Resolves null on a timeout rather than
   * hanging: a page that waits forever looks like a page that is still loading,
   * and "nobody answered" is the answer this page most often has to give.
   */
  function waitFor(type, ms, re = null) {
    return new Promise((resolve) => {
      const w = { type, re, resolve };
      w.timer = setTimeout(() => { waiters.splice(waiters.indexOf(w), 1); resolve(null); }, ms);
      waiters.push(w);
    });
  }
  async function ask(msg, type, ms = 8000) {
    // The id first, so the wait is for THIS answer rather than for the next
    // message of the same shape — which on a shared board can be the reply to
    // somebody else's question, or their question itself.
    const id = sendId(msg);
    if (!id) return null;
    return waitFor(type, ms, id);
  }

  /**
   * ⚠️ A QUESTION AND ITS ANSWER CARRY THE SAME `type` ON THIS RELAY, AND THAT
   * IS NOT A DETAIL — it is the bug that made this page report "10 nudges in
   * 1 s" about a board that had moved 2,800 times. The relay is a broadcast:
   * every client sees every other client's traffic, and the box answers
   * `{type:'params.state', ok, roll, drift}` to a request that is itself
   * `{type:'params.state'}`. So another listener merely ASKING looked exactly
   * like the board answering with no granulator, and this page dutifully wiped
   * everything it knew. Measured on the live room: nine `params.state` messages
   * in four seconds, four of them other people's questions.
   *
   * The box stamps every answer with `re`, the id of the message it answers —
   * which is how `pappus-live.mjs` has always matched replies — and its four
   * unprompted announcements are named here. Nothing else is the board talking.
   */
  const ANNOUNCED = new Set(['box.hello', 'box.alive', 'audio.stopped', 'video.stopped']);
  const fromBox = (m) => typeof m.re === 'string' || ANNOUNCED.has(m.type);

  function heard(m) {
    if (!fromBox(m)) return;           // somebody else asking the board something
    answered = true; lastHeard = Date.now();
    // The board says this every five seconds with nobody asking, which makes it
    // the cheapest liveness there is — and it names what is sounding, so an
    // instrument somebody else starts shows up here without this page polling
    // for it. Only a CHANGE costs a question.
    if (m.type === 'box.alive') {
      if ((m.audio ?? null) !== playing) send({ type: 'audio.status' });
      if (!m.audio) playing = null;
    }
    if (m.type === 'audio.stopped') { playing = null; send({ type: 'audio.status' }); }
    if (m.type === 'box.hello') { d.log(`${m.name || 'the board'} is here`, 'hi'); hello(); send({ type: 'audio.status' }); }
    if (m.type === 'audio.started') {
      const was = playing;
      if (m.ok) {
        playing = m.source;
        // An insert can only reach what is on the board's audio graph. The
        // board reports that about the source rather than the page keeping a
        // list of names, which is a list somebody always forgets to extend.
        onJack = m.jack === true;
        fxOn = m.fx === 'pappus';
        if (m.source !== was) d.log(`the board is playing ${m.source}${onJack ? '' : ' — which the granulator cannot reach'}`, 'hi');
      } else {
        playing = null;
        if (m.reason !== 'nothing playing') d.log(`the board could not start it: ${m.reason}`, 'bad');
      }
      // ⚠️ ONLY A REPLY ABOUT THE THING THAT WAS ASKED FOR STOPS THE WAITING
      // MARK. This used to clear it on any `audio.started`, and the four-second
      // heartbeat is an `audio.status` — so a press of an instrument button went
      // back to looking idle a moment later while the board was still raising
      // the chain, which reads as a dead button.
      if (wantSource && (m.source === wantSource || !m.ok)) {
        wantSource = null;
      }
    }
    if (m.type === 'fx.pappus') {
      fxOn = !!m.on; fxWhy = m.ok ? null : m.reason; fed = m.fed ?? null;
      d.log(m.ok ? (fxOn ? 'the granulator is in the sound' : 'the granulator is out of the sound') : `the granulator refused: ${m.reason}`,
            m.ok ? 'hi' : 'bad');
    }
    if (m.type === 'params.rolled' && m.ok) {
      roll = m; drift = m.drift ?? drift; rolledAt = Date.now();
      markDrift();
      d.log(`${m.character.m}/${m.character.n} · ${rate(m.m)} and ${rate(m.n)} grains a second · number ${m.seed}`, 'hi');
    }
    if (m.type === 'params.state') {
      // Timed only when it answers THIS page's own question; the state below is
      // absorbed from anybody's, because that is the board describing itself.
      if (stateAt && m.re === stateId) { rtt = Math.round(performance.now() - stateAt); stateAt = 0; stateId = null; }
      fxOn = !!m.ok;
      // ⚠️ FOLLOW THE BOARD DOWN AS WELL AS UP, AND THIS WAS FOUND THE REAL
      // WAY: the box service restarted underneath a run, and the page went on
      // printing a character, a grain rate and a nudge count for an engine that
      // was no longer running — a readout about a sound nobody could hear. The
      // board reporting no roll IS the answer, so it is taken as one.
      //
      // The 1.5 s is for the other order: a heartbeat asked a moment before a
      // roll landed answers with the PREVIOUS settings, and letting that
      // overwrite a fresh roll would blank the page for four seconds after
      // every press.
      if (Date.now() - rolledAt > 1500) {
        roll = m.roll ?? null;
        drift = m.drift ?? null;
        // A granulator that went away takes its history with it; anything else
        // would be counting across two different engines.
        if (!drift && !fxOn) driftLog.length = 0;
        else markDrift();
      }
    }
    if (m.type === 'params.drifted') drift = m;
    // The board picks the item; this page only says which. The search cannot be
    // called from a browser at all — its JSON content type forces a preflight
    // that the archive answers 204 with no permission header — so the board is
    // the only end that can ask.

    for (const w of [...waiters]) {
      if (w.type !== m.type || (w.re && m.re !== w.re)) continue;
      clearTimeout(w.timer);
      waiters.splice(waiters.indexOf(w), 1);
      w.resolve(m);
    }
    render();
  }

  // The board is an object, not a session: it can be switched off, restarted or
  // taken to another room while this page is open, and a page that goes on
  // showing the last numbers it saw is a page lying about the present.
  setInterval(() => {
    if (wire.state() === 1) hello();
    if (answered && Date.now() - lastHeard > 12000) {
      answered = false; rtt = null;
      d.log('the board stopped answering', 'bad');
      render();
    }
  }, 4000);

  // ── the material row's actions ───────────────────────────────────────────

  // ── the controls ─────────────────────────────────────────────────────────
  d.on('on', async () => {
    startAudio();
    // ⚠️ A WINDOW, NOT A RACE. Nobody answering is a real answer here, so this
    // waits a bounded time and then reports silence rather than waiting forever
    // and looking like it is still loading.
    for (let i = 0; i < 20 && !answered; i++) await wait(250);
    if (!answered) {
      d.log(`nothing answered in “${ROOM}” — the board is not in this room`, 'warn');
      render();
      return;
    }
    // Something has to be going into it, or it granulates an empty recording
    // and the page is honestly, uselessly silent.
    const st = await ask({ type: 'audio.status' }, 'audio.started', 6000);
    if (st && !st.ok) {
      d.log('nothing was playing — starting the sampled instrument so there is something to chew', 'hi');
      wantSource = SOURCE;
      await ask({ type: 'audio.start', source: 'fluidsynth' }, 'audio.started', 60000);
    }
    // First time this is asked of a cold board it compiles a two-thousand line
    // engine, about forty seconds; after that it is a re-patch. `switching` is
    // what lets the page say THAT rather than "it is off", which is the same
    // sentence about two different situations.
    switching = true; render();
    const fx = await ask({ type: 'fx.pappus', on: true }, 'fx.pappus', 90000);
    switching = false;
    if (!fx) { d.log('the granulator did not answer in ninety seconds', 'warn'); render(); return; }
    if (!fx.ok) { render(); return; }
    // ⚠️ ADOPT BEFORE ROLLING. The board is shared and it keeps playing with
    // nobody connected: if it already has settings, taking them over would
    // change the sound under whoever is listening for no reason the page could
    // name. A roll happens when there is nothing to adopt, or when asked for.
    const state = await ask({ type: 'params.state' }, 'params.state', 6000);
    void state;
    await applyPatch(patch);
    // ⚠️ MEASURE THE SOUND, NOT THE FRAME COUNT. A stream of digital silence
    // arrives at exactly the rate a working one does, so this holds a key and
    // compares what comes back against what was coming back before it — the
    // same before-and-after the box's own live test uses, and the only thing
    // on this page that crosses the whole chain.
    const quiet = await listen(900);
    send({ type: 'note.on', note: 60, vel: 100, channel: 0 });
    const held = await listen(1800);
    send({ type: 'note.off', note: 60, channel: 0 });
    probe = { quiet, held };
    // ⚠️ SAY WHICH OF THE TWO THE NUMBERS MEAN. A cloud that was already
    // droning is often LOUDER before the key than during it, and printing the
    // pair without saying so reads as a failure on a working board.
    d.log(`holding a key: ${held.toFixed(4)} against ${quiet.toFixed(4)} with nothing pressed — `
          + (quiet <= 0.002 ? 'the key is what started it' : 'it was already droning, which is what a cloud does'),
          held > 0.002 ? 'hi' : 'bad');
    render();
    checkAll();
  });

  function checkAll() {
    d.assert('the page reached the relay', wire.state() === 1, `readyState ${wire.state()}`);
    // ⚠️ ONE BRANCH PER NAMED STATE, AND THE COUNT MOVES WITH IT. This board is
    // shared and it keeps running with nobody connected, so "answering" is not
    // one condition: it can be compiling its engine, refusing the insert, or
    // playing nothing at all into it — and asserting a running instrument's
    // numbers in those states reported four failures about a board that was
    // fine. Each state asserts what it can answer for and says which it was.
    // Diff the count against the BRANCH: silent 4, answering-but-not-sounding 5,
    // sounding 8 — 10 with the two rolls.
    const st = panel.dataset.state;
    const why = {
      silent: 'the board is silent, and the page says so',
      warming: 'the granulator is still compiling on the board — about forty seconds the first time',
      off: `the granulator is not in the sound: ${fxWhy ?? 'nothing has switched it on'}`,
      empty: 'the granulator is running with no instrument playing into it',
      idle: 'the granulator is running with nothing rolled',
      live: 'the board is answering and set up',
    }[st];
    d.assert('it says which of the two it is in', answered ? st !== 'silent' : st === 'silent', why);
    if (!answered) {
      d.assert('silence is reported as silence, not as an instrument that makes none',
        panel.textContent.includes('Nobody is answering'), 'the panel names the silence');
      d.assert('no sound is claimed that never arrived',
        frames === 0 && d.api.readout.sound === 'nothing' && roll === null && level === 0,
        `${frames} frames, sound cell “${d.api.readout.sound}”, nothing rolled`);
      return;
    }
    d.assert('the board answered in this room', Number.isFinite(rtt), `${rtt} ms out to the board and back`);
    d.assert('the page says what the grains are made of', !!materialShort(), String(materialShort()));
    if (st !== 'live') {
      // Not a pass dressed as one. The claim is that the page NAMES the state
      // it is in — the same claim the silent branch makes — rather than drawing
      // an instrument's numbers for a sound nobody is making.
      d.assert('it says why there is nothing to hear yet, rather than printing numbers for a sound nobody is making',
        panel.textContent.length > 40, why);
      return;
    }
    d.assert('the granulator is switched on, with something playing into it',
      fxOn && !!playing, `wrapping ${playing}${fed === false ? ' — nothing feeding it' : ''}`);
    d.assert('the two halves are set differently, which is what stops one flat wash',
      PATCHES[patch].m.rate !== PATCHES[patch].n.rate && PATCHES[patch].m.size !== PATCHES[patch].n.size,
      `${PATCHES[patch].m.rate} against ${PATCHES[patch].n.rate} grains a second`);
    // The claim the whole page rests on: this is sound that was made on a
    // machine somewhere else and came back, not a page making a noise.
    d.assert('sound comes back from the board while a key is held',
      !!probe && probe.held > 0.002,
      probe ? `${probe.held.toFixed(4)} with a key down, ${probe.quiet.toFixed(4)} without`
        + (probe.quiet <= 0.002 ? ' — the key started it' : ' — it was already droning')
        : 'no key has been held yet — press “Switch it on”');
    // Nothing that changes the sound was sent between these two readings. The
    // page asked the board what it was doing, which is a question, not a knob.
    const moved = driftMoved();
    d.assert('the board keeps moving the sound, and nobody asked it to',
      drift?.on === true && moved !== null && moved.nudges > 0,
      drift?.on ? `${moved ? `${moved.nudges} nudges in ${secs(moved.ms)}` : 'only one reading so far'}, reading at ${drift.scan}`
        : 'the drift is switched off on the board');
    d.assert('a named patch is on screen, chosen rather than rolled',
      !!PATCHES[patch] && step.select.options[step.select.selectedIndex]?.text === PATCHES[patch].name,
      `${PATCHES[patch].name} · ${PATCHES[patch].voice} · ${PATCHES[patch].notes.length} notes`);
  }

  render();
  d.log('press a sound, or ‹ random › for another');
  d.ready();
</script>
</html>
