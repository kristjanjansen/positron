<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON · notes</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="icon" href="/favicon.ico">
<style>
  .md { max-width: 100%; }
  .md h1 { font: 600 20px/1.25 var(--mono); margin: 0 0 4px; }
  .md h2 { font: 600 15px/1.3 var(--mono); color: var(--hi); margin: 30px 0 8px; }
  .md h3 { font: 600 13.5px/1.3 var(--mono); margin: 20px 0 6px; }
  .md p { margin: 0 0 12px; color: var(--fg); }
  .md ul, .md ol { margin: 0 0 12px; padding-left: 20px; }
  .md li { margin: 0 0 6px; }
  .md li::marker { color: var(--dim2); }
  .md code {
    font: 500 12.5px/1.5 var(--mono); background: var(--card2);
    border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; color: #d7dde6;
  }
  .md pre {
    background: var(--card); border: 1px solid var(--line); border-radius: 4px;
    padding: 12px; overflow-x: auto; margin: 0 0 12px;
  }
  .md pre code { background: none; border: 0; padding: 0; font-size: 12px; line-height: 1.65; }
  .md a { color: var(--hi); }
  .md strong { color: #f4f4f5; }
  .md em { color: var(--dim); font-style: italic; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }
  .md blockquote {
    margin: 0 0 12px; padding: 8px 14px; border-left: 2px solid var(--hi);
    background: var(--card); color: var(--dim);
  }
  .md blockquote p:last-child { margin: 0; }
  .md .tw { overflow-x: auto; margin: 0 0 14px; border: 1px solid var(--line); border-radius: 4px; }
  .md table { border-collapse: collapse; width: 100%; min-width: 420px; font-size: 13.5px; }
  .md th {
    text-align: left; font: 600 10px/1.4 var(--mono); letter-spacing: .12em;
    text-transform: uppercase; color: var(--dim2); padding: 9px 12px;
    background: var(--card2); border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  .md td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .md tbody tr:last-child td { border-bottom: 0; }
</style>

<div class="d-head">
  <a class="d-back" href="/">← demos</a>
  <div class="d-title"><h1 class="d-name" id="t">notes</h1></div>
</div>
<div class="md" id="md">loading…</div>

<script type="module">
  // A small markdown renderer. Enough for these notes — headings, lists,
  // tables, code, quotes, inline marks — and nothing more.
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`)
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[\s(])\*([^*]+)\*/g, '$1<em>$2</em>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" rel="noopener">$1</a>');
  }

  function render(src) {
    const out = [];
    const lines = src.split('\n');
    let i = 0;
    while (i < lines.length) {
      const l = lines[i];

      if (/^```/.test(l)) {                                  // fenced code
        const buf = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
        i++;
        out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`);
        continue;
      }
      if (/^\|/.test(l) && /^\|[\s:|-]+\|?\s*$/.test(lines[i + 1] || '')) {   // table
        const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
        const head = cells(l);
        i += 2;
        const body = [];
        while (i < lines.length && /^\|/.test(lines[i])) body.push(cells(lines[i++]));
        out.push('<div class="tw"><table><thead><tr>'
          + head.map((h) => `<th>${inline(h)}</th>`).join('')
          + '</tr></thead><tbody>'
          + body.map((r) => '<tr>' + r.map((c) => `<td>${inline(c)}</td>`).join('') + '</tr>').join('')
          + '</tbody></table></div>');
        continue;
      }
      if (/^#{1,3}\s/.test(l)) {                             // heading
        const n = l.match(/^#+/)[0].length;
        out.push(`<h${n}>${inline(l.slice(n + 1))}</h${n}>`);
        i++; continue;
      }
      if (/^>\s?/.test(l)) {                                 // blockquote
        const buf = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ''));
        out.push(`<blockquote><p>${inline(buf.join(' '))}</p></blockquote>`);
        continue;
      }
      if (/^\s*[-*]\s/.test(l) || /^\s*\d+\.\s/.test(l)) {   // list
        const ordered = /^\s*\d+\.\s/.test(l);
        const buf = [];
        while (i < lines.length && (/^\s*[-*]\s/.test(lines[i]) || /^\s*\d+\.\s/.test(lines[i]))) {
          buf.push(lines[i++].replace(/^\s*(?:[-*]|\d+\.)\s/, ''));
        }
        const tag = ordered ? 'ol' : 'ul';
        out.push(`<${tag}>` + buf.map((b) => `<li>${inline(b)}</li>`).join('') + `</${tag}>`);
        continue;
      }
      if (/^---+\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
      if (!l.trim()) { i++; continue; }

      const buf = [];                                        // paragraph
      while (i < lines.length && lines[i].trim() && !/^(#{1,3}\s|>|\||```|---+\s*$|\s*[-*]\s|\s*\d+\.\s)/.test(lines[i])) {
        buf.push(lines[i++]);
      }
      out.push(`<p>${inline(buf.join(' '))}</p>`);
    }
    return out.join('\n');
  }

  // The path IS the address — /notes/hardware-box — and there is no query
  // fallback. Two ways to name one thing is two things to keep working, and the
  // one nobody links to is the one that quietly rots.
  const fromPath = location.pathname.match(/^\/notes\/([a-z0-9-]+)\/?$/);
  const doc = (fromPath && fromPath[1]) || 'uuu-positron';
  const safe = /^[a-z0-9-]+$/.test(doc) ? doc : 'uuu-positron';
  try {
    const r = await fetch(`/notes/${safe}.md`, { cache: 'no-store' });
    if (!r.ok) throw new Error(`${r.status}`);
    const src = await r.text();
    // The leading h1 becomes the PAGE title, so rendering it again in the body
    // printed the heading twice. Strip it from the body instead.
    const h1 = src.match(/^#\s+(.+)$/m);
    const body = h1 ? src.replace(/^#\s+.+$/m, '') : src;
    document.getElementById('md').innerHTML = render(body);
    if (h1) { document.getElementById('t').textContent = h1[1]; document.title = `POSITRON · ${h1[1]}`; }
  } catch (e) {
    document.getElementById('md').innerHTML = `<p>could not load <code>${safe}.md</code> — ${e.message}</p>`;
  }
</script>
</html>
