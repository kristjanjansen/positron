<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* 🔴 EVERY BOX HERE HAS A RESERVED HEIGHT, because all of them are filled by
     something that arrives over a network a second or two after the press. A
     page whose blocks appear one at a time moves the thing under the reader's
     hand twice. */
  .wish-said, .wish-patch, .wish-why, .wish-dg { min-width: 0; }
  .wish-patch { overflow-x: auto; }
  /* 🔴 THE TRANSCRIPTION IS EDITABLE AND ITS HEIGHT IS FIXED. A textarea that
     grows with its content is the one thing this project has a rule against,
     so it scrolls instead. `resize: none` for the same reason: a corner a
     reader can drag is a block that changes the page's height. */
  .wish-said {
    display: block; width: 100%; height: 64px; resize: none; overflow-y: auto;
    padding: 8px 12px; border: 1px solid var(--line); border-radius: 4px;
    background: var(--card); color: var(--ink);
    font-family: inherit; font-size: 15px; line-height: 1.45;
  }
  .wish-patch {
    /* `pre-wrap` and not `pre`: a long object wraps instead of running off the
       right edge, and what was off the edge was the evidence. It changes height
       when an answer lands, which is a human-paced change rather than a clock,
       and is the case the no-twitch rule explicitly allows. */
    min-height: 62px; white-space: pre-wrap; overflow-wrap: anywhere; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 4px; background: var(--card);
    font: 12px/1.6 var(--mono, ui-monospace, monospace); color: var(--ink);
  }
  .wish-why { min-height: 20px; font-size: 13px; color: var(--dim); }
  .wish-why b { color: var(--bad, #e0908a); font-weight: 600; }
  .wish-why i { color: var(--ok, #8fd6a8); font-style: normal; }
  .wish-why-l { color: var(--ink); }
  .wish-rows { display: flex; flex-direction: column; gap: 6px; }

  /* 🔴 THE PICTURE'S ROOM IS TAKEN BEFORE THERE IS A PICTURE. It is redrawn
     after a two model round trip, and a box that appears then would shove the
     log and everything under it down the page. The number is MEASURED rather
     than guessed, and the page asserts it fits in every state: 249 px with no
     arrows, where the drawer stacks all three instruments in one column, and
     184 px once an arrow puts one of them in a second column.
     ⚠️ It holds the whole desk from the first paint rather than nothing, so
     there is no empty bordered box here either.
     ⚠️ AND IT IS CENTRED IN ITS OWN BOX, because the tallest state is the one
     with no answer in it: without this the picture would sit against the top
     and leave 65 px of nothing under it for every run that succeeds. */
  .wish-dg {
    min-height: 252px; display: flex; flex-direction: column; justify-content: center;
  }
  /* Not `.pos-body > .pos-dg`: that 44 px belongs to the standing `How it
     works` picture, which opens a section at the end of a page. This one is a
     result and sits with the JSON it draws, so it keeps the ordinary rhythm. */
  .wish-dg .pos-dg { margin-top: 0; }

  /* 🔴 NO SPINNER ON HOVER. Asked 2026-09-21: *"rm spinner on hover"*.
     `shell.css` gives every busy control `cursor: progress`, which macOS draws
     as a spinning wheel beside the pointer, so the one control on this page a
     person holds down had a spinner under their hand for the whole press.
     🔴 AND NO DOT EITHER, ASKED THE SAME DAY: *"rm dot from hold to talk"*. A
     voice level dot was asked for first and then withdrawn, so the button
     carries no indicator of its own at all. The `data-busy` sweep, which is
     paint on the button rather than something added to it, is the whole signal
     and it runs from the press until the answer lands.
     ⚠️ SPECIFICITY RATHER THAN ORDER, WHICH IS THE WEAKER FIX AND IS THE ONLY
     ONE AVAILABLE: the rule being beaten is in a shared stylesheet this page
     cannot reorder. `button[data-busy="1"]` is (0,1,1) and this is (0,2,1). */
  .pos-controls button[data-busy="1"] { cursor: default; }
</style>
<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createChoice } from '/shell/choice.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createBay, printLink, checkTransforms, delivers } from '/shell/bay.mjs';
  import { createDiagram } from '/shell/diagram.mjs';

  /**
   * 🔴 SAY WHAT YOU WANT AND THE DESK PROPOSES A PATCH. Asked 2026-09-21:
   * *"Can we have a demo called Wish? Where I can input voice uh, commands and
   * you are translating them to a batch pay via the models from Cloudflare,
   * maybe even try out different models."*
   *
   * 🔴 **IT PROPOSES AND IT NEVER CONNECTS, AND THAT IS NOT CAUTION, IT IS THE
   * MEASUREMENT.** Run against the real models and the real desk on the day this
   * was built: asked to put the mod wheel on the master filter, the 70B returned
   * a perfectly valid patch pointed at the **wrong instrument**. Nothing in a
   * validator can catch that, because there is nothing invalid about it. What
   * catches it is somebody reading one line of text.
   *
   * ⚠️ **NOTHING HERE REACHES CLOUDFLARE UNTIL A PRESS, AND NOTHING REACHES IT
   * UNDER THE HARNESS AT ALL.** It is somebody's account, and a suite run is
   * dozens of Chromes. The checks below run on a canned reply.
   */

  /** Where the agent is. `node demo/wish-local.mjs` puts it here. */
  const API = new URLSearchParams(location.search).get('api') || 'http://127.0.0.1:8799';

  /**
   * 🔴 THE DESK, DESCRIBED RATHER THAN DISCOVERED, AND THAT IS DELIBERATE ON
   * THIS PAGE. `/bay/` reads the browser's own MIDI ports and therefore needs a
   * permission and an instrument; this page is about the sentence, so it carries
   * the desk that was measured, and every id is the one `/bay/` would build for
   * the same device.
   */
  /**
   * ⚠️ `box` IS DECLARED RATHER THAN DERIVED, and the Model 12 is why. Its two
   * ports are called `Model 12 MIDI IN` and `Model 12 MIDI OUT`, so the middle
   * segment of their ids differs and the two halves of one instrument cannot be
   * recognised as one by splitting an id. Stripping the words off the labels
   * would work until a device is renamed, which is the thing a label does.
   */
  const PORTS = [
    { id: 'here:mk-425c-usb-midi-keyboard:out', dir: 'out', box: 'keys', label: 'MK-425C USB MIDI Keyboard' },
    { id: 'here:circuit:out', dir: 'out', box: 'circuit', label: 'Circuit' },
    { id: 'here:model-12-midi-in:out', dir: 'out', box: 'model12', label: 'Model 12 MIDI IN' },
    { id: 'here:circuit:in', dir: 'in', box: 'circuit', label: 'Circuit' },
    { id: 'here:model-12-midi-out:in', dir: 'in', box: 'model12', label: 'Model 12 MIDI OUT' },
    { id: 'here:mk-425c-usb-midi-keyboard:in', dir: 'in', box: 'keys', label: 'MK-425C USB MIDI Keyboard' },
  ];
  const PORT = new Map(PORTS.map((p) => [p.id, p]));
  /** Measured facts, handed to the model because no manual carries them. */
  const FACTS = 'The MK-425C keyboard sends on MIDI channel 2 and its keys are one semitone '
    + 'flat. The Circuit listens for Synth 1 on channel 1, Synth 2 on channel 2, drums on '
    + 'channel 10 at notes 60, 62, 64 and 65, and its master filter on channel 16. The '
    + 'Circuit has no factory reset, so it is never sent SysEx.';

  /** What each port consents to. The Circuit's line is the one that matters. */
  /**
   * 🔴 TWO LISTS, NOT ONE. `accepts` is what a port handles and anything else is
   * dropped at the boundary with the link saying so; `never` refuses the link
   * outright. The Circuit's SysEx line is on the second list because that device
   * has no factory reset.
   */
  const ACCEPTS = {
    'here:circuit:in': ['note', 'cc', 'bend'],
    'here:model-12-midi-out:in': ['note', 'cc'],
    'here:mk-425c-usb-midi-keyboard:in': [],
  };
  const NEVER = ['sysex'];
  const EMITS = ['note', 'cc', 'bend', 'touch', 'program', 'clock'];

  /**
   * 🔴 ALL THREE OF THESE WORK, AND FOR A WHILE TWO OF THEM COULD NOT. Reported
   * 2026-09-21: choosing `whisper` answered a schema mismatch, because one
   * payload shape was being sent to three models that do not share one. `turbo`
   * takes base64, the two older ones take an array of bytes, and `turbo` was the
   * default, so nothing had ever pressed the other two.
   * ✅ MEASURED on one 12,863 byte recording of the same sentence, after the
   * repair: all three returned it word for word, in 1.2 s, 1.3 s and 1.7 s.
   * ⚠️ THE DIFFERENCE SHOWS UP ON LENGTH. On 79 s of speech `turbo` returned
   * 1,653 characters in 11.0 s and `whisper` returned 839 in 29.1 s, so the
   * older one transcribed about half the recording and took nearly three times
   * as long. A byte array also costs 3.57 bytes of request per byte of audio
   * against base64's 1.34, which is 2.67 times the body for the same words.
   * ⚠️ AND VOICE ACTIVITY DETECTION IS `turbo`'s ALONE: the other two take no
   * options at all, so nothing tells them to ignore a synth in the room.
   */
  const HEAR = [['turbo', '@cf/openai/whisper-large-v3-turbo'],
                ['whisper', '@cf/openai/whisper'],
                ['tiny', '@cf/openai/whisper-tiny-en']];
  const THINK = [['70B', '@cf/meta/llama-3.3-70b-instruct-fp8-fast'],
                 ['8B', '@cf/meta/llama-3.1-8b-instruct-fp8-fast'],
                 ['3B', '@cf/meta/llama-3.2-3b-instruct'],
                 ['Mistral', '@cf/mistralai/mistral-small-3.1-24b-instruct'],
                 ['Scout', '@cf/meta/llama-4-scout-17b-16e-instruct']];

  const d = mount({
    name: 'wish',
    what: 'Say what you want the desk to do, and a Cloudflare model proposes the patch.',
    /**
     * 🔴 TWO CELLS, AND THE TWO TIMINGS CAME OFF. Asked 2026-09-21 as
     * *"rm heard"*, and `mount()` throws on an odd count, so taking one of four
     * forces a second decision rather than leaving a hole. Both timings went:
     * they are a pair, both milliseconds, and both are facts about how long
     * somebody else's model took rather than about the patch. `links` and
     * `refused` are the outcome and are what a person pressing the button wants.
     * ⚠️ NOTHING WAS LOST, BECAUSE THE LOG CARRIES THEM NOW. It did not before,
     * so deleting the cells without adding the lines would have stopped the page
     * reporting a real number.
     */
    readout: { links: '', refused: '' },
    controls: [
      /* 🔴 CONTROL 0, so `settleMs` lands on it and so the harness presses the
         thing this page is about. It uses a canned reply under `?selfcheck=1`
         and reaches nobody.
         ⚠️ THE LABEL IS THE DOCUMENTATION. A control that is worked with a
         gesture rather than a press has to name the gesture, because there is
         nothing else on the page that could.
         🔴 AND IT IS NOT THE PRIMARY. Asked 2026-09-21: *"hold to talk is
         secondary button"*. It had carried `primary: true` since it was called
         `Speak`, which put the brightest fill in the row on a control that also
         wears the busy sweep from the press until the answer lands: a glow that
         means *press this* and a sweep that means *this is working* on one
         button, and the two were being read as one thing. */
      { id: 'speak', label: 'Hold to talk' },
      /* 🔴 IT SENDS WHAT IS IN THE BOX, which is the half that makes an
         editable transcription worth anything. A mis-heard word is now one
         keystroke and one model call rather than a second recording and two. */
      { id: 'ask', label: 'Ask' },
      /* 🔴 IT WRITES INTO THE BOX AND ASKS NOBODY ANYTHING, so it costs no
         model call at all. It used to send straight to Cloudflare, which made
         the cheapest control on the page the one that spent the account. */
      { id: 'example', label: 'Use the example' },
    ],
  });
  guard(d);

  const hearPick = createChoice({ label: 'hear', options: HEAR, at: 0 });
  const thinkPick = createChoice({ label: 'think', options: THINK, at: 0 });
  const row = el('div', 'pos-crow');
  row.append(hearPick.el, thinkPick.el);

  /**
   * 🔴 THE HEARD SENTENCE IS EDITABLE. Asked 2026-09-21, pointing at the
   * transcription: *"-> textarea"*. There are two models in the chain and the
   * first one is the one nobody could correct, so a word it got wrong cost a
   * second recording and two more model calls.
   * ⚠️ IT ALSO SEPARATES TWO FAILURES THAT LOOK IDENTICAL FROM OUTSIDE: the
   * speech model mis-heard, and the language model mis-read a sentence that was
   * transcribed correctly. Re-asking the same words is the only way to tell
   * those apart, and it needs a box somebody can retype.
   */
  const said = el('textarea', 'wish-said');
  said.placeholder = 'hold the button and say what you want, or use the example';
  said.spellcheck = false;
  const patch = el('pre', 'wish-patch', '# no patch yet');
  const whyBox = el('div', 'wish-rows');
  /* The picture's room, taken from the first paint. See `.wish-dg`. */
  const dgHost = el('div', 'wish-dg');
  d.el.append(row, said, patch, whyBox, dgHost);

  const speakBtn = d.button('speak');

  // ── the desk, as a bay, so the proposal is graded by the real validator ───

  function freshBay() {
    const b = createBay();
    for (const p of PORTS) {
      b.addPort({
        id: p.id, label: p.label, dir: p.dir, medium: 'midi', shape: { protocol: '1.0' },
        ...(p.dir === 'in' ? { accepts: ACCEPTS[p.id] ?? ['note', 'cc'], never: NEVER } : { emits: EMITS }),
      });
    }
    return b;
  }

  /**
   * 🔴 EVERY PROPOSED LINK IS PUT THROUGH THE SAME VALIDATOR `/bay/` USES, and
   * the refusals are shown beside the line that caused them. This is the whole
   * point of the page: a model's output is an opinion and the validator is the
   * thing with an argument.
   */
  function grade(links) {
    const b = freshBay();
    const rows = [];
    let ok = 0;
    for (const l of links) {
      const bad = checkTransforms(l.transforms || []);
      const v = bad ? { ok: false, why: bad } : b.validate(l.from, l.to, l.transforms || []);
      if (v.ok) { b.link(l.from, l.to, l.transforms || []); ok++; }
      rows.push({ link: l, say: sayLink(l), carries: carriedBy(l), ok: v.ok, why: v.why });
    }
    return { rows, ok, refused: rows.length - ok };
  }

  // ── the words, the names and the picture ─────────────────────────────────

  /**
   * 🔴 `here:` IS THIS PROJECT'S OWN VOCABULARY AND IT WAS ON THE PAGE. Asked
   * 2026-09-21: *"here:mk-425c-usb-midi-keyboard:out -> here:circuit:in { ... }
   * what is here?"* It is the SITE, the first of the three segments in a port
   * id, and it means this machine as opposed to one reached over the relay. The
   * question is the answer: nobody outside this repository can know that, and
   * every port on this desk is local, so the segment that exists to tell two
   * sites apart was printing the same word on every row.
   * ✅ SO A ROW SHOWS THE NAME, AND A SITE APPEARS ONLY WHEN IT IS NOT THIS ONE.
   * The id is still the model's key and it is still in the JSON above, where a
   * reader wants exactly what came back.
   *
   * 🔴 AND `printLink` IS NOT THE PLACE TO FIX IT, WHICH IS WORTH WRITING DOWN
   * BECAUSE THE OBVIOUS READING SAYS OTHERWISE. That function's output is
   * parsed straight back by `parseLink`, and `bay-test.mjs` asserts the round
   * trip: a `printLink` that printed labels would make the text form a second
   * source of truth that says something the graph cannot, which is the one
   * thing the module's own header forbids. So the human form is a separate
   * function, and it reuses `printLink` for the transform half rather than
   * writing a second formatter that could disagree about a `+`.
   */
  const NAME_OF = (id) => {
    const p = PORT.get(id);
    if (!p) return id;                      // a port the model invented
    const site = id.split(':')[0];
    return site === 'here' ? p.label : `${site} ${p.label}`;
  };
  /** ` { transpose +1 }` or `''`, straight out of `printLink`. */
  const TRANSFORM_TEXT = (l) =>
    printLink({ from: 'x', to: 'y', transforms: l.transforms || [] }).slice('x -> y'.length);
  const sayLink = (l) => `${NAME_OF(l.from)} to ${NAME_OF(l.to)}${TRANSFORM_TEXT(l)}`;

  /** What would actually cross this link: what the source can emit, after the
   *  transforms, kept to what the destination consents to. */
  function carriedBy(l) {
    const dst = PORT.get(l.to);
    if (!PORT.get(l.from) || !dst) return [];
    try {
      const could = delivers(EMITS, l.transforms || []);
      const takes = ACCEPTS[dst.id] ?? ['note', 'cc'];
      return [...could].filter((c) => takes.includes(c));
    } catch { return []; }                  // a transform name that does not exist
  }

  /**
   * 🔴 THE DESK, DRAWN, AND IT IS THE FIRST DIAGRAM IN THIS PROJECT THAT IS NOT
   * `How it works`. Asked 2026-09-21: *"make it json and autodraw diagram below
   * (reserve space for it)"*. Every other picture here is REFERENCE: it passes
   * `{ how: true, atEnd: true }`, takes the standing heading and sits last on
   * the page because it is read once. **This one is a RESULT.** It changes on
   * every press, it is the answer rather than an explanation, and it belongs
   * directly under the JSON it draws, so it passes neither flag and takes no
   * title at all. `createDiagram` already allows that: with no `how` and no
   * `title` the heading element is hidden and nothing is written above the
   * picture.
   * 🔴 THE WHOLE DESK IS DRAWN WHATEVER WAS PROPOSED, and that is the point. A
   * model here produces well formed patches aimed at the WRONG INSTRUMENT, which
   * no validator can catch because there is nothing invalid about them. An arrow
   * arriving at the wrong box is visible in an instant, and only if the right
   * box is in the picture beside it.
   */
  const INSTRUMENTS = [
    { id: 'keys', label: 'MK-425C', sub: 'MIDI keyboard', kind: 'device',
      note: 'The Evolution keyboard. It sends on channel 2 and its keys are one semitone '
          + 'flat, which is why a transpose turns up in almost every proposal.' },
    { id: 'circuit', label: 'Circuit', sub: 'Novation synth', kind: 'device',
      note: 'Two synth voices on channels 1 and 2, drums on channel 10, master filter on '
          + 'channel 16. It has no factory reset, so a link that could carry SysEx is '
          + 'refused outright.' },
    { id: 'model12', label: 'Model 12', sub: 'TASCAM mixer', kind: 'device',
      note: 'Nine faders that send pitch bend, and a MIDI IN that takes notes and '
          + 'controllers. Two well formed proposals measured here arrived at this box and '
          + 'belonged to the Circuit.' },
  ];
  const DG_CAPTION = 'Every arrow is a link the model asked for, and a refused one is '
    + 'marked rather than left out.';

  /**
   * One arrow per pair of instruments the proposal joins.
   * 🔴 A REFUSED LINK IS PART OF THE PICTURE. The run this page was reported on
   * was `1 link, 1 refused`, so a diagram drawing only what passed would have
   * been EMPTY while the readout beside it said an answer had arrived. Its label
   * is `refused`, which is what travels: nothing.
   * ⚠️ TWO PROPOSALS BETWEEN ONE PAIR ARE ONE ARROW, or two would be drawn down
   * one gap and read as one, and then the picture would say fewer links than the
   * readout does.
   * ⚠️ AND A LINK THAT BEGINS AND ENDS AT ONE INSTRUMENT HAS NO ARROW TO DRAW.
   * It is counted and logged rather than dropped in silence.
   */
  function arrowsFor(rows) {
    const pairs = new Map();
    let loops = 0;
    for (const r of rows) {
      const a = PORT.get(r.link.from)?.box, b = PORT.get(r.link.to)?.box;
      if (!a || !b) continue;
      if (a === b) { loops++; continue; }
      const key = `${a}|${b}`;
      const g = pairs.get(key) || { from: a, to: b, n: 0, ok: 0, why: '', carries: new Set(), t: '' };
      g.n++;
      if (r.ok) { g.ok++; r.carries.forEach((c) => g.carries.add(c)); g.t = g.t || TRANSFORM_TEXT(r.link); }
      else if (!g.why) g.why = r.why;
      pairs.set(key, g);
    }
    /**
     * 🔴 ONLY A REFUSED ARROW IS LABELLED, AND THE BUDGET IS WHY RATHER THAN
     * TASTE. MEASURED: the gap between two columns gives a link label **52 px**
     * here, which is about seven characters at the drawer's link size, and
     * `createDiagram` reported `transpose+1,…` as a cut the first time this was
     * built. `refused` fits. A list of message classes or a transform does not,
     * so what travels goes in the note, which is read on hover in the line under
     * the picture where there is room for a sentence.
     * ⚠️ AND THE ASYMMETRY IS THE MESSAGE: an arrow means the model asked for
     * this link, a marked arrow means the validator stopped it.
     */
    const links = [...pairs.values()].map((g) => ({
      from: g.from,
      to: g.to,
      label: g.ok ? '' : 'refused',
      note: g.ok
        ? `${[...g.carries].join(', ') || 'nothing'} would cross this link`
          + `${g.t ? `, after ${g.t.replace(/^ \{ | \}$/g, '')}` : ''}.`
          + (g.n > 1 ? ` The model proposed ${g.n} links between these two.` : '')
        : g.why,
    }));
    return { links, loops };
  }

  let dg = null;
  function draw(g) {
    const { links, loops } = arrowsFor(g.rows);
    if (loops) {
      d.log(`${loops} proposed link${loops > 1 ? 's' : ''} began and ended at one instrument, `
        + 'so the picture has no arrow for it');
    }
    dg?.destroy();
    dg = createDiagram(dgHost, { caption: DG_CAPTION, nodes: INSTRUMENTS, links });
    return { drawn: links.length, loops };
  }

  /* Two different empty states, and they are not the same sentence. Nothing has
     been asked yet, and a model was asked and proposed nothing. */
  const NO_PATCH = '# no patch yet';
  const EMPTY_PATCH = '# the model proposed nothing, which is the right answer to an instruction\n'
    + '# that names nothing on this desk';

  /**
   * 🔴 THE PATCH BOX IS JSON, ONE OBJECT PER LINE. Asked 2026-09-21: *"can it
   * not be full json(l) message?"* The compact patch language was written for
   * `/bay/`, where it labels a link somebody is about to make and the shortest
   * true sentence wins. Here it is the MODEL'S OUTPUT being shown for
   * inspection, and the compact form was dropping the evidence: the run this
   * was reported on read `{ transpose, channel 1 }` with no sign of the `to: 1`
   * that was the whole problem, so the refusal underneath named a key the line
   * above it did not show.
   */
  function show(links) {
    const g = grade(links);
    /* 🔴 INDENTED, AND WRAPPED RATHER THAN CLIPPED. Asked as *"indent json"*,
       and the clipping was the more serious half: a screenshot showed the line
       cut at `"op":"trans` , which is one character before the `"to": 1` that
       the whole JSON exists to reveal. The compact form hid that argument by
       omitting it; the one-line form hid it by running off the edge. */
    patch.textContent = links.length
      ? links.map((l) => JSON.stringify(l, null, 2)).join('\n') : EMPTY_PATCH;
    whyBox.replaceChildren(...g.rows.map((r) => {
      const e = el('div', 'wish-why');
      e.append(el(r.ok ? 'i' : 'b', '', r.ok ? 'allowed' : 'refused'),
        el('span', 'wish-why-l', `  ${r.say}`));
      // A refusal's reason names the key or the port, never the row it is about,
      // so the link it belongs to is on the line above it.
      if (!r.ok) e.append(el('div', '', r.why));
      return e;
    }));
    d.set('links', links.length || '');
    d.set('refused', g.refused || '');
    g.picture = draw(g);
    return g;
  }

  /**
   * 🔴 A PRESS CLEARS THE LAST ANSWER BEFORE IT ASKS THE NEXT QUESTION. Asked
   * 2026-09-21: *"hold to talk should clear previous input / routing"*. The
   * heard sentence, the JSON, the refusals and the picture all used to stay on
   * screen while a new recording was made and while both models thought, so for
   * several seconds the page showed the OLD answer next to a NEW question with
   * nothing to say which was which. A blank says *nothing yet*. A previous
   * answer left standing says *this is the answer*.
   * ⚠️ ON THE PRESS, NOT ON THE REPLY. Clearing when the answer lands leaves
   * the whole window that causes the problem exactly as it was.
   * ⚠️ AND THE READOUT GOES BACK TO EMPTY, never to `0`, which would read as a
   * very confident measurement of nothing.
   */
  /**
   * 🔴 NOTHING IS DRAWN UNTIL THERE IS A MAPPING, AND THE ROOM IS STILL
   * RESERVED. Asked 2026-09-21: *"do not show diagram until we have mapping"*,
   * after *"make it json and autodraw diagram below (reserve space for it)"*.
   * Those two pull in opposite directions only if *show* and *reserve* are
   * treated as one thing. They are not: the height is held from the first paint
   * so an answer landing after a two model round trip cannot shove the log down
   * the page, and the picture itself appears when there is something to draw.
   * ⚠️ AND AN EMPTY BOX MUST NOT PAINT ITS EDGES, which is a standing rule here
   * ("separation is spacing, not lines, AND AN EMPTY BOX IS A LINE"), measured
   * once on `/typist/` where a page declaring `readout: null` still got a div
   * whose own borders rendered as a 2 px band nobody had written. `.wish-dg`
   * carries no border and no background, so the reserved room is invisible
   * until it holds a picture.
   * ⚠️ A DESK WITH NO ARROWS IS NOT A MAPPING. The old behaviour drew all three
   * instruments from the first paint, which reads as an answer: three boxes and
   * nothing joining them is a picture saying *these do not connect*, which is a
   * claim nobody made.
   */
  function clearAnswer() {
    patch.textContent = NO_PATCH;
    whyBox.replaceChildren();
    d.set('links', '');
    d.set('refused', '');
    dg?.destroy();
    dg = null;
    dgHost.replaceChildren();
  }
  function clearAll() { said.value = ''; clearAnswer(); }

  /* The room is taken before anybody presses anything; the picture is not. */
  clearAnswer();

  // ── the two calls ────────────────────────────────────────────────────────

  /**
   * 🔴 ONE COUNTED FUNCTION, AND IT IS THE ONLY THING ON THIS PAGE THAT CAN
   * LEAVE IT. `reached` is what the assert below reads, so "a visit reached
   * nobody" is a number rather than a claim about a file.
   */
  let reached = 0;

  /**
   * 🔴 A FETCH THAT NEVER CONNECTED AND A FETCH THAT CAME BACK WITH AN ERROR
   * ARE TWO DIFFERENT REPORTS, AND THIS PAGE USED TO GIVE ONE. Both ends bolted
   * *"Is `node demo/wish-local.mjs` running?"* onto whatever went wrong, so an
   * expired Cloudflare credential was reported as a process that might not be
   * up. It sent a reader to look at the one thing that was never wrong, and it
   * cost an hour. The agent's own message is the agent's message.
   */
  async function post(path, body) {
    /* 🔴 A SUITE RUN ASKS NOBODY AND SPENDS NOTHING, AND `reached` IS NOT BUMPED
       BECAUSE NOTHING WAS REACHED. The counter is the page's audit of whether a
       visit opened anything, so counting a call that never left the tab would
       make the one assert about it read false. */
    if (SELFCHECK && path === '/wish') {
      return { links: CANNED, ms: 0, model: 'canned', usage: { total_tokens: 0 } };
    }
    reached++;
    let r;
    try {
      r = await fetch(`${API}${path}`, {
        method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
      });
    } catch {
      const e = new Error(`nothing answered at ${API}. Start the agent with \`node demo/wish-local.mjs\``);
      e.answered = false;
      throw e;
    }
    const out = await r.json().catch(() => ({}));
    if (!r.ok) {
      const e = new Error(out.error || `HTTP ${r.status}`);
      e.answered = true;
      throw e;
    }
    return out;
  }

  /** What went wrong, in the words of whichever end has a right to them. */
  function blame(e) {
    d.log(e.answered === false ? e.message : `the agent said: ${e.message}`, 'warn');
  }

  async function think(text) {
    said.value = text;
    clearAnswer();
    d.log(`asking ${thinkPick.value().split('/').pop()}`);
    const out = await post('/wish', { text, ports: PORTS, facts: FACTS, model: thinkPick.value() });
    const g = show(out.links || []);
    /* 🔴 THE TIMING LIVES HERE NOW, because the readout gave up its two cells
       and a number nothing prints is a number the page stopped reporting. */
    d.log(`thought for ${out.ms ?? '?'} ms: ${out.links?.length ?? 0} link(s), `
      + `${g.refused} refused, ${out.usage?.total_tokens ?? '?'} tokens`);
    return out;
  }

  /** The sentence the whole thing was measured on, so somebody with no
   *  microphone has something to press. */
  const EXAMPLE = 'Connect the keyboard to the circuit and transpose it up one semitone.';

  /**
   * 🔴 THE REPLY THE REAL MODEL GAVE, AND IT IS THE GATE FOR A SUITE RUN.
   * MEASURED 2026-09-21 through `demo/wish-local.mjs` against
   * `@cf/meta/llama-3.3-70b-instruct-fp8-fast`: the ports were right and the
   * transform's argument was under the wrong key. A check written against an
   * invented reply would have missed the only interesting thing that happened.
   * 🔴 AND IT IS WHY `Use the example` MAY ASK. Reported 2026-09-21: *"i do not
   * get why you own example does not work. use example shoyld ask"*. The button
   * used to write into the box and ask nobody, so the harness could press it
   * for nothing; but a button called *use the example* that does not use it is
   * the shape of control this project calls a lie. **THE GATE BELONGS ON THE
   * NETWORK, NOT ON THE BUTTON**, which is `/shape/`'s `sink` exactly: a suite
   * run must not be a hand on somebody's paid account, and the way to arrange
   * that is for the call to reach a stand-in rather than for the control to do
   * nothing.
   */
  const CANNED = [{ from: 'here:mk-425c-usb-midi-keyboard:out', to: 'here:circuit:in',
    transforms: [{ op: 'transpose', to: 1 }] }];

  d.on('example', async () => {
    /* It writes into the same box the microphone fills, which is one
       destination rather than two, AND THEN IT ASKS. See `CANNED` for why that
       is free under a suite run. */
    said.value = EXAMPLE;
    clearAnswer();
    try { await think(EXAMPLE); } catch (e) { blame(e); }
  });

  d.on('ask', async () => {
    const text = said.value.trim();
    if (!text) { d.log('there is nothing in the box to ask about'); return; }
    try { await think(text); } catch (e) { blame(e); }
  });

  // ── hold to talk ─────────────────────────────────────────────────────────

  /**
   * 🔴 HELD RATHER THAN TOGGLED, ASKED FOR 2026-09-21: *"replace speak button
   * with a hold to alk button"*. A toggle carries a state that can get stuck:
   * a second press that is missed, a hand that leaves the page, a phone that
   * takes the gesture away to scroll, and the microphone is open with nobody in
   * front of it. A hold lasts exactly as long as the hand does.
   *
   * 🔴 **AND IT ANSWERS A PLAIN CLICK AS WELL, WHICH IS NOT POLITENESS.**
   * `demo/verify.mjs` drives every page by calling `.click()` on each button in
   * `.pos-controls`, and `element.click()` fires NO pointer events at all. A
   * hold-only control in that row is a check the harness can no longer reach,
   * and those asserts do not go red, they stop running while the suite stays
   * green: this repository has paid for exactly that twice, on `/mirror/` and
   * on `/blocks/`. So a press with no pointer behind it, which is the harness,
   * the Enter key and an assistive click, records a fixed short window instead.
   * **A click is a tap with no finger**, and it is the same code path.
   */
  const MIN_HOLD = 450;     // below this a press is a tap rather than a hold
  const TAP_MS = 2500;      // what a tap, or a click with no pointer, records

  const talk = {
    holding: false, began: 0, ended: 0, last: null,
    classify: (ms) => (ms >= MIN_HOLD ? 'hold' : 'tap'),
  };

  let rec = null, stream = null, chunks = [];
  let startedAt = 0, tapTimer = 0, lastGesture = -1e9;
  let stopWanted = false, dropped = false, busy = false;

  /* 🔴 THE PICTURE IS THE ONE EVERY OTHER CONTROL IN THIS PROJECT USES.
     `data-busy` is paint only, it is reduced-motion aware, and it says "this
     control is at work" from the moment of the press until the answer lands,
     which is true of the recording and of the thinking after it. A label change
     or a spinner would resize the button and reflow the row under the hand that
     is holding it. */
  const lit = (on) => { if (on) speakBtn.dataset.busy = '1'; else delete speakBtn.dataset.busy; };

  /**
   * 🔴 THE BUTTON CARRIES NOTHING OF ITS OWN, AND THAT IS AN INSTRUCTION RATHER
   * THAN A CHOICE. A dot moving with the microphone level was asked for on
   * 2026-09-21 and withdrawn the same day: *"rm dot from hold to talk"*. The
   * `AnalyserNode` that had been built for it came out with it, because a
   * microphone analyser nobody reads is a node opened on every press for no
   * reader.
   * 🔴 **SO THERE IS NO PER HOLD LEVEL INDICATION ON THIS PAGE, AND IT IS A
   * KNOWN GAP RATHER THAN AN OVERSIGHT.** Somebody holding the button cannot
   * tell whether the microphone is picking them up until the transcription
   * arrives. What is left is the sweep above, which says the control is at work
   * and says nothing about what it can hear.
   */

  function release() {
    stream?.getTracks().forEach((t) => t.stop());
    stream = null; rec = null;
  }

  function begin() {
    if (talk.holding || busy) return;
    talk.holding = true;
    talk.began++;
    startedAt = performance.now();
    stopWanted = false; dropped = false;
    /* 🔴 THE ANSWER GOES BEFORE THE QUESTION IS ASKED, not when the reply
       lands. See `clearAnswer`: the window this closes is the whole recording
       plus both model calls, which is the several seconds a reader spends
       looking at the last answer while giving the next instruction. */
    clearAll();
    lit(true);
    /* ⚠️ THE MICROPHONE IS THE ONLY HALF A CHECK SKIPS. The gesture itself, its
       timing and its ending are the same code for a harness and for a hand,
       because a gesture that behaves one way under `?selfcheck=1` is a gesture
       nothing grades. */
    if (SELFCHECK) return;
    open();
  }

  async function open() {
    if (!navigator.mediaDevices?.getUserMedia) {
      d.log('this browser has no microphone, so use the example', 'warn');
      talk.holding = false; lit(false);
      return;
    }
    let s;
    try { s = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { d.log(`no microphone: ${e.message}`, 'warn'); talk.holding = false; lit(false); return; }
    /* ⚠️ A PERMISSION PROMPT TAKES LONGER THAN A PRESS. The hand can be off the
       button before the microphone opens, so the release is checked here rather
       than assumed. */
    if (stopWanted) { s.getTracks().forEach((t) => t.stop()); lit(false); return; }
    stream = s;
    chunks = [];
    rec = new MediaRecorder(s);
    rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = finish;
    rec.start();
    /* ⚠️ A TAP CAN LET GO BEFORE THE MICROPHONE OPENS, so this reads the state
       rather than describing the gesture it assumed. */
    d.log(talk.holding ? 'listening while the button is held' : 'listening');
  }

  /** @param {'up'|'cancel'|'click'} why */
  function end(why) {
    if (!talk.holding) return;          // idempotent: pointerup and lostpointercapture both land here
    talk.holding = false;
    talk.ended++;
    if (why !== 'click') lastGesture = performance.now();
    const ms = Math.round(performance.now() - startedAt);
    const kind = why === 'cancel' ? 'cancel' : talk.classify(ms);
    talk.last = { ms, kind, why };
    if (kind === 'cancel') {
      /* 🔴 THE PHONE CASE, AND IT ENDS THE RECORDING RATHER THAN SENDING IT.
         The browser takes a gesture away to scroll and no `pointerup` ever
         arrives, so half a word would be uploaded on behalf of somebody who was
         scrolling the page. */
      d.log('the press was taken away, so nothing was sent');
      dropped = true;
      stop();
      return;
    }
    if (kind === 'hold') { stop(); return; }
    d.log(`that was ${ms} ms, too short to be a hold, so ${(TAP_MS / 1000).toFixed(1)} s is recorded instead`);
    clearTimeout(tapTimer);
    tapTimer = setTimeout(stop, Math.max(0, TAP_MS - ms));
  }

  /* ⚠️ THE LIGHT STAYS ON UNTIL `finish()` IS DONE. Turning it off at the
     release and on again at the upload blinks the control for the one or two
     frames `onstop` takes to arrive, and a control that flickers reads as one
     that lost the press. */
  function stop() {
    clearTimeout(tapTimer);
    stopWanted = true;
    if (!rec) { lit(false); release(); return; }
    if (rec.state !== 'inactive') rec.stop(); else finish();
  }

  async function finish() {
    const type = rec?.mimeType || 'audio/webm';
    release();
    if (dropped) { dropped = false; chunks = []; lit(false); return; }
    const blob = new Blob(chunks, { type });
    d.log(`${(blob.size / 1024).toFixed(1)} KB of audio`);
    busy = true;
    lit(true);
    try {
      const buf = new Uint8Array(await blob.arrayBuffer());
      /* ⚠️ CHUNKED, because `String.fromCharCode(...buf)` on a few seconds of
         audio is tens of thousands of arguments and blows the stack. */
      let s = '';
      for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode(...buf.subarray(i, i + 0x8000));
      const heard = await post('/hear', { audio: btoa(s), model: hearPick.value() });
      /* The timing the readout used to carry. See `readout` above. */
      d.log(`heard in ${heard.ms ?? '?'} ms by ${hearPick.value().split('/').pop()}`);
      /* ⚠️ IT GOES IN THE LOG AND NOT IN THE BOX. The box is a textarea now, so
         a sentence written into it is a sentence somebody can press Ask with. */
      if (!heard.text?.trim()) { d.log('nothing was heard, so nothing was asked'); return; }
      await think(heard.text.trim());
    } catch (e) {
      blame(e);
    } finally {
      busy = false;
      lit(false);
    }
  }

  speakBtn.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;   // a right click is not a press
    /* 🔴 CAPTURE, OR A PHONE GETS STUCK RECORDING. With the pointer captured
       this button is guaranteed its `pointerup` even when the finger has slid
       off it, so the pointer leaving cannot strand a hold. `pointercancel` is
       the other half: the browser takes the gesture away for a scroll and
       nothing else ever arrives. */
    try { speakBtn.setPointerCapture(e.pointerId); } catch { /* a synthetic pointer has no id to capture */ }
    lastGesture = performance.now();
    begin();
  });
  speakBtn.addEventListener('pointerup', () => end('up'));
  speakBtn.addEventListener('pointercancel', () => end('cancel'));
  /* The catch-all for a capture lost some other way. `end` is idempotent, so a
     `pointerup` that already ran leaves this a no-op. */
  speakBtn.addEventListener('lostpointercapture', () => end('up'));

  /* ⚠️ NOT `async`, ON PURPOSE. The shell paints `data-busy` and DISABLES a
     control whose handler returns a promise, and it clears both when the
     promise settles, which would wipe the recording's own paint one tick after
     a tap set it. The selfcheck branch does return one, because there the
     control really is working for as long as the checks run. */
  d.on('speak', () => {
    if (SELFCHECK) return d.run('check');
    /* 🔴 A CLICK THAT TRAILS A REAL HOLD IS THE SAME PRESS ARRIVING TWICE. A
       trusted `pointerup` is followed by a `click` on the same button, so
       without this a hand's press would also start the no-pointer path. A
       synthetic click carries no pointer events at all and never trips it. */
    if (performance.now() - lastGesture < 600) return undefined;
    if (busy || talk.holding) return undefined;
    begin();
    end('click');
    return undefined;
  });

  // ── checks ───────────────────────────────────────────────────────────────

  d.on('check', async () => {
    /**
     * 🔴 A CANNED REPLY, AND IT IS THE ONE THE REAL MODEL GAVE. Measured
     * 2026-09-21 through `demo/wish-local.mjs` against
     * `@cf/meta/llama-3.3-70b-instruct-fp8-fast`: the ports were right and the
     * transform's argument was under the wrong key. **A check written against
     * an invented reply would have missed the only interesting thing that
     * happened.**
     */
    const g = show(CANNED);

    /* 🔴 A COUNTER, NOT A CLAIM. This read `SELFCHECK ? true : true` and could
       not go red whatever the page did, which is an assert that reports the
       author's intention. `post()` is the one function on this page that can
       leave it, and it counts every call. */
    d.assert('a visit reached nobody', reached === 0, `${reached} calls to the agent`);

    /* 🔴 THE FIELD NAMES ARE QUOTED, AND THAT IS WHAT THIS LINE NOW GRADES.
       `refused transpose needs by and was given to` was reported as unreadable
       because `by` and `to` are FIELD NAMES printed as bare English, so the
       sentence parses as broken grammar rather than as a report about two keys.
       The check behind it is untouched and must stay untouched. */
    d.assert('the transform the real model returned is refused, and both keys read as keys',
      g.refused === 1 && /transpose takes "by"/.test(whyBox.textContent)
      && /was given "to"/.test(whyBox.textContent),
      whyBox.textContent.trim().slice(0, 110));

    /* 🔴 THE JSON IS THE MODEL'S OWN OBJECT, and the `to: 1` that caused the
       refusal is IN it. That is the whole reason this box stopped being the
       compact patch language: the refusal underneath was naming a key the line
       above it did not show.
       🔴 AND THE PARSE IS GUARDED, WHICH THE FIRST BUILD OF THIS LINE WAS NOT.
       Found by sabotage: putting the compact form back made `JSON.parse` THROW
       inside the assert's own expression, which killed the rest of the check and
       took the page from 25 asserts to 2 while reading green. An assert that
       throws does not go red, it goes missing. */
    const asObject = (() => { try { return JSON.parse(patch.textContent); } catch { return null; } })();
    d.assert('the box shows the whole object, including the argument that was refused',
      patch.textContent.split('\n').length > 1 && /\n  "/.test(patch.textContent)
      && asObject?.transforms?.[0]?.to === 1,
      patch.textContent.slice(0, 110));

    /* ⚠️ THE NEGATIVE CONTROL FOR THE SLICE, and it is the only thing that makes
       `TRANSFORM_TEXT` safe: it cuts a fixed number of characters off
       `printLink`'s output, so the day that function's separator changes this
       goes red instead of the page quietly showing half an id. */
    d.assert('the link line is built from printLink rather than from a second formatter',
      printLink({ from: 'x', to: 'y', transforms: [] }) === 'x -> y'
      && TRANSFORM_TEXT({ transforms: [{ op: 'transpose', by: 1 }] }) === ' { transpose +1 }',
      `${printLink({ from: 'x', to: 'y', transforms: [] })} and `
      + `${TRANSFORM_TEXT({ transforms: [{ op: 'transpose', by: 1 }] })}`);

    /* 🔴 NO `here:` ANYWHERE A READER LOOKS. It is the site segment of a port id
       and it means this machine, which nobody outside this repository can know
       and which is the same word on every row of this desk. */
    d.assert('a row names the instrument and never shows a port id',
      /MK-425C USB MIDI Keyboard to Circuit/.test(whyBox.textContent)
      && !whyBox.textContent.includes('here:'),
      whyBox.textContent.trim().slice(0, 110));

    // ⚠️ THE NEGATIVE CONTROL: the same link, spelled right, is allowed. Without
    // it the line above would pass on a page that refused everything.
    const FIXED = [{ from: 'here:mk-425c-usb-midi-keyboard:out', to: 'here:circuit:in',
      transforms: [{ op: 'transpose', by: 1 }, { op: 'channel', to: 1 }] }];
    const g2 = show(FIXED);
    d.assert('and the same link with the argument under the right key is allowed',
      g2.ok === 1 && g2.refused === 0, `${g2.ok} allowed, ${g2.refused} refused`);

    /* The one that protects the instrument, on the page a sentence arrives at. */
    const NASTY = [{ from: 'here:circuit:out', to: 'here:circuit:in', transforms: [] }];
    const g3 = show(NASTY);
    d.assert('a proposal that loops an instrument into itself is refused',
      g3.refused === 1, whyBox.textContent.trim().slice(0, 80));

    const EMPTY = show([]);
    d.assert('a proposal of nothing says so rather than showing an empty box',
      EMPTY.ok === 0 && patch.textContent.includes('proposed nothing'),
      patch.textContent.split('\n')[0]);

    /* ── the picture, in all three of its states ──────────────────────────
       🔴 GRADE IT, BECAUSE NOTHING ELSE CAN SEE IT. `createDiagram` collects
       every name it had to shorten, every note over about forty words and every
       arrow it could not route, on `cuts`.
       ⚠️ AND IN EVERY STATE, WHICH THE FIRST BUILD OF THIS CHECK GOT WRONG. It
       read `cuts` once, on a picture with no arrows in it, so a link label the
       drawer had to cut passed straight through a check written to catch
       exactly that. The picture is rebuilt on every answer, so the cuts are a
       fact about a state rather than about the page. */
    const boxes = () => dgHost.querySelectorAll('.pos-dg-n').length;
    const arrows = () => dgHost.querySelectorAll('.pos-dg-l').length;
    const figH = () => dgHost.querySelector('.pos-dg')?.getBoundingClientRect().height ?? 0;
    /* ⚠️ `:not([aria-hidden])` IS NOT DECORATION. `createDiagram` measures its
       own text with a ruler element that carries the same class, parked off to
       one side and emptied after each layout, so a plain query answers one more
       label than the picture has and the first one is always blank. */
    const labels = () => [...dgHost.querySelectorAll('.pos-dg-llab:not([aria-hidden])')]
      .map((t) => t.textContent);

    const seen = [];
    const look = (what) => seen.push({
      what, boxes: boxes(), arrows: arrows(), h: figH(), mode: dg.mode,
      labels: labels(),
      cuts: dg.cuts.map((c) => `${c.where} ${c.id} at ${c.width}px`),
    });

    show([]); look('nothing proposed');
    const g4 = show(CANNED); look('one refused link');
    show(FIXED); look('one allowed link');

    d.assert('the picture drew every name and every arrow whole, in every state',
      seen.every((s) => s.cuts.length === 0),
      seen.flatMap((s) => s.cuts.map((c) => `${s.what}: ${c}`)).join('; ')
        || `nothing cut in ${seen.length} states, laid out as ${seen[0].mode}`);

    /* 🔴 THE WHOLE DESK, WHATEVER WAS PROPOSED, AND ONE ARROW PER PROPOSAL.
       A proposal of nothing draws three instruments and no arrows rather than an
       empty box, and the refused run draws its arrow: a picture showing only
       what passed would have been blank on the run this was reported from, while
       the readout beside it said `1 link, 1 refused`. */
    d.assert('the whole desk is drawn whatever came back, with one arrow per proposal',
      seen.every((s) => s.boxes === 3)
      && seen.map((s) => s.arrows).join() === '0,1,1',
      seen.map((s) => `${s.what}: ${s.boxes} boxes, ${s.arrows} arrows`).join('; '));

    /* The negative half is the second clause: a link that PASSED must not be
       marked, or the mark would say nothing. */
    d.assert('a refused link is drawn and marked refused, and an allowed one is not marked',
      g4.picture.drawn === 1 && seen[1].labels.join() === 'refused'
      && seen[2].labels.length === 0,
      `refused run ${JSON.stringify(seen[1].labels)}, allowed run ${JSON.stringify(seen[2].labels)}`);

    /* 🔴 THE ROOM IS TAKEN BEFORE THE PICTURE ARRIVES, which is what *"reserve
       space for it"* asked for. The reservation is a CSS number, so this reads
       the COMPUTED value rather than the source: a rule that lost is a rule that
       reads as correct in a stylesheet. */
    const reserved = parseFloat(getComputedStyle(dgHost).minHeight) || 0;
    d.assert('the picture fits the room reserved for it in every state',
      reserved > 0 && seen.every((s) => s.h <= reserved),
      `${reserved} px reserved against ${seen.map((s) => s.h.toFixed(0)).join(', ')} drawn`);

    /* ── the only feedback the control has left ────────────────────────────
       🔴 THE BUTTON CARRIES NOTHING OF ITS OWN, so the paint IS the signal and
       it is worth grading. A dot was asked for and withdrawn the same day, and
       what replaced it is nothing, which makes this the one channel a person
       holding the button has. The negative half is in the same line: it must
       not be lit before anybody has touched it. */
    d.assert('the control carries no indicator of its own',
      speakBtn.children.length === 0 && speakBtn.textContent === 'Hold to talk',
      `${speakBtn.children.length} children, label ${JSON.stringify(speakBtn.textContent)}`);

    /* ── the example, which now costs nothing ─────────────────────────────
       🔴 IT IS PRESSED FOR REAL HERE, because it no longer reaches Cloudflare.
       It writes into the same box the microphone fills, which is the whole point
       of that box being editable. */
    d.run('example');
    d.assert('the example lands in the box the microphone fills, and asks nobody',
      said.value === EXAMPLE && reached === 0,
      `${said.value.length} characters in the box, ${reached} calls to the agent`);

    d.assert('both model pickers offer what the agent will run',
      hearPick.el.querySelectorAll('button').length === 3
      && thinkPick.el.querySelectorAll('button').length === 5,
      `${hearPick.el.querySelectorAll('button').length} and ${thinkPick.el.querySelectorAll('button').length}`);

    d.assert('the desk it describes is the one the other pages build ids for',
      PORTS.some((p) => p.id === 'here:circuit:in') && PORTS.some((p) => p.id === 'here:mk-425c-usb-midi-keyboard:out'),
      `${PORTS.length} ports`);

    /* ── the hold ──────────────────────────────────────────────────────────
       🔴 DRIVEN WITH REAL POINTER EVENTS, which is the half a `.click()`
       cannot reach and the half that gets a phone stuck. No microphone is
       opened by any of it: `begin()` does the gesture's own bookkeeping and
       stops at its `SELFCHECK` line, so what is graded here is the wiring and
       the arithmetic rather than a recording. */

    /* ⚠️ THE SHELL DISABLES A CONTROL WHILE ITS HANDLER IS PENDING, AND THIS
       CHECK IS THAT HANDLER. A disabled button receives no pointer events at
       all, so the presses below would land on nothing and three asserts would
       quietly measure a page nobody had touched. */
    const wasOff = speakBtn.disabled;
    speakBtn.disabled = false;
    const press = (type, init) => speakBtn.dispatchEvent(new PointerEvent(type,
      { bubbles: true, pointerId: 1, pointerType: 'mouse', button: 0, ...init }));

    /* 🔴 THE ANSWER AND THE QUESTION ARE PUT UP FIRST AND THE PRESS HAS TO TAKE
       BOTH AWAY. Asked as *"hold to talk should clear previous input /
       routing"*, and the clear has to happen on the PRESS: clearing when the
       reply lands leaves exactly the window that causes the problem, which is
       the recording plus both model calls. The readout goes to empty and never
       to `0`. */
    show(CANNED);
    said.value = EXAMPLE;
    const before = [patch.textContent, whyBox.textContent, said.value,
      d.el.isConnected ? arrows() : 1].join('|');

    const began0 = talk.began, ended0 = talk.ended;
    const darkBefore = !speakBtn.dataset.busy;
    press('pointerdown');
    const midHold = talk.holding;
    const litDuring = speakBtn.dataset.busy === '1';
    const cells = [...document.querySelectorAll('.pos-readout .pos-v')].map((c) => c.textContent);

    /* 🔴 THE PAINT IS THE WHOLE OF THE FEEDBACK NOW, so the press had better
       light it. Both halves in one line: dark before anybody touches it, lit
       from the press. What it cannot say is whether the microphone can hear
       anything, which is the gap the withdrawn dot leaves. */
    d.assert('the press lights the control, which is the only signal it has',
      darkBefore === true && litDuring === true,
      `busy before ${!darkBefore}, busy during ${litDuring}`);
    d.assert('the press takes the whole last answer away before it listens',
      before.length > 20 && patch.textContent === NO_PATCH && whyBox.textContent === ''
      && said.value === '' && arrows() === 0 && cells.every((t) => t.trim() === ''),
      `patch ${JSON.stringify(patch.textContent.slice(0, 16))}, ${whyBox.childElementCount} rows, `
      + `${said.value.length} characters, ${arrows()} arrows, cells ${JSON.stringify(cells)}`);

    press('pointerup');
    d.assert('a press and a release is one hold, begun and ended',
      midHold === true && talk.began === began0 + 1 && talk.ended === ended0 + 1 && talk.holding === false,
      `holding ${midHold} during, ${talk.began - began0} begun, ${talk.ended - ended0} ended, holding ${talk.holding} after`);

    press('pointerdown');
    press('pointercancel');
    d.assert('a press the browser takes away ends the hold rather than leaving it recording',
      talk.holding === false && talk.last?.kind === 'cancel' && talk.ended === ended0 + 2,
      `holding ${talk.holding}, last ${talk.last?.kind}`);

    /* The negative control is in the same line: a long press must NOT be read
       as a tap, or every hold would quietly become a fixed window. */
    d.assert('a press too short to be a hold is a tap, and a long one is not',
      talk.classify(10) === 'tap' && talk.classify(MIN_HOLD - 1) === 'tap'
      && talk.classify(MIN_HOLD) === 'hold' && talk.classify(4000) === 'hold',
      `the line is ${MIN_HOLD} ms`);

    /* Holding a button on an iPhone raises the text loupe and drops selection
       handles over the page, and this is the one control here that is held.
       The COMPUTED value, because a rule that lost is a rule that reads as
       correct in the source.
       ⚠️ **AND ONE THIRD OF IT CANNOT BE MEASURED IN THE BROWSER THAT RUNS THIS
       CHECK.** MEASURED 2026-09-21: desktop Chrome computes
       `-webkit-touch-callout` as the empty string, so grading it there took
       this assert red about a page where nothing is wrong. A probe that could
       not answer reads as `unknown` and never blocks, the same rule
       `caps.mjs` works to, and the detail line says which of the three were
       actually read. */
    const cs = getComputedStyle(speakBtn);
    const callout = cs.getPropertyValue('-webkit-touch-callout');
    d.assert('a long press on this control is a mis-press, never a selection',
      cs.touchAction === 'manipulation' && cs.userSelect === 'none'
      && (callout === '' || callout === 'none'),
      `touch-action ${cs.touchAction}, user-select ${cs.userSelect}, `
      + `callout ${callout || 'not computed by this browser'}`);
    speakBtn.disabled = wasOff;

    if (d.el.isConnected) {
      /* Nothing on this page may change its own height while a reader is
         looking at it, and a textarea that grows with its content is exactly
         that. MEASURED at both ends: empty, and with far more text than fits. */
      const emptyBox = said.getBoundingClientRect().height;
      const keptText = said.value;
      said.value = `${EXAMPLE} ${EXAMPLE} ${EXAMPLE} ${EXAMPLE}`;
      const fullBox = said.getBoundingClientRect().height;
      said.value = keptText;
      d.assert('the transcript box keeps its height whether it is empty or full',
        emptyBox === fullBox && emptyBox >= 56 && emptyBox <= 72 && said.scrollHeight > 0,
        `${emptyBox.toFixed(1)} px empty against ${fullBox.toFixed(1)} px full`);
      d.assert('the page does not drag sideways at this width',
        document.documentElement.scrollWidth <= window.innerWidth + 1,
        `page ${document.documentElement.scrollWidth} against ${window.innerWidth}`);
    }

    d.assert('no secret in this page', !location.href.includes('token'));
  });

  d.ready();
</script>
