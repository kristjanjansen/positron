<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">

<script type="module">
  import { mount, guard } from '/shell/shell.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createStripView } from '/shell/strip.mjs';
  import { createDeck, workerTickHost } from '/timeline/transport.mjs';
  import { createNest, nestedDrift } from '/timeline/nested.mjs';
  import { refDeck, quotation } from '/timeline/score.mjs';
  import { markAdapter, marks } from '/shell/fixture.mjs';

  const PARENT = 12000, CHILD = 6000;

  const d = mount({
    n: '03',
    name: 'nest',
    what: 'One short piece, used twice in a longer one: once as a slice, once looping three times.',
    readout: { typical: 'ms', worst: 'ms', pass: '', wraps: '' },
    // the numbers live under the lane they describe; this row would repeat them
    // somewhere with less context. Still published for CDP.
    showReadout: false,
    // No skip button. It existed because the subject started 12 s into a 24 s
    // piece — which is a reason to shorten the piece, not to add a control that
    // apologises for its length.
    controls: [],
  });
  guard(d);

  d.how(
    `The inner piece exists once. Both places on the timeline point at it by ` +
    `name — like citing a paragraph instead of retyping it. The first use ` +
    `takes a slice of it. The second says "three times", so the three slices ` +
    `you see side by side are one source played over and over, not three ` +
    `copies of anything.`,
  );

  // ── the child: quoted by identity, never by object ──────────────────────
  const kidMarks = markAdapter({ rates: [0.5, 1, 2] });
  const child = createDeck({
    items: marks(12, CHILD),
    adapters: { mark: kidMarks.adapter },
    range: [0, CHILD],
    autoStart: false,
  });
  refDeck(child, 'kurenniemi-1972');

  // ── the parent ──────────────────────────────────────────────────────────
  const measured = new Map();          // id -> its drift row
  const own = markAdapter({ rates: [0.5, 1, 2] });
  const parent = createDeck({
    items: marks(8, PARENT),
    adapters: { mark: own.adapter },
    range: [0, PARENT],
    // onDrift hands (newRows, allRows) and it is an ARRAY of per-event rows.
    // `nestedDrift()` returns {fires, range, pos, kinds:{…}} with no top-level
    // p50 — so the old `dr?.p50 ?? dr?.ms ?? 0` printed a confident 0 here for
    // exactly the reason it did in 01. Third page with the same shape.
    onDrift: (_rows, all) => report(all),
  });

  // A WRAP IS A COMMITTED ONE-SHOT, AND WITHOUT A HOST IT IS NOTHING.
  //
  // `createNest` arms each loop boundary on a TickHost — the same object
  // `createDeck({tickHost})` takes — so a wrap has the same firing-error
  // distribution as any other event. Given none, the library falls back to
  // discovering the boundary inside `servo()` and SAYS SO
  // (`nest.loop(id).boundary === 'polled'`). This page passed no host and never
  // called servo() either, so the boundary was neither committed nor polled: it
  // simply never happened. Three passes, zero wraps, and a page whose whole
  // subject is looping quietly not looping. The assert that should have caught
  // it was tolerant of "not reached yet" and passed vacuously every run.
  const nest = createNest(parent, {
    resolve: (ref) => (ref === 'kurenniemi-1972' ? child : null),
    tickHost: workerTickHost(),
  });

  // a plain fragment, then the same source looped three times
  nest.add(quotation({ id: 'frag', ref: 'kurenniemi-1972', at: 1000, in: 1000, out: 4000 }));
  nest.add(quotation({ id: 'loop', ref: 'kurenniemi-1972', at: 5500, in: 0, out: 1800,
                       repeat: 3 }));

  // Same bands as 01 and 02: colour says HOW IT LANDED, never which lane.
  const BANDS = [[5, '#8fd6a8', 'as expected'], [20, '#ffd400', 'over'],
                 [50, '#e0b060', 'well over'], [Infinity, '#e0908a', 'far over']];
  const bandFor = (ms) => BANDS.find(([lim]) => Math.abs(ms) < lim);

  // A 3-pass loop draws as ONE span carrying repeat:3, so the looping is implied
  // rather than shown. onWrap is the event that makes it observable.
  // A WRAP IS A TRANSITION, so logging only wraps starts the story at pass 2 —
  // the first pass has no wrap in front of it. The log follows the PASS instead,
  // which is the thing a reader is counting.
  let wraps = 0, lastPass = null;
  nest.onWrap(() => { wraps++; d.set('wraps', wraps); });

  // A QUOTATION ARRIVING AND LEAVING IS AN EVENT. The nest counted enters and
  // exits and had no way to subscribe to them, so a score made of quotations
  // could be watched only by polling for it. `onPresence` is new and symmetric
  // with `onWrap`; here it is what makes the structure audible in the log
  // rather than only visible in the picture.
  nest.onPresence(({ span, present, parentPos }) => {
    d.log(`${span} ${present ? 'starts' : 'ends'} at ${(parentPos / 1000).toFixed(2)}s`,
      present ? 'hi' : 'info');
  });

  createTransportBar(d.el, parent, { scrub: false });
  const view = createStripView(d.el, parent, {
    size: 'auto', follow: false, armWall: false, gutter: 150,
    lanes: [
      { id: 'mark', kind: 'mark', label: 'marks', height: 52, as: 'ticks', width: 2,
        color: '#6a7280', terse: true,
        // no `latch`: colour comes from the measurement, so scrubbing back
        // cannot un-measure anything
        colorOfRow: (r) => {
          const m = measured.get(r.id);
          return m ? bandFor(m.deltaMs)[1] : '#3b424e';
        },
        describeRow: (r) => {
          const m = measured.get(r.id);
          if (!m) return 'not played yet';
          return `${Math.abs(m.deltaMs).toFixed(2)} ms ${m.deltaMs < 0 ? 'early' : 'late'} · ${bandFor(m.deltaMs)[2]}`;
        } },
      // ONE SLICE PER PASS. A 3-pass loop is a single row carrying repeat:3, so
      // the strip drew one long bar and the looping — the entire subject of this
      // page — was invisible. `rows` may return MORE rows than it was given, so
      // each pass becomes its own span and the loop reads as [ ][ ][ ].
      { id: 'deck-span', kind: 'deck-span', label: 'quoted', height: 52, barPad: 8, as: 'spans',
        // ONE ROW. The stack gives every distinct span key its own slot, which
        // is right for things that overlap and wrong for four that never do:
        // the three passes of a loop are one thing happening three times, and
        // stairs down the lane read as four unrelated events.
        stack: false, barGap: 3,
        terse: true, color: '#c9a0ff', alpha: 0.9,
        rows: () => {
          const out = [];
          for (const sp of nest.spans()) {
            const n = sp.iterations || 1;
            for (let i = 0; i < n; i++) {
              const from = nest.iterationAt(sp.id, i);
              const to = nest.iterationAt(sp.id, i + 1);
              const end = Number.isFinite(to) ? to : from + (sp.onePassMs ?? (sp.out - sp.in));
              if (!Number.isFinite(from) || !(end > from)) continue;
              out.push({ at: from, id: `${sp.id}#${i + 1}`, kind: 'deck-span',
                         payload: { durMs: end - from, pass: i + 1, of: n, quo: sp.id } });
            }
          }
          return out;
        },
        describeRow: (r) => {
          const p = r.payload || {};
          return p.of > 1 ? `${p.quo} · pass ${p.pass} of ${p.of}` : `${p.quo} · played once`;
        } },
    ],
  });

  /** Live, and under the lane it describes. */
  let asserted = false;
  function report(rows) {
    for (const r of rows) measured.set(r.id, r);
    const xs = rows.map((r) => r.deltaMs).filter(Number.isFinite).sort((a, b) => a - b);
    if (!xs.length) return;
    const typical = xs[xs.length >> 1], worst = xs[xs.length - 1];
    d.set('typical', typical);
    d.set('worst', worst);
    const L = view.strip.lanes().find((l) => l.id === 'mark');
    if (L) {
      L.subLabel = [`typical +${typical.toFixed(2)} ms`, `worst +${worst.toFixed(2)} ms`];
      view.strip.invalidate();
    }
    if (!asserted) { asserted = true; check(); }
  }

  // `iteration()` answers 0 wherever the playhead is, including before the loop
  // has started — so the log announced "pass 1 of 3" at 0.25 s for a loop that
  // begins at 5.5 s. A pass only exists while the playhead is inside the span.
  const inLoop = () => {
    const from = nest.iterationAt?.('loop', 0);
    const to = nest.iterationAt?.('loop', 3);
    const p = parent.position();
    return Number.isFinite(from) && Number.isFinite(to) && p >= from && p < to;
  };

  setInterval(() => {
    const it = inLoop() ? nest.iteration?.('loop') : null;
    d.set('pass', it === null || it === undefined ? '—' : `${it + 1}/3`);
    if (it !== lastPass) {
      if (it !== null && it !== undefined) d.log(`pass ${it + 1} of 3`, 'hi');
      lastPass = it;
    }
    const L = view.strip.lanes().find((l) => l.id === 'deck-span');
    if (L) {
      L.subLabel = ['2 uses, 1 source', wraps ? `${wraps} wraps` : 'loop not reached'];
      view.strip.invalidate();
    }
  }, 200);

  /** The five asserts this page has always had — now run on their own. */
  function check() {
    const spans = nest.spans();
    d.assert('two spans registered', spans.length === 2, spans.map((s) => s.id).join(','));
    const loop = spans.find((s) => s.id === 'loop');
    d.assert('loop declares 3 passes', loop && (loop.repeat === 3 || loop.repeat?.times === 3),
      JSON.stringify(loop && loop.repeat));
    const dr = nestedDrift(parent);
    const k = dr?.kinds?.mark;
    d.assert('nest reports drift as rows, not as a scalar',
      !!k && Number.isFinite(k.p50), JSON.stringify(k));
    // The guard for the bug above: a loop with no committed boundary reports
    // 'polled', and a polled boundary nobody polls never fires at all.
    d.assert('the loop boundary is committed, not polled',
      nest.boundary() === 'lookahead', nest.boundary());
    d.assert('quotations round-trip out of the nest',
      nest.quotationsOf(child).length === 2, String(nest.quotationsOf(child).length));
    // the first wrap is one PASS after the loop starts, not at the loop start —
    // asserting against 12000 called 0 wraps a failure at 12652 ms, when the
    // boundary was still 1.3 s away
    const firstWrap = nest.iterationAt?.('loop', 1);
    const reached = Number.isFinite(firstWrap) && parent.position() >= firstWrap;
    d.assert('wraps observed once past the first boundary', wraps > 0 || !reached,
      `${wraps} wraps · pos ${Math.round(parent.position())} · first boundary ${firstWrap}`);
  }

  d.log(`${PARENT / 1000}s long · one ${CHILD / 1000}s source · used twice`);
  d.ready();
</script>
</html>
