<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="icon" href="/favicon.ico">

<div class="d-head">
  <div class="d-title"><h1 class="d-name">positron</h1></div>
</div>

<ol class="d-acts" id="rows"></ol>

<script type="module">
  import { DEMOS, NOTES } from '/manifest.mjs';
  function rowHTML(d) {
  const href = d.built ? `/${d.n}-${d.name}/` : (d.page || null);
  const tags = (d.tags || []).map((t) => `<span class="d-tag">${t}</span>`).join('');
  const why = '';
  const open = href ? `<a href="${href}">` : '<a>';
  return `<li class="d-row${href ? '' : ' todo'}">${open}`
    + `<span class="n">${d.n}</span>`
    + `<span class="nm">${d.name}</span>`
    + `<span class="d-one">${d.one || ''}</span>`
    + `<span class="d-meta">${tags}</span>`
    + '</a></li>';
}
  document.getElementById('rows').innerHTML = DEMOS.map(rowHTML).join('');
  function noteHTML(n) {
    return '<li class="d-row"><a href="/notes/?doc=' + n.doc + '">'
      + '<span class="n">·</span>'
      + '<span class="nm">' + n.title + '</span>'
      + '<span class="d-one">' + n.one + '</span>'
      + '</a></li>';
  }
  document.body.insertAdjacentHTML('beforeend',
    '<h2 class="d-act-h">notes</h2><ol class="d-acts">' + NOTES.map(noteHTML).join('') + '</ol>');
</script>
</html>
