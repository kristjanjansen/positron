<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON · demos</title>
<link rel="stylesheet" href="/demo/shell/shell.css">

<div class="d-head">
  <div class="d-title"><h1 class="d-name">positron · demos</h1></div>
  <p class="d-what">record → store → play back → seek → compose → perform</p>
</div>

<ol class="d-acts" id="acts"></ol>

<script type="module">
  import { DEMOS, ACTS } from '/demo/manifest.mjs';

  const root = document.getElementById('acts');
  for (const [act, label] of ACTS.entries()) {
    const rows = DEMOS.filter((d) => d.act === act);
    if (!rows.length) continue;
    const h = document.createElement('li');
    h.className = 'd-act-h';
    h.textContent = `act ${act} · ${label}`;
    root.append(h);
    for (const d of rows) {
      const li = document.createElement('li');
      li.className = `d-row${d.built ? '' : ' todo'}`;
      const a = document.createElement('a');
      if (d.built) a.href = `/demo/${d.n}-${d.name}/`;
      a.innerHTML = `<span class="n">${d.n}</span><span class="nm">${d.name}</span><span class="sh">${d.built ? d.shows : 'todo'}</span>`;
      li.append(a);
      root.append(li);
    }
  }
</script>
</html>
