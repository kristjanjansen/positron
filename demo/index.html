<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<!-- 🔴 THE TAB SAYS `positron` AND THE PAGE SAYS MORE, ON INSTRUCTION
     2026-09-24: *"convert title to positron: x media art experiments ... html
     <title> stays positron"*. The visible name is built by `indexTitle()` in
     `demo/manifest.mjs`, which COUNTS the rows it is about to draw; a tab
     carrying a number would be one more copy of it to go stale, in the one
     place a reader cannot see it change. -->
<title>positron</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="icon" href="/favicon.ico">

<div class="pos-head pos-index">
  <div class="pos-title"><h1 class="pos-name">positron</h1></div>
</div>

<div id="rows"></div>

<script type="module">
  import { NOTES, byGroup, groupHTML, noteHTML, indexTitle } from '/manifest.mjs';
  import { markIndex } from '/shell/caps.mjs';

  /**
   * 🔴 THE FRONT PAGE GETS A FEEDBACK BUTTON TOO, AND IT IS NOT THE SHELL'S.
   * Every demo page has one because `shell.mjs` mounts it; this page does not
   * mount the shell, so the one page everybody lands on first was the one page
   * with nowhere to say anything. Asked for in those words, with the label:
   * *"add feedback button to fronpage too ('general feedback')"*.
   *
   * ⚠️ `isTrusted`, THE SAME GATE, FOR THE SAME REASON. `shell.mjs` carries the
   * long note: a scripted press produces `isTrusted: false`, and a control that
   * writes to a store a person is going to read may only be worked by a person.
   * A second copy of that button without a second copy of that gate is how the
   * gate stops meaning anything.
   *
   * ⚠️ AND THE SLUG IS `general`, WHICH IS WHAT THE PANEL TITLES ITSELF FROM.
   * Notes are stored with it, so a note about the site as a whole can be told
   * apart from a note about a page when they are read back.
   */
  {
    const fb = document.createElement('button');
    fb.className = 'pos-fb-btn';
    fb.type = 'button';
    // ⚠️ THE BUTTON SAYS `Feedback` ON EVERY PAGE INCLUDING THIS ONE, and only
    // the PANEL says which feedback it is. Reported in one line: *"'feedback'
    // is always button name. 'general feedback' is modal title"*. A button
    // whose label changes per page is a control a reader has to re-find; the
    // panel's own title is where the scope belongs, and `slug` below is what
    // writes it.
    fb.textContent = 'Feedback';
    fb.dataset.slug = 'general';
    fb.setAttribute('aria-haspopup', 'dialog');
    fb.setAttribute('aria-expanded', 'false');
    fb.title = 'say something about the site as a whole';
    fb.addEventListener('click', async (e) => {
      if (!e.isTrusted) return;
      fb.setAttribute('aria-expanded', 'true');
      try {
        const m = await import('/shell/feedback.mjs');
        m.openFeedback(null, { slug: 'general' });
      } catch {
        fb.setAttribute('aria-expanded', 'false');
      }
    });
    document.querySelector('.pos-title')?.append(fb);
  }

  // ⚠️ THE SAME FUNCTIONS THE BUILD CALLS, on rows this page renders itself.
  // The deployed front page is baked by workers/view/build.mjs and this one is
  // scripted, and they have printed different things before — `rowHTML` lived
  // in two places and one copy went on printing `undefined` over every demo
  // name for an afternoon after the other was fixed. One renderer, two callers.
  // ⚠️ THE NAME IS WRITTEN HERE AND BAKED IN THE DEPLOYED COPY, from the same
  // function, because this page renders its own rows and the build renders its.
  // The static `positron` in the markup above is what a reader sees for the one
  // frame before this runs, which is the page's name and not a wrong number.
  document.querySelector('.pos-name').textContent = indexTitle();
  document.getElementById('rows').innerHTML = byGroup().map(groupHTML).join('');
  // Nothing at all when there are no notes. `NOTES` is empty and this wrote the
  // heading over an empty list on every load; the build does the same test for
  // the same reason. A container with nothing in it must not paint its edges.
  if (NOTES.length) {
    document.body.insertAdjacentHTML('beforeend',
      '<h2 class="pos-act-h">notes</h2><ol class="pos-acts">' + NOTES.map(noteHTML).join('') + '</ol>');
  }

  // Same call the deployed index makes, on rows this page rendered itself.
  // markIndex also puts the headset offer at the top when there is one —
  // one copy, in caps.mjs, because both index pages need it.
  await markIndex(document);
</script>
</html>
