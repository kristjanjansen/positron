<!doctype html>
<meta charset="utf-8">
<title>COMPOSE — a timeline inside a timeline</title>
<style>
  :root { --bg:#0b0c10; --fg:#dfe3ea; --dim:#7a8291; --au:#4fb0c6; --nest:#ffd479; --note:#ff7ba9; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.5 ui-monospace,Menlo,monospace; }
  h1 { font-size:15px; letter-spacing:.16em; margin:0; }
  #top { padding:10px 12px; border-bottom:1px solid #1c2028; display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  #top .sub { color:var(--dim); font-size:11px; }
  .box { border:1px solid #1c2028; margin:10px 12px; padding:10px 12px; }
  .box h2 { font-size:11px; letter-spacing:.18em; color:var(--dim); margin:0 0 8px; font-weight:400; }
  button { background:#161a22; color:var(--fg); border:1px solid #2a3040; padding:3px 10px; font:inherit; cursor:pointer; }
  button.hot { background:#2a2010; border-color:#5a4a20; color:var(--nest); }
  #tbar { display:flex; gap:10px; align-items:center; padding:8px 12px; border-bottom:1px solid #1c2028; }
  canvas.strip { display:block; width:100%; border:1px solid #1c2028; background:#0f1117; }
  #arr { height:122px; } #child { height:78px; }
  #stripread { font-size:10.5px; color:var(--dim); padding:4px 0 0; }
  #keys { display:flex; gap:2px; margin-top:8px; }
  #keys div { width:15px; height:34px; background:#161a22; border:1px solid #232936; border-radius:0 0 2px 2px; }
  #keys div.lit { background:var(--note); border-color:var(--note); }
  table { border-collapse:collapse; font-size:11px; }
  td { padding:1px 12px 1px 0; vertical-align:top; }
  td.k { color:var(--dim); }
  b { color:#fff; }
  .ok { color:#7fd18c; } .bad { color:#ff6b6b; }
  pre { font-size:10.5px; color:#8b93a3; white-space:pre-wrap; margin:0; max-height:230px; overflow:auto; }
</style>

<div id="top">
  <h1>COMPOSE — A TIMELINE INSIDE A TIMELINE</h1>
  <span class="sub">a stored instrument session is ONE SPAN in an arrangement, beside archive layers</span>
</div>

<div id="tbar">
  <button id="play">▶</button>
  <button id="slow">−</button><span id="rate">1.00×</span><button id="fast">+</button>
  <button id="toNest" class="hot">seek into the session</button>
  <button id="outside">seek outside it</button>
  <span id="read" style="color:var(--dim)"></span>
</div>

<div class="box">
  <h2>ARRANGEMENT (parent domain, ms) — drag to seek · shift-drag to pan · shift-wheel to zoom</h2>
  <canvas id="arr" class="strip" height="122"></canvas>
  <canvas id="child" class="strip" height="78" style="margin-top:6px"></canvas>
  <div id="stripread"></div>
  <div style="margin-top:6px"><button id="follow">follow: on</button> <button id="fitall">fit arrangement</button> <button id="fitnest">fit the session</button></div>
  <div id="keys"></div>
</div>

<div class="box"><h2>NUMBERS</h2><table id="hud"></table></div>
<div class="box"><h2>VERIFICATION</h2><pre id="verdict">not run</pre></div>

<script type="module">
'use strict';
// ============================================================================
// THE COMPOSED DEMO — the case that motivated timeline/nested.mjs.
//
// Parent: an ARRANGEMENT deck (the remixer's own domain and its `media-span`
// adapter, trimmed) carrying two archive layers.
// Nested:  ONE SPAN THAT IS ITSELF A DECK — the instrument rig's KEPT PROOF
// SESSION (proto/instrument/results/instr-session.jsonl, 128 real MIDI rows in
// epoch µs), rebuilt here through makeLogDeck with the instrument's own three-
// lane shape: an audible note lane (held-note reduce) and a media-span whose
// element is the CLOCK MASTER *inside the session*.
//
// The rule that makes it composable (nested.mjs rule 4): that inner master
// governs ONLY WITHIN THE CHILD. The parent slaves to the CHILD'S POSITION —
// never to the element — so the two masters cannot fight.
//
// HONESTY, twice over:
//  1. The archive neighbours here are SYNTHETIC generated tones, not ERR items.
//     The real-1965 case is already proven by index.html (11/11, 6 upstream
//     calls); this page is about the nesting primitive and deliberately makes
//     ZERO upstream calls. Same adapter, same domain, honest stand-in material.
//  2. The stored session's *audio return* is not in the repo (it lives in the
//     rig's IndexedDB), so the child's media-span element is likewise a
//     generated tone of the session's own recorded duration, anchored at the
//     session's own `audio-span` timestamp. The TIMING is real — it comes out
//     of the log; the SOUND is not.
// ============================================================================
import { createDeck } from '/timeline/transport.mjs';
import { makeLogDeck, pstats } from '/timeline/logdeck.mjs';
import { createNest, nestedDrift } from '/timeline/nested.mjs';
import { createStrip, spansOf } from '/timeline/strip.mjs';

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const ERRORS = [];
window.addEventListener('error', (e) => ERRORS.push(String(e.message)));

// --- synthetic media --------------------------------------------------------
function toneWav(seconds, freq, sr = 8000) {
  const n = Math.round(seconds * sr), buf = new ArrayBuffer(44 + n * 2), dv = new DataView(buf);
  const wr = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  wr(0, 'RIFF'); dv.setUint32(4, 36 + n * 2, true); wr(8, 'WAVEfmt '); dv.setUint32(16, 16, true);
  dv.setUint16(20, 1, true); dv.setUint16(22, 1, true); dv.setUint32(24, sr, true);
  dv.setUint32(28, sr * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
  wr(36, 'data'); dv.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    const t = i / sr, env = 0.22 * (0.6 + 0.4 * Math.sin(2 * Math.PI * 0.25 * t));
    dv.setInt16(44 + i * 2, Math.round(env * 32767 * Math.sin(2 * Math.PI * freq * t)), true);
  }
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
function mkAudio(url) {
  const el = document.createElement('audio');
  el.src = url; el.preload = 'auto'; el.volume = 0.35;
  document.body.appendChild(el);
  return el;
}
const ready = (el) => new Promise((res) => {
  if (el.readyState >= 1) return res();
  el.addEventListener('loadedmetadata', res, { once: true });
  el.addEventListener('error', res, { once: true });
  setTimeout(res, 4000);
});

// ============================================================================
// THE CHILD — the stored instrument session, as its own deck.
// Adapters are a trimmed copy of proto/instrument/play.js's three lanes.
// ============================================================================
const CH = { deck: null, spans: {}, master: null, fires: { 'midi-actuated': 0, 'media-span': 0 },
             syncCalls: 0, syncCorrections: [], voices: new Set(), notes: [], mediaRestarts: 0 };

// THE NOTE LANE, as a QUERY. Nothing in the MIDI log says `phase` — a note-on
// and its note-off are two flat rows — so the LANE declares the pairing and the
// strip's span machinery does the rest. This one declaration is both the
// drawing and the source of CH.notes (see buildChild).
const NOTE_LANE = {
  id: 'notes', kind: 'midi-actuated', label: 'notes', height: 42, as: 'spans',
  phase: (r) => { const [s, , v] = r.payload.raw; return ((s & 0xf0) === 0x90 && v > 0) ? 'enter' : 'exit'; },
  group: (r) => r.payload.raw[1],
  slots: 8, slotOf: (s) => (s.key - 60), labels: false, color: '#ff7ba9', allSkirt: false,
};
let ac = null, gain = null;
try { ac = new (window.AudioContext || window.webkitAudioContext)(); gain = ac.createGain(); gain.gain.value = 0.12; gain.connect(ac.destination); ac.resume().catch(() => {}); } catch {}
const OSC = new Map();
function voiceOn(raw) {
  const [st, n, v] = raw;
  const on = (st & 0xf0) === 0x90 && v > 0;
  if (on) CH.voices.add(n); else CH.voices.delete(n);
  if (ac) try {
    if (on && !OSC.has(n)) {
      const o = ac.createOscillator(); o.type = 'triangle';
      o.frequency.value = 440 * Math.pow(2, (n - 69) / 12); o.connect(gain); o.start(); OSC.set(n, o);
    } else if (!on && OSC.has(n)) { OSC.get(n).stop(); OSC.delete(n); }
  } catch {}
  paintKeys();
}
function silenceAll() { for (const n of [...CH.voices]) voiceOn([0x80, n, 0]); CH.voices.clear(); paintKeys(); }
const heldFold = (payloads) => {
  const held = new Map();
  for (const p of payloads) { const [s, n, v] = p.raw; if ((s & 0xf0) === 0x90 && v > 0) held.set(n, p); else held.delete(n); }
  return held;
};
const actuatedAdapter = {
  caps: { kind: 'midi-actuated', domain: 'wall', unit: 'ms', lane: 'host (instrument clock)',
          seekable: true, reducible: true, audible: true, rates: [0.25, 0.5, 1, 2, 4], catchUp: 'burst' },
  actuate(p) { CH.fires['midi-actuated']++; voiceOn(p.raw); },
  reduce: heldFold,
  assertState(held) { silenceAll(); for (const p of held.values()) voiceOn(p.raw); },
};
function assertChildSpan(sp, pos, present) {
  const u = pos - sp.pos0;
  if (!present || u < 0 || (sp.durMs && u > sp.durMs)) { if (!sp.el.paused) sp.el.pause(); return; }
  const want = u / 1000;
  if (Math.abs(sp.el.currentTime - want) > 0.05) { try { sp.el.currentTime = want; } catch {} }
  sp.el.playbackRate = Math.max(0.0625, Math.min(16, CH.deck ? CH.deck.targetRate() : 1));
  if (CH.deck && CH.deck.playing()) sp.el.play().catch(() => {}); else sp.el.pause();
}
const childSpanAdapter = {
  caps: { kind: 'media-span', domain: 'wall', unit: 'ms', seekable: true, reducible: true,
          clockMaster: true, seekAccuracyMs: 40, rates: [0.25, 0.5, 1, 2, 4], syncToleranceMs: 40, catchUp: 'reduce' },
  actuate(p) { CH.fires['media-span']++; const sp = CH.spans[p.lane]; if (sp) assertChildSpan(sp, CH.deck ? CH.deck.position() : p.at, p.phase === 'enter'); },
  reduce(payloads, pos) {
    const present = new Set();
    for (const p of payloads) { if (p.phase === 'enter') present.add(p.lane); else present.delete(p.lane); }
    for (const lane of [...present]) { const sp = CH.spans[lane], u = sp ? pos - sp.pos0 : -1; if (!sp || u < 0 || (sp.durMs && u > sp.durMs)) present.delete(lane); }
    return present;
  },
  assertState(present, info) { for (const [lane, sp] of Object.entries(CH.spans)) assertChildSpan(sp, info.pos, present.has(lane)); },
};
// the CHILD's own clock master — governs INSIDE the child only (nested rule 4)
let chAdvance = { t: null, wall: 0 };
function childDriveFromMaster() {
  const m = CH.master;
  if (!CH.deck || !CH.deck.playing() || !m || m.el.paused) return;
  const mediaT = m.pos0 + m.el.currentTime * 1000;
  const now = performance.now();
  if (chAdvance.t !== null && mediaT === chAdvance.t && now - chAdvance.wall > 1000) return;  // stalled: free-run
  if (chAdvance.t === null || mediaT !== chAdvance.t) chAdvance = { t: mediaT, wall: now };
  CH.syncCalls++;
  const c = CH.deck.sync(mediaT, { toleranceMs: 40 });
  if (c) { CH.syncCorrections.push(+c.toFixed(1)); if (CH.syncCorrections.length > 400) CH.syncCorrections.shift(); }
}

async function buildChild() {
  const txt = await (await fetch('/instrument/results/instr-session.jsonl')).text();
  const rows = txt.trim().split('\n').map((l) => JSON.parse(l));
  const midi = rows.filter((e) => (e.kind === 'midi' || e.kind === 'midi-actuated') && Array.isArray(e.raw));
  // THE HOST CLOCK IS MASTER when replaying from storage (play.js masterLane()).
  // This kept session stored no `midi-actuated` lane, so the player's own rows
  // are the master lane and the audio alignment is skew-limited — stated, not
  // hidden.
  const host = midi.filter((e) => e.kind === 'midi-actuated');
  const masterRows = (host.length ? host : midi.filter((e) => e.kind === 'midi')).slice().sort((a, b) => a.at - b.at);
  const audioSpan = rows.find((e) => e.kind === 'audio-span');
  const atUs = audioSpan ? audioSpan.at : masterRows[0].at;
  const durMs = Math.round((masterRows[masterRows.length - 1].at - atUs) / 1000) + 1500;
  const el = mkAudio(toneWav(durMs / 1000, 196));
  await ready(el);
  CH.spans.audio = { lane: 'audio', el, durMs, pos0: 0 };

  const deck = CH.deck = makeLogDeck({
    lanes: [
      { kind: 'midi-actuated', rows: masterRows, adapter: actuatedAdapter },
      { kind: 'media-span', rows: [{ at: atUs, lane: 'audio' }], adapter: childSpanAdapter,
        expand: (row) => [
          { atUs: row.at, id: 'span-audio-in', payload: { lane: 'audio', phase: 'enter' } },
          { atUs: row.at + durMs * 1000, id: 'span-audio-out', payload: { lane: 'audio', phase: 'exit' } },
        ] },
    ],
    leadInMs: 250, tailMs: 500, tickHost: 'main',
  });
  CH.spans.audio.pos0 = deck.toPos(atUs);
  CH.master = CH.spans.audio;
  deck.transport.onState((st) => {
    if (st.reason !== 'play' && st.reason !== 'pause' && st.reason !== 'rate') return;
    const r = Math.max(0.0625, Math.min(16, deck.targetRate()));
    for (const sp of Object.values(CH.spans)) {
      sp.el.playbackRate = r;
      const u = deck.position() - sp.pos0;
      if (deck.playing() && u >= 0 && u <= sp.durMs) sp.el.play().catch(() => {}); else sp.el.pause();
    }
  });
  // Note intervals, for choosing meaningful probe positions. This used to be a
  // six-line open-note map written here; it is the SAME pairing the strip does
  // for its note lane, so it is one call to the component's own spansOf() over
  // a deck query. One definition, two consumers.
  CH.notes = spansOf(deck.window('midi-actuated'), NOTE_LANE)
    .filter((s) => Number.isFinite(s.to))
    .map((s) => ({ n: s.key, on: s.from, off: s.to }));
  deck.seek(deck.range[0]);
  return { deck, notes: masterRows.length, atUs, durMs, sessionRows: rows.length };
}

// ============================================================================
// THE PARENT — the arrangement (the remixer's media-span adapter, trimmed)
// ============================================================================
const PA = { deck: null, layers: new Map(), nest: null, syncCalls: 0 };
const SERVO_BAND_MS = 20, HARD_RESYNC_MS = 150;
function assertLayer(L, pos, present) {
  const u = pos - L.at;
  if (!present || u < 0 || u > L.durMs) { if (!L.el.paused) L.el.pause(); return; }
  const want = u / 1000;
  if (Math.abs(L.el.currentTime - want) > HARD_RESYNC_MS / 1000) { try { L.el.currentTime = want; } catch {} }
  L.el.playbackRate = PA.deck ? PA.deck.targetRate() : 1;
  if (PA.deck && PA.deck.playing()) L.el.play().catch(() => {}); else L.el.pause();
}
const archAdapter = {
  caps: { kind: 'media-span', domain: 'arrangement', unit: 'ms', seekable: true, reducible: true,
          clockMaster: false, seekAccuracyMs: 40, rates: [0.5, 0.75, 1, 1.5, 2],
          servoBandMs: SERVO_BAND_MS, syncToleranceMs: 40, catchUp: 'reduce', anchor: 'arrangement-offset' },
  actuate(p) { const L = PA.layers.get(p.tag); if (L) assertLayer(L, PA.deck ? PA.deck.position() : p.at, p.phase === 'enter'); },
  reduce(payloads, pos) {
    const present = new Set();
    for (const p of payloads) { if (p.phase === 'enter') present.add(p.tag); else present.delete(p.tag); }
    for (const tag of [...present]) { const L = PA.layers.get(tag), u = L ? pos - L.at : -1; if (!L || u < 0 || u > L.durMs) present.delete(tag); }
    return present;
  },
  assertState(present, info) { for (const [tag, L] of PA.layers) assertLayer(L, info.pos, present.has(tag)); },
};
function servoArchive() {
  if (!PA.deck || !PA.deck.playing()) return;
  const pos = PA.deck.position(), r = PA.deck.targetRate();
  for (const [, L] of PA.layers) {
    const u = pos - L.at;
    if (u < 0 || u > L.durMs) { if (!L.el.paused) L.el.pause(); continue; }
    if (L.el.paused) { L.el.play().catch(() => {}); continue; }
    const errMs = L.el.currentTime * 1000 - u;
    if (Math.abs(errMs) > HARD_RESYNC_MS) { try { L.el.currentTime = u / 1000; } catch {} continue; }
    L.el.playbackRate = r * (errMs > SERVO_BAND_MS ? 0.94 : errMs < -SERVO_BAND_MS ? 1.06 : 1);
  }
}

const ARR_END = 75000, NEST_AT = 30000;
// the QUOTATION: a 10 s slice of the same session, placed BEFORE the whole one.
// [5000, 15000] in parent time — disjoint from `sess` at [30000, 30000+childDur],
// which rule 7g requires: one deck has one position.
const FRAG_AT = 5000, FRAG_HALF = 5000;
const FRAG = { in: null, out: null };
const LAYOUT = [
  { tag: 'A1', at: 0, durMs: 75000, freq: 110 },
  { tag: 'A2', at: 10000, durMs: 40000, freq: 147 },
];

async function build() {
  const child = await buildChild();
  const items = [];
  for (const L of LAYOUT) {
    const el = mkAudio(toneWav(L.durMs / 1000, L.freq));
    await ready(el);
    PA.layers.set(L.tag, { ...L, el });
    items.push({ at: L.at, kind: 'media-span', id: `sp-${L.tag}-in`, payload: { tag: L.tag, phase: 'enter' } });
    items.push({ at: L.at + L.durMs, kind: 'media-span', id: `sp-${L.tag}-out`, payload: { tag: L.tag, phase: 'exit' } });
  }
  const deck = PA.deck = createDeck({
    items, range: [0, ARR_END], adapters: { 'media-span': archAdapter }, tickHost: 'main',
  });
  deck.transport.onState((st) => {
    if (st.reason !== 'play' && st.reason !== 'pause' && st.reason !== 'rate') return;
    for (const [, L] of PA.layers) {
      L.el.playbackRate = deck.targetRate();
      const u = deck.position() - L.at;
      if (deck.playing() && u >= 0 && u <= L.durMs) L.el.play().catch(() => {}); else L.el.pause();
    }
  });
  // ---- THE NESTED SPAN. One line of client code, and it is a deck. ----------
  PA.nest = createNest(deck, { kind: 'deck-span', toleranceMs: 40, hardSeekMs: 250 });
  PA.nest.add({ id: 'sess', at: NEST_AT, rate: 1, deck: child.deck, master: true });

  // ---- AND THE QUOTATION (v0.5, rule 7). The SAME session deck, a second
  // time, as a SLICE: `in`/`out` pick a sub-range of the child's domain. This
  // is the mission sentence (plan-timeline §−1 / C10 — "a new work is a score
  // that QUOTES archive timelines") made executable: nobody quotes a whole
  // broadcast, and until now a span could only play the child's whole range.
  // Note there is exactly ONE child deck and ONE audio element under it: the
  // trim lives on the SPAN, so one stored timeline carries many quotations.
  const [cq0, cq1] = child.deck.range;
  const cmid = (cq0 + cq1) / 2;
  // the session is ~18.6 s, so the largest true MIDDLE slice is 10 s (a 20 s
  // ask would clamp to the whole session — asserted, with its report, in run())
  FRAG.in = Math.max(cq0, cmid - FRAG_HALF);
  FRAG.out = Math.min(cq1, cmid + FRAG_HALF);
  PA.nest.add({ id: 'quote', at: FRAG_AT, rate: 1, deck: child.deck, in: FRAG.in, out: FRAG.out });
  deck.seek(0);
  drawArrangement();
  return child;
}

// The `caps.followsTransport` seam, one level down: an element that is asked to
// play() while the transport is mid-boundary can silently stay paused (measured:
// the child's audio started on one headless run and not the next). Every media
// client in this repo re-writes this repair; here it is once, and it makes the
// child's master self-healing — the element is never NUDGED (it is the child's
// clock), only re-started if it is in-span and idle.
function followChildMedia() {
  const sp = CH.spans.audio;
  if (!CH.deck || !sp) return;
  const u = CH.deck.position() - sp.pos0;
  const inSp = u >= 0 && u <= sp.durMs;
  if (!CH.deck.playing() || !inSp) { if (!sp.el.paused) sp.el.pause(); return; }
  if (sp.el.paused) {
    CH.mediaRestarts++;
    try { sp.el.currentTime = u / 1000; } catch {}
    sp.el.playbackRate = Math.max(0.0625, Math.min(16, CH.deck.targetRate()));
    sp.el.play().catch(() => {});
  }
}

// --- servo loop: the child's master, then the nest, then the archive layers --
function loop() {
  followChildMedia();
  childDriveFromMaster();
  if (PA.nest) PA.nest.servo();
  servoArchive();
  paint();
  requestAnimationFrame(loop);
}

// --- drawing ----------------------------------------------------------------
// TWO STRIPS, ONE COMPONENT. The parent arrangement and the child session are
// two decks, so they are two createStrip() calls over the same lanes-as-queries
// shape — not two hand-drawn pictures. Everything the divs used to do (percent
// of a hardcoded ARR_END, an absolutely positioned playhead, a nested box with
// its own inner percent mapping) is gone; what arrives instead is a real time
// axis with tick LOD, zoom, a dual cursor, hover detail, and — for the first
// time — the QUOTATION span drawn, which the div version never showed at all.
const STRIP = { arr: null, child: null };
function drawArrangement() {
  STRIP.arr = createStrip($('arr'), PA.deck, {
    absolute: false, gutter: 96, hud: $('stripread'),
    lanes: [
      { id: 'archive', kind: 'media-span', label: 'archive', height: 40, color: '#4fb0c6',
        labelOf: (s) => `${s.key} · archive stand-in ${((s.to - s.from) / 1000) | 0}s` },
      // the nested SESSION and the QUOTATION are the same lane: both are
      // `deck-span` items on the parent, so one query draws both.
      { id: 'nested', kind: 'deck-span', label: 'nested decks', height: 34, color: '#ffd479',
        labelOf: (s) => `${s.key}${s.row.payload.childRange ? ` · ${((s.row.payload.trim && s.row.payload.trim.chose ? s.row.payload.trim.chose[1] - s.row.payload.trim.chose[0] : s.to - s.from) / 1000).toFixed(1)}s of the session` : ''}` },
    ],
  });
  STRIP.child = createStrip($('child'), CH.deck, {
    absolute: false, gutter: 96,
    lanes: [
      { id: 'audio', kind: 'media-span', label: 'session audio', height: 24, color: '#3a6f80', labels: false },
      NOTE_LANE,
    ],
  });
  STRIP.child.fit();
  const kb = $('keys');
  kb.innerHTML = '';
  for (let n = 60; n <= 72; n++) { const d = document.createElement('div'); d.dataset.n = n; kb.appendChild(d); }
}
function paintKeys() {
  const kb = $('keys');
  for (const d of kb.children) d.classList.toggle('lit', CH.voices.has(+d.dataset.n));
}
function paint() {
  const d = PA.deck; if (!d) return;
  const pos = d.position();
  // both playheads are the strips' own, drawn from deck.position() every frame
  $('play').textContent = d.playing() ? '❚❚' : '▶';
  $('rate').textContent = d.targetRate().toFixed(2) + '×';
  const present = PA.nest.present('sess') || PA.nest.present('quote');
  if (STRIP.child) $('child').style.opacity = present ? '1' : '0.35';
  $('read').textContent = `parent ${(pos / 1000).toFixed(2)}s · session ${present ? (CH.deck.position() / 1000).toFixed(2) + 's' : 'ABSENT'}`;
  const rr = PA.nest.rateReport('sess');
  $('hud').innerHTML = [
    ['parent pos / rate', `${(pos / 1000).toFixed(3)} s · ${d.rate().toFixed(2)}× (target ${d.targetRate().toFixed(2)}×)`],
    ['nested span', `at ${(NEST_AT / 1000)} s · rate 1 · ${(PA.nest.span('sess').parentDur / 1000).toFixed(2)} s of parent time · master=${PA.nest.masterId()}`],
    ['QUOTATION', (() => { const q = PA.nest.span('quote'); return q
      ? `at ${(q.at / 1000)} s · in ${(q.in / 1000).toFixed(2)} s → out ${(q.out / 1000).toFixed(2)} s of the SAME deck ` +
        `(${((q.out - q.in) / 1000).toFixed(2)} s slice, ${(q.trim.quotedFraction * 100).toFixed(0)}% of the session) · ` +
        `${PA.nest.present('quote') ? 'PRESENT' : 'absent'}` : '—'; })()],
    ['child pos / rate', present ? `${(CH.deck.position() / 1000).toFixed(3)} s · ${CH.deck.rate().toFixed(2)}× (target ${CH.deck.targetRate().toFixed(2)}×)` : 'ABSENT — outside the span'],
    ['rate composition', rr ? `wanted ${rr.wanted}× → chose ${rr.chose}×${rr.degraded ? ' <span class="bad">DEGRADED</span>' : ' <span class="ok">exact</span>'} · child lattice [${rr.allowed}]` : '–'],
    ['child fires', `midi-actuated ${CH.fires['midi-actuated']} · media-span ${CH.fires['media-span']} · held [${[...CH.voices].sort((a, b) => a - b)}]`],
    ['child master (inner)', `${CH.syncCalls} sync() calls, ${CH.syncCorrections.length} corrections > 40 ms`],
    ['nest servo (outer)', `${PA.nest.driftStats().spans[0].parentCorrections.n} parent corrections from the CHILD'S position`],
  ].map(([k, v]) => `<tr><td class="k">${k}</td><td>${v}</td></tr>`).join('');
}

// --- controls ---------------------------------------------------------------
$('play').onclick = () => (PA.deck.playing() ? PA.deck.pause() : PA.deck.play());
$('slow').onclick = () => PA.deck.setRate(Math.max(0.25, PA.deck.targetRate() / 2));
$('fast').onclick = () => PA.deck.setRate(Math.min(4, PA.deck.targetRate() * 2));
$('toNest').onclick = () => PA.deck.seek(NEST_AT + 9000);
$('outside').onclick = () => PA.deck.seek(60000);
// seek, pan, zoom and hover are the strip's (control-is-the-display); all that
// is left here is the follow control the strip refuses to fake.
$('follow').onclick = () => { const on = !STRIP.arr.follow().on; STRIP.arr.setFollow(on); STRIP.child.setFollow(on); $('follow').textContent = `follow: ${on ? 'on' : 'off'}`; };
$('fitall').onclick = () => STRIP.arr.fit(0, ARR_END);
$('fitnest').onclick = () => STRIP.arr.fit(NEST_AT - 2000, NEST_AT + PA.nest.span('sess').parentDur + 2000);

// ============================================================================
// VERIFICATION — headless-drivable; the driver calls __compose.run()
// ============================================================================
const CHECKS = [];
const chk = (name, ok, detail) => { CHECKS.push({ name, ok: !!ok, detail }); return ok; };
const held = () => [...CH.voices].sort((a, b) => a - b);
const wantHeld = (u) => CH.deck.reducedKeys('midi-actuated', u);

async function run() {
  const R = { checks: CHECKS, seeks: [], probes: [] };

  // 1 — structure
  const pc = PA.deck.caps();
  R.parentKinds = Object.keys(pc); R.childKinds = Object.keys(CH.deck.caps());
  chk('one parent deck carries a media-span AND a deck-span adapter',
    R.parentKinds.includes('media-span') && R.parentKinds.includes('deck-span'), R.parentKinds.join(','));
  chk('the nested adapter never masters the parent by default (rule 4)',
    pc['deck-span'].nested === true && pc['deck-span'].clockMaster === false, JSON.stringify({ nested: pc['deck-span'].nested, clockMaster: pc['deck-span'].clockMaster }));
  chk('the child is a real 3-lane instrument deck (notes + its own media master)',
    R.childKinds.includes('midi-actuated') && R.childKinds.includes('media-span') && CH.deck.caps('media-span').clockMaster === true, R.childKinds.join(','));
  const ds0 = PA.nest.driftStats();
  R.depth = ds0.depth;
  chk('nesting depth is 2 and the span is the declared master', ds0.depth === 2 && PA.nest.masterId() === 'sess', `depth ${ds0.depth}`);

  // 2 — cycles rejected on the LIVE decks
  let cyc = null;
  try { PA.nest.add({ id: 'boom', deck: PA.deck }); } catch (e) { cyc = e.message; }
  let cyc2 = null;
  try { createNest(CH.deck, { kind: 'cyc' }).add({ id: 'boom2', deck: PA.deck }); } catch (e) { cyc2 = e.message; }
  R.cycle = { self: cyc, back: cyc2 };
  chk('a deck containing itself is rejected', /cannot contain itself/.test(cyc || ''), cyc);
  chk('child -> parent (closing the loop) is rejected', /cycle/.test(cyc2 || ''), cyc2);

  // 3 — plays in its arrangement slot
  PA.deck.seek(NEST_AT - 2000);
  const f0 = CH.fires['midi-actuated'];
  PA.deck.play(1);
  await sleep(7000);
  const posIn = PA.deck.position(), cIn = CH.deck.position();
  R.playsInSlot = { parentS: +(posIn / 1000).toFixed(3), childS: +(cIn / 1000).toFixed(3),
    mapErrMs: +(cIn - (posIn - NEST_AT)).toFixed(1), fires: CH.fires['midi-actuated'] - f0,
    mediaCurrentTimeS: +CH.spans.audio.el.currentTime.toFixed(3),
    mediaReadyState: CH.spans.audio.el.readyState, mediaPaused: CH.spans.audio.el.paused,
    mediaRestarts: CH.mediaRestarts, childSpanFires: CH.fires['media-span'],
    innerSyncCalls: CH.syncCalls, innerCorrections: CH.syncCorrections.length,
    outerCorrections: PA.nest.driftStats().spans[0].parentCorrections.n };
  chk('the session PLAYS in its arrangement slot (notes fire, its own audio runs)',
    R.playsInSlot.fires > 0 && R.playsInSlot.mediaCurrentTimeS > 0.5, JSON.stringify(R.playsInSlot));
  chk('child position tracks the parent mapping while the CHILD masters',
    Math.abs(R.playsInSlot.mapErrMs) < 60, `map error ${R.playsInSlot.mapErrMs} ms`);
  PA.deck.pause();
  await sleep(200);

  // 4 — parent seek lands INSIDE the session; the held-note reduce is correct
  const mids = CH.notes.filter((n) => n.off - n.on > 40).map((n) => (n.on + n.off) / 2);
  const gaps = [];
  for (let i = 1; i < CH.notes.length; i++) { const g = (CH.notes[i - 1].off + CH.notes[i].on) / 2; if (CH.notes[i].on - CH.notes[i - 1].off > 20) gaps.push(g); }
  const probes = [];
  for (let i = 0; i < 8; i++) probes.push(mids[Math.floor(i * mids.length / 8)]);
  for (let i = 0; i < 6; i++) probes.push(gaps[Math.floor(i * gaps.length / 6)]);
  let exact = 0, withNote = 0;
  for (const u of probes) {
    if (!Number.isFinite(u)) continue;
    PA.deck.seek(NEST_AT + u);
    await sleep(60);
    const got = held(), want = wantHeld(u);
    const posErr = +(CH.deck.position() - u).toFixed(3);
    const ok = String(got) === String(want) && Math.abs(posErr) < 1;
    if (ok) exact++;
    if (want.length) withNote++;
    R.probes.push({ parentMs: +(NEST_AT + u).toFixed(1), childMs: +u.toFixed(1), childPosErrMs: posErr, got, want, ok });
  }
  R.probeSummary = { n: R.probes.length, exact, withNoteHeld: withNote,
    maxPosErrMs: Math.max(...R.probes.map((p) => Math.abs(p.childPosErrMs))) };
  chk('a parent seek lands EXACTLY inside the nested session (position + held-note reduce)',
    exact === R.probes.length && withNote > 0, JSON.stringify(R.probeSummary));

  // 5 — parent pause stops everything
  PA.deck.seek(NEST_AT + 6000);
  PA.deck.play(1);
  await sleep(1200);
  PA.deck.pause();
  await sleep(150);
  const p0 = PA.deck.position(), c0 = CH.deck.position(), m0 = CH.spans.audio.el.currentTime;
  const a0 = [...PA.layers.values()].map((L) => L.el.currentTime);
  await sleep(1500);
  R.pause = {
    parentDriftMs: +(PA.deck.position() - p0).toFixed(3),
    childDriftMs: +(CH.deck.position() - c0).toFixed(3),
    childMediaDriftMs: +((CH.spans.audio.el.currentTime - m0) * 1000).toFixed(1),
    archiveDriftMs: [...PA.layers.values()].map((L, i) => +((L.el.currentTime - a0[i]) * 1000).toFixed(1)),
    childPlaying: CH.deck.playing(), childMediaPaused: CH.spans.audio.el.paused,
    archivePaused: [...PA.layers.values()].map((L) => L.el.paused),
  };
  chk('parent pause stops EVERYTHING, one and two levels down',
    R.pause.parentDriftMs === 0 && R.pause.childDriftMs === 0 && !R.pause.childPlaying &&
    R.pause.childMediaPaused && R.pause.archivePaused.every(Boolean), JSON.stringify(R.pause));

  // 6 — parent rate 2x composes with the child
  PA.deck.setRate(2);
  const armed = { parentRate: PA.deck.rate(), parentTarget: PA.deck.targetRate(),
    childTarget: CH.deck.targetRate(), report: PA.nest.rateReport('sess') };
  R.rate = { armed };
  chk('setRate(2) ARMS while paused and composes 2x1 into the child (no degradation)',
    armed.parentRate === 0 && armed.parentTarget === 2 && armed.childTarget === 2 &&
    armed.report.wanted === 2 && armed.report.chose === 2 && armed.report.degraded === false, JSON.stringify(armed));
  const rp0 = PA.deck.position(), rc0 = CH.deck.position();
  const t0 = performance.now();
  PA.deck.play();
  await sleep(3000);
  const wall = performance.now() - t0;
  R.rate.run = { wallMs: Math.round(wall),
    parentAdvancedMs: Math.round(PA.deck.position() - rp0),
    childAdvancedMs: Math.round(CH.deck.position() - rc0),
    childMediaRate: CH.spans.audio.el.playbackRate,
    archiveRates: [...PA.layers.values()].map((L) => +L.el.playbackRate.toFixed(2)) };
  R.rate.run.parentRatio = +(R.rate.run.parentAdvancedMs / wall).toFixed(3);
  R.rate.run.childRatio = +(R.rate.run.childAdvancedMs / wall).toFixed(3);
  PA.deck.pause();
  chk('rate 2x composes: parent AND nested child both advance ~2x wall, child media at 2.00x',
    R.rate.run.parentRatio > 1.7 && R.rate.run.childRatio > 1.7 && R.rate.run.childMediaRate === 2, JSON.stringify(R.rate.run));
  // and a rate the child CANNOT honour degrades HONESTLY: 1.5x is a legal
  // ARCHIVE rate ([0.5,0.75,1,1.5,2]) and is NOT on the instrument child's
  // lattice ([0.25,0.5,1,2,4]). The child rounds to 2x, says so, and — because
  // it is now running at a rate the parent did not ask for — its mastering is
  // suspended, so the arrangement does not silently inherit 2x.
  const dp0 = PA.deck.position(), dc0 = CH.deck.position(), dt0 = performance.now();
  PA.deck.play(1.5);
  await sleep(2500);
  const dwall = performance.now() - dt0;
  PA.deck.pause();
  const deg = PA.nest.rateReport('sess'), dss = PA.nest.driftStats().spans[0];
  R.rate.degrade = { ...deg, childLattice: CH.deck.caps('midi-actuated').rates,
    archiveLattice: PA.deck.caps('media-span').rates, childTarget: CH.deck.targetRate(),
    masterSuspended: dss.masterSuspended, childCorrections: dss.childCorrections.n,
    parentRatio: +((PA.deck.position() - dp0) / dwall).toFixed(3),
    childMapErrMs: +(CH.deck.position() - (PA.deck.position() - NEST_AT)).toFixed(1),
    childAdvancedMs: Math.round(CH.deck.position() - dc0), wallMs: Math.round(dwall),
    // the price, stated: the child's INNER media master now runs at 2x while the
    // outer servo holds the child on the parent's 1.5x mapping — the outer servo
    // wins every frame and the element drifts by exactly the difference.
    childMediaOffsetMs: Math.round(CH.spans.audio.el.currentTime * 1000 - (CH.deck.position() - CH.spans.audio.pos0)) };
  chk('a composed rate off the child lattice DEGRADES HONESTLY (chose it, said so, suspended mastering)',
    deg.wanted === 1.5 && deg.chose === 2 && deg.degraded === true && CH.deck.targetRate() === 2 &&
    R.rate.degrade.masterSuspended > 0 && Math.abs(R.rate.degrade.parentRatio - 1.5) < 0.2 &&
    Math.abs(R.rate.degrade.childMapErrMs) < 250, JSON.stringify(R.rate.degrade));
  PA.deck.setRate(1);

  // 7 — absence is content: outside the span the session is gone, archive plays
  PA.deck.seek(60000);
  await sleep(150);
  const beforeFires = CH.fires['midi-actuated'];
  const cAbs = CH.deck.position();
  const ct0 = [...PA.layers.values()].map((L) => L.el.currentTime);
  PA.deck.play(1);
  await sleep(2500);
  // read the neighbours WHILE THE PARENT IS STILL PLAYING — `paused` after a
  // pause is trivially true and would make this check vacuous
  const archive = [...PA.layers.entries()].map(([tag, L], i) => ({
    tag, inSpan: 60000 >= L.at && 60000 <= L.at + L.durMs,
    paused: L.el.paused, ct: +L.el.currentTime.toFixed(2),
    advancedMs: Math.round((L.el.currentTime - ct0[i]) * 1000),
  }));
  R.absence = {
    present: PA.nest.present('sess'), childPlaying: CH.deck.playing(),
    childPosDriftMs: +(CH.deck.position() - cAbs).toFixed(3),
    childHeld: held(), childMediaPaused: CH.spans.audio.el.paused,
    childFiresWhileAbsent: CH.fires['midi-actuated'] - beforeFires,
    archive, parentAdvancedMs: Math.round(PA.deck.position() - 60000),
  };
  PA.deck.pause();
  const a1 = R.absence.archive.find((x) => x.tag === 'A1');
  const a2 = R.absence.archive.find((x) => x.tag === 'A2');
  chk('outside the span the session is ABSENT (silent, paused, frozen) while an archive layer keeps playing',
    !R.absence.present && !R.absence.childPlaying && R.absence.childHeld.length === 0 &&
    R.absence.childMediaPaused && R.absence.childFiresWhileAbsent === 0 &&
    !a1.paused && a1.advancedMs > 1500 && a2.paused && a2.advancedMs === 0 &&
    R.absence.parentAdvancedMs > 1500, JSON.stringify(R.absence));

  // 8 — nested drift, not flattened
  PA.deck.seek(NEST_AT + 4000);
  R.drift = PA.nest.driftStats();
  R.childDrift = nestedDrift(CH.deck);
  chk('drift NESTS: the child channel stays in the child domain',
    !!(R.drift.spans[0].child && R.drift.spans[0].child.kinds && R.drift.spans[0].child.kinds['midi-actuated']),
    Object.keys(R.drift.spans[0].child.kinds || {}).join(','));

  // 9 — FRAGMENT QUOTATION (v0.5 rule 7): the same session deck, quoted twice.
  const FQ = PA.nest.span('quote');
  R.fragment = {
    at: FRAG_AT, in: +FQ.in.toFixed(1), out: +FQ.out.toFixed(1),
    parentDurMs: +FQ.parentDur.toFixed(1), sliceMs: +(FQ.out - FQ.in).toFixed(1),
    deckRange: FQ.deckRange, childRangeNow: CH.deck.range, trim: FQ.trim,
    quotations: PA.nest.quotationsOf(CH.deck).map((s) => ({ id: s.id, at: s.at, frag: [s.in, s.out] })),
  };
  chk('ONE session deck is QUOTED TWICE — a 10 s slice and the whole thing — and trim did not mutate the child',
    R.fragment.quotations.length === 2 &&
    String(CH.deck.range) === String(FQ.deckRange) &&
    Math.abs(FQ.parentDur - (FQ.out - FQ.in)) < 1e-6 &&
    FQ.out - FQ.in < (FQ.deckRange[1] - FQ.deckRange[0]),
    JSON.stringify(R.fragment.quotations) + ` slice ${R.fragment.sliceMs} ms of ${FQ.deckRange[1] - FQ.deckRange[0]} ms, child range untouched ${JSON.stringify(CH.deck.range)}`);

  // the seek that matters: a parent seek inside the QUOTATION must land inside
  // the FRAGMENT (in + u), not at u — which is where the whole-range mapping
  // would have put it, and the exact regression this feature exists to close.
  R.fragProbes = [];
  for (const u of [0, 900, 2500, 5000, 7500, FQ.parentDur - 1]) {
    PA.deck.seek(FRAG_AT + u);
    await sleep(60);
    const want = FQ.in + u, got = CH.deck.position();
    const gotHeld = held(), wantH = wantHeld(want);
    R.fragProbes.push({ parentMs: FRAG_AT + u, wantChildMs: +want.toFixed(1), gotChildMs: +got.toFixed(1),
      childPosErrMs: +(got - want).toFixed(3), wholeRangeWouldBe: u,
      held: gotHeld, wantHeld: wantH, ok: Math.abs(got - want) < 1 && String(gotHeld) === String(wantH) });
  }
  R.fragSummary = {
    n: R.fragProbes.length, exact: R.fragProbes.filter((p) => p.ok).length,
    maxChildPosErrMs: Math.max(...R.fragProbes.map((p) => Math.abs(p.childPosErrMs))),
    withNoteHeld: R.fragProbes.filter((p) => p.wantHeld.length).length,
  };
  chk('a parent seek inside the QUOTATION lands inside the FRAGMENT (child pos = in + u, held-note reduce exact)',
    R.fragSummary.exact === R.fragProbes.length && R.fragSummary.maxChildPosErrMs < 1,
    JSON.stringify(R.fragSummary));

  // `out` is the child's END for this quotation: past it, absent and parked there
  PA.deck.seek(FRAG_AT + FQ.parentDur + 1200);
  await sleep(120);
  R.fragExit = { present: PA.nest.present('quote'), childPos: +CH.deck.position().toFixed(1),
                 wantParkedAt: +FQ.out.toFixed(1), childPlaying: CH.deck.playing() };
  chk('past the quotation\'s `out` the session is absent and parked AT `out` (not at the deck\'s end)',
    !R.fragExit.present && !R.fragExit.childPlaying && Math.abs(R.fragExit.childPos - FQ.out) < 1,
    JSON.stringify(R.fragExit));

  // a fragment WIDER than the child clamps, and says so (never silently)
  const scratch = createDeck({ items: [], range: [0, 100000], tickHost: 'main' });
  const sNest = createNest(scratch, { kind: 'scratch-span' });
  const wide = sNest.add({ id: 'w', at: 0, rate: 1, deck: CH.deck, in: FQ.in, out: FQ.in + 20000 });
  R.fragClamp = wide.trim;
  let badFrag = null;
  try { sNest.add({ id: 'bad', at: 60000, deck: CH.deck, in: 5000, out: 5000 }); } catch (e) { badFrag = e.message; }
  let overlap = null;
  try { PA.nest.add({ id: 'ov', at: FRAG_AT + 500, deck: CH.deck, in: 0, out: 1000 }); } catch (e) { overlap = e.message; }
  sNest.dispose(); scratch.dispose();
  chk('a 20 s ask on an 18.6 s session CLAMPS and REPORTS it; in>=out and an overlapping quotation are rejected at add()',
    R.fragClamp.clamped === true && R.fragClamp.chose[1] === CH.deck.range[1] &&
    /strictly before/.test(badFrag || '') && /OVERLAPPING parent window/.test(overlap || ''),
    `${JSON.stringify(R.fragClamp)} | ${badFrag} | ${overlap}`);

  R.errors = ERRORS;
  R.mediaErrors = [...PA.layers.values()].concat([CH.spans.audio]).filter((L) => L.el.error).length;
  chk('no page errors, no media errors', ERRORS.length === 0 && R.mediaErrors === 0, `${ERRORS.length} / ${R.mediaErrors}`);

  R.pass = CHECKS.filter((c) => c.ok).length; R.total = CHECKS.length;
  $('verdict').textContent = `${R.pass}/${R.total}\n` + CHECKS.map((c) => `${c.ok ? 'PASS' : 'FAIL'}  ${c.name}\n      ${c.detail}`).join('\n');
  document.title = R.pass === R.total ? 'COMPOSE OK' : 'COMPOSE FAIL';
  return R;
}

// --- boot -------------------------------------------------------------------
const sess = await build();
requestAnimationFrame(loop);
const summary = { notes: sess.notes, sessionRows: sess.sessionRows, audioAtUs: sess.atUs,
  audioDurMs: sess.durMs, childRange: CH.deck.range, childHost: CH.deck.hostName,
  parentRange: PA.deck.range, nestAt: NEST_AT, nestParentDurMs: +PA.nest.span('sess').parentDur.toFixed(1),
  quote: { at: FRAG_AT, in: +FRAG.in.toFixed(1), out: +FRAG.out.toFixed(1),
           parentDurMs: +PA.nest.span('quote').parentDur.toFixed(1),
           quotationsOfOneDeck: PA.nest.quotationsOf(CH.deck).length },
  noteIntervals: CH.notes.length };
window.__compose = { run, PA, CH, nest: () => PA.nest, session: sess, summary, checks: CHECKS };
$('verdict').textContent = `built. child = ${sess.notes} real MIDI rows from proto/instrument/results/instr-session.jsonl (${sess.sessionRows} log rows), child range ${JSON.stringify(CH.deck.range)} ms, nested at ${NEST_AT} ms. call __compose.run().`;
</script>
