        let fired = 0;
        // ⚠️ NO LABEL AND NO BUTTON PASSED to either, so this grades the
        // SHIPPED defaults. A check that names its own label and its own index
        // passes whatever the module's defaults become, which is a check about
        // the check.
        q = createQuitHold({ onQuit: () => { fired++; } });
        quitBadge = mountXRQuit(gl, null);

        /**
         * 🔴 THE RING IS COMPILED HERE RATHER THAN ON SOMEBODY'S FIRST HEADSET
         * FRAME, and `session: null` is what that argument is for. Everything
         * in the badge is lazy until its first draw, so the object existing
         * says nothing at all about whether its shader builds, and a page
         * asserting "there is a way out" off the object alone stays green on a
         * broken one. `prepare()` is the module answering for itself.
         * ⚠️ `driven` IS THE NEGATIVE CONTROL. A compile-only mount must NOT be
         * advancing a hold, because there is no session to advance it from, and
         * a `true` here would mean this check had quietly started a second way
         * out on a page that already has one.
         */
        const built = quitBadge.prepare();
        d.assert('the way out compiles its ring on this machine, not on a headset first frame',
          built && !quitBadge.why && quitBadge.driven === false,
          built ? `it built, and nothing is driving it (driven ${quitBadge.driven})`
                : `it would not build: ${quitBadge.why}`);

        // Six buttons, so the one pressed can be moved around. Index 4 is A/X
        // on a Touch controller; index 0 is the trigger.
        const pad = (down, i = 4) => [{ gamepad: {
          buttons: Array.from({ length: 6 }, (_, k) => ({ pressed: down && k === i })),
          axes: [0, 0, 0, 0] } }];
        /**
         * ⚠️ THE HOLD BELIEVES AT MOST 0.1 s OF ANY ONE FRAME, so a check
         * cannot jump half of it in a single call: a headset that stalled for a
         * second must not advance a deliberate press by a second. Fed in frames
         * the size the module will accept, which is still no time at all here
         * because every one of them carries its own delta rather than waiting.
         */
        const feed = (ms, i = 4) => {
          let p = 0;
          for (let left = ms; left > 0; left -= 100) p = q.update(pad(true, i), Math.min(100, left) / 1000);
          return p;
        };
        /** One frame with nothing pressed, which is what arms the hold. */
        const armIt = () => q.update([], 0.016);
        const HALF = q.holdMs / 2;

        /**
         * 🔴 THE PRESS THAT OPENED THE SESSION IS NOT A PRESS TO LEAVE IT. A
         * headset session is entered from a controller button and that button
         * is still down on the first frames inside, so without this the room
         * would close about three seconds after it opened. It used to be a
         * guard each page wrote for itself and it now belongs to the module, so
         * it is graded here rather than assumed.
         */
        const born = feed(HALF);
        const stillBorn = q.progress;
        armIt();
        d.assert('a button already down when the session opened does not advance the hold',
          born === 0 && stillBorn === 0 && fired === 0 && q.armed,
          `held through ${HALF} ms of an unarmed press and the ring read `
          + `${(stillBorn * 100).toFixed(0)}%, fired ${fired} times, armed now ${q.armed}`);

        const onPress = q.update(pad(true), 0);
        const halfWay = feed(HALF);
        const letGo = q.update(pad(false), 0.01);
        d.assert('the way out takes a hold: a press, or letting go part-way, does nothing',
          onPress === 0 && halfWay > 0.4 && halfWay < 0.6 && letGo === 0 && fired === 0,
          `pressed ${(onPress * 100).toFixed(0)}%, half way ${(halfWay * 100).toFixed(0)}%, `
          + `let go ${(letGo * 100).toFixed(0)}%, fired ${fired} times`);

        // 🔴 ANY BUTTON, AND THIS IS THE ASSERT THAT SAYS SO. Instructed
        // 2026-09-17: *"hold down any controller button for looooong enough
        // then it quits"*. The check that used to sit here named button 4, so
        // it would have passed unchanged on a module that still answered to
        // that one button alone, which is the whole of what changed.
        // ⚠️ AND THE TRIGGER IS IN THE LIST ON PURPOSE. It is also what drags a
        // brick here, so if this ever has to be narrowed, index 0 is the one
        // that would go and this line is where that decision would show up.
        const each = [0, 1, 3, 4, 5].map((i) => {
          q.reset(); armIt();
          const p = feed(HALF, i);
          q.update(pad(false, i), 0.01);
          return { i, p };
        });
        d.assert('...and every button on the controller advances the same hold, not one named one',
          each.every((e) => e.p > 0.4 && e.p < 0.6) && q.button === 'any',
          `${each.map((e) => `${e.i} at ${(e.p * 100).toFixed(0)}%`).join(', ')}, asked for "${q.button}"`);
        q.reset(); armIt();
        fired = 0;

        // 🔴 AND THE RING HAS TO SAY HOW FAR THROUGH YOU ARE, or the hold is a
        // button that does nothing for three seconds. The quantity is the
        // progress the badge is DRAWN from, read back off the object rather
        // than off the number that was fed in.
        feed(HALF);
        const mid = q.progress;
        feed(HALF * 0.66);
        const later = q.progress;
        d.assert('...and the ring fills as far as the hold has got, and no further',
          mid > 0.4 && mid < 0.6 && later > mid && later < 1,
          `${(mid * 100).toFixed(0)}% then ${(later * 100).toFixed(0)}% of the way round`);

        // ⚠️ AND IT FIRES ONCE. `session.end()` is async, so a ring that stayed
        // full for three more frames would ask three times.
        feed(q.holdMs);
        q.update(pad(true), 0.016);
        q.update(pad(true), 0.016);
        d.assert('...and held the whole way it fires once, and only once',
          fired === 1 && q.progress === 1,
          `${fired} time(s) after the hold completed, and two frames more`);

        // 🔴 THE HOLD HAS TO BE LONG ENOUGH TO BE A DECISION. Every button on
        // the controller is live, so the only thing between a thumb resting
        // somewhere and the session ending is this number, and the label has to
        // say that holding is what does it, because there is no longer one
        // button to name.
        d.assert('the way out is a long hold on any button, and it says so',
          q.button === 'any' && q.holdMs >= 2000 && /hold/i.test(quitBadge.label),
          `hold any button for ${(q.holdMs / 1000).toFixed(1)} s, labelled "${quitBadge.label}"`);
      }

      /**
       * 🔴 ONE VISIBLE EXIT, AND THIS ASSERT REVERSED ON 2026-09-17. It used to
       * read "there are two ways out you can SEE, not one" and it was written
       * because one of them had silently vanished — the tablet's `Hold to
       * leave` was swapped for the controller badge and the suite stayed green,
       * so the next person in a headset could not get out.
       *
       * The instruction is now the opposite and it is explicit: *"make one
       * general way to get out ... no other exit methods/ui's for now."* So the
       * check keeps its shape and swaps its sign — what it grades is still that
       * the number of visible exits is the number somebody decided on, rather
       * than however many happen to be wired today.
       *
       * ⚠️ IT GRADES THE FIELD THAT ACTUALLY ENDS THE SESSION, not the label.
       * `xr-hands.mjs` acts only on tablet controls carrying `leaves`, so this
       * counts that field and not the words on the slab.
       */
      const exits = (tablet.controls || []).filter((c) => c.leaves);
      d.assert('there is exactly one way out, and it is the hold on the controller',
        exits.length === 0 && !!quitBadge?.label,
        exits.length === 0
          ? `the tablet carries no exit, so the only one is "${quitBadge?.label}"`
          : `the tablet still has ${exits.length}: ${exits.map((c) => c.label).join(', ')}`);

      tablet.set(c0.key, was); tablet.draw();

      // 🔴 AND THE WINDOW HAS TO HAVE PUT THE NEW CONTROL THROUGH THE GRAPHICS
      // CARD BEFORE ANYBODY'S HEADSET DOES. The tablet's face is a texture the
      // room re-uploads whenever its version moves, and every press above moved
      // it — so one frame from here is one upload of a canvas that now carries
      // a second control, on real ANGLE, in the suite. Without this the first
      // time those pixels reach the driver is the first frame of somebody's one
      // headset session, which is exactly where a pending `getError` costs a run.
      // ⚠️ ONE FRAME, NOT A SLEEP. `flat` re-registers itself at the top of its
      // own callback, so the next frame runs it before this, and 16 ms is
      // affordable where 800 would not be.
      await new Promise((r) => requestAnimationFrame(r));
      const tabErr = gl.getError();
      d.assert('drawing a tablet with two controls on it left no WebGL error behind',
        tabErr === 0 && room.tabletUploadMs !== null,
        tabErr === 0
          ? `clean, ${TABLET.px}x${TABLET.py} px uploaded in ${(room.tabletUploadMs ?? 0).toFixed(2)} ms`
          : `gl.getError() ${tabErr}`);
    }

    // 🔴 A FLOOR, AND NO WALLS THIS PAGE MADE UP. In an opaque session the page
    // knows exactly one surface — `local-floor` puts the origin on it — and a
    // wall at 5 m would be a claim about where your room ends that is always
    // wrong. Real walls arrive only from a headset that measured them.
    const surf = room?.surfaces || [];
    const flatOne = surf.length === 1 && surf[0].m[8] === 0 && surf[0].m[9] === 1 && surf[0].m[10] === 0;
    d.assert('with nothing measured the page draws one horizontal floor and no walls',
      flatOne && room.grid.span / 2 >= room.grid.fadeFar,
      `${surf.length} surface(s), ${room?.grid.span} m across against a fade that ends at ${room?.grid.fadeFar} m`);

    // ⚠️ THE FADE IS GRADED, because a crossfade is exactly the kind of thing
    // that can be wired up and do nothing — the `LEQUAL` depth function is one
    // line and without it every fragment of the incoming pass is rejected while
    // the code reads as correct. A broken shader first, so the guard is known
    // to say no before the pass is trusted to say yes.
    const heldLook = room?.look;
    await onDev({ type: 'dev.shader', sky: '#version 300 es\nnot glsl at all' });
    d.assert('a shader that will not compile is refused, and the picture keeps its own',
      !room?.incoming && room?.look === heldLook, room?.incoming ? 'it started fading in anyway' : 'refused');

    await onDev({ type: 'dev.shader' });          // no body: the built-in, recompiled
    d.assert('a shader that compiles starts a fade rather than a cut',
      !!room?.incoming && room?.look === heldLook,
      room?.incoming ? `fading, old program still drawing` : 'no fade started');
    await new Promise((r) => setTimeout(r, FADE_MS + 120));
    d.assert('...and the fade retires the old picture when it finishes',
      !room?.incoming && room?.look !== heldLook,
      room?.incoming ? 'still fading' : 'the new look is the look');

    // 🔴 THE REAL CONTROLLER MODEL, GRADED WITHOUT A HEADSET — and this is the
    // only place it can be. The fetch, the reader, the texture decode and the
    // upload all run on this laptop rather than first running on the first
    // frame of somebody's one headset session, which is exactly where a pending
    // `gl.getError()` costs a run.
    //
    // 🔴 ASKED FOR BY NAME NOW, BECAUSE NOTHING DRAWS A CONTROLLER ANY MORE.
    // The window used to draw a preview controller and that is what pulled the
    // model in; the geometry came out of every scene on 2026-09-17, so the load
    // had to stop being a side effect of drawing one. `room.warmModel` is the
    // same `loadModel` the draw path calls, reached by name — the picture stays
    // empty and the path stays covered.
    //
    // ⚠️ LAST IN THIS HANDLER, BEHIND A BOUNDED WAIT. `verify.mjs` stops
    // collecting 400 ms after the last assert, so a pause mid-way silently
    // loses everything after it — this one has nothing after it. And the wait
    // is bounded because a model that never arrives has to REPORT that, not
    // hang here: the page falls back to the stand-in and the assert says which.
    room?.warmModel?.('meta-quest-touch-plus', 'left');
    for (let i = 0; i < 60 && (room?.controllers === 'not asked' || room?.controllers === 'loading'); i++) {
      await new Promise((r) => setTimeout(r, 100));
    }
    d.assert('your controller’s real model loads and uploads here, not on a headset’s first frame',
      room?.controllers === 'model',
      room?.controllers === 'model'
        ? 'the vendored meta-quest-touch-plus mesh, fetched, read and uploaded on this machine'
        : `it would fall back to the primitive stand-in: ${room?.controllers}`);
  });

  window.__demo.gl = { renderer: rendererName, ok: !!gl };
  publishXR();
  async function maybeReport() {
    if (REPORT_PARAM === '0') return;
    // ⚠️ THE SAME ONE PROBE THE CONTROLS READ, not a second question put to this
    // browser. `whenXrCaps` settles at once where there is no WebXR, so a phone
    // reaches the `return` below in the same turn rather than waiting.
    const caps = await whenXrCaps(3000);
    const headset = caps.vr === 'yes';
    if (REPORT_PARAM !== '1' && !headset) return;
    ship = createShipper();
    const nx = nativeXR();
    // ⚠️ EVERY REPORT OPENS WITH A BUILD STAMP, so "still broken" and "the fix
    // never loaded" stop being the same observation — the rule the 06 device
    // logs already follow.
    ship(`BUILD ${BUILD} · scene`);
    ship(`ua ${navigator.userAgent}`);
    ship(`navigator.xr native: ${nx.native} · ${nx.why}`);
    ship(`renderer ${rendererName}`);
    ship(`window ${innerWidth}x${innerHeight} css · dpr ${devicePixelRatio}`);
    ship(`headset layout applied: ${document.documentElement.classList.contains('xr')}`);
    ship(`⚠️ SELF-REPORTED. This page cannot read its own hardware; only adb getprop can.`);
    ship(`immersive-vr ${caps.vr} · immersive-ar ${caps.ar}`
      + `${REPORT_PARAM === '1' && !headset ? ' (forced on with ?report=1)' : ''}`);
    // ⚠️ WRAP `d.assert` RATHER THAN COPYING THE LIST. Every assert this page
    // makes ships, including ones added later by someone who never reads this
    // block — a second list of "things worth reporting" would go stale the
    // first time an assert was added, and go stale silently.
    const origAssert = d.assert;
    d.assert = (label, pass, detail) => { ship(`${pass ? 'ok  ' : 'FAIL'} ${label}${detail ? '  ' + detail : ''}`); return origAssert(label, pass, detail); };
    d.log('reporting to pub.positron.studio, read it with /logs?format=text');
  }
  maybeReport();

  // 🔴 A THROWN HANDLER USED TO LEAVE NO TRACE, which made "the button was
  // never pressed" and "the button threw" the same observation in the report —
  // and that is exactly what the first run on a real headset looked like.
  // Every press is logged before it runs, and anything that escapes is logged
  // with it.
  // ⚠️ THESE MUST USE THE BEACON TOO. They were on the batched shipper, which
  // is why a TypeError thrown while entering an immersive session produced no
  // line at all — the net that was supposed to catch a silent failure was
  // itself waiting on a timer that had stopped being generous.
  addEventListener('error', (e) => shipNow(`FAIL uncaught: ${e.message} @ ${(e.filename || '').split('/').pop()}:${e.lineno}`));
  addEventListener('unhandledrejection', (e) => shipNow(`FAIL unhandled rejection: ${e.reason?.message || e.reason}`));
  // ⚠️ `d.button` FINDS THE GROUP'S TWO AS WELL AS THE SHELL'S ONE. It falls
  // back to a `[data-id]` query inside `.pos-controls`, and the group sets that
  // attribute on every button it makes, so a control moving into a component
  // did not take it out of reach of this loop or of anything else that asks for
  // one by name.
  // ⚠️ NO `full` IN THIS LIST ANY MORE. The ⛶ belongs to the video panel and is
  // not a shell control, so `d.button('full')` answers null and a press on it
  // is not one of this page's own.
  for (const id of ['vr', 'ar']) {
    const b = d.button(id);
    if (b) b.addEventListener('click', () => ship?.(`pressed "${b.textContent}"`), true);
  }
  try {
    if (sessionStorage.getItem('blocks-resume')) {
      sessionStorage.removeItem('blocks-resume');
      d.log('the update is in. Press Run in AR to go back in', 'ok');
      const b = d.button('ar') || d.button('vr');
      if (b) { b.classList.add('pos-pri'); b.textContent = '↩ Back in'; }
    }
  } catch { /* private mode */ }
  /**
   * 🔴 THE CHECKS RUN THEMSELVES NOW, BECAUSE THEIR BUTTONS ARE GONE.
   *
   * `Roll a room`, `Same seed again` and `Try an impossible room` carried every
   * assert on this page and were three controls a visitor had no reason to
   * press — harness machinery showing through, which `shout` argues at length
   * beside its own. The handlers are still registered by name and `d.run()`
   * calls them; what changed is that nothing has to be pressed for this page to
   * say whether it worked.
   *
   * ⚠️ IN THIS ORDER, AND `again` ENDS WHERE IT STARTED. It rolls somewhere
   * else and back to the same seed — that is the point of it — so the room a
   * visitor is left standing in is the one they arrived in, after about two
   * round trips of the relay. `bad` changes nothing on screen by construction:
   * a refused room is a room that was not applied.
   */
  async function selfCheck() {
    // 🔴 WAIT FOR THE TWO THINGS THE CHECKS READ. They grade a relay round trip
    // and the time from an accepted room to a drawn frame, so running them
    // before the socket is open and before anything has been drawn grades a
    // page that has not started — `readyState 0` and `no frame drawn`, which
    // read as defects and are a checker that arrived early. A button used to
    // supply this wait by being pressed by a person; nothing does now, so it is
    // written down. ⚠️ Capped: a relay that never comes up must cost this page
    // a second and then be reported as what it is, not hang the checks.
    const t0w = performance.now();
    while (performance.now() - t0w < 4000 && (ws?.readyState !== 1 || !shown)) {
      await new Promise((r) => setTimeout(r, 50));
    }
    // ⚠️ `caps` FIRST, AND IT IS THE ONE CHECK WITH NO BUTTON IT COULD LIVE ON.
    // What it grades is that this browser's answer about headsets arrived and
    // that the two controls were set from it, and on a browser that cannot open
    // a session those controls are SWITCHED OFF, so a check inside their
    // handlers would never run on the machines the claim is about.
    await d.run('caps');
    await d.run('roll');
    await d.run('again');
    await d.run('bad');
  }

  // A room to stand in before anything is pressed, so the stage is never empty.
  await roll(424242);
  /**
   * 🔴 AND NOT FOR A VISITOR. `selfCheck` rolls a random room, rolls two more to
   * compare seeds, sweeps sixty-four of them, pushes bricks about and fetches a
   * controller mesh — so somebody who opened this page watched three rooms slide
   * past before they could look at one. The note above used to end by saying a
   * visitor is left standing where they arrived, which was true only because a
   * second `roll(424242)` put the room back afterwards: the fix for a room
   * changing under a reader was another change to the room.
   * ⚠️ THE RESTORING ROLL GOES WITH IT. With nothing rolled there is nothing to
   * put back, and rebuilding the same seed a second time is a room being made
   * twice for no reason anybody can see.
   */
  if (SELFCHECK) {
    await selfCheck();
    await roll(424242);
  } else {
    d.log('the checks roll rooms and sweep seeds, so they are for the harness. '
        + 'This is seed 424242, and it stays until you roll another');
  }
  // The checks are done and the room has stopped changing, so it can be looked
  // at. One appearance, faded rather than cut.
  panel.el.classList.remove('warming');
  d.ready();

  // ⚠️ ARRIVED FROM THE INDEX WITH `?xr=1` — put the one press that matters
  // under the hand. A link CANNOT enter VR: WebXR needs a transient user
  // activation, so the button still has to be pressed. This only means you do
  // not have to find it, which through a headset is most of the work.
  if (new URLSearchParams(location.search).has('xr')) {
    const b = d.button('vr');
    if (b) { b.scrollIntoView({ block: 'center' }); setTimeout(() => b.focus(), 60); }
  }
</script>
</html>
