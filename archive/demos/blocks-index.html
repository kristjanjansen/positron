<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* 🔴 `touch-action: none` IS THIS PAGE'S OWN ANSWER AND IT IS THE ONE THING
     `shell.css` DELIBERATELY DOES NOT SET. A canvas you drag to look around
     wants panning off and a canvas inside a page you scroll must not eat that
     scroll, which are opposite answers to one question, so each page states its
     own. This one is dragged to look, so it says so and never scrolls the page
     underneath while somebody is looking around.
     ⚠️ IT IS ON THE PANEL'S PICTURE BOX RATHER THAN ON THE CANVAS. A pointer's
     allowed behaviours are the intersection down the ancestor chain, so a drag
     that starts on the canvas is governed by this box as well, and the pointer
     handlers are on this box too.
     ⚠️ THE OTHER HALF IS GLOBAL AND IS NOT REPEATED HERE. `user-select: none`
     and `-webkit-touch-callout: none` are on bare `canvas` in `shell.css` as of
     2026-09-19, after this page was photographed on an iPhone wearing a blue
     selection overlay with both drag handles. */
  .pos-vp-stage { touch-action: none; cursor: grab; }
  .pos-vp-stage:active { cursor: grabbing; }
  /* 🔴 THE ROOM APPEARS ONCE, RATHER THAN FOUR TIMES. The checks below roll
     four rooms into this canvas before anything is pressed: an opening room, a
     random one, a second random one and back, each cross-fading over 900 ms, so
     a visitor arriving met three and a half seconds of bricks sliding into
     different places. Reported as the boxes jumping position a couple of times,
     which is exactly what it was. The frames are still drawn and still timed;
     what waits is showing them. */
  .pos-vp-stage > canvas { transition: opacity 420ms ease; }
  .pos-vp.warming > .pos-vp-stage > canvas { opacity: 0; }
  /* 🔴 A NAMED VALUE IN A PANEL FOOTER, AND THIS IS THE THIRD COPY OF IT.
     `/mirror/` has `.fact`, `.fact-k` and `.fact-v` and `/weight/` has `.hd-gpu`,
     `.hd-gpu-k` and `.hd-gpu-v`, both for the same fact in the same kind of
     cell. `/weight/`'s note says two is not yet a component and a third would be,
     and this is the third: it belongs in the kit and is NOT being put there
     here, because that would be a fourth hand in `shell.css` while somebody
     else is holding it.
     ⚠️ COPIED FROM `/weight/` RATHER THAN FROM `/mirror/`, AND DELIBERATELY. The
     rule when two things merge here is to take the better half, never the
     average: `/mirror/`'s wrapper is a horizontal SCROLLER because it holds a
     row of four, and a scroller round one fact is machinery with nothing to do.
     `/weight/`'s is the single-cell shape, with the ellipsis that keeps a long
     chip name from pushing the ⛶ off the end of the row.
     ⚠️ THE KEY STYLE IS `.pos-k`'s, copied rather than invented in all three
     places, so a value named under a picture is named the way every readout in
     the project names one. */
  .bl-gpu { display: flex; align-items: baseline; gap: 5px; min-width: 0;
            white-space: nowrap; overflow: hidden; }
  .bl-gpu-k {
    font: 500 9.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase;
    color: var(--dim2);
  }
  .bl-gpu-v {
    font: 400 11px/1.4 var(--mono); color: var(--fg);
    overflow: hidden; text-overflow: ellipsis;
  }
</style>

<script type="module">
  import { mount, guard, el, createShipper, BUILD } from '/shell/shell.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createDiagram } from '/shell/diagram.mjs';
  import { docOf, validate as validate0, UNIT, PALETTE } from '/shell/seed.mjs';
  import { touchOf } from '/shell/xr-panel.mjs';
  import {
    createXRRoom, roomOf, spaced, clashes, radiusOf, halfOf, overlapOf, leastAxis, r4, holdM,
    GAP, DROP_PASSES, FADE_MS, ROOM_OPTIONAL_FEATURES,
    perspective, lookAt, mul,
  } from '/shell/xr-room.mjs';
  import { createXRHands, BUTTON, AXIS } from '/shell/xr-hands.mjs';
  import { createXRTablet, valueFromU, TABLET } from '/shell/xr-tablet.mjs';
  import { mountXRQuit, createQuitHold } from '/shell/xr-quit.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { XR_MODE, answered, canEnter, reasonFor, xrCaps, onXrCaps, whenXrCaps }
    from '/shell/xr-caps.mjs';

  // ── the room is a module now ────────────────────────────────────────────
  // 🔴 THE PICTURE AND THE RULES ABOUT IT LIVE IN demo/shell/xr-room.mjs. The
  // generator places each thing without looking at the ones already there, so
  // two of them can occupy the same piece of space — MEASURED over 200 seeds,
  // 264 overlapping pairs of 46,440, the worst 0.615 m deep. The separation
  // rule, the ball it uses, the sky, the things and the per-eye loop all moved
  // there together, because `mirror` now stands in the same room and a rule
  // applied in one page is a rule missing from the other.
  //
  // What stayed here is what is about THIS page: the seed that crosses the
  // wire, the socket it crosses, the live-update tiers, picking things up, and
  // the sweep the negative control rolls.
  //
  // Rooms the negative control rolls to grade the rule across the seed space.
  // 64 of them is ~1,300 things and ~14,000 pair tests, which is a few ms.
  const SWEEP = 64;

  // ⚠️ ALIASED, NOT USED DIRECTLY. An imported binding cannot be reassigned, and
  // tier 3 of the update story replaces the generator while a session is live.
  // Every call below goes through these.
  // ⚠️ AND THE SEPARATION IS PART OF `world`, NOT OF THE CALLERS — `roomOf` is
  // the generator WITH the rule already on it. A rule applied at three call
  // sites is a rule missing from the fourth, and a generator swapped in live
  // over the wire would arrive without it, which is why the tier-3 handler
  // rebuilds the same wrapper rather than taking `mod.world` raw.
  let world = roomOf, validate = validate0;

  const ROOM = new URLSearchParams(location.search).get('room') || 'scene-demo';
  const RELAY = `wss://ws.positron.studio/room/${ROOM}/ws`;
  const ID = Math.random().toString(36).slice(2, 8);
  // The ceiling is a constant and the readout prints it FROM this constant.
  // A description that can disagree with the config is worse than none.
  const TO_FRAME_CEIL_MS = 120;

  // ── reporting from a device that has no cable in it ─────────────────────
  // 🔴 adb IS FOR GRADING, NOT FOR USING. Opening this page on a headset needs
  // nothing: positron.studio is HTTPS and the Quest Browser is Chromium. What
  // adb buys is the two things page script CANNOT see — the hardware, read with
  // `getprop` from outside the browser, and the compositor's own frame counter
  // from `logcat -s VrApi` — plus pressing the controls unattended.
  //
  // Everything else the device can say about itself, and this is the same route
  // the iPhone work already uses: POST the lines to pub.positron.studio and read
  // them from a laptop. So a headset with no cable can still report, and the one
  // claim it cannot make on its own is the one about its own hardware — which is
  // why the report says so in its own header rather than leaving it out.
  // ⚠️ ON BY DEFAULT WHEN THERE IS A HEADSET, AND ONLY THEN. Typing
  // `?report=1` on a virtual keyboard, in a headset, is exactly the kind of
  // friction that means a measurement never gets taken — and it was the only
  // way to turn this on. But defaulting it on for EVERYONE would POST a log
  // from every desktop visitor, which is somebody else's traffic in our
  // diagnostics and nobody's idea of consent.
  //
  // So it is capability-gated like everything else here: a browser that reports
  // `immersive-vr` is a browser someone is wearing, and that is the only case
  // where these lines are wanted. `?report=1` forces it on anywhere (the laptop,
  // for checking the shipper itself), `?report=0` forces it off.
  const REPORT_PARAM = new URLSearchParams(location.search).get('report');
  let ship = null;

  /**
   * A line that must arrive even if the event loop is about to be throttled.
   *
   * 🔴 THE BATCHED SHIPPER LOST EVERYTHING PAST `requestSession`. MEASURED on a
   * Quest 3: every flat assert arrived, then `pressed "Put it on your face"`,
   * then nothing at all — no session line, no error, no assert. createShipper
   * holds lines for 2 s before POSTing, and entering an immersive session is
   * exactly the moment a browser stops being generous with timers. So the
   * lines that say WHERE something hung cannot be the ones waiting on a timer.
   *
   * `sendBeacon` exists for this: the request is handed to the browser and
   * survives whatever the page does next.
   */
  const shipNow = (line) => {
    if (!ship) return;
    ship(line);
    try { navigator.sendBeacon?.('https://pub.positron.studio/log',
      new Blob([`${(performance.now() / 1000).toFixed(2)} ${line}`], { type: 'text/plain' })); } catch { /* diagnostics */ }
  };

  /** Is `navigator.xr` the browser's, or something installed over it? */
  function nativeXR() {
    if (!navigator.xr) return { native: false, why: 'no navigator.xr at all' };
    const proto = Object.getPrototypeOf(navigator.xr);
    const names = Object.getOwnPropertyNames(proto).filter((n) => n !== 'constructor');
    const fns = names
      .map((n) => Object.getOwnPropertyDescriptor(proto, n))
      .filter((dsc) => typeof dsc?.value === 'function')
      .map((dsc) => dsc.value);
    const faked = fns.filter((fn) => !/\{\s*\[native code\]\s*\}/.test(Function.prototype.toString.call(fn)));
    if (faked.length) return { native: false, why: `${faked.length} method(s) are JavaScript. Something is installed over navigator.xr` };
    if (Object.prototype.hasOwnProperty.call(navigator, 'xr')) return { native: false, why: 'navigator owns `xr` as an own property' };
    return { native: true, why: `${proto.constructor?.name || 'XRSystem'} · ${fns.length} methods, all [native code]` };
  }

  const d = mount({
    name: 'blocks',
    // ⚠️ A QUARTER OF WHAT IT WAS, ON INSTRUCTION, AND THE CUT WAS THE
    // MECHANISM. What went: how a seed becomes a room, why the round trip is
    // the real distance between asking and seeing, what the refusal counter is
    // for, and three paragraphs of what each button in the headset does. All
    // true; none of it is what somebody arriving here needs, and the generative
    // half is coming back as its own thing. What is left is CLAUDE.md's three:
    // what this is, what to press, what the numbers mean.
    // ⚠️ THE SMALL SCREEN ON THE LEFT HAND IS GONE FROM THE SCENE (2026-09-17)
    // and so is the controller geometry, so the sentence that named them had to
    // go with them: a description that has drifted is worse than a missing one
    // because a visitor believes it. What is left is what you do.
    // 🔴 ONE SENTENCE SINCE 2026-09-19, WHICH IS THE RULE NOW. It was six,
    // grown one clause at a time over four rounds of additions, and every round
    // appended while none subtracted.
    // 🔴 AND IT IS THE INDEX'S OWN LINE, WORD FOR WORD, because this page has a
    // diagram now. A paragraph and a picture of the machinery are two
    // explanations of one thing and the paragraph is the weaker of them, so
    // what is left says what this is and what to press, and a visitor arriving
    // from the index is not told the same thing twice in two wordings that can
    // drift apart. `one` in `demo/manifest.mjs` carries the same sentence.
    what: 'Square bricks on a dotted floor you drag to look around, and in a '
      + 'headset a ray from your hand picks one up and snaps it to the grid '
      + 'where you let it go.',
    /**
     * 🔴 NO READOUT, ASKED FOR TWICE: *"blocks: rm readout"*. There were four
     * cells and every one of them was a number about the page rather than about
     * the room: two frame timings, a count of what your own hands had done, and
     * a word saying whether you were wearing a headset. A room you are standing
     * in is its own readout, and a row of figures above it is a second thing to
     * read that says less than the picture does.
     * ⚠️ NOTHING THEY SAID WAS DROPPED, which is the rule when a display goes.
     * `to frame` and `worst` are frame timing and go to the log when they
     * change rather than sixty times a second; `view` is a state change and
     * goes to the log at the moment it changes; `moved` is a count of what your
     * hands did, which the room already shows, and it rides the line the drop
     * already wrote. All four are still on `__demo` for a harness.
     * ⚠️ `null` RATHER THAN AN OMITTED FIELD, so `readoutOptOut` reads it as
     * deliberate and neither `verify.mjs` nor `verify-quest.mjs` can tell "no
     * cells on purpose" apart from "none yet".
     */
    readout: null,
    // 🔴 THE SAME THREE AS EVERY OTHER HEADSET PAGE, IN THE SAME ORDER. `floor`
    // and `weight` offer VR, AR and fullscreen; this offered VR, AR and three
    // buttons about rolling a room, so the two pages a visitor compares looked
    // like different kinds of thing. The rolling is not gone — it happens at
    // load and its checks run there, see `selfCheck()` — it is no longer
    // something to press.
    // 🔴 AND THE ROW IS EMPTY NOW, WHICH IS THE WHOLE OF WHAT IS LEFT HERE.
    // `Run in VR` and `Run in AR` are a kit button group, prepended into this
    // row below so both harnesses can still press them. The ⛶ was the last
    // thing declared here and it went on 2026-09-19 with the video footer: the
    // panel's right slot carries one already, and two full-screen buttons on
    // one page is the duplication this stream has removed twice.
    // ⚠️ CONTROL 0 DID NOT MOVE, WHICH IS THE THING TO CHECK. `settleMs` only
    // ever lands on control 0 and the harness presses in document order, so
    // removing a control can silently move where a six-second wait goes. The ⛶
    // was LAST (`end: true`), and the order was `vr, ar, full` before and is
    // `vr, ar` after, so control 0 is `vr` in both.
    controls: [],
  });
  guard(d);

  /**
   * 🔴 THE TWO SESSION CONTROLS ARE ONE KIT COMPONENT, AND THEY USED TO BE
   * THREE SPELLINGS OF ONE THING. Asked 2026-09-19: *"global: make buttongroup
   * component and convert all vr/ar buttons to it"*. `/weight/` and `/floor/` say
   * `vr`, `/mirror/` says `xr`, and this page said `enter`, so a check written
   * against one page could not be read against another. The id here is `vr`.
   *
   * 🔴 IT GOES INSIDE `.pos-controls`, BEFORE THE ⛶. Both harnesses press
   * `.pos-controls button`, which is a DESCENDANT selector, so a group in that
   * row keeps every button pressable and a group anywhere else would silently
   * stop being exercised. `prepend` rather than `append` because the ⛶ carries
   * `end: true`, which is `margin-left: auto`, and a group appended after it
   * would sit on the far side of that push.
   *
   * 🔴 AND THE GROUP OWNS DISABLED. Whether a session can be opened at all is
   * an answer that arrives late and is `absent` on every phone, so the control
   * is switched off with the reason in words rather than left to fail when it
   * is pressed. `canEnter` treats `asking` as yes, so nothing is ever greyed
   * out on a guess.
   */
  const xrGroup = createButtonGroup({
    /**
     * 🔴 NO LABEL, AND IT HAD ONE FOR AN HOUR. Asked 2026-09-19: *"blocks: rm
     * 'headset' label and use buttongroup for vr xr"*. This page passed
     * `label: 'headset'` while `/weight/`, `/floor/` and `/mirror/` passed none,
     * so one page in four wore a word the others did not, which is the drift a
     * component exists to remove appearing inside the component.
     * ⚠️ AND THE GENERAL RULE IS WORTH SAYING, because it decides the next one
     * of these: a CHOICE needs a label, because its options are answers and the
     * label is the question. A row of ACTIONS does not, because each button
     * already says what it does, and `Run in VR` needs no heading.
     */
    buttons: [
      { id: 'vr', label: 'Run in VR' },
      { id: 'ar', label: 'Run in AR' },
    ],
    // ⚠️ THROUGH `d.run`, SO THE HANDLERS STAY WHERE HANDLERS LIVE. `d.on('vr')`
    // and `d.on('ar')` below are registered the same way every other control on
    // every other page is, which is also what lets `selfCheck()` reach them by
    // name if it ever has to.
    onPress: (id) => d.run(id),
  });
  d.controls.prepend(xrGroup.el);
  // 🔴 AND THE ROW HAS TO BE UN-HIDDEN, BECAUSE THE SHELL HID IT. `mount()`
  // sets `hidden` on `.pos-controls` when a page declares no controls, so that
  // a row with nothing in it does not leave a 14 px band of dead space. This
  // page declares none and then puts two buttons in it, which is a case the
  // shell cannot see: `hidden` is decided from the declaration and the group
  // arrives afterwards. Without this line both session controls are in the DOM,
  // reachable by `querySelectorAll`, disabled or enabled correctly, and
  // invisible.
  d.controls.hidden = false;
  // Called at once with what is known, and again on every change.
  onXrCaps((c) => {
    xrGroup.enable('vr', canEnter(c.vr), reasonFor(c.vr, 'vr'));
    xrGroup.enable('ar', canEnter(c.ar), reasonFor(c.ar, 'ar'));
  });

  const canvas = el('canvas', null, null, { width: 960, height: 540 });
  /**
   * 🔴 THE ONE FACT UNDER THE PICTURE: WHAT DREW IT. Asked 2026-09-19:
   * *"blocks: add videofooter with fullscreen control and info what renders
   * it"*. It is FILLED from `rendererName` further down rather than typed, so
   * the footer and `window.__demo.gl.renderer` cannot say two different things
   * about one context, and a check below holds them to that.
   * ⚠️ NOT A PRESENCE DOT, WHICH IS THE PANEL'S OWN DEFAULT LEFT SLOT. Nothing
   * on this page answers from anywhere else that a visitor is waiting on, so a
   * badge here could only ever read `online` about the browser it is drawn in,
   * and a control with one honest state is the shape this project calls a lie.
   * `/mirror/` gives a dot only to the pane fed by a Raspberry Pi, for the same
   * reason and in as many words.
   */
  const gpuEl = el('span', 'bl-gpu');
  gpuEl.append(el('span', 'bl-gpu-k', 'picture'), el('span', 'bl-gpu-v', ''));
  const gpuVal = gpuEl.lastChild;

  /**
   * ⚠️ ONE PLACE SAYS IT, AND IT SAYS IT ONCE. Full screen can end three ways
   * here (the footer's ⛶, Escape, a phone gesture) and more than one of them
   * reaches this page, so a line written at each would print twice. Reporting
   * on the CHANGE rather than on the event is the same rule this page applies
   * to a brick crossing the wall: say it on the crossing, never per frame.
   * ⚠️ DECLARED ABOVE THE PANEL THAT CALLS IT. `createVideoPanel` does not fire
   * `onFull` while it is still building itself, and a page relying on that
   * without saying so is a dead-zone read waiting to happen.
   */
  let fullSaid = null;
  const sayFull = (on) => {
    if (on === fullSaid) return;
    fullSaid = on;
    d.log(on
      ? `filling the screen (${panel.support() || 'no way to'}). The ⛶ under the picture comes back out`
      : 'back to the page', 'hi');
  };

  /**
   * 🔴 THE PICTURE IS A KIT PANEL NOW, NOT A DIV THIS PAGE STYLED. Asked
   * 2026-09-19 alongside `/weight/`. The ⛶ is the panel's own right slot, so this
   * page stopped declaring a shell control for it and stopped mounting its own
   * way back out of full screen: there was one of each an hour ago and two of
   * anything is the duplication this stream keeps removing.
   * 🔴 `fullMode` IS LEFT AT ITS DEFAULT, WHICH IS `hover`, AND `footer` WAS
   * THE OTHER ANSWER. `footer` keeps the row on screen while full, so the name
   * of what is drawing would survive going full screen; against that, `/weight/`
   * is the same shape of page, was asked for in the same minute, and left the
   * default, and two sibling pages a visitor compares should not be two kinds
   * of thing. The renderer is a fact you read once rather than one you watch,
   * so the default wins and the picture gets the whole screen.
   * ⚠️ IT ALSO KEEPS THE WAY OUT INSIDE THE PICTURE. In `hover` the panel puts
   * `createFullscreenExit` in its own stage; in `footer` with the standing
   * right slot it does not, because that row's own ⛶ is still on screen. The
   * check below reads whichever is there, so it grades the arrangement rather
   * than assuming one.
   * ⚠️ NO SECOND STOREY. `under` moves a page's own control row into the panel
   * while full, which is right for `/mirror/`, whose controls are about the
   * picture. Nothing was asked for here, and entering a headset is not a thing
   * to do from inside a full-screen canvas.
   * ⚠️ NO LABEL OVER THE PICTURE EITHER, which is older and still holds. A
   * badge used to sit in the top-left corner over the one thing on the page
   * worth looking at. Where you are looking from is a state change and goes in
   * the log; what drew it is a fact and goes in the footer, which is a box that
   * cannot grow over the picture.
   */
  const panel = createVideoPanel({
    media: canvas,
    left: gpuEl,
    onFull: (full) => sayFull(full),
  });
  panel.el.classList.add('warming');
  d.el.append(panel.el);
  /**
   * ⚠️ THE NAME IS KEPT, AND IT NAMES THE SAME THING IT ALWAYS DID: the box the
   * picture is in, which is what you drag to look around and what fills the
   * screen. It belongs to the panel now rather than to this page, so the
   * pointer handlers and the keyboard's `isConnected` guard below are unchanged
   * and the rename that would have touched eight lines did not happen.
   */
  const stage = panel.stage;

  // ── the picture ─────────────────────────────────────────────────────────
  // WebGL2 and nothing else. `OCULUS_multiview` is on by default on Quest and
  // WebGPU inside an immersive session is behind a chrome://flags switch the
  // visitor would have to set, which makes it an R&D capability rather than a
  // deliverable (research/quest-xr §1.3). And no three.js: this repo has no
  // build step, and a 600 KB renderer to draw boxes would be the first
  // bundler-shaped dependency in it — the same argument plan-nodes §1.5 made
  // about importing a node editor.
  // 🔴 `alpha: true` IS WHAT MAKES PASSTHROUGH POSSIBLE AT ALL. In an
  // `immersive-ar` session the compositor puts the real room BEHIND whatever
  // this page draws, and it can only do that through transparent pixels — with
  // `alpha: false` the framebuffer has no alpha to clear to zero and the room
  // is replaced by black rather than composited under. The flat and VR paths
  // clear to opaque, so nothing else changes.
  const gl = canvas.getContext('webgl2', { antialias: true, alpha: true, xrCompatible: true });
  if (!gl) { d.log('no WebGL2 in this browser', 'bad'); }

  /**
   * 🔴 THIS PAGE COMPILES NO SHADER OF ITS OWN ANY MORE, AND THAT IS WHAT THE
   * POPUPS COST. There was a program here, a unit quad, a 768x192 canvas and a
   * texture, and the only thing any of it ever drew was a card of text hung in
   * front of your face. All eleven things that put one there are rehomed, so
   * the apparatus went with them: a shader nothing draws through is a
   * `getError` waiting to be blamed on something else.
   * ⚠️ WHAT THE PICTURE IS MADE OF NOW: `xr-room.mjs` owns the room and its
   * programs, `xr-tablet.mjs` owns the slab this page builds and does not show,
   * and `xr-quit.mjs` owns the way out and its ring. None of the three is this
   * page's to compile.
   * ⚠️ AND THE `bindAttribLocation` LESSON DID NOT GO WITH IT. It has to be
   * called BEFORE `linkProgram` or it is a no-op that reads like a fix, and a
   * Quest reported GL_INVALID_OPERATION on its first frame for exactly that and
   * DREW CORRECTLY ANYWAY. It is written down where the linking now happens,
   * which is `xr-room.mjs` and `xr-quit.mjs`, and the assert that would catch
   * it is still on this page as `no WebGL error is pending`.
   */
  /**
   * 🔴 ONE WAY OUT OF A ROOM, AND ONE PLACE THAT SAYS WHAT FIRED.
   *
   *   a long hold on ANY controller button, which is the only one a person uses
   *   a dead-man's switch at 4 s, which is not an exit but a guard
   *
   * 2026-09-17: *"make one general way to get out. hold down any controller
   * button for looooong enough then it quits. no other exit methods/ui's for
   * now."* The grip used to leave and so did a button on the tablet; both are
   * gone, and so is the tablet. What is left is `demo/shell/xr-quit.mjs`: hold
   * anything for three seconds and a ring fills in front of you while you do.
   *
   * 🔴 THE RING IS HEAD LOCKED AND IS NOT AT YOUR HANDS, 2026-09-19: *"Hold-to-
   * quit: ui should not tied to controllers. it should be just front of me"*.
   * One ring, dead centre, 1.6 m out, about five degrees across, drawn last
   * with the depth test off so nothing in this room can hide the way out of it.
   * ⚠️ AND IT SURVIVES THIS PAGE'S NEW BRICK SIZE, which is the one page where
   * it could have failed, THOUGH NOT QUITE FOR THE REASON IT LOOKS LIKE. A
   * brick is 1.0 m now and `MIN_HOLD` keeps a held one's centre 0.8 m or
   * further away, so its near face is 0.3 m out and its far face 1.3 m: a clear
   * 0.3 m short of the ring at 1.6. 🔴 THAT 1.3 IS MEASURED FROM YOUR HAND AND
   * THE RING IS MEASURED FROM YOUR EYE, and the two are half a metre apart with
   * an arm out, so a brick held at the minimum can reach PAST the ring's plane
   * rather than stopping short of it. The margin is not what makes this work.
   * What makes it work is that the ring is drawn last with `DEPTH_TEST` off and
   * its depth writes masked, so no brick at any distance can be in front of it.
   * Every push with the thumbstick goes further out, so the case is the same
   * one at every distance.
   *
   * 🔴 AND THIS PAGE IS WHY THE MODULE MOUNTS ITSELF. It built the badge,
   * compiled its shader, drew it at both hands every frame, and never once
   * called `update`, so the hold could not advance and there was no way out of
   * here at all. Reported from a device as *"i was not able to get out"*. There
   * is no `update` to forget now: `mountXRQuit` takes the SESSION and puts its
   * own callback on `session.requestAnimationFrame`.
   *
   * ⚠️ THE DEAD-MAN'S SWITCH IS NOT AN EXIT AND IT STAYS. It ends a session
   * that has drawn NOTHING after four seconds, which is the case where the page
   * threw and there is no ring, no badge and no render loop to draw one.
   * CLAUDE.md records what it prevents: a live session, nothing drawing, no way
   * out and no log line. Removing it would put that back.
   * ⚠️ IT IS NOT MADE REDUNDANT BY THE MODULE DRIVING ITSELF EITHER. The hold
   * survives a dead render loop, so somebody who knows the gesture can leave a
   * page that threw; this is for somebody who does not, and it does not need
   * three seconds of blind holding to find out.
   *
   * ⚠️ AND THE LOG HAS TO NAME WHICH. Two endings that both print "session
   * ended" make a page that cannot tell you why it ended, which is the same
   * defect as the run where "the button was never pressed" and "the button
   * threw" were one observation. `leftBy` is set by whichever fired and read
   * once, in the `end` handler — including the case where NOTHING here fired,
   * which is its own answer rather than a blank.
   */
  let leftBy = null;
  const leaving = (why) => { leftBy = why; shipNow(`leaving · ${why}`); };
  // ⚠️ THE TABLET'S BUTTON DOES NOT COME THROUGH HERE. `xr-hands.mjs` ends the
  // session for it, because that module is handed the session every frame and
  // this page is not the only page with a tablet on it. This is the page's own
  // two, which the page has always owned.
  const leaveNow = (why) => {
    leaving(why);
    try { session?.end().catch(() => {}); } catch { /* it may already be going */ }
  };

  // 🔴 THE ROOM. Everything this page draws except its own status panel comes
  // out of here — and so does what `mirror` draws behind its video panel, which
  // is the whole reason it is a module. `say` is the BEACON, never the batched
  // shipper: the room's lines about your real floor arrive while a session is
  // starting, which is exactly when a 2 s timer stops being generous.
  /**
   * 🔴 TWO THINGS THAT ARE BUILT AND NOT DRAWN, 2026-09-17.
   * *"rm controller geometry/tablet on all (only if i am ask on specific demo
   * so keep that code ready to pop into scene)"*. Both are switches rather than
   * deletions, and both are false: the controller stand-ins and the real models
   * live in `demo/shell/xr-room.mjs` (`GRIP_PARTS`, `loadModel`), the slab in
   * `demo/shell/xr-tablet.mjs`. Flip one to `true` and the thing is back in
   * this scene with no other edit.
   * ⚠️ THE INPUT IS NOT TOUCHED BY EITHER. Poses, the pointer and every button
   * still arrive, so the ray still points, things can still be grabbed and the
   * way out still draws at the grip. Taking the input away instead would be a
   * session with no visible way out, which is the failure this repo has already
   * paid for twice.
   */
  const SHOW_HANDS = false;
  const SHOW_TABLET = false;

  let room = null, tablet = null, xrHands = null, xrQuit = null;
  if (gl) {
    room = createXRRoom(gl, { log: (m, k) => d.log(m, k), say: shipNow });
    // ── the small screen on your left hand, and the controls on it ─────────
    // 🔴 THE CONTROLS ARE A LIST IN `xr-tablet.mjs`, NOT A THING THIS PAGE
    // BUILDS. Both pages that stand in this room get the same list, which is
    // the only way "the same interface in both kinds of session" survives
    // somebody adding a knob. `ctx` is what a control's `apply` is handed, so
    // nothing on the tablet reaches into the room, the session or this page.
    // ⚠️ `left` IS A NOTIFICATION, NOT THE ACTION. The way out is performed in
    // `xr-hands.mjs`; this is only how this page learns it was that one, so the
    // `end` handler below can say so instead of printing the same line for all
    // three. The label and the hold are read off the control rather than typed
    // here — a description that can disagree with its config is worse than none.
    // ⚠️ `left` IS BACK, AND IT IS A NOTIFICATION RATHER THAN THE ACTION. The
    // tablet's `Hold to leave` was removed in favour of the controller badge and
    // that was a swap where it should have been an addition: REPORTED from a
    // Quest as "i was not able to get out". The session is ended by
    // `xr-hands.mjs`, which is handed the session every frame; this is only how
    // this page learns it was that exit, so the `end` handler can name it
    // instead of printing one line for all three.
    // 🔴 BUILT AND NOT SHOWN. 2026-09-17: *"rm controller geometry/tablet on
    // all (only if i am ask on specific demo so keep that code ready to pop
    // into scene)"*. The component is whole in `demo/shell/xr-tablet.mjs` and
    // is still constructed here, because `applyAll()` below is what puts the
    // floor dots at the strength the slider declares rather than at a default —
    // the slab is simply not handed to the room to draw. Putting it back is
    // `SHOW_TABLET = true` and nothing else.
    // ⚠️ AND ITS WAY OUT IS GONE FROM IT, so there is no `left` notification to
    // wire: the one exit is the long hold on any button, below.
    tablet = createXRTablet({ ctx: { room } });
    // ⚠️ HANDED TO THE ROOM EVEN THOUGH NOTHING DRAWS IT, and that is not an
    // oversight. `setTablet` is what lets the room UPLOAD the face to the card
    // when its version moves; whether the slab is DRAWN is `tabletM`, which
    // `SHOW_TABLET` decides below. Skipping this left the upload path
    // uncovered, and the check that reads `tabletUploadMs` said so in one run.
    room.setTablet(tablet);
    tablet.applyAll();          // the dots start where the slider says, not at a default
    // 🔴 ONE INPUT PATH, AND IT CANNOT TELL VR FROM AR. Every controller, the
    // pointer, the tablet and its slider come out of this one module, which has
    // no session mode in it at all — so the interface is identical in both
    // modes structurally rather than by two paths agreeing today.
    xrHands = createXRHands({ tablet, log: (m, k) => d.log(m, k), say: shipNow });
  }

  /**
   * 🔴 NOTHING POPS UP IN A HEADSET ON THIS PAGE. A status card used to live
   * here: 768x192 of canvas, a yellow rule down its edge, uploaded as a texture
   * and hung head locked and low left, with eleven things allowed to raise it.
   * Asked 2026-09-19, and this page is where it was noticed: *"also remove the
   * notes/messagepopups from vrxr (noticed them in blocks)"*.
   *
   * ⚠️ THE ARGUMENT FOR IT WAS SOUND AND DID NOT COVER THIS. The 2-D page is
   * genuinely invisible inside an immersive session, so anything you need to
   * READ in there does have to be drawn in the scene. That argues for a surface
   * you CHOOSE to look at. It does not argue for text that appears in front of
   * you because something happened, which is what every one of the eleven was.
   * ⚠️ AND THE SURFACE IT ARGUES FOR IS ALREADY BUILT. `xr-tablet.mjs` is whole
   * and `SHOW_TABLET` is one flag from putting it back in your hand, which is a
   * thing you look at when you want to rather than a thing that arrives.
   *
   * Where the eleven went: development traffic to this page's own log and to
   * the beacon at pub.positron.studio, which are the two places a developer
   * reads; notes about what your own hands just did are gone, because the thing
   * MOVED and you were watching it, with the number kept in the log.
   */
  // ⚠️ SAY WHICH RENDERER, ALWAYS. A visitor on a software rasteriser is a real
  // visitor, and a page that is quietly slow teaches nothing. demo/verify-gl.mjs
  // checks its own answer against this one, so a page that stays silent reads as
  // a broken harness rather than as a quiet page.
  let rendererName = null;
  if (gl) {
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    rendererName = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    /**
     * 🔴 NAME THE CHIP, NOT THE FIRST COMMA. Splitting
     * "ANGLE (Apple, ANGLE Metal Renderer: Apple M2 Pro, Unspecified Version)"
     * on its first comma leaves the word "Apple", which says nothing at all.
     * The part worth printing is what follows "Renderer:".
     * ⚠️ THIRD COPY OF THIS LINE IN THE PROJECT: `/mirror/` has the first and
     * `/weight/` the second, and all three read the same string out of the same
     * extension and shorten it the same way. Taken from `/weight/` verbatim
     * rather than written again, so the extraction that is owed here is a move
     * rather than a reconciliation of three spellings.
     * ⚠️ THE FULL STRING STAYS ON `__demo.gl.renderer`, which is what
     * `verify-gl.mjs` compares its own answer against. The cell is for a
     * reader, and the check below holds the two to the same context.
     */
    const short = String(rendererName).match(/Renderer:\s*([^,)]+)/)?.[1]
      ?? String(rendererName).replace(/^ANGLE \(|\)$/g, '');
    gpuVal.textContent = short.trim().slice(0, 32);
  } else {
    // ⚠️ AN EMPTY CELL WOULD READ AS A CELL STILL WAITING. There is no context
    // and there never will be on this browser, which is a fact rather than a
    // pending measurement.
    gpuVal.textContent = 'no WebGL2';
  }

  // ── the room itself ─────────────────────────────────────────────────────
  let doc = null;              // the document the room IS
  let refused = 0, applied = 0;
  // When the accepted room landed, and whether a frame has shown it yet. `to
  // frame` is the distance between those two, which is the quantity the page
  // claims to report.
  let appliedAt = 0, shown = true, lastToFrame = null;
  let worst = 0, toFrame = [];
  const lastDocs = [];         // for the negative control

  /**
   * One view of the room, with this page's state handed across in one place.
   *
   * ⚠️ `clear` IS PER EYE AND ONLY THE FIRST ONE MAY SAY YES — `gl.clear`
   * ignores the viewport, both eyes share one framebuffer, and a colour clear
   * on the second view wipes what the first drew. The module holds that rule;
   * the caller holds the eye index.
   *
   * `eye` is where the viewer is, and it is only used by the dotted grid, whose
   * dots fade out with distance rather than ending in a hard rectangle.
   */
  /**
   * 🔴 NO SKY. `xr-room.mjs` draws a coloured cube around everything — eight-fold
   * symmetric noise, hue from the seed — and it was the loudest thing in the
   * picture on a page about the boxes inside it. Off, and what is left is the
   * dotted floor the module already draws: black, a ground reference, and the
   * same surface `weight` stands on, so the two 3-D rooms here read as one place.
   * ⚠️ `sky: false` is a draw option the module already had for passthrough,
   * where the real room is behind you and a painted one would replace it. This
   * is the same argument indoors.
   */
  function drawRoom(proj, view, tSec, doClear = true, eye = null) {
    if (!room || !doc) return;
    room.draw({
      proj, view, tSec, doc, clear: doClear, ar: arMode, eye, sky: false,
      // 🔴 THE BRICKS ARE SQUARE TO YOUR ROOM, NOT TO THE HEADSET. Reported
      // 2026-09-17: *"in xr blocks are angled against wall, rotated a bit, not
      // fully against wall"*. `planes.yaw` is 0 until a headset reports walls,
      // so the window and every VR session are unchanged. See `roomYaw` below.
      yaw: roomYaw(),
      aimed, held, aimedDist, ray: xrOk ? rayNow : null,
      touch: drawTouch,
    });
  }

  /**
   * 🔴 THE THIRD STATE: A BRICK PUSHED UP AGAINST A WALL.
   *
   * `touchOf` from the kit answers about the RAY — nothing, aimed, held — and
   * the thumbstick can push a held brick straight through a wall and out of the
   * room. That push is KEPT (*"no, keeep them, som some hilite or smt when
   * pushed against wall"*); what it lacked was any sign it had happened, so a
   * brick you shoved away looked exactly like a brick you had lost.
   *
   * 🔴 BRIGHTER ONLY. NOTHING ON THIS PAGE CHANGES SIZE. INSTRUCTED 2026-09-19:
   * *"do not make blcoks bigger on hilite, just lighen them up"*. The kit's
   * `TOUCH` table moves two channels and its own comment argues that size is the
   * half that matters in a headset; that argument is about a PANEL, which is a
   * flat slab at a fixed distance, and it does not survive being applied to a
   * brick. A brick has a size that MEANS something: it sits on a lattice, it is
   * pushed against a wall, it is judged against its neighbours, and growing it
   * by 7% while somebody is placing it moves the thing they are aiming with.
   * ⚠️ THE KIT TABLE IS UNTOUCHED AND THAT IS DELIBERATE. `xr-panel.mjs` uses it
   * for panels, where the reasoning still holds and nobody asked for a change.
   * This page takes the brightness and drops the scale.
   * ⚠️ Not a colour either: colour on this site says how something LANDED, and
   * "you have pushed it as far as it goes" is exactly that.
   *
   * ⚠️ NAMED RATHER THAN INLINE SO THE CHECK CAN DRIVE THE SAME FUNCTION. A
   * check that rebuilt this arithmetic would be grading its own copy.
   */
  const drawTouch = (isHeld, isAimed) => {
    const t = touchOf(isHeld, isAimed);
    const lit = isHeld && atWall ? t.lit * 1.45 : t.lit;
    return { lit, scale: 1 };
  };

  // ── applying a room, which is the only way the room ever changes ────────
  /**
   * ⚠️ NOTHING CALLS THIS EXCEPT THE SOCKET. A roll is a request that goes out
   * and comes back; the room changes on the echo. That is what makes the
   * `round trip` number the real distance between asking and seeing rather than
   * the time to draw something we already had — and it is why two headsets in
   * one room see the same world in the same order.
   */
  function apply(next, askedAt) {
    const why = validate(next);
    if (why) {
      refused++;
      d.log(`refused: ${why}`, 'warn');
      return false;
    }
    doc = next; applied++;
    appliedAt = performance.now(); shown = false;
    lastDocs.push(docOf(next));
    if (askedAt) roundTrip = Date.now() - askedAt;
    d.log(`room ${next.seed} holds ${next.things.length} things in ${docOf(next).length} bytes`);
    return true;
  }

  // ── moving a thing ──────────────────────────────────────────────────────
  let held = null;          // { i, dist } while a trigger is down
  let moved = 0;

  /**
   * Put one thing somewhere else, IN THE DOCUMENT.
   *
   * ⚠️ A MOVE IS AN EDIT, AND THE ROOM STOPS BEING A PURE FUNCTION OF ITS SEED
   * THE MOMENT YOU MAKE ONE. That is not a bug to hide: the seed is where a
   * room STARTS, the document is what it IS, and `plan-nodes` §4 is the same
   * argument one level up — the document is the product. Rolling again
   * regenerates from the seed and the negative control still holds, because it
   * compares two fresh rolls rather than the live room.
   *
   * Rounded like the generator rounds, so an edited document stays canonical
   * and a byte comparison keeps meaning what it says.
   */
  function moveThing(i, x, y, z) {
    const t = doc?.things?.[i];
    if (!t) return false;
    const next = { ...t, x: r4(x), y: r4(y), z: r4(z) };
    const trial = { ...doc, things: doc.things.map((o, k) => (k === i ? next : o)) };
    // ⚠️ THE SAME `validate` THE RELAY PATH USES. A hand can drag a thing
    // through a wall as easily as a generator can put one there, and a rule
    // that only applies to what arrives over the wire is not a rule about the
    // document.
    if (validate(trial)) return false;
    doc = trial;
    return true;
  }

  /**
   * 🔴 THE PLATE, WHICH IS HOW FAR THE ROOM GOES BEFORE THERE IS A WALL. The
   * validator refuses anything past 24 m, which is a rule about a document
   * rather than a place you can stand: a brick at 22 m is inside the room and
   * nowhere near anything.
   * ⚠️ IT IS SMALLER THAN THE VALIDATOR'S LIMIT ON PURPOSE. The two are not the
   * same rule. One says what a document may contain and this says where a brick
   * may be put, and collapsing them would mean a generator change could
   * silently move the walls.
   */
  // ⚠️ THE PLATE FOLLOWS THE BRICK, AND THIS IS THE THIRD TIME THE PAIR HAS
  // MOVED. It was 2.2 m against a 0.2 m unit, which is eleven bricks across; at
  // 0.5 m eleven bricks would have been 5.5 m of floor, so it became 2.4, which
  // is 9.6 bricks.
  // 🔴 AND 4.8 SINCE 2026-09-19, BECAUSE THE UNIT WENT TO 1.0 m. The arithmetic
  // is one division: a plate is measured in bricks as `2 * PLATE / UNIT`, so
  // 2.4 against 0.5 m is 9.6 bricks across and 4.8 against 1.0 m is the same
  // 9.6. Left at 2.4 the same floor would have been 4.8 bricks across, which is
  // a brick twice the size in a room with a quarter of the places to put one.
  // ⚠️ THE ROOM IS NOW 9.6 m ACROSS AND STILL REACHABLE. Its furthest corner is
  // 6.8 m from the middle, under the 16 m ceiling on how far a held brick can
  // be pushed, and well inside the 22 m of dotted floor the room module draws.
  const PLATE = 4.8;

  /**
   * 🔴 WHICH WAY ROUND THE BRICK GRID IS, IN RADIANS. Zero until a headset
   * reports walls, and zero is exactly what this page did before 2026-09-17.
   *
   * Reported that day: *"in xr blocks are angled against wall, rotated a bit,
   * not fully against wall"*. Nothing rotates the bricks — they are axis-
   * aligned to the REFERENCE SPACE, whose yaw is wherever the headset happened
   * to be looking when the session started, and a real wall is at whatever
   * angle somebody built it at. `wallYaw` in `xr-room.mjs` reads the angle off
   * the walls the headset measured; it is graded under `node` by
   * `demo/shell/xr-pick-test.mjs`, including the negative control that a room
   * already square asks for no turn.
   */
  const roomYaw = () => room?.planes?.yaw || 0;
  /** World x,z into the brick grid's own frame, and back. */
  const toGrid = (x, z, a = roomYaw()) => {
    const c = Math.cos(-a), s = Math.sin(-a);
    return [x * c - z * s, x * s + z * c];
  };
  const fromGrid = (x, z, a = roomYaw()) => toGrid(x, z, -a);

  /**
   * 🔴 IS THE THING IN YOUR HAND UP AGAINST A WALL, OR PAST ONE.
   * Asked for 2026-09-17 alongside keeping the push that does it: *"no, keeep
   * them, som some hilite or smt when pushed against wall"*. The thumbstick can
   * shove a held brick straight out of the room and that stays — what was
   * missing is any sign that it had happened, so a brick you pushed away looked
   * exactly like a brick you had lost.
   * ⚠️ MEASURED IN THE GRID'S OWN FRAME, so the test is against the wall you
   * can see rather than against an axis of the headset's.
   */
  let atWall = false;
  function pushedToWall(i) {
    const t = doc?.things?.[i];
    if (!t) return false;
    const half = halfOf(t);
    const [gx, gz] = toGrid(t.x, t.z);
    // At the wall, not merely near it: the clamp `settleDrop` applies on release
    // is `PLATE - half`, so this is true from the moment a push reaches the
    // place a drop would put it back to.
    return Math.abs(gx) >= PLATE - half - 1e-6 || Math.abs(gz) >= PLATE - half - 1e-6;
  }

  /**
   * Where a brick goes when you let go of it.
   *
   * 🔴 THREE RULES, IN THIS ORDER, AND THE ORDER IS THE WHOLE THING. Snap to
   * the grid, put it back inside the room, then push it out of whatever it
   * landed in — and snap again, because the push moves it off the grid it was
   * just put on. Done the other way round a brick clears its neighbour and then
   * the snap shoves it back in.
   *
   * ⚠️ ONLY THE DROPPED THING MOVES. Relaxing the whole room on a drop would
   * shift things somebody else in the room is holding, and a room that
   * rearranges itself because you put one object down is a room you cannot
   * build in. The placement rule runs once, on a room nobody is touching; this
   * one answers for the one brick you just let go of.
   *
   * ⚠️ AND IT PUSHES ALONG THE SHORTEST AXIS, WHICH IS WHAT MAKES A STACK. The
   * old rule pushed along the line between two centres — right for spheres, and
   * for cubes it slides a brick diagonally off the grid rather than setting it
   * on top. `leastAxis` is the short way out of a box, so a brick dropped a
   * little into the top of another comes to rest ON it.
   *
   * Returns how far it went, in metres, or 0 if it was already where it belongs.
   */
  function settleDrop(i) {
    const me = doc?.things?.[i];
    if (!me) return 0;
    const half = halfOf(me);
    // The grid is offset by the brick's own half, so a brick of any size sits
    // with its FACES on unit lines rather than its centre.
    const snap1 = (v) => Math.round((v - half) / UNIT) * UNIT + half;
    // 🔴 THE ROOM IS A BOX AND YOU CANNOT PUT ANYTHING THROUGH IT. A brick let
    // go beyond the plate used to keep going — the validator would refuse it at
    // 12 m, so the only thing stopping you was a rule that throws the whole
    // room away. Clamped here, a brick released past a wall comes to rest
    // against it, which is what a wall is for. The floor is the same rule with
    // one side: nothing sits below its own half-height.
    const clamp = (v) => Math.max(-PLATE + half, Math.min(PLATE - half, v));
    // 🔴 SNAPPED AND CLAMPED IN THE GRID'S OWN FRAME, WHICH IS THE ROOM'S.
    // The grid used to be the reference space's axes, so a brick let go near a
    // real wall came to rest on a lattice at whatever angle the headset had
    // been facing at session start — *"angled against wall, rotated a bit, not
    // fully against wall"*. `roomYaw()` is 0 with no walls measured, so the
    // window and every VR session get byte-for-byte what they had.
    // ⚠️ THE OVERLAP TEST IS AXIS-ALIGNED, so the other things have to be in
    // the SAME frame or it would be comparing a rotated box with an unrotated
    // one. Every brick shares one yaw, so rotating them all is exact rather
    // than approximate.
    const a = roomYaw();
    const others = doc.things.map((t, k) => {
      if (k === i) return t;
      const [ox, oz] = toGrid(t.x, t.z, a);
      return { ...t, x: ox, z: oz };
    });
    const [mgx, mgz] = toGrid(me.x, me.z, a);
    let x = clamp(snap1(mgx)), z = clamp(snap1(mgz));
    let y = Math.max(half, snap1(me.y));
    for (let pass = 0; pass < DROP_PASSES; pass++) {
      let worst = null, deepest = 1e-6;
      for (let k = 0; k < doc.things.length; k++) {
        if (k === i) continue;
        const o = overlapOf({ ...me, x, y, z }, others[k]);
        if (!o) continue;
        const ax = leastAxis(o);
        if (o['o' + ax] > deepest) { deepest = o['o' + ax]; worst = { o, ax, other: others[k] }; }
      }
      if (!worst) break;
      const ax = worst.ax;
      const cur = { x, y, z }[ax];
      const dir = Math.abs(cur - worst.other[ax]) < 1e-6
        // Dropped dead centre, with no side to be on: upward, because a brick
        // you cannot place should end up on top of the pile rather than inside it.
        ? (ax === 'y' ? 1 : 1)
        : Math.sign(cur - worst.other[ax]);
      // 🔴 SNAP AWAY FROM IT, NOT TO THE NEAREST LINE. Rounding to the nearest
      // can land the brick back inside the thing it was just pushed out of —
      // and then the next pass pushes it to the same place, which is a loop
      // that runs out of passes and reports a brick still inside another.
      // MEASURED as exactly that: 0.30 m apart against a rule asking for 0.50,
      // after 48 passes. Ceiling when moving up the axis and floor when moving
      // down means the push can only ever end further out than it started.
      const next = cur + dir * worst.o['o' + ax];
      const away = (v) => {
        const k = (v - half) / UNIT;
        return (dir > 0 ? Math.ceil(k - 1e-9) : Math.floor(k + 1e-9)) * UNIT + half;
      };
      if (ax === 'x') x = clamp(away(next));
      else if (ax === 'z') z = clamp(away(next));
      else y = Math.max(half, away(next));
    }
    // ...and back into the world, which is the frame the document is written in.
    const [wx, wz] = fromGrid(x, z, a);
    const went = Math.hypot(wx - me.x, y - me.y, wz - me.z);
    if (went < 1e-4) return 0;
    return moveThing(i, wx, y, wz) ? went : 0;
  }
  // The old name, because three call sites and two asserts use it and a rename
  // here buys nothing.
  const pushClear = settleDrop;

  // ── the socket ──────────────────────────────────────────────────────────
  let ws = null, seq = 0, echoed = false, asked = 0;
  const send = (m) => {
    if (ws?.readyState !== 1) return false;
    ws.send(JSON.stringify({ ...m, from: `page-${ID}`, at: Date.now(), seq: seq++ }));
    return true;
  };
  function open() {
    return new Promise((done) => {
      ws = new WebSocket(RELAY);
      ws.onopen = () => { d.log(`joined ${ROOM}`); done(true); };
      ws.onerror = () => done(false);
      ws.onmessage = (e) => {
        if (typeof e.data !== 'string') return;
        let m; try { m = JSON.parse(e.data); } catch { return; }
        if (m.type?.startsWith('dev.')) { onDev(m); return; }
        if (m.type !== 'scene.room') return;
        if (m.from === `page-${ID}`) echoed = true;      // our own message came back

      };

    });
  }
  const roll = async (seed) => {
    if (ws?.readyState !== 1) await open();
    asked = Date.now();
    const before = applied;
    if (!send({ type: 'scene.room', doc: world(seed) })) {
      // No relay: still show a room rather than an empty stage, and SAY that
      // the number is missing rather than printing a zero that looks measured.
      apply(world(seed), 0);
    }
    // ⚠️ WAIT FOR THE ROOM TO BE DRAWN, NOT FOR A FIXED SLEEP. This was 900 ms
    // flat, against a relay that answers in about thirty — so five rolls cost
    // four and a half seconds of which nearly all was a timer. The cap is the
    // old number, because a relay that never answers must cost this page a
    // moment and then be reported, not hang it. `applied` rather than `shown`
    // alone: `shown` is left TRUE by the previous roll, so a wait on it would
    // fall straight through before this room had even come back.
    const t0 = performance.now();
    while (performance.now() - t0 < 900 && !(applied > before && shown)) {
      await new Promise((r) => setTimeout(r, 25));
    }
  };

  /**
   * Updates from whoever is writing this page, while you are wearing it.
   *
   * 🔴 A RELOAD ENDS A WEBXR SESSION AND THERE IS NO WAY AROUND THAT. So the
   * tiers exist to keep as much work as possible on THIS side of a reload:
   *
   *   dev.status   a line to read          — nothing changes
   *   dev.shader   new GLSL                — recompiled in place, session lives
   *   dev.module   a new generator         — re-imported, session lives
   *   dev.reload   everything else         — the session must end, so YOU pick when
   *
   * ⚠️ The first three apply themselves. The fourth never does: it puts a line
   * up and waits, because a session ending under somebody without warning is
   * the disruptive refresh this whole arrangement exists to avoid.
   */
  /**
   * 🔴 NONE OF THIS PUTS ANYTHING IN FRONT OF YOU ANY MORE. Every branch here
   * used to hang a card in the scene, and this whole block is development
   * traffic: somebody at a keyboard pushing a message down a socket at a person
   * wearing a headset. Asked 2026-09-19: *"also remove the notes/messagepopups
   * from vrxr (noticed them in blocks)"*. It goes to the two places a developer
   * actually reads, which are this page's own log and the device log at
   * pub.positron.studio, and to neither of them does anybody have to be wearing
   * anything.
   */
  let reloadOffered = null;
  async function onDev(m) {
    if (m.type === 'dev.status') {
      d.log(`dev: ${m.text}`);
      shipNow(`dev.status · ${m.text}`);
      return;
    }
    if (m.type === 'dev.shader') {
      try {
        // ⚠️ HELD, NOT SWAPPED — the module dissolves the new look over
        // FADE_MS rather than cutting to it, because a hard cut across your
        // whole field of view is a great deal more violent than the same cut in
        // a browser pane. It throws if the body will not compile, and the
        // picture keeps its own.
        room.applyLook({ sky: m.sky, box: m.box });
        d.log('a new look arrived and is fading in', 'ok');
        shipNow('dev.shader compiled · fading in');
      } catch (e) {
        // A shader that will not compile must not take the picture with it.
        d.log(`the new look would not compile, so the picture keeps its own. ${e.message}`, 'warn');
        shipNow(`FAIL dev.shader: ${e.message}`);
      }
      return;
    }
    if (m.type === 'dev.module') {
      try {
        // A cache-busted URL is a NEW module, which is the only way to get a
        // second copy of one the browser has already evaluated.
        const mod = await import(`/shell/seed.mjs?v=${encodeURIComponent(m.v || Date.now())}`);
        world = (seed) => spaced(mod.world(seed)); validate = mod.validate;
        d.log('a new generator is in. The next room rolled will come out of it', 'ok');
        shipNow(`dev.module applied live · v${m.v}`);
      } catch (e) {
        d.log(`the new generator was refused, so the old one is still making rooms. ${e.message}`, 'warn');
        shipNow(`FAIL dev.module: ${e.message}`);
      }
      return;
    }
    if (m.type === 'dev.reload') {
      reloadOffered = m.build || 'a new build';
      // ⚠️ THE `press A` INSTRUCTION IS REHOMED, NOT DROPPED. It was the one
      // useful thing on a card that hung in somebody's view for a full minute,
      // and the button still works: what changed is that the person told about
      // it is the developer who pushed the update, in the log and the beacon,
      // rather than whoever happened to be wearing the headset.
      d.log(`an update is ready (${reloadOffered}). Reload when you want it, `
        + 'or press A on a controller to take it without leaving the room');
      shipNow(`dev.reload offered · ${reloadOffered} · A takes it`);
    }
  }

  /**
   * Taking a tier-4 update, as gently as it can be taken.
   *
   * ⚠️ IT CANNOT RE-ENTER BY ITSELF AFTERWARDS. `requestSession` needs a
   * transient user activation and a freshly loaded page has none, so the
   * honest design is one press on the other side rather than a promise of
   * none. The flag makes that press a single obvious button instead of finding
   * the card and the control again.
   */
  function takeReload() {
    try { sessionStorage.setItem('blocks-resume', '1'); } catch { /* private mode */ }

    location.reload();
  }

  // ── the flat window, which is also how the desktop harness sees it ──────
  /**
   * 🔴 THE TABLET AND ONE CONTROLLER, SHOWN IN THE WINDOW TOO, AND IT IS NOT
   * DECORATION. Two reasons, and the second is the one that matters.
   *
   * 1. A visitor with no headset can read the thing this page now has a control
   *    on. Otherwise the only way to see it is to own a Quest.
   * 2. ⚠️ IT IS THE ONLY WAY A LAPTOP EVER RUNS THE TABLET'S DRAW CALL. Without
   *    it the quad, its new sampler and its texture bind are reached for the
   *    first time on the FIRST FRAME OF A HEADSET SESSION — where a pending
   *    `gl.getError()` costs the one run somebody was going to do. With it,
   *    `demo/verify-gl.mjs`'s "no WebGL error is pending" covers the tablet on
   *    every run of the suite, on real ANGLE, for free.
   *
   * The pose is synthesised where a left hand would be if you were standing at
   * the camera — down and to the left, turned so its face looks back at you.
   * The stand-in is drawn with it, because a tablet floating on nothing would
   * be a picture of something that does not happen.
   */
  function previewTablet(eye) {
    if (!room) return;
    const target = [0, 1.2, 0];
    const n = (v) => { const l = Math.hypot(...v) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
    const X = (u, v) => [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
    const L = n([target[0] - eye[0], target[1] - eye[1], target[2] - eye[2]]);
    const camR = n(X(L, [0, 1, 0]));
    const pos = [
      eye[0] + L[0] * 0.95 - camR[0] * 0.30,
      eye[1] + L[1] * 0.95 - camR[1] * 0.30 - 0.30,
      eye[2] + L[2] * 0.95 - camR[2] * 0.30,
    ];
    // ⚠️ BUILT FROM THE TABLET'S POSE BACKWARDS, which is why this changed when
    // `holdM` did. The tablet's face now looks along the grip's +Y — ACROSS the
    // handle, back at whoever is holding it — rather than along -Z, so the
    // frame that points it at this camera is the one whose +Y is toward the
    // eye. It was the other way round when the tablet faced the sky, and if
    // this preview ever shows the tablet edge-on again it is saying that
    // `holdM` moved without this following.
    //   +Y toward the eye · -Z up the controller · X = Y x Z, so it is
    //   right-handed by construction rather than by inspection.
    const gy = n([eye[0] - pos[0], eye[1] - pos[1], eye[2] - pos[2]]);
    const gx = n(X(gy, [0, -1, 0]));
    const gz = X(gx, gy);
    const m = new Float32Array([
      gx[0], gx[1], gx[2], 0,
      gy[0], gy[1], gy[2], 0,
      gz[0], gz[1], gz[2], 0,
      pos[0], pos[1], pos[2], 1]);
    // ⚠️ IT CLAIMS THE PROFILE THE HEADSET REPORTS, ON PURPOSE. Without it the
    // window would draw the stand-in and the REAL model's whole path — the
    // fetch, the reader, the texture decode, the third shader program — would
    // first run on the first frame of a headset session, which is where a
    // pending `gl.getError()` costs the one run somebody was going to do. With
    // it, `demo/verify-gl.mjs` covers the models on every run of the suite, on
    // real ANGLE, and a visitor with no headset can see their controller.
    room.setInput({
      hands: SHOW_HANDS ? [{ m, handedness: 'left', profile: 'meta-quest-touch-plus' }] : [],
      pointer: null, tabletM: SHOW_TABLET ? holdM(m) : null, hit: null,
    });
  }

  // ── the window: you walk in it, the same way you walk in `weight` ──────────
  //
  // 🔴 THE CAMERA USED TO ORBIT ON A TIMER — `eye = [cos(t*0.12)*6.5, 2.4,
  // sin(t*0.12)*6.5]` — which is the one thing a room you are meant to be IN
  // must not do: it moves without being asked, it never stops, and there is
  // nothing you can do about it. It also made this the only 3-D page here you
  // could not steer, beside two you can. Drag to look, arrows or WASD to walk,
  // 1.6 m off the floor — one idea of "a window into a room" across the project.
  /**
   * 🔴 THE ROOM SCALED AND THE PERSON LOOKING AT IT DID NOT, WHICH IS THE WHOLE
   * OF HOW THIS PAIR MOVED ON 2026-09-19.
   *
   * `EYE_Y` is 1.6 m because that is how far a person's eyes are off the floor,
   * and it stays at 1.6 whatever a brick measures. Doubling it would have
   * turned a room of bigger bricks into the same room seen by a giant, which is
   * the one thing "make the blocks twice as big" does not mean.
   *
   * Where you START is a different quantity: it is chosen so the room is in
   * front of you rather than round you. The generator lays a nine-cell plate,
   * so its nearest brick sat 2.25 m out at a 0.5 m unit and sits 4.5 m out at
   * 1.0 m. Standing 6.0 m back left 3.75 m of clear floor in front of the first
   * brick; 8.25 m leaves the same 3.75 m, so you are still outside the pile and
   * the bricks arrive in the picture at twice the size, which is what was
   * asked for. Left at 6.0 you would have opened the page standing against a
   * metre cube.
   */
  const EYE_Y = 1.6;
  let camPos = [0, 8.25], camYaw = 0, camPitch = -0.12;
  const keys = new Set();
  addEventListener('keydown', (e) => {
    if (!stage.isConnected) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd'].includes(k)) {
      keys.add(k); e.preventDefault();
    }
  });
  addEventListener('keyup', (e) => {
    keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key);
  });
  addEventListener('blur', () => keys.clear());
  let drag = null;
  stage.addEventListener('pointerdown', (e) => {
    drag = { x: e.clientX, y: e.clientY };
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', (e) => {
    if (!drag) return;
    camYaw += (e.clientX - drag.x) * 0.005;
    camPitch = Math.max(-1.2, Math.min(1.2, camPitch - (e.clientY - drag.y) * 0.005));
    drag = { x: e.clientX, y: e.clientY };
  });
  for (const ev of ['pointerup', 'pointercancel']) {
    stage.addEventListener(ev, () => { drag = null; });
  }
  function walk(dt) {
    let fx = 0, fz = 0;
    if (keys.has('ArrowUp') || keys.has('w')) fz += 1;
    if (keys.has('ArrowDown') || keys.has('s')) fz -= 1;
    if (keys.has('a')) fx -= 1;
    if (keys.has('d')) fx += 1;
    if (keys.has('ArrowLeft')) camYaw -= dt * 1.6;
    if (keys.has('ArrowRight')) camYaw += dt * 1.6;
    if (!fx && !fz) return;
    // ⚠️ 3.2 m/s IS A PERSON WALKING BRISKLY AND DID NOT DOUBLE WITH THE BRICK,
    // for the reason `EYE_Y` did not: it is a fact about whoever is looking
    // rather than about what they are looking at. A 9.6 m room crosses in three
    // seconds at this speed, and 6.4 m/s through a first-person camera is a
    // sprint nobody asked for.
    const n = Math.hypot(fx, fz), amt = dt * 3.2;
    const c = Math.cos(camYaw), si = Math.sin(camYaw);
    camPos[0] += (fx * c + fz * si) * amt / n;
    camPos[1] += (fx * si - fz * c) * amt / n;
    // A soft wall: nothing stops you leaving, but a viewer forty metres out is
    // looking at nothing and has no way of knowing which way anything is.
    // ⚠️ LEFT AT 22 WHEN THE BRICK DOUBLED, AND ON PURPOSE. It is not tuned
    // against a brick, it is tuned against the DOTTED FLOOR, which `GRID` in
    // `xr-room.mjs` fixes at 22 m across with its fade ending at 11. Doubling
    // this would have let you walk to four times the floor's own half span and
    // stand on nothing, and that file is not this page's to change.
    for (let i = 0; i < 2; i++) camPos[i] = Math.max(-22, Math.min(22, camPos[i]));
  }

  // The relay round trip, kept because the asserts read it; it lost its readout
  // cell when the roll stopped being a button — a number that changes once a
  // visit is not a measurement a row can carry.
  let roundTrip = null;
  let raf = 0, t0 = performance.now(), lastFrame = 0, lastNow = performance.now();
  function flat(now) {
    raf = requestAnimationFrame(flat);
    if (!gl || !doc) return;
    const w = canvas.clientWidth * devicePixelRatio | 0, h = w * 9 / 16 | 0;
    if (canvas.width !== w) { canvas.width = w; canvas.height = h; }
    gl.viewport(0, 0, canvas.width, canvas.height);
    const tSec = (now - t0) / 1000;
    walk(Math.min(0.05, (now - lastNow) / 1000)); lastNow = now;
    const eye = [camPos[0], EYE_Y, camPos[1]];
    const ahead = [eye[0] + Math.sin(camYaw) * Math.cos(camPitch),
                   eye[1] + Math.sin(camPitch),
                   eye[2] - Math.cos(camYaw) * Math.cos(camPitch)];
    previewTablet(eye);
    drawRoom(perspective(1.05, canvas.width / canvas.height, 0.1, 60),
             lookAt(eye, ahead), tSec, true, eye);
    markShown(now);
    // ⚠️ REPUBLISHED HERE, NOT ONLY AT LOAD. `publishXR` builds a plain object,
    // so a field written once answers about whichever instant it was written
    // in — and the load-time call happens before the first frame, so
    // `tabletUploadMs` and `dots` read `null` forever on a machine that never
    // enters a session. That is this file's own getter rule, broken by its own
    // author, and it was caught by reading the published object back rather
    // than by reading the code.
    publishXR();
    if (room?.retire()) d.log('the new look is now the look', 'ok');
    if (lastFrame) { const dt = now - lastFrame; if (dt > worst) worst = dt; }
    lastFrame = now;
  }
  if (gl) flat(performance.now());

  // ── the headset ─────────────────────────────────────────────────────────
  // ⚠️ DECLARED UP HERE BECAUSE `publishXR` READS IT, and a `const` or a `let`
  // left below its reader is this project's most repeated defect.
  let view = 'window';
  let session = null, xrSpace = null, xrOk = false, xrFrames = 0, frameViews = 0;
  let rayNow = null, aimed = null, aimedDist = 0;
  // ⚠️ NOTHING GETS TO BE CLOSER THAN THIS. A cube 20 cm from your eyes is not
  // a small cube, it is a wall, and you cannot aim at what you cannot back away
  // from.
  // 🔴 BOTH DOUBLED WITH THE BRICK, 2026-09-19, AND BOTH HAD TO. What fills
  // your view is the angle a thing covers, so a 1.0 m cube held at 0.8 m looks
  // exactly like a 0.5 m cube held at 0.4 m, and the near face is 0.30 m from
  // your eye instead of 0.15. `BUBBLE` is compared against the distance to a
  // thing's CENTRE, so it has to clear a brick's half-diagonal or a cube
  // overlapping your head is not counted as being in it: that half-diagonal
  // went 0.43 m to 0.87 m, which 0.45 no longer covered and 0.9 does.
  const MIN_HOLD = 0.8, BUBBLE = 0.9;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  let lastShove = 0, aWas = false;

  /** Nearest thing the ray passes through, or null. Spheres, from the same
   *  `radiusOf` the separation rule uses — an exact box test would be twenty
   *  lines nobody can check by eye, and aiming at one ball while being kept
   *  apart by another would be two different shapes for one thing. */
  function pick(o, dir) {
    let best = null;
    doc?.things?.forEach((t, i) => {
      const r = radiusOf(t);
      const ox = o[0] - t.x, oy = o[1] - t.y, oz = o[2] - t.z;
      const b = ox * dir[0] + oy * dir[1] + oz * dir[2];
      const c = ox * ox + oy * oy + oz * oz - r * r;
      const disc = b * b - c;
      if (disc < 0) return;
      const dist = -b - Math.sqrt(disc);
      if (dist > 0.05 && (!best || dist < best.dist)) best = { i, dist };
    });
    return best;
  }
  /**
   * 🔴 THE TWO PROBES THAT USED TO LIVE HERE ARE `demo/shell/xr-caps.mjs` NOW,
   * AND THEY WERE BROKEN IN ONE CHARACTER. They read
   * `navigator.xr?.isSessionSupported('immersive-vr').then(v => …, () => …)`,
   * and on a browser with no `navigator.xr` at all the optional chain returns
   * `undefined`, so NEITHER handler ever ran and the variable stayed `null`
   * forever. Photographed on an iPhone as a page reporting a failure where the
   * honest answer is that there was never anything to ask. The module answers
   * `absent` in the same turn instead.
   *
   * ⚠️ IT IS ONLY ABOUT WHETHER A SESSION CAN BE ASKED FOR. `nativeXR()` at the
   * top of this file is a different question and both are needed: a desktop
   * Chrome has a genuinely native `navigator.xr` and answers no, while the
   * Immersive Web Emulator installs a JavaScript one that claims everything.
   * Nothing here replaces that probe.
   *
   * ⚠️ AND IT IS READ SYNCHRONOUSLY IN `enter()`. `xrCaps()` is a snapshot, so
   * the rule below about spending a transient user activation on an await is
   * kept by construction rather than by remembering to take the answer early.
   */
  let arMode = false;

  /**
   * What demo/verify-quest.mjs reads to turn its compositor line from context
   * into a verdict. `frames` is the count THIS PAGE drew; the harness prints it
   * beside what `adb logcat -s VrApi` says the compositor did.
   *
   * ⚠️ THE TWO ARE PRINTED SIDE BY SIDE AND NEVER AVERAGED. They are counted on
   * opposite sides of the wire — one by the page, one by the system compositor —
   * and a mean of them would hide exactly the case worth catching, which is the
   * page believing it drew frames the compositor never presented. That is
   * createMidiLane's `scheduled()` in a new costume: a count is only evidence
   * on the far side of the boundary.
   */
  const publishXR = () => {
    window.__demo.xr = {
      presenting: xrOk, mode: xrOk ? (arMode ? 'immersive-ar' : 'immersive-vr') : 'window', frames: xrFrames,
      // ⚠️ WHERE THE DOTTED GRID IS, AND WHY — published so one headset run
      // answers it without anybody reading the log. `surfaces` is the state in
      // a word (six of them; the list is beside `planes` in xr-room.mjs) and
      // `grid` is what the floor under the dots actually is, because "nobody
      // asked", "we were refused", "your room reported no surfaces" and "your
      // room has no walls" are four different statements and at most one of
      // them is true at a time.
      surfaces: room?.planes.state ?? 'no room', grid: room?.planes.from ?? '—',
      planes: room?.planes.count ?? 0, labels: room ? { ...room.planes.labels } : {},
      // 🔴 THE LINE TWO HEADSET RUNS ARE COMPARED ON, AND IT HAS NO MODE IN IT.
      // The owner will do one pass of VR and one of passthrough, not three — so
      // "is the controller interface the same in both?" has to be answerable by
      // putting the two logs side by side. This string is built entirely out of
      // declarations: sizes, counts, ranges, which hand gets what, which gamepad
      // index is the trigger. If it ever differs between two runs, something in
      // the controller path learned what kind of session it was in.
      ui: xrHands ? xrHands.fingerprint() : 'no controller interface built',
      dots: room ? room.gridAlpha : null,
      tabletUploadMs: room ? room.tabletUploadMs : null,
      // 🔴 WHICH OF THE THREE WAYS OUT FIRED, IN WORDS, AND `null` WHILE NONE
      // HAS. The owner gets one run per mode, so "did the button on the tablet
      // work?" has to be answerable from what the page published rather than
      // from remembering what was pressed. ⚠️ `null` here is not "no" — it is
      // "nothing has ended this session", which is the true answer while one is
      // running and the honest one when the system menu ended it.
      leftBy,
      /**
       * 🔴 THE FOUR THE READOUT USED TO HOLD, KEPT ON THE MACHINE SURFACE. The
       * row went on 2026-09-19 and CLAUDE.md's rule when a display goes is to
       * rehome what it said rather than let the page quietly stop reporting it.
       * Three of the four found a home in the log, where they belong because
       * they change when something happens; all four are here as well, because
       * a harness reads numbers and cannot read prose.
       */
      view, moved, toFrameMs: lastToFrame, worstGapMs: worst,
    };
  };

  /**
   * 🔴 WHERE YOU ARE LOOKING FROM, AND IT ONLY SPEAKS WHEN IT MOVES. This was a
   * readout cell written from five places, which is a cell that can be rewritten
   * with the value it already had. A state change belongs in the log at the
   * MOMENT IT CHANGES, so the guard is the whole point rather than an
   * optimisation: without it, entering a session would print the same line
   * twice and nothing would have happened between them.
   * ⚠️ IT SAYS NOTHING AT LOAD. `window` is where everybody starts, and a first
   * log line announcing that you are looking at a page through a page is the
   * kind of furniture a reader learns to scroll past.
   */
  const setView = (next) => {
    if (next === view) return;
    view = next;
    d.log(next === 'window' ? 'back to the window' : `you are looking from ${next}`, 'hi');
    publishXR();
  };
  async function enter(mode = XR_MODE.vr) {
    arMode = mode === XR_MODE.ar;

    // and awaiting anything first can spend it, so the answer is the snapshot
    // the module already holds rather than a fresh question asked here. This is
    // the whole reason the first attempt on a real Quest produced no asserts at
    // all: the handler threw where nothing was reporting.
    // ⚠️ ONE GUARD FOR THREE CASES, AND `asking` IS NOT ONE OF THEM. `canEnter`
    // lets a question still out in the browser through, because a control that
    // refuses on a guess is the other way of lying about what a browser can do.
    const key = arMode ? 'ar' : 'vr';
    const state = xrCaps()[key];
    if (!canEnter(state)) { d.log(reasonFor(state, key), 'warn'); return false; }
    // ⚠️ A DEADLINE ON EVERY STEP. A rejected promise reports itself; one that
    // simply never settles does not, and that is what the first two headset
    // runs looked like from here — a session the user was standing in, with no
    // line saying which await had not come back.
    //
    // 🔴 BUT 6 s IS NOT A DEADLINE FOR A STEP THAT CAN ASK A HUMAN A QUESTION,
    // AND THAT COST A BLACK HEADSET. MEASURED on a Quest 3, 2026-09-13:
    // `requestSession immersive-vr` did not hang — it was waiting for the
    // owner to answer a ROOM-DATA PERMISSION PROMPT, which appeared because
    // this page asks for plane detection and hand tracking as optional
    // features. The deadline fired underneath it, the page declared failure and
    // tore its own entry path down, and THEN the session started: a headset
    // standing in an immersive session that no code owned, drawing nothing.
    // Black, and a restart to get out.
    //
    // So a step that can prompt gets a human's worth of time, and the failure
    // says what it is probably waiting for rather than "never returned".
    // Everything after the session is machinery and keeps the short one —
    // `makeXRCompatible` is not going to ask anybody anything.
    const step = async (what, p, ms = 6000) => {
      shipNow(`… ${what}`);
      const out = await Promise.race([p,
        new Promise((_, no) => setTimeout(() => no(new Error(
          `${what} did not answer in ${ms / 1000} s`
          + (ms > 6000 ? '. Is there a permission prompt waiting for you?' : ''))), ms))]);
      shipNow(`ok  ${what}`);
      return out;
    };
    try {
      // ⚠️ `local-floor` is REQUIRED, not optional: the room is authored in
      // metres from the floor, and on `local` the origin is wherever the head
      // happened to be, which puts a 0.3 m cube at eye height.
      // 🔴 `plane-detection` IS OPTIONAL AND IT MUST STAY OPTIONAL. Asking for
      // your real floor and walls is worth doing — in passthrough it is the
      // difference between a grid floating at the page's guess and a grid lying
      // on the floor you are standing on — but a headset whose owner has never
      // run Space Setup, or who says no to the permission, must still get a
      // room. In `requiredFeatures` this line would turn "I have not mapped my
      // house" into "this page refuses to start".
      // 🔴 90 s, BECAUSE THIS ONE ASKS YOU A QUESTION. See `step`.
      //
      // ⚠️ AND THE PROMISE IS KEPT, NOT ABANDONED. If the deadline wins, the
      // request is still in flight — and a session that arrives after the page
      // has given up is a headset in VR that nothing is drawing. It is caught
      // and ENDED, so the worst case is "it did not start" rather than a black
      // room and a restart.
      const ask = navigator.xr.requestSession(mode, {
          requiredFeatures: ['local-floor'],
          // ⚠️ `hand-tracking` IS OPTIONAL, for the same reason every room
          // feature is: in `requiredFeatures` a headset with hands switched
          // off would be refused a session entirely. Asking costs nothing and
          // the probe below reports what came back — including "nothing",
          // which is an answer.
          // 🔴 `tracked-sources` OR THE SECOND HAND SILENTLY DOES NOT EXIST.
          // A non-primary input goes into `session.trackedSources`, not
          // `inputSources`, and the spec says that array MUST only be
          // populated if this descriptor is granted — as must the
          // `trackedsourceschange` event that would otherwise have said so.
          // Ask for `hand-tracking` alone and one hand is simply absent, with
          // no error and no event: an array that reads exactly like a headset
          // holding one controller. Which is what the last run reported.
          optionalFeatures: [...ROOM_OPTIONAL_FEATURES, 'hand-tracking', 'tracked-sources'],
        });
      let gaveUp = false;
      ask.then((late) => {
        if (!gaveUp) return;
        shipNow('the session arrived after this page gave up waiting. Ending it rather than leaving you in a room nothing is drawing');
        try { late.end(); } catch { /* already gone */ }
      }, () => { /* a rejection is reported by the step below */ });
      try {
        session = await step(`requestSession ${mode}`, ask, 90000);
      } catch (e) { gaveUp = true; throw e; }
      // ⚠️ THE BLEND MODE, NOT THE SESSION NAME. A session can be called
      // `immersive-ar` and still composite opaque, and what "no surfaces"
      // means depends on which it actually is.
      room?.markAsked(session.environmentBlendMode === 'opaque');
      // 🔴 DID THE RUNTIME ACTUALLY GRANT IT? `no hand` on an input source is
      // ambiguous in the worst way: it means "hand tracking is off" and "you
      // were holding a controller" equally well, and those have completely
      // different next steps. `enabledFeatures` is the runtime answering for
      // itself. ⚠️ It is not on every implementation, so its ABSENCE is
      // reported as absence rather than as a refusal.
      shipNow(`features granted · ${session.enabledFeatures
        ? [...session.enabledFeatures].join(' ')
