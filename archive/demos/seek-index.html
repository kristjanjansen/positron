<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* No vertical margins in here: the gap between the picture, the cue row, the
     transport bar and the strip is `.pos-body > * + *` in shell.css, one rhythm
     for every page. */
  video { width: 100%; display: block; background: #000; border-radius: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(58px, 1fr)); gap: 4px; }
  /* `pre-line` because each chip is a name and a time on two lines, and a `\n`
     in a div is whitespace everywhere else — the two ran together on one line
     and wrapped wherever the column happened to end. */
  .cue {
    font: 500 10px/1.5 var(--mono); text-align: center; padding: 5px 2px;
    white-space: pre-line;
    border: 1px solid var(--line2); border-radius: 3px; color: var(--dim2);
  }
  .cue.past { color: var(--fg); border-color: var(--dim2); }
  .cue.hit  { color: #0b0e14; background: var(--hi); border-color: var(--hi); }
</style>
<script src="/proto/remixer/hls.min.js"></script>

<script type="module">
  import { mount, guard, el, armVideo, playOrPrompt } from '/shell/shell.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createStripView } from '/shell/strip.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { mediaMaster } from '/timeline/media-master.mjs';
  import { ARCHIVE, CUES, cueItems } from '/shell/archive.mjs';

  // Where the sweep jumps to, in ms. Named here because two controls and a log
  // line all quote it and none of them may drift from it.
  const STOPS = [100000, 20000, 165000, 5000, 130000];

  const d = mount({
    name: 'seek',
    what: 'Seek anywhere inside the same recording and exactly the cues that should '
      + 'already have happened have happened: none skipped, none arriving late in a '
      + 'rush. Press Load the recording, then ask at every cue boundary, then jump to '
      + 'five places and ask again. by now is how many cues the timeline says have '
      + 'passed where the playhead is standing, and wrong counts the answers that '
      + 'disagreed with counting them by hand.',
    // `lateBurst` left this row: it is a verdict that reads 0 on every working
    // run, the same shape as `wrong` beside it, and its assert already prints
    // the number with the words that make it mean something. `by now` took the
    // slot because it is the one figure here that moves while you watch — it
    // steps as the picture passes a cue and jumps when you seek.
    readout: { jumps: '', asked: '', 'by now': '', wrong: '' },
    controls: [
      { id: 'load', label: 'Load the recording', primary: true },
      // The numbers in these two labels are READ from what the page will
      // actually do, never typed beside it: a label that can disagree with the
      // run is worse than one with no number in it.
      { id: 'fold', label: `Ask "which cues by now?" at ${CUES.length * 3} points` },
      { id: 'sweep', label: `Jump to ${STOPS.length} places and re-ask` },
    ],
  });
  guard(d);

  const video = el('video', '', null, { playsinline: '', muted: '', preload: 'auto' });
  video.muted = true;
  d.el.append(video);

  const grid = el('div', 'grid');
  const cueEls = new Map();
  for (const c of CUES) {
    const b = el('div', 'cue', `${c.id.replace('CUE-', '')}\n${(c.offsetMs / 1000).toFixed(0)}s`);
    cueEls.set(c.id, b);
    grid.append(b);
  }
  d.el.append(grid);

  let seeks = 0, folds = 0, wrong = 0, retro = 0;
  const fired = [];

  const cueAdapter = {
    caps: { rates: [1], continuous: false, assertOnSeek: true },
    actuate(payload) {
      const mediaMs = video.currentTime * 1000;
      // A RETROACTIVE FIRE is the failure this demo exists to catch: a cue
      // actuating long after its own position, because a seek replayed the
      // backlog instead of folding it.
      const lateBy = mediaMs - payload.offsetMs;
      if (lateBy > 1500) retro++;
      fired.push({ id: payload.id, mediaMs, lateBy });
      cueEls.get(payload.id)?.classList.add('hit');
    },
      // reduceAt() hands us the PREFIX already (rows <= pos) and each row is the
      // PAYLOAD, not the event — so there is nothing to filter and no r.at to
      // filter on. Getting this wrong reads as "no cues at all".
    reduce(rows) {
      return { count: rows.length, last: rows.length ? rows[rows.length - 1].id : null };
    },
    assertState(state) { return state; },
  };

  const deck = createDeck({
    items: cueItems(),
    adapters: { cue: cueAdapter },
    range: [0, ARCHIVE.durationMs],
  });

  // ONE POSITION SURFACE. The strip below is a time axis that seeks on press
  // and on drag; the bar's slider is a second one at a different scale, and two
  // stacked is a contradiction rather than a redundancy. Play, pause, the clock
  // and the keyboard table stay.
  const tbar = createTransportBar(d.el, deck, { scrub: false });
  createStripView(d.el, deck, { size: 'default', lanes: [{
      id: 'cue', kind: 'cue', height: 44, as: 'ticks',
      // idToColor('cue') came out near-black on the dark ground, so the ticks
      // were there but invisible. latch + firedColor is built into the ticks
      // renderer: a cue turns green once the playhead has passed it.
      color: '#ffd400', width: 2.5, latch: true, firedColor: '#8fd6a8',
    }] });

  const expectedAt = (pos) => CUES.filter((c) => c.offsetMs <= pos).length;

  function paintPast() {
    const pos = deck.position();
    // The fold at wherever the playhead is standing, asked the same way the
    // buttons ask it. A readout cell rather than a line of words, because this
    // one changes on a clock.
    d.set('by now', expectedAt(pos));
    for (const c of CUES) cueEls.get(c.id)?.classList.toggle('past', c.offsetMs <= pos);
  }
  setInterval(paintPast, 200);

  let master = null, hls = null;

  // NATIVE HLS ONLY ON WEBKIT, gated on ManagedMediaSource. `canPlayType(
  // 'application/vnd.apple.mpegurl')` answers "maybe" in Chrome as well as
  // Safari, so the old `if (canPlayType(...))` put Chrome on the native path,
  // where `video.src = <m3u8>` sits at readyState 0 forever. Headless Chrome
  // answers "" and takes the hls.js branch, which is why the suite stayed green
  // over a page that was dead in the browser a human uses. Same rule as
  // src/low-latency-player.js.
  const NATIVE_HLS = 'ManagedMediaSource' in window
    && !!document.createElement('video').canPlayType('application/vnd.apple.mpegurl');

  d.on('load', async () => {
    if (master) return;
    armVideo(video);
    const url = ARCHIVE.hls;
    if (NATIVE_HLS) video.src = url;         // WebKit plays HLS natively
    else if (window.Hls?.isSupported()) {
      hls = new window.Hls({ enableWorker: true });
      hls.loadSource(url); hls.attachMedia(video);
      hls.on(window.Hls.Events.ERROR, (_e, x) => { if (x.fatal) d.log(`hls fatal ${x.details}`, 'bad'); });
    }
    master = mediaMaster(deck, video, { anchorMs: 0 });
    await playOrPrompt(video, d);
    d.log('loaded; media is the master');
  });

  // ── THE THESIS: the fold at an arbitrary position, without playing there ──
  d.on('fold', () => {
    for (const c of CUES) {
      for (const probe of [c.offsetMs - 1, c.offsetMs, c.offsetMs + 1]) {
        const st = deck.reduceAt ? deck.reduceAt('cue', probe) : null;
        folds++;
        const want = expectedAt(probe);
        const got = st && typeof st.count === 'number' ? st.count : null;
        if (got !== want) { wrong++; d.log(`at ${probe} ms the timeline said ${got}, counted by hand ${want}`, 'bad'); }
      }
    }
    d.set('asked', folds);
    d.set('wrong', wrong, wrong ? 'bad' : 'ok');
    d.assert('the count is exact either side of every cue', wrong === 0,
      `${folds} asked, ${wrong} wrong`);
  });

  d.on('sweep', async () => {
    if (!master) { d.log('load first', 'bad'); return; }
    for (const t of STOPS) {
      deck.seek(t);
      seeks++;
      d.set('jumps', seeks);
      await new Promise((r) => setTimeout(r, 700));
      const st = deck.reduceAt ? deck.reduceAt('cue', deck.position()) : null;
      const want = expectedAt(deck.position());
      const got = st?.count ?? null;
      if (got !== want) { wrong++; d.log(`after the jump to ${t / 1000} s the timeline said ${got}, counted by hand ${want}`, 'bad'); }
      d.log(`jumped to ${(t / 1000).toFixed(0)} s · picture at ${video.currentTime.toFixed(1)} s · ${got} of ${want} cues by then`);
    }
    d.set('wrong', wrong, wrong ? 'bad' : 'ok');
    d.assert('every jump lands on the right cue count', wrong === 0, `${seeks} jumps, ${wrong} wrong`);
    d.assert('no cue fires long after its own moment', retro === 0, `${retro} fired more than 1.5 s late`);
    // The checks read what this control just produced, so this is the first
    // moment they can be true — and a button for them would make them optional.
    await d.run('check');
  });

  d.on('check', async () => {
    // 🔴 THE LOOP, GRADED HERE BECAUSE THIS IS THE PAGE ABOUT GOING BACK. The
    // button lives in the shared bar, so every page with a transport gets it and
    // exactly one page has to prove it works. Driven through the BUTTON's own
    // handler rather than by setting the state, which is `floor`'s lesson: the
    // fault was in the index the click hands over, not in the playing.
    {
      const api = tbar.api;
      const [r0, r1] = deck.range;
      const before = api.loop;
      deck.seek(r0 + (r1 - r0) * 0.30);
      api.pressLoop();
      const armed = api.loopArmed && !api.loop;
      deck.seek(r0 + (r1 - r0) * 0.55);
      api.pressLoop();
      const made = api.loop;
      d.assert('one button marks a loop in two presses',
        before === null && armed && !!made && made[1] > made[0],
        made ? `start ${Math.round(made[0] - r0)} ms in, end ${Math.round(made[1] - r0)} ms in`
             : 'no loop was made');
      // 🔴 AND IT GOES BACK. A mark pair that never wraps is two numbers.
      // Jump past the end and let the paint loop see it.
      // ⚠️ POLLED WITH A CEILING, NOT SLEPT ON. `verify.mjs` stops collecting
      // 400 ms after the last assert, so a fixed wait long enough to be safe is
      // long enough to lose every assert after it. Waiting for the ANSWER
      // instead is both shorter in the normal case and bounded in the bad one.
      const until = async (fn, ms) => {
        const t0 = performance.now();
        while (performance.now() - t0 < ms) {
          if (fn()) return true;
          await new Promise((r) => setTimeout(r, 16));
        }
        return fn();
      };
      deck.seek(made[1] + 5);
      await until(() => deck.position() < made[1], 300);
      const back = deck.position();
      d.assert('...and the playhead comes back to the start when it passes the end',
        back <= made[1] && back >= made[0] - 5,
        `left at ${Math.round(made[1] + 5 - r0)} ms, found at ${Math.round(back - r0)} ms`);
      // 🔴 PROVE THE THIRD PRESS. A loop you cannot take off is a trap.
      api.pressLoop();
      deck.seek(made[1] + 5);
      await until(() => deck.position() > made[1] + 20, 300);
      d.assert('...and a third press takes it off, so the playhead runs on',
        api.loop === null && deck.position() > made[1],
        `loop ${api.loop === null ? 'cleared' : 'still set'}, `
        + `playhead at ${Math.round(deck.position() - r0)} ms of ${Math.round(r1 - r0)}`);
    }

    d.assert('the timeline can be asked at any position', typeof deck.reduceAt === 'function');
    d.assert('range is the show length', deck.durationMs === ARCHIVE.durationMs, `${deck.durationMs}`);
    d.assert('cue adapter declares assertOnSeek', cueAdapter.caps.assertOnSeek === true);
    d.assert('nothing has happened at the very start', (deck.reduceAt?.('cue', 0)?.count ?? 0) === 0);
    d.assert('past the end, all eight have happened',
      (deck.reduceAt?.('cue', ARCHIVE.durationMs)?.count ?? 0) === CUES.length,
      `${deck.reduceAt?.('cue', ARCHIVE.durationMs)?.count} / ${CUES.length}`);
  });

  d.log(`${CUES.length} cues · asked either side of every one of them`
    + ` · jumps to ${STOPS.map((t) => t / 1000).join(', ')} s`);
  d.ready();
</script>
</html>
