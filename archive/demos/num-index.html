<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* 🔴 THIS PAGE IS A WORKBENCH FOR ONE INTERACTION AND NOTHING ELSE. Asked
     2026-09-23: *"can make a separate tmp demo too get it right 'num'"*, after
     *"use numpad from evo: when i press a number the loop rec stars until i prss
     same number again it starts looping. third click stops, fourth plays again
     erc. dubleclick clrears"*.
     ⚠️ SO THERE IS NO AUDIO, NO ROLL AND NO CHORDS ON IT. What is being got
     right is a four state machine with ten instances and a timing window in it,
     and every one of those is easier to see with nothing else moving.
     ⚠️ AND THE PAD GRID IS `/evo/`'s, WHICH IS THE POINT OF BUILDING IT HERE:
     the same `createPadGrid` in the same three by four telephone layout, so what
     is learned here transfers to the panel without a second drawing. */
  .num-wrap { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
  .num-pad { display: flex; flex-direction: column; gap: 8px; }

  /* 🔴 ONE COLOUR PER STATE, AND THE STATE IS ON THE PAD RATHER THAN BESIDE IT.
     A looper is played by looking at your hands, so a legend in the corner is a
     legend nobody reads. `--rec` is this project's record ink and is the one
     control that starts writing; `--ok` is playing; a stopped slot keeps its
     edge and loses its fill, which says *there is something here and it is
     silent* rather than *there is nothing here*. */
  .num-pad .pos-pad[data-st="recording"] {
    background: color-mix(in srgb, var(--rec) 38%, var(--card));
    border-color: var(--rec);
  }
  /* 🔴 A LOOP THAT IS PLAYING HAS TO LOOK LIKE IT IS MOVING. Asked 2026-09-23:
     *"can you indicate lopping visually on num?"*. A green fill says *this one
     has something in it*, and so does the stopped state's edge; what it cannot
     say is *and it is running right now*, which is the one thing you need to
     see across ten keys while your hands are busy.
     ⚠️ IT IS A PULSE AND NOT A PLAYHEAD, AND THE DIFFERENCE IS HONESTY. This
     bench has no audio and no clock in it, so it does not know a loop's length
     or where it has got to, and a bar sweeping across the key would be inventing
     a position. A steady pulse claims only *running*, which is exactly what is
     known.
     ⚠️ AND IT MOVES NOTHING. `positron-ui` forbids an animation that changes how
     much room a thing takes, so this is opacity on a pseudo-element over the pad
     and never a size or a border width. It is off under reduced motion, where
     the fill still says the state. */
  .num-pad .pos-pad[data-st="looping"] {
    background: color-mix(in srgb, var(--ok) 30%, var(--card));
    border-color: var(--ok);
  }
  @keyframes num-breathe { 0%, 100% { opacity: 0; } 50% { opacity: .5; } }
  .num-pad .pos-pad[data-st="looping"]::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: var(--ok); opacity: 0;
    animation: num-breathe 1.4s ease-in-out infinite;
  }
  /* ⚠️ RECORDING PULSES TOO, FASTER AND IN THE RECORD INK, because *writing* and
     *playing* are both running and a player has to tell them apart at a glance.
     Same channel, different rate, which is one idea said twice rather than two
     ideas competing. */
  .num-pad .pos-pad[data-st="recording"]::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: var(--rec); opacity: 0;
    animation: num-breathe .7s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .num-pad .pos-pad[data-st="looping"]::after,
    .num-pad .pos-pad[data-st="recording"]::after { animation: none; }
  }
  .num-pad .pos-pad[data-st="stopped"] {
    background: var(--card); border-color: color-mix(in srgb, var(--ok) 55%, var(--line));
  }
  /* ⚠️ THE TOUCH LAMP IS NOT A STATE, which is why it is an outline and not a
     fill: it says *this page heard you* during the window where the transport
     has deliberately not decided yet. */
  .num-pad .pos-pad[data-touch] { outline: 1px solid var(--hi); outline-offset: -3px; }

  .num-side { display: flex; flex-direction: column; gap: 10px; min-width: 210px; }
  .num-line { font: 400 11.5px/1.6 var(--mono); color: var(--dim); }
  .num-line b { color: var(--fg); font-weight: 600; }
  .num-walk { font: 400 11px/1.7 var(--mono); color: var(--dim2); }
</style>
<script type="module">
  import { mount, el } from '/shell/shell.mjs';
  import { createPadGrid } from '/shell/pad.mjs';
  import { createNumLoop, NEXT } from '/shell/numloop.mjs';
  import { createMidi } from '/shell/midi.mjs';
  import { noteName } from '/shell/midi-decode.mjs';
  import { createPresenceButton, WIRED } from '/shell/presence.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';

  const ONE = 'ten numbers, each one a loop you record, play, stop and throw away with the same key';

  const d = mount({
    name: 'num',
    what: ONE,
    /**
     * ⚠️ FOUR CELLS, AND NONE OF THEM IS A CONSTANT. `live` and `empty` are a
     * census of what is on screen, `waiting` is the thing this page exists to
     * make visible, and `window` is the one number the whole feel turns on.
     * ⚠️ AND NOTHING PRINTS `0` BEFORE IT HAS HAPPENED. A census of a pad that
     * is visibly empty is a real reading; `waiting` starts blank because no
     * press has been judged yet.
     */
    readout: { live: '', empty: '', waiting: '', window: 'ms' },
  });

  /* 🔴 `/evo/`'s OWN LAYOUT, TYPED THE SAME WAY. A telephone keypad is `1 2 3`
     on top and `0` at the bottom between two others, and the commonest mistake
     available is drawing `0` first because that is where it sits in a loop. */
  const MINUS = '−';
  const KEYPAD = [['1', '2', '3'], ['4', '5', '6'], ['7', '8', '9'], [MINUS, '0', '+']];
  /** face -> slot, so ten keys drive ten machines and the two brackets drive none */
  const SLOT = new Map();
  KEYPAD.flat().filter((f) => /\d/.test(f)).forEach((f, i) => SLOT.set(f, i));

  const DOUBLE_MS = Number(new URLSearchParams(location.search).get('double')) || 250;

  const wrap = el('div', 'num-wrap');
  const padBox = el('div', 'num-pad');
  const side = el('div', 'num-side');

  const say = el('div', 'num-line');
  const walk = el('div', 'num-walk');
  walk.textContent = Object.entries(NEXT)
    .map(([from, to]) => `${from} → ${to}`).join('\n');
  walk.style.whiteSpace = 'pre';
  side.append(say, walk);

  const padOf = new Map();
  const grid = createPadGrid({
    cols: 3, rows: 4,
    pad: (x, y) => {
      const face = KEYPAD[y][x];
      const digit = /\d/.test(face);
      return {
        label: face, half: false, latch: false, disabled: !digit,
        tint: 'var(--fg)',
        aria: digit ? `loop ${face}` : `${face}`,
        title: digit
          ? `loop ${face}. Press to record, again to loop, again to stop, again to `
            + 'play. Press twice quickly to throw it away'
          : 'not a loop key on this bench',
      };
    },
    /* ⚠️ `(on, x, y, self)`, WHICH IS THE GRID'S ORDER AND NOT THE PAD'S. Getting
       it wrong reads `KEYPAD[undefined][undefined]` and throws on every press,
       which is what it did. */
    onPress: (on, x, y) => {
      const face = KEYPAD[y][x];
      if (!SLOT.has(face)) return;
      loop.press(SLOT.get(face));
    },
  });
  KEYPAD.forEach((row, y) => row.forEach((face, x) => {
    if (SLOT.has(face)) padOf.set(SLOT.get(face), grid.at(x, y));
  }));
  padBox.append(grid.el);
  wrap.append(padBox, side);
  d.stack.add(wrap);

  /* ⚠️ THE LAMP IS SET ON THE TOUCH AND THE FILL ON THE STATE, which is the
     whole of what `onTouch` is for: a page that painted only on `onEnter` would
     look dead for a quarter of a second on every press, and a page that painted
     the STATE on the touch would be lying about a transport that has not
     decided. */
  const paint = () => {
    for (const [i, pad] of padOf) {
      const st = loop.state(i);
      if (st === 'empty') delete pad.button.dataset.st; else pad.button.dataset.st = st;
      if (loop.pending(i)) pad.button.dataset.touch = '1';
      else delete pad.button.dataset.touch;
    }
    const states = loop.states();
    d.set('live', states.filter((s) => s === 'recording' || s === 'looping').length);
    d.set('empty', states.filter((s) => s === 'empty').length);
    d.set('waiting', states.map((_, i) => i).filter((i) => loop.pending(i)).length);
    d.set('window', DOUBLE_MS);
  };

  const loop = createNumLoop({
    doubleMs: DOUBLE_MS,
    onTouch: () => paint(),
    onEnter: (i, st, { was }) => {
      paint();
      const face = [...SLOT.entries()].find(([, s]) => s === i)?.[0] ?? String(i);
      say.innerHTML = `<b>${face}</b> went ${was} to ${st}`;
      d.log(`${face}: ${was} to ${st}`);
    },
  });
  paint();
  d.set('waiting', '');

  d.log(`press a number to record, the same number again to loop it, again to stop, `
      + `again to play. Press twice inside ${DOUBLE_MS} ms to throw it away. `
      + 'Open with ?double=120 to try a shorter window');

  /* 🔴 THE SAME TEN LOOPS FROM A REAL KEYBOARD, ASKED AS *"add midi on button to
     num"*. This bench is about how the interaction FEELS, and a mouse is not
     how anybody plays a looper: the window that decides a double press is the
     one number the whole thing turns on, and a trackpad and a pad on a
     controller do not double press at the same speed.
     ⚠️ TEN NOTES FROM THE BOTTOM OF WHATEVER IS PLUGGED IN, because nothing on
     the wire says which key is `1`. It is the first ten notes this page sees,
     in the order it first sees them, which is honest and is said in the log
     rather than presented as a mapping somebody chose.
     ⚠️ AND MIDI IS NEVER ASKED FOR ON A VISIT. `createPresenceButton` is a press,
     and the browser prompt belongs behind one. */
  const midiSlot = new Map();
  let midiSaid = false, padSaid = false;
  /* the raw monitor's own state. See `onAny` below. */
  let rawSeen = 0;
  const rawShapes = new Set();
  let midi = null;
  /* 🔴 BUILT INSIDE THE PRESS, NEVER AT LOAD. `createMidi` calls
     `requestMIDIAccess` in its own constructor, so building it here would put a
     browser permission prompt in front of somebody who has only opened a page.
     `CLAUDE.md`'s rule is that a visit opens nothing, and a prompt is the
     loudest thing a page can open. Checked in `midi.mjs` rather than assumed. */
  const startMidi = () => createMidi({
    /* 🔴 THE NUMBER PAD, NOT THE KEYS. Asked 2026-09-23: *"control 1 2 3 with evo
       1 2 3 numpads"*. The MK-425C's ten assignable buttons send a bank select
       pair and then a PROGRAM CHANGE, so program 1 is loop 1 and the mapping is
       the panel's own printing rather than an order this page invented. That is
       strictly better than the note order it replaced, which was honest and
       arbitrary: nothing on the wire says which KEY is which, and the numbers on
       the pad say exactly which BUTTON is which.
       ⚠️ AND PROGRAM 0 IS LOOP 10, because the pad's tenth button is `0` and the
       instrument was measured sending program 0 from it. */
    onProgram: (program) => {
      const slot = program === 0 ? 9 : program - 1;
      if (slot < 0 || slot >= loop.slots) return;
      if (!padSaid) {
        padSaid = true;
        d.log('the number pad on the keyboard is driving these loops: program 1 is '
            + 'loop 1, and the pad\u2019s 0 is loop 10');
      }
      loop.press(slot);
    },
    /* ⚠️ THE KEYS STILL WORK, and they are the fallback for anything with no
       number pad on it. The first ten notes become the ten loops in the order
       they first arrive, which is honest and arbitrary and says so. */
    onDown: (note) => {
      if (!midiSlot.has(note) && midiSlot.size < loop.slots) {
        midiSlot.set(note, midiSlot.size);
        d.log(`note ${note} is loop ${midiSlot.get(note) + 1}, taken in the order the `
            + 'keys first arrived, because nothing on the wire says which key is which');
      }
      if (midiSlot.has(note)) loop.press(midiSlot.get(note));
    },
    /* 🔴 EVERY MESSAGE IS PRINTED UNTIL SOMETHING IS RECOGNISED, BECAUSE
       *"there is no events when i press numpad"* and *"no events"* is the one
       report this page could not tell apart from a dead cable. The four kinds
       below are handled and everything else was dropped in silence, so a pad
       sending a shape nobody listens for reads exactly like nothing arriving.
       ⚠️ IT STOPS ON ITS OWN. The first 24 messages are printed in full, and
       after that only a SHAPE nobody has seen yet, so holding a key down or
       sweeping a knob cannot bury the answer. A monitor that floods the log is a
       monitor somebody switches off. */
    onAny: (data) => {
      const [st, a, b] = data;
      const kind = st & 0xf0;
      const shape = `${kind.toString(16)}:${data.length}`;
      if (rawSeen < 24 || !rawShapes.has(shape)) {
        rawShapes.add(shape);
        rawSeen++;
        const bytes = [...data].map((x) => x.toString(16).padStart(2, '0')).join(' ');
        const what = kind === 0x90 && b > 0 ? `note ${a} on, which is ${noteName(a)}`
          : kind === 0x80 || kind === 0x90 ? `note ${a} off, which is ${noteName(a)}`
          : kind === 0xb0 ? `controller ${a} at ${b}`
          : kind === 0xc0 ? `program ${a}, which this page reads as a pad button`
          : kind === 0xe0 ? 'pitch bend'
          : kind === 0xa0 || kind === 0xd0 ? 'aftertouch'
          : st === 0xf0 ? 'a system exclusive message, which this page ignores'
          : 'a kind this page does not listen for';
        d.log(`${bytes}   ${what}`);
        if (rawSeen === 24) d.log('that is the first 24 messages. Only new shapes from here');
      }
    },
    log: d.log,
    onPorts: (n) => {
      if (midiSaid) return;
      midiSaid = true;
      d.log(n ? `${n} MIDI input${n === 1 ? '' : 's'} to listen to. The first ten keys `
              + 'you play become the ten loops'
            : 'no MIDI keyboard is plugged in, and the numbers on screen still work');
    },
  });
  const pres = createPresenceButton({
    of: 'a keyboard', state: 'unknown', says: WIRED,
    can: ['unknown', 'checking', 'online', 'offline'],
    press: () => d.run('listen'),
  });
  d.controls.hidden = false;
  d.controls.append(pres.el);
  d.on('listen', async () => {
    pres.set('checking');
    if (!midi) midi = startMidi();
    /* ⚠️ ONLINE MEANS PORTS, NOT PERMISSION. Granting MIDI and having something
       plugged in are two facts, and reporting the first as the second says
       `online` about an empty room. `/evo/` records the same distinction. */
    await new Promise((r) => setTimeout(r, 400));
    pres.set(midi.ports() > 0 ? 'online' : 'offline');
  });

  /* ── what only this page can say ─────────────────────────────────────── */
  ifSelfcheck();

  function ifSelfcheck() {
    if (!SELFCHECK) { d.ready(); return; }
    run().then(() => d.ready());
  }

  async function run() {
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const hit = (face) => padOf.get(SLOT.get(face)).button.click();
    const stOf = (face) => padOf.get(SLOT.get(face)).button.dataset.st || 'empty';

    /* 🔴 THE PAD IS PRESSED RATHER THAN THE MACHINE CALLED, which is the only
       way this page can fail differently from `numloop-test.mjs`. That file
       already grades the arithmetic with no browser; what is left for a page to
       say is that the pads are wired to it at all and that the drawing follows. */
    d.assert('the ten digits drive ten loops and the two brackets drive none',
      padOf.size === 10 && SLOT.size === 10
        && grid.el.querySelectorAll('.pos-pad').length === 12,
      `${padOf.size} loop keys of ${grid.el.querySelectorAll('.pos-pad').length} pads`);

    hit('1');
    const lamp = padOf.get(SLOT.get('1')).button.dataset.touch;
    d.assert('a press lights the key at once, before the transport has decided',
      lamp === '1' && stOf('1') === 'empty',
      `the lamp is ${lamp ? 'on' : 'off'} and the state is still ${stOf('1')}`);

    await sleep(DOUBLE_MS + 120);
    d.assert('and the transport commits once the double press window has passed',
      stOf('1') === 'recording' && !padOf.get(SLOT.get('1')).button.dataset.touch,
      `key 1 reads ${stOf('1')}`);

    hit('1'); await sleep(DOUBLE_MS + 120);
    const looping = stOf('1');
    hit('1'); await sleep(DOUBLE_MS + 120);
    const stopped = stOf('1');
    hit('1'); await sleep(DOUBLE_MS + 120);
    d.assert('the same key walks record, loop, stop and play again',
      looping === 'looping' && stopped === 'stopped' && stOf('1') === 'looping',
      `${looping}, then ${stopped}, then ${stOf('1')}`);

    /* 🔴 THE TRAP, DRIVEN THROUGH THE PAD. Two clicks inside the window must
       clear and must not walk the machine on the way, and the page is where a
       `click` really fires twice. */
    /* 🔴 AND A DOUBLE PRESS ON AN EMPTY KEY CLEARS THE STAGE AND RECORDS, which
       reversed on 2026-09-23: *"when doubleclick on empty slot, it stops others
       possible loops playing and starts rec"*. On a key with something in it a
       double press still throws it away; on a blank one there was nothing to
       throw, so the gesture did nothing at all. */
    const oneWas = stOf('1');
    hit('2'); hit('2');
    await sleep(DOUBLE_MS + 120);
    d.assert('a double press on an empty key stops the running loops and records',
      stOf('2') === 'recording' && oneWas === 'looping' && stOf('1') === 'stopped',
      `key 2 reads ${stOf('2')}, and key 1 went ${oneWas} to ${stOf('1')}`);
    hit('1'); await sleep(DOUBLE_MS + 120);
    d.assert('NEGATIVE CONTROL: the stopped loop is still there, one press from playing',
      stOf('1') === 'looping', `key 1 reads ${stOf('1')}`);

    hit('3'); await sleep(DOUBLE_MS + 120);
    hit('3'); await sleep(DOUBLE_MS + 120);
    const before = stOf('3');
    hit('3'); hit('3'); await sleep(DOUBLE_MS + 120);
    d.assert('and two quick presses on a running loop empty it',
      before === 'looping' && stOf('3') === 'empty',
      `${before} then ${stOf('3')}`);

    /* ⚠️ THE NEGATIVE HALF, and it is what makes this a looper rather than a
       transport: ten machines that do not know about each other. */
    /* ⚠️ THE NUMBERS MOVED WITH THE NEW DOUBLE PRESS, because key 2 now holds a
       recording rather than being empty. The claim is unchanged: pressing 4
       leaves 1 and 2 exactly where they were. */
    const oneBefore = stOf('1'), twoBefore = stOf('2');
    hit('4'); await sleep(DOUBLE_MS + 120);
    d.assert('NEGATIVE CONTROL: one number does not touch another',
      stOf('4') === 'recording' && stOf('1') === oneBefore && stOf('2') === twoBefore,
      `4 ${stOf('4')}, 1 ${stOf('1')} was ${oneBefore}, 2 ${stOf('2')} was ${twoBefore}`);

    d.assert('the readout counts what is on the pad rather than what was pressed',
      Number(d.api.readout.live) + Number(d.api.readout.empty) === 10
        && Number(d.api.readout.live)
           === loop.states().filter((s) => s === 'recording' || s === 'looping').length,
      `${d.api.readout.live} live and ${d.api.readout.empty} empty of 10`);

    /* 🔴 AND THE COST IS MEASURED RATHER THAN DESCRIBED. Every single press is
       late by the window, because the machine cannot know a press was single
       until it has passed. This is the number to argue with. */
    const t0 = performance.now();
    hit('5');
    await new Promise((r) => {
      const check = () => (stOf('5') !== 'empty' ? r() : setTimeout(check, 5));
      check();
    });
    const late = performance.now() - t0;
    /* 🔴 A RUNNING LOOP LOOKS LIKE IT IS RUNNING, asked as *"can you indicate
       lopping visually on num?"*. MEASURED AS AN ANIMATION ON THE PAD rather
       than as a class, because a class says the page asked and an animation is
       what a reader sees. ⚠️ AND THE TWO RATES ARE THE CLAIM: recording and
       looping are both running and must be told apart at a glance. */
    {
      const pad1 = padOf.get(SLOT.get('1')).button;
      const loopAnim = getComputedStyle(pad1, '::after').animationName;
      const loopRate = getComputedStyle(pad1, '::after').animationDuration;
      hit('6'); await sleep(DOUBLE_MS + 120);
      const pad6 = padOf.get(SLOT.get('6')).button;
      const recRate = getComputedStyle(pad6, '::after').animationDuration;
      d.assert('a playing loop pulses, and a recording one pulses faster',
        stOf('1') === 'looping' && stOf('6') === 'recording'
          && loopAnim === 'num-breathe' && loopRate !== recRate
          && parseFloat(recRate) < parseFloat(loopRate),
        `looping runs ${loopAnim} at ${loopRate} and recording at ${recRate}`);
    }

    d.assert('a single press costs the double press window before it takes effect',
      late >= DOUBLE_MS && late < DOUBLE_MS + 200,
      `${late.toFixed(0)} ms from the click to the state, against a ${DOUBLE_MS} ms window`);
  }
</script>
</html>
