<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">

<script type="module">
  import { mount, guard } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createStripView } from '/shell/strip.mjs';
  import { createGlue } from '/shell/glue.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { markAdapter, marks } from '/shell/fixture.mjs';

  const DURATION = 20000;

  const d = mount({
    name: 'transport',
    what: 'Twenty things are set to happen, one a second. Timers are set only a '
      + 'fraction of a second ahead and can still be cancelled, so pause really '
      + 'stops and dragging really skips; green arrived as expected, amber to '
      + 'red is late.',
    readout: { typical: 'ms', worst: 'ms', fires: '', pos: 'ms' },
    // the numbers live under the lane they describe, in the strip's gutter;
    // this row would repeat them somewhere with less context. Still published
    // for CDP.
    showReadout: false,
    controls: [],
  });
  guard(d);

  // Handed to createDeck below AND printed in the HOW line, from these same
  // constants — so the page cannot describe a setting it does not use.
  const TICK = 25, HORIZON = 100, GRACE = 150;

  const { fired, adapter } = markAdapter();
  const deck = createDeck({
    items: marks(20, DURATION),
    adapters: { mark: adapter },
    range: [0, DURATION],
    tickMs: TICK, horizonMs: HORIZON, lateGraceMs: GRACE,
    // onDrift hands us (newRows, allRows). It is an ARRAY of per-event rows —
    // reading it as a scalar is how this readout used to print a confident 0
    // while holding twenty real measurements.
    onDrift: (_rows, all) => report(all),
  });

  // id -> its measured row, so the strip can colour each mark by how late it
  // actually was and say so on hover.
  const measured = new Map();

  // LATE AGAINST WHAT? The first version of this scale used one absolute
  // threshold (5 ms) and painted eighteen of twenty marks amber on a busy
  // machine, which says "this is going badly" about a run that was working —
  // and the project's own lab measures the shipped worker host at p50 5.0 ms,
  // so an absolute 5 ms scale paints the DOCUMENTED BASELINE amber. A scale
  // whose normal reading is a warning has no warning left to give.
  //
  // So each mark is judged against what its own way of firing promises: a
  // committed timer is aiming at the instant and lands within a few ms; a mark
  // the sweep caught was never given a timer at all and can be anywhere inside
  // the check interval — being in there is the mechanism WORKING.
  const budgetFor = (m) => (m.origin === 'tick-late' ? TICK : 5);
  const BANDS = [
    [1, '#8fd6a8', 'as expected'],
    [2, '#ffd400', 'over'],
    [4, '#e0b060', 'well over'],
    [Infinity, '#e0908a', 'far over'],
  ];
  const bandFor = (m) => {
    const over = Math.abs(m.deltaMs) / budgetFor(m);
    return BANDS.find(([lim]) => over < lim);
  };

  /** `typical` is the median (half the marks came in under it) and `worst` is
   *  the largest, because a typical value alone
   *  hides the one bad fire that is the whole reason to look. The count of
   *  marks the sweep caught used to sit here and was dropped: it is
   *  structurally 1 — the mark due at position 0 cannot have a timer, since
   *  play had not been pressed when the timers were set — so it read as a
   *  measurement while being a constant. It is in the strip instead, as the
   *  thicker bar. Both live; nothing here is behind a button. */
  function report(rows) {
    for (const r of rows) measured.set(r.id, r);
    const xs = rows.map((r) => r.deltaMs).filter(Number.isFinite).sort((a, b) => a - b);
    if (!xs.length) return;
    const typical = xs[xs.length >> 1], worst = xs[xs.length - 1];
    d.set('typical', typical);
    d.set('worst', worst);
    // under the lane, beside its own ink — same treatment as 02
    const L = view.strip.lanes()[0];
    if (L) {
      L.subLabel = [`typical +${typical.toFixed(2)} ms`, `worst +${worst.toFixed(2)} ms`];
      view.strip.invalidate();
    }
    // Assert on the FIRST row, not a comfortable sample: verify.mjs plays for
    // 500 ms, which is one mark. A threshold of 5 read as "asserted nothing".
    if (!asserted && xs.length >= 1) {
      asserted = true;
      d.assert('every mark reports a real lateness', xs.every(Number.isFinite), `n=${xs.length} typical=${xs[xs.length >> 1]}`);
      d.assert('fire count <= item count', fired.length <= 20, `${fired.length}/20`);
      // 🔴 THE REPORTED JUMP, GRADED AGAINST THE PICTURE. Two frames, because
      // `invalidate()` schedules a draw rather than making one, and reading the
      // canvas in the same turn would measure the frame before the numbers.
      // Both readings come from the same function for the same reason a lane
      // may only be coloured by evidence it produced.
      if (SELFCHECK) requestAnimationFrame(() => requestAnimationFrame(() => {
        const after = gutterTop();
        d.assert('the lane does not move when the numbers arrive',
          topAtRest !== null && after !== null && Math.abs(after - topAtRest) <= 1,
          `top ${topAtRest} px before, ${after} px after (51 then 22 when this was reported)`);
      }));
    }
  }
  let asserted = false;


  // No slider: the strip below IS the position surface. Click or drag it.
  const bar = createTransportBar(d.el, deck, { scrub: false });
  // Grey until the playhead reaches it, yellow after — `latch` recolours from
  // the position every frame, so rewinding un-fires them. Without a colour the
  // lane falls back to a hash of the kind name, which lands wherever it lands
  // and here landed somewhere you cannot see.
  const view = createStripView(d.el, deck, {
    size: 'auto',
    gutter: 132,
    // follow:false — the strip auto-scrolls to keep the playhead at 82% of the
    // width, which slides its axis out from under the bar above it and leaves
    // the two disagreeing about where a second is. A bounded piece has nowhere
    // to run to, so it holds the whole range instead.
    follow: false,
    lanes: [{
      // NO `latch`. It recolours from the PLAYHEAD, so scrubbing back turned
      // measured marks grey again — as if moving the cursor un-measured them.
      // A mark's colour is a fact about what was observed, and navigation is
      // not an observation. Colour comes from the measurement map instead, so
      // the picture only ever changes when something new is measured.
      id: 'mark', kind: 'mark', label: 'marks', height: 72, width: 2,
      color: '#6a7280',
      /**
       * 🔴 THE LANE HAS A LINE UNDER ITS NAME FROM THE FIRST FRAME, AND THAT IS
       * WHAT STOPS IT JUMPING. Reported 2026-09-25 with two screenshots as
       * *"lane is jumping position when start playing"*.
       *
       * MEASURED before the line existed, headless Chrome at 1280 px, the ink
       * inside the gutter: the name and its swatch occupied y 51 to 60 before
       * play and y 22 to 54 after the first measurement landed. A jump of 29
       * pixels, up, the moment `report()` wrote its two numbers.
       *
       * ⚠️ AND IT IS NOT THE GUTTER GETTING WIDER, WHICH IS WHAT IT LOOKS LIKE.
       * MEASURED in the same run: `readout().gutter` is 132 before and 132
       * after, and the canvas does not move, so the plot beside it is exactly
       * where it was. This page declares `gutter: 132` and the widest line it
       * writes is `typical +1.20 ms` at 96.33 px, which needs 124.33 with the
       * strip's own inset and padding. Only a lateness of 100 ms or more would
       * push past 132.
       *
       * WHAT MOVES IS THE LABEL BLOCK. `timeline/strip.mjs` draws a lane with
       * no lines under its name centred on its own swatch, which was asked for
       * and is right for a lane that will never have any. A lane that gains
       * them while somebody is looking gets both arrangements, one after the
       * other. So the lane says what it knows from the first frame and the
       * numbers replace that sentence in place.
       */
      subLabel: 'no marks measured yet',
      terse: true,        // no id/kind/attested lines: nothing here is restored
      colorOfRow: (r) => {
        const m = measured.get(r.id);
        return m ? bandFor(m)[1] : '#3b424e';          // grey: no measurement yet
      },
      // Two short lines. A tooltip sits ON TOP of the thing it describes and is
      // read every time you point at one; the sentences belong in the `how`
      // block above, which is read once.
      describeRow: (r) => {
        const m = measured.get(r.id);
        if (!m) return 'not played yet';   // no measurement, not "behind the playhead"
        const [, , verdict] = bandFor(m);
        // Three short lines, not two with joins in them. A middot lets a line
        // bolt a third fact on instead of ending, which is the habit the em
        // dash rule is about wearing a different character.
        return [
          `${Math.abs(m.deltaMs).toFixed(2)} ms ${m.deltaMs < 0 ? 'early' : 'late'}`,
          verdict,
          m.origin === 'tick-late' ? `no timer, the ${TICK} ms check caught it` : 'timer set ahead',
        ];
      },
      // NO WIDTH CHANNEL. A thicker bar marked "no timer was set", which is
      // structurally always the first mark — the one due at position 0 cannot
      // have a timer, because play had not been pressed when the timers were
      // set. So it was a permanent oddity that raised a question the picture
      // never answered, the same defect as the `missed` cell it replaced. The
      // fact survives where it is actually asked for: the tooltip.
    }],
  });

  /**
   * 🔴 THE BAR AND THE STRIP ARE ONE SURFACE. Asked 2026-09-25: *"timeline
   * demos: glue transport and timelines"*. The bar already passes
   * `scrub: false` BECAUSE the strip below it is this page's position surface,
   * so the two have been one control since the page was written with the page
   * rhythm drawing ground through the middle of it.
   *
   * ⚠️ `createTransportBar(d.el, ...)` APPENDED THE BAR TO `d.el` ALREADY, and
   * the first argument is a mount point rather than a hint. `createGlue`
   * re-parents both, so this moves two existing children rather than making a
   * third copy of either.
   * ⚠️ THE ANCHOR IS READ BEFORE THE GLUE, never after, because a node captured
   * afterwards points at something that is no longer in the page. `null` is an
   * append, which is what a pair at the end of the page wants.
   */
  const afterStrip = view.surface.nextSibling;
  d.el.insertBefore(createGlue(bar.el, view.surface), afterStrip);

  // 🔴 ONE BAR AND ONE STRIP, COUNTED FROM THE DOM RATHER THAN LOOKED AT.
  // `/stage/` carried a DOUBLED transport bar through two reports in 2026-09-25,
  // because `createTransportBar(parent, ...)` appends to the parent it is given:
  // deleting the `createGlue` line removed nothing, and a screenshot cannot tell
  // one bar from two when they are stacked. A count can.
  d.assert('one bar and one strip, and they are one surface',
    d.el.querySelectorAll('.tbar').length === 1
      && d.el.querySelectorAll('canvas.pos-strip').length === 1
      && bar.el.parentElement === view.surface.parentElement
      && !!bar.el.parentElement?.classList.contains('pos-glue'),
    `${d.el.querySelectorAll('.tbar').length} bar(s), `
    + `${d.el.querySelectorAll('canvas.pos-strip').length} strip(s), `
    + `in .${bar.el.parentElement?.className}`);

  /**
   * WHERE THE LANE'S LABEL BLOCK SITS, in canvas pixels, read off the picture
   * rather than reasoned about. A layout claim on this site is a measurement:
   * the gutter is filled flat before anything is drawn on it, so the first row
   * holding a pixel that is not that fill is the top of the name and its
   * swatch.
   */
  function gutterTop() {
    const cv = view.el;
    const box = cv.getBoundingClientRect();
    if (!box.width || !cv.width) return null;
    const g = Math.max(1, Math.round(view.strip.readout().gutter * (cv.width / box.width)));
    const im = cv.getContext('2d').getImageData(0, 0, g, cv.height).data;
    const ground = [im[0], im[1], im[2]];
    for (let y = 0; y < cv.height; y++) {
      for (let x = 0; x < g; x++) {
        const i = (y * g + x) * 4;
        if (Math.abs(im[i] - ground[0]) + Math.abs(im[i + 1] - ground[1])
            + Math.abs(im[i + 2] - ground[2]) >= 24) return y;
      }
    }
    return null;
  }
  /**
   * The at-rest reading, kept fresh until the first mark is measured, so it is
   * the last picture that existed while the lane had nothing to say rather than
   * a guess about which frame that was.
   * ⚠️ BEHIND THE GATE. Reading the canvas back every frame is real work and no
   * visitor asked for it, and this project's standing rule is that a self-check
   * never runs for a visitor.
   */
  let topAtRest = null;
  if (SELFCHECK) (function sampleAtRest() {
    if (measured.size) return;                    // something has landed; stop looking
    const t = gutterTop();
    if (t !== null) topAtRest = t;
    requestAnimationFrame(sampleAtRest);
  })();

  setInterval(() => {
    d.set('pos', deck.position());
    d.set('fires', fired.length);
  }, 100);

  d.log(`${DURATION / 1000}s, 20 marks, speeds ${adapter.caps.rates.join('/')}x`);
  d.ready();
</script>
</html>
