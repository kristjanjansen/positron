<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">

<script type="module">
  // NO transport bar here on purpose: space is the loop pedal, and the shell's
  // transport table binds space to play/pause. One key, one meaning.
  import { mount, guard } from '/shell/shell.mjs';
  import { createStripView } from '/shell/strip.mjs';
  import { createKeyboard } from '/shell/keyboard.mjs';
  import { workerTickHost } from '/timeline/transport.mjs';
  import { createLooper, stats, phaseErrors } from '/proto/looper/looper.mjs';
  import { createVoices } from '/proto/looper/synth.mjs';

  // WebAudio only. No MIDI, no Web MIDI permission, no hardware — `instrument`
  // is where MIDI lives.
  const d = mount({
    name: 'looper',
    what: 'A keyboard into a synthesiser made of WebAudio, with a loop pedal on '
        + 'it. Press Start audio, play the letter keys, then tap space once to '
        + 'start recording and again to close the loop. What you played in '
        + 'between then repeats while you play over it. Latency is how late this '
        + 'browser says its own audio is, and off is how far from the beat the '
        + 'notes coming back round actually landed.',
    readout: { latency: 'ms', layers: '', notes: '', off: 'ms' },
    controls: [
      { id: 'boot', label: 'Start audio', primary: true },
      { id: 'pedal', label: 'Rec / commit' },
      { id: 'demo', label: 'Record a loop for me' },
    ],
  });
  guard(d);

  let ctx = null, ear = null, voices = null, looper = null, view = null;
  const onsets = [];
  const HI = getComputedStyle(document.documentElement).getPropertyValue('--hi').trim() || '#ffd400';

  // ── keys ────────────────────────────────────────────────────────────────
  // THE SHARED KEYBOARD (demo/shell/keyboard.mjs). This page carried its own
  // until today — the same thirteen keys at a different height, with the
  // letter where the note name should be, no octave pad and no `notes off`,
  // styled by a block that shadowed the component's own `.k` rules.
  //
  // 🔴 AND THE ONE THING THAT KEPT IT: `onDown(note, how)` does not hand over
  // the EVENT, and this looper measures `stampSkewMs` — the distance between
  // the hardware timestamp the browser put on the input event and the moment
  // the handler ran. Taking `performance.now()` in the handler instead would
  // make that distance exactly 0, which is a fabricated measurement rather
  // than a missing one. So the stamp is caught on the way past, in the CAPTURE
  // phase on `window`: a capture listener on an ancestor runs before any
  // listener on the target, so `lastStamp` is always the event that caused the
  // `onDown` about to arrive. The check below grades it — a stale or missing
  // stamp shows up as a skew that is negative or tens of milliseconds wide.
  //
  // One extra argument on the component's `onDown`/`onUp` deletes all of this.
  let lastStamp = null;
  const stamp = (e) => {
    lastStamp = (e && Number.isFinite(e.timeStamp) && e.timeStamp > 0) ? e.timeStamp : performance.now();
  };
  for (const type of ['pointerdown', 'pointerup', 'pointercancel', 'keydown', 'keyup']) {
    addEventListener(type, stamp, true);
  }

  const kb = createKeyboard(d.el, {
    base: 60,
    onDown: (note) => { kb.lightNote(note, true); capture('note-on', note); },
    onUp: (note) => { kb.lightNote(note, false); capture('note-off', note); },
    onOctave: (base) => d.log(`octave moved · the leftmost key is note ${base}`),
  });

  function capture(type, note) {
    if (!looper) return;
    const handlerAt = performance.now();
    looper.capture({ at: lastStamp ?? handlerAt, handlerAt, type, note,
                     vel: type === 'note-on' ? 100 : undefined,
                     source: 'kbd', layer: looper.layers.length });
  }

  addEventListener('keydown', (e) => {
    if (e.repeat || e.key !== ' ') return;
    e.preventDefault();
    pedal();
  });

  // ── boot ────────────────────────────────────────────────────────────────
  async function boot() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    await ctx.resume();
    // fetched by URL at runtime, so nothing static would flag its absence and
    // the failure mode is an ear that silently hears nothing
    await ctx.audioWorklet.addModule('/proto/looper/onset-worklet.js');
    ear = new AudioWorkletNode(ctx, 'onset-detect');
    ear.connect(ctx.destination);            // must be connected or it is not pulled

    voices = createVoices(ctx, { dest: ear, onOnset: (r) => onsets.push(r) });
    const clock = { domain: 'wall', now: () => performance.now() };
    looper = createLooper({ clock, newHost: () => workerTickHost(), voices, ctx,
                            toleranceMs: 5, onLayer: showLayers });
    looper.start(clock.now());
    meters();
    d.log(`audio ${ctx.state} · out ${((ctx.outputLatency || ctx.baseLatency || 0) * 1000).toFixed(1)} ms`);
    window.__L = { looper, voices, ctx, onsets };
  }

  // ── the line ────────────────────────────────────────────────────────────
  // 🔴 IT WAS POINTED AT A DECK THAT CAN NEVER HOLD A NOTE. `looper.parent` is
  // described in looper.mjs as "a bare deck: it holds no items, it only carries
  // position" — so a `note` lane over it was empty on every load and always
  // would be, inside a 44 px box fitted to that deck's ONE-HOUR range. An empty
  // lane reads as a component that failed rather than as one with nothing to
  // say. The notes live on the child deck a committed layer owns, so that is
  // what this draws, and it is rebuilt when a new layer takes over.
  function showLayers() {
    if (!looper) return;
    const n = looper.layers.length;
    d.set('layers', n || '');          // never 0: nothing recorded yet is nothing
    const layer = looper.layers[n - 1];
    if (!layer) return;
    view?.destroy();
    view = createStripView(d.el, layer.deck, {
      size: 'auto', follow: false,
      // the component draws its own window width in the top-left corner, which
      // here sat on top of the first axis label. The window IS the loop and
      // never changes, so there is nothing for it to report.
      zoomReadout: false,
      lanes: [{ id: 'note', kind: 'note', label: `loop ${n - 1}`, height: 30, as: 'ticks',
                width: 2, color: HI,
                // NOTE-ONS ONLY. Every note is two rows, and a mark for the
                // release would carry the same letter a few pixels later — the
                // same key drawn twice, and a `glyphState` that counts marks
                // with nothing to say alongside ones that ran out of room.
                filter: (r) => !r.payload?.off,
                // WHICH KEY, DRAWN ON THE MARK, wherever the zoom has left room
                // for it. A comb of identical ticks says when you played and
                // never what. `keyOf` is asked of the keyboard rather than kept
                // in a second table here, so moving the octave moves both.
                glyphOf: (r) => kb.keyOf(r.payload?.note) || '' }],
    });
    view.strip.fit(0, layer.loopMs);
    gutter();
    d.log(`loop ${n - 1} · ${layer.items.length} notes in ${Math.round(layer.loopMs)} ms`, 'hi');
  }

  /** The loop's own number beside its own ink, not in a table somewhere else.
   *  ⚠️ SIX CHARACTERS, MEASURED. `0.40 s round` came back as `0.40 s rou…`:
   *  the component sizes the gutter from `GUT_SUB_X + text` and then clips the
   *  line against `GUT_LABEL_X + 8`, which is 5 px narrower — so a sub-label
   *  cut to exactly the width that was measured for it still ellipsizes. */
  function gutter() {
    const layer = looper?.layers.at(-1);
    if (!view || !layer) return;
    view.strip.lanes()[0].subLabel = [`${(layer.loopMs / 1000).toFixed(2)} s`];
    view.strip.invalidate();
  }

  // armRecord / commitLayer, exactly as proto/looper/index.html drives it
  function pedal() {
    if (!looper) { d.log('press Start audio first', 'bad'); return; }
    const at = performance.now();
    if (!looper.recording()) {
      looper.armRecord(at);
      d.log(looper.layers.length === 0 ? 'recording · this pass sets the length' : 'overdubbing', 'hi');
    } else if (!looper.commitLayer(at)) {
      d.log('nothing was played in that pass', 'bad');
    }
    showLayers();
  }

  d.on('boot', () => boot().catch((e) => d.fail(e)));
  d.on('pedal', pedal);

  // A whole gesture in one press, for a visitor with no keyboard to hand and
  // for the suite — which presses each control once, 650 ms apart, and would
  // otherwise never close a loop and never draw anything. Arm, four notes,
  // commit, inside 400 ms.
  d.on('demo', async () => {
    await boot().catch((e) => d.fail(e));
    if (!looper) return;
    if (!looper.recording()) pedal();
    const seq = ['a', 'd', 'f', 'h'];
    for (let i = 0; i < seq.length; i++) {
      setTimeout(() => {
        // through the keyboard, so the keys light and the capture path is the
        // one a finger takes. `lastStamp` is set here because no input event
        // caused these — leaving the previous press's stamp would be the exact
        // stale reading the check below exists to catch.
        lastStamp = performance.now();
        kb.press(seq[i], 'key');
        setTimeout(() => { lastStamp = performance.now(); kb.release(seq[i], 'key'); }, 80);
      }, i * 100);
    }
    // ⚠️ THE NOTES ARE ON TIMERS, so this handler is not finished when it
    // returns — it is finished when the last of them has been played and the
    // pedal has closed the loop. Running the checks a line after scheduling
    // them graded a looper that had recorded nothing, four asserts deep, which
    // is worse than no check at all. Wait for the work this control started.
    await new Promise((resolve) => {
      setTimeout(() => { if (looper.recording()) pedal(); resolve(); }, 560);
    });
    // The checks read what this control just produced, so this is the first
    // moment they can be true — and a button for them would make them optional.
    await d.run('check');
  });

  d.on('check', () => {
    d.assert('audio context running', !!ctx && ctx.state === 'running', ctx?.state ?? 'none');
    d.assert('WebAudio voices', !!voices);
    const heard = onsets.length;
    d.set('notes', heard || '');
    d.assert('synth produced onsets', heard > 0, String(heard));

    // THE STAMP THE SHARED KEYBOARD DOES NOT PASS ON, graded rather than
    // trusted. Every captured row keeps both times; the handler cannot run
    // before the event, and a stale stamp would show up here as a negative or
    // an absurd skew.
    const skews = (looper?.trace ?? []).map((r) => r.stampSkewMs).filter(Number.isFinite);
    const worst = skews.length ? Math.max(...skews) : null;
    // ⚠️ `worst > 0` IS THE WHOLE ASSERT. Every other shape of this check
    // passes when the stamp is fabricated: taking `performance.now()` in the
    // handler and calling it the event time makes every skew exactly 0, which
    // is >= 0 and under any ceiling. A real hardware stamp is always a little
    // before the handler that reads it, so the gap is the evidence.
    d.assert('every key press keeps the browser\'s own timestamp, not the handler\'s',
      skews.length > 0 && worst > 0 && skews.every((s) => s >= 0) && worst < 250,
      skews.length ? `${skews.length} presses · the handler ran ${worst.toFixed(2)} ms `
                   + 'after the event at worst, 0 would mean it was never asked'
                   : 'nothing captured');

    const layer = looper?.layers.at(-1);
    d.assert('the pedal turned what was played into a loop', !!layer,
      layer ? `loop ${layer.index} · ${layer.items.length} notes in ${Math.round(layer.loopMs)} ms`
            : 'no loop · press Rec / commit twice around some notes');
    // A LANE THAT DREW NOTHING IS THE DEFECT THIS PAGE CARRIED FOR A WEEK, and
    // it never went red because nothing asked the picture a question.
    const ink = view ? view.strip.inkOf('note') : 0;
    d.assert('the loop is drawn on the line', ink > 0, `${ink} lit pixels`);

    if (layer) {
      const pe = phaseErrors(onsets.filter((o) => Number.isFinite(o.phase)), { loopMs: layer.loopMs });
      if (pe.length) {
        const st = stats(pe);
        d.set('off', st.p50);
        d.log(`off the beat: median ${st.p50.toFixed(1)} ms over ${pe.length} playbacks`);
      } else {
        d.log('nothing has played back yet. Let the loop go round once');
      }
    }
  });

  function meters() {
    if (!ctx) return;
    // READ EVERY TICK, NOT ONCE AT BOOT. `outputLatency` moves when the output
    // device does — plug in headphones and it changes — and a cell filled once
    // and never again is a constant wearing a measurement's clothes.
    const out = (ctx.outputLatency || ctx.baseLatency || 0) * 1000;
    d.set('latency', out || '', out ? 'ok' : '');
    d.set('notes', onsets.length || '');
    gutter();
  }
  setInterval(meters, 300);

  d.log('keys a w s e d f t g y h u j k · z and x move the octave · space is the pedal');
  d.ready();
</script>
</html>
