<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>elektron selfrec composed replay</title>
<style>
html,body{margin:0;padding:0;background:#0b0e12;color:#dfe5ec;font:13px monospace}
#tiles{display:flex;gap:8px;padding:8px}
.tile{position:relative;width:640px;height:360px;background:#000;border:1px solid #2a3340}
.tile video{width:640px;height:360px;display:block}
.tile .label{position:absolute;left:6px;top:4px;color:#8a93a0;z-index:2}
.tile.absent video{visibility:hidden}
.tile.absent::after{content:"— absent —";position:absolute;inset:0;display:flex;
  align-items:center;justify-content:center;color:#3d4550;font-size:20px}
#transport{display:flex;align-items:center;gap:10px;padding:6px 8px}
#playbtn{width:70px;background:#1a2129;color:#dfe5ec;border:1px solid #2a3340;
  font:13px monospace;padding:3px 0;cursor:pointer}
#playbtn:hover{background:#232c37}
#scrub{position:relative;flex:1;height:22px;background:#141a21;border:1px solid #2a3340;cursor:pointer}
#scrub .span{position:absolute;top:9px;height:4px;background:#26333f}
#scrub .tick{position:absolute;top:2px;width:2px;height:18px;background:#8a6a2f}
#scrub .tick.fired{background:#3f8a4f}
#ph{position:absolute;top:0;width:2px;height:22px;background:#c9d4e0}
#readout{color:#8a93a0;white-space:pre;min-width:330px}
#cueinfo{padding:0 8px 4px;color:#b9a15e;min-height:16px}
#bar{padding:4px 8px;color:#8a93a0;white-space:pre}
</style>
</head>
<body>
<div id="tiles"></div>
<div id="transport">
  <button id="playbtn">▶ play</button>
  <div id="scrub"><div id="ph"></div></div>
  <span id="readout"></span>
</div>
<div id="cueinfo"></div>
<div id="bar">loading…</div>
<script src="/hls.min.js"></script>
<script type="module">
import { createDeck } from "/timeline/transport.mjs";
// ============================================================================
// Composed replay — the v1 grid-archive DoD shape: N tiles, ONE playhead.
//
// THE PLAYHEAD IS THE TIMELINE LIBRARY'S (timeline/transport.mjs). What used to
// live here — `playAnchorT + (performance.now() - playAnchorPerf)`, a rAF cue
// engine, and a `firedIds` set rebuilt by hand on every seek — is the same
// hand-rolled replay shape four generations of this repo have rebuilt. It is
// now two adapters over the library's vector + lookahead lane:
//   kind `media-span` — actuate = seek/play a tile element; reduce = the set of
//                       tiles present at t; assertState = hard-seek every tile
//   kind `cue`        — actuate = fire the cue (decode both tiles); reduce =
//                       the fired set <= t; assertState = firedIds (rewind)
// MASTER CLOCK STAYS THE MEDIA ELEMENT (the proven pattern): the first present
// tile is the clock master, is never rate-nudged, and the library's vector is
// SLAVED to its currentTime via transport.sync(); every other tile servos to
// the library's position. If the master stalls the playhead stalls with it —
// cues and pixels cannot drift apart.
//
// TWO BOOT MODES:
//   ?show=<id>  (the promoted path) — selfrec/<show>/show.json (written by
//               postshow.mjs) is the source of spans {pid, T0, skewEst, dur,
//               masters, hls, index}; the room cuelog (room from show.json or
//               ?room=) supplies ONLY the cue lane. No run-sync orchestration.
//               Cuelog being gone degrades to an empty cue lane, not a failure.
//   ?room=<id>  (legacy) — spans REDUCED from the cuelog's media-span events,
//               exactly as the sync-leg regression ran it.
//
// Playhead T is ABSOLUTE WALL MS (the timeline substrate's clock). Per tile:
//   u(T) = T - anchor, three mappings:
//     linear:   anchor = span.at + skewEst   (T0 at recorder.start, corrected)
//     anchored: per-chunk re-anchor — chunk k's closeT is a fresh wall stamp
//               for the media position at the end of chunk k (media position
//               interpolated from the CLUSTER index by byte offset ±100-270 ms)
//     blocks:   same re-anchor but media position from the SIMPLEBLOCK index
//               (derived/index-blocks.json, ~33 ms granularity) — the
//               hour-scale question: does finer byte->time kill the
//               interpolation noise that made `anchored` lose to `linear`?
//   u < 0 or u > mediaDur  =>  the tile is EMPTY. Absence is content.
//
// Transport UI: play/pause, scrubber with click-to-seek + cue ticks (cuelog
// events on the wall-time axis), time readout, last-crossed-cue display.
// Ground truth = the burned 64-block clock row in the pixels (decoded from
// the video element at full 1280x720 via an offscreen canvas — same geometry
// contract as proto/replay). Cues fire when T crosses cue.at; at each fire
// both tiles are decoded immediately (the R4 measurement).
// ============================================================================
const q = new URLSearchParams(location.search);
const SHOWID = q.get("show");
const ROOMQ = q.get("room");
const TOKEN = q.get("token") || "";
const RTCBASE = q.get("rtcbase") || "https://elektron-rtc.kristjan-jansen.workers.dev";
const PUB = q.get("pub") || "https://pub-b8d50fdb5f6a41dbba072e433903705d.r2.dev";
// Default mapping is LINEAR (span.at + skewEst), not per-chunk re-anchored:
// measured on the sync regression, the re-anchor's byte->time interpolation
// noise (clusters every ~3.5 s, VBR bytes) is ±100-270 ms — BIGGER than the
// ~30-50 ms/90 s clock drift it corrects. `blocks` re-measures that verdict
// with SimpleBlock granularity.
const S = window.__grid = {
  phase: "init", error: null, mode: SHOWID ? "show" : "room", cueLane: "none",
  spans: {}, cues: [], fires: [],
  playheadT: 0, playing: false, mapping: "linear",
  tiles: {}, rangeT: [0, 0],
  masterPid: null, syncCorrections: [], hostName: null, masterEvents: [],
};

// ---- burned-row decoder (contract: NB=64 BW=12 RX=32 y=600 h=48) -----------
const dec = document.createElement("canvas");
dec.width = 1280; dec.height = 720;
const dctx = dec.getContext("2d", { willReadFrequently: true });
function decodeVideoClock(video) {
  if (!video.videoWidth) return { ok: false, why: "no frame" };
  try { dctx.drawImage(video, 0, 0, 1280, 720); } catch { return { ok: false, why: "draw" }; }
  const img = dctx.getImageData(0, 592, 1280, 64).data;   // rows 592..655
  const lum = (x, y) => { const i = ((y - 592) * 1280 + x) * 4; return 0.299 * img[i] + 0.587 * img[i + 1] + 0.114 * img[i + 2]; };
  const bits = [];
  for (let i = 0; i < 64; i++) {
    const cx = 32 + i * 12 + 6;
    let s = 0, n = 0;
    for (const dy of [-8, 0, 8]) for (const dx of [-2, 0, 2]) { s += lum(cx + dx, 624 + dy); n++; }
    bits.push(s / n > 110 ? 1 : 0);
  }
  const bytes = [];
  for (let b = 0; b < 8; b++) { let v = 0; for (let i = 0; i < 8; i++) v = (v << 1) | bits[b * 8 + i]; bytes.push(v); }
  let ck = 0; for (let i = 0; i < 7; i++) ck ^= bytes[i];
  if (ck !== bytes[7]) return { ok: false, why: "checksum" };
  let ms = 0; for (let i = 0; i < 6; i++) ms = ms * 256 + bytes[i];
  return { ok: true, ms, pid: String.fromCharCode(bytes[6]) };
}

// ---- per-tile machinery -----------------------------------------------------
function makeTile(pid, span) {
  const el = document.createElement("div");
  el.className = "tile absent";
  el.innerHTML = `<span class="label">${pid}</span><video muted playsinline></video>`;
  document.getElementById("tiles").appendChild(el);
  const video = el.querySelector("video");
  const t = { pid, span, el, video, hls: null, mediaDurMs: 0, absent: true,
              chunkAnchors: [], blockAnchors: [], linearAnchor: span.at + (span.skewEst || 0),
              lastHardSeek: 0, ready: false };
  S.tiles[pid] = t;
  return t;
}
// Byte->media-time interpolators. Cluster rows are objects {tMs, byteOffset}
// every ~3.5 s; block rows are [tMs, byteOffset, keyflag] every frame.
function interpFrom(pairs, totalBytes, durMs) {   // pairs: [[t,b],...] ascending
  const bytesPerMs = totalBytes / Math.max(1, durMs);
  return (b) => {
    if (!pairs.length) return null;
    if (b <= pairs[0][1]) return pairs[0][0];
    let lo = 0, hi = pairs.length - 1, i = 0;
    while (lo <= hi) { const m = (lo + hi) >> 1; if (pairs[m][1] <= b) { i = m; lo = m + 1; } else hi = m - 1; }
    if (i === pairs.length - 1) return pairs[i][0] + (b - pairs[i][1]) / bytesPerMs;
    const [a, z] = [pairs[i], pairs[i + 1]];
    return a[0] + (b - a[1]) / (z[1] - a[1]) * (z[0] - a[0]);
  };
}
// Build per-chunk anchors from manifest closeT + index byte offsets.
function buildAnchors(t, manifest, index, blockIndex) {
  const totalBytes = manifest.chunks.reduce((s, c) => s + c.bytes, 0);
  const clPairs = index.clusters.map((c) => [c.tMs, c.byteOffset]);
  const blPairs = blockIndex ? blockIndex.blocks.map((b) => [b[0], b[1]]) : null;
  const mediaCl = interpFrom(clPairs, totalBytes, manifest.durationMs);
  const mediaBl = blPairs ? interpFrom(blPairs, totalBytes, manifest.durationMs) : null;
  // NOTE domain consistency: closeT is a CLIENT stamp; all mappings correct
  // client stamps into the playhead's (server) domain with +skewEst, so the
  // R3 linear-vs-anchored divergence is pure drift, not a domain mismatch.
  let acc = 0;
  for (const c of manifest.chunks) {
    acc += c.bytes;
    const mkRow = (fn) => fn == null ? null : { seq: c.seq, closeT: c.closeT,
      anchor: c.closeT + (t.span.skewEst || 0) - fn(acc) };
    t.chunkAnchors.push(mkRow(mediaCl));
    if (mediaBl) t.blockAnchors.push(mkRow(mediaBl));
  }
  t.mediaDurMs = manifest.durationMs;
}
function mapT(t, T, mode) {
  const m = mode || S.mapping;
  const ca = m === "blocks" ? t.blockAnchors : t.chunkAnchors;
  if (m === "linear" || !ca.length) return T - t.linearAnchor;
  let k = ca.findIndex((c) => c.closeT >= T);
  if (k === -1) k = ca.length - 1;
  return T - ca[k].anchor;
}
window.__mapInfo = (T) => {
  const out = {};
  for (const [pid, t] of Object.entries(S.tiles)) {
    const lin = mapT(t, T, "linear"), anc = mapT(t, T, "anchored");
    const blk = t.blockAnchors.length ? mapT(t, T, "blocks") : null;
    out[pid] = { linear: lin, anchored: anc, blocks: blk,
                 divergenceMs: +(lin - anc).toFixed(1),
                 divergenceBlocksMs: blk == null ? null : +(lin - blk).toFixed(1) };
  }
  return out;
};

// ---- transport: one playhead, and it is the library's ------------------------
let deck = null, firedIds = new Set();
const currentT = () => (deck ? deck.position() : S.playheadT);

window.__seekWall = (T) => { if (deck) S.playheadT = deck.seek(T); };
window.__play = () => { deck && deck.play(); };
window.__pause = () => {
  if (!deck) return;
  deck.pause();
  for (const t of Object.values(S.tiles)) t.video.pause();
};
window.__setRate = (r) => { deck && deck.setRate(r); };   // library seam 2: does not play
// TEST HOOK — an EXTERNAL scrub of the master element (what an hls.js recovery
// jump or a user dragging the <video> looks like to us): move currentTime
// discontinuously WITHOUT telling the deck. The library's mediaMaster must
// notice (|err| > jumpMs) and route it to deck.seek(), so the cues in between
// are FOLDED, not burst. Before v0.5 this page synced unconditionally and burst.
window.__jumpMaster = (T) => {
  const m = S.masterPid && S.tiles[S.masterPid];
  if (!m) return { ok: false, why: "no master" };
  const u = mapT(m, T);
  if (u < 0 || u > m.mediaDurMs) return { ok: false, why: "target outside the master's media" };
  const before = m.video.currentTime;
  m.video.currentTime = u / 1000;
  return { ok: true, pid: m.pid, fromS: +before.toFixed(3), toS: +(u / 1000).toFixed(3),
           targetT: T, deckPosBefore: currentT() };
};
window.__masterInfo = () => ({ pid: S.masterPid, events: S.masterEvents.slice(),
                               stats: mmaster ? mmaster.stats() : null,
                               firedIds: [...firedIds].sort(), fires: S.fires.length,
                               pos: currentT() });
window.__setMapping = (m) => { S.mapping = m; window.__seekWall(currentT()); };
window.__decodeNow = () => {
  const T = currentT();
  const out = { T, mapping: S.mapping, tiles: {} };
  for (const [pid, t] of Object.entries(S.tiles)) {
    const d = t.absent ? { ok: false, why: "absent" } : decodeVideoClock(t.video);
    out.tiles[pid] = { absent: t.absent, mediaU: mapT(t, T),
                       videoTimeMs: Math.round(t.video.currentTime * 1000),
                       clock: d.ok ? d.ms : null, pidByte: d.ok ? d.pid : null, why: d.why || null };
  }
  return out;
};

// hard assert (a seek landed here): put the element exactly at u(T)
function assertTile(t, T, present) {
  const u = mapT(t, T);
  const absent = !present || !t.ready || u < 0 || u > t.mediaDurMs;
  if (absent !== t.absent) { t.absent = absent; t.el.classList.toggle("absent", absent); }
  if (absent) { if (!t.video.paused) t.video.pause(); return; }
  t.video.currentTime = u / 1000;
  t.video.playbackRate = 1;
  t.lastHardSeek = performance.now();
  if (deck && deck.playing()) t.video.play().catch(() => {}); else t.video.pause();
}
// soft servo (running): the same 150 ms hard-resync law, but the rate-nudge
// dead band is now the SKEW BUDGET and it is explicit. Under the old wall-clock
// playhead both tiles drifted together, so a wide (±40 ms) band was invisible;
// with a media-element master the master sits at zero by definition and the
// band IS the inter-tile skew. One 30 fps frame is 33 ms, so 20 ms is the
// tightest band that still means something.
const SERVO_BAND_MS = 20;
function servoTile(t, T) {
  const u = mapT(t, T);
  const absent = u < 0 || u > t.mediaDurMs || !t.ready;
  if (absent !== t.absent) { t.absent = absent; t.el.classList.toggle("absent", absent); }
  if (absent) { if (!t.video.paused) t.video.pause(); return; }
  const errMs = t.video.currentTime * 1000 - u;
  if (Math.abs(errMs) > 150) return assertTile(t, T, true);
  if (t.video.paused) t.video.play().catch(() => {});
  t.video.playbackRate = errMs > SERVO_BAND_MS ? 0.94 : errMs < -SERVO_BAND_MS ? 1.06 : 1;
}

// ---- adapters (the library's {caps, actuate, reduce, assertState} shape) -----
const spanAdapter = {
  caps: {
    kind: "media-span", domain: "wall", unit: "ms",
    seekable: true, reducible: true,
    // an HTMLMediaElement is not a sample-accurate slave: seeks land on a frame
    // and rate is only trustworthy at 1x (0.94/1.06 is the servo, not playback)
    seekAccuracyMs: 40, rates: [1], rateNudge: [0.94, 1.06],
    clockMaster: true,             // this kind OWNS the clock; see the sync loop
    catchUp: "reduce",             // a missed span boundary is re-asserted, never burst
  },
  actuate(p) {
    const t = S.tiles[p.pid];
    if (t) assertTile(t, currentT(), p.phase === "enter");
  },
  // the set of tiles that should be PRESENT at pos — absence is content
  reduce(payloads, pos) {
    const present = new Set();
    for (const p of payloads) { if (p.phase === "enter") present.add(p.pid); else present.delete(p.pid); }
    for (const pid of [...present]) {
      const t = S.tiles[pid], u = t ? mapT(t, pos) : -1;
      if (!t || u < 0 || u > t.mediaDurMs) present.delete(pid);
    }
    return present;
  },
  assertState(present, info) {
    for (const [pid, t] of Object.entries(S.tiles)) assertTile(t, info.pos, present.has(pid));
  },
};

const cueAdapter = {
  caps: { kind: "cue", domain: "wall", unit: "ms", seekable: true, reducible: true,
          catchUp: "burst" },      // a cue is a note: never silently dropped
  actuate(p, rec) {
    firedIds.add(p.id);
    const decs = window.__decodeNow();
    S.fires.push({ id: p.id, at: p.at, firedT: decs.T, wallNow: Date.now(),
                   decoded: decs.tiles, origin: rec.origin,
                   // the LIBRARY's drift number (intended vs actual instant),
                   // not "how far past the cue the rAF loop happened to look"
                   lateMs: rec.deltaMs === null ? null : +rec.deltaMs.toFixed(1),
                   posLateMs: +(decs.T - p.at).toFixed(1) });
  },
  reduce(payloads) { return new Set(payloads.map((p) => p.id)); },   // fired set <= t
  assertState(set) { firedIds = set; },                              // rewind semantics
};

// ---- clock master: the media element drives the library, not the wall --------
// ADOPTED (v0.5): this block used to be hand-written here, and it had a live
// bug that the LIBRARY version does not have — it called `deck.sync()`
// UNCONDITIONALLY, with no jump-vs-drift discrimination. Any discontinuity in
// the master's currentTime (an external scrub of the video element, an hls.js
// recovery jump, a gap skip) therefore slid the vector forward with a sync,
// which leaves every cue in between `pending` — and the cue lane here is
// `catchUp: "burst"`, so the lookahead fires ALL of them at once the next tick.
// That is exactly the burst-every-skipped-cue bug this page's adoption of the
// library had already fixed for the SEEK path (window.__seekWall -> deck.seek
// -> reduce + assertState). It was still open on the MASTER path.
//
// `mediaMaster()` carries the law instead (timeline/media-master.mjs L1-L5):
// sync inside tolerance, SEEK past jumpMs, timeupdate as the hidden-tab
// backstop, and a stall releases the master role (this page has N tiles, so
// `release` — proto/replay has one video, so it uses `hold`).
import { mediaMaster } from "/timeline/media-master.mjs";
const SYNC_TOL_MS = 40;            // don't churn the lookahead on frame quantization
const JUMP_MS = 250;               // past this it is not drift, it is a MOVE
let mmaster = null;
function buildMaster() {
  mmaster = window.__mmaster = mediaMaster(deck, () => {
    if (S.mapping !== "linear") return null;   // T->u is only invertible for linear
    const T = currentT();
    const usable = (t) => t && t.ready && !t.absent && !t.video.paused &&
                          mapT(t, T) >= 0 && mapT(t, T) <= t.mediaDurMs;
    let m = S.masterPid && S.tiles[S.masterPid];
    if (!usable(m)) { m = Object.values(S.tiles).find(usable) || null; S.masterPid = m ? m.pid : null; }
    if (!m) return null;
    m.video.playbackRate = 1;                  // THE MASTER IS NEVER NUDGED (L1)
    return { el: m.video, pos: m.linearAnchor + m.video.currentTime * 1000, key: m.pid };
  }, {
    toleranceMs: SYNC_TOL_MS, jumpMs: JUMP_MS, stallMs: 1000,
    stallPolicy: "release",        // N tiles: give up the role, free-run / re-pick
    autoPlayPause: false,          // this page owns play/pause (the scrubber does)
    onCorrection: (c) => { S.syncCorrections.push(c); if (S.syncCorrections.length > 500) S.syncCorrections.shift(); },
    onEvent: (e) => {
      S.masterEvents.push(e);
      if (S.masterEvents.length > 200) S.masterEvents.shift();
      if (e.reason === "release") S.masterPid = null;   // free-run on the wall clock
    },
  });
}
function driveFromMaster() { return mmaster ? mmaster.tick() : null; }

// ---- scrubber / transport UI ------------------------------------------------
const scrubEl = document.getElementById("scrub");
const phEl = document.getElementById("ph");
const playBtn = document.getElementById("playbtn");
const readoutEl = document.getElementById("readout");
const cueInfoEl = document.getElementById("cueinfo");
const fracOf = (T) => (T - S.rangeT[0]) / Math.max(1, S.rangeT[1] - S.rangeT[0]);
function buildScrubber() {
  // span underlay bars (one per tile) + cue ticks on the wall-time axis
  for (const t of Object.values(S.tiles)) {
    const el = document.createElement("div");
    el.className = "span";
    el.style.left = (fracOf(t.span.at + (t.span.skewEst || 0)) * 100) + "%";
    el.style.width = ((t.mediaDurMs / Math.max(1, S.rangeT[1] - S.rangeT[0])) * 100) + "%";
    scrubEl.insertBefore(el, phEl);
  }
  for (const c of S.cues) {
    const el = document.createElement("div");
    el.className = "tick";
    el.dataset.cueId = c.id;
    el.title = c.id;
    el.style.left = (fracOf(c.at) * 100) + "%";
    scrubEl.insertBefore(el, phEl);
  }
}
scrubEl.addEventListener("click", (e) => {
  if (S.phase !== "running") return;
  const r = scrubEl.getBoundingClientRect();
  const frac = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  window.__seekWall(S.rangeT[0] + frac * (S.rangeT[1] - S.rangeT[0]));
});
playBtn.addEventListener("click", () => { S.playing ? window.__pause() : window.__play(); });
function updateTransport(T) {
  phEl.style.left = `calc(${(fracOf(T) * 100).toFixed(3)}% - 1px)`;
  playBtn.textContent = S.playing ? "⏸ pause" : "▶ play";
  const rel = (T - S.rangeT[0]) / 1000, tot = (S.rangeT[1] - S.rangeT[0]) / 1000;
  readoutEl.textContent = `t=${rel.toFixed(1)}s / ${tot.toFixed(1)}s   T=${Math.round(T)}`;
  // last crossed cue is displayed; ticks colour once crossed
  let last = null;
  for (const c of S.cues) if (c.at <= T) last = c;
  cueInfoEl.textContent = last
    ? `▸ cue ${last.id}${last.data && last.data.text ? " — " + last.data.text : ""} (t=${((last.at - S.rangeT[0]) / 1000).toFixed(1)}s)`
    : (S.cues.length ? `${S.cues.length} cues ahead` : `cue lane: ${S.cueLane}`);
  for (const el of scrubEl.querySelectorAll(".tick"))
    el.classList.toggle("fired", S.cues.find((c) => c.id === el.dataset.cueId).at <= T);
}

// ---- main loop --------------------------------------------------------------
// No cue engine here any more: cues are the library's lookahead lane, on a
// worker tick that survives a hidden tab. The rAF loop is now PURELY the video
// servo + paint, which is what rAF is actually for.
function loop() {
  S.playing = deck ? deck.playing() : false;
  let T = currentT();
  if (S.playing) {
    driveFromMaster();                      // media element -> library vector (L1-L5)
    T = currentT();
    for (const t of Object.values(S.tiles)) if (t.pid !== S.masterPid) servoTile(t, T);
    if (S.masterPid && S.tiles[S.masterPid]) servoPresence(S.tiles[S.masterPid], T);
    if (T > S.rangeT[1]) window.__pause();
  }
  S.playheadT = T;
  updateTransport(T);
  const tileTxt = Object.values(S.tiles).map((t) =>
    `${t.pid}:${t.absent ? "absent" : (t.video.currentTime).toFixed(2) + "s"}${t.pid === S.masterPid ? "*" : ""}`).join("  ");
  document.getElementById("bar").textContent =
    `mode=${S.mode}  map=${S.mapping}  ${tileTxt}  fires=${S.fires.length}/${S.cues.length}` +
    `  master=${S.masterPid || "wall"}  host=${S.hostName}`;
  requestAnimationFrame(loop);
}
// the master's absence bookkeeping only — never its rate, never its currentTime
function servoPresence(t, T) {
  const u = mapT(t, T);
  const absent = u < 0 || u > t.mediaDurMs || !t.ready;
  if (absent !== t.absent) { t.absent = absent; t.el.classList.toggle("absent", absent); }
  if (absent && !t.video.paused) t.video.pause();
  else if (!absent && t.video.paused) t.video.play().catch(() => {});
}

// ---- boot -------------------------------------------------------------------
function reduceCuelog(log, wantSpans) {
  // first occurrence per id wins — resend dedupe
  const seen = new Set();
  for (const e of log.cues) {
    const cue = e.cue;
    if (!cue || seen.has(cue.id)) continue;
    seen.add(cue.id);
    const p = (cue.data && cue.data.kind === "media-span") ? cue.data
            : (cue.kind === "media-span" ? cue : null);
    if (p) {
      if (!wantSpans) continue;
      const s = S.spans[p.source] || (S.spans[p.source] = { source: p.source, beats: [] });
      if (p.phase === "start") Object.assign(s, { at: p.at, skewEst: p.skewEst, rttMin: p.rttMin,
                                                  mediaRef: p.mediaRef, mimeType: p.mimeType });
      else if (p.phase === "beat") s.beats.push({ at: cue.at, seq: p.seq });
      else if (p.phase === "end") Object.assign(s, { endAt: cue.at, dur: p.dur,
                                                     chunkCount: p.chunkCount, degraded: p.degraded });
    } else {
      S.cues.push({ id: cue.id, at: cue.at, sentAt: cue.sentAt, data: cue.data });
    }
  }
  S.cues.sort((a, b) => a.at - b.at);
}
(async () => {
  try {
    let room = ROOMQ;
    if (SHOWID) {
      // ---- promoted path: show.json is the source of truth for spans -------
      const sr = await fetch(`${PUB}/selfrec/${SHOWID}/show.json?cb=${Date.now()}`);
      if (!sr.ok) throw new Error("show.json " + sr.status);
      const sj = await sr.json();
      S.showJson = sj;
      room = room || sj.room;
      for (const p of sj.participants) {
        if (p.noMasters) continue;              // absent everywhere; nothing playable
        S.spans[p.pid] = { source: p.pid, at: p.T0, skewEst: p.skewEst || 0, rttMin: p.rttMin,
                           mediaRef: p.masters.replace(/^/, "").endsWith("/") ? p.masters : p.masters + "/",
                           mimeType: p.mimeType, dur: p.dur, endAt: p.T0 + p.dur,
                           chunkCount: p.chunkCount, degraded: p.degraded,
                           hls: p.hls, index: p.index, manifest: p.manifest };
      }
      // cuelog is CUE LANE ONLY here — its absence degrades, not fails
      if (room) {
        try {
          const r = await fetch(`${RTCBASE}/room/${room}/cuelog?token=${encodeURIComponent(TOKEN)}`);
          if (r.ok) { reduceCuelog(await r.json(), false); S.cueLane = "cuelog"; }
          else S.cueLane = "unavailable(" + r.status + ")";
        } catch (e) { S.cueLane = "unavailable"; }
      } else S.cueLane = "no-room";
    } else {
      // ---- legacy path: everything reduced from the cuelog ------------------
      if (!room) throw new Error("show or room param required");
      const r = await fetch(`${RTCBASE}/room/${room}/cuelog?token=${encodeURIComponent(TOKEN)}`);
      if (!r.ok) throw new Error("cuelog " + r.status);
      reduceCuelog(await r.json(), true);
      S.cueLane = "cuelog";
    }
    const spans = Object.values(S.spans).filter((s) => s.at != null);
    if (!spans.length) throw new Error("no media spans");
    spans.sort((a, b) => a.at - b.at);
    S.rangeT = [Math.min(...spans.map((s) => s.at)) - 2000,
                Math.max(...spans.map((s) => (s.endAt || s.at + (s.dur || 0))))];
    // build tiles
    for (const span of spans) {
      const t = makeTile(span.source, span);
      const manifest = await (await fetch(`${PUB}/${span.manifest || span.mediaRef + "manifest.json"}`)).json();
      const index = await (await fetch(`${PUB}/${span.index || span.mediaRef + "derived/index.json"}`)).json();
      let blockIndex = null;   // optional — only exists after indexer --blocks
      try {
        const br = await fetch(`${PUB}/${span.mediaRef}derived/index-blocks.json`);
        if (br.ok) blockIndex = await br.json();
      } catch {}
      buildAnchors(t, manifest, index, blockIndex);
      await new Promise((resolve, reject) => {
        const hls = new Hls({ enableWorker: false });
        t.hls = hls;
        hls.loadSource(`${PUB}/${span.hls || span.mediaRef + "derived/hls/index.m3u8"}`);
        hls.attachMedia(t.video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => { t.ready = true; resolve(); });
        hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) reject(new Error("hls " + d.type + "/" + d.details)); });
        setTimeout(() => reject(new Error("hls manifest timeout")), 15000);
      });
    }
    buildScrubber();

    // ---- the library's deck: two kinds, one playhead ----------------------
    // Position domain is ABSOLUTE WALL MS (unchanged) — the library's range is
    // just [rangeT0, rangeT1]. media-span boundaries and cues are ordinary
    // scheduled events; the adapters above are the only glue.
    const items = [];
    for (const t of Object.values(S.tiles)) {
      items.push({ at: t.linearAnchor, kind: "media-span", id: `span-${t.pid}-in`,
                   payload: { pid: t.pid, phase: "enter" } });
      items.push({ at: t.linearAnchor + t.mediaDurMs, kind: "media-span", id: `span-${t.pid}-out`,
                   payload: { pid: t.pid, phase: "exit" } });
    }
    for (const c of S.cues) items.push({ at: c.at, kind: "cue", id: c.id, payload: { id: c.id, at: c.at, data: c.data } });
    deck = window.__deck = createDeck({
      items, range: S.rangeT,
      adapters: { "media-span": spanAdapter, cue: cueAdapter },
      // worker tick host is the library default (lab VERDICT): the cue lane
      // keeps firing when this tab is backgrounded, which the old rAF engine
      // could not do at all.
      onPosition: (pos) => { S.playheadT = pos; },
    });
    S.hostName = deck.hostName;
    buildMaster();                    // the library's media-element master law
    window.__drift = () => deck.drift();
    window.__deckStats = () => ({ stats: deck.stats(), audit: deck.audit(),
                                  drift: deck.drift(), driftStats: deck.sched.driftStats(),
                                  caps: deck.caps(), syncCorrections: S.syncCorrections.slice(),
                                  master: S.masterPid, host: deck.hostName,
                                  mediaMaster: mmaster ? mmaster.stats() : null,
                                  masterEvents: S.masterEvents.slice(),
                                  rate: deck.rate(), targetRate: deck.targetRate() });
    window.__seekWall(S.rangeT[0]);
    S.phase = "running";
    loop();
  } catch (e) {
    S.error = String(e && e.message || e);
    S.phase = "failed";
    document.getElementById("bar").textContent = "FAILED: " + S.error;
  }
})();
</script>
