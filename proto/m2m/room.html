<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>m2m SFU room</title>
<style>
body{background:#111;color:#ddd;font:13px monospace}
#tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{border:1px solid #444;padding:4px}
.tile video{width:320px;height:180px;display:block}
#log{white-space:pre-wrap}
</style>
</head>
<body>
<h3 id="hdr">m2m room</h3>
<canvas id="cv" width="640" height="360" style="width:320px;height:180px;border:1px solid #263"></canvas>
<div id="tiles"></div>
<div id="hud"></div>
<div id="log"></div>
<script>
"use strict";
// One page = one participant = one RTCPeerConnection carrying 1 sendonly video
// transceiver (my canvas) + N-1 recvonly transceivers (everyone else), all
// through the Cloudflare Realtime SFU. Signaling/roster is the local server on
// :8897; in production that registry+poll becomes a workers/cues-style Durable
// Object room (WS push instead of poll) and the /cf/ proxy becomes a Worker
// route holding the app secret.
const q = new URLSearchParams(location.search);
const MY_ID = (q.get("id") || "X").slice(0, 8);
const EXPECTED_N = parseInt(q.get("n") || "3", 10);
// mode=pub  -> LIGHTWEIGHT PUBLISHER: 320x180@15 cheap canvas, publish only,
//              pull nothing, render nothing (scale-ladder participant class).
// mode=full -> original behavior (publish + pull all + decode). Probes use this.
const MODE = q.get("mode") === "pub" ? "pub" : "full";
const IS_PUB = MODE === "pub";
// hold=1 -> wait for driver to set window.__go before touching the SFU, so all
// N participants hit the API in a synchronized join storm.
const HOLD = q.get("hold") === "1";
const COLLECT = "/collect";
document.getElementById("hdr").textContent = "m2m room — participant " + MY_ID + " (expecting " + EXPECTED_N + ", mode " + MODE + ")";
document.title = "m2m " + MY_ID;
// many-tile probe: shrink tiles so all stay in-viewport (decode uses the video
// frame, not the CSS box, so this only affects compositing cost)
if (!IS_PUB && EXPECTED_N > 6) {
  const st = document.createElement("style");
  st.textContent = ".tile video{width:160px;height:90px}";
  document.head.appendChild(st);
}

// ---- binary row geometry (rig/whep pattern, halved to 360p, +1 pid byte) ----
// 64 blocks: 48-bit ms MSB-first, 8-bit participant id (char code), 8-bit XOR
// checksum over the 7 payload bytes. Same relative block width as the proven
// 720p rig (9/640 ~ 20/1280). Decoder normalizes onto the 640x360 grid.
const NBLOCKS = 64;
const BLOCK_W = 9;
const ROW_X = 32;          // row spans 32..608 of 640
const ROW_Y = 40;
const ROW_H = 56;

window.__state = { phase: "init", error: null, id: MY_ID, mode: MODE, frames: 0,
                   rosterCount: 0, pulled: 0, tiles: {} };

const logEl = document.getElementById("log");
const hud = document.getElementById("hud");
function log(...a) { const s = a.join(" "); logEl.textContent += s + "\n"; console.log(s); }
function post(obj) { navigator.sendBeacon(COLLECT, JSON.stringify(obj)); }
function event(name, extra) {
  post(Object.assign({ kind: "event", who: MY_ID, name,
                       t: performance.timeOrigin + performance.now() }, extra || {}));
}

// ---- canvas signal (publish.html generator, adapted) -----------------------
const cv = document.getElementById("cv");
if (IS_PUB) { cv.width = 320; cv.height = 180; }   // tiny canvas, same relative geometry via ctx scale
const ctx = cv.getContext("2d", { alpha: false, desynchronized: true });
let frameCounter = 0;
const PID_BYTE = MY_ID.charCodeAt(0) & 0xff;
const PUB_FPS = 15;

// Cheap publisher draw: solid bg + black bed + binary row + id, no gradients,
// no ISO clock, no moving square (the row's low bits change every frame — the
// encoder never starves). Drawn at half scale onto the 320x180 canvas so the
// decoder's normalize-to-640x360 grid still lines up exactly.
function drawPub() {
  const ms = Math.round(performance.timeOrigin + performance.now());
  ctx.setTransform(0.5, 0, 0, 0.5, 0, 0);
  ctx.fillStyle = "#404040";
  ctx.fillRect(0, 0, 640, 360);
  ctx.fillStyle = "#000";
  ctx.fillRect(ROW_X - 12, ROW_Y - 12, NBLOCKS * BLOCK_W + 24, ROW_H + 24);
  const bytes = [];
  let v = ms;
  for (let i = 5; i >= 0; i--) { bytes[i] = v % 256; v = Math.floor(v / 256); }
  bytes.push(PID_BYTE);
  let ck = 0;
  for (const b of bytes) ck ^= b;
  const bits = [];
  for (const b of bytes.concat([ck])) for (let i = 7; i >= 0; i--) bits.push((b >> i) & 1);
  ctx.fillStyle = "#fff";
  for (let i = 0; i < NBLOCKS; i++) {
    if (bits[i]) ctx.fillRect(ROW_X + i * BLOCK_W, ROW_Y, BLOCK_W, ROW_H);
  }
  ctx.font = "bold 110px monospace";
  ctx.fillText(MY_ID, 40, 240);
  ctx.font = "bold 28px monospace";
  ctx.fillText(String(ms), 160, 180);
  frameCounter++;
  window.__state.frames = frameCounter;
}

function draw() {
  const ms = Math.round(performance.timeOrigin + performance.now());
  ctx.fillStyle = "#404040";
  ctx.fillRect(0, 0, 640, 360);
  // black bed behind the row so compression ringing has room
  ctx.fillStyle = "#000";
  ctx.fillRect(ROW_X - 12, ROW_Y - 12, NBLOCKS * BLOCK_W + 24, ROW_H + 24);
  // payload: 6 bytes ms + 1 byte pid, then XOR checksum byte
  const bytes = [];
  let v = ms;
  for (let i = 5; i >= 0; i--) { bytes[i] = v % 256; v = Math.floor(v / 256); }
  bytes.push(PID_BYTE);
  let ck = 0;
  for (const b of bytes) ck ^= b;
  const bits = [];
  for (const b of bytes.concat([ck])) for (let i = 7; i >= 0; i--) bits.push((b >> i) & 1);
  ctx.fillStyle = "#fff";
  for (let i = 0; i < NBLOCKS; i++) {
    if (bits[i]) ctx.fillRect(ROW_X + i * BLOCK_W, ROW_Y, BLOCK_W, ROW_H);
  }
  // human-readable id + ms + frame counter
  ctx.fillStyle = "#fff";
  ctx.font = "bold 110px monospace";
  ctx.fillText(MY_ID, 40, 240);
  ctx.font = "bold 28px monospace";
  ctx.fillText(String(ms), 160, 180);
  ctx.fillText("frame " + frameCounter, 160, 215);
  ctx.fillText(new Date(ms).toISOString().slice(11, 23), 160, 250);
  // motion so the encoder never starves/dedupes
  const x = (frameCounter * 5) % 560;
  ctx.fillStyle = "hsl(" + (frameCounter % 360) + ",80%,60%)";
  ctx.fillRect(20 + x, 290, 50, 50);
  frameCounter++;
  window.__state.frames = frameCounter;
  requestAnimationFrame(draw);
}
if (IS_PUB) setInterval(drawPub, Math.round(1000 / PUB_FPS));
else requestAnimationFrame(draw);

// ---- decoder (play.html pattern; 640x360 reference grid) -------------------
function makeDecoder() {
  const work = document.createElement("canvas");
  work.width = 640; work.height = 360;
  const wctx = work.getContext("2d", { alpha: false, willReadFrequently: true });
  return function decodeRow(vid) {
    wctx.drawImage(vid, 0, 0, 640, 360);
    const y = ROW_Y + ROW_H / 2;
    const img = wctx.getImageData(ROW_X, y, NBLOCKS * BLOCK_W, 1).data;
    const levels = [];
    for (let i = 0; i < NBLOCKS; i++) {
      // average central 3 px of each 9 px block (green channel)
      let s = 0;
      for (let dx = 3; dx < 6; dx++) s += img[(i * BLOCK_W + dx) * 4 + 1];
      levels.push(s / 3);
    }
    const mn = Math.min(...levels), mx = Math.max(...levels);
    if (mx - mn < 60) return { ok: false, why: "low-contrast", contrast: mx - mn };
    const thr = (mn + mx) / 2;
    const bits = levels.map(l => (l > thr ? 1 : 0));
    let ms = 0;
    for (let i = 0; i < 48; i++) ms = ms * 2 + bits[i];
    let pid = 0;
    for (let i = 48; i < 56; i++) pid = pid * 2 + bits[i];
    let ck = 0;
    for (let i = 56; i < 64; i++) ck = ck * 2 + bits[i];
    const bytes = [];
    let v = ms;
    for (let i = 5; i >= 0; i--) { bytes[i] = v % 256; v = Math.floor(v / 256); }
    bytes.push(pid);
    let expect = 0;
    for (const b of bytes) expect ^= b;
    if (expect !== ck) return { ok: false, why: "checksum", contrast: mx - mn };
    return { ok: true, ms, pid: String.fromCharCode(pid), contrast: mx - mn };
  };
}

// ---- sample batching (raw newline body — rig smoke-1 bug avoided) ----------
// fetch, NOT sendBeacon: beacons have a ~64 KB quota and get silently dropped
// above it — a probe pulling 19 tracks batches ~285 rows/s ≈ 70 KB (found the
// hard way at N=20; N<=16 batches were just under the limit).
let batch = [];
window.__batchStats = { flushed: 0, failed: 0 };
setInterval(() => {
  if (batch.length) {
    fetch(COLLECT, { method: "POST", body: batch.map(r => JSON.stringify(r)).join("\n") })
      .then(() => { window.__batchStats.flushed++; })
      .catch(() => { window.__batchStats.failed++; });
    batch = [];
  }
}, 1000);

// ---- tiles -----------------------------------------------------------------
const tilesEl = document.getElementById("tiles");
function startTile(fromPid, track) {
  const div = document.createElement("div");
  div.className = "tile";
  const label = document.createElement("div");
  label.textContent = fromPid + " -> " + MY_ID;
  const vid = document.createElement("video");
  vid.autoplay = true; vid.muted = true; vid.playsInline = true;
  div.appendChild(label); div.appendChild(vid);
  tilesEl.appendChild(div);
  vid.srcObject = new MediaStream([track]);
  vid.play().catch(() => {});

  const tileState = { samples: 0, valid: 0, pidMismatch: 0, lastLatencyMs: null };
  window.__state.tiles[fromPid] = tileState;
  const decodeRow = makeDecoder();
  let busy = false, lastPresented = -1;

  function onFrame(now, meta) {
    vid.requestVideoFrameCallback(onFrame);   // RE-ARM FIRST (plan §4.1)
    if (busy) return;                          // busy guard — drop, never queue
    busy = true;
    try {
      if (meta.presentedFrames === lastPresented) return;
      lastPresented = meta.presentedFrames;
      const dec = decodeRow(vid);
      const dispWall = performance.timeOrigin + meta.expectedDisplayTime;
      const row = {
        kind: "sample", from: fromPid, to: MY_ID,
        t: performance.timeOrigin + performance.now(),
        vis: document.visibilityState,
        presentedFrames: meta.presentedFrames,
        receiveTime: (meta.receiveTime !== undefined) ? meta.receiveTime : null,
        w: meta.width, h: meta.height,
        decOk: dec.ok, contrast: Math.round(dec.contrast || 0)
      };
      if (dec.ok) {
        row.burnedTs = dec.ms;
        row.latencyMs = dispWall - dec.ms;   // glass-to-glass, one clock (same machine)
        row.decPid = dec.pid;
        row.pidOk = dec.pid === fromPid;
        if (!row.pidOk) tileState.pidMismatch++;
        tileState.valid++;
        tileState.lastLatencyMs = Math.round(row.latencyMs);
      } else {
        row.decWhy = dec.why;
      }
      if (meta.receiveTime != null) row.receiveToDisplayMs = meta.expectedDisplayTime - meta.receiveTime;
      tileState.samples++;
      batch.push(row);
    } finally {
      busy = false;
    }
  }
  vid.requestVideoFrameCallback(onFrame);
}

setInterval(() => {
  const parts = Object.entries(window.__state.tiles).map(([pid, s]) =>
    pid + ":" + s.valid + "/" + s.samples + (s.lastLatencyMs != null ? "@" + s.lastLatencyMs + "ms" : ""));
  hud.textContent = "phase=" + window.__state.phase + " frames=" + frameCounter +
    " roster=" + window.__state.rosterCount + " tiles[" + parts.join(" ") + "]";
}, 1000);

// ---- SFU client ------------------------------------------------------------
// API (verified live + against realtime-api-2024-05-21.yaml):
//   POST /sessions/new                          -> {sessionId}
//   POST /sessions/{sid}/tracks/new             push: {sessionDescription(offer), tracks:[{location:local, mid, trackName}]} -> answer
//                                               pull: {tracks:[{location:remote, sessionId, trackName}]} -> offer + requiresImmediateRenegotiation
//   PUT  /sessions/{sid}/renegotiate            {sessionDescription(answer)}
// All via the local /cf/ proxy (bearer secret stays server-side).
async function cf(method, subpath, body) {
  const resp = await fetch("/cf/" + subpath, {
    method,
    headers: { "Content-Type": "application/json" },
    body: body !== undefined ? JSON.stringify(body) : null
  });
  const txt = await resp.text();
  let obj; try { obj = JSON.parse(txt); } catch (e) { obj = { raw: txt }; }
  if (!resp.ok || obj.errorCode) {
    throw new Error(method + " /" + subpath + " -> HTTP " + resp.status + " " + txt.slice(0, 300));
  }
  return obj;
}

function waitIceGathering(pc) {
  return new Promise(res => {
    if (pc.iceGatheringState === "complete") return res();
    const t = setTimeout(res, 3000);
    pc.onicegatheringstatechange = () => {
      if (pc.iceGatheringState === "complete") { clearTimeout(t); res(); }
    };
  });
}

let pc = null, SID = null;
const TRACK_NAME = "video-" + MY_ID;
const midToPid = new Map();

async function publish() {
  if (HOLD) {                       // synchronized join storm: wait for driver release
    window.__state.phase = "held";
    await new Promise(res => {
      const t = setInterval(() => { if (window.__go) { clearInterval(t); res(); } }, 25);
    });
  }
  window.__state.phase = "connecting";
  window.__state.t_go = performance.timeOrigin + performance.now();
  const stream = cv.captureStream(IS_PUB ? PUB_FPS : 30);
  pc = new RTCPeerConnection({
    iceServers: [{ urls: "stun:stun.cloudflare.com:3478" }],
    bundlePolicy: "max-bundle"
  });
  window.__pc = pc;
  pc.oniceconnectionstatechange = () => event("ice", { state: pc.iceConnectionState });
  pc.onconnectionstatechange = () => {
    event("pc", { state: pc.connectionState });
    if (pc.connectionState === "failed") { window.__state.phase = "failed"; window.__state.error = "pc failed"; }
  };
  pc.ontrack = (e) => {
    if (e.track.kind !== "video") return;
    const pid = midToPid.get(e.transceiver.mid);
    log("ontrack mid=" + e.transceiver.mid + " -> " + (pid || "UNKNOWN"));
    if (pid) startTile(pid, e.track);
    else event("ontrack-unmapped", { mid: e.transceiver.mid });
  };

  const sess = await cf("POST", "sessions/new");
  SID = sess.sessionId;
  window.__state.sessionId = SID;
  log("session " + SID.slice(0, 12) + "…");

  const tx = pc.addTransceiver(stream.getVideoTracks()[0], { direction: "sendonly" });
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await waitIceGathering(pc);
  const lname = MY_ID.toLowerCase();
  await fetch("/save/pub-offer-" + lname + ".sdp", { method: "POST", body: pc.localDescription.sdp });
  const resp = await cf("POST", "sessions/" + SID + "/tracks/new", {
    sessionDescription: { type: "offer", sdp: pc.localDescription.sdp },
    tracks: [{ location: "local", mid: tx.mid, trackName: TRACK_NAME }]
  });
  await fetch("/save/pub-answer-" + lname + ".sdp", { method: "POST", body: resp.sessionDescription.sdp });
  await pc.setRemoteDescription(resp.sessionDescription);
  event("published", { trackName: TRACK_NAME, renego: !!resp.requiresImmediateRenegotiation });

  // wait for the PeerConnection to actually connect before pulling
  await new Promise((res, rej) => {
    if (pc.connectionState === "connected") return res();
    const t = setTimeout(() => rej(new Error("pc connect timeout")), 15000);
    pc.addEventListener("connectionstatechange", function h() {
      if (pc.connectionState === "connected") { clearTimeout(t); pc.removeEventListener("connectionstatechange", h); res(); }
    });
  });
  window.__state.phase = "publishing";
  log("pc connected, joining room");
  await fetch("/join", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ participantId: MY_ID, sessionId: SID, trackName: TRACK_NAME }) });
  window.__state.phase = "running";
  window.__state.t_running = performance.timeOrigin + performance.now();
  if (!IS_PUB) startRosterLoop();   // lightweight publishers pull NOTHING
  startStats();
}

// ---- roster poll + serialized pulls ----------------------------------------
// Pulls are chained: one renegotiation in flight at a time (setRemoteDescription
// during another pull's signaling would race the SDP state machine).
const pullState = new Map(); // pid -> {state, attempts}
let pullChain = Promise.resolve();

function startRosterLoop() {
  const tick = async () => {
    try {
      const r = await fetch("/roster");
      const { participants } = await r.json();
      window.__state.rosterCount = participants.length;
      for (const p of participants) {
        if (p.participantId === MY_ID) continue;
        const st = pullState.get(p.participantId);
        if (st && (st.state === "queued" || st.state === "pulling" || st.state === "done")) continue;
        if (st && st.attempts >= 5) continue;
        const attempts = st ? st.attempts : 0;
        pullState.set(p.participantId, { state: "queued", attempts });
        pullChain = pullChain.then(() => pullTrack(p)).catch(() => {});
      }
    } catch (e) { /* server hiccup — next poll */ }
  };
  tick();
  setInterval(tick, 2000);
}

async function pullTrack(p) {
  const pid = p.participantId;
  const st = pullState.get(pid);
  st.state = "pulling"; st.attempts++;
  try {
    const resp = await cf("POST", "sessions/" + SID + "/tracks/new", {
      tracks: [{ location: "remote", sessionId: p.sessionId, trackName: p.trackName }]
    });
    const tr = (resp.tracks || [])[0] || {};
    if (tr.errorCode) throw new Error("pull " + pid + ": " + tr.errorCode + " " + (tr.errorDescription || ""));
    if (!tr.mid) throw new Error("pull " + pid + ": no mid in response");
    midToPid.set(tr.mid, pid);       // BEFORE setRemoteDescription — ontrack fires during it
    if (resp.requiresImmediateRenegotiation) {
      await pc.setRemoteDescription(resp.sessionDescription);   // SFU's offer
      const ans = await pc.createAnswer();
      await pc.setLocalDescription(ans);
      await cf("PUT", "sessions/" + SID + "/renegotiate", {
        sessionDescription: { type: "answer", sdp: pc.localDescription.sdp }
      });
    }
    st.state = "done";
    window.__state.pulled++;
    event("pulled", { from: pid, mid: tr.mid, renego: !!resp.requiresImmediateRenegotiation });
    log("pulled " + pid + " (mid " + tr.mid + ")");
  } catch (e) {
    st.state = "failed";
    log("pull " + pid + " attempt " + st.attempts + " failed: " + e.message);
    event("pull-failed", { from: pid, attempt: st.attempts, error: String(e.message).slice(0, 300) });
    if (st.attempts >= 5) { window.__state.error = "pull " + pid + " gave up"; }
    throw e;
  }
}

// ---- getStats every 2 s ----------------------------------------------------
function startStats() {
  setInterval(async () => {
    try {
      const st = await pc.getStats();
      const row = { kind: "stats", who: MY_ID, role: MODE,
                    t: performance.timeOrigin + performance.now(),
                    vis: document.visibilityState, inbound: [] };
      st.forEach(s => {
        if (s.type === "outbound-rtp" && s.kind === "video") {
          row.framesEncoded = s.framesEncoded;
          row.framesSent = s.framesSent;
          row.fps = s.framesPerSecond;
          row.packetsSent = s.packetsSent;
          row.qualityLimitationReason = s.qualityLimitationReason;
          row.qualityLimitationDurations = s.qualityLimitationDurations;
          row.targetBitrate = s.targetBitrate;
          row.encoderImplementation = s.encoderImplementation;
          row.outWidth = s.frameWidth; row.outHeight = s.frameHeight;
        }
        if (s.type === "inbound-rtp" && s.kind === "video") {
          row.inbound.push({
            from: midToPid.get(s.mid) || s.mid,
            jitterBufferDelay: s.jitterBufferDelay,
            jitterBufferEmittedCount: s.jitterBufferEmittedCount,
            framesDecoded: s.framesDecoded,
            framesDropped: s.framesDropped,
            framesReceived: s.framesReceived,
            fps: s.framesPerSecond,
            freezeCount: s.freezeCount,
            totalFreezesDuration: s.totalFreezesDuration,
            packetsLost: s.packetsLost,
            nackCount: s.nackCount,
            pliCount: s.pliCount,
            frameWidth: s.frameWidth,
            frameHeight: s.frameHeight,
            decoderImplementation: s.decoderImplementation
          });
        }
        if (s.type === "candidate-pair" && s.state === "succeeded" && s.nominated) {
          row.rtt = s.currentRoundTripTime;
        }
      });
      window.__state.fps = row.fps;               // driver-visible health
      window.__state.framesSent = row.framesSent;
      window.__state.qlr = row.qualityLimitationReason;
      post(row);
    } catch (e) { /* ignore */ }
  }, IS_PUB ? 3000 : 2000);
}

publish().catch(e => {
  window.__state.phase = "failed";
  window.__state.error = String(e && e.stack || e);
  log("FATAL", window.__state.error);
  event("fatal", { error: String(e).slice(0, 500) });
});
</script>
</body>
</html>
