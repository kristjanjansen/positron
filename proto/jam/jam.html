<!doctype html>
<html>
<head><meta charset="utf-8"><title>jam — live MIDI duet</title>
<style>
  body { font: 13px/1.5 monospace; background: #0d0d11; color: #e8e8e8; margin: 0; padding: 18px; }
  h1 { font-size: 15px; margin: 0 0 4px; color: #7fd4ff; }
  #hud { white-space: pre; background: #16161d; border: 1px solid #2a2a35; padding: 10px 14px; margin: 10px 0; min-height: 120px; }
  #controls { margin: 8px 0; }
  select, button { font: inherit; background: #22222c; color: #eee; border: 1px solid #444; padding: 3px 8px; }
  #flash { display: flex; flex-direction: column; gap: 2px; }
  .note { padding: 1px 8px; }
  .note.local { color: #9fe89f; }
  .note.remote { color: #ffb86b; }
  .hint { color: #777; }
</style>
</head>
<body>
<h1>jam.html — live MIDI duet</h1>
<div class="hint">keys a s d f g h j k l ; = pentatonic · local monitor immediate · remote played on arrival with measured one-way latency</div>
<div id="controls">
  transport <select id="tsel"><option value="dc">DC-direct</option><option value="do">DO relay</option><option value="moq">MoQ d14</option></select>
  <button id="replayBtn">replay session</button>
</div>
<div id="hud">booting…</div>
<div id="flash"></div>
<script type="module" src="/moq/www/moq-jam.js"></script>
<script type="module">
import { makeJam } from '/jam-core.js';
const params = new URLSearchParams(location.search);
const transport = params.get('transport') || 'dc';
const sel = document.getElementById('tsel');
sel.value = transport;
sel.onchange = () => { params.set('transport', sel.value); location.search = params.toString(); };
const jam = makeJam({
  mode: 'live',
  transportName: transport,
  role: params.get('peer') || 'a',
  session: params.get('session') || 'local',
});
document.getElementById('replayBtn').onclick = () => jam.replay();
window.jam = jam;
window.jamStats = () => jam.stats();
window.jamLog = () => jam.log();
window.jamReplay = () => jam.replay();
window.jamAuto = (ms) => jam.autoPlay(ms);
await jam.start();
window.jamReady = true;
</script>
</body>
</html>
