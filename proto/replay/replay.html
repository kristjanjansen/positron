<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Without this a phone lays the page out at 980 CSS px and then scales it
     down: every number in the HUD becomes unreadable and the 854 px video box
     becomes a 340 px one. `viewport-fit=cover` lets the safe-area insets below
     do their job on a notched device. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>elektron VOD replay + cues</title>
<style>
:root{--bg:#0d0f12;--panel:#14171c;--edge:#242a33;--ink:#cfd6df;--dim:#6b7683;
      --vidmax:854px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}          /* iOS must not inflate our monospace */
body{background:var(--bg);color:var(--ink);font:13px/1.45 monospace;margin:0;
  padding:12px calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
  overflow-x:hidden}
#wrap{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
/* THE FIX THAT MATTERS: the box is fluid up to the desktop size it always had.
   At >= 880 px this is byte-identical to `width:854px`, so the measured gate
   (1300 x 620) sees exactly the layout it was calibrated on. */
#vidbox{position:relative;width:100%;max-width:var(--vidmax);min-width:0}
video{width:100%;max-width:var(--vidmax);aspect-ratio:16/9;height:auto;
  background:#000;display:block;border:1px solid var(--edge)}
/* the overlay is sized in cqw (a share of the VIDEO's own width), so a cue is
   the same fraction of the picture on a 390 px phone as on a 854 px desktop.
   It used to be 34 px absolute — a third of a phone screen. */
#vidbox{container-type:inline-size}
#overlay{position:absolute;left:0;right:0;bottom:8%;text-align:center;pointer-events:none;
  padding:0 4%}
#overlay .cue{display:inline-block;padding:clamp(4px,1cqw,8px) clamp(10px,3cqw,26px);
  border-radius:6px;font-size:clamp(17px,4cqw,34px);font-weight:700;line-height:1.15;
  max-width:100%;overflow-wrap:anywhere;
  background:rgba(0,0,0,.72);color:#e8b44a;border:2px solid #e8b44a}
#overlay .cue.catchup{color:#8a93a0;border-color:#4d5661}
#overlay .tag{display:block;font-size:clamp(9px,1.4cqw,11px);color:#8a93a0;margin-top:4px}
#side{width:400px;max-width:100%;min-width:0;flex:1 1 320px}
#hud,#cues{background:var(--panel);border:1px solid var(--edge);border-radius:4px;padding:10px;margin-bottom:10px;
  white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;color:var(--dim)}
#cues{max-height:42vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#cues .fired{color:#57c973}
#cues .catchup{color:#e8a44a}
#cues .pending{color:#4d5661}
h1{font-size:14px;margin:0 0 10px}
/* TAP TO START — the iOS affordance. It is `hidden` by default and is only
   ever revealed when vid.play() is REFUSED, so the headless gate (which runs
   with autoplay allowed) never sees it. A refused play used to leave a black
   rectangle and a HUD stuck on "loading": silent failure, the exact thing the
   phone is worst at explaining. */
#tapstart{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(6,8,11,.86);z-index:9;cursor:pointer;-webkit-tap-highlight-color:transparent}
#tapstart[data-on="1"]{display:flex}
#tapstart .btn{min-height:64px;min-width:200px;padding:0 26px;display:flex;align-items:center;
  justify-content:center;gap:10px;border:2px solid #e8b44a;border-radius:10px;color:#e8b44a;
  background:rgba(0,0,0,.55);font:600 16px/1.2 monospace;text-align:center}
#tapstart small{display:block;color:#8a93a0;font-weight:400;font-size:11px;margin-top:5px}
#sound{position:absolute;right:8px;top:8px;z-index:8;min-height:44px;min-width:44px;
  padding:0 12px;border-radius:8px;border:1px solid var(--edge);background:rgba(6,8,11,.72);
  color:var(--ink);font:12px monospace;display:none;touch-action:manipulation}
#sound[data-on="1"]{display:block}
</style>
</head>
<body>
<h1>elektron · synced VOD replay with cues</h1>
<div id="wrap">
  <div id="vidbox">
    <!-- playsinline is MANDATORY on iOS: without it the video is torn out into
         the system fullscreen player, which loses the overlay, the subtitle
         track styling and (because the element is no longer composited into
         the page) the burned-row decode this whole page is built on. -->
    <video id="vid" muted playsinline webkit-playsinline disablepictureinpicture></video>
    <div id="overlay"></div>
    <button id="sound" type="button" aria-label="turn sound on">🔇 sound</button>
    <div id="tapstart" role="button" tabindex="0" aria-label="tap to start playback">
      <div class="btn"><span>▶ tap to start<small id="tapwhy">this phone will not start video on its own</small></span></div>
    </div>
  </div>
  <div id="side"><div id="hud">booting…</div><div id="cues"></div></div>
</div>
<script type="module">
// ============================================================================
// VOD REPLAY WITH CUES — plain hls.js VOD playback + the TIMELINE LIBRARY
// (timeline/transport.mjs) as the cue engine.
//
// WAS: src/timed-messages.js (the live engine) handed a fake player whose
// `hls.playingDate` was T0 + video.currentTime*1000, polled every 100 ms, and
// destroyed+rebuilt from the whole cue log on every `seeked`.
// IS:  ONE deck from the library —
//        · position domain = ABSOLUTE WALL MS (a cue's `at` IS its position)
//        · the VIDEO ELEMENT IS THE CLOCK MASTER: the vector is slaved to
//          T0 + video.currentTime*1000 via transport.sync(), so the playhead
//          can never drift away from the picture; if the video stalls the
//          playhead stalls with it.
//        · kind `cue` — one adapter: actuate = the page's render path
//          (overlay / subtitle / metadata, unchanged), caps.catchUp='burst'
//          (a cue is a note, never silently dropped), reduce = the FIRED SET
//          ≤ t, assertState = the late-join/seek fold.
//      Seek is no longer a rebuild: the library reconciles statuses (behind →
//      passed, ahead → pending) and re-folds through reduce/assertState. The
//      lookahead lane commits a precise one-shot timer per cue on a WORKER
//      tick, so the 100 ms poll floor — and the hidden-tab 1 Hz clamp that
//      came with a main-thread setInterval — are both gone.
//
// Cloudflare Stream VOD manifests carry NO PROGRAM-DATE-TIME (measured), so a
// VOD has no wall clock of its own: T0 is the anchor that turns media time
// into wall time, and it is the only thing this page needs to be a replay.
//
// T0 anchor (three candidates, PRIMARY = content):
//   content — decoded from the burned wall-clock row in the VOD pixels:
//             T0 = median(decodedMs_i − mediaTime_i·1000) over the first N
//             presented frames. Self-calibrating: immune to publisher cold
//             start (RTMPS connect, keyframe wait, head trim).
//   stamp   — the publisher's own Date.now() at first-frame-sent (query param;
//             proto/archive's native T₀ path uses this: anchor=stamp&t0=…).
//   api     — Stream asset metadata `created` (driver-side cross-check).
//
// Fire semantics flag: fireDelayMs=0 (default) honors OPERATOR INTENT (fire at
// cue.at). Set fireDelayMs≈live p50 lateness to REPRODUCE THE LIVE EXPERIENCE
// (live viewers see "now" cues transit+poll late; replay would otherwise run
// ahead of the live burn — the measured asymmetry).
//
// URL contract (unchanged — the measurement scripts drive it):
//   src, room, token, remote, anchor, t0, startAt, pastWindow, fireDelayMs,
//   anchorN
// ============================================================================
import { createDeck } from "/timeline/transport.mjs";
import { mediaMaster } from "/timeline/media-master.mjs";

const q = new URLSearchParams(location.search);
const SRC        = q.get("src");
const REMOTE     = q.get("remote") || "https://elektron-rtc.kristjan-jansen.workers.dev";
const ROOM       = q.get("room") || "replay-test";
const TOKEN      = q.get("token") || "";
const T0_PARAM   = q.get("t0") ? parseFloat(q.get("t0")) : null;   // stamp anchor
const ANCHOR     = q.get("anchor") || "content";                    // content|stamp
const START_AT   = parseFloat(q.get("startAt") || "0");
const PAST_WIN   = parseInt(q.get("pastWindow") || "2000", 10);
const FIRE_DELAY = parseInt(q.get("fireDelayMs") || "0", 10);       // 0 = intent
const ANCHOR_N   = parseInt(q.get("anchorN") || "15", 10);

// burned-row geometry (contract with show.html; yc = y + h/2)
const NBLOCKS = 64;
const ROW_CLOCK = { x: 32, yc: 624, bw: 12, lo: 4, hi: 9 };
const ROW_CUE   = { x: 32, yc: 674, bw: 12, lo: 4, hi: 9 };

// Clock-master law (proven in proto/selfrec/replay-grid.html): the media
// element owns the clock; the library's vector is SLAVED to it.
const SYNC_TOL_MS = 10;    // ignore corrections smaller than this (frame noise)
const JUMP_MS     = 400;   // a discontinuity bigger than this is a SEEK, not a
                           // sync — syncing across it would leave every skipped
                           // cue `pending` and the lane would burst them all
                           // (exactly the bug found in replay-grid)

const S = window.__state = {
  phase: "boot", error: null,
  t0: { used: null, mode: null, content: null, stamp: T0_PARAM, spreadMs: null, estimates: [] },
  fires: [], missed: [], cueStates: {}, currentCue: null,
  rvfc: { samples: 0, validClock: 0, validCue: 0, last: null },
  liveBurns: {},           // seq -> first frame where the cue-row showed it
  engineEvents: [],        // lane lifecycle: start / seek / resync-jump
  levels: null, level: null, cuesLoaded: 0, ended: false,
  hostName: null, playheadWall: null, syncCorrections: [], stalls: 0,
  // which media path this device actually took, and what it costs — see
  // startHls() below. Reported so a phone never fails silently.
  media: null, mediaPath: null, degraded: [], gestureRequired: null,
  gestureUnlocked: false, muted: true,
};
const vid = document.getElementById("vid");
const hudEl = document.getElementById("hud");
const cuesEl = document.getElementById("cues");
const overlayEl = document.getElementById("overlay");

// ---- burned-row decoder (composite-viewer geometry, proven on p3b VOD) ------
const work = document.createElement("canvas");
work.width = 1280; work.height = 720;
const wctx = work.getContext("2d", { alpha: false, willReadFrequently: true });
function decodeAt(r) {
  const img = wctx.getImageData(r.x, r.yc, NBLOCKS * r.bw, 1).data;
  const levels = [];
  for (let i = 0; i < NBLOCKS; i++) {
    let s = 0, n = 0;
    for (let dx = r.lo; dx < r.hi; dx++) { s += img[(i * r.bw + dx) * 4 + 1]; n++; }
    levels.push(s / n);
  }
  const mn = Math.min(...levels), mx = Math.max(...levels);
  if (mx - mn < 60) return { ok: false, why: "low-contrast" };
  const thr = (mn + mx) / 2;
  const bits = levels.map(l => (l > thr ? 1 : 0));
  let ms = 0; for (let i = 0; i < 48; i++) ms = ms * 2 + bits[i];
  let last = 0; for (let i = 48; i < 56; i++) last = last * 2 + bits[i];
  let ck = 0; for (let i = 56; i < 64; i++) ck = ck * 2 + bits[i];
  const bytes = []; let v = ms;
  for (let i = 5; i >= 0; i--) { bytes[i] = v % 256; v = Math.floor(v / 256); }
  bytes.push(last);
  let expect = 0; for (const b of bytes) expect ^= b;
  if (expect !== ck) return { ok: false, why: "checksum" };
  return { ok: true, ms, last };
}
/** Decode BOTH rows from the currently displayed frame. */
function decodeNow() {
  if (vid.readyState < 2) return { ok: false, why: "no-frame" };
  wctx.drawImage(vid, 0, 0, 1280, 720);
  const clock = decodeAt(ROW_CLOCK);
  const cue = decodeAt(ROW_CUE);
  return { ok: clock.ok, clockMs: clock.ok ? clock.ms : null, clockPid: clock.ok ? clock.last : null,
           cueOk: cue.ok, cueSeq: cue.ok ? cue.last : null, cueFiredAt: cue.ok ? cue.ms : null };
}

// ---- cue log ----------------------------------------------------------------
async function loadCues() {
  const r = await fetch(`${REMOTE}/room/${ROOM}/cuelog?token=${encodeURIComponent(TOKEN)}`);
  if (!r.ok) throw new Error("cuelog fetch " + r.status);
  const j = await r.json();
  // The log may carry cancel records ({kind:'cancel', id}): a cancelled cue
  // must NOT fire in replay, and cancel rows themselves have no .cue.
  const cancelled = new Set(j.cues.filter(e => e.kind === "cancel").map(e => e.id));
  // Revision: same id sent twice — LAST record in the log wins (the log is
  // append-only and ordered; compaction is the producer's job).
  const byId = new Map();
  for (const e of j.cues) {
    if (!e.cue || cancelled.has(e.cue.id)) continue;
    byId.set(e.cue.id, { id: e.cue.id, at: e.cue.at, sentAt: e.cue.sentAt ?? null, data: e.cue.data });
  }
  // sender stamps only (at, sentAt travel verbatim; serverAt/doRecvTs untrusted)
  return [...byId.values()].sort((a, b) => a.at - b.at || (a.id > b.id ? 1 : -1));
}

// ---- hls VOD ----------------------------------------------------------------
// MEDIASOURCE, honestly. hls.js is Media Source Extensions and nothing else.
// An iPhone has NO classic `MediaSource` at any iOS version; 17.1+ added
// `ManagedMediaSource`, which is a different constructor with a different
// contract. So on an iPhone the branch below is not an edge case, it is THE
// case — and `reject("hls.js unsupported")` turned that into phase=failed and a
// black rectangle. Safari plays HLS natively, so the correct degradation is to
// hand the manifest straight to the element and SAY which path was taken.
// What is genuinely lost on that path is on the record in S.degraded:
//   · no rendition lock (hls.currentLevel) — the burned rows are calibrated at
//     720p, so a lower rendition decodes as low-contrast and the CONTENT anchor
//     cannot form. anchor=stamp still works; anchor=content will time out.
//   · a cross-origin native-HLS video TAINTS a canvas on Safari, so
//     getImageData() in decodeAt() throws — the burned-row cross-check is not
//     available on iOS at all, with or without a rendition lock.
function mediaCapabilities() {
  return {
    mse: typeof window.MediaSource !== "undefined",
    managedMse: typeof window.ManagedMediaSource !== "undefined",
    hlsjs: !!(window.Hls && window.Hls.isSupported()),
    nativeHls: !!(vid.canPlayType("application/vnd.apple.mpegurl") ||
                  vid.canPlayType("application/x-mpegURL")),
  };
}
function startNativeHls() {
  return new Promise((resolve, reject) => {
    S.mediaPath = "native-hls";
    S.degraded = ["no rendition lock (content anchor may not form — use anchor=stamp)",
                  "cross-origin video taints the canvas: burned-row decode unavailable"];
    vid.src = SRC;
    vid.addEventListener("loadedmetadata", () => resolve(null), { once: true });
    vid.addEventListener("error", () => reject(new Error("native hls load failed")), { once: true });
    setTimeout(() => (vid.readyState >= 1 ? resolve(null) : reject(new Error("native hls timeout"))), 20000);
  });
}
function startHls() {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js";
    s.onload = () => {
      const caps = S.media = mediaCapabilities();
      if (!caps.hlsjs) {
        if (caps.nativeHls) return startNativeHls().then(resolve, reject);
        return reject(new Error(
          `no HLS path on this device: MediaSource=${caps.mse} ManagedMediaSource=${caps.managedMse} nativeHLS=false`));
      }
      S.mediaPath = "hls.js";
      const hls = new Hls();                    // plain VOD: no live logic needed
      hls.on(Hls.Events.MANIFEST_PARSED, (_e, d) => {
        let best = 0;                            // lock the top rendition: the
        d.levels.forEach((lv, i) => {            // burned rows are read back at
          if ((lv.height || 0) >= (d.levels[best].height || 0)) best = i;  // 720p
        });
        hls.startLevel = best;
        hls.currentLevel = best;
        S.levels = d.levels.map(l => l.height);
        S.level = best;
        resolve(hls);
      });
      hls.on(Hls.Events.ERROR, (_e, d) => { if (d.fatal) { S.phase = "failed"; S.error = "hls:" + d.details; } });
      hls.loadSource(SRC);
      hls.attachMedia(vid);
    };
    s.onerror = () => {
      // the CDN being unreachable is not the same failure as MSE being absent,
      // and on a phone the first is common (captive portal, content blocker)
      S.media = mediaCapabilities();
      if (S.media.nativeHls) return startNativeHls().then(resolve, reject);
      reject(new Error("hls.js cdn load failed and no native HLS"));
    };
    document.head.appendChild(s);
  });
}

// ---- rVFC: continuous per-presented-frame decode ---------------------------
let anchorEstimates = [];
let busy = false, lastPresented = -1;
function onFrame(_now, meta) {
  vid.requestVideoFrameCallback(onFrame);
  if (busy) return;
  busy = true;
  try {
    if (meta.presentedFrames === lastPresented) return;
    lastPresented = meta.presentedFrames;
    const d = decodeNow();
    S.rvfc.samples++;
    if (d.ok) {
      S.rvfc.validClock++;
      S.rvfc.last = { clockMs: d.clockMs, mediaTime: meta.mediaTime, cueSeq: d.cueSeq,
                      cueFiredAt: d.cueFiredAt, presentedFrames: meta.presentedFrames };
      if (S.t0.content == null) {
        anchorEstimates.push(d.clockMs - meta.mediaTime * 1000);
        if (anchorEstimates.length >= ANCHOR_N) {
          const srt = [...anchorEstimates].sort((a, b) => a - b);
          S.t0.content = srt[Math.floor(srt.length / 2)];
          S.t0.spreadMs = Math.round(srt[srt.length - 1] - srt[0]);
          S.t0.estimates = anchorEstimates.map(e => Math.round(e));
        }
      }
      if (d.cueOk) {
        S.rvfc.validCue++;
        // first frame in which the live burn showed each cue seq = the live
        // firing as carried by the pixels (ground truth for cross-check 5c)
        if (!(d.cueSeq in S.liveBurns)) {
          S.liveBurns[d.cueSeq] = { firstSeenMediaTime: meta.mediaTime,
                                    firstSeenClockMs: d.clockMs, cueFiredAt: d.cueFiredAt };
        }
      }
    }
  } finally { busy = false; }
}
vid.requestVideoFrameCallback(onFrame);

// ---- render path (UNCHANGED semantics; the adapter's actuate calls this) ----
// Default = this page's overlay. The two renderers that used to live in
// src/timed-messages.js ride along, selected per cue by data.render:
//   'subtitle' — a native TextTrack cue (browser styling, iOS CC button)
//   'metadata' — a hidden metadata track cue (frame-accurate side effects)
// Both map the cue's wall-clock `at` onto the media timeline at delivery time,
// exactly as before; nothing is scheduled unless a cue asks for it.
let subTrack = null, metaTrack = null;
function subtitleTrack() {
  if (!subTrack) { subTrack = vid.addTextTrack("subtitles", "Subtitles", "en"); subTrack.mode = "showing"; }
  return subTrack;
}
function metadataTrack() {
  if (!metaTrack) { metaTrack = vid.addTextTrack("metadata", "events"); metaTrack.mode = "hidden"; }
  return metaTrack;
}
function renderCue(p) {
  const data = p.data || {};
  const how = data.render;
  const now = playheadWall();
  if (how === "subtitle" && data.text != null && now != null) {
    const start = vid.currentTime + (p.at - now) / 1000;
    const dur = ((data.until ?? p.at + 5000) - p.at) / 1000;
    try { subtitleTrack().addCue(new VTTCue(Math.max(0, start), Math.max(0.5, start + dur), data.text)); } catch {}
  } else if (how === "metadata" && now != null) {
    const start = Math.max(0, vid.currentTime + (p.at - now) / 1000);
    try {
      const vc = new VTTCue(start, start + 0.5, JSON.stringify(data ?? null));
      vc.onenter = () => window.__onMetaCue && window.__onMetaCue(p);
      metadataTrack().addCue(vc);
    } catch { window.__onMetaCue && window.__onMetaCue(p); }
  }
  renderOverlay();               // the page's own overlay, always
}

// ---- the cue lane: ONE adapter over the library -----------------------------
let deck = null, cues = [], T0 = null, firedIds = new Set();
const playheadWall = () => (deck ? deck.position() : (T0 == null ? null : T0 + vid.currentTime * 1000));

/** A cue fired for real (lookahead commit, tick-late, or burst catch-up). */
function deliver(p, rec) {
  const pos = playheadWall();
  const lateMs = pos - p.at;
  // Late-joiner policy, preserved verbatim from the old engine: a delivery more
  // than `pastWindow` behind the playhead is NOT animated — it is surfaced as
  // caught-up. (Under the library this only happens after a real stall, since
  // seek/late-join go through the fold below instead of firing at all.)
  if (lateMs > PAST_WIN) return markCaughtUp(p, lateMs, rec.origin);
  const d = decodeNow();                                    // frame on glass NOW
  S.cueStates[p.id] = "fired";
  S.currentCue = { id: p.id, kind: "fired", lateMs: Math.round(lateMs) };
  firedIds.add(p.id);
  S.fires.push({
    id: p.id, at: p.at, kind: "fired", lateMs: Math.round(lateMs * 10) / 10,
    currentTime: vid.currentTime, playheadWall: pos,
    decOk: d.ok, decClockMs: d.clockMs, decCueSeq: d.cueSeq, decCueFiredAt: d.cueFiredAt,
    t: Date.now(),
    // the LIBRARY's own drift number (intended instant vs actual), and where
    // the fire came from — commit timer, late tick, burst, or overdub
    driftMs: rec && rec.deltaMs === null ? null : +(rec ? rec.deltaMs : 0).toFixed(1),
    origin: rec ? rec.origin : null,
  });
  renderCue(p);
}
function markCaughtUp(p, lateMs, why) {
  S.cueStates[p.id] = "caught-up";
  S.currentCue = { id: p.id, kind: "caught-up", lateMs: Math.round(lateMs) };
  S.missed.push({ id: p.id, at: p.at, lateMs: Math.round(lateMs),
                  currentTime: vid.currentTime, t: Date.now(), why: why || "fold" });
  renderOverlay();
}

const cueAdapter = {
  caps: {
    kind: "cue", domain: "wall", unit: "ms", seekable: true, reducible: true,
    catchUp: "burst",            // a cue is a note: never silently dropped
  },
  actuate(p, rec) { deliver(p, rec); },
  /** the FIRED SET ≤ pos — the whole state a replayed cue lane has */
  reduce(payloads) { return new Set(payloads.map(p => p.id)); },
  /** seek / late join: everything behind the playhead is already-happened.
   *  It is shown (latest one on the overlay) and NEVER re-animated — the
   *  `onMissed` half of the old engine, now a pure fold. */
  assertState(set, info) {
    firedIds = set;
    let latest = null;
    for (const c of cues) {
      if (!set.has(c.id)) continue;
      latest = c;
      if (S.cueStates[c.id] === "fired") continue;
      if (S.cueStates[c.id] !== "caught-up") {
        S.missed.push({ id: c.id, at: c.at, lateMs: Math.round(info.pos - c.at),
                        currentTime: vid.currentTime, t: Date.now(), why: info.reason });
      }
      S.cueStates[c.id] = "caught-up";
    }
    S.currentCue = latest
      ? { id: latest.id, kind: S.cueStates[latest.id], lateMs: Math.round(info.pos - latest.at) }
      : null;
    renderOverlay();
  },
};

function buildDeck(reason) {
  const items = cues.map(c => ({
    at: c.at + FIRE_DELAY, kind: "cue", id: c.id,
    payload: { id: c.id, at: c.at + FIRE_DELAY, data: c.data },
  }));
  const durMs = Number.isFinite(vid.duration) ? vid.duration * 1000 : 0;
  const lastAt = items.length ? Math.max(...items.map(i => i.at)) : T0;
  deck = window.__deck = createDeck({
    items,
    // position domain = absolute wall ms; the seekable window is the VOD
    range: [T0, Math.max(T0 + durMs, lastAt + 10000)],
    adapters: { cue: cueAdapter },
    // tick host: the library default (WORKER) — the cue lane keeps its
    // deadlines in a backgrounded tab, which a 100 ms setInterval cannot.
  });
  S.hostName = deck.hostName;
  buildMaster();                    // the library's media-element master law
  S.engineEvents.push({ reason, t: Date.now(), mediaTime: vid.currentTime,
                        pending: deck.stats().counts.pending });
}

// ---- clock master: the video element drives the library ---------------------
// The vector is re-anchored to T0 + currentTime*1000 every frame. Consequences,
// all of them deliberate:
//   · a stalled/paused video stalls the playhead — cues cannot run ahead of the
//     picture (the failure mode a wall-clock playhead has by construction);
//   · a DISCONTINUITY (user seek, hls.js recovery jump, gap) is routed to
//     seek(), which reconciles statuses and re-folds, instead of sync(), which
//     would leave every skipped cue pending and burst them all at once.
// ADOPTED (v0.5): this block WAS hand-written here, and two sibling clients had
// their own copies of the same laws — one of which (proto/selfrec/replay-grid)
// had silently lost the jump/sync discrimination. It is now
// timeline/media-master.mjs, called once. `stallPolicy: "hold"` is this page's
// half of L3: there is exactly one video, so a stall must stall the playhead
// rather than release the role.
let mmaster = null;
function buildMaster() {
  if (mmaster) mmaster.dispose();            // never two timeupdate backstops
  mmaster = window.__mmaster = mediaMaster(deck, vid, {
    anchorMs: () => T0,
    toleranceMs: SYNC_TOL_MS, jumpMs: JUMP_MS, stallMs: 1000,
    stallPolicy: "hold", autoPlayPause: true, attachTimeupdate: true,   // L4 backstop
    onCorrection: (c) => {
      S.syncCorrections.push(c);
      if (S.syncCorrections.length > 500) S.syncCorrections.shift();
    },
    onEvent: (e) => {
      if (e.reason === "stall") S.stalls++;
      if (e.reason === "jump")
        S.engineEvents.push({ reason: "resync-jump", t: e.t, mediaTime: e.mediaTime, jumpMs: e.jumpMs });
    },
  });
}
function syncFromMaster() {
  if (!mmaster || T0 == null) return;
  mmaster.tick();
}
function syncLoop() {
  requestAnimationFrame(syncLoop);
  syncFromMaster();
  S.playheadWall = playheadWall();
}
// (the `timeupdate` hidden-tab backstop is L4 inside the helper — rAF dies in a
// hidden tab, `timeupdate` at ~4 Hz does not.)

window.__seekTo = (sec) => {
  // Seek: state is REBUILT BY FOLD, never patched. The library reconciles
  // statuses against the new playhead (behind -> passed, ahead -> pending) and
  // re-runs reduce/assertState, so backward seeks rewind for free and the cues
  // ahead become pending again and re-fire on the way up.
  S.cueStates = {}; S.currentCue = null;
  vid.currentTime = sec;
};
vid.addEventListener("seeked", () => {
  if (!deck || T0 == null) return;
  S.cueStates = {}; S.currentCue = null;
  lastMediaT = null;
  deck.seek(T0 + vid.currentTime * 1000);
  S.engineEvents.push({ reason: "seek@" + vid.currentTime.toFixed(2), t: Date.now(),
                        mediaTime: vid.currentTime, pending: deck.stats().counts.pending });
  renderOverlay();
});
vid.addEventListener("ended", () => { S.ended = true; if (deck) deck.pause(); });

// ---- UI ---------------------------------------------------------------------
function renderOverlay() {
  const c = S.currentCue;
  overlayEl.innerHTML = c
    ? `<span class="cue ${c.kind === "fired" ? "" : "catchup"}">${c.id}` +
      `<span class="tag">${c.kind === "fired" ? "FIRED · late " + c.lateMs + " ms" : "CAUGHT UP (not re-fired)"}</span></span>`
    : "";
  cuesEl.innerHTML = cues.map(c2 => {
    const st = S.cueStates[c2.id] || "pending";
    return `<div class="${st}">${c2.id} · at ${c2.at} · vodT ${T0 ? ((c2.at - T0) / 1000).toFixed(1) + "s" : "?"} · ${st}</div>`;
  }).join("");
}
setInterval(() => {
  const corr = S.syncCorrections;
  hudEl.textContent =
    `phase ${S.phase}  ct ${vid.currentTime.toFixed(2)}s  level ${S.level} of [${S.levels}]\n` +
    `T0 ${S.t0.mode}: ${S.t0.used ? Math.round(S.t0.used) : "…"}  (content ${S.t0.content ? Math.round(S.t0.content) : "…"}` +
    `${S.t0.stamp ? " · stamp " + S.t0.stamp + " · Δ " + (S.t0.content ? Math.round(S.t0.content - S.t0.stamp) + " ms" : "?") : ""})\n` +
    `anchor spread ${S.t0.spreadMs} ms over ${ANCHOR_N} frames\n` +
    `rvfc ${S.rvfc.samples} samples · clock ${S.rvfc.validClock} · cue ${S.rvfc.validCue}\n` +
    `fires ${S.fires.length} · caught-up ${S.missed.length} · fireDelay ${FIRE_DELAY} ms (${FIRE_DELAY ? "live-experience" : "intent"})\n` +
    `lane ${S.hostName || "…"} tick · master=video · sync ${corr.length}` +
    (corr.length ? ` (last ${corr[corr.length - 1]} ms)` : "") + ` · stalls ${S.stalls}\n` +
    (S.rvfc.last ? `frame clock ${S.rvfc.last.clockMs} cueSeq ${S.rvfc.last.cueSeq}\n` : "") +
    (S.mediaPath ? `media ${S.mediaPath}${S.media ? ` (MSE ${S.media.mse} · managed ${S.media.managedMse} · native ${S.media.nativeHls})` : ""}\n` : "") +
    (S.degraded.length ? `DEGRADED · ${S.degraded.join(" · ")}\n` : "") +
    (S.error ? `ERROR ${S.error}` : "");
}, 250);

// ---- iOS: the user-gesture unlock ------------------------------------------
// Two separate refusals, and conflating them is why a phone shows a black box:
//   1. AUTOPLAY AT ALL — Safari refuses play() outside a user gesture unless the
//      element is muted. We ship `muted`, so this usually succeeds; when it does
//      not (Low Power Mode, "Auto-Play: Never" in Settings) play() REJECTS, and
//      the only correct response is to ask, once, in a way a finger can answer.
//   2. AUDIO — a muted element can be unmuted only from inside a gesture. That
//      is a second, separate affordance and it is not the same button.
// Everything below is inert when play() resolves, which is the headless case,
// so `run-measure-archive.mjs` never sees any of it.
const tapEl = document.getElementById("tapstart");
const soundEl = document.getElementById("sound");

function showTapToStart(why) {
  S.phase = "needs-gesture";
  S.gestureRequired = why || "play() refused";
  document.getElementById("tapwhy").textContent =
    "this phone will not start video on its own · " + S.gestureRequired;
  tapEl.dataset.on = "1";
  return new Promise((resolve) => {
    const go = async () => {
      try { await vid.play(); tapEl.dataset.on = "0"; S.gestureUnlocked = true; resolve(true); }
      catch (e) { document.getElementById("tapwhy").textContent = "still refused: " + (e && e.name); }
    };
    tapEl.addEventListener("click", go);
    tapEl.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") go(); });
  });
}

async function startPlayback() {
  try { await vid.play(); }
  catch (e) { await showTapToStart(String((e && e.name) || e)); }
  // sound is a SECOND gesture and is offered only once video is running: an
  // unmute outside a gesture is refused silently on iOS, so it must be a button
  // and never an automatic call.
  soundEl.dataset.on = "1";
  soundEl.onclick = () => {
    vid.muted = !vid.muted;
    if (!vid.muted) { vid.volume = 1; vid.play().catch(() => { vid.muted = true; }); }
    soundEl.textContent = vid.muted ? "🔇 sound" : "🔊 sound";
    soundEl.setAttribute("aria-label", vid.muted ? "turn sound on" : "turn sound off");
    S.muted = vid.muted;
  };
}

// ---- boot -------------------------------------------------------------------
(async () => {
  try {
    if (!SRC) throw new Error("src param required");
    S.phase = "loading";
    cues = await loadCues();
    S.cuesLoaded = cues.length;
    await startHls();
    if (START_AT > 0) vid.currentTime = START_AT;
    await startPlayback();
    S.phase = "anchoring";
    // wait for the content anchor (or use the stamp directly)
    const tA = performance.now();
    while (ANCHOR !== "stamp" && S.t0.content == null) {
      if (performance.now() - tA > 20000) throw new Error("no content anchor in 20 s (rows undecodable?)");
      await new Promise(r => setTimeout(r, 50));
    }
    if (ANCHOR === "stamp") {
      if (T0_PARAM == null) throw new Error("anchor=stamp needs t0 param");
      T0 = T0_PARAM; S.t0.mode = "stamp";
    } else {
      T0 = S.t0.content; S.t0.mode = "content";
    }
    S.t0.used = T0;
    buildDeck("start");
    // the FIRST fold: whatever is already behind the playhead (a late join) is
    // caught up here, before the lane is ever allowed to fire.
    deck.seek(T0 + vid.currentTime * 1000);
    deck.play();
    syncLoop();
    S.phase = "running";
    renderOverlay();
  } catch (e) {
    S.phase = "failed"; S.error = String(e.message || e);
  }
})();

// diagnostics for the measurement drivers
window.__deckStats = () => (deck ? {
  stats: deck.stats(), audit: deck.audit(), driftStats: deck.sched.driftStats(),
  drift: deck.drift(), caps: deck.caps(), host: deck.hostName,
  rate: deck.rate(), targetRate: deck.targetRate(), range: deck.range,
  syncCorrections: S.syncCorrections.slice(-50), stalls: S.stalls,
  mediaMaster: mmaster ? mmaster.stats() : null,
} : null);
</script>
</body>
</html>
